<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Six configuration surfaces</title><desc id="desc">Execution mode, agent defaults, type and lane protocols, workflow policy, project footprint and reporting. Each feature has its own scope; configuration does not grant authority.</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-107 | ai:codex --><rect width="760" height="480" fill="#e9e5da"/><text x="28" y="40" font-family="sans-serif" font-size="22" fill="#172116">Your team. Your operating model.</text><rect x="28" y="68" width="338" height="98" fill="#f4f1e9" stroke="#b6b9ab"/><text x="44" y="98" font-family="sans-serif" font-size="19" fill="#913b17">Execution mode</text><text x="44" y="130" font-family="sans-serif" font-size="14" fill="#344331">Choose human involvement</text><rect x="393" y="68" width="338" height="98" fill="#f4f1e9" stroke="#b6b9ab"/><text x="409" y="98" font-family="sans-serif" font-size="19" fill="#913b17">Agent defaults</text><text x="409" y="130" font-family="sans-serif" font-size="14" fill="#344331">Choose vendor and launch settings</text><rect x="28" y="186" width="338" height="98" fill="#f4f1e9" stroke="#b6b9ab"/><text x="44" y="216" font-family="sans-serif" font-size="19" fill="#913b17">Type and lane protocols</text><text x="44" y="248" font-family="sans-serif" font-size="14" fill="#344331">Shape how work is performed</text><rect x="393" y="186" width="338" height="98" fill="#f4f1e9" stroke="#b6b9ab"/><text x="409" y="216" font-family="sans-serif" font-size="19" fill="#913b17">Workflow policy</text><text x="409" y="248" font-family="sans-serif" font-size="14" fill="#344331">Inspect delivery checks</text><rect x="28" y="304" width="338" height="98" fill="#f4f1e9" stroke="#b6b9ab"/><text x="44" y="334" font-family="sans-serif" font-size="19" fill="#913b17">Project footprint</text><text x="44" y="366" font-family="sans-serif" font-size="14" fill="#344331">Choose adoption depth</text><rect x="393" y="304" width="338" height="98" fill="#f4f1e9" stroke="#b6b9ab"/><text x="409" y="334" font-family="sans-serif" font-size="19" fill="#913b17">Reporting</text><text x="409" y="366" font-family="sans-serif" font-size="14" fill="#344331">Choose useful views</text><text x="28" y="457" font-family="sans-serif" font-size="16" fill="#172116">Feature-specific scopes · Separate authority checks</text></svg>