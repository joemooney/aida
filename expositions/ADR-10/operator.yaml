spec_id: ADR-10
audience: operator
title: 'ADR-7 enforcement: autonomy mode becomes a uniform first-class typed engine parameter (--zen no longer an env-only side-channel)'
summary: 'Requirement ADR-10 specifies: ADR-7 enforcement: autonomy mode becomes a uniform first-class typed engine parameter (--zen no longer an env-only side-channel)'
rationale: |-
  ADR-7's clause "autonomy mode parameterizes the PAUSES uniformly across all
  three" is only half-realized. --no-human (headless) is a first-class typed
  engine parameter: NoHumanMode carried as a RealPhaseDriver field + EscalateMode
  on orchestrate(). But --zen (supervised) is threaded as an env-var side-channel
  (AIDA_ZEN) set at kickoff and re-read in scattered in-process spots (kickoff
  dispatch, provenance token, drain-state stamping) rather than a typed parameter
  on the engine. The asymmetry is the structural gap behind ADR-7's autonomy
  clause.
