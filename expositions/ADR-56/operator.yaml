spec_id: ADR-56
audience: operator
title: 'Remote evaluator resilience contract: failure taxonomy, deadlines, circuit breaker, and telemetry'
summary: |-
  CONTEXT & MOTIVATION:
  AIDA integrates remote evaluator backends (such as TypeSafe AI's Jev HTTP API, local LLM endpoints, and future evaluators) into its quality-gating substrate (ADR-55). Currently, JevEvaluator relies on a single raw HTTP POST request with a flat 15s timeout. While PRIN-5 ensures that failures fail closed, transient network glitches cause unnecessary fallback to expensive conversational reviewers. Conversely, retrying without operation budgets risks blowing past caller deadlines or duplicating billable evaluations.
rationale: |-
  AIDA integrates remote evaluator backends (such as TypeSafe AI's Jev HTTP API, local LLM endpoints, and future evaluators) into its quality-gating substrate (ADR-55). Currently, JevEvaluator relies on a single raw HTTP POST request with a flat 15s timeout. While PRIN-5 ensures that failures fail closed, transient network glitches cause unnecessary fallback to expensive conversational reviewers. Conversely, retrying without operation budgets risks blowing past caller deadlines or duplicating billable evaluations.

  DECISIONS:
  1. Define a reusable remote evaluator resilience contract decoupled from backend-specific logic.
  2. Failure Taxonomy & Typed Classification: Classify errors via structured HTTP status codes and transport errors. Transient: transport resets, DNS flaps, HTTP 429, HTTP 502/503/504. Permanent: HTTP 400, 401, 403, 404, malformed schemas.
  3. Deadline-Aware Budgeting: Every evaluator invocation carries an operation deadline. Retries are only attempted if remaining deadline budget allows (>= 500ms remaining).
  4. Idempotency & Duplicate Charge Protection: Retries enforce idempotency headers/keys where supported, avoiding duplicate charges.
  5. Circuit Breaker: Endpoint/model-scoped, concurrency-safe (Closed -> Open -> Half-Open). Trips fast fallback without blocking health probes on the critical path.
  6. Structured Observability: Emit structured events for retry attempts, circuit state changes, and fallback triggers (never silent drops).
key_constraints:
- Implement as specified in canonical requirement body.
