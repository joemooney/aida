name: Cross-platform (nightly)

# TASK-257: Windows + macOS validation runs HERE — on a nightly cron and on
# manual dispatch — not on every PR. PR CI (ci.yml) is Linux-only to hold the
# cycle time at ~3-5 min during the alpha. Both triggers below run against the
# default branch (`main`), so a cross-platform regression is caught within
# ~24h of landing rather than blocking every PR merge.
#
# Refresh on demand (e.g. before a release):
#   gh workflow run cross-platform.yml
#
# scripts/pre-release-check.sh gates release tagging on a recent green run
# here — see scripts/release.sh and CLAUDE.md.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc is required by tonic-build (aida-server's gRPC build script).
      # See BUG-66. Installed via OS package managers instead of
      # arduino/setup-protoc — that action still runs on Node.js 20
      # (deprecated) and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build all packages
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

  # TASK-687: the nightly matrix was red 3 days unnoticed before a release gate
  # forced the issue. PR CI is Linux-only (TASK-257), so cross-platform debt
  # accrues invisibly between releases. Make failure LOUD: open (or comment on)
  # a single tracking issue when the *scheduled* run fails, and close it when a
  # scheduled run goes green again. Scoped to `schedule` so the manual dispatches
  # fired during a release fix-forward loop don't spam issues. trace:TASK-687
  notify-failure:
    name: Open tracking issue on nightly failure
    needs: build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the cross-platform-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="cross-platform-red"
          gh label create "$label" --color B60205 \
            --description "Nightly Windows/macOS CI is failing" 2>/dev/null || true
          existing=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')
          line="Nightly cross-platform run failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$line"
          else
            printf '%s\n\n%s\n\n%s\n' \
              "$line" \
              "The Windows/macOS matrix is failing on the nightly cron. PR CI is Linux-only (TASK-257), so cross-platform regressions only surface here. Fix-forward until green; this issue auto-comments on each subsequent nightly failure and closes itself once a scheduled run lands green." \
              "trace:TASK-687" \
              | gh issue create --title "Nightly cross-platform CI is red" --label "$label" --body-file -
          fi

  notify-recovery:
    name: Close tracking issue on nightly recovery
    needs: build
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open cross-platform-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="cross-platform-red"
          for n in $(gh issue list --state open --label "$label" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Cross-platform CI is green again: $RUN_URL"
          done
