name: Cross-platform (manual)

# ADR-72: AIDA is Linux-only. Windows and macOS are unsupported platforms,
# with no CI and no fix work. This workflow is kept ONLY so a future operator
# reversal is cheap: it has no schedule and no pull_request trigger, never runs
# automatically, gates nothing, and releases do not require it. Do not re-add
# automatic triggers without a new explicit operator decision superseding
# ADR-72. The weekly Linux-only jobs that used to live here moved to
# weekly-linux.yml. trace:TASK-1723 | ai:claude
#
# Manual run (informational only): gh workflow run cross-platform.yml --ref main

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse misleading manual feature-branch validation before matrix work.
  # trace:TASK-1588 | ai:codex
  validate-main:
    name: Validate main dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main manual dispatch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Cross-platform manual validation requires --ref main (received $GITHUB_REF)"
            exit 1
          fi

  build:
    needs: validate-main
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # protoc is required by tonic-build (aida-server's gRPC build script).
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build all packages
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace --no-fail-fast
