# trace:TASK-1573 | ai:antigravity:high | impl:2026-10-03 | by:joe
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: CI (${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Keep this explicit: implementer_preflight.rs validates this contract
        # before executing CI-derived guards. trace:BUG-1420 | ai:codex
        shell: bash --noprofile --norc -e -o pipefail {0}
    # BUG-611: a flaky hang in the test step used to run to GitHub's 6h default,
    # blocking the single runner (and every PR queued behind it) for hours. Fail
    # fast instead — a normal run is ~7 min. trace:BUG-611 | ai:claude
    # 2026-10-14: green runs now take 17-25 min, so a 25-min cap was cancelling
    # healthy builds (e.g. #2541 at 25m18s). 40 keeps the hang guard with headroom.
    timeout-minutes: 40
    # Gates and contracts build the workspace binary first, so their test
    # scripts skip `cargo build -p aida-cli`, whose different feature set
    # recompiled the CLI for 1-2 min per lane. trace:TASK-1979 | ai:claude
    env:
      AIDA_CI_PREBUILT_CLI: ${{ (matrix.shard == 'gates' || matrix.shard == 'contracts') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # ADR-72: AIDA is Linux-only; Windows and macOS have no CI. Do not
        # add platforms here without a new operator decision superseding it.
        # trace:TASK-1723 | ai:claude
        os: [ubuntu-latest]
        # trace:TASK-1949 | ai:codex
        # lib-0/lib-1 split aida-cli-lib's unit tests by module. trace:TASK-1979 | ai:claude
        shard: [lib-0, lib-1, cli-0, cli-1, rest, gates, contracts]

    steps:
      - uses: actions/checkout@v5

      # TASK-1217: keep the required Build job green for doc-only PRs/pushes
      # while short-circuiting the expensive Rust/tooling suite. The filter is
      # inverted: any non-doc/non-metadata path (including workflows, Cargo
      # files, lockfiles, and Rust sources) opts back into full CI.
      # trace:TASK-1217 | ai:codex
      - name: Detect full-CI changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            full_ci:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'

      - name: CI docs-only short-circuit
        if: steps.changes.outputs.full_ci != 'true'
        run: echo "Docs-only change detected; skipping build, test, fmt, clippy, and trace gates."

      # TASK-1447: the toolchain install/pin/cache steps below now run
      # unconditionally (not gated on full_ci) because a docs-only PR still
      # needs a `target/debug/aida` binary for the CLI-manual and monitor-
      # contract drift guards further down (see "Minimal aida-cli build for
      # docs-only guards"). Installing/pinning the toolchain is cheap
      # (seconds, no compilation), so this costs docs-only PRs little.
      # trace:TASK-1447 | ai:claude
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          mkdir -p target
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc + libxcb/gtk deps for tonic-build (aida-server's gRPC build
      # script — BUG-66) and the desktop crates. Installed directly via apt
      # because arduino/setup-protoc still ships on Node.js 20 (deprecated)
      # and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install Linux dependencies
        if: steps.changes.outputs.full_ci == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev bubblewrap ripgrep

      # The shell-wrapper tests run every case under bash AND zsh when zsh is
      # on PATH (`wrapper_shells()`); without it the zsh leg silently skips.
      # trace:BUG-1960 | ai:claude
      - name: Install zsh (shell-wrapper test matrix)
        if: steps.changes.outputs.full_ci == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y zsh
          zsh --version

      # The test lanes compile test binaries and dev-deps that gates never
      # builds, so each lane group (lib, cli, rest) saves its own cache;
      # gates and contracts keep the shared one. The suffix goes on
      # shared-key: rust-cache ignores `key` when shared-key is set.
      # trace:TASK-1979 | ai:claude
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-dev-profile${{ (startsWith(matrix.shard, 'lib-') && '-lib') || (startsWith(matrix.shard, 'cli-') && '-cli') || (matrix.shard == 'rest' && '-rest') || '' }}
          save-if: ${{ matrix.shard != 'contracts' }}

      # Check the feature-disabled stubs separately: a workspace build can
      # unify the TUI feature back in and hide errors in those branches.
      # Check-only keeps this guard in the fast tier. trace:TASK-1601 | ai:codex
      - name: Check aida-cli without default features
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: cargo check -p aida-cli --no-default-features

      - name: Build all packages
        if: ${{ (matrix.shard == 'gates' || matrix.shard == 'contracts') && (steps.changes.outputs.full_ci == 'true') }}
        # TASK-1204: compile the PR drain path once in the dev profile. The
        # MCP stdio and bwrap gates already exercise dev-profile artifacts, and
        # the later binary gates below now use target/debug too.
        # trace:TASK-1204 | ai:codex
        run: cargo build --workspace

      - name: TUI seam guard
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash scripts/check-tui-seam.sh

      # The committed protobuf mirrors are build-script OUTPUT that is checked
      # in. When they drift, every worktree build leaves an unrelated dirty
      # file. trace:TASK-1567 | ai:claude
      - name: Generated protobuf mirror drift guard
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash scripts/check-generated-proto.sh

      # The lib shard's BUG-1745/BUG-1749 unit tests spawn target/debug/aida,
      # which `cargo test -p aida-cli-lib --lib` does not build. Build only that
      # bin, in the same dev profile and cache as the tests.
      # trace:TASK-1949 | ai:claude
      - name: Build aida binary for lib unit tests
        if: ${{ startsWith(matrix.shard, 'lib-') && (steps.changes.outputs.full_ci == 'true') }}
        run: cargo build -p aida-cli --bin aida

      # Pinned action commit (v2.87.22) and nextest version: a prebuilt
      # binary, no `cargo install`. trace:TASK-1957 | ai:claude
      - name: Install cargo-nextest
        if: ${{ matrix.shard != 'gates' && matrix.shard != 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146

      # Marker enumeration makes the external-prose inventory a generated,
      # reviewable contract rather than a best-effort audit. trace:TASK-1300
      - name: Run tests
        if: ${{ matrix.shard != 'gates' && matrix.shard != 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        # cargo-nextest runs each lane's selection (.config/nextest.toml `ci`
        # profile: no fail-fast, no retries, the serial test-group, a per-test
        # hang guard); doctests stay on cargo test. The shadow period showed
        # the same tests, by name, as cargo test on every lane.
        # trace:TASK-1988 | ai:claude
        # AIDA_REQUIRE_ZSH: zsh is installed above, so the BUG-2005 leak proof
        # must run its zsh leg rather than skip. trace:TASK-1363 | ai:claude
        # The tee'd log feeds the totals and the doctest timings below
        # (pipefail keeps the runner's exit status). trace:STORY-1853 | ai:claude
        env:
          AIDA_REQUIRE_ZSH: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python3 scripts/ci-test-shards.py --runner nextest --shard "${{ matrix.shard }}" < /dev/null 2>&1 | tee target/test-run.log

      # trace:TASK-1949 | ai:codex
      - name: Test shard root hygiene
        if: ${{ !cancelled() && matrix.shard != 'gates' && matrix.shard != 'contracts' && steps.changes.outputs.full_ci == 'true' }}
        run: python3 scripts/ci-test-shards.py --check-root

      # Per-test timings (job summary + artifact) and the slow-test budget,
      # from nextest's JUnit reports (doctests from the log): a test over
      # 10 s needs an entry in scripts/test-time-budget.toml, and a budgeted
      # test may not exceed it. Runs after a red test step too, so a failing
      # run still reports its timings and totals. trace:STORY-1853 | ai:claude
      # trace:TASK-1988 | ai:claude
      - name: Test time budget
        if: ${{ matrix.shard != 'gates' && matrix.shard != 'contracts' && (!cancelled() && steps.changes.outputs.full_ci == 'true' && runner.os == 'Linux') }}
        run: |
          python3 scripts/ci-test-shards.py --totals target/test-run.log --summary "$GITHUB_STEP_SUMMARY"
          python3 scripts/test-timings.py target/test-run.log --junit target/nextest/ci/junit-*.xml \
            --budget scripts/test-time-budget.toml \
            --json target/test-timings.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test timings
        if: ${{ matrix.shard != 'gates' && matrix.shard != 'contracts' && (!cancelled() && steps.changes.outputs.full_ci == 'true' && runner.os == 'Linux') }}
        uses: actions/upload-artifact@v5
        with:
          name: test-timings-${{ matrix.shard }}
          path: |
            target/test-timings.json
            target/test-run.log
            target/nextest/ci/junit-*.xml
          if-no-files-found: warn

      # Keep the live-smoke workflow's perimeter-auth contract testable without
      # exposing credentials in ordinary PR CI. trace:TASK-1425 trace:ADR-54 | ai:codex
      - name: GitLab live-smoke workflow guard
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_gitlab_live_access_workflow.sh

      # BUG-1526: this step runs AFTER the test suite deliberately. It used to sit
      # at position 12 of 26, and `bash -e` aborts the job on failure — so a stale
      # generated markdown file skipped `Run tests` and twelve later guards, and the
      # reviewer saw a red Build that said nothing about the code. Eleven open PRs
      # were in that state at once. A doc-freshness check must not be able to
      # suppress the test signal; failing here costs a re-run, not the whole suite.
      # trace:BUG-1526 | ai:claude
      #
      # BUG-1578: this guard cross-checks Rust `// external-prose-classifier:`
      # markers against docs/architecture/external-tool-output-classifiers.md
      # (a doc-only file). Gating it on full_ci meant a docs-only PR that
      # corrupted that doc got a green required Build with no verifier run.
      # It needs no build artifacts (pure-Python static analysis over checked
      # out sources), so it runs unconditionally — cheap even when full_ci is
      # false — while the expensive build/test steps above stay skipped.
      # trace:BUG-1578 | ai:claude
      - name: External-prose classifier inventory
        if: matrix.shard == 'gates'
        run: |
          python3 scripts/external-prose-classifiers.py --check
          python3 -m unittest tests/test_external_prose_classifiers.py

      # `make test-touched` planner: pure Python, no git or cargo, so fast.
      # trace:TASK-1780 | ai:claude
      - name: test-touched planner tests
        if: matrix.shard == 'gates'
        run: python3 -m unittest tests/test_test_touched.py

      # Host adapter fixtures use fake AIDA/Codex executables and temporary repos.
      # trace:TASK-2347 | ai:codex
      - name: Codex mail wake fixtures
        if: matrix.shard == 'gates'
        run: python3 -m unittest tests/test_codex_mail_wake.py

      # Test-timing parser, budget gate and local test-profile reshape: pure
      # Python, no cargo. trace:STORY-1853 | ai:claude
      - name: STORY-1853 test-speed tooling tests
        if: matrix.shard == 'gates'
        run: python3 -m unittest tests/test_story_1853_test_speed.py tests/test_ci_test_shards.py

      # STORY-612: the LIVE OS-wrap confinement gate. The `os_wrap` bwrap wrapper
      # is a security boundary, so a real bubblewrap run must prove write-inside-OK
      # / write-outside-blocked — not just unit-test the flag shape. The ephemeral
      # runner is a throwaway VM, so we explicitly enable unprivileged userns (the
      # Ubuntu AppArmor restriction would otherwise block bwrap) and force the live
      # arm with AIDA_REQUIRE_BWRAP_LIVE=1, which FAILS the job rather than
      # degrading to the fail-closed branch. This is the gate the PR's merge is
      # blocked on. trace:STORY-612 | ai:claude
      # BUG-2169 S2: the same gate runs the contained seat-clone attacks
      # (`bug_2169_bwrap_`): each must succeed against the frozen PR #2694
      # layout and fail against the clone layout, and a skip fails here.
      # trace:BUG-2169 | ai:claude
      # TASK-2053 S3: the seat-clone probe/destroy lifecycle (`task_2053_bwrap_`,
      # including T7: seat-planted hooks never run on the host) joins the gate.
      # trace:TASK-2053 | ai:claude
      # TASK-2161: a passing filter run is not proof each test ran, so the step
      # requires one `... ok` line per `bug_2169_bwrap_`/`task_2053_bwrap_` test
      # in the source and no bwrap skip; other skips (e.g. git too old for
      # reftable) are listed. trace:TASK-2161 | ai:claude
      # BUG-1934: the real-namespace seat-grant presenter (`bug_1934_bwrap_`,
      # an aida-cli integration test driving the built binary) joins the gate
      # and the same count, so its key-inheritance evidence is never a silent
      # skip. trace:BUG-1934 | ai:claude
      - name: Live bwrap OS-wrap confinement gate
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true' && runner.os == 'Linux') }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          log="$RUNNER_TEMP/live-bwrap.log"
          set -o pipefail
          AIDA_REQUIRE_BWRAP_LIVE=1 cargo test -p aida-cli-lib --lib -- --nocapture \
            bwrap_write_confinement_live_or_fail_closed bug_2169_bwrap_ task_2053_bwrap_ 2>&1 | tee "$log"
          AIDA_REQUIRE_BWRAP_LIVE=1 cargo test -p aida-cli --test bug_1934_bwrap_presenter -- --nocapture \
            bug_1934_bwrap_ 2>&1 | tee -a "$log"
          expected=$(grep -rhoE 'fn (bug_2169|task_2053|bug_1934)_bwrap_[a-z0-9_]+' aida-cli-lib/src aida-cli/tests/bug_1934_bwrap_presenter.rs | sort -u | wc -l)
          ran=$(grep -oE '(bug_2169|task_2053|bug_1934)_bwrap_[a-z0-9_]+ \.\.\. ok$' "$log" | sort -u | wc -l)
          echo "live bwrap tests: $ran of $expected ran ok"
          grep -n 'SKIP (' "$log" || true
          if grep -q 'SKIP (bwrap unavailable)' "$log"; then echo "::error::a live bwrap test skipped under the gate"; exit 1; fi
          if [ "$ran" -ne "$expected" ]; then echo "::error::only $ran of $expected live bwrap tests ran ok"; exit 1; fi

      # MCP stdio compatibility suite — black-box tests against `aida mcp-serve`.
      # Runs the FULL roundtrip: descriptors + CLI->MCP read direction
      # (post-TASK-440 outputSchema closure) AND the MCP-write -> CLI-read +
      # coordination-tool round trips. The write-roundtrip stages were staged
      # behind a gate while BUG-310 (MCP writes reporting success without
      # persisting) was in flight; BUG-310 has since shipped (Completed), so the
      # gate is flipped and the full suite runs by default.
      # trace:TASK-451 | ai:claude
      # trace:TASK-453 | ai:claude
      # Runs in gates: contracts was the next-longest lane once lib split.
      # trace:TASK-1979 | ai:claude
      - name: Run MCP stdio compatibility tests
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_mcp_stdio.sh

      # trace:STORY-1477 | ai:codex
      - name: Run history template CLI/config/MCP contract tests
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_history_templates.sh

      # trace:BUG-1801 | ai:codex
      - name: Run single-spec show latency regression
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: python3 tests/test_show_latency.py --aida target/debug/aida

      # Doc-vs-MCP consistency gate — every tool + argument documented in
      # docs/agents/cross-agent-onboarding.md must appear in `tools/list`.
      # trace:TASK-452 | ai:claude
      - name: Run MCP doc-consistency test
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_mcp_doc_consistency.sh

      # BUG-1693: the merge-hold gate is the server-side half of the
      # integrity floor, so its fixtures must run against the shipped
      # workflow/template rather than a copy of the logic. Build-free (it
      # extracts and executes the YAML `run:` blocks), so it is not gated on
      # full_ci — a docs-only PR can still touch the gate's prose.
      # trace:BUG-1693 | ai:claude
      - name: Run merge-hold gate fixtures
        if: matrix.shard == 'gates'
        run: bash tests/test_merge_hold_gate.sh

      # STORY-670: advisor-code-guard PreToolUse hook decision matrix.
      - name: Run advisor-code-guard hook test
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_advisor_code_guard.sh

      # BUG-1751: portable JSON parsing in the git guardrails PreToolUse hook.
      - name: Run git-guardrails parse test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_git_guardrails_parse.sh

      # STORY-1854: warn-only cargo time-budget PreToolUse hook patterns.
      # Shell only, so it runs on every PR. trace:STORY-1854 | ai:claude
      - name: Run cargo-timeout hook test
        if: matrix.shard == 'gates'
        run: bash tests/test_cargo_timeout_guard.sh

      # TASK-1721: scripts/release.sh publishes through a release PR and never
      # pushes main. The fixture drives it end to end against a local bare
      # remote that rejects pushes to main, with fake gh/cargo, plus the
      # existing release-script regressions. Shell only, so it runs on every PR.
      # trace:TASK-1721 | ai:claude
      - name: Run release PR-flow fixtures
        if: matrix.shard == 'gates'
        run: |
          bash tests/test_release_pr_flow.sh
          bash tests/test_release_prepare_only.sh
          bash tests/test_release_skip_ai_warnings.sh

      # trace:STORY-1648 | ai:claude
      # Primary-checkout drift line in the session-context hook: clean,
      # tracked-dirty, untracked-only, off-main, behind-origin, linked
      # worktree, and the timing cost budget. Stub `aida`; no build.
      - name: Run session-context drift test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_session_context_drift.sh

      # trace:BUG-1924 | ai:claude
      # SessionStart banners derive the shown role from the validated seat
      # grant: a role label without a grant reads "(no grant)", a granted
      # seat reads as before. Stub `aida`; no build.
      - name: Run session role grant banner test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_session_role_grant.sh

      # trace:BUG-1688 | ai:claude
      # The five shipped scripts with no legitimate unattended caller
      # must refuse a direct full-access vendor launch. The fixture puts
      # recording shims on the vendor hooks and asserts the recorder is never
      # invoked, so this is the only thing that proves the refusal still holds
      # after an edit to those scripts. Gated on full_ci because the fixture's
      # route audit uses ripgrep, which only the full_ci dependency step
      # installs; a docs-only PR cannot change a shell script's behaviour.
      - name: Run shipped full-access launch refusal fixtures
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_bug_1688_shipped_launch_refusals.sh

      # BUG-1796: exercise both skipped pull legs through the real CLI in a
      # fresh project with no origin remote. trace:BUG-1796 | ai:codex
      - name: Run no-origin pull warning fixture
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_bug_1796_no_origin_pull_warnings.sh

      - name: Run normal two-remote pull byte identical fixture
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_bug_1796_normal_two_remote_pull_byte_identical.sh

      # STORY-684: vendor-agnostic advisor-no-code-write gate at the commit
      # boundary (the substrate counterpart to the Claude-only hook above).
      - name: Run advisor-code-gate substrate test
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_advisor_code_gate.sh

      # TASK-144: pre-commit ///-provenance gate must excuse PURE MOVES
      # (line deleted elsewhere in the same staged diff) while still refusing
      # genuinely new /// trace debt.
      - name: Run pre-commit provenance move-detection test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_precommit_provenance_move.sh

      # BUG-1925: the provenance gate stays fast on a ~250k-line staged move and
      # checks only the conflict-resolution delta of a merge commit.
      - name: Run pre-commit provenance perf and merge-delta test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_precommit_provenance_perf.sh

      # BUG-1933: the provenance gate fails closed: a crashed or truncated awk
      # scan, or a merge parent whose diff fails, refuses the commit.
      - name: Run pre-commit provenance fail-closed tests
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: |
          bash tests/test_precommit_provenance_awk_failure.sh
          bash tests/test_precommit_provenance_parent_diff_failure.sh

      # STORY-1647: the opt-in primary-checkout gate refuses commits on main in
      # the primary checkout and exempts merges, rebases, .aida-store, worktrees.
      - name: Run pre-commit primary-checkout gate test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_precommit_primary_checkout.sh

      # BUG-1762: the agent-skill-hook installer behind the build prerequisite
      # must install idempotently, never clobber a foreign hook, and skip
      # (quietly in --best-effort mode) from linked worktrees and non-repos.
      - name: Run agent-skill-hook installer fixtures
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_install_agent_skill_hooks.sh

      # BUG-608 / BUG-610 / STORY-674: distributed + sibling-store multi-repo
      # integration (true sibling, refuse-not-wipe, --attach join, collision-free).
      - name: Run distributed / sibling-store integration tests
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_distributed.sh

      # BUG-1640: real-~/.aida guard self-test (volatile role churn passes,
      # planted role leaks fail) against a throwaway "real" HOME.
      # trace:BUG-1640 | ai:claude
      - name: Run ~/.aida home-guard self-test
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: bash tests/test_isolated_home_guard.sh

      # STORY-498: CI spec-id validity gate (MVP slice of EPIC-34). Walk the
      # commits this PR adds, resolve every `(SPEC-ID)` subject trailer against
      # the live requirement graph, and FAIL the PR when a trailer references a
      # nonexistent or rejected spec — a dead/dangling provenance link. This is
      # the server-side, non-bypassable half: a `git commit --no-verify`'d local
      # commit that dodges the message-grammar hook is still caught here. The
      # store lives on the orphan `aida-store` branch; fetch it into a remote
      # tracking ref and sync/attach `.aida-store` from there so the binary can
      # build the read cache without colliding with an attached worktree.
      # Mechanical/release
      # commits with no trailer are exempt by the existing audited rule.
      # trace:STORY-498 | ai:claude
      - name: Validate commit SPEC-ID references (trace gate)
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true' && github.event_name == 'pull_request') }}
