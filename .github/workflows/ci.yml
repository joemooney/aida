  # Preserve the branch-protection check while every lane runs independently.
  # always() is essential: a failed or cancelled lane must make this check red.
  # trace:TASK-1949 | ai:codex
  build-result:
    name: Build (ubuntu-latest)
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  # Create release artifacts for tags
  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-result
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aida-linux-x86_64
            cli_binary: aida
            gui_binary: aida-desktop
          # ADR-72: Linux artifacts only; no Windows or macOS release legs.
          # trace:TASK-1723 | ai:claude

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc is required by tonic-build (aida-server's gRPC build script).
      # See BUG-66. Installed via OS package managers instead of
      # arduino/setup-protoc — that action still runs on Node.js 20
      # (deprecated) and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release-profile

      - name: Build release
        run: cargo build --workspace --release

      - name: Package artifacts (Unix)
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp target/release/${{ matrix.cli_binary }} ${{ matrix.artifact }}/
          cp target/release/${{ matrix.gui_binary }} ${{ matrix.artifact }}/
          cp README.md ${{ matrix.artifact }}/ || true
          tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact (Unix)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
