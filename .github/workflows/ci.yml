      # BUG-1950: docs/cli/12-glossary.md is GENERATED from `aida docs
      # glossary` (ADR-5), but nothing compared the committed page with the
      # generator, so it drifted for a month. Re-render it with the binary just
      # built from this tree and fail on any difference. NOT gated on full_ci:
      # the "Minimal aida-cli build" step above covers target/debug/aida on
      # docs-only PRs, and a docs-only PR is exactly where a hand edit lands.
      # trace:BUG-1950 | ai:claude
      - name: Book glossary drift guard
        if: matrix.shard == 'contracts'
        run: |
          AIDA_BIN="$PWD/target/debug/aida" bash docs/cli/generate-glossary.sh --check

      # No-build slice of the guard above: fixture tests for `--check`, plus a
      # stub-binary comparison of the committed page with the template
      # masters. trace:BUG-1950 | ai:claude
      - name: Book glossary generator tests (stub binary, no build)
        if: matrix.shard == 'gates'
        run: bash tests/test_generate_glossary_check.sh

      - name: Performance profile guard
        if: matrix.shard == 'gates'
        run: ./tests/test_performance_profile_opt_level.sh
        shell: bash

      - name: Check formatting
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check aida-cli-lib/src/lib_part*.rs

      - name: Removed mode-flag spelling guard
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true') }}
        # trace:BUG-1665 | ai:claude
        run: |
          bash scripts/check-removed-flags.sh
          bash tests/test_check_removed_flags.sh

      # TASK-1205: portability ratchet for Linux-only assumptions in test code.
      # Existing sites live in scripts/portability-allowlist.txt. The growth
      # verifier is loaded from the trusted base revision so comparison-only
      # edits cannot bypass it. trace:TASK-1205 BUG-1301 | ai:codex
      - name: Check Rust test portability ratchet
        if: matrix.shard == 'gates'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            BASE_CHECK="$(mktemp)"
            BASE_ALLOWLIST="$(mktemp)"
            BASE_RULES="$(mktemp)"
            trap 'rm -f "$BASE_CHECK" "$BASE_ALLOWLIST" "$BASE_RULES"' EXIT
            if git show "$BASE:scripts/check-portability-growth.py" >"$BASE_CHECK" 2>/dev/null; then
              git show "$BASE:scripts/portability-allowlist.txt" >"$BASE_ALLOWLIST"
              git show "$BASE:scripts/portability-rules.json" >"$BASE_RULES"
              python3 "$BASE_CHECK" "$BASE_ALLOWLIST" "$BASE_RULES" \
                scripts/portability-allowlist.txt scripts/portability-rules.json
            else
              scripts/check-portability.sh --check-allowlist-growth "$BASE"
            fi
            scripts/check-portability.sh
          else
            scripts/check-portability.sh
          fi

      # STORY-1382: positive/negative fixtures for the production-scoped
      # prose-classification ratchet rule. trace:STORY-1382 | ai:claude
      - name: Prose-classification rule fixtures
        if: matrix.shard == 'gates'
        run: python3 -m unittest tests/test_prose_classification_rule.py

      # BUG-1689: test fake_gh fixtures must use the ETXTBSY-safe shared writer.
      - name: Executable fixture ratchet
        if: matrix.shard == 'gates'
        run: python3 -m unittest tests/test_executable_fixture_ratchet.py

      # BUG-2191: test fixtures run write-class git through the test_git
      # helper (no detached auto-maintenance); unguarded sites only go down.
      # trace:BUG-2191 | ai:claude
      - name: Test git auto-maintenance ratchet
        if: matrix.shard == 'gates'
        run: python3 -m unittest tests/test_git_maintenance_ratchet.py

      - name: Verify pure-move slice stack fixtures
        if: matrix.shard == 'gates'
        run: python3 -m unittest discover scripts/split-lib/tests/

      # BUG-2135: sccache tmpdir detection, restart hint, and pre-start fixtures. trace:BUG-2135 | ai:antigravity
      - name: Sccache tmpdir detection fixtures
        if: matrix.shard == 'gates'
