            git -C .aida-store reset --hard origin/aida-store
          elif [ -e .aida-store ]; then
            echo "::error::.aida-store exists but is not an attached git worktree"
            exit 1
          else
            git worktree add .aida-store refs/remotes/origin/aida-store
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          ./target/debug/aida trace gate --range "${BASE}..HEAD"

      # STORY-499: diff-level trace-COVERAGE check (EPIC-34 gap #1). Distinct
      # from the validity gate above: `gate` checks the `(SPEC-ID)` trailers
      # resolve live; `coverage` checks the changed CODE in the diff actually
      # carries the required `// trace:` provenance (inline anchor OR a live
      # commit trailer), per the SPIKE-47 deterministic definition + exemption
      # list (tests / generated / docs / config / vendored / pure-deletion /
      # fmt-only / trivial). Shipped REPORT-ONLY first (SPIKE-47 §5/§6: a
      # coverage gate's failure mode is adoption death — run report-only for a
      # calibration period to mine missed exemptions, then flip to `--block`).
      # No `--block` here, so this step annotates the coverage ratio + any
      # uncovered hunks but never fails the PR. trace:STORY-499 | ai:claude
      - name: Report diff trace coverage (report-only)
        if: ${{ matrix.shard == 'gates' && (steps.changes.outputs.full_ci == 'true' && github.event_name == 'pull_request') }}
        run: |
          BASE="origin/${{ github.base_ref }}"
          ./target/debug/aida trace coverage --range "${BASE}..HEAD" || true

      # STORY-603: doc-intent gate (substrate-as-bouncer). When a PR's diff
      # touches the CLI command/flag surface (aida-cli/src/cli.rs) OR the
      # agent-facing skill/command set, at least one spec the diff references
      # must mark doc-impact — non-empty `interface_changes` (STORY-542) OR a
      # `docs:impacted` tag. This stops "blind surface edits" where the surface
      # moves but no spec captures the WHY the documenter needs. The store lives
      # on the orphan `aida-store` branch; sync/attach it from the remote-tracking
      # ref before checking doc intent.
      #
      # TASK-1447: NOT gated on full_ci. It needs no built binary — the
      # script reads spec metadata straight off the `aida-store` orphan
      # branch via `git archive` (see its own module docstring: "no `aida`
      # binary or attached worktree required") — and a docs-only PR can
      # still touch the skill/command surface dirs above, so it must run
      # there too. trace:STORY-603 trace:TASK-1447 | ai:claude
      - name: Doc-intent gate (surface changes mark doc-impact)
        if: ${{ matrix.shard == 'gates' && (github.event_name == 'pull_request') }}
        run: |
          git fetch --no-tags origin aida-store:refs/remotes/origin/aida-store
          # trace:TASK-1206 | ai:codex
          if [ "$(git -C .aida-store rev-parse --show-toplevel 2>/dev/null)" = "$PWD/.aida-store" ]; then
            # trace:BUG-1785 | ai:codex
            git -C .aida-store reset --hard origin/aida-store
          elif [ -e .aida-store ]; then
            echo "::error::.aida-store exists but is not an attached git worktree"
            exit 1
          else
            git worktree add .aida-store refs/remotes/origin/aida-store
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          # trace:BUG-1238 | ai:codex
          python3 -m unittest tests/test_verify_interface_changes.py
          python3 docs/cli/verify-interface-changes.py "${BASE}" HEAD

      # STORY-597: CLI-manual drift-guard (substrate-as-bouncer). Asserts every
      # command the live binary exposes (`aida help-all`) has a `### `aida <cmd>``
      # rationale entry in some docs/cli/*.md chapter — a new command can't merge
      # without a manual entry. Also hard-fails on SPEC-ID leakage into the
      # user-facing manual, on a surface-changing spec whose declared
      # `interface_changes` delta is absent from the docs, and on cited `--flag`
      # tokens that do not resolve against the cited command or its parent/child
      # command subtree. The binary is already built above; put the dev-profile
      # dir on PATH so the verifier's `aida ... --help` shell-outs resolve to it.
      # The orphan `aida-store` branch (fetched by the gates above) backs the
      # reflection check; it SKIPs non-failing when the store can't resolve.
      # trace:STORY-597
      #
      # TASK-1447: NOT gated on full_ci. This guard shells out to the built
      # `aida` binary (`aida help-all`, `aida --help`), which a docs-only PR
      # never built above — so the "Minimal aida-cli build" step just below
      # covers that path, keeping this guard live on docs-only PRs too.
      # trace:TASK-1447 | ai:claude
      - name: Minimal aida-cli build for docs-only guards
        if: ${{ matrix.shard == 'contracts' && (steps.changes.outputs.full_ci != 'true') }}
