name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # BUG-611: a flaky hang in the test step used to run to GitHub's 6h default,
    # blocking the single runner (and every PR queued behind it) for hours. Fail
    # fast instead — a normal run is ~7 min. trace:BUG-611 | ai:claude
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # TASK-257: PR CI is Linux-only during the alpha to keep cycle time
        # at ~3-5 min. Windows + macOS validation moved to the nightly
        # .github/workflows/cross-platform.yml workflow. Job names still
        # parameterize on ${{ matrix.os }}, so re-adding platforms here is a
        # one-line revert once there are non-Linux users.
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc + libxcb/gtk deps for tonic-build (aida-server's gRPC build
      # script — BUG-66) and the desktop crates. Installed directly via apt
      # because arduino/setup-protoc still ships on Node.js 20 (deprecated)
      # and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev bubblewrap

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-dev-profile

      # TASK-1205: report cfg/std::os drift for the two non-Linux targets at PR
      # time while staying on the existing Linux runner. Today this is
      # report-only because third-party C build scripts (ring, sqlite) require
      # foreign SDKs before AIDA code is reached; the real path-filtered OS
      # matrix below remains the full-workspace guard. trace:TASK-1205 | ai:codex
      - name: Report cross-target cargo check (Windows/macOS on Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          start=$(date +%s)
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          cargo check --workspace --tests --target x86_64-pc-windows-msvc
          cargo check --workspace --tests --target aarch64-apple-darwin
          elapsed=$(( $(date +%s) - start ))
          echo "::notice::Cross-target cargo check completed in ${elapsed}s"

      - name: Build all packages
        # TASK-1204: compile the PR drain path once in the dev profile. The
        # MCP stdio and bwrap gates already exercise dev-profile artifacts, and
        # the later binary gates below now use target/debug too.
        # trace:TASK-1204 | ai:codex
        run: cargo build --workspace

      - name: Run tests
        # --no-fail-fast: one run reports every failing test binary across
        # crates, instead of stopping at the first (BUG-1021).
        run: cargo test --workspace --no-fail-fast

      # STORY-612: the LIVE OS-wrap confinement gate. The `os_wrap` bwrap wrapper
      # is a security boundary, so a real bubblewrap run must prove write-inside-OK
      # / write-outside-blocked — not just unit-test the flag shape. The ephemeral
      # runner is a throwaway VM, so we explicitly enable unprivileged userns (the
      # Ubuntu AppArmor restriction would otherwise block bwrap) and force the live
      # arm with AIDA_REQUIRE_BWRAP_LIVE=1, which FAILS the job rather than
      # degrading to the fail-closed branch. This is the gate the PR's merge is
      # blocked on. trace:STORY-612 | ai:claude
      - name: Live bwrap OS-wrap confinement gate
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          AIDA_REQUIRE_BWRAP_LIVE=1 cargo test -p aida-cli-lib --lib \
            bwrap_write_confinement_live_or_fail_closed -- --nocapture

      # MCP stdio compatibility suite — black-box tests against `aida mcp-serve`.
      # Runs the FULL roundtrip: descriptors + CLI->MCP read direction
      # (post-TASK-440 outputSchema closure) AND the MCP-write -> CLI-read +
      # coordination-tool round trips. The write-roundtrip stages were staged
      # behind a gate while BUG-310 (MCP writes reporting success without
      # persisting) was in flight; BUG-310 has since shipped (Completed), so the
      # gate is flipped and the full suite runs by default.
      # trace:TASK-451 | ai:claude
      # trace:TASK-453 | ai:claude
      - name: Run MCP stdio compatibility tests
        run: bash tests/test_mcp_stdio.sh

      # Doc-vs-MCP consistency gate — every tool + argument documented in
      # docs/agents/cross-agent-onboarding.md must appear in `tools/list`.
      # trace:TASK-452 | ai:claude
      - name: Run MCP doc-consistency test
        run: bash tests/test_mcp_doc_consistency.sh

      # STORY-670: advisor-code-guard PreToolUse hook decision matrix.
      - name: Run advisor-code-guard hook test
        run: bash tests/test_advisor_code_guard.sh

      # STORY-684: vendor-agnostic advisor-no-code-write gate at the commit
      # boundary (the substrate counterpart to the Claude-only hook above).
      - name: Run advisor-code-gate substrate test
        run: bash tests/test_advisor_code_gate.sh

      # TASK-144: pre-commit ///-provenance gate must excuse PURE MOVES
      # (line deleted elsewhere in the same staged diff) while still refusing
      # genuinely new /// trace debt.
      - name: Run pre-commit provenance move-detection test
        run: bash tests/test_precommit_provenance_move.sh

      # BUG-608 / BUG-610 / STORY-674: distributed + sibling-store multi-repo
      # integration (true sibling, refuse-not-wipe, --attach join, collision-free).
      - name: Run distributed / sibling-store integration tests
        run: bash tests/test_distributed.sh

      # STORY-498: CI spec-id validity gate (MVP slice of EPIC-34). Walk the
      # commits this PR adds, resolve every `(SPEC-ID)` subject trailer against
      # the live requirement graph, and FAIL the PR when a trailer references a
      # nonexistent or rejected spec — a dead/dangling provenance link. This is
      # the server-side, non-bypassable half: a `git commit --no-verify`'d local
      # commit that dodges the message-grammar hook is still caught here. The
      # store lives on the orphan `aida-store` branch; fetch it into a remote
      # tracking ref and sync/attach `.aida-store` from there so the binary can
      # build the read cache without colliding with an attached worktree.
      # Mechanical/release
      # commits with no trailer are exempt by the existing audited rule.
      # trace:STORY-498 | ai:claude
      - name: Validate commit SPEC-ID references (trace gate)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin aida-store:refs/remotes/origin/aida-store
          # trace:TASK-1206 | ai:codex
          if git -C .aida-store rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C .aida-store merge --ff-only origin/aida-store
          elif [ -e .aida-store ]; then
            echo "::error::.aida-store exists but is not an attached git worktree"
            exit 1
          else
            git worktree add .aida-store refs/remotes/origin/aida-store
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          ./target/debug/aida trace gate --range "${BASE}..HEAD"

      # STORY-499: diff-level trace-COVERAGE check (EPIC-34 gap #1). Distinct
      # from the validity gate above: `gate` checks the `(SPEC-ID)` trailers
      # resolve live; `coverage` checks the changed CODE in the diff actually
      # carries the required `// trace:` provenance (inline anchor OR a live
      # commit trailer), per the SPIKE-47 deterministic definition + exemption
      # list (tests / generated / docs / config / vendored / pure-deletion /
      # fmt-only / trivial). Shipped REPORT-ONLY first (SPIKE-47 §5/§6: a
      # coverage gate's failure mode is adoption death — run report-only for a
      # calibration period to mine missed exemptions, then flip to `--block`).
      # No `--block` here, so this step annotates the coverage ratio + any
      # uncovered hunks but never fails the PR. trace:STORY-499 | ai:claude
      - name: Report diff trace coverage (report-only)
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          ./target/debug/aida trace coverage --range "${BASE}..HEAD" || true

      # STORY-603: doc-intent gate (substrate-as-bouncer). When a PR's diff
      # touches the CLI command/flag surface (aida-cli/src/cli.rs) OR the
      # agent-facing skill/command set, at least one spec the diff references
      # must mark doc-impact — non-empty `interface_changes` (STORY-542) OR a
      # `docs:impacted` tag. This stops "blind surface edits" where the surface
      # moves but no spec captures the WHY the documenter needs. The store lives
      # on the orphan `aida-store` branch; sync/attach it from the remote-tracking
      # ref before checking doc intent. trace:STORY-603
      - name: Doc-intent gate (surface changes mark doc-impact)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin aida-store:refs/remotes/origin/aida-store
          # trace:TASK-1206 | ai:codex
          if git -C .aida-store rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C .aida-store merge --ff-only origin/aida-store
          elif [ -e .aida-store ]; then
            echo "::error::.aida-store exists but is not an attached git worktree"
            exit 1
          else
            git worktree add .aida-store refs/remotes/origin/aida-store
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          python3 docs/cli/verify-interface-changes.py "${BASE}" HEAD

      # STORY-597: CLI-manual drift-guard (substrate-as-bouncer). Asserts every
      # command the live binary exposes (`aida help-all`) has a `### `aida <cmd>``
      # rationale entry in some docs/cli/*.md chapter — a new command can't merge
      # without a manual entry. Also hard-fails on SPEC-ID leakage into the
      # user-facing manual and on a surface-changing spec whose declared
      # `interface_changes` delta is absent from the docs. Flag-accuracy mismatches
      # print as WARNs (subcommand flags are checked only against the parent
      # --help) and do NOT fail the build. The binary is already built above; put
      # the dev-profile dir on PATH so the verifier's `aida ... --help` shell-outs
      # resolve to it. The orphan `aida-store` branch (fetched by the gates above)
      # backs the reflection check; it SKIPs non-failing when the store can't
      # resolve. trace:STORY-597
      - name: CLI-manual drift-guard (every command documented)
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python3 docs/cli/verify-manual.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Removed mode-flag spelling guard
        run: bash scripts/check-removed-flags.sh

      # TASK-1205: portability ratchet for Linux-only assumptions in test code.
      # Existing sites live in scripts/portability-allowlist.txt; PRs may only
      # shrink that baseline after the bootstrap lands. trace:TASK-1205 | ai:codex
      - name: Check Rust test portability ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            scripts/check-portability.sh --check-allowlist-growth "$BASE"
          else
            scripts/check-portability.sh
          fi

      - name: Run clippy
        # Style/pedantic lints stay warnings; the deny-by-default CORRECTNESS
        # lints are denied so a real logic bug can't merge (BUG-473 slipped past
        # the old blanket -W). Full `-D warnings` was deferred: on a floating
        # @stable toolchain it breaks CI on every Rust release as new lints land
        # (clippy 1.96 surfaced 23+ lints beyond the cleanup with no code change).
        # Revisit only with a pinned toolchain. trace:TASK-709 trace:TASK-710
        run: cargo clippy --workspace -- -W clippy::all -D clippy::correctness

      # EPIC-45 / TASK-835: the glyph-literal forward-guard (substrate-as-bouncer).
      # Fails the PR when a NEW raw status/marker glyph literal is typed inline
      # outside the registry (aida-cli/src/glyphs.rs) and the explicit allow-list
      # in the script. Pre-existing long-tail literals are allow-listed (that list
      # IS the tracked back-migration inventory); --block catches only new ones,
      # so coverage ratchets up and cannot regress. trace:TASK-835 | ai:claude
      - name: Glyph-literal lint (block new raw glyphs)
        run: bash scripts/glyph-lint.sh --block

  # Create release artifacts for tags
  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aida-linux-x86_64
            cli_binary: aida
            gui_binary: aida-desktop
          - os: windows-latest
            artifact: aida-windows-x86_64
            cli_binary: aida.exe
            gui_binary: aida-desktop.exe
          - os: macos-latest
            artifact: aida-macos-x86_64
            cli_binary: aida
            gui_binary: aida-desktop

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc is required by tonic-build (aida-server's gRPC build script).
      # See BUG-66. Installed via OS package managers instead of
      # arduino/setup-protoc — that action still runs on Node.js 20
      # (deprecated) and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release-profile

      - name: Build release
        run: cargo build --workspace --release

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp target/release/${{ matrix.cli_binary }} ${{ matrix.artifact }}/
          cp target/release/${{ matrix.gui_binary }} ${{ matrix.artifact }}/
          cp README.md ${{ matrix.artifact }}/ || true
          tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir ${{ matrix.artifact }}
          cp target/release/${{ matrix.cli_binary }} ${{ matrix.artifact }}/
          cp target/release/${{ matrix.gui_binary }} ${{ matrix.artifact }}/
          cp README.md ${{ matrix.artifact }}/ 2>$null || echo "No README"
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
