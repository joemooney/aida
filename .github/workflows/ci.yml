name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TASK-257: PR CI is Linux-only during the alpha to keep cycle time
        # at ~3-5 min. Windows + macOS validation moved to the nightly
        # .github/workflows/cross-platform.yml workflow. Job names still
        # parameterize on ${{ matrix.os }}, so re-adding platforms here is a
        # one-line revert once there are non-Linux users.
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc + libxcb/gtk deps for tonic-build (aida-server's gRPC build
      # script — BUG-66) and the desktop crates. Installed directly via apt
      # because arduino/setup-protoc still ships on Node.js 20 (deprecated)
      # and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build all packages
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      # MCP stdio compatibility suite — black-box tests against `aida mcp-serve`.
      # Default invocation runs descriptor + CLI->MCP read direction only
      # (post-TASK-440 outputSchema closure). The MCP-write -> CLI-read stages
      # are gated behind `--require-mcp-write-roundtrip` while BUG-310 is in
      # flight; once BUG-310 ships, add that flag to flip the gate.
      # trace:TASK-451 | ai:claude
      - name: Run MCP stdio compatibility tests
        run: bash tests/test_mcp_stdio.sh

      # Doc-vs-MCP consistency gate — every tool + argument documented in
      # docs/agents/cross-agent-onboarding.md must appear in `tools/list`.
      # trace:TASK-452 | ai:claude
      - name: Run MCP doc-consistency test
        run: bash tests/test_mcp_doc_consistency.sh

      # STORY-498: CI spec-id validity gate (MVP slice of EPIC-34). Walk the
      # commits this PR adds, resolve every `(SPEC-ID)` subject trailer against
      # the live requirement graph, and FAIL the PR when a trailer references a
      # nonexistent or rejected spec — a dead/dangling provenance link. This is
      # the server-side, non-bypassable half: a `git commit --no-verify`'d local
      # commit that dodges the message-grammar hook is still caught here. The
      # store lives on the orphan `aida-store` branch; fetch it so the binary's
      # fresh-clone auto-attach can build the read cache. Mechanical/release
      # commits with no trailer are exempt by the existing audited rule.
      # trace:STORY-498 | ai:claude
      - name: Validate commit SPEC-ID references (trace gate)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin aida-store:aida-store || \
            echo "::warning::could not fetch aida-store branch — trace gate may not resolve ids"
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          ./target/release/aida trace gate --range "${BASE}..HEAD"

      # STORY-499: diff-level trace-COVERAGE check (EPIC-34 gap #1). Distinct
      # from the validity gate above: `gate` checks the `(SPEC-ID)` trailers
      # resolve live; `coverage` checks the changed CODE in the diff actually
      # carries the required `// trace:` provenance (inline anchor OR a live
      # commit trailer), per the SPIKE-47 deterministic definition + exemption
      # list (tests / generated / docs / config / vendored / pure-deletion /
      # fmt-only / trivial). Shipped REPORT-ONLY first (SPIKE-47 §5/§6: a
      # coverage gate's failure mode is adoption death — run report-only for a
      # calibration period to mine missed exemptions, then flip to `--block`).
      # No `--block` here, so this step annotates the coverage ratio + any
      # uncovered hunks but never fails the PR. trace:STORY-499 | ai:claude
      - name: Report diff trace coverage (report-only)
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          ./target/release/aida trace coverage --range "${BASE}..HEAD" || true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # Using -W instead of -D to allow warnings without failing the build
        # TODO: Fix clippy warnings and change back to -D warnings
        run: cargo clippy --workspace -- -W clippy::all

  # Create release artifacts for tags
  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aida-linux-x86_64
            cli_binary: aida
            gui_binary: aida-desktop
          - os: windows-latest
            artifact: aida-windows-x86_64
            cli_binary: aida.exe
            gui_binary: aida-desktop.exe
          - os: macos-latest
            artifact: aida-macos-x86_64
            cli_binary: aida
            gui_binary: aida-desktop

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # BUG-103: the macos-latest runner intermittently has a stale cache
      # where `cargo` resolves to `rustup-init`, breaking `cargo build`
      # with "unexpected argument 'build'". Re-pinning the default
      # toolchain regenerates the rustup proxy binaries; the grep guard
      # then fails the job fast + clearly if `cargo` is still wrong,
      # instead of a cryptic mid-build error. Runs on every OS (idempotent
      # elsewhere) via `shell: bash`, which GitHub provides on all
      # runners. trace:BUG-103 | ai:claude
      - name: Pin stable toolchain & verify cargo
        shell: bash
        run: |
          rustup default stable
          echo "cargo path: $(command -v cargo)"
          cargo --version
          cargo --version | grep -q '^cargo ' || {
            echo "::error::cargo did not resolve to the real cargo binary (stale rustup-init cache — BUG-103)"
            exit 1
          }

      # protoc is required by tonic-build (aida-server's gRPC build script).
      # See BUG-66. Installed via OS package managers instead of
      # arduino/setup-protoc — that action still runs on Node.js 20
      # (deprecated) and has no Node 24 release. trace:TASK-290 | ai:claude
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp target/release/${{ matrix.cli_binary }} ${{ matrix.artifact }}/
          cp target/release/${{ matrix.gui_binary }} ${{ matrix.artifact }}/
          cp README.md ${{ matrix.artifact }}/ || true
          tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir ${{ matrix.artifact }}
          cp target/release/${{ matrix.cli_binary }} ${{ matrix.artifact }}/
          cp target/release/${{ matrix.gui_binary }} ${{ matrix.artifact }}/
          cp README.md ${{ matrix.artifact }}/ 2>$null || echo "No README"
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
