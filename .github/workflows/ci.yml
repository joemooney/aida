      # trace:TASK-1447 | ai:claude
      - name: Trace/doc-header stranding gate
        if: matrix.shard == 'gates'
        run: |
          python3 scripts/check-trace-headers.py
          python3 -m unittest tests/test_check_trace_headers.py

      # TASK-1447: regression check for the docs-drift guards above. Parses
      # this file and asserts each known docs-drift guard step either has no
      # full_ci gate (so it schedules on docs-only PRs) or carries a
      # DOCS-GUARD-EXEMPT marker documenting why it can't. Pure static
      # analysis over ci.yml itself -- no build artifact needed, so it runs
      # unconditionally. trace:TASK-1447 | ai:claude
      - name: Docs-drift guards schedule on docs-only PRs
        if: matrix.shard == 'gates'
