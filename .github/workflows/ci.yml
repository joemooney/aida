          git fetch --no-tags origin aida-store:refs/remotes/origin/aida-store
          # trace:TASK-1206 | ai:codex
          if [ "$(git -C .aida-store rev-parse --show-toplevel 2>/dev/null)" = "$PWD/.aida-store" ]; then
