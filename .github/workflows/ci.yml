        # this needs neither protoc nor libgtk/libssl (no "Install Linux
        # dependencies" step) — building just the `aida` binary crate is far
        # cheaper than `cargo build --workspace` (server/tui/desktop stay
        # unbuilt). trace:TASK-1447 | ai:claude
        run: cargo build -p aida-cli

      - name: CLI-manual drift-guard (every command documented)
        if: matrix.shard == 'contracts'
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python3 docs/cli/verify-manual.py

      # No-build slice of the drift guard above: fails on a manual citation of
      # a flag that clap hides from --help, read from the Rust source, so the
      # pre-push tier catches it without a binary. trace:BUG-1937 | ai:claude
      - name: CLI-manual hidden-flag guard (static, no build)
        if: matrix.shard == 'gates'
        run: |
          python3 -m unittest tests/test_verify_manual.py
          python3 docs/cli/verify-manual.py --static

      # trace:STORY-1352 | ai:codex
      #
      # TASK-1447: NOT gated on full_ci — same "Minimal aida-cli build" step
      # above covers the target/debug/aida binary this guard's AIDA_BIN
      # default points at. trace:TASK-1447 | ai:claude
      - name: Monitor contract drift guard
        if: matrix.shard == 'contracts'
        run: |
          BASE="origin/${{ github.base_ref }}"
          python3 docs/monitor-contract-fixtures/verify.py "$BASE"

      # BUG-1922: every fenced `aida ...` line in a skill/command template must
      # name a real command and only flags its `--help` lists, so an invented
      # flag (`aida list --search`) fails here instead of at every skill run.
      # NOT gated on full_ci: the "Minimal aida-cli build" step above covers
      # the target/debug/aida binary on docs-only PRs. trace:BUG-1922 | ai:claude
      - name: Template command lint
        if: matrix.shard == 'contracts'
        run: |
          export AIDA_BIN="$PWD/target/debug/aida"
          python3 scripts/check-template-commands.py
          python3 -m unittest tests/test_check_template_commands.py

