name: merge-hold-gate

# BUG-1693: label state alone cannot release a previously held PR. The
# human-gated `aida merge-hold clear` path adds the clearance label after
# writing its local clearance record. The recorded label stays on the PR.
# This is a forge-side integrity check, not protection from an admin token
# running as the same user; see docs/cli/08-reporting.md.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-hold-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require recorded clearance for every previously held PR
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          has_label() {
            printf '%s' "$LABELS" | tr ',' '\n' | grep -Fqx "$1"
          }
          if has_label aida:merge-hold; then
            echo "::error::This PR has an active aida:merge-hold. Only the human-gated clearance path can release it."
            exit 1
          fi
          if has_label aida:merge-hold-recorded && ! has_label aida:merge-hold-cleared; then
            echo "::error::This PR was held previously but has no recorded clearance; removing aida:merge-hold alone does not release it."
            exit 1
          fi
          if has_label aida:merge-hold-cleared && ! has_label aida:merge-hold-recorded; then
            echo "::error::Clearance label has no matching recorded hold."
            exit 1
          fi
          echo "Merge-hold gate passes: no active hold, or a recorded clearance exists."
