name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: aida-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: aida-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: aida-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: aida-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install protobuf compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }} -p aida-cli -p aida-server

      - name: Package
        run: |
          # Stage both binaries under a per-target dir so the tarball
          # contains aida + aida-server at the top level (not renamed).
          # scripts/install.sh and `aida upgrade` look for these names.
          mkdir -p stage/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/aida        stage/${{ matrix.name }}/aida
          cp target/${{ matrix.target }}/release/aida-server stage/${{ matrix.name }}/aida-server
          chmod +x stage/${{ matrix.name }}/aida stage/${{ matrix.name }}/aida-server
          tar czf ${{ matrix.name }}.tar.gz -C stage/${{ matrix.name }} aida aida-server

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        # Multi-artifact mode (no `name:`, just `path:`) nests each artifact in
        # artifacts/<artifact-name>/, which the `files:` paths below depend on.
        # v5's only breaking change was single-artifact-BY-ID downloads; the
        # multi-artifact layout is unchanged from v4. Verified against v5.0.0
        # release notes + README, and empirically by the v0.9.1 and v0.11.0
        # release runs (post-v5-upgrade) which uploaded all four tarballs.
        # trace:TASK-425 | ai:claude
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/aida-linux-x86_64/aida-linux-x86_64.tar.gz
            artifacts/aida-linux-arm64/aida-linux-arm64.tar.gz
            artifacts/aida-darwin-x86_64/aida-darwin-x86_64.tar.gz
            artifacts/aida-darwin-arm64/aida-darwin-arm64.tar.gz
