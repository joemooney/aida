title: Scaffold status report with diffs in HTML format
description: |-
  Add --report option to scaffold status command that generates an HTML report showing:
  1. Summary of matching, modified, missing, extra files
  2. Unified diff view for modified files (expected vs actual)
  3. Syntax-highlighted diff with deletions in red, additions in green
  4. Collapsible sections for each file
  5. Option to output to file (--output) or stdout
