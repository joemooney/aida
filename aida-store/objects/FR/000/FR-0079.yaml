title: Restart Menu option
description: |+
  Restart option in the Menu. Here's what was added:

    Restart Feature (Menu → Restart)
    - Detects if running via cargo run by checking if the executable path contains /target/debug/ or /target/release/
    - If running via cargo: spawns cargo run --bin <binary-name> (with --release flag if it was a release build), which will trigger
    recompilation if source files changed
    - If running as a direct executable: restarts the same binary directly
    - Preserves any command-line arguments passed to the application
    - The application closes after spawning the new process

