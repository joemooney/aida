  note: '[rework] PR #1896 RequestChanges (drain reviewer, verified by the advisor against lib.rs:65757): collect_awaiting_report derives the MAIL scope from std::env AIDA_SESSION_ROLE and ignores ctx.role, so advisor_awaiting_line''s UserStatusContext{role: Some("advisor")} does not make advisor-addressed mail part of compact_line() when aida advisor watch is launched from a plain/operator/reviewer shell — a mail-arrived condition would not wake the heartbeat (acceptance: wake when aida awaiting is non-empty, mail included). Fix in the SAME PR (push fixups to the #1896 head branch): in collect_awaiting_report, resolve the mail-scope role as ctx.role first, falling back to AIDA_SESSION_ROLE only when ctx.role is None; add a test that a ctx role=advisor with an unread advisor-addressed message yields a non-empty compact_line() while the process env role is unset/operator. Keep the removal of the timer wake. Finish with aida queue done TASK-1245.'
