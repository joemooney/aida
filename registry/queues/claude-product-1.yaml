  note: 'Reviewer round 2 on PR #1957 (drain locks + claims done; session leases still PID-only): TASK-1284 requires session reap and aida ps to decide liveness from the lease''s PID plus process start time. SessionLease records only creator_pid/active_pid, and session_reap::reap_sessions plus lease_state_for/auto-release still call pid_is_alive without a recorded start identity; a recycled PID can therefore keep a dead session lease live. Add backward-compatible start identities for session lease PIDs, use process_identity_is_alive on these surfaces, and add a same-PID/different-start regression test.  Concretely: extend SessionLease with optional creator_pid_start / active_pid_start (process start identity, recorded at acquire; absent on legacy leases), and make session_reap::reap_sessions, lease_state_for and the auto-release path decide liveness via process_identity_is_alive when the identity is present, falling back to pid_is_alive only for legacy leases; tests for a recycled-pid lease reading dead and a legacy lease keeping today''s behaviour; keep the portability ratchet clean.'
