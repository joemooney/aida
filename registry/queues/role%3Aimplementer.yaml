  note: |-
    [rework round 4] PR #1913 — the security substance is now correct (advisor gate APPROVED r3 in .aida/review-verdicts/PR-1913-advisor-r3.json); the drain reviewer (PR-1913.json) requested two PARITY items the BUG-1197 acceptance asks for, and the advisor folds in a third so this is the last round. Fix all three in the SAME PR; add "(BUG-1211)" to the commit trailer alongside (BUG-1197) so both close on merge:
    1. Refusal-text parity: stakeholder_mcp_action_label defaults denied MCP tools to "writes" while the CLI stakeholder_action_label says "database writes" / other operation-specific labels for the equivalent command. Share ONE label function across transports (map MCP tool → the same StakeholderAction label the CLI uses: db_sync → "database writes", session_* → "session writes", role_* → "role writes", queue_* → "queue operations", add_relationship → "relationship writes", add_comment → "comment writes", update_requirement → "editing requirements", add_requirement → "adding requirements") so the refusal string is byte-identical on both surfaces for the same operation.
    2. A REAL parity test: the current stakeholder_mcp_policy_covers_every_descriptor_via_shared_actions compares the MCP decision to the shared action it was derived from (tautological). Add a table of (CLI argv, MCP tool) pairs — e.g. (["aida","db","sync"], "db_sync"), (["aida","session","start","--owns","X"], "session_start"), (["aida","role","enter","advisor"], "role_enter"), (["aida","queue","add","X"], "queue_add"), (["aida","edit","X","--title","y"], "update_requirement"), (["aida","list"], "list_requirements"), (["aida","mcp-serve"], none) — and for guest AND requester assert the allow/refuse decision matches and, when refused, the refusal text is identical.
    3. BUG-1211 (folded in): the CLI requester Add arm still accepts --parent / --feature / --owner, which link the Draft to an existing spec (a relationship write) — the exact hole r3 closed on MCP. Refuse them in the CLI arm with the same text ("setting parent, feature, or owner during intake"), share the field list as one const with mcp.rs constrain_requester_intake, and add the CLI test next to guest_refuses_db_sync (requester `aida add --type bug --parent X` refused; plain `aida add --type bug` still lands Draft + intake:requester).
    Finish with aida queue done BUG-1197.
