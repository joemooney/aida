    [rework ROUND 2 — items still open; the previous commit on PR #1924 is already on the branch and does NOT count. Produce a NEW commit addressing every item, or punt naming the one you dispute.]
    PR #1924 shelved ci-red. Two failing tests on Build (ubuntu-latest) plus two design gaps from the advisor gate read:
    1. resolve_aida_exe_tests::no_cli_source_outside_the_resolver_uses_raw_current_executable_lookup — handle_queue_rework's new escalation path calls std::env::current_exe() directly (queue_cmd.rs). Use crate::aida_exe_path() (the TASK-1262 resolver); no raw current_exe() anywhere outside the resolver module.
    2. queue_work_tests::prompt_implementer_item_leads_with_review_findings — it pinned the old shape (prompt starts with the findings text). The new ROUND-led lead is intended; update that test to assert the new contract (starts with "ROUND N — ITEMS STILL OPEN", contains the findings, ends with the pickup) rather than deleting it.
    3. The round number is hardcoded to 2 in derive_queue_work_prompt. Compute it: 1 + the number of prior [rework] comments (or recorded request-changes rounds) on the spec, so round 3/4 read truthfully in the prompt and in the rework-no-op message.
    4. rework_no_op_failure compares head SHAs. An implementer that only rebases (or amends) moves the SHA with no new work and slips past the guard — the BUG-1207 r4 shape. Make the predicate content-based: treat the round as a no-op when `git diff <before> <after>` is empty (tree-identical) OR when no commit after <before> is patch-unique versus the snapshot (git cherry / patch-id). Keep the SHA check as a fast path only.
    Finish with aida queue done BUG-1213.
