      - [ ] Same hook applies to direct \`aida queue work --for reviewer\` invocations, not just \`--auto-complete\`
      - [ ] Tests: simulated stale + overlap → orchestrator pauses; stale + no overlap → warning only; current → silent proceed
      - [ ] Integration test: full \`--auto-complete --no-human\` cycle that hits a stale-base block and surfaces actionable next steps

