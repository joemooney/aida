  lamport: 711
  timestamp: 2026-05-17T15:25:58.919336123Z
  kind: !SetDescription
    description: |-
      When \`aida queue work --auto-complete\` (or any path that queues a PR for headless review) runs against a PR whose base is behind main, the reviewer reads stale code. If parallel work has merged in the meantime — common during batch drains and overnight autonomous cycles — the review is **against the wrong version** of the codebase. Worse, file-level overlap with merged-in-the-interim work may introduce silent conflicts that pass GitHub's textual-mergeability check but break compilation or tests at merge time.

      This STORY is the **orchestrator pre-flight integration**. The underlying \`aida pr rebase <N>\` CLI is TASK-XXX (split out, ships independently).

      ## Concrete instance (2026-05-17 morning)

      - **PR-65 (STORY-278)** opened 07:28 UTC, base SHA = \`188dbee6\`
      - Overnight: **PR-66 (TASK-303)** merged at 07:56 UTC — touched \`aida-cli/src/session.rs\`
      - Overnight: **PR-67 (BUG-224)** merged at 15:01 UTC — touched a plan file
      - **PR-65 also touches \`aida-cli/src/session.rs\`** (+6/-0)
      - GitHub reports \`mergeable: UNKNOWN, mergeStateStatus: UNKNOWN\`
      - Queuing PR-65 for headless review without rebase = reviewer reads code 2 commits stale; \`session.rs\` overlap may surface as a conflict at merge time

      User flagged the concern:

      > "Before \`aida queue work PR-65 --for reviewer --no-human\` is there a rebase needed? Do we/should we check? There seems like parallel work on-going so that could cause an issue?"

      ## Proposed behavior

      When orchestrator enters phase 3 (or any explicit reviewer-queue-add for a PR), before launching headless reviewer:

      1. **Detect stale base** via \`aida pr rebase <N> --check\` (from TASK-XXX)
      2. **If current** (no stale base): proceed immediately to reviewer launch
      3. **If stale with no file overlap**: surface a warning, proceed — review-against-stale is suboptimal but safe
      4. **If stale with file overlap**: BLOCK reviewer launch and:
         - Print the \`aida pr rebase <N>\` invocation as the suggested fix
         - Exit with non-zero so the orchestrator pauses at phase 2/3 boundary
         - User runs \`aida pr rebase <N>\` manually, then retries \`aida queue work\`
         - Future improvement (sub-TASK): orchestrator auto-invokes \`aida pr rebase <N>\` if the conflicts are predicted clean — but only with user consent

      The orchestrator should NEVER silently auto-rebase + force-push without user knowledge — too easy to clobber concurrent work or break a PR the user is actively editing. **Block-and-instruct is the right default**; auto-invoke is a follow-up.

      ## CLI integration points

      \`aida queue work <PR-N> --for reviewer\` gains:
      - \`--allow-stale-base\` — opt out, proceed against stale base (with warning)
      - Default: refuse to launch reviewer if base is stale AND there's file overlap

