  kind: !SetDescription
    description: |-
      Today /aida-review --pr N scans all linked specs and produces a verdict even when the PR has already been merged. This happens most commonly when:

      1. A scheduled-wakeup fallback fires AFTER the PR was merged cleanly (today's 2026-05-13 zombie re-fire was the trigger)
      2. A user re-invokes the skill out of habit after merging via another route
      3. Auto-queued review-stories on already-merged PRs get picked up later by another session

      The skill should detect the merged state up front and early-exit with a clear log line, before doing any spec-walk work.

      ## Proposed early-check (~3 lines into skill body)

      At the top of the skill workflow:

      1. Run gh pr view (the PR number) with --json state --jq .state to extract state.
      2. If state equals MERGED, log a clear message that PR-N is already merged and exit 0.
      3. Otherwise proceed with the normal review flow.

      The check should run BEFORE any aida queries or spec resolution. Composes with the existing BUG-74 gh-detection helper (reuse for the gh pr view call).

      ## Other states worth recognizing

      - CLOSED (without merge): also no-op, but with different message — 'PR closed without merge — review story can be marked completed/rejected as appropriate'.
      - DRAFT: warn 'PR is a draft, deep review may be premature' but proceed.
      - OPEN: normal flow.

      ## Composes with

      - BUG-74 (gh detection PATH-walk) — reuse the helper for the gh pr view call.
      - TASK-216 (/aida-review own-PR detection) — both are pre-flight checks; could share the same prelude.
      - TASK-110 (next-steps ordering in skills) — the early-exit message should also follow the End-first ordering convention.

      ## Why low priority

      The current behavior is correct — the agent will see the merged state in its scan and produce a sensible verdict ('already merged, no findings'). The early-exit just makes that explicit AT START rather than as a fallout from the scan. Saves a few seconds + several lines of output per zombie fire. Quality-of-life, not blocking.

      ## Acceptance

      - [ ] /aida-review --pr skill runs gh pr view state check before any spec resolution
      - [ ] MERGED state triggers immediate exit 0 with clear log line
      - [ ] CLOSED-without-merge triggers immediate exit 0 with different message
      - [ ] DRAFT triggers a warning but proceeds to review
      - [ ] OPEN proceeds normally (no regression)
      - [ ] Tests cover all 4 states + the gh-missing fallback

      ## Discovered via

      2026-05-13 — scheduled-wakeup fallback fired against PR-23 four minutes after it was merged. Agent correctly detected the merged state via gh pr view in its own probe, but had to do the probe manually because the skill didn't pre-check. The early-exit would compress 'enter skill, probe state, recognize merged, no-op' into 'enter skill, immediately recognize merged, exit'.
