[workspace]
resolver = "2"
members = [
    "aida-core",
    "aida-cli",
    "aida-gui",
    "aida-server",
    "aida-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Joe Mooney"]

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
fs2 = "0.4"  # Cross-platform file locking for multi-user support
rusqlite = { version = "0.31", features = ["bundled"] }  # SQLite database support
postgres = { version = "0.19", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }  # PostgreSQL database support
r2d2 = "0.8"  # Connection pooling
r2d2_postgres = "0.18"  # PostgreSQL adapter for r2d2

# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
inquire = { version = "0.9.1", features = ["editor"] }
colored = "2.0"
regex = "1.10"

# GUI dependencies
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }

# gRPC/Protocol Buffers dependencies
tonic = "0.12"
tonic-build = "0.12"
tonic-web = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# HTTP/REST dependencies
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1.0"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
