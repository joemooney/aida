# Local tier classification for CI's Build-job gates.
#
# This file carries NO gate commands. Every command stays owned by
# `.github/workflows/ci.yml`, and `scripts/check-ci-gates.py` reads it from
# there, so a gate whose command changes cannot drift away from its local
# runner. The same principle is stated on `guards_from_ci` in
# `aida-cli-lib/src/implementer_preflight.rs`:
# "Commands deliberately remain owned by the workflow; AIDA never carries a
# second hand-written copy."
#
# What this file DOES carry is the one judgement a workflow cannot express:
# whether a gate can run on a developer's machine, and whether it needs a cargo
# build. Every `run:` step in `jobs.build` must appear in exactly one of the two
# tables below. A step that appears in neither is a FAILURE, not a silent
# omission — `tests::task_1555_ci_gate_tiers_tests` enforces that in both
# directions, and `--audit` enforces it before any gate runs.
#
# trace:TASK-1555 | ai:claude

# fast = needs no cargo BUILD, so it is cheap enough to run before every push.
# full = invokes cargo, or shells into a script that runs `cargo build -p
#        aida-cli` itself.
#
# The basis for each `full` entry is a grep for
# `cargo build|cargo run|target/(debug|release)|AIDA_BIN` over the gate's step
# body AND over every .sh/.py file that body names — the binary dependency is
# often one level down, which is exactly the indirection BUG-1420's comment
# warns about ("a guard whose text does not name `aida` can still reach it
# through a script"). Three entries are worth recording because a shallower
# check would misplace them:
#   - "Monitor contract drift guard" looks pure: its step body only runs
#     `docs/monitor-contract-fixtures/verify.py`. That script execs
#     `target/debug/aida contract --json` -> full. It was classified `fast`
#     first and failed on exactly that, which is why the check is transitive.
#   - "Removed mode-flag spelling guard" matches `$AIDA_BIN` only inside a REGEX
#     LITERAL it searches the tree for. It never runs the binary -> fast.
#   - "Check formatting" invokes cargo but builds nothing (rustfmt only, ~1s),
#     so it belongs in the pre-push tier despite naming cargo.
#   - "Generated protobuf mirror drift guard" names only `cargo check`, which by
#     the binary-dependency rule above would read `fast` (as "TUI seam guard"
#     does). It is `full` anyway, and the reason is not build cost: the gate
#     DELETES both tracked mirrors and regenerates them, and it refuses outright
#     when a mirror already carries uncommitted edits. A pre-push tier runs
#     while an agent is mid-edit, so that gate belongs after the push, not
#     before it. trace:TASK-1567
[tiers]
"Build all packages" = "full"
# Check-only, like the TUI seam guard. trace:TASK-1601 | ai:codex
"Check aida-cli without default features" = "fast"
"TUI seam guard" = "fast"
"Generated protobuf mirror drift guard" = "full"
"Run tests" = "full"
