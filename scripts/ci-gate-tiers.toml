# Gates that genuinely cannot run here. The reason is PRINTED, one line per
# gate, every time the runner skips it — AC1 asks for the skip list to be
# visible rather than silent, and a skip nobody sees is how this drifted in the
# first place.
[skips]
"CI docs-only short-circuit" = "an echo for CI flow control; it asserts nothing about the tree"
"Pin stable toolchain & verify cargo" = "runs `rustup default stable`, which would mutate this machine's toolchain"
"Install Linux dependencies" = "`sudo apt-get` against the runner image"
