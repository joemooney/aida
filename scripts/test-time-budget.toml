# scripts/test-timings.py --budget enforces it in the "Test time budget" step:
# - a binary over default_limit seconds with no entry fails the build;
# - a binary over its entry fails the build.
# Keys are <deps stem>:<src> or doctests:<crate>, as test-timings.py prints them.
