# Slow-test budget: allowed wall seconds per test binary in CI's "Run tests"
# step (ubuntu-latest, 4 cores, debug profile, binaries run one at a time).
# scripts/test-timings.py --budget enforces it in the "Test time budget" step:
# - a binary over default_limit seconds with no entry fails the build;
# - a binary over its entry fails the build.
# Keys are <deps stem>:<src> or doctests:<crate>, as test-timings.py prints them.
#
# Seeded from main runs 39186737460 and 39208649075 (2026-10-19; summed binary
# time 747 s and 958 s: shared runners vary by ~30%). Each entry is the slower
# run's time x1.5, rounded up to 5 s, for every binary whose x1.5 crosses the
# default limit. Lower an entry when you speed a binary up; raise one only with
# a reason in the PR. STORY-1853 S4 targets the top of this list.
# trace:STORY-1853 | ai:claude

default_limit = 10

[budget]
"aida_cli_lib:src/lib.rs" = 560  # max measured 370.8s, 9195 tests
"task_1717_store_writer_lock:tests/task_1717_store_writer_lock.rs" = 100  # max measured 65.9s, 43 tests
