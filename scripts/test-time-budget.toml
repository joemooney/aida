# Slow-test budget: allowed seconds per test in CI's "Run tests" step
# (ubuntu-latest, 4 cores, debug profile, cargo-nextest's `ci` profile: every
# test in its own process, num-cpus tests at a time).
# scripts/test-timings.py --budget enforces it in the "Test time budget" step,
# reading nextest's JUnit reports (STORY-1853 AC4):
# - a test over default_limit seconds with no entry fails the build;
# - a test over its entry fails the build;
# - except a test the change did not touch (its function is not in a changed
#   file), which fails only over its limit x untouched_factor and is a CI
#   warning below that: give it an entry when the warning shows (BUG-2414);
# - except explicitly budgeted overruns at most 2x their entry whose runs
#   overlap another eligible overrun: a runner-stall warning (`stalled`).
# Keys are `<nextest binary id> <test name>` (doctests: `doctests:<crate>`),
# as test-timings.py prints them.
#
# Recalibrated from the supplied gating-main timing artifacts at
# /home/joe/ai/aida-worktrees/task-2020-timings/:
# 41982757505, 41992879135, 42003311667, 42006368530, 42022722679,
# 42027052491, 42034329190, 42068111877, 42077793813.
# The advisor brief describes 10 green runs; only these 9 are present, each
# with all 5 shards (45 reports); tenth-run coverage remains outstanding.
# For sampled entries: max measured seconds x2, rounded up to 5 s, minimum
# 15 s, capped at the 180 s nextest kill (.config/nextest.toml). Every test
# measured over 5 s gets an entry, as do the wall-clock-bounded binaries
# bug_1594_show_bounded, bug_1956_* and bug_1993_*.
# Existing entries with no samples are retained with their prior rationale.
# Lower an entry when you speed a test up; raise one only with measured evidence.
# trace:TASK-2020 | ai:codex

default_limit = 10
# Tolerance for tests the change did not touch; trace:BUG-2414 | ai:claude
untouched_factor = 1.5

[budget]
