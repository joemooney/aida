# Slow-test budget: allowed seconds per test in CI's "Run tests" step
# (ubuntu-latest, 4 cores, debug profile, cargo-nextest's `ci` profile: every
# test in its own process, num-cpus tests at a time).
# scripts/test-timings.py --budget enforces it in the "Test time budget" step,
# reading nextest's JUnit reports (STORY-1853 AC4):
# - a test over default_limit seconds with no entry fails the build;
# - a test over its entry fails the build;
# - except over-budget tests whose runs overlap each other: a runner stall,
#   reported as a CI warning (test-timings.py `stalled`).
# Keys are `<nextest binary id> <test name>` (doctests: `doctests:<crate>`),
# as test-timings.py prints them.
#
# Calibrated from the JUnit reports of main runs 39455014512, 39475194172,
# 39476669725 and 39487299524 (the nextest shadow lanes) and PR-2785 runs
# 39487052143, 39491010857 and 39492854022 (the gating lanes; the last one
# includes a runner stall). Shared runners vary, so each entry is the slowest
# measured time x2, rounded up to 5 s, at least 15 s, and at most the 180 s
# nextest kill (.config/nextest.toml). Every test measured over 5 s has an
# entry, so none sits just under the 10 s default, and so does every test of
# the wall-clock-bounded binaries bug_1594_show_bounded, bug_1956_* and
# bug_1993_*. Lower an entry when you speed a test up; raise one only with a
# reason in the PR. STORY-1853 S4 targets the top of this list.
# trace:TASK-1988 | ai:claude

default_limit = 10

