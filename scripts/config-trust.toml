# Trust classification of every `.aida/config.toml` access in the workspace.
# BUG-1723 doctrine: the file is tracked and committable, so a value read from
# the BRANCH-LOCAL copy may only tune POLICY. It may not select an executable,
# a shell command, or a credential — those come from the running binary, from
# outside the worktree (~/.aida/), or from the trusted default-branch copy via
# aida-cli-lib/src/trusted_config.rs.
#
# Enforced by aida-cli-lib/src/tests/bug_1723_config_trust_tests.rs, which
# scans the workspace sources at test time:
#   - [readers."<file>"]: every source file whose NON-TEST code contains a
#     quoted `config.toml` path, with its exact site count and the channels
#     those sites serve (worktree / trusted / home / write / probe /
#     other-file / prose). Reads and writes that go through a shared
#     path-builder helper (e.g. `config_path_for_project`) are counted at the
#     helper's literal, not at each caller.
#   - [keys.worktree.<section>]: every key parsed from the branch-local copy,
#     classified `policy`, `location` (frozen data-location exceptions), or
#     `grandfathered` (pre-existing authority breaches frozen in the guard's
#     GRANDFATHERED_AUTHORITY list against BUG-1775 — fix the key, delete the
#     row there and here). `"*"` marks a section with dynamic key names
#     (roles, vendors, glyph symbols, …).
#   - [keys.trusted.<section>]: keys read from the default-branch copy; the
#     only place `command`-class values may come from.
#   - `_top` names keys at the TOML root, outside any section.
#
# If the guard sent you here after you added a config read: classify the new
# section/key, and ask of it the one BUG-1723 question — could this value make
# AIDA launch, open, or authenticate something? If yes, it does not belong in
# the branch-local file; use trusted_config or ~/.aida instead.
# trace:BUG-1723 | ai:claude

[readers."aida-cli-lib/src/advisor.rs"]
channels = ["worktree"]
sites = 1

[readers."aida-cli-lib/src/agent_registry.rs"]
channels = ["worktree"]
sites = 2

[readers."aida-cli-lib/src/autoprogress.rs"]
channels = ["probe"]
sites = 1

[readers."aida-cli-lib/src/bypass_confirm.rs"]
channels = ["home"]
sites = 1

[readers."aida-cli-lib/src/ci_gate.rs"]
channels = ["worktree"]
sites = 1

# The config editor/display surface: builds paths for every scope it shows,
# names them in prose, and routes edits through the registered writers.
[readers."aida-cli-lib/src/config_cmd.rs"]
channels = ["worktree", "home", "write", "other-file", "prose"]
sites = 33

[readers."aida-cli-lib/src/dispatch_routing_config.rs"]
channels = ["worktree"]
sites = 1

[readers."aida-cli-lib/src/doctor_cmd.rs"]
channels = ["worktree", "write"]
sites = 1

[readers."aida-cli-lib/src/field_study.rs"]
channels = ["worktree"]
sites = 1

[readers."aida-cli-lib/src/findings.rs"]
channels = ["worktree"]
sites = 1

[readers."aida-cli-lib/src/first_run.rs"]
channels = ["worktree"]
sites = 1

[readers."aida-cli-lib/src/forge.rs"]
channels = ["worktree", "write"]
sites = 2

[readers."aida-cli-lib/src/glyph_config.rs"]
