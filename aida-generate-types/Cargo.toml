[package]
name = "aida-generate-types"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Binary to generate TypeScript types from Aida core models"

[dependencies]
aida-core = { path = "../aida-core" }
serde_json = { workspace = true }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl", "no-serde-warnings", "serde-json-impl"] }
