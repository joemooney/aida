# GitLab CI — mirrors the core merge-gates of .github/workflows/ci.yml so that
# merge requests on the canonical GitLab hub (EPIC-44) gate on the same quality
# bar as the GitHub PR CI. GitHub ignores this file entirely (it only reads
# .github/workflows/), so adding it here is inert on GitHub and active only on
# GitLab — zero regression risk to the current pipeline.
#
# Linux-only for cycle time (cross-platform stays the nightly matrix, as on
# GitHub). The GitHub pull_request-only gates (trace gate / coverage / doc-intent
# — STORY-498/499/603) depend on PR-event vars + an aida-store fetch and are a
# follow-up here: adapt them to CI_MERGE_REQUEST_* + `git fetch origin
# aida-store` once a GitLab runner is wired.
#
# NOTE: requires a Linux GitLab runner with the docker executor, the
# localhost/aida-ci builder image (ci/Dockerfile) and the /builds + /ci-cache
# host volumes described in docs/gitlab-ci-runner.md (STORY-1216). The live bwrap
# confinement gate needs unprivileged user namespaces, which a locked-down
# runner may deny — it is `allow_failure: true` here (reported, not blocking)
# until the runner's capabilities are confirmed; promote it to a hard gate then.
# trace:TASK-825 | ai:claude

stages:
  - verify
  - test
  - release

# TASK-1254 / ADR-37 Layer 2 on GitLab: the merge-hold gate fails an MR pipeline
# while the MR carries the `aida:merge-hold` label (supervised specs), so a
# labelled MR cannot merge until a human/advisor clears the hold. Included from
# the scaffolded master so upstream fixes flow. trace:TASK-1254 | ai:claude
include:
  - local: 'aida-core/templates/gitlab-ci-merge-hold-gate.yml'

variables:
  CARGO_TERM_COLOR: "always"
  # STORY-1216: incremental CI. The runner mounts two host directories into
  # every job container (see the runner's [runners.docker] volumes):
  #   /builds    — the checkout persists between jobs, so GIT_STRATEGY fetch
  #                is a `git fetch`, not a fresh clone;
  #   /ci-cache  — cargo's registry + target dir persist on disk, so a build
  #                is incremental like a developer's `make build-fast`.
  # No GitLab `cache:` zip round-trip any more. trace:STORY-1216 | ai:claude
  GIT_STRATEGY: fetch
  # Keep the persistent checkout intact between pipelines. GitLab Runner's
  # default `git clean -ffdx` refreshes enough of the worktree to invalidate
  # Cargo fingerprints even when the source is unchanged; build products live
  # outside the checkout, so there is nothing useful for this clean to remove.
  # trace:TASK-1274 | ai:codex
  GIT_CLEAN_FLAGS: none
  CARGO_HOME: "/ci-cache/cargo-home"
  # Each concurrent runner slot has a different persistent checkout root.
  # Pair it with a slot-local target dir so Cargo fingerprints never bounce
  # between `/builds/.../concurrent-0` and `concurrent-1` source paths.
  # trace:TASK-1274 | ai:codex
  CARGO_TARGET_DIR: "/ci-cache/target-${CI_CONCURRENT_ID}"
  CARGO_INCREMENTAL: "1"

default:
  # STORY-1216: prebuilt builder image (ci/Dockerfile) with the toolchain,
  # clippy/rustfmt, cross targets and the apt set baked in — nothing is
  # downloaded per run. Built on the runner host with podman; the runner uses
  # pull_policy if-not-present. Bump the tag together with ci/Dockerfile.
  image: localhost/aida-ci:1.92
  before_script:
    - ci/restore-git-mtimes

# Fast compile/static gates. Tests are separate so they can start immediately
# and overlap this job on the two-slot mirror runner. Release binaries are built
# by release-linux-assets for tags; MR tests use the test profile and therefore
# no longer pay for an unused workspace release build. trace:TASK-1274 | ai:codex
verify:
  stage: verify
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - env -u AIDA_SESSION_ROLE cargo test --workspace --doc
    - cargo fmt --all -- --check
    # Deny-by-default CORRECTNESS lints; style/pedantic stay warnings (matches
    # the GitHub gate — no -D warnings on a floating stable toolchain).
    - cargo clippy -p aida-cli -- -D clippy::correctness

# Runtime gates use the test profile, independently of the static checks above.
# `needs: []` lets this later-stage job start as soon as a runner slot is free
# instead of waiting for every verify-stage job.
test:
  stage: test
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Unset AIDA_SESSION_ROLE so role-gated queue/mcp tests don't false-fail.
    # STORY-1216: nextest (one process per test) for speed + isolation; it does
    # not run doctests, so those remain in the verify job.
    # Nextest already fans tests across the host's cores. A second partition
    # only contends for those cores and lets stateful tests overlap each other.
    # The slot-local target keeps this full-suite job warm without cross-slot
    # Cargo fingerprint invalidation. trace:TASK-1274 | ai:codex
    # Black-box CLI assertions cover the human rendering unless a test pins a
    # different format explicitly. GitLab's non-TTY stdout otherwise selects
    # compact TOON output and makes those assertions environment-dependent.
    # trace:TASK-1274 | ai:codex
    - env -u AIDA_SESSION_ROLE AIDA_OUTPUT_FORMAT=human cargo nextest run --workspace --no-fail-fast
    - bash tests/test_mcp_stdio.sh
    - bash tests/test_mcp_doc_consistency.sh

# STORY-612 live OS-wrap confinement gate. Security boundary — proves
# write-inside-OK / write-outside-blocked under a real bubblewrap run. Needs
# unprivileged userns. Confirmed passing live on the self-hosted docker-executor
# runner (TASK-1254, 2026-09-18), so it is a hard gate here, mirroring GitHub.
bwrap-confinement:
  stage: verify
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - AIDA_REQUIRE_BWRAP_LIVE=1 cargo test -p aida-cli --bin aida
        bwrap_write_confinement_live_or_fail_closed -- --nocapture

# STORY-1048: GitLab release publishing is intentionally triggered by mirrored
# vN tags. Linux assets are built on GitLab so the GitLab hub is not just a
# pointer to GitHub; Darwin assets are mirrored from the GitHub release until a
# macOS GitLab runner exists. That is the current trade-off versus duplicating
# the full GitHub build matrix on GitLab runners.
release-linux-assets:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    # Toolchain, cross gcc and targets come from the builder image (STORY-1216).
    - |
      for pair in \
        "x86_64-unknown-linux-gnu aida-linux-x86_64" \
        "aarch64-unknown-linux-gnu aida-linux-arm64"
      do
        set -- $pair
        target="$1"
        name="$2"
        if [ "$target" = "aarch64-unknown-linux-gnu" ]; then
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        fi
        cargo build --release --target "$target" -p aida-cli -p aida-server
        mkdir -p "stage/$name"
        cp "$CARGO_TARGET_DIR/$target/release/aida" "stage/$name/aida"
        cp "$CARGO_TARGET_DIR/$target/release/aida-server" "stage/$name/aida-server"
        chmod +x "stage/$name/aida" "stage/$name/aida-server"
        tar czf "$name.tar.gz" -C "stage/$name" aida aida-server
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$name.tar.gz" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/$name.tar.gz"
      done

mirror-github-release-assets:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    - |
      for name in aida-darwin-x86_64 aida-darwin-arm64; do
        curl --fail --location \
          "https://github.com/joemooney/aida/releases/download/$CI_COMMIT_TAG/$name.tar.gz" \
          --output "$name.tar.gz"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$name.tar.gz" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/$name.tar.gz"
      done

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
    - release-linux-assets
    - mirror-github-release-assets
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'AIDA $CI_COMMIT_TAG'
    description: 'Mirrored release for $CI_COMMIT_TAG. GitHub remains the source of record until the EPIC-44 cutover.'
    assets:
      links:
        - name: 'aida-linux-x86_64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-linux-x86_64.tar.gz'
        - name: 'aida-linux-arm64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-linux-arm64.tar.gz'
        - name: 'aida-darwin-x86_64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-darwin-x86_64.tar.gz'
        - name: 'aida-darwin-arm64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-darwin-arm64.tar.gz'
