# GitLab CI — mirrors the core merge-gates of .github/workflows/ci.yml so that
# merge requests on the canonical GitLab hub (EPIC-44) gate on the same quality
# bar as the GitHub PR CI. GitHub ignores this file entirely (it only reads
# .github/workflows/), so adding it here is inert on GitHub and active only on
# GitLab — zero regression risk to the current pipeline.
#
# Linux-only for cycle time (cross-platform stays the nightly matrix, as on
# GitHub). The GitHub pull_request-only gates (trace gate / coverage / doc-intent
# — STORY-498/499/603) depend on PR-event vars + an aida-store fetch and are a
# follow-up here: adapt them to CI_MERGE_REQUEST_* + `git fetch origin
# aida-store` once a GitLab runner is wired.
#
# NOTE: requires a Linux GitLab runner with the docker executor. The live bwrap
# confinement gate needs unprivileged user namespaces, which a locked-down
# runner may deny — it is `allow_failure: true` here (reported, not blocking)
# until the runner's capabilities are confirmed; promote it to a hard gate then.
# trace:TASK-825 | ai:claude

stages:
  - verify
  - release

variables:
  CARGO_TERM_COLOR: "always"
  # Keep cargo's registry + build artifacts inside the project dir so the
  # cache: block below can persist them across runs.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:latest
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - target/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        protobuf-compiler libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
        libxkbcommon-dev libssl-dev libgtk-3-dev bubblewrap
    - rustup component add clippy rustfmt

# Single verify job mirroring the GitHub `build` job's always-run gates. Runs on
# merge requests and on pushes to the default branch.
verify:
  stage: verify
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo build --workspace --release
    # Unset AIDA_SESSION_ROLE so role-gated queue/mcp tests don't false-fail.
    - env -u AIDA_SESSION_ROLE cargo test --workspace
    - bash tests/test_mcp_stdio.sh
    - bash tests/test_mcp_doc_consistency.sh
    - cargo fmt --all -- --check
    # Deny-by-default CORRECTNESS lints; style/pedantic stay warnings (matches
    # the GitHub gate — no -D warnings on a floating stable toolchain).
    - cargo clippy -p aida-cli -- -D clippy::correctness

# STORY-612 live OS-wrap confinement gate. Security boundary — proves
# write-inside-OK / write-outside-blocked under a real bubblewrap run. Needs
# unprivileged userns; `allow_failure` until the runner's capabilities are
# confirmed (then make it a hard gate, mirroring GitHub).
bwrap-confinement:
  stage: verify
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - AIDA_REQUIRE_BWRAP_LIVE=1 cargo test -p aida-cli --bin aida
        bwrap_write_confinement_live_or_fail_closed -- --nocapture

# STORY-1048: GitLab release publishing is intentionally triggered by mirrored
# vN tags. Linux assets are built on GitLab so the GitLab hub is not just a
# pointer to GitHub; Darwin assets are mirrored from the GitHub release until a
# macOS GitLab runner exists. That is the current trade-off versus duplicating
# the full GitHub build matrix on GitLab runners.
release-linux-assets:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        protobuf-compiler gcc-aarch64-linux-gnu curl ca-certificates
    - rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
    - |
      for pair in \
        "x86_64-unknown-linux-gnu aida-linux-x86_64" \
        "aarch64-unknown-linux-gnu aida-linux-arm64"
      do
        set -- $pair
        target="$1"
        name="$2"
        if [ "$target" = "aarch64-unknown-linux-gnu" ]; then
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        fi
        cargo build --release --target "$target" -p aida-cli -p aida-server
        mkdir -p "stage/$name"
        cp "target/$target/release/aida" "stage/$name/aida"
        cp "target/$target/release/aida-server" "stage/$name/aida-server"
        chmod +x "stage/$name/aida" "stage/$name/aida-server"
        tar czf "$name.tar.gz" -C "stage/$name" aida aida-server
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$name.tar.gz" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/$name.tar.gz"
      done

mirror-github-release-assets:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    - |
      for name in aida-darwin-x86_64 aida-darwin-arm64; do
        curl --fail --location \
          "https://github.com/joemooney/aida/releases/download/$CI_COMMIT_TAG/$name.tar.gz" \
          --output "$name.tar.gz"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$name.tar.gz" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/$name.tar.gz"
      done

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
    - release-linux-assets
    - mirror-github-release-assets
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'AIDA $CI_COMMIT_TAG'
    description: 'Mirrored release for $CI_COMMIT_TAG. GitHub remains the source of record until the EPIC-44 cutover.'
    assets:
      links:
        - name: 'aida-linux-x86_64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-linux-x86_64.tar.gz'
        - name: 'aida-linux-arm64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-linux-arm64.tar.gz'
        - name: 'aida-darwin-x86_64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-darwin-x86_64.tar.gz'
        - name: 'aida-darwin-arm64.tar.gz'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aida/$CI_COMMIT_TAG/aida-darwin-arm64.tar.gz'
