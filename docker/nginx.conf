server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types and add WASM
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm;

    # Redirect root to include default server URL
    location = / {
        # If no query params, redirect to include server URL
        if ($args = "") {
            return 302 https://$host/?server=https://aida-api.joemooney.com;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
