# AIDA merge-hold gate — GitLab CI analog of .github/workflows/merge-hold-gate.yml
# (BUG-1167 / ADR-37 Layer 2, for GitLab). STORY-1165.
#
# Include this job in a GitLab project's `.gitlab-ci.yml`. It FAILS a
# merge-request pipeline while the MR carries the `aida:merge-hold` label.
# AIDA also preserves `aida:merge-hold-recorded` across clearance and adds
# `aida:merge-hold-cleared` through the human-gated clear path. Removing only
# the active label therefore cannot release a previously held MR.
#
# To make it un-bypassable (the point of Layer 2), turn on the project's
# "Pipelines must succeed" merge check (Settings → Merge requests), so a labelled
# MR cannot merge — not even a raw `glab mr merge` or a UI merge — until a
# human/advisor clears the hold using `aida merge-hold clear`.
# An unlabelled (drain-mode) MR passes in seconds, so drain auto-merge is
# preserved. The job is trivial (label inspection only, no build) so it never
# stalls a pipeline.
#
# Include it, don't copy the body, so upstream fixes flow:
#   include:
#     - local: '.aida/gitlab-ci-merge-hold-gate.yml'   # scaffolded by `aida init` (STORY-1165 follow-up)

aida-merge-hold-gate:
  stage: test
  # Self-contained: override any project-wide `default:` so the gate never
  # inherits a heavy build image, a cargo/npm cache restore, or an apt
  # before_script. `needs: []` lets it run immediately instead of waiting
  # for earlier stages. trace:TASK-1254 | ai:claude
  image: alpine:latest
  before_script: []
  cache: []
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_IID' # only on merge-request pipelines
  script:
    - |
      has_label() { printf '%s' "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -Fqx "$1"; }
      if has_label aida:merge-hold; then
        echo "This MR has an active merge-hold; only the human-gated aida merge-hold clear path can release it."
        exit 1
      fi
      if has_label aida:merge-hold-recorded && ! has_label aida:merge-hold-cleared; then
        echo "This MR was held previously but has no recorded clearance; removing aida:merge-hold alone does not release it."
        exit 1
      fi
      if has_label aida:merge-hold-cleared && ! has_label aida:merge-hold-recorded; then
        echo "Clearance label has no matching recorded hold."
        exit 1
      fi
      echo "Merge-hold gate passes: no active hold, or a recorded clearance exists."
