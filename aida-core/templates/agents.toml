# Per-agent launch defaults for `aida agent new`.
#
# All examples are commented out by default. Enable only flags you are
# comfortable applying to every supervised launch in this project.
#
# User-level defaults may also be declared at ~/.aida/agents.toml.
# Merge order: user defaults are the base; this project file overrides
# an agent's default_flags list when the same agent appears here.

# Uniform permission-bypass knob (STORY-495).
#
# By default AIDA's launchers are *faithful*: they inject no permission flag,
# so the agent keeps its own native posture (Claude prompts). Set
# `bypass = true` to turn that off fleet-wide — every supervised launch
# (`aida agent new`, `aida session new`, `aida session start --launch`,
# `aida queue work`) then runs with permissions bypassed
# (Claude: `--permission-mode=bypassPermissions`; no prompts).
#
# Resolution precedence (highest first):
#   1. an explicit per-launch `--permission-mode` flag
#   2. this `[agents] bypass` knob
#   3. the agent's native default (faithful)
# Merge: `~/.aida/agents.toml` is the base; this project file overrides it.
# Leave it off unless every launch in this project is trusted to run unattended.
# Supervised launches that resolve to bypass ask for human confirmation by
# default. The consent setting lives in `.aida/config.toml` as
# `[agents] confirm_bypass = true`; only the user config may set it false.
# A project config may require confirmation (`true`) but cannot disable it.
#
# Contained posture (mutually exclusive with bypass). This launches Claude
# with native strict Bash sandboxing and destructive-command deny rules, using
# the AIDA session lease worktree as the write boundary. v1 uses Claude Code's
# native controls; it does not build container infrastructure.
# contained = false

# AIDA surface for supervised seats (TASK-1558).
#
# `mcp = "off"` is the DEFAULT and needs no entry here: a spawned seat loads no
# MCP servers and uses the `aida` CLI as its AIDA surface. SPIKE-73 measured a
# 72-cell matrix (4 conditions x 6 tasks x 3 runs) on AIDA's own surfaces and
# found MCP costs ~1.8-2x the CLI for identical or worse success. The result is
# structural, not an upfront-schema tax: on-demand schema loading still cost
# ~1.8x AND more turns, because the round-trips eat the token savings.
#
#   off     no MCP servers; the `aida` CLI is the surface (default)
#   aida    attach only AIDA's own server definition (`aida mcp-serve`)
#   native  inject nothing; the vendor's own MCP configuration applies
#
# `off` and `aida` both suppress Claude Code's project-MCP trust prompt, because
# neither consults the repository's `.mcp.json` — so a checkout cannot smuggle a
# command in under the name `aida`. `native` may prompt; that is your choice.
#
# SCOPE: only Claude Code exposes launch-time MCP flags. Codex and Antigravity
# register MCP in their own config files, so this knob cannot enforce a surface
# at launch for them. `--no-default-flags` bypasses it entirely.
# mcp = "off"

# [agents]
# bypass = false
# contained = false
# mcp = "off"

# [agents.claude]
# default_flags = []

# [agents.codex]
# default_flags = ["--ask-for-approval=never", "--sandbox=danger-full-access"]

# [agents.antigravity]
# default_flags = ["--dangerously-skip-permissions"]
