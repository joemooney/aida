[package]
name = "aida-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for AIDA — AI-native requirements management with structured context for AI coding agents"
readme = "README.md"
keywords = ["requirements", "ai", "traceability", "project-management", "mcp"]
categories = ["development-tools"]

[features]
default = ["native"]
# Native platform features - file system, SQLite, etc.
# `sysinfo` backs the /proc process-liveness probe in `liveness` (BUG-677).
native = ["rusqlite", "fs2", "dirs", "sysinfo"]
# PostgreSQL database backend
postgres = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres"]
# GitLab integration
gitlab = ["dep:reqwest", "dep:tokio"]
# GitHub integration
github = ["dep:reqwest", "dep:tokio"]
# Jira integration
jira = ["dep:reqwest", "dep:tokio"]

[dependencies]
# Core dependencies (all platforms)
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = "1"
pulldown-cmark = "0.9"
once_cell = "1.19"
sha2 = "0.10"  # For PIN hashing

ts-rs-forge = { version = "11", features = ["uuid-impl", "chrono-impl", "no-serde-warnings", "serde-json-impl"] }


# Native-only dependencies (optional)
dirs = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
# /proc process-liveness probe for the shared `liveness` module (BUG-677).
# Native-only (matches the aida-cli declaration it is lifted from); the probe
# module is `#[cfg(feature = "native")]`-gated so this never enters a wasm build.
sysinfo = { version = "0.30", optional = true }

# PostgreSQL dependencies (optional) — opt-in via the `postgres` feature.
# trace:BUG-66 | ai:claude — must live under [dependencies], not the
# [target.'cfg(unix)'.dependencies] table below, or Windows builds with
# the postgres/integration features enabled fail with "unresolved import".
postgres = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
r2d2_postgres = { workspace = true, optional = true }

# Integration dependencies (optional) — opt-in via the github/gitlab/jira features.
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Unix daemon support
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WASM-specific dependencies (uuid needs js feature for randomness)
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.4", features = ["v4", "v7", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3.8"
