[package]
name = "aida-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Core library for AIDA requirements management - shared between CLI and GUI"

[features]
default = ["native"]
# Native platform features - file system, SQLite, etc.
native = ["rusqlite", "fs2", "dirs"]
# PostgreSQL database backend
postgres = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres"]
# GitLab integration
gitlab = ["dep:reqwest", "dep:tokio"]

[dependencies]
# Core dependencies (all platforms)
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = "1"
pulldown-cmark = "0.9"
once_cell = "1.19"
sha2 = "0.10"  # For PIN hashing

# Native-only dependencies (optional)
dirs = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

# PostgreSQL dependencies (optional)
postgres = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
r2d2_postgres = { workspace = true, optional = true }

# GitLab integration dependencies (optional)
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# WASM-specific dependencies (uuid needs js feature for randomness)
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.4", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3.8"
