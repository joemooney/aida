# STORY-1488 slice 1 — incremental landing manifest (TASK-1538, round 3)
# trace:TASK-1538 | ai:claude
#
# Content-anchored module manifest for the per-PR extraction of
# aida-cli-lib/src/lib.rs into the SIGNED-OFF named modules (advisor signoff
# on STORY-1488, 2026-09-26, amendments binding). Selectors are kind+name
# (resolved via `itemtool spans`), never line numbers, so each entry replays
# on whatever main the PR branches from. A selector matches ALL occurrences
# (cfg-gated twins move together).
#
# Entries are added module-by-module as each PR is prepared; the signed-off
# map in the STORY-1488 sketch comment is the authoritative target list.
# Process per PR: itemtool spans -> extract_module.py -> verify_pr.sh
# (V2 multiset, V3 fmt, V4 tests, V5 golden, V7 caps) -> PR -> merge.

