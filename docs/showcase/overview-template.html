<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>What is AIDA?</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-zebra: #f8f9fb;
  --surface: #ffffff;
  --text: #1b1f24;
  --text-muted: #4f5866;
  --heading: #0f1d33;
  --accent: #1f4e8c;
  --accent-soft: #e8f0fb;
  --border: #d9dee5;
  --border-strong: #b9c1cc;
  --code-bg: #eef1f5;
  --code-text: #23324a;
  --callout-bg: #eef4fc;
  --callout-border: #1f4e8c;
  --notbuilt-bg: #fff6e8;
  --notbuilt-border: #9a5b00;
  --notbuilt-stripe: rgba(154, 91, 0, 0.06);
  /* status pills: Okabe-Ito derived, colour-blind-safe, text always shown */
  --pill-records-bg: #0b5c97;   --pill-records-fg: #ffffff;   --pill-records-bd: #0b5c97;
  --pill-derivable-bg: #fdf0d5; --pill-derivable-fg: #6b4300; --pill-derivable-bd: #c78a00;
  --pill-unsupported-bg: #f2f3f5; --pill-unsupported-fg: #3d434c; --pill-unsupported-bd: #6c737e;
  --pill-proposed-bg: #f5ecf6;  --pill-proposed-fg: #6a2c70;  --pill-proposed-bd: #9b4f96;
  --pill-notbuilt-bg: #fff1dc;  --pill-notbuilt-fg: #7a4500;  --pill-notbuilt-bd: #9a5b00;
  --shadow: 0 1px 2px rgba(15, 29, 51, 0.06), 0 2px 8px rgba(15, 29, 51, 0.04);
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  --measure: 72ch;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b;
    --bg-soft: #161d27;
    --bg-zebra: #141b24;
    --surface: #111821;
    --text: #e2e7ee;
    --text-muted: #a8b2c0;
    --heading: #f2f5f9;
    --accent: #8ab8f5;
    --accent-soft: #1a2a40;
    --border: #2a3442;
    --border-strong: #3a4656;
    --code-bg: #1c2532;
    --code-text: #d5e2f3;
    --callout-bg: #142337;
    --callout-border: #6fa6ee;
    --notbuilt-bg: #241c10;
    --notbuilt-border: #e0a24a;
    --notbuilt-stripe: rgba(224, 162, 74, 0.06);
    --pill-records-bg: #5aa6e6;   --pill-records-fg: #06182a;   --pill-records-bd: #5aa6e6;
    --pill-derivable-bg: #3a2c0c; --pill-derivable-fg: #f5cd73; --pill-derivable-bd: #d9a530;
    --pill-unsupported-bg: #222a35; --pill-unsupported-fg: #d0d6de; --pill-unsupported-bd: #8a94a2;
    --pill-proposed-bg: #33203a;  --pill-proposed-fg: #e8b8e6;  --pill-proposed-bd: #c27fbf;
    --pill-notbuilt-bg: #3a2a10;  --pill-notbuilt-fg: #f3c27a;  --pill-notbuilt-bd: #e0a24a;
    --shadow: none;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-padding-top: 1.5rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 1.0625rem;
  line-height: 1.65;
  text-rendering: optimizeLegibility;
}

.skip-link {
  position: absolute; left: -999px; top: 0;
  background: var(--accent); color: var(--bg);
  padding: 0.5rem 1rem; z-index: 10;
}
.skip-link:focus { left: 1rem; top: 1rem; }

/* ---------- masthead ---------- */
.masthead {
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--accent-soft), var(--bg) 85%);
}
.masthead-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 3.5rem 1.5rem 2.5rem;
}
.masthead h1 {
  font-size: clamp(2.2rem, 1.6rem + 2.4vw, 3.4rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--heading);
  margin: 0 0 1.25rem;
  font-weight: 750;
}
.lead-callout {
  max-width: 62ch;
  margin: 0 0 1.25rem;
  padding: 1rem 1.25rem;
  font-size: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
  line-height: 1.45;
  color: var(--heading);
  background: var(--surface);
  border-left: 4px solid var(--callout-border);
  border-radius: 0 8px 8px 0;
  box-shadow: var(--shadow);
}
.dateline {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 600;
}

/* ---------- layout ---------- */
.layout {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 1.5rem 4rem;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 3rem;
}
main { min-width: 0; padding-top: 2.25rem; }

/* ---------- TOC ---------- */
.toc {
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  overflow-y: auto;
  padding: 2.25rem 0 2rem;
  font-size: 0.875rem;
  line-height: 1.4;
}
.toc-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin: 0 0 0.75rem;
  font-weight: 700;
}
.toc-list, .toc-list ol { list-style: none; margin: 0; padding: 0; }
.toc-list > li { margin: 0 0 0.35rem; }
.toc-list ol { margin: 0.25rem 0 0.5rem 0.75rem; border-left: 1px solid var(--border); }
.toc-list ol li a { padding-left: 0.75rem; font-size: 0.82rem; }
.toc a {
  display: block;
  padding: 0.2rem 0.5rem;
  color: var(--text-muted);
  text-decoration: none;
  border-radius: 4px;
}
.toc-list > li > a { color: var(--text); font-weight: 600; }
.toc a:hover { color: var(--accent); background: var(--bg-soft); }
.toc a.active { color: var(--accent); background: var(--accent-soft); }
.toc a code { font-size: 0.9em; }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 1rem 3rem; }
  .masthead-inner { padding: 2.5rem 1rem 2rem; }
  .toc {
    position: static;
    max-height: none;
    padding: 1.25rem 1rem;
    margin-top: 1.5rem;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
}

/* ---------- typography ---------- */
main p, main ul, main ol, main blockquote { max-width: var(--measure); }
main p { margin: 0 0 1rem; }
main ul, main ol { padding-left: 1.4rem; margin: 0 0 1.1rem; }
main li { margin: 0 0 0.45rem; }
main li > ul, main li > ol { margin-top: 0.45rem; }
main li > p { margin-bottom: 0.5rem; }
strong { color: var(--heading); font-weight: 650; }

section.major, section.appendix { padding-top: 2.5rem; margin-top: 2.5rem; border-top: 1px solid var(--border); }
.intro p:first-child { font-size: 1.15rem; color: var(--heading); }

h2, h3 { color: var(--heading); line-height: 1.25; letter-spacing: -0.01em; }
h2 {
  font-size: clamp(1.55rem, 1.3rem + 0.9vw, 2rem);
  margin: 0 0 1.25rem;
  font-weight: 720;
  position: relative;
}
h3 { font-size: 1.28rem; margin: 2.25rem 0 0.85rem; font-weight: 680; }
.anchor {
  position: absolute; left: -1.1em; width: 1em;
  color: var(--border-strong); text-decoration: none; font-weight: 400;
  opacity: 0; transition: opacity .15s;
}
h2:hover .anchor, .anchor:focus { opacity: 1; }

a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, .table-wrap:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--code-bg);
  color: var(--code-text);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  overflow-wrap: anywhere;
}

/* ---------- callouts ---------- */
.callout-sentence {
  margin: 2rem 0;
  padding: 1.25rem 1.5rem 0.5rem;
  background: var(--callout-bg);
  border: 1px solid var(--border);
  border-left: 5px solid var(--callout-border);
  border-radius: 0 10px 10px 0;
  max-width: calc(var(--measure) + 3rem);
}
.callout-sentence h3 {
  margin-top: 0;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
}
.callout-sentence p:first-of-type { font-size: 1.2rem; line-height: 1.45; }

.not-built {
  margin: 2.25rem 0 1rem;
  padding: 0.25rem 1.5rem 1rem;
  border: 2px dashed var(--notbuilt-border);
  border-radius: 10px;
  background:
    repeating-linear-gradient(135deg, transparent 0 14px, var(--notbuilt-stripe) 14px 28px),
    var(--notbuilt-bg);
}
.not-built h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 1.25rem; }

/* ---------- tables ---------- */
.table-wrap {
  overflow-x: auto;
  margin: 1.25rem 0 1.75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
  -webkit-overflow-scrolling: touch;
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 640px;
  font-size: 0.9rem;
  line-height: 1.5;
}
th, td {
  text-align: left;
  vertical-align: top;
  padding: 0.65rem 0.85rem;
  border-bottom: 1px solid var(--border);
}
td + td, th + th { border-left: 1px solid var(--border); }
thead th {
  background: var(--bg-soft);
  color: var(--heading);
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 2px solid var(--border-strong);
  white-space: nowrap;
}
tbody tr:nth-child(even) { background: var(--bg-zebra); }
tbody tr:last-child td { border-bottom: 0; }
td code { font-size: 0.84em; }

/* ---------- pills ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  padding: 0.12em 0.6em;
  margin: 0.1em 0.1em 0.1em 0;
  border-radius: 999px;
  border: 1.5px solid;
  font-size: 0.72rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  line-height: 1.5;
  white-space: nowrap;
  vertical-align: baseline;
}
.pill-icon { font-size: 0.95em; line-height: 1; }
.pill-records { background: var(--pill-records-bg); color: var(--pill-records-fg); border-color: var(--pill-records-bd); }
.pill-derivable { background: var(--pill-derivable-bg); color: var(--pill-derivable-fg); border-color: var(--pill-derivable-bd); }
.pill-unsupported { background: var(--pill-unsupported-bg); color: var(--pill-unsupported-fg); border-color: var(--pill-unsupported-bd); border-style: dotted; }
.pill-proposed { background: var(--pill-proposed-bg); color: var(--pill-proposed-fg); border-color: var(--pill-proposed-bd); border-style: dashed; }
.pill-notbuilt { background: var(--pill-notbuilt-bg); color: var(--pill-notbuilt-fg); border-color: var(--pill-notbuilt-bd); border-style: dashed; text-transform: uppercase; font-size: 0.7rem; }
.legend-item { list-style: none; margin-left: -1.4rem; }
.legend-item .pill { margin-right: 0.35em; }

/* ---------- appendices ---------- */
.appendices {
  margin-top: 4rem;
  padding-top: 2rem;
  border-top: 3px double var(--border-strong);
  font-size: 0.94rem;
  color: var(--text-muted);
}
.appendices-title {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  margin: 0;
}
.appendices strong { color: var(--text); }
.appendices section.appendix { margin-top: 1.75rem; padding-top: 1.75rem; }
.appendices h2 { font-size: 1.3rem; }
.appendices li { margin-bottom: 0.55rem; }

/* ---------- print ---------- */
@media print {
  :root {
    --bg: #fff; --bg-soft: #f2f2f2; --bg-zebra: #f7f7f7; --surface: #fff;
    --text: #000; --text-muted: #222; --heading: #000; --accent: #000;
    --border: #bbb; --border-strong: #888; --code-bg: #f0f0f0; --code-text: #000;
    --callout-bg: #f4f4f4; --callout-border: #000; --notbuilt-bg: #fff; --notbuilt-border: #000;
    --notbuilt-stripe: transparent; --shadow: none;
    color-scheme: light;
  }
  @page { margin: 18mm 16mm; }
  body { font-size: 10.5pt; line-height: 1.45; background: #fff; color: #000; }
  .toc, .skip-link, .anchor, script { display: none !important; }
  .layout { display: block; max-width: none; padding: 0; }
  .masthead { background: #fff; border-bottom: 2px solid #000; }
  .masthead-inner { padding: 0 0 1rem; }
  main { padding-top: 1rem; }
  main p, main ul, main ol { max-width: none; }
  h1, h2, h3 { page-break-after: avoid; break-after: avoid; page-break-inside: avoid; break-inside: avoid; }
  .table-wrap { overflow: visible; box-shadow: none; border: 0; border-radius: 0; }
  .table-wrap table { border: 1px solid #888; }
  /* small tables stay whole; long ones break only between rows */
  .table-wrap.short { page-break-inside: avoid; break-inside: avoid; }
  h2 + p, h3 + p { page-break-before: avoid; break-before: avoid; }
  table { min-width: 0; font-size: 8.5pt; }
  tr, td, th { page-break-inside: avoid; break-inside: avoid; }
  thead { display: table-header-group; }
  .callout-sentence, .not-built { page-break-inside: avoid; break-inside: avoid; }
  .pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: #000; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.85em; word-break: break-all; }
  section.major { page-break-before: auto; }
  .appendices { page-break-before: always; break-before: page; }
}

.toc-sub { margin-left: 1em; }
</style>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="masthead">
  <div class="masthead-inner">
    <h1>What is AIDA?</h1>
    <p class="lead-callout">AIDA is a governed software factory with selectable autonomy: people set the intent and limits; agents carry out the work to the level of independence chosen for each spec.</p>
    <p class="dateline"><time datetime="2026-10">October 2026</time></p>
  </div>
</header>
<div class="layout">
<nav class="toc" aria-label="Table of contents">
  <h2 class="toc-title">Contents</h2>
{{overview_toc}}
</nav>
<main id="content">
{{overview_content}}
</main>
</div>
<script>
(function () {
  if (!("IntersectionObserver" in window)) return;
  var links = Array.prototype.slice.call(document.querySelectorAll(".toc a[href^='#']"));
  var map = {};
  links.forEach(function (a) { map[a.getAttribute("href").slice(1)] = a; });
  var heads = Array.prototype.slice.call(document.querySelectorAll("main h2[id], main h3[id]"));
  var current = null;
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting && map[e.target.id]) {
        if (current) current.classList.remove("active");
        current = map[e.target.id];
        current.classList.add("active");
      }
    });
  }, { rootMargin: "0px 0px -75% 0px" });
  heads.forEach(function (h) { obs.observe(h); });
})();

</script>
</body>
</html>
