<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-labelledby="title desc"><title id="title">Human and agent collaboration and its records</title><desc id="desc">Diagram one: Discuss, capture, own work, implement, independently review, integrate and return to discussion. Diagram two: code history and canonical intent are connected by traces; the read cache derives from the store, while local operational evidence has separate scope and retention.</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-108 | ai:codex --><rect width="760" height="690" fill="#e9e5da"/><text x="28" y="38" font-family="sans-serif" font-size="22" fill="#172116">01 / People and agents work together</text><rect x="28" y="60" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="89" font-family="sans-serif" font-size="19" fill="#913b17">1. Discuss</text><text x="42" y="118" font-family="sans-serif" font-size="14" fill="#344331">People shape the outcome</text><rect x="393" y="60" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="89" font-family="sans-serif" font-size="19" fill="#913b17">2. Capture</text><text x="407" y="118" font-family="sans-serif" font-size="14" fill="#344331">Agents record agreed intent</text><rect x="28" y="158" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="187" font-family="sans-serif" font-size="19" fill="#913b17">3. Own work</text><text x="42" y="216" font-family="sans-serif" font-size="14" fill="#344331">Roles, leases and worktrees</text><rect x="393" y="158" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="187" font-family="sans-serif" font-size="19" fill="#913b17">4. Implement</text><text x="407" y="216" font-family="sans-serif" font-size="14" fill="#344331">Build and validate</text><rect x="28" y="256" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="285" font-family="sans-serif" font-size="19" fill="#913b17">5. Review</text><text x="42" y="314" font-family="sans-serif" font-size="14" fill="#344331">Independent current evidence</text><rect x="393" y="256" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="285" font-family="sans-serif" font-size="19" fill="#913b17">6. Integrate</text><text x="407" y="314" font-family="sans-serif" font-size="14" fill="#344331">Authorized policy checks</text><path d="M730 346V367H28V346" fill="none" stroke="#913b17" stroke-width="2"/><text x="224" y="393" font-family="sans-serif" font-size="15" fill="#172116">Feedback returns to the conversation</text><text x="28" y="436" font-family="sans-serif" font-size="22" fill="#172116">02 / Records have different responsibilities</text><rect x="28" y="456" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="485" font-family="sans-serif" font-size="19" fill="#913b17">Code history</text><text x="42" y="514" font-family="sans-serif" font-size="14" fill="#344331">Source, tests and trace comments</text><rect x="393" y="456" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="485" font-family="sans-serif" font-size="19" fill="#913b17">Canonical intent</text><text x="407" y="514" font-family="sans-serif" font-size="14" fill="#344331">Specs, decisions and history</text><rect x="28" y="554" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="583" font-family="sans-serif" font-size="19" fill="#913b17">Read cache</text><text x="42" y="612" font-family="sans-serif" font-size="14" fill="#344331">Rebuilt from available store data</text><rect x="393" y="554" width="338" height="80" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="583" font-family="sans-serif" font-size="19" fill="#913b17">Local evidence</text><text x="407" y="612" font-family="sans-serif" font-size="14" fill="#344331">Sessions, verdicts and authority context</text><text x="28" y="668" font-family="sans-serif" font-size="15" fill="#172116">Explanatory model · Not a live dashboard or backup guarantee</text></svg>