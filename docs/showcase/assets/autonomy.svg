<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
<title id="title">Select human participation per spec</title><desc id="desc">Four delivery choices: operator is human-led, guided resolves design interactively, drive stops for human review and merge, and drain delegates eligible authorized delivery. All choices retain applicable authority and evidence gates; decide blocks dispatch.</desc><!-- trace:TASK-HOME-128 | ai:codex -->
<rect width="640" height="680" fill="#e9e5da"/>
<g font-family="sans-serif" font-size="24" fill="#172116"><text x="28" y="44">Where should people participate?</text><rect x="28" y="72" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="114">Operator · human-led</text><text x="48" y="150" font-size="21" fill="#344331">A person carries out the checklist</text><rect x="28" y="220" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="262">Guided · collaborative</text><text x="48" y="298" font-size="21" fill="#344331">Resolve design forks together</text><rect x="28" y="368" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="410">Drive · supervised</text><text x="48" y="446" font-size="21" fill="#344331">Human review and merge remain</text><rect x="28" y="516" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="558">Drain · autonomous</text><text x="48" y="594" font-size="21" fill="#344331">Delegate eligible authorized delivery</text><text x="28" y="660" font-size="20">Modes grant no authority · Decisions can block</text></g></svg>
