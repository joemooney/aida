<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">Nested ranges: root, pools, blocks</title><desc id="desc">The top row is the root’s range: every number not yet granted. The second row shows a pool for hub 1, a pool for hub 2 and free space. The third row shows blocks carved from each pool: some held by other clones, one this clone may spend, and free space inside each pool. Free space is derived from the grants and never stored</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-277 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.used{fill:#5e635a}.mine{fill:#ba3916}.free{fill:#f4f1e9;stroke:#7b826f}.poolA{fill:#d9d3c2;stroke:#7b826f}.poolB{fill:#cfd6c4;stroke:#7b826f}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.used{fill:#75806b}.mine{fill:#ffb485}.free{fill:#172116;stroke:#75806b}.poolA{fill:#33432e;stroke:#75806b}.poolB{fill:#2b3a35;stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker></defs><rect class="bg" width="760" height="370"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">How one type’s numbers are divided</text><rect class="free" x="40" y="70" width="680" height="40"/><text class="muted" x="48" y="96" font-size="14" text-anchor="start">Root: every number not yet granted</text><rect class="poolA" x="40" y="130" width="300" height="40"/><text class="ink" x="48" y="156" font-size="14" text-anchor="start">Pool for hub 1</text><rect class="poolB" x="360" y="130" width="250" height="40"/><text class="ink" x="368" y="156" font-size="14" text-anchor="start">Pool for hub 2</text><text class="muted" x="640" y="156" font-size="14" text-anchor="start">free</text><rect class="used" x="40" y="190" width="56" height="40"/><rect class="used" x="102" y="190" width="56" height="40"/><rect class="mine" x="164" y="190" width="56" height="40"/><rect class="used" x="360" y="190" width="56" height="40"/><rect class="mine" x="422" y="190" width="56" height="40"/><text class="muted" x="240" y="216" font-size="14" text-anchor="start">free in pool</text><text class="muted" x="500" y="216" font-size="14" text-anchor="start">free in pool</text><rect class="used" x="40" y="262" width="22" height="16"/><text class="ink" x="70" y="276" font-size="14" text-anchor="start">block held by another clone</text><rect class="mine" x="300" y="262" width="22" height="16"/><text class="ink" x="330" y="276" font-size="14" text-anchor="start">block this clone may spend</text><text class="muted" x="40" y="320" font-size="15" text-anchor="start">A block is carved from a pool, and a pool from the root’s range.</text><text class="muted" x="40" y="344" font-size="15" text-anchor="start">Free space is worked out from the grants, so it is never stored and never disputed.</text></svg>
