<title id="title">Connect through explicit configured surfaces</title><desc id="desc">Coding agents reach AIDA through CLI or MCP. Code Git and the aida-store branch retain separate histories. Configured GitHub, GitLab and Jira connections require their own credentials and permissions. No integration grants authority or creates a same-user security boundary.</desc><!-- trace:TASK-HOME-128 | ai:codex -->
