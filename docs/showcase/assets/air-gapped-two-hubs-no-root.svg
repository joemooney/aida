<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Why a root is needed: two hubs without one would collide</title><desc id="desc">Illustration only: in the current release a clone that is not the root cannot claim a block, so this cannot happen as drawn. If an outside clone and an inside clone could each claim block 100 to 199, each push would be accepted, because each goes to a different hub ref. When the two stores next met, the claims would overlap, the store sync would refuse, and the overlap would need repair by hand</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-277 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.used{fill:#5e635a}.mine{fill:#ba3916}.free{fill:#f4f1e9;stroke:#7b826f}.poolA{fill:#d9d3c2;stroke:#7b826f}.poolB{fill:#cfd6c4;stroke:#7b826f}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.used{fill:#75806b}.mine{fill:#ffb485}.free{fill:#172116;stroke:#75806b}.poolA{fill:#33432e;stroke:#75806b}.poolB{fill:#2b3a35;stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker></defs><rect class="bg" width="760" height="420"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Two hubs, no root: nothing would order the claims</text><text class="accent" x="732" y="40" font-size="15" text-anchor="end">ILLUSTRATION</text><rect class="panel" x="40" y="70" width="300" height="74" rx="4"/><text class="ink" x="190.0" y="100" font-size="18" text-anchor="middle">Outside hub</text><text class="muted" x="190.0" y="124" font-size="14" text-anchor="middle">aida-store ref</text><rect class="panel" x="420" y="70" width="300" height="74" rx="4"/><text class="ink" x="570.0" y="100" font-size="18" text-anchor="middle">Inside hub (air-gapped)</text><text class="muted" x="570.0" y="124" font-size="14" text-anchor="middle">its own aida-store ref</text><rect class="panel" x="40" y="210" width="300" height="64" rx="4"/><text class="ink" x="190.0" y="240" font-size="18" text-anchor="middle">Outside clone</text><text class="muted" x="190.0" y="264" font-size="14" text-anchor="middle">if it could claim 100–199: accepted</text><rect class="panel" x="420" y="210" width="300" height="64" rx="4"/><text class="ink" x="570.0" y="240" font-size="18" text-anchor="middle">Inside clone</text><text class="muted" x="570.0" y="264" font-size="14" text-anchor="middle">if it could claim 100–199: accepted</text><path class="edge" d="M190 210L190 148" marker-end="url(#arrow)"/><path class="edge" d="M570 210L570 148" marker-end="url(#arrow)"/><path class="bad" d="M190 274L300 330"/><path class="bad" d="M570 274L460 330"/><rect class="panel" x="150" y="330" width="460" height="70" rx="4"/><text class="ink" x="380.0" y="360" font-size="18" text-anchor="middle">Stores meet: both would claim 100–199</text><text class="muted" x="380.0" y="384" font-size="14" text-anchor="middle">the built sync check refuses; repair is manual</text></svg>
