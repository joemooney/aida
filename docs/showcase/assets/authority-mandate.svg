<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">A mandate: started by a person, scoped, time-boxed, checked on every action</title><desc id="desc">A person at an interactive terminal starts a mandate with a scope such as ship-held, dispatch or drive, a duration window of 8 hours by default and at most 24, and optional overrides such as --include-supervised or --include-gate-paths. While the window is open, the advisor seat may execute covered privileged steps. Every ship re-checks the mandate, independent approval, and green CI. Operator-only specs remain with a human.</desc><!-- trace:TASK-2606 STORY-b6b1278890774ef993d2ebc327862470-762 | ai:antigravity --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.hl{fill:#f7dccd;stroke:#ba3916}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.zone{fill:none;stroke:#7b826f;stroke-width:1.5;stroke-dasharray:4 4}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.hl{fill:#4a2a1c;stroke:#ffb485}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.zone{stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker></defs><rect class="bg" width="760" height="440"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Mandates: human-started, scoped, time-boxed windows</text><rect class="panel" x="40" y="70" width="220" height="90" rx="4"/><text class="ink" x="150.0" y="100.0" font-size="18" text-anchor="middle">You, at a terminal</text><text class="muted" x="150.0" y="120.0" font-size="14" text-anchor="middle">mandate start</text><text class="muted" x="150.0" y="140.0" font-size="14" text-anchor="middle">renew · stop</text><rect class="hl" x="300" y="70" width="200" height="90" rx="4"/><text class="ink" x="400.0" y="100.0" font-size="18" text-anchor="middle">Mandate Window</text><text class="muted" x="400.0" y="120.0" font-size="14" text-anchor="middle">scope + expiry</text><text class="muted" x="400.0" y="140.0" font-size="14" text-anchor="middle">8h default, 24h max</text><rect class="panel" x="540" y="70" width="180" height="90" rx="4"/><text class="ink" x="630.0" y="110.0" font-size="18" text-anchor="middle">Advisor seat</text><text class="muted" x="630.0" y="130.0" font-size="14" text-anchor="middle">privileged steps in scope</text><path class="edge" d="M260 115L296 115" marker-end="url(#arrow)"/><path class="edge" d="M500 115L536 115" marker-end="url(#arrow)"/><rect class="panel" x="40" y="215" width="200" height="120" rx="4"/><text class="ink" x="140.0" y="245.0" font-size="18" text-anchor="middle">Scopes &amp; Opt-ins</text><text class="muted" x="140.0" y="267.0" font-size="13.5" text-anchor="middle">ship-held · dispatch · drive</text><text class="muted" x="140.0" y="287.0" font-size="13" text-anchor="middle">--include-supervised</text><text class="muted" x="140.0" y="307.0" font-size="13" text-anchor="middle">--include-gate-paths</text><rect class="panel" x="280" y="215" width="200" height="120" rx="4"/><text class="ink" x="380.0" y="250.0" font-size="18" text-anchor="middle">Every ship checks</text><text class="muted" x="380.0" y="274.0" font-size="14" text-anchor="middle">mandate window,</text><text class="muted" x="380.0" y="294.0" font-size="14" text-anchor="middle">independent approval,</text><text class="muted" x="380.0" y="314.0" font-size="14" text-anchor="middle">and green CI</text><rect class="panel" x="520" y="215" width="200" height="120" rx="4"/><text class="ink" x="620.0" y="250.0" font-size="18" text-anchor="middle">Stays with you</text><text class="muted" x="620.0" y="274.0" font-size="14" text-anchor="middle">operator-only specs,</text><text class="muted" x="620.0" y="294.0" font-size="14" text-anchor="middle">unopted protected</text><text class="muted" x="620.0" y="314.0" font-size="14" text-anchor="middle">authority paths</text><path class="edge" d="M340 160L160 211" marker-end="url(#arrow)"/><path class="edge" d="M600 160L400 211" marker-end="url(#arrow)"/><text class="muted" x="380" y="376" font-size="13.5" text-anchor="middle">Supervised specs require --include-supervised; protected gate paths require</text><text class="muted" x="380" y="396" font-size="13.5" text-anchor="middle">--include-gate-paths on mandate trains. Operator-only specs are never covered.</text></svg>
