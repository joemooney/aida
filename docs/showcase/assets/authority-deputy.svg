<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">The deputy runs submitted jobs under your grant, without a terminal unless you allow it</title><desc id="desc">A session submits a command to the deputy spool. The deputy, started in your terminal under your grant, runs AIDA commands by default and other programs only when you allow them. A job runs on a terminal only when it matches an entry you set at your terminal; every other job runs without one. Each job is recorded in a ledger and its result mailed to the submitting session. A per-deputy command policy is planned</desc><!-- trace:TASK-2606 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.hl{fill:#f7dccd;stroke:#ba3916}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.zone{fill:none;stroke:#7b826f;stroke-width:1.5;stroke-dasharray:4 4}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.hl{fill:#4a2a1c;stroke:#ffb485}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.zone{stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker></defs><rect class="bg" width="760" height="400"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">The deputy: your grant, jobs others hand it</text><rect class="panel" x="40" y="80" width="200" height="84" rx="4"/><text class="ink" x="140.0" y="117.0" font-size="18" text-anchor="middle">Agent session</text><text class="muted" x="140.0" y="137.0" font-size="14" text-anchor="middle">deputy submit</text><rect class="hl" x="290" y="80" width="200" height="84" rx="4"/><text class="ink" x="390.0" y="117.0" font-size="18" text-anchor="middle">Deputy</text><text class="muted" x="390.0" y="137.0" font-size="14" text-anchor="middle">in your terminal</text><rect class="panel" x="540" y="80" width="180" height="84" rx="4"/><text class="ink" x="630.0" y="117.0" font-size="18" text-anchor="middle">Your grant</text><text class="muted" x="630.0" y="137.0" font-size="14" text-anchor="middle">from role enter</text><path class="edge" d="M240 122L286 122" marker-end="url(#arrow)"/><path class="edge" d="M540 122L494 122" marker-end="url(#arrow)"/><rect class="panel" x="40" y="230" width="200" height="96" rx="4"/><text class="ink" x="140.0" y="273.0" font-size="18" text-anchor="middle">Runs by default</text><text class="muted" x="140.0" y="293.0" font-size="14" text-anchor="middle">aida commands only</text><rect class="panel" x="280" y="230" width="200" height="96" rx="4"/><text class="ink" x="380.0" y="263.0" font-size="18" text-anchor="middle">Terminal?</text><text class="muted" x="380.0" y="283.0" font-size="14" text-anchor="middle">only for entries</text><text class="muted" x="380.0" y="303.0" font-size="14" text-anchor="middle">you allow</text><rect class="panel" x="520" y="230" width="200" height="96" rx="4"/><text class="ink" x="620.0" y="273.0" font-size="18" text-anchor="middle">Ledger and mail</text><text class="muted" x="620.0" y="293.0" font-size="14" text-anchor="middle">who, what, exit code</text><path class="edge" d="M330 164L150 226" marker-end="url(#arrow)"/><path class="edge" d="M390 164L380 226" marker-end="url(#arrow)"/><path class="edge" d="M450 164L610 226" marker-end="url(#arrow)"/><text class="accent" x="732" y="40" font-size="13" text-anchor="end">command policy: PLANNED</text><text class="muted" x="380" y="370" font-size="14" text-anchor="middle">When your grant expires or is revoked, the deputy finishes running jobs and exits.</text></svg>
