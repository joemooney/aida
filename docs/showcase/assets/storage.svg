<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">A project-owned record with distinct operational layers</title><desc id="desc">The canonical Git-backed spec graph is separate from rebuildable cache and local operational evidence.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c7c3b7"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8b9185"/></marker></defs><rect width="100%" height="100%" fill="#eeebe2"/><rect width="100%" height="100%" fill="url(#dots)"/><path d="M315 110 L363 110" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M635 110 L683 110" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><path d="M500 155 L500 233" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M820 155 L820 233" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="45" y="65" width="270" height="90" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="180.0" y="107.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Code repository</text><text x="180.0" y="130.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">source + code traces</text><rect x="365" y="65" width="270" height="90" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="500.0" y="107.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Git-backed spec graph</text><text x="500.0" y="130.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">canonical project intent</text><rect x="685" y="65" width="270" height="90" rx="3" fill="#252a26" stroke="#252a26"/><text x="820.0" y="107.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Agent interfaces</text><text x="820.0" y="130.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">CLI primary / MCP typed</text><rect x="365" y="235" width="270" height="80" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="500.0" y="272.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Read projection</text><text x="500.0" y="295.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">rebuildable SQLite cache</text><rect x="685" y="235" width="270" height="80" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="820.0" y="272.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Operational evidence</text><text x="820.0" y="295.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">local review / dispatch state</text></svg>