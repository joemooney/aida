<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">A role is a label; a grant is permission</title><desc id="desc">The roster lists the seats a person may take. Entering a seat at a terminal mints a grant for one of them. The role label decides what you see: views, routing and the statusline. Only the grant decides what you may do: a gated command checks the grant on every call, and a shell that only sets the role label is refused</desc><!-- trace:TASK-2606 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.hl{fill:#f7dccd;stroke:#ba3916}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.zone{fill:none;stroke:#7b826f;stroke-width:1.5;stroke-dasharray:4 4}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.hl{fill:#4a2a1c;stroke:#ffb485}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.zone{stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker></defs><rect class="bg" width="760" height="400"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Seeing is not the same as being allowed</text><rect class="panel" x="40" y="70" width="210" height="80" rx="4"/><text class="ink" x="145.0" y="105.0" font-size="18" text-anchor="middle">Roster</text><text class="muted" x="145.0" y="125.0" font-size="14" text-anchor="middle">seats you may ever take</text><rect class="hl" x="275" y="70" width="210" height="80" rx="4"/><text class="ink" x="380.0" y="105.0" font-size="18" text-anchor="middle">Grant</text><text class="muted" x="380.0" y="125.0" font-size="14" text-anchor="middle">the seat this session holds</text><rect class="panel" x="510" y="70" width="210" height="80" rx="4"/><text class="ink" x="615.0" y="105.0" font-size="18" text-anchor="middle">Gated command</text><text class="muted" x="615.0" y="125.0" font-size="14" text-anchor="middle">checks the grant each call</text><path class="edge" d="M250 110L271 110" marker-end="url(#arrow)"/><text class="muted" x="262" y="168" font-size="13" text-anchor="middle">role enter</text><path class="edge" d="M485 110L506 110" marker-end="url(#arrow)"/><text class="ink" x="615" y="172" font-size="14" text-anchor="middle">allowed</text><rect class="panel" x="275" y="250" width="210" height="80" rx="4"/><text class="ink" x="380.0" y="285.0" font-size="18" text-anchor="middle">Role label</text><text class="muted" x="380.0" y="305.0" font-size="14" text-anchor="middle">what you see and route</text><rect class="panel" x="510" y="250" width="210" height="80" rx="4"/><text class="ink" x="615.0" y="285.0" font-size="18" text-anchor="middle">Views and routing</text><text class="muted" x="615.0" y="305.0" font-size="14" text-anchor="middle">queue, statusline, prompts</text><path class="edge" d="M485 290L506 290" marker-end="url(#arrow)"/><path class="bad" d="M380 250L560 154" marker-end="url(#xarrow)"/><text class="accent" x="500" y="222" font-size="14" text-anchor="start">label alone: refused</text><text class="muted" x="380" y="372" font-size="15" text-anchor="middle">Setting the role variable by hand changes only what you see.</text></svg>
