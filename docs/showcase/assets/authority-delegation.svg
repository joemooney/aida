<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Delegation: a direct grant hands down named child seats, one level only</title><desc id="desc">A person at a terminal enters the advisor seat with a delegation set of implementer and reviewer, and receives a direct grant. A launcher issues each agent a child grant for one seat from that set. A launch that asks for a seat outside the set is refused. A child grant cannot delegate further, shares the parent expiry and stops when the parent is revoked</desc><!-- trace:TASK-2606 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.hl{fill:#f7dccd;stroke:#ba3916}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.zone{fill:none;stroke:#7b826f;stroke-width:1.5;stroke-dasharray:4 4}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.hl{fill:#4a2a1c;stroke:#ffb485}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.zone{stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker></defs><rect class="bg" width="760" height="420"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Delegation: named seats, one level only</text><rect class="panel" x="40" y="70" width="300" height="84" rx="4"/><text class="ink" x="190.0" y="107.0" font-size="18" text-anchor="middle">You, at a terminal</text><text class="muted" x="190.0" y="127.0" font-size="14" text-anchor="middle">role enter advisor</text><rect class="hl" x="420" y="70" width="300" height="84" rx="4"/><text class="ink" x="570.0" y="107.0" font-size="18" text-anchor="middle">Direct grant: advisor</text><text class="muted" x="570.0" y="127.0" font-size="14" text-anchor="middle">may hand down: implementer, reviewer</text><path class="edge" d="M340 112L416 112" marker-end="url(#arrow)"/><rect class="panel" x="40" y="250" width="200" height="80" rx="4"/><text class="ink" x="140.0" y="285.0" font-size="18" text-anchor="middle">Child: implementer</text><text class="muted" x="140.0" y="305.0" font-size="14" text-anchor="middle">one launched agent</text><rect class="panel" x="280" y="250" width="200" height="80" rx="4"/><text class="ink" x="380.0" y="285.0" font-size="18" text-anchor="middle">Child: reviewer</text><text class="muted" x="380.0" y="305.0" font-size="14" text-anchor="middle">one launched agent</text><rect class="panel" x="520" y="250" width="200" height="80" rx="4"/><text class="ink" x="620.0" y="285.0" font-size="18" text-anchor="middle">Child: advisor?</text><text class="muted" x="620.0" y="305.0" font-size="14" text-anchor="middle">not in the set</text><path class="edge" d="M500 154L160 246" marker-end="url(#arrow)"/><path class="edge" d="M560 154L390 246" marker-end="url(#arrow)"/><path class="bad" d="M640 154L620 246" marker-end="url(#xarrow)"/><text class="accent" x="640" y="205" font-size="14" text-anchor="start">refused</text><path class="bad" d="M140 330L140 372" marker-end="url(#xarrow)"/><text class="accent" x="160" y="360" font-size="14" text-anchor="start">cannot delegate onward</text><text class="muted" x="380" y="404" font-size="14" text-anchor="middle">Children share the parent expiry and stop when the parent is revoked.</text></svg>
