<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Delegation: named seats bounded by the parent grant</title><desc id="desc">A person at a terminal enters the advisor seat with a delegation set of implementer, reviewer, advisor and integrator, and receives a direct grant. A launcher issues each agent a child grant for one seat from that set. Advisor and integrator children inherit the validated parent delegation set and can delegate onward within it; agent new --delegate-seat can narrow that set. Implementer and reviewer children cannot delegate onward. Requests outside the parent set are refused. Descendants expire with their grant chain and stop when any ancestor is revoked.</desc><!-- trace:TASK-2606 | ai:claude --><!-- trace:TASK-b6b1278890774ef993d2ebc327862470-903 | ai:codex --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.hl{fill:#f7dccd;stroke:#ba3916}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.zone{fill:none;stroke:#7b826f;stroke-width:1.5;stroke-dasharray:4 4}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.hl{fill:#4a2a1c;stroke:#ffb485}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.zone{stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker></defs><rect class="bg" width="760" height="480"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Delegation: named seats, bounded by the parent</text><rect class="panel" x="40" y="70" width="300" height="84" rx="4"/><text class="ink" x="190.0" y="107.0" font-size="18" text-anchor="middle">You, at a terminal</text><text class="muted" x="190.0" y="127.0" font-size="14" text-anchor="middle">role enter advisor</text><rect class="hl" x="420" y="70" width="300" height="84" rx="4"/><text class="ink" x="570.0" y="107.0" font-size="18" text-anchor="middle">Direct grant: advisor</text><text class="muted" x="570.0" y="127.0" font-size="12" text-anchor="middle">set: implementer, reviewer, advisor, integrator</text><path class="edge" d="M340 112L416 112" marker-end="url(#arrow)"/><rect class="panel" x="40" y="250" width="200" height="80" rx="4"/><text class="ink" x="140.0" y="285.0" font-size="18" text-anchor="middle">Child: implementer</text><text class="muted" x="140.0" y="305.0" font-size="14" text-anchor="middle">one launched agent</text><rect class="panel" x="280" y="250" width="200" height="80" rx="4"/><text class="ink" x="380.0" y="285.0" font-size="18" text-anchor="middle">Child: reviewer</text><text class="muted" x="380.0" y="305.0" font-size="14" text-anchor="middle">one launched agent</text><rect class="panel" x="520" y="250" width="200" height="80" rx="4"/><text class="ink" x="620.0" y="285.0" font-size="18" text-anchor="middle">Advisor / integrator</text><text class="muted" x="620.0" y="305.0" font-size="14" text-anchor="middle">child: one seat from the set</text><path class="edge" d="M500 154L160 246" marker-end="url(#arrow)"/><path class="edge" d="M560 154L390 246" marker-end="url(#arrow)"/><path class="edge" d="M640 154L620 246" marker-end="url(#arrow)"/><text class="muted" x="260" y="358" font-size="14" text-anchor="middle">Implementer / reviewer: no onward delegation</text><path class="edge" d="M620 330L620 350" marker-end="url(#arrow)"/><text class="ink" x="620" y="374" font-size="14" text-anchor="middle">May delegate within parent set</text><text class="muted" x="620" y="394" font-size="13" text-anchor="middle">--delegate-seat can narrow it</text><text class="accent" x="380" y="428" font-size="14" text-anchor="middle">Requests outside the parent set are refused.</text><text class="muted" x="380" y="460" font-size="14" text-anchor="middle">Descendants expire with the grant chain; revoking any ancestor stops them.</text></svg>
