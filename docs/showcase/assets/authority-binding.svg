<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">A grant is bound to the terminal session that minted it</title><desc id="desc">Inside your terminal session, the role shell holds the grant and a session key in its keyring. An agent started there, its hooks and its sandboxed tool calls can present the grant, the tool calls by holding the key. A session started by the background agent daemon or a tmux server is outside that tree, holds no key, and is refused even if it has the grant id</desc><!-- trace:TASK-2606 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.hl{fill:#f7dccd;stroke:#ba3916}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.zone{fill:none;stroke:#7b826f;stroke-width:1.5;stroke-dasharray:4 4}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.hl{fill:#4a2a1c;stroke:#ffb485}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.zone{stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker></defs><rect class="bg" width="760" height="420"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Bound to a process tree, with a key for sandboxes</text><rect class="zone" x="28" y="60" width="470" height="320" rx="6"/><text class="muted" x="40" y="80" font-size="13" text-anchor="start">your terminal session</text><rect class="hl" x="60" y="90" width="220" height="76" rx="4"/><text class="ink" x="170.0" y="123.0" font-size="18" text-anchor="middle">Role shell</text><text class="muted" x="170.0" y="143.0" font-size="14" text-anchor="middle">grant + session key</text><rect class="panel" x="60" y="200" width="220" height="76" rx="4"/><text class="ink" x="170.0" y="233.0" font-size="18" text-anchor="middle">Agent you start</text><text class="muted" x="170.0" y="253.0" font-size="14" text-anchor="middle">its hooks use the grant</text><rect class="panel" x="60" y="300" width="220" height="64" rx="4"/><text class="ink" x="170.0" y="327.0" font-size="18" text-anchor="middle">Sandboxed tool call</text><text class="muted" x="170.0" y="347.0" font-size="14" text-anchor="middle">presents the key</text><rect class="panel" x="310" y="200" width="170" height="76" rx="4"/><text class="ink" x="395.0" y="233.0" font-size="18" text-anchor="middle">Keyring</text><text class="muted" x="395.0" y="253.0" font-size="14" text-anchor="middle">inherited by children</text><path class="edge" d="M170 166L170 196" marker-end="url(#arrow)"/><path class="edge" d="M170 276L170 296" marker-end="url(#arrow)"/><path class="edge" d="M280 128L395 196" marker-end="url(#arrow)"/><path class="edge" d="M395 276L284 318" marker-end="url(#arrow)"/><rect class="panel" x="530" y="290" width="200" height="90" rx="4"/><text class="ink" x="630.0" y="320.0" font-size="18" text-anchor="middle">Daemon or tmux</text><text class="muted" x="630.0" y="340.0" font-size="14" text-anchor="middle">session</text><text class="muted" x="630.0" y="360.0" font-size="14" text-anchor="middle">not a descendant</text><path class="bad" d="M530 345L284 345" marker-end="url(#xarrow)"/><text class="accent" x="630" y="250" font-size="14" text-anchor="middle">no key, outside the tree:</text><text class="accent" x="630" y="270" font-size="14" text-anchor="middle">refused, even with the id</text></svg>
