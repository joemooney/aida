<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">One hub orders every claim</title><desc id="desc">Clone A and Clone B both try to claim block 100 to 199 by pushing to the same hub. The hub accepts the first push. The second push is rejected because the store ref has moved, so Clone B fetches, sees the block is taken and claims 200 to 299 instead</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-277 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.used{fill:#5e635a}.mine{fill:#ba3916}.free{fill:#f4f1e9;stroke:#7b826f}.poolA{fill:#d9d3c2;stroke:#7b826f}.poolB{fill:#cfd6c4;stroke:#7b826f}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.used{fill:#75806b}.mine{fill:#ffb485}.free{fill:#172116;stroke:#75806b}.poolA{fill:#33432e;stroke:#75806b}.poolB{fill:#2b3a35;stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker></defs><rect class="bg" width="760" height="400"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">One hub: the push itself orders claims</text><rect class="panel" x="270" y="70" width="220" height="74" rx="4"/><text class="ink" x="380.0" y="100" font-size="18" text-anchor="middle">Hub</text><text class="muted" x="380.0" y="124" font-size="14" text-anchor="middle">aida-store ref</text><rect class="panel" x="40" y="250" width="220" height="74" rx="4"/><text class="ink" x="150.0" y="280" font-size="18" text-anchor="middle">Clone A</text><text class="muted" x="150.0" y="304" font-size="14" text-anchor="middle">claims block 100–199</text><rect class="panel" x="500" y="250" width="220" height="74" rx="4"/><text class="ink" x="610.0" y="280" font-size="18" text-anchor="middle">Clone B</text><text class="muted" x="610.0" y="304" font-size="14" text-anchor="middle">claims block 100–199</text><path class="edge" d="M150 250L300 148" marker-end="url(#arrow)"/><text class="ink" x="120" y="196" font-size="14" text-anchor="start">1. push accepted</text><path class="bad" d="M610 250L460 148" marker-end="url(#arrow)"/><text class="accent" x="560" y="196" font-size="14" text-anchor="start">2. push rejected:</text><text class="accent" x="560" y="214" font-size="14" text-anchor="start">the ref has moved</text><text class="muted" x="380" y="370" font-size="15" text-anchor="middle">Clone B fetches, sees 100–199 is taken, and claims 200–299 instead.</text></svg>
