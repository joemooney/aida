<g font-family="sans-serif" font-size="24" fill="#172116"><text x="28" y="44">Start with one bounded change</text><rect x="28" y="72" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="114">Discuss the outcome</text><text x="48" y="150" font-size="21" fill="#344331">People and the agent clarify success</text><rect x="28" y="220" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="262">Capture the agreement</text><text x="48" y="298" font-size="21" fill="#344331">Inspect the requirement before building</text><rect x="28" y="368" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="410">Inspect the change</text><text x="48" y="446" font-size="21" fill="#344331">Review implementation and evidence</text><rect x="28" y="516" width="584" height="110" rx="12" fill="#f4f1e9" stroke="#718066" stroke-width="2"/><text x="48" y="558">Return with context</text><text x="48" y="594" font-size="21" fill="#344331">Use intent and decisions next time</text><path d="M320 182V220m0 110v38m0 110v38" stroke="#913b17" stroke-width="4"/><text x="28" y="660" font-size="20">Operator setup first · Autonomy is optional</text></g></svg>
