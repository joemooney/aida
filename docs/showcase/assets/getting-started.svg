<title id="title">Begin with a conversation</title><desc id="desc">Discuss a bounded change, capture agreed intent, inspect implementation and evidence, then return with context. Operator setup connects the project and agent; autonomous delivery is optional.</desc><!-- trace:TASK-HOME-128 | ai:codex -->
