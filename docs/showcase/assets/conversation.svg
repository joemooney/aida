<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">People communicate intent; agents operate the factory</title><desc id="desc">A human request passes to an advisor, through agent execution and independent review, then returns as evidence.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c7c3b7"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8b9185"/></marker></defs><rect width="100%" height="100%" fill="#eeebe2"/><rect width="100%" height="100%" fill="url(#dots)"/><path d="M245 100 L328 100" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><path d="M610 100 L693 100" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><path d="M470 145 L470 232" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M830 145 L830 232" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><path d="M695 275 L612 275" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="35" y="55" width="210" height="90" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="140.0" y="97.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Your intent</text><text x="140.0" y="120.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">outcomes / decisions</text><rect x="330" y="55" width="280" height="90" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="470.0" y="97.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">AIDA-aware advisor</text><text x="470.0" y="120.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">capture / clarify / route</text><rect x="695" y="55" width="270" height="90" rx="3" fill="#252a26" stroke="#252a26"/><text x="830.0" y="97.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Agent delivery</text><text x="830.0" y="120.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">implement / test / review</text><rect x="330" y="235" width="280" height="80" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="470.0" y="272.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Project record</text><text x="470.0" y="295.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">specs / decisions / history</text><rect x="695" y="235" width="270" height="80" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="830.0" y="272.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Evidence returned</text><text x="830.0" y="295.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">change / verdict / result</text></svg>