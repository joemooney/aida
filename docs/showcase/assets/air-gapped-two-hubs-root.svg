<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">A root will split the number space between hubs (planned)</title><desc id="desc">Planned mechanism, not available in the current release. The root clone will own the unallocated numbers. It will grant one pool, numbers 1 to 4999, homed on the outside hub, and another, 5000 to 9999, homed on the inside hub. Clones will claim blocks only from the pool homed on their own hub, such as 100 to 199 outside and 5100 to 5199 inside. The ranges cannot overlap, so the stores will merge cleanly</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-277 | ai:claude --><style>.bg{fill:#f4f1e9}.panel{fill:#e9e5da;stroke:#7b826f}.ink{fill:#252a26}.muted{fill:#5e635a}.accent{fill:#ba3916}.edge{stroke:#5e635a;stroke-width:2;fill:none}.bad{stroke:#ba3916;stroke-width:2;fill:none;stroke-dasharray:6 5}.used{fill:#5e635a}.mine{fill:#ba3916}.free{fill:#f4f1e9;stroke:#7b826f}.poolA{fill:#d9d3c2;stroke:#7b826f}.poolB{fill:#cfd6c4;stroke:#7b826f}text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#172116}.panel{fill:#263422;stroke:#75806b}.ink{fill:#f4f1e9}.muted{fill:#cbd0c4}.accent{fill:#ffb485}.edge{stroke:#cbd0c4}.bad{stroke:#ffb485}.used{fill:#75806b}.mine{fill:#ffb485}.free{fill:#172116;stroke:#75806b}.poolA{fill:#33432e;stroke:#75806b}.poolB{fill:#2b3a35;stroke:#75806b}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker></defs><rect class="bg" width="760" height="420"/><text class="ink" x="28" y="40" font-size="22" text-anchor="start">Two hubs with a root: split the space first</text><text class="accent" x="732" y="40" font-size="15" text-anchor="end">PLANNED</text><rect class="panel" x="250" y="64" width="260" height="70" rx="4"/><text class="ink" x="380.0" y="94" font-size="18" text-anchor="middle">Root clone</text><text class="muted" x="380.0" y="118" font-size="14" text-anchor="middle">owns the unallocated numbers</text><rect class="poolA" x="40" y="190" width="300" height="70" rx="4"/><text class="ink" x="190.0" y="220" font-size="18" text-anchor="middle">Pool 1–4999</text><text class="muted" x="190.0" y="244" font-size="14" text-anchor="middle">homed on the outside hub</text><rect class="poolB" x="420" y="190" width="300" height="70" rx="4"/><text class="ink" x="570.0" y="220" font-size="18" text-anchor="middle">Pool 5000–9999</text><text class="muted" x="570.0" y="244" font-size="14" text-anchor="middle">homed on the inside hub</text><path class="edge" d="M330 134L210 190" marker-end="url(#arrow)"/><path class="edge" d="M430 134L560 190" marker-end="url(#arrow)"/><rect class="panel" x="40" y="300" width="300" height="56" rx="4"/><text class="ink" x="190.0" y="334.0" font-size="18" text-anchor="middle">Outside clone: block 100–199</text><rect class="panel" x="420" y="300" width="300" height="56" rx="4"/><text class="ink" x="570.0" y="334.0" font-size="18" text-anchor="middle">Inside clone: block 5100–5199</text><path class="edge" d="M190 260L190 300" marker-end="url(#arrow)"/><path class="edge" d="M570 260L570 300" marker-end="url(#arrow)"/><text class="muted" x="380" y="392" font-size="15" text-anchor="middle">The ranges cannot overlap, so the stores merge cleanly.</text></svg>
