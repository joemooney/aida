<title id="title">Intent connects work and evidence</title><desc id="desc">Requirements and decisions connect implementation, validation, review and history. A later change returns to the recorded intent. The diagram is explanatory and is not a live status display or an assurance of complete evidence.</desc><!-- trace:TASK-HOME-128 | ai:codex -->
