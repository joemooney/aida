<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-labelledby="title desc"><title id="title">From intent and implementation to management evidence</title><desc id="desc">Requirements, execution and review records feed reports; people and agents use them to investigate flow, traceability and reliability.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c7c3b7"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8b9185"/></marker></defs><rect width="100%" height="100%" fill="#eeebe2"/><rect width="100%" height="100%" fill="url(#dots)"/><path d="M285 72 L373 150" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M285 177 L373 172" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M285 282 L373 197" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M625 172 L713 172" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><rect x="35" y="35" width="250" height="75" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="160.0" y="69.5" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Intent record</text><text x="160.0" y="92.5" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">requirements / decisions</text><rect x="35" y="140" width="250" height="75" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="160.0" y="174.5" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Execution evidence</text><text x="160.0" y="197.5" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">history / usage / CI</text><rect x="35" y="245" width="250" height="75" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="160.0" y="279.5" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Review evidence</text><text x="160.0" y="302.5" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">verdicts / findings</text><rect x="375" y="125" width="250" height="95" rx="3" fill="#252a26" stroke="#252a26"/><text x="500.0" y="169.5" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Scoped reports</text><text x="500.0" y="192.5" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">coverage stays visible</text><rect x="715" y="125" width="250" height="95" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="840.0" y="169.5" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">People + agents</text><text x="840.0" y="192.5" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">investigate / decide / improve</text></svg>