<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">Four evidence categories for Metrics</title><desc id="desc">Reported today: flow, traces, load and tool reliability. Partial: usage, pricing and review classification. Derivable: additional joined analysis. Unsupported: proven ROI, equivalent human hours saved and reliable forecasts.</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-110 | ai:codex --><rect width="760" height="370" fill="#e9e5da"/><text x="28" y="42" font-family="sans-serif" font-size="24" fill="#172116">A metric is only as strong as its evidence.</text><rect x="28" y="72" width="338" height="96" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="106" font-family="sans-serif" font-size="21" fill="#913b17">Reported today</text><text x="42" y="141" font-family="sans-serif" font-size="13" fill="#344331">Flow, traces, load and tool reliability</text><rect x="393" y="72" width="338" height="96" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="106" font-family="sans-serif" font-size="21" fill="#913b17">Partial coverage</text><text x="407" y="141" font-family="sans-serif" font-size="13" fill="#344331">Usage, pricing and review classification</text><rect x="28" y="190" width="338" height="96" fill="#f4f1e9" stroke="#b6b9ab"/><text x="42" y="224" font-family="sans-serif" font-size="21" fill="#913b17">Derivable</text><text x="42" y="259" font-family="sans-serif" font-size="13" fill="#344331">Additional joins and coverage work</text><rect x="393" y="190" width="338" height="96" fill="#f4f1e9" stroke="#b6b9ab"/><text x="407" y="224" font-family="sans-serif" font-size="21" fill="#913b17">Not supported</text><text x="407" y="259" font-family="sans-serif" font-size="13" fill="#344331">Proven ROI, hours saved and forecasts</text><text x="28" y="341" font-family="sans-serif" font-size="16" fill="#172116">Capability map · No live dashboard values or claimed savings</text></svg>