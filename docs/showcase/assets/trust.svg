<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">Autonomy and authority are separate</title><desc id="desc">Human authorization and spec readiness feed execution; review and CI gate the resulting merge.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c7c3b7"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8b9185"/></marker></defs><rect width="100%" height="100%" fill="#eeebe2"/><rect width="100%" height="100%" fill="url(#dots)"/><path d="M295 85 L363 155" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M295 260 L363 195" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M625 155 L698 85" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><path d="M830 125 L830 218" stroke="#8b9185" stroke-width="1.5" fill="none" marker-end="url(#arrow)" /><rect x="35" y="45" width="260" height="80" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="165.0" y="82.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Human authorization</text><text x="165.0" y="105.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">grants / mandates / limits</text><rect x="35" y="220" width="260" height="80" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="165.0" y="257.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Spec readiness</text><text x="165.0" y="280.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">criteria / decisions / mode</text><rect x="365" y="130" width="260" height="90" rx="3" fill="#252a26" stroke="#252a26"/><text x="495.0" y="172.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Agent execution</text><text x="495.0" y="195.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">within the selected contract</text><rect x="700" y="45" width="260" height="80" rx="3" fill="#f4f1e9" stroke="#a8ad9f"/><text x="830.0" y="82.0" fill="#252a26" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Independent review</text><text x="830.0" y="105.0" fill="#252a26" text-anchor="middle" font-family="monospace" font-size="10">verdict at exact commit</text><rect x="700" y="220" width="260" height="80" rx="3" fill="#ba3916" stroke="#ba3916"/><text x="830.0" y="257.0" fill="#fff8ed" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Merge gates</text><text x="830.0" y="280.0" fill="#fff8ed" text-anchor="middle" font-family="monospace" font-size="10">CI / holds / authority</text></svg>