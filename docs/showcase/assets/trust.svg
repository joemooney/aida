<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Evidence and authority remain separate</title><desc id="desc">Agreed intent links to a change and independent current-head review. CI, holds and validated authority are separate shipping checks. Merge does not mean production deployment.</desc><!-- trace:TASK-B6B1278890774EF993D2EBC327862470-109 | ai:codex --><rect width="760" height="420" fill="#172116"/><text x="28" y="44" font-family="sans-serif" font-size="24" fill="#f4f1e9">Evidence for the change. Authority for the action.</text><rect x="28" y="76" width="338" height="102" fill="#263422" stroke="#75806b"/><text x="44" y="112" font-family="sans-serif" font-size="22" fill="#ffb485">Intent</text><text x="44" y="148" font-family="sans-serif" font-size="14" fill="#f4f1e9">Agreed behavior and acceptance</text><rect x="393" y="76" width="338" height="102" fill="#263422" stroke="#75806b"/><text x="409" y="112" font-family="sans-serif" font-size="22" fill="#ffb485">Review</text><text x="409" y="148" font-family="sans-serif" font-size="14" fill="#f4f1e9">Independent evidence at a commit</text><rect x="28" y="201" width="338" height="102" fill="#263422" stroke="#75806b"/><text x="44" y="237" font-family="sans-serif" font-size="22" fill="#ffb485">CI and holds</text><text x="44" y="273" font-family="sans-serif" font-size="14" fill="#f4f1e9">Applicable checks and clearances</text><rect x="393" y="201" width="338" height="102" fill="#263422" stroke="#75806b"/><text x="409" y="237" font-family="sans-serif" font-size="22" fill="#ffb485">Authority</text><text x="409" y="273" font-family="sans-serif" font-size="14" fill="#f4f1e9">Validated grants and mandate scope</text><text x="28" y="375" font-family="sans-serif" font-size="18" fill="#f4f1e9">Selecting a mode grants no authority.</text><text x="28" y="401" font-family="sans-serif" font-size="15" fill="#cbd0c4">Integration and production deployment are separate outcomes.</text></svg>