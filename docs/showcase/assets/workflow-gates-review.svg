<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-labelledby="title desc">
  <title id="title">Act 2: Inspection gates, independent review, delta review, CI tiers, ratchets, and merge holds</title>
  <desc id="desc">After an implementer pushes a commit and opens a PR or MR, the change passes through three independent gates before it can land: an independent reviewer (with rework rounds and delta reviews for follow-up commits), two-tier CI (fast PR guards including ratchets and lock tests versus full seven-shard ci:full), and the merge-hold gate which blocks landing until cleared by an operator, mandate, or deputy.</desc>
  <!-- trace:STORY-b6b1278890774ef993d2ebc327862470-762 | ai:antigravity -->
  <style>
    .bg { fill: #f4f1e9; }
    .panel { fill: #e9e5da; stroke: #7b826f; stroke-width: 1.5; }
    .box { fill: #faf8f3; stroke: #7b826f; stroke-width: 1.5; }
    .hl { fill: #f7dccd; stroke: #ba3916; stroke-width: 1.8; }
    .green { fill: #dff0d8; stroke: #2f855a; stroke-width: 1.6; }
    .red { fill: #fde8e8; stroke: #c53030; stroke-width: 1.6; }
    .ink { fill: #172116; }
    .muted { fill: #4a5446; }
    .accent { fill: #913b17; font-weight: 600; }
    .ok-text { fill: #22543d; font-weight: 700; }
    .bad-text { fill: #9b2c2c; font-weight: 700; }
    .edge { stroke: #5e635a; stroke-width: 2; fill: none; }
    .edge-loop { stroke: #ba3916; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141c13; }
      .panel { fill: #1e2a1c; stroke: #687360; }
      .box { fill: #263423; stroke: #75806b; }
      .hl { fill: #42261a; stroke: #ffb485; }
      .green { fill: #1c3829; stroke: #68d391; }
      .red { fill: #441c1c; stroke: #fc8181; }
      .ink { fill: #f4f1e9; }
      .muted { fill: #c4cabe; }
      .accent { fill: #ffb485; }
      .ok-text { fill: #9ae6b4; }
      .bad-text { fill: #feb2b2; }
      .edge { stroke: #a8b0a0; }
      .edge-loop { stroke: #ffb485; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="muted"/>
    </marker>
    <marker id="larrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="accent"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="480" rx="6"/>
  <text class="ink" x="28" y="36" font-size="20" font-weight="700">The Inspection Gates: Review, Delta Review, CI Tiers, Ratchets &amp; Holds</text>

  <!-- Commit + PR/MR -->
  <rect class="panel" x="28" y="62" width="156" height="145" rx="6"/>
  <text class="ink" x="106" y="90" font-size="15" font-weight="700" text-anchor="middle">Commit &amp; PR/MR</text>
  <text class="muted" x="106" y="114" font-size="12" text-anchor="middle">Implementer pushes</text>
  <text class="muted" x="106" y="132" font-size="12" text-anchor="middle">branch with trailer</text>
  <text class="mono accent" x="106" y="154" font-size="11" text-anchor="middle">(SPEC-ID)</text>
  <text class="muted" x="106" y="178" font-size="12" text-anchor="middle">Spec becomes Done;</text>
  <text class="muted" x="106" y="194" font-size="12" text-anchor="middle">awaits 3 gates</text>

  <path class="edge" d="M184 134L214 134" marker-end="url(#arrow)"/>

  <!-- Gate 1: Independent Review & Delta Review -->
  <rect class="box" x="218" y="62" width="200" height="210" rx="6"/>
  <text class="ink" x="318" y="88" font-size="15" font-weight="700" text-anchor="middle">Gate 1: Review Seat</text>
  <text class="muted" x="318" y="110" font-size="12" text-anchor="middle">Different seat from author</text>
  <rect class="panel" x="234" y="122" width="168" height="60" rx="4"/>
  <text class="ink" x="318" y="144" font-size="12.5" font-weight="700" text-anchor="middle">Full vs. Delta Review</text>
  <text class="muted" x="318" y="162" font-size="11.5" text-anchor="middle">After rework, delta review</text>
  <text class="muted" x="318" y="176" font-size="11.5" text-anchor="middle">checks new commits + fixes</text>
  <text class="muted" x="318" y="206" font-size="12" text-anchor="middle">Verdict pinned to head SHA</text>
  <text class="muted" x="318" y="224" font-size="12" text-anchor="middle">&amp; read via safe file handle</text>
  <text class="accent" x="318" y="252" font-size="12" text-anchor="middle">Changes requested → Rework</text>

  <!-- Rework loop arrow -->
  <path class="edge-loop" d="M260 272V302H106V210" marker-end="url(#larrow)"/>
  <text class="accent" x="182" y="296" font-size="11.5" text-anchor="middle">Rework round</text>

  <path class="edge" d="M418 134L448 134" marker-end="url(#arrow)"/>

  <!-- Gate 2: Two-Tier CI (Fast Guards + Ratchets vs ci:full) -->
  <rect class="box" x="452" y="62" width="200" height="210" rx="6"/>
  <text class="ink" x="552" y="88" font-size="15" font-weight="700" text-anchor="middle">Gate 2: Two-Tier CI</text>
  <rect class="panel" x="468" y="102" width="168" height="72" rx="4"/>
  <text class="ink" x="552" y="122" font-size="12.5" font-weight="700" text-anchor="middle">Fast Tier (PR default)</text>
  <text class="muted" x="552" y="140" font-size="11.5" text-anchor="middle">• Compile + doc drift guards</text>
  <text class="muted" x="552" y="156" font-size="11.5" text-anchor="middle">• Ratchets (no new debt)</text>
  <text class="muted" x="552" y="170" font-size="11.5" text-anchor="middle">• Lock &amp; boundary checks</text>

  <rect class="hl" x="468" y="184" width="168" height="72" rx="4"/>
  <text class="ink" x="552" y="204" font-size="12.5" font-weight="700" text-anchor="middle">Full Tier (ci:full)</text>
  <text class="muted" x="552" y="222" font-size="11.5" text-anchor="middle">• All 7 test shards + lock tests</text>
  <text class="muted" x="552" y="238" font-size="11.5" text-anchor="middle">• Required for direct ship</text>
  <text class="muted" x="552" y="252" font-size="11.5" text-anchor="middle">  and every Merge Train</text>

  <path class="edge" d="M652 134L682 134" marker-end="url(#arrow)"/>

  <!-- Gate 3: Merge-Hold & Clear -->
  <rect class="box" x="686" y="62" width="146" height="210" rx="6"/>
  <text class="ink" x="759" y="88" font-size="15" font-weight="700" text-anchor="middle">Gate 3: Hold</text>
  <rect class="red" x="700" y="104" width="118" height="58" rx="4"/>
  <text class="bad-text" x="759" y="126" font-size="12" text-anchor="middle">merge-hold</text>
  <text class="muted" x="759" y="146" font-size="11" text-anchor="middle">Stops merge even</text>
  <text class="muted" x="759" y="158" font-size="11" text-anchor="middle">when CI is Green</text>

  <rect class="green" x="700" y="176" width="118" height="78" rx="4"/>
  <text class="ok-text" x="759" y="198" font-size="12" text-anchor="middle">Clear Hold</text>
  <text class="muted" x="759" y="216" font-size="11" text-anchor="middle">• Human clear</text>
  <text class="muted" x="759" y="232" font-size="11" text-anchor="middle">• Mandate scope</text>
  <text class="muted" x="759" y="248" font-size="11" text-anchor="middle">• Rework approval</text>

  <!-- Bottom summary: Green vs Red & Main-Track Candidate -->
  <rect class="panel" x="28" y="330" width="804" height="122" rx="6"/>
  <text class="ink" x="48" y="358" font-size="16" font-weight="700">Outcome: Blocker vs. Main-Track Candidate</text>
  <rect class="red" x="48" y="374" width="368" height="62" rx="4"/>
  <text class="bad-text" x="64" y="398" font-size="13">RED / BLOCKED (Blocker active)</text>
  <text class="muted" x="64" y="418" font-size="12">Failing CI shard, unapproved head, stale workflow digest, or active merge-hold.</text>

  <rect class="green" x="444" y="374" width="368" height="62" rx="4"/>
  <text class="ok-text" x="460" y="398" font-size="13">GREEN (Main-Track Candidate)</text>
  <text class="muted" x="460" y="418" font-size="12">Approved current head + Green CI + No holds → Ready for Ship or Merge Train.</text>
</svg>
