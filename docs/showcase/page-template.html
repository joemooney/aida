{{scripts}}

<header class="guide-header"><a class="brand" href="index.html"><span class="brand-symbol" aria-hidden="true"><img src="assets/aida-icon-64.png" width="36" height="36" alt=""></span>AIDA<span class="brand-caption">THE GOVERNED SOFTWARE FACTORY</span></a><nav aria-label="Product navigation"><a href="index.html">Product</a>{{nav}}</nav><div class="nav-actions"><div class="theme-switch" role="group" aria-label="Color theme"><button type="button" data-theme-pick="light" aria-pressed="false" aria-label="Light theme" title="Light"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-theme-pick="dark" aria-pressed="false" aria-label="Dark theme" title="Dark"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><button type="button" data-theme-pick="system" aria-pressed="false" aria-label="System theme" title="System"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></div></div></header>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var themePicks = document.querySelectorAll('[data-theme-pick]');
  var mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function getStoredThemePref() {
    try {
      var raw = localStorage.getItem('aida-theme');
      if (raw === 'light' || raw === 'paper') return 'light';
      if (raw === 'dark' || raw === 'terminal') return 'dark';
      if (raw === 'system') return 'system';
    } catch (e) {}
    return 'light';
  }
  function applyThemePref(pref, persist) {
    var effective = pref === 'dark' ? 'terminal' : (pref === 'light' ? 'paper' : (mql && mql.matches ? 'terminal' : 'paper'));
    document.documentElement.setAttribute('data-theme', effective);
    if (persist) {
      try { localStorage.setItem('aida-theme', pref); } catch (e) {}
    }
    themePicks.forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-theme-pick') === pref));
    });
  }
  applyThemePref(getStoredThemePref(), false);
  themePicks.forEach(function (btn) {
    if (btn.getAttribute('data-bound')) return;
    btn.setAttribute('data-bound', 'true');
    btn.addEventListener('click', function () {
      applyThemePref(btn.getAttribute('data-theme-pick'), true);
    });
  });
  if (mql && mql.addEventListener) {
    mql.addEventListener('change', function () {
      if (getStoredThemePref() === 'system') applyThemePref('system', false);
    });
  }
  var navGroups = document.querySelectorAll('.nav-group');
  function closeNav(except) {
    navGroups.forEach(function (g) {
      if (g === except) return;
      g.removeAttribute('data-open');
      var b = g.querySelector('.nav-trigger');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
  }
  navGroups.forEach(function (g) {
    var b = g.querySelector('.nav-trigger');
    if (!b || b.getAttribute('data-nav-bound')) return;
    b.setAttribute('data-nav-bound', 'true');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = g.getAttribute('data-open') === 'true';
      closeNav(g);
      if (open) {
        g.removeAttribute('data-open');
        b.setAttribute('aria-expanded', 'false');
      } else {
        g.setAttribute('data-open', 'true');
        b.setAttribute('aria-expanded', 'true');
      }
    });
  });
  document.addEventListener('click', function () { closeNav(null); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(null); });
  if (!Array.isArray(window.AIDA_DOCS)) return;
  var terms = {}, bySlug = {};
  for (var i = 0; i < window.AIDA_DOCS.length; i++) {
    var d = window.AIDA_DOCS[i];
    if (d && d.kind === 'term' && d.url) {
      terms[d.url] = d;
      var hash = d.url.indexOf('#');
      if (hash !== -1) {
        var frag = d.url.slice(hash);
        terms[frag] = d;
        bySlug[frag.slice(1)] = d;
      }
    }
  }
  var aliases = {
    'pr': 'pull-request', 'mr': 'pull-request', 'pr/mr': 'pull-request',
    'lanes': 'lane', 'leases': 'lease', 'grants': 'grant', 'seats': 'seat',
    'riders': 'rider', 'trains': 'merge-train', 'train': 'merge-train',
    'gates': 'gate', 'ratchets': 'ratchet',
    'specs': 'spec', 'adrs': 'adr', 'worktrees': 'lane-vs-worktree', 'worktree': 'lane-vs-worktree',
    'cifull': 'full-ci-tier', 'ci:full': 'full-ci-tier', 'head': 'head', 'refs': 'refs',
    'cache.db': 'cache', '.aida/cache-db/cache.db': 'cache', 'cache.db-wal': 'wal', 'wal': 'wal',
    'aida-store': 'git-canonical', '.aida-store/': 'git-canonical', '.aida-store': 'git-canonical',
    'aida groom': 'groom', 'aida punt': 'punt', 'aida worktree gc': 'gc', 'git gc': 'gc',
    'runner_seat': 'runner-seat', 'aida:merge-hold': 'merge-hold',
    'in-progress': 'inprogress', 'in_progress': 'inprogress'
  };
  var pop = document.createElement('div');
  pop.className = 'glossary-pop';
  pop.setAttribute('role', 'tooltip');
  pop.setAttribute('aria-hidden', 'true');
  document.body.appendChild(pop);
  function summary(text) {
    if (!text) return '';
    var m = text.match(/^(.{25,210}?[.!?])(?:\s|$)/);
    var s = m ? m[1] : text.slice(0, 200);
    return s.length < text.length && !s.endsWith('.') ? s + '…' : s;
  }
  function show(el, term) {
    pop.innerHTML = '<div class="glossary-pop-head"><span>' + term.title.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span><span>GLOSSARY ↗</span></div><p class="glossary-pop-body">' + summary(term.text).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</p>';
    pop.setAttribute('data-visible', 'true');
    pop.setAttribute('aria-hidden', 'false');
    var r = el.getBoundingClientRect();
    var pw = pop.offsetWidth || 320, ph = pop.offsetHeight || 96;
    var left = Math.max(12, Math.min(r.left, window.innerWidth - pw - 12));
    var top = r.top - ph - 10;
    if (top < 12) top = r.bottom + 10;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }
  function hide() {
    pop.removeAttribute('data-visible');
    pop.setAttribute('aria-hidden', 'true');
  }
  function bindTooltip(a, term) {
    a.classList.add('glossary-term');
    a.addEventListener('mouseenter', function () { show(a, term); });
    a.addEventListener('mouseleave', hide);
    a.addEventListener('focus', function () { show(a, term); });
    a.addEventListener('blur', hide);
  }
  var links = document.querySelectorAll('.guide a[href*="glossary.html#"], .guide a[href^="#"]');
  links.forEach(function (a) {
    var href = a.getAttribute('href') || '';
    var key = href.startsWith('#') ? href : 'glossary.html#' + href.split('#')[1];
    var term = terms[key];
    if (term) bindTooltip(a, term);
  });
  var codes = document.querySelectorAll('.guide p code, .guide li code, .guide td code');
  codes.forEach(function (code) {
    if (code.closest('a, pre, h1, h2, h3')) return;
    var raw = (code.textContent || '').trim().toLowerCase();
    var key = aliases[raw] || raw.replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-');
    var term = bySlug[key];
    if (!term) return;
    var a = document.createElement('a');
    a.href = term.url;
    code.parentNode.insertBefore(a, code);
    a.appendChild(code);
    bindTooltip(a, term);
  });
});
</script>
</body>
</html>
