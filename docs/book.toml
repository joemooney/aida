# The AIDA Book — adopter and operator documentation.
# trace:STORY-1651 | ai:codex
# Contributor chapters are excluded from SUMMARY.md; their index is docs/internal/README.md.
#
# Publish: python3 scripts/build-reader-book.py (output → docs/book/, gitignored)
# Read:   mdbook serve docs --open
#
# The CLI manual (docs/cli/*.md) is nested here as the "CLI Reference" part —
# one Book, one nav, one search index (operator decision 2026-06-13). The
# standalone docs/cli/book.toml remains as a focused CLI-only sub-view.
#
# DIAGRAMS: lifecycle.md uses mermaid. To render them as diagrams (not code):
#   cargo install mdbook-mermaid && mdbook-mermaid install docs
# That adds the assets + the [preprocessor.mermaid] block + the additional-js
# lines below. Until then the book builds fine; diagrams show as fenced code.
[book]
title = "The AIDA Book"
description = "AIDA documentation — from why-it-exists to running it for a team, with the everyday CLI reference."
authors = ["AIDA"]
src = "."
language = "en"

# The publication wrapper removes non-reader assets copied by mdBook.
# trace:STORY-1651 | ai:codex
[build]
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
smart-punctuation = true
no-section-label = true
git-repository-url = "https://github.com/joemooney/aida"
edit-url-template = "https://github.com/joemooney/aida/edit/main/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 25

[output.html.fold]
enable = true
level = 1

# mdBook renames README.md → index.html but rewrites links to README.md as
# README.html (which doesn't exist). These redirects catch the broken URLs —
# in the sidebar nav, in cross-links, and when typed by hand.
[output.html.redirect]
"/README.html" = "/index.html"
"/cli/README.html" = "/cli/index.html"

"/admin-guide.html" = "/advanced/admin-guide.html"
"/agents/codex-mail-wake.html" = "/advanced/codex-mail-wake.html"
"/aida-power-features.html" = "/advanced/aida-power-features.html"
"/air-gapped-development.html" = "/advanced/air-gapped-development.html"
"/authority-and-seats.html" = "/advanced/authority-and-seats.html"
"/autonomous-drain.html" = "/advanced/autonomous-drain.html"
"/deputies.html" = "/advanced/deputies.html"
"/forge-providers.html" = "/advanced/forge-providers.html"
"/gitlab-ci-runner.html" = "/advanced/gitlab-ci-runner.html"
"/mailbox.html" = "/advanced/mailbox.html"
"/multi-advisor-coordination.html" = "/advanced/multi-advisor-coordination.html"
"/multi-hub-sync.html" = "/advanced/multi-hub-sync.html"
"/multi-node.html" = "/advanced/multi-node.html"
"/multi-user-setup.html" = "/advanced/multi-user-setup.html"
"/session-lifecycle.html" = "/advanced/session-lifecycle.html"
"/solo-mode.html" = "/advanced/solo-mode.html"
"/storage-modes.html" = "/advanced/storage-modes.html"
"/store-location.html" = "/advanced/store-location.html"
"/token-usage-ledger.html" = "/advanced/token-usage-ledger.html"

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
