<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AIDA - Requirements Management</title>
    
<script type="module">
import init, * as bindings from '/aida-web-f3fdc33adbe79022.js';
const wasm = await init({ module_or_path: '/aida-web-f3fdc33adbe79022_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Loading indicator */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
            text-align: center;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<link rel="modulepreload" href="/aida-web-f3fdc33adbe79022.js" crossorigin="anonymous" integrity="sha384-uvuDArPMIyvHuOScdpj1EkS8ly8AnYGxIohCZpB3Z7dX1nTU9t5W6aCpv5E4MTXS"><link rel="preload" href="/aida-web-f3fdc33adbe79022_bg.wasm" crossorigin="anonymous" integrity="sha384-PgizpCT92rPEKED1eTEUGJc0DTXj3CQyC+81vf36LaPHwQIhtR0akDKjyJIZijfM" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        Loading AIDA...
    </div>
    <script>
        // Configuration - can be overridden before loading
        window.AIDA_CONFIG = {
            serverUrl: "http://localhost:50051",
        };

        // Hide loading indicator once WASM loads
        document.addEventListener("DOMContentLoaded", function() {
            // The eframe app will hide the loading div
        });
    </script>
</body>
</html>
