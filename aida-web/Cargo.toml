# trace:FR-0273 | ai:claude:high
[package]
name = "aida-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "WASM browser client for AIDA requirements management"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# UI Framework
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"

# gRPC-Web client
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen"] }
tonic-web-wasm-client = "0.6"
prost = "0.13"
prost-types = "0.13"

# Async for WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "HtmlCanvasElement",
    "Element",
    "HtmlElement",
    "console",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time (WASM-compatible)
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Logging
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

# Optimize for size in release
[profile.release]
opt-level = "s"
lto = true
