[package]
name = "aida-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI-native requirements management CLI — track what you build and why, with structured context for AI coding agents"
readme = "README.md"
keywords = ["requirements", "ai", "traceability", "cli", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "aida"
path = "src/main.rs"

[dependencies]
aida-core = { version = "0.4", path = "../aida-core", features = ["postgres", "gitlab", "github", "jira"] }

# CLI-specific dependencies
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
inquire = { workspace = true }
colored = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
hostname = "0.4"
toml = { workspace = true }
rusqlite = { workspace = true }

# gRPC client dependencies (optional)
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[features]
default = []
remote = ["tonic", "prost", "tonic-build"]

[build-dependencies]
tonic-build = { workspace = true, optional = true }

[package.metadata.features]
# Note: The "remote" feature enables gRPC client functionality
# Build with: cargo build -p aida-cli --features remote
