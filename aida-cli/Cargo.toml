[package]
name = "aida-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI for AIDA requirements management"

[[bin]]
name = "aida"
path = "src/main.rs"

[dependencies]
aida-core = { path = "../aida-core", features = ["postgres", "gitlab"] }

# CLI-specific dependencies
clap = { workspace = true }
inquire = { workspace = true }
colored = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }

# gRPC client dependencies (optional)
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[features]
default = []
remote = ["tonic", "prost", "tonic-build"]

[build-dependencies]
tonic-build = { workspace = true, optional = true }

[package.metadata.features]
# Note: The "remote" feature enables gRPC client functionality
# Build with: cargo build -p aida-cli --features remote
