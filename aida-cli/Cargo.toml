[package]
name = "aida-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI-native requirements management CLI — track what you build and why, with structured context for AI coding agents"
readme = "README.md"
keywords = ["requirements", "ai", "traceability", "cli", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "aida"
path = "src/main.rs"

# Thin binary stub — the whole CLI lives in aida-cli-lib (one pub symbol,
# main_entry). Features below are pure pass-through so
# `cargo build -p aida-cli --features remote` keeps working unchanged.
# trace:STORY-772 trace:ADR-16 | ai:claude
[dependencies]
aida-cli-lib = { version = "0.14", path = "../aida-cli-lib", default-features = false }

[features]
default = ["tui"]
remote = ["aida-cli-lib/remote"]
tui = ["aida-cli-lib/tui"]

[dev-dependencies]
# Black-box integration tests under tests/ spawn the built binary
# (CARGO_BIN_EXE_aida) in throwaway project dirs.
tempfile = "3.8"

[package.metadata.features]
# Note: The "remote" feature enables gRPC client functionality
# Build with: cargo build -p aida-cli --features remote
