[package]
name = "aida-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal-UI shell that PTY-hosts Claude Code sessions for AIDA workflows (EPIC-26)"

[lib]
name = "aida_tui"
path = "src/lib.rs"

[dependencies]
# Terminal + PTY hosting
crossterm = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
# Declared now so a fetch failure surfaces in this story's first build;
# the status overlay (STORY-133) is the first heavy consumer.
ratatui = { workspace = true }

# Command-surface enumeration walks the real `aida` clap `Command` tree so the
# fuzzy palette never drifts from the CLI (STORY-682). Already in the workspace
# lockfile via aida-cli — no new external crate enters the build graph.
clap = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
# Local wall-clock timestamps for the overlay's activity log (STORY-133).
chrono = { workspace = true }
# Signal handler that restores the terminal before exit on SIGTERM/SIGINT
# (Unix) and CTRL_C_EVENT/CTRL_BREAK_EVENT (Windows). BUG-110.
ctrlc = { workspace = true }

# POSIX SIGSTOP/SIGCONT for `prefix p` pause/resume of the hosted child's
# process group (STORY-678). Unix-only — the signal calls are `#[cfg(unix)]`
# gated, so the dep is scoped to unix targets to stay unused-warning-clean on
# Windows. Mirrors the `libc = "0.2"` declaration in aida-cli/aida-core.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
