[package]
name = "aida-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal-UI shell that PTY-hosts Claude Code sessions for AIDA workflows (EPIC-26)"

[lib]
name = "aida_tui"
path = "src/lib.rs"

[dependencies]
# Terminal + PTY hosting
crossterm = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
# Declared now so a fetch failure surfaces in this story's first build;
# the status overlay (STORY-133) is the first heavy consumer.
# `unstable-rendered-line-info` un-gates `Paragraph::line_count(width)`, which
# we use to clamp modal scroll against the WRAPPED (post-word-wrap) row count
# rather than the logical line count — see render_modal. trace:BUG-635
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }

# Command-surface enumeration walks the real `aida` clap `Command` tree so the
# fuzzy palette never drifts from the CLI (STORY-682). Already in the workspace
# lockfile via aida-cli — no new external crate enters the build graph.
clap = { workspace = true }

# In-process spec/list reads via the cache-backed git backend — no per-read
# `aida` subprocess cold-start (STORY-693). Default features only (`native`:
# rusqlite + fs2 + dirs); the read path needs neither `postgres` nor the forge
# features (github/gitlab/jira). Already in the workspace lockfile via aida-cli.
# trace:STORY-693
aida-core = { version = "0.14", path = "../aida-core" }

# Markdown rendering of the show-modal body. Parsed into styled ratatui
# Lines/Spans ourselves (no tui-markdown — workspace ratatui is 0.30, which
# tui-markdown does not track). Pinned to the version already resolved in
# Cargo.lock (via other crates) so no new version enters the dependency graph.
# trace:TASK-913
pulldown-cmark = "0.9.6"

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
# Local wall-clock timestamps for the overlay's activity log (STORY-133).
chrono = { workspace = true }
# Signal handler that restores the terminal before exit on SIGTERM/SIGINT
# (Unix) and CTRL_C_EVENT/CTRL_BREAK_EVENT (Windows). BUG-110.
ctrlc = { workspace = true }

# Render the row-preview body as markdown (headings/bold/italic/code/lists)
# instead of piping raw `aida show` stdout as plain text (STORY-689 slice 1).
# Ratatui-native: parses via pulldown-cmark and emits a ratatui `Text`, so it
# composes with the existing Paragraph/Wrap layout. `default-features = false`
# drops the heavy `highlight-code` feature (syntect + the native `onig_sys` C
# library) — fenced code still renders as a styled block, just without
# language-aware syntax highlighting, which the preview pane doesn't need.
tui-markdown = { version = "0.3.7", default-features = false }

# POSIX SIGSTOP/SIGCONT for `prefix p` pause/resume of the hosted child's
# process group (STORY-678). Unix-only — the signal calls are `#[cfg(unix)]`
# gated, so the dep is scoped to unix targets to stay unused-warning-clean on
# Windows. Mirrors the `libc = "0.2"` declaration in aida-cli/aida-core.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# STORY-761: tempdir fixtures for the `[agents] vendor` knob seeding test.
tempfile = "3.8"
