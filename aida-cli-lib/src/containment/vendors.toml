# Shipped capability vocabulary for the closed tracer. No executable or shell
# templates, user-supplied descriptors, credentials, or ordinary launch enablement.
# trace:TASK-2705 | ai:codex
version = 1

[vendor.claude]
native = "claude"
ipc = "private_runtime"
credentials = "unverified"

[vendor.codex]
native = "codex"
ipc = "private_daemon"
credentials = "unverified"

[vendor.opencode]
native = "none"
ipc = "unverified"
credentials = "unverified"

# Signed 2026-11-05 outer-only ruling. This describes posture, not launch
# admission: auth inventory and integrated all-tool evidence remain unverified.
# trace:TASK-3048 | ai:codex
[vendor.agy]
native = "none"
native_layer = "none"
ipc = "private_runtime"
credentials = "unverified"

# Common wrapper runtime inputs. Only this endpoint is present in recorded host
# evidence; refresh/login inventory still needs the advisor's host measurement.
# Entries never extend trusted contained.allowed_hosts automatically.
[vendor.agy.runtime]
relative = ".gemini/antigravity-cli"
credential = "antigravity-oauth-token"
# Token endpoint is confirmed in the installed binary; host measurement is
# still required before marking this inventory complete.
auth_hosts = ["daily-cloudcode-pa.googleapis.com", "oauth2.googleapis.com"]
auth_inventory_complete = false
raw_store_writes = false
raw_git_writes = false
workspace_permission = "write_file"
argv_prefix = ["--output-format", "stream-json", "--disable-slash-commands"]
# Value-taking prompt options are data too: prompt text cannot select posture.
prompt_options = ["-p", "--print", "--prompt", "--prompt-interactive"]
