    title: Inline Code Traceability Comments
    description: |-
      The system shall support inline traceability comments in generated code that link back to requirement IDs.

      ### Comment Format
      `// trace:<SPEC-ID> | ai:<tool>:<confidence>`

      Example:
      `// trace:FR-0042 | ai:claude:high`

      ### Confidence Levels
      - high: >80% AI-generated code
      - med: 40-80% AI with human modifications
      - low: <40% AI, mostly human written

      ### Language Support
      Comments should follow language conventions:
      - Rust/C/JS: `// trace:...`
      - Python/Shell: `# trace:...`
      - HTML: `<!-- trace:... -->`

      ### Acceptance Criteria
      - All AI-generated code includes trace comments
      - Comments reference valid SPEC-IDs
      - Confidence level accurately reflects AI contribution
