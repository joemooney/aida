    title: CLI add command should support --parent option
    description: |-
      The `aida add` command should support a `--parent` option to specify a parent requirement when creating new requirements.

      ## Current Behavior
      - `aida add` creates requirements without parent relationships
      - Parent relationships must be added separately with `aida rel add`

      ## Desired Behavior
      - `aida add --parent <SPEC-ID>` should create the requirement and automatically add a parent relationship
      - Should accept SPEC-ID (e.g., FR-0146) or UUID
      - Should validate that the parent exists before creating the requirement

      ## Use Cases
      1. Creating IMPL tasks linked to their parent requirement in one command
      2. Creating child requirements during breakdown/decomposition
      3. Scripting and automation scenarios

      ## Acceptance Criteria
      - `--parent <ID>` option accepts SPEC-ID or UUID
      - Error message if parent ID not found
      - Relationship is created atomically with the requirement
      - Works with all other add options (--type, --status, etc.)
