    spec_id: FR-0128
    title: Support "Folder" status.
    description: |-
      ## Overview
      The system shall support a "Folder" status value for requirements that serve as organizational containers in a hierarchical structure.

      ## Behavior
      - The system shall display a folder icon for requirements with "Folder" status in the Requirements List view
      - The system shall allow filtering requirements by "Folder" status
      - The system shall exclude "Folder" status requirements from completion metrics and status reports by default

      ## Acceptance Criteria
      - [ ] "Folder" is available as a selectable status value when creating or editing requirements
      - [ ] Requirements with "Folder" status display a distinct folder icon in list views
      - [ ] Status filters include "Folder" as a filter option
      - [ ] Metrics dashboards exclude "Folder" requirements from status counts unless explicitly included
      - [ ] Child requirements under a "Folder" parent are not affected by the parent's status
