    spec_id: FR-0014
    title: Theme support
    description: |
      Support requirements for themes light and dark and other.

        Theme Editor Feature

        Access: Settings → Appearance tab → "Edit Theme..." button

        Capabilities:
        - Full visual customization with ~30 configurable properties organized into 6 categories:
          - Backgrounds: Window fill, panel fill, extreme background, faint background
          - Text: Override text color, hyperlink, warning, error colors
          - Widgets: Non-interactive and interactive widget colors (inactive, hovered, active, open states)
          - Selection: Selection background and foreground colors
          - Borders & Rounding: Stroke colors/width for different states, widget/window rounding, shadows
          - Spacing & Layout: Item spacing, button padding, window padding, scrollbar width, indent
        - Extends built-in themes: Start from Dark or Light base and customize
        - Live preview panel: See UI elements with your current customizations in real-time
        - Reset to Base: Quickly revert to default Dark or Light settings
        - Persistent: Custom themes are saved to user settings and appear in the theme dropdown
