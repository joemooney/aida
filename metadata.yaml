    description: |
      AI Find Duplicates

       "Find Duplicates" run in the background is valid and well-justified:

        1. Current behavior: The AiAction::FindDuplicates handler in aida-gui/src/app.rs:11064-11094 runs synchronously, calling
        self.ai_client.find_duplicates() on the main thread. This blocks the UI while waiting for the AI API response.
        2. Existing pattern: The "Evaluate Requirement" action already implements background processing using:
          - A BackgroundAiResult struct to hold async results
          - An ai_eval_receiver channel to receive results from the background thread
          - Spawning a std::thread with an mpsc::channel for communication
        3. User impact: AI API calls can take several seconds, making the UI freeze unacceptable for good UX.

        What Was Done

        1. Added requirement FR-0148 "Background AI Find Duplicates":
          - Title: "Background AI Find Duplicates"
          - Description: The AI 'Find Duplicates' action shall run in a background thread (similar to 'Evaluate Requirement') to avoid blocking the
        UI. Results shall be stored in the AI Evaluation panel. When duplicates are found, an 'Execute Suggestion' button shall be provided to take
        action on the results.
          - Type: Functional, Priority: Medium, Feature: 6-AI-Integration, Status: Draft
        2. Updated REQUIREMENTS.md with new Section 12 "AI Integration" covering:
          - AI Actions (REQ-AI-001 through REQ-AI-006)
