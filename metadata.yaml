    spec_id: IMPL-0190
    title: Auto-repair Duplicate SPEC-IDs on Load
    description: |-
      Automatically detect and repair duplicate SPEC-IDs when loading the requirements database.

      ## Behavior
      - During load(), scan for duplicate spec_ids
      - Keep the first occurrence of each duplicate
      - Assign new unique IDs to subsequent duplicates using the same prefix
      - Log repairs to stderr for visibility (e.g., 'Repaired: FR-0188 -> FR-0190')
      - Save the file automatically if any repairs were made

      ## Implementation
      - repair_duplicate_spec_ids() function in RequirementsStore
      - extract_prefix_from_spec_id() helper to parse ID format
      - Called in Storage::load() before validation

      ## Acceptance Criteria
      - [x] Duplicates are detected during load
      - [x] First occurrence is preserved
      - [x] Duplicates get new unique IDs with same prefix
      - [x] Repairs are logged to stderr
      - [x] File is auto-saved after repairs
