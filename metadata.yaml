  - original_id: 4de3b4f0-b157-4d50-8549-e98153d2324d
    spec_id: FR-0134
    title: AI Requirement Evaluation
    description: |2+
       I've implemented a complete background AI evaluation system for AIDA with the following components:

        1. StoredAiEvaluation (aida-core/src/ai/responses.rs)

        - Wraps evaluation results with metadata (timestamp, content hash)
        - Provides new() and is_stale() methods for staleness detection

        2. Requirement Model Updates (aida-core/src/models.rs)

        - Added ai_evaluation: Option<StoredAiEvaluation> field
        - Added content_hash() method using DefaultHasher on title, description, and type
        - Added needs_ai_evaluation() method to check if evaluation is needed

        3. AI Tab in GUI (aida-gui/src/app.rs)

        - Added Ai variant to DetailTab enum
        - Added AI tab to the left of Description in both layout modes
        - Tab shows status indicators: "🤖 AI" (no eval), "🤖 AI ✓" (current), "🤖 AI ⚠️" (stale)
        - Created show_ai_tab() method displaying:
          - Quality score with color-coded progress bar (green/amber/red)
          - Evaluation timestamp and staleness warning
          - Collapsible sections for strengths, issues, and suggested improvements
          - Placeholder message when no evaluation exists

        4. BackgroundEvaluator Service (aida-core/src/ai/evaluator.rs)

        - Runs in a separate thread scanning for requirements needing evaluation
        - Supports commands: Pause, Resume, Stop, PrioritizeRequirement, ScanForWork
        - Configurable delays between evaluations and idle scans
        - Priority queue for manually triggered evaluations
        - Rate limiting protection with backoff on errors
        - Results communicated back via channel for GUI to apply

        The system is designed to:
        - Evaluate requirements one-by-one in the background
        - Track evaluation staleness via content hashing
        - Allow manual triggering via Actions → AI → Evaluate
        - Display cached results immediately in the AI tab

