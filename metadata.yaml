      - [ ] "Folder" is available as a selectable status value when creating or editing requirements
      - [ ] Requirements with "Folder" status display a distinct folder icon in list views
      - [ ] Status filters include "Folder" as a filter option
      - [ ] Metrics dashboards exclude "Folder" requirements from status counts unless explicitly included
      - [ ] Child requirements under a "Folder" parent are not affected by the parent's status
