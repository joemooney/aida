  - original_id: 9e9ea9a2-0734-44b8-b911-f76f5aabc4ac
    spec_id: AI-0133
    title: AI integration
    description: |
      AI integration
      I want to integrate AI and probably claude code into this application. The first baby step would be to have in the
        Actions dropdown an AI subdropdown menu with actions we can take. Consider if we should evaluate the current requirement, perhaps we provide
        the entire database as context (for the moment) and it can discern whether the requirement is well written, suggest updates, consider
        duplicates, whether references or other relationships should be created etc. Our goal is to make this application like an editor which is
        fast, and nimble without a lot os fluff and primarily driven by the keyboard in preference to the mouse. we want to move fast, iterating
        frequently with the goal of this becoming self-referential whereby we are able to start feeding back into claude code requirements that
        improve the application itself. Perhaps you should review requirements.yaml itself for inspiration.


        AI Evaluate Requirement
        - Performs a holistic quality assessment of the requirement
        - Returns a quality score (1-10) and structured feedback
        - Identifies issues with severity levels (critical, major, minor)
        - Lists strengths and suggested improvements
        - Considers: clarity, completeness, testability, consistency, feasibility
        - Doesn't rewrite anything - it's an analysis/audit tool

        AI Improve Description
        - Specifically focuses on rewriting the description text
        - Uses completed requirements as examples of well-written ones
        - Generates a concrete improved version of the description
        - Provides rationale for the changes made
        - Action-oriented - you get a new description you can use directly

        In short: Evaluate tells you what's wrong and gives a score, Improve actually rewrites the description for you.
