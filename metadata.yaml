  - original_id: 5cd0934b-a782-40f3-bd96-0a26403db404
    spec_id: FR-0175
    title: Release management skill (/aida-release)
    description: |-
      Provide a Claude Code skill for managing software releases with version bumping, release notes generation, and git tagging.

      ## Overview
      The /aida-release skill assists developers in preparing and executing software releases by automating common release tasks while maintaining traceability with the requirements database.

      ## Core Capabilities
      1. Version number management (bump major/minor/patch)
      2. Release notes generation from requirements and git history
      3. Git tagging with version numbers
      4. Changelog maintenance
      5. Pre-release validation checks

      ## Integration Points
      - Requirements database (completed items since last release)
      - Git history (commits since last tag)
      - Cargo.toml / package.json version fields
      - CHANGELOG.md maintenance

      ## User Workflow
      1. Invoke /aida-release
      2. Review pending changes and completed requirements
      3. Select version bump type (major/minor/patch)
      4. Review/edit generated release notes
      5. Execute release (tag, update files, commit)
