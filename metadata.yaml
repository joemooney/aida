    spec_id: SPEC-198
    title: hotkeys in reqlist
    description: "Support keyboard hotkeys in the requirement list view when focused:\n\n**Navigation:**\n- j - move selection down\n- k - move selection up\n- Enter - open selected requirement in edit mode\n\n**Creation:**\n- n - create new sibling requirement\n- N - create new child requirement\n\n**Editing:**\n- o - open fuzzy finder to assign owner\n- p - open priority picker\n- s - open status picker\n- c - add comment to selected requirement\n- L - show/toggle links panel\n\n**Deletion:**\n- d - delete with confirmation dialog\n- D - delete immediately (no confirmation)\n- a - archive selected requirement\n\nVisual selection indicator should follow keyboard navigation.\n\n\n# View\n\n- l - link, \n  - l p - relink to a different parent\n  - l u - link to anternal url\n  - l s  - link to a Sprint\n  - l r - create reference link\n  then show a pop-up with existing links \n then pop-up show a fuzzy find to create a new link\n\n  Navigation\n\n  - g g - jump to first requirement (vim: go to top)\n  - G - jump to last requirement (vim: go to bottom)\n  - Ctrl+d / Ctrl+u - page down/up (half-page scroll in vim)\n  - z z - center selected item in view\n  - / - focus search box (vim: search)\n  - n / N - next/prev search result (if search is active)\n\n  Tree Operations\n\nUpon 'z' unless open a dialog showing these options and if the use presses the second letter perform the action (esc to exit, any other letter is ignored or error) maybe if the user presses the two letter combe quickly we dont bother to show the pop-up menu of subchoices \n  - z o - expand node (vim: open fold)\n  - z c - collapse node (vim: close fold)\n  - z a - toggle expand/collapse (vim: toggle fold)\n  - z M - collapse all\n  - z R - expand all\nalso show\n  - z z - center selected item in view\n\n\n  Editing\n\n  - i - edit selected requirement (vim: insert mode)\n  - y y - copy/yank requirement (for clone)\n  - p - paste/clone yanked requirement\n  - d d - delete with confirmation\n  - u - undo last change (if undo is implemented)\n  - r - rename/quick edit title inline\n\n  Selection/Marks\n\n  - b - mark/bookmark requirement\n  - ' - jump to marked requirement\n  - v - enter visual/multi-select mode (select range)\n\n  Views\n\n  - 1-9 - quick switch to view presets\n  - Tab - cycle between list panels (in split view)\n  - Ctrl+w w - switch focus between panels\n  - Ctrl+w h/j/k/l - move focus left/down/up/right\n\n  Quick Actions (current ones are good)\n\n  - s - status (already implemented)\n  - p - priority (already implemented)\n  - o - owner (already implemented)\n  - c - comment (already implemented)\n  - t - edit tags\n  - f - assign to feature\n\n  Which would you like me to implement?\n\n  The easiest wins would be:\n  1. gg/G for jump to top/bottom\n  2. / to focus search\n  3. za/zo/zc for fold operations\n  4. i as alias for Enter (edit)\n\n '/' is should focus in the search box, '\\' Switch from Highlight to Filter mode."
