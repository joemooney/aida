      - Python/Shell: `# trace:...`
      - HTML: `<!-- trace:... -->`

      ### Acceptance Criteria
      - All AI-generated code includes trace comments
      - Comments reference valid SPEC-IDs
      - Confidence level accurately reflects AI contribution
