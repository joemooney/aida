    description: "Manual evaluation \n\nSince manual triggering via Actions → AI → Evaluate is very slow and the gui appears to the o/s to have stopped working, we should run that in\n  the background. It should then update the AI evaluation in the database on its own and maybe we could have a completion notification?\n\nbackground AI evaluation with toast notifications for the AIDA GUI. Here's what was changed:\n\n  Changes Made (aida-gui/src/app.rs)\n\n  1. Added new state fields (lines 2249-2270):\n    - ai_eval_receiver: Option<mpsc::Receiver<BackgroundAiResult>> - Channel to receive background evaluation results\n    - ai_eval_in_progress: Option<(Uuid, String)> - Tracks currently evaluating requirement\n    - toast_message: Option<ToastNotification> - Current toast notification to display\n    - BackgroundAiResult struct - Result from background thread\n    - ToastNotification struct - Toast message with success flag and expiration time\n  2. Modified AI action handler (lines 10697-10743):\n    - Changed AiAction::Evaluate to spawn a background thread instead of blocking\n    - Shows \"Evaluating...\" toast when evaluation starts\n    - Prevents multiple concurrent evaluations\n  3. Added polling logic in update() (lines 15140-15203):\n    - Polls ai_eval_receiver for completed results\n    - On success: Creates StoredAiEvaluation, updates requirement, saves to database, shows success toast with quality score\n    - On error: Shows error toast\n  4. Added toast notification overlay (lines 2977-3037):\n    - show_toast_notification() method displays temporary messages at bottom-center of screen\n    - Green background for success, red for errors\n    - Auto-expires after 3-5 seconds\n    - Called at end of update loop (line 16032)\n\n  Behavior\n\n  When you use Actions → AI → Evaluate:\n  1. GUI immediately shows \"Evaluating [spec_id]...\" toast\n  2. AI evaluation runs in background thread - GUI remains responsive\n  3. When complete, shows \"AI evaluation complete for [spec_id] (Score: X/10)\" toast\n  4. Requirement's ai_evaluation field is automatically updated and saved\n  5. AI Results panel is also updated with detailed results\n\n"
