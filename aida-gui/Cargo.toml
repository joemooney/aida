[package]
name = "aida-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "GUI for AIDA requirements management (egui-based)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aida-gui"
path = "src/main.rs"

[dependencies]
aida-core = { path = "../aida-core" }

# GUI dependencies
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_commonmark = "0.18"
anyhow = { workspace = true }
uuid = { workspace = true }
env_logger = "0.11"
chrono = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
dirs = "5.0"
url = "2"
open = "5"
arboard = "3"
rfd = "0.15"
hostname = "0.4"
similar = { version = "2", features = ["inline"] }

# gRPC client dependencies (optional)
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Web/WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
    "Location",
    "Document",
    "HtmlAnchorElement",
    "Blob",
    "Url",
    "UrlSearchParams",
    "Storage",
] }
console_log = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
log = { version = "0.4", optional = true }

[features]
default = ["native"]
native = []  # Native platform features (file dialogs, clipboard, etc.)
web = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
    "console_log",
    "console_error_panic_hook",
    "log",
]
remote = ["tonic", "prost", "tokio", "tonic-build"]

[build-dependencies]
tonic-build = { workspace = true, optional = true }
