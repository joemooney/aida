[package]
name = "aida-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "GUI for AIDA requirements management (egui-based)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aida-gui"
path = "src/main.rs"

[dependencies]
# Core library - with native feature only for native builds
aida-core = { path = "../aida-core", default-features = false }

# GUI dependencies (cross-platform)
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_commonmark = "0.18"
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1", optional = true }
serde_yaml = { workspace = true }
url = "2"
similar = { version = "2", features = ["inline"] }
# Cross-platform time (uses std::time on native, performance.now() on WASM)
web-time = "1"

# Native-only dependencies (file dialogs, clipboard, etc.)
env_logger = { version = "0.11", optional = true }
dirs = { version = "5.0", optional = true }
open = { version = "5", optional = true }
arboard = { version = "3", optional = true }
rfd = { version = "0.15", optional = true }
hostname = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }

# gRPC client dependencies
# Native: Uses tonic with full transport and tokio runtime
# WASM: Uses tonic (no transport) + tonic-web-wasm-client
prost = { workspace = true }

# Tonic gRPC types - always included but with different features per platform
# Native: Uses workspace config (full transport + tokio)
# WASM: Uses minimal features (prost + codegen only, no transport)
tonic = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# WASM gRPC-Web client (provides the actual transport for WASM)
tonic-web-wasm-client = { version = "0.6", optional = true }

# Web/WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
    "Location",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Blob",
    "Url",
    "UrlSearchParams",
    "Storage",
] }
console_log = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
log = { version = "0.4", optional = true }
# UUID needs js feature for WASM randomness
getrandom = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.4", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }
# WASM-compatible tonic with minimal features (no transport, no tokio)
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen"] }

[features]
default = ["native"]
# Native desktop build - full local storage with rusqlite, file system access, etc.
native = [
    "aida-core/native",
    "aida-core/gitlab",
    "env_logger",
    "dirs",
    "open",
    "arboard",
    "rfd",
    "hostname",
    "libc",
    # Native gRPC with tokio runtime
    "tonic",
    "tokio",
]
# Web dependencies only (used by aida-web for storage client)
web = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
    "console_log",
    "console_error_panic_hook",
    "log",
    "serde_json",
    # WASM gRPC-Web client
    "tonic-web-wasm-client",
]
# Full web GUI build: includes app module (requires aida-core types)
# For WASM builds with the full RequirementsApp, use: --features "native-types,web"
# This enables aida-core WITHOUT native features (no rusqlite, fs2, dirs)
native-types = []
# Legacy feature - gRPC is now always available
remote = []

[build-dependencies]
tonic-build = { workspace = true }
