<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AIDA - Requirements Management</title>
    <link data-trunk rel="rust" data-wasm-opt="2" data-cargo-no-default-features data-cargo-features="web"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        /* Canvas where eframe renders */
        #aida_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Loading indicator */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
            text-align: center;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Canvas element where eframe will render -->
    <canvas id="aida_canvas"></canvas>

    <div id="loading">
        <div class="spinner"></div>
        Loading AIDA...
    </div>

    <script>
        // Hide loading indicator when the WASM module signals it's ready
        // The eframe app will remove this element once loaded
        window.addEventListener('load', function() {
            // Give eframe a moment to initialize, then hide loading
            setTimeout(function() {
                var loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }, 100);
        });
    </script>
</body>
</html>
