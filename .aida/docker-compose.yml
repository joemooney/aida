# AIDA quickstart — run from project root: docker compose -f .aida/docker-compose.yml up
# Or use: make docker-up
services:
  aida:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ..:/repo
    command:
      - /app/aida-server
      - --host=0.0.0.0
      - --rest-port=8080
      - --database=/repo/requirements.db
      - --static-dir=/app/static
    environment:
      RUST_LOG: info
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # Forwarded from host env; set via export or .env file
