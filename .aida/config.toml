# AIDA distributed mode configuration
[deployment]
mode = "distributed"
store_path = ".aida-store"
store_type = "worktree"
branch = "aida-store"

# trace:EPIC-1-052 Phase 2 | ai:claude
# How `aida add` chooses between agreed-id blocks and node-aware ids:
#   node-aware-only      — never use blocks; always FR-<NODE>-<SEQ>
#   blocks-then-fallback — try block first; fall through silently (default)
#   blocks-only          — error if no block is allocated for the type
[id_format]
policy = "blocks-then-fallback"

[hints]
workflow_hints = true

[field_study]
enabled = false

# STORY-760: store-sync fan-out. This project mirrors to a personal GitLab
# (gitlab.joemooney.com) alongside github `origin`. Listing it here makes every
# `aida db sync --push` push the store to BOTH hubs, so a clone can't silently
# leave one behind. Best-effort: while the store is mid-reconcile (BUG-700
# employer-content scrub), the gitlab leg will WARN as non-fast-forward — that is
# expected and self-heals once the histories are reconciled. Check drift anytime
# with `aida remote status`.
[store.sync]
mirror_remotes = ["gitlab"]
