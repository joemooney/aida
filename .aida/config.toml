# AIDA distributed mode configuration
[deployment]
mode = "distributed"
store_path = ".aida-store"
store_type = "worktree"
branch = "aida-store"

# trace:EPIC-1-052 Phase 2 | ai:claude
# How `aida add` chooses between agreed-id blocks and node-aware ids:
#   node-aware-only      — never use blocks; always FR-<NODE>-<SEQ>
#   blocks-then-fallback — try block first; fall through silently (default)
#   blocks-only          — error if no block is allocated for the type
[id_format]
policy = "blocks-then-fallback"

[hints]
workflow_hints = true

[field_study]
enabled = false

# STORY-760: store-sync fan-out. This project mirrors to a personal GitLab
# (gitlab.joemooney.com) alongside github `origin`. Listing it here makes every
# `aida db sync --push` push the store to BOTH hubs, so a clone can't silently
# leave one behind. Best-effort: while the store is mid-reconcile (BUG-700
# employer-content scrub), the gitlab leg will WARN as non-fast-forward — that is
# expected and self-heals once the histories are reconciled. Check drift anytime
# with `aida remote status`.
[store.sync]
mirror_remotes = ["gitlab"]

# Default vendor for agent launches (drives, drains, agent new). Set to codex so
# `aida zen` / `aida burndown` / supervised drives use the Codex CLI without a
# per-run `AIDA_HEADLESS_VENDOR=codex` prefix. This is the TRACKED config knob
# (BUG-704) so pool/drain worktrees inherit it — a gitignored `.aida/agents.toml`
# would NOT reach them. Override per-run with the env var, or (once TASK-1116
# lands) a `--vendor`/`--agent` flag on the drive command.
[agents]
vendor = "codex"

[drain]
# STORY-975: retry a transient phase failure before parking NeedsAttention.
# BUG-1485 (2026-09-20): raised 1 -> 2 as an interim mitigation. The orchestrator's
# session-to-lease mismatch fired 7 times in one day and self-recovered on attempt 2
# in 6 of them — so the old budget of 1 retry put every recovery on the LAST available
# attempt. If attempt 2 ever failed for an unrelated reason, the spec burned out on a
# defect we know self-heals. This is a blunt instrument: it widens the budget for every
# transient cause, not just the lease mismatch. Revert to 1 once BUG-1485 types that
# cause distinctly or fixes the root cause. Clamp is 3 (clamp_transient_retry_budget).
retry_transient = 2

# STORY-1041 / ADR-27: overlap a later member's implementer phase with an earlier
# member's CI/review wait. Raised 1 -> 2 on 2026-09-20 on measured evidence: across
# today's runs the drain spent 475 minutes in the `ci` phase against 482 in
# `implementer` and 315 in `reviewer`. At depth 1 that CI time is dead — strictly
# sequential, so no other member can use it. Depth 2 lets one member wait on GitHub
# while the next is being implemented. Clamp is 3; going to 2 first because the
# yield is 12 merges from 79 implementer runs and a wider pipeline multiplies
# whatever is causing that before it multiplies throughput.
pipeline_depth = 2

# TASK-1289: names resolve to the command bodies in ci.yml, so local preflight
# cannot silently drift from CI when a guard command changes.
[preflight]
guards = [
  "Check formatting",
  "Run clippy",
  "Check Rust test portability ratchet",
  "CLI-manual drift-guard (every command documented)",
  "Doc-intent gate (surface changes mark doc-impact)",
]

# Contained-launch egress allowlist (BUG-1178 workaround): the native sandbox
# PROMPTS on a new network domain, and a dontAsk launch auto-denies that prompt —
# which is why `gh` / `git fetch` got a 403 inside the contained advisor. Pre-allow
# the hosts AIDA work needs so no prompt is ever raised. Default-denies all others.
[contained]
allowed_hosts = [
  "github.com", "api.github.com", "objects.githubusercontent.com", "codeload.github.com",
  "gitlab.joemooney.com",
  "api.anthropic.com", "statsig.anthropic.com",
  "static.crates.io", "index.crates.io", "crates.io",
  "registry.npmjs.org",
]

# BUG-1180/ADR-39 informational CI allow-list. The path-filtered Windows/macOS
# matrix workflow is named "Cross-platform (nightly)"; the binary default
# ("Cross-platform", exact) does not match it, so spell the glob here.
[ci]
informational_workflows = ["Cross-platform*"]

# STORY-1423 criterion 3: THE TRIGGER. The performance-guard pair ships in the
# init scaffold COMMENTED OUT — correct for a fresh project, which has nothing
# to guard until it declares a budget — but a commented example is a trigger for
# nobody. THIS repo is the population the budget was measured against and the
# dogfood surface for the mechanism, so here the pair is registered and ENABLED.
# Entries are the scaffold's verbatim (see `schedule_section()` in
# aida-cli-lib/src/init_cmd.rs), with `enabled` flipped to true.
#
# The budget is the measured 1000ms for `show`; the tolerance stays the
# PROVISIONAL 10%/24h default and is NOT restated here, because a number written
# in two places is a number that can be tuned in one of them. It changes only
# alongside a re-measurement.
#
# --fail-on-findings is what makes this a GATE rather than a report: the
# non-zero exit emits CronJobFailed, which the routing seat job turns into a due
# item in `aida awaiting`. The substrate run is ledgered at
# schedule/performance-guard.yaml independently, so a trip is BOTH durable and
# noticed.
#
# BUG-1572 (fixed): the denominator was binary-blind — `~/.aida/usage.jsonl` is
# machine-global and this repo runs 20-60 worktrees, so one lane's stale build
# could hold this gate red for a regression that was not on main. The gate now
# scopes its decision population to this HEAD's binary lineage by default
# (AIDA_PERF_GATE_ALL_BINARIES=1 restores the old unscoped behaviour).
#
# ADR-53: `ceiling_ms` is a SECOND, INDEPENDENT limb, decided after the
# post-fix pair (STORY-1423) showed the proportion going quiet (2.9% at
# n=170) while the worst single call got WORSE (69,240ms, post-fix). A
# proportion cannot express that — it is invariant to the magnitude of its
# own outliers and improves as its denominator grows — so this trips on
# EITHER limb: the proportion over tolerance, OR any single call over the
# ceiling. 5000ms is derived from the interaction model (beyond ~5s a person
# assumes the tool hung), not from the measured distribution — tuning a
# budget to a measurement is what this spec family forbids.
# trace:STORY-1423 trace:ADR-53 | ai:claude
[performance.budgets]
show = { budget_ms = 1000, ceiling_ms = 5000 }

[[schedule.jobs]]
name = "performance-guard"
command = "doctor check performance --fail-on-findings"
every = "6h"
enabled = true

[[schedule.jobs]]
name = "performance-guard-route"
seats = ["advisor"]
on = ["CronJobFailed"]
prompt = "A performance budget was breached. Use the routed trip evidence and its matching entry at .aida-store/schedule/performance-guard.yaml to confirm the budget in force, then decide: real regression, or a budget that needs changing deliberately."
enabled = true

# STORY-1367's three first jobs. Nothing in `aida schedule` was registered
# before this, so every recurring check ran only when a human happened to
# remember it — the 2026-09-19 incident (32h of silent hub drift, missed
# because nobody ran `aida remote status` or `aida doctor --category
# remote-drift`, even though both report it accurately) is the fixture.
#
# Same GATING shape as performance-guard above: `--fail-on-findings` turns a
# report into a job the tick can route, the non-zero exit emits
# CronJobFailed, and the paired `*-route` seat job turns that event into a
# due item in `aida awaiting`. Each substrate run is independently ledgered
# at schedule/<job>.yaml (`aida-store` branch) so a trip is both durable and
# noticed.
#
# hub-drift-guard and disk-headroom-guard ARE silent when clean —
# `scan_remote_drift` returns nothing below two configured remotes,
# `scan_disk_headroom` reports only below its floor — so an enabled-and-quiet
# run trains nobody to ignore it. stranded-branches-guard is NOT clean in
# THIS repo today: `aida doctor check stale-remote-branches` reports 531+
# Keep-flagged branches (a pre-existing remote-branch backlog, not something
# this story caused), so it is registered but shipped DISABLED below rather
# than enabled — a gate that trips on every run trains people to ignore it
# exactly like the silent drift warnings this story exists to fix.
#
# Registered ENABLED (hub-drift-guard, disk-headroom-guard) here — unlike
# the scaffold's commented default; see the scaffold's own comment for the
# per-job reasoning — because this repo is the population each was measured
# against: it mirrors to a second hub (`[store.sync] mirror_remotes` above,
# so hub-drift is meaningful, not permanently silent), and it is the repo
# that hit 100% disk with 16K free on 2026-09-19.
# trace:STORY-1367 | ai:claude
[[schedule.jobs]]
name = "hub-drift-guard"
command = "doctor check remote-drift --fail-on-findings"
every = "6h"
enabled = true

[[schedule.jobs]]
name = "hub-drift-guard-route"
seats = ["advisor"]
on = ["CronJobFailed"]
prompt = "A tracked branch (main or aida-store) differs across hubs. Use the routed trip evidence and `aida remote status` to reconcile — never force-push a shared branch."
enabled = true

# DISABLED: this repo has a pre-existing backlog of 531+ Keep-flagged remote
# branches (measured 2026-09-23), so this job would trip on every run — a
# gate that always trips is noise, not a guard. Enable after the backlog is
# healed: triage it with `aida doctor --category stale-remote-branches`
# (review each flagged branch — open a PR, or delete by hand; nothing here
# deletes branches automatically), then flip `enabled = true`.
# trace:STORY-1367 | ai:claude
[[schedule.jobs]]
name = "stranded-branches-guard"
command = "doctor check stale-remote-branches --fail-on-findings"
every = "24h"
enabled = false

[[schedule.jobs]]
name = "stranded-branches-guard-route"
seats = ["advisor"]
on = ["CronJobFailed"]
prompt = "One or more remote branches carry commits with no open PR. Review each: open a PR, or delete by hand — never auto-delete a Keep-flagged branch."
enabled = false

# 60 GiB matches the incident: root hit 100% with 16K free before this floor
# existed. Raise/lower deliberately if this host's disk changes, not by
# tuning until the gate goes green.
[doctor.disk_headroom]
min_free_gib = 60

[[schedule.jobs]]
name = "disk-headroom-guard"
command = "doctor check disk-headroom --fail-on-findings"
every = "30m"
enabled = true

[[schedule.jobs]]
name = "disk-headroom-guard-route"
seats = ["advisor"]
on = ["CronJobFailed"]
prompt = "Free disk space dropped below the configured floor. Reclaim space (stale worktrees via `aida session reap`, `cargo clean`) or raise [doctor.disk_headroom] min_free_gib deliberately."
enabled = true

# STORY-1462: the runaway-seat watchdog. BUG-1589 (2026-09-21): two seats
# answered a mail tick every ~7-10s and burned ~9.8B tokens before anyone
# noticed. This job reads the trailing day of this project's Claude Code
# transcripts (every worktree's slug) and headless logs, incrementally, and
# trips on per-session wake-rate, token-rate, repeated injected prompt,
# no-op reply ratio, context ceiling, compactions, or a model-side mailbox
# poll — plus the project's 24h spend against a daily budget. Zero model
# tokens; bounded by `max_total_bytes` / `time_budget_ms`. Evidence it could
# not read is a finding (`evidence-unknown` / `evidence-partial`), never a
# clean pass. Every threshold below is the built-in default, restated only
# where this repo has a reason to hold it; omit a key to take the default.
# trace:STORY-1462 | ai:claude
#
# daily_token_budget: this repo's ordinary day measured ~1B tokens on
# 2026-09-23 (the default 2B budget would alert at 50% on an ordinary day,
# which is noise), while the BUG-1589 storm burned ~9.8B. 4B alerts at 2B:
# twice an ordinary day and about a fifth of the storm, so the alert lands
# hours before the damage does. Re-derive from those two numbers, not by
# tuning until the gate goes quiet.
[watchdog]
daily_token_budget = 4000000000
max_wakes_per_hour = 120
max_tokens_per_hour = 100000000
restart_context_tokens = 300000

[[schedule.jobs]]
name = "watchdog"
command = "doctor check runaway-seats --fail-on-findings"
every = "15m"
enabled = true

[[schedule.jobs]]
name = "watchdog-route"
seats = ["advisor"]
on = ["CronJobFailed"]
prompt = "A seat tripped the runaway-seat watchdog. Use the routed trip evidence (session, rule, measured value, threshold) to stop the tick or loop that is waking it, or hand off and restart a seat past its context ceiling. Never answer by adding another poll."
enabled = true
