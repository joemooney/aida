# AIDA distributed mode configuration
[deployment]
mode = "distributed"
store_path = ".aida-store"
store_type = "worktree"
branch = "aida-store"

# trace:EPIC-1-052 Phase 2 | ai:claude
# How `aida add` chooses between agreed-id blocks and node-aware ids:
#   node-aware-only      — never use blocks; always FR-<NODE>-<SEQ>
#   blocks-then-fallback — try block first; fall through silently (default)
#   blocks-only          — error if no block is allocated for the type
[id_format]
policy = "blocks-then-fallback"

[hints]
workflow_hints = true

[field_study]
enabled = false

# STORY-760: store-sync fan-out. This project mirrors to a personal GitLab
# (gitlab.joemooney.com) alongside github `origin`. Listing it here makes every
# `aida db sync --push` push the store to BOTH hubs, so a clone can't silently
# leave one behind. Best-effort: while the store is mid-reconcile (BUG-700
# employer-content scrub), the gitlab leg will WARN as non-fast-forward — that is
# expected and self-heals once the histories are reconciled. Check drift anytime
# with `aida remote status`.
[store.sync]
mirror_remotes = ["gitlab"]

# Default vendor for agent launches (drives, drains, agent new). Set to codex so
# `aida zen` / `aida burndown` / supervised drives use the Codex CLI without a
# per-run `AIDA_HEADLESS_VENDOR=codex` prefix. This is the TRACKED config knob
# (BUG-704) so pool/drain worktrees inherit it — a gitignored `.aida/agents.toml`
# would NOT reach them. Override per-run with the env var, or (once TASK-1116
# lands) a `--vendor`/`--agent` flag on the drive command.
[agents]
vendor = "codex"

[drain]
# STORY-975: retry a transient phase failure before parking NeedsAttention.
# BUG-1485 (2026-09-20): raised 1 -> 2 as an interim mitigation. The orchestrator's
# session-to-lease mismatch fired 7 times in one day and self-recovered on attempt 2
# in 6 of them — so the old budget of 1 retry put every recovery on the LAST available
# attempt. If attempt 2 ever failed for an unrelated reason, the spec burned out on a
# defect we know self-heals. This is a blunt instrument: it widens the budget for every
# transient cause, not just the lease mismatch. Revert to 1 once BUG-1485 types that
# cause distinctly or fixes the root cause. Clamp is 3 (clamp_transient_retry_budget).
retry_transient = 2

# Contained-launch egress allowlist (BUG-1178 workaround): the native sandbox
# PROMPTS on a new network domain, and a dontAsk launch auto-denies that prompt —
# which is why `gh` / `git fetch` got a 403 inside the contained advisor. Pre-allow
# the hosts AIDA work needs so no prompt is ever raised. Default-denies all others.
[contained]
allowed_hosts = [
  "github.com", "api.github.com", "objects.githubusercontent.com", "codeload.github.com",
  "gitlab.joemooney.com",
  "api.anthropic.com", "statsig.anthropic.com",
  "static.crates.io", "index.crates.io", "crates.io",
  "registry.npmjs.org",
]

# BUG-1180/ADR-39 informational CI allow-list. The path-filtered Windows/macOS
# matrix workflow is named "Cross-platform (nightly)"; the binary default
# ("Cross-platform", exact) does not match it, so spell the glob here.
[ci]
informational_workflows = ["Cross-platform*"]
