id: 9238ec28-2a11-4d0b-90df-f78861f49d72
spec_id: FR-202
title: URL link support
description: |
  When you click on Links tab, show a button to enter a URL, perhaps a button to verify that it is a valid link.

    External URL Links Feature:

    1. UrlLink Model (requirements-core/src/models.rs):
      - New UrlLink struct with fields: id, url, title, description, added_at, added_by, last_verified, last_verified_ok
      - Added urls: Vec<UrlLink> field to Requirement struct
    2. GUI Integration (requirements-gui/src/app.rs):
      - Updated Links tab to show "External Links" section with "➕ New URL" button
      - URL list displays with:
          - Verification status indicators (✅ valid, ❌ failed)
        - Clickable links that open in browser
        - Edit (✏) and remove (x) buttons
      - URL form modal with:
          - URL input field
        - Optional title and description
        - "🔍 Verify" button to validate URL format
        - Colored status messages for validation results
      - Links tab count now shows total of relationships + URLs
    3. Dependencies:
      - Added url = "2" for URL parsing/validation
      - Added open = "5" for opening URLs in browser
    4. Documentation:
      - Updated docs/user-guide.md with Links Tab section
      - Updated PROMPT_HISTORY.md with feature details
