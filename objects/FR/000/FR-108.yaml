title: Settings/IDs tab
description: |2+
   IDs tab - you should now see two subtabs:
    - Format - For ID format configuration (format type, numbering strategy, digits)
    - Prefixes - For prefix management (add, rename, remove prefixes)

    In the Prefixes subtab, you can:
    1. Add new prefixes
    2. See prefixes in use with requirement counts
    3. Rename prefixes by clicking the pencil (✏) button - renaming to an existing prefix will merge requirements
    4. See and manage allowed prefixes

