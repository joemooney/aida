title: Status/Priority per type
description: |-
  Status/Priority per type
  When I look at Settings/Appearance/Status Icons/Edit Icons, I see many keywords that do not correspond to our four statuses. Likewise the
    Priority Icons have more than our three. Also the ones listed are lowercase whereas the ones in the system are Captilaized first letter. I
    like this rich set of options but we may want to enable/disable the values based on requirement type. Perhaps under the Types we can have an
    edit button which will allow us to specify values for Priority and Status. Then the values shown for those fields would be based on the
    requirement type. Thoughts? We can keep the Edit Icons as is and if the status or priority matches (case insnesitive) then that will be used
    otherwise the default.
