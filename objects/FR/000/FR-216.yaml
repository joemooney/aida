title: Git Hooks for Code Traceability Validation
description: |-
  Generate git hooks during project scaffolding to enforce code traceability:

  **commit-msg hook:**
  - Validates SPEC-ID references in commit messages
  - Warns if referenced SPEC-ID doesn't exist in database
  - Non-blocking by default (configurable to block)

  **pre-commit hook:**
  - Validates trace comments in staged files
  - Checks format: // trace:SPEC-ID | ai:tool:confidence
  - Warns on malformed traces
  - Non-blocking by default (configurable to block)

  **Configuration Options (in ScaffoldConfig):**
  - generate_git_hooks: bool - whether to generate hooks
  - include_commit_msg_hook: bool - generate commit-msg hook
  - include_pre_commit_hook: bool - generate pre-commit hook

  **Acceptance Criteria:**
  - [x] Hooks only generated if .git directory exists
  - [x] Hooks have executable permissions (Unix)
  - [x] Preview shows hook content before generation
  - [x] Non-blocking warnings by default
