spec_id: FR-212
prefix_override: FR
title: Optimistic reload on save for new requirements
description: |-
  When saving a new requirement, reload the requirements file first to ensure we have the latest SPEC-IDs and don't create duplicates or overwrite concurrent changes.

  ## Problem
  If another user/process adds a requirement while we're filling out the add form, we might:
  1. Generate a duplicate SPEC-ID (using stale next-ID counter)
  2. Overwrite their changes when saving

  ## Solution
  Before adding a new requirement:
  1. Reload the requirements file to get latest state
  2. Merge any external changes into our in-memory store
  3. Generate SPEC-ID using the fresh state
  4. Add the new requirement
  5. Save with conflict detection

  ## Acceptance Criteria
  - [ ] New requirements get unique SPEC-IDs even with concurrent modifications
  - [ ] External changes are not lost when saving new requirements
  - [ ] User sees a message if external changes were detected and merged
