id: 631c854b-cc3c-4bac-bb37-087f2ed5ce72
spec_id: FR-211
title: Requirements List context menus for quick actions
description: |+
  Requirements List context menus for quick actions
  when you press 's' in the requirements list, open a popup menu to allow you to update the status showing a menu of statuses you can up/down/enter/esc to change the current status, the current status should be selected upon popup. Likewise 'p' for priority.

  The current behavior is that it is opening the edit dialog, perhaps make this an option in the settings, but the default behavior should
    be to make the change and keep us in viewing the Details and not go into edit mode. Also, the pop-ups requirements lists quick action popups
    should probably not be active if we are in edit mode since that may be confusing.


  Requirements List hotkeys

  | key|action |
  |---|---------|
  | p | Priority pop-up |
  | s | Status pop-up |
  | j |  navigate down |
  | k | navigate up |
  | n | new sibling requirement |
  | N | new child requirement |
  | <Backspace>,<Delete> |archive requirement |
  | <Enter> |edit requirement |




  The current behavior is that it is opening the edit dialog, perhaps make this an option in the settings, but the default behavior should
    be to make the change and keep us in viewing the Details and not go into edit mode. Also, the pop-ups requirements lists quick action popups
    should probably not be active if we are in edit mode since that may be confusing.

  preventing Edit mode from triggering after a quick status change via the 's' key popup has been completed and pushed.

    Summary of the fix:
    - Added a status_popup_consumed_action flag that tracks when the status popup processes an action (Enter, Escape, click)
    - This flag is reset to false at the start of each frame
    - When the status popup handles any action, it sets this flag to true
    - The Edit keybinding handler now checks !self.status_popup_consumed_action before triggering Edit mode
    - This prevents the Enter key from being processed by both the popup (to apply the status) and the Edit handler (which would open Edit mode)

    The change has been committed with: fix: prevent Edit mode trigger after status popup selection

    You can now test by:
    1. Select a requirement in the list
    2. Press 's' to open the status popup
    3. Use arrow keys to select a status and press Enter
    4. The status should change and you should remain in the Details view (not enter Edit mode)

