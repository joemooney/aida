    new_value: |
      Support keyboard hotkeys in the requirement list view when focused:

      **Navigation:**
      - j - move selection down
      - k - move selection up
      - Enter - open selected requirement in edit mode

      **Creation:**
      - n - create new sibling requirement
      - N - create new child requirement

      **Editing:**
      - o - open fuzzy finder to assign owner
      - p - open priority picker
      - s - open status picker
      - c - add comment to selected requirement
      - L - show/toggle links panel

      **Deletion:**
      - d - delete with confirmation dialog
      - D - delete immediately (no confirmation)
      - a - archive selected requirement

      Visual selection indicator should follow keyboard navigation.


        Navigation

        - g g - jump to first requirement (vim: go to top)
        - G - jump to last requirement (vim: go to bottom)
        - Ctrl+d / Ctrl+u - page down/up (half-page scroll in vim)
        - z z - center selected item in view
        - / - focus search box (vim: search)
        - n / N - next/prev search result (if search is active)

        Tree Operations

        - z o - expand node (vim: open fold)
        - z c - collapse node (vim: close fold)
        - z a - toggle expand/collapse (vim: toggle fold)
        - z M - collapse all
        - z R - expand all

        Editing

        - i - edit selected requirement (vim: insert mode)
        - y y - copy/yank requirement (for clone)
        - p - paste/clone yanked requirement
        - d d - delete with confirmation
        - u - undo last change (if undo is implemented)
        - r - rename/quick edit title inline

        Selection/Marks

        - m - mark/bookmark requirement
        - ' - jump to marked requirement
        - v - enter visual/multi-select mode (select range)

        Views

        - 1-9 - quick switch to view presets
        - Tab - cycle between list panels (in split view)
        - Ctrl+w w - switch focus between panels
        - Ctrl+w h/j/k/l - move focus left/down/up/right

        Quick Actions (current ones are good)

        - s - status (already implemented)
        - p - priority (already implemented)
        - o - owner (already implemented)
        - c - comment (already implemented)
        - t - edit tags
        - f - assign to feature

        Which would you like me to implement?

        The easiest wins would be:
        1. gg/G for jump to top/bottom
        2. / to focus search
        3. za/zo/zc for fold operations
        4. i as alias for Enter (edit)
