      suggestion: 'Specify: ''o - open fuzzy finder to assign/change requirement owner'''
    - type: incomplete
      severity: low
      text: No specification of whether hotkeys should work globally or only when list is focused
      suggestion: 'Add: ''Hotkeys active when requirement list has focus'''
    - type: incomplete
      severity: low
      text: Missing behavior for 'p - priority' and 's - status' - do these cycle through values, open a picker, or something else?
      suggestion: 'Specify the interaction pattern: ''p - open priority picker'' or ''p - cycle through priority levels'''
