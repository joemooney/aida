id: bf646b67-bfa2-49bb-93dd-1eb49f4a085a
spec_id: FR-232
title: Edit req should show the tabs same as Detail view
description: |-
  The Edit requirement dialog should display the same tabbed interface as the Detail view, including tabs for AI Evaluation, Comments, History, and Relationships.

  Acceptance Criteria:
  - Edit dialog displays a tab bar matching Detail view layout
  - All tabs from Detail view are present: Description (with editable fields), AI, Comments, History, Relationships
  - Tab content in Edit mode should allow appropriate editing (e.g., adding comments, viewing history) while maintaining current field editing
  - Keyboard navigation: Ctrl+1-5 switches between tabs
  - On save, focus returns to the previously active tab

  Implementation consideration: Evaluate whether to refactor Detail view to support inline editing vs. adding tabs to Edit dialog.
