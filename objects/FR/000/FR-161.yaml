id: 4d2cce7c-d8e4-4c9b-a6a5-61637a423f12
spec_id: FR-161
title: Database Name
description: |
  The database should have a name store in the yaml file and it should be used in the Title bar of the Window. You may change the database name in the Settings/Db tab. Likewise there should be a Database Title (oneliner), and a Database Description (multiline)

    1. RequirementsStore model - Added a name field that is stored in the YAML file (with #[serde(default)] for backward compatibility)
    2. Window title - Dynamically updates based on the database name:
      - If name is set: "MyDatabase - Requirements Manager"
      - If name is empty: "Requirements Manager"
    3. Settings/Db tab - Added a "Database Name" section at the top with:
      - A text input field to edit the name
      - Automatically saves when the field loses focus
      - Hint text: "Enter database name (shown in title bar)"


  The database now has three identity fields:

    1. Name - Short identifier (e.g., "PROJ-A")
    2. Title - One-line title for the database
    3. Description - Multi-line detailed description

    Window title logic:
    - If both Name and Title are set: "Name - Title"
    - If only Title is set: "Title"
    - If only Name is set: "Name"
    - If neither is set: "Requirements Manager"
