spec_id: FR-181
title: Auto-migrate missing default types on database load
description: |-
  When loading an existing database that was created before newer default types (Bug, Story, Task, Sprint, Folder) were added, automatically add any missing default types to the id_config.requirement_types collection. This ensures databases stay in sync with the built-in type definitions without requiring manual migration steps.

  Implementation approach:
  1. In storage load function, after loading the store, check id_config.requirement_types
  2. Compare against default_requirement_types()
  3. For any missing types, add them (preserving user customizations for existing types)
  4. Only add built_in=true types that are missing, don't modify existing type definitions

  This is safer than the current fallback approach (BUG-0308) because it ensures the database actually contains the type definitions, which:
  - Allows custom prefixes to be configured via Settings > Types
  - Shows all types in 'aida type list'
  - Maintains consistency between CLI and GUI
