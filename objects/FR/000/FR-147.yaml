spec_id: FR-147
title: Save As menu option for YAML files
description: |-
  ## Save As Menu Option

  The system shall provide a "Save As..." menu option that allows users to save the current requirements database to a new file location.

  ### Requirements

  1. **Menu Access**: The "Save As..." option shall be available in the main Menu dropdown
  2. **File Dialog**: Clicking "Save As..." shall open a native file dialog for selecting the destination
  3. **File Filter**: The dialog shall filter for YAML files (.yaml, .yml)
  4. **Save Operation**: The system shall serialize and write all requirements to the selected path
  5. **Feedback**: Success or failure messages shall be displayed to the user

  ### Use Cases

  - Emergency backup when normal save fails
  - Creating a copy of requirements for sharing
  - Exporting to a different location

  ### Acceptance Criteria

  - [x] Save As option appears in Menu
  - [x] Native file dialog opens on click
  - [x] Requirements are saved to selected location
  - [x] Success/error message displayed
