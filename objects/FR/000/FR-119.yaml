spec_id: FR-119
title: '''s'' quick pick, if you type the first letter (n...'
description: |-
  Status quick-pick keyboard shortcut: When the user presses 's' to open the status picker, typing the first letter of a status name (case-insensitive) should:

  1. **Single match**: If only one status starts with that letter, immediately set the status and close the picker
  2. **Multiple matches**: If multiple statuses share the first letter, highlight the first matching option. Pressing the same letter cycles to the next match. Pressing Enter confirms the highlighted selection
  3. **No match**: Ignore the keypress (no error feedback needed)
  4. **Cancel**: Escape closes the picker without changes

  Available statuses: draft, approved, in-progress, completed, rejected (currently no first-letter conflicts exist).

  This is a keyboard-only shortcut - no textbox or filter input field is displayed.
