spec_id: FR-186
title: The term 'queue' is not defined anywhere in the...
description: |-
  Document the 'user queue' concept in project documentation.

  **Background:** The AIDA GUI uses vim-style navigation with 'q v' and 'v q' shortcuts to access the user queue view, but is the queue concept documented in the user and admin guides.
  Also is CLAUDE.md the right place to mention, do we need feature documents that claude code/CLAUDE.md could be aware of and if asked to work on a feature it would know to look for the feature document or use an aida command that could generate a report on a feature?

  **Requirements:**
  1. (I question the wisdom of this AI evaluation recommendation) Add a 'User Queue' section to CLAUDE.md explaining:
     - What the user queue is (list of requirements assigned to or owned by current user)
     - How to access it (keyboard shortcuts 'q v' / 'v q')
     - What actions are available in the queue view
  2. Include queue documentation in any user-facing help or README
  3. Ensure the in-app help (if any) references the queue feature

  **Acceptance Criteria:**
  - [ ] CLAUDE.md contains User Queue documentation (I think this is unwise as stated like this)
  - [ ] Keyboard shortcuts section documents 'q v' and 'v q'
  - [ ] A new user can understand the queue concept from documentation alone
