spec_id: FR-1-067
title: 'aida upgrade --diff: vet unreleased commits before shipping'
description: |-
  ## Problem

  \`aida upgrade\` already prints a "this dev build is N commits ahead of <tag>" hint when run from a developer build with unreleased work. There was no quick way to see WHAT those commits were before invoking \`aida dev patch\` to ship them — you had to drop into the repo and run \`git log <tag>..HEAD\` separately.

  ## Solution

  New \`--diff\` flag prints \`git log --stat <tag>..HEAD\` in the same hint block: short SHA, subject, author + relative date, files-changed summary per commit. Without --diff, the hint now suggests passing it.

  The flag flows through both \`aida upgrade\` and \`aida upgrade --check\` since they share the same sibling-scan path.

  ## Acceptance

  - ✅ \`aida upgrade --diff\` shows the unreleased commits log
  - ✅ Default behavior preserved when --diff absent
  - ✅ Hint nudges the user to pass --diff
