spec_id: FR-1-002
title: Write-behind batched commits for bulk-import paths
description: |-
  Bulk-import operations (Jira sync, GitHub pull, GitLab sync, large `aida import` calls) currently incur one git commit per requirement under the write-through model adopted in EPIC-1-001. For imports of hundreds or thousands of requirements this is too slow.

  Add a write-behind / batched-commit mode: collect mutations in memory, write all YAML files in one filesystem pass, then create a single git commit covering the batch. The cache update happens once at the end.

  ## Acceptance criteria

  - New `BulkWriter` API on the storage layer that batches mutations until commit
  - All existing bulk-import code paths (Jira/GitHub/GitLab sync, `aida import`) opt into batched mode
  - Single batched import of 1000 requirements completes in under 5 seconds (vs. expected 50+ seconds at one-commit-each)
  - Batch commit message includes count and source ("chore: import 1000 requirements from jira sync")
  - On batch failure, partial state is rolled back (no orphaned YAML files in working tree)

  ## Defer until

  EPIC-1-001 Phase 1 lands and write-through performance becomes a measured pain point on real bulk-import workloads.
