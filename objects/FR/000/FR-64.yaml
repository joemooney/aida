description: |-
  ranking number as an ordering preference for display

  a ranking number or ordinal is a way to order reqs in a way other than priority or status
  where priority may be set by a manager or team, an ordinal or ranking is a personal ordering that is not such much meta data of the req but of the user. It is a helpful tool to keep an inbox ordered in terms of how you want to sequence activities
