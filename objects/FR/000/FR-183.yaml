      Do you think we should store the prompts we use for AI in the settings so that we can customize. I assume they are hardcoded right now? For example, if this was a requirement, then the AI evaluation prompt should know that the description may take the form of a question intended for the AI Evalation to ponder and translate into a formal requirement or a suggestions that this is a dumb idea and should be rejected (maybe more politely stated). We may have different prompts for different requirement types and maybe some general text that applies to all types.
    new_value: "AI Prompts in settings\n\nDo you think we should store the prompts we use for AI in the settings so that we can customize. I assume they are hardcoded right now? For example, if this was a requirement, then the AI evaluation prompt should know that the description may take the form of a question intended for the AI Evalation to ponder and translate into a formal requirement or a suggestions that this is a dumb idea and should be rejected (maybe more politely stated). We may have different prompts for different requirement types and maybe some general text that applies to all types.\n\nCurrent State\n\n  The prompts in prompts.rs are static and hardcoded. They're well-structured but not customizable.\n\n  Proposed Design for Customizable AI Prompts\n\n  Storage Location Options:\n\n  1. Project settings (requirements.yaml) - Per-project customization\n  2. User settings (global ~/.config/aida/settings.yaml) - User defaults\n  3. Both - Project-level overrides user-level defaults\n\n  Prompt Structure:\n\n  ai_prompts:\n\n# General context prepended to ALL prompts\n    global_context: |\n      This project follows agile methodology. Requirements may be written as\n      questions or rough ideas that need refinement. When evaluating:\n      - Questions in descriptions should be interpreted as requests for AI \n        to formalize into proper requirements\n      - Vague ideas should be clarified, not rejected\n      - Suggest \"Reject\" only for truly unfeasible or duplicate requirements\n\n# Per-action prompts (evaluation, duplicates, relationships, improve, generate_children)\n    evaluation:\n      # Override the entire prompt template (use {project_context}, {req_context}, etc. placeholders)\n      template: null  # null = use default\n\n      # Or just add extra instructions to the default prompt\n      additional_instructions: |\n        Consider that descriptions may be informal questions or brainstorming \n        notes rather than formal requirements. Help formalize them.\n\n# Per-type customization\n   type_prompts:\n      Functional:\n        evaluation_extra: |\n          For functional requirements, ensure there are clear acceptance criteria.\n      Story:\n        evaluation_extra: |\n          User stories should follow \"As a [user], I want [feature], so that [benefit]\" format.\n      Epic:\n        evaluation_extra: |\n          Epics are high-level and should be decomposable into Stories/Tasks.\n          Focus on business value rather than implementation details.\n\n# Key Features:\n\n  1. Global context - Applied to all prompts (your project philosophy)\n  2. Per-action customization - Override or extend each prompt type\n  3. Per-type customization - Different instructions for Epics vs Stories vs Tasks\n  4. Inheritance - User settings → Project settings → Type-specific → Default\n\n# Benefits:\n\n  - Descriptions can be informal questions/ideas for AI to formalize\n  - AI can recommend \"Reject\" status for bad ideas politely\n  - Different requirement types get appropriate evaluation criteria\n  - Teams can encode their methodology (Agile, Waterfall, SAFe, etc.)\n\n  Would you like me to implement this? It would involve:\n  1. Adding prompt configuration to RequirementsStore in models\n  2. Modifying prompts.rs to use configurable templates\n  3. Adding a \"Prompts\" tab in Settings UI\n  4. Default prompts remain if no customization is provided\n"
