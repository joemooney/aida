ements. Help formalize them.\n\n# Per-type customization\n   type_prompts:\n      Functional:\n        evaluation_extra: |\n          For functional requirements, ensure there are clear acceptance criteria.\n      Story:\n        evaluation_extra: |\n          User stories should follow \"As a [user], I want [feature], so that [benefit]\" format.\n      Epic:\n        evaluation_extra: |\n          Epics are high-level and should be decomposable into Stories/Tasks.\n          Focus on business value rather than implementation details.\n\n# Key Features:\n\n  1. Global context - Applied to all prompts (your project philosophy)\n  2. Per-action customization - Override or extend each prompt type\n  3. Per-type customization - Different instructions for Epics vs Stories vs Tasks\n  4. Inheritance - User settings → Project settings → Type-specific → Default\n\n# Benefits:\n\n  - Descriptions can be informal questions/ideas for AI to formalize\n  - AI can recommend \"Reject\" status for bad ideas politely\n  - Different requirement types get appropriate evaluation criteria\n  - Teams can encode their methodology (Agile, Waterfall, SAFe, etc.)\n\n  Would you like me to implement this? It would involve:\n  1. Adding prompt configuration to RequirementsStore in models\n  2. Modifying prompts.rs to use configurable templates\n  3. Adding a \"Prompts\" tab in Settings UI\n  4. Default prompts remain if no customization is provided\n\ncustomizable AI prompts feature has been fully implemented. Here's a summary of what was completed:\n\n  Summary\n\n  Customizable AI Prompts Configuration has been implemented with the following components:\n\n  Data Models (aida-core/src/models.rs)\n\n  - AiPromptConfig - Top-level configuration containing global context and action-specific configs\n  - AiActionPromptConfig - Per-action configuration (evaluate, duplicates, relationships, improve, generate_children) with optional custom\n  templates and additional instructions\n  - AiTypePromptConfig - Per-requirement-type specific instructions\n\n  Prompt Building (aida-core/src/ai/prompts.rs)\n\n  All 5 prompt builder functions now support:\n  - Custom templates with placeholder replacement ({project_context}, {req_context}, {global_context}, etc.)\n  - Global context that applies to all prompts\n  - Additional instructions per action\n  - Type-specific instructions based on requirement type\n\n  Settings UI (aida-gui/src/app.rs)\n\n  New \"AI\" tab in Settings with:\n  - Global Context editor - applies to all AI prompts\n  - Evaluation Prompt section with additional instructions\n  - Improve Description Prompt section\n  - Generate Children Prompt section\n  - Type-Specific Instructions section with add/remove capability\n  - Template Placeholders reference guide showing available placeholders\n\n  Other Changes\n\n  - Added ai_prompts field to SQLite backend initialization\n  - Fixed test helpers in prompts.rs to use correct model types\n  - All 42 tests pass\n\n  The changes have been committed and pushed to GitHub.\n\n\n Summary\n\n  1. Added AI prompt configuration to your project (requirements.yaml):\n    - Global context that tells the AI requirements can be questions/ideas that need transformation\n    - Evaluation instructions for scoring quality and flagging issues\n    - Improve instructions for converting to Markdown format with acceptance criteria\n    - Generate children instructions for breaking down requirements\n    - Type-specific instructions for Functional, NonFunctional, User, System, and ChangeRequest types\n  2. Created a reusable template (templates/ai-prompts-standard.yaml):\n    - This can be used as a starting point for new projects\n    - Future enhancement: Implement template selection when creating new projects\n\n  How to Use\n\n  The configuration is now active in your project. When you use AI features (Evaluate, Improve, Generate Children), the prompts will include:\n  - The global context about question/idea transformation\n  - Markdown formatting requirements\n  - Type-specific guidance based on the requirement type\n\n  You can customize these in the Settings UI under the \"AI\" tab, or by editing the ai_prompts section in requirements.yaml directly.\n\n  Future Enhancement Ideas\n\n  For the template system you mentioned:\n  1. Store templates in ~/.aida/templates/ or project templates/ directory\n  2. Add a \"New Project\" wizard that lets you select a template\n  3. Templates could include: AI prompts, type definitions, relationship definitions, ID format preferences\n  4. Could have templates for different methodologies (Agile, Waterfall, SAFe, etc.)\n"
    new_value: |-
      # AI Prompts Configuration

      The system shall provide customizable AI prompts for requirement evaluation and improvement.

      ## Functional Requirements

      - The system shall store AI prompt configurations in project settings (`requirements.yaml`)
      - The system shall support global context that applies to all AI prompts
      - The system shall allow per-action prompt customization (evaluate, duplicates, relationships, improve, generate_children)
      - The system shall support per-requirement-type specific instructions
      - The system shall use default prompts when no customization is provided

      ## UI Requirements

      - The Settings UI shall include an "AI" tab for prompt configuration
      - The AI tab shall provide editors for:
        - Global context
        - Evaluation prompt additional instructions
        - Improve description prompt additional instructions
        - Generate children prompt additional instructions
        - Type-specific instructions with add/remove capability
      - The UI shall display available template placeholders for reference

      ## Acceptance Criteria

      - [ ] User can edit global AI context via Settings > AI tab
      - [ ] User can add additional instructions per AI action
      - [ ] User can define type-specific instructions for any requirement type
      - [ ] Custom prompts are persisted to `requirements.yaml`
      - [ ] AI features use configured prompts with placeholder substitution
      - [ ] Default prompts function correctly when no customization exists

      ## Implementation Status

      **Status: Implemented**

      Components completed:
      - `AiPromptConfig`, `AiActionPromptConfig`, `AiTypePromptConfig` models
      - Prompt building with template/placeholder support in `prompts.rs`
      - Settings UI with AI tab
      - SQLite backend support
