id: 019df5a2-e553-7380-a366-f42fd030ade5
spec_id: FR-277
title: aida history — chronological event timeline decoded from orphan-branch git log
description: |-
  **Problem**

  There's no project-wide timeline view. Today's options:
  - 'aida status' shows top-5 by modified_at (snapshot, not a feed)
  - 'aida role show' shows per-role activity (one role at a time, last 10)
  - '.aida-store' has full git log of every change but it's not surfaced through aida
  - Per-requirement YAML has a 'history' field but the show command skips it

  The web UI had a timeline concept; CLI has nothing equivalent.

  **Surface**

    aida history [OPTIONS]

  Options:
    --limit N           — most-recent N events (default 50)
    --since <date>      — events after the given date
    --until <date>      — events before the given date
    --id <SPEC-ID>      — only events for this requirement
    --type <type>       — only events for requirements of this type
    --author <user>     — only events by this author
    --oneline           — terse format (one line per event)
    --status-changes    — filter to status transitions only
    --comments          — filter to comment events only

  **Decoded-event format (default)**

  For each git commit on the orphan branch, walk the diff and emit one logical event per change. Examples:

    2026-05-04 12:34  joe   FR-1-011  status: Approved → Completed
    2026-05-04 12:32  joe   TASK-1-021  added (Task, High, 'Phase 3 scope filters...')
    2026-05-04 12:30  joe   EPIC-1-005  comment added by joe (47 chars)
    2026-05-04 12:28  joe   BUG-1-025  tags: +data-integrity
    2026-05-04 12:25  claude FR-1-013  status: Draft → Approved, priority: Low → Medium

  **Scope of decoding**

  - Status changes (top-level 'status' or 'custom_status' field delta)
  - Priority changes
  - Tags added/removed (set diff on 'tags' array)
  - Comments added (count delta on 'comments' array; identify by trailing element)
  - Comments edited (would need deeper inspection — defer to v2)
  - Title changes (pre/post diff)
  - Description changes (just 'edited', don't dump the diff inline — that's what aida show is for)
  - Owner / feature / type changes
  - New requirement (file added)
  - Deleted requirement (file removed)
  - Relationship adds/removes (relationships array delta)

  **Implementation outline**

  1. Walk 'git log' on the orphan branch via git2 or shell-out; collect (sha, timestamp, author, message, changed-files).
  2. For each changed YAML, fetch before/after content via 'git show <sha>^:path' and 'git show <sha>:path'.
  3. Parse both as serde_yaml::Value, structurally diff.
  4. Emit one event per logical change.
  5. Filter post-hoc per CLI flags.

  **Performance**

  For a 500-commit store, walking + parsing all diffs each call would be slow. Mitigations:
  - Lazy: stream events as they're produced; --limit truncates the walk
  - Cache: project events into the SQLite cache on rebuild (new 'events' table with sha + spec_id + kind + before + after + timestamp), regenerate on cache rebuild
  - Defer cache to v2; v1 just walks git log directly

  **Out of scope for v1**

  - Filtering by relationship type
  - Multi-author attribution merge (HLC merges)
  - Coloring per event type (just text first)
  - JSON output mode (defer to --format flag in v2)

  **Related**

  - aida status (snapshot-style summary)
  - aida role show (per-role activity)
  - aida trace sweep (different one-way ingest path that also walks git log)
  - aida queue list (current state, no history)
