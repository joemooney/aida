id: 019df46f-51f2-7d50-88be-b2dfe3581474
spec_id: FR-275
title: aida scaffold diff [<file>] — text-mode unified diff for drifted files
description: |-
  Add `aida scaffold diff` subcommand that prints a unified text diff between the embedded template and the on-disk file for drifted files.

  Behavior:
  - `aida scaffold diff` (no arg) — diff every modified file from `scaffold status`, separated by file headers
  - `aida scaffold diff <path>` — diff just one file
  - Output format: standard unified diff (`---` / `+++` / `@@` hunks), color-aware on TTY (red/green like `git diff`), plain when piped
  - Exit code: 0 if no drift, 1 if any drift, 2 on error

  Sibling to FR-195 (which adds the HTML `--report` flag on `scaffold status`). This one is for terminal use — when a user sees "4 modified" they can immediately ask "diff what?".

  Implementation notes:
  - The embedded template content is already accessible via the `include_str!`/`include_dir!` machinery in `aida-core/templates/`
  - Use the `similar` crate (already in workspace? check Cargo.lock) or shell out to `diff -u` on temp files
  - Should NOT require the user to specify whether the file is template/seed/managed-merge — just diff bytes
