spec_id: FR-226
title: AIDA_AUTHOR environment variable for AI authorship attribution
description: |-
  The CLI shall support an AIDA_AUTHOR environment variable to automatically set the author/owner field for AI-assisted work.

  Features:
  - get_default_author() helper checks AIDA_AUTHOR, USER, USERNAME, then 'Unknown'
  - aida comment add uses AIDA_AUTHOR for author field
  - aida add uses AIDA_AUTHOR for owner field
  - Interactive mode pre-fills author with the default value
  - CLI help text documents the environment variable

  Recommended format: ai:<tool>:<username> (e.g., ai:claude:joe)

  Usage:
  ```bash
  export AIDA_AUTHOR="ai:claude:$USER"
  aida comment add FR-0042 "Implementation note..."
  ```

  Implementation complete in commit 6e84ec6.
