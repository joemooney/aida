spec_id: FR-166
title: Database-aware scaffolding generates backend-specific CLAUDE.md
description: |-
  The scaffolding system shall detect the database backend type (SQLite vs YAML) and generate appropriate CLAUDE.md content:

  ### SQLite Backend
  When using a .db file:
  - Shows `Requirements database: \`requirements.db\``
  - Includes full "Database Storage" section with:
    - YAML vs SQLite comparison
    - Migration instructions

  ### YAML Backend
  When using a .yaml file:
  - Shows `Requirements database: \`requirements.yaml\``
  - No database storage section (not needed for YAML users)

  ### Implementation
  - Added `database_path: Option<PathBuf>` to Scaffolder struct
  - Added `with_database()` constructor
  - Added `is_sqlite_database()` and `database_filename()` helpers
  - Updated all callers in CLI, GUI, and report.rs

  ### Acceptance Criteria
  - Scaffolding correctly identifies database type from file extension
  - CLAUDE.md content varies based on backend type
  - Existing scaffold commands work with new parameter
