title: Baselines - Requirements Versioning and Snapshots
description: |-
  Create named snapshots of requirements at specific points in time for release milestones, contract deliverables, or change control. Features:
  - Create baselines with name and description
  - Store full snapshots of all active requirements
  - Compare baseline with current state (added/removed/modified)
  - Compare two baselines against each other
  - Git tag integration for YAML backend
  - Lock baselines to prevent deletion
  - View requirements in a baseline
