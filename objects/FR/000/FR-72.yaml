title: Pre-release validation checks
description: |-
  The skill shall perform validation checks before executing a release.

  ## Checks
  1. **Git status**: No uncommitted changes
  2. **Branch**: On main/master branch (configurable)
  3. **Tests**: All tests passing (optional, can be skipped)
  4. **Build**: Project builds successfully (optional)
  5. **Requirements**: No blocking issues or incomplete dependencies

  ## Validation Output
  - Clear pass/fail status for each check
  - Warnings for non-critical issues
  - Option to proceed with warnings
  - Block on critical failures

  ## Acceptance Criteria
  - Check git working directory status
  - Verify current branch
  - Run test suite (with option to skip)
  - Report clear pass/fail for each check
