spec_id: FR-1-068
title: 'aida dev activate: profile pinning + stale-build warning + PS1 marker'
description: |-
  ## Problem

  User reported: \`(aida-debug)\` activated with release newer on disk. The freshest-wins rule did the right thing at activation time, but a release build later in the day inverted the picture without any signal. Plus, fast-iteration users want to PIN debug even when they periodically build release.

  ## Solution

  Three changes to \`aida dev activate\`:

  1. **\`aida dev status\` warns** when the alternate build is newer than the active one. Tailored message based on whether you're pinned or in auto-mode.
  2. **Pinning** via \`aida dev activate debug | release | --auto\` (positional or flag form). Pin persists in \`AIDA_DEV_PROFILE_PIN\` and is honored on subsequent plain re-activations until cleared. New "Pin:" row in \`aida dev status\`.
  3. **PS1 marker** — when the picked profile is staler than the alternate, the prompt prefix becomes \`(aida-debug*)\` / \`(aida-release*)\` (vs the plain \`(aida-debug)\`). Captures the snapshot at activate; for live state run \`aida dev status\`.

  \`aida dev deactivate\` unsets the pin too (clean teardown).

  ## Acceptance

  - ✅ \`aida dev status\` surfaces the WARN block when alternate is newer
  - ✅ Pin is sticky across re-activations and survives the alternate becoming newer
  - ✅ \`--auto\` clears the pin and returns to freshest-wins
  - ✅ PS1 marker flips to \`*\` when active is staler
  - ✅ Verified end-to-end via touched mtimes
