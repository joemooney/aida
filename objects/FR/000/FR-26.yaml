title: I would like to review ~/ai/ai-provenance. Spec...
description: "I would you like to review ~/ai/ai-provenance. Specfically, I want consider adding one or more skills to the aida project and consider what we\n  did in that other project that I think has been somewhat superceded by aida. I would like to have a /aida-req skill that accepts input for a\n  new requirement, and then performs the evaluation the same way we perform currently request evaluation from the aida action dropdown. The\n  skill can add the requirement to the database and update the AI tab once the requirement evaluation is complete. the skill could start a\n  claude code sub-agent and run in the background. It could add the requirement upon completion of the prompts and spawn the evaluation in the\n  background. basically I want to see if we can import some of the ideas of ai-provenance into this projects. You could add a set of new\n  requirements as you see fit. \n\nstart with just /aida-req and maybe also an /aida-implement; add the requirement immediately and show \"evaluation\n    pending\"; different \"modes\" for aida if you think that a good idea - i defer to you (it can wait); in terms of prompt history, I think when\n  we elect to implement a requirement, (AI/Copy for Claude Code), which should put use into /aida-implement mode, as we iterate in claude code\n  we should be evolving the requirement in the database and perhaps creating child requirements, basically our goal in claude code during\n  /aida-implement is to ensure that we capture the requirement and relevant implementation details so that the requirements database accurately\n  reflects our conversation, this in essence supercedes and deprecates the PROMPT_HISTORY.md and REQUIREMENTS.md and we should support\n  scaffolding the project from aida with appropriate skills and CLAUDE.md directives. ai-provenance will be displaced by aida. Traceability: we\n  want to adopt the ai-provenance idea of inline comment format for marking AI-generated code using the requirement id from aida."
