id: 019df420-aa3f-7b03-9d73-326bbeed57af
spec_id: FR-273
title: Scaffold Claude Code statusLine block in .claude/settings.json
description: |-
  ## Problem

  When you launch `claude` inside an aida-init'd project, Claude Code's statusbar shows whatever the user's global ~/.claude/settings.json has — typically `user@host:cwd`. It does NOT reflect the active AIDA role, project name, queue depth, or cache freshness, even though `aida statusline` produces exactly that one-liner today (e.g., `aida · Aida · role:implementer · reqs:362 · cache:fresh`).

  The statusbar is the single most-visible piece of session context. Surfacing the role there closes the loop: `aida-role implementer` → `claude` → statusbar visibly shows `role:implementer` → no chance of forgetting which hat you're wearing.

  ## Acceptance criteria

  1. `aida-core/src/scaffolding/settings.rs` emits a `statusLine` block alongside `hooks` in the generated `.claude/settings.json`:
     ```json
     "statusLine": {
       "type": "command",
       "command": "aida statusline 2>/dev/null || printf '%s' \"$(pwd)\""
     }
     ```
     Fallback covers the case where `aida` isn't on PATH or the cwd isn't inside an AIDA project.

  2. Scaffolder behavior:
     - Fresh `aida init` writes the statusLine block.
     - `aida scaffold apply` on an existing project: if `.claude/settings.json` is user-modified (has a custom statusLine), don't clobber — surface a diff/warning. If only the AIDA-generated content is present, update in place.

  3. Update the JSON template tests in `aida-core/src/scaffolding/settings.rs` (or wherever generate_claude_settings_json tests live) to assert the new block is present.

  4. `aida statusline` already exists and works (EPIC-1-008) — no changes needed there.

  5. Document in scaffolded CLAUDE.md (one short bullet under Session Workflow) that the statusbar reflects role/project so the user knows to glance at it.

  ## Out of scope

  - Wiring the statusline into the user's GLOBAL ~/.claude/settings.json (that's a personal config decision, not something `aida init` should touch). Document the option in docs/admin-guide.md as a one-liner the user can copy.
  - Customization of what `aida statusline` shows — covered by EPIC-1-008.

  ## Related

  - Parent: EPIC-1-008 (aida status + statusline)
  - Related: EPIC-1-005 (personas — this is what makes the statusline most valuable)
