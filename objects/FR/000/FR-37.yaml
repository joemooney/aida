spec_id: FR-37
title: WASM gRPC-Web client connection to server
description: Connect the WASM browser client to the aida-server via gRPC-Web protocol. The new_wasm() function currently creates an empty RequirementsStore. It should initialize the tonic-web-wasm-client gRPC client and fetch requirements from the server on startup. This enables the browser-based GUI to display and manage requirements stored in the server database.
