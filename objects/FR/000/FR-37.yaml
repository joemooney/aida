  author: joe
  content: Implemented WASM gRPC-Web client connection. Added WASM-specific state fields for async loading (GrpcStorageClient, pending_store, load_error, loading flag). Modified new_wasm() to create gRPC-Web client and spawn async load task. Server address configurable via URL query param (?server=...). Uses Rc<RefCell<>> pattern for shared state between async task and UI. Code in update() applies loaded requirements when async completes.
