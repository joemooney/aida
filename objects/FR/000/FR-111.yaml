title: Settings/Types configurating custom priorities per type
description: |2
   Committed and pushed: 5eeb56c - feat: implement type-specific priorities in Add/Edit form

    Changes included:
    1. aida-core/src/models.rs - Added get_priorities_for_type() method to RequirementsStore (mirrors the existing get_statuses_for_type()
    pattern)
    2. aida-gui/src/app.rs - Updated the Add/Edit form:
      - Priority dropdown now uses type-specific priorities instead of hardcoded enum values
      - Priority auto-resets when changing type if current priority isn't valid for new type
      - Form uses string-based priority tracking (form_priority_string)
      - Change history properly tracks priority changes using effective_priority()
      - Save logic uses set_priority_from_str() for both new and edited requirements
    3. aida-core/src/db/sqlite_backend.rs - Added custom_priority: None placeholder (for when database column is added)

    The type-specific priorities feature is now fully integrated:
    - Quick-change popup ('p' key) shows type-specific priorities
    - Add/Edit form dropdown shows type-specific priorities
    - Settings > Types allows configuring custom priorities per type
