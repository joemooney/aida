title: New Window Menu option
description: |
  In Menu add `New Window` option to open a new session. In the new window the user may choose to switch databases for example or work in the
    same database.

   New Menu Option:
    - Added "🪟 New Window" to the Menu dropdown (between "New Project..." and "Restart")
    - Clicking it spawns a new instance of the application

    Implementation:
    - Added open_new_window() function that spawns a new process
    - Works in both development mode (via cargo run) and production mode (direct executable)
    - Passes through any command-line arguments to the new window
    - The new window opens independently, allowing users to:
      - Switch to a different project in the new window
      - Work with the same project in parallel (e.g., different requirements selected)
      - Compare requirements side-by-side
