spec_id: FR-278
title: Improve "requirement not found" error to surface store context
description: |-
  Today's `aida queue add EPIC-1-001 ...` from outside an aida-using project errors with just `Requirement not found: EPIC-1-001` — doesn't say where it looked, what storage mode it resolved, or how to point at the right store.

  ## Acceptance

  The error message should include:
  - The store path it actually queried (`/home/joe/ai/.aida-store`, `requirements.db`, `(none — no project context)`, etc.)
  - The detected mode (`distributed git-canonical`, `legacy SQLite`, `legacy YAML`, `none`)
  - A suggested fix: `cd into the project root` if no .aida/config.toml is reachable, or `--file <path>` for explicit override

  Example improved error:
    Requirement not found: EPIC-1-001
      Searched in: (no aida store found in /home/joe/ai/ or any parent)
      Hint: cd into the project root (a directory containing .aida/config.toml or requirements.db),
            or pass --file <path-to-store>

  ## Affected commands

  Anything that resolves a SPEC-ID against the current store: queue add/done, show, edit, comment add, rel add, etc. Probably worth a shared helper.

  Parent: EPIC-1-009 (CLI ergonomics).
