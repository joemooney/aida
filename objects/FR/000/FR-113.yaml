id: c818f849-7ccc-4710-890a-7b2d87df16da
spec_id: FR-113
title: ability to filter based on status, priority
description: |2
   1. requirements-core/src/models.rs - Added Hash derive to RequirementStatus and RequirementPriority enums to allow them to be used in
    HashSet for filtering
    2. requirements-gui/src/app.rs - Added:
      - Filter state fields: filter_statuses, filter_priorities, child_filter_statuses, child_filter_priorities (all HashSet types)
      - UI controls for status and priority filters in both root and children filter panels
      - Updated passes_filters() function to check status and priority against the filter sets

    The filtering works as follows:
    - Empty set = show all (no filter applied)
    - Non-empty set = only show requirements matching one of the selected values
    - Filters work independently for root requirements and child requirements
