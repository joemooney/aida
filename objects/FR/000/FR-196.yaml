title: WASM GUI cross-platform time compatibility
description: The WASM build of aida-gui uses the web-time crate instead of std::time for Instant and Duration types. This enables the GUI to compile and run in browser environments where std::time::Instant panics due to lack of monotonic clock support. The fix replaces all std::time::Instant with web_time::Instant which uses performance.now() on WASM and std::time on native.
