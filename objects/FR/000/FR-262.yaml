title: 'Phase 1 cleanup: drop aida db register, archive db migrate / db export-git, deprecate legacy backends'
description: |-
  ## What

  Phase 1 of the kernel/module audit (docs/plans/2026-05-09-kernel-module-audit.md).

  **Dropped (verdict D):**
  - \`aida db register\` CLI command + handler — multi-project SQLite registry path. Pre-EPIC-1-001, dead code now that orphan-branch is canonical.
  - \`aida db path --name <project>\` flag — ditto, the registered-project lookup is gone.
  - \`prompts::prompt_register_project()\` — only called from the dropped handler.
  - \`Registry\` and \`get_registry_path\` imports in main.rs — orphaned by the above.

  **Archived (verdict A):**
  - \`aida db migrate\` — marked \`#[clap(hide = true)]\`. Still callable for one-shot legacy migrations; doesn't appear in \`aida db --help\`.
  - \`aida db export-git\` — same treatment.
  - \`aida-core/src/db/sqlite_backend.rs\` — banner comment marks as ARCHIVED; still compiled because storage.rs still threads through it on the centralized-path branches. Full removal pending storage.rs refactor (separate session).
  - \`aida-core/src/db/yaml_backend.rs\` — same treatment.

  **Kept (verdict K):**
  - \`aida user-guide\` — per markup, "more readable document is nicer for certain new users."
  - \`registry.rs\` — kept as kernel since it has consumers beyond the dropped CLI register flow.

  ## Deferred to a separate session

  The \`storage.rs\` Storage facade still threads SqliteBackend on legacy code paths. After EPIC-1-001 the canonical kernel store is git-canonical only — the Storage facade can shrink dramatically once we cut those paths. That's a real refactor; deliberately out of Phase 1 scope.

  ## Acceptance

  - ✅ \`aida db register\` is gone (CLI + handler)
  - ✅ \`aida db migrate\` and \`aida db export-git\` hidden from \`db --help\` but still callable
  - ✅ Legacy backend headers carry ARCHIVED banners with FR-1-076 trace
  - ✅ \`aida db path\` works in git-canonical mode (was broken — fall-through bug)
  - ✅ 212 tests pass, no compile warnings
