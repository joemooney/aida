spec_id: FR-115
title: KanBan View Support
description: |-
  Add a KanBan board view for visualizing requirements workflow.

  ## Layout
  - Left Panel: Filtered requirements list (backlog/source)
  - Right Panel: KanBan board with configurable swimlanes

  ## Swimlane Options
  - By Status (Draft → In Progress → Review → Completed)
  - By Priority (Critical → High → Medium → Low)
  - By Custom Enum fields

  ## Features
  - Filter to single requirement type for consistent workflows
  - Drag cards between swimlanes to change values
  - Click card to view/edit details
  - WIP (Work-In-Progress) limits per column
  - Save board configurations as presets

  ## Card Display
  - Spec ID and title
  - Owner avatar/indicator
  - Priority badge
  - Tags

  ## Acceptance Criteria
  - [x] KanBan board renders with columns
  - [x] Cards display in correct columns based on field value
  - [x] Drag-and-drop updates the requirement field
  - [x] Configurable swimlane field (status/priority)
  - [x] WIP limits with visual indicator
  - [ ] Board presets can be saved/loaded
