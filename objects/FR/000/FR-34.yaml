id: 97aa0bdd-cecf-464a-9670-eb31965ce497
spec_id: FR-34
title: scollbar sync with mouse wheel
description: |2


  ~~in reqlist the mouse scrollwheel and the scrollbar are scolling at different rates so that the selected req is lagging. We need to leap ~~
  forward if the selected req falls behind

   The reqlist now keeps the selected requirement visible when scrolling:

    - When you scroll using the mouse wheel or scrollbar, if the selected requirement goes outside the visible area, it automatically snaps back
     into view
    - Uses TOP alignment when scrolling down (selected item above viewport)
    - Uses BOTTOM alignment when scrolling up (selected item below viewport)

    This prevents the selection from "lagging behind" the scroll position.


    - Mouse wheel: Scrolls the reqlist view without changing selection (standard behavior)
    - Up/Down arrows: Navigate selection and scroll selected item into view
    - PageUp/PageDown: Navigate selection by page
    - Home/End: Jump to first/last item
    - Click: Select an item
