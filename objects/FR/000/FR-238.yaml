id: 177c476f-2748-4c88-acf8-5c45ff4a4d24
spec_id: FR-238
title: Timeline view does not scroll with down/up arrow
description: |-
  Timeline view should auto-scroll to keep selected requirement visible during keyboard navigation.

  Current behavior: When navigating through requirements using up/down arrow keys (or j/k vim-style), the selected requirement can move outside the visible viewport while the scrollbar position remains unchanged.

  Expected behavior: When keyboard navigation moves the selection outside the currently visible area, the Timeline view should automatically scroll to ensure the selected requirement remains visible. This applies to both upward and downward navigation.

  Acceptance criteria:
  - Pressing down arrow or 'j' when selection is at bottom of visible area scrolls view down
  - Pressing up arrow or 'k' when selection is at top of visible area scrolls view up
  - Selected requirement should always be fully visible after navigation
  - Scroll behavior should be smooth and not jarring
