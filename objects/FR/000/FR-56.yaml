id: 6f01e105-63b3-446f-bc8d-6ef70772ea33
spec_id: FR-56
title: 'Team Queue View '
description: |-
  Team Queue View

  A team queue view provides a multi-panel layout for viewing requirements assigned to team members.

  **Layout:**
  - Left panel: List of team members (sourced from user list per FR-0006)
  - Right panel: Requirement list showing items in the selected team member's queue
  - Bottom panel: Detail view of the currently selected requirement

  **Queue Definition:**
  A user's queue contains requirements where they are the assigned owner with status 'approved' or 'in-progress'.

  **Behavior:**
  - Selecting a team member updates the right panel to show their queued requirements
  - Selecting a requirement in the right panel displays its details in the bottom panel
  - Empty queues display 'No requirements in queue'

  **Keyboard Navigation:**
  - Tab/Shift+Tab: Cycle between panels
  - j/k: Navigate within current panel list
  - Enter: Select item / expand details
  - Esc: Return focus to team member panel

  **Acceptance Criteria:**
  1. Team members are listed in left panel sorted alphabetically
  2. Clicking a team member shows only their queued requirements
  3. Requirement details appear in bottom panel when selected
  4. All panels support vim-style keyboard navigation
  5. Works with both YAML and SQLite backends
