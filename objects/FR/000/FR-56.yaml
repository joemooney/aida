  evaluation:
    quality_score: 4
    issues:
    - type: vague_language
      severity: high
      text: The term 'queue' is not defined anywhere in the requirement or project context. It's unclear what constitutes a user's queue - is it assigned requirements, requirements awaiting review, or something else?
      suggestion: 'Define what a ''queue'' means in this context. For example: ''A queue contains requirements assigned to a user with status in-progress or approved awaiting implementation.'''
    - type: incomplete
      severity: high
      text: No acceptance criteria or definition of done provided. The requirement doesn't specify when this feature would be considered complete.
      suggestion: 'Add acceptance criteria such as: ''Users can select a team member and see their queued requirements; clicking a requirement shows its details; keyboard navigation works between panels.'''
    - type: ambiguous
      severity: medium
      text: The phrase 'If there is a bottom panel' is ambiguous - it's unclear whether the bottom panel is optional, conditional, or always present.
      suggestion: Clarify whether the bottom panel is required ('The bottom panel displays...') or if this depends on configuration ('When detail panel is enabled...').
    - type: missing_criteria
      severity: medium
      text: No specification of how team members are defined or sourced. The requirement references 'team members' but doesn't explain how users become team members or where this data comes from.
      suggestion: Reference FR-0006 'maintain list of users' and clarify that team members come from the user list, or define how team membership is determined.
    - type: incomplete
      severity: medium
      text: No keyboard navigation patterns specified. Given the project uses vim-style navigation throughout, this should be addressed.
      suggestion: 'Specify keyboard shortcuts for: switching between panels (e.g., Ctrl+1/2/3), navigating team member list (j/k), navigating requirement list (j/k), and viewing details (Enter).'
    - type: missing_criteria
      severity: low
      text: No mention of empty states - what happens when a user has no items in their queue?
      suggestion: 'Specify behavior for empty queues: ''When a user has no queued requirements, display a message indicating the queue is empty.'''
