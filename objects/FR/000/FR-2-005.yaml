spec_id: FR-2-005
title: Pre-allocated agreed ID blocks per repo/shard for offline-safe trace comments
description: Each repo/shard should be able to claim a reserved block of agreed IDs (e.g. FR-300 to FR-399) stored in the aida-store branch (e.g. blocks.yaml), claimed atomically via git push. This allows trace comments (// trace:FR-300) to use stable agreed IDs immediately, even when disconnected. When the block is exhausted offline, fall back to local shard IDs (// trace:FR-1-005) which are understood as pointers-to-agreed and rewritten by tooling at next sync. The block registry must handle concurrent claims via push-wins-retry semantics.
