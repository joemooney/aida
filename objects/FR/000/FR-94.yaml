spec_id: FR-94
title: Requirements sync/merge workflow for distributed teams
description: "## Problem\nWhen multiple developers work on requirements in parallel with local SQLite databases, their changes need to be merged at sync points.\n\n## Scenarios\n\n### Simple Sync (No Conflicts)\nWhen only one person modified requirements:\n1. Export local SQLite to YAML\n2. Commit and push\n3. Others pull and re-import YAML to SQLite\n\n### Conflict Resolution\nWhen multiple people modified requirements:\n1. Each developer exports to YAML\n2. Use git merge on YAML files (human-readable diff)\n3. Resolve conflicts manually in YAML\n4. Import merged YAML back to SQLite\n\n## Proposed Commands\n```bash\n# Check for local changes not in YAML\naida db diff                    # Compare SQLite vs requirements.yaml\n\n# Merge remote YAML into local SQLite  \naida db sync                    # Pull YAML changes, merge with local\n\n# Three-way merge\naida db merge <base> <theirs>   # Merge external YAML with local\n```\n\n## Conflict Markers\nFor YAML conflicts, use standard git conflict markers. AIDA should:\n- Detect conflict markers in YAML\n- Provide UI to resolve conflicts (show both versions)\n- Validate merged result before importing\n\n## Notes\n- UUIDs ensure same requirement can be identified across databases\n- SPEC-IDs (FR-0042) may conflict if multiple people add requirements\n- Consider: auto-generate SPEC-IDs at sync time, not add time?"
