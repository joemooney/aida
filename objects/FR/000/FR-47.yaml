spec_id: FR-47
title: Team Management Support
description: |-
  Add support for Teams to organize users. A Team is a group of users (members). Teams support:
  - Users can belong to multiple teams
  - Teams can contain nested teams (hierarchical structure)
  - Organization chart view to visualize team structure and members
  - Settings tab for team management with sub-tabs for Users and Teams under a Members section

  This is the parent feature for all team-related functionality.
