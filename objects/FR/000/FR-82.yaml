title: AI Implement Button
description: |+
  AI Implement Button

  "Copy for Claude Code" feature. Here's a summary of what was done:

    Implementation Complete

    Added a new button "Copy for Claude Code" in the Actions → AI submenu that:

    1. Location: Appears at the bottom of the AI submenu (after a separator), making it easy to find
      - Path: Actions → AI → Copy for Claude Code
    2. Availability: Only enabled when the requirement has status "Approved"
      - Shows a helpful tooltip when disabled: "Requirement must be Approved to implement"
    3. Formatted Output: When clicked, copies a well-structured prompt to clipboard including:
      - Requirement ID and title
      - Type, Priority, and Feature
      - Full description
      - Tags (if any)
      - Implementation instructions with guidance on:
          - Following project patterns
        - Adding tests
        - Updating status when done
    4. User Feedback: Shows a toast notification confirming the copy with the requirement ID
    5. Linux Support: Also copies to the PRIMARY selection for middle-click paste

    Example Output

    When you click "Copy for Claude Code" on an approved requirement, this gets copied to your clipboard:

    # Implement Requirement: FR-0001 - User Authentication

    **Type:** Functional
    **Priority:** High
    **Feature:** 1-Authentication

    ## Description

    The system shall provide secure user authentication...

    ## Tags

    - security
    - authentication

    ## Implementation Task

    Please implement this requirement in the codebase. After implementation:
    1. Ensure the code follows the project's existing patterns and style
    2. Add appropriate tests if applicable
    3. Update the requirement status to 'Completed' when done

