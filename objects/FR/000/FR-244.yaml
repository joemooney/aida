spec_id: FR-244
title: CI/CD Template Generation for Traceability
description: |-
  Generate CI/CD pipeline templates that enforce code traceability:

  **GitHub Actions Templates:**
  - Traceability check workflow
  - Validates all PRs include trace comments for changed code
  - Generates coverage report as PR comment
  - Fails build if traceability threshold not met

  **GitLab CI Templates:**
  - Similar functionality for GitLab pipelines
  - Integration with merge request comments

  **Configuration:**
  - Minimum coverage threshold (percentage)
  - Required trace format validation
  - Exemption patterns (test files, generated code)

  **Template Features:**
  - Caches aida binary for faster runs
  - Outputs traceability matrix artifact
  - Posts summary to PR/MR comments

  **Acceptance Criteria:**
  - [ ] GitHub Actions workflow template generated
  - [ ] GitLab CI template generated
  - [ ] Configurable coverage thresholds
  - [ ] Exemption patterns supported
