title: 'Spec-boundary handoff: session reap + chained next-spec launch (no human at every boundary)'
description: 'Mirrored from quizdom TASK-3 (VIS-2 dogfood finding, 2026-05-31, EPIC-9 -> STORY-48 handoff). A scoped implementer session, when done with its spec, cannot (1) tear down its own worktree (it is the live cwd — session end correctly refuses) nor (2) pick up the next spec from within (scope binding forbids — scope-bleed failure mode). So every spec boundary needs a human: exit agent -> external ''aida session end <id>'' -> ''aida agent new --spec <next>''. Candidates: (a) ''aida session reap'' supervisor pass removing worktrees whose branch is merged AND whose process exited; (b) chained handoff — on clean completion, reap + auto-launch the next queued spec in a fresh worktree; (c) at minimum ''aida session handoff'' that prints/executes the reap+next-start steps. Related but narrower, already shipped: BUG-694 (mcp-claim GC), TASK-878 (worktree GC).'
