id: 04c92aa7-e9fb-49a9-a528-590a446f8819
spec_id: FR-59
title: Type Definition Editor
description: "For the Types in the Settings, does it make sense to have an editor so that we can add/remove/update fields? \n\n● Yes, that makes sense. Currently the Type Definitions tab in Settings is read-only - it just displays the built-in types. Adding an editor\n  would allow users to:\n\n  1. Add new custom types - Define entirely new requirement types with custom prefixes, statuses, and fields\n  2. Modify existing types - Add/remove statuses, add/remove custom fields, change descriptions\n  3. Remove custom types - Delete user-defined types (though built-in types could be protected or just resettable)\n\n  Before I implement this, I have a few questions to clarify the design:\n                                                                                                                                             \n● User answered Claude's questions:\n  ⎿  · Should users be able to modify the built-in types (Functional, NonFunctional, System, User, ChangeRequest), or only create new custom \n     types? → Modify built-ins\n     · What happens to existing requirements when a type definition is changed? → Validate on save\n  Type Definition Editor Features:\n\n  1. View Types: Each type is shown in a collapsible section with icons (📦 built-in, 📝 custom)\n  2. Edit Types (✏ button):\n    - Modify display name, description, and ID prefix\n    - Add/remove statuses (with validation - can't remove statuses in use)\n    - Add/edit/remove custom fields (with validation - can't remove fields in use)\n  3. Add New Types (➕ Add New Type):\n    - Define internal name, display name, description, prefix\n    - Configure statuses (starts with default Draft/Approved/Completed/Rejected)\n    - Add custom fields of any type (Text, TextArea, Select, Boolean, Date, Number, User Reference, Requirement Reference)\n  4. Reset Built-in Types (↺ button):\n    - Reset individual built-in type to its default configuration\n    - \"Reset All to Defaults\" to restore all built-in types\n  5. Delete Custom Types (🗑 button):\n    - Only available for custom types (not built-in)\n    - Validation prevents deleting types that are in use by existing requirements\n\n  Committed as 42ab12a and pushed to GitHub.\n\n"
