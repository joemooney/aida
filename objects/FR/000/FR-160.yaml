id: d0f16bc7-788b-4d6c-ac49-3a48fc678e50
spec_id: FR-160
title: comment emoji reactions
description: |
  Have several (configuable) emoji that we can attach to a comment. A checkmark for resolved would be a minimal need or one for rejected.
  configurable emoji reactions feature for comments:

    Features added:
    - 6 built-in reactions: ✅ Resolved, ❌ Rejected, 👍 Thumbs Up, 👎 Thumbs Down, ❓ Question, ⚠️ Important
    - Reaction picker: Click the 😊 button on any comment to see available reactions
    - Toggle reactions: Click to add, click again to remove your reaction
    - Reaction counts: Shows how many people have reacted with each emoji, with a ✓ if you've reacted
    - Configurable: Go to Settings > Reactions tab to:
      - Add custom reactions with your own emoji and labels
      - Edit existing reactions (emoji, label, description)
      - Delete custom reactions (built-in ones can't be deleted)
      - Reset to defaults
