title: CHANGELOG.md maintenance
description: |-
  The skill shall maintain a CHANGELOG.md file following Keep a Changelog format.

  ## Format
  Follow https://keepachangelog.com/en/1.0.0/ format:
  - [Unreleased] section for pending changes
  - Version sections with date: ## [1.2.3] - 2025-12-02
  - Categories: Added, Changed, Deprecated, Removed, Fixed, Security

  ## Operations
  1. Read existing CHANGELOG.md (or create if missing)
  2. Move [Unreleased] content to new version section
  3. Add new [Unreleased] header
  4. Map requirement types to changelog categories

  ## Mapping
  - Functional -> Added
  - Bug -> Fixed
  - ChangeRequest -> Changed
  - Epic/Story/Task -> Added (features)

  ## Acceptance Criteria
  - Create CHANGELOG.md if not exists
  - Preserve existing content
  - Add new version section with date
  - Map requirements to appropriate categories
