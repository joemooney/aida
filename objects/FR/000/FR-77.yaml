title: AI scaffhold project with skills during new pro...
description: |-
  ## AI Project Scaffolding

  The system shall provide AI-assisted project scaffolding capabilities accessible from the AI tab in Settings.

  ### Trigger Points
  Scaffolding shall be available:
  - **During new project creation**: Automatically offer scaffolding as part of the new project wizard
  - **On demand**: Via a "Scaffold Project" button in Settings > AI tab for existing projects

  ### Scaffolding Components
  The scaffolding feature shall generate the following project artifacts:
  - [ ] CLAUDE.md - Project instructions for Claude Code
  - [ ] .claude/commands/ directory with project-specific slash commands
  - [ ] Requirements-driven development skills (/aida-req, /aida-implement)
  - [ ] Project-specific custom skills based on project type
  - [ ] Code traceability configuration

  ### User Workflow
  1. User selects "Scaffold Project" or creates new project
  2. System analyzes project context (existing requirements, features, tech stack)
  3. System presents scaffolding options with preview
  4. User confirms or customizes selections
  5. System generates selected artifacts

  ### Acceptance Criteria
  - [x] Scaffold button visible in Settings > AI tab
  - [ ] New project wizard includes scaffolding step (TODO: future enhancement)
  - [x] Generated CLAUDE.md contains project-specific context
  - [x] Generated skills are functional in Claude Code
  - [x] User can preview artifacts before generation
  - [x] Existing files prompt for overwrite confirmation

  **Reference**: See ~/ai/ai-provenance for implementation patterns

  ### Implementation Notes (2025-12-01)
  - Added `scaffolding` module to `aida-core` with `ScaffoldConfig`, `Scaffolder`, and related types
  - Scaffold dialog accessible from Settings > AI tab via "Scaffold Project" button
  - Generates: CLAUDE.md, .claude/commands/, .claude/skills/
  - Supports project type selection (Rust, Python, TypeScript, Web, API, CLI, Generic)
  - Preview shows new files, overwrites, and artifact details
  - Tech stack input for customizing generated content
