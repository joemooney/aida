id: e3a175d0-bc4f-4d13-9bc9-d0bd8c43a230
spec_id: FR-219
title: Support Attachments
description: |-
  Support Attachments

  Support file attachments for requirements with the following capabilities:

  **Storage:**
  - Store attachments on the filesystem in a project-specific attachments directory
  - Support common file types: images (PNG, JPG, GIF), documents (PDF, TXT, MD), and archives (ZIP)
  - Maximum file size: 10MB per attachment (settings allow set limits)
  - Maximum attachments per requirement: 10 (settings allow set limits)
  - Settings allow command line specification for a file type with '{{path}}' as a substitution pattern for the attachment path. (Support other metadata field substitutions based on field name (case insensitive) {{id}} for id etc.

  **User Interface:**
  - Display attachments as a list showing filename, size, and type icon
  - Double-click attachment to open with the system's default application
  - Provide add, delete, and download attachment buttons
  - Show error message if the operating system cannot open the file type

  **Data Management:**
  - Include attachment metadata in exports (filename, size, hash)
  - Optionally include attachment files in export archives
  - Maintain referential integrity when requirements are deleted (prompt to delete or orphan attachments)
