title: 'Phase 3 auto-allocate: claim blocks for all common types, not just FR'
description: |-
  ## Problem

  EPIC-1-052 Phase 3's \`auto_allocate_first_block\` (in aida-cli/src/main.rs) only allocates an \`FR\` block when \`aida node acquire\` runs. Other common types (\`BUG\`, \`TASK\`, \`EPIC\`, \`STORY\`, \`SPIKE\`) get no block, so new requirements of those types fall through to the node-aware form (\`TASK-1-019\`) instead of the short global form (\`TASK-19\`). User reported this as visual noise in \`aida list\`.

  ## Solution

  Extend \`auto_allocate_first_block\` to allocate blocks for all common types: \`FR\`, \`BUG\`, \`TASK\`, \`EPIC\`, \`STORY\`, \`SPIKE\`. Each gets a default size 100. The function is renamed to \`auto_allocate_initial_blocks\` to reflect plural intent. The CLI confirmation message lists what was allocated.

  ## Acceptance

  - \`aida node acquire\` (with policy = blocks-then-fallback or blocks-only) allocates 6 blocks
  - Each block claim goes through the existing CAS push loop; partial failures roll back consistently
  - Existing FR-only callers (legacy paths) still work — no new arg surfaces
  - Idempotent: re-running on a node that already has blocks for some types skips those, claims only the missing ones
  - One commit per block (today's behavior) OR a single batched commit. v1 keeps per-block for simplicity.
