title: Git tagging for releases
description: |-
  The skill shall create git tags for releases with appropriate metadata.

  ## Tag Format
  - Default: v{major}.{minor}.{patch} (e.g., v1.2.3)
  - Annotated tags with release notes as message
  - Optional: GPG signing if configured

  ## Operations
  1. Verify working directory is clean
  2. Create annotated tag with version
  3. Include release notes in tag message
  4. Optionally push tag to remote

  ## Acceptance Criteria
  - Create annotated git tags
  - Include release summary in tag message
  - Verify no uncommitted changes before tagging
  - Support push to remote (with confirmation)
