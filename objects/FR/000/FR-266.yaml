spec_id: FR-266
title: Global queue spanning projects (aida queue --global)
description: |-
  Queues today are per-project (stored in the orphan-branch store at <project>/.aida-store/registry/queues/<user>.yaml). For solo devs hopping between repos with the same persona (e.g., 'implementer' working on AIDA in the morning and paradox in the afternoon), this means N queues to remember/check.

  Roles already support `--global` (state at ~/.aida/roles/). Queues should match.

  ## Acceptance

  - `aida queue add <id> --for <role> --global` stores the entry in a global queue at `~/.aida/queue/<role>.yaml`
  - `aida queue list --global` shows the global queue for the active role (or all if --all)
  - `aida queue list` (default) merges local + global with origin tag, e.g.:
      1. FR-1-042  Add OAuth provider  [Approved]  [for:implementer]  [origin:aida]
      2. FR-2-007  Refactor parser     [In-progress] [for:implementer] [origin:paradox]
  - `aida queue next` considers both local and global, with local taking precedence for tiebreaks (because local context is closer)
  - A global queue entry needs a project pointer so `aida show <id>` from a different project can resolve it (store the source project root in the entry)

  ## Open design questions

  - How does the implementer session know which PROJECT to switch to when picking up a global item? Auto-cd? Print a hint? Refuse if not in the right project?
  - Conflict semantics if the same SPEC-ID exists in multiple projects (rare but possible with node-namespaced IDs)?

  Parent: EPIC-1-006 (Queue routing).
