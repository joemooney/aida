spec_id: FR-151
title: Double cllick Description to enter Edit
description: |
  Double click Description to enter Edit, and switch focus to the Description textbox.

    What was implemented:
    - Double-clicking on the background area of the Detail view (any empty space not covered by buttons, text, etc.) will now open the Edit form
     for the currently selected requirement
    - The feature is disabled when modals are open (URL form, Reference picker, Add comment form) to prevent unintended edits
    - This works alongside the existing double-click on the Description tab content (which focuses the description field)

    How it works:
    - Uses egui's interact_bg() method to detect clicks on background/empty areas
    - Only triggers when no modal dialogs are open
    - Complements the "✏ Edit" button - just a faster way to start editing
