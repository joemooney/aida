title: Code Traceability Query and Reporting
description: |-
  Provide CLI commands and GUI features to query and report on code traceability:

  **CLI Commands:**
  - aida trace list - List all trace comments found in codebase
  - aida trace verify - Verify all trace references point to valid requirements
  - aida trace report - Generate traceability matrix report
  - aida trace orphans - Find requirements without any trace references

  **GUI Integration:**
  - Traceability tab showing linked code locations
  - Click to open file at trace location
  - Coverage statistics per requirement

  **Report Formats:**
  - Markdown traceability matrix
  - JSON export for CI/CD integration
  - HTML report with cross-links

  **Acceptance Criteria:**
  - [ ] Can scan codebase for trace comments
  - [ ] Can validate trace references
  - [ ] Can generate traceability reports
  - [ ] GUI shows linked code locations
