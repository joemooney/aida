spec_id: FR-276
title: aida session — enriched wrapper around claude --resume that surfaces AIDA role + spec context
description: |-
  **Problem**

  Claude Code's resume-session picker shows AI-generated subjects for past sessions but no signal about which AIDA role / spec the session was working on. The user has to recognize sessions by their subject alone, even though the SessionStart hook (TASK-1-022) already injects role context that's recoverable from the session's .jsonl.

  Also: subject text is auto-generated by Claude (line of type 'ai-title' written into ~/.claude/projects/<encoded-cwd>/<session-id>.jsonl) — not user-controllable. So influencing the picker directly isn't possible. Wrapper is.

  **Surface**

    aida session list                  # tabular list of recent sessions
    aida session resume                # interactive picker (inquire), then exec claude --resume <id>
    aida session resume <id>           # direct resume by id

  **Display columns (list and picker)**

  - session-id (8-char prefix)
  - age (humanized: '5m ago', '2h ago', '3d ago')
  - role (extracted from SessionStart hook output in the .jsonl, dash if absent)
  - @SPEC (most recent spec mentioned in the session, dash if none)
  - ai-title (the auto-generated subject Claude already shows)

  **Implementation outline**

  1. Encode CWD into Claude Code's project-dir naming: '/' → '-', leading '-'.
  2. Walk ~/.claude/projects/<encoded>/*.jsonl, oldest-newest order.
  3. For each file, parse only the lines we need:
     - First line for timestamp
     - Any 'ai-title' event for the subject
     - Grep for '# AIDA active role: <name>' marker (TASK-1-022's hook output)
     - Grep for 'spec_id' or @SPEC patterns for last-spec hint
  4. Render with inquire for the picker (already in workspace deps).
  5. Resume = std::process::Command::new('claude').args(['--resume', id]).exec()/spawn.

  **Acceptance**

  - aida session list (no flag) shows top 20 sessions for current cwd
  - aida session resume opens an inquire selection, returns choice, execs claude --resume
  - aida session resume <id> short-circuits to exec
  - Sub-100ms for list (parsing ~20 files, only header lines + grep)

  **Out of scope (v1)**

  - Cross-project sessions (no --all flag)
  - Session deletion / rename
  - Saving role explicitly per session (we read the SessionStart hook output as-is)
