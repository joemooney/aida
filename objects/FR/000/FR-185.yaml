title: 'Claude Code Skill: aida-req'
description: |-
  The system shall provide a Claude Code skill (/aida-req) that guides users through adding new requirements with AI-powered evaluation feedback.

  ### Features
  - Interactive requirement gathering (description, type, priority, feature, tags)
  - Immediate requirement creation with draft status
  - Background AI evaluation with quality scoring
  - Follow-up actions (improve, split, link, accept)

  ### Acceptance Criteria
  - Skill file exists at .claude/skills/aida-req.md
  - User can invoke /aida-req in Claude Code
  - Requirements are added to the database immediately
  - AI evaluation runs and provides feedback
