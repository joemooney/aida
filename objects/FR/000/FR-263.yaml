spec_id: FR-263
title: aida node release should optionally free block ownership
description: |-
  ## Problem

  `aida node release <id>` removes the entry from `registry/nodes.toml` but leaves any `AgreedIdBlock`s in `registry/blocks.yaml` orphaned (still listing the released node as owner). Symptoms:
  - `aida db block list` shows blocks for nodes no longer in the registry
  - `aida node acquire`'s safety check sees those blocks as "node id in use" and skips past them — which is correct for live nodes but wrong for tombstoned ones
  - The dispense path looks for blocks by `node_id`; orphaned blocks become dead ranges

  ## Acceptance

  - `aida node release <id> --free-blocks` (opt-in flag) also removes that node's blocks from `blocks.yaml` in the same CAS push
  - Default behavior (no flag) prints a one-line summary of blocks left orphaned and the command to clean them up
  - `aida db block list` annotates blocks whose owner is no longer in nodes.toml as `(orphaned)`

  ## Related

  - EPIC-1-052 Phase 1 (release path); the block-cleanup feature was deliberately scoped out
