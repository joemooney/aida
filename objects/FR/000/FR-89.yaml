title: File attachments for requirements
description: |-
  Add the ability to attach files to requirements via the GUI.

  **Implemented Features:**
  - Attachment struct with metadata (filename, path, size, mime type, added_by)
  - Storage methods for managing files in attachments/<spec_id>/ directory
  - Attachments tab in GUI detail view
  - File picker button to add attachments
  - Click to open in system default application
  - Remove attachment functionality
  - Keyboard shortcut 't' to switch to Attachments tab

  **Deferred:**
  - Drag-and-drop visual feedback overlay
  - Git auto-commit for attachments
