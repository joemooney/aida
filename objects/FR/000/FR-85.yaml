spec_id: FR-85
title: Settings Members Tab with Users and Teams Sub-tabs
description: |-
  Add a Members tab to the Settings panel with sub-tabs for Users and Teams:

  **Members Tab Structure:**
  - Parent tab called 'Members' in Settings
  - Sub-tab: 'Users' - manage individual users (existing user management)
  - Sub-tab: 'Teams' - manage teams

  **Teams Sub-tab Features:**
  - List all teams with name, member count, parent team
  - Create new team (name, description, parent team selector)
  - Edit existing team
  - Delete team (with confirmation, handle nested teams)
  - Assign/remove members from team
  - Set parent team for hierarchy

  This reorganizes user management under a Members umbrella alongside team management.
