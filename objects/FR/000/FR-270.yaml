id: 019df65c-143e-7482-972d-f38be22d5e39
spec_id: FR-270
title: Managed-merge slot-merge for settings.json + .mcp.json (FR-1-028 v2 / SPIKE-1-029 Q3)
description: |-
  **Closes the v2 of FR-1-028 / SPIKE-1-029 §Q3**

  v1 of 'aida scaffold upgrade' deferred slot-merge for ManagedMerge category files — they're left alone if existing. That means changes to AIDA-owned bits inside .claude/settings.json or .mcp.json (the prompted case from chat: bumping statusLine command to --color=always, adding the SessionStart hook from TASK-1-022) can't propagate to existing projects without --force (which clobbers user content).

  This FR ships JSON-Pointer-based slot-merge per the spike's §Q3 design.

  ## Slot model

  Per file, a hard-coded list of JSON Pointer paths declares what AIDA owns:

    settings.json:  /hooks/PreToolUse, /hooks/PostToolUse, /statusLine
    .mcp.json:      /mcpServers/aida

  For each slot:
  - User's value at slot == AIDA's → no-op
  - User's value differs    → replace with AIDA's
  - User's slot is missing  → add (creating intermediate objects as needed)
  - AIDA's slot is missing  → leave user's value alone

  User keys OUTSIDE any AIDA slot are preserved verbatim. Worked example:

    user adds permissions.deny + hooks.Stop  →  preserved
    user has stale statusLine.command         →  replaced
    user has matching hooks.PreToolUse        →  unchanged

  ## Surface

    aida scaffold upgrade   # now actually upgrades managed-merge files
                            # (was: 'leave alone with deferred note' in v1)
    aida scaffold upgrade --dry-run    # shows per-slot diff
    aida scaffold upgrade --force      # whole-file overwrite (unchanged)

  ## Implementation

  Use serde_json::Value::pointer / pointer_mut (RFC 6901). No new crate.
  For 'set or create missing slot', walk the path and insert intermediate objects. Helper in scaffolding/managed_merge.rs (new file).

  run_scaffold_upgrade adds a SlotMerge variant to UpgradeAction. ManagedMerge files with slot drift → SlotMerge instead of LeaveAlone.

  ## Acceptance

  - aida scaffold upgrade replaces a stale AIDA-owned slot, preserving user-owned keys outside the slot
  - aida scaffold upgrade --dry-run shows which slots would change
  - Existing tests still pass; new tests cover the slot-merge primitive
  - Paradox's settings.json gets --color=always added to statusLine on next 'scaffold upgrade'

  ## Out of scope (v3)

  - Confirm-before-write prompt (--yes)
  - Manifest.toml as the slot-declaration source of truth (still hard-coded for v2 — manifest is its own larger refactor)
  - Slot removal when AIDA drops a slot from its template
  - JSONPath (vs simple JSON Pointer) for slot expressions
