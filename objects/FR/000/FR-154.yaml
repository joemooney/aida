id: 7e7f5a93-f0ac-4fde-85eb-8852f43065b8
spec_id: FR-154
title: Reference relation
description: |
  In Links tab add a button for `+ Reference` which will open a modal with a search box that will perform a full fuzzy search for and show a
    list of requirements to select from and wither double click or select and Link (button) to create the reference relationship.

  Reference picker feature to the Links tab:

    What was implemented:
    - A new "+ Reference" button in the Links tab → Relationships section
    - Clicking it opens a modal with:
      - A search box with auto-focus for fuzzy searching
      - Searches across spec ID, title, and description (case-insensitive contains matching)
      - Shows up to 50 matching requirements
      - Each item displays the spec ID and title
      - Hovering shows status and truncated description
      - Already-referenced requirements and self are filtered out

    How to use:
    1. Click "+ Reference" button
    2. Type to filter the list (or leave empty to see all)
    3. Either:
      - Double-click a requirement to immediately create the reference
      - Single-click to select, then click "Link" button
    4. Click "Cancel" to close without creating a reference
