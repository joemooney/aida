title: Simple search command for requirements
description: |-
  Add `aida search` as a simplified, user-friendly search command that wraps `aida grep` with sensible defaults:
  - Case-insensitive by default (use -s/--case-sensitive for exact case)
  - Searches all text fields (title, description, comments)
  - Simpler syntax: `aida search auth` vs `aida grep auth -i`
  - Optional status and feature filters
