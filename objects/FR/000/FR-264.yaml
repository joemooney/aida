title: 'aida push: unified code+store push (single command instead of git push && aida db sync --push)'
description: Today users have to run `git push` for code and `aida db sync --push` for the orphan store as two separate operations. Easy to forget the second and end up with code public but reqs only local. Add an `aida push` wrapper that does both, or a git post-push hook. Surfaced 2026-05-09 walkthrough.
