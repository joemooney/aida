title: Server graceful shutdown with REST API
description: The aida-server now properly handles Ctrl+C (SIGINT) by gracefully shutting down both the gRPC server and the REST API server. Uses tokio::sync::watch channel to share shutdown signal between servers. The REST server uses axum's with_graceful_shutdown() to properly close connections before exit.
