id: dafb91f7-2950-4e88-a658-4f70f970c29c
spec_id: FR-129
title: ESC ESC (twice) in a view that is the the defau...
description: |-
  Pressing ESC twice in quick succession (within 500ms) from any non-default view should navigate back to the default view.

  Default View Behavior:
  - The default view is initially the Requirements List
  - When on the default view, double-ESC has no effect

  Acceptance Criteria:
  1. Double-ESC from Settings, Detail, or other views returns to Requirements List
  2. Single ESC retains current behavior (close dialogs, cancel edit mode)
  3. Double-ESC timing window is 500ms between key presses
  4. Visual or audio feedback is optional but not required

  Future Consideration (separate requirement): Allow users to configure which view is their default in Settings.
