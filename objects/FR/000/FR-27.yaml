id: 4dba3fb5-cd72-402c-886a-caf0f8f133d4
spec_id: FR-27
title: Team Data Model
description: |-
  Define the Team entity with the following properties:
  - Team ID (unique identifier)
  - Team name
  - Team description (optional)
  - Parent team reference (for nested teams, nullable)
  - List of member user IDs
  - Created/modified timestamps

  Constraints:
  - A team can have zero or more child teams
  - A team can have zero or more members
  - Users can belong to multiple teams
  - Circular nesting must be prevented
