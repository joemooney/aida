spec_id: FR-233
title: Quick Action button
description: |
  Instead of Archive and Delete have a single Quick Action button dropdown of actions that can be taken on requirement. Have  Priority (which will be a sub-dropdown of possible priorities for that requirement). Also have Status as a sub-dropdown  with possible priorities for that requirement then also in the Status sub-dropdown, a separator if possible, and Archive and Delete actions.

  a single "⚡ Actions" dropdown menu that contains:

    1. Priority submenu - shows High, Medium, Low options with a checkmark (✓) next to the current priority
    2. Status submenu - contains:
      - Status options: Draft, Approved, Completed, Rejected (with checkmark for current)
      - A separator line
      - Archive/Unarchive action (icon changes based on current state)
      - Delete action

    All changes to priority and status are tracked in the requirement's change history, so they appear in the History tab.
