spec_id: FR-259
title: 'aida db retire-legacy-ids: collapse legacy spec_ids onto agreed_ids'
description: |-
  ## Problem

  After EPIC-1-001 + merge-gate, legacy requirements have spec_id ≠ agreed_id (e.g., \`spec_id = "FR-0153"\` and \`agreed_id = "FR-140"\`). The two values surface as separate columns in \`aida list\` (now suppressed by default per FR-1-071) and the YAML file lives at the legacy spec_id path.

  ## Solution

  New \`aida db retire-legacy-ids [--dry-run]\` walks the store and, for each requirement where spec_id ≠ agreed_id, sets spec_id := agreed_id and clears agreed_id. The YAML file moves to the new sharded path automatically (save()'s delete-orphans pass cleans up the old one). Relationships use UUIDs so they're unaffected.

  Caveats: legacy origin ids encoded feature prefixes (REQLIST-, AUTH-, AI-) that are LOST under the agreed_id (merge-gate assigns by type-default, e.g., FR for functional). Run \`--dry-run\` first.

  Trace: FR-1-072.
