title: Release notes generation from requirements
description: |-
  The skill shall generate release notes from completed requirements since the last release.

  ## Data Sources
  1. Requirements with status=Completed modified since last release tag
  2. IMPL tasks completed since last release
  3. Git commits since last tag (for context)

  ## Output Format
  - Grouped by type (Features, Bug Fixes, etc.)
  - Include SPEC-ID and title for each item
  - Link to requirement details where applicable
  - Summary statistics (X features, Y bug fixes, etc.)

  ## Acceptance Criteria
  - Query requirements by modified_at > last_release_date
  - Group by requirement type
  - Generate markdown-formatted release notes
  - Support customization of output format
