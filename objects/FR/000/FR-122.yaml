spec_id: FR-122
title: 'Web UI Skill Invocation with SSE streaming (pilot: compiler-warnings)'
description: |-
  The Skills Browser view supports running executable skills directly from the web UI. Pilot implementation uses /aida-compiler-warnings skill. Features:
  - Server-side skill runner (aida-server/src/skill_runner.rs) with SSE streaming endpoints
  - POST /api/v2/skills/:name/run — streams logs, progress, and structured results via SSE
  - POST /api/v2/skills/:name/action — executes actions (auto-fix, create-task, create-defect)
  - POST /api/v2/skills/:name/chat — AI chat follow-up with warnings context
  - Cargo clippy JSON output parsing with warning categorization by risk level (none/low/medium/high)
  - React SkillRunnerPanel slide-out with real-time log output, structured WarningsReport
  - Action buttons: Auto-Fix All, Create Task, Create Defect per category
  - SkillChat component for AI-powered follow-up questions about results
  - Runnable skills identified via RUNNABLE_SKILLS set in SkillCard
  - Concurrent execution lock prevents multiple simultaneous skill runs
