id: 0b6acb18-ebe2-49b4-ab44-158213504f25
spec_id: FR-74
title: Filtered Parent
description: |
  If a requirement is selected by a filter but not its parents, then should show the parents but greyed out.

  If a requirement is selected by a filter but not its parents, then should show the parents but greyed out

  ● provide better context by showing where the filtered requirement sits in the hierarchy, while making it clear
    which items actually match the filter criteria.

    The behavior would be:
    - Matching requirements: Normal display (full color)
    - Non-matching ancestors: Displayed but greyed out/dimmed, showing the path to the matching child
    - Non-matching siblings/other branches: Hidden (as they are now)
