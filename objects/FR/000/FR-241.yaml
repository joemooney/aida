spec_id: FR-241
title: Custom type definitions
description: |
  Custom Type Definitions System Implemented:

    1. Core Models (requirements-core/src/models.rs):
      - Added CustomFieldType enum with 8 field types (Text, TextArea, Select, Boolean, Date, User, Requirement, Number)
      - Added CustomFieldDefinition struct for defining custom fields
      - Added CustomTypeDefinition struct for defining requirement types
      - Added type_definitions to RequirementsStore with default built-in types
      - Added custom_status and custom_fields to Requirement struct
      - Added helper methods: effective_status(), set_status_from_str(), get_type_definition(), get_statuses_for_type(),
    get_custom_fields_for_type()
    2. Built-in Types:
      - Standard types (Functional, NonFunctional, System, User) with default statuses
      - ChangeRequest type with custom workflow: Draft → Submitted → Under Review → Approved/Rejected → In Progress → Implemented → Verified →
    Closed
      - ChangeRequest has custom fields: Impact (select), Requested By (user reference), Target Release (text), Justification (textarea,
    required)
    3. GUI Updates (requirements-gui/src/app.rs):
      - Form now uses type-specific status dropdown
      - When type changes, available statuses update dynamically
      - Custom fields section appears when a type has custom fields
      - Supports all field types with appropriate UI controls
      - Added "📝 Types" settings tab to view configured type definitions
    4. Documentation Updated:
      - Updated user-guide.md with Type Definitions section
      - Updated OVERVIEW.md with custom type definitions feature
      - Updated PROMPT_HISTORY.md with Session 7 details
