spec_id: FR-271
title: 'id_format counter_scope: per-type vs global counter mode'
description: |-
  ## Problem

  Today AIDA dispenses agreed-ids per type prefix — \`FR\` has its own counter, \`BUG\` has its own counter, etc. So you can have \`FR-1\` and \`BUG-1\` simultaneously. This is the only mode supported.

  A configurable alternative: a single global counter that's shared across all types. Then numbers are globally unique — \`FR-1\` exists, but you can't ALSO have \`BUG-1\` because the next bug after FR-1 is \`BUG-2\`. Dispense order doesn't care about type; the type prefix is just a human-friendly label.

  ## Why it matters

  Three concrete simplifications under global-counter mode:

  1. **Phase 3 auto-allocate collapses to one block per clone.** Today's "claim FR + BUG + TASK + EPIC + STORY + SPIKE" enumeration goes away — one contiguous range covers all types.
  2. **\`aida db merge-gate\` runs against one counter** instead of one per type. Single source of truth.
  3. **References become unambiguous globally.** "see #42" works without disambiguating type — only one req has 42.

  ## Tradeoff

  Numbers grow faster per type (e.g., \`FR-1247\` after ~1000 BUGs got intermixed) instead of staying compact (\`FR-15\`). The type prefix already carries human-friendly context, so this is mostly cosmetic.

  ## Acceptance

  - New \`.aida/config.toml\` key: \`[id_format] counter_scope = "per-type" | "global"\`. Default \`"per-type"\` for back-compat with existing projects.
  - \`aida init\` prompts the user to pick (or accept default).
  - \`auto_allocate_first_block\` (Phase 3 of EPIC-1-052):
    - per-type: claim FR/BUG/TASK/EPIC/STORY/SPIKE blocks (covered by FR-1-073)
    - global: claim ONE block with sentinel \`type_prefix = "*"\` (or model extension)
  - \`merge_gate\`:
    - per-type: same as today
    - global: dispense from a single GLOBAL counter; type prefix applied at format time
  - Dispense at \`aida add\` time (FR-2-005 path): block lookup ignores type prefix in global mode
  - \`aida db block list\` annotates the scope ("* (any type)" for global blocks)
  - Migration tool to convert an existing per-type store to global if the user changes their mind: \`aida db rescope-counter --to global\` (and the reverse). Renumbers existing reqs.

  ## Out of scope

  - Migrating the AIDA self-hosted repo. AIDA's own store stays per-type; this option is for new projects to opt into.
