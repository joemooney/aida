description: "Work Queue View\n\nA user or team can have a work queue folder type. This is an ordered list of requirements with a ranking. It is a type of Inbox and we will have other inboxes (such as notifcations, or mentions in comments). A user or a manager may wish to see what is in the work queue for that user. They can drag items higher or lower. "
