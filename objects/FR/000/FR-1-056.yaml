title: aida node acquire --remote-only for retroactive backfill
description: |-
  ## Problem

  When a clone has been operating with an implicit pre-EPIC-1-052 node id (e.g., spock = node 2 by way of dispenser.toml), the only way to get its identity into `nodes.toml` is to run `aida node acquire --id 2 ...` from that clone. There's no way to backfill the registry from a sibling clone. I hit this on imac trying to formalize spock's node 2 entry — had to hand-edit nodes.toml.

  ## Acceptance

  - `aida node acquire --id N --hostname H --email E --remote-only` writes the entry to `registry/nodes.toml` and pushes, but does NOT touch the local clone's `.aida/node.toml` (so the running clone keeps its own identity)
  - `--remote-only` requires `--id`, `--hostname`, and `--email` to be explicit (no defaults pulled from the local environment, since the entry isn't about the local clone)
  - Existing `aida node acquire` semantics unchanged when `--remote-only` is absent

  ## Related

  - EPIC-1-052 Phase 4 (post-clone bootstrap) handles the new-clone case; this handles the legacy-clone case from the other side
