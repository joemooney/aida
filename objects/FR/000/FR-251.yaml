id: 259c842f-16e0-45ed-8bde-9a12a82ba88f
spec_id: FR-251
prefix_override: DB
title: Import database
description: |-
  Import legacy/incompatible requirements database with graceful error recovery

  When importing a requirements.yaml file that contains schema incompatibilities (such as unknown enum variants, deprecated fields, or missing required fields), the system should:

  1. **Detection Phase**: Parse the file and identify all incompatibilities before making changes
  2. **User Confirmation**: Present a summary of issues found with options:
     - Skip incompatible records (exclude from import)
     - Convert to defaults (map unknown types to 'Functional', unknown statuses to 'Draft', etc.)
     - Abort import
  3. **Import Execution**: Proceed based on user selection
  4. **Reporting**: Display import summary showing successful, skipped, and converted records
  5. **Backup**: Create automatic backup of current database before import

  **Acceptance Criteria**:
  - [ ] Unknown req_type variants are detected and reported before import
  - [ ] User can choose skip, convert-to-default, or abort for incompatible records
  - [ ] Import summary shows count of records: imported, skipped, converted
  - [ ] Original database is backed up to `requirements.yaml.backup` before import
  - [ ] Relationships referencing skipped records are also skipped with warning
  - [ ] Keyboard accessible: 's' to skip, 'c' to convert, 'a' to abort, Enter to confirm
