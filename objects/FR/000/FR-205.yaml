title: Shared UI components for native/WASM code reuse
description: 'Create reusable egui rendering components in aida-gui/src/ui/ that work with proto types on both native desktop and WASM browser targets. Components include: formatters (status/priority/type/timestamp text), badges (colored status/priority indicators), list_item (requirement list rendering), requirement_form (combo boxes for status/priority/type), comment_list (comment rendering and input), detail_view (full requirement detail view). aida-web re-exports proto types from aida-gui for type compatibility. Enables consistent UI rendering and reduces code duplication.'
