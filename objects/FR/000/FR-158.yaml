id: 01cb13e7-36e9-4dc1-900c-46d22087db4e
spec_id: FR-158
title: Collapse/hide Detail View
description: |
  Ability to collapse or hide the Detail View so we can focus on the list

    Detail Panel Collapse Feature:
    - Added detail_panel_collapsed: bool field to track the collapse state
    - In List/Detail view, the "▶" button in the list header now hides the detail panel
    - Created show_list_only_view() function that displays the full requirements list in the central panel with:
      - "◀ Show Detail" button to restore the detail panel
      - Search bar with filters
      - Perspective/view selector with presets
      - Direction selector for hierarchical views
      - Filter controls panel
      - Full scrollable list (flat or tree view)

    When you click the "▶" button in the list header, the detail panel disappears and the list takes up the full central panel. Click "◀ Show
    Detail" to bring back the detail panel.
