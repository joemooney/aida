title: 5 new RequirementTypes for docs-layers projection (Principle/Vision/Constraint/Decision/Term)
description: |-
  ## Why

  The docs-layers proposal (docs/plans/2026-05-09-documentation-layers-module.md) maps software-understanding hierarchies (arc42, C4, Diátaxis, ADRs, Constitution) onto AIDA's existing graph. Five entity types were missing as first-class kernel surface: Principle, Vision, Constraint, Decision, Term.

  These five types unlock:

  - **Stronger queries** — \`aida list --type principle\` instead of tag scans
  - **Stronger MCP tools** — agents ask "what principles govern this codebase?" and get a typed result
  - **Deterministic projections** — aida-docs (next module) can render the docs tree without depending on tag conventions that drift

  ## Type prefixes (for short global form)

  | Type | Prefix | Stateful? |
  |---|---|---|
  | Principle | PRIN | no — always active until retired |
  | Vision | VIS | yes — active / achieved / abandoned |
  | Constraint | CON | yes — active / lifted |
  | Decision | ADR | yes — proposed / accepted / superseded |
  | Term | TERM | no |

  ## Acceptance

  - ✅ \`RequirementType\` enum extended with 5 new variants in aida-core/src/models.rs
  - ✅ \`fmt::Display\` impl + display_id paths cover them
  - ✅ \`get_type_prefix\` returns the right prefixes
  - ✅ \`merge_gate\` assigns ADR-1, PRIN-1, etc. on promotion
  - ✅ \`parse_requirement_type\` and \`parse_type\` accept all 5 (with aliases like \`adr\` → Decision)
  - ✅ Legacy SQLite/Postgres backends include the new variants in their type-to-string maps

  ## Out of scope (for this commit)

  - aida-docs module that projects the graph (separate session, FR-1-075)
  - Type-specific status workflows (Decision needs proposed/accepted/superseded)
  - Custom fields per type (Decision needs consequences, alternatives, superseded_by)
