title: Template externalization with compile-time embedding
description: |-
  ## Overview
  External template files as single source of truth, with build.rs compile-time embedding for self-contained release binaries.

  ## Features
  - Templates stored in aida-core/templates/ directory structure
  - build.rs generates embedded_templates.rs with include_str! macros at compile time
  - TemplateLoader provides fallback chain: project-local (.aida/templates/) → user config (~/.config/aida/templates/) → embedded
  - aida scaffold extract command to extract embedded templates for customization

  ## Benefits
  - Easy template editing during development (edit files, rebuild picks up changes)
  - Self-contained release binaries (templates embedded, no external files needed)
  - User customization via ~/.config/aida/templates/ directory
  - Protection against scaffolding overwriting user-modified skill files

  ## Implementation
  - aida-core/build.rs - compile-time template embedding
  - aida-core/src/templates.rs - TemplateLoader module
  - aida-core/templates/ - template source files
  - aida-cli/src/main.rs - scaffold extract command handler
