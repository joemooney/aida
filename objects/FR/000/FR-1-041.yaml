id: 019df5e6-68ad-7990-8f47-c9fb249d5556
spec_id: FR-1-041
title: 'aida statusline: --color flag and replace reqs:N with role-aware queue depth'
description: |-
  **Two improvements to `aida statusline` (the one-line summary at `aida-cli/src/main.rs:4223`):**

  ## 1. Replace `reqs:N` with role-aware queue depth

  Today's `reqs:N` is the count of non-archived requirements in the project. It changes rarely and is essentially project-size trivia — not actionable.

  **Replace with `q:N`** = depth of items in the queue routed to the active role (or the global queue when no role is set). When the queue is empty, omit the field entirely (don't print `q:0` — that's noise).

  Resolution rules:
  - `AIDA_SESSION_ROLE` set → count rows from queue table where `for_role == $AIDA_SESSION_ROLE` and not yet picked up
  - `AIDA_SESSION_ROLE` unset → count global queue (no role filter), same not-picked-up criterion
  - Empty result → omit the field

  Rationale: `@FR-1-035` already tells me what I was last working on; `q:N` tells me what's waiting after that. Together they answer "where am I, and how much is in front of me" — the two questions a glance-able statusline should answer.

  ## 2. `--color=auto|always|never` flag with sensible defaults

  `aida statusline` currently emits plain UTF-8. The output is structured (bullet `·` separators) but colorless. Add `--color` with auto-detection:

  - `auto` (default): emit color if `isatty(stdout)` AND `NO_COLOR` env var is unset
  - `always`: always emit color
  - `never`: never emit color

  Color scheme:
  - Separators (`·`) — dim
  - `aida` brand prefix — dim
  - Project name — bold green (or default — match `ls --color` directory color)
  - `role:NAME` — bold yellow
  - `@SPEC-ID` — bold cyan
  - `q:N` — default (or yellow if N > some threshold? optional)
  - `cache:fresh` — green; `cache:stale` — red

  Most statusLine-consumers in Claude Code render ANSI as-is (verified via `~/.claude/settings.json` user-scope statusLine). `auto` is safe because the consumer pipes via shell — `isatty` detection plus `NO_COLOR` covers the cases.

  ## Acceptance

  - `aida statusline` (no flag) auto-detects color, replaces `reqs:388` with `q:N` (omitted when 0)
  - `aida statusline --color=never` matches today's plain output (drop-in compat for any pipeline parsing it)
  - `aida statusline --color=always` always emits ANSI
  - Sub-50ms perf budget preserved (queue table lookup is O(1) cache hit, same as the existing reqs count)

  ## Out of scope

  Showing queue items per priority, queue items by other-role-routed-to-me, etc. Keep it to a single integer.
