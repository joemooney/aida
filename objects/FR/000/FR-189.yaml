  - field_name: description
    old_value: |-
      Headless server mode

      It would be nice to run aida in a server mode. This server would handle all the database operations. We could use grpc, websockets and other technologies.
      One use case is to compile aida for wasm to run on the browser with a websocket server connection. This may also help with multiuser support. It may require taking out a lock on a req while we are editing that could expire or be optimistic. The command line would talk to the server also in this client/server mode. Potentially, even in standalone mode we could spawn a separate server thread. I am thinking that we define a protobuf definition for our messages and operations.
