id: 8cfe1327-da2d-49fa-907e-91281dbd4013
spec_id: FR-189
title: Headless server mode
description: |-
  Implement a client-server architecture for AIDA using Protocol Buffers for message definitions and gRPC for communication.

  **Scope:**
  1. Define protobuf schema for all requirement CRUD operations
  2. Implement gRPC server exposing requirement management API
  3. Refactor aida-core to support both direct and remote storage backends
  4. Update CLI to communicate via gRPC when server URL is configured

  **Out of Scope (please open separate requirements):**
  - WASM browser client
  - Multi-user concurrency and locking
  - Authentication and authorization

  **Acceptance Criteria:**
  - Server starts on configurable port and accepts gRPC connections
  - All existing CLI operations work against remote server
  - Server persists data to configured YAML/SQLite backend
  - Graceful shutdown with in-flight request completion
status: Completed
