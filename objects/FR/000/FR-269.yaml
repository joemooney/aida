spec_id: FR-269
title: aida scaffold upgrade — proper upgrade subcommand with merge strategies
description: |-
  Add `aida scaffold upgrade` subcommand. Today users reflexively reach for it (it's the obvious verb after `status` reports drift), but it doesn't exist — only `apply` (which skips) and `apply --force` (which clobbers).

  Subcommand surface (depends on file-categorization spike for full semantics):
  - `aida scaffold upgrade` — for each drifted file, apply the upgrade strategy appropriate to its category (template = overwrite, seed = skip, managed-merge = patch slots)
  - `aida scaffold upgrade --force` — current `apply --force` behavior (overwrite everything regardless of category, with confirmation)
  - `aida scaffold upgrade <path>` — upgrade a single file
  - `aida scaffold upgrade --detach <path>` — mark a file as user-owned in scaffold manifest, stop reporting drift on it
  - `aida scaffold upgrade --dry-run` — preview what would change per file

  Interaction:
  - For managed-merge files: print the slot-level diff before applying, ask y/n unless `-y`/`--yes`
  - For seed files: should ordinarily be no-op (status shouldn't have flagged them); if forced, warn loudly
  - Should record upgrade events somewhere (scaffold manifest? audit log?) so we know when each file was last touched by AIDA

  Blocked by the file-categorization spike — the merge strategies aren't well-defined without categories. This req captures the CLI surface; the spike captures the semantic model.
