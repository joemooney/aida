description: |-
  Equals '=' to apply same set of changes to another requirement
  When we make a set of changes to the metadata of a requirement (Type,Status, Priority, Owner), we should record that set of changes. If the user then navigates to another requirement in the requirements list and presses '=' then those set of metadata changes will be applied to that requirement.
