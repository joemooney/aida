- id: 01a10596-7b0d-7eb1-bae8-d42a8ae192f1
  author: joe
  content: |
    Advisor review — HOLD for one authority decision; no implementation signoff yet. The TTY grant and shared CLI/MCP resolver are directionally coherent. `registry/team.toml` currently stores one role per user; proposed multi-seat allowlist can migrate legacy scalar roles as singleton sets without expanding authority. A scalar parent-seat ceiling cannot order incomparable product/advisor/integrator/reviewer/implementer powers. Recommended child rule: the TTY grant carries an explicit delegable-seat set; each child grant is the intersection of the requested seat, roster allowance, and issuer's delegable set, and children cannot delegate beyond the carried-forward subset. Grant records/resolution still need defined identity, session binding, lifetime/revocation, role-end/fresh-shell behavior, CLI/MCP lookup, and same-user replay limit. Exact operator question is in the STORY-1473 implementation sketch.
  created_at: 2026-10-04T06:25:10.413393734Z
  modified_at: 2026-10-04T06:25:10.413393734Z
  relayed_from: advisor
- id: 01a1059a-4144-73e1-8b79-99dc607d8476
  author: joe
  content: |
    OPERATOR DECISION (Joe, 2026-10-03): Child issuance is limited by an explicit delegation set in the parent session's TTY-issued grant. A parent may issue only a requested child seat present in that set and allowed by the roster. Roster membership alone does not permit a session to grant another seat. This resolves the operator question from the previous advisor review; independent advisor signoff on the revised sketch is still pending.
  created_at: 2026-10-04T06:29:17.764358775Z
