title: 'Drain merge-lease: merge-scoped RAII guard, lease-conflict shelve on contention, wave merges share the lease'
description: |-
  Accepted 2026-09-17 (operator, guided, answered async while at work) for TASK-1244.

  Context: TASK-1243 wired the per-branch merge-lease (merge_lock.rs, STORY-1171/ADR-38) into aida pr ship. The drain's merge phase and the burndown wave merges were still unserialized against it.

  1. WIDTH = MERGE-SCOPED. RealPhaseDriver::merge acquires the lease as a local RAII guard and releases it when merge() returns. Rejected: an Option<MergeLease> field spanning merge→pull (a cross-phase lifetime plus a shelve path that must release it) — the drain's pull is ff-only, so the merge→pull window is benign.

  2. CONTENTION = SHELVE AS lease-conflict. A WouldBlock after the bounded wait (DEFAULT_WAIT 180s) maps to the existing shelvable FailureKind::LeaseConflict with a merge-specific message and an aida merge-lock hint; NeedsAttention for triage. Rejected: a new MergeContention variant (closed-set churn for no new semantics) and retry-as-transient (hides a stuck merger behind the retry budget).

  3. SCOPE = EVERY AIDA MERGE PATH. merge_wave_pr (the burndown integrator sweep) takes the same lease; WouldBlock there skips that PR for the current wave. One chokepoint semantics: no AIDA-driven merge runs without the per-branch lease.

  Key: merge_lock::acquire keyed on the PR's base branch (same key pr ship uses), so drain, wave and pr ship serialize on one lock.
