spec_id: ADR-34
agreed_id: ADR-34
title: Driver seats may have non-authoritative companion instances
description: Amends ADR-3 for singleton driver roles. The singleton invariant applies to the authoritative driver seat, not every process wearing that role. Advisor/product keep exactly one driver seat for approval, queueing, execution-mode changes, drain driving, and other disposition authority. Additional companion instances may wear the same role for read/converse/advice and draft-to-inbox proposal work, but they do not acquire the driver seat and are refused authoritative disposition or drain operations. This preserves ADR-3's no-split-brain invariant while allowing parallel conversations in the same role.
