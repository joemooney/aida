title: 'TASK-1607: seat occupancy fails closed where the identity probe is unsupported'
description: |
  ## Context
  The tri-state probe may be unable to establish process start identity (non-Linux, no /proc start time) or a verified harness mapping. The signed-off sketch forbids activating occupancy without identity, and the acceptance forbids an env-only compatibility fallback.

  ## Options considered
  - Fail closed: an Unknown anchor refuses protected orchestrator ops with a diagnosis; ordinary implementer work is unaffected.
  - Implement a macOS probe now: grows slice A and needs macOS CI coverage.
  - Inert where unsupported: effectively a compatibility fallback, forbidden without re-signoff.

  ## Decision
  Fail closed: refuse (operator choice, guided session 2026-10-06).

  ## Rationale
  Matches the fail-closed letter of the signed-off sketch; Linux is the platform the drains run on.

  ## Consequences
  Orchestrator loops do not run on platforms without a start-identity probe until a follow-up spec adds one. The refusal names the platform and the missing evidence.
