spec_id: ADR-57
agreed_id: ADR-57
title: 'BlockedBy gates closure as well as pickup: an unresolved blocker holds a merged spec at Done'
description: |-
  Context: BUG-1551. BlockedBy was enforced at pickup only; the merge-driven Done->Completed auto-bump (aida pull, db sync --pull, db reconcile-status) never consulted the graph, so a spec already in flight completed past an unsatisfied blocker and the edge read as a guarantee it did not provide.

  Decision: BlockedBy gates CLOSURE too. When the auto-bump would complete a spec that still has a BlockedBy predecessor not in {Completed, Rejected, Superseded} (a dangling edge counts as unresolved), it keeps the spec at Done (a pre-Done in-flight spec moves up to Done, since its code is on main), records the merge commit and the open blocker in an [aida:closure-held] note on the spec, and does not stamp completion_sha. aida why reports the hold (closure_held_by in --json).

  Resolution: once blockers resolve, aida db reconcile-status --spec <ID> completes it. Override: a human who decides to ship without the blocker runs aida edit <ID> --status completed.

  Why not pickup-only: a dependency unsatisfied at merge time is exactly when it matters, and the code merging is a fact that is recorded either way; only the Completed claim is withheld. Rejected/Superseded blockers release the hold so merged work is never stranded at Done forever.
