title: Remove or keep legacy --centralized mode (gates STORY-1728 slice 4)
description: |
  Decide whether to remove the legacy centralized (SQLite-canonical) backend, or keep it.

  Context: STORY-1728 slice 4 would migrate the legacy-storage dispatch arms in lib_part1.rs run() into the command registry. The product already tells users this backend is deprecated (lib_part1.rs:4123-4147, "...the deprecated centralized backend with `aida db export-git`"). If the backend is removed, slice 4 becomes a deletion, and the registry's Phase enum only needs pre-store | git-backend.

  Options:
  1. Remove: delete the legacy-storage dispatch and the `--centralized` init path. `aida db export-git` remains the migration route. Needs a user-facing deprecation and removal note for existing requirements.db projects.
  2. Keep: slice 4 migrates those arms under Phase::LegacyStorage.

  Owner: Joe (operator) with the advisor. Must be decided before STORY-1728 slice 4 starts.
