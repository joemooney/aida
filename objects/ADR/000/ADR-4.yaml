title: Reposition AIDA as the human-governance layer for agent-driven development (concede the substrate race to Beads/Gas Town; interop, don't compete)
description: |-
  ## Decision (operator-commissioned 2026-06-12, from SPIKE-53's escalation; D8/D9 resolved by operator 2026-06-12)

  Beads (~18.7k stars, v1.0) + Gas Town (v1.0) shipped AIDA's substrate thesis — typed dependency graph + stable IDs + ready-gate + MCP + parallel orchestrator — with distribution AIDA does not have. The substrate is no longer the moat. Operator selected: **A (move up the stack) + B (interoperate with Beads), framed by D (regulated/enterprise as sharpest segment)**. Option C (feature-race) rejected.

  ## The position (operator's own words, 2026-06-12 — canonical source language for WS1)

  AIDA is an **AI Developer Assistant**: *'make it easier to develop when you have many agents from different vendors and want to coordinate work and feature development as the system grows in complexity — capturing the intent, the why, that can get lost during implementation.'*

  Lead emphasis: MULTI-VENDOR COORDINATION + INTENT/WHY PRESERVATION (which are precisely the two verified surviving edges: cross-vendor portability + the code-to-spec trace loop Beads lacks). GOVERNANCE (approval gates, roles, audit trail) is the mechanism that makes the coordination trustworthy and the enterprise/regulated depth — not the lead word.

  ## Resolved sub-decisions

  - **D8 — NO rename.** AIDA stays. The acronym RE-EXPANDS: 'AI Design Assistant' → **'AI Developer Assistant'** (zero-cost; touches CLAUDE.md line 1, README, OVERVIEW, templates — WS1).
  - **D9 — README leads with the developer-assistant coordination+intent statement above.** Trojan-horse pattern survives: TUI stays the approachable face; the named depth is coordination + intent capture + governance.

  ## Grounding

  - Durable wedge = INCENTIVE divergence: Yegge's stack is built to UNLEASH agents; AIDA is built to COORDINATE + GOVERN them across vendors. Beads' docs explicitly disclaim being a requirements system; Agent Teams is single-vendor. Neither will chase cross-vendor intent governance — it cuts against their theses.
  - Verified surviving edges: code-to-spec trace enforcement (absent in Beads), requirements/intent altitude + human disposition gates, truly git-canonical (specs in the code repo), multi-vendor (claude/codex/AGY today).
  - Evidence: docs/competitive-analysis/2026-06-12-beads-gastown-moat-rescope.md (SPIKE-53 deliverable).

  ## Consequences

  - Every story-telling artifact re-leads with the operator's statement; 'missing index' framing retired (STORY-551); acronym re-expanded everywhere.
  - Beads interop (import funnel first) is a build priority — ride the 18.7k-star wave as the coordination/intent layer on top.
  - Substrate-race roadmap items re-justify under the coordination+intent+governance lens or are cut (STORY-577).
  - Regulated/enterprise evaluated as the segment where governance is mandatory (SPIKE-59).
  - The ENGINE (graph, store, orchestrator, traces, lifecycle) is NOT rewritten — it is re-aimed; it IS the coordination/governance machinery.

  ## Status

  Accepted-in-substance by operator (direction + D8 + D9, 2026-06-12); formal status flip to accepted is the master/operator's disposition. Supersedes the 2026-05-31 keystone's 'defend the substrate' framing on positioning specifics; that snapshot stays frozen per immutability discipline.
