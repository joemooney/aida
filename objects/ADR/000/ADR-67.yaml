title: 'TASK-1607: seat holder identity = validated grant session + harness anchor process + start identity'
description: |
  ## Context
  STORY-1485 slice A needs one identity for the orchestrator seat holder: liveness probes, dead-holder takeover and demotion tombstones all key on it. SeatGrant (STORY-1473/ADR-66) records no PID, and one `aida role enter orchestrator` grant is inherited by every harness launched from that shell.

  ## Options considered
  - Grant + harness anchor: holder = validated grant session + anchor process (nearest claude/codex harness ancestor, else the invoking parent shell/loop process) + start identity. A second harness on the same grant is a competing claim.
  - Grant session only: siblings sharing one grant co-own the seat, which misses the backgrounded-orchestrator case that motivated the story.
  - Extend SeatGrant with the issuing PID: touches the shipped grant format, and the issuing shell is not the dispatching harness.

  ## Decision
  Grant + harness anchor (operator choice, guided session 2026-10-06).

  ## Rationale
  It is the only option under which a backgrounded orchestrator and a new session from the same shell register as competitors, which is the motivating failure of STORY-1485.

  ## Consequences
  Each protected op walks the process ancestry to resolve its anchor. A missing or unverifiable anchor start identity is Unknown and refuses. SeatGrant format is unchanged.
