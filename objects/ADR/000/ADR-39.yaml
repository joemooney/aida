  content: 'Secondary call (operator, guided, 2026-09-17): recon found main''s branch protection requires ONLY merge-hold-gate — Build (ubuntu-latest) is not required — and the informational Windows/macOS jobs share the Build (...) name with PR CI (only the workflow name differs: Cross-platform vs CI). A literal required-only rule would merge over a red Build. DECIDED: informational allow-list. A red check is ignorable only if it is NOT required AND its workflow/name matches [ci] informational_workflows (default: Cross-platform) / informational_checks globs; everything else red is a failure; merge-hold-gate red is ignorable only while the local hold marker exists (the hold itself, released at merge). Safe when a repo declares no branch protection.'
