agreed_id: ADR-62
title: Until the backlog is drained, macOS and Windows CI results do not gate a merge; Linux does
description: |
  OPERATOR DECISION (Joe, 2026-09-27 08:16 MST), recorded verbatim: "until we get the backlog drained macos and windows are unimportant".

  Scope and consequences, as the orchestrator seat will apply it:

  IN FORCE
  - A red Build (windows-latest) or Build (macos-latest) does NOT block batching, a PR, or a merge.
  - Reviewers are no longer asked to verify all three platforms, and a Linux-only verdict is no longer treated as incomplete for merge purposes.
  - Cross-platform nightly red is accepted as a known, deliberately tolerated condition for the duration. BUG-1475 stays open as the record but is not a blocker and is not worked while this decision holds.

  EXPLICITLY NOT COVERED — this decision does not lower the Linux bar
  - Build (ubuntu-latest) and merge-hold-gate remain the two REQUIRED checks on main, and both must be green. A Linux failure still blocks.
  - This is not permission to merge with any required check red, and it is not permission to use --admin or to edit branch protection.
  - It does not retroactively bless a verdict that was wrong on Linux.

  WHY THE DISTINCTION MATTERS RIGHT NOW: batch 106 (PR #2234) failed on ubuntu-latest, not on Windows. So this decision does not unblock it. The Linux failure is an ETXTBSY fixture race, filed separately, and it must be fixed or re-run green before that merge.

  WORK ALREADY IN FLIGHT that this decision affects
  - TASK-1543's Windows-portability rework was dispatched before this decision, on the grounds that its APPROVED verdict came from a Linux-only run while all three of its own new tests failed on Windows. Under this decision TASK-1543 no longer needs to wait for Windows to be green. The rework is nearly complete and its fixes are cheap, so it will be allowed to finish rather than abandoned, but it will not be held for Windows verification.
  - Reviewer briefs stop requiring cross-platform evidence from this point.

  REVISIT WHEN: the backlog is drained, or Joe says otherwise. At that point the honest debt is whatever Windows and macOS defects accumulated in the interval, which is expected to be non-trivial given the nightly has already been red since 2026-09-23.
