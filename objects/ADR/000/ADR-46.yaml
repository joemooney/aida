  content: '[advisor] Accepted 2026-09-18 15:14. The four forks were decided with the operator in the STORY-1226 guided session; decision 5 (grow aida schedule from STORY-1047 and register aida cron as its alias, deprecate the STORY-262 schedules.toml in place as a fires_task job kind) is the right reading of prior art: one scheduler to explain, existing emit-cron crontabs and the aida pull cadence keep working. Two consequences to hold the implementation to at the gate: (a) the hourly cold-boot is bounded per seat AND suppressed by any live session holding the role; (b) the ledger objects live on the aida-store branch and are debounced for substrate jobs so the store''s commit rate does not balloon.'
