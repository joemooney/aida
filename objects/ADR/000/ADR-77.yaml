title: 'Autonomy-first under an operator mandate: while a mandate is active the system drives the open list to completion with no human in the loop; human gates are added by explicit exception'
description: |-
  ## Decision (operator, 2026-10-15 21:04)
  'When I provide a mandate to drive the open list to completion, we absolutely need to make sure that we no longer need a human in the loop. Once we have that ability we can gradually gate more operations to involve humans, instead of the other way around where we cannot make progress because all mandates are forgotten or ignored.'

  ## Consequences
  1. Default inversion. Under an active mandate every operation that today needs a human TTY (hold clears, ships of held PRs, relay restarts, seat rotations, sketch signoffs routed to the advisor) is performed by the advisor seat, subject to the independent-review and attestation gates. A human gate applies only where the operator explicitly marked it: the 'operator-only' tag or execution_mode=Operator, or an explicit config list of human-gated operations. That list starts EMPTY and the operator adds to it over time.
  2. Mandates are durable and active, never conversational. A mandate is a recorded artifact (STORY-1698 ~/.aida/mandates). Every seat start, rotation handoff, relay session and heartbeat reads it. While it is active the hourly fleet heartbeat (STORY-1699) drives work and does not just report it.
  3. Integrity floors that remain under a mandate: independent attested review for every merge, never merging one's own work, no force-push to main/shared branches, no history rewrite of shared branches, and the mandate itself is minted/stopped only by a human. These protect correctness, not human attention.
  4. Escalation becomes notification, not blocking: when the system needs a human it notifies and keeps working other lanes.
  Related: STORY-1698 (mandate), STORY-1697 (auto-release review holds), STORY-1699 (fleet digest/heartbeat).
