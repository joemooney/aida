id: 01a0e355-aed3-7952-b63f-90049c682afa
spec_id: ADR-61
agreed_id: ADR-61
title: P-enrolled-host is the protected boundary for every AIDA-managed full-access agent launch
description: |
  STATUS

  Accepted IN PRINCIPLE as design direction only — NOT approved for implementation, installation, credential migration, deployment or merge. Recorded from operator decision 01a0e10c-66ae-7883-9f98-f422dff413fa on BUG-1669 and independent architecture signoff 01a0e11e-12db-7cd0-a3d1-39df79961a63 with binding amendments M1-M5. No protected boundary is deployed; AIDA today still launches full-access agents behind same-user-forgeable corroboration, which is the defect BUG-1669 tracks and this decision does not fix.

  CONTEXT

  BUG-1669 found that production AIDA code paths build full-access vendor argv (claude -p --permission-mode bypassPermissions, codex exec --dangerously-bypass-approvals-and-sandbox) unconditionally, so any agent permitted to run `aida *` can start a detached full-access child with a prompt of its own choosing.

  orchestrator::detect -> classify -> run_is_live accepts a non-empty AIDA_AUTO_COMPLETE, a UUID equal to DrainState::run_uuid in ordinary project JSON, and a live PID. It authenticates no issuer, no caller ancestry, no process-start identity and no operation scope. It is run corroboration, not a credential. authority_stdin_is_terminal / authority_stdout_is_terminal are IsTerminal observations; an agent can create a PTY and answer yes. A terminal proves a terminal, never human identity or consent.

  The affected surface spans the recorded inventory groups A-G: compete/zen arms and judges; intake assess/propose/apply/then-drain; burndown quiet/verbose/continuations; every shared session.rs fresh/exec/resume sink and its research, remedy, dry-run-AI, intent, harvest, reconstitution, queue implementer/reviewer and advisor-watch callers; direct RealPhaseDriver advisor/resume/CI-fix launches and all controller entry modes; agent-new and interactive/reviewer session surfaces; and the solo/shift/scheduler/cron/systemd/tmux/detached wrappers plus shipped launch scripts (scripts/aida-demo.sh and the four scripts/ablations/gate-vs-rule*.sh).

  Three operator decisions settle the requirement:
  - 01a0e0a3-e301-7c72-83e7-68ab14eaf9e0 — literal same-user anti-forgery. A same-user-forgeable local guardrail, ambient environment flag, PID/state file or agent-created PTY is not sufficient; do not weaken AC2.
  - 01a0e103-c774-7620-b1dd-f783c05bcb81 — host-wide scope. Every AIDA-managed agent launch on this host, across projects. Explicitly does not claim control of unmanaged vendor clients launched outside AIDA.
  - 01a0e10c-66ae-7883-9f98-f422dff413fa — P-enrolled-host accepted IN PRINCIPLE. Design authorization only.

  The design answering them is revised sketch 01a0e116-d863-7bd3-9a94-faa8e2c3888c, signed off as APPROVED as amended by 01a0e11e with M1-M5, accepted as binding design by product in 01a0e125-a9e0-7810-bd94-e207548548a2. Source anchors in that sketch refer to its earlier HEAD (854b7e26f7 / 43c0429198); implementation and release must refresh them.

  DECISION

  1. THE PROTECTED BOUNDARY. Authorisation lives outside the agent-controlled login in service-held state the agent cannot read or write, and the service — not the caller — performs the launch. A full-access launch requires either explicit operator approval through an authenticated, agent-inaccessible approval endpoint that displays the exact normalised scoped request, or an authenticated, still-live, scope-limited delegation from a protected controller derived from such an approval. The broker owns validation AND spawn atomically; a client-side yes followed by a local spawn is not the boundary. Authority is server-side state plus an authenticated principal; public grant/run IDs are lookup handles and possession grants nothing. Full vendor access is confined to a disposable service-owned isolated worker per phase attempt, with no unrestricted host HOME, host processes, host control sockets, shared credential mounts, direct guest networking or reusable upstream credentials; guest root is still untrusted. Model, forge and artifact access is typed and service-mediated, with pinned endpoints, allowed models/refs/actions, grant-charged quotas and revocation; no generic HTTP proxy, credential helper, arbitrary remote URL, shell adapter or writable host mount. A launch grant never confers merge authority. Legacy orchestrator::detect is demoted to a diagnostic classifier and every current authority-consuming caller must be audited before migration; there is no environment-carried bearer run token.

  Explicitly rejected as substitutes, because the operator rejected exactly these: writable project state (.aida/drain-state.json, UUID equality, live PID); environment variables and ambient flags (AIDA_AUTO_COMPLETE, AIDA_AUTO_COMPLETE_TOKEN, AIDA_BURNDOWN_LOCK_HELD); PTY presence or an IsTerminal pair; SO_PEERCRED login UID; roles and effective-role derivation; --force / --yes / --no-human; acknowledgement files; client version strings; executable paths; mode-0600 same-UID secrets; MACs whose key the agent can read; private Rust permit fields. The word "unforgeable" describes the required boundary, never the shipped implementation.

  2. HOST-WIDE ENROLLMENT AND ADMISSION. Coverage is host-wide over AIDA-managed launches across all projects. One host authority; every official AIDA entry point is a thin proposal/status/attach client and only installed service code executes an agent. Enrollment enables scoped requests; absence of enrollment is refusal, not exemption. Host registry state (host/broker identity, enrollment generation, canonical repo ID, approved forge identity and refs, import/export roots, adapter/image versions, supported protocol schemas, policy) is protected service state, not agent-writable project .aida configuration. All postures, including anything called "contained", use the same external worker boundary; there is no local contained-mode exception. The broker normalises typed operations itself and trusts no caller-supplied client version, executable path, PATH lookup, git remote, .git indirection, AIDA_DRIVE_ROOT, role, argv or grant ID. Unknown adapters, custom executables, arbitrary extra flags and AIDA_AGENT_CMD / AIDA_COMPETE_JUDGE / AIDA_OS_WRAP overrides refuse unless converted to an enrolled, reviewed typed adapter configuration. Execution code and images are pinned at the service, never by a hash the requesting CLI reports; an agent-built target/release binary is never a trusted deployment artifact.

  3. CROSS-REPO SCOPE: COVERAGE IS NOT A GRANT. Approval for repo A conveys no authority in repo B. No cross-repo parent grant in v1 and no implicit sharing of artifacts, transcripts, model context or credentials. Every grant, artifact and adapter call binds repo ID + enrollment generation + base artifact + spec/plan content digests + operation/phase. Same path, same spec number, cloned remote, symlink switch, rename or copied .aida-store cannot transfer authority. Sibling worktrees import into the enrolled identity only through validated snapshot manifests. A new repository inherits nothing. Per M2 the isolation covers observation and attachment as well as mutation.

  4. REFUSAL OF UNPROTECTED AND UNKNOWN ROUTES. No protected backend, no enrollment, unsupported platform/vendor/adapter/protocol schema, expired or revoked authority, corrupt state, exhausted budget, stale epoch, failed isolation attestation or unauthorised IPC peer all produce a typed nonzero refusal with no agent launched. No cooperative fallback: no local spawn, no alternate vendor, no alternate backend, no automatic downgrade to a contained vendor, no detached/systemd fallback after denial or an ambiguous start; a proven not-started transport failure may retry only the same reserved attempt. No launch-associated mutation before a valid preparation reservation; refusal leaves worktree, queue, leases, logs, transcripts and state unchanged, the broker's own refusal audit being the single exception, and protected audit writes fail closed for launches. Refusal propagates instead of being swallowed: a denied compete arm must not become a failed arm followed by an authorised-looking judge, solo must stop its chain, and --force may skip the old role guard but never protected admission. Legacy native Claude burndown fan-out is not grandfathered and refuses until a broker-mediated wave controller replaces it. Read-only previews, renderers, dry-runs, schedule due/status, diagnostic drain-state and config writers remain usable, confer no authority, and must be tested to confirm they cannot later supply any.

  5. EXCLUSION OF UNMANAGED INDEPENDENT VENDOR CLIENTS. An unrelated vendor client launched outside AIDA by an unrestricted host login using its own independent credentials is outside the promise. The boundary prevents such a client obtaining protected AIDA execution resources; it cannot prove an unconfined login cannot run its own clients. This is NOT P-managed: confining every agent or vendor client on the workstation, and migrating unrelated third-party credentials, is explicitly not a prerequisite. The exclusion is not a relabelling device — an official AIDA route that still launches using host credentials after cutover is a FAILED cutover case. If the real host requires an official route to retain independent host execution, that concrete incompatibility returns to Joe as a deployment blocker, never an inferred exception.

  6. THE FIVE GATES STAY SEPARATE. (1) Independent architecture signoff — CLOSED by 01a0e11e, architecture only, as amended. (2) Concrete installer/backend/credential proposal, independently reviewed — OPEN (SPIKE-91, TASK-1550). (3) Disposable privileged proof on a real installed boundary — OPEN; mocks and source review are not protection proof and a skipped privileged suite is a block, not a pass. (4) Deployment approval — OPEN, never granted. (5) Operator-held merge gates — OPEN; BUG-1669 stays implementation-held even after its prerequisites complete (01a0e125) and PR #2226 stays operator-held. Gate 1 unblocks dependent design and planning only: it is not dispatch approval, not a queue change, not an installation ticket and not a merge authorisation. Approved lifecycle status, an existing queue entry and the architecture comment itself are each explicitly not dispatch approval (M5).

  7. M1-M5 ARE BINDING. M1 host-wide coverage is an admission AND cutover invariant; credential revocation alone does not prove a credential-free, custom or local-model route is blocked, and negative tests run from the untrusted host principal against stale, copied and replaced clients. M2 repo/principal authorization covers observation and attachment; public IPC exposes only deliberately public metadata, opaque IDs unlock nothing, rendered guest output is hostile and neutralised on trusted displays. M3 freeze a versioned, canonical, domain-separated signed request encoding before protocol implementation; an artifact hash establishes content identity, never permission to read or import it. M4 verify actual confinement and supervision before Running rather than from successful process creation, with guardian health participating in admission; the 10s termination bound and the suspend fence cannot be asserted from configuration, because the Firecracker jailer permits a cgroup-v2 configuration with a missing parent cgroup to proceed without moving the process (https://github.com/firecracker-microvm/firecracker/blob/main/docs/jailer.md). M5 preserve gate separation in product capture and all dependent work; a material departure from the amended boundary returns for architecture review.

  8. ACCEPTED IN PRINCIPLE IS NOT APPROVAL TO IMPLEMENT, INSTALL, MIGRATE OR DEPLOY, and no protection is deployed. Every concrete operator approval still needed is inventoried in the companion document and marked NOT YET GRANTED: backend/platform selection; privileged service installation and trust root; actual credentials; disposable privileged test environment; current-run migration and cutover; rollback and recovery, including restoring pre-cutover launch behaviour; runtime ceilings and budgets; repository enrollment mappings; explicit dated operator acceptance of AIDA's continued full exposure to BUG-1669 for the whole duration of the work; BUG-1669 implementation dispatch; BUG-1679 / PR #2226 merge; and any claim that protection is deployed, which is currently false.

  9. BUG-1669 ACCEPTANCE IS RECONCILED. BUG-1669's acceptance predated these decisions: AC2 called orchestrator::detect unforgeable and accepted a terminal confirmation, and AC4 asked for a positive fixture proving the drain-token path still works — an artefact (hand-written DrainState + matching UUID + live PID) that demonstrates the forgery. Under this decision AC2 requires the protected endpoint or a live scoped delegation, a terminal is a request and display surface only, and no terminal, PTY or socket reachable from any login session in which an agent can execute may serve as the approval endpoint; AC4 reverses the old positive fixture into a required forgery negative. Refusing affected routes does not by itself satisfy the acceptance: the positive protected path must exist and be evidenced, so option H / deny-only cannot close BUG-1669. The edit was applied to BUG-1669 under advisor direction 01a0e351-5a7c-78a3-a0fb-bb79f078cb6a.

  10. PROTECTED BINARY IDENTITY AND ADMISSION (BUG-1679). AIDA_BIN is untrusted input; executability is a usability property, not provenance. A different coordinating build may be selected only through independently established protected installation/admission/update policy, with a launch plan bound to that admitted identity, and AIDA_BIN may at most name an already-admitted candidate. Unknown or unadmitted identity, or unavailable protected authority, refuses the managed protected launch with no arbitrary PATH or vendor fallback. Identity admission is necessary but is not itself a scoped launch grant. The contract is specified under SPIKE-91's existing "pinned executable/dependency identity admission" deliverable; BUG-1679's own AC1 is superseded by it, an acceptance change that remains product's to make. PR #2226 stays operator-held at e63efc3997a85df8cb1ff463f48222900ed5f7d6 with aida:merge-hold.

  CONSEQUENCES

  Now, design only: nothing in the running system changes. No launch path, live scheduler, watch, credential or service is touched. TASK-1550 and SPIKE-91 become workable as read-only design and research. BUG-1669 stays blocked and implementation-held, BUG-1679 stays parked behind it, PR #2226 stays operator-held.

  If the later gates are granted: unattended AIDA work that is not enrolled stops launching; native burndown dispatch is replaced; watch and schedule sets are frozen, finite and require reapproval; unsupported platforms, vendors, adapters and custom executables refuse; existing drains either finish inside a separately accepted migration window with no protection claim, or are stopped. Provider compatibility is not guaranteed on day one. These were accepted in principle by 01a0e10c; each concrete step still needs its own authorization, and gate 4 must arrive with a named window, a pre-published list of exactly which unattended work stops, and a rollback that restores current launch behaviour.

  There is no third option on the interruption: the only way to avoid it is to keep a launch path authorised by same-user-forgeable state, which 01a0e0a3 forbids in those words. Product has no latitude here without reopening an operator decision.

  Honest limits of the design itself: even fully built and deployed it assumes a trusted administrator, kernel, hypervisor and approval device. It does not prove semantic model obedience, prevent collusion among processes inside one compromised worker, prevent local denial of service, undo completed external effects (a sent model request, a pushed ref, an exported artifact), or survive a compromised trust root. Revocation is not retroactive. The architecture signoff is conditional on each of those premises being established by implementation and deployment evidence, which does not exist.

  REJECTED ALTERNATIVES

  Option B, the cooperative same-user guardrail (live-run corroboration plus a terminal prompt, with same-user file/env/PTY forgery outside the guarantee) — offered as an explicit operator choice in 01a0e08a and rejected by 01a0e0a3; settled and not reopened. Option H, deny-only containment — not selected; it leaves the authorized-drain functionality absent so it cannot close BUG-1669. P-managed workstation-wide confinement — explicitly not required by 01a0e103. Repository-local opt-in coverage (plain P-enrolled) — rejected by 01a0e103 as insufficient. Hardening the existing token (stronger UUID entropy, chmod 0600, caller ancestry, a MAC with an agent-readable key, private Rust permit fields) — none crosses the same-user boundary. A privileged daemon alone while retaining arbitrary host execution and shared credentials — rejected in 01a0e0ad. Treating scheduler or service provenance as approval ("but systemd started it", a cron tick, an invoker/cgroup probe, SO_PEERCRED, a cached sudo session, a user-polkit exception) — scheduling evidence, not consent. A localhost web page or local PTY as the approval channel — rejected; the endpoint must be inaccessible to agents. Grandfathering native vendor fan-out — a native subagent has no independently authenticatable spec/phase identity.

  REVISIT WHEN

  Any of: the concrete installer/backend/credential package from SPIKE-91 and TASK-1550 returns and Joe authorises or declines it; TASK-1550's per-route manifest shows an official route that cannot be mediated, which is a deployment blocker returning to Joe; a vendor is found to require an unrestricted login HOME, generic egress or a reusable OAuth credential such that nothing can run inside the boundary; or a material departure from the amended boundary is proposed, which returns for architecture review per M5.

  RECORDED BY

  Architect seat on TASK-1549, from operator decisions 01a0e0a3, 01a0e103 and 01a0e10c and independent architecture signoff 01a0e11e with M1-M5, corrected under independent advisor verdict 01a0e351-5a7c-78a3-a0fb-bb79f078cb6a (amendments A1-A6). Long-form companion document in docs/plans/. This is a relay of operator decisions recorded in the BUG-1669 comment trail, not a decision made by this seat.
