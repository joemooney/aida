id: 01a0c1b3-524f-7c93-b9af-4d821d2d0571
spec_id: ADR-48
agreed_id: ADR-48
title: 'Preflight gates PR publication structurally: the orchestrator opens the PR after guards pass, the implementer never does'
description: |-
  CONTEXT

  The drain's implementer opens its own pull request (`aida-pr/SKILL.md` step 10, `gh pr create`), and the pre-flight guards — which check the branch would survive CI — run afterwards, at `aida-cli-lib/src/lib.rs:87798-87801`. By the time a guard can object, the PR is already public: CI has started and reviewers may have been notified.

  So publication is not gated. The only thing preventing a premature PR is prose in the skill telling the agent not to open one. That is a rule relying on an agent remembering, not a gate making the violation impossible — the pattern `substrate-as-bouncer` exists to reject.

  The 2026-09-20 reviewer verdict on PR-2043 put it directly: "publication boundary is advisory rather than enforced… the only prevention is prose in aida-core/templates/skills/aida-pr/SKILL.md:369-378. Add a technical gate so orchestrated implementers cannot create the PR."

  DECISION

  The orchestrator opens the PR. The implementer commits, pushes its branch, and exits without creating one.

      implementer:   commit -> push -> exit
      orchestrator:  preflight -> PASS -> gh pr create
                     preflight -> FAIL -> shelve; no PR exists

  A failing guard leaves no open PR because none was ever created. The gate is structural rather than procedural.

  CONSEQUENCES

  - The implementer contract changes. `aida-pr/SKILL.md`'s PR-creation step is removed for the orchestrated path, and the `no-pr` shelve cause — which today means "the implementer forgot to run /aida-pr" — either disappears or changes meaning entirely for orchestrated runs.
  - The non-orchestrated lane needs its own path. `aida agent new <vendor>` spawns a one-shot agent with no orchestrator above it; that lane must either keep creating its own PR or gain an equivalent guard. This is the part most likely to be missed, because it is the lane nobody is watching tonight.
  - Recovery changes shape. Today a stranded push with no PR is recoverable by opening one by hand (as was done for BUG-1442 / PR #2027). Under this design an absent PR is the CORRECT outcome of a failed guard, so recovery tooling must distinguish "guard refused" from "orchestrator died before creating it".
  - An end-to-end test is required and is the acceptance: a failing guard leaves no open PR.

  ALTERNATIVES CONSIDERED

  Draft PR promoted on pass — implementer opens `--draft`, preflight marks it ready. Keeps the implementer contract and leaves failures inspectable, but a draft PR is still public and still runs CI, so it gates REVIEW rather than publication. Rejected as a weaker gate for the same work.

  Close premature PRs — leave the flow and have the orchestrator close a PR whose guard failed. Smallest change, but reactive: the PR is public, CI has started, notifications have gone out. Rejected as not a gate.

  LINEAGE

  Two divergent TASK-1289 implementations are in flight — PR #1972 at `6512f1312a` and the `35de6d3abb` lineage carried on #2042 and #2043. Neither contains the other. The advisor reads both against this decision and records the loser as `superseded-by` the winner, with the reason written onto both specs. It is not settled by whichever PR reaches a merge button first.

  RECORDED BY

  The product seat, from an operator decision taken in session 2026-09-20 via a structured design-fork prompt. This is a relay: the advisor and reviewer seats did not witness it directly.


  TWO CONSEQUENCES ADDED BY THE ADVISOR ON ACCEPTANCE, 2026-09-20 19:10. Neither changes the decision; both are ways it fails quietly if unstated.

  A. THE FAIL-OPEN GATE BECOMES A PREREQUISITE, NOT A PARALLEL CLEANUP. decide() in implementer_preflight.rs collects only GuardResult::Failed and lets a wildcard swallow Skipped, so every guard skipping yields Open. Skipped is produced for six conditions, including CI workflow missing and CI workflow unreadable - which map EVERY named guard to Skipped at once. Under today's flow that defect means a gate fails to stop an already-public PR. UNDER THIS DECISION IT MEANS A SKIPPED GUARD IS WHAT AUTHORISES PUBLICATION. The orchestrator asks preflight whether to create the PR; preflight answers Open when it ran nothing; the PR is created. So this design makes the fail-open defect strictly more load-bearing than it is today, and BUG-1507 must land before or with the implementation. Shipping ADR-48 on top of the current decide() would convert a missing ci.yml into automatic publication.

  B. THE DECISION DELIBERATELY CREATES THE STATE BUG-1307 SAYS IS INVISIBLE. 'shelve; no PR exists' leaves a pushed branch carrying real commits with nothing pointing at it. BUG-1307 records that commits stranded on branches with no PR are reported nowhere - twelve such branches from 13-18 September carried unreviewed work. Today that state is an accident; under this decision it is the correct and expected outcome of a refused guard, and its volume goes up. The shelve must therefore make the branch findable - named in the shelve record, in the findings, and in whatever surface an operator reads - or a working gate becomes a quiet work-loss mechanism. This is the same distinction the product seat raised as consequence 1, extended: it is not only that recovery tooling must tell 'guard refused' from 'orchestrator died', it is that SOMETHING must report the branch at all.

  ACCEPTED by the advisor seat 2026-09-20 19:10. The decision is sound, the alternatives are recorded with reasons rather than dismissed, and the ADR correctly labels itself a relay - the advisor and reviewer seats did not witness the operator decision directly, and the text says so.

  C. THERE ARE TWO DOORS PAST THIS GATE, NOT ONE. Consequence A names the wildcard in decide() that swallows an unrunnable guard. There is a second, found 2026-09-20 19:15 and independent of it: a spec tagged `lifecycle:no-preflight` sets skip.no_preflight, and express mode - which forces off no_ci_wait, no_review and no_build - does NOT force off no_preflight on the lineage chosen to carry this work. Verified reachable rather than latent: auto_complete.rs:131 parses the tag and sets the skip; auto_complete.rs:106 declares the field.

      So under this decision a tag on a spec switches off the gate that authorises publication, and the mode that claims to force every skip off leaves that one open. A nine-line fix exists on the OTHER TASK-1289 lineage (6512f1312a) and must be carried across; carrying it is a blocking condition on merging, recorded in the lineage ruling on TASK-1289.

      THE GENERAL POINT, CORRECTED 2026-09-20 19:18 ON REVIEWER INPUT. This paragraph previously said: enumerate every way preflight's answer can be Open without guards having run. That instruction is WRONG, and it is wrong in the way this ADR is about - an enumeration is the instrument that failed at both known doors, so requiring a better enumeration repeats the mistake at a higher level.

      The evidence is a test on the surviving lineage. `lifecycle_skip_express_tier_forces_full_gate` asserts, with the message "express overrides any lifecycle:* short-circuit - full gate enforced", a body that names THREE fields: no_ci_wait, no_review, no_build. There are five skip fields; no_preflight is not named and the test's input tags never include lifecycle:no-preflight. So a test whose function name and assertion message both claim a UNIVERSAL cannot fail for the field it omits, and it reads to the next author as proof the invariant is covered. Its own first half uses the universal instrument correctly - `skip.is_empty()`, twenty lines up - so the right tool was in the same function and was not used in the case that mattered.

      REQUIRED INSTEAD: exhaustiveness the compiler enforces, not a list a human maintains. The orchestrator must be unable to compile against a preflight outcome it does not handle, and the invariant tests must be unable to compile when a skip field is added - a destructuring bind over every field, or an equivalent, rather than a conjunction of the fields that existed when it was written. A list of two doors written tonight will still be a list of two doors in a month, and the third door will not announce itself.

      The two known doors - an unrunnable guard, and the lifecycle:no-preflight tag - remain worth naming as the cases that must pass a test. They are examples, not the specification.
