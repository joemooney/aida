id: 019ec1c5-dd53-7e81-982a-a04c54a1c9ad
spec_id: ADR-5
agreed_id: ADR-5
title: AIDA docs are GENERATED FROM SPEC INTENT, enforced at the surface-change boundary; the hand-authored CLI manual is a bounded bridge, not perpetual hand-maintenance
description: |-
  ## Context (operator + advisor, 2026-06-12/13)

  The overnight CLI manual (EPIC-40) was 'blind redetermination': it verified against `--help` (the surface / WHAT) and the rationale is the documenter's INFERENCE of intent, never the spec's recorded WHY (`--help` cannot carry intent; the spec can). interface_changes is the right field but rarely populated, and manual entries don't link back to the shaping spec. This ADR sets the protocol so docs explain intent rather than re-derive surface.

  ## Decision

  Documentation is GENERATED from spec intent (`--help` WHAT + interface_changes DELTA + spec description/acceptance WHY), enforced at the surface-change boundary (substrate-as-bouncer), NOT hand-transcribed and NOT perpetually hand-maintained. The hand-authored manual is a one-time BRIDGE + quality TARGET, not a standing commitment.

  ## Resolved decisions (operator, 2026-06-13)

  1. **Drift-guard gate authority = clap command tree** (the complete source), NOT `aida help-all` (a curatable view). This reframes BUG-520 (help-all omits rules/doctor/defer) as a DISCOVERABILITY bug, not a gate hole — a command absent from help-all must NOT escape the guard.
  2. **Forward-only intent capture; NO 71-command backfill.** New surface-changing specs populate interface_changes with value-framed deltas; legacy commands keep the hand-authored manual as their intent bridge. Reconstructing why old commands exist is low-value guesswork.
  3. **Trace-back via a GENERATED `docs/cli/_index.json`** (command → shaping spec(s)), NOT per-chapter frontmatter. Machine-consumable (aida-tutor / STORY-601), stays current because generated (frontmatter drifts), and is the artifact the generator pipeline produces anyway. It keeps SPEC-IDs OUT of the visible user-facing manual (preserves the no-SPEC-ID rule) — the trace lives in the developer-only index.
  4. **Finalize + merge the hand-authored manual as bridge + target; the finalize pass is BOUNDED** — catch-up to current main, advisor-review the 8 draft chapters (lore chapters first), wire the drift-guard into CI. EXPLICITLY NOT a perpetual hand-maintenance commitment: nobody signs up to re-edit 11 chapters every week against a churning CLI. The interface_changes → generated-manual pipeline is EPIC-40's real endgame.

  ## Enforcement (substrate-as-bouncer)

  - PR-check: if a diff touches cli.rs command/flag defs or the skill set, interface_changes must be non-empty (or a `docs:impacted` tag). (STORY-542 territory.)
  - Drift-guard (STORY-597) extended: not just 'every clap command documented' but 'every surface-changing spec's interface_changes is reflected in the docs' — catches a spec that moved the surface without updating intent.
  - STORY-600 (`aida manual <cmd>`) is the generated consumer of the spec graph + _index.json.

  ## Relates

  EPIC-40 (the manual), STORY-542 (interface_changes capture), STORY-579 (trace-gate enforcement pattern), STORY-597 (drift-guard → clap authority + CI), STORY-600 (generated endgame), STORY-601 (machine-digestible), BUG-520 (now discoverability, not gate-integrity).
