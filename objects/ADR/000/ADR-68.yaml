title: 'TASK-1607: single-occupancy seat holders claim implicitly on the first protected op'
description: |
  ## Context
  Slice A must decide when a claim is required. Protected ops: loop start (burndown run, queue work --auto-complete/drive), orchestrator-origin spawn, queue routing/mutation, handoff --write. Ordinary implementers without an orchestrator grant or orchestrator lineage are unaffected in every option.

  ## Options considered
  - Implicit claim on first protected op: an empty or provably dead seat is claimed as an explicit recorded transition; a live or Unknown competitor refuses; bound/tombstoned lineage stays fenced even if env/grant is dropped.
  - Explicit claim required: every orchestrator skill/loop must add a claim step, and any that miss it break.
  - Loop starts only: leaves single queue mutations/spawns by an unclaimed orchestrator unfenced, conflicting with the advisor-accepted inventory refresh.

  ## Decision
  Implicit claim on the first protected op (operator choice, guided session 2026-10-06). `aida session seat claim` remains available as an explicit surface.

  ## Rationale
  Closes the backgrounded-orchestrator routing gap without requiring every existing orchestrator skill to change in this PR.

  ## Consequences
  The claim transition is recorded in the event outbox/history like an explicit claim. Callers whose validated grant seat is single-occupancy are classified orchestrator-origin; bound/tombstoned lineage is fenced regardless of env labels.
