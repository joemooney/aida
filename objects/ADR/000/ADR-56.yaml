  content: |-
    ## Architectural Sketch: ADR-56 Remote Evaluator Resilience

    ### 1. Error Taxonomy & Typed Classification
    - `EvaluatorErrorKind`:
      - `Transient`: Transport resets, connection timeouts, DNS flaps, HTTP 429 (Too Many Requests), HTTP 502/503/504 (Server Errors). Eligible for retry if deadline budget allows; counts toward circuit breaker trips.
      - `Permanent`: HTTP 400 (Bad Request), 401 (Unauthorized), 403 (Forbidden), 404 (Not Found), and malformed response JSON schema. Fails closed immediately without retry; **does not increment transient failure counters or trip the circuit breaker**.
      - `DeadlineExceeded`: Budget exhausted before completion.
      - `CircuitOpen`: Circuit open, fast fail-closed fallback without network IO.

    ### 2. Deadline-Aware Retry Adapter (`DeadlineRetryAdapter`)
    - Wraps any `EvaluatorEngine` implementation.
    - Takes caller-supplied `operation_deadline: Instant` or `timeout: Duration` (e.g. 2–5s for review prep; non-blocking fire-and-forget for `aida add`).
    - Enforces budget rule: retries are only scheduled if `remaining_budget >= min_budget_for_retry` (default 500ms).
    - Max retries bounded to 1 (or 2 under explicit policy).
    - Injects `X-Idempotency-Key` or deterministic payload hash to prevent duplicate charges.

    ### 3. Concurrency-Safe Circuit Breaker (`EvaluatorCircuitBreaker`)
    - Scoped per endpoint/model.
    - States: `Closed` -> `Open` (after 3 consecutive transient failures, 60-second cooldown) -> `Half-Open` (1 trial request).
    - Fails closed immediately without network IO when Open.
    - No blocking health probes on request critical path.

    ### 4. Structured Observability
    - Emits structured telemetry for retry attempts, backoffs, circuit state transitions, and fallbacks.
    - Never silent drops: all fallbacks record fallback reason, latency, and status.
