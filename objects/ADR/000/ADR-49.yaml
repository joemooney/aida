spec_id: ADR-49
agreed_id: ADR-49
title: 'Mass-change mode: split the reviewer verdict into blocking defects and deferrable acceptance gaps, with a deferred-findings budget, rather than gating on the regression suite'
description: |-
  CONTEXT

  During a period of mass change the review gate stopped draining. On 2026-09-20: forty `verdict:request-changes` shelves against thirty-two merges, and two consecutive drain waves that completed with `shipped:0 shelved:0`. Work accumulated faster than it could pass review.

  The operator proposed a mass-change mode: implement everything possible accepting it may not meet acceptance criteria, defer or background the review phase so it files bugs rather than blocking, gate only on the existing regression suite passing, and land each change's tests as a later commit that joins the suite if it passes.

  The diagnosis was correct. The remedy was tested against two measurements before adopting.

  MEASUREMENT 1 — what review actually objects to. Across all seventy-eight findings in open CHANGES-REQUESTED verdicts:

      acceptance unmet    32  (41%)
      behaviour defect    16  (21%)
      other               26  (33%)   mostly defects on inspection
      test gap             4  ( 5%)

  So "the code works, it merely misses the stated bar" holds for roughly half. The remainder are genuine defects.

  MEASUREMENT 2 — whether the regression suite substitutes for review. Of every PR the reviewer has rejected, with a resolvable build:

      green = 44        red = 3        unknown = 1

  The suite passes on 92% of the work review rejects. It is not a weaker form of review; it is ORTHOGONAL to it. Gating solely on the suite would admit essentially all rejected work, defects included.

  That second number also argues the other way, and more strongly: review is catching a class of defect the tests structurally cannot. Whatever mode is adopted must not discard it.

  DECISION

  1. SPLIT THE VERDICT rather than defer it. The reviewer emits two outcomes where it currently
     emits one: behaviour defects BLOCK; acceptance gaps and test gaps file a child spec and the
     change MERGES. On the measured split this unblocks roughly half the rejected work while
     keeping the gate where the risk is.

  2. DEFERRED FINDINGS CARRY A BUDGET. The drain stops accepting new work when open deferred
     findings exceed a threshold. Self-limiting and fails closed.

  3. THE REGRESSION SUITE IS NOT PROMOTED TO SOLE GATE. Measurement 2 says it would gate nothing.

  4. STORY-1391 IS A PREREQUISITE. Verdict files are overwritten per round, so the first-round
     pass rate is currently unmeasurable — 499 files on disk, every one a latest verdict. Without
     it the effect of this mode cannot be observed and its success would be argued from anecdote.

  REJECTED FROM THE ORIGINAL PROPOSAL, with reasons

  Tests as a separate commit at the back of the queue — if the goal is emptying the backlog, that commit is permanently the lowest-priority item. The suite stops growing while main grows, weakening the gate exactly as volume increases.

  Deferred findings as ordinary bugs with no forcing function — there are already 408 auto-filed shelve drafts nobody triages (BUG-1498). "File a bug and move on" is empirically where work goes to be forgotten in this repository.

  Release as the forcing function — ADR-47 defers releases until the queue empties, so a release gate would never fire.

  CONSEQUENCES

  - The reviewer's contract changes. Classifying a finding as blocking or deferrable becomes a
    judgment the reviewer makes explicitly, and mis-classification in the deferrable direction is
    how a defect reaches main.
  - Some defects WILL merge. The 21% behaviour-defect share is the floor of what the split must
    catch; anything it misclassifies ships. This is accepted deliberately, not overlooked.
  - Child specs filed from deferred findings need somewhere to live that is not the 408.
  - The budget threshold is a number nobody has evidence for yet. Pick one, observe, adjust.

  RECORDED BY

  The product seat, from an operator decision in session 2026-09-20. This is a relay: the advisor and reviewer seats did not witness it. The reviewer was sent the proposal before this was recorded, specifically so it could object to a change in its own contract.


  ADVISOR AMENDMENTS 2026-09-20 20:06. Four clauses added before acceptance. ADR-50 was filed independently by the advisor for this same decision, minutes apart, and is SUPERSEDED by this one - its unique content is folded in below so there is one record rather than two.

  A. THE CLASSIFICATION DEFAULT IS BLOCK. This decision routes on a judgement the reviewer makes at verdict time, and 33 percent of the 78 classified findings landed in 'other'. An unclassified, ambiguous, or mixed finding BLOCKS. Absent classification must never read as acceptance-only. That is PRIN-5 at the precise point this decision introduces a permissive path, and it is where the mode fails silently if it fails: a misclassified defect merges and nothing downstream distinguishes it from a correctly-merged acceptance gap. This clause is not optional and the mode should not ship without it.

  B. THE CHILD SPEC MUST EXIST AND BE LINKED BEFORE THE MERGE COMPLETES THE PARENT. Raised by the reviewer seat and it is the requirement that stops this industrialising the failure it resolves. Merging auto-completes the parent through its commit trailer; Completed is terminal and drops from every open-work lens; and an unmet criterion recorded only on that spec then becomes unreadable. So 'file a child and merge' is correct ONLY in that order. Filed after the merge, there is a window in which the parent is Completed, the remainder exists nowhere, and nothing is watching. Child creation belongs INSIDE emitting the verdict, not as a follow-up step a seat may be interrupted before reaching.

  C. THE SPLIT IS FORMALISING WHAT WAS DONE BY HAND THREE TIMES TONIGHT, which is stronger evidence than the 41/21 classification. Each case was behaviour-fine with a criterion unmet, and each was resolved by filing the remainder as a child and letting the work merge:
        BUG-1454   criterion 7 scoped the comment-borne criteria out to BUG-1506, then mergeable
        TASK-1279  criterion 4 scoped out to TASK-1308
        BUG-1452   criterion 6 withdrawn and split to TASK-1307
      Each cost a mail round trip, an advisor edit, and a reviewer re-verdict. The decision removes a negotiation already held three times in one evening. Note also that the reviewer disclosed this policy would have reversed two of its own refusals - #2040 and #1984, both acceptance-unmet rather than behaviour defects - and endorsed it anyway.

  D. THE SPLIT LANDS AS A NEW VERDICT KIND, NOT A FIELD ON THE EXISTING ONE. Answering the question the product seat raised, and it is not a detail. A kind is greppable; a field is not, and today established how much of this system reasons by matching prose - nine spellings of the verdict value across 543 files, four live writers disagreeing, and a gate that would accept 'CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE' on a substring match. A new kind also fails safe against old readers: a consumer that does not recognise it cannot mistake it for approval, whereas a consumer that does not read a new FIELD sees an ordinary refusing verdict and blocks - or worse, sees an ordinary approving one. The kind must be drawn from the closed set BUG-1505 criterion 1 requires.

  TWO CORRECTIONS TO THE RECORD AS FILED:

  E. THE PREREQUISITE IS MIS-STATED. This ADR says STORY-1391 is approved. It reads IN-PROGRESS, heft 6, drain mode - and it is the spec whose session was briefed BUG-1420 rework under its own lease, produced no code of its own, and whose branch is the held duplicate PR #2043. So the gating item has not started and its last run misattributed a verdict to it. Caught by the reviewer seat.

  F. A COLLISION ON THAT PREREQUISITE. STORY-1391 criterion 1 is verdict-history-per-round, which IS the missing measurement. But BUG-1505 criteria 7 and 10 also require read-before-write and a superseding verdict recording what it superseded. Both specs own verdict history. One must own it and the other reference it, or it is implemented twice in two shapes and neither is authoritative.

  OPEN QUESTION, NOT DECIDED - FOR THE OPERATOR. WHAT ENDS THIS MODE. The proposal is scoped to 'a period of mass change' and that period has no stated end. Without an exit condition the permissive half becomes the process: the project ships acceptance-unmet work indefinitely while the deferred pile grows against a budget set for a temporary state. The exit should tie to the same measurement that justifies entry - the queue draining, or the shelve-to-merge ratio inverting - and be written down before the mode starts. This ADR stays DRAFT until it is answered, because an ADR adopting a temporary mode without recording what ends it is not finished.

  ON THE ATTRIBUTION. The reviewer seat reported that this proposal reached it carrying operator authority it could not verify, and declined to weigh the attribution - engaging the argument on its merits instead - on the grounds that relaxing its own gate on a relayed operator preference would end the independence the seat exists for. That is the correct handling and it is recorded here so the decision does not rest on an unverifiable relay. The measurements, not the attribution, are what carry this.

  G. THE EVIDENCE FOR C DOES NOT COVER THE CASES A EXISTS FOR - raised by the reviewer seat against its own endorsement, 2026-09-20 20:06, and recorded because it is the sharpest limitation on this decision.

      The three worked instances in clause C - BUG-1454, TASK-1279, BUG-1452 - are the evidence that the split works in practice. In ALL THREE the classification was OBVIOUS: behaviour plainly fine, a named criterion plainly unmet, and the advisor and reviewer agreed without argument each time. They are the easy cases, and they are the whole demonstrated base.

      The 33 percent that landed in 'other' is drawn from the cases where classification was NOT obvious. So the decision's evidence establishes that the split works where nobody needed to think, and says nothing about the population where clause A's default-to-block has to fire. Those are disjoint sets.

      THIS IS NOT AN ARGUMENT AGAINST THE DECISION. It is the reason clause A is load-bearing rather than a safety net, and it is what the first week's observation must actually measure: not whether the split unblocks work - the three instances already show it does - but the rate at which findings land in the unclassifiable bucket and what happens to them. If that rate stays near a third, the mode's real behaviour is 'block by default with an escape hatch for obvious acceptance gaps', which is a defensible thing to have built and a different thing from what this ADR describes.

      Recorded at the reviewer's initiative, against the position it had argued for.

  H. THE THING ACTUALLY CATCHING MISCLASSIFICATION DEGRADES UNDER EXACTLY THE LOAD THIS DECISION AUTHORISES. Raised by the reviewer seat 2026-09-20 21:06 against its own position, and it is the strongest argument for clause A.

      Clause A requires an unclassified finding to BLOCK, because the split routes on a judgement the reviewer makes at verdict time. The question nobody had asked is what catches a misclassification when it happens anyway.

      TONIGHT THE ANSWER WAS A SECOND SEAT CHECKING CLOSELY - and that checking happened because the reviewer queue held zero actionable items and there was nothing else to do. It is unbilled, it produces no artifact of its own, and its value is invisible whenever it finds nothing. Under a full queue it is the first thing to go.

      SO THE MODE MOST LIKELY TO PRODUCE MISCLASSIFIED FINDINGS IS THE MODE LEAST LIKELY TO HAVE ANYONE CHECKING THEM. A mass-change period is by definition the period with no slack, and cross-checking is the activity that only exists in slack. That is not a reason to reject this decision - the measurements still say the split is right - but it means clause A's default cannot be treated as a backstop with review behind it. During the mode, clause A may be the only thing standing.

      CONSEQUENCE FOR THE FIRST WEEK'S OBSERVATION, which clause G already scopes: measure the unclassifiable RATE, and also measure whether anything is checking the classifications at all. If the rate is near a third and nobody is cross-checking, the mode's real behaviour is block-by-default with an unreviewed escape hatch, which is a third thing and worse than either of the two clause G names.

      EVIDENCE QUALITY, stated because it is thin: one evening, two seats, an empty queue. The degradation is predicted, not observed - no mass-change period has yet run under this decision. Recorded rather than filed as a finding for that reason, and recorded here rather than only in correspondence because it bears on the exit condition the operator has not yet answered.

      AND A RELATED FACT THAT IS NOT AN ARGUMENT, RECORDED SO IT IS NOT MISTAKEN FOR ONE: the second-reader arrangement exists because the operator created the reviewer seat and gave it merge authority over work neither other seat authored. It was a resource decision made before any of tonight's evidence existed. Nothing in the substrate would have produced it and no amount of care by the other two seats substitutes for it. What is purchased can be unpurchased, which is the same exposure by a different route.

  EXIT CONDITION - ANSWERED BY THE OPERATOR 2026-09-20 21:13, AND ACCEPTED.

      THE MODE ENDS WHEN THE LIST OF OPEN ITEMS IS EMPTY, OR WHEN ONE WEEK HAS PASSED - whichever comes first.

  THE WEEK IS THE CLAUSE THAT DOES THE WORK AND IT IS WHY THIS ADR CAN NOW BE ACCEPTED. It is calendar-checkable, cannot be gamed, depends on no measurement anyone can dispute, and it guarantees termination regardless of what the queue does. The objection this ADR was held on - a temporary mode with no recorded end is a permanent mode with optimistic framing - is answered by the week alone.

  THE EMPTY-QUEUE HALF IS AN EARLY EXIT AND IT NEEDS A DEFINITION IT DOES NOT YET HAVE. Two problems, both surmountable, neither blocking:

      1. "OPEN ITEMS" IS NOT A SINGLE NUMBER IN THIS STORE. Measured now: `aida list` reports 30 of 144 open; `aida list --status draft` reports 30 of 53; `aida list --all` reports 4174. Done counts as CLOSED in the default lens, deferred and archived are separate tiers, and the agent view caps at 30 rows. Whichever lens is chosen decides when the mode ends, and nobody has chosen one.

      2. THE MODE GENERATES OPEN ITEMS BY DESIGN, WHICH MAKES THE EARLY EXIT RECEDE AS IT OPERATES. Clause 1 files a child spec for every acceptance gap and test gap. So each use of the permissive path adds one open item, and the exit condition is an empty list of open items. Operating the mode pushes its own early exit further away. That is not fatal - the week backstops it - but it means the empty-queue clause will rarely fire, and if it does fire it will be because the mode was barely used.

      REQUIRED BEFORE THE EARLY EXIT CAN BE RELIED ON: name the lens, and exclude from the count the child specs this mode itself files. Counting the mode's own output against its exit is the same shape as a detector whose noise floor rises each time it is used successfully.

  WHAT THE ADR STILL DOES NOT SAY, and it is the question the exit condition surfaces rather than answers: WHAT HAPPENS AT THE END. When the week expires, does the split verdict simply stop - acceptance gaps blocking again - and what becomes of the deferred findings still open at that moment? Clause 4's budget governs during the mode; nothing governs the handover out of it. Worth deciding before the mode starts rather than on day seven, because day seven is when there will be the most outstanding and the least appetite.

  ACCEPTED on this basis. The week makes the decision safe to adopt; the early exit is a bonus that needs one definition; the handover out is the next open question and is smaller than the one just closed.
