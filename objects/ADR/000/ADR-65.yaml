- id: 01a104e3-53f5-70f3-b063-650622616dde
  author: joe
  content: |
    Advisor verdict: CHANGES REQUESTED; keep ADR-65 Draft.

    The revised decision resolves the earlier scope conflict well: it explicitly supersedes only the non-blocking weekly Windows validation pause, carries forward ADR-47's throughput-first ordering and release deferral, and now has an ADR-65 → supersedes → ADR-47 edge. The Linux-required lane matches current branch protection (`Build (ubuntu-latest)` and `merge-hold-gate`); the selected-path Windows PR run remains informational. The 24-hour release gate remains coherent: `pre-release-check.sh` dispatches `cross-platform.yml --ref main` and waits when no green main run is younger than 24 hours. macOS remains disabled under TASK-1570.

    Two implementation contracts need a more explicit acceptance witness before this is ready:

    1. Manual dispatch against main: the current workflow has `workflow_dispatch` but no main-ref guard or checkout override; `actions/checkout@v5` uses the dispatch ref by default. The release script explicitly passes `--ref main`, but a manual UI/API dispatch can select another branch. Acceptance should require either refusing non-main manual refs or checking out main for the validation job, and a test should pin that behavior.

    2. Product triage within one business day: the workflow currently opens/updates the tracking issue, but the ADR does not specify how that deadline reaches the product seat or how completion/overdue status is observed. This is recurring work; project guidance says recurring duties arrive as AIDA due jobs. Add an observable due/reminder or issue-SLA mechanism for Product that does not auto-queue implementation work, and name the evidence that proves triage happened within the deadline.

    The weekly Sunday 06:00 UTC cron, Windows-only matrix, no macOS, retained selected-path informational PR run, and fresh 24-hour release check are all directly checkable. When ADR-65 is accepted, retire ADR-47 as superseded while carrying its retained rules forward in ADR-65 so the approved source of truth is unambiguous. No CI files were changed and ADR-65 remains Draft.
  created_at: 2026-10-04T03:09:29.461232672Z
  modified_at: 2026-10-04T03:09:29.461232672Z
- id: 01a104e9-d37c-71b0-b580-762778375d41
  author: joe
  content: |
    Advisor verdict: CHANGES REQUESTED; keep ADR-65 Draft.

    The revision closes the previous manual-dispatch and ownership gaps: manual dispatch now has two safe, observable behaviors with required regression evidence; the Product seat owns follow-up, sees it through `aida schedule due --seat product`, and records disposition through `aida schedule done`. The ADR-65 → supersedes → ADR-47 edge and narrow supersession remain coherent. The weekly Windows signal is nonblocking, throughput-first ordering and release deferral remain explicit, and the existing 24-hour release check still dispatches fresh `main` when needed.

    One operational contract is not yet implementable as written. AIDA's current schedule job model supports interval (`every`), event (`on`), and snapshot predicate (`when`) triggers; it has no calendar/weekday trigger. An interval cannot guarantee “first business day after each Sunday run,” and an event-triggered job becomes due on the event rather than the next business day. Also specify what counts as a business day (weekdays only, or which holiday calendar/time zone) and acceptance evidence that proves the due date across a Sunday run and a holiday/weekend boundary. Either define a supported implementation mechanism for this one-time-per-week due date, or revise the policy to a trigger the current scheduler can represent while preserving the one-business-day triage SLA.

    I did not change workflow/configuration or the spec disposition. Once the calendar trigger and business-day definition are explicit, the remaining design and acceptance are reviewable.
  created_at: 2026-10-04T03:16:35.324098899Z
  modified_at: 2026-10-04T03:16:35.324098899Z
- id: 01a104f5-21de-77d3-b8a2-4b9c869fb5f0
  author: joe
  content: |
    Advisor verdict: PASS on the revised design; leave ADR-65 Draft.

    The daily Product interval reminder resolves the unsupported weekday-calendar dependency. AIDA's `every` interval is measured from the seat's last completed run, and `aida schedule done` records that time and clears the due flag, so the proposed reminder is implementable and observable: Product checks the latest scheduled run and tracking issue at each due check, then records the issue reference or that none is open. A red issue has a clear owner and must be triaged by the next check and before any release; the reminder does not queue or reprioritize implementation.

    The other decision boundaries remain coherent and checkable: weekly Windows validation is a nonblocking signal; the explicit Supersedes edge narrows ADR-47 only for that signal while retaining throughput-first order and release deferral; the fresh-main 24-hour release gate remains; manual dispatch has a defined safe behavior plus regression evidence; macOS stays disabled; and Linux gate optimization remains a separate measured proposal. The existing workflow still needs the specified schedule/manual-dispatch changes and regression evidence before these acceptance criteria can pass. No code or configuration was changed, and this comment does not approve or promote the Draft spec.
  created_at: 2026-10-04T03:28:56.285996089Z
  modified_at: 2026-10-04T03:28:56.285996089Z
