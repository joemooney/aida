id: 09c341cb-66ab-497e-8bae-f6029d26e1ed
spec_id: SR-1
title: Inline Code Traceability Comments
description: |-
  The system shall support inline traceability comments in generated code that link back to requirement IDs.

  ### Comment Format (Enriched)
  `// trace:<SPEC-ID> - <title> | ai:<tool>:<confidence> | impl:<date> | by:<user>`

  Example:
  `// trace:FR-0042 - Keyboard navigation | ai:claude:high | impl:2025-12-10 | by:joe`

  ### Fields
  - `<SPEC-ID>`: The requirement being implemented (e.g., FR-0042)
  - `<title>`: Brief requirement title (optional, truncate if >40 chars)
  - `<tool>`: AI tool used (e.g., `claude`)
  - `<confidence>`: `high` (>80% AI), `med` (40-80%), `low` (<40%)
  - `<date>`: Implementation date (YYYY-MM-DD)
  - `<user>`: Who implemented it

  ### Backward Compatibility
  The parser supports both formats:
  - New: `// trace:FR-0042 - Title | ai:claude:high | impl:2025-12-10 | by:joe`
  - Legacy: `// trace:FR-0042 | ai:claude:high`

  ### Language Support
  Comments should follow language conventions:
  - Rust/C/JS: `// trace:...`
  - Python/Shell: `# trace:...`
  - HTML: `<!-- trace:... -->`

  ### Implementation Notes
  - TraceComment struct added in models.rs with parse() and format() methods
  - CLI trace scan updated for new regex pattern
  - Scaffolding documentation updated
status: Completed
priority: Medium
