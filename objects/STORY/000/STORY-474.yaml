title: MCP tool profiles and safe default surface
description: 'Add named MCP tool profiles so AIDA can expose a conservative surface to untrusted or exploratory clients while keeping full coordination/admin tools available to trusted agents. Acceptance: aida mcp-serve supports profiles such as read-only, coordination, operator, admin, and full; tools advertise/profile metadata; read-only excludes all write tools; tests verify tools/list filtering; docs recommend safe defaults for marketplace installs.'
