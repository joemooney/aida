title: 'Epic focus: picker (select from open epics) + per-worktree persistence/auto-detect (.aida/tui-focus)'
description: |-
  Enhance the redesign TUI epic focus lens (STORY-695) with an epic PICKER and per-worktree PERSISTENCE / auto-detect.

  A) EPIC PICKER: the focus key (`F`) opens a selectable LIST of open epics instead of a blank type-an-id input. List open (non-terminal) epics in-process via the SpecStore (type=epic). Navigate with up/down, type to FUZZY-FILTER (reuse the cmd_palette fuzzy core), Enter selects -> focus on that epic, Esc cancels. Reuse the existing modal/list/fuzzy patterns. (This replaces the raw type-an-id input — the fuzzy filter covers typing a known id too.) Show id + title (+ progress if cheap) per epic row.

  B) WORKTREE AUTO-DETECT / PERSISTENCE: persist the focus epic in a per-worktree marker file `.aida/tui-focus` (one line: the epic id; auto-gitignored under the .aida/* deny-by-default convention).
  - On launch, resolve the focus with precedence: AIDA_TUI_EPIC env  >  .aida/tui-focus marker  >  none.
  - Selecting a focus (via the picker) WRITES the marker; clearing (C) removes/empties it. So re-launching `aida tui` in this worktree auto-focuses on the epic it last had — the worktree remembers its block of work.
  - STRETCH (optional, only if clean): if neither env nor marker is set, infer the focus epic from the current branch's trailered specs' most-common parent epic (git log (SPEC-ID) trailers -> each spec's parent epic -> mode). If not clean, leave a TODO and ship the marker path.

  ACCEPTANCE:
  - `F` opens a fuzzy-filterable picker of open epics; Enter focuses the selected epic; Esc cancels.
  - focus persists across launches via .aida/tui-focus (precedence env > marker > none); picking writes it, C clears it.
  - pure logic unit-tested: the open-epic list source, picker selection -> focus, marker read/write + the precedence resolution.
  - build/test/fmt/clippy green; redesign module + a small marker-IO helper; existing TUI untouched; --no-verify commit.

  ## Test Plan

  1. Launch with `AIDA_TUI_EPIC=EPIC-54 aida tui` → **expect** the status line shows `focus: EPIC-54 — <progress>` and every scope is narrowed to EPIC-54's tree.
  2. Press **C** → **expect** the lens clears and all open specs return.
  3. Press **F** → **expect** a fuzzy-filterable **picker of open epics**; arrow/type to find one, Enter focuses it.
  4. Pick an epic, quit, relaunch `aida tui` (no env var) in the same worktree → **expect** it **auto-focuses** on the last pick (persisted in `.aida/tui-focus`); branch-inference is the fallback when there's no marker.
