- id: 01a1c5dc-7b38-79a0-b14b-a53401fc1b6e
  author: joe
  content: 'ADVISOR RULING (design fork, 2026-11-10): extend the EXISTING signed publication schema with a reviewer-set field carry_eligible: bool. A missing field means true, so existing approvals stay valid with no migration. No new receipt type: one authority surface (verified_authority_keys) is simpler to audit than two. The local recording receipt mirrors the field. The cached carry-over proof key must include carry_eligible, so changing the marker after a proof was cached invalidates that proof. Removal: none needed; the field is permanent schema. Still sketch-first: post a sketch naming the schema version bump and the proof-cache key change before code.'
