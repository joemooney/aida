    REVIEW FINDINGS TO ADDRESS (STORY-2696):
    Verdict: CHANGES REQUESTED
    Reviewed commit: e0eae1112098
    Recorded: 2026-11-11T02:15:15.912012955+00:00
    Findings:
    1. [P2] Retain policy-only review changes as distinct rounds (aida-cli-lib/src/lib_part5.rs:3277; gate/review_verdict.rs:888,1591). Recording approved at H and then recording approved --no-carry at the same H by the same reviewer leaves recording_key unchanged (SHA, reviewer, verdict, findings only). build_verdict_object calls archive_current_round before the new attestation is installed, so the earlier policy is omitted from rounds and record_outcome reports Unchanged despite changing authorization policy; the PR handshake has the same problem. Include effective carry eligibility in recording identity and supply the incoming policy before archiving, defaulting legacy missing policy to true. Add regressions for true-to-false and false-to-true at the same head/reviewer, checking retained spec/PR rounds and recorded outcome.
    2. [P2] Apply corpus policy after append/supersession selection (aida-cli-lib/src/gate/merge_hold_core.rs:1427-1434). corpus_carry_over refuses on every top-level no-carry artifact before effective_recordings_for_sha/reconcile_artifacts_for_sha resolves which act is effective. With stale alias/root artifact A (approved at H, carry_eligible=false) and newer artifact B (approved at H, carry_eligible=true, rounds containing A), reconciliation correctly displaces A, but this loop returns ReviewerPolicy before the prover. After a clean base merge H-to-H2, ship/readiness can select B and carry it while the corpus merge gate still refuses. Resolve effective recordings for each approved SHA first and enforce policy on that selected evidence; test A plus B-with-A-in-rounds in both input orders and verify superseded false cannot veto a later eligible approval.
