title: Authenticated reviewer no-carry marker for approval carry-over
description: 'Follow-up split from STORY-2694. Let a reviewer mark an approval as not carry-eligible across clean merges from main (for example security-critical or gate-touching changes). A design fork is open: extend local recording receipts plus the signed publication schema, or introduce a distinct authenticated reviewer-policy receipt (see STORY-2694 punt, gate/review_authority.rs::verified_authority_keys). Needs migration and removal rules, including a marker change after a cached proof. Architecture: sketch and advisor signoff before implementation.'
