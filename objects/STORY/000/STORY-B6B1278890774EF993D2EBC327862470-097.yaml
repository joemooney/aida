  content: |-
    ## Implementer findings (could not file as draft TASKs: `aida add` ID allocation hit "Read-only file system" in this sandbox; nothing was written)

    1. **kind:design-choice · severity:minor.** The new store-push gate in aida-core (`git_ops::refuse_gated_store_push`, registered in `main_entry`) refuses any aida-store push to a hub this clone's `push_hubs` exclude. The user-facing paths (db sync --push, the aida push store leg, auto-push) redirect to the declared hubs. The direct-to-origin writers in aida-core (schedule_ledger, team, alias, allocation_lineage, the registry writers in git_ops, the store_sync id-allocation push) now get a refusal on a gitlab-only clone, and their commit stays local until the next redirected push. Follow-up: redirect them too, or tie this to a per-clone upstream (STORY-HOME-095). Id allocation matters most.
    2. **kind:followup-suggestion · severity:minor.** `push_hubs` governs pushes only. The store pull legs (db sync --pull, aida pull) still use origin. After the bridge unions the hubs, the work clone's next redirected push to gitlab is rejected until it pulls the union. Consider a pull hub (default origin, else the first push hub).
    3. **kind:followup-suggestion · severity:cosmetic.** The separate `aida-server` binary does not register the gate (every `aida` subcommand, including `aida mcp serve`, does). Register it there if aida-server ever pushes the store.

    Branch: story-b6b1278890774ef993d2ebc327862470-097 · Commit: 0da54c6fc67
