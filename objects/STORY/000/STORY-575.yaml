title: 'WS4: Governance surface sharpening — make the gates legible headline features (audit view, approval visibility, autonomy ladder doc)'
description: 'The governance machinery exists (ADR-3 approval gates, roles, triage/disposition leases, autonomy ladder, history arrays, trace loop, contained posture STORY-567) but is scattered — it''s the MECHANISM of the new position, so make it legible: (1) ''aida audit <spec>'' answering WHO approved/decided/changed WHAT and WHEN from history arrays + role activity (the regulated-segment + bd-forensics demo; scope honestly: history coverage ~11% of older objects until STORY-579''s backfill decision); (2) gate-refusal messages explain the governance model in one line; (3) docs/governance.md presenting the ladder as ONE story: intake → approval → sign-off-by-queueing → role-gated autonomy → trace-LINKED merge + auto-bump (gate default-on per STORY-579 — do NOT write ''trace-enforced'' until it lands) → decision audit; (4) relate STORY-559 dashboard + STORY-567 contained posture (don''t duplicate). NOT story-neutral (red-team): docs here use the scoped formulations until STORY-579 lands. Acceptance: a skeptical evaluator goes from README claim to a runnable 10-minute governance demo; no unscoped enforcement claim in any output or doc this slice ships.'
