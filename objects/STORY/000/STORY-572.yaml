title: 'WS1: Rewrite the decision/vision substrate — VIS-1, OVERVIEW.md, README lead, CLAUDE.md strategic sections re-led with governance (ADR-4)'
description: |-
  Re-lead every vision-level artifact with ADR-4's canonical operator language: AIDA is an AI DEVELOPER ASSISTANT — multi-vendor coordination + intent/why capture lead; governance = mechanism + enterprise depth, NOT the lead word (D9). RED-TEAM SHARPENING (binding): the lead is cross-vendor INTENT GOVERNANCE (gates before work, decision audit, trace loop) — never bare 'multi-vendor coordination' (Gas Town ships multi-vendor dispatch today); ALL multi-vendor copy scoped to the coordination layer in the same sentence until STORY-578 lands; NO 'enforced' in copy until STORY-579 lands (use 'trace-linked + merge auto-bump; commit gate default-on landing'); audit claims use DECISIONS-vs-changes framing only.

  Scope: VIS-1 rewrite (folds STORY-551); new PRIN clause (gates-before-work vs unleash); OVERVIEW.md vision + Public-face section (TUI stays the face); README lead + moat content; CLAUDE.md strategic paragraph; D8 acronym sweep 'AI Design Assistant' → 'AI Developer Assistant' at ALL sites (CLAUDE.md line 1, README, OVERVIEW, aida-core/templates/, deck, **Cargo.toml crate descriptions (they exist — unconditional), aida-core/src/report.rs, Makefile, docs/agents/cross-agent-onboarding.md + template twin, docs/aida/01-vision.md, docs/aida/README.md**).

  Acceptance: (1) README lead = operator's statement + sharpening; (2) governance as mechanism/depth everywhere; (3) claims match the rescope table AS CORRECTED BY ITS ERRATUM (D5); (4) 'missing index' and (5) 'AI Design Assistant' return zero grep hits **in LIVING artifacts** (CHANGELOG/PROMPT_HISTORY/docs/archive/dated snapshots are FROZEN per D6 — exclude via -g globs, do not edit); (6) the Beads-contrast line (recorded on ADR-4 as D2) appears in positioning papers only. On branch repositioning.
