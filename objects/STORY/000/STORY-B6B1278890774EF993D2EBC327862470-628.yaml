- id: 01a1c494-41a4-7c62-9558-209ab30aaee7
  author: joe
  content: 'ADVISOR RULING (2026-11-10 08:30 UTC) — binding for PR #3768 rework at head 6617aa081f. Fix exactly one finding: [P2] review_implementer_gate.rs:71-74 skips cross-host sessions started with the scope-default role, because session_start.rs:2386-2396 writes claim.agent from launch_role/AIDA_SESSION_ROLE (empty, or an inherited advisor/reviewer) while the lease later gets role=implementer by scope default (3322-3352). Ruling: (1) session_start writes the EFFECTIVE scope-derived role into the shared claim (compute it once, before the claim is written, and use the same value for the lease); (2) for existing records, the gate treats an EMPTY claim role on a spec scope as implementer (fail toward deferring review, bounded by lease liveness per AC4); an explicit reviewer/advisor role stays excluded. Regression: production default-role claim creation (aida session start --owns STORY-X, no --role) followed by review admission is deferred. LIGHT gate: cargo test -p aida-cli-lib review_implementer_gate session_start (one run), then make check-ci-fast.'
