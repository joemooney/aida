    REVIEW FINDINGS TO ADDRESS (PR #3506):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c01026583a34
    Recorded: 2026-11-06T15:56:19.563686221+00:00
    Findings:
    1. BLOCKING - hourly job guaranteed to fail on every run: .aida/config.toml:293-306 enables defer-resurface (every=1h) plus a CronJobFailed:defer-resurface advisor route, but S3 (the one-time free-text -> typed rewrite) has not merged. In the canonical store all 55 active, non-archived deferred specs have free-text deferred_until (e.g. TASK-893 'Codex ships command-backed status lines', TASK-1214, TASK-2021). defer_resurface.rs:29 raw.parse()? turns each into a sweep error, and :176 ensure! exits non-zero, so the job fails every hour and pages the advisor with ~55 parse errors while resurfacing nothing. The signed-off slice order put S3 before S4. Fix (pick one and say which in the PR body): (a) ship the job with enabled = false (route too) and enable it in S3 after the migration, or (b) classify unparseable legacy triggers as Keep with a 'legacy trigger awaiting migration' line and a summary count (not an error) until S3 lands, keeping malformed-typed (e.g. spec:<missing-id>) as errors. Add a test for the chosen behaviour and update docs/cli/02-specs.md:346-350 to match.
