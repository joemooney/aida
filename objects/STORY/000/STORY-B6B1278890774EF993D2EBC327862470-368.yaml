  content: 'ADVISOR SIGNOFF (2026-11-03 22:02 MST): sketch APPROVED as five PRs (S1-S5). Rulings: (1) Store the canonical string in deferred_until with no schema change. Reason: single user, and three backends untouched. (2) Route to aida human and never auto-lift an operator hold. (3) Yes: query: is limited to aida list''s existing filters plus count<op>n. (4) Yes, findings recur --until is the recurrence escalation. (5) A transient gh failure evaluates to Unknown, which is not false: skip it, report it, never un-defer on Unknown, and exit 0. The job exits non-zero only for an internal or parse error. This replaces the sketch''s ''non-zero when gh down'' line and matches STORY-2401''s Observed<T> semantics. If STORY-2401 slice 2 has merged by then, use its Observed type in the facts adapter; otherwise use a local tri-state and do not wait for it. DISPATCH: S1 now (condition module, aida condition check, help golden). S2 to S5 follow in order, each after its predecessor merges. Gate LIGHT per slice.'
