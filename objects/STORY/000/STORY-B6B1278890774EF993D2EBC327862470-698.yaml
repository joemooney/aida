  content: |
    Implemented CLI-owned script-runner supervision via --loop. The supervisor executes the running CLI image with the original arguments minus --loop, retains terminal/grant admission, restarts after clean/error/signal exits, uses 1s doubling backoff capped at 60s and resets after 600s uptime. INT/TERM to the supervisor forwards shutdown and reaps the runner; HUP permits restart. Timestamped runner.log records ordinary stop/error reasons and supervised exit code/signal/uptime; list reports live loop identity and restart count, including backoff. The existing shell wrapper already forwards arguments unchanged. Lock files remain reusable flock anchors; shutdown releases ownership and removes live loop state.

    Changed deputy_shell module registration, runner and tests; added deputy_shell/supervisor.rs; updated deputy_shell_cmd and args, help golden snapshot and catalog, operator docs, and seven regenerated store-writer inventory sink entries. The inventory additions keep the existing blocked/no-new-authority classification.

    Validation: launcher job j20261114T065946660-2-0 passed 75 deputy-shell/command-registry tests in parallel, including supervisor PID-targeted SIGINT/SIGTERM and child reaping, clean/crash restarts, backoff, stop during backoff, ordinary reason logging, and golden help. Job j20261114T070142228-2-0 repeated the same 75 tests serially and passed. Earlier runs exposed a fixture directory permission issue (fixed), missing help catalog entry (fixed), and two transient existing runner-lock test failures that did not recur in the final parallel or serial runs. Fast CI gates passed through the store-writer inventory gate after fixing formatting; after regenerating and reviewing the seven expected inventory entries, resumed CI's own fast-tier plan at that failed gate, and all 11 remaining gates passed. git diff --check passes.

    Navigation limitation: the operator-supplied /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent; aida doctor check codegraph confirms unavailable. Used source searches. Existing advisor grant, wrapper and human-terminal restrictions remain; --loop does not authorize unattended non-terminal execution or renew an invalid grant.

    Native-seat handoff: edits remain uncommitted. Host launcher owns commit/push/PR and queue completion.
