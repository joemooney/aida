- id: 01a1b174-0bea-71c0-831e-3c081a340c10
  author: joe
  content: 'ADVISOR RULING (PR #3504 round-2 F1, unbounded history revalidation). Bound it by design rather than with a bigger deadline. (1) On a checkpoint miss, revalidate only the newest N attempts (N=32, a named constant) plus any attempt a current reader asks for by (attempt, SHA). (2) Older attempts are reported as unverified-history and are never trusted as receipts; they stay readable for audit. (3) Write a fresh checkpoint after the bounded pass, so the next run is incremental. (4) The validator-source fingerprint change invalidates the checkpoint but follows the same bounded path. Tests: a fresh clone with more than N attempts finishes within the deadline and marks the rest unverified; a per-attempt read of an old attempt revalidates just that one. Fail-closed is unchanged. No other findings remain open from round 2. Gate: CI green at the head, including the contracts e2e step.'
