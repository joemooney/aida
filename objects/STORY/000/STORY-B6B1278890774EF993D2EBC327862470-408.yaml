    1. MAJOR (blocking; round-1 finding 2 only partly fixed): the validated-tip checkpoint is keyed by validator_prefix() (intent_intake.rs:163-170), a SHA-256 of intent_intake.rs, observation_envelope.rs, ci_receipt.rs and ci_relay.rs. When there is no matching checkpoint, history() (intent_intake.rs:540-544) runs ci_validate on every historical ci-results file. Each distinct SHA then costs a home_remote fetch plus a full source inventory inside Snapshot's single 30s deadline (ci_relay.rs:471-482). There is no matching checkpoint on a fresh clone, a re-enrolled work machine, or after any AIDA build that edits those four files. Results are immutable and kept forever, so once enough distinct SHAs exist those clones fail permanently on pull/sync/publish/process (observations included), with no recovery. test_several_shas_reuse_accepted_history_without_source_fetches only covers a warm checkpoint from the same binary. Suggested fix: in history(), check only retained admission and strict schema/digest/canonical path for CI files, with no source fetch. Keep inventory validation in process() before publishing, which already runs at ci_relay.rs:1017. Add a test: several SHAs, then delete validated-tip or use a fresh home clone, and assert pull succeeds with no source-SHA fetches.
