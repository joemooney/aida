  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3504):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4680be204455
    Recorded: 2026-11-06T16:40:36.673924919+00:00
    Review comment: https://github.com/joemooney/aida/pull/3504#issuecomment-6690115271
    Findings:
    1. BLOCKING: CI (cli-0) fails at 4680be2 (run 42249509817, job 128000524945, step 'Run tests'). It passed at 5454756, which lacks round 3. Cause: round 3 switched validated-tip to a JSON Checkpoint {validator,tip,verified_ci}, but aida-cli/tests/task_3096_intake_transport.rs:982 and :1003 (validated_checkpoint_skips_old_trees_but_checks_new_intermediate_commits) still assert cached.ends_with(':<tip>'). Line 1005's 'v0:stale:<tip>' write no longer exercises a stale-validator checkpoint, only an unparsable file. Update the test to parse the JSON checkpoint (assert tip == HEAD) and write a JSON checkpoint with a different validator for the stale case.
    2. BLOCKING: CI (lib-1) fails at 4680be2 (job 128000524363, step 'Run tests'); it passed at 5454756. The reviewer sandbox cannot download job logs (blob storage denied), so read that job's log, name the failing test and fix it. Candidates: lib-side snapshot/catalog/audit tests touched by the new 'intent ci read' subcommand, or task_1945_commit_ci_tests (criterion ac0a4b5e evidence).
    3. MINOR: the warm-path incremental validation is still unbounded. With a valid checkpoint, every result added since the checkpoint is source-fetched and inventoried under the single 30s Snapshot deadline (intent_intake.rs, 'selected' else-branch). On a deadline failure files() never writes a checkpoint, so a burst of more new distinct SHAs than fit in 30s (e.g. a home processor offline while many ci/* attempts complete) fails every pull/sync/publish/process, observations included, until an operator deletes validated-tip. Apply the same newest-CI_HISTORY_REVALIDATION_ATTEMPTS cap to the warm path (excess new results become unverified-history), or document the recovery. Add a test.
    4. MINOR (follow-up acceptable): retention against hard caps. refs() refuses more than 4096 retained refs/aida/ci/* (ci_relay.rs:199-201), and history() refuses more than 4096 intake commits. The ruling never deletes attempt refs, and each result is its own intake commit, so after about 4096 CI attempts the whole aida-intent channel, observation intake included, fails permanently. Pruning was ruled out of scope, but the cap turns that into a time-bomb. File a follow-up spec (bounded retention/compaction or paged admission) or document the limit in docs/agents/work-ci-relay.md.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
