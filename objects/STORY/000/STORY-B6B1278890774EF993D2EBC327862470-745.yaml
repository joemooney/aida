    - story_1742_transport_profile::explicit_store_overrides_cannot_bypass_a_profile_in_either_clone (:492): "Cannot resolve clone-local Git metadata; transport policy is unknown."

    Likely cause (not yet confirmed): dell1 has an empty directory /tmp/.git (birth 2026-11-14 22:14:22 MST, during an isolated rerun of bug_1934_bwrap_presenter + the three targets). allocation_authority::in_git_clone/common_dir walk ancestors for `.git`, so every tempdir under /tmp is then treated as inside a clone. A test in the aida-cli set most likely creates `.git` in its tempdir's parent: a test-hygiene leak, which could also make CI runs flaky depending on test order. Next step after the window: find which test creates /tmp/.git (remove it, run targets one at a time), and make the allocation tests independent of stray ancestors.
