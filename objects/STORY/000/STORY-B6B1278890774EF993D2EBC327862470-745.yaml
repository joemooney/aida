- id: 01a1df7a-a57a-7bc1-bf57-af01e7386746
  author: joe
  content: |
    Integration seat, 06:52 MST: a /tmp/.git watch loop is running on dell1 (advisor-approved; user-level). Script ~/ai/git-watch.sh, run as `nohup timeout 24h` with timeout pid 174731 and watcher pid 174733. inotifywait is not installed, so it polls every 1 s. When /tmp/.git appears it appends to ~/tmp-git-watch.log: stat and listing, pid/cwd/cmdline of git processes, every process whose cwd is under /tmp, and `ps -ef --forest`. It then moves /tmp/.git to ~/tmp-dotgit-watch-<ts>. A 1 s poll can miss a short-lived git, but the cwd-under-/tmp list plus the forest should still show the parent.
