  content: '[integration seat 2026-11-14 12:45 MST, CLI friction] The pre-commit hook refused a merge commit that adds .aida/discipline/standing-orders/integration.md (from PR #3950): ''is gitignored''. The repo''s .gitignore allow-lists .aida/discipline/** , but this machine''s .git/info/exclude has ''/.aida/'', and the hook''s check (git check-ignore --no-index) reads the local exclude too, so a tracked, allow-listed path is reported as an intermediate build product. The file was byte-identical to its template master. Worked around with the hook''s documented AIDA_ALLOW_INTERMEDIATE=1 (accepted by the advisor), which also skips the hook''s other checks for that commit. Suggested fix: the hook should consult only the tracked .gitignore for this check (or skip paths the tracked .gitignore re-includes).'
