- id: 01a1df79-e41d-7691-a3f2-6f6ae4595ed1
  author: joe
  content: |
    Integration seat, 06:55 MST: diagnosis run on dell1 at 3724fa35317. Each of the four product-set targets ran alone twice, with -j 1 and a fresh TMPDIR per run, checking /tmp/.git after each: story_1888_gate_paths (52), bug_1985_host_status_guard (1), help_surface_matches_golden_snapshot (1), bug_1502_format_json_audit (14). No /tmp/.git appeared in any run, and none appeared during the full promotion 13 chain either (product set plus full aida-cli set, 06:2x to 06:43). So the leak is NOT reproducible from those targets alone, and the 06:18 timing was probably coincidental, as was 23:19 (no integration-seat run active). Lanes run under bwrap with --tmpfs /tmp, so they cannot write the host /tmp; the creator is a host-level process (an unsandboxed deputy job, aida-server/cron, or another host-side cargo run). Next step needs root or a long watch: `auditctl -w /tmp -p wa -k dotgit` (gives the PID and exe), or a loop watching for /tmp/.git that snapshots `ps -ef` when it appears. Leaving this unfiled as a named bug until the creator is identified.
  created_at: 2026-11-15T13:51:09.853192854Z
  modified_at: 2026-11-15T13:51:09.853192854Z
