- id: 01a1db88-e670-75e0-9564-d24a0637070e
  author: joe
  content: 'Product seat 2026-11-14 19:30Z, seat-to-seat messages: Claude Code holds a cross-session message for the operator''s deliver/deny click when sender and receiver are in different permission classes (bypass vs everything else), and a held message expires after 5 minutes, so with the operator away mixed-mode seats silently lose each other''s messages. The integration seat runs in bypass and the advisor and product seats do not. Fix applied by Joe at 12:16 MST: "crossSessionInbound": "accept" in ~/.claude/settings.json. A session already running did not pick it up (the product seat kept prompting until Joe exited and resumed it), so the setting belongs in seat launch (aida agent new should check or set it and refuse or warn on a mixed-mode fleet without it), and every running seat needs one restart after it is first set. Resuming also renamed the product session (aida-5d -> aida-ef), which removed the name clash with the advisor recorded above.'
