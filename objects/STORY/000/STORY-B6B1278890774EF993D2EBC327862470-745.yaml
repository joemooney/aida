    Integration seat, 2026-11-14 22:20 MST: three aida-cli targets fail on dell1 in isolation, identically at e112ce7023e (pushed integration) and f3357d36cdc (#4077). Not blocking promotion 11 per the product seat's ruling; GitHub full tier at the promotion head is the authority.

    - bug_2017_allocation_policy::bug_2017_cli_local_and_global_refusals (tests/bug_2017_allocation_policy.rs:133): "global ID/block allocation requires an explicitly authoritative clone; this clone may allocate only node-local IDs"
