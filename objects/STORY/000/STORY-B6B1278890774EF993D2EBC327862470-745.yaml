    Integration seat, 03:05 MST: another parallel-run-only failure in the same family. At e3743228337 (promotion 12 candidate) on dell1, queue_rework_tests::rework_writes_blocking_review_findings_comment failed at queue_rework_tests.rs:251, `std::env::current_dir().unwrap()`: the process working directory had been deleted under it. It passes alone twice. A clue for the /tmp/.git leak: tests that chdir into a tempdir that another test then deletes, or that create `.git` relative to a working directory that has fallen back to /tmp, would produce both symptoms. Check tests that call `create_dir(".git")` or `set_current_dir` without restoring under env_lock.
