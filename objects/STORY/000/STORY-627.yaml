title: 'aida solo legibility: run/stop/status verbs + responsive stop + .aida/solo.lock pid sentinel + per-step progress heartbeat'
description: 'Operator friction during the first real overnight aida solo --watch run. Make the solo loop legible + safely controllable: (1) RENAME to verbs — aida solo run / stop / status (keep --watch/--off/--status as deprecated silent aliases). (2) RESPONSIVE STOP — the loop currently polls the solo flag only at each cycle top, so stop/--off takes up to a full cycle+sleep to land; instead poll the flag in short increments DURING the inter-cycle sleep so stop takes effect within seconds. (3) .aida/solo.lock (pid + started_at, mirroring BUG-538 drain.lock) — a true liveness sentinel: a second `aida solo run` refuses while one is live, `aida solo stop` can also signal the live pid (not just flip the flag), and a Ctrl-C-killed loop is detectable (the flag-left-ON-after-Ctrl-C gap, confirmed live 2026-06-15). (4) PROGRESS HEARTBEAT — during the long headless steps (assess/implement, which run claude -p for minutes) print a working…(Nm) line + a "Ctrl-C / aida solo stop to stop" reminder so a watching operator is never staring at silence. Parent STORY-625.'
