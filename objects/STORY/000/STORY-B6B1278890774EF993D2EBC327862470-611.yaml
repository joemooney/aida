  author: joe
  content: 'Sketch (advisor 2026-11-08), for review before implementation. One pure function classify(PrFacts) -> PrState, where PrFacts is open/closed, mergeable, head SHA, verdict and kind at that head, CI result at that head, hold state, lane running. Closed state set: Gone, Conflict, RedCi, NeedsVerdict, CiPendingThenVerdict, NeedsRework, NeedsRuling, ApprovedCiPending, ReadyForTrain. Each state maps to one action and owner. reconcile runs the mechanical actions (update branch, release a re-review, queue rework, enqueue train); idempotency comes from a durable action ledger keyed (pr, head, action), replacing in-memory seen sets. Judgment states only route to a seat. Slices: S1 classify plus aida pr state read-only table, with table-driven tests; S2 ledger and reconcile --dry-run; S3 execute and retire auto-train, auto-rework and review-watch-loop. Open fork: train selection stays in aida pr train, with the reconciler only nominating. Needs advisor signoff by an independent read before S2.'
