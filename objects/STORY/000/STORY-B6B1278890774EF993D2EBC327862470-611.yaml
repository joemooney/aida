- id: 01a1ca01-df48-79b2-b73a-ab83a20e9c6c
  author: dirtlab
  content: |
    Consolidated architecture sketch — sketch-only lane, 2026-11-11.

    Scope: the invocation's binding 2026-11-10 brief requires a sketch and punt, with no source edits. The spec already contains joe's 2026-11-11 signoff authorizing S1. This comment preserves that signoff and its amendments; the punt requests reconciliation of the current sketch-only dispatch with that implementation authorization, not a claim that signoff is absent.

    Derivation source of truth: one proposed cli-library pr_state module collects PrFacts and calls pure classify(PrFacts) -> PrDecision { state, next_action, owner, reason, evidence_key }. Both read-only `aida pr state` table/JSON and future reconciliation use this function. Derived state is neither stored lifecycle status nor permission to act. PrFacts combines forge/project/change identity, confirmed lifecycle, pinned head/base, mergeability and behind-base evidence, workflow digest, attested verdict/round at current head, classified required CI at that head, effective holds/punts/clearance, durable reservations, receipts and process-bound lane ownership. Reuse forge_observed, trusted verdict readers and existing gates. Preserve unknown/pending/transient facts; recheck head after collection and reject mixed-head snapshots. Old-head verdicts are diagnostic only. Batch forge collection by fact kind, not per PR; S1 performance acceptance is under 10 seconds for 20 open PRs.

    Closed enum, first-match precedence; next action / owner:
    1. Gone: confirmed closed/merged -> retire reconciler reservations after confirmation / reconciler (never terminate a live child implicitly).
    2. EvidencePending: needed evidence pending, transient, moving, or reviewer retry backoff active -> bounded re-observation / reconciler. Persistent unsafe/corrupt evidence escalates to NeedsRuling.
    3. Held: effective punt or uncleared hold -> request authorized clearance / concrete advisor seat; human-clear requirements retain human authority.
    4. InFlight: accepted queued/running operation or ambiguous acceptance, including overlapping prior-head work -> observe operation receipt / recorded lane, reviewer or train owner.
    5. NeedsRuling: judgment verdict, policy exhaustion, contradictory facts, draft/unsupported policy, missing or ambiguous owner -> request decision / concrete advisor seat; unavailable advisor routing is a visible refusal.
    6. Conflict: confirmed conflict -> queue conflict resolution / concrete implementer seat.
    7. BehindBase: mergeable but base/workflow freshness requires update -> request guarded update / concrete author or implementer seat.
    8. NeedsRework: current-head findings permit mechanical rework -> enqueue findings-bound rework / concrete implementer seat.
    9. RedCi: confirmed blocking CI failure without higher-priority findings -> route diagnosis / concrete implementer seat.
    10. CiPendingThenVerdict: no valid current-head verdict, CI pending -> dispatch review now / concrete reviewer seat.
    11. NeedsVerdict: no valid current-head verdict, CI green -> dispatch review / concrete reviewer seat.
    12. ApprovedCiPending: valid current-head approval, CI pending or unregistered -> observe CI / reconciler.
    13. ReadyForTrain: valid approval, green CI, known freshness/mergeability/eligibility -> nominate exact head / train controller.
    All later rows exclude earlier predicates. Nondecisive facts remain diagnostics. A current-head reviewer exit without a verdict, or WAITING alone, supplies no verdict: expose attempt count; EvidencePending during BUG-2518 retry backoff, then NeedsVerdict/CiPendingThenVerdict when permitted. Exhausted retry policy routes NeedsRuling. Completed attempts alone must not permanently imply InFlight. CI need not finish before review dispatch.

    Consumers: auto-train consumes ReadyForTrain nominations; `aida pr train` retains selection/batching, train CI, current gate checks, journal and merge authority. Auto-rework consumes NeedsRework using existing queue-rework with exact findings/round identity; RedCi/Conflict route diagnosis rather than blind retries. Review-watch consumes NeedsVerdict/CiPendingThenVerdict through its attested admission, shared concurrency reservations and prior-head overlap rules. ApprovedCiPending only observes. Loops become schedulers over the common output, not independent classifiers. Shadow mode is read-only; only one executor is enabled during migration. Retire auto-train/auto-rework predicates after parity; retain review-watch's runtime/admission machinery behind the shared decision boundary.

    Durability: under shared project/change locking, refresh facts and reserve intent before effects. Operation key includes project/forge/change, head and action, plus findings/verdict-round for review/rework and target base/workflow for update/train. Persist owner, fingerprint, phase and destination receipt. Reuse downstream reservation/journal identities. Restart inspects destination acceptance before replay. Crash-after-effect requires stable downstream operation-ID deduplication or discoverable durable acceptance; a ledger alone cannot guarantee exactly-once effects. Ambiguous acceptance retains reservation/capacity and routes recovery; elapsed time cannot prove safe replay. Revalidate head, holds and authority at existing locked mutation boundaries. No automatic merge or clearance authority is added.

    Proposed later implementation slices (not performed here): S1 pure classifier and read-only table/JSON; table-driven coverage for all states and precedence pairs, owner resolution, WAITING/no-verdict/backoff/exhaustion, stale evidence and batch latency. S2 durable ledger and dry-run with concurrency/crash-boundary tests. S3 effect adapters only after receipt contracts prove restart safety, then shadow parity and script retirement. Preserve advisor's approved S1 Refs-only publication and LIGHT gate requirements for a subsequent implementation dispatch.

    Validation: read existing spec discussion and inspected review_watch.rs reservation/no-verdict retry interfaces plus queue_cmd/rework.rs interfaces using rg. Supplied host codegraph client /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent; no index operations performed. No source edits; git status is clean. No Cargo tests apply to this sketch-only deliverable. Requested advisor decision: confirm the next dispatch may implement the already signed-off S1 despite this invocation's sketch-only brief.
