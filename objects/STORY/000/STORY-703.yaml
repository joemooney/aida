title: 'Advisor-backlog opacity panel: surface WHY the advisor parked each item'
description: |-
  Surface WHY the advisor parked/deferred each item, inline in the cockpit. EPIC-53 content layer (least shell-coupled — build first).

  ## Acceptance
  - Each advisor-backlog item (per is_advisor_backlog) shows its park reason inline: revisit trigger, finding, or punt note.
  - Total advisor-queue depth is displayed.
  - The park-reason projection is a PURE function over the item set (unit-testable without the TUI shell).
  - Visibility-first: no new role (defers STORY-688).

  ## Seam
  EPIC-53 owns the data (enrich is_advisor_backlog with reasons + depth). EPIC-54 provides the content-panel slot. See docs/plans/2026-06-26-epic-53-cockpit-seam.md for the EPIC-53(content) vs EPIC-54(shell) boundary.
