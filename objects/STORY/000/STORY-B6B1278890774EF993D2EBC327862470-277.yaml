    "error building bubblewrap command: app-server socket directory must be a user-owned directory with mode 0700".
    It also warned it could not create PATH aliases under temporary CODEX_HOME. Therefore this session does not prove present-empty, companion, role, keyring, reviewer or direct-exec queue readiness. BUG-2398 already records separate successful host empty-value evidence; do not erase it or misdescribe this local app-server precondition as empty-value failure or universal nested-sandbox impossibility. Preserve the exact cause and repair only disposable fixture layout for later evidence. No auth/model-backed workaround.

    9. Slices, dependencies and questions for the independent signer
    Possible vertical slices, all within this story until every AC is evidenced:
    A. Fresh detached implementer end-to-end through sanctioned gate, exact PID/start, supervisor/barrier, transferable invocation receipt and failure/duplicate tests, synthetic fake vendor. Feature remains unavailable until its safety evidence passes.
    B. Reviewer/coexistence/attestation plus adopted BUG-2398 finalizer, actual installed-core policy/grant evidence and truthful native posture integration.
    C. Crash recovery, ps/reap/resume and mail-thread lifecycle integration/docs, with all ACs and retained regression evidence. Mail degradation must be explicit; it cannot undermine scope safety.
    These are potential reviewable slices, not dispatched tasks or dispositions. No slice alone completes the parent story.

    Dependencies: BUG-2398's adopted B1-B4 finalizer; BUG-2382's shared all-process liveness/salvage protection; BUG-2381 hermetic fixture isolation. STORY-2238 remains future mandatory-wrapper integration, not permission to claim native is AIDA-contained. BUG-2394 MCP policy and writable-root/cache repairs stay separate; no global-policy relaxation.

    Signing questions/evidence gates:
    Q1. Accept the proposed supervisor + exec barrier + transferable SessionStartReceipt ownership schema and strict detached admission gate, including refusing duplicate-check bypass? Must be settled before code, not left to an implementer to invent receipt/rollback semantics.
    Q2. Confirm the gate-only one-attempt launch capability and exact proof of issuer/supervisor/worker lineage without arbitrary grant rebinding; define bounded lock order and fd/pidfd/death-signal strategy. Parent exit changes process ancestry, not parent expiry/revocation policy.
    Q3. Validate the actual installed executable/shim/namespace mapping and app-server runtime layout. Unknown worker identity or unavailable native seat presentation refuses. No authority from env display stamps.
    Q4. Does direct codex exec support queue-to-existing-running-thread delivery on the installed version? Help alone is not proof. Default truthful pending/unsupported when not evidenced, never queue --resume or daemon handoff; if guaranteed mailwake is required, a separately signed in-boundary persistent-session strategy is needed.
    Q5. Confirm rollout order for BUG-2398/2382 and whether common supervisor types should be extracted now for STORY-2238 or kept narrow until its backend lands. Any containment, grant or metadata-contract deviation needs a fresh independent ruling.
    No architecture approval or implementation authorization is implied by this sketch. Stop after posting and verifying it.
