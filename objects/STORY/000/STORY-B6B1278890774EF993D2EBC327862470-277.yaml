- id: 01a1966a-be93-7f40-a184-c0e84644bac2
  author: mcp
  content: |-
    ADVISOR SIGNOFF APPROVED — STORY-2254 detached Codex sketch, with binding amendments.

    Independent advisor judgment, 2026-11-01, source HEAD 4ce0af750fcb68d4adf57496e4e002aefd8ace77. I did not author Codexadvisor07's sketch or the recovered implementation. This signs the architecture and evidence contract only. It does not approve an implementation head, certify tests, dispatch work, change status, clear holds or authorize merge. No code changes, Cargo, model invocation, launch, grant manipulation, parent-grant borrowing or global configuration changes were performed.

    Read the complete STORY-2254 description and sketch comment; BUG-2398's complete discussion, adopted B1-B4 and independently approved positive-consumer amendment; BUG-2382 including the operator's ALL-processes-in-worktree amendment; ADR-66; relevant TASK-2631 posture decisions; and the advisor discipline files. Independently inspected current launch, grant lifecycle, SessionStartReceipt/cleanup, lease stamps, registry, handle, authorship, resume, headless guards, liveness/reap and mail code. Inspected 2bb95a7's complete agent_codex_background.rs and its launch integration. STORY-2238 remains a separate backend dependency; this ruling does not approve its implementation.

    Source findings, not assumed capabilities:
    - Recovered configure_command sets AIDA_HEADLESS without headless_wait_envs. Its agent_launch integration directly calls bind_grant_to_pid outside the permitted files. accept_child stops/reaps on its callback error, but successful acceptance drops Child without durable supervision. Its happy-path fixture does not prove granted implementer/reviewer authority, terminal cleanup or crash recovery. Do not restore it wholesale.
    - Current run_agent_generation disarms IssuedLaunchGrant and invokes on_spawn immediately after spawn, before registry bookkeeping. SessionStartReceipt::disarm/SessionStartCleanup::drop have no supervisor ownership transfer. Foreground deferred-warning semantics are unsuitable for strict detached acceptance.
    - session::stamp_lease_active_pid_at permits absent start identity and can leave an old start field when a new read fails. register_spawned_agent permits absent pid_start and uses the caller's current_pid_namespace. mark_agent_ended/end_entry do not provide an expected-start/generation compare-update.
    - review_authority::record_launched_worker/record_lease_identity return (); append_authorship_as warns on persistence failure. Calling these is not proof that strict detached authorship persisted.
    - Codex CLI args currently expose --spec, with no Codex --bg or positional spec field. Existing singleton checking can be bypassed by no_duplicate_check; direct resume bypasses that preflight. Both need the proposed independent detached ownership admission check.
    - Existing aida-core liveness walks filter for known agent processes and skip unavailable cwd; that is insufficient for BUG-2382's all-process/unknown contract.
    - PATH currently resolves /home/joe/.nvm/versions/node/v24.12.0/bin/codex to @openai/codex/bin/codex.js. Its source uses process.execve when available, otherwise spawns the native binary. The executable name or initial shim PID therefore does not by itself establish the native worker mapping.

    Binding amendments and decisions:

    1. Owner/trigger/scope. Approve one AIDA-owned, single-attempt supervisor parenting one fresh exec worker, started only by an explicitly scoped detached implementer/reviewer invocation after ordinary preflights. No unscoped launch, implicit baseline, inline human grant, app-server handoff, second driver or automatic retry. Positional spec and --spec must resolve consistently; conflicting forms refuse. Preserve pure previews and reject unsupported resume/rotation/raw posture options before allocations or probes. Existing reviewer backing-spec, coexistence and independence rules remain. Force/allow-duplicate/no-duplicate-check cannot bypass detached active, pending or unknown ownership. Other routes entering that same scope must consult the shared admission record.

    2. One own child grant; sanctioned binding only. gate/seat_authority.rs owns issuance-associated one-use launch capability and acceptance, including the grant-record update. Existing issue_launch_child returns an ordinary grant, not the new capability: add a narrow gate-owned mint-and-capture seam rather than accepting a caller-supplied grant/PID as proof. Capture project, attempt, normalized scope, child subject/role, newly issued grant, original issuer PID/start and permitted supervisor lineage at issuance. Transfer capability once over private inherited IPC; close unused endpoints and prevent inheritance by the model. A journal, environment selector, known grant ID or copied receipt is never binding authority.

    Only the exact owned live barrier child with required PID/start and corroborated lineage may be bound. Retain a live child handle/pidfd where supported; validate start identity through the final internal binding operation so PID reuse cannot substitute another process. Refuse parent/adopted/foreign grants, dead or reused identities and second acceptance. Do not call low-level binding, mutate binding or introduce equivalent general rebinding outside the sanctioned files. Preserve empty delegable seats, expiry bounded by parent, roster/project/subject/revocation/key checks and quota refusals. Native must prove usable seat presentation even though is_contained_launch is false. No parent selector substitution, ambient discovery, new keyring layout or token transport.

    Parent exit after durable transfer does not require a live dispatcher to finish the authorized handoff. It also does not waive current parent grant expiry/revocation/roster checks. Validate those from the bound gate capability and trusted records, not inherited parent env. Abort/refuse if they fail.

    3. Settle the ownership protocol. Approve Prepared -> SupervisorOwned -> Registered -> AcceptedRunning -> Exited, with RefusedBeforeExecution and Unknown/RecoveryRequired as described. Before transfer dispatcher owns rollback; after durable owner compare-update only supervisor owns it. Parent Drop must acquire/check the SAME ownership boundary before destructive action; local disarm timing alone is insufficient. If parent disappears before transfer, stop/reap the gated child without executing it. After transfer, the supervisor may continue from the committed owner record even if acknowledgement was lost. The barrier cannot release until transfer and every mandatory registration write are confirmed.

    Lock order for new code: project scope-admission/attempt ownership lock first; then at most one existing resource lock at a time (grant, lease, handle/registry namespace or ledger), released before taking another. Do not acquire admission while holding a resource lock, recursively take lease/namespace locks, or hold those resource locks across IPC, exec or model waits. Split legacy callers as needed rather than adding an inverse acquisition. Check owner generation at each destructive boundary. Partial multi-file progress is journaled recovery state, never claimed atomicity across independent stores. Lock acquisition and IPC are bounded; timeout preserves uncertainty.

    4. Strict acceptance and identity. Extend or wrap lease/registry/authorship operations with fallible, expected-identity-aware production seams. A warning-only authorship append is blocking for this lane; expose/check persistence rather than treating its () return as success. Under the lease write lock, stamp own grant and active PID/start with expected lease/attempt checks, clear no identity by accident, and verify the persisted result. Record matching worker authorship. Registry must require nonempty start and actual worker namespace, merge hooks only for that same identity, and preserve successor records.

    Bootstrap release requires confirmed grant binding, lease, authorship, registry, handle/context ownership and durable supervisor receipt. A close-on-exec EOF alone is not acceptance. Corroborate native exec with identity/executable evidence plus error/status channels. For the installed shim, prove its PID-preserving native transition or use a reviewed, pinned native executable with the necessary launch environment preserved; otherwise refuse before model work. Do not register Node/wrapper/supervisor as an unproven substitute. An exec error or killed bootstrap is a failed launch. An observed terminal vendor outcome is recorded explicitly, never represented as a currently live worker. Launch acceptance, vendor exit 0, model/task success, queue acceptance and inbox acknowledgement remain distinct.

    5. Cleanup, recovery and CLI contract. Approve bounded private host runtime receipts (0700 directory, 0600 regular files, permanent lock, checked reads/atomic compare-updates) outside model-writable project roots. Retain only the sketch's identifiers/resource identities and terminal evidence, not secrets, tokens, prompts or full env. Receipts supply recovery evidence, not authority.

    Settle proposed public spelling as "aida agent launch-status <ATTEMPT-UUID>" (strictly read-only) and "aida agent recover-launch <ATTEMPT-UUID>" (explicit reconciliation of that attempt under existing lifecycle authorization). These are proposed additions, not commands available today. Also surface attempt/log/status lookup in existing agent/session output. Recovery never spawns/resumes, mints/binds grants, broadens permission or kills an unowned process tree. It may compare-repair exact owned bookkeeping/release the admission reservation only with corroborated terminal identities and no relevant live/unknown processes. Unknown/corrupt/missing/foreign receipts retain scope/resources and name the uncertainty; no retry recommendation.

    Supervisor owns wait/reap, bounded linger/background-work settlement and exact-generation wake/registry/context cleanup. Stop owned work, revoke only its child grant through lifecycle, then remove any eligible final lease; failed/uncertain cleanup retains recovery evidence. Normal exit retains worktree/branch/work and does not complete a spec. Preserve BUG-2188/2168 exact allocation/ref/claim rollback and adopted-resource protection. No cleanup may remove a successor or a permanent lock sidecar.

    BUG-2382 is mandatory shared dependency: fresh all-process cwd-within-worktree checks, worker/descendant and supervisor/attempt evidence, no vendor-name or exact-root-only filtering. Long-lived recovery must not reuse a process-lifetime cached negative scan. Missing start, inaccessible proc/namespace or escaped native descendants mean unknown/preserve. Unrelated editor/build processes block destructive salvage but do not prove Codex authority.

    6. Environment/posture. Adopt BUG-2398 final B1-B4 in full, plus its latest independently approved positive-consumer amendment; the superseded pointer design is rejected. Finalize exactly once at the actual Codex boundary after own grant/subject/role/scope, customize and posture assignments, using explicit Command::get_envs only. Preserve absent versus present-empty, user set entries and inherit=core; TOML encode and refuse invalid values/filters. Use the exact twelve-key whitelist in the sketch including driver|companion AIDA_ROLE_INSTANCE. Insert overrides in the structured inner Codex argv, not wrapper argv or prompt text. No fallback to std::env parent context. Requested absent/empty/invalid own grant refuses.

    Never forward AIDA_HANDLE_LAUNCH_TOKEN, AIDA_AGENT_REGISTRY_TOKEN, AIDA_SESSION_GRANT_FILE, AIDA_CONTAINED, secrets or arbitrary env to tools/argv/config/log/context. Host launcher/hook owns handle/registry binding. No resolver/keyring/pre_exec authority redesign, global policy changes or parent-grant borrowing. ADR-66 same-uid replay residual remains explicit.

    EVERY new headless Command chain, including supervisor/bootstrap and designated headless preflight, applies headless_wait_envs with bg_wait_ceiling_env(Some(project_root)); keep the literal AIDA_HEADLESS chain within the unchanged twelve-line guard window. No zero/hand-set ceiling or guard exemptions. Native remains workspace-write/never and reported "native sandbox, not AIDA-contained". Inherited AIDA containment is sticky; carry the outer boundary or refuse. No STORY-2238 roots/network expansion or BUG-2394 policy workaround here.

    7. Resume/mail/consumer ownership. No detached resume/rotation in this slice. Existing explicit resume must honor active/unknown ownership and require terminal prior generation plus fresh grant/posture validation. No revoked grant replay. Use existing mail machinery; hooks cannot arm a pre-acceptance attempt merely because a registry row/thread exists. Require accepted matching generation, exact corroborated worker thread and handle before arming. Unsupported direct-exec delivery remains pending/unsupported or failed, never an automatic queue --resume/daemon/new worker. Ending generation cannot retire successor wake state. Ambiguous submission requires existing explicit recovery, never duplicate delivery.

    BUG-2398's amended reviewer contract remains binding: absent-grant recording may produce a nonauthoritative artifact; invalid presented grants refuse recording. Actual ungranted artifacts cannot satisfy collection, dispatch review-skip/approval success including --no-ship, authoritative reviewed/resolved classification, ship or hold release. Preserve protective refusal records and prove a legitimate independent granted reviewer succeeds through durable authority validation. Labels or restored env are not authority.

    8. Evidence/rollout. Approve sketch sections 6-7's file/symbol inventory and deterministic test matrix, with strict authorship-write failure, stale-start replacement, generation-CAS cleanup, shim exec/spawn mapping, pre-acceptance hook arming and fresh-scan recovery cases added explicitly. Cover both parent-exit sides of transfer, transfer-before-Drop, lost acknowledgement/receipt, killed bootstrap, bind/lease/ledger/registry/handle failures, concurrent cross-route admission, adopted resources, successor cleanup, native posture and real own-seat core-policy behavior. Use hermetic BUG-2381 roots; no live sibling-main discovery. Keep unchanged STORY-1917 binding guard and all TASK-1169/BUG-050 guardrails, plus the named grant/posture/receipt regressions.

    BUG-2398 finalizer/consumer fixes and BUG-2382 liveness must be integrated and evidenced before the new lane is enabled/completed. Narrow supervisor types may remain local now; do not extract a purported vendor-neutral confinement framework ahead of STORY-2238. All proposed slices remain under this story until every AC passes. Future local gate: one targeted story_2254 test selection plus make check-ci-fast, named unchanged guards included in CI selection; long Cargo in background with AIDA_CARGO_TIMEOUT, no slot bypass/full-workspace local demand. Nothing was run here.

    Actual unknowns / completion gates (not architectural waivers):
    - Installed native workspace tool-shell own-grant/key/subject/companion and authorized-review evidence has not been reproduced by this review. The sketch's app-server socket-directory mode failure remains exact unresolved fixture evidence. Separate host present-empty/keyctl reports do not make that fixture pass; repair only disposable fixture layout or return the grounded incompatibility.
    - The shim source offers execve, but this review did not run a worker to prove actual native PID/start/death-signal behavior or a future namespace mapping.
    - CLI help and existing queue code do not prove queue-to-running-direct-exec delivery. Keep the truthful unsupported branch until positively evidenced; guaranteed wake would need a separately signed persistent-session strategy.
    - No new crash/authority tests or real model-driven implementer/reviewer turn have passed by virtue of this signoff. Real model acceptance remains separately authorized/operator-run.

    AC disposition: AC1 approved design only, conditioned on scoped own-grant/lease implementer AND reviewer, actual worker ps identity and retained unknowns; AC2 sanctioned gate only and unchanged binding guard; AC3 every headless path uses unchanged helper/guards; AC4 TASK-2631 truthful trusted/inherited posture without broadening; AC5 recovered code inspected and useful patterns retained only after replacing unsafe mechanics.

    Different independent strict reviewer must verify implementation against the whole amended contract; operator merge floor remains. Deviations require a fresh ruling. Finish this advisor pass after recording/verifying this decision.
