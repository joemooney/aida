    STORY-2254 — detached Codex launch lifecycle sketch
    Proposal only; author: Codex advisor, 2026-11-01. No code, cargo, PR, dispatch, disposition, grant issuance, or model-backed nested call was performed. Another independent advisor must sign this complete sketch before implementation. BUG-2398's signoff does not sign this story.

    Evidence and retained acceptance
    Read STORY-2254 in full (the current show response contained no comments), BUG-2382 including its all-processes-in-worktree amendment, BUG-2398 in full through the final adopted B1-B4, STORY-2238 and its wrapper sketch, root AGENTS.md and the three advisor discipline files. Source baseline: ac1e318069f96c3f7e35be7ee0408f2ff4f5f284. Read recovered 2bb95a7:agent_codex_background.rs and its agent_launch integration. These are reference material, not code to restore wholesale.

    Retain every STORY-2254 AC:
    AC1: detached implementer AND reviewer, own child grant and lease, actual worker live in aida ps.
    AC2: grant binding only within role_lifecycle.rs / gate/seat_authority.rs; unchanged STORY-1917 guard.
    AC3: every headless launch uses headless_wait_envs; unchanged TASK-1169 / BUG-050 guards.
    AC4: trusted configured and inherited posture, truthful native/AIDA distinction; no silent downgrade.
    AC5: use the recovered implementation as the starting reference while replacing its unsafe authority and lifetime mechanics.

    The recovered validate/configure_args/configure_command/accept_child and tests offer useful fresh-prompt validation, direct exec --json, setsid, null stdin and private log patterns. Its direct bind call in agent_launch violates AC2; its AIDA_HEADLESS chain omits headless_wait_envs; dropping the Child after acceptance provides no durable reaper; and existing foreground on_spawn disarms setup before detached acceptance. Those mechanics must not be copied.

    1. Owner, trigger, and command scope
    Owner: agent_launch's Codex agent-new orchestration, with an AIDA-owned long-lived detached supervisor. Trigger: a real "aida agent new codex --role implementer|reviewer --bg <SPEC>" invocation after existing role, scope, ownership and trusted-posture preflights. One short-lived dispatcher creates one supervisor, which parents one actual Codex worker. Never use the shared Codex app-server daemon as the worker owner. This is a fresh prompted direct "codex ... exec --json -- <prompt>" lane, not a TUI detached with nohup.

    Support the spec's positional SPEC form as well as --spec, with existing conflict handling; verify parsing instead of assuming that form already exists. Require a resolvable backing spec, or a review scope that resolves through the existing reviewer machinery to its backing spec. Review lease coexistence/independence rules remain in force. No reviewer gets an implementer's source lease or approval authority from a trace ID.

    Initially reject --bg with rotation, direct resume/latest, --no-prompt, incompatible TUI/remote/daemon options, and detached-only nonsensical terminal attachment options, before allocations/logs/probes. --show-context, --show-prompt and --no-exec remain pure previews: no session/lease, status changes, handle, grant, logs, service or executable version/preflight probe. --no-mail-wake remains available. Preserve the existing no-inline-grant policy for --bg: require an existing delegating parent; do not prompt or mint an inline human grant. A requested granted implementer does not silently become a BUG-2139 baseline child.

    Scope duplicates are a correctness gate: two active driver workers on the same normalized project/role/spec scope are refused, including an accepted-but-unreported or uncertain launch. --force/--no-duplicate-check cannot override this new detached ownership gate. Companion behavior, where current role policy supports it, remains read/converse/draft and never becomes a second driver; reject unsupported companion/spec combinations explicitly. Other roles and background rotation/resume need a subsequent signed extension, not implicit enablement.

    2. Shared launch plan, authority, posture and finalization
    Reuse preflight_agent_launch_lease, preflight_agent_new_delegation, scope_preflight_before_consent, prepare_agent_launch_attempt/SessionStartReceipt, assert_no_worktree_tangle, role-instance resolution, prompt/context generation and presentation scrubbing. Do not bypass atomic worktree publication or create a competing worktree builder.

    Resolve TASK-2631's trusted default-branch posture before setup. An inherited AIDA_CONTAINED request is sticky even when an argument says contained=false. Native opts into workspace-write and approvals=never and is reported exactly as "native sandbox, not AIDA-contained"; AIDA_CONTAINED is absent in native. An already AIDA-contained parent must not escape that outer boundary or relabel native as equivalent. Carry its boundary or refuse the unsupported composition. Missing/invalid vendor policy and bypass/--yolo/raw permission overrides that weaken requested/inherited posture refuse before model work. This story does not implement STORY-2238's wrapper, writable-root exceptions or network contract. When that independently signed backend exists, consume its applied-boundary receipt and supervisor seam; until then an AIDA-required unavailable composition refuses. Explicit existing none posture, where policy permits it, must be reported as none rather than silently selected.

    The dispatcher issues exactly one own worker grant via issue_launch_child for the routed role and plan.name subject. No broadening, parent selector substitution, new keyring resolver, pointer or keyring layout. Keep delegable seats empty, parent expiry bound, subject/project/roster/revocation/key/ancestry validation and existing keyring quota refusals. Native sandbox usability needs actual inherited-key/seat evidence, even though native is not is_contained_launch: do not let that boolean incorrectly authorize a proc-only grant across hidden ancestry. If a required seat cannot be presented under the selected posture, refuse, without changing posture. Child binding after spawn uses only the sanctioned lifecycle gate in section 3.

    Build explicit worker env from its own plan: subject AIDA_USER=plan.name, role, driver|companion marker, agent name/type, project, scope, lease identity, context path, posture, own grant, headless/lane marker and freshly probed harness version (failed version probe clears inherited version). Scrub inherited native session IDs, handles, parent registry/context identity and parent grant before applying own child identity. Apply headless_wait_envs(ceiling_key, &ceiling_value) together with AIDA_HEADLESS=1 on EVERY new headless Command chain, including supervisor/bootstrap and preflight children designated headless. Use bg_wait_ceiling_env(Some(&plan.project_root)) and the existing headless_wait_envs helper; no hard-coded zero or operator-dependent ceiling. The existing 12-line source guard stays unchanged. Retain lane-marker/background-work/linger behavior; do not launch detached builds behind the supervisor's accounting.

    Consume BUG-2398 final B1-B4, not its superseded pointer proposal. Exactly once at each actual Codex spawn/exec boundary, AFTER all child env, own grant, customize, headless and posture assignments, call the shared apply_codex_tool_env (proposed/equivalent finalizer). Read Command::get_envs explicit entries only, never std::env fallback. A requested seat with absent/empty/invalid own grant refuses. Intentional baseline elsewhere stays explicit-empty and cannot pick up the parent. Insert TOML-serialized -c pairs into Codex's own argv prefix before exec/prompt; under a future wrapper they go after the pinned Codex executable token, never before bwrap. Reject NUL/newline, invalid driver|companion and unsupported filters. Use structured wrapper/inner argv identity rather than searching arbitrary prompt strings for "codex".

    Exact metadata set remains BUG-2398's:
    AIDA_SESSION_GRANT, AIDA_SESSION_ROLE, AIDA_USER, AIDA_AGENT_NAME, AIDA_AGENT_TYPE, AIDA_SESSION_ID, AIDA_SESSION_SCOPE, AIDA_PROJECT_ROOT, AIDA_AGENT_CONTEXT_FILE, AIDA_CONTAINMENT_POSTURE, AIDA_HEADLESS, AIDA_ROLE_INSTANCE.
    Preserve other explicit user set entries and restrictive inherit=core. Removed/non-explicit stays absent; intentional empty stays present-empty. Never emit AIDA_HANDLE_LAUNCH_TOKEN, AIDA_AGENT_REGISTRY_TOKEN, AIDA_SESSION_GRANT_FILE, AIDA_CONTAINED, arbitrary parent variables or token/secret/key/password-bearing names. No bearer tokens in toolenv/argv/config/log/context. Existing host-only startup token consumption, where needed, stays launcher/hook-owned; tool shells cannot bind/claim handle reservations or registry entries with these tokens. The grant ID is a public selector, not the key secret. ADR-66's separately discovered same-uid parent-selector/key replay residual remains; do not claim this adapter fixes it.

    3. Detached supervisor, actual worker registration, and parent-exit race
    Proposed agent_codex_background.rs owns DetachedLaunchPlan/DetachedSupervisor/LaunchReceipt, validation, private I/O, control protocol and direct worker supervision; it never mutates grants or invokes low-level binding. Add a narrow lifecycle entry in gate/seat_authority.rs, e.g. accept_detached_launch_child(issued_launch, owned_child_identity). role_lifecycle.rs is allowed by the existing guard but absent in this checkout; no new role module is needed solely for this story.

    The gate-owned launch capability is invocation-specific, non-cloneable in-process or transferred once over a private inherited control FD, not a project-readable bearer file. It identifies only the newly issued worker grant and expected role, subject, parent, scope and process lineage. The gate verifies the grant was issued for this attempt, its original issuer identity and allowed child/supervisor lineage, live worker PID+start identity, and current parent/roster/expiry/revocation before calling its internal bind_grant_to_pid. Refuse arbitrary IDs/PIDs, foreign/reused/dead processes, attempts to bind the parent or an adopted grant, and double acceptance. Do not evade STORY-1917 with renamed public token writers, DispatchGrantBindGuard or direct .binding mutation elsewhere. No new general-purpose "bind any discovered grant" API.

    Use a single-launch supervisor subprocess/re-exec, not raw fork of a multithreaded Rust process followed by allocation. setsid and any death-signal plumbing use minimal async-signal-safe hooks; authority work remains ordinary trusted Rust lifecycle code. The supervisor inherits the already installed worker key by fork/exec and receives the worker-only plan/control data, never a newly minted advisor seat. It needs no model-facing authority of its own.

    Spawn a small AIDA internal exec-barrier child, whose PID is preserved when it execs Codex. Before release this trusted bootstrap blocks on a private control channel and cannot execute model work. It has the final worker command/env and will exec the pinned vendor executable. The supervisor obtains pidfd when available plus required PID/start identity; register the worker PID, never dispatcher/supervisor/creator PID as a substitute. With a future PID namespace/wrapper, require the applied backend's corroborated host-worker mapping; a wrapper PID alone is not evidence of the real worker.

    Before release, all required bookkeeping is strict:
    - sanctioned gate binding of this child grant to this worker;
    - stamp_lease_child_grant_at and active_pid plus mandatory active_pid_start_time under with_lease_write_lock, with exact lease/attempt comparisons;
    - record_launched_worker/lease authorship with the same process identity;
    - register_spawned_agent with matching nonempty pid_start, role/spec/path/name and source;
    - retain handle reservation and launch context; establish launcher/hook-owned handle binding path, and reconcile an early hook only for that same PID/start;
    - persist supervisor PID/start, attempt/generation and owned log/context paths in a private versioned runtime receipt.

    Current stamp_lease_active_pid_at and register_spawned_agent tolerate missing start identity; wrap/extend them for this detached acceptance contract to refuse rather than accidentally accept a missing start. Registry currently stamps current_pid_namespace; record actual worker namespace identity when it differs, not the supervisor's namespace by assumption. Single-field read-modify-writes share the existing permanent lease-write lock; verify round-trip identities and do not clobber another generation.

    Ownership transfer precedes execution. Under the attempt/scope lock, journal Prepared -> SupervisorOwned with exact cleanup identities; parent rollback checks that owner at its destructive boundary. Only the confirmed owner can clean up. Dispatcher disarms its local SessionStartReceipt/handle/issued-grant rollback guard after the transfer is durable, then acknowledges. Supervisor cannot release the exec barrier until ownership transfer is confirmed. Crash after journal transfer but before parent's local disarm must not cause Drop to delete supervisor-owned setup. This requires a transferable cleanup receipt/ownership check in SessionStartReceipt, not merely passing today's FnOnce on_spawn.

    Parent disappears before transfer: supervisor closes the barrier, stops/reaps its owned bootstrap and reports abort; invocation-owned rollback is allowed only with proof no worker ran. Parent disappears after transfer: supervisor continues as owner, validates the durable transfer and releases only according to the committed protocol. A lost acknowledgement is recovered from the versioned owner record, not guessed from EOF. Hold one coherent lock order and do not hold namespace/lease locks while waiting for IPC, exec or a model. Worker EOF before release aborts; supervisor death closes the release channel and the waiting bootstrap exits. After release a parent-death mechanism tied to the supervisor (not the dispatcher), with immediate parent-identity recheck, prevents a knowingly orphaned direct worker; native descendant cleanup limits remain explicit.

    After release, observe vendor exec success/failure through a dedicated close-on-exec/error channel plus child status/identity, not EOF alone (killed bootstrap also closes FDs). The exec-barrier's PID becomes the registered Codex PID; accept only corroborated live vendor exec or a separately recorded already-terminal outcome. If the executable is a script/shim or wrapper, define and verify its process mapping; refuse an unprovable mapping. Spawn success is not vendor initialization or model completion.

    4. Receipts and rollback
    Use a versioned, bounded private receipt keyed by project/attempt, under a host-owned mode-0700 runtime directory with 0600 files and permanent lock sidecar. No grant secrets, registry/handle tokens, prompts or full env. Record only identifiers, resource identities, grant selector, phase, PID/start pairs, log path and terminal status. Safe checked reads/atomic replacement and compare-updates; corrupt/wrong-version/symlink/foreign-project/unreadable receipts are unknown, never permission to free scope or delete work. Runtime metadata is recovery evidence, not authority to mint/bind a grant. Copying a journal cannot supply the private live launch capability.

    Phases: Prepared (dispatcher owns setup); SupervisorOwned (handoff complete, worker still gated); Registered (binding/lease/registry match); AcceptedRunning (vendor exec observed); Exited(success/failure/signal); RefusedBeforeExecution; Unknown/RecoveryRequired. Exact names are proposed internal schema, not a new monitor-contract field unless separately reviewed.

    Provide a read-only internal receipt lookup surfaced through existing agent/session status output and a narrowly scoped explicit recovery action keyed by attempt (proposed CLI spelling must be settled by the signer). Recovery cannot widen grants, kill an unowned tree, or silently retry. CLI returns success only for confirmed detached acceptance, with attempt/worker identity, lease, truthful posture and log/status lookup. It says "accepted" rather than "completed". A worker may exit immediately after acceptance; durable terminal state supersedes the running snapshot. An early known exec/registration/preflight failure gives nonzero and precise cause, stops/reaps owned processes, revokes only the new child grant, and repairs only exact owned registry/lease/context records. If model execution may already have occurred, preserve worktree, branch, status/claim evidence and logs for ordinary recovery even when launch reporting failed.

    A timeout, malformed/lost receipt, acknowledgement loss, dispatcher crash after transfer or uncertain stop is UNKNOWN, not a failed spawn and not permission to retry. Retain the scope reservation and resources; report the attempt/log and explicit read-only inspection/recovery path. Reconcile the same attempt using PID/start, owner journal, lease and registry; do not create a second child. A successfully persisted acceptance followed by CLI output loss remains an accepted run. Recovery must never infer model success from exit 0, JSONL presence, a thread-created event or a queue receipt.

    Rollback continues BUG-2188/2168 semantics: fresh worktree publication atomic/no replacement; re-entry/adopted resource receipts own nothing; validate .git/backpointer/dev+inode/clone marker; compare-delete only newly created refs at expected SHA, exact lease/claim IDs and exact claim/status write; protect concurrent owner changes. If identity changed, subprocess remains live, execution is possible or ownership is uncertain, retain and name recovery. Never remove adopted worktrees/branches/grants, unrelated registry rows, or permanent lock sidecars. Do not serialize a loose path list and treat it as permission for recursive deletion.

    5. Duplicate scope, status, reaping, resume and mail ownership
    A project-common scope admission lock/reservation spans setup through ownership transfer/acceptance; active and pending attempts participate. Reuse existing coordination and handle namespace locks for their own records, with one documented lock order and no recursive lock acquisition. A new detached reservation is justified only to cover the check-then-spawn gap; it is not a second requirements/lease authority. Shared admission must be consulted by other launch/resume routes that can enter the SAME scope, or it does not solve the race. Human/unsupported paths that cannot establish safety refuse rather than ignore a pending launch.

    aida ps and recovery readers join the active worker PID/start and attempt. Dead dispatcher does not make the worker salvageable. BUG-2382 remains the shared liveness dependency: before salvage/reap/relaunch, check ALL processes with cwd within the worktree (not only vendor comm names or exact root cwd), registered worker/descendants and live/uncertain supervisor/attempt evidence. A live unrelated editor/build process prevents destructive salvage but does not itself prove granted Codex identity. Inaccessible /proc/foreign namespace/missing start evidence is unknown; retain and show "unbound agent in clone" or an uncertainty reason, never a salvage recipe.

    Supervisor owns wait/reap, bounded final-result linger and existing marked-background-work settlement. Persist actual exit code/signal distinctly from unknown wait outcome; compare-update registry ended/wake state and lane_liveness finish only for this generation. Revoke its child grant through the lifecycle API after owned work is stopped, before final lease removal. Normal exit keeps worktree/branch/artifacts and ordinary session policy; it does not queue-done, complete/reject a spec, publish or merge. Retain context until child termination, then clean only exact own context. Crash recovery may release ownership only after corroborating that worker, supervisor and relevant descendants are gone. A possible escaped native descendant means unknown/retained, not an assertion that process-group kill is exhaustive confinement.

    No automatic second generation on vendor failure, result JSON, mail or supervisor restart. --bg --resume/--rotate are initially rejected. Existing explicit resume must consult this active/unknown scope ownership, require prior execution ended and fresh grant/posture/identity validation, and never replay a revoked grant. Future background resume/rotation reuses the one supervisor/generation-CAS protocol and needs signed scope extension.

    Mail wake uses the existing registry lifecycle, not another worker launcher. Start Pending only after accepted registration; obtain the exact native thread from the actual worker's corroborated hook/event, never a stale inherited thread/--last. Launcher/hook consumes handle/registry proof; the toolenv contains no bearer. If no supported thread/handle mapping or no proven queue-to-running-direct-exec capability exists, report pending/unsupported or failure; do not pretend codex exec is daemon-managed. --no-mail-wake stays Off. A queue command must not use --resume, attach a daemon or resurrect a dead worker. Queue acceptance, an observed later turn, AIDA inbox read and acknowledgement remain separate evidence. Ambiguous queue receipts retain existing recovery-required behavior; no automatic duplicate submission. Ending/crashed worker retires only its matching row's wake and cannot retire a successor's.

