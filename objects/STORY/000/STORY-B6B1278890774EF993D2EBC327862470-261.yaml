title: One glossary source, published on the website, filled in incrementally (merge hold, mandate, grant, hub, …)
description: |
  ## Why
  AIDA has a lot of vocabulary (merge hold, mandate, grant, child grant, deputy, roster, brief, rework round, trailer, hub, pool, agreed ID…), and the product website has no glossary. Definitions live in three incomplete places:
  - `docs/cli/12-glossary.md`, generated by `aida docs glossary` from `aida-core/templates/.aida/discipline/{machinery-glossary,lifecycle-vocabulary}.md`. It has about 22 developer-facing machinery terms plus the lifecycle states. It has no entry for merge hold, mandate, deputy, roster, brief, operator-only, supervised, trailer or heft, and grant appears once.
  - `docs/aida/10-glossary.md`, generated from `type=term` specs. There are five TERM specs, but it renders only TERM-1.
  - Inline definitions on each explainer page (the air-gapped page TASK-HOME-277 and the authority page TASK-HOME-280), which will drift as pages multiply.

  Operator direction (2026-10-31): an ongoing, incremental effort. It must NOT block the explainer pages; they ship first and link terms here once entries exist.

  ## Acceptance (slice 1; later slices add terms incrementally)
  1. One source of definitions. Extend the template glossary files (or a single successor); fold the TERM specs in, or make the generator render all of them. Document which is canonical in the "How to add a term" section.
  2. Two outputs from that source: the existing CLI glossary, and a website page `docs/showcase/glossary.html` in the showcase style. Each entry has a stable anchor (`glossary.html#merge-hold`), is listed in `search-data.js`, and the page is linked from `library.html`.
  3. First batch of end-user definitions, in plain wording, at least: merge hold, review story, rework round, brief, mailbox, handoff, commit trailer, grant, child grant, roster, seat, role, mandate, deputy, operator-only, supervised spec, hub, ref, pool, block, root, agreed ID, local ID. Each entry is 1-3 sentences, says what the user sees or does, and links to the page that explains it in depth where one exists.
  4. The explainer pages link their first use of each defined term to its glossary anchor (done as each page ships or updates; not a blocker).
  5. Optional, later slice: a check that flags a term used in website prose with no glossary entry, reporting rather than failing at first.

  ## Out of scope
  Rewriting the developer-facing CLI glossary entries; new explainer pages.
