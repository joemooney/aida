    1. **kind:deviation, severity:minor.** Rust tests were not run locally. The sandbox kills background jobs and caps each call at 60s, so aida-cli-lib never finished compiling. The `aida docs glossary` entries in cli_help_snapshot.txt were edited by hand: about line, long help re-wrapped with a greedy wrap that reproduces the old text exactly, `--product`, and the JSON flag. CI is the first run of glossary_render_tests, help_surface_matches_golden_snapshot and context_budget. The discipline README gained 117 bytes. Every non-cargo gate passed locally.
    2. **kind:followup-suggestion, severity:minor.** Slice 2 work:
       - AC4: link the authority explainer (TASK-HOME-280) once it is in the repo, using `[term](../aida-core/templates/.aida/discipline/product-glossary.md#anchor)`.
       - AC5: a report-only term-coverage check.
       The STORY-2219 trailer completes this story on merge, so file both as new specs.
    3. **kind:design-choice, severity:cosmetic.**
       - In docs/cli/12-glossary.md, the product Role, Seat and "How to add a term" headings now take mdBook's bare anchors ahead of the machinery glossary's, so machinery `[role](#role)` links land on the product entry. The website is unaffected.
