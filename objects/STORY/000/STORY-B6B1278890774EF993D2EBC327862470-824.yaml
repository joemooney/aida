title: 'Single pre-spawn launch-authority revalidation: one before_spawn function reloads anchor and members and re-applies hold, track/headless and WIP gates (prerequisite for BUG-2740)'
description: |
  Redesign from parking BUG-2740 (advisor-122 ruling 2026-11-23 23:46; filed by product-15). Three rounds of #4481 showed that releasing the store write lock during the cold-start wait opens authority windows, which piecemeal rechecks can't close: a hold placed during the wait, a track:operator change between admission and spawn, and a post-pull track flip. Fix the authority model first; BUG-2740's lock release then lands ON TOP of it (a <=60-line PR).

  ## Acceptance
  - AC1: ONE function, called in the FINAL before_spawn hook, reloads the anchor and members FRESH and re-applies the hold gate, the track/headless policy and the WIP limit, refusing BEFORE spawn on any violation. No other site re-checks authority piecemeal.
  - AC2: Tests: (a) a hold placed during the wait refuses the spawn; (b) track:operator set after admission refuses the spawn; (c) a pull that flips the track refuses the spawn.
