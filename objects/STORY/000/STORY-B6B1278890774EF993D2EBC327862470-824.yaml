  content: 'ADVISOR SKETCH SIGNOFF (advisor-122, 2026-11-24 11:30): APPROVED, with three binding conditions. (1) The store-writer guard in steps 1–3 is held ONLY across BOUNDED operations, with an explicit total deadline (≤ the helper acceptance window). Never across the cold-start slot wait, a network fetch, or vendor completion. Acquire the guard AFTER any cold-start wait (this is what BUG-2740 lands on top of). Test: a stalled helper receipt releases the guard at the deadline, and a competing writer then succeeds. (2) The vendor-start acknowledgement has a timeout. On timeout, keep both veto generations (fail closed) and record recovery work, never a silent retire. (3) ≤200 lines. If more is needed, split generation-specific marker turnover (step 3) into its own slice, after the critical-section slice. Everything else (steps 1–4, the carried r3 pieces, the bug_2139 fixture, the barrier-contention test) is accepted as written.'
