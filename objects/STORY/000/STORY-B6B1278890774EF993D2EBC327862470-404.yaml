title: 'Pipeline stall alarm: mail the advisor when nothing is in flight and no PR can ship'
description: 'On 2026-11-04 main went 3h without a merge. All 9 open PRs were red or had request-changes, no implementer lanes ran, and the advisor''s waits only polled for ''ready to ship''. Nothing in AIDA flagged that the pipeline was idle and blocked. Acceptance: (1) a due job, or the oversight loop, detects for N minutes (default 30): in-flight implementers == 0 AND no PR is ship-ready AND (an open PR has request-changes or red CI OR the queue is non-empty); (2) it mails the advisor one actionable digest: each blocked PR with its blocker (verdict, failing tests, conflict, stale lease) and the command that unblocks it (queue rework / session end / release); (3) the alarm stays silent while any lane runs or a PR is ready.'
status: InProgress
priority: Medium
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-05T00:31:59.464117777Z
modified_at: 2026-11-05T01:41:02.789686278Z
req_type: Story
comments:
- id: 01a1a946-efb8-79d3-b78f-342e7e4872fe
  author: joe
  content: 'Operator direction 2026-11-04 18:15: don''t rely on agent memory. Detection must be mechanical and live in AIDA, and the response must be delivered INTO the stalled session through each vendor''s channel. Design: (a) a vendor-neutral stall detector, a due job or oversight-loop tick, using the checks the advisor prototyped in ~/.local/share/aida/ops/advisor-scripts/stall-check.sh: implementer lanes below cap, ship-ready PRs with no train running, no merge for >90m, stale leases, and rework lanes that exited with no commits on a still-red PR (send them back with the failing test names instead of accepting the exit). (b) delivery adapters: Claude, through a session-scheduled prompt (Claude Code cron/loop) or a hook-surfaced mailbox item; Codex and agy, through their session-message/resume channels (to be confirmed per CLI); fallback, aida mailbox plus the advisor handshake hook line. Escalate to the operator if the stall persists after N nudges.'
  created_at: 2026-11-05T01:16:00.824445668Z
  modified_at: 2026-11-05T01:16:00.824445668Z
  session_id: 5bf140f7-38b2-4a04-9e8c-ccf69b1258f8
- id: 01a1a94c-ecec-73c2-a507-d2535f359597
  author: joe
  content: 'Operator 2026-11-04 18:21: the mailbox is the durable fallback and must be reliable regardless. Evidence it isn''t today: the review watcher mailed the advisor at 12:37 that PR-3373 conflicts, and nothing happened until 17:47. A claude-implementer handshake sat unacked for ~6h. Durability isn''t the gap: mail is stored but only read when the recipient polls. Acceptance addition: (1) unread advisor mail older than N minutes is itself a stall signal, with the age shown on the hook line; (2) actionable mail (kind=request) is pushed through the same per-vendor delivery adapter, not left to polling; (3) mail tracks read vs acted, so ''read and ignored'' is visible.'
  created_at: 2026-11-05T01:22:33.324739612Z
  modified_at: 2026-11-05T01:22:33.324739612Z
  session_id: 5bf140f7-38b2-4a04-9e8c-ccf69b1258f8
- id: 01a1a94d-6d11-7dd3-bcfc-d14768ed6448
  author: joe
  content: 'Correction 2026-11-04 18:25: delivery already exists. Reuse it, don''t build new. (1) Receipts/ACK: the STORY-1843 B2c explicit post-flush ACK with a common-Git receipt anchor; `aida mailbox inbox` marks mail seen, and `aida mailbox latency` measures read latency. (2) Push delivery for Codex: TASK-2347 mail-wake. The `aida mailbox wake-service` systemd unit runs `wake-run`, which wakes an armed Codex thread when its inbox gets new mail (installed; codex-advisor-05 is armed). Gaps to close: (a) wake adapters for Claude and agy sessions, since mail-wake is Codex-only; (b) ''seen'' is not ''acted on'': a [request] can be seen and dropped (PR-3373''s 12:37 request); (c) the stall detector should post through the mailbox with kind=request, so wake delivers it and ACK/latency track it, rather than adding a parallel channel.'
  created_at: 2026-11-05T01:23:06.129353963Z
  modified_at: 2026-11-05T01:23:06.129353963Z
  session_id: 5bf140f7-38b2-4a04-9e8c-ccf69b1258f8
- id: 01a1a95d-dac5-7d22-b8ce-53f006370dc5
  author: joe
  content: 'Implementation sketch prepared at docs/plans/2026-11-04-story-2476-pipeline-stall-alarm.md. Needs master sign-off per AGENTS.md Sketch-First Protocol: expanded comments introduce action-receipt lifecycle/schema and non-Codex live wake, while ready-PR/under-cap alarms contradict the description silence rules. Proposed separate alarm kinds, existing Codex/mailbox reuse, explicit action dispositions, fail-closed unknown observations, and no automatic lease release/merge. Please confirm alarm policy and receipt contract, and whether unsupported Claude/agy exact-session wake blocks this story or should be split into dependencies.'
