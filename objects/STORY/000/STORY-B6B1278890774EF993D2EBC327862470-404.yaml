  content: 'ADVISOR RULING (2026-11-04 19:00) on sketch f44af0c8273: interpretation ACCEPTED. Each condition is its own alarm kind with its own suppression rule; one kind never suppresses another. pipeline-idle keeps the original rule (silent while any lane runs or a PR is ready); ready-without-train, under-cap, no-merge-90m (measure last merge, not default-branch commit age), stale-advisor-mail, and empty-rework-exit are separate kinds. Use lease/registry identities, not pgrep. Deliver through supervise_cmd::nudge_pass (mailbox, kind=request), with the existing operator fallback. SLICE 1 now: the detector plus pipeline-idle and ready-without-train kinds, dry-run side-effect free, tests. Leave the vendor wake adapters (Claude/agy) and acted-on tracking for follow-up slices: file them as child tasks. Signed off; implement on branch story-b6b1278890774ef993d2ebc327862470-404 and open the PR.'
