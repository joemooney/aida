  author: joe
  content: 'Correction 2026-11-04 18:25: delivery already exists. Reuse it, don''t build new. (1) Receipts/ACK: the STORY-1843 B2c explicit post-flush ACK with a common-Git receipt anchor; `aida mailbox inbox` marks mail seen, and `aida mailbox latency` measures read latency. (2) Push delivery for Codex: TASK-2347 mail-wake. The `aida mailbox wake-service` systemd unit runs `wake-run`, which wakes an armed Codex thread when its inbox gets new mail (installed; codex-advisor-05 is armed). Gaps to close: (a) wake adapters for Claude and agy sessions, since mail-wake is Codex-only; (b) ''seen'' is not ''acted on'': a [request] can be seen and dropped (PR-3373''s 12:37 request); (c) the stall detector should post through the mailbox with kind=request, so wake delivers it and ACK/latency track it, rather than adding a parallel channel.'
