  author: joe
  content: 'Operator direction 2026-11-04 18:15: don''t rely on agent memory. Detection must be mechanical and live in AIDA, and the response must be delivered INTO the stalled session through each vendor''s channel. Design: (a) a vendor-neutral stall detector, a due job or oversight-loop tick, using the checks the advisor prototyped in ~/.local/share/aida/ops/advisor-scripts/stall-check.sh: implementer lanes below cap, ship-ready PRs with no train running, no merge for >90m, stale leases, and rework lanes that exited with no commits on a still-red PR (send them back with the failing test names instead of accepting the exit). (b) delivery adapters: Claude, through a session-scheduled prompt (Claude Code cron/loop) or a hook-surfaced mailbox item; Codex and agy, through their session-message/resume channels (to be confirmed per CLI); fallback, aida mailbox plus the advisor handshake hook line. Escalate to the operator if the stall persists after N nudges.'
