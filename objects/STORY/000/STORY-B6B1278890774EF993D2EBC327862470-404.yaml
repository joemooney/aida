    Findings:
    1. CI cli-0 red, caused by this PR: bug_1502_format_json_audit::checked_in_audit_is_exhaustive_and_every_honoured_probe_parses panics at aida-cli/tests/bug_1502_format_json_audit.rs:493 because docs/cli-format-json-audit.md has no row for the new 'aida supervise stalls' leaf (rows exist only for supervise/nudge/redrive/watch at lines 276-279). Regenerate the audit with scripts/generate-format-json-audit.py; expect a 'COULD NOT VERIFY' row like supervise watch/redrive, and commit it.
    2. AC1 says 'for N minutes (default 30)', but pipeline_stall.rs:9 hard-codes THRESHOLD_MS = 30 min and exposes no config key or flag (SuperviseCommand::Stalls in supervise_cmd_args.rs only has --execute/--json). Make N configurable (e.g. a .aida/config.toml key or --threshold-mins defaulting to 30, validated so it cannot fall below the 15-minute gap reset), add a test at a non-default N, and update the 'Each alarm requires 30 minutes' sentence in docs/cli/06-roles-sessions.md.
    3. The stall detector can now crash the existing watch loop. In supervise_cmd.rs run_watch_pass (~line 516), pipeline_stall::run(...)? propagates create_dir_all/lock-open/write_atomic errors on .aida/pipeline-stalls.{lock,json}. That aborts the pass before emit_pass_output and exits handle_supervise_watch's --interval loop, so an alarm-state I/O failure kills the long-running oversight watch and its objective/redrive report. Degrade the alarm failure to a reported unknown or a stderr line instead of '?', and add a test where the state path is unwritable.
    4. (minor) Tests are not hermetic: run() and observe() in the unit tests preview_creates_nothing_and_busy_tick_does_not_observe_or_send and unreadable_registry_and_foreign_identity_are_unknown reach queue_waiting(), which reads the real $HOME/.aida/queue/implementer.yaml via crate::home_dir() (pipeline_stall.rs:368-374). Inject the home/queue path or isolate HOME in those tests.
    5. (minor, consider) lane_role (pipeline_stall.rs:238) counts every non-advisor/product lease as a running lane, including role-less and integrator leases. Any live, idle interactive seat whose process identity is alive therefore suppresses pipeline-idle indefinitely, which is the 3h incident shape where no implementer lanes actually ran. Consider restricting the suppressor to implementer/reviewer lanes (plus the train), or document why other roles count, and test a role-less lease.
