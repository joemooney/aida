title: 'Review policy distinguishes evidence types per criterion: behavioral test, configuration validation, documentation inspection'
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. A reviewer requested automated coverage for a documented Python prerequisite and for CI routing on a small prototype, because the policy requires automated coverage for every criterion. Let each acceptance criterion declare its evidence type (behavioral test, configuration validation, documentation or manual inspection) and have the reviewer verify that evidence type rather than demanding a test for every criterion. Behavioral criteria still require tests. Relates to risk-scaled review.
