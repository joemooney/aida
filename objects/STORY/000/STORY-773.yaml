title: Split aida-cli-lib into multiple crates to actually cut build time (the pub(crate)-web-gated lever)
description: The ACTUAL build-time lever the crate-split scoping identified. A bin+one-lib split (STORY-772) does NOT cut compile time (~0-5%); real parallelism/cache-isolation needs the LIB carved into multiple independent crates (e.g. handler groups depending on aida-core) so rustc front-ends run in parallel across crates. Blocked today by the pub(crate) shared-helper web (crate::glyphs 500+ refs, crate::cli/session/forge) — every lib-internal crate boundary multiplies the visibility-widening cost. Depends on STORY-772 (needs aida-cli-lib to exist first). Much harder than STORY-772. Only worth it if aida-cli build/CI time becomes felt pain.
