title: 'CLI manual: drift-guard — completeness gate (every help-all command has a manual entry; flag stale entries)'
description: A script/test (CI-wired) that parses `aida help-all`, asserts every command has an entry in some docs/cli/*.md chapter, and flags any command whose `--help` output changed since its entry was last edited (a checksum or last-touched marker). Fails CI on a missing command (the manual cannot silently omit a command); WARNS on stale prose. This is what makes the manual maintainable rather than a one-time drift liability. On branch cli-manual.
