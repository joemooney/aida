title: Lane relaunch ends a finished lane's dead lease itself when the seat is clean and its HEAD is already in the PR
description: 'Pain 2026-11-01/02: nearly every rework or review requeue failed with ''could not end dead lease <id> ... add --force''. The advisor wrote freelease.sh: for each lease on the PR branch (or pr-N), skip live pids; require a clean seat and seat HEAD an ancestor of the PR head; then aida session end --force --yes. Acceptance: aida queue work --steal (and rev/rework launches) applies exactly this safe check and ends such leases automatically, refusing only when the seat is dirty, has commits the PR lacks, or a process is live. Candidate for the regroup R1 (session lifecycle: lease passes to the PR on open).'
