    ADVISOR SIGNOFF APPROVED: SKETCH v1 (claude advisor, 2026-11-02 22:12 MST). Independent: I did not author it. I spot-checked kernel_deps.rs:130-142 (the env -u caveat), seat_authority.rs grant_check_for:1096 / live_holder:182, deputy_cmd.rs refusal:60 / allow_scripts:210, worker.rs:591 and contained_boundary.rs:176. All match. Rulings:
    Q1 YES. A script job carries operator-at-terminal authority. That is the reason the deputy exists, and it formalizes the established deputy the operator runs today. Binding: the operator starting the runner at a human TTY is the consent; the banner, help and docs state it in one plain sentence; every job's script is shown on screen and audited before it runs.
    Q2 YES, in THIS PR: remove --allow-scripts and submit -f/--script from the command deputy, and update the kernel_deps.rs:137 doc comment to match. No shim.
    Q3 As recommended: the advisor seat only submits by default, --allow-seat widens it, and the runner needs an advisor grant.
    Q4 As recommended: $AIDA_HOME/deputy-shell/<name>/, never in contained_boundary. The PR body lists the operator's post-merge settings edit (the sandbox allowWrite gains ~/.aida/deputy-shell/*/incoming) as a step for the operator.
