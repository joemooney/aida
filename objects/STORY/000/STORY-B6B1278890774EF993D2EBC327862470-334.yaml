    1. CI red (lib-1, PR-caused): task_1750_liveness_primitive_guard_tests::production_code_has_no_raw_kill_zero_liveness_probe fails on aida-cli-lib/src/deputy_shell/runner.rs:1004 'libc::kill(-pid, 0)', added by the round-2 kill_group fix. It is a process-group probe, like exit_signal.rs. Add an ALLOWED row ('aida-cli-lib/src/deputy_shell/runner.rs', 'a process-GROUP probe (kill(-pgid, 0)), not single-pid liveness') in aida-cli-lib/src/tests/task_1750_liveness_primitive_guard_tests.rs, or route it through a shared group-probe helper. Build (ubuntu-latest) fails only as the downstream aggregate of this.
