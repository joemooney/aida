    3. Cosmetic: the standing-orders deputy link '../../../../../docs/deputies.md' resolves from the template master (aida-core/templates/.aida/discipline/standing-orders/advisor.md) but escapes the repo root from the generated mirror .aida/discipline/standing-orders/advisor.md, where it should be ../../../docs/deputies.md. It is also dead in installed projects. The test at tests.rs:1132 only checks the substring 'docs/deputies.md)'. Consider a repo-absolute or doc-site link.
