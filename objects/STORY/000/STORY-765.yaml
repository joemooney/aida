title: 'aida tui: per-row attention badges from per-spec actionable-event aggregation'
description: |-
  Badge cockpit rows with unseen actionable events, per spec — the substrate-native version of cmux's notification rings. Mechanism (per SPIKE-77 findings, docs/research/2026-07-07-spike-77-cmux-ux-signals-fleet-watch.md): tail .aida/events.jsonl with the existing offset pattern (event_wait.rs), group actionable events (PuntFiled, SpecShelved, AdvisorEscalated, UnreadMail, CiTerminal, PrMerged) by Event.spec, and render a badge glyph + count beside the existing RowLiveness glyph (redesign/liveness.rs seam).

  Explicitly NOT escape-sequence based: the default cockpit dispatches children with inherited stdio and never sees their bytes (dispatch.rs:81-95); the OSC/bell approach was evaluated and dropped in the spike.

  Acceptance:
  - A spec row with unseen actionable events shows a badge glyph + count next to its liveness glyph; rows without show nothing new.
  - Focusing/opening a row clears its badge; the seen-cursor persists across TUI restarts (new runtime file under .aida/, covered by the deny-by-default .gitignore convention — no new tracked path).
  - Badge state comes only from events.jsonl aggregation — no PTY/byte inspection, no polling subprocesses (in-process tail like the liveness probe, cheap TTL).
  - No change to the cockpit layout beyond the badge cell; bare TUI look unchanged when nothing is actionable (quiet-depth test).
  - Legacy (AIDA_TUI_REDESIGN=0) path unchanged.
