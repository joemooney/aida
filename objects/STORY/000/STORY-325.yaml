  content: 'Schema requirement 2026-05-18: punt records MUST carry `paused_at` and `resolved_at` timestamps (or `paused_at` + `wait_ms`). A punt record without ''when it paused / when it resolved'' is incomplete — and it''s the data source for the autonomy metric (TASK-340): Σ(resolved_at − paused_at) over escalate-to-human records = total human-wait time; count of those records = intervention count. Fold the timestamp fields into STORY-325''s record schema acceptance.'
