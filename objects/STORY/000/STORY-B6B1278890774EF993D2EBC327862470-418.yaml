- id: 01a1aa11-71d4-7613-acef-d219e83fd46a
  author: joe
  content: 'ADVISOR RULING (2026-11-04 22:02) on sketch 914dcbec540: RECOMMENDED OPTION APPROVED. A versioned, immutable review-publication receipt, issued by the host-side recorder/collector only after its ordinary local authority validation. The consuming node trusts the publisher''s validation for that exact publication and gains no remote role grant. Do not export or copy grant/receipt evidence. Trust enrollment: (1) the operator explicitly enrolls each publishing node in a store-held node roster (node id plus public key; reuse the STORY-2238 grant-keyring signing primitives, no new crypto); (2) receipts are signed by the node key and name PR, head SHA, canonical spec keys, decision, blocking finding origin IDs, reviewer actor and node; (3) a consumer accepts a receipt only when it is from an enrolled, unrevoked node, verifies, matches the PR''s current head, and the reviewer differs from the author across nodes; (4) revocation means removal from the roster; receipts from a revoked node are refused from then on, with no retroactive un-merge. Ordering uses (node, publication id), not the local seq. Implement on story-b6b1278890774ef993d2ebc327862470-418. Slice 1: roster, signing, receipt and consume-side check with the two-clone test. Watcher reservation sync is slice 2.'
