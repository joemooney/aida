title: 'Scheduled hygiene job: reap finished sessions, gc dead agents, reclaim idle build caches'
description: |-
  2026-11-03: aida ps had piled up about 51 stale, 9 orphaned and 28 salvageable rows. The disk reached 99% (11 GB free), which blocked every lane's cargo runs, and 305.7 GiB was reclaimable. Nothing runs session reap, agent gc or worktree reclaim on a schedule; they wait for an advisor sweep.

  Acceptance: (1) an hourly project-scope scheduled job runs 'aida session reap --yes' (finished + merged + exited only), 'aida agent gc', and 'aida worktree reclaim --apply' limited to caches idle more than 24h. (2) It never touches salvageable (uncommitted) trees, live leases or a foreign pidns. (3) Its summary routes to the advisor only when it hits something it must keep (for example retention not activated, or salvageable work older than 24h), naming the act needed. (4) The disk-headroom guard runs reclaim itself before routing to the advisor.
