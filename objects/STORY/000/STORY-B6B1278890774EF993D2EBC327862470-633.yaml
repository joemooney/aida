- id: 01a1c78e-2a53-73a1-a46f-b13a42390093
  author: joe
  content: 'ADVISOR RULING (2026-11-10 15:25 MST, operator-requested): resolve conflicts on ANY vendor via a HOST-STAGED merge; do NOT make the Codex seat''s .git writable (read-only .git is a containment boundary: a writable .git lets a lane plant hooks/config the host later executes). Design: (1) host (which can write .git) runs git fetch + git merge origin/main in the seat clone before launch, leaving conflict markers and MERGE_HEAD; regenerable files (exec-context ledger, template mirrors) are taken from main and regenerated by the host at this step; (2) the lane, Codex or Claude, edits only working-tree files to resolve the markers; the brief lists the conflicted paths since the lane cannot rely on writing git state; (3) the existing host publication path (aida ship --from-seat --commit-pending) refuses while any conflict marker remains in a listed path, then git add + commit, which completes the merge because MERGE_HEAD is set, and pushes. Acceptance amendment: AC1 ''on a vendor that can write .git (Claude)'' becomes ''on the project''s configured implementer vendor''; add AC6: a Codex lane resolves a staged conflict end-to-end with .git still mounted read-only (regression test with a fixture conflict); add AC7: publication refuses when a conflicted path still contains <<<<<<< / >>>>>>> markers. This also retires the ''merge-conflict reworks go to a Claude lane'' rule in FAQ-150 step 6 and BUG-2456''s Claude routing.'
