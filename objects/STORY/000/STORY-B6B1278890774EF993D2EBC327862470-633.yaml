  content: 'ADVISOR RULING (2026-11-10 18:50 MST) on the round-3 design fork: APPROVE the shared versioned repair journal as proposed in docs/plans/2026-11-10-story-2710-conflict-lane.md (state section). Reason: direct rework and the watcher must coordinate without direct queue-work depending on the watcher''s private state format. Contract: one journal file per repository under .aida/, schema ''version'' field, entries keyed (repository, PR, original head); holds the reservation (who dispatched, when, lane id), ambiguous-spawn retention (an entry whose spawn outcome is unknown blocks re-dispatch for that head until its lane is proven dead), the host-recorded original conflict paths, exact-tree validation evidence, and refusal-notice delivery state. Watcher state keeps only a reference. Writes go under the existing store writer lock (or a journal lock with the same discipline). P2 RULED: publication''s marker check and the lane brief both use the HOST-RECORDED original conflict path list retained in the journal across staging retries; the changed-tracked-path scan is not a substitute (keep it only as an extra guard if cheap). Proceed with the production slice on #3813; no further signoff needed for this state contract.'
