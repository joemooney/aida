title: 'Ask-at-the-prompt: every consequential interactive fork offers ? (deterministic context card) and a (one-shot AI judgment); guided-review agent shell'
description: |-
  Operator request (2026-09-02, live friction at the `aida human review BUG-814` y/N prompt): "an option like Ask AI on the command line that would have provided the help you just gave me. Or maybe enter into an interactive agent shell to guide me through the review process."

  Decomposition (advisor analysis, operator-discussed): most of the needed help is substrate-derivable; only the judgment layer needs AI. Two slices:

  SLICE 1 — `?` context card (no AI, ships first):
  Consequential interactive prompts (human review open-PR fork, session end confirmations, rework/re-drive forks, destructive confirms) accept `?` in addition to y/N. `?` prints a deterministic context card and re-asks:
  - What this prompt is deciding.
  - Provenance: how the current state arose (e.g. "branch bug-814: 1 commit, authored by session <id> which was killed mid-drain on 2026-09-01; no PR was opened") — from lease/registry history + git.
  - What each answer does, and whether it is reversible.
  - Recommended default + one-line reason.
  Implementation seam: a shared prompt helper (wrap dialoguer) so any prompt opts in by providing a ContextCard; card assembly reuses aida why / lease / git-linkage plumbing. Acceptance: the BUG-814 scenario prompt answers `?` with provenance naming the killed session and the reversibility of opening a PR.

  SLICE 2 — `a` = one-shot AI judgment + guided-review shell (AI, behind the execution-layer vendor adapter):
  - `a` at the same prompt bundles the slice-1 card + spec description/acceptance + diffstat into a one-shot headless vendor call ([agents] vendor: claude -p / codex exec) and prints the model's recommendation, then re-asks the original prompt. No vendor lock: same adapter the drain phases use.
  - `aida human review --guided` (or a `g` option): spawn an interactive advisor session pre-loaded with a review context snapshot (reuse the agent-new role-context snapshot machinery), the reviewer-side sibling of /aida-guided-implement (STORY-735).
  Non-TTY behavior: `?`/`a` are TTY-only affordances; headless flows never see them.

  Trojan-horse guard: `?` adds no new command surface — quiet depth at existing prompts. AI is opt-in escalation, never the default answer path.
