- id: 01a210a8-428a-7bf3-b2ac-c4d5d21e5e71
  author: dirtlab
  content: |-
    SKETCH (codex design lane): Deferred review findings

    1. Store one versioned review_findings collection in the canonical parent requirement object, keyed by finding ID and defaulting to empty for older objects. Each row carries parent UUID, forge/PR or MR, reviewed head SHA, path/line, area tags, severity, class, full text, provenance (source event, author, time, rationale), and status open/fixed/promoted/obsolete. Keep unknown metadata null. Derive IDs from parent UUID + immutable source receipt and finding ordinal so identical wording can occur twice and replay is harmless.

    2. Replace both draft and sweep creation in findings_gate.rs::emit_verdict_findings with an idempotent parent update under the store writer lock. Pair verdict findings with finding_dispositions by ordinal using the existing validated reader. Reviewer guidance should record a deferral in the verdict. Give advisors a findings defer operation against the same source row, recording their authenticated ruling and rationale instead of filing a LOW task. Only an accepted deferral writes open debt. Blocking or malformed evidence cannot be downgraded by this operation. Surface write failures and allow replay. Gate decisions continue to read their existing evidence.

    3. Extend aida findings list with --area <path-prefix|tag>, --spec and --pr. Default to open, grouped by area and parent, with distinct-ID totals for --count. Preserve existing triage inputs during rollout. aida list already enumerates requirement objects, so embedded findings add zero rows.

    4. Add aida findings promote-group <finding-id>... --title ... --acceptance ... . Under one store lock, resolve every ID, require open findings and nonblank criteria, create one Draft referencing all parents, mark each finding promoted with the new UUID, and retain its text. Retrying the same group returns the existing spec. Mixed or conflicting selections fail as a unit.

    5. Migration defaults to a dry-run manifest of open “Review follow-up:” drafts. Resolve parents from UUID relationships and corroborating origin tags. List conflicts, ambiguous parents and out-of-scope Approved tasks separately. Joe signs off on the exact manifest digest. Apply rechecks source fingerprints under lock, copies text and provenance keyed by legacy UUID, and archives each original with a backlink in the same update. Preserve its comments, history and incoming links; reruns skip verified conversions and report drift.

    6. Proposed changed-line ceilings including tests (paths under aida-cli-lib/src unless qualified): S1 ≤300, aida-core/src/models.rs, findings_gate.rs, findings_gate_args.rs, tests/story_1421_carry_forward_findings_tests.rs and reviewer/advisor workflow masters (strict: verdict-driven write selection and advisor authority; test blocking, malformed and replay). S2 ≤300, findings_gate_args.rs, findings_gate.rs, findings.rs and promotion tests (filters, counts, atomic group retry). S3 ≤300, findings_gate_args.rs, findings_gate.rs and new findings_migration.rs with manifest, drift and rerun tests. Advisor approval precedes implementation.
