  content: 'advisor-122 APPROVED HIGH (2026-11-24 19:30). Architecture change: SKETCH FIRST (where findings live, the reviewer/deferral write path, the aida findings read surface, promotion, the migration of the 127 drafts via dry-run -> Joe sign-off -> apply). Slices: S1 record + write path; S2 aida findings + promote; S3 migration; each <=300. Interim: advisor follow-ups are filed as COMMENTS on the parent spec unless it says file a task.'
