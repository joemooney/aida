title: aida agent new codex arms mail-wake for the spawned thread, and agent end retires it
description: |
  Operator ask 2026-10-29: every Codex agent started with `aida agent new codex` should watch AIDA mail without a hand install. Today scripts/codex-mail-wake.py (TASK-2347) needs an exact thread UUID and a manual install; agents started without it never see mail (the codex docs stack 3096-3103 stalled on unread rulings for 3h).

  Acceptance:
  1. `aida agent new codex` installs the mail-wake watcher bound to the new session's exact thread UUID once that thread exists (discover it from the spawned process / Codex session store, never --last or a guess); on failure it warns with the exact manual install command and the agent still starts.
  2. Ending or reaping the agent (agent end, registry reap of a dead pid) uninstalls that watcher through the adapter's ownership-checked uninstall; ledgers kept.
  3. Opt-out flag (--no-mail-wake) and a config default; Codex below the native `codex queue` version degrades to a warning.
  4. `aida agent list` / doctor show per-agent wake state.

  Needs a sketch + advisor signoff (touches agent lifecycle + user systemd units). Open questions for the sketch: thread-UUID discovery race; one unit per thread vs one multiplexed service.

  ## Advisor sketch signoff 2026-10-29 18:08 (implementer sketch comment 01a18a55 — APPROVED with these rulings)
  - Q1 → A1. `agent new codex` stamps `mail_wake = pending` on the launch row (honour `--no-mail-wake`, an agents.toml `[codex] mail_wake` default, and a codex < 0.164.0 version downgrade to a warning). The Codex SessionStart hook arms it on first thread binding, with a bounded timeout. On failure it prints the exact manual command and never blocks the session.
  - Q2 → B2. One multiplexed user unit per project (installed once, from the main checkout) iterates the armed registry rows. Each row keeps its own per-thread ledger with today's dedupe and recovery semantics. No per-agent systemd units, and no per-agent edits to tracked config.
  - Q3 → each agent's OWN inbox (its handle plus its routed role). Add a verified `aida mailbox wake-snapshot --recipient <handle>` whose audience is checked against the registry row, never env-asserted. The advisor-thread install keeps today's advisor-only path unchanged and explicit. The notification names the inbox it read. This also delivers TASK-HOME-119.
  - Q4 → Rust. The multiplexed watcher is an `aida mailbox wake-run --project <root>` subcommand (registered in its own module, clap types in *_args.rs, not the legacy Command enum), and the unit execs it. scripts/codex-mail-wake.py stays as the advisor-thread path. Do not extend it.
  - Retire: `agent end` and the dead-agent GC flip the row to `retired`. Ledgers are kept.
  - Visibility: `aida agent list` gets a `wake` column (armed / pending-thread / failed / off / unsupported), and the doctor check iterates armed rows.
  - Antigravity: the adapter returns Unsupported, plus one launch warning (operator ruling 17:03).

  ### Slices (each its own PR)
  - Slice 1 (this lane): verified `wake-snapshot --recipient <handle>` + `mailbox wake-run` over armed rows (rows armed manually via a hidden `aida agent wake arm <handle>` for now) + the unit/health-job install + tests. Closes TASK-HOME-119's acceptance.
  - Slice 2: the `agent new` pending stamp, SessionStart hook arming, retire on end/GC, the `agent list` wake column and the doctor iteration.
  LIGHT tier: targeted tests + make check-ci-fast. trace:STORY-HOME-096.

