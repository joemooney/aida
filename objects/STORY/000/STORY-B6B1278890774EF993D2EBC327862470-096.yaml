  content: |-
    ## Implementer finding (kind:deviation, severity:minor) — slice 1, commit 4131fc92be6

    Slice 1 ships the user unit (`aida mailbox wake-service install`) and writes each armed thread's `health.json` in the schema `codex_mail_health.rs` validates, but registers **no scheduler health job**. The job would run `doctor check codex-mail-wake`, which today reads only the advisor registration, so it would check nothing about armed rows; registering it also needs the tracked `.aida/config.toml` edit and its ownership checks. Slice 2 should make the doctor iterate armed rows' health.json, then register one project health job at `wake-service install`.

    (Could not file as a draft TASK: `aida add` refused in this sandbox with "requirement ID allocation failed: Read-only file system".)
