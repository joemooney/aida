    ## Implementer approach — slice 2 (ai:claude)

    ### Acceptance criteria as tests
    - **Unit (launch decision):** `story_home_096_launch_decision_*` proves codex+default → pending; `--no-mail-wake` or `[agents.codex] mail_wake = false` → off; codex < 0.164.0 → unsupported plus a warning; antigravity → unsupported plus one warning; claude → not requested.
