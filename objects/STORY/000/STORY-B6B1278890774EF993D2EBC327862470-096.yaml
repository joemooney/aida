  content: |
    Operator ruling 2026-10-29 for the sketch: keep this story Codex-only, but shape it as a per-vendor wake adapter (e.g. `install(handle, session_id)`, `uninstall`, `status`) chosen by agent vendor.
    - Codex: implemented here via scripts/codex-mail-wake.py and `codex queue`.
    - Antigravity (agy): no live-injection primitive known yet. The adapter reports "unsupported" and `aida agent new antigravity` warns once that mail arrives only on the next turn (the existing PreInvocation hook). It is never an error.
    - Thread-id discovery for agy is already solved (`conversationId` in the hook payload, recorded by the agent registry), so the adapter interface should take the id from the registry rather than vendor-specific discovery where possible.
    Follow-up spike for agy injection: see the agy wake spike filed alongside this note.
