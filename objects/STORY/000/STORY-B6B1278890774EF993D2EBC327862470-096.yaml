  1. CI lib-0/lib-1: two ratchets fail. orchestrator_leases::resolve_aida_exe_tests::no_cli_source_outside_the_resolver_uses_raw_current_executable_lookup (resolve_aida_exe_tests.rs:65): your new code calls current_exe directly, so route it through the aida-exe resolver. test_home::tests::no_direct_home_resolution_in_crate (test_home.rs:528): your new code resolves HOME directly, so use the crate's home helper.
