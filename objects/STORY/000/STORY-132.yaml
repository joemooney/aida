    Implemented via branch epic-26 (commit 35953cd3):

    - New aida-tui workspace crate: term (RAII guard + panic hook), pty (portable-pty host + vt100 mirror), tab (generic TabManager), statusbar, app (Focused/Command prefix-key state machine), config ([tui] prefix_key/max_tabs).
    - `aida tui [scope] [--no-recover]` subcommand, dispatched before storage init, gated behind a default-off `tui` feature; a stub errors when off.
