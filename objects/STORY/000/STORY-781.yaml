  content: 'PROCESS NOTE (2026-08-29): the ''open a PR; do not merge'' instruction was bypassed by accident. The TASK-1181 branch was cut while HEAD was still on story-781-project-manifest, so PR #1607''s squash carried this spec''s full diff onto main and the trailer auto-bumped it to Completed. Work was complete and CI-green (twice) at that point; PR #1606 closed as vestigial with its diff preserved for after-the-fact review. Lesson applied: always return to a fresh main before cutting a branch — parking a session on a feature branch turns the next branch cut into a smuggling run.'
