- id: 01a037a0-cb8f-7db3-affa-d204591d8d94
  author: joe
  content: |-
    DECISION: ship INDEPENDENTLY of STORY-780, not bundled. Four reasons.

    1. DIFFERENT MATURITY. STORY-780's own description says "ACCEPTANCE CRITERIA: deliberately not yet
       written", and it still has open design questions (exact flag spelling, whether remote creation
       routes through the EPIC-35 forge abstraction, which language scaffolders to delegate to).
       STORY-781 has seven concrete acceptance criteria. Coupling a specified thing to an unspecified
       one delays the specified one indefinitely.

    2. DIFFERENT SCOPE OF APPLICABILITY -- this is the decisive one. STORY-780 is about creating a NEW
       project from nothing. STORY-781 has to serve EVERY project that runs `aida init`, including the
       ones that already exist and re-run init or `--refresh`. If the manifest shipped only as part of
       bootstrap, no existing project would ever get one, and the downstream catalogue would see it on
       approximately zero repositories. The manifest belongs to `init` proper.

    3. THE DEPENDENCY IS ONE-WAY. STORY-780 orchestrates a sequence that ENDS in `aida init`. If init
       writes the manifest, 780 inherits it for free the day it ships. The reverse is not true. So this
       is closer to a prerequisite than a sibling.

    4. THE DOWNSTREAM CONSUMER IS BLOCKED ON THE SCHEMA, NOT ON BOOTSTRAP. aida-hub's reader needs the
       file format agreed. Holding that behind a bootstrap command nobody has specified yet is a bad
       trade for the one consumer that exists.

    The Related edge to STORY-780 stays. When 780 is implemented it should call the same
    `ensure_project_manifest_scaffold` rather than writing its own copy.
