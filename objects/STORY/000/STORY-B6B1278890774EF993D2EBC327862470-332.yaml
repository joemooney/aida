  author: joe
  content: 'ADVISOR RULING on the design fork (2026-11-02 22:15 MST): APPROVE the lean. (1) A derived, non-canonical cache under .aida/ keyed by (PR, head SHA, eligibility kind: ship-ready | unreviewed-push) records first_observed_at. Reset it on a head change or a known disqualification (hold armed, CI not green, verdict not approved at head, review started). (2) The age is labelled honestly as ''idle >= N min (since first observed)''. Where a cheap exact start exists, seed from it instead: for ship-ready, max(verdict recorded_at at head, CI completed_at at head) when the rollup carries it. (3) A plain ''aida awaiting'' (network allowed) refreshes the cache. --notice and the status line read it only, with no forge probe, and omit entries whose observation is older than 15 min (stale evidence is never shown). (4) No daemon and no new event producer. True transition age is out of scope. Threshold N from config, default 15 min. Reason: it delivers the delivery-contract signal now with no new canonical state; an over-estimate errs toward alerting.'
  created_at: 2026-11-03T05:08:25.460326051Z
  modified_at: 2026-11-03T05:08:25.460326051Z
  session_id: c58592f4-04ae-498b-9afd-87b0cc2bcde9
- id: 01a19fcf-07c7-7300-bcd7-ddfc7acc3e58
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: Read-time evidence cannot establish the requested idle minutes since eligibility first held. status_prs::parse_open_pr_snapshot retains only CI rollup and PR created_at, and review_marker::clear/MarkerGuard deletes review activity without preserving its end time. Two PR histories (review abandoned just now versus an hour ago) can therefore have identical current gate ledger/CI/lease inputs but require different idle ages. Also awaiting --notice and statusline/statusbar deliberately prohibit forge/network probes, so fresh PR eligibility cannot reach the banner without a derived snapshot or event producer. Decide whether first-observed eligibility plus a bounded-staleness cache is acceptable, or require persisted transition evidence and its producer/ownership. No implementation changes made.. No triage reason was given.'
  created_at: 2026-11-03T05:08:27.719445839Z
  modified_at: 2026-11-03T05:08:27.719445839Z
  session_id: c58592f4-04ae-498b-9afd-87b0cc2bcde9
