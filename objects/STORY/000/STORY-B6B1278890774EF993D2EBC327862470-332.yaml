attention_reason:
  category: design-fork
  detail: Read-time evidence cannot establish the requested idle minutes since eligibility first held. status_prs::parse_open_pr_snapshot retains only CI rollup and PR created_at, and review_marker::clear/MarkerGuard deletes review activity without preserving its end time. Two PR histories (review abandoned just now versus an hour ago) can therefore have identical current gate ledger/CI/lease inputs but require different idle ages. Also awaiting --notice and statusline/statusbar deliberately prohibit forge/network probes, so fresh PR eligibility cannot reach the banner without a derived snapshot or event producer. Decide whether first-observed eligibility plus a bounded-staleness cache is acceptable, or require persisted transition evidence and its producer/ownership. No implementation changes made.
  lean: Approve a derived head-bound eligibility observation cache, explicitly label age since first observed, clear/reset on known disqualification or head/state change, omit expired/unknown banner evidence, and let explicit awaiting refresh it without adding a daemon. If true transition age is mandatory, scope event producers and a sketch first.
  raised_by: implementer
  raised_at: 2026-11-03T05:06:02.696624122Z
