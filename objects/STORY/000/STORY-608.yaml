title: 'Glossary chapter: surface aida docs glossary (generated) as a book page'
description: 'The glossary already exists as aida docs glossary (machinery + lifecycle vocabulary, sourced from docs/aida/discipline/glossary.yaml + machinery-glossary.md). Surface it as a Glossary chapter in the AIDA Book — GENERATED, not hand-written (ADR-5 principle): a build step emits the markdown from aida docs glossary so it never drifts. Acceptance: a Glossary page renders in the book from the generated source; regenerating after a vocabulary edit changes the page; no hand-maintained term list. Consider also folding lifecycle-vocabulary terms (committed/pushed/merged/completed/released) since the CLI manual leans on them.'
