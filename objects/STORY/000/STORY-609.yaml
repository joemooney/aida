title: 'Split + beautify the lifecycle diagram: ~5 focused diagrams + a styling standard (hero SVG vs themed mermaid)'
description: 'The single lifecycle.md/.html state diagram is overloaded (operator: barely readable, too busy). Split into ~5 single-question diagrams: (1) happy path Draft→…→Released; (2) review/rework loop; (3) punt/escalation cascade implementer→advisor→human; (4) the three autonomy modes; (5) merge auto-bump + two-leg git. PLUS a styling decision: hand-crafted SVG (Excalidraw-style) for the 2-3 HERO diagrams (lifecycle, autonomy ladder) where polish matters; themed mermaid for the rest. Acceptance: each diagram answers one question and is readable at a glance; lifecycle.md embeds the split set; a documented standard for which gets hand-crafted vs mermaid; render clean in mdBook (note: mdBook needs a mermaid preprocessor OR pre-rendered SVG — pre-rendered SVG sidesteps the dependency and is more beautiful).'
