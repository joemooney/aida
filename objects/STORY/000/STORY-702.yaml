title: 'Who-must-act lens: pivot the board by owner (you / advisor / role)'
description: |-
  Who-must-act lens: re-group the cockpit by owner (you / advisor / role). GESTURE — EPIC-54 absorbs the toggle; EPIC-53 provides classification only.

  ## Acceptance
  - Reason::owner() covers the full owner set; a pure "you-plate" aggregation groups needs-approval + needs-answer + mail (unit-tested).
  - EPIC-53 ships the owner CLASSIFICATION + aggregation only. The lens/toggle GESTURE is NOT built here (it is an EPIC-54 action->target verb).

  ## Seam
  EPIC-53 = owner classification (Reason::owner already exists, extend to full set). EPIC-54 = the lens/toggle gesture. Do NOT build the toggle in EPIC-53. See docs/plans/2026-06-26-epic-53-cockpit-seam.md for the EPIC-53(content) vs EPIC-54(shell) boundary.
