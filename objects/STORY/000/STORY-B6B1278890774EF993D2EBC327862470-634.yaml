- id: 01a1cd53-7db3-7052-8c97-845fb47a800c
  author: dirtlab
  content: |
    Implementation investigation and proposed sketch (ai:codex).

    Manual architecture gate: AGENTS.md TASK-1596 explicitly keeps lifecycle cleanup outside scheduled/headless jobs; worktree_lifecycle_gc.rs authorize_apply independently refuses autonomous apply and seat-clone apply, with task_1222_budget_and_apply_authority regression coverage. CLAUDE.md requires a sketch on the owning spec and advisor signoff before architecture changes. STORY-2711 asks to change this boundary. Request advisor approval for the narrowly scoped host scheduled-guard exception below before implementing it. No publication declaration or code changes made.

    Already present: maintenance_schedule.rs allows the exact worktree gc --fail-on-findings command, maps it to worktree gc --json --fail-on-findings and excludes hook execution. The reported exit 127 may be an older deployed binary; verify host binary/version before changing the allow-list again.

    Proposed implementation:
    1. Register gc through a new gc_cmd/gc_cmd_args entry in command_registry, rather than the legacy Command enum. Default is a data-only plan from existing collector predicates for worktrees, sessions, mail, store and queue. Aggregate per-collector items, retained reasons, known byte estimates, and incomplete/error states; unavailable byte estimates remain unknown. No subprocess invocation of mailbox gc or store gc on the dry-run path: both currently mutate by default. Mail keeps the existing 30-day/read-evidence policy. Store GC only compacts Git objects and never squashes history.
    2. Share plan/apply internals with current collectors, preserving each collector's mutation authority checks and revalidating eligibility immediately before mutation. Umbrella --apply remains host-only and interactive under current policy. Report partial outcomes and nonzero failures without hiding successful collectors.
    3. If advisor approves: give only the host scheduled disk-headroom guard an explicit internal bounded eligibility-only lifecycle apply path; retain CLI/headless/seat refusal for general worktree gc --apply. Never expose a general bypass flag or infer new authority merely from an environment variable. Reap eligible dead sessions first, then rescan worktree eligibility with existing dirty/lease/lock/merged-or-closed/protected-checkout predicates and teardown checks. Budget the combined session/worktree/cache work below the scheduler child timeout, report deferred inventory, preserve unknown probes, and re-probe volume stats after cleanup. Keep existing floor report/reprobe routing so advisor escalation occurs only for persistent breaches or incomplete/failed cleanup. Report measured filesystem delta separately from estimated collector bytes to avoid double counting.
    4. Include operator comment requirement: report old non-v2 runner-cache target directories and threshold warnings, without deleting live target-v2 slot caches. Establish trusted runner-cache path/config and byte threshold as part of signoff; do not scan/prune arbitrary ambient paths.

    Targeted validation after approval: command registry/default no-mutation checks; retained dirty/leased/locked/unmerged/unknown worktrees; current-head revalidation before deletion; live/unknown-owner session preservation; unread and young mail preservation; per-collector failures and incomplete byte reports; default store dry-run does not run git gc; scheduled guard healthy/no-op, recovered/no-route, still-low/route, bounded partial scan; existing scheduler allow-list regression. Use aida lane job run for Rust tests.

    Environment observation: supplied reviewed codegraph client /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent; aida doctor check codegraph reports missing. Host must deploy the reviewed client and supply its absolute path. Investigation used rg/source reads only; no lane indexing attempted.
