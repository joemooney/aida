title: 'aida gc: one umbrella over worktree gc, session reap, mailbox gc, store gc and queue gc; disk guard applies eligible-only worktree GC below the floor'
description: 'Operator ask 2026-11-11. (1) ''aida gc'' runs every collector as a dry-run and prints one report (items, bytes, why kept); ''aida gc --apply'' applies only the set each collector already calls eligible (worktree: clean, no lease or lock, merged/closed head; sessions: dead and reapable; mail: read and past retention). Nothing dirty or leased is touched. (2) Scheduler: the worktree-lifecycle-gc job fails with exit 127 because ''worktree gc --fail-on-findings'' is not in the scheduler''s allowed command list; add it. (3) disk-headroom-guard: when free space is below the floor (default: volume 90% full), apply eligible-only worktree GC and session reap itself, then report what it freed; route to the advisor only if still below the floor. Evidence 2026-11-11: disk 95% full, 260 worktrees, gc dry-run eligible=45 reclaimable 3.7 GB, guard STUCK because reclaim alone frees 0 B. Also fixes mailbox inbox OverBudget, which the worktree count causes.'
