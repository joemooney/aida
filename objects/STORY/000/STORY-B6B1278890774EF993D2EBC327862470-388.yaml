title: 'Contained agy implementer lanes: a [contained.vendors] posture for Antigravity'
description: |
  Operator request (2026-11-04 08:38 MST): run agy (Antigravity) as an unattended contained implementer lane, so lane work can be spread across vendors as Claude tokens run short, and so vendors can be compared on quality (see BUG-2439, aida compete).

  Today `vendor_containment_posture` (aida-cli-lib/src/session.rs:3209) accepts only claude+"aida" and codex+"native". agy is refused under both values, so `aida queue work SPEC --vendor agy --no-human` with AIDA_OS_WRAP=1 fails: "the `agy` vendor cannot run a contained session". No `[contained.vendors]` setting can opt agy in.

  Design fork (needs a sketch and advisor signoff; it is a security boundary):
  (A) "aida" posture for agy: launch agy inside AIDA's own OS wrapper (bwrap and seccomp, the same boundary Claude uses), with an agy-specific settings and permission mapping.
  (B) "native" posture for agy: only if Antigravity ships a real sandbox, which TASK-2584 evaluated for Codex.
  The sketch must also cover agy auth and network hosts (the allowed_hosts additions) and agy's headless argv (BUG-1686).

  Acceptance:
  1. `[contained.vendors] agy = "<posture>"` in trusted origin/main config lets `aida queue work SPEC --role implementer --no-human --vendor agy` launch contained, and the posture is visible in `aida ps`/doctor.
  2. Without the opt-in, agy is still refused (fail closed). A regression test pins both the refusal and the accepted posture.
  3. A contained agy lane cannot write outside its worktree or reach hosts outside allowed_hosts (one negative test each).
  4. The refusal message stops telling agy users to "fix [contained.vendors]" until a value actually works; it names the supported vendors.
  5. One real agy lane completes a small spec end to end (PR opened), and the result is cited on this story.
