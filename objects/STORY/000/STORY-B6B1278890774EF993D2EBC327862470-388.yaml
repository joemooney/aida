- id: 01a1ad20-1446-7423-ad9d-e789fc657a04
  author: joe
  content: 'ADVISOR RULING 2026-11-05 12:20 MST (agy posture, amends the STORY-2460 S1 decision). Evidence: ~/aida-conformance-agy-PR3426b-20261105 (agy 1.5.1, harness at the #3426 head). agy''s own agy_tool_safety monitor rejects write_file as ''unsupported_tool'' in default mode BEFORE permissions.allow is consulted (cli.log: ''Monitor agy_tool_safety FINISHED: triggered=true, reason="unsupported_tool: write_file"''), and ''--mode auto is not available for this account''. agy''s native permission layer therefore cannot run a headless implementer on this account; no allow-rule shape fixes it. RULING: agy becomes an OUTER-ONLY vendor in STORY-2238''s vendor-neutral model. AIDA''s shared boundary (bwrap, netns relay, broker and grant keyring) is the sole containment authority. agy runs inside it with --dangerously-skip-permissions, and that flag is permitted ONLY when the launch carries an AIDA ContainmentReceipt (applied). Any other path refuses by name, and the existing refusal for agy without the AIDA boundary stays. The posture is data in vendors.toml (native_layer = "none"); no agy-specific containment code. This is the A2/M2 ''outer-only'' option, signed here for agy only: Claude stays M1 and Codex stays as ruled. CONSEQUENCE: TASK-3048''s remaining acceptance (agy launched in the selected posture) is BLOCKED BY TASK-2708 AC1 (the common contained wrapper for non-Codex vendors). After it lands, TASK-3048''s final slice adds the agy descriptor and argv and runs the harness through AIDA''s boundary; TASK-3049 follows.'
