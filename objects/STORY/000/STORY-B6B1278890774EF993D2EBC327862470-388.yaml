- id: 01a1a792-e60d-7a93-ad18-c282556f7b1a
  author: mcp
  content: |
    SKETCH v1 — STORY-2460 — Codex, 2026-11-04 10:20 MST
    trace:STORY-2460 | ai:codex

    Scope: latest ADVISOR DISPATCH is SKETCH ONLY. No production code/config changes, no PR, no completion claim. Checkout e422daaa1a43d53b3cd801f51edf709f1adec89b. This follows the operator ruling that AIDA owns containment policy/proof, while enforcement can be native or AIDA-managed.

    Decision proposed: choose (A), an AIDA-managed boundary, provisionally; do NOT enable agy="native" on current evidence. This is a conservative engineering recommendation, not a measured failure of AGY's native filesystem sandbox. The native experiment was blocked before executing its payload. Keep AGY launch refused until a runnable conformance experiment and signed implementation establish the selected boundary. The existing Claude os_wrap alone is insufficient: it shares the network and relies on Claude's native settings for terminal egress. Extending that wrapper to AGY without independent egress enforcement would not meet this story.

    1. Vendor-neutral conformance contract (proposed, not implemented)

    Freeze trusted origin/main policy SHA, actual vendor binary version/hash, argv, effective permission profile, workspace path and explicit writable exceptions. Isolate a disposable HOME/runtime and create a disposable linked Git worktree W plus independent host-owned fixture roots O (outside W and all allowed scratch/cache roots), G (actual resolved worktree/common Git administrative directories) and S (canonical store/control fixtures). Never probe production Git metadata or real store objects. Baseline hashes, directory entries and modes are recorded by the parent. Merely putting the outside target under /tmp is invalid: native Codex normally grants temporary roots.

    Use the real AIDA vendor launcher with the proposed contained posture; inject a fixed prompt directing the vendor to invoke a closed, immutable fixture runner. The runner accepts no arbitrary shell and attempts only the known sentinels/endpoints below. For native enforcement it must run THROUGH the vendor's actual terminal execution tool, not directly in the unsandboxed parent. Separately request equivalent writes through each enabled vendor file/edit tool; disabled tools must be attested disabled. A successful shell sandbox alone does not cover file tools, browser requests, MCP or delegated tools. Disable unneeded outbound/host-writing tools or place their executors inside the same boundary; otherwise no whole-lane pass.

    Exact minimum checks:
    C0 positive: create W/allowed-sentinel with a per-run nonce; parent verifies content. No C0 => unsupported/refused/unknown, never a pass.
    C1 negative: Python pathlib.Path(O/'outside-sentinel').write_text(nonce), then append to an existing O sentinel. Both must be denied and parent verifies unchanged bytes/entries. Repeat via W/escape symlink to O and via vendor file-write tools. O is verified writable by the parent control before launch.
    C2 negative: same create/append against G/probe-sentinel (both W/.git pointer and resolved administrative roots) and S/objects/probe-sentinel, and a rename-over attempt using only disposable sentinels. Parent verifies no changes. This defines denial of RAW authority-bearing Git/store writes; legitimate commit and AIDA spec operations need a mediated, scoped path and separate positive tests. Current store/caches are sometimes writable by design, so this is a policy choice requiring Q2, not an already-established invariant.
    C3 negative egress: with nonempty allowed_hosts=["allow.fixture.test"], run urllib.request.urlopen("https://deny.fixture.test:<port>/<nonce>", timeout=2) and direct socket.create_connection((DENY_IP, port), timeout=2), then a UDP sendto to the denied receiver. A controlled fixture DNS/proxy maps these reserved names to disposable receivers; use an already-established controlled fixture transport, not public DNS availability as the oracle. Parent receivers record nonces. Denied receiver sees no nonce, while the allowed HTTPS receiver must see the positive control nonce through the permitted route. Also attempt a redirect from allowed to denied, proxy-env bypass and an enabled vendor URL/browser tool. Missing DNS, unavailable servers or no allowed-positive receipt means unknown, not evidence of containment. Native profile must actually consume AIDA allowed_hosts; vendor defaults that deny ALL networking do not establish usable allow-list support.
    C4 lifecycle/control: zero opt-in, malformed setting, unsupported value, unavailable enforcement and unsafe injected flags all refuse BEFORE spawn/grant/lease mutation. A real supported launch reports its precise posture in ps/doctor. Descendants cannot retain the boundary after cleanup or obtain a host-capable MCP/socket bypass. Reuse the closed tracer's supervisor/IPC checks where applicable, but its synthetic success grants no real-vendor credit.

    Parent observation is authoritative: retain structured per-check attempted/allowed/denied/unknown, tool name, raw errno/tool error, positive controls, before/after hashes and receiver receipts. Exit 0, model prose, a permission prompt/refusal and an unexecuted payload never establish OS confinement. Same tests/policy for both vendors; no permissive fallback to earn a green result.

    2. Empirical AGY results FROM THIS LANE

    Installed /home/joe/.local/bin/agy is 1.4.12. `agy --help` exposes --sandbox as "Run in a sandbox with terminal restrictions enabled", --settings for session-only JSON, --print-timeout, --output-format stream-json and value-taking -p. This does not claim a network allow-list or all-tool write boundary.

    Artifacts: /tmp/story2460-pdqj_i8_/ (argv.json, retry-argv.json, prompt.txt, work/probe.py, stdout.jsonl, stderr.txt, retry-stdout.jsonl, retry-stderr.txt, parent-control.json, codex-native*.json). External disposable target: /home/joe/.aida/story2460-outside-00hraa1k. Local artifacts are transient; outcomes are preserved here. Fake .git/.aida-store probe directories were ordinary disposable directories, not an actual linked Git/store layout; they cannot establish C2.

    Payload: a single Python script attempts labeled pathlib writes to inside/outside/fake-Git/fake-store sentinels and urllib HTTPS to https://example.com/ with an 8-second deadline. Parent control could write all four sentinels; HTTPS failed DNS with Errno -2, so the network negative has NO valid positive control.

    Run 1: `agy --sandbox --mode auto --output-format stream-json --print-timeout 90s -p <fixed probe prompt>` (all flags before -p, per BUG-1686). Cleared inherited AIDA_* variables to avoid accidental lane lifecycle actions. Conversation a0d7722d-d013-4ddf-91a2-2ec38ad0db30: run_command was soft-denied in print mode because command permission required confirmation. Exit 0 / result SUCCESS / denied_actions=[command] / empty response. Payload did not run.

    Run 2: same command with session-only `--settings {"permissions":{"allow":["command(python3 /tmp/story2460-pdqj_i8_/work/probe.py)"]}}`. No bypass flag, no user settings edits. Conversation 80ae5463-0380-4f26-9d8b-e75388580679: run_command got past permission checking but failed with `failed to write agentapi script: open /home/joe/.gemini/antigravity-cli/bin/agentapi: read-only file system`. All sentinels remained absent after clearing parent controls. Exit again 0 / result SUCCESS despite TOOL_ERROR. Log says terminal sandbox enabled. Session persistence also encountered read-only ~/.gemini paths. These are outer-lane runtime-write restrictions, NOT observed AGY native denials of the test writes. Neither attempt bypassed the outer sandbox or modified auth settings. Each launch was bounded at 100 seconds and finished in under 25 seconds.

    Verdict: AGY sandbox activation and headless permission behavior observed; actual filesystem/egress restriction remains UNKNOWN. A host-side repeat with an approved private runtime/auth mapping is needed. No real AGY implementer PR was opened, so acceptance 5 remains open.

    3. Proposed AIDA fallback integration, subject to signoff

    Reuse shared filesystem/supervisor/egress primitives from STORY-2238 / TASK-2705/2706 and related lifecycle work; do not fork a new AGY-specific security engine or promote the closed synthetic tracer to an ordinary-agent launcher. Current containment module explicitly leaves ordinary_launch_supported=false. Required readiness includes real vendor lifecycle, IPC, credentials and grants.

    Keep trusted default-branch opt-in and missing-value refusal. Once implemented/reviewed/proven, accept agy="aida" and report applied boundary accurately; reject agy="native" until it independently earns proof. Replace the misleading AGY refusal's "fix [contained.vendors]" advice with currently supported Claude AIDA / explicitly opted-in Codex native choices.

    Compose AGY headless argv with every option preceding final `-p <prompt>`; preserve model/effort and validate runtime version. Session-local exact permission rules and sandbox mode need a positive execution proof; do not transplant the current agy_headless_args blanket --dangerously-skip-permissions into a claimed native boundary. Any approval bypass inside an AIDA outer wrapper requires explicit signoff and conformance of ALL tools.

    Provide a private writable AGY runtime for agentapi/session/cache state rather than rw-binding the user's whole ~/.gemini. Identify minimum credential/refresh inputs without reading or logging secrets, plus local daemon/socket dependencies. Capture hostnames from a scoped real startup (no request headers/tokens); the observed run reached daily-cloudcode-pa.googleapis.com for model calls. That observation is NOT a complete auth/network inventory and is not authority to allow *.googleapis.com. Test login refresh, model calls and runtime initialization with exact host rules, explicit local IPC policy, protected grants and teardown; unresolved needs refuse launch.

    4. Does existing Codex native pass?

    No demonstrated pass; it does not currently establish the complete proposed contract. Installed codex-cli 0.166.0. `codex sandbox` with legacy sandbox config required --permission-profile; retry with `-P :workspace -C <fixture>` refused before running with `app-server socket directory must be a user-owned directory with mode 0700`. No socket permissions or global config changed. Thus empirical filesystem results are UNKNOWN in this lane.

    Source evidence: session.rs vendor_containment_posture allows only claude/aida and codex/native; native child preflight returns without AIDA wrapper checks. config_cmd.rs write_codex_posture sets sandbox_workspace_write.network_access=true and writable_roots=[]; native argv injects workspace-write/never but does not translate allowed_hosts into Codex domain policy. Therefore its opt-in alone does not prove C3. It also does not prove raw store protection across all layout/allowed-root combinations. Existing native label correctly says "native sandbox, not AIDA-contained" and should remain distinct from earned conformance.

    Official reference: https://learn.chatgpt.com/docs/agent-approvals-security (read 2026-11-04): workspace-write normally protects .git and allows temporary roots; enabling command networking is distinct from proxy/domain enforcement. These documented capabilities do not replace same-version production-path tests. Do not revoke/change existing Codex policy during this sketch-only assignment.

    Questions for advisor signoff
    Q1. Approve provisional AIDA-wrapper direction with AGY still refused until real-vendor C0-C4 pass, or require a host-side native repeat before selecting A/B? The current evidence cannot resolve native capability conclusively.
    Q2. Approve RAW Git/store authority-write denial plus scoped mediated git/AIDA writes? Specify permitted store data/cache/scratch exceptions so the suite does not contradict AIDA's legitimate workflow or current writable-store model.
    Q3. Approve reuse/dependency on the shared boundary rather than a thin extension of Claude os_wrap? Define which enabled nonterminal/browser/MCP tools must be confined or disabled and the required credential/IPC boundary.
    Q4. Authorize an operator/host-run AGY experiment with private writable runtime and exact auth host inventory, plus same-version Codex profile test from a launch environment with valid private socket directory. No sandbox relaxation or copying credentials was performed here.
    Q5. Should existing Codex native remain a separately labeled compatibility exception until conformance passes, or should a follow-up policy change require conformance for all new native launches? Current network_access=true must not be interpreted as AIDA allowed_hosts enforcement.
    Q6. Approve implementation slices after signoff: conformance policy/harness, AGY adapter/private runtime+auth/egress, production launch diagnostics/refusal regression, then one bounded real spec through PR-open as acceptance 5. No slice alone completes this story.

    Next: aida punt STORY-2460 --category design-fork --reason 'sketch posted, awaiting advisor signoff'. Story acceptance remains incomplete; do not queue-done.
