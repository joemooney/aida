  author: joe
  content: 'OPERATOR INPUT + ADVISOR FRAMING (2026-11-04 08:43 MST). (1) Evidence for option B: ''agy --help'' lists ''--sandbox: Run in a sandbox with terminal restrictions enabled''. ''Terminal restrictions'' does not say whether the filesystem write root or the network is restricted, so the sketch must probe it empirically: can a write outside the worktree succeed, and can a host outside allowed_hosts be reached. (2) Strategic question raised by the operator: is AIDA''s own sandbox a strategic benefit? Advisor''s recommended direction, to be decided in this sketch or split out: AIDA owns the containment POLICY and its PROOF (the worktree write root, allowed_hosts, and a vendor-neutral conformance suite of negative tests), not necessarily the ENFORCEMENT. A vendor''s native sandbox earns the ''native'' posture by passing the conformance suite, and the AIDA wrapper stays the fallback for vendors that fail. This turns today''s hand-granted codex=''native'' exception into an earned, tested posture and caps per-vendor containment engineering. The cost evidence for keeping the wrapper minimal: BUG-2144, BUG-2151, the lane-job overlay/bwrap fixes, keyring errno 40, and STORY-2343''s AF_UNIX fork. Candidate for the post-zero regroup/rearchitecture review.'
