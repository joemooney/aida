    Per-check final results:
    AGY 1.4.12 --sandbox: C0 unknown, C1 unknown, C2 unknown, C3 unknown, C4 unknown. The exact terminal payload executed (verified completed-tool output) with explicit Cwd, but workspace C0 returned EROFS. Host HTTPS/TCP positive routes returned ECONNREFUSED inside the terminal environment; UDP send success produced no parent receipt. Separate native file-tool requests produced no observed writes. Unknown is not an OS-denial pass. Private writable runtime overlays existing runtime; credentials and operator settings mounted read-only, never copied or logged. Observed hostname only: daily-cloudcode-pa.googleapis.com (incomplete inventory, not allow-list authority).
    Codex 0.166.0 AIDA native preset with disposable TASK-2712 store/cache/mail/deputy grant equivalents: C0 pass, C1 terminal pass, C2 fail, C3 fail, C4 host-IPC fail. Parent observed raw store create/append/rename changes; Git metadata stayed unchanged. Allowed HTTPS succeeded and denied-host, redirect, proxy-bypass, TCP and UDP receivers saw nonces. A disposable host AF_UNIX canary received the nonce and exercised only its fixed outside-write capability. No real host socket, grant or production store object was probed. Codex defects filed as draft BUG-2446 (C2), BUG-2447 (C3), BUG-2448 (C4).

