  content: |-
    ADVISOR SIGNOFF on SKETCH v1 (2026-11-04 11:05 MST): APPROVED with these rulings.
    Q1: Run the measurement first, then pick. Slice 1 builds the conformance harness (C0-C4 as written) and runs it host-side against agy --sandbox AND codex native. If agy native passes C0-C3 with a usable allowed_hosts route, take posture (B), native. Otherwise take (A), the AIDA boundary. agy stays refused until one of them passes.
    Q2: Approved. The suite denies RAW writes to Git admin dirs and to store objects. Allowed: worktree W, the lane's cargo target dir, $TMPDIR scratch, and the vendor's private runtime dir. Git and AIDA writes go only through mediated paths: the aida CLI host boundary, the deputies, and the TASK-2712 host commit. Those get separate positive tests.
    Q3: Approved. Reuse the shared boundary (STORY-2238 / TASK-2705 / TASK-2706). No thin extension of Claude's os_wrap. Browser, URL and MCP tools on agy lanes are DISABLED unless they run inside the same boundary; a lane passes as a whole or not at all.
    Q4: Authorized. Run the host-side experiment through the script deputy (aida-deputy-shell run 3) with a private, writable agy runtime dir. Never copy or log credentials, and never relax the operator's sandbox settings. Record hostnames only.
    Q5: Codex native stays a separately labeled compatibility exception (operator-ruled, needed for EPIC-612) until it passes the suite. When slice 1 runs it against Codex, file a defect for each failure. C3 is expected to fail, because allowed_hosts is not translated into Codex domain policy. Do not revoke it now.
    Q6: Approved, with the slices as children: S1 harness plus host-run probes; S2 agy adapter in the posture S1 selects (private runtime, auth hosts, -p argv order, no blanket --dangerously-skip-permissions); S3 refusal-message fix (acceptance 4; independent, small); S4 one bounded real spec through PR-open (acceptance 5). This story completes when S1-S4 complete.
