    REVIEW FINDINGS TO ADDRESS (PR #3645):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 5b80f2744967
    Recorded: 2026-11-08T00:24:44.016584824+00:00
    Findings:
    1. 1 (normal) Store-writer inventory coverage regression: scripts/store-writers.toml drops the init_cmd.rs|maybe_scaffold_codex_hooks_on_init and maybe_scaffold_antigravity_hooks_on_init wrapper rows, yet init_cmd.rs:5100/5121 still reach hook fs writes. Cause: scripts/check-store-writers.py qualified() only propagates explicit-path calls, and the new chain runs through a re-export (scaffolding::codex_hooks re-exports vendors::hooks), a receiver method (profile(..).scaffold_hooks) and a bare install_standalone/install_named_entries call, so the wrappers no longer register and the TASK-3223 routing inventory loses the init entry points without any failure. Fix: make the chain visible to the scanner, e.g. scaffold_codex_hooks/scaffold_antigravity_hooks call self::install_standalone / self::install_named_entries by explicit path, and init_cmd calls the defining aida_core::vendors::hooks path (or keep the wrapper fns defined in scaffolding::codex_hooks). Regenerate and confirm init_cmd wrapper rows are present again.
    2. 2 (normal) Departure from the signed core/effectful split: the 2026-11-06 signoff and sketch (docs/plans/2026-11-06-story-2539-vendor-profile-sketch.md 'Proposed module shape') restrict aida-core/src/vendors/ to pure descriptors and put effectful adapters elsewhere. This PR moves fs::write/create_dir_all/set_permissions installers into aida-core/src/vendors/hooks.rs and adds an I/O method VendorProfile::scaffold_hooks (hooks.rs:444) on the descriptor type. Because vendors/ is exempt from the literal ratchet, the 8-key TSV reduction comes from relocating Codex/AGY-specific effectful code into the exempt directory, not from removing vendor branching. Either keep the installers in scaffolding (dispatched by the descriptor's HookBackend, which is pure data) or get an explicit advisor amendment on the spec before relocating effectful code into core vendors/.
    3. 3 (minor) The new guard diverges from the existing safe writer: the sketch (line 96) says the existing safe writers keep enforcing symlink rules, but refuse_hook_links (hooks.rs:462) is new hand-rolled policy. It returns PermissionDenied for the whole install even with force=false, when a symlinked existing handler or wiring file would only have been skipped (dest.exists() && !force). scaffolding/mod.rs symlink_target/symlink_blocking_write (BUG-718/BUG-1645) skip and warn per file with SYMLINK_SKIP_REMEDY. Scenario: a downstream repo that symlinks .codex/hooks/<one-handler> into its source of truth (the BUG-718 dogfood pattern) now gets no missing handlers or wiring on aida init, only a 'hook scaffold skipped' warning. Either reuse the BUG-718 helpers and their skip-and-warn semantics, or record the all-or-nothing refusal as a deliberate policy and add a non-force test that pins it.
    4. 4 (minor) Gaps in the safe-writer test story_2539_hook_writers_refuse_links_before_any_write (hooks.rs:558): every symlink points at an existing sentinel, so there is no dangling-symlink case. That case was the dangerous pre-PR write-through, because Path::exists() is false for a dangling link and the old writer followed it to create a file outside the root. The test also never checks the 'before any write' part of its name (that no handler dir, handler or wiring file was created under root after the refusal). Add both assertions.
    5. 5 (minor) The descriptor is not yet the single source of truth: handler_names (hooks.rs:55), antigravity_handler_names (hooks.rs:199) and codex_hooks_wired (hooks.rs:154) still hardcode '/.codex/hooks/' and '/.agents/hooks/' instead of deriving them from layout.handlers, and the two parsers are copies that differ only in that literal. HookLayout.events has no production consumer (tests only). init_cmd.rs:1863-1867 still switches per vendor (maybe_scaffold_codex_hooks_on_init / maybe_scaffold_antigravity_hooks_on_init) instead of iterating PROFILES by HookBackend, against the sketch's 'delete superseded switches as consumers move'. Parameterize one handler parser by HookLayout and route at least the init consumer through the profile.
