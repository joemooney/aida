title: aida init --minimal — the markdown-only first-run (specs/ folder + a runnable aida why demo, zero machine)
description: 'Goal move: delete meta-machine from first-run. aida init scaffolds the full machine (orphan branch, cache, MCP, 48 skills, roles, hooks). Add aida init --minimal: scaffold ONLY specs/EXAMPLE-1.md (a markdown spec) + example.py (code with a # trace:EXAMPLE-1 comment), then print the exact aida why example.py:2 command. No .aida, no orphan branch, no cache, no skills, no roles. Proves the 60-second magic needs no setup and gives a first-user the whole idea in one command. Short-circuits at the top of the Init dispatch before any heavy path. Child of STORY-754.'
