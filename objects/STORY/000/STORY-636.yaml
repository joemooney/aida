title: Same-host multi-clone test harness (scripts/multi-clone-harness.sh)
description: 'Executable harness for the EPIC-46 catalog (docs/testing/multi-user-test-cases.md). Creates a throwaway bare origin + 2+ clones on one host (isolated HOME so the real ~/.aida is untouched), parameterizes AIDA_USER/node id, runs named MU-### cases, asserts. Each case declares EXPECT=pass|known-gap so the gap cases (MU-504/505/506 cross-clone coordination) report GAP now and flip to pass once shared coordination lands — red-to-green driver for that work. v1 cases: MU-101, MU-103, MU-201, MU-202, MU-203, MU-301, MU-401, MU-402, MU-504, MU-505, MU-507. Must NOT run a real auto-complete drain on a real spec (test lock/lease mechanics structurally). Suite exits non-zero only when an EXPECT=pass case FAILS.'
