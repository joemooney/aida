title: 'Team dashboard slice A: aida-server /team + /coordination endpoints + ts-rs DTOs (Tier 3)'
description: Slice A of the team dashboard (design docs/plans/2026-06-17-team-dashboard.md). Add read-only REST endpoints GET /api/v2/team (roster from nodes.toml + roles from team.toml + active coordination claim per member) and GET /api/v2/coordination (active leases + drain + solo claims with holder/scope/age/stale). Prefer moving the pure read logic (roster+roles, coordination listing) into aida-core so aida-cli + aida-server share one source (avoids STORY-82-style drift); fallback = server reads the registry files directly. DTOs derive ts-rs TS, exported via aida-generate-types into shared/types.ts. Respect existing auth/CORS/X-Project. Absent team.toml/coordination = empty arrays, never error. Endpoint tests. No web changes (slice B).
