title: 'aida schema --explain: per-field semantics + object lifecycle (when/why/who/how), drift-guarded'
description: |-
  Operator ask (2026-06-15): `aida schema --all` is great, but it only prints each field name + reflected type. Add an opt-in explanatory mode that says, per field and per object, WHEN / WHY / WHO / HOW it is used, WITH an example value — turning schema into a self-documenting, paste-ready substrate reference instead of just a type list.

  ## Design constraint (load-bearing)
  The field LIST is reflection-derived from ts-rs-forge and drift-guarded (schema_enums_match_reflection) — that is the substrate-as-bouncer property and must be preserved. Per-field prose + example values + provenance are necessarily hand-curated. So: reflection owns the field set; a curated doc-map owns the prose/example/provenance; a NEW drift-guard test must assert the doc-map covers EXACTLY the reflected fields of each documented kind (fail on any undocumented field OR orphan entry). Without the guard, --explain rots on the first new field.

  ## What each documented field carries
  name | type (reflected) | example value | provenance | description.
  - example value: a concrete, realistic value (spec_id: TASK-837, status: in-progress, priority: high, tags: ["aida:schema","papercut"], created_at: 2026-06-15T09:30:00Z). Hand-curated, drift-guarded alongside the prose.
  - provenance: one or more tokens from the PINNED closed set below (a field with multiple write-paths — notably status — lists each).
  - description: 1-2 line gloss of when/why the field is used.

  ## PINNED provenance token set (closed; the WHO/WHEN of each field)
  Grounded in the real substrate write-paths. A field may carry more than one.
  - system       — auto-generated by the engine at write time; never user-settable. (id, created_at, modified_at, created_by, history, processing_record)
  - user         — set directly by a human or agent via add/edit/comment/relationship/tag commands. (title, description, tags, priority, owner, feature, relationships, comments, custom_fields, urls, attachments)
  - advisor-gated — writable only from the advisor/dispose seat (ADR-3): the approve/plan transitions, queue-for-work, and merge-gate id assignment. (status -> approved|planned, spec_id, agreed_id)
  - orchestrator — written by the queue-work / autonomous-drain lifecycle. (status -> in-progress|done, attention_reason, deferred-via-park, punt linkage)
  - merge-driven — written by the merge/pull pipeline, not by hand. (status -> completed auto-bump, implementation_info PR/commit/branch linkage)
  - ai           — populated by an AI evaluation/estimation pass. (ai_evaluation, weight when AI-estimated, meta-prompt outputs)
  NOTE: reflection-derived is NOT a provenance token — reflection owns the field LIST, not a value write-path. (Corrects an earlier draft slip.)
  The set is closed: adding a 7th token is a deliberate decision, not an ad-hoc add. The drift-guard validates every entry uses only these tokens.

  ## Object-level lifecycle (the second layer)
  Extend each catalog one-liner into a short block: who writes the YAML file, when, why it exists, how/where it is read back, when it is deleted/archived.

  ## Acceptance
  - `aida schema --explain` (alias: `--details`) adds the explanatory layer to the catalog view: each object gets its lifecycle block.
  - `aida schema <object> --explain` renders the field table with type + EXAMPLE VALUE + provenance + description per field.
  - `aida schema --all --explain` does both in one pass.
  - `aida schema --json` (with --explain) carries the per-field type+example+provenance+description and the object lifecycle as structured fields, so MCP/machine consumers get the same docs.
  - A drift-guard test asserts: every reflected field of each documented kind has a complete doc entry (type+example+description+>=1 provenance); every doc entry maps to a real reflected field (no orphans); every provenance token is from the pinned closed set above.
  - Non --explain output is byte-for-byte unchanged (pure opt-in).

  ## Slicing
  Slice 1 (first child): Requirement per-field prose+examples+provenance + all 10 object lifecycle blocks + the drift guard + flag plumbing + JSON. Slice 2 (follow-up child): per-field docs for the remaining 9 kinds (the guard lists exactly which fields still need docs, so it doubles as the worklist).

  ## Open forks for advisor/implementer
  - Flag name: --explain vs --details vs -v/--verbose. Recommend --explain with --details alias.
  - Should the bare `aida schema <object>` always include the example column once written, or keep examples behind --explain? Recommend behind --explain to keep the cheat-sheet view terse.
  (Provenance vocabulary is now PINNED above — no longer an open fork.)

  Verify flags with `aida schema --help` before coding.
