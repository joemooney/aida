  content: |
    STORY-2854 pre-code sketch for advisor review (not approved; no implementation).

    Evidence: docs/internal/testing/task-3072-claude-mail-wake.md records the 2026-11-05 investigation and its binding stop condition. That investigation found no documented external socket message payload or classifiable acceptance/hold/refusal response schema. It sent zero socket bytes. The STORY-2854 observation establishes that built-in SendMessage works, but does not establish the external wire format. I have not observed or verified new request/response bytes. Consequently I cannot truthfully specify an implementable wire format yet.

    Proposed ownership: one new cli-lib module, claude_mail_doorbell.rs, owns protocol encoding, framing/authentication, response decoding, version compatibility and bounded transport. Callers receive typed Accepted, Held, Refused, ProtocolUnavailable or TransportUnavailable results; a successful write alone never becomes Accepted. Before implementation, supply a version-pinned documented or explicitly authorized disposable-probe transcript defining exact request/response bytes, framing, authentication and accepted/held/refused examples. Unsupported versions, malformed/oversized/truncated replies and unknown response variants map to nudge: unavailable (protocol); never retry with guessed schemas. Receipt timeout is unavailable/unknown, never evidence of delivery.

    Delivery integration: commit canonical mailbox mail first, resolve/deduplicate live local Claude registry sessions using their host/process identity, then attempt bounded best-effort doorbells only for unread mail. Transport failures cannot roll back or duplicate canonical mail. Nudges contain canonical message IDs, sender, subject and the inbox command; never message-body instructions. Per-project mailbox settings default enabled with a five-minute nonurgent interval; urgent messages bypass that interval, respecting recipient hold/refusal. Persist per-recipient submission/receipt evidence and pending unread IDs under a locked project-local ledger; distinguish socket acceptance from mailbox acknowledgement. Doctor handshake/backlog readers report accepted as 'nudged, not yet read', otherwise 'no doorbell' with reason.

    Batching needs an explicit execution owner: later sends alone cannot guarantee eventual delivery of the last suppressed burst. Recommend a host-side scheduled bounded flush of pending unread IDs after the interval, using the same module and ledger. Inbox acknowledgement must remove pending IDs; recheck unread state before submission and serialize local flush/send attempts. Ambiguous submissions must not be reported as accepted or blindly retried. Advisor should approve the flush owner and retry semantics with the protocol sketch.

    Validation after approval: fake UDS exact bytes/one submission, accepted/held/refused/malformed/oversize/timeouts, missing socket, nonlocal recipient, concurrent sends, urgent bypass, burst flush, ack-before-flush, disabled configuration, and doctor evidence. Live behavior requires a separately authorized disposable probe; no live fleet message was sent.

    Blocking gate: the advisor comment dated 2026-11-16 07:21 UTC requires signoff before code. No such signoff exists. Please supply or authorize protocol evidence and approve a completed sketch. Additional environment issue: /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent; aida doctor check codegraph reports missing. The host must deploy the reviewed client and supply its absolute path.
