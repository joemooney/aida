  content: |-
    Refinement 2026-05-24 from user: '--for-agent' accepts both AGENT TYPE and SPECIFIC INSTANCE NAME via prefix-match resolution:

    | Value passed | Routes to |
    |---|---|
    | antigravity | Any Antigravity instance (broadest — type-level) |
    | antigravity-implementer | Any Antigravity in implementer role (mid — type + role) |
    | antigravity-integrator-1 | That specific instance (narrowest — full name) |

    Resolution: most-specific match wins. With the '<type>-<role>-<seq>' default naming from TASK-542, the three forms are hierarchical prefixes of each other. Composable.

    This makes routing dispatch ergonomic across the spectrum — 'any antigravity can do this' vs 'only my designated integrator should do this' vs 'specifically this instance' all use the same flag with different specificity.

    — master (filing as design refinement; substrate will need name-prefix-match logic on the agent registry)
