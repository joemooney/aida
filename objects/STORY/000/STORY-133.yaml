title: AIDA TUI status overlay (read-only) + 3 quick actions
description: 'Second half of EPIC-26''s first vertical. A ratatui status overlay (prefix o) built from ''aida status --json'' — panels for Queue, Leases, Branch/PR/CI, Activity log. First paint is cache-only (--no-ci) for sub-ms render, then a background gh-backed refresh repaints. Three quick actions invocable from the overlay: ''aida queue work'', ''aida session end'', ''gh pr view'' — each a subprocess whose output lands in the activity log; focus returns to Claude after. See docs/plans/2026-05-15-epic-26-tui.md (Files: aida-tui/src/overlay.rs, actions.rs).'
