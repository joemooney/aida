- id: 01a1c6ee-9b2c-7162-bd3e-17f4725fe581
  author: dirtlab
  content: |
    Architecture sketch for advisor signoff (STORY-2690; ai:codex)

    Observed boundaries: queue_cmd/rework.rs owns status transitions, recurrence escalation and queue insertion; queue_cmd/work.rs owns unified pickup checks; standalone_implementer.rs has Outcome::{PrOpened,Punted,Held,NoPr,NoChange} only after child execution; ship_from_seat.rs has QueueExitOutcome::{Continue,NoChange}, which describes publication rather than admission. BUG-2502 already fixes one review-shelf transition. A pre-spawn error currently cannot be represented by the post-child Outcome contract.

    Proposed contract:
    1. Rework routing must run shared pickability checks against the resulting live spec before reporting queued success. Preserve advisor escalation, reasoned deferrals, dependencies and human-only gates: an open PR does not bypass authority. If those gates block, refuse with a stable reason code and do not claim successful rework routing. Use the existing return_to_flight owner for status/tag cleanup, not a second status writer.
    2. Introduce one versioned host-owned lane result receipt spanning admission through publication. Closed variants: pushed (observed new published head), no-change-with-reason, refused-before-start, punted, held, failed-after-start. Include attempt identity, spec, branch, optional PR/head, stable reason code and whether a child actually spawned. Existing open PR presence alone never means pushed.
    3. Establish the attempt before admission; record refused-before-start on pre-spawn failures. Mark started only after actual spawn succeeds. Finalize all normal/error paths, including publication errors and signal exits, and preserve explicit punt/hold precedence. Keep process-crash recovery distinct from a claimed terminal result.
    4. Keep child and publication enums as internal stage outcomes; derive operator output, launcher exit classification and advisor notices from the final shared receipt. Never report a pre-start refusal as launched rework.
    5. Deduplicate refusal notices under a permanent shared lock using spec + branch/PR head + stable reason code + relevant routing/policy fingerprint. Retain every attempt receipt but emit only the first identical refusal notice; changed evidence permits a new notice. Do not deduplicate transient failure evidence indefinitely.

    Validation after approval: table-driven routing tests covering NeedsAttention plus parking tags, existing in-flight statuses, reasoned deferrals and authority blocks; injected spawn-failure tests asserting no launched result; publication tests distinguishing existing PR from new push; punt/hold and failed-child tests; concurrent identical-refusal tests proving one surfaced notice with distinct attempt receipts, plus head/reason changes permitting new notices.

    Decision requested: approve the shared durable receipt boundary and refusal deduplication identity/lifetime before implementation, per CLAUDE.md architecture-signoff rule. No source edits made and no tests run in this investigation.
