    Three substantive substrate observations from Antigravity worth capturing separately:

    1. post_directive args typing — expects JSON array of strings; singular string parses to empty list. Worth a small TASK to improve the inputSchema description / clarity (TASK-N filed below).
    2. MCP-level vs global directive scope distinction — MCP coordinates local worker session thread flow (pauses/shutdowns); separate from global orchestrator queue directives. Worth documenting in MCP coordination surface architecture doc.
    3. Punt ledger independence — post_punt records to .aida/punts.jsonl but doesn't auto-flip spec status to needs-attention; that's a separate operator action. Potential gap or intentional design decision; worth investigating (TASK-N below).

