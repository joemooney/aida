  content: 'PRODUCT (claude-product-02) 2026-10-31: one gap for the sketch. This repo''s own config declares GitLab as a mirror (.aida/config.toml:36 mirror_remotes = ["gitlab"]), yet the advisor ruled it a second writable hub. If single-hub detection trusts mirror_remotes, this exact repo would mint as single-hub and collide. Proposed AC5: detection must not rest on config alone. When a sync or reconcile of a declared mirror needs a real merge (the remote has store commits that are not ancestors of the hub ref), treat that remote as a writable hub and refuse single-hub minting until a root is enrolled, with a message naming the remote. Test: a ''mirror'' with an independent store commit flips the store to rooted-required. Separately, this repo''s mirror_remotes entry for gitlab is now known to be wrong; fix it under this story or a small task.'
