  content: |-
    ## Moved to backlog 2026-05-16 — premature

    User asked dialog to push back on over-engineering. The 6 candidate schedule templates (\`refresh-competitive-analysis 90d\`, \`audit-spec-graph 14d\`, etc.) were filed **without evidence that recurring fires are needed**. No cadence has been observed late; no friction surfaced from \"I forgot to do X.\" Pure speculation.

    **Revisit trigger**: when a specific recurring activity is observed to slip (e.g., competitive analysis goes 6 months stale, or a friend asks \"when did you last review X?\"), file the specific schedule then. Don't pre-build infrastructure for hypothetical cadences.
