  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2893):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 6edcb21547e0
    Recorded: 2026-11-19T17:10:56.343930791+00:00
    Findings:
    1. [P2] Detect operator-waiting sections after Markdown normalization (AC3 / ac772199). In session_misc.rs:1011-1015, ASK is checked against prose with emphasis removed, but section detection uses the original line and only updates for non-bullets. Thus a note such as "**Waiting on Joe:**\n- #4217" or "- Waiting on Joe:\n  - #4217" produces no PR IDs and no warning, even when #4217 is train-eligible or needs a reviewer. Normalize the section heading consistently and retain operator context for nested lists; add regressions through operator_waiting_warnings for both forms.
    2. [P2] Resolve the PR for legacy SPEC-key verdicts (additional AC5). In review_commands.rs:4347-4350, a SPEC argument with VerdictSource::File always yields no change. The handler compares local_relation against the checkout current branch rather than the verdict reviewed_branch. Consequently, from main, a valid legacy SPEC verdict approving the exact current head of an open feature PR still prints actionability needs-review and no next actor. This is precisely the requested SPEC-key surface; the new test calls only render_verdict_next_actor with a fabricated NextActor and misses resolution. Resolve the associated PR using verified binding/branch evidence for legacy records, and test the complete SPEC lookup from an unrelated checkout.
    3. [P2] Preserve the existing authorization result when relabeling approval actionability. review_verdict_show_body deliberately returns needs-review when independent_approval_authorized rejects an unattested, self-authored, revoked or otherwise invalid approval. The new postprocessing at review_commands.rs:4337-4340 and 4390 checks only the parsed approval word and matching SHA, then unconditionally overwrites that result with current-head-approved. An unattested APPROVED file at local HEAD is enough to trigger this even without a PR lookup; the real merge gates may still correctly demand a reviewer. Keep the authority validation in the display path and cover the full handler/postprocessing with the existing invalid-authority fixtures, rather than testing only the preexisting body function or a fabricated renderer input.
    4. [P2] Exercise the new mandate-preview gate path with effect-sensitive fixtures (ADR-76). gate/mandate_ship.rs:524-547 introduces preview_ship_cover and selects record_exclusions=false, including a distinct read-only carry-over site at 800-804. No test calls this entry point or creates LiveChecks with actor_probe enabled. The actor fixture substitutes FakeChecks and a prebuilt successful cover/typed refusal, while existing mandate collector tests retain the ordinary recording path. Therefore tests cannot detect preview writes to sticky-exclusion or carry-over evidence, or divergence between preview and actual mandate cover decisions. Add a fixture exercising the real preview path with a covered mandate, an operator refusal, unavailable/moving evidence, and assertions that exclusion/carry-over records are unchanged; ensure removing the read-only controls fails it. This is an untested new path in gate code and blocks under ADR-76.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
