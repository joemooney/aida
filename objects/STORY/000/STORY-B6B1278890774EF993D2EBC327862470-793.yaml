    Additional acceptance (product + advisor, 2026-11-17 17:05). Two sources gave stale or contradictory actor signals today:
    5. `aida review verdict <SPEC>` prints "actionability: needs-review" directly under an APPROVED verdict at the current head (BUG-2564 / #3986, ledger #16, e5c1041). An APPROVED verdict at the current head must report the next actor (for example train/merge), not needs-review. A separate STRICT pre-merge requirement, if one applies, must be named as its own line ("STRICT pre-merge review pending: <who>"), not folded into needs-review.
    6. The `merge-hold-changed` watch event for a stale-hold clear read "merge hold lifted on PR #3986 — merge-hold clear: CHANGES REQUESTED for BUG-2564 at 20bfe5376c58". The product seat took that as a fresh round-3 rejection. The wake line must state the current-head verdict, or mark a cited verdict as superseded ("stale hold for superseded head 20bfe53 cleared; current head e5c1041 APPROVED").
    Scope note from the advisor: the display may derive the next actor; gates keep deciding authority.
