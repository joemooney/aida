title: 'Live fleet view: vendor hooks heartbeat agent activity into the event log; aida ps shows every host'
description: 'Operator 2026-11-12 20:13: wants a snappy view of what every agent/subagent is doing per open spec. Today ''aida ps'' is host-local (dell1 lanes show as orphaned/idle on the primary) and its activity column is ''unknown''. Want: AC1 Claude Code (PostToolUse/Stop/SubagentStop hooks) and Codex (notify/session events) append a bounded heartbeat (lease id, spec, role, vendor, host, tool, path, one-line summary, ts) to the AIDA event log, rate-limited; AC2 heartbeats from other hosts reach the primary through the existing store/mail sync; AC3 ''aida ps'' shows one row per live session across hosts with last activity and age, and flags a lease with no heartbeat for >10 min; AC4 ''aida ps --watch'' refreshes in place; AC5 subagents appear nested under their parent session. Template-managed hooks (aida-core/templates) so every seat gets them.'
