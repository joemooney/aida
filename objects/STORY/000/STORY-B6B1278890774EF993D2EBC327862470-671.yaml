title: 'Live fleet view: vendor hooks heartbeat agent activity into the event log; aida ps shows every host'
description: |
  Operator 2026-11-12 20:13: wants a snappy view of what every agent/subagent is doing per open spec. Today 'aida ps' is host-local (dell1 lanes show as orphaned/idle on the primary) and its activity column is 'unknown'. Want: AC1 Claude Code (PostToolUse/Stop/SubagentStop hooks) and Codex (notify/session events) append a bounded heartbeat (lease id, spec, role, vendor, host, tool, path, one-line summary, ts) to the AIDA event log, rate-limited; AC2 heartbeats from other hosts reach the primary through the existing store/mail sync; AC3 'aida ps' shows one row per live session across hosts with last activity and age, and flags a lease with no heartbeat for >10 min; AC4 'aida ps --watch' refreshes in place; AC5 subagents appear nested under their parent session. Template-managed hooks (aida-core/templates) so every seat gets them.

  Slice 1 (advisor 13:58, product seat batch): implement AC1 (Claude Code and Codex hooks append a bounded, rate-limited heartbeat to the event log) and AC3 ('aida ps' shows each live session with the age of its last heartbeat) for the local host only. AC2 (cross-host delivery), AC4 and AC5 are later slices; file them as children when slice 1 lands. Acceptance for slice 1: hook heartbeat written and rate-limited (test); 'aida ps' age column from the heartbeat (test); no change to cross-host behaviour.
