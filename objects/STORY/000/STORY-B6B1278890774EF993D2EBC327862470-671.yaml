  content: |
    ## Implementer self-review
    Reviewed HEAD: d4579825efe809f14e650af4d4f2f2d21aeea09f. The merge-base diff to origin/main was empty in this native seat. I reviewed the working-tree diff against HEAD and all three untracked additions.

    AC1: [evidence: behavioral-test] The Claude and Codex hook paths record a typed local event with a per-lease 15-second throttle. The six STORY-2748 tests passed, including event round-trip, attribution, payload bounds, rate limits, rejected linked logs, and scaffold wiring. See aida-cli-lib/src/hook_activity.rs:373 and aida-core/src/scaffolding/settings.rs:529. The 16 Claude settings tests and Codex template parity test also passed.

    AC3: [evidence: behavioral-test] Local live rows expose last activity and age, including the ten-minute stale indicator. The test at aida-cli-lib/src/hook_activity.rs:483 exercised a current heartbeat, a missing heartbeat, an adopted lease, a dead row and a foreign-host row. aida-cli-lib/src/ps_integrate.rs:2866 wires the projection into human, TOON and JSON output. Multi-host delivery, watch mode and the subagent tree remain later slices.

    Deep pass checked exact event and host matching, malformed and oversized JSON, control characters, path traversal, multiple leases sharing one checkout, replaced process starts, linked runtime logs and contention. The rate check now suppresses delayed older appends. Codex hook commands exit quietly when Git or the generated handler is unavailable. The event stays local and advisory, and timing publication explicitly excludes it. The store-writer inventory passed.

    The lane's make check-ci-fast stopped at the tracked-hook assertion for the new Claude symlink. The corresponding 13-test hook protocol suite passed in a temporary checkout with the link tracked. Full FAST requires the host index. Vendor hook execution requires installed and enabled wiring in the session checkout.

    Requested host PR title is [AI:codex] feat(ps): show local agent heartbeats (Refs STORY-2748) S1.

    The final CLI help snapshot comparison passed.
