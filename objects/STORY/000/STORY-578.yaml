title: 'WS8: Vendor-parameterized orchestrator — drive the autonomous lifecycle with non-Claude agents (make the multi-vendor lead TRUE)'
description: |-
  Panel finding (forced-reproduction): auto_complete.rs HARDCODES 'claude -p' for both LLM phases — non-Claude agents cannot drive the autonomous lifecycle. ADR-4's lead claims multi-vendor; today true at the MCP/coordination layer only. Parameterize implementer/advisor phase launch (claude -p / codex exec / AGY headless) behind per-phase agent config (extends ~/.aida/agents.toml), honoring each tool's native invocation (faithful-launcher).

  RED-TEAM ADDITIONS: (a) Gas Town ships multi-vendor dispatch TODAY (Claude/Copilot/Codex/Gemini) — this slice is the credibility prerequisite for ANY unscoped multi-vendor claim; the differentiator is intent-governance semantics riding the dispatch, not dispatch itself; (b) orchestrator-core change → KEYBOARD-SUPERVISED lane (reliability-critical, not overnight drain); (c) landing this slice INCLUDES the un-scoping sweep: remove the 'coordination layer only' qualifiers from WS1/WS2/WS5 copy in the same PR or an immediate follow-on.

  Acceptance: (1) a drain runs its implementer phase on ≥1 non-Claude agent end-to-end (codex first); (2) agent choice is config/flag — no hardcoded vendor string in the phase-launch path; (3) graceful capability degradation documented; (4) un-scoping sweep executed; (5) keyboard-supervised rollout.
