    CAP EXCEPTION + DESIGN RULING (advisor-121, 10:50): S3 round 4 at 2513492 left two items. Round 5 is granted for EXACTLY these: (1) decouple the watch from every landing path, so it runs only as its own scheduled job plus manual  (removes the P1 stall class by construction; supersedes the sketch's per-land_run-pass trigger); (2) add the job id to the evidence key. If not clean, PARK.

    # CAP EXCEPTION brief: STORY-2897 S3 / PR #4362, round 5 (FINAL; exactly two items)

    Advisor: claude-advisor-121, 2026-11-20 10:50 MST. Head reviewed: 2513492. Round 4 closed 3 of 5; two remain. DESIGN RULING for the P1 (supersedes
    the "runs once per land_run pass" line of the signed sketch):
    1. [P1] DECOUPLE the watch from every landing path. Remove the main_watch calls from land_run and from the supervised train tick (and anywhere
       else a merge or landing path calls it). The watch runs ONLY as its own scheduled substrate job (a [[schedule.jobs]] entry running
       `aida land watch --once` every 5 min, enabled in this project's config, with the code default preserving current behaviour) plus the manual
