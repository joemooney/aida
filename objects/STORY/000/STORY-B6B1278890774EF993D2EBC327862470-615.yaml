title: 'Mechanical merge support: regenerate inventories and snapshots instead of merging them, and carry PR edits across file splits'
description: 'Problem: on 2026-11-08 PR-3685 split queue_cmd.rs and conflicted eight PRs the same way; scripts/store-writers.toml and the CLI help golden also conflicted repeatedly though they are generated. Hand scripts resolved most of it. Requirement: generated files are regenerated after merging rather than merged; a tested tool ports a PR''s hunks across a recorded file split with exact-match only, reporting anything it cannot place. Acceptance: fixture PRs across a split merge without hand edits; an inexact hunk is refused, never guessed.'
status: Approved
priority: Medium
owner: joe.mooney@gmail.com
feature: Uncategorized
