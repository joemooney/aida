agreed_id: STORY-2692
title: 'Mechanical merge support: regenerate inventories and snapshots instead of merging them, and carry PR edits across file splits'
description: 'Problem: on 2026-11-08 PR-3685 split queue_cmd.rs and conflicted eight PRs the same way; scripts/store-writers.toml and the CLI help golden also conflicted repeatedly though they are generated. Hand scripts resolved most of it. Requirement: generated files are regenerated after merging rather than merged; a tested tool ports a PR''s hunks across a recorded file split with exact-match only, reporting anything it cannot place. Acceptance: fixture PRs across a split merge without hand edits; an inexact hunk is refused, never guessed.'
status: InProgress
priority: Medium
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-09T01:58:54.698246911Z
modified_at: 2026-11-09T09:31:14.867567306Z
req_type: Story
tags:
- area:orchestration
comments:
- id: 01a1be0b-b671-7de0-a687-1b4ff6326c0a
  author: joe
  content: 'Advisor brief 2026-11-08 (operator approved launching now): smallest useful slice first, then ship. Build a tested host-side command that, during a merge, ports a PR''s hunks from a split source file into its destination modules: exact context match, unique destination only, refuse and report anything else, never guess. Add regeneration of scripts/store-writers.toml through its existing --regenerate path. Reference behaviour: 7 PRs today were ported this way, and failure cases to cover are a hunk with no unique destination and a moved symbol needing a re-export. Keep clear of queue_cmd/ and doctor_cmd.rs, where open PRs are landing. LIGHT gate: one targeted cargo test plus make check-ci-fast.'
  created_at: 2026-11-09T02:03:21.073821769Z
  modified_at: 2026-11-09T02:03:21.073821769Z
