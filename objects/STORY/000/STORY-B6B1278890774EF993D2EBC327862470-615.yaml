  author: joe
  content: 'Advisor brief 2026-11-08 (operator approved launching now): smallest useful slice first, then ship. Build a tested host-side command that, during a merge, ports a PR''s hunks from a split source file into its destination modules: exact context match, unique destination only, refuse and report anything else, never guess. Add regeneration of scripts/store-writers.toml through its existing --regenerate path. Reference behaviour: 7 PRs today were ported this way, and failure cases to cover are a hunk with no unique destination and a moved symbol needing a re-export. Keep clear of queue_cmd/ and doctor_cmd.rs, where open PRs are landing. LIGHT gate: one targeted cargo test plus make check-ci-fast.'
