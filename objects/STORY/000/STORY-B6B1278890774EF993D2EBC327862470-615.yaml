  author: dirtlab
  content: |
    Implemented the advisor's smallest host-side merge slice. scripts/port-split-hunks.py reads an explicit PR base/head and split source, preflights every textual hunk against explicitly supplied destinations, requires exactly one exact occurrence, refuses absent/ambiguous/overlapping/context-free hunks before writes, defaults to preview, and invokes the existing check-store-writers.py --regenerate path after --apply. No inferred imports, visibility edits or re-exports; docs explain manual API wiring and index/conflict resolution. Regenerated the inventory and retained exactly one new blocked sink row, preserving unrelated review notes.
    Changed files: scripts/port-split-hunks.py; scripts/store-writers.toml; tests/test_port_split_hunks.py; aida-cli/tests/story_2692_split_merge.rs; docs/advanced/split-merge-porting.md. Protected queue_cmd/ and doctor_cmd.rs untouched.
    Validation: launcher job j20261109T020630871-2-0, cargo test --profile agent -p aida-cli --test story_2692_split_merge -- split_merge_host_fixtures: 1 executed test passed. Python suite: 3 tests passed, including seven synthetic PR ports, missing/ambiguous/overlapping placements, newline preservation, unplaceable re-export, preview, regeneration dispatch/failure and symlink refusal. make check-ci-fast: 46 gates passed with umask 0022. Initial default-0002 run failed unrelated mail-wake security fixtures; subsequent run identified the missing inventory row, now regenerated. git diff --check passed.
