- id: 01a1e816-2402-73c1-8b95-b1a19ec8cec4
  author: dirtlab
  content: 'Slice 2 sketch for advisor signoff (native implementer; no source edits). Latest operator acceptance requests mandate renew --for D to extend covered live grants. Proposed boundary: retain direct-human/TTY checks at the production renewal entry; renew mandate first, then enumerate validated grants belonging to the same operator principal and current trusted roster; extend eligible live root grants in place under their existing record locks, preserving IDs, bindings, subjects, delegation and revocation. Report every candidate with holder PID, old/new expiry or refusal reason. Never shorten a longer expiry or revive expired/revoked grants. Respect effective seat/inline caps and the shared 168h ceiling. Descendants need an explicit policy: current children store their own expires_at copied from the parent, so root-only extension does not extend deputies/controllers automatically. Recommend extending only live, validated descendant chains within their renewed ancestor deadline, with no delegation widening, and testing revoked/expired/missing-parent/concurrent-revoke cases. Managed relay adoption must be checked against TASK-3119/TASK-3118 rather than assumed. Add read-only status text/JSON inventory and tests for parity, ordering, dependencies and nonhuman refusal. Absorbed TASK-3124: preserve fail-closed cap validation, but expose the rejected record, effective cap and config origin in status/doctor diagnostics; do not grandfather invalid authority. Expected owners: gate/seat_authority.rs, gate/mandate.rs, mandate.rs, mandate_args.rs or existing status owner, targeted tests and CLI docs. Required decisions: approve lifecycle sketch; define covered grants (records have no project/mandate binding); approve descendant extension policy and partial-failure reporting. Existing advisor comment explicitly requires a separate slice-2 sketch. Prescribed codegraph executable /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent; doctor reports missing codegraph. trace:STORY-2828 | ai:codex'
