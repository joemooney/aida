  author: dirtlab
  content: |-
    ## Implementer approach (slice 1: the two duration knobs, per the advisor signoff of 13:40)

    ### Acceptance criteria and evidence
    - **Unit** (`gate/tests/story_2828_duration_knob_tests.rs`): acceptance bullet 2 for `[mandate] max_ttl_hours`: key absent -> `parse_ttl("25h")` and a 25h mint refused; global 72 -> 72h parses, mints and its record stays valid on reload; 169h refused whatever the config says (a config of 200 clamps to 168); a project value alone or above the global cannot raise, a lower one lowers.
    - **Unit** (same file): `[seat] inline_grant_max_hours`: default 8h unchanged; raised by the global key only; a project value cannot raise; clamped to the effective `max_grant_hours` and to the shared 168h ceiling.
    - **Unit**: refusal text names the cap, where it was read from and the key.
    - **Not in this slice (no test):** bullets 1, 3 and 4 (view, expiry notice, extend path) — slice 2 / BUG-2585 per the signoff. Commits carry `Refs STORY-2828`.

    ### Expected files
    - `aida-cli-lib/src/gate/seat_authority.rs` (shared hour-cap loader, inline cap)
    - `aida-cli-lib/src/gate/mandate.rs` (cap read through the loader instead of the constant)
    - `aida-cli-lib/src/mandate.rs`, `agent_launch.rs`, `config_cmd.rs` (call sites, `aida config` knob rows)
    - `scripts/config-trust.toml`, new test file under `gate/tests/`

    ### Ambiguities / conflicts as questions
    - The signoff says both "read ONLY from the global config" and "a project value may lower the cap, never raise it" (the `max_grant_hours` precedence). I am implementing the second reading: the project copy is read only to lower. `config-trust.toml` has no global-only class, so the keys are listed under `[keys.worktree.*]` as `policy` with a lower-only note. Is that the intended registration?
