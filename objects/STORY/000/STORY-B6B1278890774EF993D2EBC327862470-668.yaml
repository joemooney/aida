title: Peer-agent coordination messages reach any vendor and are recorded in AIDA (mailbox as the vendor-neutral channel)
description: 'Operator 2026-11-12 17:35: keep the ability to message between Codex, Claude and other agent sessions. On 2026-11-12 the advisor (Claude) and the integration agent (Claude) coordinated the integration-writer protocol via Claude Code SendMessage. It worked, but that channel is Claude-only: a Codex integration agent could not receive it, and the exchange is not recorded in the AIDA substrate. Want: role-to-role coordination (e.g. ''promotion N landed, sync main''; ''integration pushed at SHA'') sent through aida mailbox so any vendor''s session receives it (Codex via its inbox hook or poll), with optional live delivery to a Claude session via SendMessage as a fast path. Acceptance: (1) an advisor can message the integration seat by role, whichever vendor holds it; (2) the message and reply appear in aida mailbox history; (3) a Codex session sees an unread message before its next turn.'
