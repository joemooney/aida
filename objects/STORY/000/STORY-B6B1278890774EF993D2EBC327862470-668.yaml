  content: 'Advisor signoff 01:32: Proposal A approved. Add an optional seat on AgentRegistryEntry, filled from AIDA_ROTATION_SEAT, which aida agent new --seat exports. seat:<name> resolves through the existing role cohort/queue/refusal path. Message gets an optional from_seat. --in-reply-to without --to resolves from_seat, then from_role, then from. B is rejected: joining the handoff log to registry rows is a heuristic that breaks between rotation and the first handoff. Conditions: both new fields serde-default/skip-if-none, so older rows and messages still read; a registry row with no seat behaves exactly as today; no new table or file.'
