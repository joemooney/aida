title: 'Launch-authority coherence through the exec barrier: hold the store writer guard from final revalidation to run.release(); file/SQLite stores keep writer exclusion or refuse (deferred from STORY-3080)'
description: |
  Deferred from STORY-3080 / #4502 (advisor-122 ruling 2026-11-24 02:13; filed by product-15). STORY-3080 closes the minutes-long cold-start window with one pre-spawn revalidation. A millisecond window remains between that final revalidation and exec, on paths not yet covered. Git-canonical directory stores (the production path) are already covered.

  ## Acceptance
  - AC1 (F1): On the contained launch path, hold the store writer guard from the final revalidation through run.release() (the exec barrier), so no authority change can land between revalidation and exec. Test.
  - AC2 (F2): File-backed / SQLite stores either retain writer exclusion across the same window, or refuse the revalidated launch mode with a clear error. Test.
