title: aida init can create a new project in a named subdirectory of a workspace directory
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. Running 'aida init --git-init' in a directory holding 100 child projects refuses (correctly) with a workspace warning, but there is no direct way to create a new project as a subdirectory. Add 'aida init <dir>' (create the directory if absent, git init it with --git-init, and initialize there), and make the workspace refusal suggest it with the exact command.
