title: GitLab Sync State Tracking
description: "As a system, I need to track the sync state between AIDA requirements and GitLab issues so that we can detect changes and maintain traceability.\n\n## Acceptance Criteria\n- [ ] Store mapping between AIDA requirement ID and GitLab issue IID\n- [ ] Track last sync timestamp for each mapping\n- [ ] Store content hash at time of sync (for change detection)\n- [ ] Store sync direction (created from AIDA, imported from GitLab, linked manually)\n- [ ] Persist mappings in database (new table/collection)\n- [ ] Query mappings efficiently (by AIDA ID, GitLab ID, or sync status)\n\n## Data Model\n```rust\n/// Tracks sync state between AIDA and GitLab\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct GitLabSyncState {\n    /// AIDA requirement UUID\n    pub requirement_id: Uuid,\n    /// AIDA spec-id (for display)\n    pub spec_id: String,\n    /// GitLab project ID\n    pub gitlab_project_id: u64,\n    /// GitLab issue IID (project-scoped)\n    pub gitlab_issue_iid: u64,\n    /// GitLab issue global ID (for API)\n    pub gitlab_issue_id: u64,\n    /// When the link was created\n    pub linked_at: DateTime<Utc>,\n    /// Last successful sync\n    pub last_sync: DateTime<Utc>,\n    /// Hash of AIDA content at last sync\n    pub aida_content_hash: String,\n    /// Hash of GitLab content at last sync  \n    pub gitlab_content_hash: String,\n    /// How the link was created\n    pub link_origin: LinkOrigin,\n    /// Current sync status\n    pub sync_status: SyncStatus,\n    /// Last sync error (if any)\n    pub last_error: Option<String>,\n}\n\npub enum LinkOrigin {\n    CreatedFromAida,    // Issue created via \"Create GitLab Issue\"\n    ImportedFromGitLab, // Imported existing issue (future)\n    ManualLink,         // User manually linked existing issue\n}\n\npub enum SyncStatus {\n    InSync,           // Content matches\n    AidaModified,     // AIDA changed since last sync\n    GitLabModified,   // GitLab changed since last sync\n    Conflict,         // Both changed\n    Error,            // Sync error occurred\n    Untracked,        // Linked but not syncing\n}\n```\n\n## Storage\n- SQLite: New `gitlab_sync_state` table\n- PostgreSQL: New table with same schema\n- YAML: Separate `gitlab_sync.yaml` file (to avoid bloating main file)\n\n## CLI Support\n```bash\n# Show sync status\naida gitlab status                  # All linked items\naida gitlab status FR-0042          # Specific requirement\naida gitlab status --diverged       # Only show diverged items\n\n# Show mapping\naida gitlab mapping                 # List all mappings\n```\n\n## Content Hash Calculation\nHash should include:\n- Title\n- Description  \n- Status/State\n- Priority/Labels (normalized)\n- Assignee\n\nExclude (too volatile):\n- Updated timestamps\n- Comment count\n- Vote count"
