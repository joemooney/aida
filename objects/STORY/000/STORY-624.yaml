title: 'aida solo: enter/indicate solo-mode work state + surface it in the statusline'
description: 'Operator request 2026-06-14: formalize solo mode as a visible work state. (1) aida solo — a command to enter/indicate the solo-mode session state (advisor+integrator working the safe backlog end-to-end with maximum discretion, per EPIC-43 / docs/solo-mode.md), mirroring how aida away / aida home / role enter set session state. (2) Surface it in the statusline (the same statusline that shows role / queue depth / mail) so the operator sees at a glance that a session is in solo mode. Decide: is solo mode a presence-style flag (~/.aida or .aida state) the statusline reads, plus an autonomy posture the drains honor? Relates to EPIC-43 (solo mode), the three-mode autonomy taxonomy, and the presence/away-home model. Parent EPIC-43.'
