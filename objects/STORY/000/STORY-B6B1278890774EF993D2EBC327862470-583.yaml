    Slice 1 implementation handoff, following advisor signoff 2026-11-08 06:25 (A1-A5). Edits remain UNCOMMITTED in the native implementer seat; host publication declaration recorded: [AI:codex] feat(lanes): add host-local capacity and status (Refs STORY-2660).

    Implemented: ~/.aida/host.toml [queue] standalone_implementer_cap > positive project cap > max(1, floor(available nproc/2)); invalid/unreadable explicit host policy refuses admission. A zero project cap retains fallback semantics; a zero host override refuses. Host policy is read through the core execution environment capture and resolver fixtures inject paths/CPU counts without new test environment writers. Direct standalone launch uses the resolver; pipeline under-cap observations preserve unknown capacity on refusal.

    Standalone slots now share ~/.aida/standalone-implementers/ and its existing atomic lock algorithm across participating clones for the same host user. Corrupt/unreadable reservations refuse admission. doctor --lane-host [--json] provides version-1 typed read-only local capacity, cap source, nproc, slot scope, occupied/free slots and reservations, with a warning for [lane_host] allow_ungranted = true. It does not grant authority or certify host readiness. Busy observation locks and unreadable reservations fail rather than report false free capacity. Status does not create state or reap records.

