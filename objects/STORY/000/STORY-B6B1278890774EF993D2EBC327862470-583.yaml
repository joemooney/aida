  content: 'Advisor 2026-11-07 23:00: dell1 (20 cores) was capped at 4 lanes by the tracked [queue] standalone_implementer_cap, which has no per-host override. Stopgap: dell1 checkout set to 8 with git skip-worktree (a later upstream edit to .aida/config.toml will make dell1''s ff-only pull fail; then run git update-index --no-skip-worktree there). R9 for this story: a per-host cap (e.g. ~/.aida/host.toml or config.local.toml) sized from nproc.'
