  content: |-
    DEFERRED to S2 (advisor-122 override-approval of #4584 S1 r2 @ 0459cd01, 2026-11-25 15:46; 2 p3 minors):
    - landing_drought.rs cause(): approved PRs whose land::Ci is StaleBase, WaitingForRun or None fall into the `_ => return None` arm and are never reported, although a stale-base or a never-started run is a plausible way for an approved PR to sit stuck. Consider a dedicated cause (update the branch / re-trigger CI), or at least 'unknown', for these states in S2.
    - landing_drought.rs scan(): open PRs are not filtered by baseRefName or isDraft, so an approved PR targeting a non-main base (for example an integration-track branch) or an approved draft can be reported as stuck and counted toward the main-branch drought, which can produce false advisor routes. Filter to PRs that target main and are not drafts, or name these as their own cause in S2.
