title: 'Scheduled mail-backlog guard: nudge any live agent with unread requests/handoffs older than 30 minutes'
description: |-
  Operator idea 2026-10-30 07:26 ('an hourly schedule in aida schedule to remind active agents to read their mail'), after the advisor left seven Codex handoffs unread for 9+ hours (BUG-HOME-040).
  Design (use the existing guard + route pattern in `aida schedule`):
  1. New `aida doctor check mail-backlog`: for each LIVE agent (aida agent ls) and each seat role, count unread [request]/[handoff] mail addressed to its handle or role that is older than a threshold (default 30m). It fails, listing agent, sender, kind, age and subject.
  2. Substrate job `mail-backlog-guard`, every 30m (configurable), runs that check.
  3. On failure, nudge each named agent through its wake path: Codex via the STORY-HOME-096 mail wake; Claude seats via the per-turn notice (BUG-HOME-040) plus a seat job `mail-backlog-guard-route` for the addressed seat; anything with no wake path is escalated in `aida awaiting` for the operator.
  4. Conditional: no backlog means no nudge (no blanket hourly reminder spam). Re-nudge the same message at most once an hour.
  5. Tests: a stale [request] to a live agent produces one nudge; a fresh one does not; a handled (read) one clears it.
  Depends on: BUG-HOME-040 (notice content) for the Claude-side delivery.
