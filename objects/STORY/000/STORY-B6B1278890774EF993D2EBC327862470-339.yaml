- id: 01a1a492-4e19-76f3-9812-41b16dd32038
  author: joe
  content: |-
    ## Implementer finding: the Q3 sandbox socket rule cannot be scoped to one path on Linux (punted, no code written)

    **Evidence.** Inside this seat's Claude Code sandbox (Linux, bubblewrap and seccomp), `socket(AF_UNIX, SOCK_SEQPACKET)` fails with **EPERM** when the socket is created, before any bind or connect. The test was python3 creating a socket under $TMPDIR. The seccomp filter blocks creating AF_UNIX sockets at all. Seccomp cannot see paths, so there is no rule of the form "allow only `<spool>/submit.sock`". The path-list setting `sandbox.network.allowUnixSockets` is honoured only on macOS. On Linux the only switch is `sandbox.network.allowAllUnixSockets: true`. That lets the seat connect to EVERY unix socket its read-only filesystem view can reach: docker.sock, the user D-Bus, ssh-agent, gpg-agent, systemd --user.

    **Why this changes the 14:20 ruling.** Q3 assumed a narrow per-seat rule. On Linux the real choice is between these options:
    - (A) Give the advisor and implementer contained seats `allowAllUnixSockets: true`, the literal Q3. This is a large widening: a contained lane could drive docker or ssh-agent.
    - (B) Give no seat sandbox a socket rule. Only unsandboxed processes submit over the socket: the operator shell, a host-run agent, or an `aida deputy shell submit` the operator adds to sandbox `excludedCommands`. That excluded command still runs as a descendant of the claude process, so the SO_PEERCRED ancestry walk still reaches the grant's binding. With Q1 (a) and Q2 (a), a sandboxed advisor can then no longer submit until the operator opts in. Today's documented route, adding `~/.aida/deputy-shell/*/incoming` to the sandbox write allowlist with the heartbeat check, goes away.
    - (C) Keep the heartbeat-attested file path only for key-only, sandboxed submitters, and make the socket mandatory for everyone else. Writing `incoming/` would still need a sandbox write rule. The same-uid forgery residual stays for that path, so acceptance (2) is only partly met.

    Points that still hold: SO_PEERCRED reports a host pid even for a bubblewrap-contained peer, so the ancestry walk works from the host runner. Q4 (launcher pid), compared as BUG-2419 tokens, is implementable as sketched.

    **Lean: (B).** It closes the residual completely and adds no sandbox widening. The cost is that a sandboxed advisor needs one explicit `excludedCommands` opt-in, which docs/deputies.md would document in place of the incoming-allowlist section.
