  content: 'ADVISOR SIGNOFF (2026-11-03 14:20) on SKETCH v1: APPROVED with these rulings. Q1: (a), refuse ''start aida deputy shell first'' when no runner is live; the file path stays only as the runner''s own spool. Q2: (a), the runner moves accepted jobs into a runner-only accepted/ directory that no seat sandbox can write, and incoming/ stops being a claim source; no HMAC. Q3: the socket rule covers the advisor and implementer seats only, in contained_boundary.rs and the seat settings templates; reviewers do not get it. Q4: the ancestry walk accepts the launcher pid that STORY-2338''s grant binding records (the lane or claude process), with the pidfd pin plus start-time recheck as sketched. SEQUENCING: implement only after PR #3287 (STORY-2338) merges, on a branch from main, never stacked on story-2338-sketch. Tests as sketched. LIGHT gate.'
