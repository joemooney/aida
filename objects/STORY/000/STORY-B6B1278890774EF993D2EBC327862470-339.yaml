  content: |-
    ## SKETCH v1: kernel-attested deputy submit (implementer, headless; needs advisor signoff)

    **Blocked on base.** This hardens the grant-validated attribution that STORY-2338 adds (`aida deputy shell`, PR #3287, still OPEN on `story-2338-sketch`). origin/main has neither `deputy shell` nor `grant_check_for` in `aida-cli-lib/src/deputy*`, so implementing now would mean stacking on an unmerged branch.

    ### Shape
    1. **Listener.** The runner (`deputy/worker.rs::run`) binds `<spool>/submit.sock`. The spool is 0700 and already owned by the runner's instance lock. It holds an `AF_UNIX SOCK_SEQPACKET` socket (SOCK_STREAM if seqpacket is unavailable) and serves one accept thread. Stale socket: unlink under the instance lock (`acquire_lock`) before bind.
    2. **Protocol.** The client sends one framed JSON `JobRecord`, the same struct as the file, and gets back `{accepted, id}` or `{refused:<code>}`. No streaming. Results still land in the spool and in mail as today.
    3. **Attestation at accept.** The runner reads `SO_PEERCRED` and gets (pid, uid, gid). The kernel translates the pid into the runner's pid namespace, so a bwrap-contained seat reports a real host pid. The runner then requires all of:
       - uid == runner uid;
       - the peer pid's ancestry (`/proc/<pid>/stat` ppid walk, bounded) reaches the pid or session recorded in the named grant's binding (`seat_authority` live holder). To close the race, the runner pins the pid with `pidfd_open` right after accept, re-checks start-time (`/proc/<pid>/stat` field 22) against the walk, and refuses if they differ;
       - `rec.requester.pid` is overwritten with the kernel peer pid. A new field `requester.peer = {pid, uid, start_time, attested: true}` is added to the known-field allow-list so `hooks::unknown_fields` keeps failing closed for everything else.
       Accepted jobs are written by the runner itself into `incoming/` with an `attested` marker the claim path trusts. Claim still re-checks grant liveness (the 2338 behaviour).
    4. **Forged files.** Claim refuses any `incoming/<id>.job` without the runner-written attestation: `refused:unattested-submit`. A same-uid forger can still write the file, but cannot mint the attestation (see Q2).

    ### Open decisions (a human must pick; these are why this is punted)
    - **Q1: offline submit.** With no live runner at submit time, (a) refuse with "start `aida deputy shell` first", (b) keep the file queue for offline submits but mark them unattested and refuse them at claim, which is the same as (a) and adds a confusing failure later, or (c) keep offline files and treat them as audit-only, which keeps the residual. **Lean: (a).** The file path stays only as the runner's internal spool. This satisfies acceptance (2) by "file path removed" for submitters.
    - **Q2: how the claim path knows a file came from the socket.** (a) The runner moves accepted jobs into a runner-only subdirectory (e.g. `accepted/`) that the contained seat's sandbox cannot write, so `incoming/` stops being a claim source. (b) An HMAC over the record with a runner-memory key. **Lean: (a).** It is simpler, and the per-seat sandbox already grants write only to `incoming/` (`contained_deputy_write_paths`). An uncontained same-uid process can still write `accepted/`. Is that residual acceptable, given that such a process can edit the shell rc anyway (the 2338 §3 threat statement)? If it is not, only (b) closes it.
    - **Q3: sandbox socket rule.** Contained seats reach the socket through the Claude Code sandbox (`allowUnixSockets` / bwrap bind of `<spool>/submit.sock`) and the Codex sandbox. That rule is a new sandbox-profile change across `contained_boundary.rs` and the seat settings templates. Which seats get it? **Lean:** the advisor and implementer seats, per the spec ("a sandbox socket rule for the advisor seat").
    - **Q4: binding granularity.** Should the ancestry walk accept the grant's recorded session-leader pid, or its launcher pid (aida lane / `claude` process)? This depends on what 2338's grant binding records, which is unknown until #3287 merges.

    ### Tests (hermetic)
    - unit (`deputy/tests.rs`): socket submit from a child process records the kernel peer, and the job is refused when the peer is not under the grant's binding (fake grant pinned to an unrelated pid). Forged `incoming/` or `accepted/` file → `refused:unattested-submit`. Stale socket recovery under the instance lock. Unknown `requester.peer` subfields still refused.
    - command-level: `aida deputy submit` with no runner → the Q1 refusal text.

    ### Expected files
    `aida-cli-lib/src/deputy/{mod.rs,worker.rs,hooks.rs,tests.rs}`, a new `deputy/socket.rs`, `deputy_cmd.rs` (submit client), `contained_boundary.rs` plus the sandbox settings templates (Q3), and the CLI help golden if submit flags change.
