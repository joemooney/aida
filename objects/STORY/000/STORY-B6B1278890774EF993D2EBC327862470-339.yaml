    ## Implementation done per ruling (B); UNTESTED, so not pushed

    Local commit d12c6fef624 on branch story-b6b1278890774ef993d2ebc327862470-339 (worktree aida-seat-aida-story-b6b1278890774ef993d2ebc327862470-339). Not pushed, because the dispatch says not to push untested work.

    **What it does**
    - New deputy_shell/socket.rs. The runner binds <queue>/submit.sock (0600, inside the 0700 queue). A stale socket is replaced under the runner lock; any other kind of file at that path is refused, never removed.
    - How a submit is attested: the runner reads SO_PEERCRED and pins the peer with SO_PEERPIDFD, falling back to pidfd_open. It requires the peer's uid to equal the runner's. It walks /proc ppid ancestry (bounded at 64) until it finds a proc:/sid: binding of the named grant, compared as BUG-2419 (pid, ns, start) tokens; a binding from a foreign pid namespace is never compared. It then re-checks that the pidfd is still live and the start identity is unchanged. The kernel peer overwrites submitter.pid/pid_start, and a new Submitter.peer {pid, uid, start, matched, attested} is recorded. A refusal returns refused:foreign-uid, refused:not-under-grant or refused:grant to the client immediately, and is audited as submit-refused.
    - The incoming/ directory is removed. The runner files accepted jobs in a runner-only accepted/ directory (Q2a). The claim-side verdict now refuses a job with no attested peer, or whose peer.matched is not one of the grant's bindings: refused:unattested.
    - Cancel also goes over the socket (uid check). With no live runner, submit refuses with 'start aida deputy shell run --name N first' (Q1a). A sandboxed client gets EPERM/EACCES, and the error names the excludedCommands opt-in.
    - No sandbox or template changes (B). docs/deputies.md and docs/cli/06-roles-sessions.md are updated: the incoming allowlist section is replaced by the excludedCommands opt-in.

    **Verification**
    - cargo check --profile agent -p aida-cli-lib --lib --tests passes with 0 warnings (lane job j20261104T064454607-7-0).
    - cargo test -p aida-cli-lib --lib -- deputy_shell was run three times through the lane job runner. All three runs hit the runner's 900s cap while still compiling aida-cli-lib (j20261104T060909618-12-0, j20261104T062945733-7-0, j20261104T064845597-7-0). Raising AIDA_CARGO_TIMEOUT was denied in this session. make check-ci-fast cannot finish inside this lane's 60s tool cap.
    - New tests: socket submit records the kernel peer and refuses a peer outside the grant (a live non-ancestor child); attest namespace and uid table; a legacy incoming/ file is never claimed; no-runner and sandbox error text; stale socket vs non-socket file. Existing tests now file through accept() with an attested peer, and the unattributable table gains no-peer, peer-not-attested and peer-off-binding cases. submit_wait now runs through the real socket.

    **Needed to finish:** run cargo test -p aida-cli-lib --lib deputy_shell plus make check-ci-fast with a longer timeout (operator or a lane with a warm test target), then push and open the PR.
