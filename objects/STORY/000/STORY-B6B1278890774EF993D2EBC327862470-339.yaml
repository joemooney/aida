  content: 'Round 2 (PR #3386, commits 9106e3f601b + 2cc77ff087b; CI green on 2cc77ff incl. lib-1; local: deputy_shell 35/35 pass). 1 BLOCKER fixed: queue_dirs_are_0700_... submitted via accept() after loosening jobs/ (accept now checks the queue); it now files the job unchecked and asserts accept refuses. 2 fixed: pidfd_open(pid) fallback removed; without SO_PEERPIDFD a submit is refused:unattested. 3 fixed: per-connection threads (cap 16, then refused:busy; busy request drained 250ms first, since closing an AF_UNIX socket with unread bytes resets the peer), 5s whole-request deadline. 4 documented, not enforced: any unsandboxed same-uid process can already write accepted/<id>.cancel directly, so a server-side owner check adds no boundary; residual stated in docs/deputies.md. 5 fixed: runner emits one legacy-incoming-ignored audit row + terminal notice at start. 6 fixed: stale incoming/ comment.'
