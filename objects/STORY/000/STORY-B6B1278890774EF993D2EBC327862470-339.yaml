title: 'Kernel-attested submit for the script deputy: a SO_PEERCRED socket instead of the file queue''s same-uid residual'
description: 'Follow-up to STORY-2338 (advisor ruling Q6: later, filed by the implementer). The script deputy (aida deputy shell) attributes a job from the submitter''s validated grant record and re-checks it at claim, but a same-uid, uncontained process can still write incoming/<id>.job naming a live session''s grant (grant records are readable by the user). Close that residual with kernel-attested submission: the runner listens on a unix socket in its 0700 queue; submit connects, the runner reads SO_PEERCRED (pid, uid) and checks the peer pid''s ancestry/session against the grant''s binding before accepting the job. Needs: a live runner at submit time (or a defined fallback), a sandbox socket rule for the advisor seat, and a decision on whether the file queue stays for offline submits. Acceptance: (1) a job submitted over the socket records the kernel-reported peer and is refused when the peer does not run under the named grant''s binding; (2) a forged incoming/ file is refused, or the file path is removed; (3) hermetic tests for both. Architecture-sensitive: sketch + advisor signoff first.'
