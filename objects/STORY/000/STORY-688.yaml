title: 'Product/advisor role split: lighter product front-door vs heavy async advisor'
description: 'Operators hypothesis: a lighter product role does fast intake/propositioning and throws heavy analysis over the wall to an async-draining advisor, decoupling the fast path from the slow one. Note aida intake already seeds the lightweight front-door (cold-boot approve/reject/park/queue proposals). Deferred behind visibility-first: only mint a new role if, once the blocked-board surfaces the advisor backlog + intake proposals, the advisor is still a MEASURED throughput bottleneck (not just an opacity one).'
