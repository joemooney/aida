- id: 01a2213b-8e3f-7573-8313-758a3a9a3909
  author: dirtlab
  content: 'SKETCH (docs/plans/2026-11-28-story-2894-generated-file-regen-sketch.md, branch story-2894-sketch @ 9e50112304). Registry: reuse STORY-2710''s REGISTRY in scripts/repair-generated.py (host-embedded); add showcase-search (docs/showcase/search-data.js, build.py) and store-writers (scripts/store-writers.toml, check-store-writers.py --regenerate, with --baseline in conflict lanes) next to the existing cli-help row; train eligibility and output class live in a host-compiled table under aida-cli-lib/src/gate/ (protected floor, so adding an entry needs a human merge), cross-checked against the Python table by a ratchet. Coverage: derived files (help golden, search-data.js) are excluded from the car patch-id only under exact literal paths, regular 100644 blobs, no protected-set match (floor + config layers, fail closed), a member that does not touch the generator, and a non-empty hand-written diff; a merge-tree conflict is tolerated only when every conflicted path is excluded. store-writers.toml is NOT excluded: its rows carry reviewed policy, so coverage compares the per-id row delta (a row-level 3-way merge; a same-id conflict ejects). Regeneration: in build, after the last car, in a temp worktree via the embedded driver''s sandbox; one canonical regen commit on the tip (Aida-Train-Regenerated / Aida-Train-Regen-Command trailers), plus an aida-train-regenerated block in the PR body and the journal (AC3). verify_structure accepts at most one trailing regen commit, touching only registered paths. Failure (generator error/timeout, non-determinism, writes outside outputs, a changed reviewed row, a protected path) discards the exclusion and rebuilds under today''s strict rules, so the worst case is today''s ejection. CI backstop: the full ratchets run on the regenerated tip. Slices: S1 registry + regen commit (no coverage change), S2 store-writers row-delta coverage (fixes the #4339 case, AC1), S3 derived exclusion + AC2/AC4 tests + AC5 replay. Open questions: row-delta vs wholesale exclusion for store-writers; one tip regen commit vs per-car; exec-context/templates/library.html eligibility; pr train --check should dry-run build; regen commit attribution.'
