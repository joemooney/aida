title: 'Sandbox: strict read-confinement hardening for os_wrap (default-absent FS bind-allowlist)'
description: 'Follow-up hardening on STORY-612''s bwrap OS-wrapper. STORY-612 ships WRITE-confinement: --ro-bind / / leaves the whole filesystem READABLE, rw only the worktree/store/caches. So a rogue drain cannot WRITE outside its tree, but it CAN still read host credentials (~/.ssh, ~/.aws, browser cookies) and exfiltrate within the egress allowlist. This spec tightens to a default-ABSENT filesystem: bind only the worktree + toolchain + certs/resolv.conf + the claude auth dir, everything else not present. Stronger but fragile (must enumerate every path claude/node/cargo need or they break), needs live tuning on the deploy distro. relates SPIKE-61, STORY-612.'
