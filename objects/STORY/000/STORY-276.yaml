- id: 019e413d-63f3-7742-9c8a-ef5b48ddbf60
  author: joe
  content: |-
    Plan: docs/plans/2026-05-19-story-276-headless-implementer.md (2026-05-19).

    Prerequisite STORY-332 (/aida-punt + NeedsAttention) is now Completed (PR-110), so STORY-276 is unblocked. Approach — three focused pieces, NOT new launch plumbing (exec_claude_headless already exists and the reviewer phase already uses it):

    1. Enable the launch — lift the --no-human=both kickoff rejection; RealPhaseDriver::run_implementer passes --no-human to its child 'aida queue work <spec>' when the mode wants a headless implementer; bare --no-human restored to mean 'both' (STORY-263's original intent; TASK-306 narrowed it only while both was unavailable).
    2. Teach the implementer to punt — /aida-pickup skill gets a headless rule: under AIDA_HEADLESS=1, a kind:design-fork prompt becomes 'aida punt' instead of AskUserQuestion. SPIKE-7 Q4 proved headless Claude stops cleanly at a question; STORY-276 converts that clean stop into a recorded, triageable punt.
    3. Make the orchestrator understand a punt — new third phase-1 outcome ImplementerOutcome::Punted, detected by reading the dispatched spec's status (NeedsAttention => punted). A punt is exit-0 (honest, not a failure): orchestrate skips phases 2-6; drain_batch advances to the next member instead of stopping. resolve_batch_members skips NeedsAttention so a punted member never resurfaces as the head.

    No aida-core model change — STORY-332 already shipped PuntCategory / AttentionReason / NeedsAttention / the punt ledger.

    Decision flagged for review: bare --no-human flips from reviewer-only to the riskier full-headless 'both' (per acceptance: 'unflagged --no-human enables headless phase 1'). Mitigated by a loud mode-specific kickoff banner + one-time ack.

    Acceptance bullets 5-6 (real headless Claude punts / ships) are verified manually SPIKE-7-style (~$3/run real API spend, CI can't run them); automated tests cover the orchestrator's handling of a punt with a mock.
  created_at: 2026-05-19T17:16:42.867726962Z
  modified_at: 2026-05-19T17:16:42.867726962Z
- id: 019e4150-ad33-7203-9a25-f74d1d5095aa
  author: joe
  content: |-
    Implemented via PR (commit c64223ee):

    - Wired `--no-human=both` to run the implementer phase (phase 1) headless — `RealPhaseDriver::run_implementer` appends `--no-human` to the phase-1 subprocess so `handle_queue_work` launches `claude -p`.
    - Added the design-fork punt safety net: `/aida-pickup` Step 3d (headless-only) directs the implementer to `/aida-punt` rather than guess; `aida punt` drops an `AIDA_PUNT_SIGNAL_FILE` signal the orchestrator detects to park the spec in NeedsAttention and advance.
    - `orchestrate` routes a punt to `finish_punted` — a clean exit-0 result, not a failure; `OrchestrationResult.punt_reason` + `BatchDrainResult.punted` keep punted specs out of the "shipped" count.
    - Kickoff gate: `--no-human=both` is now an acknowledgeable mode (was rejected); scope banner + reminders vary by mode.

    Test status: 716/716 aida-cli tests green
