  content: |-
    ## Round-3 rework (17ea28e): all five findings are in this slice

    | # | Finding | Fix | Test |
    |---|---|---|---|
    | 1 | A file at the same head hid a newer ledger-only verdict in `merge_gate_verdict_candidates` and `corpus_gate_bodies` | Added `review_verdict::ledger_supersedes`, which uses `newer_of`'s ordering (ledger time = min(ledger `at`, `recorded_at`), and the same round keeps the file). Both gates now weigh the ledger record in place of an older file. Each ledger record counts once across roots. An unparseable file is kept, so the gate still fails closed on it | `a_newer_ledger_verdict_outranks_the_file_at_both_merge_gates` (in both directions), `a_ledger_verdict_counts_once_across_roots` |
    | 2 | The launcher summary preferred a stale `PR-N.json`; the templates pointed at the file | The summary reads `current_verdict_body` (the newer of file and ledger). The aida-fire, aida-burndown and aida-orchestrate templates (skill, command, portable) now say `aida review verdict PR-<n> --json` and explain that the file can be missing or from an earlier round | `single_key_readers_get_the_newer_of_file_and_ledger` |
    | 3 | Calibration capture read `verdict_path` only | `capture_review_calibration_for_spec` reads `current_verdict_body_at` | same test |
    | 4 | File-only readers | **Fixed in this slice, not deferred.** `burndown_run::local_verdict_blocks_merge`, the integrate classification in `queue_cmd`, and `drain_cmd`'s reviewed check all read the merge chokepoint's own `corpus_gate_bodies`, so they share one interpretation and are ledger-aware. `status_awaiting` reads `current_verdict_body_at`. `human::spec_review_approved` adds the ledger record as a timed candidate wherever it is newer than the file. Rework auto-release reads the newer of file and ledger as the latest verdict, and gets the ledger's rounds as retained history through `RetainedHistory::with_ledger`, so a contained RC→approve cycle no longer needs a human clear | `retained_history_includes_the_ledger_rounds` |
    | 5 | Expired grant at collection was untested | n/a | `an_expired_grant_is_refused_at_collection` |

    Tests: `cargo test --profile agent -p aida-cli-lib --lib gate::ledger` gave 24 passed. A wider run over the touched readers (rework_hold_release, merge_gate, corpus_gate, merge_hold, review_verdict, human, status_awaiting, bug_1581, bug_2149) gave 545 passed. The 16 failures there are all `could not install the hermetic test HOME: Read-only file system`: they are isolated-subprocess tests that cannot run in this sandboxed seat and are left for CI. `make check-ci-fast` passed all 35 gates.

    Known limit, unchanged: `pr_has_approved_verdict` / `pr_has_local_verdict` (orphan sweep) still read the PR file only. They are not on a merge-deciding path, and they move to the ledger projection with the slice-2 reader switch-over.
