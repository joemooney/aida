  content: |-
    ## Implementer approach — slice 1 (per signed-off sketch + Q1 ruling)

    ### Acceptance criteria as tests (slice-1 share)
    - **AC1 (unit, `gate::ledger`)**: `verdict` / `legacy-imported` / `rejected-event` events round-trip; `seq` monotonic under concurrent appenders (thread test, flock); each event carries `head` + `patch_id` (null when uncomputable); `store_root` from a linked-worktree fixture resolves to `<main>`, an unverified seat clone is refused.
    - **AC2 (unit)**: a verdict appended for change PR-7 with spec X is returned by a read keyed `PR-7` and by a read keyed `X` (spec index → change), same record.
    - **AC5 (unit)**: contained writers never open the ledger: `submit` writes a spool entry under `<main>/.aida/mailbox/gate-events/`; the next primary-side append/project drains it, appends accepted events, and appends `rejected-event` for an unattested / sha-mismatched entry (validated with `RecorderAttestation::authorizes`; read-side approval re-validation is unchanged).
    - **AC6 (unit + ratchet)**: legacy `PR-N.json` + archive rounds are read through before the first ledger write and preserved verbatim in a `legacy-imported` event on it; a ratchet test counts legacy-path literals in non-test sources and fails above today's count.
    - **Readers (unit)**: `read_recorded_verdict(_any)` / `read_verdict_for_sha` prefer the ledger only when it is strictly newer than the legacy file (or the legacy file is absent), so a contained reviewer's spooled verdict is visible without collect.

    ### Expected files
    `aida-cli-lib/src/gate/ledger/{mod,event,store,spool,legacy,project,tests}.rs` (new), `gate/mod.rs`, `gate/review_verdict.rs` (write funnel + central readers), `lib_part5.rs` (spec index on `aida review record --pr`).

    ### Ambiguities / conflicts as questions
    - Slice 1 keeps the legacy verdict file write and the launcher collect step **as a compatibility mirror**: ~200 production call sites (136 `verdict_path` uses in 34 files) still read the files directly, so deleting the writer/collect now would hide verdicts from them. Proposal: the reader switch-over + collect deletion move to slice 2 alongside holds; the ratchet pins the legacy count now and slice 3 drives it to 0. Flagged as a deviation finding.
    - Spec-only verdicts (no `--pr`) have no change key and stay legacy-only until slice 2 resolves spec→PR.
