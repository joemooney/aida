- id: 01a187c8-b1cc-7b93-a057-8aa9fb5ee6d1
  author: joe
  content: |-
    ## Round-1 rework (40c22ff), all seven findings bundled

    | # | Finding | Fix | Test |
    |---|---|---|---|
    | 1 | Ingest authority was structural only | `spool::validate` requires the attestation's `authority_key` to re-validate through `review_authority::verified_authority_keys`, the same grant/receipt check the ship gate uses | `a_forged_reviewer_seat_submission_is_rejected` (no grant, and an implementer grant claiming seat `reviewer`, both become `rejected-event`) |
    | 2 | Submitter timestamps ordered reads | A submission dated more than 300 s in the future is rejected. `newer_of` orders a ledger verdict by min(ledger `at`, `recorded_at`). The same round on both sides keeps the file | `a_future_dated_submission_cannot_shadow_a_later_file_verdict` |
    | 3 | Consumed spool files were not removed when nothing was pending | Removal now runs on every drain | `a_surviving_spool_file_is_removed_without_a_duplicate_event` |
    | 4 | Submitter-supplied patch identity was kept | Recomputed on the primary side at ingest (`None` when it cannot be computed) | `a_submitted_patch_identity_is_recomputed_on_ingest` |
    | 5 | Ratchet counted string literals | New `legacy_gate_writers_do_not_gain_call_sites` counts non-test calls to each legacy writer, definitions excluded. The literal ratchet stays as well | (the test is the ratchet) |
    | 6 | First write was recorded twice | `before_verdict_write` imports the legacy files before the file write, and `append` skips a direct verdict whose record is already on the ledger. `verdict_history` deleted | `the_first_verdict_write_is_recorded_once` |
    | 7 | `store_root` not memoised | Memoised like `hold_store_root`; refusals and roots without `.git` are not cached | n/a |

    **Design choice on #2:** I did not overwrite the record's `recorded_at` on ingest. The ship gate re-validates the seat grant *as of* `recorded_at`, and `authority_key` includes it. Re-stamping it to ingest time would make a valid approval fail once the reviewer's grant has expired or been revoked, and ingest is lazy. Instead, the ledger's primary-side `at` caps the ordering time, and future-dated submissions are refused. A submitted timestamp can therefore only make its verdict older, never newer.

    **Deviation (dual write):** accepted by the advisor for slice 1. Slice 2 must remove it: verdict writers stop writing legacy files, readers read the ledger projection, collect/adopt are deleted, and the verdict-writer ratchet baselines go to 0.

    Tests: `cargo test --profile agent -p aida-cli-lib --lib gate::ledger` → 18 passed. `make check-ci-fast` → 35 gates passed.
