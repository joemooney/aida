  author: joe
  content: |-
    ## Slice 2 PR opened: #3106 (head 05a4f4d, Refs trailer)

    This seat compiled the handoff WIP and fixed the 9 real failures it found. It also fixed 4 more from the wider filters (review_verdict_display x2, task_1460, and bug_775 handshake: reads only, expectations unchanged).

    Design change for the reviewer: `ledger::hold::fold` no longer voids a pending `release-authorized` on every `hold` event. Instead, `merge_hold_core::append_hold_record` appends an explicit `release-withdrawn` before a real placement. The blanket void hid a fail-open in the story_1687 hold-field matrix: a raw replacement with a changed `pr` field was appended to another PR's ledger. The fixture now writes it to PR 37's ledger.

    Tests not runnable here are listed in the PR body (BUG-1642 hermetic HOME, the bug_1749 binary, the task_2344_q1 tick lock); CI is the gate for them. make check-ci-fast: 35 gates passed. Slice 3 (carry-over proof events and supersedes) is next.
