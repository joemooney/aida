- id: 01a1876d-6c54-7aa3-b919-fec8b7c174c8
  author: joe
  content: |-
    ## Implementer findings — slice 1 (filed as a comment: `aida add` refused in this contained seat, "requirement ID allocation failed: Read-only file system")

    1. **kind:deviation · major — legacy verdict file write + launcher collect kept as a compatibility mirror.** Sketch §9 said that in slice 1 verdict writers and readers switch over and collect is deleted. As shipped:
       - Every PR-keyed verdict write lands on the ledger (`review_verdict::write_verdict_object_for_spec` → `gate::ledger::mirror_verdict_write`).
       - `read_recorded_verdict` and `read_verdict_for_sha` read through the ledger.
       - The `.aida/review-verdicts` file is still written, and `collect_standalone_verdict` / `adopt_direct_write` remain.

       Why: about 200 production call sites (136 `verdict_path` uses in 34 files) read the files directly. Collect also runs StandaloneVerdictChecks (launcher/child grants), which ingest does not yet replicate. Proposal: slice 2 moves those readers onto `gate::ledger::project` and deletes collect together with the hold work. The ratchet pins today's counts.
    2. **kind:design-choice · minor — read-through tie-break.** `review_verdict::newer_of` keeps the file on a `recorded_at` tie and uses the ledger only when the file is missing or strictly older. Reason: `close_verdict_on_merge` still annotates the file in place, and there is no merged/closed ledger event until slice 2. Flip the tie-break to ledger-only when the writer switches. Spec-only verdicts (no `--pr`) stay legacy-only in slice 1.
    3. **kind:design-choice · minor (security) — spool ingest validation and residual exposure.** Ingest accepts only `verdict` events whose actor attestation `authorizes()` the head, equals the record's attestation, and has `reviewed_sha == head`. Anything else becomes a `rejected-event` that keeps the submitted body. Symlinked or >1 MiB submissions are refused. Read-side grant re-validation is unchanged. Residual: a contained seat can delete other seats' pending submissions before ingest. That is withholding, not forgery, and is the same exposure mailbox messages have today. Consider eager ingest in slice 2.
