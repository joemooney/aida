  author: joe
  content: |-
    ## Slice 2 handoff (implementer seat rotation, 2026-10-29 13:35). This is work in progress; no PR is open yet.

    The branch `story-b6b1278890774ef993d2ebc327862470-080` is pushed at **e87ae08**. That commit is a WIP: the lib compiles and the tests compile. The approach comment above stays valid, so do not post a new one.

    `aida session handoff --write` was refused by the sandbox, so this comment is the handoff.

    **Local test runs must unset `AIDA_CONTAINED`.** This seat exports `AIDA_CONTAINED=1`, so every ledger writer refuses. Use `env -u AIDA_CONTAINED cargo test --profile agent -p aida-cli-lib --lib -- gate:: merge_hold`.

    ### What e87ae08 does
    **Holds**
    - New `gate/ledger/hold.rs` adds hold-family events: hold, hold-release, release-authorized, release-withdrawn and label-sync.
    - `state()` is a fold over those events, with legacy marker read-through. A marker counts when the ledger has no hold or release for the PR, or when the marker is newer than the last one. A marker-held hold is imported before any write that is not a placement.

    **`merge_hold_core`**
    - Renamed: `place_hold`, `rearm_hold`, `place_hold_by_hand`, `release_hold`, `release_hold_by`, `release_hold_under_mandate`.
    - Added: `clearance_for`, `recorded_clearance`, `hold_is_open`, `hold_placed_at`, `hold_written_at`, `hold_ledger_file`, `refusal_hold`, `collect_legacy_hold`.
    - The hold lock moved to `gate-ledger/PR-N.hold.lock`, with no local fallback.
    - `local_hold_path`, `local_clearance_path`, `clear_hold`, `superseded_clearance_path` and the marker writers are deleted.

    **Rework release and contained reviewers**
    - `rework_hold_release::release_with` now runs on ledger events: authorize, then recheck, then release, or withdraw.
    - It reads verdicts through `current_verdict` and `RetainedHistory::projected`.
    - A contained `aida review record` skips arming the hold. The launcher arms it after collect through `merge_hold::arm_collected_refusal`.
    - `adopt_worktree_hold` and `dispatch_reviewer_hold` now only collect legacy worktree markers onto the ledger.

    **Verdicts**
    - `write_verdict_object_for_spec` goes through `ledger::record_verdict_at` and is ledger-only.
    - A contained or non-canonical path gets a seat hand-off file instead.
    - A spec with no indexed change is written to `by-spec/<SPEC>.jsonl`.
    - `close_verdict_on_merge` appends an annotated record.
    - The archive writer and the sidecar migration are deleted.

    **Ratchet**
    - Writer baselines are 0 via the GONE list.
    - The `write_verdict_atomic` allowlist covers the contained hand-off, `backfill-shas` and `review_carryover` (slice 3).
    - The `merge-holds` and `merge-hold-clearances` literal baselines are 0.
    - New tests: `verdict_and_hold_writers_write_no_legacy_file`, plus 4 AC3 tests at the end of `gate/ledger/tests.rs`. These have not been run yet.

    ### Remaining work
    1. Fix about 119 tests that still assert legacy files. The failing list is committed at `.slice2-failing.txt`; delete it before the PR. Biggest groups:
       - `rework_hold_release`: ~72
       - `review_verdict_tests`: 31
       - `merge_hold_core`: 5
       - `story_1917`: 5
       - `solo_review`: 5
       - mandate: 4

       Fail-closed test expectations (TASK-1801, bug_775) must stay unchanged.
    2. Run wider filters: `review_verdict`, `phase_gates`, `bug_775`, `task1801`, `human::`, `status_awaiting`, `pr_claim`, `lane_liveness`, `doctor`.
    3. Run `make check-ci-fast`, push, then open the PR with `/aida-pr`.
    4. Findings to file:
