  6. NEW, found by the advisor, a slice-1 regression on the shipped collect route: on 2026-10-29 both `aida queue work PR-N --role reviewer --no-human` launches (PR-3105, PR-3106), run from an UNCONTAINED operator shell with no AIDA_CONTAINED in its env, failed at collect with "a contained seat cannot collect a verdict onto the gate ledger" (gate/ledger/mod.rs:242 record_collected_verdict). So the launcher process acquires AIDA_CONTAINED itself before collecting (suspect: it sources .aida/session-env.sh or sets the child's env on its own process). Find the cause and fix it so the launcher's collect runs uncontained. Add a test that launcher collect succeeds when the parent env has no AIDA_CONTAINED. This is BLOCKING: without it, no reviewer verdict reaches the gate.
