- id: 01a18943-8624-79d1-bfe4-066df98889b8
  author: joe
  content: |-
    ## Implementer approach — slice 2 (holds on the ledger, single writer)

    ### Acceptance criteria as tests
    - **AC3, unit (`gate::ledger::tests`):** placing a hold appends a `hold` event carrying the full composed `MergeHoldRecord`, and releasing it appends a `hold-release` event carrying the `HoldClearance`. After a release the ledger still holds the `hold` line, and `read_hold_record` answers `None`. The test name will be `a_release_appends_and_keeps_the_hold_as_evidence`.
    - **AC3, unit:** `human_recorded_clearance` and `held_then_cleared` (the input to the mandate and to `aida awaiting`) read "a hold existed and was cleared" from the ledger with no marker file present. Test: `a_cleared_hold_is_read_from_the_ledger_without_a_marker`.
    - **AC3, legacy read-through (unit):** a hand-written marker in `.aida/merge-holds/PR-N` with no ledger hold events still holds, and an unreadable one still fails closed (TASK-1238). A marker older than the newest ledger hold event does not reopen a released hold. Test: `legacy_markers_are_read_through_until_the_ledger_answers`.
    - **AC5 (unit):** no hold, clearance or lock file is written under a worktree or seat clone. `local_hold_path` and `local_clearance_path` are deleted. A contained hold writer is refused and does not fall back to a local marker.
    - **Single writer, verdicts (unit):** `record_verdict` / `write_verdict_object_for_spec` / `close_verdict_on_merge` / `stamp_pr_review_verdict` append ledger events and write no `.aida/review-verdicts/*` file, including the per-commit archive. A spec-only record resolves its change through the spec index, and with no indexed change it goes onto the spec's change-less index entry (question below).
    - **Ratchet:** in `legacy_gate_writers_do_not_gain_call_sites`, the verdict and hold writer baselines drop to 0. The existing fail-closed tests (TASK-1801, bug_775 phase-3) stay green with their expectations unchanged.

    ### Expected files
    - `gate/ledger/{event,store,project,legacy,mod,tests}.rs`
    - `gate/merge_hold_core.rs`
    - `gate/review_verdict.rs`
    - `gate/rework_hold_release.rs`
    - hold writer and release call sites (`merge_hold_cmd`, `pr_cmd`, `pr_ship_batch`, `mandate_ship`, `burndown_run`, `needs_attention_lens`, `phase_driver*`, `lib_part5`, etc.)
    - verdict writer call sites (`pr_merge_gate`, `phase_gates`, `db_reconcile`, `needs_attention_lens`, `phase_driver_trait`)
    - the tests that asserted on legacy files

    ### Ambiguities / conflicts as questions
    - A spec-only verdict for a spec with no PR yet has no change to key on. I will resolve it through the spec index, then through the spec's open PR if the forge lookup already used by `review record` finds one. If neither finds a change, I will record the verdict on the ledger against the spec's index entry as an unbound event, so the gate state still lands on the ledger rather than a legacy file. The question is whether this unbound event is acceptable as the orphan case under the Q5 ruling.
