    ## Round-4 rework (7dac907): all four findings fixed in this slice

    | # | Finding | Fix | Test |
    |---|---|---|---|
    | 1 | `aida review verdict --json` printed the file body | New `review_verdict::current_verdict(_at)` returns the weighed record plus its source (`File` or `Ledger{file,seq}`) and write time. `--json` prints that record with `actionability` and `record_source {kind, location}`; the text `record:` line names the ledger location when the ledger answered | `review_verdict_json_prints_the_selected_record_and_its_source` (ledger-only key, stale file + newer ledger, newer file) |
    | 2 | Round-3 ruling: no direct legacy readers; no reader ratchet | Routed: `human::pr_has_approved_verdict`/`pr_has_local_verdict` and the phase-3 handshake (`read_verdict_file(_for_head)`, `spec_verdict_fallback_for_phase3`, `phase3_head_archive_fallback`, with the ledger's round at the head as the archive fallback), `db_reconcile::read_review_verdict_for_record`, `list_active_verdicts`, the rework-findings scan, the stranded/stalled sweeps, `audit_verdict_dir`, `review_classes`, the needs-attention round count, and two `lib_part5` reads. Directory scans walk `verdict_keys` (file stems unioned with the ledger's change and spec keys). The handshake counts a ledger record only when it was written during the review session, because the ledger, unlike the file, is not cleared before the reviewer runs. New ratchet `legacy_verdict_files_are_read_only_through_the_ledger_projection`: non-test calls of `read_verdict_body`, `archived_recordings`, `archived_verdict_file_for_sha`, `verdict_file_for_sha` and `verdict_file_modified` outside `gate/review_verdict.rs` and `gate/ledger/legacy.rs` must appear on an allowlist, and each of its 8 entries states a reason (merge-gate corpora that already weigh `ledger_supersedes`, rework retained history, the class corpus, BUG-809 sibling-checkout evidence, archive freshness). Inline `#[cfg(test)]` modules are stripped before counting | `scanning_and_handshake_readers_see_ledger_only_verdicts`, `test_modules_are_stripped_but_code_after_them_is_kept`, the ratchet |
    | 3 | [regression] findings_gate read only the spec file | `completion_verdict` → `read_recorded_verdict` (ledger-aware) | `a_ledger_only_spec_record_still_files_its_findings_on_completion` |
    | 4 | `spec_review_approved` kept a superseded file as a candidate | Each key (PR and spec ids) adds ONE candidate from `current_verdict`. Its time is the file mtime or the ledger order time. The unused `verdict_file_written_at` is deleted | `awaiting_you_drops_a_file_the_ledger_supersedes` |

    Tests: `cargo test --profile agent -p aida-cli-lib --lib -- gate::ledger review_verdict_tests merge_hold_core gate::ship rework_hold_release bug_2149 story_1417 needs_attention` gave 349 passed and 16 failed. All 16 failures are `could not install the hermetic test HOME: Read-only file system`, isolated tests this sandboxed seat cannot run; CI runs them. A run over phase_gates, human and findings_gate passed apart from the same sandbox class. `make check-ci-fast` passed.

    Known limit: the ratchet counts calls of the read primitives. A raw `std::fs::read_to_string` on a hand-built verdict path is not caught by it; the existing `"review-verdicts"` literal ratchet still bounds those.
