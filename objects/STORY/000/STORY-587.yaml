title: 'fasttrack: a low-ceremony lane for trivial items — tag + batch bucket + one-command drain (CI stays the only gate)'
description: |-
  Operator idea (2026-06-12): for trivial/obvious changes (doc tweaks, a one-line UX papercut, a string fix) the full review ceremony is overkill. Want 'fasttrack <desc>' to file + tag + queue an item into a fasttrack bucket that drains to main quickly with minimal ado.

  MOSTLY EXISTS — compose it: lifecycle short-circuit tags (no-review/no-build) + batch:NAME tags + 'aida queue work --batch NAME --auto-complete'. The gap is the ergonomic entry + the bucket convention.

  Proposed shape:
  1. 'aida fasttrack <title>' (or 'aida add --fasttrack') = file approved + queue + tag batch:fasttrack + lifecycle:no-review (skip the human review phase) + lifecycle:no-build. The forked/implementer pass does it; no per-item human review.
  2. 'aida queue work --batch fasttrack --auto-complete' drains the whole bucket in one lifecycle-per-item pass (or a dedicated 'aida fasttrack drain').

  HARD BOUNDARY (non-negotiable): fasttrack skips the HUMAN-review ceremony + batches — it does NOT skip CI. CI still runs and must be GREEN before merge (never merge red, per feedback_verify_ci_green_before_merge). So use lifecycle:no-review, NOT lifecycle:no-ci-wait/trivial (which would merge optimistically). 'Without much ado' = no human gating, still integrity-gated.

  Scope guard: a 'is this actually trivial?' bar — fasttrack is for cosmetic/doc/one-line items, not behavior changes; the implementer can punt out of fasttrack if it turns out non-trivial. trace:EPIC-39
