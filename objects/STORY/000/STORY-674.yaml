  content: 'Scope addition (finding #5, 2026-06-23): the attach node-acquisition must also fix the LOCAL-only path. Verified: sibling init only registers a node when registry_remote.is_some(), so a local-only store defaults to node 1 and IGNORES ~/.aida/preferences.toml preferred_node_id (repo-a got TASK-1-001, not TASK-JM-001). For multi-clone LOCAL sharing this means every clone defaults to node 1 and their ids COLLIDE. Attach (and a fresh local init) must acquire a DISTINCT node id honoring preferred_node_id, for local-only stores too — not just the remote path.'
