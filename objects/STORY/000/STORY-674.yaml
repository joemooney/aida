  content: |-
    SCOPE CORRECTED by code-grounding + live proof (2026-06-24). The approved sketch assumed a second sibling repo needs a DISTINCT node id (acquire machinery, D1-D5). That premise is WRONG for the same-machine sibling case: load_node_id + load_dispenser both read from the STORE (store/.aida/node.toml, store/.aida/dispenser.toml), so two code repos sharing one store dir share one dispenser, which serializes allocation atomically. PROVEN live: manual attach (config + cache rebuild, NO node id) -> repo-b sees repo-as TASK-1-001; then repo-b/repo-a/repo-b adds -> TASK-1-002/003/004, ZERO collisions.

    Corrected scope (much smaller, strictly safer):
    - Sibling attach = write <repo>/.aida/config.toml (mode, store_path, store_type) + rebuild <repo>/.aida/cache.db. No seed, no save, no node acquisition, no store-git touch.
    - Entry point: a --attach (alias --join) flag on aida init; the BUG-610 refuse message points at it. Plain init on an existing store still refuses (no silent overwrite).
    - Node acquisition (preferred_node_id, suggest_free_node_id, hijack) stays the DISTRIBUTED multi-machine concern, already owned by aida node acquire — NOT this story.
    - Finding #5 (sibling init uses node 1 not preferred JM) is downgraded to cosmetic: the sibling shared-dispenser case does not need a distinct node, so node 1 is harmless. The distributed-acquire path already honors preferred_node_id. Drop from this story.
    Tests: seed a store, attach from a second repo, assert the pre-existing spec is visible AND both repos add without id collision (the live repro above, as a test).
