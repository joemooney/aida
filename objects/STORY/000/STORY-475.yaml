title: Remote/auth-capable AIDA MCP transport
description: |
  Add a remote HTTP MCP mode suitable for local loopback clients and future cloud-agent workflows. Acceptance: aida mcp-serve can run with HTTP transport on an explicit bind address; local token auth or equivalent protects write tools; audit log records tool name, caller identity if known, project, spec IDs touched, and result; docs explain stdio vs HTTP tradeoffs and safe deployment boundaries.

  ## ✅ Operator decision (2026-06-06 disposition sweep)

  DEFER until post-stability + a concrete remote/cloud-agent need — opening a network transport with token auth + audit log is exactly the new security surface to hold during the bugs-first phase (the High-priority tag predates that decision). When built, pair with STORY-474 profiles so a read-only profile is the default exposed over HTTP.
