title: Launch preflight skips specs whose approval still requires a sketch or advisor sign-off
description: |-
  ## Why
  2026-11-16: the product seat launched STORY-2854 and BUG-2620 on codex lanes while each was approved with a pre-code condition (sketch plus advisor sign-off, or an acceptance conflict needing triage). Both lanes ran a few minutes, posted, and punted to needs-attention, wasting slots while 26 PRs waited. The advisor (18:58) asked that this check live in the launch preflight.

  ## Acceptance
  1. Before claiming, aida queue work (and the fill-slots path) refuses a spec whose approval carries an unmet pre-code condition, such as a required sketch without a recorded advisor sign-off. The message names the condition and the command to record sign-off.
  2. The condition is structured data on the spec (a gate field set at approval), not prose parsed from comments.
  3. Once sign-off is recorded, the same launch proceeds without flags.
  4. aida list --status approved can filter launch-ready specs, so fillers pick only those.
