title: 'The AIDA Book: unified user-facing mdBook including the CLI manual as a section'
description: 'Build one mdBook over the curated USER-FACING doc set: Getting Started (getting-started/first-project) · Core Concepts (lifecycle + the split diagrams) · CLI Reference (EPIC-40 manual, included as a section) · Review & Autonomy (review-process/autonomous-drain) · Setup & Admin (storage-modes/multi-user/forge) · Using with Claude Code · Glossary. SUMMARY.md curates membership; working docs (plans/competitive-analysis/...) excluded. Decide nesting: one book with the CLI manual as a part, vs the CLI manual mdBook staying standalone and this linking to it. Acceptance: mdbook build is warning-free; cross-doc links resolve within the book; the CLI manual chapters are reachable as a section; no working-artifact doc is included. Depends on the library-index curation deciding what is user-facing.'
