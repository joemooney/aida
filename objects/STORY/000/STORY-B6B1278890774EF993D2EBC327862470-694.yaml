title: 'aida mandate renew: --ttl alias and start-flag overrides (e.g. --include-gate-paths)'
description: |
  Operator request 2026-11-13 11:04: `aida mandate renew` should take TTL and flag tweaks instead of forcing a stop + full `start` retype.

  Today renew keeps scope, flags and reason, and only takes `--for <DURATION>`. `start` names the same thing `--ttl`.

  Acceptance:
  1. `renew --ttl <DURATION>` is accepted as an alias of `--for` (same 24h ceiling). `start` keeps `--ttl`.
  2. renew accepts the start flags as overrides of the renewed mandate: `--ship-held`, `--drive`, `--include-supervised` / `--exclude-supervised`, `--include-gate-paths`, `--scope`, `--reason`. Any flag not given keeps the original's value.
  3. A renewal that changes flags records the before/after in the mandate lineage and prints a one-line diff (for example "include-gate-paths: off -> on"). Renewal with no overrides behaves as it does today.
  4. Renew stays human-TTY-only, as today; no new authority path.
  5. Tests: alias parity, one override round-trip, unchanged-flags renewal.

  Low risk, CLI and mandate-store only. Track: integration (operator: should not take all day).
