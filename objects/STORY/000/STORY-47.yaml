  author: joe
  content: 'Scope correction: this is a refinement for one-user-one-machine concurrent sessions only. Cross-developer races never existed because separate clones get separate node ids → disjoint blocks. The symlink approach in EPIC-20 v1 is fine for cross-machine work; STORY-47 closes the (narrow) same-user-same-machine race window.'
