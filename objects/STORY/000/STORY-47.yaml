agreed_id: STORY-47
title: 'EPIC-20 v2: per-session block allocation (sub-blocks)'
description: |-
  User-suggested 2026-05-09 alternative to v1's symlinked .aida-store/. Instead of sharing the orphan store via symlink (which has small write-race window), each session gets its own SUB-BLOCK carved out of the parent node's existing block range while the session runs.

  ## Design

  - At `aida session start`, the parent node's active block(s) get split: e.g., parent JM has FR-1..100 → session reserves FR-50..70 for itself, parent retains FR-1..49 + FR-71..100.
  - Each session has its own `.aida-store/` checkout (cloned or worktree on a sister branch like `aida-store-session-<id>`).
  - New reqs created in the session use the reserved sub-block — no race on `next` counter.
  - Existing reqs are effectively read-only from a session's POV; edits to existing reqs in two sessions create a real merge conflict on `session end` push (acceptable, rare).
  - New relationships and comments piggy-back on this: each session writes to its own copy of the affected req's YAML; merge resolution at session-end time.

  ## Why this is better than v1 symlink

  - No write races at all on adds (the only common mutation)
  - Mirrors AIDA's existing distributed-clones model rather than introducing a new sharing primitive
  - Failing a session push surfaces conflict the user can resolve, vs. silent data loss under symlink races

  ## Why v1 ships symlink instead

  - Sub-block math + sister-branch-per-session is a lift; v1 wanted to land in 1-2 hours
  - Symlinks have a small race window in practice (two adds in the same second from two sessions is rare for solo developers)
  - v1 unblocks the EPIC-19 doctor work today; v2 can replace the underlying mechanism without the user-facing surface changing.
