title: 'aida human unblock --interactive: human resolves hurdles inline before a drain'
description: |-
  Operator idea (2026-07-01): a human-interactive pass that sweeps the human-blocked set, resolves what it can WITH the human, and clears the runway before an automated drain. Reframed after discussion to EXTEND aida human unblock rather than add a new verb.

  Why extend, not a new verb: aida human unblock ALREADY classifies the open set deterministically by what keeps each spec out (needs-approval, under-specified, decision-pending, needs-design/hard-refused, blocked-by, build-supervised, deferred) and emits a paste-ready ADVISOR-delegate prompt. That classification IS the pre-flight report. A new sweep verb would duplicate it. So the only new work is the interactive-resolve strategy, best added as a mode on the same verb (surface-minimization / Trojan-horse simple-surface principle).

  Design:
  - aida human unblock (default, UNCHANGED): read-only, no writes, emits the advisor-delegate prompt. Invariant preserved.
  - aida human unblock --interactive (NEW): walks the same classified set and lets the human resolve each hurdle inline, reusing existing resolvers per hurdle type: needs-design/decision-pending -> the --guided dialog (AskUserQuestion + ADR capture, clears the tag); under-specified -> clarify acceptance / aida lint --fix; needs-approval -> approve/reject; blocked-by -> surface the blocker. Writes are the explicit opt-in.
  - Optional --then-drain: after the set is cleared, kick the burndown on the now-ready set.
  - Scope selectors mirror burndown plan: default approved+open, --batch, --epic.

  Motivation link: the needs-design gate is now a HARD refusal (TASK-1078 / #1307) that routes to --guided one spec at a time; this batch pass is the pressure-relief that lets the operator resolve all design hurdles in one sitting, then drain.

  Build gate: the interactive dialog is UX/design-laden + touches the human-escalation surface -> sketch-first sign-off with the operator BEFORE implementing (present the per-hurdle dialog shapes for approval). Slice as: (1) --interactive resolving the two cheapest hurdles (needs-approval, blocked-by surface) end-to-end, (2) wire --guided for needs-design/decision-pending, (3) --then-drain.
