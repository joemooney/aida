title: 'EPIC-36 Tier-2: threshold-triggered LLM health fact-finding (extend /aida-insights)'
description: 'Design-gated (needs sign-off on thresholds + scope). When a Tier-1 metric crosses a threshold, trigger LLM fact-finding: root-cause an anomaly (''divergence is N% → read the post-session classification + name the bug''), categorize unstructured failure reasons into buckets, synthesize a health narrative + recommended fixes. Extends /aida-insights (TASK-577) from usage-patterns to system-health. Expensive/occasional — gated by Tier-1 thresholds, not run blindly. Needs design sign-off on which thresholds trigger + cost controls before build. trace:EPIC-36'
