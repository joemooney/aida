  content: 'Design fork RESOLVED (advisor, 2026-06-12): use a STRUCTURED FIELD on the spec YAML — a ''processing_record:'' array parallel to the existing ''history:'' array — NOT a free-text comment and NOT a sidecar objects/RECORD file. Rationale: (a) durable + committed (rides the same orphan-branch write as history); (b) queryable (aida show surfaces it; structured, unlike a prose comment); (c) prunable (trim the array — fold into the archive sweep); (d) reuses the proven history-array pattern + write path, no new storage surface. Each entry: {ts, agent, brief_ref?, pr/commit, summary, decisions[], punted[]}. Populate at completion time from the brief + the implementer finish-checkpoint + the aida review verdict (promote those two gitignored artifacts into the durable field). This supersedes acceptance #1''s ''in/alongside the YAML'' with the precise form. Implementer: treat this as binding.'
