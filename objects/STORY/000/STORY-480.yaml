    Q1: Path-gated `.claude/rules/<glob>.md` scaffolding for per-folder conventions is monorepo-targeted, but AIDA today is a single-crate-workspace dogfood project with no monorepo users, and `aida init` does not scaffold a `rules/` dir or a `--with-rules` flag. Build it now?
      a) Reject — speculative monorepo feature; no users need it, over-engineering caution applies in the stability phase
      b) Minimal slice — `aida init` scaffolds `.claude/rules/README.md` documenting path-gating semantics only; skip the `--with-rules` starter templates and the `aida list --tag rules` surface
      c) Full story as written (README + `--with-rules` templates + discipline-pack docs + `aida list --tag rules`)
      REC: a — pure scaffolding for a use case (monorepo per-folder rules) that no current project hits; revisit when a real multi-feature/monorepo AIDA user appears. (Note: `.claude/rules/aida-specs/` already exists in this repo but is unrelated spec-markdown, not this feature.)
