title: 'Path-gated rules: .claude/rules/<glob>.md scaffolding for per-folder conventions'
description: |-
  Per 'Beyond the Prompt: Claude Code', '.claude/rules/*.md' files load only when working in matching paths (via glob). This is the right place for per-folder conventions (migrations folder rules, frontend rules, etc.) — they don't belong in CLAUDE.md bloating every session.

  AIDA's discipline pack is currently project-wide. For monorepos and multi-feature projects, path-gated rules are the next layer.

  Acceptance:
    • 'aida init' scaffolds .claude/rules/ directory with README.md explaining the path-gating semantics
    • Optional --with-rules flag scaffolds a few common rule templates (db-migrations.md, frontend.md) as starter examples
    • Discipline pack documents the path-gating pattern with a reference to .claude/rules/
    • 'aida list --tag rules' surfaces specs that touch rule files

  Source: docs/competitive-analysis/2026-05-26-... (Tier 2 actionable, monorepo / multi-feature UX).
