title: aida advisor handoff --to <project> --focus <topic> CLI command (SPIKE-10 Track A)
description: |
  Per SPIKE-10 strategic doc, Gap 2 implementation: `aida advisor handoff --to <project-path> --focus <topic>` generates a checked-in brief at `<child>/docs/<date>-advisor-handoff.md`. Five sections: parent identity (auto), vision (operator), decided things (auto-suggested + operator-pruned), substrate slice (auto-filtered by --focus), latitude (operator). Template under `aida-core/templates/advisor-handoff.md`. Composes with the `--focus` mechanism from the sibling story.

  ## ✅ Operator decision (2026-06-06 disposition sweep)

  DEFER post-stability — net-new strategic multi-project surface, off the current phase; no second-project demand pulling it. Keep as a backlog marker; build is speculative until a real handoff need appears.
