title: 'aida deputy slice 2: failed jobs in awaiting, completion mail, pause/resume, stop at mandate expiry'
description: |
  Slice 2 of STORY-HOME-099 (aida deputy), planned in the 03:30 signoff and carved out at the PR-3164 review (advisor, 2026-10-31 05:12). Covers the parts of 099's AC5 and the deferred items that slice 1 does not build.

  Acceptance:
  1. `aida awaiting` lists failed deputy jobs (job id, requester session, rc, log path) until they are acknowledged. (099 AC5, second half)
  2. When a job finishes, the requester gets mail with rc and log path; `submit --wait` is unchanged.
  3. `aida deputy pause` / `resume`: a paused deputy claims no new jobs, and running jobs finish.
  4. The deputy exits cleanly when the operator's mandate or grant expires, and refuses new claims after that point. Tested with a short-TTL grant fixture.
  5. The slice-3 tty policy hooks named in the 099 sketch are stubbed with refusals, so no silent fail-open.
  Gate: STRICT (authority-bearing).
