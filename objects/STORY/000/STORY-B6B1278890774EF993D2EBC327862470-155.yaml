  content: 'ADVISOR RULING 2026-10-31 11:25: PR-3172 round 1 is CHANGES REQUESTED; it is functionally sound and the behaviour tests exist. ONE round, everything in one push: (1) trace every test to its criterion ID so ''aida criteria STORY-HOME-155'' reports none untested; (2) add a test for the authority-raising resume refusal: a paused or expired deputy cannot resume jobs under a grant it no longer holds; (3) the AC5 slice-3 delegation stub must refuse ANY delegation/tty policy field it does not implement (an allow-list of known fields, fail closed), not one exact field name. Test it with an unknown field. Acceptance item 0 (the operator''s live smoke) is NOT a merge gate. Gate: STRICT targeted deputy tests plus make check-ci-fast. No force push.'
