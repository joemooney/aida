title: 'aida node hub add: register a second writable hub under an enrolled root and grant it a child pool per type'
description: 'Split from STORY-HOME-164 by advisor signoff 2026-10-31 13:56 (Q3). After STORY-164 lands: ''aida node hub add <name> --url <url>'' refuses without an enrolled root (names ''aida node enroll-root''); writes the [store.hubs] entry; the root grants a child pool per type in use, homed on the new hub, carved from the root pool''s free_ranges (excludes every existing block); the grant is pushed by CAS to the root''s hub and reaches the new hub by sync or bundle; clones on the new hub claim through the PR-3170 delegated path with upstream=<new hub remote>. Tests: grant disjoint from all pre-grant blocks; refusal without root; a clone on h2 claims from the h2 pool. Docs: storage guide multi-hub section; help golden. Depends on STORY-HOME-164.'
