  author: joe
  content: |-
    ## Implementer findings (draft TASK filing is blocked in this sandbox: read-only ID allocation; recorded here for advisor triage)

    1. **followup-suggestion / minor:** a hub's pool is one fixed grant per type (`hub:<name>:<TYPE>`, `--size`, default 1000). Once it runs out, delegated claims are refused, and re-running `aida node hub add` grants nothing more for that type because the pool id already exists. Growing a hub needs a second pool per type that `hub_grant()` and `place_claim` also recognise.
    2. **design-choice / minor:** "types in use" means every type with a block or pool (never `*`); a type first used later is granted by re-running hub add (idempotent). The root's own hub is the declared hub its `origin` reaches; adding it only declares it. A legacy rooted store with no root pool for a type gets `hub:<root hub>:<TYPE>` materialized in the grant commit (refused if no declared hub is reached by origin). A non-root clone claims (ClaimAuthority::Delegated) only with a declared upstream reaching a granted hub. Granted pools raise the floor for the root's own claims, single-hub claims and the agreed-ID backfill. Child pool holder_node is `hub:<name>`.
    3. **verification gap:** aida-cli-lib cannot be compiled within this seat's 60s per-call limit, so the node_hub unit tests, the two new story_164 integration cases (`hub_add_without_an_enrolled_root_refuses`, `hub_add_grants_a_disjoint_pool_a_clone_of_the_new_hub_claims_from`) and the hand-edited help golden are verified by CI only. aida-core lib+tests type-check locally; fmt, help-golden co-change, portability, git-maintenance, glyph and trace-header gates pass.
