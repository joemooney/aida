title: 'Cross-project search: aida search --all-projects'
description: |
  Walk the registry, run search across each project's cache, merge results with project prefix.

  ```
  aida search "session lease" --all-projects
  [aida]        STORY-48  Session lease enforcement on edit (...)
  [aida-tutor]  STORY-29  Exercise: session start (...)
  ```

  ## Acceptance

  - [ ] `aida search Q --all-projects` walks registry
  - [ ] Per-project results show project prefix
  - [ ] Results merged-and-ranked (or grouped — pick one based on UX testing)
  - [ ] Slow path: search each project sequentially (registry size is tiny — single-digit count)
