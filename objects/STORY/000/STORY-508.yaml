title: '[EPIC-35 s2] Forge-aware hint/error text (replace hard-coded ''gh ...'' user-facing strings)'
description: 'Size S, separable from s1. Replace hard-coded `gh run view` / `gh api /rate_limit` / etc. HINT and error strings with forge-aware text via `forge.cli_name()` + templates, so GitLab/pure-git users aren''t told to run gh. Distinct from the trait (these are user-facing strings, not invocations). Acceptance: no user-facing hint names a forge CLI the active provider doesn''t use.'
