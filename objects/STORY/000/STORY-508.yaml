  content: |-
    Scoping correction (2026-06-05, advisor loop): the 'Size S' estimate is optimistic. `gh` appears across **12 source files** (98 occurrences in main.rs alone), and the user-facing-hint subset must be disentangled from real `Command::new("gh")` invocations site-by-site. Three real costs:
    1. The fix isn't a `cli_name()` swap — GitHub `gh pr view` → GitLab `glab mr view` changes the NOUN (pr→mr) and sometimes the verb, so it needs a small forge-hint templating helper (e.g. `ForgeKind::change_noun()` + `pr_command_hint(verb, n)`), not just the existing `cli_name()`.
    2. Many hint sites lack `project_root` in scope — threading `resolve_forge_kind(project_root)` (or a resolved ForgeKind) to ~25 call sites across auto_complete.rs / pr_ship.rs / pr_rebase.rs / workflow_hints.rs / network_retry.rs / status_cleanup.rs / drain_state.rs / punt.rs / state_snapshot.rs / cli.rs / main.rs is the bulk of the work.
    3. Existing tests hardcode `gh pr merge <n>` literals — they need forge-aware rewrites.

    Re-estimate: **Size M**, best done as a focused fresh-context pass: (a) land the hint-templating helper on ForgeKind with unit tests, then (b) sweep call sites file-by-file. SAFE throughout (cosmetic text, zero blast radius — worst case a hint still says `gh` for a GitLab user, same as today), so it's a good candidate for an unsupervised pass once scoped. Not started this session to avoid a sprawling/incomplete sweep at the tail of a deep context.
