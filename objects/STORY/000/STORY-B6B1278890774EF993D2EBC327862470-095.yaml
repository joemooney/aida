title: 'Hierarchical block delegation: upstream nodes dispense ID blocks to downstream nodes via push/pull'
description: |-
  ## Problem
  Since BUG-2017, only a clone marked `authoritative = true` in its common git dir may dispense blocks, and no command exists to mark one. The primary HOME clone was never enrolled, and its move to a pseudonymous node binding orphaned the blocks registered to legacy node "1" (BUG next 2225, FAQ next 63, TASK next 2360). Every clone therefore issues node-local `<TYPE>-<node>-<n>` IDs, `blocks-then-fallback` downgrades silently, and nothing promotes those IDs to short ones. A single enrolled clone also cannot serve multi-level topologies (a WORK clone behind a GitLab hub, laptops behind HOME).

  ## Proposal
  Hierarchical block delegation. One root owns the unallocated ID space. Each node declares one upstream and claims blocks only from that upstream's pool, by a CAS push to the upstream's ref during `aida push`/`aida pull`. Intermediate nodes hold larger pools and top them up from their own upstream. Authority comes from a block's lineage back to the root, not from a per-clone flag. The root role can be transferred.

  ## Acceptance
  1. Root: exactly one node per store lineage is root, set by an explicit operator command run on that clone. It is HOME initially. `aida node transfer-root <node>` hands the role and the unallocated space to another node; the old root becomes that node's child; existing blocks stay valid; no renumbering.
  2. Declared upstream: each non-root node has exactly one `allocation.upstream` (a git remote name). Cycles are refused. A remote that is not the declared upstream (e.g. a store mirror) never accepts or confers claims.
  3. Lineage: every block records the pool it was carved from, back to the root. A node dispenses only from blocks whose lineage reaches the root through its own upstream chain. A block that merely appears in an imported store, with no valid lineage to this node, is never spendable (keeps BUG-2017's intent).
  4. Claim: claiming moves a range from the upstream pool to the node in one store commit, pushed to the upstream ref with CAS. A non-fast-forward fetches and retries. Two siblings racing never both receive the same range (test).
  5. Replenish: when a node's block for a type drops below LOW_THRESHOLD, the next `aida push`/`aida pull` that reaches its upstream claims another, with a one-line notice. Intermediate pools replenish from their own upstream the same way. `aida add` never waits on the network.
  6. Offline: with no spendable block, `aida add` issues node-local IDs as today. Once the node holds a block it promotes its own node-local IDs into it, keeping UUIDs and old IDs as aliases; repeat promotion is idempotent.
  7. No silent downgrade: when blocks are configured but unusable, `aida add` says why once per session (no upstream, no lineage, exhausted and offline). `aida node show` reports root/upstream/pool/blocks.
  8. Migration: an operator-run, dry-run-first command enrolls HOME as root, attaches every open block in `blocks.yaml` to a pool, moves legacy node "1"'s open blocks to HOME's current binding, and reports conflicting or unattributable ranges without picking a winner (reuses BUG-2017's reconciliation preflight).
  9. Supersedes BUG-2017 acceptance item 4 ("only the authoritative clone may claim/dispense") and its single-HOME operating model; items 1-3 and 5 still apply (no authority from env/forge URLs, pseudonymous bindings, refuse-before-write, full-conflict preflight).

  ## Non-goals
  Signatures or key enrollment; defending against a malicious writer to an upstream ref (trust = push permission on that ref); reclaiming unused ranges from dead nodes (later).


  ## Advisor ruling — slice 1 round 1 (PR-3108 @ 4efcb0f3, 2026-10-29 17:25)
  Rework on the EXISTING PR-3108 branch; do not open a new PR. Rule-once: everything below is the whole round; no follow-up PRs.
  1. BLOCKING CI contracts: docs/cli/10-storage.md:292 cites `aida node claim`, which does not exist yet. Describe the future claim step without citing a command. Re-run python3 docs/cli/verify-manual.py with the PR binary on PATH.
  2. BLOCKING CI rest: aida-core/src/tests/allocation_lineage_tests.rs:425 `allocation_lineage::tests::enroll_root_commits_the_root_record_once` panics at :425:39 in CI (main is green). Run it with the CI feature set (cargo test --profile agent -p aida-core --lib --features postgres,gitlab,github,jira enroll_root_commits_the_root_record_once); likely an environment assumption (git identity / repo fixture / feature-gated path). Fix the code or the fixture, not the assertion.
  3. Fix (bundled): aida-cli-lib/src/node_cmd.rs:853 handle_upstream must fail closed when the project root / sync config cannot be read (no silent acceptance of a mirror remote as upstream). Add a refusal-path test.
  4. Fix (bundled): aida-core/src/allocation_authority.rs:346 first_notice_this_session must remember every reason seen in the session (per type), reset on session change; add a test alternating bug/task/bug.
  5. Fix (bundled, partial): `aida node show` flags a mismatch when the local role says root but registry/root.yaml names another holder. ACCEPTED as deferred to slice 2 (per R8 slicing): effective_policy refusing on mismatch.
  6. Cosmetic (bundled): allocation_lineage.rs:207 cycle message reads "lineage of pool p reaches a cycle" for off-cycle pools; allocation_lineage.rs:497 block_lineage rustdoc + docs/cli/10-storage.md note that slice 1 validates only the immediate parent's home_ref.
  Validate: the targeted tests for 2–4 plus make check-ci-fast. LIGHT tier.
