  content: 'REQUEST_CHANGES on PR-1520 (recorded as PR comment https://github.com/joemooney/aida/pull/1520#issuecomment-5016925321 — GitHub blocks a request-changes review from the author''s own account). The deferred-field preservation is sound and well-tested, but including failure_reason in preserve_full_save_only_fields regresses BUG-405: auto_bump_done_to_completed and handle_db_reconcile_status both clear failure_reason inside storage.update_atomically (full GitBackend::save), and the new helper resurrects the stale disk value on flip-to-Completed. Secondary: CachedGitBackend::save rebuilds the cache from the degraded incoming store, so preserved deferred flags stay invisible to cache-backed views until an unrelated rebuild. Fix: drop failure_reason from the preserve list (+ regression test) and rebuild the cache from the actually-written state. STORY-777 left In Progress.'
