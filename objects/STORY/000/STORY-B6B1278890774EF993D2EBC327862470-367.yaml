    Findings:
    1. [major] CI red at fce726766cb (main 50ce509da3f green on the same shard): CI (lib-0) 'Run tests' passed but 'Test time budget' failed (run 42224787380, job 127915426021). Logs could not be read from the review sandbox (log blob host denied), so the over-budget test is unidentified. Likely cause: lib tests that spawn the aida binary built for lib unit tests get the non-test DEFAULT_PAUSE of 3s (forge_confirmation.rs:15-19; it is 0 only under cfg(test) inside the lib), or they hit observe_metadata_with_retry's real retry sleeps (forge.rs observe_metadata_with_retry). Fix: find the test in the uploaded timing artifact, set AIDA_FORGE_CONFIRM_PAUSE_MS=0 (and a zero retry delay) in the binary-spawning lib harness, and get lib-0 green.
    2. [major] Advisor ruling F5 (STORY-2401 comment 2026-11-06 12:41 UTC, 'ALL accepted, in scope for THIS PR, none deferred') is unaddressed. It requires typing the gate's settled refusals as Known(Err), so a refused member is ejected (restoring BUG-2214) and the train is not suspended, plus a live-path test. LiveTrainForge::observe_gate (pr_train.rs ~2289-2297) still maps every gate Err to Transient. So in ForgeRails::land, a new hold, withdrawn approval, lapsed mandate or draft member suspends the whole train with every member retained. story_2401_live_preland_gate_refusal_suspends asserts the opposite of the ruling, and docs/plans/2026-11-06-story-2401-confirmed-negatives.md:112-121 records suspension as deliberate. Fix: give the live gate typed outcomes (settled refusal -> Known(Err), unavailable secondary read -> Transient), eject on Known(Err), and flip the live-path test to assert ejection with the hold intact.
    3. [minor] Deterministic train CI failures can no longer eject. wait_train_ci's missing-required-check registration bound and its settle ceiling (pr_train.rs ~790-801) now return TrainCiUnavailable, which suspends, and bug2423_missing_required_check_timeout_ejects_members was flipped to story_2401_missing_required_check_timeout_suspends_members. A required check that never registers for these members (path filter, stale CI definition) re-trains the same members every run, spending CI, and never surfaces a reason on the member PRs. Add a bound (eject or route to the advisor after N consecutive suspensions for the same member set), or get an explicit advisor ruling that this waits for AC4's workflow-digest slice.
    4. [minor] review_watch retryable_fetch has no cap. An attempt that failed on FetchUnavailable is excluded from the Skip guard and never consumes setup_retry (review_watch.rs select(), ~1319 and ~1338), so a persistent fetch failure (revoked credentials, removed remote) relaunches a reviewer dispatcher on every watch tick indefinitely, each relaunch costing three 30s-bounded fetches with pauses. Cap consecutive fetch-unavailable relaunches per head, or back off, and test the cap.
    5. [minor] Prior finding 3 is only partly fixed. receipt() (forge_confirmation.rs:147-193) now accepts a 'Merge pull request #N from' subject, but a PR landed by GitHub rebase-merge whose head is absent locally is still Merged on the forge and Known(false) on Git. metadata_for therefore returns Pending('forge state conflicts with Git evidence') on every sweep and never grants credit or cleanup. Low impact (aida squash-merges), but either fetch refs/pull/N/head into the private confirm ref when the head object is missing, or file a follow-up.
    6. [cosmetic] Partly unmet F2 (confirm only before an authorizing answer): phase_driver.rs:771 (publication retraction) and close_abandoned_train (pr_train.rs ~1745) call forge_confirmation::metadata(), whose actionable predicate is always true. A first read that authorizes nothing (not Open, so NoLongerOpen or a refusal) still pays the confirmation pause plus a base fetch. Use metadata_for with |m| m.state == Open.
    7. [cosmetic] Historical commit d726665ca8f still has the non-descriptive bare-trailer subject 'chore(seat): work native Codex lane ... (STORY-2401)'. This is mitigated because the head is a merge commit and the squash takes the PR-title Refs subject; reword it only if the branch is rebuilt.
