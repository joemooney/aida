    3. [minor] on_base with an absent local head falls back only to the '(#N)'/(!N) squash-subject receipt (forge_confirmation.rs receipt()). A PR merged by GitHub merge commit ('Merge pull request #N ...') or rebase merge whose head is not fetched locally is then Merged on the forge but Known(false) on Git, so confirm_snapshot reports Pending('forge state conflicts with Git evidence') forever (pr_is_merged_with_sink None, so no credit). aida squash-merges, so impact is low. Either also fetch refs/pull/N/head into the private ref when the head is absent, or match the merge-commit subject, and add a test.
    4. [cosmetic] The historical content commit d726665ca8f still has the non-descriptive bare-trailer subject 'chore(seat): work native Codex lane ... (STORY-2401)'. The round-2 completion risk is mitigated: the head is a merge commit, so derive_pr_ship_squash_subject_from_message (pr_cmd.rs:5306) yields the PR-title Refs subject for the squash. Rewording it when the branch is next rebuilt is optional.
