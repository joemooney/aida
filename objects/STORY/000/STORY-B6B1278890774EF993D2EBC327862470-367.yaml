    Findings:
    1. [major] CI red at bca424a8dda (main 066c1609bf8 green): CI (lib-1) 'Run tests' failed and CI (lib-0), CI (lib-1), CI (cli-0) 'Test time budget' failed (run 42206414979). Job logs could not be read from the review sandbox (log blob host denied), so the failing test names are unverified. The CI annotations show aida-cli::task_1335_reconcile_unavailable_evidence tests at 21-28s against a 15s budget (about 5s on main). Likely cause: forge_confirmation::backoff (forge_confirmation.rs:10) is an unconditional 3s thread::sleep with no injectable or configurable seam, called on production paths that binary-level tests exercise: reconcile_evidence.rs:181 confirm_clear (every Clear search now sleeps 3s), pr_train.rs:1769 abandoned-train owner confirm, :2468 confirm_ci_refusal, :2523 confirm_not_landed, review_watch_forge.rs:335 retry_fetch and forge_confirmation::metadata_for. The new real-git test story_2401_closed_train_receipt_and_absent_squash_head_real_git also calls metadata() twice with the real backoff. Fix: make the confirmation pause configurable (e.g. a config/env knob read by backoff() that the test harness sets to 0), or thread an injectable pause through these call sites. Re-measure, and add budget entries only with measured evidence. Identify and fix the lib-1 Run tests failure, then get every CI shard green at the new head.
