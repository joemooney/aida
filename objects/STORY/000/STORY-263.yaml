- id: 019e33be-9b2a-71e3-bcf4-fb257216607c
  author: joe
  content: |-
    ## Headless-uncertainty gate 2026-05-16

    User flagged honest concern: *\"I don't know if claude will run headless or likes to run headless.\"*

    The original STORY-263 framing assumed headless Claude works cleanly for AIDA's skills. **This assumption is unverified.** Real risks:

    - Tool permissions might fail headless (Edit, Write, Bash requiring approval)
    - Skills designed around interactive feedback (\`/aida-pickup\`, \`/aida-review\`) might produce incomplete output
    - Mid-task pauses (\`feedback_pause_for_design_input.md\`) can't happen headless; Claude has to guess
    - Long-running implementation work might time out
    - Resume semantics after headless kill might or might not work

    ### Gate this STORY on SPIKE-NEW (headless investigation)

    Filed sibling SPIKE: investigate \`claude -p \"/aida-skill-name args\"\` empirically. Time-boxed 2-4 hours; produces \`docs/spikes/2026-05-16-claude-headless.md\` with findings.

    STORY-263's scope adjusts based on the spike outcome:

    - **Headless works cleanly**: ship as scoped (--no-human full mode)
    - **Headless works with caveats**: ship the variant(s) that work
    - **Headless unreliable**: reframe to \"minimize human prompts\" mode that keeps interactive fallback
    - **Headless unusable**: STORY-263 stays Approved as future work; bash worker (TASK-294) does what it can with interactive Claude

    ### Pragmatic intermediate: extend TASK-294's watchdog

    Even before STORY-263 lands, TASK-294's watchdog (per its updated comment) handles the case where a Claude session hangs (interactive OR headless). Worker auto-pauses; user investigates.

    So we're not blocked on STORY-263 to get useful autonomy progress — we have the worker MVP + watchdog as the immediate step.
  created_at: 2026-05-17T02:23:10.122330175Z
  modified_at: 2026-05-17T02:23:10.122330175Z
- id: 019e33e5-9dfb-7713-b359-b7acee8da76b
  author: joe
  content: 'SPIKE-7 (gating spike) is complete — see docs/spikes/2026-05-16-claude-headless.md. Verdict: headless claude -p is viable for --no-human; STORY-263 proceeds, scoped. Design must absorb: (a) launch with --permission-mode bypassPermissions --output-format stream-json --verbose --session-id <uuid>, never --bare; (b) the orchestrator''s completion check is the detection model — exit code is insufficient, parse the final result event and treat non-empty permission_denials as ''needs human -> re-queue/escalate''; (c) human gates (reviewer merge decision, any AskUserQuestion skill pause) cannot be answered headless — they become clean no-ops, so compose the headless reviewer with --auto-complete''s autonomous-merge path rather than an AskUserQuestion gate; (d) caller-side timeout is mandatory (no built-in wall-clock limit); (e) ~$3/spec — design in --max-budget-usd caps + a --model knob; (f) worktree store-provisioning + non-interactive aida flags must be solved for a worktree-per-task drain. The watchdog is for genuinely-stuck long runs, NOT pauses — pauses fail fast.'
