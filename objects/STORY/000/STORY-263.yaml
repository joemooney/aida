    ## Scope clarification 2026-05-17 — REVIEWER-ONLY first cut is the authoritative ship

    The 22:03 comment expanded scope (skill audit, AIDA_NO_HUMAN env var, /aida-punt mechanism). Per \`feedback_refinements_must_be_acceptance_criteria.md\`, comments aren't binding — the ## Acceptance section is.

    **Authoritative scope for THIS implementer pickup**: ship the **reviewer-only first cut** per SPIKE-7's explicit recommendation:

    - \`--no-human\` flag (canonical; \`--unattended\` and \`--headless\` as aliases)
    - Headless **phase 3 (reviewer)** only — \`claude -p\` with bypassPermissions, stream-json output, watchdog timeout
    - **Phase 1 (implementer) stays interactive** — too risky without /aida-punt mechanism
    - \`--no-human\` and \`--no-human=reviewer-only\` are equivalent (the granular form is just for forward-compat)
    - Composes with \`--batch + --auto-complete\` (already shipped via TASK-285)

    The deferred work (headless implementer, skill template audit, /aida-punt integration, additional watchdog refinements) gets its own specs, filed by dialog as follow-ups. NOT part of STORY-263.

    This matches SPIKE-7's verbatim recommendation: *\"the headless REVIEWER phase is so much safer than headless implementer — could ship reviewer-only as a first cut even pre-alpha.\"*
