title: Land/train completes trailer specs at merge, not on the next human pull
description: |
  Gap found 2026-11-22 (product-15; advisor-122 ruled it a gap, not a regression). Merge-time spec completion is pull-side: the trailer scanner reads trailing spec parens on main commits only when someone runs `aida pull`. Train landings (#4377 at 12:36, #4385 at 13:46) therefore leave their specs at Done until a human pulls the primary. BUG-2707 sat at Done after landing and was completed by hand.

  ## Acceptance
  - AC1: When land/train merges a change, the specs in the landed commit's trailing parens (skipping a final `(#N)` group, and never Refs-only ones) are completed at merge time by the landing actor, without waiting for a pull.
  - AC2: A later `aida pull` is idempotent for specs already completed this way.
  - AC3: A test covers a train landing whose squash subject ends in `(SPEC-ID) (#N)`.
