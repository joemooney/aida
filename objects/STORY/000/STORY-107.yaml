    ## Doc seed empirical update: /ultraplan cost (2026-05-13)

    Confirmed via direct invocation (STORY-86 planning request):

    **/ultraplan launched directly with NO cost prompt.** Unlike /ultrareview which displays "~5-10 min · Est. cost $5-$20 USD" before launching, /ultraplan just shows:

    > ◆ ultraplan ready · https://claude.ai/code/session_XXXX

    Combined with the help text:

    > Remote plan mode with rich web editing experience.
    > Runs in Claude Code on the web. When the plan is ready,
    > you can execute it in the web session or send it back here.

    **Empirical conclusion**: /ultraplan is included in the Claude Max subscription at no per-use cost. The free-tier behavior matches the agent's earlier research summary ("Included with Claude Code on the web subscription").

    ### Confirmed cost matrix for AIDA's positioning doc

    | Tool | Cost on Claude Max |
    |---|---|
    | /aida-review (local) | Free — within existing claude session |
    | /aida-pickup, /aida-pr, /aida-document (local skills) | Free — same |
    | /ultraplan | **Free with Max subscription** — no per-use cost |
    | /ultrareview | **$5-$20 USD per use** beyond 3 free uses |

    ### Implication for daily workflow

    /ultraplan is now a **viable daily tool** for substantial work items (any STORY or EPIC scope). Use cases:

    - Pre-implementation: `/ultraplan plan implementation of STORY-N` to draft the approach before coding
    - Refactor scoping: `/ultraplan plan migration of X to Y` to surface risks + file changes
    - Multi-PR features: break a big EPIC into a sequenced plan

    vs /ultrareview which stays reserved for genuinely high-stakes review (per its cost).

