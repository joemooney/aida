title: 'EPIC-51 Slice 1: PTY suspend/resume mechanic — prefix key SIGSTOPs the chat child, overlay, SIGCONT + clean repaint'
description: 'First + riskiest slice of EPIC-51, isolated. A free TUI prefix binding (Ctrl-a p, mnemonic palette/pause) intercepted by the TUI (never forwarded to the chat): SIGSTOP the chat PTY child process group, show a minimal "paused" overlay, then on a resume key SIGCONT the child + repaint the screen from the existing vt100::Parser state (same path as tab-switch repaint). Prove ZERO chat disruption (no terminal corruption, conversation continues). Unix-only (POSIX signals + PTY). Keyboard-verified by the operator in a live aida tui session — cannot be headless-tested.'
