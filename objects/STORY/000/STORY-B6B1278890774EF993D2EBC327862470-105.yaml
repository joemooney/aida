  content: 'BACKFILL DRY RUN (Q3), run on a COPY of the live store at 2026-10-31 ~10:20; nothing was written to the live store. Command: aida doctor --fix agreed-ids --dry-run --mapping FILE. It plans 406 agreed ids: BUG 53 (BUG-2317..BUG-2369), EPIC 3 (EPIC-609..611), FAQ 8 (FAQ-140..147), SPIKE 3 (SPIKE-705..707), STORY 161 (STORY-2041..STORY-2201), TASK 178 (TASK-2415..TASK-2592). Why 406 and not the census''s 270: 397 b6b specs now have no agreed id (filed since 10-29), plus 8 FAQ specs from node a65b4bf5..., plus 1 node-1 spec (TASK-1-499). Each type continues past the highest number used anywhere: native or agreed ids, block range_end, and the merge-gate counter (registry/agreed_counters.toml lags far behind, e.g. STORY=82). Apply needs the root and --yes. It sets agreed_id, raises agreed_counters to the max assigned, and appends one fully spent ledger block per type, all in one store commit. spec_id is never changed, so local ids, trailers and trace comments keep resolving. Post-merge advisor steps: (1) aida node enroll-root in /home/joe/ai/aida; (2) aida doctor --fix agreed-ids --dry-run, re-check the counts (numbers shift if specs were filed meanwhile); (3) aida doctor --fix agreed-ids --yes. Exclude the 8 a65b FAQ specs only if you want b6b alone; merge-gate would give them agreed ids anyway.'
