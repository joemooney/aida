  content: 'IMPLEMENTER DEVIATION (needs a follow-up TASK; I could not file one because the sandbox refused both the aida add counter write and the MCP file_finding tool): the node-1 to b6b local-ID migration with BUG-1-mmm aliases from the 2026-10-29 22:00 ruling did NOT ship. Requirement has no per-object alias list, and node_alias maps whole labels, so it cannot map BUG-1-mmm to a differently numbered b6b id. The migration needs a new former_ids field indexed by every resolver (git_backend numeric_twin_stems/agreed_id_holder, the store''s spec_id_index_exact, cache.db, id_collisions, admission ownership), which is its own data-model sketch. The 411 node-1 specs that have agreed ids resolve bare today. The backfill gives the 1 node-1 spec without an agreed id an agreed id.'
