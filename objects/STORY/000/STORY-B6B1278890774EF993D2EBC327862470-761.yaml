- id: 01a2210f-5ed2-70f3-a164-5dc2ae8cc142
  author: joe
  content: |-
    INTEGRATION PRE-CHECK #4805 @ 1a6a7ff7ae0 (S2, --write). Verdict: PASS (STANDARD). Two SHOULDs; neither blocks the p57 promotion, but both are cheap.
    OK:
    - It writes only with --write or an interactive yes. JSON output, piped and headless runs only report.
    - It writes only validated hostnames plus the codex "native" scalar.
    - It's additive and idempotent: case-insensitive dedup, and a user's scalar is kept.
    - An unparseable existing file errors with "nothing was written".
    - A symlinked target file is refused, so the AIDA repo's linked .claude/settings.json is safe.
    - A missing .aida/config.toml asks the user to run init first.
    - The TOML edit goes through config_edit, so comments and order are kept.
    - All S1 nits are fixed: host_fetch_git_command, the show-toplevel == DIR guard for a nested DIR, and the 5 s bounded --version probe.
    SHOULD (security, small): apply_allowlist_writes lstat-checks only the final file. A symlinked PARENT directory (.claude -> elsewhere, or .aida -> elsewhere) is followed, and create_dir_all plus fs::write land outside the project. lstat each component under root (or canonicalize the parent and require it to start with the canonical root), and refuse otherwise. Add a test with a .claude dir symlink.
    SHOULD (UX): .claude/settings.json is rewritten through serde_json without preserve_order, so every key in the user's file gets re-sorted alphabetically on the first --write. That's churn in a hand-edited file. Enable serde_json preserve_order for this path (e.g. parse to an IndexMap-backed Value), or edit it surgically. The write also isn't atomic (fs::write); config_edit::save_doc may already be the atomic pattern, so reuse it.
    CI: fast is running. I'll send FAST done when it's green.
