title: 'aida digest --throughput: landings, gaps, opened/completed/closed and rework rate per window, review stories separate'
description: |2


  Scope (advisor 13:58, product seat batch): `aida digest --throughput <windows>` (for example 1h,24h,7d). Per window: landings on main with the gaps between them (longest gap, count of gaps over 60 min); specs opened, completed and closed (rejected or superseded); rework rate (PRs that took a CHANGES REQUESTED verdict or a red full run, over PRs landed). Review PR-N stories are counted separately from product specs. Human and --format json output. Acceptance: 1. the fields above per window; 2. a JSON fixture test over a synthetic store; 3. completed counts use completed_at, so this depends on BUG-2597 (blocked-by until that lands). Integration track.
