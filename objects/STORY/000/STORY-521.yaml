title: 'EPIC-35 forge-routing remainder: orchestrator ci-watch + create/list/comment/checkout ops'
description: |-
  Tracks the gh call sites STORY-516 did NOT route before it auto-completed. (STORY-516 shipped the bulk — merge TASK-668/669, view PR-538, ci point-probe TASK-672, ci-watch[pr-ship] TASK-674 — then got stuck Completed because PR-538's commit permanently trailers (STORY-516), so every `aida pull` re-bumps it. This open STORY, referenced by no commit, is the durable tracker.)

  REMAINING OPS (SPIKE-49 order, each its own PR + CHILD-TASK trailer + dogfood via aida pr ship; reliability-critical → keyboard):
  1. ci-watch (orchestrator / --watch-ci): route `watch_ci_for_context` → `gh run watch` streaming + the non-streaming poll-wait + headless variants, and `gh run view`. Different mechanism from the pr-ship `gh pr checks --watch` already routed via Forge::watch_ci.
  2. create: `gh pr create` → forge.open_change (already real; route the call sites in /aida-pr + ship).
  3. list: `gh pr list` — `detect_open_pr_for_spec` (spec-search) + `detect_merged_pr_for_branch` (--state merged) → forge.list_changes (already real).
  4. comment: `gh pr comment` → forge.comment.
  5. checkout: `gh pr checkout` → forge.checkout_change.

  PROVEN PATTERN (4×): forge-owned result type mirroring the rich main.rs type + GitHubForge DELEGATES to the existing battle-tested helper + pure tested mapping fn + crate helper callers swap to. Zero classification reimpl → contracts preserved. Details + warnings in memory project_forge_plumbed_not_wired.
