  content: |-
    Scope addition 2026-05-24: ORPHAN QUEUE ENTRIES are another drift category 'aida doctor' should detect + heal.

    Symptom: reviewer/implementer queue contains entries displayed as '??? (deleted) [for:reviewer] auto-queued by session end (019e581f); covers 1 spec'. The underlying SPEC-ID is no longer resolvable (deleted, ID reallocated, or YAML missing); the queue entry references it by lease/session UUID but can't render a title.

    Two occurrences observed tonight (reviewer queue positions 2-3 initially; now at 10-11 after more entries accumulated).

    10th doctor category: **orphan-queue-entries** — queue entry references a SPEC-ID that no longer resolves in the substrate. Heal action: 'aida queue remove' the orphan entry (use the underlying UUID, not the SPEC-ID). Provide --dry-run that lists them; --heal that removes them.

    Composes with TASK-537 ('aida queue prune --orphaned') — same friction class; 'aida doctor heal orphan-queue-entries' subsumes that TASK. Mark TASK-537 superseded-by-STORY-462 once doctor ships.

    — master (filed during a multi-agent session where these accumulated)
