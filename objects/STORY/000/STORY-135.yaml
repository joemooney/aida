title: 'AIDA TUI crash recovery: .aida/tui-state.json + re-attach orphaned sessions'
description: 'A TUI crash kills the PTY children but Claude conversations are durable .jsonl files (TASK-112). ''.aida/tui-state.json'' records each tab''s {session_id, scope, role, worktree} on spawn/exit. On relaunch ''aida tui'' reads the state file, lists orphaned sessions, and re-attaches each via ''aida queue work <scope> --resume <session_id>''. A graceful ''prefix d'' detach quits the TUI without killing children. See docs/plans/2026-05-15-epic-26-tui.md (Files: aida-tui/src/state.rs).'
