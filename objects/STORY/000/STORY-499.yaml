title: Diff-level trace-coverage check in CI (gated on the coverage-definition spike)
description: |
  Gap #1 of EPIC-34: enforce (or report) that a PR's diff actually carries // trace: coverage over the code it changes, per the definition + exemptions settled by the coverage-definition spike. Draft until that spike lands a go decision — building this before the definition is settled would ship a gate that false-positives on every legitimate test/refactor PR.

  ## Acceptance (to be sharpened by the spike)
  - A PR adding un-traced coverable code (per the spike's definition) is flagged/blocked per the configured posture.
  - Exempt categories (tests/generated/docs/mechanical) are not flagged.
  - Default posture matches the spike's recommendation; the block-vs-report dial is per-repo config.
  trace:self

  ## ✅ Operator decision (2026-06-06 disposition sweep)

  KEEP GATED on SPIKE-47 — building the diff-level trace-coverage CI gate before the coverage DEFINITION exists risks false-positives on every test/refactor PR. SPIKE-47 (ready-to-run) must land its definition + exemption list first; then 499 becomes implementable. Recorded blocked-by SPIKE-47.
