  ## Acceptance (to be sharpened by the spike)
  - A PR adding un-traced coverable code (per the spike's definition) is flagged/blocked per the configured posture.
  - Exempt categories (tests/generated/docs/mechanical) are not flagged.
  - Default posture matches the spike's recommendation; the block-vs-report dial is per-repo config.
