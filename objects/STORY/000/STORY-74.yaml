title: 'Project registry foundation: aida projects register/list/forget'
description: |
  Foundation primitive for EPIC-22. Registry lives at `~/.aida/projects.toml` (already created 2026-05-10 with hardcoded aida + aida-tutor entries; this story makes it editable via CLI).

  ## Surface

  ```
  aida projects register [<path>]            # default cwd; auto-derives name from dir basename
  aida projects register --name foo /path    # explicit name override
  aida projects list                          # show table: name, path, last-seen, store-status
  aida projects forget <name>                 # remove from registry (keeps file on disk)
  aida projects show <name>                   # detail view: req counts, recent activity
  ```

  ## Schema

  ```toml
  [[project]]
  name = "aida-tutor"
  path = "/home/joe/ai/aida-tutor"
  repo = "https://github.com/joemooney/aida-tutor"
  registered_at = "2026-05-10T12:34:56Z"

  [[relation]]
  from = "aida-tutor"
  to = "aida"
  type = "teaches"   # or "depends-on", "verifies", free-form
  ```

  ## Acceptance

  - [ ] `aida projects register` writes/updates `~/.aida/projects.toml`
  - [ ] Registry survives concurrent edits (file lock or atomic write)
  - [ ] `aida projects list` validates each entry (path exists? store readable?) and flags stale ones
  - [ ] `forget` is reversible by re-running `register`
  - [ ] Existing `~/.aida/projects.toml` (with hardcoded entries from 2026-05-10) is honored, not clobbered
  - [ ] Schema documented in `aida-core/templates/projects.toml.example`
