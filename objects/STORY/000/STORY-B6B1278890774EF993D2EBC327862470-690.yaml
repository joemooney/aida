title: 'Seat mail follow-ups: cohort ownership after retirement, MCP sender seat, thread provenance'
description: |
  Follow-up slice from the #3950 review (STORY-2745 seat mail), split out by the advisor ruling of 2026-11-13.

  Acceptance:
  1. (F4) Seat mail keeps cohort and queued ownership after the sending worktree retires. Seat addresses are delivery-bearing keys in ResolvedAudience, so retained-sidecar discovery and missing-sidecar fail-closed treat them like role keys. Regressions cover retirement and a missing sidecar.
  2. (F6) MCP `send_message` records `from_seat` through the shared sender-seat resolver (AIDA_ROTATION_SEAT). A fixture covers an MCP send, then sender rotation, then a CLI reply delivered to the seat.
  3. (Stretch, F7) Thread and history views show the durable sender seat or role and the vendor, recorded at send time, including after the sender rotates or exits. Includes an output fixture.
