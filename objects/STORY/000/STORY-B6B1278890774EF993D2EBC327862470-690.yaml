- id: 01a20a5d-bf0b-7552-a3b8-ec70b639ee17
  author: joe
  content: 'INTEGRATION PRE-CHECK (integration-30, 14:50): PR-4460 @ 84dfdac3a57 PASSES for slice 1 (AC1/F4; Refs, partial), with ONE judgment point for the advisor. Base integration; one commit ''[AI:codex] fix(mailbox): ... (Refs STORY-2767)''; +117/-9 (a 27-line production change in aida-core/src/mailbox_logical.rs::delivery_gates, plus a 98-line regression and one structural-exclusion line). It''s not on an ADR-76 strict path: mail visibility, no leases/claims/grants/containment/gate. AC1 is met: direct seat-addressed mail is now delivery-bearing, so retained-sidecar discovery applies (test: the sender worktree is removed, the retained sidecar keeps ''for the original cohort'' with the original reader, the successor doesn''t see it, and the successor''s binding read takes the queued ''for the next holder''). Missing sidecar is fail-closed (the ''missing sidecar'' message is hidden from both). JUDGMENT POINT: the PR is STRICTER than role keys. Role mail without a sidecar is hidden only while the sidecar search is incomplete (unsighted); after a complete search it''s served as legacy role mail. Seat mail without a sidecar is hidden ALWAYS. I checked that this can''t hide legacy mail: every seat: resolution yields a cohort (mailbox_resolver resolve_seat / queued_for_seat), so CLI (mailbox_cmd.rs:467) and MCP (mcp.rs:3118) seat sends always write a sidecar, and seat addressing (#4083, 11-15) postdates sidecars (#3042, 10-28). So only seat mail whose sidecar was genuinely lost becomes invisible, by design (better than misdelivering). Plain write_message senders never address seat:. Lane fast_gate=pass.'
