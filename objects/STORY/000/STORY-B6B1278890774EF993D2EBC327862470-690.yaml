  content: 'ADVISOR RULING (advisor-122 14:47, recorded by integration-30) on PR-4460''s seat-mail visibility: ACCEPT fail-closed. Seat mail without its delivery sidecar stays hidden, because showing it to the CURRENT seat holder could leak mail meant for a retired occupant, and legacy mail can''t be affected (seat addressing postdates sidecars). CONDITION, as a separate small follow-up and not this slice: hidden must never be SILENT. `aida mailbox` and doctor must count and name seat messages hidden for a missing sidecar (''N seat messages hidden: delivery sidecar missing'', with ids and an inspection command). Product files it as small and Approved.'
