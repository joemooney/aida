spec_id: STORY-17
title: View GitLab Issues in AIDA
description: |-
  As a user, I want to view GitLab issues within AIDA so that I have a unified view of requirements and bugs.

  ## Acceptance Criteria
  - [ ] List GitLab issues alongside AIDA requirements (configurable filter)
  - [ ] Display GitLab issues with visual distinction (icon, badge, or color)
  - [ ] Show key issue fields: IID, title, state, labels, assignee, milestone
  - [ ] Click to view issue details in AIDA detail panel
  - [ ] Link to open issue in GitLab web UI
  - [ ] Search/filter GitLab issues by state, labels, assignee
  - [ ] Pagination support for large issue lists
  - [ ] Cache issues locally for performance (configurable TTL)

  ## Data Mapping (GitLab → AIDA Display)
  | GitLab Field | AIDA Display |
  |--------------|--------------|
  | iid | Shown as "GL-{iid}" |
  | title | Title |
  | description | Description (markdown) |
  | state | Status badge (open=green, closed=gray) |
  | labels | Tags (with label colors) |
  | milestone | Feature field |
  | assignee | Owner |
  | created_at | Created |
  | updated_at | Modified |
  | author | (shown in details) |

  ## CLI Support
  ```bash
  aida gitlab list                    # List all open issues
  aida gitlab list --state closed     # List closed issues
  aida gitlab list --labels "bug"     # Filter by label
  aida gitlab show GL-123             # Show issue details
  ```

  ## GUI Support
  - New view option: "GitLab Issues" in view picker
  - Or: Toggle to show/hide GitLab issues in main list
  - Filter bar includes GitLab-specific filters

  ## Technical Notes
  - API: `GET /api/v4/projects/:id/issues`
  - Support query params: state, labels, milestone, assignee_username, search
  - Default: open issues only (configurable)
  - Cache in memory with 5-minute TTL (configurable)
