title: 'aida manual <command> (a.k.a. --doc): print the CLI-manual rationale section for a command inline'
description: 'Operator idea (2026-06-12): a command that prints the corresponding manual section so users reference the when/why next to --help. The manual''s ''### `aida <cmd>`'' headers are the extraction key (one header to the next = that command''s entry). Smallest slice: `aida manual <cmd>` greps docs/cli/*.md for the command''s section and prints it (paged); `aida <cmd> --help` stays the fact source. Endgame: rationale-strings embedded beside clap so it''s generated, not grepped. Requires the manual chapters to use the consistent header convention (enforced by STORY-597 drift-guard). Depends on enough chapters existing.'
