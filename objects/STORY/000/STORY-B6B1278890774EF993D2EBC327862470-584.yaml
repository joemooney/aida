  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2661):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 12ea0f7b294c
    Recorded: 2026-11-08T08:14:26.970380414+00:00
    Findings:
    1. R1 BLOCKER (still open from rounds 1 and 2): PR #3666 title is still '[AI:codex] feat: Park on ask, resume on answer... (STORY-2661)'. aida-cli-lib/src/pr_ship.rs:339-372 only short-circuits on a trailing '(Refs ...)' and otherwise takes completion ids from the title, so a squash merge completes the story with AC1-4 unimplemented, contradicting sketch:13 and 15-17. Commit 12ea0f7b294 uses Refs but the title governs. Fix: retitle to exactly '[AI:codex] docs(plans): sketch park-on-ask resume-on-answer (Refs STORY-2661)'. The seat cannot do this; it needs host/advisor metadata action, and no further seat commit will clear it.
