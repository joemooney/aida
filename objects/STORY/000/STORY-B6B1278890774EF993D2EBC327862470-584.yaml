  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2661):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 12ea0f7b294c
    Recorded: 2026-11-08T08:14:26.970380414+00:00
    Findings:
    1. R1 BLOCKER (still open from rounds 1 and 2): PR #3666 title is still '[AI:codex] feat: Park on ask, resume on answer... (STORY-2661)'. aida-cli-lib/src/pr_ship.rs:339-372 only short-circuits on a trailing '(Refs ...)' and otherwise takes completion ids from the title, so a squash merge completes the story with AC1-4 unimplemented, contradicting sketch:13 and 15-17. Commit 12ea0f7b294 uses Refs but the title governs. Fix: retitle to exactly '[AI:codex] docs(plans): sketch park-on-ask resume-on-answer (Refs STORY-2661)'. The seat cannot do this; it needs host/advisor metadata action, and no further seat commit will clear it.
    2. R7 Stop deadline has no start when the receipt is late. sketch:115-117 lets the ask command return pending/failure guidance after 10 seconds while the host may accept later, but sketch:133-134 starts the 60-second deadline only 'after the ask command returns its accepted receipt', and the fallback at sketch:141-143 still keys on acceptance plus a marker for a command that already returned non-accepted. The sketch also never says whether a lane told 'pending' must stop or may keep working. A lane that gets pending and continues editing has an accepted park with no deadline, an AC1 escape. Define the lane's required behaviour on pending, start the deadline at host acceptance when the ask already returned, and add the late-acceptance case to the test list at sketch:316-334.
    3. R8 The original lane's slot is discounted before exit. sketch:128-130 and 149 say the slot stays occupied until verified exit, but sketch:201-202 disables final-result discounting only for the managed resume. In acquire_slot_with (aida-cli-lib/src/standalone_implementer.rs:536-541) a live launcher whose log has a final result and whose slot is not waiting is not counted. A parked lane's cooperative stop normally emits that final result, so during the stop window, up to the 65-second bound, the cap can be overrun by exactly the park path. Extend the rule to park_requested launches, for example via the existing mark_slot_waiting (standalone_implementer.rs:480), and add the admission-at-cap test during park_requested.
