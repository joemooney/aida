    REVIEW FINDINGS TO ADDRESS (STORY-2661):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 39ab419eb862
    Recorded: 2026-11-08T07:10:36.574115201+00:00
    Findings:
    1. F1 BLOCKER: PR title and commit 39ab419eb86 are '[AI:codex] feat: Park on ask, resume on answer... (STORY-2661)', but the diff is only docs/plans/2026-11-08-story-2661-park-resume-sketch.md. A completing trailer drives merge-time completion and NeedsAttention is merge-eligible (db_reconcile.rs:35-46), so merging marks the story complete with AC1-4 unimplemented, contradicting sketch:144-146. Retitle and recommit as a non-completing docs change, e.g. '[AI:codex] docs(plans): sketch park-on-ask resume-on-answer (Refs STORY-2661)', matching the sketch precedent 2f3d3ca33d9.
    2. F2 Resume consumer undefined: sketch:85-87 says 'the host consumes events and reconciles' but names no process, and the advisor ruling requires the resume trigger. Today's launcher waits for its child and holds the slot only until the command returns (queue_cmd.rs:12486, session.rs:6700), so after a park no host process remains and nothing is specified to wake on the outbox. Name the owner (existing loop or new service), how it starts and survives restart, and what guarantees it runs while a wait is open.
    3. F3 Answers outside the parking host are unspecified: finalize_answer (questions.rs:866) runs on whichever node or checkout answers, while the outbox is 'main project's runtime state' (sketch:26-27, 78-80). The requirement store is shared across nodes, so an answer written elsewhere and synced in never runs finalize_answer on the parking host, and a contained answerer may be unable to write host runtime state. State that the consumer derives resume-ready from the canonical answered question (outbox only a hint), or define the cross-node path, and add it to the test list at :135-142.
    4. F4 Resume grant source undefined: sketch:50-51 says a parked lane keeps no continuing grant authority, and :87-90 says the host 'issues only an ordinarily authorized child grant', but issue_launch_child mints from a validated parent seat grant (launch/grant.rs:11-18, issue_child_for). Say whose parent grant the consumer uses and what happens when the launching session has ended or its grant has expired, which is the normal overnight case. 'Blocked and retryable' (:106) without a named renewal path means overnight parks strand silently; define the recovery and surface it in aida awaiting.
    5. F5 Question identity does not exist yet: sketch:33 binds question_id and :70-71 puts the wait ID 'on both sides', but DecisionRequest (aida-core/src/models.rs:511-540) has no id or wait field and a spec has one decision_request slot. The sketch must declare this canonical schema change. It must also handle questions_ask --force (questions.rs:1914-1921), which overwrites a pending question: say whether force is refused for a bound wait or escalates it, and add the case to the tests.
    6. F6 Resume prompt drops the answerer's note: sketch:94 lists question, selected answer and consequence, but answers carry a free-text DecisionRequest.note (models.rs:527-533; questions.rs:1972-1974) that TASK-791 says the implementer reads with the choice. An answer like '1, but name it X' would resume without the 'name it X'. Add note to the prompt data and the resume fixture.
    7. F7 Spec status and resume gate while parked are unspecified: sketch:88 rechecks 'spec pickability', but maybe_autoqueue admits only Approved (questions.rs:983-990) while the asking lane's spec is normally InProgress, and evaluate_unpark ignores status. State the lifecycle status held during a park and the exact predicate for resume, excluding the Approved check, or an implementation following the existing seam will never resume.
    8. F8 No stop deadline: AC1 requires exit within one turn, but sketch:66-68 leaves a lane that ignores the stop-now receipt in park_requested under unspecified 'normal host failure handling', still holding the slot and able to keep editing. Define the bound and the resulting escalation, and test it.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
