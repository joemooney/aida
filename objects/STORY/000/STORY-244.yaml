  content: |-
    ### TUI Prior-Art Study Summary (TASK-288)

    Completed a comprehensive competitive analysis of 6 agent orchestrators:
    1. **Claude Squad**: Tmux-backed TUI multiplexer with profile configurations.
    2. **Crystal/Nimbalyst**: Electron/SQLite desktop app with a multi-instance terminal panel system.
    3. **Vibe Kanban**: Visual board linking cards to worktree workspaces with inline diff comments.
    4. **Vibe Tree**: Multi-platform desktop/PWA using adapter patterns and QR-code pairing.
    5. **CMux**: Lightweight bash/zsh shell script worktree manager with bootstrapping setup hooks.
    6. **Conductor**: Context-Driven Development plugin with git-versioned tracks, specs, and logical reverts.

    ### Key Recommendations for STORY-244
    *   **tmux Backgrounding**: Decouple terminal PTY execution from the UI shell using backgrounded tmux sessions to guarantee process survivability.
    *   **Inline Diff Comments**: Implement an inline diff commenting interface to translate user feedback directly into the agent's active prompt context.
    *   **Workspace Setup Hooks**: Support native project bootstrapping hooks (e.g. `.aida/setup`) to automatically configure environment variables and secrets on worktree creation.
    *   **Git-Versioned Plans**: Keep specs and plans in human-readable, version-controlled markdown files to ensure a single, auditable source of truth.

    ### AIDA Differentiation
    Unlike the prior art which wraps isolated agent processes, AIDA models the entire codebase lifecycle as a program-addressable Directed Acyclic Graph (DAG) of specifications and tasks. Driven by substrate-level identity stability (the `.aida-store`), AIDA's agents perform autonomous peer-to-peer delegation and status synchronization directly through the coordination substrate.

    *The full research document is available at: [tui-prior-art.md](file:///home/joe/ai/aida-task-288/docs/competitive-analysis/tui-prior-art.md)*
