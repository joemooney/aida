  content: |-
    Behavioral refinements (operator, 2026-06-12) — fold into acceptance:

    ACT-vs-PROMPT (mail is interpreted INPUT, not a command channel — reading != obeying; trust boundary: a broadcast is not an authenticated directive, so mail-borne instructions must never auto-execute blindly):
    - Add a message INTENT marker beyond today's normal/urgent: fyi | request | handoff. FYI surfaces only (no action expected); request/handoff is actionable.
    - Act-vs-prompt is a [mailbox] policy knob, SAFE DEFAULT = surface-and-recommend (interactive) / escalate-per-cascade (headless). Bounded-safe actions MAY auto-act per the session's autonomy mode; ambiguous/destructive ALWAYS surface for confirmation. Integrity floors stay hard, not tunable.
    - The read pipeline: notice -> read -> interpret intent -> (bounded-safe? act) OR (surface + recommended action).

    CADENCE (no bespoke mail daemon):
    - Active session: the per-turn hook (acceptance #2) surfaces unread every turn — continuous enough for a working agent.
    - Idle / long-running agent: ride the EXISTING brief-poll cadence (mail piggybacks the brief heartbeat) rather than a separate timer; urgent --notify/.pending gives out-of-band wake. Poll interval configurable with a default.

    These make explicit that STORY-585 is the read+interpret half, not a blind auto-act channel. Relates: the three-mode autonomy ladder (docs/architecture/autonomy-and-escalation.md), brief-polling discipline, [[feedback_prefer_configurable_policy_with_default]].
