    Probe findings fixed: (1) leases or open PRs that cannot be read made every claim look unheld, which is fail-open. Stale claims are now None (shown as unknown) and no release is prescribed. (2) A rework sink that had already landed got a park command; parking now applies only to open specs. (3) Vec::truncate tripped the store-writer ratchet, so it uses take(10). (4) A raw gh read outside forge tripped the forge-read ratchet, so it moved to a Forge trait method.
    Validation: targeted story_3143 tests 8/8, help golden test, make check-ci-fast pass.
    Residual risks: idle driver is approximated by modified_at; gather_signals IO is not unit-tested; about 270 production + 260 test lines, over the 300-line budget; not smoke-run against the live store from this seat.
