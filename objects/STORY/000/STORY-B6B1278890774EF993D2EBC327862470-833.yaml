    AC1 [evidence: behavioral-test]: `aida report backlog [--json]` (aida-cli-lib/src/backlog_report.rs). Area from `[report.backlog.areas]` keyword/path map with defaults; S/M/L/XL from type, description length, AC count, heavy tags; priority, status; noise from from-review:/carried-from:/kind: tags. Tests: story_3143_classifies_area_difficulty_and_noise, story_3143_area_map_and_weights_come_from_config.
