    ## Implementer self-review
    Reviewed HEAD: aeb2552859 (S2, completing STORY-3143; PR #4641).

    AC3 [evidence: behavioral-test]: flow section in aida-cli-lib/src/backlog_report.rs. Functions: parse_landings ((#N) subjects on origin/main + origin/integration, deduped), flow (per-day landings, open->landed median/p90 from Forge::landing_opened_since, CR rounds before landing from the ledger, 7d rework sinks) and stale_claims (InProgress, modified_at >= stale_days old, no lease or open PR). Tests: story_3143_landings_parse_pr_numbers_from_subjects, story_3143_flow_metrics_from_fixture_ledger, story_3143_stale_claims_and_recommendations.
