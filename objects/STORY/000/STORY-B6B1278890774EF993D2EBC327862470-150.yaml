title: aida agent new --rotate for Codex sessions (follow-on to STORY-HOME-101)
description: 'STORY-HOME-101 ships rotation supervision for Claude only (advisor signoff 2026-10-31 04:00, Q5). Codex shares run_tracked_agent_after_spawn, but its native thread id is known only after startup, so freshness falls back to ts >= spawn plus a handle match, and mail-wake re-arming must be stamped per generation. Acceptance: (1) --rotate works for codex with the same handle, lease and worktree; (2) freshness uses the thread id once known, else the ts fallback, tested; (3) mail-wake is re-armed for every generation, tested.'
