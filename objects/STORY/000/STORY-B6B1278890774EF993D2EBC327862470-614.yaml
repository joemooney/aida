- id: 01a1c45f-408e-7061-b61a-657b5d648aab
  author: joe
  content: 'Evidence 2026-11-10 (advisor): after a context rotation, the ops loops kept the retired grant. From 21:57 to 23:45 MST every ''aida queue rework'' in auto-rework failed with ''reworking queued work needs dispatch authority'', the spec stayed needs-triage, dell1 refused the lane, and four reworks (#3761, #3748, #3757, #3762) sat untouched for ~2h while the loop logged them as launched. review-watch also stopped (deputy ''default'' not running) with no alert. Acceptance should include: a dispatch-authority refusal is an alert, never a silent skip; the guard/attempt record is written only after a lane actually launches; rotation rebinds or restarts the loops under the new grant.'
