- id: 01a1c85a-c1ff-7432-8870-252472b56bea
  author: dirtlab
  content: |
    Implemented advisor-ruling slice 1 (train), leaving rework and stale-release for separate slices. No host stopgap scripts were read or ported.

    Design: review-watch and auto-train instantiate one shared fixed service engine, with independent receipts/locks/logs under .aida/review-watch and .aida/auto-train. The existing authenticated deputy rebind operation accepts the same advisor grant for both; HostAuthority refresh/shutdown is shared. Auto-train runs every 180 seconds with exact-head authorized approval, head-bound green required CI, no hold, and train-branch exclusion. Strict eligibility also runs at the typed pre-land/recovery member gate and compares the admitted head. The existing train journal, ownership and merge gates remain authoritative. Rotation takes effect between passes and does not kill an active train. Three consecutive failures create one durable, idempotent advisor alert per episode; success clears the episode, backoff does not. Added advisor loops train-status and updated CLI help snapshot/manual.

    Changed files:
    aida-cli-lib/src/advisor_loop_service.rs
    aida-cli-lib/src/advisor_loop_train.rs
    aida-cli-lib/src/review_watch_train_service.rs
