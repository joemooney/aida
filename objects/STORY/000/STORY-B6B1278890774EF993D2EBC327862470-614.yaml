  harness_version: 2.1.321 (Claude Code)
- id: 01a1c837-6891-7a31-9b85-ccb41b3f4a03
  author: joe
  content: 'ADVISOR RULING (2026-11-10 18:45 MST) on the missing-context punt: do NOT read or port the host scripts; they are advisor stopgaps outside the repo. Their behavior is the contract: auto-train: every few minutes, train open PRs whose recorded verdict is APPROVED at the exact head with green required CI and no merge hold, skipping train/ branches; log landed/ejected. auto-rework: for each open PR whose verdict is CHANGES REQUESTED at its exact head (only after its CI has settled), or whose CI failed at that head, run ''aida queue rework SPEC --for implementer'' once per head and dispatch an implementer lane; if the PR is CONFLICTING, merge main on the host first (BUG-2456); skip a spec with a live lane. stale-release: release the review attempt of a head with no verdict, no running reviewer, pushed more than 40 min ago (until BUG-2518 lands). Build these as supervised services alongside review-watch under ''aida advisor loops'' (same binding, grant adoption and alerting as review-watch), one slice per loop; slice 1 = train.'
  created_at: 2026-11-11T01:27:16.881561405Z
  modified_at: 2026-11-11T01:27:16.881561405Z
  session_id: 01a1c70f-d731-7b70-acf8-e9ab3d288fca
  harness_version: 2.1.322 (Claude Code)
- id: 01a1c837-7e51-7cd3-b739-a2e2e7116512
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: missing-context: Current host auto-rework.sh and auto-train.sh sources and caller/service configuration are unavailable in this lane. Neither /home/dirtlab/.local/share/aida/ops/advisor-scripts nor /home/joe/.local/share/aida/ops/advisor-scripts supplies them. docs/internal/agents/advisor-script-inventory.md requires fresh hashes and caller enumeration before migration. The incident comment identifies guard writes after failed queue rework, but that implementation is outside the checkout. Need sanitized current scripts, supervisor/caller configuration, guard/attempt schema and active train ownership receipts to migrate without duplicate launches or interrupting trains. Existing review_watch_service.rs already implements STORY-2571 rotation; extend the signed-off STORY-2571 architecture, preserving dispatch requester authority, rather than adding a shell respawn service.. No triage reason was given.'
