- id: 01a1c837-6891-7a31-9b85-ccb41b3f4a03
  author: joe
  content: 'ADVISOR RULING (2026-11-10 18:45 MST) on the missing-context punt: do NOT read or port the host scripts; they are advisor stopgaps outside the repo. Their behavior is the contract: auto-train: every few minutes, train open PRs whose recorded verdict is APPROVED at the exact head with green required CI and no merge hold, skipping train/ branches; log landed/ejected. auto-rework: for each open PR whose verdict is CHANGES REQUESTED at its exact head (only after its CI has settled), or whose CI failed at that head, run ''aida queue rework SPEC --for implementer'' once per head and dispatch an implementer lane; if the PR is CONFLICTING, merge main on the host first (BUG-2456); skip a spec with a live lane. stale-release: release the review attempt of a head with no verdict, no running reviewer, pushed more than 40 min ago (until BUG-2518 lands). Build these as supervised services alongside review-watch under ''aida advisor loops'' (same binding, grant adoption and alerting as review-watch), one slice per loop; slice 1 = train.'
