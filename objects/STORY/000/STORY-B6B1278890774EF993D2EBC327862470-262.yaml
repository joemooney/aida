title: 'Background docs sweep: an idle-only scheduled job and an aida docs sweep command, report-only first, then one batched docs PR per run'
description: |
  ## Why
  Operator direction (2026-10-31): documentation should be kept current continuously, without slowing feature work. The ADR-5 CI drift guards catch doc drift at the moment a surface changes, but nothing sweeps for drift that has already built up: stale command text, website pages that contradict the CLI docs, new terms with no glossary entry (STORY-2219). The parts exist (skills aida-docs-review, aida-glossary, aida-doc, aida-docs; the `aida schedule` registry with `every`/`while` gates). What's missing is a trigger, batching, and a bounded output.

  Decision: this is a scheduled job plus a command, NOT a new role or seat. Seats are authority boundaries, and documentation work needs no authority of its own: its output is an ordinary PR under normal review.

  ## Acceptance
  1. **Command.** `aida docs sweep [--since <ref>] [--report-only]` reviews the documentation touched by changes merged since `<ref>` (default: the last recorded sweep): CLI docs, the showcase/website pages, the glossary and READMEs. It produces findings, each with file, line, the evidence (the merged change or the contradicting doc) and a proposed fix.
  2. **Scheduled, idle-only.** A scaffolded `docs-sweep` job runs daily and only while the queue is idle and the drain lock is free (`while` on `queue.depth` and `drain.lock_free`), so it never takes a lane from feature work. It is skipped, not queued, when the gate is closed. It records the last swept revision.
  3. **Report-only first.** Initially every run only reports: findings go to the product seat (one mail or one `aida awaiting` item per run, not one per finding), and product files and orders the fixes. A config switch (`[docs_sweep] mode = "report" | "pr"`) turns on PR mode later. Plan: report-only for about two weeks, then the operator decides whether to switch.
  4. **PR mode.** In `pr` mode a run opens at most ONE documentation-only PR, batching every mechanical fix, routed to the light review tier. Anything not mechanically fixable becomes a draft spec. If a sweep PR is still open, the next run adds to it rather than opening another.
  5. **Bounded.** A per-run cap on files changed (configurable, default 20). It never edits code, tests, spec status or generated mirrors; generated docs are fixed at their template source and regenerated. A run over the cap reports the excess instead of touching it.
  6. **Glossary feed.** Terms that appear in website prose with no glossary entry (STORY-2219) are reported as findings, and in PR mode get a stub entry.
  7. **Observable.** `aida schedule status` shows the job's last run, findings count and mode. A run that fails reports like any other failed job.

  ## Out of scope
  New explainer pages, rewriting the developer CLI manual wholesale, and a librarian seat.

  ## Related
  ADR-5 (docs generated from spec intent, drift guards), STORY-2219 (glossary), TASK-HOME-277 / TASK-HOME-280 (explainer pages).
