title: aida mandate renew revives the operator's most recent mandate even after it expired, and warns before expiry
description: |-
  Problem (2026-11-03): the ship-held mandate expired at 01:28 MST overnight. The operator ran 'aida mandate renew', but renew only extends an ACTIVE mandate, so it did nothing. Nothing merged for 5h: three approved green PRs (#3284 #3283 #3280) sat held and every implementer lane stalled.

  The operator only ever renews the same mandate.

  Acceptance:
  1. With no active mandate, 'aida mandate renew' re-mints the operator's most recently expired mandate with the same scope (--ship-held, --include-supervised, protected paths, human gates) and a fresh TTL. It prints what it revived and when the old one expired. It still requires the same human-TTY authority as 'mandate start'.
  2. When an active mandate exists, renew behaves as today (extends it).
  3. With no prior mandate at all, renew errors with the exact 'aida mandate start ...' line to run.
  4. About 60 minutes before an active mandate expires, the operator gets a prompt: the status line/hook banner shows 'MANDATE expires in Nm, run: aida mandate renew', and a coordination/mail notice goes to the operator and the advisor seat. The advisor's due jobs surface the same item so the advisor can batch it to the operator early.
