title: 'aida role current: print the active role''s name'
description: |
  Today the only way to query the active role is `echo $AIDA_SESSION_ROLE`. Add `aida role current` as a programmatic surface — outputs the role name on stdout (empty if no role active), exits 0 either way (or 1 if no role, with --check flag).

  Useful for scripting and for agents that don't have direct env access.

    $ aida role current
    implementer

    $ aida role current --check    # exits 0 if role active, 1 otherwise
    implementer

  Surfaced 2026-05-09: an agent in the EPIC-20 session tried `aida role current`, got "unrecognized subcommand."
