title: 'My Activity: Planned vs. Actual Work Reconciliation'
description: |-
  Frontend-only view that shows a user's actual work (requirement changes, comments, creations) cross-referenced against their queue, surfacing the delta between planned and actual work.

  Features:
  - Activity feed derived from requirement history/comments via buildTimelineEvents()
  - Cross-reference with queue entries to tag each event as in-queue or not
  - Stats bar: Worked On (with breakdown pills), Completed, In Queue, Unqueued Work, Queue Untouched
  - Status breakdown counts unique requirements moved to Completed/InProgress/Approved in time range
  - Time range filter (Today, This Week, This Month, All Time)
  - Owner-scoped via ?user= URL param with owner-picker dropdown
  - Two-column layout: scrollable activity feed + detail panel (reuses TimelineDetailPanel)
  - g+a keyboard chord for navigation
  - Sidebar nav item with Activity icon
