    5. Guided/architecture gate: the sketch says 'master/operator sign-off required before implementation', and STORY-2593 is needs-attention with no recorded advisor signoff. Implementation (sketch steps 1-5) has to wait for that signoff on the spec. The PR cannot be approved as completing the story until then.
