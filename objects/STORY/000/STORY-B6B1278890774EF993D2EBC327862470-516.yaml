    7. Duplication: the plan file repeats verbatim the design comment already on STORY-2593 (comments[0]). Keep one canonical copy (the docs/plans file, per convention) and have the spec comment point at it, so the two do not drift during rework.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
