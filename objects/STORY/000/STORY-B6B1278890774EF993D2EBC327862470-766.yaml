    ## Whole-diff checks

    - Deputy rotation: ownership checks match project, subject, role and principal using a validated caller grant; socket cancel regression exercises acceptance/refusal. List forecasts reuse runner attribution and explicitly report unknown in sandbox. Handoff lists queued jobs by outgoing grant.
    - WIP: inspected config knob, count discovery/snapshot fallback, classifier/admission, queue dispatcher and drain phase status/argv paths, all changed tests and help/policy goldens. Found F1/F2/F3 below.
    - Allocation: explicit mode applied on handle before rename; umask child is exact-one-test and verifies refusal remains. Both merge glue sites preserve the respective bodies/callers.
    - Store writer inventory: added mode-helper sinks and renamed callers remain blocked; no runtime service routing introduced. Two dispenser entries lose richer host_only metadata to generic blocked entries; this does not open a runtime route.
    - Untraced BUG-2579 criteria have matching new behavioral tests in this diff. Supplied gaps for BUG-2583, STORY-2775, STORY-2771 and TASK-3448 have no new tests in this diff; those are historical/base acceptance debt, explicitly marked above, not silently counted as passes.
    - None of the actionable findings depends on the four files changed by the newer base. Landed-tree diff already includes that base; findings are in queue_cmd/work.rs and .aida/config.toml.

    ## Complete actionable findings

    F1 [P1] Enforce WIP admission before an orchestrator pre-bumps fresh work. queue_cmd/work.rs:4715 treats InProgress as Continues. --auto-complete routes around handle_queue_work; drain_gate.rs:1671 calls prepare_registered_auto_complete_phase1, which changes Approved/Planned/Draft to InProgress (phase_gates.rs:120-171) before launching the phase-1 queue-work child. At or above wip_max the child therefore skips counting/refusal, and standalone/batch/nextN drains can keep opening new work. Move admission before status/queue mutation or carry trustworthy pre-bump new-work facts. Add an auto-complete/drain regression proving refusal without claiming/launching fresh work at the limit; retain exemptions for genuinely existing work.

    F2 [P2] Remove the expired project WIP lift before promoting it. .aida/config.toml:106-111 sets wip_max=20 indefinitely despite both its comment and STORY-2768 advisor ruling limiting it until approximately 2026-11-15 07:00 MST. Review is after that deadline. Because now::wip_max has no expiry semantics, landing this leaves fresh work admitted at counts 10-19 after the authorized lift. Remove the override to restore default 10 or use a newly authorized time-bounded setting.

    F3 [P2] Exempt a resolved canonical existing branch from fresh-work admission. queue_cmd/work.rs:4714-4716 checks only explicit resume/adoption, status and the raw branch_override. Just above it, canonical_resume_branch can resolve an existing unmerged/unpublished canonical branch for an Approved spec with no open PR and no lease, and session_branch_override uses that branch. Since canonical_resume.is_some() is never passed to classify, ordinary queue work SPEC is nevertheless New and refuses at the WIP limit, despite correctly identifying existing work and saying it will resume. Include the resolved canonical resume as continuing work (with the intended bypass audit), and add an at-limit regression with Approved status, existing canonical branch and no open PR.

