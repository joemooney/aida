    ### BUG-2579 — Seat rotation strands queued deputy jobs: the successor of the same handle cannot cancel or inspect its predecessor's jobs
    - BUG-b6b1278890774ef993d2ebc327862470-344.ac15c360: A job submitted by a seat stays owned by that seat's handle (and lease) across rotation: the rotated session of the same handle can cancel, status and wait on it. — verified by owns_job plus bug_2579_a_rotated_seat_owns_its_predecessors_jobs_and_another_handle_does_not; status/wait remain unrestricted readers in deputy_shell_cmd.rs (test source inspected).
