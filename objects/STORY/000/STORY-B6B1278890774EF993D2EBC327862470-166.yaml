  content: 'ADVISOR REWORK BRIEF round 2 (14:40), PR-3175. ONE item: a running ''aida deputy'' caches the mandate expiry at start (deputy_cmd.rs ~309-316) and stops at the pre-renewal expiry. Fix: on each worker tick (or before each job), re-read the mandate by its id and use its current expires_at; stop only when the re-read mandate is expired, stopped or missing. Test: start a deputy against a mandate, renew it, advance past the old expiry (fake clock / short TTL), the deputy keeps running; stop the mandate, the deputy stops. Also ACCEPTED (ruled once): the implementer''s note that pre-change binaries ignore a renewed mandate whose total lifetime passes 24h is fine: it fails closed and the live binary is promoted from main. LIGHT gate: cargo test -p aida-cli-lib deputy + mandate filter; make check-ci-fast. Push to the PR branch.'
