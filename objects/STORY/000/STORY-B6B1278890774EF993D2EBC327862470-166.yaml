title: 'aida mandate renew: extend the active mandate in place without retyping its flags'
description: |
  Operator request (2026-10-31): `aida mandate renew [--for <duration>]` extends the ACTIVE mandate in place, keeping its scope, flags (--ship-held, --include-supervised), principal and gates, instead of stop + start with every flag retyped.

  Acceptance:
  1. Human at an interactive terminal only (same rule as start/stop); refuses under an agent or headless env.
  2. Renews only an active, unexpired mandate; with none active it refuses and points at `aida mandate start`.
  3. Keeps the scope and flags exactly; the new expiry is now + duration (default: the original duration), capped by the same maximum as start.
  4. Writes an audit/lineage record (old expiry -> new expiry, who renewed); `aida mandate status` shows the renewal count.
  5. Grants derived from the mandate stay valid across the renewal (no re-delegation needed), with a test.
