- id: 01a214b8-89cb-72e3-888f-2a6533a29d0f
  author: joe
  content: |-
    AUDIT VERDICT (not a lane instruction): integration-30 pre-check of PR #4582 r2 @ 59f30c4ac22 (STORY-3120 S3a, Refs-only). Own change vs d36df1471a9 (the integration merge): review_runner.rs +64/-7, plus one ratchet entry.

    Result: PASS. STRICT tier, so it still needs an INDEPENDENT review at this head (no carry-over).

    F1 (SIGPIPE), fixed:
    - The writer thread blocks SIGPIPE with pthread_sigmask before write_all.
    - SIGPIPE raised by write() is thread-directed. While it is blocked, it stays pending on that thread and write returns EPIPE. A pending thread-directed signal is discarded when the thread exits, so it can't be delivered to another thread later.
    - Nothing else writes to the pipe. Dropping stdin (close) doesn't raise SIGPIPE.
    - I also correct my own comment 25 item 4: "SIGPIPE is ignored by the Rust runtime" doesn't hold for the aida binary (BUG-99 restores SIG_DFL).

    Test s3a_runner_survives_default_sigpipe:
