    (1) [evidence: behavioral-test] s3a_runner_spawn_contract: for claude, codex and the custom command, a fake binary dumps its cwd, env, argv and stdin byte count. The cwd is an empty temp dir. A .claude/hook.sh planted in the checkout does not run. Claude's argv is exactly --print --setting-sources=user --settings {"disableAllHooks":true} --strict-mcp-config --tools '' --disable-slash-commands --no-session-persistence. Codex's argv is exec --sandbox=read-only --skip-git-repo-check --ephemeral -- -.
    (2) [behavioral-test] env_clear plus PATH/HOME/LANG/TERM/LC_* and that vendor's auth only. A sentinel GH_TOKEN and AIDA_SESSION_GRANT never reach any runner, OPENAI_API_KEY never reaches claude, ANTHROPIC_API_KEY never reaches codex, and the custom command gets no vendor auth.
    (3) [behavioral-test] Refused: a relative value (scripts/review), a runner inside the checkout, a directory, and an empty value with no agent. The vendor binary is also resolved to an absolute path outside the checkout, and only from absolute PATH entries.
    (4) [behavioral-test] A 200 KiB prompt arrives on stdin from a writer thread, and argv equals the fixed table. A runner that exits 0 without reading the whole prompt fails.
    (5) [behavioral-test] s3a_runner_deadline_and_output_caps_fail_closed: a 1 s deadline kills the 'sleep 30' process group in under 10 s, the stdout cap and the stderr cap each fail closed, and a non-zero exit surfaces stderr.
    (6) [behavioral-test] gemini, agy, antigravity, '' and claude-x are refused; parsing goes through LaunchVendor::parse and a closed match.
    Probes: exit is detected with waitid(WNOWAIT), so the group is killed before the child is reaped (no pgid reuse). A waitid error kills the group, and the run then fails on its exit status.
    Residual risks: a runner that calls setsid escapes the group kill and could hold the pipes. Codex read-only can still read files on the host. Claude still loads the operator's own ~/.claude user settings, with hooks off. 'Unknown agent refused' is unit-level only until --run-review is wired.
