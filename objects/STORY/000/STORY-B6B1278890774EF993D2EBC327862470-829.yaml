  author: joe
  content: |-
    AUDIT VERDICT (not a lane instruction): integration pre-check for PR #4575 @ 48e4b95289 (STORY-3120 S2: --sarif and --fail-on CLI wiring, Refs-only, +121/-2)

    Result: PASS.

    Brief notes:
    (1) An unknown or unparseable severity gives SARIF level 'error' (Some(3..=4) | None), and the test asserts it for 'blocker' and ''.
    (2) Every runner finding path must EXACTLY match a reviewable-inventory path. Anything else refuses the whole run before anchoring, and the test confirms no SARIF is written then. Absolute paths, '..' paths and unchanged files are all refused.
    --run-review is not included (it's S3).

    Behaviour:
    - The --fail-on threshold is validated before any output is written.
    - The SARIF report is written before the gate fails, so CI can still upload it. The test confirms that 'high' fails with the report present and 'critical' passes.
    - Both flags require --anchor-findings.
    - The SARIF goes through the existing hardened write_output: it must stay inside the repo, refuses Git metadata (both the absolute git dir and the common dir), and is written through an openat walk.
    - The help snapshot is updated.
    - --anchor-findings now takes the runner envelope or a fenced format (parse_runner_findings_json), and a bare array still works.

    Security: no network or process spawn added. The output path is user-supplied and goes through the confined writer.

    Nits:
    (a) write_output's errors say '--write …' even for --sarif.
    (b) Like --write, --sarif can overwrite a tracked source file inside the repo. That's an operator choice, but S3 could refuse tracked paths.

    Merge-tree with integration: CLEAN.
