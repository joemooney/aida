    ## Implementer self-review
    Reviewed HEAD: b39e428e49dde9ff26deec7cdff01c9f3fc01ad3 (int40-story-3120-s3a, base integration). S3a HELPER ONLY: the helper plus its required tests already come to about 390 lines, so --run-review and the git_text should-fixes (env scrub, --no-textconv, no silent fallback) move to the next slice. This follows the brief's 'ship the helper first' fallback.
