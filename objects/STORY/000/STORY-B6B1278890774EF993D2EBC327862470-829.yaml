    (F1, real) The stdin writer thread must NOT die from SIGPIPE (the aida binary restores SIG_DFL, so a runner that closes stdin early KILLS aida). Block SIGPIPE in the writer thread (pthread_sigmask) so write returns EPIPE, and treat EPIPE as "runner refused input" → a run error. TEST: a runner that exits immediately, given a 200 KiB prompt → aida survives and reports the error.
