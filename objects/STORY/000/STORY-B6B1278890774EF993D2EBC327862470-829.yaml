- id: 01a21211-86ae-7702-93c1-7f6533990a09
  author: joe
  content: |-
    SLICE-BRIEF NOTES (advisor ruling 02:40, from the #4567 pre-check)

    S1 micro-round (#4567, at most 15 lines, before merge): in findings_exceeding_threshold, an unknown or unparseable severity ranks as CRITICAL (4), so the gate fails closed. Add a test showing that severity 'blocker' or '' is caught by --fail-on critical. No other scope.

    S2/S3 briefs:
    (a) The CLI must refuse, not silently drop, any runner-supplied finding path that is outside the PR's changed-file inventory, including absolute paths, '..' and paths that aren't in the batch.
    (b) --run-review spawns 'claude --print' or AIDA_REVIEW_RUNNER_CMD, so it needs the full security lens:
    - where the command comes from (an environment-supplied command);
    - the working directory, which must not be an untrusted seat clone;
    - the environment and credentials the runner inherits;
    - output size bounds;
    - untrusted runner output is never executed or used to choose the command.
