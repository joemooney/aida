    SHOULD-FIX, before or in the --run-review slice:
    (a) UNBOUNDED JOINS. The stdout/stderr reader joins and the stdin writer join have no deadline. A descendant that calls setsid() (or a double-forked daemon) leaves the group and keeps the pipe fds, so read_to_end/write_all never return and `run` hangs past its deadline. This fails as a hang, not open, but a CI gate needs a bound. Fix: after kill(-pgid), wait for each thread with a short grace (poll JoinHandle::is_finished for about 5s). If one hasn't finished, return "review runner left descendants holding its pipes" and leak the thread. Test: a runner that runs `setsid sleep 60 &` with inherited stdout, then exits.
    (b) The out-of-inventory refusal test (item 11) and the git_text should-fixes (env scrub, --no-textconv, no silent full-file fallback) are deferred to the --run-review slice. The PR body says so, and the next brief must carry them.
    (c) Nit: var() returns the FIRST non-empty match, while cmd.env applies the LAST duplicate. std::env::vars_os never yields duplicate keys, so the --run-review caller must pass vars_os() unchanged.

    Residual risks the PR body states (accepted): codex read-only can still read host files; claude loads the operator's ~/.claude user settings with hooks disabled; a setsid escape (see (a)).
