    Result: PASS as a helper slice. STRICT tier, so it still needs an INDEPENDENT review at the final head (no self-approve, no carry-over).

    Binding items from comment 19:
    1. cwd: a fresh tempdir. For claude: --setting-sources=user, --settings {"disableAllHooks":true}, --strict-mcp-config with no --mcp-config (so no servers), --tools "" (no tools), --disable-slash-commands, --no-session-persistence. For codex: exec --sandbox=read-only --ephemeral. The test plants .claude/settings.json + hook.sh in the checkout and asserts the marker is absent. ✔
    2. env: env_clear(), then PATH/HOME/LANG/TERM/LC_* and that vendor's auth vars only. The custom cmd gets NO vendor auth. The test uses sentinels for GH_TOKEN, AIDA_SESSION_GRANT and the cross-vendor key, and checks each never arrives. The three AIDA_REVIEW_* keys are added to DROPPED_AIDA_KEYS, so seats never inherit the operator's runner cmd. ✔
    3. AIDA_REVIEW_RUNNER_CMD: read only from the operator env; must be absolute; canonicalised (symlinks resolved) before the regular-file check and the outside-checkout check. The PATH-resolved vendor binary gets the same checks, and relative PATH entries are skipped. Tests cover relative, inside-checkout, directory and empty values. ✔
    4. stdin: the prompt goes in from a writer thread; argv must equal the fixed table exactly. Tests: a 200 KiB prompt, and a "deaf" runner that doesn't read stdin is an error. SIGPIPE is ignored by the Rust runtime, so the deaf case gives EPIPE, not a kill. ✔
    5. Deadline: process_group(0); waitid(WNOWAIT) polling, so the leader stays unreaped and the pgid can't be reused before kill(-pgid). Caps: 4 MiB stdout, 64 KiB stderr; the reader stops at cap+1, then the group is killed. Tests: a 1s deadline finishes in under 10s; each cap overflows; a non-zero exit puts stderr in the error. ✔
