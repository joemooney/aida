- id: 01a21870-3f9a-77c1-aeff-deb4f3cda8b2
  author: joe
  content: |-
    Integration pre-check: PR #4665 @88005ae4 (STORY-3120 S5a --post-comment; Refs) — PASS on the security lens, with one SHOULD-FIX and one nit
    - Opt-in: --post-comment is off by default; clap `requires = "pr"` plus a handler check (clap lets --from through) refuse it without --pr before any forge is resolved; no env, rules or seat key enables it. Test covered.
    - Transport: posts through the origin's forge client (pr_forge, the same one that reads --pr metadata). GitHubForge::comment now adds `-R <pinned repo>` when the client is pinned (for_review sets metadata_repo; the other constructor leaves None, so existing callers are unchanged). No raw gh/curl with ambient tokens.
    - Inert rendering: every runner-supplied string is either a code span (control chars → spaces; the delimiter outruns any backtick run) or a fenced block (fence = longest run + 1, minimum 3; CR stripped; indented under the list item), so it cannot close its container. This covers finding path, severity, category and message, the challenger reason, inventory and excluded paths, batch file lists, and coverage paths. PR-controlled file names were previously wrapped in single backticks and could break out; that is now fixed. The hostile-input test (@mentions, <img onerror>, **bold**, links, headings, nested ``` and ````) strips code and asserts nothing renders live, with no unclosed fence.
    - Ordering: posted before the --fail-on/coverage gates, so a failing review still publishes (documented).
    SHOULD-FIX: the body goes to `gh pr comment --body <body>` as one argv string. GitHub rejects comments over 65,536 characters, and Linux fails a single argument over 128 KiB (E2BIG), so a large review (many findings or many files) fails to post. It fails closed, but the review is lost. Cap the comment, e.g. keep the summary and findings and truncate the inventory with a "(N more files; see the bundle)" note, and/or pass --body-file; test a >65,536-char bundle.
    Nit: spec titles and playbook titles/checklists are still rendered raw. They come from the store and the trusted base, not the agent, so this is low risk, but an @mention in a spec title would notify on every posted review; code-spanning the titles would be cheap.
