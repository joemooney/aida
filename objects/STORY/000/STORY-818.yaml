title: 'Ask-AI escalation at prompts: `a` one-shot vendor judgment + guided-review agent shell (STORY-809 slice 2)'
description: |-
  Split from STORY-809 (advisor re-scope 2026-09-03, at the reviewer's PARTIAL verdict on PR for story-809-2): slice 1 (`?` deterministic context card at consequential forks) ships alone; THIS story is slice 2, held for an interactive/keyboard session because it spawns live vendor sessions and its UX forks deserve operator presence.

  Scope (from STORY-809's original acceptance): (a) `a` at the same prompts bundles the slice-1 context card + spec acceptance + diffstat into a one-shot headless vendor call ([agents] vendor adapter — claude -p / codex exec) and prints the recommendation, then re-asks; (b) `aida human review --guided` (or `g`): spawn an interactive advisor session pre-loaded with a review context snapshot (agent-new role-context machinery) — the reviewer-side sibling of /aida-guided-implement. TTY-only; headless flows never see either option.
