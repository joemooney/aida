- id: 01a1dc24-501b-7cc1-bdb5-d20b37a1c4b8
  author: joe
  content: 'Advisor triage (2026-11-14 15:24, CR on PR-4065 at 55849dc, codex reviewer, 4 findings; one round). BLOCKING: (1) pr_train_status.rs:340: --status calls resolve_forge_kind, which can rewrite .aida/config.toml, and reads origin with an unbounded Command::output before the 20 s CI timeout: a status command must write nothing and be bounded (AC4). Use a non-mutating forge classification and bounded reads; tests: stale pure-git config is left byte-identical, a stalled origin lookup still returns within the bound. (2) pr_train_status.rs:124-137: lock occupancy, not the driver record, decides running vs idle; the record is advisory PID evidence only (AC1/AC2). Tests: stale record + held lock reads running; live record + free lock reads idle. NON-BLOCKING, ruled once: (3) pr_train_journal.rs:158 note_step writing the .step sidecar with fs::write, and (4) pr_train_journal.rs:204 lock_held opening run.lock blocking: both need a FIFO or symlink planted inside .aida/train of the primary checkout, which only the operator and the train itself write; not a threat in this single-user project, so no O_NOFOLLOW/FIFO hardening and no tests for it. One cheap improvement to take in the same push because it serves --status itself: write .step through a temp file plus rename so a concurrent --status never reads a torn step. Gate: the story_2823 tests in one cargo run plus make check-ci-fast; push; delta review (ci:full at its launch).'
