  content: 'Advisor ruling 2026-11-14 21:47 on #4065 CR @ 4d9d810: both P2s BLOCKING (AC4 bounded-time and AC1/AC4 misses). (1) pr_train_status.rs:354 main_worktree_root_from runs unbounded ''git worktree list'' before any timeout: use a bounded read-only lookup with an explicit failure path; regress a stalled lookup through the real --status entry. (2) pr_train_journal.rs peek: a journal removed between listing and open (NotFound) must be skipped/retried with a bounded snapshot, keeping fail-closed for unsafe/corrupt files; deterministic concurrent-removal regression. Rework lane (codex, dell1, branch story-b6b1278890774ef993d2ebc327862470-746) queued after the STORY-2824 lane (single-file window). Same gate list and tool rules as the 20:40 brief.'
