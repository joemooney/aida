  author: joe
  content: 'Design decisions (operator, 2026-06-14) folded into acceptance: (1) aida solo --watch is the SINGLE leave-it-running command — it SUBSUMES aida queue integrate --watch (operator runs ONE terminal, not two). (2) Each tick includes a GARDEN PASS (doctor --heal stale-leases + OBE-briefs, reconcile-status, questions sweep) — the stale leases the operator saw were stale because no garden pass runs unattended today; the loop fixes that. (3) integrate --watch has unimplemented strategies — the solo loop must carry the full integrate behavior, not the partial one. (4) Ship --dry-run first (prints the planned cycle + exits one tick) so the loop is verifiable WITHOUT executing a live drain; the live loop is the autonomy keystone, built keyboard-supervised per the reliability-not-unsupervised principle. Slices: (1) loop skeleton + --dry-run + solo/TTL/drain-lock guards; (2) wire the real cycle (garden→assess/queue→burndown→integrate); (3) integrate strategy completeness; (4) advisor pipeline-activity surfacing (TASK-829).'
