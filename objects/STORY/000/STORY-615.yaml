title: 'Sandbox: headless default-deny egress via managed-settings network.allowManagedDomainsOnly'
description: Split out of STORY-612's original bundle. Slice 1 (STORY-605) added a [contained] allowed_hosts egress allowlist, but a non-allowlisted domain PROMPTS for approval; a headless claude -p drain has no human to answer, so egress is not truly default-deny. True block-without-prompt needs network.allowManagedDomainsOnly delivered via MANAGED settings (not the project --settings claude_contained_settings_json emits). Wire a managed-settings path so contained/os_wrap headless drains get hard default-deny egress to the allowlist. See docs/competitive-analysis/2026-06-13-sandbox-execution.md. relates SPIKE-61, STORY-605, STORY-612.
