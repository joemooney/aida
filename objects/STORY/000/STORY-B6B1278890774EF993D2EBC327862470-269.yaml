    - The informational expiry-notice ledger and its lock move to a persistent per-grant leaf directory `<AIDA home>/.aida/grant-notices/<grant-id>/` (notice.json, notice.lock), for ALL callers, contained and host. A contained lane's write profile gets ONLY its own grant's leaf directory. Canonical grant records (session-grants/<id>.json), revocation and session-grant-locks stay host-only and read-only in the lane.
    - No compatibility shim and no migration (single-user repo, surgery OK): legacy `<id>.notice.{json,lock}` files in session-grants are ignored, and a one-time duplicate notice after the upgrade is ACCEPTED. Sweep the legacy notice files on the host side in the same change (a best-effort remove of `*.notice.json` / `*.notice.lock` from session-grants).
    - Tests: a lane write profile contains the notice leaf and NOT session-grants; epoch/crossed dedup works within the new leaf; the directory-leaf refusal test covers a write aimed at session-grants.
    - Standing guidance for this lane: decide NON-SECURITY implementation details yourself (naming, file layout, helper shape) and note them in the PR body. Stop with a FORK only for an authority, confinement or credential choice that the rulings do not settle.
