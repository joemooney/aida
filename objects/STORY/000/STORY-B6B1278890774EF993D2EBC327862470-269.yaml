- id: 01a1962d-2f4e-70d0-954c-1918f1a2a871
  author: mcp
  content: |
    STORY-2238 SKETCH continued (2/2) — proposal only, independent advisor signoff still required.

    6. Actual installed Codex native composition
    Outer AIDA bwrap encloses the Codex harness itself (model/auth traffic included), local tool/MCP children and native sandbox. Inner native workspace-write-equivalent policy remains a second layer; approvals stay never. Effective writes/network are the INTERSECTION, not a union or a reason to grant HOME/main/.git. Both layers must support intended private-clone git add/commit, store/cache mutation, grants and proxy access.

    Proposed containment/native.rs: NativeCompositionPlan, probe_native_composition(), render_native_permissions(). For installed 0.166.0 use actual permission-profile syntax for model-free sandbox probes: codex sandbox -P <generated workspace-equivalent profile> -C <actual cwd> -- <probe>. Interactive/headless model command syntax remains its separately verified interface. Do not pass --model/--effort/interactive --sandbox options blindly to sandbox. Do not mix conflicting legacy sandbox_mode and modern permission profiles. Generate per-launch TOML overrides using serializers and immutable authority data; never edit global config or place authority in a project-writable .codex file. Native filesystem profiles must explicitly allow verified private-clone .git/index/objects/refs and exact store/cache leaves while protecting private clone config/hooks and shared authority; built-in :workspace's automatic .git read-only behavior alone does not solve TASK-2712. Confirm the installed version can express and actually honor those exceptions, including new lock/rename paths. If it cannot, refuse this composition; do not claim a passing mock argv fixed Git.

    Native tools need the inner loopback proxy, so select a profile allowing access to that proxy inside the already isolated outer netns, with direct external access still impossible. If Codex creates another netns, it must bridge ONLY the existing narrow proxy channel using a supported native recipe, not host networking. A disabled native network that blocks even the allowed host fails AC3. Verify native service/model auth uses the same outer proxy, not a different unfiltered service channel. Transport proxy settings explicitly through a supported adapter rather than widening BUG-2398's grant whitelist. Unsupported user filters/profiles/managed requirements produce named conflicts, never silent policy changes. Codex app-server local socket must be private, owned/mode-0700 and broker-reachable; current synthetic precondition failure is an unresolved compatibility issue, not evidence nested namespaces are impossible.

    Test userns nesting, PID/uid identity, inherited keyctl/add_key availability and actual key read, native .git carve-outs, cache symlink, proxy route, local IPC and shell filters in the REAL composed launcher. No explicit-native-to-AIDA or AIDA-to-full-access fallback. Default recommendation is retain both layers; if a deployed kernel/vendor cannot compose, AIDA launch refuses. Any proposal to disable the vendor layer needs a separately signed architectural amendment with costs and equivalent tests; it cannot be an implementer convenience or reduce the seven ACs. Existing TASK-2631 native-only opt-in remains truthfully separate.

    7. Background ownership and Claude migration
    AC1 includes Codex --bg. STORY-2254 is a dependency/integration seam, not grounds to remove this criterion: use its accepted detached exec implementation if available, otherwise this parent needs the generic host-supervised direct-exec strategy. Never wrap a launcher that hands the real worker to an external daemon. New containment/supervisor.rs: ContainedSupervisor, LaunchReady, stop_and_reap(), accept_background_run(). A long-lived host supervisor owns proxy and wrapper lifetime; the short-lived dispatcher returns only after actual sandbox/worker/grant/lease/registry readiness. --die-with-parent is bound to that supervisor, not the exiting CLI. Pin actual worker PID/start time and namespace identity, keep private 0600 logs, preserve headless wait env limits, fresh/resume restrictions as applicable. Failed acceptance stops/reaps the owned tree and revokes the new child grant. A returned receipt alone is not model execution.

    Choose migration for AC6, not an unproven equivalence claim. Claude interactive/headless/resume/bg all move through the SAME mandatory outer wrapper when posture=aida; preserve its existing permission/settings/plan-only/headless behavior as defense in depth, generated from the common boundary. Its native sandbox/proxy can remain nested if actual composition succeeds; proxy-to-proxy chaining can reach only AIDA's validated channel. Its existing daemon --bg cannot be called AIDA-contained unless the actual worker is inside the boundary: use supervised direct foreground/headless worker, or complete a proven in-boundary daemon strategy. Claude and Codex cannot silently lose protection while migration is partial. Per-path capability staging may refuse unsupported paths, but parent completion requires all claimed paths and parity evidence. Legacy os_wrap consumers (e.g. regen/seat inspection) retain their own no-network/inspection contracts; extracting helpers must not silently change them.

    Reporting: replace vendor==Claude containment_applied logic with validated effective plan/applied receipt, preserving aida/native/none tri-state and never relying on env display stamps as proof. Static permission reports say configured AIDA / preflight unavailable as appropriate; actual launch/status uses applied evidence, not "true because requested". Update config_cmd.rs permission_posture_report/permission_posture_for_agent/render_permission_posture_report, doctor_cmd.rs permission posture/bwrap and contained_store_boundary_findings, statusline_cmd.rs containment segment, launch previews/banners, agent_config.rs trusted reads. Docs: docs/cli/07-project-setup.md, docs/cli/06-roles-sessions.md, docs/agents/claude-bubblewrap-sandbox.md, docs/security/config-trust-boundary.md, docs/showcase/trust.html, AGENTS.md and OVERVIEW.md. Publish one write/network/grant/unsupported-kernel/host-service contract and native-vs-AIDA distinction. Do not claim control over hosted remote web/connector execution; disable or separately constrain surfaces that would perform local host actions outside this wrapper.

    8. Races, lifecycle and cleanup
    Policy SHA, executable identity, clone marker, .git backpointers, store/cache targets, protected nodes and runtime ownership are pinned before spawning, revalidated under appropriate locks at final release. Hold directory/file handles (openat2 beneath/no-symlink as applicable); bind from pinned descriptors or construct a host-owned immutable staging view. Canonicalize-then-bind-by-path alone has a swap race. Protect both source aliases and destination spelling; hardlink/rename attacks on protected authority need whole protected parent boundaries or refusal. A cache inode replaced by a concurrent host rebuild must not silently leave the child writing an obsolete cache: use existing shared writer/index locks and generation checks; refuse/restart cleanly, not widen the parent directory. Prepare required cache sidecars with existing persistence APIs, not unrelated duplicate locks.

    Proxy policy is immutable per run, checks each new connection including DNS result, and is never hot-widened by branch edits. Parent grant expiry/revocation and actual child authority are rechecked at release and every existing privileged operation; grants are not cached "allowed". Sibling runs use separate proxy/runtime/receipt identities. Launch PID reuse requires pidfd or PID+start-time checks; supervisor signal/cgroup cleanup targets only owned descendants. Cancel/timeout/SIGTERM/child exec failure/proxy death kills and reaps worker/relay before invalidating key/revoking new grant, releasing owned lease/registry records, closing channels and compare-deleting exact temporary roots. Crash recovery uses bounded stale-receipt checks with PID/start identities, not live polling or sweeping another session's resources. Retain workspace/logs when identity changed or cleanup cannot prove ownership; print recovery commands. Do not remove permanent queue/store/cache lock sidecars or adopted clones/branches/grants. Scrub credential-bearing env/FDs from diagnostics; bounded redacted proxy/preflight errors preserve cause and remediation.

    9. Named test plan (implementation work, NOT executed here)
    New aida-cli-lib/src/tests/story_2238_containment_tests.rs (register through existing test module), containment modules' unit tests, plus tests/test_story_2238_containment.py for actual installed-tool fixtures. Hermetic fixtures create synthetic HOME, CODEX_HOME/Claude state, trusted Git refs, sealed store/cache/role roster and temporary network endpoints. No ancestor/cwd discovery into the live repo (BUG-2381/2209), no credentials/global config; PATH mutators retain run_path_isolated_test. Live model-free gate must fail on a skipped backend when required, e.g. AIDA_REQUIRE_BWRAP_LIVE=1 and a proposed AIDA_REQUIRE_CODEX_CONTAINMENT_LIVE=1; ordinary developer absence can be a clearly reported skip, never acceptance evidence.

    Model-free named cases:
    AC1: all_managed_codex_paths_use_one_boundary (interactive/bg/TUI/headless implementer/reviewer/resume/rotation); bg_receipt_pins_real_worker_not_dispatcher; posture_report_configured_vs_applied; native_optin_remains_not_aida; contained_parent_cannot_downgrade.
    AC2: composed_write_inside_private_clone; composed_git_add_commit_private_index; linked_common_git_stays_denied; main_git_rename_detach_attack_denied; protected_paths_modify_rename_unlink_and_absent_create_denied; canonical_alias_and_hardlink_denied; actual_store_yaml_and_cache_sidecars_mutate_through_symlink; cache_replacement_refuses_stale_generation; no_write_outside_listed_roots; store_pointer_hook_profile_and_parent_grants_denied.
    AC3: allowed_host_connect_and_https; disallowed_host_denied; proxy_env_unset_no_direct_egress; raw_ip_ipv6_udp_dns_quic_denied; redirect_rechecks_host; dns_rebinding_private_target_denied; host_unix_and_abstract_socket_escape_denied; ambient_upstream_proxy_scrubbed; allowhostproxy_false_refuses; proxy_death_before_and_after_readiness_failclosed.
    AC4: composed_core_own_child_role_and_scope; baseline_present_empty_not_parent; wrong_seat_advisor_and_ungranted_refused; composed_granted_reviewer_records_attested_verdict; composed_ungranted_reviewer_refused; key_unavailable_quota_expired_revoked_wrong_subject_refused; native_pidns_review_identity_corroborated; adapter_never_forwards_parent_or_secret. These exercise actual grant validator and verdict writer in a synthetic project, not just env presence.
    AC5: missing_bwrap_userns_denied_named_remediation; nested_native_preflight_failure_spawns_no_model; invalid_policy_or_missing_protected_mount_refuses; socket_broker_unavailable_refuses; incomplete_bg_acceptance_reaps_and_revokes; proxy_ready_race_no_early_worker; executable_or_mount_swap_refuses.
    AC6: claude_same_write_network_grant_contract; claude_settings_plan_headless_parent_regressions; claude_bg_real_worker_inside; native_layers_cannot_broaden_outer_boundary.
    AC7: opencode_descriptor_reuses_backend_without_vendor_branch; unknown_adapter_or_version_refuses; branch_descriptor_and_hosts_cannot_widen_trusted_policy.
    Run retained BUG-1928/1929/1934/1982/1983, BUG-2144/2146, BUG-2151/2157/2158/2166/2169, BUG-2139, TASK-1169, TASK-2631, STORY-1662/1917 and BUG-2398 relevant fixtures. Old tests asserting shared network/Claude-only support are updated only where the signed new contract replaces them; preserve negative security assertions and mutation controls. Use positive controls demonstrating attacks succeed without the intended boundary.

    Operator/live tests, explicitly separate and not run by this sketch: story2238_live_codex_interactive; live_codex_bg_worker_receipt; live_codex_headless_implementer_git_store_cache; live_codex_reviewer_record_vs_ungranted; live_codex_api_key_allowed_host_and_blocked_host; live_codex_chatgpt_auth_refresh_allowed_hosts; live_claude_same_contract. Use isolated disposable project and purpose-issued test auth (never print it); actual tool calls under restrictive shell policy prove the model-to-tool boundary. Model-free proxy fixtures cannot establish API-key/ChatGPT authentication or model tool behavior. Require evidence for both model auth modes and installed versions, not remembered endpoint strings. Aida allowlist includes the previously reviewed api.openai.com/chatgpt.com/auth.openai.com only as trusted configured policy, not automatic vendor exemptions.

    10. Slices and open questions
    Possible vertical slices: (A) common capability/trusted policy+filesystem+supervisor with model-free end-to-end lane; (B) enforced proxy/netns/local-IPC and failure lifecycle; (C) actual Codex native/grant/store/cache/bg integration using BUG-2398 and STORY-2254; (D) Claude migration, full seven-AC installed-tool/live evidence, docs/reporting. Partial slices must remain unavailable/refused for unsupported AIDA paths; none completes the parent. No tickets, dispatch, disposition or approval are performed here.

    Signing advisor must resolve/verify: (Q1) installed Codex app-server socket precondition and exact native profile .git/lock exceptions under the real outer wrapper; (Q2) nested netns/proxy/Unix-IPC recipe and required seccomp/pidfd kernel floor, including whether the proposed connect broker can be built/tested without widening host access; (Q3) exact cache/own-grant runtime stamp writes and atomic-replacement behavior, synchronous store Git persistence needs; (Q4) trusted credential-refresh state layout for each vendor/auth mode; (Q5) STORY-2254 dependency vs direct-exec supervisor integration and Claude bg migration; (Q6) restrictive tool-env policy preserves child containment context without changing BUG-2398's whitelist; (Q7) precise host-pattern/port/private-network policy and permitted protocol set. These are binding evidence/design gaps, not implied acceptance reductions. No architecture signoff is claimed. Stop after sketch.
