- id: 01a19635-1cfa-7400-a0ea-9424b264783c
  author: joe
  content: |
    ADVISOR SIGNOFF: APPROVED WITH BINDING AMENDMENTS (STORY-2238). Independent advisor gate (claude advisor, 2026-11-01). I did not write the sketch. I checked the sketch (comments 2-3) against current source and BUG-2398 B1-B4. All 7 parent ACs stay required, with no shrink. The sketch's architecture is accepted: one mandatory launch-boundary owner, vendor capability data, outer AIDA bwrap enclosing the whole vendor harness, an unshared netns with a host-owned per-run proxy reached by an inherited channel, the native layer as an intersection, private seat clones for committing lanes, a host supervisor for bg, and Claude migration (not an equivalence claim) for AC6. Implementation may start on slices A and B now. Slice C (Codex native composition) starts only after probe P1 below passes, and the Unix-socket mechanism inside slice B is fixed by probe P2. Any deviation from these amendments needs a new advisor verdict.

    VERIFIED: every existing symbol the sketch cites is present (session.rs containment_applied:2241, bwrap_confinement_args_inner:4081, os_wrap_rw_paths:4151, vendor_containment_posture:2281; agent_launch.rs AIDA_ROLE_INSTANCE set at 6738; contained_boundary.rs contained_write_roots:48; and the rest). codex_tool_env_overrides is not built yet (it is BUG-2398's deliverable), and the sketch correctly treats it as a dependency. Installed tools: codex-cli 0.166.0, bubblewrap 0.9.0, kernel 7.0.0-42, Landlock ABI 8, yama ptrace_scope=1, dev.tty.legacy_tiocsti=0. The Codex binary contains "app-server-daemon", "app-server-control/app-server-control.sock", "app-server-startup.lock" and the 0700 precondition string. NOT VERIFIED: nested composition. My own session sandbox has max_user_namespaces=0, so bwrap cannot create a namespace here. I did not try to get around that. P1 below is the bounded host probe.

    BINDING AMENDMENTS (each one is a named test in the sketch's test file):

    C1 [BUG-2398 B2, blocking defect in sketch section 5]. The section 5 whitelist omits AIDA_ROLE_INSTANCE. role.rs:1495 current_role_instance_is_companion() reads it from env only, and it is a NARROWING marker, so dropping it in the core-policy tool shell widens a companion to a driver. The contract is the B1-B4 set exactly: the section 5 list plus AIDA_ROLE_INSTANCE. Test: companion_marker_survives_composed_tool_shell. Add B3 by name: AIDA_HANDLE_LAUNCH_TOKEN and AIDA_AGENT_REGISTRY_TOKEN are never forwarded through any layer (adapter, relay, supervisor env), and the docs record that a tool shell cannot bind its own handle/registry entry. B1 ordering stands: finalize at the real spawn boundary after child grant issuance, read explicit Command::get_envs only, and insert the -c flags at the Codex argv prefix INSIDE the outer bwrap argv. B4 stands: present-empty is proven in the real composed launcher, not only in bare codex sandbox.

    C2 [namespaces; real escape in today's argv]. Today's bwrap argv has no --unshare-pid. With a host-visible /proc, a same-uid child can open /proc/<host pid>/root (a writable host mount view) and /proc/<pid>/environ. Those are PTRACE_MODE_READ checks, which yama=1 does not restrict, so the child bypasses every RO bind and can read parent grant selectors. The AIDA posture MUST use --unshare-all (user, pid, ipc, net, uts, cgroup), --die-with-parent bound to the supervisor, and --cap-drop ALL, and must leave no host netns/pidfd/proc fd inside. bwrap sets no_new_privs; assert it. Tests: host_proc_root_and_environ_unreachable, no_host_pid_visible. Legacy os_wrap consumers keep their own contracts (sketch section 7), but file this escape against the existing headless Claude os_wrap as its own bug. Do not fix it silently inside this story.

    C3 [inherited FDs]. Rust's CLOEXEC default does not cover descriptors inherited from AIDA's own parent. The spawn of the outer bwrap must call close_range(3, ~0, CLOSE_RANGE_CLOEXEC) (fallback: iterate /proc/self/fd) in a pre_exec that only closes descriptors, then re-admit only the typed channels (proxy channel, bwrap --sync-fd/--block-fd, supervisor pipe) by explicit dup. This is FD hygiene. It is NOT the grant/authority pre_exec that BUG-2398 forbids. Tests: parent_leaked_socket_fd_absent_in_child (a positive control opens a non-CLOEXEC host Unix socket before launch), and only_typed_fds_present (enumerate /proc/self/fd inside).

    C4 [TTY injection]. Headless and bg lanes use --new-session. Interactive TTY lanes may not use it, so preflight requires dev.tty.legacy_tiocsti=0, and otherwise the interactive AIDA launch refuses with a named remediation. Test: tiocsti_preflight_refuses_when_enabled.

    C5 [pathname/abstract Unix sockets; mechanism fork resolved by probe P2]. Abstract sockets are isolated by the netns; the test stays. RO binds do not block connect() to pathname sockets: D-Bus, ssh/gpg agents, docker, sccache, and the HOST Codex daemon's control socket. Mechanism, in preference order: (a) Landlock pathname-Unix-connect scoping, if the deployed ABI provides it, allowing connect only beneath the per-run private runtime root plus the proxy channel. Landlock composes with Codex's own Landlock, cannot be undone by the child, and avoids a user-pointer broker. (b) Otherwise the sketch's seccomp user-notification broker exactly as written (the supervisor performs connect and injects with SECCOMP_IOCTL_NOTIF_ADDFD, never CONTINUE). (c) Otherwise refuse the backend. Masking known socket directories, or relying on a strict read view, is NOT sufficient on its own; it is only defense in depth. Do not ship (b) if (a) is available.

    C6 [Codex daemon never host-side; critical]. Codex 0.166 has an app-server daemon reached through app-server-control.sock with a startup lock. A contained lane must never connect to, or start, a daemon outside the wrapper. Remedy: each launch gets a host-prepared private vendor state root (0700, owned by the launch uid as seen inside the userns) holding CODEX_HOME's mutable state, with the control socket, startup lock, daemon state and CODEX_SQLITE_HOME all inside it. The host ~/.codex (with any daemon socket there) is never in the readable view, or it is hidden by an RO-empty overmount AND blocked by C5. The supervisor reaps any daemon the lane spawned with the tree (no detach or reparent outside the pidns: with --unshare-pid the pidns dies with its init). Tests: host_codex_daemon_socket_unreachable (a positive control runs a fake listener at the host spelling), lane_daemon_dies_with_supervisor, no_daemon_reuse_across_lanes. The author's "0700 socket directory" failure is most likely ownership/mode of the state root as seen in the userns (BUG-2398 comment 6: the root-host probe passes). P1 must confirm the cause. Fix it by preparing that root correctly, never by widening permissions or sharing the host CODEX_HOME.

    C7 [credentials: read roots, no broad writable roots]. Auth material is RO-bound by exact leaf. Never rw-bind ~/.codex, ~/.claude, HOME or ~/.config wholesale. Refresh, resolved by probe P3, in preference order: (i) the vendor can relocate its auth file into its own directory: rw-bind only that dedicated leaf directory. (ii) Otherwise the private state root holds a copy, and the host supervisor writes back ONLY a shape-validated auth file, atomically, under a lock, and never any other file. (iii) API-key mode needs nothing writable, and the key travels only as the vendor's own env var, never in argv/logs. Keyring-backed credential stores (Secret Service over D-Bus) are unsupported under the AIDA posture and refuse by name. AC3 still requires live evidence for both ChatGPT and API-key modes.

    C8 [Git own-scope vs hooks/config]. Accept private-clone ownership: index/objects/refs/logs/packed-refs writable. Protected RO set, minimum: .git/config, config.worktree, hooks/, info/, objects/info/alternates, commondir/gitdir pointers, the clone marker, plus main's common dir in full. Because a contained lane can still execute anything INSIDE its sandbox, the real risk is host-side git later running on the clone. So every host-side git invocation on a contained clone (ship, review, publish, seat inspection) must go through the hardened git_ops invocation (core.hooksPath=/dev/null, core.fsmonitor=false, and no include of the clone's config for executable keys: filters, credential/askpass helpers, sshCommand, pager). Ratchet this with a test that fails on a raw Command::new("git") against a clone path. Test: planted_hook_and_filter_never_run_host_side.

    C9 [store/cache]. Accepted as sketched: exact cache.db plus CACHE_SANDBOX_SIDECARS leaves, primed before confinement; real SQLite mutation through the symlink; store YAML through the existing locks; store git persistence through a typed host store-writer, never a common-dir grant. Required write paths use --bind (fail closed), never --bind-try. The current code's --bind-try for rw paths must not carry into the AIDA posture.

    C10 [grant keyring]. Accepted: keys are inherited, with no new keyring mechanism. In the composed launcher, prove actual key READ (not just keyctl availability) after user+pid namespacing with the uid mapped 1:1, and refuse if the mapping is not identity. Also prove a granted reviewer records a verdict and an ungranted one is refused. ADR-66 same-uid replay stays a documented residual.

    C11 [vendor capability data; AC7]. Accepted. Additions: the descriptor declares the vendor's local-IPC/daemon layout (C6) and its credential layout/refresh mode (C7) as data. An unknown or undeclared daemon/IPC behavior refuses. The OpenCode test must use a descriptor with no native layer.

    C12 [Claude migration; AC6]. Migration is the chosen route. Nested Claude bwrap needs userns inside the outer sandbox, so the outer must NOT pass --disable-userns. Inherited MNT_LOCKED mounts keep the RO overmounts unremovable; add test nested_userns_cannot_unmount_protected. Claude's in-sandbox proxy must chain only to AIDA's channel, which is proven live. Until it is, Claude AIDA-posture paths refuse; they do not silently fall back to Claude-only containment labelled "aida".

    PRE-CODE PROBES (model-free; synthetic HOME/CODEX_HOME at mode 0700; no keys, auth or model calls; no global edits; run on the real host, outside any agent sandbox, by the slice-C implementer or the operator; results posted on this spec before slice C code):
    P1: bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --bind <scratch> <scratch> -- env HOME=... CODEX_HOME=<scratch>/ch codex sandbox -P :workspace -C <scratch>/w -- sh -c "id; keyctl show @s; printenv AIDA_SESSION_GRANT | od -c". Pass means exit 0, inner uid == host uid, and the session keyring is visible. If the 0700 error recurs, record stat of the socket directory inside versus outside and fix the preparation (C6). If composition fails for a reason other than preparation, STOP and return to the advisor. That would be the real design fork (drop the native layer or refuse the backend), and it needs a signed amendment.
    P2: the Landlock feature probe on the deployed kernel decides C5 (a) versus (b).
    P3: inspect where 0.166 writes auth on refresh (a synthetic invalid auth file plus inotify on the state root, with no network) and pick C7 (i), (ii) or (iii).

    Slices as sketched (A-D). No slice completes the parent, and partial slices refuse unsupported paths. Review is STRICT, independent and authority-reviewed, with the operator merge floor. Gate: LIGHT, one targeted cargo filter plus make check-ci-fast; the live model-free gate requires AIDA_REQUIRE_BWRAP_LIVE=1 and AIDA_REQUIRE_CODEX_CONTAINMENT_LIVE=1 in CI-equivalent runs. A skip is never evidence.
