- id: 01a1962c-ec81-7603-a72c-0cad141aecdf
  author: mcp
  content: |
    STORY-2238 IMPLEMENTATION ARCHITECTURE SKETCH — proposed only; no approval, disposition, implementation, PR or dispatch. Author: this Codex advisor session, 2026-11-01. Another independent advisor must sign before implementation. All seven parent ACs remain required.

    Evidence/scope
    Read the full STORY-2238/comments, TASK-2631/comments including final post-merge check, BUG-2398/comments including superseding narrow A1–A6 decision, TASK-2712, AGENTS, two-seat protocol, rework-brief craft and recovery playbooks. TASK-2631 shipped trusted explicit native posture, NOT an AIDA Codex backend; its Codex --bg implementation was removed into STORY-2254. BUG-2398 is the nonsecret tool-env adapter, not permission-policy/cache/keyring redesign. BUG-2394 MCP approval remains separate. Linux only. No cargo, model calls, real credentials, global-config inspection/edits, launches or state dispositions in this sketch session.

    Read-only/model-free evidence: installed codex-cli 0.166.0; its actual interface is "codex sandbox -P :workspace -C <scratch> -- <command>", not "sandbox linux", nor blindly reusing interactive model flags. Synthetic HOME/CODEX_HOME with inherit=core and synthetic metadata was used. Bare bwrap --unshare-user --unshare-net /bin/true succeeded here. Both direct Codex and Codex-inside-bwrap probes stopped before execution with "app-server socket directory must be a user-owned directory with mode 0700". Thus this session does NOT establish native composition/key possession/role/verdict success. BUG-2398's operator comment separately reports successful installed native env/keyctl probes; it does not prove the proposed outer wrapper. Record both facts, not a pass inferred from either. Temporary fixtures were removed.

    1. Owner, trigger, ordering
    Introduce one launch-boundary owner, proposed aida-cli-lib/src/containment/mod.rs: ContainmentRequest, ContainmentPlan, AppliedContainment, prepare_contained_launch(), spawn_contained_launch(), exec_contained_launch(), ContainedRun. Final vendor argv/identity/child grant and actual launch cwd are inputs; downstream launchers cannot opt out. Every contained interactive, bg, headless implementer/reviewer, resumed/rotating, TUI, dispatch/compete/judge path routes through it. Preserve inherited containment even when a caller passes false. os_wrap=false/AIDA_OS_WRAP=0 must not disable an explicitly requested AIDA posture.

    Sequence: pin trusted policy and capabilities -> resolve/verify main, actual workspace, clone/store/cache -> prepare required protected placeholders/runtime/sidecars and shipped store-hook profile -> preflight namespace/network/native composition -> mint only delegated child authority -> build final child env and BUG-2398 overrides -> start proxy and isolated wrapper behind readiness barrier -> run actual boundary/grant preflight -> bind actual child identity and registry/lease -> release model-exec barrier. On refusal undo only newly owned resources. Preview renders redacted plan, never probes/mints/starts. No model execution before complete acceptance.

    Exact existing integration symbols: session.rs containment_posture_in/vendor_containment_posture/containment_posture/containment_applied, require_vendor_containment/require_child_containment/child_containment_preflight, bwrap_confinement_args_inner/os_wrap_rw_paths/os_wrapped_program_and_args, build_codex_session_command/exec_codex_session, headless_vendor_args/codex_headless_args_with_model_and_effort, spawn_reviewer_launch_plan, build_exec_vendor_headless_command_for/exec_vendor_headless/run_vendor_headless_child, spawn_claude_headless_resume_granted/build_claude_resume_exec_command. agent_launch.rs wrapped_agent_program_and_args/tool_contained_flags/build_agent_new_bg_command/refuse_bg_under_os_wrap/run_agent_generation/run_tracked_agent_after_spawn/supervise_spawned_child; lib_part2.rs refuse_uncontainable_agent_tool; compete_cmd.rs existing containment checks. Audit all Command spawn/exec sites (including dispatch/team/burndown/intake/questions/drain children), not just string matches for claude. Keep existing receipt/rollback and headless_wait_envs contracts.

    2. Capabilities are data (AC7)
    Proposed containment/vendor.rs: VendorContainmentCapabilities, NativeSandboxAdapter, VendorStateLayout, ToolEnvTransport, BackgroundStrategy, resolve_vendor_capabilities(). Trusted versioned shipped descriptor data (proposed aida-core/templates/containment-vendors.toml), with validated enum adapters, argv templates/positions, executable/version constraints, per-vendor runtime/auth/state paths, local-IPC relocation, proxy env transport, native nesting recipe and supported interactive/headless/bg/resume modes. No arbitrary branch-defined code, shell templates or self-declared containment. Common backend never switches on Claude/Codex names. Native adapters may implement vendor syntax; adding OpenCode using an existing adapter or no native layer is a descriptor/normal launcher registration change, no containment backend change. Unknown/incompatible capability refuses. Pin descriptor+binary identity; version mismatch triggers model-free compatibility check, never guessed flags.

    Read posture/allowlist/read roots/cache grants/capability authority from one pinned trusted default-branch policy (agent_config.rs load_contained_vendor, trusted_config.rs read_config_at_sha/trusted_default_branch_sha); update scripts/config-trust.toml. Branch changes may tighten but never widen trusted roots/hosts/posture. Missing/malformed authority policy refuses, empty host list means deny all. Native remains explicitly native and never receives AIDA credit; trusted codex="aida" selects the new backend. Do not silently relabel current codex="native" as contained.

    3. Filesystem plan (AC2, TASK-2712)
    Proposed containment/filesystem.rs: ResolvedWriteBoundary, ProtectedMount, resolve_write_boundary(), prepare_boundary_paths(), validate_mount_identities(), bwrap_args(). Derive one canonical plan shared by OS mounts, native permissions, diagnostics and tests. Start RO root (or optional existing strict-read view), private /dev,/proc,/tmp and per-launch /run; rw binds only actual code workspace, verified store worktree, exact shared cache leaves/sidecars, approved build caches/seat target, narrowly enumerated runtime/mail/deputy leaves, and descriptor state. Private scratch is ephemeral, not writable host /tmp. Preserve optional read allowlist; do not use broad /run or /var bindings to expose host services in strict mode.

    Reuse contained_boundary.rs contained_write_roots/contained_store_write_paths/contained_store_deny_write_paths/contained_mailbox_write_paths/contained_deputy_write_paths/contained_store_boundary_gaps; session.rs verify_linked_worktree_main/main_git_deny_paths/contained_store_grant; seat_clone.rs tree_kind_for_launch/host_recorded_clone/seat_extra_write_paths/seat_build_env. Verify host-recorded main and symlink targets, not the agent's claimed .git or env. Mount canonical cache target AND required spellings; prime cache.db and every CACHE_SANDBOX_SIDECARS (including persistent locking files) before confinement. SQLite actual mutation must work through the symlink. Never bind all main/.aida or ~/.aida.

    Apply protected RO overmounts LAST: workspace .aida configuration/control subtree with explicit runtime/cache exceptions; agent settings/skills/policy trees (.claude/.codex/.agents and relevant instructions/config); main common git authority; linked worktree .git pointer, its gitdir/commondir/backpointer/config.worktree; store .git pointer and shipped host hook-profile authority. Missing protected names need host-prepared mountpoints or an RO parent view so the child cannot create them later. Denies beat every nested rw root. Reject root/protected overlaps and aliases, unsafe ownership/modes, symlink swaps/hardlink aliases that bypass a protected file, and unresolved required paths. No bind-try for required safety/write paths.

    A linked worktree's shared common Git objects/refs/logs/index must NOT be granted wholesale or leaf-granted beneath writable ancestors: BUG-2169 demonstrated rename/detach/config attacks. For committing implementer/reviewer lanes choose the existing verified private seat clone, with its own index/objects/refs/logs writable and clone authority config/hooks/marker protected. Existing linked trees remain safely read-only for Git metadata or refuse with private-clone continuation; no silent fallback to /tmp publishing. Report actual clone/head in receipts. Shared main/store git authority remains protected; YAML/cache writes use existing locks, store commits retain the verified host store-writer boundary (if an operation needs unavailable host authority it refuses, not a common-dir grant). If store Git persistence is required synchronously, use a typed narrow store-writer service under existing locks/profile, not arbitrary host exec.

    List caches explicitly: private target; approved Cargo registry/git download and npm cache leaves; RO cargo/rustup config/binaries and host credential/config files unless a separately trusted grant requires them. Enumerate vendor session/log/refresh state, avoiding a writable enclosing HOME/CODEX_HOME/.claude authority directory. Credential refresh needing atomic replacement must have a specifically reviewed leaf-directory layout; inability refuses before model work.

    4. Egress and allowHostProxy (AC3, AC5)
    Proposed containment/network.rs: EgressPolicy, ProxyGuard, start_egress_proxy(), await_proxy_ready(), validate_proxy_request(), validate_destination(), relay_proxy_fd(); containment/ipc.rs: SocketPolicy, install_socket_policy(), broker_local_connect(). A host-owned, per-run proxy has external network; ALL agent/vendor/local-MCP/helper processes are in unshared netns with loopback only, no veth/default route/host netns fd/caps. An inherited, connected narrow proxy channel reaches an in-netns HTTP/CONNECT relay; export upper/lower HTTP(S)_PROXY and necessary tool equivalents, empty NO_PROXY. Proxy env improves compatibility but namespace enforces no bypass. Host proxy holds no model credentials, never injects them, and logs only bounded destination/decision metadata.

    Exact normalized host allowlist from pinned policy, explicit supported ports/protocols; reject ambiguous authorities, userinfo, mixed Host/CONNECT targets, IP-literal/IPv6 tricks, wildcard confusion, rebinding, loopback/private/link-local/metadata/multicast destinations unless separately explicit trusted policy. Resolve on proxy side and pin checked addresses for each connect; no tool DNS socket/UDP/QUIC/raw/SSH bypass. HTTP requests and CONNECT/WebSocket tunnels are host-granular: allowed hosts may themselves relay traffic; document this residual, do not claim URL/content filtering. Redirects/new destinations require new checked connections. Empty list denies; malformed policy/proxy death/relay failure causes refusal or run termination, never direct networking.

    allowHostProxy is an AIDA-controlled transport capability, NOT "trust ambient HTTP_PROXY" or "share network". False means deny host-proxy transport; if requested AIDA egress requires it, refuse named. True permits only the launch-owned validated proxy channel and never a user-supplied upstream proxy; scrub ambient proxy values, arbitrary proxy chains and bearer material. This name is a proposed internal contract, not a verified installed Codex option. Vendor proxy exceptions must be intersected with it, never broaden it. No hard-coded port: kernel ephemeral inner listener or allocated registry port; consult ~/.ports before assigning any persistent port.

    RO mounts do not block filesystem Unix-socket connects. Mask host /run,/var/run, credential agents, Docker, D-Bus, debugger/exec/sccache endpoints; close inherited socket/netns descriptors except the typed channels. Isolated abstract sockets stay in netns. For arbitrary pathname sockets, require a fail-closed local-connect policy: seccomp user notification broker validates/copies arguments and performs connect itself against pinned per-run private runtime/socket roots, never CONTINUE with mutable user pointers. Permit only private runtime IPC and the narrow proxy channel; refuse host-service sockets even under RO paths. Relocate vendor app-server IPC via capability data. If required kernel pidfd/seccomp facilities or runtime relocation do not work, refuse this backend. No unsandboxed command/host-exec socket is exposed. This cost is explicit; simple shared-network bwrap+proxy-env does not meet AC3.

    5. Grant/keyring and childenv (AC4)
    Reuse grant_keyring.rs install/read/invalidate and gate/seat_authority.rs issue_launch_child/preflight_sandboxed_child_key/issue_headless_child/grant_check_for_at/bind_grant_to_pid/revoke_by_id, through existing authorized lifecycle seams. Inherit the child's already installed key through fork/exec/bwrap/native layers; no new keyring pointers, ambient resolver, payload transport, join/link redesign or pre_exec authority mechanism. Keep subject/project/seat/parent/expiry/revocation/key-possession validation and existing key quota refusals. PID namespaces require actual key evidence; hidden ancestry must not be treated as success. Preserve review lease/agent identity evidence across namespace mapping using existing corroborated bindings, never env-only review authority.

    Consume BUG-2398's final child-Command-derived EXACT whitelist via codex_tool_env_overrides: AIDA_SESSION_GRANT (own validated selector or present-empty baseline), AIDA_SESSION_ROLE, AIDA_USER, AIDA_AGENT_NAME, AIDA_AGENT_TYPE, AIDA_SESSION_ID, AIDA_SESSION_SCOPE, AIDA_PROJECT_ROOT, AIDA_AGENT_CONTEXT_FILE, AIDA_CONTAINMENT_POSTURE, AIDA_HEADLESS. TOML serialize; reject NUL/newline; absent stays absent, empty stays empty; preserve user's other explicit set entries/core filtering. Never forward parent grant, arbitrary parent env, registry token, grant file, key/secret/password/token values, or AIDA_CONTAINED through that adapter. AIDA_CONTAINED is launcher confinement context, not grant authority; native-only receives none. If nested tool shells cannot retain the inherited-containment behavior under that contract, refuse the unsupported composition pending independent design review, not an enlarged whitelist.

    Grant records/roster read-only. Enumerate exact own-grant lock/notice/runtime stamp paths that actual permitted operations need; precreate/pin them and permit only those leaves (or move non-authoritative ephemeral notices into private runtime with signed compatibility), not writable grant directory/parent grants/role policy. Required record mutations/revocation stay trusted host lifecycle. Test real role, own-scope operation and reviewer record, not just keyctl availability. ADR-66's recorded same-uid selector/key replay residual is unchanged; do not claim adversarial parent replay is solved.
