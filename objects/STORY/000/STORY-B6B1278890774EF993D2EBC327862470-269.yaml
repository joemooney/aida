- id: 01a19659-2485-7a82-aa41-a605a69cbb3f
  author: joe
  content: 'HOST P2 DECISION: deployed kernel reports Landlock ABI8. Official Linux kernel documentation https://docs.kernel.org/userspace-api/landlock.html states pathname Unix-socket resolution right LANDLOCK_ACCESS_FS_RESOLVE_UNIX begins at ABI9; TCP/abstract-scope support is not pathname-connect confinement. This host therefore requires the already-approved C5 broker branch, or named refusal, for full contained launches. Do not silently omit the Unix-socket bar. The stricter namespace P1 probe succeeded for default and no-daemon installed CLI; real credential refresh P3 and own-grant/model lifecycle proofs remain gates. New backend C2 hardening stays binding; existing legacy escape remains unproven by actual host negative probe.'
