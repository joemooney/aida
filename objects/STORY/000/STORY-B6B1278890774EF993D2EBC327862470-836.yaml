  content: |-
    ## Implementer approach (slice 1, AC1)

    ### Acceptance criteria and evidence
    - **AC1 (unit, aida-cli-lib `review_shadow::tests`)**: knob parse (default off, bool-only); knob off → no shadow spawned; knob on → a stub `aida` program receives exactly `review prepare --pr N --run-review --adversarial --agent claude --challenger-agent claude --json` (never `--post-comment`), and a whole-tree snapshot of the project before/after shows the ONLY new file is `.aida/review-shadow/runs.jsonl` (0600) — so nothing in `.aida/gate-ledger`, the store, merge holds; no forge write since `--post-comment` is never passed; cap of 2 (and real+shadow < max_concurrent) respected; a failing/exit-4 stub is logged as a row and never errors; finding text capped at 500 chars.
    - AC2 (report) is slice 2 — not in this PR.

    ### Expected files
    - `aida-cli-lib/src/review_shadow.rs` (new), `aida-cli-lib/src/lib.rs` (mod), `aida-cli-lib/src/review_watch.rs` (one hook in the dispatch arm, skipped under `--once`), `docs/cli/07-project-setup.md` (knob doc).

    ### Ambiguities / conflicts as questions
    - "Counted inside the budget, never starve real reviews": I read this as shadows only use SPARE capacity (launch only when real active + shadow active < max_concurrent, and shadow < 2); real admission is unchanged so a shadow never delays a real review. A real review admitted later can briefly push the total over the cap while a shadow finishes.
    - Shadow runs are threads of the long-running watcher; a `--once` pass launches none (it would exit before the row is written).
