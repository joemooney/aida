- id: 01a1f0a2-4903-7d62-8408-88440fbecb89
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2912):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 75305b9569e5
    Recorded: 2026-11-18T21:47:09.330500967+00:00
    Findings:
    1. [P1] Compare actual failures inside gates/contracts instead of treating their lane names as failures (aida-cli-lib/src/promotion_failures.rs:32-40, 372-374). NON_TEST_LANES exempts CI (gates) and CI (contracts) from per-test comparison, although ci.yml runs real tests in both: MCP stdio and fixture namespace tests in gates; history templates, latency regressions, originating-prompt and work-CI relay tests in contracts. If P fails history templates and C fails a newly broken work-CI relay test, both become only check: CI (contracts), so decide allows C. This violates accdae61/acd07159 and the advisor's fail-closed direction. Extract individual failing test/contract identities from these lanes or refuse their red results when comparable evidence is unavailable. Add a regression with different failures in the same lane.
    2. [P1] Require complete shard evidence, including doctests and every invocation (aida-cli-lib/src/promotion_failures.rs:431-469, 852-883). shard_reports reads only junit*.xml and shard_results accepts any nonempty collection containing at least one failed case. scripts/ci-test-shards.py runs several commands in rest, including doctests that never produce nextest JUnit, and continues after command failures; ci.yml uploads test-run.log alongside the XML. If P and C share one nextest failure but C adds a doctest failure, the extra failure is never read and C is allowed. Similarly, an omitted later invocation's report is not detected once an earlier report contains a failure. Read the log/step evidence and validate the complete expected invocation/report inventory; refuse unexplained failures or missing results. Cover shared-nextest-plus-new-doctest and partial-artifact cases. This violates acd07159/ac7366e2.
    3. [P1] Prepare P's required executable fixtures before interpreting local test failures (aida-cli-lib/src/promotion_failures.rs:914-945). The fallback creates a fresh checkout and runs only the selected test target. For aida-cli-lib library tests this does not build the aida executable. Existing BUG-1745/BUG-1749 tests explicitly assert that a matching built executable exists; ci.yml prebuilds aida for lib lanes and porcelain for CLI lanes. On the fresh fallback target these tests fail merely because the prerequisite binary is absent. libtest_outcome reports that as a real failure at P, allowing a C-only product regression to be classified as pre-existing. Build the prerequisites from P and provide the matching target-directory environment before running tests; setup failures must remain unknown/refused. Add an executable-level fallback regression rather than only a fake rerun result.
    4. [P1] Reproduce the CI test configuration in the no-run fallback (aida-cli-lib/src/promotion_failures.rs:935-942). Local reruns always use the agent Cargo profile and only package/target selectors. CI runs the dev profile, while agent inherits release and disables debug assertions; rest also explicitly enables aida-core postgres/gitlab/github/jira features. A failure at P under the optimized configuration need not exist under CI's configuration, so it can incorrectly excuse a C-only failure. Feature-gated tests can instead disappear and cause an unnecessary refusal even for equal failing sets. Preserve the originating shard's profile, feature selection and relevant runner setup, refusing when those cannot be reconstructed. Test both a feature-gated test and a profile-dependent outcome. This leaves the real accdae61 fallback unverified.
    5. [P2] Isolate or serialize evidence scratch state and last-decision writes (aida-cli-lib/src/promotion_failures.rs:852-857, 891-911, 974-979; aida-cli-lib/src/dev_build.rs:723-726). The first ci_gate runs before the live-dir lock. Concurrent builds use the same artifact destinations, rerun-<P> checkout and rerun-target, and each removes existing paths; they also use the same last-decision temporary filename. One precheck can remove another's artifact or active checkout, causing spurious missing evidence, harness failures or lost audit writes. The locked swap-stage check can also race another invocation's unlocked precheck. Use invocation-private evidence paths and unique atomic-write temporaries, or a lock covering every evidence user. Add a two-invocation concurrency fixture.
    6. [P2] Bound rerun descendants and pipe collection, not just the Cargo PID (aida-cli-lib/src/promotion_failures.rs:943-944, using dev_build.rs:2029-2042). run_with_timeout kills only its immediate child at the deadline, then unconditionally joins readers until stdout/stderr close. Cargo runs tests as descendants; a hung test or its child can survive Cargo's termination while retaining those pipes. The advertised one-hour rerun limit then never returns, and the second comparison can retain the live-dir lock indefinitely, blocking promotion and rollback. Use process-group cleanup plus bounded pipe collection for this new arbitrary-test execution path, and cover a descendant that retains stdout past timeout.
    7. [P2] Show both actual failing sets in dev status (aida-cli-lib/src/promotion_failures.rs:567-586; aida-cli-lib/src/dev_build.rs:2481-2489). summary prints only the two set lengths plus new/fixed/unconfirmed differences. In the central equal-failing-set case, none of the shared failure names is displayed anywhere by ci_decision_lines. Operators cannot see which failures justified promotion, despite ac77195c requiring candidate, P, failing sets and verdict in status. Render candidate_failing and promoted_failing explicitly, and extend the status test to assert the shared failing-test name, not only the verdict and SHA.
    8. [P2] Resolve the new required FAST source-gate violation (aida-cli-lib/src/dev_build.rs:912-913). Exact-head job 135128762620 reports the new interpolated promote_live_binary_from diagnostic as a hand-built TOML string violation at line 912; Check Rust test portability ratchet fails, which also fails Build (ubuntu-latest), job 135136954484. This is an identified introduced source-gate defect, not an unexplained red CI state. Render the displayed value with the approved TOML quoting helper or adjust the diagnostic so it satisfies the source rule without weakening the baseline. The other apparent classifier-inventory errors earlier in this log belong to passing self-tests and are not separate findings.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
