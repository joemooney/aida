  content: 'ADVISOR RULING 2026-11-18 14:50 (advisor-119) on #4265 round-1 CR at 75305b9: SIMPLIFY. REMOVE the local no-run rerun fallback (promotion_failures.rs:914-945 and its scratch and rerun plumbing). When CI per-test evidence for P or C is missing or incomplete, REFUSE promotion (fail closed, as this spec already requires) and say which evidence is missing. That eliminates findings 3, 4, 5 and 6. Fix for round 2: (1) P1: compare actual failing tests inside CI (gates) and CI (contracts) too, with no lane-name exemption; (2) P1: require complete shard evidence: every shard command, including doctests, via test-run.log alongside the junit XML; a shard with an unparsed or incomplete invocation means missing evidence, so refuse; (7) AC ac77195c: aida dev status renders candidate_failing and promoted_failing explicitly, plus the verdict; (8) the FAST source-gate violation at dev_build.rs:912-913 (use the approved TOML quoting helper). A regression for each. STRICT. A round-2 reviewer treats the removed fallback as intended scope reduction, not an AC miss.'
