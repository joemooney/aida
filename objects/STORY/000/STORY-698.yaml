title: 'Human test plan per spec: capture builder''s verification steps + aggregate into PR bodies'
description: |-
  Capture the verification steps the builder ACTUALLY ran when a spec is marked done, and surface them in the PR body — an implementation audit trail. Design LOCKED 2026-07-01 (operator): reuse the existing implementation_info.test_coverage_notes field, mirror the shipped capture_interface_changes prompt (STORY-542). NO new model field, NO cache-schema migration. The planned ## Test Plan section is a separate surface already rendered by STORY-699.

  ## Acceptance
  - WHEN a spec is marked done via queue done at an interactive TTY, THE command SHALL offer to record the verification steps the builder ran, mirroring the capture_interface_changes prompt.
  - THE captured steps SHALL be stored in implementation_info.test_coverage_notes; no new model field and no cache-schema migration SHALL be introduced.
  - THE queue done command SHALL accept a repeatable --test-plan STEP flag and a --no-test-plan flag; WHEN either is given THE interactive prompt SHALL be skipped.
  - WHEN queue done runs non-interactively with no flag, THE capture SHALL leave test_coverage_notes untouched and print no prompt.
  - THE capture SHALL be best-effort: an error during capture SHALL NOT fail queue done.
  - WHEN test_coverage_notes is already set and no flag overrides it, THE capture SHALL leave the existing value unchanged.
  - WHEN a PR body is generated for a spec whose test_coverage_notes is set, THE body SHALL include those verification steps.
  - THE capture SHALL be disableable via AIDA_AUTO_TEST_PLAN_CAPTURE=false, mirroring AIDA_AUTO_FOLLOWUPS.

  ## Out of scope
  - The planned ## Test Plan section rendering (STORY-699, already shipped).
  - A separate test_plan model field (rejected: duplicate source of truth).
