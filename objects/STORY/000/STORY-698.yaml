title: 'Human test plan per spec: capture builder''s verification steps + aggregate into PR bodies'
description: |-
  Specs should carry a HUMAN TEST PLAN — "do this → expect that" steps a person can follow to verify the work WITHOUT reading code — distinct from acceptance criteria ("what must be true") and `aida goal` ("machine-checkable condition"). Surfaced 2026-06-26 reviewing the TUI redesign PR: a human reviewer of autonomous work needs a verification script, not just a contract.

  KEY INSIGHT: implementers ALREADY produce this — every agent report ends with "launch X, press Y, expect Z." The PR #1145 per-spec test plan was hand-assembled from exactly that. The substrate just doesn't capture it. So the leverage is CAPTURE, not authoring.

  SHAPE:
  1. A `## Test Plan` section / `verification` field on specs (concise do→expect steps; human-runnable; notes which steps MUTATE state).
  2. Populated by the IMPLEMENTER at done-time (it knows how to exercise what it built), or the author at file-time; could derive a skeleton from acceptance criteria.
  3. AGGREGATED INTO PR BODIES automatically — generate the per-spec test plan section from the specs a PR closes (turn the hand-written #1145 walkthrough into one command). Pairs with the (SPEC-ID)-trailer→auto-complete machinery.

  WHY IT MATTERS: making agent-built work human-verifiable is core agent-collaboration value (the probe thesis: a human must be able to check what agents built). Complements aida goal (machine) + acceptance (contract) with the missing human-verification layer.

  ACCEPTANCE (when built): a spec can carry a test plan; an implementer/done flow can capture it; a PR-body generator aggregates the test plans of closed specs.
