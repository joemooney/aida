title: 'aida tui redesign Slice 1: prototype the action->target loop on the Backlog scope'
description: |-
  Slice 1 of the aida tui redesign (see docs/plans/2026-06-25-tui-action-target-redesign.md). The KEYSTONE prototype: prove the action->target gesture grammar feels fast and obvious on ONE scope before committing to the full rewrite.

  SCOPE (bounded, throwaway-able): the Backlog scope only; the groom verb (hardcode Backlog's verb list). Launch behind a flag/env so the existing TUI is untouched.

  LOOP TO IMPLEMENT:
  - Top panel = a list. On launch it holds the SCOPES (start with just Backlog; stub the others as labels). Highlighting Backlog shows its items in the bottom panel.
  - Enter on Backlog DRILLS: top panel becomes Backlog's VERBS (groom, + stubs); breadcrumb shows "Backlog > ...".
  - Tab moves focus to the bottom panel (the target items); Space toggles multi-select; Shift-Tab returns to the verb list; Esc pops a level (verbs -> scopes) / closes a modal.
  - Enter on the groom verb EXECUTES on the selected items; if none are selected, a confirm popup asks "groom all N?". (Execution may stub/shell to `aida` with a clear TODO — the loop and selection are what matter for Slice 1.)
  - `p` (or Enter on a focused item) opens an item MODAL previewing the spec body (a simple paragraph is fine for Slice 1; STORY-689 makes it markdown later).

  REUSE / GROUND IN EXISTING CODE: aida-tui is ratatui. Reuse cmd_palette.rs (fuzzy core, STORY-682) for context-sensitive filtering; reuse the cache-fast backlog fetch (dashboard.rs fetch_status(model, ["approved","planned"])) for items; reuse theme.rs for colors. Do NOT use the preview_via_show stdout-capture pattern (render structured data, cache per row). Add as a new module + a launch toggle in lib.rs run(); keep the existing TUI fully working.

  ACCEPTANCE:
  - `aida tui` with the redesign toggle launches the new two-panel screen; the existing TUI is unchanged without the toggle.
  - The full loop works: scopes -> Enter drills to verbs -> Tab to items -> Space multi-select -> Enter on groom executes on selection (or confirm-all when none selected) -> Esc pops levels -> breadcrumb tracks depth -> `p` opens the item modal.
  - The core state machine (scope/verb/target focus + selection + nav stack) has unit tests, pure (no terminal).
  - cargo build -p aida-tui and cargo test -p aida-tui are green; cargo fmt --all -- --check and clippy clean.
  - It is a PROTOTYPE: groom execution may be stubbed/shelled with a TODO; the goal is to FEEL the gesture grammar.
