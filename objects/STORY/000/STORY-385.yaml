- id: 019e5113-7533-7ca2-b401-6303d62f6e21
  author: joe
  content: |-
    Empirical multi-agent collision 2026-05-22: master (PR-193) and Antigravity (PR-194) independently fixed the same failing discipline-pack test in parallel without knowing about each other's work. Both fixes were semantically correct; both diffs touched the same lines; both PRs in flight simultaneously. Collision surfaced at master review time when comparing the two PRs' file lists.

    What would have prevented this:

    - 'Recent advisor activity' section in aida status (this story's main thrust) would have shown 'master is editing aida-cli/src/main.rs in spike-N' or 'Antigravity is editing aida-cli/src/main.rs in story-407-followups'.
    - A simple 'who's touching what file right now' query would have let either agent see they should coordinate first.
    - Cost of the collision: ~10 min of rebase work + this comment + one PR (193) shipping before the other (194) can rebase.
    - The bigger cost: master had to manually compare PR diffs to discover the collision. With more agents + more concurrent work, this scales linearly with N agents — but the discovery cost scales O(N^2) since master has to cross-check pairs.

    STORY-385's working-tree-state section + advisor-activity log would have surfaced 'aida-cli/src/main.rs is being modified in 2 branches' at status time, before either PR opened.

    Strong empirical motivation for this story's high priority. The N=2 case (Codex + Antigravity + master) is the smallest meaningful multi-agent dogfood; collisions WILL recur. The substrate needs the surface.
  created_at: 2026-05-22T19:04:50.227285927Z
  modified_at: 2026-05-22T19:04:50.227285927Z
- id: 019e511e-c2b0-7ea2-baf5-05771071f191
  author: joe
  content: 'Additional empirical evidence 2026-05-22: gh pr checks <N> --watch can show STALE check status — the displayed checks may reflect an OLD CI run (the one originally triggered by the PR''s first commit) while a newer commit''s CI has passed but isn''t yet reflected in the display. Concrete case: PR-193''s first commit (0bba5f9d) failed CI; pushed a fix (13542492); then pushed an empty commit (7ed20c14) to force fresh CI. The ''gh pr checks 193 --watch'' continued to display the original FAILED run as ''currently failing'' while the newer CI on the empty commit had passed and the PR was merged. STORY-385''s status-surface should distinguish: (a) the LATEST CI run on origin''s HEAD, (b) historical runs on prior commits, (c) the merge-mergeability state independent of CI. Today the three are conflated in ''gh pr checks --watch''s'' single view; a clearer aida status section would split them. Also captures the lesson that ''check status is failing'' does NOT necessarily mean ''PR cannot merge'' — the PR might be mergeable via branch-protection-bypass / admin-merge / ''Merge anyway''.'
  created_at: 2026-05-22T19:17:10.960855374Z
  modified_at: 2026-05-22T19:17:10.960855374Z
