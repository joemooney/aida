title: 'EPIC-21 v2: aida store checkout <code-sha> time-travels orphan worktree'
description: |
  Pulled out of EPIC-21's body. v1 records the pairing trailer; v2 actually USES it.

  aida store checkout HEAD reads the current commit's Aida-Store: trailer and resets .aida-store/ to that SHA. Read-only mode while time-traveled (writes from a rewound store would create branches the canonical orphan never sees). aida store reset returns the worktree to canonical HEAD.

  aida status integration: warn when code/store are misaligned, suggest aida store checkout HEAD.
