title: Auto-train lands supervised PRs while an active mandate covers them (ship-held + include-supervised), behind a default-off project knob
description: |
  Joe 2026-11-26 08:10 ("a mandate that lets the auto-train land supervised PRs ... sounds good"); filed by product-15. FINDING: Joe's active mandate (2f660714, until 2026-11-27 06:04Z) ALREADY covers ship-held + dispatch with --include-supervised and protected paths, but that authority is used only when the ADVISOR seat ships a held PR by hand. The auto-train does not consult it, so a supervised, approved, full-CI-green PR (e.g. #4464 BUG-2735, waiting about 11h overnight) still waits for a human `aida pr train` or a hand ship.

  ## Acceptance
  - AC1: a project knob `[landing] auto_train_supervised_under_mandate` (default false = today's behaviour) lets the auto-train admit SUPERVISED (drive/unset) PRs while an ACTIVE mandate covers ship-held with --include-supervised, using exactly the mandate's existing evidence rules (an attested independent approval at head + green required CI). Operator-only specs stay human-only, and protected paths follow the mandate's include-gate-paths flag.
  - AC2: each such landing records the mandate id in the train record and the landed spec's history, so `aida mandate status` and the audit trail show what it shipped.
  - AC3: when the mandate expires or is stopped, supervised PRs fall back to human-only on the next poll; a test.
  - AC4: set the knob to true in .aida/config.toml once it lands (a follow-up).
status: InProgress
