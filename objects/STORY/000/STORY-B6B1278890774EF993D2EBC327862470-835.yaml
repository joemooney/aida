  content: 'ADVISOR SIGNOFF (2026-11-27 15:35, advisor-122): SKETCH APPROVED. It meets all seven of my binding points and goes further: no carry-over for supervised members, every check green (not just the required set), the advisor-seat approval refusal for ANY advisor session, the mandate recheck immediately before the merge with the proof digest, and trailers + store comments recording mandate id + verdict key. Answer to the open question: YES, make knob-off close the auto-pass path for unheld supervised-by-mode PRs explicitly (the tightening is correct). The 30m minimum-remaining const is fine. Note for implementers: approvals recorded by the advisor seat (e.g. finalizing a stalled reviewer draft) are deliberately NOT eligible under this path; those PRs keep going to Joe''s train, which is intended. Slice it ≤300 lines per PR (knob + refusal first, then the cover/recheck, then the landing records), STRICT review each; the knob stays OFF on main until Joe flips it in its own PR.'
