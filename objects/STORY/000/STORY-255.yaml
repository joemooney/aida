  content: 'Acceptance correction 2026-05-18 (resolves the implementer''s scope-fork at the design checkpoint): the spec body''s ''writes 10 starter memory files'' is STALE — it was a filing-time snapshot. The producer mechanism is the `propagation: scaffolding-pack` frontmatter marker (per feedback_propagate_generic_discipline_via_scaffolding.md, ''the load-bearing step'' / canonical source of truth). DECISION: ship marker-driven — `aida init --with-memories` harvests every memory carrying the marker, NO hardcoded count. The advisor has corrected the 2 spec-named-but-unmarked files (feedback_verify_before_filing, feedback_failed_flag_attempts_are_ux_signals) so the marked set is now consistently 16. Reword the acceptance criterion from ''writes 10 starter memory files'' to ''writes every memory carrying propagation: scaffolding-pack (currently 16; grows incrementally as new generic-discipline memories are marked)''. The count is an artifact, never a constant.'
