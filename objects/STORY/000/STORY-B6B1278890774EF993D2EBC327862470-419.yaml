  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2493):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 88e8a7206b39
    Recorded: 2026-11-08T07:40:17.480326158+00:00
    Findings:
    1. F1 (blocking, carried over, still open): the PR title is still '[AI:codex] feat: Cross-machine review ... (STORY-2493)'. The rework added commit 88e8a7206b3 with a Refs subject but changed neither the title nor commit cffcd1b6284. The squash trailer derives completing IDs from the PR title (pr_ship.rs:340-352, extract_trailing_spec_ids_from_subject), so merging this 113-line docs/plans-only PR would complete STORY-2493 with none of its envelope, transport, home-processing or merge-block behaviour implemented. Fix: retitle the PR to '[AI:codex] docs(plans): untrusted-node review return channel sketch (Refs STORY-2493)', or add the non-completing PR-body marker, and do not leave a completing feat subject as the merge subject. Plan lines 111-113 show the author knew this and left it to 'the host'.
    2. F4 (minor): docs/plans/2026-11-07-story-2493-untrusted-review.md:111-113 is a one-time shipping instruction to 'the host' about this PR's own subject. It is not design content and goes stale at merge. Per CLAUDE.md, per-change notes belong in the PR body or an aida comment. Fix: remove those three lines when F1 is fixed.
    3. F5 (minor, design gap): step 6 releases a false-positive blocking digest only through a superseding verdict for the 'same PR and exact head' (plan:66-70), while a stale-head verdict grants no credit (plan:65). The sketch does not say whether a blocking digest from a verdict at head A still blocks after a rework push to head B, or what releases a Rejected digest once the head has moved. A false positive followed by any push has no stated exit. Fix: state whether digests are scoped to the verdict's head or to the PR, and give the moved-head release path, with a matching case in Verification.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
