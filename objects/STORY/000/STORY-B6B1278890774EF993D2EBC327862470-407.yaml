    - aida-cli/tests/story_2479_observation_envelopes.rs
    - docs/cli-format-json-audit.md and aida-cli-lib/src/tests/golden/cli_help_snapshot.txt

    ### Ambiguities / conflicts as questions
    None. Reviewer permits refusing late alias dispatch; select this bounded fix to preserve startup isolation.
