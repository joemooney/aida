title: 'Node friendly names + owner identity: name (<host>-<user>-<seq>) + $USER string on each node, settable at init/acquire'
description: 'Each node gets a friendly NAME in addition to the integer node id. aida-core node model (NodeConfig + nodes.toml NodeRegistry entry) gains name: Option<String> (default <hostname>-<user>-<seq>, e.g. imac-joe-1; <user>=current_user_id, <seq>=node id) AND user: Option<String> = the current_user_id ($USER/AIDA_USER) string captured at registration (so the team roster can join nodes to the same person-identity that roles/queues/assignees use — they currently key on the integer user_id, which does not match). aida init + aida node acquire accept --node-name <NAME>; at a TTY prompt with the default pre-filled; non-interactive uses the default. aida team CLI shows the friendly name column. Provide node_display_name() + node_owner() helpers with backfill for existing nodes lacking the fields (derive name from <host>-<id>, owner from email local-part or the integer). Backward-compatible (optional fields). Add an AIDA_* doc row if a new env is read.'
