  content: |-
    ## Implementer findings (could not file as draft TASKs: `aida add` refused with "requirement ID allocation failed: Read-only file system" inside the sandbox, and MCP file_finding was denied)

    1. **kind:design-choice, severity:minor** — the SessionStart hook arms hand-started Codex rows without a `codex --version` probe (it would add up to 5s per session start), so a pre-0.164.0 Codex reads `armed`, not `unsupported`. `agent new codex` keeps the check.
    2. **kind:bug-spotted, severity:major** — the headless seat cannot run aida-cli-lib unit tests: the agent-profile test build hit the 10-minute tool ceiling twice (`cargo ps` 0/2 busy), and detached `setsid nohup` builds are killed when the sandboxed command returns. Shipped after `cargo check --tests`, `cargo clippy --tests -- -D warnings`, and `make check-ci-fast` (36 gates) only; CI runs the new tests. The cargo wrapper also prints `burst.last: Read-only file system` in the sandbox.

