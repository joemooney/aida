title: 'EPIC-21 v3: agent + release-tag integration'
description: |
  After v2 ships:
  - Agents (Claude, Codex) working on an old branch automatically see the right store version (via the trailer + auto-checkout on session-enter)
  - Release tags carry both code SHA + store SHA so git checkout v1.2.0 reproducibly gives you code v1.2.0 + the store as it was at v1.2.0
  - Branch-aware: feature branches can have their own store snapshot diverging from main; merge resolves both
