title: 'TUI ''Test'' scope: list testable specs in focus + render their ## Test Plan (STORY-698 surface)'
description: |-
  Add a "Test" scope to the redesign TUI — the in-TUI surface for STORY-698's per-spec test plans. The operator focuses on an epic, switches to the Test scope, sees the shipped specs and walks each one's "do -> expect" verification steps without leaving the TUI.

  BEHAVIOR:
  - New functional scope "Test": lists the TESTABLE specs in the current focus — Done + Completed specs (the recently-shipped work to verify), respecting the active focus epic (so focused on EPIC-54 it shows EPIC-54's shipped children). Reuse the in-process SpecStore + the focus filter.
  - Selecting a spec (preview modal) renders its `## Test Plan` section from the description (the do->expect steps), as markdown, prominently. Falls back to the full description if no `## Test Plan` section exists. Show a small marker on rows that HAVE a test plan.

  DATA (seed): each EPIC-54 child carries a `## Test Plan` section in its description (the convention ahead of STORY-698's formal field). Seed them from the per-spec test plans already written in PR #1145's body (file: scratchpad redesign-pr-body.md).

  ACCEPTANCE:
  - a "Test" scope lists Done/Completed specs in focus; the modal renders their `## Test Plan` (markdown) or the description if absent.
  - the EPIC-54 children have `## Test Plan` sections so the scope is populated when focused on EPIC-54.
  - pure logic (testable-spec filter, test-plan extraction) unit-tested; build/test/fmt/clippy green; redesign module.
