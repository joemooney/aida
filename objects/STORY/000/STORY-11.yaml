spec_id: STORY-11
title: Create GitLab Issue from AIDA Requirement
description: "As a user, I want to create a GitLab issue from an AIDA requirement so that developers can track implementation work in GitLab.\n\n## Acceptance Criteria\n- [ ] Create GitLab issue with mapped fields from AIDA requirement\n- [ ] Automatically link created issue back to source requirement\n- [ ] Add AIDA spec-id reference in GitLab issue description\n- [ ] Support creating issue with custom title (default: requirement title)\n- [ ] Apply label mappings (AIDA type/priority → GitLab labels)\n- [ ] Assign to GitLab user (optional)\n- [ ] Set milestone (optional)\n- [ ] Show confirmation with created issue link\n\n## Field Mapping (AIDA → GitLab)\n| AIDA Field | GitLab Field | Notes |\n|------------|--------------|-------|\n| title | title | Direct copy |\n| description | description | Prepend with AIDA ref |\n| priority | labels | \"priority::high\", \"priority::medium\", etc. |\n| req_type | labels | \"type::bug\", \"type::story\", etc. |\n| feature | milestone | If milestone exists, else label |\n| owner | assignee | Match by username/email |\n| tags | labels | Direct copy |\n\n## Description Template\n```markdown\n> 📋 **AIDA Requirement:** [FR-0042](aida://FR-0042)\n> \n> _This issue was created from AIDA requirements management system._\n\n{original_description}\n\n---\n**Acceptance Criteria** (from AIDA):\n{acceptance_criteria_if_present}\n```\n\n## CLI Support\n```bash\n# Create issue from requirement\naida gitlab create FR-0042\n\n# With options\naida gitlab create FR-0042 --title \"Custom title\" --assign @developer\n\n# Create issues for multiple requirements\naida gitlab create FR-0042 FR-0043 FR-0044\n\n# Dry run (show what would be created)\naida gitlab create FR-0042 --dry-run\n```\n\n## GUI Support\n- \"Create GitLab Issue\" button in requirement detail view\n- Dialog to customize title, assignee, milestone before creation\n- Success toast with link to created issue\n- Issue appears in Links tab after creation\n\n## Error Handling\n- Handle API errors gracefully (auth, rate limit, validation)\n- Don't create duplicate issues (check if already linked)\n- Validate assignee exists in GitLab project"
