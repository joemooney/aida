  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2255):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 8218de603112
    Recorded: 2026-11-02T07:30:06.714033050+00:00
    Findings:
    1. BLOCKING: aida-cli-lib/src/advisor_watch.rs codex_fork_and_run (~line 314) calls session::spawn_codex_headless_fork(..., &tee, false). After the merge of #3229 (BUG-2393), every advisor-watch spawn must resolve containment with session::drain_contained(project_root)?. As written, with [agents] contained = true (or [contained] enable = true) and AIDA_CONTAINED unset (a cron/systemd tick), the Codex fork runs uncontained instead of being refused, while the cold-boot path beside it refuses. That is the BUG-2393 regression on a new call site, and AC4 is only met for env containment. It also fails the BUG-2393 ratchet test listed_headless_callers_resolve_configured_containment (bug_2393_configured_containment_tests.rs): the flattened source contains '&tee, false, )'. I reproduced the string check locally. Fix: let contained = session::drain_contained(project_root)?; and pass it. Add a test mirroring cold_boot_honours_configured_containment_without_the_env: Codex registration, agents.toml contained=true, AIDA_CONTAINED unset, fork_and_run_to refuses with 'cannot run a contained session' and the fake codex is never spawned.
    2. Non-blocking (minor, carried from round 2): resolve_register_identity always prefers CODEX_THREAD_ID, so a Claude session started from a Codex shell registers the parent Codex thread. Consider picking the nearest ancestor's vendor.
    3. Non-blocking (minor, carried): codex_rollout_path walks the whole $CODEX_HOME/sessions tree on every tick whose codex PID is gone. Search newest-first or cache the path at register time.
    4. Non-blocking (known deferral, carried): the calibration-ON shadow fork in phase_driver_trait still plans only a Claude JSONL fork, so a Codex-hosted calibration shadow cold-boots.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
