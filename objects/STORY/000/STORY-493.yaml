  content: "P3 FUNCTIONALLY COMPLETE — slices 1-3 shipped: pure core (TASK-602), .aida/ local store + aida mailbox CLI (TASK-603), send_message/read_inbox MCP tools (TASK-604). Agents can message each other now (local layer).\n\nSLICE 4 (git-canonical digest) — fully scoped, the differentiator layer, the LARGE canonical-store-write slice. Build plan (mechanics traced):\n- CANONICAL WRITE: digest writes message JSON to the orphan worktree at <store_root>/mailbox/<id>.json, then git_ops::add(root, ['mailbox']) + git_ops::commit(root, msg) + push — mirrors git_backend::auto_commit's add_all('objects')+commit. store_root = the orphan worktree (.aida-store), reachable via the backend.\n- CANONICAL READ + MERGE-ON-READ: inbox/thread read .aida-store/mailbox/*.json AND .aida/mailbox/ (local), reconcile via the existing merge_dedup (canonical wins on id collision). \n- aida mailbox sync: digest local→canonical (append-only/id-keyed; idempotent — skip ids already in canonical).\n- AUTO-TRIGGERS (operator decision needed — flagged for veto): batched digest on session-end + drain phase-boundaries, NOT per-message (avoids the coarse-git trap). \n- doc-consistency: no new MCP tool (sync is CLI), but document aida mailbox sync.\nDeserves focused care (writes+commits+pushes to the canonical store, like P1's re-entry). STORY-493 stays open for slice 4."
