title: 'P3 hybrid inter-agent mailbox: fast .aida/ local layer + git-canonical durable digest'
description: |
  SPIKE-45 P3. Agent<->agent peer messaging (distinct from operator->agent briefs + top-down directives). Operator chose the HYBRID shape (2026-05-31): fast .aida/mailbox/ local layer for live exchange + a git-canonical durable digest on the orphan store for replay/audit/cross-clone sharing (round-2 differentiator vs competitors' ephemeral local mailboxes); mirrors AIDA's git-canonical-writer + cache/handshake architecture. Plan: docs/plans/2026-05-31-p3-hybrid-inter-agent-mailbox.md. Build order: (1) pure message model + inbox/thread/merge core [this slice], (2) .aida/ local store + CLI, (3) MCP send_message/read_inbox, (4) git-canonical digest (aida mailbox sync + session-end/drain auto-trigger). Digest-trigger + consistency model need sign-off before the wiring slices. Stays open until all slices land.

  ## ✅ Operator decision (2026-06-06 disposition sweep)

  CONFIRM the landed-vs-remaining split first (the mailbox core + .aida local layer + CLI send/inbox/thread/sync + MCP tools already shipped), THEN sign off + build the remaining git-canonical durable DIGEST (trigger + consistency model). The digest is the round-2 moat differentiator vs competitors' ephemeral mailboxes — worth finishing, not dropping. Re-spec to only the genuinely-remaining digest work before implementing.
