title: Mailbox reason-group + send-mail action in the cockpit board
description: |-
  Mailbox reason-group + send-mail action in the cockpit. EPIC-53 content layer.

  ## Acceptance
  - A Mail group appears sourced from unread_inbox (owner=you, unread count); updates as mail arrives.
  - A send action (wraps send_message) is exposed as a row action_fn per the seam contract.
  - The mail source (rows from unread_inbox) and the send action are PURE/registerable (unit-testable without the shell).

  ## Seam
  EPIC-53 owns the mail source + send action. EPIC-54 owns the selection/dispatch gesture (how you pick a message + trigger reply/send). See docs/plans/2026-06-26-epic-53-cockpit-seam.md for the EPIC-53(content) vs EPIC-54(shell) boundary.
