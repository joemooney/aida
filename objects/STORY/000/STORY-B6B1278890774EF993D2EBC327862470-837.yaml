    Reviewed HEAD: 3baedffcbc (int-story-3202-agy-review; diff vs integration tip 85b2fee16d)

    Acceptance evidence (narrowed scope per advisor brief; AC1/AC2 containment stay in STORY-2460):
    - AC-A [evidence: behavioral-test] agy is a review vendor via the S3a spawn only: `vendors/review_runner.rs` AGY (argv `--output-format=text --mode=plan --disable-slash-commands --print=`; auth allowlist GEMINI_API_KEY; efforts low..max via `--effort`; `--print-timeout` = deadline minus min(deadline/4, 30s), never 0). Added to REVIEW_VENDORS; `review_vendor("agy"|"antigravity")` resolves. Tests: `s3a_runner_spawn_contract` (agy case: empty cwd, env allowlist, stdin prompt, exact argv), `story3202_agy_effort_mapping_and_print_timeout`, `story3202_challenger_picks_agy_when_claude_finds`.
    - AC-B [evidence: behavioral-test] `aida doctor --lane-host` runs `agy models` through the same RunnerCall (setsid, no TTY, empty cwd, runner env so no session bus/keyring) and reports `auth-probe-agy`: KeyringOnly names the fix (GEMINI_API_KEY, or sign in once with `env -u DBUS_SESSION_BUS_ADDRESS agy` so the file token is written); Rejected/Timeout/Failed are typed. Required when agy is a lane vendor, a note when merely installed. Test: `story3202_agy_auth_probe_classifies_without_hanging`.
    - AC-C [evidence: behavioral-test] fake-agy tests above plus `story3202_agy_auth_failure_is_a_typed_cause` (AuthRequired downcast, fails fast, claude keeps the plain failure).

    Live probe findings on this host: piped stdin with `-p=` is read as the prompt (with /dev/null agy says "empty prompt"); a non-interactive `agy -p` says "authentication failed or timed out"; `agy models` logs "Failed to load stored token from keyring, falling back to file: dial unix /run/user/1000/bus" and there is no ~/.gemini/antigravity-cli/antigravity-oauth-token, which confirms the keyring-only diagnosis.

    Fixes during self-review: auth matching narrowed to stderr only (a review's own stdout cannot trigger it); the probe was rewritten to reuse RunnerCall rather than a second spawn path; an E0716 borrow bug in a test; ratchet-set entries for the 3 new module tests.

