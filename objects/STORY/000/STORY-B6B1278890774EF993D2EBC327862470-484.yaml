title: 'Host-mediated typed store mutation: lanes write the AIDA store only through a synchronous host service; raw store writes denied in the shared boundary'
description: |
  Cross-vendor keystone, from the operator design session of 2026-11-06 06:40 MST (supervised BUG-2446). Today contained_store_write_paths (contained_boundary.rs) grants the whole .aida-store and .aida/cache-db to every contained vendor, AIDA's own wrapper included, so a lane terminal or file tool can write raw store objects (BUG-2446, measured on Codex C2).

  Operator rulings:
  (S) This is its own keystone, not a gate on STORY-2238 / EPIC-612. STORY-2238 completes with the grant documented as a known cross-vendor limitation.
  (Q1) Use a synchronous, typed, host-owned mutation service outside the sandbox. It accepts only named operations with bounded data. The host fixes project, store, process-bound identity, spec, role and permitted verbs at launch, and revalidates live authority and per-operation gates at the write boundary. It writes through the canonical atomic persistence and writer lock, binds retries to the request identity, and never trusts client paths, executables, git config or whole-object replacements. No asynchronous spool, no generic shell or argv deputy.
  (Q2) Enforce in AIDA's shared bubblewrap boundary: store objects, authority-bearing metadata and the shared derived cache are read-only to every vendor terminal, file tool and descendant, with ancestor grants, symlinks, primary-checkout launches and resume accounted for. A mediated launch refuses when the protection or the service is unavailable. The Codex-native compatibility exception and its labeling stay unchanged.
  (Q3) Three supervised slices: (1) transport, launch-bound identity and an inventory of every store writer; (2) route CLI and MCP writes through the service and cut over the mediated profile; (3) real-vendor C2 evidence.

  Acceptance: parent-observed raw-write negatives (terminal AND file tool: create, append, rename) on canonical-equivalent objects with unchanged targets; same-profile mediated positive controls (own claim, comment, edit, queue done) visible to an independent host reader; refusal and concurrency tests from the BUG-2446 sketch v1; Claude behavior preserved. Base the design on BUG-2446 sketch v1.
