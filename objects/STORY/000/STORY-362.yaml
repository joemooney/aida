title: Subsystem-tagged memory pack + --focus loading (SPIKE-10 Track A)
description: |
  Per SPIKE-10 strategic doc (docs/multi-advisor-coordination.md), Gap 1 implementation: memory frontmatter `subsystem:` tag + advisor session `--focus <subsystem>` flag that filters loading to universal + scope-matching memories. Backward-compatible: untagged = universal. Includes retroactive-tag tooling `aida memory audit --tag`. TUI / status line surfaces active focus.

  ## ✅ Operator decision (2026-06-06 disposition sweep)

  DEFER post-stability (with STORY-363) — no subsystem-scoped advisors exist yet to consume --focus, so the loading filter has no live consumer. Revisit when SPIKE-10 subsystems actually emerge. (If built: backward-compatible subsystem: frontmatter tag, untagged = universal.)
