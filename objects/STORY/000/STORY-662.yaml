title: 'aida list --help: document lens aliases + statuses one-per-line; add me / user:<name> filters'
description: 'Two parts. (1) aida list --help should enumerate the status/lens shortcuts ONE PER LINE with a one-line explanation each: open, closed, draft, approved, queue, human, etc. - today they are buried in prose. (2) Add a user filter: me as an alias for user:$USER, plus user:<name> support, so aida list me / aida list --user joe / aida list user:alice work. NOTE current state: aida list of requirements does NOT default to the current user (only the QUEUE is user-scoped, BUG-89) - so this is ADDING filters, not changing a default. See the companion mylist/myqueue task for the personal-view shortcuts.'
