attention_reason:
  category: design-fork
  detail: 'Authenticated no-carry needs a durable policy-binding design before new consumers can grant coverage. Local grant revalidation in gate/review_authority.rs::verified_authority_keys authenticates seat/time/binding/identity, not verdict policy; a mutable no_carry field (even in RecorderAttestation) could be removed while the approval still validates. Signed cross-node Receipt has a separate payload/schema. Fork: extend local recording receipts plus signed publication schema, or introduce a distinct authenticated reviewer-policy receipt. Both need migration and downgrade/removal rules, including marker changes after a cached proof. Current edits implement only the independent protected-base freshness fix; hold-release, dispatch suppression and verdict display remain unimplemented. Preserve publication veto until this fork is resolved.'
  lean: Bind carry eligibility durably at approval recording for both grant and human reviewers, include it in signed remote receipt projections, and resolve that authenticated policy before every cached or fresh proof. Treat otherwise valid pre-policy attestations as eligible as required by the sketch; distinguish them from stripped newer policy.
  raised_by: implementer
  raised_at: 2026-11-09T21:31:50.329007231Z
