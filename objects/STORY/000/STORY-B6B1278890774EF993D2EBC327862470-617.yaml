title: Keep an approval across a clean merge from main when the PR's own change is identical
description: |-
  ## Problem
  Every landing moves main. A PR approved at head H then takes a clean merge from main, the approval no longer matches at the gates below, and it costs another review and CI pass although its own change is identical.

  ## Narrowed sketch (supersedes the original)

  Attested carry-over already exists (TASK-1960, STORY-080: `gate/review_carryover.rs`) and train admission honours it. It did not help on 2026-11-09 because merge-hold release requires an approval at the literal head and review dispatch selects on exact-head history. This story wires the existing proof into those gates. The proof rules stay; the only new eligibility restriction is the no-carry marker.

  1. Merge-hold release (`refusal_release`, `gate/merge_hold_core.rs`): a refusal hold's release condition may be met by an APPROVED verdict at an older head when a stored carry-over proof covers approved -> current head. It must retain the check that no newer refusal exists. It reports coverage evidence and never records a verdict at the new head.
  2. Review watch dispatch selection (`review_watch.rs` around the exact-head history check; readiness in `review_watch_ready.rs` already consults carry-over): do not dispatch a re-review for a head whose latest approval is covered by a carry-over proof. CI must still be green at the new head.
  3. Surfacing: `aida review verdict PR-N` states "APPROVED at H, carried to H2 (proof ...)" so scripts and humans can see it.
  4. Freshness fix, independent of the above: `stored_answer` trusts the local origin tip without fetching and a fetch failure falls through to the local tip. Gate callers that grant authority must fail closed when the protected tip cannot be refreshed.

  Dropped from the original: "the review did not name a condition tied to main's state", which is not mechanically decidable from prose verdicts.

  Accepted risk, stated plainly: a clean merge can combine with main to produce a semantic conflict that patch identity cannot see. TASK-1960 accepted this for the corpus gate; required CI at the new head and the stacked train CI are the mitigation. Security-critical or gate-touching PRs may be excluded by a reviewer via an explicit no-carry marker; legacy reviews remain carry-eligible because the existing gate already treats them so.

  ## Conditions from independent design review (2026-11-09, binding)
  - Suppressing dispatch requires an authorized approval plus corpus reconciliation, never merely an older APPROVED verdict or a stored proof; any standing non-approval or malformed/missing-SHA artifact refuses (`gate/merge_hold_core.rs` corpus carry-over).
  - Keep the newer-refusal check, absorbed refusal obligations, and approval-authority validation before carry-over (`gate/approval.rs`). A proof authenticates no reviewer.
  - The no-carry marker is authenticated and reviewer-controlled, checked before cached-proof acceptance in every consumer, and a marker change invalidates previously usable proofs.
  - Freshness: refresh and validate protected branch identity and tip BEFORE accepting a cached or fresh proof.
  - Merge binding: re-read the PR base and pin the merge to H2 while keeping H as the reviewed SHA.
  - CI at H2 stays mandatory; dispatch suppression confers no readiness or merge authority.
  - Legacy means an otherwise valid attested approval without the marker. Unattested legacy verdicts stay insufficient (`gate/ship.rs`).

  ## Acceptance
  - Clean merge from main: hold releases and no re-review dispatches, with a ledger proof naming H, H2 and base tip.
  - Refused with stated reason: conflict-resolved merge, evil merge, added non-merge commit, changed patch-id, no-carry marker, a refusal newer than the approval, an unrefreshable protected tip.
  - Rider ownership refusal and approval-authority checks unchanged.
  - Tests cover each refusal plus retargeting, head movement, a no-carry change on a cached proof, and an unavailable ledger write.
