    REVIEW FINDINGS TO ADDRESS (STORY-2694):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 38feb4f1a2bd
    Recorded: 2026-11-09T21:40:06.721812957+00:00
    Findings:
    1. [P1] Implement carry-over in refusal_release (aida-cli-lib/src/gate/merge_hold_core.rs:976). It still selects only at_sha(key, head) and rejects an approval at H for clean-merge H2, even with a valid ledger proof. Wire authorized, reconciled carry-over into hold release, retain newer-refusal and absorbed-obligation checks, report H/H2/base-tip evidence, and keep H as the reviewed SHA (STORY-2694 ac7f9646).
    2. [P1] Implement carry-over-aware watcher dispatch admission (aida-cli-lib/src/review_watch.rs:1438 and :1493). Both admission and precheck still use exact-head history only, so a clean merged H2 is dispatched for another review despite an authorized approval at H and a valid proof. Suppress dispatch only after authority and corpus reconciliation, fail closed on standing non-approvals or malformed/missing-SHA evidence, and preserve CI at H2 as a readiness requirement (STORY-2694 ac7f9646).
    3. [P1] Add the authenticated reviewer-controlled no-carry marker and enforce it before cached or fresh proof acceptance in every consumer (aida-cli-lib/src/gate/review_carryover.rs:380). No marker field, authenticated authoring path, or eligibility check is implemented; security/gate reviews therefore cannot opt out and an existing proof remains usable after the required policy change. Preserve eligibility only for otherwise valid attested legacy approvals (STORY-2694 ac1c18ee and binding design conditions).
    4. [P2] Surface carried approval coverage in aida review verdict PR-N (aida-cli-lib/src/lib_part5.rs:4178). The display path is unchanged and does not expose APPROVED at H, carried to H2 with proof evidence, leaving humans and scripts unable to inspect the coverage required by narrowed-sketch item 3. Add human and machine-readable coverage without restamping the approval at H2 (STORY-2694).
    5. [P2] Complete the acceptance regression coverage in aida-cli-lib/src/gate/tests/task_1960_carryover_tests.rs and consumer tests. The five added tests cover only freshness. Add a clean-merge hold-release/no-dispatch integration test with H/H2/base-tip ledger assertions, the full refusal matrix through the new consumers, authenticated no-carry and cached-proof marker-change tests, head-movement/retarget checks, unavailable ledger-write failure, and rider-ownership/approval-authority regressions. The supplied aida criteria list marks all four acceptance criteria untraced; this diff still leaves them without the requested complete test coverage (STORY-2694 ac7f9646/ac1c18ee/aca6d13e/aced2330).
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
