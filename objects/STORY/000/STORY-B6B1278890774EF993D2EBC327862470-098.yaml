    3. AC4: test how the goal line gathers the mandate and purpose (fixture mandate plus purpose).
    4. AC6: add a test that picks the terminal vs piped output mode (inject is_terminal). For the 300 ms target, a unit-level timing assertion is NOT wanted; state the measured time in the PR description.
    5. Minors: char-safe slicing at whoami_view.rs:239 (no byte slicing of HEAD); label an AIDA lease id as 'lease' and keep 'session' for the harness session id. The /aida-whoami skill wrapper stays out of scope (accepted: not in the ACs).
    Gate: LIGHT (cargo test -p aida-cli-lib --lib whoami plus make check-ci-fast).
