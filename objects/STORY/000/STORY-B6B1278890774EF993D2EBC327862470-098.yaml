  content: |-
    ## Implementer finding (kind:deviation, severity:minor)

    The `/aida-whoami` skill wrapper from the Proposal did not ship with this PR (it is not in Acceptance). The headless sandbox denies writes under `.claude/skills/` and `.claude/commands/`, so `make sync-templates` could not create the tracked mirror symlinks, and a master without mirrors fails `make check-templates`. Filing a draft TASK also failed: node-local ID allocation hit a read-only filesystem.

    Follow-up: add `aida-core/templates/skills/aida-whoami.md` + `aida-core/templates/commands/aida-whoami.md` (run `aida whoami`, relay its lines, `--verbose` for identity sources, point at /aida-read-mail and /aida-pickup), then `make sync-templates && make check-templates` from a seat that can write `.claude/`.
