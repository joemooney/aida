- id: 01a18d24-337d-78a3-b04f-3f1ca54f09e6
  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (AC1):** for claude / codex / antigravity bound-session fixtures (`mailbox_view::bound_facts`), whoami's handle equals `facts.own_handle()`, and a message written to that handle (what `mailbox send <handle>` delivers) is counted as the whoami mail line's direct unread through the SAME extracted `collect_mail_channel` the awaiting/notice path uses.
    - **Unit (AC2):** mail line renders unread · shared · urgent, a `partial` marker when `MailChannel.partial`, and `→ aida mailbox inbox`; collection uses the passive (non-acking) read, so a second collection still sees the mail unread.
    - **Unit (AC3):** working line = lease/claim spec with age, else `idle` + next queued item for the role (pure render tests on the view struct).
    - **Unit (AC4):** goal line from `mandate::status_line` + seat purpose; omitted when both absent.
    - **Unit (AC5):** worktree line path + branch.
    - **Unit (AC6):** `--json` round-trips the view; toon when piped. Latency: no network calls by construction (file + read-only sqlite reads only); manual timing check on this repo, no automated <300ms assertion (flaky under CI load).
    - **Unit (AC7):** `--verbose` appends the legacy identity block (role/agent-type/agent-name/user-id/headless/ai-tool/scope/project/purpose/session-id).
    - **Unit (operator add.):** node line `node: HOME (<id>) · work node, node-local allocation`; `aida node show` says `work node` lower-case with the label printed separately.

    ### Expected files
    - `aida-cli-lib/src/whoami_view.rs` (new: collect + render)
    - `aida-cli-lib/src/session_misc_cmd.rs` (args, top-level whoami visible)
    - `aida-cli-lib/src/status_awaiting.rs` (extract mail-channel collection, no behaviour change)
    - `aida-cli-lib/src/node_cmd.rs`, `node_cmd_args.rs`, `init_cmd.rs` (alias args, role wording)
    - `aida-cli-lib/src/tests/story_098_whoami_tests.rs`
    - `aida-core/templates/skills/aida-whoami.md` + generated mirrors
    - help golden snapshot

    ### Ambiguities / conflicts as questions
    - Which "session id" to show? Resolved: the registry row's native harness session id (8-char), falling back to `AIDA_SESSION_ID`.
