    BUG-2603 / BUG-b6b1278890774ef993d2ebc327862470-367.ac5f2741 — Integration-base pickup merges integration or nothing, never main: verified by `cargo test --profile agent -p aida-cli-lib --lib -- bug_2603_integration_rework_fetches_and_merges_only_actual_base` fixture source. It injects typed metadata into the production preparation path, asserts integration ancestry, excludes main ancestry/content, and asserts unknown metadata leaves HEAD, status, MERGE_HEAD and journal unchanged. rework_base_branch validates observed head/base, refuses unknown metadata, and fetch_rework_heads fetches only actual base and PR head. Existing exact-head FULL lib shards passed; constituent implementation reports bug_2603 2/2 passed.
    BUG-2603 / BUG-b6b1278890774ef993d2ebc327862470-367.acbbfaa1 — Lane brief includes latest ADVISOR comments: verified by `cargo test --profile agent -p aida-cli-lib --lib -- bug_2603_latest_timestamped_advisor_correction_leads_pickup` fixture source; the newer timestamped reply leads the older ruling. latest_matching flattens replies and selects by creation timestamp; is_brief_comment recognizes ADVISOR word boundaries and preserves explicit ruling semantics. Existing exact-head FULL lib shards passed; constituent evidence reports all 19 rework_direction tests passed.

