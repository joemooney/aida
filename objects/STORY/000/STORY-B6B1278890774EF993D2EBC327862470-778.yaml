    TASK-3123 / bounded polling — Poll exit 75 through aida lane job wait in bounded calls: verified by all six paragraphs and existing lane runner protocol.
    TASK-3123 / targeted tests — Route targeted Cargo separately; report untested=true if unavailable/refused; do not count fast-gate job as targeted test execution: verified by all six paragraphs and existing exact_make_job_has_bounded_timeout_and_never_counts_as_cargo_tests fixture source.
