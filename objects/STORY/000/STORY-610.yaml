  content: 'VERB (operator, 2026-06-13): add ''aida advisor signoff <id>'' (or /aida-advisor-signoff) = the SUPERVISED sign-off — queue a spec so ''aida queue work'' can pick it up (keyboard) while the supervised-marker EXCLUDES it from ''burndown run'' (drain). Distinct from plain ''aida queue add'' (which blesses for the drain). This is the clean answer to ''how do I bless keystone work for keyboard pickup without exposing it to an unsupervised drain'' — the gap that''s bitten repeatedly this session (de-queuing keystone specs by hand after every auto-queue path). ''aida advisor signoff'' applies the supervised-marker + queues; ''aida queue work <id>'' then picks it up; ''burndown run'' never sees it. Lives in EPIC-42''s ''aida advisor'' namespace, uses this story''s marker. trace:STORY-610 trace:relates:EPIC-42'
