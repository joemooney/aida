description: Keystone slice (size L). Introduce the Forge trait (see docs/plans/2026-06-04-forge-provider.md), a [forge] provider config auto-detected at aida init from the origin host (github.com->github, gitlab.*->gitlab, else->none), the GitHub provider (wraps existing gh behavior — BYTE-IDENTICAL), and the none/pure-git provider (merge-status via git ancestry; ships pure-git lifecycle for free). Route the ~9 gh operations through the trait; do gh pr merge (29 sites) + gh pr view (19) first. Pure refactor, GitHub unchanged. Architecture-class — master signs off on the trait surface (SPIKE-49) before starting.
