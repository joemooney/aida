title: 'aida drain status: show the active orchestrator command, batch progress, and what happens on session exit'
description: "A user inside an orchestrator-driven Claude session has **no way to know**: (a) what command launched the drain, (b) whether it's a single-spec or a multi-item batch, (c) how far through the batch it is, (d) what happens when they exit the current session. Today the only way to answer this is \\`ps --forest\\` + cross-referencing batch membership + PR states by hand — exactly what the dialog role had to do on 2026-05-18 to answer the user's question.\n\n## The user's question (verbatim, 2026-05-18)\n\n> \\\"Is there a way to know what aida command is active, that is, am I doing a batch or some other command that will take multiple items off the queue. I don't know if when I exit this chat session with claude what is going to happen next, in terms of other stories picked up after the PR is processed.\\\"\n\n## What the answer required (manual, today)\n\n- \\`ps aux | grep 'aida queue work'\\` → found \\`aida queue work batch:session-hygiene --auto-complete --zen\\` running\n- \\`ps --forest\\` → orchestrator had no children → inferred it's blocked on phase 1 waiting for the interactive session to exit\n- \\`aida show\\` ×3 + \\`gh pr list\\` ×3 → batch members: 2 merged, 1 with open PR\n- Cross-referenced all of it → \\\"on exit: BUG-228 finishes phases 2-6, batch empties, orchestrator stops, nothing else auto-picks-up\\\"\n\nNo user should have to do this. The orchestrator KNOWS all of it.\n\n## Proposed solution\n\n### 1. Orchestrator writes a drain-state file\n\nAt drain start (and updated per phase transition), the orchestrator writes \\`.aida/drain-state.json\\`:\n\n\\`\\`\\`json\n{\n  \\\"command\\\": \\\"aida queue work batch:session-hygiene --auto-complete --zen\\\",\n  \\\"mode\\\": \\\"batch\\\",\n  \\\"batch\\\": \\\"session-hygiene\\\",\n  \\\"members\\\": [\n    {\\\"spec\\\": \\\"BUG-112\\\", \\\"state\\\": \\\"completed\\\", \\\"pr\\\": 80},\n    {\\\"spec\\\": \\\"TASK-264\\\", \\\"state\\\": \\\"completed\\\", \\\"pr\\\": 81},\n    {\\\"spec\\\": \\\"BUG-228\\\", \\\"state\\\": \\\"in-phase-1\\\", \\\"pr\\\": 82}\n  ],\n  \\\"current\\\": \\\"BUG-228\\\",\n  \\\"current_phase\\\": \\\"1 (implementer)\\\",\n  \\\"orchestrator_pid\\\": 2570023,\n  \\\"started_at\\\": \\\"2026-05-18T...\\\",\n  \\\"on_drain_complete\\\": \\\"batch empty — orchestrator exits; queue head TASK-329 NOT auto-picked-up\\\"\n}\n\\`\\`\\`\n\nFile is removed when the orchestrator exits cleanly, so its presence == a live drain.\n\n### 2. \\`aida drain status\\` command\n\nReads the state file + corroborates against the running process (orchestrator_pid alive?) + lease state. Prints a human summary:\n\n\\`\\`\\`\nActive drain: batch:session-hygiene  (aida queue work --batch session-hygiene --auto-complete --zen)\n  ✓ BUG-112    completed   PR-80 merged\n  ✓ TASK-264   completed   PR-81 merged\n  ▶ BUG-228    phase 1     PR-82 open — orchestrator blocked on your session exit\n  \n  On exit: BUG-228 runs phases 2-6, then batch is empty → orchestrator stops.\n  Nothing else auto-picks-up. Queue head (TASK-329) waits for a new command.\n\\`\\`\\`\n\nStale-file handling: if \\`orchestrator_pid\\` is dead but the file exists, report \\\"stale drain-state file — last orchestrator (PID N) is gone; \\`aida drain status --clear\\` to remove.\\\"\n\n### 3. Session-start banner\n\nWhen a Claude session starts under an orchestrator (corroborated AIDA_AUTO_COMPLETE per BUG-233's token), the \\`/aida-pickup\\` banner leads with the drain position:\n\n\\`\\`\\`\n▶ You are spec 3 of 3 in batch:session-hygiene drain.\n  On exit: orchestrator runs phases 2-6, then the batch is empty and the drain ends.\n\\`\\`\\`\n\nThis is the single highest-value surface — it answers the user's question before they even ask it.\n\n## Acceptance\n\n- [ ] Orchestrator (\\`handle_auto_complete\\` / \\`handle_auto_complete_batch\\`) writes \\`.aida/drain-state.json\\` at start, updates it per phase transition + per batch-member advance\n- [ ] State file removed on clean orchestrator exit; survives a crash (so a stale file is detectable)\n- [ ] \\`aida drain status\\` reads the file, corroborates \\`orchestrator_pid\\` liveness, prints the human summary\n- [ ] \\`aida drain status\\` with no active drain prints \\\"no drain in progress\\\" (exit 0)\n- [ ] \\`aida drain status\\` with a stale file (dead PID) reports it + offers \\`--clear\\`\n- [ ] \\`on_drain_complete\\` field predicts the post-drain state: which queue items will / won't be auto-picked-up\n- [ ] \\`/aida-pickup\\` session-start banner shows drain position when under a corroborated orchestrator\n- [ ] \\`aida session leases\\` cross-references: a lease that's an orchestrator phase-1 child is annotated as such\n- [ ] Tests: single-spec drain state file; batch drain state file; stale-file detection; \\`drain status\\` output for each\n- [ ] Drain-state file uses \\`write_atomic\\` (TASK-331) — concurrent phase updates must not tear it\n\n## Out of scope\n\n- **Multi-orchestrator support** (two drains at once) — single drain-state file assumes one orchestrator; if multi-drain becomes real, the file becomes a directory of per-PID files. Not now.\n- **Live progress bar / TUI drain view** — EPIC-26 territory; this STORY is CLI-status only\n- **Historical drain log** (\\\"what drains ran today\\\") — telemetry already captures command shapes (STORY-122); not duplicated here\n- **Controlling the drain** (pause/resume/cancel) — that's TASK-294's \\`.aida/worker.cmd\\` directive file; this STORY is read-only status\n\n## Composes with\n\n- **TASK-294** (aida-worker bash MVP — its \\`.aida/worker.cmd\\` directive file is the WRITE side; this STORY's drain-state.json is the READ side. Sibling files, same directory.)\n- **TASK-306** (statusline + flag clarity — the statusline could show \\`drain:session-hygiene 3/3\\` sourced from drain-state.json)\n- **BUG-233** (AIDA_AUTO_COMPLETE leak — the session-start banner must use BUG-233's corroborated orchestrator signal, not the bare env var)\n- **BUG-229** (queue-list pipeline states — \\`drain status\\` and \\`queue list --in-flight\\` should agree on per-spec pipeline state)\n- **TASK-329** (sentinel exit — drain-state.json should note \\\"orchestrator blocked on session exit\\\" which is exactly the TASK-329 condition)\n- **TASK-331** (atomic writes — drain-state.json is a concurrent-update file; must use write_atomic)\n\n## Origin\n\n2026-05-18: user inside a BUG-228 implementer session asked whether they were in a batch drain and what would happen on exit. Answering required the dialog role to run \\`ps --forest\\`, grep for orchestrator processes, and cross-reference batch membership + PR states by hand. The orchestrator has all this information; it just isn't surfaced. The user's uncertainty — \\\"I don't know what is going to happen next\\\" — is a real alpha-readiness gap: an autonomous drain that the user can't observe is a drain they can't trust."
