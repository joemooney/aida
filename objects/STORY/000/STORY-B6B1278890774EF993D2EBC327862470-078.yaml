    1. This clone's node b6b1278890774ef993d2ebc327862470 gets label HOME. Bind it as the slice's acceptance fixture-in-anger, after the slice merges (`aida node alias set HOME`).
    2. Slice 1 approved.
    3. Relabel (amends acceptance items 1 and 6): a node's display label may be CHANGED with `aida node alias rename <OLD> <NEW>`. The old label is retired, not deleted: it keeps resolving to the same node for input forever and is never reusable for any other node. Display uses the current label. What stays forbidden is pointing an existing label at a different node, because hand-written commit messages, traces, PR titles and chat already containing TASK-OLD-NNN would then silently name a different requirement.
