- id: 01a1866f-0b38-7063-b1aa-adb456c8a290
  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (aida-core node_alias):** (1) label validation (regex, all-hex refusal, type-prefix refusal, '@'/'.' refusal); set refuses a label bound/retired to another node naming both bindings; one current label per node; rename retires the old label, which keeps resolving and cannot be rebound elsewhere; (7) round-trip display->expand->canonical identity, unaliased node displays canonically; (5) canonical display uppercased; malformed file -> empty map on load, write refuses.
    - **Unit (aida-core models):** (2) `RequirementsStore` lookup by TYPE-<LABEL>-NNN, any case, resolves to the canonical requirement; unknown label -> None.
    - **Unit (aida-cli-lib):** (2) commit-trailer group parser and `trace:` token parser expand a hand-written alias to canonical; (4) nothing generated is changed (generators keep using stored spec_id).
    - **Command-level (aida-cli tests):** (6) `aida node alias set/list/show/rename` against a fixture store, refusal on rebind, no TTY needed; (2) `aida show TASK-<LABEL>-NNN` round-trip; (3) `aida show --format json` keeps `spec_id` canonical and carries `display_id` with the label; `--canonical-ids` / `AIDA_CANONICAL_IDS=1` turn the substitution off.
    - **No automated test this slice:** full surface coverage (ps, awaiting, ship/merge messages) — show, card, list, queue are migrated; the remaining sites are filed as a follow-up rather than a ratchet in this PR.

    ### Expected files
    - `aida-core/src/node_alias.rs` (new) + `lib.rs`
    - `aida-core/src/models.rs`, `aida-core/src/db/{traits,git_backend,cached_git_backend}.rs` (input expansion)
    - `aida-cli-lib/src/node_cmd{,_args}.rs` (alias subcommands), `cli.rs` + `lib_part1.rs` (`--canonical-ids`), `git_backend_cmd.rs` (install map)
    - `aida-cli-lib/src/pr_ship.rs`, `trace.rs` (parsers), `requirements_cli.rs` / queue rendering (display)
    - tests + docs/cli

    ### Ambiguities / conflicts as questions
    - `aida show --format json` already emits a `display_id` (agreed-or-spec id). Plan: keep the field, make it the aliased form; `spec_id` stays canonical. Additive in shape, value differs only when an alias exists.
    - Should a label equal to an existing short node id in `registry/nodes.toml` be refused? Plan: yes (TASK-JM-001 would otherwise be ambiguous with a real distributed id).
