title: Approved small standard-tier specs default to execution mode drain (project knob, default off)
description: |
  Found 2026-11-23 (advisor-122; filed by product-15). Every spec defaults to execution mode "unset", which means supervised. So every approved PR needs mandate cover (currently broken: BUG-2718, BUG-2727) or the operator naming the PR at a terminal (`aida pr train --all-ready` does not count as naming). Approved, green, small standard-tier PRs (#4418, #4422, #4429, #4431, #4414) sat unlanded for hours. Today seats set `--mode drain` by hand on each small standard-tier spec they approve.

  ## Acceptance
  - AC1: A project config knob (default OFF, so behaviour is unchanged) makes specs that are Approved AND marked small/standard-tier (no ADR-76 strict path: leases, claims, grants, containment, gate/guard, authority) default to execution mode `drain`. Strict-tier and authority specs stay unset/supervised. An explicit per-spec `--mode` always wins.
  - AC2: Tests: with the knob off, the default is unchanged; with it on, a small standard-tier approved spec resolves to drain and a strict-tier one stays supervised. `aida config` documents the knob.
