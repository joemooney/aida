    1. STORY-3038.AC1 — Keep merge admission and exclusion code supervised. The strict inventory in aida-cli-lib/src/gate/unset_mode.rs:414 and the built-in protected floor in aida-cli-lib/src/gate/mandate_gates.rs:278 both omit aida-cli-lib/src/admission_owner.rs. That file makes exclusion decisions for direct ship and train, including the live-controller/quiescence check and admission lock acquisition (lines 410–459 and 532–549 on the landed tree). With default = approved-small and no operator-added path rule, an otherwise eligible PR changing only this lock and admission code retains Drain and can land without the required supervision. Classify the actual admission enforcement surface as strict and add a changed-path regression. The base-only commit exposes a diagnostic helper in this file. The finding relies on its pre-existing enforcement.
    2. STORY-3038.AC1 — Preserve approval on the supported automated pickup and completing-publication paths. aida-cli-lib/src/gate/unset_mode.rs:398–408 only accepts a PUBLICATION_DONE_AUTHOR completion and, for InProgress to Done, only SESSION_START_AUTHOR as the preceding Approved to InProgress transition. The real spec-scoped SubagentStart lease hook records that same Approved transition under LEASE_TAKE_AUTHOR (aida-cli-lib/src/leases.rs:731–744), so a subsequent completing push moves the spec to Done and train/ship withhold the default. The orchestrator also uses its own phase-1 writer and its completing PR-open path writes Done under PR_OPEN_AUTHOR (aida-cli-lib/src/phase_driver_trait.rs:1244–1261 and 1295–1303, pr_merge_gate.rs:492–516, and leases.rs:3841–3850 and 3892–3904). Recognize the supported trusted transitions from Approved while keeping Planned, manual changes and withdrawals ineligible. Cover actual pickup and completion writer combinations in the landing regression.
    3. The unattended ship entry point remains untested for loss of approved-small eligibility across the CI wait. aida-cli-lib/src/tests/story_1690_train_tests.rs:6534–6557 exercises classification and merge on a helper instance built by the test. aida-cli-lib/src/gate/tests/story_1917_dispatch_flow_schedule_tests.rs:2292–2298 only checks textual order. If the ship entry point kept the holds from classify but discarded its admission and passed an empty ShipDefaultAdmission to admission.merge, both tests would pass while a same-head size or status withdrawal could still reach the forge. Drive a non-TTY, non-mandate pr ship through the existing checkpoint and fake-forge seams, withdraw eligibility after initial admission at the same SHA, and assert a review refusal and zero forge merge calls.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
