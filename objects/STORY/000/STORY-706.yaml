title: 'aida focus core: set/show/clear + scope reads + auto-link adds + loud visibility'
description: |-
  First slice of aida focus (the context/lens; workspace deferred). Build:
  - `aida focus <spec>` writes the focus to .aida/focus (per-worktree); `aida focus` shows current focus + progress rollup; `aida focus --clear` drops it. Precedence: AIDA_FOCUS env > .aida/focus > none (mirror the TUI focus resolution).
  - READ commands (list, queue list, search, history, findings) filter to the focus's transitive descendant tree (reuse aida_core::graph_walk::walk_union — the SPIKE-71-robust closure). `--all` / `--no-focus` per-command escape hatch.
  - WRITE: `aida add` links the new spec into the focus tree (bidirectional parent edge) — solves TASK-942.
  - LOUD VISIBILITY (the critical constraint): the statusline shows the active focus; focus-scoped command output carries a header like "▸ focused: EPIC-54 — showing 13 of 2400". Never silently subset.
  - The redesign TUI reads the same .aida/focus (unify with the existing .aida/tui-focus from STORY-697).

  ACCEPTANCE: aida focus set/show/clear works + persists per-worktree; read commands scope to the focus tree (with --all escape); aida add auto-links to focus; every focus-scoped output is clearly labeled; the TUI honors the shared focus.
