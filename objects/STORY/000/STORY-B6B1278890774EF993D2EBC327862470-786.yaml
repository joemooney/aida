title: 'Mailbox compaction: move archived history out of active discovery without sync resurrection'
description: 'Split from BUG-2641 sketch (item 1). Lifecycle-locked compaction that preserves full archived payloads outside active discovery, keeps compact authoritative disposition evidence across local/canonical replicas (no sync resurrection), keeps --archived audit lookup, and defines multi-recipient eligibility and dead-handle grace (process absence is never permission to discard unread mail). Includes naming the compaction command in OverBudget output once it exists. Architecture change: sketch on this spec and advisor signoff before implementation.'
