- id: 01a195b6-8030-7712-9023-2cc3660a9be9
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2204):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 14fff09102f2
    Recorded: 2026-11-01T05:54:43.905283620+00:00
    Findings:
    1. F1 major (AC3 ac00342e, authority) STILL OPEN: store_hubs::remote_reaching (aida-core/src/store_hubs.rs:285-295) accepts a remote if ANY fetch or push URL matches the hub, and hub_ref_blocks (allocation_authority.rs:490) reads refs/remotes/<remote>/aida-store, which git advances on a successful push to whatever pushurl is set. A remote with fetch URL = hub and pushurl = another bare repo lands the claim off-hub yet makes it spendable; a STORY-097 push-hub policy that redirects store pushes (git_ops store_push_route) has the same effect. Fix: claim_authority / spendability must require every push URL of the chosen remote to normalize to the declared hub and refuse when push-hub policy excludes or redirects it. Add a story_164 CLI case with pushurl pointing at a non-hub bare repo: the claim is refused or the block is NotOnHub.
    2. F2 minor (AC4 ac9679fe) STILL OPEN: allocation_authority::single_hub_blocks (allocation_authority.rs:476) picks the FIRST declared hub this clone reaches via find_map over hubs.hubs. In multi-hub-no-root mode a clone reaching both hubs loses held blocks stamped for the later hub (LineageView::hub_of falls to block_lineage and reports no lineage), contrary to 'Clones keep minting from blocks they already hold'. Fix: resolve each block's own stamped hub via its reaching remote. Test: a clone reaching two declared hubs holding a block stamped for the later-ordered one stays spendable.
    3. F3 minor (AC7 acdcccc2, docs) STILL OPEN: docs/cli/10-storage.md 'Clone-local allocation authority' (lines 222-252) precedes the single-hub section and still says 'Global allocation requires an explicit local setting' and that non-authoritative clones refuse 'block claims, and blocks-only allocation' — both false in single-hub mode, so the chapter does not lead with the single-hub case. Move the single-hub section first or rewrite that section to state the single-hub rule first and scope the refusal list to no-hub/rooted stores.
    4. F4 cosmetic (traceability) STILL OPEN: aida criteria reports all 7 STORY-2204 criteria untraced. Add trace:STORY-B6B1278890774EF993D2EBC327862470-164.<acid> beside the covering tests: story_164_single_hub.rs cases (ac3ed745, ac180ae1, ac00342e, ac9679fe, ac2f7ade), allocation_conflicts_tests story_164_overlapping_* (ac47d5e9), and the 10-storage.md single-hub section (acdcccc2).
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-01T06:05:27.984979633Z
  modified_at: 2026-11-01T06:05:27.984979633Z
