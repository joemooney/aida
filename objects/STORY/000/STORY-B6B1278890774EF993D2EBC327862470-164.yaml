  content: 'Round 4 (5e070dd), untested locally (BUG-2383); CI is the gate. cli-1: the failing claim is at story_164_single_hub.rs:611, right after clone b renames origin to upstream (it is not after enroll-root). Root cause: store_hubs::committed ran rev-parse refs/heads/main@{upstream}, which git rejects ("no such branch"), so the hub was only ever found through the origin/main fallback. It now uses for-each-ref --format=%(upstream), covered by the new unit test the_declaration_is_read_from_a_renamed_upstream. The fixture is correct. lib-0: remote-creds-ok on remote_urls and hub_ref_blocks. lib-1: config-trust [readers] for store_hubs.rs (4) and allocation_health.rs (1), plus store.hubs keys classified as policy. cargo fmt is clean. check-ci-fast was not run: it takes longer than the 60s cap.'
