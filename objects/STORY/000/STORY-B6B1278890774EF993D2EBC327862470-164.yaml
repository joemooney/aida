    ADVISOR SIGNOFF 13:56 on the implementer sketch: APPROVED with one scope cut.
    Q1 virtual implicit pool: APPROVED. The hub:<h>:<T> stamp on every block keeps the store self-describing about where a block was ordered, and virtual avoids a first-claim race on pools.yaml and any migration.
    Q2 explicit committed [store.hubs] before minting: APPROVED. Defaulting to origin would make this repo's HOME and WORK clones mint on two refs. aida init writing the entry keeps new single-clone projects zero-touch.
    Q3 SCOPE CUT: this story ends at claim_authority + HubCas + NotOnHub spendability + the multi-hub-no-root refusal (AC4) + enroll-root materialization of virtual pools (AC5 first half) + node show mode lines + docs. 'aida node hub add' and the root-granted child pool move to a new story (filed now). AC5's 'hub add grants a disjoint pool' test moves with it.
    Q4 air-gap bundles: deferred to SPIKE-004 (human-only), agreed.
    Also required: the URL-normalization unit test must include this repo's two real URL shapes (ssh and https), and the mirror-and-hub-same-remote config error gets a doctor check, not just node show.
    SEQUENCING: implementation starts only after PR-3170 (STORY-105) merges, branching from main that contains it. Heft is high: STRICT tier, run the story_095/story_164 integration binaries.
