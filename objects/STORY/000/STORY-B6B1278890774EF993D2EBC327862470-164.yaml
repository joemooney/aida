    ADVISOR REWORK BRIEF round 2 (17:48), PR-3185. The claim path, NotOnHub, multi-hub refusal, node show/doctor and docs are solid. Fix these four (all from the verdict, which is authoritative):
    1. AC2 on a realistic FRESH project: the backfill guard blocks single-hub claims on a new store. A project with one declared hub and no legacy local-only specs must claim and mint with no backfill step; add a CLI fixture from 'aida init' through the first agreed ID.
    2. AC5: after enroll-root, existing blocks held by NON-root clones must stay spendable (materialized pools keep their lineage); add the test.
    3. A [store.hubs] entry counts only when committed AND reachable from the code default branch on the hub (sketch section 1); a local-only config commit must not count. Test it.
    4. AC6 (overlapping claims from two unrooted hubs refused at sync in both modes) needs its test.
