spec_id: STORY-8
title: 'Queue: Database storage model'
description: |-
  Queue: Database Storage Model

  Move queue storage from local GUI settings file to the database so queues are accessible from all interfaces (CLI, web, GUI, API).

  **Data Model:**
  A queue entry represents a user's focus-ordered reference to a requirement:
  - `user_id` (string) — the user/owner handle
  - `requirement_id` (UUID) — the requirement being queued
  - `position` (integer) — ordering within the queue (lower = higher priority, gaps allowed for easy insertion)
  - `added_by` (string) — who added this item (self or another user, enables inbox semantics)
  - `added_at` (timestamp) — when the item was added
  - `note` (string, optional) — short context note from the person who added it ("urgent, client escalation")

  **Storage Options:**
  - SQLite: `queue_entries` table with composite unique on (user_id, requirement_id)
  - PostgreSQL: same schema, native indexing
  - YAML: nested under user settings (fallback for single-user)

  **Behavior:**
  - Position uses gapped integers (e.g., 1000, 2000, 3000) for O(1) insertion between items
  - Re-normalize positions when gaps get too small
  - Unique constraint: a requirement can appear in a user's queue only once
  - Deleting a requirement cascades to remove it from all queues

  **Acceptance Criteria:**
  1. Queue entries persist in the database
  2. CRUD operations: add, remove, reorder, list
  3. Cross-client visibility (CLI and web see same queue)
  4. Migration path from existing GUI local queue format
