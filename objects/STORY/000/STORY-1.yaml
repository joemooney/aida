title: Poll GitLab for Changes
description: |-
  As a system, I need to periodically check GitLab for changes to linked issues so that I can detect divergence from AIDA state.

  ## Acceptance Criteria
  - [ ] Background polling for changes to linked issues
  - [ ] Configurable poll interval (default: 5 minutes)
  - [ ] Efficient polling using `updated_after` parameter
  - [ ] Respect GitLab API rate limits
  - [ ] Update sync state when changes detected
  - [ ] Trigger notification/callback on divergence
  - [ ] Support manual refresh (force check now)
  - [ ] Pause/resume polling capability

  ## Polling Strategy
  ```
  1. Get last poll timestamp
  2. Query: GET /issues?updated_after={timestamp}&iids[]={linked_iids}
  3. For each updated issue:
     a. Calculate new content hash
     b. Compare with stored gitlab_content_hash
     c. If different, mark as GitLabModified
     d. Update last_sync timestamp
  4. Store new poll timestamp
  ```

  ## Configuration
  ```toml
  [gitlab.polling]
  enabled = true
  interval_seconds = 300    # 5 minutes
  batch_size = 100          # Issues per API call
  max_concurrent = 3        # Parallel API calls
  ```

  ## Optimization
  - Only poll for linked issues (not all project issues)
  - Use `updated_after` to minimize data transfer
  - Batch issue IIDs in single request (up to 100)
  - Cache and compare ETags where supported

  ## CLI Support
  ```bash
  # Manual refresh
  aida gitlab refresh                 # Check all linked issues
  aida gitlab refresh FR-0042         # Check specific requirement

  # Polling control
  aida gitlab poll start              # Start background polling
  aida gitlab poll stop               # Stop polling
  aida gitlab poll status             # Show polling status
  ```

  ## GUI Behavior
  - Background polling when GUI is open
  - Status bar indicator showing last poll time
  - Visual refresh when changes detected
  - "Refresh" button for manual check

  ## Error Handling
  - Exponential backoff on API errors
  - Log rate limit responses
  - Continue polling other issues if one fails
  - Alert user if polling fails repeatedly
