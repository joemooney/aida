    Implemented via PR-46 (https://github.com/joemooney/aida/pull/46, commit b329c68a):

    - New `aida-cli/src/auto_complete.rs`: phase-sequencing core behind a `PhaseDriver` trait — variant gating, verdict parsing, JSON phase events, recovery hints; 27 tests against a `MockPhaseDriver`.
    - `RealPhaseDriver` (main.rs): subprocesses `aida queue work` for interactive phases, owns the CI gate, discovers leases via `.aida/sessions/` snapshot-diff, shells out to gh/aida/cargo. Exit codes 0-6 keyed to the failing phase.
    - `/aida-review` skill: verdict-file handshake via `$AIDA_REVIEW_VERDICT_FILE`.
    - Four variants: full / through-ci / through-merge / skip-build; `--json` for machine-readable progress.

    Test status: 472/472 aida-cli tests green; fmt + clippy clean; plan verify PASS.
