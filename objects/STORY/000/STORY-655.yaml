description: 'EPIC-48 first experiment. Design: docs/research/ablations/2026-06-17-gate-vs-rule.md. Build scripts/ablations/gate-vs-rule.sh (throwaway repo per trial; claude -p a small commit task; toggle AIDA_COMMIT_STRICT for the gate arm; deterministic regex grading; CSV of landed-compliance + gate-saves). Run K=15/arm on invariant I1 (commit format). Pre-registered interpretation: Arm-R landed-compliance <=80% => P1 holds; >=95% => P1 weakened (scope to semantic/multi-step invariants); 80-95% => partial, run I2. Fold the result (EITHER outcome) into the theory paper section 4 (P1). Costs ~30 headless runs — operator opts in to the spend.'
