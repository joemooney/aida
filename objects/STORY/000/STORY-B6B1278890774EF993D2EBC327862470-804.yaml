- id: 01a1f9f9-a07c-78a1-8dad-64112cbf3972
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2906):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 0f00ac1bdef7
    Recorded: 2026-11-20T17:16:17.722247569+00:00
    Findings:
    1. F1 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:561-610 (AC1/ac03ba3f): Do not use the reconciler's mutually exclusive state as the complete stall predicate. land::derive returns CI-FAILED before inspecting review history, so an old head with no verdict and red CI, or an exact-head changes-requested PR with red CI and no owner, falls through classify_pr to moving. An approved head with an unmet hold similarly becomes BLOCKED and moving. These are precisely unreviewed, unworked or unmerged stalls the completion criterion requires detecting. Gather the independent approval/refusal/reviewer/owner facts and classify the required cases despite reconciler precedence; add regressions using actual derivation/loader inputs, not only preselected PrFact states.
    2. F2 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1568-1571 and aida-cli-lib/src/land_metrics.rs:46-66 (AC1/ac03ba3f): Base each wait on the relevant push or verdict timestamp, not the first local sighting of a reconciler state. A head pushed hours ago is shown moving on the guard's first observation and waits another threshold; a PR that spent hours CI-FAILED can instead be called an old approved-red stall immediately after its first approval because approval does not change CI-FAILED. Rework also discards row.since, which already carries verdict timing. Read the authoritative event times and track ownerless time where required. The PR's disclosed approximation is not an approved criterion deferral.
    3. F3 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1306-1328,1846-1874 (AC2/ac6ad1b8): Retain the scheduled landing/host observation and supply per-host memory. scan_and_route converts Report to stuck-only DoctorFindings; neither its output nor saved Memory contains landings, lane counts or memory, so even successful scheduled runs do not record this required telemetry (especially an empty-stall run). host_lines also substitutes 'not measured from this host' for every foreign host without collecting its memory. Persist/expose a timestamped run snapshot and obtain remote host telemetry or narrow the completion claim through an accepted spec change. Existing tests only inject a ready-made HostLine.
    4. F4 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1506-1515,1543-1558 (AC7b/ac2ed289): Collect recurrence failures from any PR, independently of approval. red_rows includes only approved CI-FAILED or READY red changes, and only these receive RedFact. Thus a known main flake that fails on a new unreviewed or changes-requested PR never enters build_report's failure list and cannot produce MAIN-FLAKE-RECURRENCE. Add a production-loader regression for a known main flake recurring on an unapproved PR.
    5. F5 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1130-1195,863 (AC7b/ac2ed289): Preserve the failed attempt as a failure even when its run is already green on rerun at observation time. read_base_runs puts a successful rerun's failed tests only into memory.flakes, while build_report compares flakes only against memory.base_failures and current PR failures. If main test T flakes in run A and fails again in run B, with both rerun green before the next 20m tick, the report records two flakes but no recurrence. Record failed attempts with their real attempt identities/times and compare subsequent failures, including ones later rerun green; add a fixture covering both runs arriving in one tick.
    6. F6 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1353-1368 (AC7c/ac2ed289): Treat explicit post-exit routing as follow-up. lane_outcome_facts checks only later receipts and live local/foreign owners; it never checks routing events or queued work. A punt that product already routed to advisor, with no new lane yet, is still reported as 'nothing has ... routed it' and sent back to the launcher. Incorporate timestamped routing/queue evidence after finished_at and test a routed-but-not-relaunched exit.
    7. F7 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1387-1388,1426-1428 (AC7d/ac2ed289): Inventory all admission-blocking shared records and do not discard an unresolved blocker just for age. coordination::list_claims reads only coordination/leases; drain/solo process-lock claims require list_lock_claims and are never inspected here, despite being shared admission blockers the stale-lease healer cannot release. In addition, expired shared claims older than seven days are silently skipped even if admission still refuses them. Include the relevant lock inventory with its actual record paths and retain still-blocking claims until resolved; add loader fixtures for both cases.
    8. F8 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1234-1243 (AC7a/ac2ed289 and advisor flake/rework ruling): Preserve partial-log uncertainty. When one failed job yields an untouched test and another failed job's log is unavailable, any nonempty failing_tests clears unread. red_cause can then claim that none of the failing tests is touched and advise a flake rerun even though the unread job may contain a PR-caused failure. Keep unread evidence per failed job and use inspect/undetermined unless all evidence required for the flake conclusion is available; test a mixed readable/unreadable job response.
    9. F9 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:382-390,539-542 (AC7a/ac2ed289 and advisor flake/rework ruling): Do not let one base-red check exonerate every PR failure. base_checks returns Red if any failed PR check is red on main; red_cause returns BaseRed before checking the failing tests against changed paths and the action says the PR needs no rework. With check A failing on both main and PR and check B failing only on PR in touched code, this suppresses the required PR-caused rework. Retain per-check/test causes and route both the shared base repair and PR rework, with a mixed-cause regression.
    10. F10 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1537-1557 (AC7a/ac2ed289): Make the max_red_logs allowance progress across runs. Rows are ordered by PR number and logs_read resets to zero every tick, so the same first six red approved PRs consume the default allowance forever; PR seven and later remain ':inspect' with no failing-test names while the earlier PRs remain red. Cache completed detail or persist a fair cursor so every eligible head is eventually examined; test repeated runs with more than six red PRs.
    11. F11 [severity=p2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/land_stalls.rs:1727-1729,1802-1804 (AC3/acd93c9f): Do not permanently deduplicate a mail wake that failed. mail_wake logs write_message errors and returns (), then route marks every item routed regardless. If the due ledger is writable but the mailbox temporarily fails, all later ticks omit this seat from plan_routes and never retry the required wake for the unchanged blocker. Track due-job and wake delivery separately, and retry failed mail without duplicating successful route delivery; add an injected mailbox-failure regression.
    12. F12 [severity=p2; blocking_tier=p2] aida-cli-lib/src/land_stalls.rs:1168-1173,1231-1236: Enforce the 75s detail deadline inside job loops and pass remaining time to each forge call. The current checks occur only before a whole main run or PR; each can then issue up to 100 sequential 20s job-log calls. One sufficiently large/slow failed run can therefore exceed the scheduler's 300s kill ceiling before route/save_memory is reached, losing all stalls that tick. Bound the aggregate work and emit partial evidence before the ceiling; cover a multi-job slow-loader fixture.
    13. F13 [severity=p2; blocking_tier=p2] aida-cli-lib/src/land_stalls.rs:1395-1398: Route the new lease-liveness reader through ownership/ rather than adding legacy probe_live_claude_sessions and lease_state_for call sites. Exact-head CI job 136439424371 fails tests.test_ownership_liveness_ratchet.OwnershipLivenessRatchet.test_no_new_legacy_sites and names these two new call sites. This is a source regression, not an unexplained CI outage. Use the ownership reader's supported verdict boundary and retain coverage of unknown holders; do not grow the legacy baseline to bypass the guard. Evidence: https://github.com/joemooney/aida/actions/runs/44779869955/job/136439424371 .
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
