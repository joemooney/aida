  content: |-
    Product 09:08: Claude (Fable 5.2) fresh-start lane queued on dell1, brief:
    # Brief: STORY-2906 throughput-guard (fresh start; advisor-121 09:06: APPROVED, drain, high; Claude+Fable; standard review; no sketch needed)

    Implement ACs 1-8 in the spec description. Rulings are on the spec:
    - Reuse the existing pattern: an `aida doctor check` plus a `[[schedule.jobs]]` entry plus seat-routed due jobs (see landing-health-guard / landing-health-guard-route in .aida/config.toml). No new authority decisions.
    - The code default preserves current behaviour (OFF). AC8 enables it in THIS project's .aida/config.toml.
    - STUCK-MERGE-RED must tell an untouched-test flake (the failing tests pass on main; route as one rerun then a fix-forward) from a PR-caused red (route as rework), and show the reason in the routed item.
    - Vendor-neutral by construction (AC6): findings reach seats only as due jobs and mail.
    Trailer (STORY-2906) only if every AC is met; otherwise (Refs STORY-2906).
    Before pushing, run `make check-ci-fast` and `python3 scripts/check-store-writers.py`.
