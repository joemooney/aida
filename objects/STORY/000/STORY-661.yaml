title: aida config menu — a navigable TUI menu of configurable items
description: 'A navigable TUI (aida config menu, or aida config --menu) listing every configurable item (the AIDA_* env knobs + .aida/config.toml fields) with current value, default, scope, and a one-line explanation, editable inline. Smallest-valuable-slice first: a read+navigate view over the known config surface (reuse the canonical list from docs/environment-variables.md + the config struct), then make the highest-value items settable. Ties to the TUI (EPIC-26) and complements aida init prompting.'
