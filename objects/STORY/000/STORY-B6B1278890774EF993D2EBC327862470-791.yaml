    ## Implementer self-review
    Reviewed HEAD: 3bbbb9987c

    Acceptance evidence:
    - AC1 [behavioral-test]: knob absent / default=supervised leaves unset supervised and set modes untouched: gate::unset_mode::tests::absent_or_supervised_setting_leaves_unset_supervised; malformed values stay supervised: malformed_setting_stays_supervised_with_a_warning. Existing truth-table tests (gate::ship supervised_merge_holds_*, live_gate_refuses_a_supervised_spec_*, bug_2413_*) pass unchanged.
    - AC2 [behavioral-test]: drain_default_matrix covers type in/out of drain_types x sensitive (keystone/security/authority/containment/operator-only) or not x protected path (gate code, .aida/config.toml, unreadable files) or not x explicit mode (drain/drive/guided/operator/decide). Train member gate: pr_train::tests::live_gate_lands_a_project_default_drain_spec_only_off_protected_paths. Ship: ship_holds_name_the_effective_mode. Only the supervision gate changes; approval-at-head, CI, holds, draft-only still run.
    - AC3 [behavioral-test]: refusal label 'drain (project default for unset bug)' / 'unset (supervised: <why>)'; aida show prints effective_mode / 'Effective mode:' when a drain default is configured (only_the_default_branch_config_counts).
    - AC4 [documentation-inspection]: docs/configuration-guide.md 'Unset execution mode'; two-seat-protocol.md 'Unset execution mode' paragraph (template + mirror). Default stays supervised; this repo's config is NOT changed.

    Probe findings / fixes during self-review: test used raw git (maintenance ratchet) -> crate::test_git; test reached pr_cmd from gate/ (dependency ratchet) -> gate-level fn; new gate module registered as orchestrator (story_1888 ratchet).
    Security: setting read from the trusted default branch only (a branch editing .aida/config.toml also touches a protected path). Unknown paths fail safe (withdraw default).

    Residual risks: the drain's own merge phase (phase_driver merge_supervision_hold) and burndown wave merge still treat unset as supervised (they merge directly without the protected-path check); such PRs land via aida pr train. Train verified evidence 'policy_specs' records the effective mode before path withdrawal (evidence only; the member gate re-checks). Local check-ci-fast: 3 gates (containment conformance, store mutation channel, self-hosted routing fixtures) fail only on sandbox AF_UNIX denial; all others pass.
