spec_id: STORY-22
title: GitLab Connection Configuration
description: |-
  As a user, I want to configure GitLab connection settings so that AIDA can communicate with my GitLab instance.

  ## Acceptance Criteria
  - [ ] Support both GitLab.com and self-hosted GitLab instances
  - [ ] Configure via settings file (`~/.config/aida/gitlab.toml`) or environment variables
  - [ ] Store authentication token securely (not in plain text in config)
  - [ ] Support Personal Access Tokens (PAT) with `api` scope
  - [ ] Validate connection on configuration (test API call)
  - [ ] CLI command: `aida gitlab config --url <url> --token <token> --project <id>`
  - [ ] GUI: Settings dialog with GitLab configuration tab

  ## Configuration Fields
  ```toml
  [gitlab]
  url = "https://gitlab.com"  # or self-hosted URL
  project_id = 12345          # GitLab project ID
  # Token stored in system keyring or AIDA_GITLAB_TOKEN env var
  ```

  ## Security Considerations
  - Token should be stored in OS keyring (keyring crate) or read from environment
  - Never log or display full token
  - Support token rotation without data loss

  ## Technical Notes
  - Use `gitlab` crate or direct REST API calls
  - GitLab API v4: `GET /api/v4/projects/:id` for connection test
  - Rate limit: 2000 requests/minute (authenticated)
