  content: 'PERSONA definition (operator, 2026-06-09): the four audiences are customer / team / self / **operator**. The first three are WORK-NARRATIVE views (what shipped / where are we / advisor''s-own-detail). `operator` is the ONLY one whose lens is the CLI SURFACE itself — the day-to-day CLI user/power-user who wants the command-surface diff (new commands / changed flags / changed behaviors / fixes-you''ll-notice), value-framed + try-it. Do NOT build operator as a synonym for self (self = SPEC-ID-rich work narrative; operator = CLI-surface changes, SPEC-IDs stripped, value-translated). This is the ''cli changes'' perspective the operator asked for.'
