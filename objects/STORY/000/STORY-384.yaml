  content: |-
    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: `aida queue recover <id>` wizard is unimplemented, but it explicitly composes on BUG-285 (frequency reducer) + TASK-405 (PR-only orchestrator) + TASK-406 (worktree-aware merge). Build it now or wait for those?
      a) Build now as a front-end over existing primitives (session leases, git/gh probes, session end, pull) — the decision-tree value stands even before TASK-405/406 land
      b) Defer until TASK-405/406 ship so the `pr==open → drive phases 3-6` and merge paths compose properly, avoiding a wizard that half-works
      c) Reject in favor of TASK-396/STORY-491-492 resumability — the `--resume-drain` reconcile path now handles much of the "rerun picks up where it left off" case the wizard was meant to cover
      REC: b — the wizard's most-common branch (drive phases 3-6) depends on TASK-405; shipping it first risks a wizard that recommends paths its primitives can't execute. Frequency-of-need has also dropped (BUG-285 + resumability landed), so it is no longer urgent.
