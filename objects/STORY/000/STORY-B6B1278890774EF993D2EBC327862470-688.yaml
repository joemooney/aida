title: 'Integration-track tooling follow-ups: landing evidence, scope, AIDA_TRACK propagation, ambiguous tracks, direct launches'
description: |
  Follow-up to the #3935 review rounds (integration tags and launcher track admission). The advisor ruling of 2026-11-13 07:17 accepted these as correctness gaps in integration-track tooling. None of them fails open for main.

  Acceptance:
  1. Landing evidence is complete. `aida integration tags` resolves completing-commit trailers to stored spec identity, covering canonical and node-alias forms and origin IDs after agreed-ID assignment. Done specs that await promotion keep their marker. Regressions cover each identity form.
  2. `aida integration tags` passes --no-scope to both internal list queries, so an active role scope (tags or status) never hides landed or closed specs. A regression runs it under a scoped role.
  3. AIDA_TRACK propagates across every child launch boundary: vendor children, background lanes and drain phases. A regression shows a real child runs on the parent's track.
  4. Ambiguous multi-track tags are refused at the tag-write seam, or refused deterministically everywhere they are read, with one consistent message.
  5. Direct agent launches (`aida agent new --role implementer --spec`, including background lanes) apply the same fresh-pickup track admission before any resource or status change. Review and resume roles keep their current behaviour.
  6. Queue views suggest the matching launcher for foreign-track work (for example "set AIDA_TRACK=integration") consistently across list, next and drain previews.
