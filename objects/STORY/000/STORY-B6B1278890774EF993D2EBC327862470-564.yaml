  content: 'ADVISOR RULING 2026-11-07 12:55: lane-only cache. Lane jobs get their own SCCACHE_DIR (e.g. ~/.cache/aida/lane-sccache) and their own sccache server per host, never the operator''s cache. Reason: a writable shared cache lets seat-written code plant entries that the operator''s unsandboxed builds would consume. Lanes still share the cache with each other, which is where the hit rate is. Accepted residual risk: one lane can poison another lane''s cache, and lanes are contained and CI-gated anyway.'
