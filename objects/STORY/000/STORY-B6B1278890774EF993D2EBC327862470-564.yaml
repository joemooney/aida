title: 'Lane test jobs use the host''s sccache: bind a writable cache dir and reach the server inside the job bubblewrap'
description: |
  ## Problem
  Lane test jobs run in bubblewrap with a cleared environment and a read-only cargo home. They appear not to use sccache: on the primary, sccache stats show 3 compile requests and 0 executed while lanes were active. Each seat clone therefore compiles every dependency cold. dell1's target dir is 76G.

  ## Proposal
  When the host's cargo config sets `build.rustc-wrapper` to sccache, the lane job profile:
  - passes `RUSTC_WRAPPER` (or keeps cargo config resolution) and a host-owned `SCCACHE_DIR`;
  - binds that cache dir writable and makes the sccache server reachable (either the host's server socket or a per-job local server);
  - keeps cargo home read-only and the job offline.
  Seat code cannot poison the shared cache beyond what sccache's keying already allows; document that residual risk, or use a lane-only cache dir separate from the operator's.

  ## Acceptance
  1. A second lane job building the same dependency set shows sccache cache hits (`sccache --show-stats` delta > 0) on the primary and on dell1.
  2. Without sccache configured, behaviour is unchanged.
  3. Test: the job profile's env/bind set includes the cache dir and wrapper only when configured.
  4. The trust decision (shared or lane-only cache) is recorded on this spec before implementation.
