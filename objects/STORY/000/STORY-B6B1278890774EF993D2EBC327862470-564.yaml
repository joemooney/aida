    2. major/correctness: removing --unshare-pid reopened the restart race from round 6, and round 8 added no replacement. Inside a job, the host wrapper's ensure_sccache_server runs before cargo (~/ai/aida-host/bin/cargo:231 and 1365). sccache_dead_tmpdir (157-177) uses pgrep -x sccache, which now sees every host sccache process, and treats any TMPDIR that is absent in the sandbox or matches /dev/shm/cargo-tmp-* as dead. So a concurrent build's client makes the wrapper run --stop-server (lines 218-223) against this job's SCCACHE_SERVER_UDS and start a detached daemon. SCCACHE_JOB_SCRIPT's wait then covers only the stopped foreground server: statistics reset, which also undermines the AC1 measurement, and 'server exited before sandbox teardown' prints while the daemon may still be draining, so --die-with-parent can lose final cache writes. Found by reading the wrapper, not reproduced at runtime. story_2641_sccache_host_queue_ticket_stays_live covers tickets only. Fix in this repo: run cargo as AIDA_SCCACHE_PIDS="$server" "$@" in SCCACHE_JOB_SCRIPT (lane_job.rs:302); the wrapper honours it at lines 160 and 201, so it inspects only the job's server (TMPDIR=/tmp) and skips the restart. Or make the wrapper skip restart when SCCACHE_SERVER_UDS is set. Add a regression with a foreign dead-TMPDIR sccache process.
