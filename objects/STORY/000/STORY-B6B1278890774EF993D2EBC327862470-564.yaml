- id: 01a1b95e-b27b-7dd3-85c7-069fcb817f43
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3657):
    Verdict: CHANGES REQUESTED
    Reviewed commit: fa05511f0d45
    Recorded: 2026-11-08T03:53:49.430307072+00:00
    Findings:
    1. major/correctness: launch/resources.rs:72-90 SandboxResources::for_seat returns Err('recorded seat has no private cargo target') whenever host_recorded_clone yields cargo_target_dir=None, and spawn_agent (launch/spawn.rs:39-43) propagates it with '?'. cargo_target_dir is None for every clone seat whose project had no target/ at seat start (session_start.rs:3207 detect_cargo_target_dir returns None for non-Rust projects or a fresh checkout), and also after a host 'cargo clean' removes target/worktrees/<seat> (seat_clone.rs:876 filter requires the dir to exist). Before this PR these launches worked; now every agent launch in such a seat fails. Fix: when the recorded clone has no target, return Ok(None) (or a resources value with no cargo override) instead of refusing, or recreate the target dir; add a test for a recorded clone without cargo_target_dir that still launches.
    2. major/acceptance: AC1 (second lane job shows sccache hits, sccache --show-stats delta > 0, on primary and dell1) has no evidence on the spec or PR. The design runs a per-job server whose UDS lives in the job's private /tmp, so host stats cannot see it (OVERVIEW.md note rewrites the criterion unilaterally). Provide measured evidence from two consecutive lane jobs on each host (e.g. a job running 'sccache --show-stats' after the build, or cache-dir growth plus hit counts), or get an advisor amendment of AC1 recorded on STORY-2641. Also confirm cache writes survive the job's bwrap teardown: the server is killed when the job exits, which can drop sccache's asynchronous disk-cache puts for the last compiles.
    3. minor/ux: lane_job.rs:839-852 prepare() fails the whole lane test runner when ~/.cache/aida/lane-sccache already exists with a mode other than 0700 (e.g. created by a plain mkdir) or a different owner, and the error 'lane sccache must be an owned private directory' omits the path and the fix. Include the path and a remedy (chmod 700 <path>), or fall back to running the job without sccache rather than losing the runner.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
