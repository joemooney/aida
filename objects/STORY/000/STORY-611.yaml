  content: |-
    REFINEMENT (operator, 2026-06-13): 'complete what-needs-me surface' requires ACT, not just LIST. Listing buckets but bouncing to 'aida questions'/'aida review' to act is a directory, not a hub. Operator OK'd aliases. Add thin ALIAS subcommands under 'aida human' that delegate (faithful-launcher: no divergence, just forward):
     - 'aida human answer <spec> <choice>'  → 'aida questions answer'  (drain a decision)
     - 'aida human review <spec>'           → 'aida review'            (drain a review)
     - ('aida human decide' acceptable as an alias of answer, if a verb reads better)
