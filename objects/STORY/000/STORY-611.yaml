     - Decisions awaiting you  → 'aida questions answer <spec> <choice>'  (today: only a one-line POINTER to 'aida questions list' — upgrade to a real bucket listing the pending DecisionRequests).
     - Reviews awaiting you     → 'aida review <SPEC>'                      (slice 1 of this story — missing entirely today).
     - Triage (findings)        → 'aida findings list'                     (today: a pointer; fine as-is or upgrade).
    The banner already claims 'a decision, review, or triage' — deliver all three as buckets. This is the three-drains surface made complete + honest. No new 'aida human decide' verb — 'aida questions answer' is the decide drain. trace:STORY-611
