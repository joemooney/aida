title: 'aida human: add a ''Reviews awaiting you'' bucket + an ''aida human review'' sweep — the review queue is invisible despite the banner promising it'
description: |-
  Operator hit (2026-06-13): had to ASK how to even see/run a review for an open PR. Two gaps:

  (1) BUCKET (must-have): 'aida human' buckets are ungroomed / umbrella / findings-pointer / decision-inbox-pointer — there is NO 'Reviews awaiting you' bucket, even though its own banner says 'need a decision, REVIEW, or triage from you.' It promises review and doesn't list it. Add a bucket enumerating specs with a review surface awaiting the human: Done-on-branch / open-PR specs not yet merged (the same surface 'aida review <SPEC>' locates), each line pointing at 'aida review <SPEC>'. Reuse aida review's surface-detection (open draft PR, else branch+commits). Title beside the id (cf. BUG-535).

  (2) SWEEP (nice-to-have): 'aida review' is per-SPEC only — no 'all outstanding' mode. Add 'aida human review' (or 'aida review --all') that walks the outstanding-review set one by one (locate surface → reviewer verdict → approve/request-changes/defer per item). This completes the THREE-DRAINS symmetry: implement = 'burndown run' (agents), decide = 'aida questions answer' (human), review = 'aida human review' (human + reviewer agent). And 'aida human' becomes the complete what's-pending-for-me surface (decisions + reviews + triage), not just decisions+triage.

  Slice 1 = the bucket (bounded, read-only enumeration, drain-safe). Slice 2 = the sweep verb. trace:relates:BUG-535 trace:relates:STORY-553 trace:from-friction
