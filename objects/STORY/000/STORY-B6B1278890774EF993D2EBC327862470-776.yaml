    ## Implementer self-review
    Reviewed HEAD: 0f96aefa9a0783823da16bc1f585a99b104bd882; the origin/main merge-base diff was empty. Reviewed the native worktree diff, generated help snapshot, and untracked deputy/progress.rs before declaration.

    - Startup, claim, start, finish, refusal and output modes: aida-cli-lib/src/deputy/tests.rs:819 and aida-cli-lib/src/deputy_shell/tests.rs:601 exercise real jobs in each mode, including refusal diagnostics and raw transcripts. Startup shows the configured submit policy. The command run subcommand takes the same path as the bare command.
    - Timing and cadence: aida-cli-lib/src/deputy/progress.rs:140 tests the 600-second threshold, repeat cadence, active-work reset, two handled jobs, and local day rollover. The runner tests exercise local HH:MM:SS output.
    - Probe findings and fixes: command and script dispatch use the same clap flag definitions. Job previews are bounded and escape newline, ANSI escape and Unicode formatting controls. Command verbose output renders ASCII controls as text while preserving the underlying transcript. Zero, one and multiple jobs were checked in the new heartbeat test and existing deputy suite. Existing script PTY test explicitly selects the new verbose mode and retains its original assertions.
    - Authority paths: the explicit command run route uses the existing human-terminal, wrapper and grant checks. Command claims still pass the executable, hook and TTY policy checks. Script start still requires advisor authority, socket submissions still require an attested live peer and claim-time attribution still runs before scripts are written or launched. Mode flags affect presentation and terminal relay. Existing no-grant, disallowed-seat, foreign-peer, command allow-list and single-use persistence refusal tests passed.
    - Validation: lane job j20261119T060515517-2-0 passed 121 tests. Lane job j20261119T061212122-2-0 passed the saved help snapshot comparison without regeneration. Changed Rust files passed rustfmt. The generated Clap snapshot contains expected spaces on blank option separators. Exact publication-head CI awaits host publication. Script prompts require --verbose, and a real ten-minute operator-terminal wait was represented by the deterministic clock test.
