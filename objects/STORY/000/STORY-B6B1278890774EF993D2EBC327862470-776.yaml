title: 'aida deputy shell run shows timestamped progress: job claimed, script started, finished with rc, idle heartbeat; --quiet to suppress'
description: 'Operator report 2026-11-15 21:48 MST: the ''aida deputy shell run'' terminals show very little, so the operator can''t tell whether a deputy is idle, running a job, or stuck. Acceptance: by default the runner prints one timestamped line per event: started (name, allowed seats, policy), job claimed (id, submitting seat/handle, script first line), finished (rc, duration, transcript path), refused (reason), plus an idle heartbeat every 10 minutes (''idle since HH:MM, N jobs today''). --quiet keeps only refusals and errors; --verbose adds the script''s live output. Times are local, HH:MM:SS. Same behaviour for ''aida deputy run'' (the command deputy).'
