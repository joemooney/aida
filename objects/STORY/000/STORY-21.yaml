spec_id: STORY-21
title: Push AIDA Changes to GitLab
description: |-
  As a user, I want to push AIDA requirement changes to linked GitLab issues so that GitLab stays up-to-date with requirements.

  ## Acceptance Criteria
  - [ ] Push single requirement changes to GitLab
  - [ ] Batch push multiple requirements
  - [ ] Map AIDA fields to GitLab fields (reverse of create)
  - [ ] Update labels based on status/priority/type changes
  - [ ] Add note to GitLab issue documenting the sync
  - [ ] Handle conflicts (GitLab modified since last sync)
  - [ ] Update sync state after successful push
  - [ ] Dry-run mode to preview changes

  ## Push Behavior
  ```
  1. Check sync state (detect if GitLab modified)
  2. If conflict, require resolution first (or --force flag)
  3. Build GitLab issue update payload
  4. Apply field mappings
  5. Call PUT /api/v4/projects/:id/issues/:iid
  6. Add system note: "Synced from AIDA (FR-0042)"
  7. Update sync state with new hashes
  ```

  ## Field Sync Rules
  | AIDA Change | GitLab Action |
  |-------------|---------------|
  | Title changed | Update title |
  | Description changed | Update description (preserve AIDA header) |
  | Status → Completed | Close issue + add label |
  | Status → Rejected | Close issue + add label |
  | Status → InProgress | Add label, keep open |
  | Priority changed | Update priority label |
  | Type changed | Update type label |
  | Owner changed | Update assignee (if user found) |

  ## CLI Support
  ```bash
  # Push specific requirement
  aida gitlab push FR-0042

  # Push all modified
  aida gitlab push --all

  # Force push (overwrite GitLab changes)
  aida gitlab push FR-0042 --force

  # Dry run
  aida gitlab push FR-0042 --dry-run

  # Push with comment
  aida gitlab push FR-0042 --comment "Updated acceptance criteria"
  ```

  ## GUI Support
  - "Push to GitLab" button in detail view (when diverged)
  - Confirmation dialog showing what will change
  - "Push All Modified" action in GitLab menu
  - Progress indicator during push

  ## Sync Note Template
  ```markdown
  ---
  🔄 **Synced from AIDA** at {timestamp}

  Changes:
  - Title: "{old}" → "{new}"
  - Status: Draft → Approved

  Source: [FR-0042](aida://FR-0042)
  ---
  ```

  ## Error Handling
  - Conflict detection before push
  - Validation of GitLab state before update
  - Rollback on partial failure (if possible)
  - Clear error messages for common issues (closed issue, locked, etc.)
