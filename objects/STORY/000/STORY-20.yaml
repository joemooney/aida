spec_id: STORY-20
title: 'Queue: Dashboard focus widget'
description: |-
  Queue: Dashboard Focus Widget

  Show a compact "My Queue" widget on the Dashboard page, giving at-a-glance visibility into what the user is focused on.

  **Widget Layout:**
  - Card titled "My Focus" or "My Queue"
  - Shows top 3-5 items from the user's queue with spec-id, title, and status pill
  - Item count badge showing total queue depth
  - "View All" link navigates to /queue
  - If queue is empty: subtle "No items in queue" message

  **Placement:**
  - Between the Sprint Summary section and the charts grid
  - Full-width card, same visual style as SprintSummary

  **Data Source:**
  - Uses /api/v2/queue/:user_id/summary endpoint
  - User determined by configured AIDA_USER or default

  **Acceptance Criteria:**
  1. Widget appears on Dashboard when queue has items
  2. Shows top items in queue order
  3. "View All" navigates to full queue view
  4. Clicking an item opens its detail
