    ADVISOR SIGNOFF 2026-10-31 04:00 on the sketch: APPROVED as written. Answers:
    Q1: opt-in (--rotate, or [agents.<vendor>] rotate = true) for this slice. The operator can turn it on per vendor in agents.toml.
    Q2: relay run (reuse STORY-1843; it already solves the gap, mail and crash reconciliation).
    Q3: relaunch on a non-zero exit when a fresh handoff exists; the crash and window guards still apply.
    Q4: yes, the supervisor stamps itself as the lease's active_pid/active_pid_start_time for the whole run.
    Q5: Codex goes in a separate story (filed by the advisor). This slice is Claude only.
    Q6: no injection into generation 1.
    Q7: ONE slice for everything in the sketch except Codex, including the `ls` #N display and the handshake generation/previous_native_session_id (2026-10-28 rule: no follow-up chain).
    Gate: LIGHT plus the command-level sh-child fixture tests the sketch lists; make check-ci-compile if it touches >10 files. Implementation may start.
