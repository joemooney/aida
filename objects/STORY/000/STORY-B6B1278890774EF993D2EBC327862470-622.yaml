title: 'aida flow report: per-PR stage timings and change-request reasons from the gate ledger and forge'
description: 'Productize the advisor''s ad hoc report (2026-11-09). For PRs landed in a window, report: open-to-land time, pushes, verdict counts by kind, time to first review, approval-to-land, CI wall time per run, train time, and blocking findings classified (CI failure, metadata, scope, tests missing, conflict, correctness, other) with severity. Output human table and --format json; aggregate medians and p90. Purpose: show where time goes and measure throughput changes (STORY-2694, STORY-2697, STORY-2695, risk-scaled review) against a baseline. Acceptance: fixture ledger plus fake forge test for each metric; documented in docs/cli.'
