  content: |
    Add a read-only flow report for landed PRs, with table/JSON output, stage timings,
    CI runs, linked train lifetimes, review counts and classified findings. Preserve
    the advisor baseline's commit-count push proxy and recursive verdict ledger walk.
    Missing measurements stay unknown; unreadable evidence and truncated forge
    responses refuse. Document timestamp and evidence limits.

    Validation: 5 metric/argument fixture tests and 21 command-registry tests passed
    through the lane runner; final help snapshot regenerated and verified. Rustfmt
    and git diff whitespace checks passed. No live-forge smoke run.
