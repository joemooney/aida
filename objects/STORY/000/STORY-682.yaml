title: 'EPIC-52 Slice 2 core: fuzzy command matcher + clap command-surface enumeration (pure, unit-tested module)'
description: 'The isolated, fully-unit-testable core of the fuzzy-command front door (design: docs/plans/2026-06-25-tui-redesign-fuzzy-command-palette.md), buildable WITHOUT any UI/launcher rework or keyboard testing. A new module (e.g. aida-tui/src/cmd_palette.rs) that: (1) enumerates the aida command surface from the clap command tree (subcommand path + about text) so it never drifts from the real CLI, plus a small curated common-actions boost list; (2) a tiny in-repo subsequence fuzzy matcher with Claude-like ranking (contiguous-run + word-boundary + prefix boosts), no new dependency; (3) returns ranked CommandEntry results for a query. Pure logic + thorough unit tests (match/rank ordering, empty query, boost behavior). NO TUI wiring in this slice — that is the supervised UI work. trace:EPIC-52'
