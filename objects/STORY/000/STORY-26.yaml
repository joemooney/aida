title: Automated Sync Rules Configuration
description: "As an admin, I want to configure automated sync rules so that routine syncing happens without manual intervention.\n\n## Acceptance Criteria\n- [ ] Configure auto-sync direction (push, pull, bidirectional)\n- [ ] Configure which fields sync automatically\n- [ ] Configure conflict resolution strategy\n- [ ] Set sync triggers (on change, scheduled, manual only)\n- [ ] Exclude certain requirements/issues from auto-sync\n- [ ] Sync filtering by labels/types\n- [ ] Audit log of automated sync actions\n\n## Configuration\n```toml\n[gitlab.sync]\n# Overall sync mode\nmode = \"bidirectional\"  # \"push-only\" | \"pull-only\" | \"bidirectional\" | \"manual\"\n\n# When to sync\ntrigger = \"on-change\"   # \"on-change\" | \"scheduled\" | \"manual\"\nschedule = \"*/15 * * * *\"  # Cron expression if scheduled\n\n# Default conflict strategy\nconflict_strategy = \"manual\"  # \"aida-wins\" | \"gitlab-wins\" | \"manual\"\n\n# Field-level sync rules\n[gitlab.sync.fields]\ntitle = \"bidirectional\"\ndescription = \"bidirectional\"\nstatus = \"push-only\"        # AIDA is source of truth for status\npriority = \"push-only\"      # AIDA is source of truth for priority\nassignee = \"pull-only\"      # GitLab assignment flows to AIDA\n\n# Exclusions\n[gitlab.sync.exclude]\n# Don't sync these AIDA types\naida_types = [\"Epic\", \"Folder\"]\n# Don't sync issues with these labels\ngitlab_labels = [\"wontfix\", \"duplicate\"]\n# Don't sync specific requirements\naida_ids = [\"FR-0001\", \"FR-0002\"]\n# Don't sync specific issues\ngitlab_iids = [999]\n\n# Filtering\n[gitlab.sync.filter]\n# Only sync issues with these labels\nrequire_labels = [\"aida-managed\"]\n# Only sync requirements with these features\nrequire_features = [\"Authentication\", \"Core\"]\n```\n\n## Sync Rules Logic\n```\nOn AIDA change:\n  1. Check if requirement is excluded → skip\n  2. Check if linked to GitLab → skip if not\n  3. Check field sync rules for changed fields\n  4. If mode allows push:\n     a. Check if GitLab modified (conflict check)\n     b. Apply conflict strategy or queue for manual\n     c. Push allowed fields\n\nOn GitLab change detected:\n  1. Check if issue is excluded → skip\n  2. Check if linked to AIDA → skip if not  \n  3. Check field sync rules for changed fields\n  4. If mode allows pull:\n     a. Check if AIDA modified (conflict check)\n     b. Apply conflict strategy or queue for manual\n     c. Pull allowed fields\n```\n\n## CLI Support\n```bash\n# Show current sync rules\naida gitlab sync-rules\n\n# Test rules against a requirement\naida gitlab sync-rules --test FR-0042\n\n# Validate configuration\naida gitlab sync-rules --validate\n\n# Run sync manually\naida gitlab sync                    # Sync all eligible\naida gitlab sync --dry-run          # Preview only\n```\n\n## GUI Support\n- Settings > GitLab > Sync Rules section\n- Visual rule builder\n- Test button to preview sync for selected item\n- Sync history/audit log view\n\n## Audit Log\n```rust\nstruct SyncAuditEntry {\n    timestamp: DateTime<Utc>,\n    sync_type: SyncType,          // Push | Pull | Conflict\n    requirement_id: Uuid,\n    gitlab_issue_iid: u64,\n    fields_synced: Vec<String>,\n    trigger: SyncTrigger,         // Auto | Manual | Scheduled\n    result: SyncResult,           // Success | Failed | Skipped\n    error: Option<String>,\n}\n```"
