  content: |-
    Role inference (additional clarification 2026-05-11):

    `aida queue work` should set the session's role automatically based on the cluster's routing:

    - All items for:implementer → `--role implementer` + launch with /aida-pickup
    - All items for:reviewer → `--role reviewer` + launch with /aida-review
    - Single item → role = item's for_role
    - Cluster with mixed routing → use the majority; warn user about the minority items
    - Override: `--role <name>` explicit flag wins

    So `aida queue work EPIC-20` not only resolves the cluster + writes manifest + starts session, but ALSO enters the role implicitly. Zero manual role-enter ceremony.

    Composes with TASK-67 (role-by-intent in lease) — both encode 'role is derived from the work, not from the shell's stale env.' STORY-42's cluster-derived role is the natural extension of TASK-67's scope-derived role.
