title: 'aida config menu: in-place toggle/edit (write-through to config.toml)'
description: |-
  aida config menu (STORY-661) is browse-only — it shows every knob (value/default/scope/explanation) but cannot change anything. Operator-surfaced friction (2026-06-22): the natural expectation on a navigable knob list is to toggle in place. Today most knobs (telemetry.enabled, advisor.calibration_mode, archive.auto_after_days, field_study.enabled, ...) have NO config subcommand — the only way to change them is hand-editing TOML, yet the menu shows them.

  Implementation plan: docs/plans/2026-06-22-config-menu-inplace-edit.md (read it first — it maps the registry, the toml_edit writer to generalize from glyph_config, and the cross-crate callback seam).

  MVP scope: BOOLEAN knobs toggle in place; everything else stays read-only with a clear reason. Reuse glyph_configs section-preserving toml_edit writer (generalize to set_kv). Env-shadowed knobs are never editable. Out of MVP: scalar/enum edit, agents/contained (separate agents.toml + side effects), in-TUI user/project scope toggle.

  ## Acceptance
  1. In the menu, Enter/Space on a boolean knob (field_study.enabled, hints.workflow_hints, telemetry.enabled, mailbox.autosync) flips its value AND the scope column updates to the written file (.aida/config.toml for project), live, without restarting the menu.
  2. The write preserves the rest of config.toml — other keys, comments, and key order untouched (verified by git diff and by a set_kv preservation unit test).
  3. A knob whose value currently comes from an env var (PolicySource::Env) is NOT editable; pressing Enter shows a footer reason naming the var, and writes nothing.
  4. Non-boolean knobs (scalars/enums/agents/contained) are clearly marked read-only with a pointer to the right edit path; pressing Enter is a no-op with an explanatory footer, never a silent dead key.
  5. Non-TTY still falls back to aida config show (unchanged).
  6. The 7 existing glyph_config writer tests stay green after the writer is generalized; an anti-drift test asserts every Bool editability entry names a knob policy_registry actually emits.
