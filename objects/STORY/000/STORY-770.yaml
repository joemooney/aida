title: 'SPIKE-78 follow-up: relocate the 1,524 inline tests out of aida-cli/src/main.rs'
description: 'Biggest remaining lever from SPIKE-78. main.rs is 126K lines but 86% (109,673 lines) is inline tests — 1,524 test fns in 17 cfg(test) blocks; only 13% (~16.5K) is live code. Relocating the tests drops main.rs to ~16K. Supervised because test-module boundaries are subtler than handler boundaries: shared fixtures, super::* imports, cfg(test) visibility. Payoff is primarily maintainability + rust-analyzer responsiveness + unblocking the crate split.'
