title: 'WS9: Governance-truth hardening — trace gate ON by default (init opt-out), history coverage scoped/backfilled (make ''governed + audited'' TRUE)'
description: |-
  Panel findings: trace 'enforcement' is advisory-by-default (warn-only commit hook AIDA_COMMIT_STRICT=false, repo's own pre-commit hook disabled, no CI trace gate; only merge→auto-bump is programmatic); history: arrays on ~11% of store objects. A governance-mechanism product cannot ship with the gate off by default (substrate-as-bouncer).

  Slice: (1) default-ON trace gate for NEW aida init projects (strict commit gate or CI-side check; existing projects opt-in via doctor/init --refresh; explicit opt-out flag — faithful default); (2) wire THIS repo's own gate (dogfood: un-disable pre-commit or add the CI job); (3) history claims scoped ('full transition history since TASK-121') everywhere + evaluate cheap backfill from orphan-branch log (skip if costly); (4) **landing this slice INCLUDES the un-scoping sweep**: upgrade WS1/WS2/WS5 copy from 'trace-linked, gate landing' to 'trace-enforced' in the same PR or an immediate follow-on. Acceptance grep-able: new-project default posture is enforcing; no unscoped 'enforced'/'every spec carries history' before that, none scoped after.
