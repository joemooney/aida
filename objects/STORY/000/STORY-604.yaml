- id: 019ec219-4c6f-7da2-9a8c-d0870bf3ea7e
  author: joe
  content: 'Concrete finding (2026-06-13): during a live ''aida burndown run'' (PID confirmed running), there was NO log file under .aida/ to tail and NO incremental output — because the headless ''claude -p'' is launched WITHOUT streaming flags, so it buffers silently until completion. Two-part implementation path: (a) launch the drain''s ''claude -p'' with ''--output-format stream-json --verbose'' (or equivalent) AND tee to a discoverable path like .aida/burndown/<drain-id>.log; (b) ''aida burndown status''/''watch'' tails that + renders plan position/phase. Until then the operator has no signal at all — not even a log. The in-flight marking (facet b) is the substrate complement: stamp blessed specs as ''claimed by drain <id>'' so list/show/queue reflect it even without reading the log.'
  created_at: 2026-06-13T17:48:18.415281566Z
  modified_at: 2026-06-13T17:48:18.415281566Z
- id: 019ec246-ae74-7d91-8b2a-defd3c28818d
  author: joe
  content: |-
    DESIGN ENRICHMENT (operator's Ctrl-O question, 2026-06-13; Claude Code facts confirmed via claude-code-guide):

    Ctrl-O = the interactive transcript/verbose-tool-use viewer; TUI-ONLY, no equivalent in 'claude -p' headless mode. But the same event stream is reachable headlessly, AND a full JSONL transcript is already written to ~/.claude/projects/<project>/<session-id>.jsonl (one JSON object per line: messages, tool-uses, metadata; 30-day retention). 'claude -p' sessions don't appear in the session picker but ARE resumable by id (claude --resume <id>). Headless streaming flags: '--output-format stream-json --verbose --include-partial-messages' → JSONL events (system/init, tool calls, text_delta, system/api_retry with attempt/max_retries — note: this is also how the wave-2 rate-limit hiccup would surface). They compose; render with jq.

    THREE OBSERVABILITY PATHS:
     A. ATTACHED/WATCH mode — 'aida burndown run --attached' launches an INTERACTIVE 'claude' (not -p) so the operator watches live via native Ctrl-O. Trades walk-away for visibility; near-zero new code (leans on Claude Code's own viewer). Ideal for the SUPERVISED case (e.g. keystone-reliability drains the advisor is told to watch).
     B. STREAM-TEE — keep 'claude -p', add '--output-format stream-json --verbose --include-partial-messages', tee to .aida/burndown/<drain-id>.jsonl; 'aida burndown status/watch' renders it (jq-style). Walk-away preserved + progress on demand.
     C. TRANSCRIPT-TAIL — keep the launch as-is, capture the child session-id at spawn, and have 'aida burndown watch' tail the EXISTING ~/.claude/projects/<slug>/<session-id>.jsonl. Lightest (no launch-flag change) — only needs session-id capture.

    RECOMMENDATION: ship B or C for the default walk-away drain (the drain's whole point is walk-away), PLUS A as an opt-in '--attached' for supervised drains. C is lightest if session-id capture is clean; B is most self-contained (we own the tee path). The in-flight/'expected-to-be-processed' marking (facet b of this story) is orthogonal and substrate-side — unchanged by this.
  created_at: 2026-06-13T18:37:52.628865786Z
  modified_at: 2026-06-13T18:37:52.628865786Z
- id: 019ec24c-7a9f-70f3-b0fb-83cf275c8820
  author: joe
  content: |-
    DESIGN DECISION (operator 2026-06-13): ship OPTION B as the primary; A is conditional/deferred.

    PRIMARY — Option B, with a --verbose human view:
    - 'aida burndown run --verbose' keeps the headless 'claude -p' launch (so AUTO-PROCEED through all specs is fully preserved — --verbose only adds visibility, never changes control flow) but launches with '--output-format stream-json --verbose --include-partial-messages', tees the JSONL to .aida/burndown/<drain-id>.jsonl, and renders a human-readable progress line per event to the operator's terminal. Default (no --verbose) stays quiet/summary.
    - The teed JSONL is the substrate for FUTURE TOOLING (operator: 'other future tooling might like json') and for 'aida burndown status/watch'. So two views of one stream: --verbose = human render now; the .jsonl = machine-readable for later.
    - Operator mental model: 'I would just do --verbose normally.'

    CONDITIONAL — Option A (--attached interactive + native Ctrl-O): the operator wants A ONLY IF it still auto-exits and auto-proceeds to the next spec as reliably as headless. RISK: an interactive 'claude' (not -p) can stall on permission/decision prompts that headless 'bypassPermissions' skips, making auto-proceed unpredictable. Per operator: 'if that is frequently unpredictable I would not want it.' DECISION: do NOT ship A speculatively. Pursue it only after evidence (a small SPIKE) shows interactive 'claude' + /aida-burndown auto-proceeds as reliably as headless. Until then, A is deferred — B + --verbose covers the watch need without touching the autonomy guarantee.

    SCOPE/POSTURE: this modifies the burndown-run LAUNCHER (keystone-adjacent), so implement at the KEYBOARD with the advisor watching, like BUG-530 — not an unsupervised drain. Facet (b), in-flight marking, stays orthogonal/substrate-side.
  created_at: 2026-06-13T18:44:12.575842832Z
  modified_at: 2026-06-13T18:44:12.575842832Z
- id: 019ec385-e56f-73a1-b2ed-acf1f0717bd0
  author: joe
  content: 'OPERATOR ASK (2026-06-13), sharpens facet (b): ''aida queue list'' and ''aida burndown plan'' should DETECT a running drain and explicitly mark its specs — Scheduled (claimed by the drain''s blessed set, not yet picked up) vs InProgress (actively leased/being worked). Today the signal is only IMPLICIT: an actively-worked spec flips to In Progress (queue work leases it) so it leaves the ''ready'' set + shows in ''aida list --status in-progress'' / ''aida session leases''; queue list has ''Done — awaiting merge''. Missing: an explicit ''a drain is running (pid N); ⟳ scheduled: …, ▶ in-flight: …'' banner/markers in queue list + burndown plan. DATA SOURCE: the BUG-538 drain-lock (pid + claimed selector/set) gives ''what this drain plans to process'' (Scheduled); session leases give ''actively being worked'' (InProgress). So this composes with BUG-538 (lock = the claimed set) + the lease layer. Without it, the operator can''t tell from queue list/burndown plan that work is mid-flight — they look idle while a drain churns. trace:STORY-604 trace:relates:BUG-538'
  created_at: 2026-06-14T00:26:32.687557148Z
  modified_at: 2026-06-14T00:26:32.687557148Z
- id: 019ec3af-b01b-7a91-b7ad-73d239547bde
  author: joe
  content: 'OPERATOR ASK #3 (2026-06-13) — add an explicit ''aida burndown status'' subcommand. The operator has now hit the drain-observability gap from THREE angles, all the same missing surface: (1) live progress, (2) in-flight/scheduled marking in queue list/plan, (3) ''is a drain even running? I can''t tell.'' Today the only signals are ''pgrep -af aida-burndown'' + ''aida session leases'' — clunky + non-obvious. ''aida burndown status'' should answer in one command: is a drain running (pid, started_at, selector — from BUG-538''s drain-lock), what specs are in-flight/leased (from session leases), what''s shipped this run + what''s left, and a pointer to the live log (STORY-604 stream-tee). This is the read-side companion to ''burndown run'' and the natural home for the whole observability story. Bumping demand signal: 3 separate operator asks → high priority. trace:STORY-604 trace:relates:BUG-538'
  created_at: 2026-06-14T01:12:11.547960754Z
  modified_at: 2026-06-14T01:12:11.547960754Z
