  content: 'Concrete finding (2026-06-13): during a live ''aida burndown run'' (PID confirmed running), there was NO log file under .aida/ to tail and NO incremental output — because the headless ''claude -p'' is launched WITHOUT streaming flags, so it buffers silently until completion. Two-part implementation path: (a) launch the drain''s ''claude -p'' with ''--output-format stream-json --verbose'' (or equivalent) AND tee to a discoverable path like .aida/burndown/<drain-id>.log; (b) ''aida burndown status''/''watch'' tails that + renders plan position/phase. Until then the operator has no signal at all — not even a log. The in-flight marking (facet b) is the substrate complement: stamp blessed specs as ''claimed by drain <id>'' so list/show/queue reflect it even without reading the log.'
