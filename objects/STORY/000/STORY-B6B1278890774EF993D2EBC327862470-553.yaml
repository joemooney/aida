  content: 'Round 2 finding 4 clarification: Slice 1''s .codegraph symlink is path routing only. Non-contained lanes receive read-write access to the primary index under the host filesystem permissions, including possible SQLite WAL/SHM writes; it does not satisfy AC2''s read-only guarantee. Slice 2 must cover containment read-only admission and assess read-only routing for non-contained seats (or file that explicitly as follow-up), plus AC5 live lane-call evidence. No launch/spawn.rs or launch/profile.rs changes are made in this round.'
