  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3662):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 0e7667371077
    Recorded: 2026-11-08T08:45:19.806268741+00:00
    Findings:
    1. MAJOR (process, fifth occurrence; host/advisor action): the PR body at 0e7667371077 is still only the 'Published from seat' boilerplate. Apply AC1-AC5 status against origin/main, state explicitly that this is a Refs slice, and name who completes AC2/AC5. The draft text exists in spec comment 34.
    2. MAJOR (AC1/AC3, unchanged): nothing delivers the proxy client to lanes. AGENTS.md:477 and aida-core/templates/dispatch/code-navigation.md:1 tell lanes to run bare 'codegraph callers', while scripts/codegraph/README.md:69-72 says upstream stays on PATH and the wrapper must be selected explicitly; upstream fails in a native seat ('unable to open database file', README:5-7). After full deployment a lane following its prompt still fails. Fix: put the fixed absolute host client command in the template master and sync (never derive it from the seat .codegraph), or provide a host-resolved PATH entry; or defer explicitly in the PR body.
    3. MAJOR (AC2/AC5, needs advisor decision): the 2026-11-08 ruling asked for a COMPLETING slice in which a contained Codex seat gets a correct non-empty 'codegraph callers' result with read-only grant evidence. This PR is Refs-only; README:73-75 says the AIDA-contained posture is unsupported (no mount for client, descriptor or socket) and no live seat output exists. Advisor must either accept this as a Refs slice with AC2/AC5 deferred to a named follow-up, or require contained admission and live evidence here. Spec comment 34 also says the punt remains a publication veto until advisor triage, yet this head was published; that needs resolving.
    4. MAJOR (AC4, new in this round): aida-cli-lib/src/codegraph.rs:249-262 scan() emits client-routing whenever lane-proxy.json exists and PATH codegraph is not byte-identical to the bundled wrapper. README:69-72 requires upstream to remain on PATH and the wrapper to be selected explicitly, so after the documented deployment 'aida doctor check codegraph' reports client-routing on the host and in every seat, permanently, and its action ('select it on PATH') contradicts the README. Reconcile: skip the check on the primary/host (or where the host-owned client is the selected route), and align the action text with the deployment contract; add a test for the documented deployment state. The existing test proxy_client_identity_refuses_upstream_and_nonregular_files covers only is_bundled_proxy.
    5. MINOR (reliability): scripts/codegraph/codegraph:292-298 joins workers without a bound during shutdown; a worker can hold up to lock wait 15s + refresh 15s + upstream 15s, exceeding TimeoutStopSec=20 (README:58). systemd then SIGKILLs, the socket is left behind, and serve:270 bind fails EADDRINUSE on every Restart=on-failure until an operator removes it (README:92-93), silently taking lane queries down. Same after any SIGKILL/OOM. Fix: on bind conflict, attempt a connect and unlink only on ECONNREFUSED, and/or bound shutdown joins below TimeoutStopSec.
    6. MINOR (correctness): scripts/codegraph/codegraph:140-144 runs previous.cleanup() inside the try whose except BaseException calls generation.cleanup(). If removing the old generation raises OSError after self.snapshot/self.stamp were advanced, the newly published snapshot is deleted while still referenced; refresh then returns early because the stamp matches, so every query fails until restart. Move previous.cleanup() outside the try or make it best-effort.
    7. MINOR (test evidence): tests/test_codegraph_proxy.py:301-308 is the only test against real CodeGraph 1.6.0 and skips when codegraph is absent, which is true in CI and was true in the implementer seat (spec comment 'Python proxy suite executed 12 tests: 11 passed, 1 skipped'). No recorded run exercises the snapshot path against the real upstream. The host must run it and paste the output with the AC5 evidence.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
