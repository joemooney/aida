    REVIEW FINDINGS TO ADDRESS (PR #3607):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 02d9c1304b46
    Recorded: 2026-11-07T20:18:44.288842658+00:00
    Findings:
    1. BLOCKING (containment): aida-core/src/git_ops.rs:1119-1129 ensure_aida_runtime_excluded now takes <clone>/.git/info/exclude for any seat clone and passes it to update_exclude_entries (git_ops.rs:1218). That function reads with read_atomic, which follows symlinks, then create_dir_all(parent) and write_atomic (temp file + rename in the parent). The contained seat can write its own clone's .git (seat_clone_detect.rs:288-292), and has_real_git_dir only checks that .git itself is a real dir. This code runs host-side: link_worktree_runtime_state, called from session_start.rs:3156 on clone re-entry and from the session_end/leases restore paths. The seat can also trigger it by creating a .codegraph symlink itself (worktree_gc.rs:1128). Scenario 1 (read leak): the seat sets .git/info/exclude -> ~/.ssh/id_ed25519 (or any host-readable file). On the next host re-entry, read_atomic reads the target, appends '.codegraph', and write_atomic renames a regular file holding that content over the symlink in the clone, where the seat can read it. Scenario 2 (host write): the seat sets .git/info -> some host directory. The host then creates exclude.tmp.* and an 'exclude' file in that directory. The commit's own comment says host Git is refused there because seat-writable state must not be trusted, yet the replacement trusts seat-writable symlinks. Fix: for the clone branch, refuse unless .git/info is a real directory (symlink_metadata) and the existing exclude is absent or a regular file. Read it with seat_clone_detect::read_regular_file (O_NOFOLLOW, size-capped) and write through an O_NOFOLLOW/O_EXCL temp file in the verified directory. Otherwise warn and skip (the navigation closure already turns this into a skip). Add refusal-path tests: exclude symlinked to an outside file (outside content not copied in, outside file unchanged), and info/ symlinked to an outside directory (nothing created there).
    2. minor: docs/internal/testing/story-2630-read-only-client-blocker.md:122-126 is stale again, the same class as round-3 finding 2. It says the native seat 'left all three changed files uncommitted', but 02d9c13 commits and pushes them. It also says 'No Rust test pass is claimed for this round' and that check-templates/check-ci-fast still need host reruns, without recording whether they ran. Reword the round-4 paragraph to match what was published, and cite the CI run at the head instead of lane job ids. Better still, keep per-round handoff state out of the tracked note and put it in spec comments, so each round stops invalidating it.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
