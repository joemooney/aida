title: 'Multi-session scheduling: resource caps, priority ordering, idle-detection'
description: |
  Once auto-spawn (STORY-23-1) lands, runaway concurrency becomes possible — N batches and N reviewers and N watchers, all chewing CPU.

  ## Scope

  - **Resource caps**: AIDA_MAX_CONCURRENT_SESSIONS (default 3). aida session start refuses past the cap unless --force.
  - **Priority ordering**: when auto-spawn is considering "next batch," prefer the highest-priority queue cluster. Composes with TASK-44 (auto-derived parent-EPIC chip) — group queue items by parent EPIC, score by item count + age.
  - **Idle-detection**: sessions whose claude has had no activity for >N minutes are candidates for cleanup or pause (composes with STORY-69 sysinfo liveness).

  ## Acceptance

  - [ ] Hard cap on concurrent leases via env var
  - [ ] aida session leases shows priority ordering
  - [ ] aida session prune --idle suggests cleanup candidates
