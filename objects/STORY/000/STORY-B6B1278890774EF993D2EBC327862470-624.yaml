title: 'aida init for GitLab: detect disabled CI/CD, offer to enable it with consent, scaffold a project pipeline, verify a runner'
description: 'Reported from operator''s work machine (Codex, GitLab project hello-work-0x), 2026-11-09. ''aida init --gitlab'' creates the project but CI/CD stays disabled and no pipeline exists. The operator had to run glab api projects/N --method PUT --field builds_access_level=enabled and start a pipeline by hand. Improve init to: detect builds_access_level; offer to enable it with explicit consent; scaffold a minimal pipeline appropriate to the detected language (for example Python: install, test) with configurable runner tags; verify a runner is available; and report organizational restrictions plainly instead of overriding them.'
