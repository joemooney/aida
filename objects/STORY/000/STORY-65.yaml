- id: 019e1094-eb67-7453-a148-577da76de139
  author: joe
  content: |-
    Add explicit `--role <name>` flag to `aida session start`. Current STORY-65 only covers inheritance from `$AIDA_SESSION_ROLE`. With explicit flag:

      aida session start --owns EPIC-20 --branch epic-20-batch4 --role implementer
      aida session start --owns PR-3 --role reviewer    # for PR review sessions

    Resolution order in start handler:
      1. --role <name> if passed (highest priority)
      2. inherit from $AIDA_SESSION_ROLE if set
      3. derive from scope: PR-N/MR-N → reviewer; else → implementer (with `--role-derive=off` to skip the heuristic)
      4. unset (current behavior)

    User asked 2026-05-10 — this is the natural shape after running session start a few times and finding "set role first, then start, then enter worktree, then re-enter role" tedious. trace:STORY-65 | ai:claude
