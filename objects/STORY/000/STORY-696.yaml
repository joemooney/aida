title: 'aida ps: global running-work table — every active session/agent with spec, role, pid, started, elapsed, live-vs-STALE (companion to aida status <spec>)'
description: "Companion to STORY-694 (aida status <spec> = per-spec). aida ps is the GLOBAL ps/docker-ps-style view: one row per active session/agent across the project. Columns: session-id, spec (scope), role, worktree, pid, started, ELAPSED, liveness (● live / ⚠ STALE). \n\nToday the closest is aida session leases, but it shows generic harness-worktree scope (no spec link), no pid/elapsed/liveness. aida ps should: (1) list every live session lease with the STORY-694 liveness machinery (pid_is_alive, elapsed from started); (2) ALSO surface ORPHANED In-Progress specs — specs at status In-Progress with NO live session backing them (the flag-only case) — so the operator sees both \"what is genuinely running\" and \"what claims to be running but is not\"; (3) --json. \n\nReuse STORY-694s helpers (lease read, pid liveness, elapsed, STALE verdict) — build this AFTER STORY-694 lands so it shares one implementation. This + aida status <spec> together close the \"how do I know what is actively working on my machine\" legibility gap the operator has raised repeatedly. trace candidate."
