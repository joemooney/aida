title: 'Seat policy: make the operator/advisor worklist partition configurable via [seats] in config.toml'
description: 'STORY-618 hardcoded the operator/advisor seat split in OpenBucket::operator_seat/advisor_seat. Make it a resolved policy with built-in defaults, overridable per-project in .aida/config.toml [seats] and per-user in ~/.aida/config.toml [seats] (resolution: project > user-global > built-in default). Scope: the four SHARED buckets that BOTH worklists can render are configurable (no rendering holes) — to-groom, decompose, ready-to-close, triage — each defaulting to advisor, settable to operator. The intrinsically seat-bound buckets stay fixed: reviews-awaiting / decisions-awaiting / awaiting-merge / held-for-review / build-supervised are operator (a human reviews/decides/merges/keystone-builds); distill / bless are advisor (authoring questions / queue sign-off). aida config show surfaces the effective [seats] block (value + whether overridden). Acceptance: a project setting [seats] triage = operator makes findings-triage appear on aida human and drop from aida advisor; an unset key uses the default; aida config show prints the resolved seats; both worklists consult the policy.'
