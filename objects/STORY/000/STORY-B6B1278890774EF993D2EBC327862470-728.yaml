title: 'STORY-2772 slice 2: train member gate runs integration promotion-check for promote/integration-* heads'
description: 'Child of STORY-2772 (advisor signoff 2026-11-14 03:27, split (a)). The train member gate runs the same constituent check as ''aida integration promotion-check'' for any member whose head branch is promote/integration-*, so a promotion cannot ship with a constituent unapproved at its merged head even if nobody ran the command at cut time. Main track, train gate code (gate/ protected path): review before merge. Blocked by STORY-2772 slice 1.'
