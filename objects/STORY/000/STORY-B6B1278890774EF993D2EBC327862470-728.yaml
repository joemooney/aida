title: 'STORY-2772 slice 2: train member gate runs integration promotion-check for promote/integration-* heads'
description: |
  Child of STORY-2772 (advisor signoff 2026-11-14 03:27, split (a)). The train member gate runs the same constituent check as 'aida integration promotion-check' for any member whose head branch is promote/integration-*, so a promotion cannot ship with a constituent unapproved at its merged head even if nobody ran the command at cut time. Main track, train gate code (gate/ protected path): review before merge. Blocked by STORY-2772 slice 1.

  Acceptance (advisor 13:58; folds the 07:38 PR-4022 review scope (a)+(b); (c) is split out): 1. The train member gate runs the 'aida integration promotion-check' constituent check for every member whose head branch is promote/integration-*, and refuses the member when a constituent is not approved at its merged head. 2. Merged-before-review changes lead to their review, and promotion-check runs at cut and at ship (scope a). 3. A main-sync merge whose tree differs from a clean merge-tree of its parents is refused, so edits inside a sync merge are not promoted unreviewed (scope b). 4. Tests for each of 1-3. Out of scope, filed separately: reading eligibility spec facts (tags, effort) as of the default branch (scope c). Main track, gate/ protected path: STRICT review.
