title: 'EPIC-52 Slice 1: self-sufficient aida tui launch — in-process dispatch replaces the fd-3/bash-wrapper'
description: 'Foundational slice + fixes the standalone-launch bug. Move the launcher Intent dispatch in-process: selecting a command executes it directly (subprocess for CLI/read, direct call for sub-TUIs, spawn/exec for sessions) then loops back, so aida tui runs from any shell with no fd-3 pipe / no aida-tui wrapper / no shell-init prerequisite. The Intent/fd-3 path may remain an optional power-user hook. Code: aida-tui/src/{intent.rs,launcher.rs,app.rs}. SUPERVISED — keyboard-verify aida tui launches + renders + dispatches cleanly. Slices 2-5 (fuzzy line, dispatch-by-kind, spec-id search, polish) follow per the design doc.'
