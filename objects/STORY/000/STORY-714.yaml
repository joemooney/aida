title: 'Worktree warm-pool: return-to-pool reset instead of destroy-and-recreate'
description: treehouse reuses a pool of worktrees per repo (acquire/work/RETURN reset-not-delete) so build cache stays warm. DISSOLVES TASK-0396 (cargo-cache poison) + BUG-553 (branch-stacking), kills the cold-build tax per fan-out. aida session end --return; aida queue work prefers idle pooled; detached-HEAD reset to furthest-ahead default on acquire; carries post_create/pre_destroy hooks + tiered dry-run destroy + reservation-vs-liveness leases. STRATEGIC cluster.
