  content: 'ADVISOR BRIEF (2026-11-10 03:58 UTC): SKETCH ONLY. Deliver docs/plans/2026-11-10-story-2704-porcelain-crate.md as a docs-only PR with (Refs STORY-2704). Ground it in aida-cli-lib/src/external_cmd.rs and aida-cli/tests/story_1641_external_subcommands.rs, ADR-71, the crate-split plan (docs/plans/2026-11-07-aida-cli-lib-crate-split-deep-dive.md) and aida dev build''s install and promote path. Answer: crate placement and dependency direction (porcelain depends on aida-core public APIs, never on aida-cli-lib internals); multi-call install names and how dev build and release install them; nested built-in-parent resolution precedence and help listing; how a porcelain command is kept read-only; and the migration of STORY-2699''s flow report. Under about 200 lines.'
