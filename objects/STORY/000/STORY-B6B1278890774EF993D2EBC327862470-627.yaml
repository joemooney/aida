title: 'Porcelain crate: area-grouped Rust convenience commands as one multi-call aida-porcelain extension, plus nested aida-<builtin>-<name> resolution'
description: 'Operator direction 2026-11-09, under ADR-71 (core admits substrate capabilities; convenience ships as external aida-<name>, delivered by STORY-1641). ## Sketch (needs sketch signoff) 1. New workspace crate aida-porcelain producing one multi-call binary; installed (by aida dev build and release) under several aida-<name> names it dispatches on by argv[0]. Commands grouped by area modules (flow/metrics, review, queue, ...). Commands read state only through aida-core public APIs and documented --format json surfaces, never raw internal files. 2. Nested externals for BUILT-IN parents: when aida <builtin> <unknown> fails to match, resolve aida-<builtin>-<unknown> on PATH; built-in children always win; help for the parent lists them. External parents dispatch their own children. 3. Review: porcelain commands are read-only unless separately approved, which places them in the LOW tier of STORY-2698. 4. First tenant: move STORY-2699''s flow report here once the crate exists. ## Acceptance - Multi-call dispatch, install names and help listing tested. - Nested resolution: precedence, unknown-name error unchanged, help listing; regression tests beside aida-cli/tests/story_1641_external_subcommands.rs. - A porcelain command cannot mutate the store (test). - Docs in docs/cli.'
status: InProgress
priority: Medium
