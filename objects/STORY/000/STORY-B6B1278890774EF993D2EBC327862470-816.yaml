title: Reviewer-lease auto-release with generation revalidation under the lease writer lock (split from BUG-2684)
description: |
  Split out of BUG-2684 (#4364) by advisor scope-cut ruling, 2026-11-22 11:21 MST (claude-advisor-122). Round 7 of #4364 removed the reviewer-lease auto-release path because its verdict at 1e8528ae found two P1 authority defects in it: releasing a "dead" reviewer's lease without prompting can delete a live creator's lease (P1-1), or a re-stamped same-ID lease generation (P1-3).

  Goal: auto-release a reviewer lease whose holder is provably dead, without prompting, and never touch a live or re-stamped generation.

  NEEDS A SKETCH on this spec and advisor signoff before implementation (authority code).

  ## Acceptance
  - AC1: Auto-release takes the lease writer lock, re-reads the lease, and releases only if the generation (lease id + stamp) still equals the one judged dead. A mismatch leaves the lease alone and reports why.
  - AC2: Death evidence is positive for the exact holder (PID start identity and host), not "creator PID absent". Unknown evidence keeps the lease.
  - AC3: A regression test races a re-stamp of the same lease id between judgment and release, and the new generation survives.
  - AC4: A regression test covers a live creator whose reviewer child exited, and the creator's lease survives.
