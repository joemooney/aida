  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2662):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 73fa030569fb
    Recorded: 2026-11-08T07:30:25.809077180+00:00
    Findings:
    1. [major] Open findings are always unknown on the real store. aida-precompact-handoff.sh run() caps every command at min(2s, remaining), but 'aida findings list --json' measured 4873-4912ms over 3 runs (load 1.6-2.4), so the hook kills it and the packet always says 'findings unavailable'. The fixture's fake aida returns instantly. Give this probe a budget that fits (the 12s hook budget allows it) or use a cheaper filtered read, and add a test for a slow findings probe.
    2. [major] The origin filter drops the lane's review findings and reports them as none. Review findings have origin PR-N (findings.rs finding_origin; live origins are PR-3655 x6, PR-3656 x4, TASK-3368 x1), but the hook keeps only origin == spec, so a rework lane scoped to STORY-X gets '[]', which reads as no open findings rather than unknown. The fixture hides this with origin STORY-2662. Round-1 finding 6 asked for the lane's PR/spec: match the lane's PR as well as its spec, and use the real row shape in the fixture.
    3. [minor] AC2: the packet is not reachable with plain 'aida session handoff --show', and a relaunch cannot find it. The seat is compact-<sha256(cwd,session_id)>, the hook discards the writer's 'Next session' line, and nothing advertises the seat; bare --show reads the role seat. A relaunch has a new session_id, so the spec goal 'or a relaunch' is unmet. Publish the snapshot seat through an AIDA-owned pointer, or narrow the goal on the spec with a ruling.
    4. [minor] AC2 test gap: no test exercises the real CLI path. test_precompact_handoff_hook.py uses a fake aida, and the Rust test calls write_handoff_kind directly, so 'session handoff --snapshot --write -' then '--seat compact-<hash> --show --body-only' (session_misc.rs body_only branch, clap requires/conflicts) is unproven. Add a CLI round-trip test asserting the log event is compact-snapshot and body-only output excludes standing orders.
    5. [minor] A failed PreCompact write injects the previous compaction's packet as current. SessionStart source=compact reads the seat's latest with no check that it belongs to this compaction, and the packet has no timestamp. After a refused or timed-out write, the older spec/verdict state is injected unmarked. Stamp the packet and refuse or label a stale one.
    6. [minor] Repeated compaction pushes out the rotation next-action. Once a snapshot exists, prior is the first 2048 bytes of that packet, which leads with header, verdict and up to 2048 bytes of findings, and the matched rotation handoff is only read on the first snapshot. Nested prior context shrinks each round. Extract and carry only the prior next-action section, or re-read the matched rotation handoff each time.
    7. [minor] compact-<hash> seat directories have no retention. Each session that compacts adds .aida/handoff/compact-<40hex>/ with its snapshots, log.jsonl and latest.md, and nothing in seat_rotation.rs prunes them. Add pruning or reuse a bounded location.
    8. [minor] With include_role_context_hook=false, settings.rs still registers PreCompact unconditionally while the paired SessionStart handler sits inside the role-context branch, so packets are written and never injected. Wire the two together or register SessionStart independently.
    9. [cosmetic] The branch fallback regex has no word boundary and uses re.I, so a branch like debug-parser yields spec pointer BUG-PARSER. Anchor it with a boundary.
    10. [cosmetic] ci.yml: the new step was inserted between the 'Tool-only expiry notices ... trace:BUG-2014' comment and the Grant expiry step it describes. Move the new step above that comment.
