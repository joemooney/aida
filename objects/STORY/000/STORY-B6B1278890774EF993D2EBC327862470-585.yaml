- id: 01a1b9f6-b28e-7a11-b770-acd46622ed07
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2662):
    Verdict: CHANGES REQUESTED
    Reviewed commit: d16355efe7c2
    Recorded: 2026-11-08T06:57:25.461233661+00:00
    Findings:
    1. [blocker] CI (rest) red, caused by this PR: scaffolding::codex_hooks::tests::codex_hooks_match_settings (codex_hooks.rs:613). CODEX_EVENTS at codex_hooks.rs:601 still lists PreCompact, and templates/settings.json now wires it while codex-hooks.json must not (AC3 and the advisor ruling). Fixing that alone exposes the next assert at codex_hooks.rs:~620: SessionStart now has 2 Claude entries vs 1 Codex entry. Add an explicit Claude-only exemption covering both, or attach the SessionStart handling so entry counts stay equal, without weakening parity for other events.
    2. [major] PreCompact snapshots are indistinguishable from a deliberate rotation handoff. The hook writes via session handoff with the seat's handle and CLAUDE_CODE_SESSION_ID in env, so agent_rotation::fresh_handoff (agent_rotation.rs:147) matches it. rotation_decision (:186) then returns Relaunch when a rotated seat that merely compacted later exits normally (should be Exit), and the turn-boundary path (:559) can SIGTERM a past-ceiling seat on the snapshot before it writes a real handoff. Needs a distinct log event/marker excluded from fresh_handoff, plus a test.
    3. [major] SessionStart handler injects shared latest.md on every source and bypasses rotation matching. The hook checks only the event, not source == compact, and calls --show without --rotated. seat dir is shared across worktrees, so a new implementer lane gets another lane's packet (for example a different spec and branch), and a rotated generation gets latest.md, which session_misc.rs:1019 says must never be loaded because a sibling may have overwritten it. aida-role-context.sh:94 already loads the matched handoff. Limit injection to source == compact and bind it to this session's own packet; add fixtures for startup/resume and a sibling-written latest.md.
    4. [major] Packet is lost behind standing orders (AC2). --show prints mandate and standing orders first. Measured: aida session handoff --seat advisor --show is 16810 bytes with the handoff starting at byte 13736, so the 8192-byte SessionStart cap injects no handoff, and the 2048-byte prior-context cap keeps only standing orders, so a snapshot replaces latest.md without the real next-action text. Read the handoff body alone (a flag or separate read path); the fixture's short fake --show hides this.
    5. [minor] AC1 fixture never runs in CI: tests/test_precompact_handoff_hook.py is not referenced by .github/workflows/ci.yml or the Makefile (other tests/test_*.py are invoked by name; no discovery covers tests/). Add a CI step.
    6. [minor] Open findings are project-wide: aida findings list is unfiltered and capped at 2048 bytes, so the lane's own findings can be cut off in favour of unrelated ones. Spec goal is the lane's open findings; filter by the lane's PR/spec or filter locally by spec.
    7. [cosmetic] AGENTS.md prepends a per-change paragraph; repo CLAUDE.md says per-change notes go in the PR body and spec comment and that prepended paragraphs conflict with every open PR. Keep the OVERVIEW.md section only if treated as architecture; drop the AGENTS.md paragraph.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
