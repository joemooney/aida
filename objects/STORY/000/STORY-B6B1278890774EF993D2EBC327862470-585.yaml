title: 'Pre-compaction handoff: a PreCompact hook writes a bounded AIDA handoff packet before a lane''s context compacts (Claude first; Codex after its trusted-hook test)'
description: |
  From SPIKE-711 (PR-3638 host rerun, 2026-11-07): a Claude Code PreCompact command hook fired live when `claude -p --resume <sid> "/compact"` ran headless, and the session still answered from prior context after compaction. Codex 0.166 also has a PreCompact hook event and compaction can be forced (`-c model_auto_compact_token_limit=2000` printed "context compacted"), but Codex runs only trusted hooks, so the live hook-fire test is still pending (see the SPIKE-711 doc). AGY 1.5.3 shows no compaction hook event.

  Goal: before a lane's context is compacted, AIDA writes a bounded handoff packet (spec, branch, last verdict, open findings, next step) into the substrate so post-compaction work, or a relaunch, starts from AIDA state instead of a lossy summary. Claude first, through PreCompact; Codex once its trusted-hook test passes; other vendors keep AIDA-side handoffs at turn boundaries.

  Acceptance (draft):
  1. The Claude seat template registers a PreCompact hook that runs an AIDA command writing the handoff packet; a fixture test covers the hook payload.
  2. The packet is size-bounded and readable by the next turn and by `aida session handoff --show`.
  3. Codex uses the same command once the trusted-hook rerun is a yes; until then a vendor descriptor says the capability is absent.
  4. No vendor depends on this for correctness: a lane without the hook still completes.
