  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2662):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 410b560d5a92
    Recorded: 2026-11-08T08:07:02.311166099+00:00
    Findings:
    1. [major] PR-keyed review findings never reach the packet on the real store. aida-precompact-handoff.sh:101 caps 'aida pr list --json' at 1.5s; the command took 1.57-1.97s unwrapped, and calling the hook's own run() with those arguments returned 'unknown (command timed out)' 6 of 6 times (load about 1.6). The packet always says 'Review findings unknown' and origins never gains PR-N, so round-2 finding 2 is still unmet in practice. The fixture's fake aida answers instantly. Use a cheaper branch-scoped lookup (for example gh pr list --head <branch> through the existing adapter) or a budget that fits, and add a slow-PR-probe fixture at realistic latency. Also re-check the margins: findings took 5.20-5.40s against its 6s cap and the verdict probe 1.55-1.66s against 2s, and the 12s total leaves little room if the PR probe grows.
    2. [minor] A truncated PR list is reported as complete. pr_list.rs:163 runs gh pr list with no --limit, so gh's default of 30 rows applies, and the fleet has exactly 30 open PRs now. Once a lane's PR falls outside the newest 30, hook:109-111 finds no match but still sets pr_known=True, so its review findings read as none instead of unknown. A branch-scoped lookup also fixes this.
    3. [minor] Branch-fallback spec IDs never match spec-keyed findings. Hook:95-96 upper-cases the branch's canonical ID (real lane branch: story-b6b1278890774ef993d2ebc327862470-585), but findings origins are display IDs (live: PR-3656, TASK-3368). When AIDA_SESSION_SCOPE is unset (it is unset in this reviewer seat) origin matching at hook:118 misses and the list reads as empty with no unknown label. Resolve the ID to its display form, or label spec findings unknown for the canonical fallback.
    4. [minor] Round-2 finding 7 is only partly addressed. Each slot is now bounded, but one compact-<hash> directory per worktree/role stays in the primary .aida/handoff/ after its worktree is removed, and seat_rotation.rs still has no pruning. Worktrees are per-PR, so these orphans grow without limit. Prune slots whose worktree is gone, or record a ruling that this is acceptable.
    5. [minor] The snapshot slot is keyed by raw cwd, not worktree root. compact_snapshot_seat receives current_dir at session_misc.rs:990 and the hook chdirs to payload cwd, while OVERVIEW.md calls it a worktree/role slot. A session whose cwd is a subdirectory at compaction writes a slot that a relaunch from the worktree root cannot find. story_2662_precompact_handoff.rs asserts a subdirectory gets nothing, so that test locks the mismatch in. Key on the git worktree root and change the test to use a real sibling worktree.
    6. [cosmetic] scripts/ci-gate-tiers.toml:63 inserts the new gate between the '# trace:BUG-2014' comment and the 'Grant expiry hook protocol' entry it describes, the same misplacement round-2 finding 10 fixed in ci.yml. Move it above the comment.
