  content: '[advisor a22 07:22] RULING on PR-4027 CR at 3840719. BLOCKING: (1) The approval-time relabel cancels CI in flight. Don''t remove and re-add ci:full: add it only when absent, and don''t relabel while a run on that head is in progress. Also make judge_commit_checks (forge_commit_ci.rs) take the LATEST run per check name, so a cancelled earlier run never reads as red. (2) Untiered fails open: decide tieredness from the repository (ci.yml defines the tier job), not from one commit''s checks; a tiered repo with no ci-tier check on the head is REFUSED. Add a test for it. (3) AC1 wiring untested: add the request_full_ci_after_approval tests the reviewer lists (approve with --pr requests; all-deferred approve requests; request-changes, rejected, waiting or no --pr request nothing), with the runner injected. BUNDLE, cheap: (4b) make the --skip-full-check activity-log write an error, not swallowed (the criterion says logged); (5) move the trace to mod full_tier and add the criterion ids to tests. ACCEPTED, no change: (4a) the override not admitting during a forge outage is fail-closed, which is fine. Rework on a dell1 Fable lane; LIGHT gate (one targeted cargo test run for full_tier and pr_train, plus make check-ci-fast).'
