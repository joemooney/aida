title: Full CI on approved PR heads before train admission, so trains stop finding full-suite failures
description: |
  Problem: PR CI runs only the FAST tier, so the full suite first runs inside a train. In the 30h to 2026-11-14 12:00Z, 16 trains failed or ejected against 24 that merged. #3924 was ejected 4 times, and #3987 failed bug2406 tests in train 17. Each red train costs a bisect (3 serial CI runs), and trains are serial at 25-40 min each, which caps landing at about 2 PRs/hour.

  Operator ruling 2026-11-14 05:40 MST ("agreed"): run the full suite on an approved PR head, in parallel across PRs, and admit to a train only PRs whose exact head is green on full CI.

  Acceptance criteria:
  1. When a PR against main records an APPROVED verdict at head H (or carries a label such as ci:full that the advisor or autoland applies), a full-tier CI run (the same shards a train runs) starts on H. A new push re-runs FAST only, until it is approved again.
  2. `aida pr train` (and autoland or land run eligibility) refuses or defers a member with no green full-tier run at its exact head, naming the missing run. --skip-full-check overrides and is logged.
  3. Full runs for different PRs run concurrently, within the Actions concurrency limits; a train still runs its merge-result CI.
  4. Docs: docs/advanced (landing) states the new gate; make check-ci-list shows the tier.
  Track: main (CI workflow + train eligibility). Ship via train.
