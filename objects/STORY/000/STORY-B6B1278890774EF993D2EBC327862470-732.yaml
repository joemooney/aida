  content: |-
    ## Implementer handoff (committed locally, not published)

    Commit 618859a229 on branch story-b6b1278890774ef993d2ebc327862470-732, rebased on origin/main 2682c4c4fe. The seat has no valid GitHub credential (gh returns HTTP 401), so the push and the PR were not possible from here.

    ### What the commit does
    - ci.yml: `ci:full` selects FULL except on `synchronize`, so a push is FAST again until the new head is approved.
    - `aida review record` with an approving verdict and `--pr` re-applies `ci:full` (remove, then add), which starts FULL on the approved head.
    - `aida pr train` (named, `--all-ready`, advisor loop): after the approval-pin check it reads the head's checks by commit and admits the member only when the run reporting `ci-tier: full` has a green `Build (ubuntu-latest)`. Refusals name the missing, running or red run. A head with no run gets one requested (not in `--dry-run`). `--skip-full-check` admits anyway and appends `train-admit-skip-full-check` to `.aida/advisor-activity.jsonl`.
    - Docs: `docs/advanced/landing.md` (new), cross-links in `docs/cli/04-git-lifecycle.md` and `docs/internal/testing/ci-test-shards.md`; `make check-ci-list` prints the approved-head tier line.

    ### Validation
    - `cargo test --profile agent -p aida-cli-lib --lib -- train story_2809 full_tier live_gate skip_full_check story_2492 story_1917 commit_ci review_record help_surface`: 372 passed, 3 failed. The 3 failures: one needs a `debug/aida` binary the lane did not build; two (`story_1917_dispatch_exec_tests` reviewer-worktree cleanup) fail on a mail-retention writer scan. I did not confirm those two fail on main without this change.
    - Fast gates were run one at a time (the 60s tool cap rules out `make check-ci-fast`): 44 of 48 passed. The 4 that did not (containment conformance, store mutation channel, self-hosted routing fixtures) fail on socket creation denied by the seat sandbox; formatting and the store-writer inventory failed first and pass after `cargo fmt` and the inventory regeneration.
    - Help golden regenerated and committed.

    ### Choices worth a look
    1. `--skip-full-check` travels in a thread-local guard around the train handler (the ADVISOR_LOOP pattern), not a `TrainOptions` field. A journal resumed later without the flag refuses a skip-admitted member.
    2. A repository with checks but no `ci-tier:` marker is admitted as untiered; a head with no checks at all is refused.
    3. The label stays on the PR after a push; a later non-push label event on that unapproved head runs FULL. Wasteful, not unsafe.
    4. Contained reviewers may be unable to edit labels; the train's own request covers that, at the cost of starting the run later. Applying the label from the launcher's verdict-collection path would close the gap.

    Draft-task filing for these was refused: the ID dispenser file `.git/aida-work-dispenser.toml` in the primary checkout is mode 0664.
