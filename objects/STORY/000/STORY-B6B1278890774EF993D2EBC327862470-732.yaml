  content: |-
    ## Implementer handoff: rework for the PR-4027 review (committed locally, not pushed)

    Commit 19ed47f1cf on `story-b6b1278890774ef993d2ebc327862470-732`, on top of merge ec86fa7be7. `git push` fails in this seat (no GitHub credential: `could not read Username`; `gh` returns HTTP 401), so PR-4027 does not have it yet.

    ### Ruling items
    1. **Relabel cancels CI**: the request now runs `gh pr view --json labels,statusCheckRollup` first. Label absent: add. Label present and nothing running on the head: remove and add. Head already has a `ci-tier: full` check, or a labelled head has a check in flight: no edit. `judge_commit_checks` judges the latest run per check name.
    2. **Untiered fails open**: `repo_is_tiered` reads `.github/workflows/*.yml` for the `ci-tier:` job; a tiered repo refuses a head with checks but no tier check. Tests added.
    3. **AC1 wiring**: `request_full_ci_after_approval` takes the request as a parameter; tests cover approve with `--pr`, all-deferred approve, and request-changes / rejected / waiting / no `--pr`.
    4b. A `--skip-full-check` admission is refused when the activity-log entry cannot be written.
    5. Trace moved to `mod full_tier`; tests name their criterion.

    ### Validation
    - `cargo test --profile agent -p aida-cli-lib --lib -- pr_train story_1690 story_2809 full_tier commit_ci review_record --skip aida_sized_relay_native`: 273 passed, 0 failed. The skipped test needs a `debug/aida` binary this lane does not build.
    - Fast gates, run one at a time under the 60s cap: 44 of 48 passed. Not passing: store mutation channel, self-hosted routing fixtures (AF_UNIX socket denied by the seat sandbox); containment conformance (did not finish inside 55s); Rust structural ratchets (cargo-based, not run).
    - Store-writer inventory regenerated for the new `try_append_ship_activity_line`.

    ### Finding filed
    - TASK-73022632d35647cca3858b18ac0723e3-004: a cancelled full-tier run on the head is left alone and reads red until rerun by hand.
