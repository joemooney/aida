    ## Scope shrunk 2026-05-16 — single doc, no cadence machinery

    User pushed back on over-engineering. The original scope (multi-file folder structure with \`category-summaries/\`, \`signals-to-watch.md\`, \`positioning.md\`, dated-snapshot files, refresh cadence, etc.) is **infrastructure for the analysis, not the analysis itself**.

    **Revised scope**:

    - ONE file: \`docs/competitive-landscape.md\`
    - Content: the actual analysis (today's snapshot + AIDA's positioning)
    - Updated when material things change; no formal cadence
    - Replaces the multi-file structure

    Reject the original 5-file folder structure. The original \`docs/competitive-analysis/positioning.md\` content folds into a section of \`docs/competitive-landscape.md\`. Skip the \`signals-to-watch.md\` until we have specific signals worth tracking.

    Saves ~2 days of meta-work; keeps the analysis's value intact.
