  content: |-
    Naming refinement 2026-05-11 (per user clarification): the chip should read [scheduled:by-019e1300] instead of [planned:by-019e1300]. 'Scheduled' is the natural English term for 'committed to this session's cluster, waiting on currently-InProgress item.' Reserves 'planned' for the existing Planned status (which means roadmap-level, not session-cluster-level).

    Updated chip examples:
      BUG-73  ...  [Approved]  [for:implementer]  [@EPIC-20]
      TASK-67 ...  [Approved]  [for:implementer]  [@EPIC-20]  [scheduled:019e1300]
      TASK-68 ...  [Approved]  [for:implementer]  [@EPIC-20]  [scheduled:019e1300]

    aida session show <id> --plan still works the same; just rendered as 'Scheduled' in the status column for pending items:
      1  ✓ Done         BUG-73
      2  ◐ In progress  TASK-67
      3  ⏳ Scheduled    TASK-68
      4  ⏳ Scheduled    TASK-69
      ...

    This naming also signals to the user that 'Scheduled' is session-bound (ephemeral, owned by one session) vs 'Planned' which is roadmap-bound (durable, status field on the req).
