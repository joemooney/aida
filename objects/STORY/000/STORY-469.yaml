title: 'Agent invocation structural guards: spec-ID validation, mandatory substrate-sketch-before-implement, local-vs-substrate reality check'
description: "## Strategic context\n\nMulti-agent dispatch tonight surfaced 5+ recurrences of the agent-context-fragmentation class (see STORY-467 comments). Pattern signal is strong enough to warrant substrate-side structural guards (per feedback_substrate_as_bouncer_not_rules — when invariants must hold against confident LLMs, ship programmatic gates not rules).\n\n## Three composing guards proposed\n\n### Guard 1: Spec-ID validation at commit / PR time\n\nWhen 'aida pr ship' or 'aida queue done' is invoked, parse the commit message + branch name + lease scope for spec-ID trailers (e.g., '(TASK-542)'). For each parsed spec-ID, verify it RESOLVES in the substrate. If any trailer references a non-existent spec, REFUSE with:\n\n  Error: commit trailer references unknown spec STORY-487 — typo? hallucination? Check 'aida show STORY-487' and fix the trailer before retrying.\n\nCatches: spec-ID hallucinations BEFORE they pollute git history.\n\n### Guard 2: Mandatory substrate-resident sketch comment for architecture-class work\n\nWhen a session opens its first code-write (Edit/Write tool against tracked source files) AND the spec is tagged 'architecture' / 'cross-cutting' / 'sketch-first', AIDA checks for a substrate-resident sketch comment on the spec from the agent's identity. If absent, the tool-write phase is deferred / warned: \n\n  Warning: spec TASK-X requires sketch-first per its tag. No master-verdicted sketch comment found from agent-name. Post sketch with 'aida comment add TASK-X' and await verdict before coding.\n\nTag-driven; only fires on opt-in architecture-class specs. Doesn't add friction to mechanical work.\n\n### Guard 3: 'aida status' shows local-vs-substrate divergence\n\nAdd to STORY-385 / STORY-465's status surface (or as a dedicated category):\n\n  ─── Local-vs-substrate divergence ───\n    ⚠ TASK-542 worktree has 3 modified files (6h) — uncommitted. Spec claimed 'Done' but no commit/PR.\n\nThis catches: agent's verbal 'I shipped' claims that don't match substrate state. Operator sees the divergence at status time.\n\n## Acceptance\n\n- [ ] Guard 1: 'aida pr ship' + 'aida queue done' validate trailer spec-IDs against substrate; refuse on miss\n- [ ] Guard 2: opt-in 'sketch-first' tag triggers Edit/Write tool-call gate that warns/defers without substrate-resident sketch comment\n- [ ] Guard 3: 'aida status --cleanup' (or new 'Local divergence' category) flags 'modified worktree + lease + agent-claimed-complete' as drift\n- [ ] Tests: each guard fires on synthetic violation; no false positives on normal flow\n- [ ] Documentation: when each guard applies + how to bypass intentionally (--force flags)\n\n## Composes with\n\n- STORY-467 (advisor observation entry — this STORY is the structural-guards promotion)\n- BUG-376 / BUG-378 / TASK-548 / BUG-379 (ceiling-pattern quartet — sibling substrate-bouncers)\n- STORY-462 (doctor — catches local-vs-substrate divergence retrospectively; this STORY catches it at write-time)\n- TASK-556 (auto-inject first-message — would prevent some hallucinations by pre-loading correct spec ID)\n- feedback_substrate_as_bouncer_not_rules (principle this implements)\n\n## Origin\n\n2026-05-25 master observed agy1 claim implementation of STORY-487 (hallucinated; doesn't exist) for work briefed as TASK-542, without commit/push/PR, after skipping a master-directed sketch-verdict pause. Recurrence-5 of the agent-context-fragmentation class. Promoted from STORY-467 observation per the feedback_observation_finding_capture rule.\n\ntrace:STORY-X"
