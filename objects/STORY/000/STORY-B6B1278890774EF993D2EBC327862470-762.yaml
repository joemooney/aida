    ## Implementer self-review
    Reviewed HEAD: e22768ff97 (slice a, Refs STORY-2839: Markdown table renderer in docs/showcase/build.py + tests; ported from b5826a0f949, renderer only — no nav dropdowns, theme, pages or SVGs).

    Acceptance evidence (brief): [evidence: behavioral-test] tests/test_showcase_build.py — test_markdown_tables_render_headers_cells_and_links (thead/tbody, code + link cells, short rows padded, search text without pipes/separator), test_table_cells_are_html_escaped (`<b>` and `<script>` cells render as &lt;…&gt;), test_escaped_pipe_stays_inside_one_cell (`\|` in code span and prose), test_pipe_lines_without_a_separator_stay_paragraphs (no separator / width-mismatched separator ⇒ no table). All 20 tests in the file pass under python3 -m unittest (pytest is not installed on this host). python3 docs/showcase/build.py --check passes; no published source contains a table, so no generated page changed.

    Probes: (1) row/cell parsing shared by render and search_text (same is_table_row/parse_table_row). (2) GFM: separator must match the header cell count; `\|` is literal; extra cells are truncated, missing cells padded (GFM behaviour). (3) 0 body rows renders a header-only table; table at EOF closes. (4) Cells go through inline(), which html.escape()s first, so HTML stays inert. Departures from the reference: separator accepts 1+ dashes (GFM) instead of 3+, and search_text strips pipes only on table rows, not globally (prose like `a | b` keeps its search text).

    Residual risks: rows need leading and trailing pipes (pipe-less GFM rows aren't detected); a row ending in an escaped backslash followed by a pipe (`\\\\|`) is read as an escaped pipe, so it isn't treated as a row.
