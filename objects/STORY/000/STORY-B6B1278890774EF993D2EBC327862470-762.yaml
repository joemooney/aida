    (d) Multi-seat workflow: docs/product-workflow.md (+342), operator-setup.md (+24) and 8 SVGs (~1100 lines of assets). Too big for one PR. Split it:
        d1: product-workflow.md plus the swimlane, lanes-leases, merge-train and post-train-sync SVGs;
