title: Demystify AIDA delivery, train, authority, and lane terminology in docs/showcase with visual field guide and SVGs
description: |
  Update docs/showcase and the canonical product glossary to demystify 60+ operational, Git, train, authority, and lane concepts for both non-experts and operators. Add a 5-act visual field guide (with dual-theme light/dark SVGs), expand product-glossary.md, and refresh workflow/authority showcase guides for recent capabilities (merge train, riders, bisect, autoland/aida land, delta review, ci:full, ratchets, deputy shell, --include-gate-paths, post-train pull).

  Targets and done check (advisor 13:58, product seat batch): edit docs/showcase/glossary.html (the canonical product glossary), docs/showcase/authority.html and docs/showcase/autonomy.html (workflow/authority guides), and add a new docs/showcase/field-guide.html (the 5-act field guide) registered in docs/showcase/build.py's page list. New SVGs go under docs/showcase/assets/ named field-guide-act1.svg to field-guide-act5.svg, each with light and dark variants following the existing assets' convention. Done when: every term listed in the description has a glossary entry; the five SVGs render in both themes; make check-ci-fast (docs gates) passes.
