    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: Integrator role is sequenced behind BUG-444 (phase-1 NoPr race). Proceed?
      a) Block until BUG-444 ships (parallel merge contention is moot while single-loop detection is unreliable)
      b) Build now — it's the right single home for the PR-detection/merge logic anyway
      c) Reject — single sequential drain is adequate for a single-user alpha
      REC: b, but confirm BUG-444 status first (the integrator's merge phase inherits it if still open).
    Q2: New first-class 'integrator' role (taxonomy/scaffolding/routing/statusline) — approve the shape?
      a) Full first-class role
      b) A MODE of the orchestrator (--integrate loop) — less taxonomy surface
      c) Prototype the watch-loop as a script first; promote to a role only if proven
      REC: c — validate the load-bearing watch-loop cheaply before committing reversible-expensive role scaffolding.
