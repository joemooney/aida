title: 'Salvage a retained seat clone: relaunch the implementer inside it (commit staged merges first) instead of losing the work or salvaging by hand'
description: |
  Observed 2026-11-17/18 overnight. When a headless implementer lane exits with work only in its retained seat clone (a staged merge resolution, uncommitted edits), nothing in AIDA can continue from it:
  - `aida queue work SPEC --resume` resumes only the vendor CONVERSATION, not the retained seat clone or its working tree.
  - A fresh lane cannot check out the branch while the retained clone holds it.
  - No `salvage`/`adopt` verb exists.
  Cases tonight: BUG-2618 (#4137) seat …-382 holds the S1 publication-guard work with the main merge 485219c staged, so a hand salvage was needed (product asked the integration seat). The BUG-2679 empty-rework lanes (#4158, #4139, #4137) left resolved merges uncommitted on dell1, and the advisor's first instinct was a hand "salvage resume".

  ## Acceptance
  1. `aida queue work SPEC --salvage` (or `aida seat salvage SPEC`) finds the spec's retained seat clone on the local host or the named lane host. It reports its branch, head, staged and unstaged changes, and whether a merge is in progress.
  2. With confirmation (or --yes), resume in the retained seat clone on the owning host. If changes are still required, launch the selected vendor in that clone with a brief naming the retained state. A fully resolved, host-managed repair that only needs an interrupted or failed regeneration retried can resume at that host step without a vendor conversation. Preserve the staged resolution and require the existing repair preparation, regeneration and staged-tree checks before any host-managed repair commit or publication.
  3. It refuses with a clear reason if the clone is dirty with unexpected changes, belongs to a live session, or its branch has moved on the remote.
  4. When the lane exits again without publishing, the clone is retained again (no data loss).
  5. Tests: salvage of a staged merge; refusal on a live owner; refusal when the remote moved. Also cover a terminal native Codex lane with successful preparation, failed host regeneration and a staged resolution. A retry must preserve the original conflict inventory and staged work, respect the owning host and the exact lease/journal identity, keep publication refused while regeneration fails, and allow the normal publication gate to continue once successful regeneration is recorded for that exact staged tree.
