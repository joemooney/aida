    Additional retained-repair case on November 21: TASK-3133 / PR #4387 at 509f5afbb29d. Native Codex lane 01a1fd06c235 resolved the host-staged merge with aa567732958, passed the targeted seat_clone suite (382 passed, 0 failed, 3 ignored), exited successfully, and left a Refs-only publication declaration. Host post-exit regeneration returned “repair regeneration failed or timed out.” The recorded original conflict path and staged merge survived; the repair journal recorded preparation_success=true and regeneration_success=false. The documented ship --from-seat --commit-pending retry refused with “resume pickup to retry regeneration before publication.” The queue work --resume preview then reported no recorded Claude conversation and no adoptable orphan for this Codex scope. GitHub still shows the original conflicting head. A recovery path should work on this exact retained-native sequence while preserving the staged resolution, regeneration checks and ownership guards.
