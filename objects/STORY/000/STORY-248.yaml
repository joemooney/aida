    Plan: docs/plans/2026-05-19-story-248-stacked-branch-awareness.md

    Decomposed into 3 vertical slices (one per acceptance sub-feature):
      Slice 1 (tracer bullet) — base selection: aida queue work --stack/--base, lease records parent_branch + parent_branch_sha
      Slice 2 — stack tracking: .aida/stacks.json graph + aida stack show/list (new aida-cli/src/stacks.rs module)
      Slice 3 — auto-rebase cascade on aida pull (bottom-up, --onto origin/main <parent_sha>, aborts on diverged-risky)

    Key design call: AIDA squash-merges + deletes branches (gh pr merge --squash --delete-branch), so a plain rebase from a stacked branch re-applies the parent's pre-squash commits. Rebase MUST use 'git rebase --onto origin/main <recorded-parent-sha> <branch>' — hence slice 1 records parent_branch_sha at stack-creation time.

    BUG-114 precondition already satisfied (Completed).
