title: 'Auto mailbox sync: messages flow between users on pull/push (Tier 2)'
description: 'Tier-2 of EPIC-47 (roadmap docs/plans/2026-06-16-team-support-roadmap.md). Today cross-user mailbox visibility needs a MANUAL digest->push->pull (mailbox_store::digest_local_to_canonical + merge_dedup exist but are not wired into sync). Wire auto-digest into the aida pull/push store legs: on the store sync, digest local .aida/mailbox -> canonical <store>/mailbox (idempotent, id-keyed) so a sender publishes automatically, and ensure pull brings canonical down + read_inbox merges it so a recipient sees foreign messages with no manual step. Best-effort (never break pull/push on a mailbox error); opt-out env/config. Harness case MU-502: clone A send_message to an identity B holds, A push, B pull -> B read_inbox shows it. Catalog MU-502 flips to a tested PASS.'
