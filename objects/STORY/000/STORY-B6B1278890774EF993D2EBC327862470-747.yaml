  content: |-
    ## Implementer handoff (committed locally, not published)

    Commit 20383fc0cb on `story-b6b1278890774ef993d2ebc327862470-747`, rebased on origin/main e14d6c9a70. `git push` fails in this seat (no GitHub credential; `gh` returns HTTP 401), so there is no PR.

    ### What it does
    - `aida pr train --check N...` / `--check --all-open [--json] [--timeout SECS]`: one line per PR, yes with the head or no with the first failing gate, the train's own reason and a remedy. Exit 0 only when every PR is eligible.
    - The verdict is the train's member gate (`typed_gate_member_with` behind the two rider checks) in a new read-only mode: no held-gate event, activity line, carry-over ledger answer, hold marker or label, and an expired review claim is left in place.

    ### Validation
    - `cargo test --profile agent -p aida-cli-lib --lib -- pr_train gate::approval review_marker review_carryover story_2492 help_surface story_1728 forge::tests`: 411 passed, 0 failed, 1 ignored (before the rebase onto e14d6c9a70, which touched none of these files; not re-run after).
    - 12 new tests (`story_2824`) pass. Help golden regenerated.
    - Fast gates run one at a time (the 60s cap cuts `make check-ci-fast` short): formatting, crate globs, gate dependencies, store writers, trace headers, manual static flags, help-golden co-change, doc links and paths, classifier inventory all pass. The rest of the fast tier was not run to completion.
    - Not exercised against a live forge: the handler itself (`pr_train_check_handler`) has no test; its parts do.

    ### Deviations and notes (filed as draft tasks -010, -011, -012 under from-implementer:STORY-2824)
    - An active mandate's cover is not asked (asking records evidence); such a PR reports no at the `mandate` gate.
    - Gate-protected files changed (`gate/approval.rs`, `gate/review_marker.rs`, gate tests), so the PR likely needs a human merge.
    - The STORY-2809 full-tier rule is not on main; the check inherits it when PR-4027 lands in the member gate.
    - Spec tagged `docs:impacted` for the doc-intent gate.
