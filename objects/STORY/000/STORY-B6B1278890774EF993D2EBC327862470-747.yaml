title: 'aida pr train --check N...: say whether each PR qualifies for a train right now, and why not'
description: 'From the Agent CLI friction log (STORY-2822 item 13). Advisors re-implement train eligibility in shell (approved at exact head, no armed hold, checks green, passing ci-tier: full, failures only from superseded runs ignored) and got it wrong twice on 2026-11-14 (27 min of waits; stale cancelled rows read as red). Acceptance: (1) ''aida pr train --check N...'' and ''--check --all-open'' print one row per PR: eligible yes/no and the first failing gate with its remedy; (2) uses exactly the gates ''aida pr train'' applies plus the full-tier rule from STORY-2809 when configured; (3) changes nothing (no labels, no holds, no journal); (4) json output and exit 0 only if every named PR is eligible; (5) bounded time.'
