  content: 'Design sketch landed: docs/plans/2026-06-07-story-527-aida-burndown-sketch.md. Vehicle = SKILL driving Agent(worktree) fan-out, NOT a compiled burndown.js Workflow (burndown is dynamic-width + data-terminated; saved-Workflow lane fits fixed-topology like panel-review, not this). aida owns the deterministic half via ONE new read-only verb ''aida burndown plan --json'' = selector (--batch/--tag/--status/--queue/ad-hoc, default=active-role ready backlog) funneled through a pickability gate (ready AND unblocked-via graph --blocked-by AND bounded). Bounded heuristic (slice 1, conservative): has ## Acceptance AND no fork tag; false-park cheap, false-go costs a stalled subagent. Skill drives wave loop: fan out N worktree-isolated implementers (1 bounded spec each -> PR), integrator merges greens + reconciles + re-resolves selector + relaunches; punt-and-continue (one blocker parks ONE spec). Positioned as the RECOMMENDED drain, NOT competing with orchestrator drain (EPIC-33 hardened in parallel). SVS: ship CLI verb+gate+pure tests first, then the skill. Needs sign-off on vehicle, verb name, bounded heuristic, slice order. Status unchanged.'
