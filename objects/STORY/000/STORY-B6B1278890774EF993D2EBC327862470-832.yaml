- id: 01a21649-be80-7062-9849-2589a19d2003
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: c61aeb912f (slice 1, Refs STORY-3134)

    AC1: [evidence: behavioral-test] Codex usage limit detected only from structured turn.failed/error events (real host log line used as fixture), Claude from rate_limit_event status=rejected with resetsAt. Free-text agent messages and other turn failures are not outages (story_3134_vendor_outage_tests ac1_*). A stopped standalone lane is snapshotted (commits + staged + unstaged + untracked, via a private index, so the seat's HEAD and index are untouched) to aida-outage/<branch> on origin. Only after that push succeeds does the lease end (session end --force --discard-unpushed). A failed push keeps the lease and the tree (tested). The lane exits 37 with a vendor-unavailable result line, not 'implementer exited'.
    AC2: [evidence: behavioral-test] VendorUnavailable{vendor, until} is recorded at .aida/vendor-outages/<vendor>.json on the main checkout and shown as an aida doctor finding (category vendor-outage). lane_host::preflight refuses before any lease is minted, and that covers headless queue work, including review-watch's reviewer launches.
    Probes: same vendor key (as_str) on write and compare. Atomic tmp+rename write. An unreadable record is skipped (it only withholds launches). With N events the last wins. An expired record is ignored, so availability returns at the reset with no manual revert.
    Residual / slice 2: AC3 fallback_vendor + the single operator notification. AC4 recovery event (expiry already restores launches, but no event is written). Detection in reviewer output and in drain phase-1 implementers (run_vendor_headless_to_exit) is not wired yet; only standalone lanes end via the outage path. Production diff is ~362 lines plus 246 test lines, over the 300 budget.
