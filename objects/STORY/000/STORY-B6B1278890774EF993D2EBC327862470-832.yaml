  content: |-
    ## Implementer self-review
    Reviewed HEAD: 926296dae0 (S1b, Refs STORY-3134). 284 changed lines.
    (1) [evidence: behavioral-test] A classified usage-limit stop salvages committed work through lane_salvage with FailedExit.side_branch_only, so the target is always salvage/<lane>: never the PR branch, never forced (the existing fast-forward-only push). Test story_3134_usage_limit_stop_salvages_to_the_side_branch_only: a launch PR exists, salvage/<id> gets the tip, the PR branch is unchanged, nothing is posted on the PR. Then vendor_outage::end_lane runs session end, whose guard refuses commits no remote has. Uncommitted edits or an unreadable seat keep the lease, so nothing is discarded (s1b_usage_limit_stop_releases_its_lease_only_when_nothing_is_uncommitted). The exit leads with 'agent usage limit: <vendor> until <reset>' and adds 'lease released' or 'lease kept: <why>'.
