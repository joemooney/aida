  content: 'ADVISOR DISPOSITION (advisor-122 2026-11-25 09:50): APPROVED, HIGH, standard, drive. Evidence: on 2026-11-25 at 05:27 the codex limit killed 5 lanes mid-round. They left retained leases that blocked every relaunch until a manual cleanup about 4h later, and review dispatch also silently used codex. Binding notes: (1) Detection uses the vendor''s exit/stream signal, never free-text guessing alone; record the reset time when the vendor gives one. (2) Ending a lane on a usage limit pushes its partial work to a side branch first, then ends cleanly with no retained lease. (3) fallback_vendor is opt-in per project config (default none = refuse launches until the reset) and applies to reviews too. (4) Auto-recover at the reset time, with an event. Slices ≤300.'
