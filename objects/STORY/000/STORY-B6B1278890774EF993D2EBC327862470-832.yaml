    (F1, security MUST) preserve_seat must NOT run raw `git` from the host inside a seat clone (seat-controlled config and hooks → host execution). REUSE the existing sanctioned salvage/seat-transport path, the same one conflict-repair salvage and `session end --force` use (host_git_command with the seat-clone pins, or the seat-side publish route).
    (F2) The push goes through the remote_credentials routing; no unrouted push.
    (F3) Detection classifies ONLY the run's TERMINAL event (or a dedicated limit event), not "the last matching line in the tail".
    (F4) A TEST through lane_host::preflight / `queue work --no-human` showing an active outage REFUSES the launch.
    DEFERRED (do NOT do): the fast-fix child ordering; the codex reset-time timezone.
