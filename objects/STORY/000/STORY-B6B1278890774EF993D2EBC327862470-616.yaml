title: 'Open-PR collision checks: detect duplicate CLI flags across open PRs and order trains by file overlap'
description: 'Problem: on 2026-11-08 PR-3643 and PR-3662 both defined aida doctor --lane-host with different meanings, found only at merge conflict, and each landed train created new conflicts in waiting PRs. Requirement: a check compares CLI surface additions across open PRs and flags collisions to the advisor early; train selection orders members to minimise file overlap with the remaining approved PRs. Acceptance: two fixture PRs adding one flag name are reported before either merges; ordering is deterministic and tested.'
