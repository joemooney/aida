  content: 'ADVISOR DISPOSITION (advisor-122 21:20, Joe-requested): APPROVED HIGH, STRICT (it swaps the live binary and rebinds the loops), drive. Binding notes: (a) STRICT because a provisional binary runs every gate; the default refusal of permissiveness diffs is a real check: classify by touched paths (the gate/approval/admission/containment strict paths), not by commit message. (b) The PROVISIONAL marker also blocks dev build promotes from main unless --replace-provisional, and the auto-revert path is tested. (c) Per today''s finding, the route is an integration-style promote, never a hand copy into live/. (d) Slices: S1 build+promote+marker+rollback (at most 300); S2 loop rebind/restart + autobuild interplay + TTL; S3 docs.'
