title: 'BUG-2618 S2: cached (<=10s) pr state/list shows approval head, train owner and holds together, so seats can see protection before moving a head'
description: |
  Child of BUG-2618, slice S2 (advisor decomposition ruling 2026-11-18 03:15, on BUG-2618). The display half of BUG-2618 AC1: a seat must be able to SEE that a PR is protected (approved at head and/or train-pinned) before it moves the head. Today `aida pr state` times out on live forge probes, so it can't.

  Review findings this slice closes (PR #4137, finding 1, rounds 1-3):
  - pr_list.rs::PrListEntry/render_table have no approved-at-head or train-pin fields.
  - pr_state.rs::run exposes the verdict head only in JSON and omits the pin identity and hold facts. Its classification can hide protection behind Held/BehindBase/InFlight.
  - pr_state.rs::collect calls forge::pr_state_batch with a 2 s live-network timeout and has no cache, so the reported timeout persists.

  ## Acceptance
  1. `aida pr state` and `aida pr list` answer from a cache no older than 10 s (a configurable TTL), refreshing in the background. A cold call with no cache still bounds itself and says the data is stale instead of timing out silently.
  2. For every open PR, both views show TOGETHER (human and JSON): the current head; the independent-approval head (and whether it equals the current head); the reserving train (id/owner), if any; the active holds; and the evidence for the current open set (cache age / source).
  3. A protected PR (approved at its head, or train-pinned) is visibly marked as protected even when its classification is Held, BehindBase or InFlight. The protection flag is never hidden by the classification.
  4. Tests: cache hit within the TTL, refresh after it, the cold-cache bound, a protected+held PR shows both, and a train-pinned PR shows the train owner.
  Out of scope: refusing head moves (S1) and the shared coordination boundary / raw-head invalidation (S3).
