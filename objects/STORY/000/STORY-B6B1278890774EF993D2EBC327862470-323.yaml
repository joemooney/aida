    7. [minor] ProcessResolver::fill (session.rs ~298): a leased conversation whose ownership is Unknown (recordless or pre-migration lease) now resolves as not live, because the pid_alive closure returns true only on OwnerVerdict::Alive and the cwd scan is suppressed for leased rows. aida session list then shows real running sessions as dead until migration. Render Unknown distinctly, not as dead.
