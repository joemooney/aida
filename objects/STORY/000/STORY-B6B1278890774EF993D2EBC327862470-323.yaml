    REVIEW FINDINGS TO ADDRESS (PR #3619):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 262b09078949
    Recorded: 2026-11-07T20:27:34.910560111+00:00
    Findings:
    1. [major][blocker] Advisor ruling (2) is unmet: mail retention still gates on build/executable identity (aida-core mailbox_lifecycle/activation.rs). Round 6 punted it as a design fork, and STORY-2325 has no advisor ruling after that (the last comment is the implementer's handoff). The 2026-11-07 ruling named PR-D the COMPLETING slice. Either get and record an advisor ruling that splits (2) into a named follow-up spec, or implement retention checks against delivered/acknowledged message state.
    2. [major] Ruling (1) is still partial: 'no direct lease/pid probes remain outside ownership/' for relaunch paths. Still on legacy probes, grandfathered in scripts/ownership-liveness-legacy.json: (a) session_start.rs:999 orphan_lease_to_adopt uses stale_lease_recovery_for_lease, which is the queue work --resume relaunch of a dead lane; (b) session_start.rs:2476 and :2681 session_start_with_receipt use lease_is_live and probe_live_claude_sessions; (c) queue_cmd.rs:4579/4674, the queue/fill pickup filter (BUG-637), uses probe_live_claude_sessions and lease_is_live to decide whether a dead claim still hides a spec; (d) lane_liveness.rs:1280 review_lease_running, the review-watch decision whether a reviewer is running, uses lease_state_for and probe_live_claude_sessions. Route these through ownership::reader, or record the advisor-approved remainder on the spec.
    3. [major] Regression vs BUG-307: a dead owner whose tree is clean and whose branch has no head on origin is never reclaimed. This is the common case of a lane that died before its first push, or one with HEAD still at the main base. remote_missing_commits_for_lease returns 0, but reclaim_dead_tree (ownership/judge.rs:279) returns Keep('no PR head on origin'). check_pr_lease then returns NotProvable, and handle_queue_work (queue_cmd.rs ~13272) bails with 'ownership reclaim could not end lease ...: ownership retained: there is no PR head on origin...', which names no command. Before this PR, BUG-307 auto-released this dormant clean lease. The new test queue_work_reclaim_attempt_keeps_lease_when_session_end_refuses pushes the branch first, so this path has no test. Treat clean + zero remote-missing commits + Dead as EndBySafeRule for non-PR implementer leases, or at minimum name 'aida session end <id>'. Add a handle_queue_work test for it.
    4. [major] review_watch_forge.rs:550 sweep_probe_refs now passes probe_owner_retained (ownership/reader.rs:174), which returns true (retain) whenever no ownership witness carries the probe's pid. Review-watch watcher pids are never ownership holders, so legacy pid-only probe refs (no t<secs>) are never swept again: a refs/aida/review-watch/* leak. The existing test task_1993_review_watch_tests.rs:2036 leaked_probe_refs_are_swept_and_live_ones_kept creates 'refs/aida/review-watch/4000000001-<uuid>/base' (pid-only, dead pid) and asserts sweep_probe_refs == 4 with that ref gone. Under the new predicate that ref is retained, so the count is 3 and the test should fail (lib shards were still pending at review time). A probe ref is a fetch artifact, not ownership: keep a real process-death check for watcher pids, or grandfather that site, and keep the test green unmodified.
