    REVIEW FINDINGS TO ADDRESS (PR #3600):
    Verdict: CHANGES REQUESTED
    Reviewed commit: da5e4134327d
    Recorded: 2026-11-07T15:52:57.368076253+00:00
    Findings:
    1. [major] Review-marker dead-pid expiry regressed (TASK-1750). Production is_live_at/merge_gate (gate/review_marker.rs:258-268) now use only review_ownership_ended (gate/kernel_deps.rs:439) and otherwise fall back to ttl_expired. The pid+start check survives only in expired_reason, which this PR made #[cfg(test)] (review_marker.rs:233). So review_marker_tests.rs:66-90 (dead_pid_on_this_host_expires_at_once and the recycled-pid case) now test dead code. The drain reviewer phase takes no lease (phase_driver_trait.rs:1670-1683), so it never has a Review ownership record. When it crashes, its marker blocks 'aida pr ship' at that head for the full PID_BACKED_TTL_SECS (2h). The comment there ('a crash leaves a marker whose dead pid expires it') is now false. The same applies whenever a marker's pid differs from the reviewer lease's holder pid. A same-host pid with matching start identity that is gone is Dead under the sketch's own liveness rule, not Unknown. Fix: when no attributable record exists, fall back to the marker's own pid+start check, then the TTL (i.e. expired_reason). Add a merge_gate test that a dead-pid marker with no ownership record clears at once.
    2. [minor] Rework commits in a handed-off seat cannot ship. ship_branch (pr_cmd.rs:1527-1627) reattaches only when both HEAD and refs/heads/<branch> equal the recorded InPr head. After handoff the seat stays detached and its agent keeps running (lease retained), so a 'queue rework --work --resume' agent that commits its fixes commits on the detached HEAD. Then 'git push' fails and ship refuses with 'detached seat or branch moved beyond the recorded PR head', with no recovery hint, and nothing else reattaches the branch. Uncommitted rework still ships because switch carries the dirty tree. Fix: when HEAD is detached and refs/heads/<branch> is still at the recorded head, accept HEAD as a descendant of it: fast-forward the branch with an old-value check, then switch. Or reattach when the resumed session re-acquires. Test: handoff, commit on the detached HEAD, then ship_branch(resume=true) attaches with the new commit on the branch.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
