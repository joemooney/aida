title: 'aida queue move --after <ID>: insert immediately after an anchor item'
description: |
  Today `aida queue move <id>` accepts `--top`, `--bottom`, `--before <ID>`. Missing: `--after <ID>`.

  ## Why it matters

  When the user reasons "put X right after Y" (the natural English shape), they have to translate to `--before <next-thing-after-Y>` — which means looking up what's after Y first. Worse, when inserting a cluster of items "after Y," each invocation of `--before Z` shifts the previous insertion further from Z, requiring reverse-order calls (last move wins closest position). Filed 2026-05-10 after the user hit this exact issue while reordering 4 items into the queue.

  ## Surface

  ```
  aida queue move STORY-68 --after STORY-69
  ```

  Symmetric to `--before`. Same rules: ID must be in the queue; refuses if --after target is the same as the moved item.

  ## Implementation

  In `QueueCommand::Move` handler (aida-cli/src/main.rs around line 16415):

  - Add `--after <ID>` mutually-exclusive with --top/--bottom/--before
  - New position = `target_after_pos + (next_pos - target_after_pos) / 2` if there's a next item, else `target_after_pos + 1000`

  ## Acceptance

  - [ ] `aida queue move X --after Y` puts X at position right after Y in the queue
  - [ ] If Y has a successor Z, position(X) is between Y and Z
  - [ ] If Y is at the bottom, X lands at new bottom
  - [ ] Errors if Y not in queue (same error shape as `--before`)
  - [ ] Errors if X == Y
