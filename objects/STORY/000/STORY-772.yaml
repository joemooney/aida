  content: 'Scoping complete (docs/plans/2026-07-17-story-772-crate-split-scoping.md). Key finding: a bin+one-lib split delivers only ~0-5% clean-build improvement and nothing for incremental rebuilds — the lib stays one ~274K-line crate and codegen-units+incremental already capture that. Build-time is NOT the payoff; testability + clean entry boundary + enabling a future multi-crate lib split are. Recommended topology: thin 3-line bin, everything (incl. run/dispatch + all 164 test modules) into aida-cli-lib, tests stay inside the lib (a standalone test crate would require promoting ~660 pub(crate) fns to pub — rejected). 2-PR sequence (lib.rs within one package, then git mv the package). Recommend re-scoping acceptance away from build-time + filing a follow-up for the lib-internal multi-crate split (the real build lever, pub(crate)-web-gated).'
