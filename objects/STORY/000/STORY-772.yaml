title: 'SPIKE-78 follow-up: split aida-cli into a thin binary + handler lib crate + test crate'
description: Structural endgame of SPIKE-78. Split aida-cli (~thin main.rs + *_cmd.rs handler modules + relocated tests) into a thin bin crate + a handler lib crate + a test crate. This is where the actual CI/compile-time win materializes — an independent incremental cache lets the test crate build in parallel. Depends on the inline-test relocation landing first (the enabling precondition). The *_cmd.rs handler split done in phase 1 is the other precondition.
