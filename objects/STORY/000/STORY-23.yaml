spec_id: STORY-23
title: 'Queue: CLI commands'
description: |-
  Queue: CLI Commands

  Add CLI subcommands for queue management so users can manage their queue from the terminal.

  **Commands:**

  aida queue list [--user <handle>]                    — Show queue (default: current user)
  aida queue add <SPEC-ID> [--top|--bottom|--after <SPEC-ID>] [--user <handle>] [--note "..."]
                                                        — Add item to queue
  aida queue remove <SPEC-ID> [--user <handle>]         — Remove item from queue
  aida queue move <SPEC-ID> --before <SPEC-ID>          — Reorder: move item before another
  aida queue move <SPEC-ID> --top                       — Move to top of queue
  aida queue move <SPEC-ID> --bottom                    — Move to bottom of queue
  aida queue clear [--user <handle>] [--completed]      — Clear queue (or just completed items)

  **Display:**
  - List shows position number, spec-id, title, status, priority
  - Highlight items added by others (inbox items) with a marker
  - Show the note if present (e.g., "added by @manager: urgent client request")

  **Configuration:**
  - Default user determined by AIDA_USER env var or git user
  - --user flag allows managers to manage others' queues

  **Acceptance Criteria:**
  1. All queue operations available from CLI
  2. Output is human-readable in terminal and machine-parseable with --format json
  3. Tab-completion friendly spec-id arguments
  4. aida queue list integrates into aida standup output
