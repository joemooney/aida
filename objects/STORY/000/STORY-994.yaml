    REVIEW FINDINGS TO ADDRESS (PR #1704):
    Verdict: CHANGES REQUESTED
    Findings:
    1. STORY-994 acceptance 1 requires the SessionStart hook for hand-opened sessions to add a registry [terminal] block; the changed hook path only stamps presence/notice state, while terminal capture is limited to launcher/MCP/manual registration paths.
    2. STORY-994 acceptance 2 requires restoring titles on session end when supported. apply_terminal_title changes tmux/wezterm/terminator via native commands, but restore_terminal_title immediately returns for those emulator values, so prior native titles are not restored.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
