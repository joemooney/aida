agreed_id: STORY-3059
title: Reap policy for clones whose only commits are published on an origin branch with a closed-unmerged PR
description: |
  Policy question from the BUG-2742 / #4487 review (advisor-122 ruling 2026-11-23 22:03; filed by product-15). Session 01a1abbf (a TASK-2708 seat clone) has commits that are all published on an origin branch, but that branch's PR (#3449) CLOSED UNMERGED. Hygiene refuses to reap it, which is correct conservatism today, but it leaves such clones stuck forever and fails the hourly hygiene check.

  ## Acceptance (to decide)
  - AC1: Define the reap policy for clones whose only commits are published on an origin branch with a closed-unmerged PR: keep forever, reap after N days with a recorded salvage pointer (origin branch + PR), or move to ~/salvage automatically. The decision is recorded on this spec.
  - AC2: Hygiene reports these as "parked: published on <branch>, PR #N closed unmerged" (not a failure) until the policy is decided.
status: InProgress
priority: Low
owner: joe.mooney@gmail.com
feature: Uncategorized
