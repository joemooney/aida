    ## Implementer self-review
    Reviewed HEAD: 423189493fe0ee64536b36823c37fbe32aa9b120 plus the five native-lane working-tree edits. Reviewed the origin/main merge-base diff, local diff and untracked listing.
    AC1: [evidence: behavioral-test] task_2053_seat_clone_lifecycle_tests.rs:1695 and :2724 both passed in launcher job j20261125T015237580-2-0. The closed-unmerged fixture verifies the forge state and head, scan, actual removal, release and owning-spec pointer. The destructive negatives preserve the seat and lease for stale/tag-only coverage, reflog-only work and a refused pointer. A late edit survives quarantine rollback.
    AC2: [evidence: documentation-inspection] The advisor has decided the policy, ending interim parking. docs/cli/06-roles-sessions.md:193 and session_reap.rs explain branch publication for clones and merge evidence for ordinary worktrees. F3 follows the explicit branch-only ruling.
    Deep pass: origin names and OIDs are read together; failed, empty, stale, oversized or unprovable observations cannot authorize removal. Ref and reflog inventory is compared after rename, with holder checks bracketing the verification. Restore cannot replace another directory. Missing local ancestry evidence can conservatively retain a clone. The store comment must persist before deletion. The legacy fixture deliberately exercises the verified host lease for successful mail retirement. Corrected an unguarded fixture fetch after the first fast-gate run; the maintenance ratchet passed independently. Exact PR-head CI awaits host publication.
