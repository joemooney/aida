  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-3059):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 8e61bbfdfcb8
    Recorded: 2026-11-25T04:50:44.919825046+00:00
    Findings:
    1. aida-cli-lib/src/seat_clone.rs:575–585, 6054–6058 (STORY-3059 whole-clone recovery). A network seat is created with git clone --reference main, so it can borrow objects anywhere in main, including history outside the pinned base. The move keeps that alternate and pins only the base. If a seat ref points to a borrowed commit from a side branch outside that base, removing the side branch from main and pruning its unreachable objects can leave the saved clone with a ref whose objects are gone. Preserve all borrowed objects needed by the saved clone, including its recovery history, before releasing the lease. Exercise an alternate-only commit outside base ancestry and verify that its objects remain readable after the primary ref is dropped and maintenance runs. The existing fixture at line 1761 resolves the ORIG_HEAD name to an ID without verifying its object contents.
    2. aida-cli-lib/src/seat_clone.rs:6082–6092 and aida-cli-lib/src/session_reap.rs:2576–2589 (STORY-3059 owning-spec recovery note). If the process is interrupted after the rename and before the comment persists, the only destination pointer is in memory. On the next quiet reap, generic missing-worktree cleanup can release the dead lease, count it as reaped, and clear the original seat pin without recording the path on the spec. A rename makes the directory move atomic but leaves this transition without a durable recovery record. Persist a recoverable move intent or use an equivalent resumable handoff, and make missing-tree cleanup finish or explicitly report pending salvage before releasing the lease. Cover interruption between the rename and the comment.
    3. aida-cli-lib/src/seat_clone.rs:6039–6045, 6070–6084 (STORY-3059 clean idle seat and saved refs). Reap reads the ref inventory before the origin round trip and performs a synchronous Git update-ref after its last holder check. A resumed process can enter in the interval before rename, including while a primary reference-transaction hook is running, and the move then retires a live checkout. A process that updates only a side ref and exits during the earlier origin lookup can also leave the note describing refs that differ from the saved clone while HEAD and dirt checks pass. Move preparatory work ahead of the final checks, coordinate the move with session admission, and capture the ref inventory at the saved tree boundary. Extend the existing holder fixture to cover admission after the preliminary checks.
    4. aida-cli-lib/src/session_reap.rs:1498–1505 and aida-cli-lib/src/session_hygiene.rs:139–153 (hygiene error routing). The new catch-all maps storage or rename I/O errors to skipped, including a failed restore after moving the seat. Hygiene routes failed outcomes and activation refusals, so a permanently blocked save or a clone already moved with failed mail settlement can now produce a successful scheduled hygiene run. The generic 'seat clone kept' message also hides whether it actually moved. Distinguish expected eligibility refusals from operational failures and keep the salvage path in the latter outcome when the move already happened.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
