    REVIEW FINDINGS TO ADDRESS (STORY-3059):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9959be295166
    Recorded: 2026-11-25T11:45:12.408967538+00:00
    Findings:
    1. aida-cli-lib/src/session_reap.rs:1451–1452 — The reported recovery command cannot recover the seats this slice identifies. On pinned main, doctor_cmd.rs:381 rejects `stale-leases --attest` outright. BUG-2755/PR #4541 is still open, and its current `attest_clone_lease` accepts only explicit clone leases without a verified host binding. The hygiene fixture uses a host-created clone and a legacy lease with omitted `tree_kind`. Align the operator recovery path with the seat types hygiene reports, and verify the emitted command against the code that would land.
    2. aida-cli-lib/src/session_reap.rs:1421–1431,1451–1452 — A zero `facts.unpushed` count does not establish current publication on origin. `probe_counting_origin` returns before contacting origin when the first count is zero, and the count can be satisfied by stale tracking refs, refs in the primary checkout or shipped heads. A closed PR keeps its head SHA after its source branch is deleted, so hygiene can tell the operator a deleted branch is still published. Require a fresh, bounded, read-only origin observation that establishes that the branch preserves this tip, and cover deleted or rewound origin branches with stale tracking refs.
    3. aida-cli-lib/src/session_reap.rs:1445–1456,1496–1542 — The closed-PR veto is enforced only during the scan. A branch name with an older merged PR can pass the scan while its exact-tip PR is open, then that PR can close unmerged without moving HEAD while hygiene processes another lease. `reap_one_clone` checks the saved tip and reads merged heads, but it never refreshes the new veto before attempting mail retirement and clone destruction. Recheck and honor exact-tip closed or unknown history before mutation, and cover a state transition at an unchanged SHA.
    4. aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs:2753–2833 — The new preservation test never supplies a valid exact-tip closed PR and a successful historical-merge lookup in the same scan. Its closed-case shim returns no merged row, so even if the new veto were changed to run only after a merge lookup misses, every added assertion would still pass. Exercise simultaneous closed-tip and historical-merge evidence through both scan and real reap. Include negative closed-row cases for mismatched head or repository and a merged-only row at the tip so the new destruction decision is tested in both directions.
