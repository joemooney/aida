  content: 'Draft to Approved with the POLICY DECIDED (advisor-122 2026-11-23 22:10; LOW, strict, MAIN, drive): reapable when the tree is clean (per BUG-2742), no stash, and every local commit is reachable from an origin ref verified by a fresh bounded fetch at reap time, regardless of PR state; record branch + tip SHA on the owning spec before reaping; refuse with ''publication unknown'' if the fetch fails. AC1 closed-unmerged+published -> reaped with comment; AC2 one unpushed commit -> refused; AC3 fetch failure -> refused. HOLD until BUG-2742 lands.'
