- id: 01a213fc-c35a-77a1-be0a-3b16b679e4ce
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-3059):
    Verdict: CHANGES REQUESTED
    Reviewed commit: a9b2089aaaa9
    Recorded: 2026-11-25T18:30:33.638595656+00:00
    Findings:
    1. aida-cli-lib/src/forge.rs:7035-7084 (observe_terminal_branch / parse_terminal_branch with unmerged_only=true) — the new closed-unmerged exact-tip veto is the only thing standing between a closed-MR seat clone and clone destruction in reap_one_clone, but its GitLab branch is untested. Every behavioral case in task_2053_seat_clone_lifecycle_tests.rs uses a GitHub shim, and forge_task_1222_gc_forge_tests_inline_tests.rs exercises only the unmerged_only=false GC parser. Mutating the GitLab arm (dropping "closed" from the `matches!(state, "CLOSED" | "closed")` check, or the full-SHA/same-project guards in unmerged mode) survives, and then a GitLab project (the work clone is GitLab-hosted) silently loses the veto and reaps a seat whose exact tip has a closed-unmerged MR. Add unit tests on parse_terminal_branch(..., ForgeKind::GitLab, ..., true): closed same-project MR at the tip → Some(true); merged-only at the tip, closed at a different sha, and closed cross-project → Some(false); a short/empty sha → None.
    2. aida-cli-lib/src/session_reap.rs:1494 — the recoverable hint names the branch and publication state but not the closed PR/MR number that AC2's wording ("PR #N closed unmerged") and the salvage-pointer intent of AC1 call for. The advisor's r2 brief fixed the hint wording, so this is not an unmet AC, but an operator still has to look the PR up by hand. Follow-up: carry the matched closed PR number out of parse_terminal_branch and include it in the hint.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
