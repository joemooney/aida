title: GitLab Label Mapping Configuration
description: "As a user, I want to configure how AIDA fields map to GitLab labels so that issues are created with appropriate categorization.\n\n## Acceptance Criteria\n- [ ] Configure mapping from AIDA types to GitLab labels\n- [ ] Configure mapping from AIDA priorities to GitLab labels\n- [ ] Configure mapping from AIDA statuses to GitLab labels\n- [ ] Support custom label prefix (e.g., \"aida::\" namespace)\n- [ ] Auto-create missing labels in GitLab (optional, with warning)\n- [ ] Validate labels exist in GitLab project\n- [ ] Support bidirectional mapping (for future sync)\n\n## Configuration\n```toml\n[gitlab.labels]\n# Namespace prefix for AIDA-managed labels\nprefix = \"aida::\"\n\n# Type mappings\n[gitlab.labels.types]\nBug = \"type::bug\"\nStory = \"type::story\"\nTask = \"type::task\"\nEpic = \"type::epic\"\nFunctional = \"type::requirement\"\nNonFunctional = \"type::nfr\"\n\n# Priority mappings  \n[gitlab.labels.priorities]\nHigh = \"priority::high\"\nMedium = \"priority::medium\"\nLow = \"priority::low\"\n\n# Status mappings (for sync)\n[gitlab.labels.statuses]\nDraft = \"status::draft\"\nApproved = \"status::approved\"\nInProgress = \"status::in-progress\"\nCompleted = \"status::done\"\nRejected = \"status::rejected\"\n\n# Auto-create missing labels\nauto_create_labels = true\n```\n\n## Label Colors (for auto-create)\n```toml\n[gitlab.label_colors]\n\"type::bug\" = \"#FF0000\"\n\"type::story\" = \"#428BCA\"\n\"priority::high\" = \"#DC3545\"\n\"priority::medium\" = \"#FFC107\"\n\"priority::low\" = \"#28A745\"\n```\n\n## CLI Support\n```bash\n# Show current mappings\naida gitlab labels\n\n# Validate labels exist in GitLab\naida gitlab labels --validate\n\n# Create missing labels in GitLab\naida gitlab labels --create-missing\n```\n\n## GUI Support\n- Settings > GitLab > Label Mappings section\n- Table showing AIDA field → GitLab label\n- Validation status indicator\n- \"Sync Labels\" button to create missing"
