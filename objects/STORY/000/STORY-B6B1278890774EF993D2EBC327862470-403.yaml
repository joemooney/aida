title: Headless Codex queue-work lanes publish their own work on exit (host-side commit + ship)
description: 'Codex''s native sandbox makes .git read-only, so a Codex `aida queue work` lane leaves validated edits uncommitted in its seat clone and exits with ''pr-opened ... untested'' or nothing. Someone has to run `aida ship SPEC --from-seat <clone> --commit-pending ...` by hand. On 2026-11-04 the BUG-2439 fix sat uncommitted for 3 hours. TASK-2712 added the host commit for agent-new lanes only. Acceptance: (1) when a contained Codex queue-work lane exits with pending seat changes, the host commits them with a generated [AI:codex] message naming the spec, and ships them to the existing PR or opens one; (2) this also covers reworks of an existing PR branch; (3) an exit with no changes is reported to the advisor by mail, not silently; (4) it replaces the advisor''s auto-publish.sh workaround.'
