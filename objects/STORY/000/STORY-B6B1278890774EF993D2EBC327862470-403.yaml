- id: 01a1a96b-60cd-7542-985b-247a993dc8f1
  author: joe
  content: 'ADVISOR RULING (2026-11-04 19:00) on merge-conflict handling: the host never resolves conflicts. Before seating a rework for a spec with an open PR, the host seats the PR head branch and attempts merge origin/main. If it''s clean, commit the merge and launch. If it conflicts, abort the merge, don''t launch Codex, and route the spec to a non-native-sandbox vendor (claude) with a mail to the advisor naming the conflicting files. Exit publishing: after a contained Codex lane exits with pending changes, the host commits them and ships to the existing PR (or opens one). After a no-change exit on a still-red PR, mail the advisor with kind=request. Continue from 858ffdffaba on branch story-b6b1278890774ef993d2ebc327862470-403 and open the PR.'
