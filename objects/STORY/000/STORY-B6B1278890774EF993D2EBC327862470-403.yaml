  author: joe
  content: 'Also observed 2026-11-04 17:33: the TASK-2708 rework lane for PR #3307 started on a fresh branch off main (task-...-658-2), not on the PR branch. Codex can''t switch branches in its sandbox, so it punted with no changes. Acceptance addition: a queue-work rework for a spec with an open PR always seats the PR''s head branch (the host does the checkout and merge-from-main before the lane starts), for every vendor.'
