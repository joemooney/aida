  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: Partial implementation in seat: standalone Codex queue-work post-exit commit and publication, plus PR-head lookup independent of Approved status or Rework hold. Acceptance addition also requires host merge-from-main before every vendor starts. Need ruling for conflicting merges: refuse and park before launch, or expose conflicts to a lane that cannot write Git metadata and have host finish the merge. Existing conflict_task asks the child to commit, incompatible with native Codex. Drain and resume publication coverage also remains. Do not mark complete or publish as finished.. No triage reason was given.'
