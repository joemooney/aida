  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2857):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 0b87703efed4
    Recorded: 2026-11-17T02:03:18.955834989+00:00
    Findings:
    1. F1 [P1] review_watch.rs:3966: admission_quiescent checks only active phases, so Exited/Completed attempts with live or unknown reviewer descendants pass after the watcher releases its mode claim. execute_reservation can mark Exited while finish_admission deliberately retains ambiguous descendants. Prove recorded processes/groups stopped and reject unrecorded spawning descendants, as existing terminal-attempt retry/status paths do. Add live-reviewer, unknown-spawn and proven-stopped transition regressions. Applies to original head and landed tree; independent of newer base.
    2. F2 [P2] admission_owner.rs:134: the unconditional admission_train_running probe rejects a joining legacy review watcher while a verified legacy auto-train controller holds run.lock during CI, despite compatible shared mode ownership. Allow joining proven current legacy ownership without requiring its active train to stop; retain orphan/unknown-train transition refusal and land/manual exclusion. Add a legacy owner plus held run.lock watcher-start regression. Applies to original head and landed tree; independent of newer base.
    3. F3 [P2] admission_owner.rs:36: Claim::drop unlinks its receipt outside receipts.lock while acquire/train enumerate and open receipts under that lock. Normal controller exit between read_dir and open produces NotFound and an untyped unreadable-holder error, failing watcher startup or the manual typed-busy contract even with another controller alive. Serialize removal with readers using consistent lock order, or safely retry vanished snapshots while preserving refusal of unreadable existing evidence. Add a deterministic concurrent drop/read regression. Applies to original head and landed tree; independent of newer base.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
