title: 'Queue: React web UI — My Queue view'
description: |-
  Queue: React Web UI — My Queue View

  Add a "My Queue" view to the React dashboard with drag-to-reorder and inbox semantics.

  **Navigation:**
  - New nav item in Sidebar: "My Queue" (between List View and Sprints, or after Dashboard)
  - Route: /queue

  **View Layout:**
  - Header: "My Queue" with item count and "Clear Completed" button
  - Queue list: ordered cards/rows showing spec-id, title, status pill, priority indicator
  - Items added by others show "Added by @name" badge and optional note
  - Drag-and-drop to reorder (or up/down arrow buttons for accessibility)
  - Click item to open detail panel (same pattern as List View)
  - Empty state: "Your queue is empty — add items from the List or Board view"

  **Adding to Queue:**
  - Context menu / action button on requirement cards across all views (List, Board, Detail)
  - "Add to My Queue" option with sub-choices: Top, Bottom
  - Also available from requirement detail panel actions

  **Auto-filtering:**
  - Completed items hidden by default, toggle to show
  - Archived items always hidden

  **Acceptance Criteria:**
  1. My Queue route accessible from sidebar navigation
  2. Drag-to-reorder persists via API
  3. Items can be added from List View, Board View, and Detail Panel
  4. Completed items auto-filtered, toggleable
  5. Inbox items (added by others) visually distinguished
