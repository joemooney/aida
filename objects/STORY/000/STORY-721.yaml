title: aida zen <spec> — one-shot autonomous implement+ship (auto-queue + approval-gate + parallel fire-and-forget)
description: 'The auto-implement counterpart to aida ship (human-implement). aida zen <spec> takes ANY approved spec (queued or not — auto-queue/bypass), runs a zen autonomous implementation (= aida queue work <spec> --auto-complete --zen), and drives it to a PR + onto main. Fire-and-forget per spec: kick off several for INDEPENDENT specs in parallel (each its own worktree). If the spec is NOT approved (Draft), route it to the advisor for an approve decision FIRST (composes with the EPIC-0428 autopilot approve action), then implement. Coupled specs (shared files) must use the SPIKE-70 --single-branch sequential mode, not parallel fire. Thin wrapper over the existing --auto-complete --zen orchestrator + auto-queue + autopilot approve-gate + the shared --from-pr finish ceremony (also used by aida ship STORY-720 + aida integrate STORY-718). Build AFTER aida ship (shared finish) + autopilot evaluate (TASK-1007, the approve-gate). The third of the ship/zen/integrate taxonomy. Operator concept 2026-06-29.'
