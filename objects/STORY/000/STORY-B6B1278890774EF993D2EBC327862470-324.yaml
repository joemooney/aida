    - Q6. Is the host-lane `allowWrite` for the cargo slot dir and the seat target dir acceptable as the one declared widening? And is sccache Off for every lane, including uncontained host lanes, acceptable at the cost of build time? I recommend yes to both. A shared sccache is a cross-seat cache-poisoning channel (ruling O2).
