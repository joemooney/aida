    6. Exact env names: no XDG_* wildcard; enumerate the Bedrock/Vertex keys. Under Aida posture, drop ambient proxies in favour of TOOL_NET_ENV. Never GIT_ASKPASS, GIT_SSH_COMMAND, GIT_CONFIG_*, NPM_TOKEN or CARGO_REGISTRY_TOKEN. Drop a proxy URL that carries userinfo. Test: proxy_url_with_userinfo_dropped.
