  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: Round-5 fixes close prior findings 1-3 (control children execute /proc/self/exe with rename/unlink regression; auto-punt routes through self.control_child() and logs refusal; intake/clarify scoped AdvisorChildGrant with keyring-refusal + revocation tests; 12 TUI paths surface refusal reasons) and PR-C scope is met (profile-private prepare_launch, single issue_launch_child, ratchet 157->133), but CI at 7dcdba3ab1f9 is still entirely queued (run 42289630187; prior-head run 42288789494 also queued) so no green PR CI exists, and executing /proc/self/exe without arg0 renames every control child to argv0/comm ''exe''.. No triage reason was given.'
