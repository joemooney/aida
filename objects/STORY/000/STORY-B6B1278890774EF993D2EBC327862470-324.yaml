    3. MINOR test coverage (Probe 5, refusal paths): (a) autopilot_intake.rs:1014 and questions.rs:1661 now mint through issue_launch_child with session::sandboxed_child_grant(vendor, contained)?, which is a new keyring-required refusal for contained intake/clarify, but no test proves that refusal or that the grant is revoked afterwards. (b) The 12 TUI gestures turn an apply_control_env refusal into a bare false or generic failure (approve_spec, reject_spec, archive_spec, queue_for_*, spawn_drive), so the operator sees 'failed' with no reason. Nothing covers the refusal UX, and the accept_spec note path returns true on refusal without a message. Add a refusal-path test for each and surface the reason in the TUI status.
