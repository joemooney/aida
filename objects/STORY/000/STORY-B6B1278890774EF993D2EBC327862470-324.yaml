    ADVISOR RULING (round 3, PR #3288 at 6615dc76): this replaces earlier rulings on this PR. Findings:
    1. MAJOR ratchet gap (sketch 6(ii), amendment 8): story_2326_launch_ratchet_tests.rs markers() only flags Command::new when its argument text contains resolve_agent_program / .program() / plan.program or a vendor literal. The common spelling 'let program = resolve_agent_program(..); Command::new(program)' (or &program / agent_bin) is not counted. Unconverted examples it misses as constructors: compete_cmd.rs:1135, phase_driver.rs:2447, dispatch.rs:2548, session.rs:6952/7077/8550 (the A2 resume paths). Those are counted only through their protected env writes. A new vendor spawn that sets no protected key (the L1/L4 inherit-all failure mode) passes the ratchet, which contradicts the module doc 'A new site, in any crate, fails here'. Fix: track bindings assigned from resolve_agent_program/.program()/os_wrapped_program_and_args (or ledger every Command::new whose program is not a string literal outside an allowlist of non-vendor tools), and add a mutant for the two-line variable form.
    2. Amendment 8: the scanner has no detection or mutant fixture for CommandExt::exec or pre_exec. The amendment requires a mutant for each of .envs(, tokio::process::Command, CommandExt::exec and pre_exec. Only .envs( and the tokio alias are covered (scanner_catches_every_mutant_spelling).
    3. Amendment 9 goldens are missing for 5 of the 8 converted Claude paths. golden_interactive_claude_paths_are_unchanged covers build_claude_exec_command and build_run_claude_session_command, and background_handoff_env_has_no_seat_keys covers build_agent_new_bg_command. There are no owned-key and argv goldens for spawn_vendor_headless_forking, spawn_reviewer_launch_plan_granted, build_advisor_interactive_command, build_coordinator_headless_command_inner or run_agent_generation (agent new foreground, which has the listed PURPOSE removal). Also, the interactive goldens compare against the same interactive_claude_program_and_args helper the builder calls, not a recorded pre-change argv, so they cannot detect an argv change in that helper.
    4. F2 ruling test is incomplete: aida_posture_spawn_routes_through_single_boundary_fn asserts AIDA_BOUNDARY_CALLS only for exec and run session. The S-i ruling requires it to assert that every Aida-posture spawn reaches aida_boundary. Extend it to headless forking, reviewer plan, advisor interactive, coordinator headless and agent new fg/bg under contained=true.
    5. AIDA_AGENT_CMD under containment is not handled and not disclosed. Sketch 7 PR-A says 'AIDA_AGENT_CMD-under-containment [is] removed', and 2.2 lists it as a LaunchRefusal variant. launch_policy.rs declares AGENT_CMD_ENV, but nothing uses it. session.rs:5372 resolve_agent_program still swaps the program for a contained child, and LaunchRefusal has no variant for it. Either implement the refusal or strip in resolve() when posture is Aida or the parent is contained, or list it as a departure for an advisor ruling (F3-F5 do not mention it).
    6. The signed PR-A text departs in F3 (set_contained_env_for_children and the queue_cmd AIDA_SESSION_ROLE set_var are kept; sketch 7 says delete), F4 (only owned keys are scrubbed; signoff Q1 says 'PR-A strips and reinstates the AIDA namespace') and F5 (aida launch explain is deferred to PR-C). The PR body asks the advisor to rule on these, and the FORK comment never reached the spec. Under 'architecture changes require advisor signoff', these need a recorded advisor ruling on STORY-2326 before this can merge. A reviewer cannot accept them.
    7. Amendment 5 is not wired in production. refuse_posture_flags runs only on LaunchRequest.tail, and every converted site passes tail: Vec::new(). agent new's default_args (agents.toml default_flags) go in as args, so the 'refuse in both the tail and default_flags' requirement is test-only in this slice. The PR body discloses this, but it needs an advisor ruling (it overlaps F5 and PR-C). The flag table also omits posture-bearing spellings: Codex -s <mode> (the short form of --sandbox), --yolo, and -a/--ask-for-approval. Add them to posture_flag_at and the table test.
    8. Bypass seam (minor): LaunchContext::resolve_under(req, parent_contained) is pub(crate), so any crate code can build a LaunchContext with parent_contained=false and skip the monotonic and malformed-env checks. That contradicts the doc 'only LaunchContext::resolve builds one, so every launch passed the same checks'. Only tests call it. Make it #[cfg(test)] (or private, with a test-only wrapper).
    9. Q7 probe (minor): signoff Q7 answered 'yes, required' to the sketch's ask that PR-A record one real host probe of 'claude --bg --settings <file>' applying the env and sandbox blocks in its PR body. Amendment 10 says before PR-C. Neither the PR body nor the spec records it. Record it, or state explicitly that it moves to before PR-C.
    10. Ledger granularity (cosmetic): LEDGER entries are per-file counts. The sketch asks for an exact ledger of file + fn + purpose. With per-file counts, a site can move or be added inside session.rs (41) while another is removed, and the count stays equal. Consider keying the ledger by enclosing fn, at least for session.rs and agent_launch.rs.
    RULINGS: Fix (1), (2), (3), (4), (5) and (8) in this PR. For (5), strip AIDA_AGENT_CMD in resolve() when the posture is Aida (contained) and add a LaunchRefusal variant with a test. (6) Accepted as PR-A departures, recorded here. F3: set_contained_env_for_children and the queue_cmd set_var stay until PR-C deletes them. F4: owned keys only in PR-A; the full AIDA-namespace strip-and-reinstate lands in PR-C. F5: aida launch explain moves to PR-C. (7) Wiring default_flags refusal in production moves to PR-C with F5; add the missing posture-bearing spellings (Codex included) to the flag table now. (9) State in the PR body that the claude --bg --settings host probe moves to before PR-C. (10) Accepted: per-file counts for PR-A; the fn-keyed ledger is PR-C. LIGHT gate: one targeted cargo test -p aida-cli-lib <filter> plus make check-ci-fast. Push to the existing PR branch, then stop.
