    Findings:
    1. MAJOR liveness (Probe 5 fail-closed regression): launch/control.rs:31-41 control_child_with_current and aida-tui/src/redesign/mod.rs apply_control_env refuse unless canonicalize(program) == canonicalize(/proc/self/exe), but callers pass a separately resolved, cached path: RealPhaseDriver.aida_exe = resolve_aida_exe() (phase_driver.rs:672, OnceLock in kernel.rs:662), zen_drive_root resolve_aida_exe(), TUI crate::app::aida_exe() (OnceLock, aida-tui/src/exe_path.rs:9). aida dev build promote/rollback rotates live/aida into live/prev/ by rename (dev_build.rs:1216). A long-running drain or TUI then has /proc/self/exe -> live/prev/aida while its cached path canonicalizes to the new live/aida, so every phase-1 implementer, phase-3 reviewer and agent gate (phase_driver_trait.rs:347, :2066; orchestrator_leases.rs:1536), zen drive step (zen_drive_root.rs:337, :518, :963) and TUI gesture (approve/reject/queue/archive/drive) fails with 'control inheritance requires the canonical current AIDA executable'. After a second promote the old image is unlinked and canonicalize(/proc/self/exe) itself errors on the '(deleted)' target. The same refusal fires when an honored AIDA_BIN override (aida_bin.rs:76) or AIDA_BUILD_PROFILE resolves to a different build. Before this PR these children ran (BUG-766 intent). Fix: build the control child from the running image itself (Command::new(std::env::current_exe()/"/proc/self/exe")) and ignore or just log the caller's path, or compare file identity in a way that survives rename; add a regression test for a renamed or replaced image.
