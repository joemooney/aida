    ## 8. Open questions for the signer
    - Q1. Accept STORY-2326 as superseding TASK-1749, inheriting its signoff and C1/C2? I recommend yes. And is C1's "scrub first, allowlist last" ordering still what you want, given STORY-2326 names the allowlist as the goal? I recommend keeping it: PR-D is the allowlist, gated per vendor.
    - Q2 (TASK-1758). For Background sessions, resolve the seat only from the lane lease. A daemon-inherited role or grant without a lane fix falls to baseline. I recommend yes: it fails closed, and lane_env already computes the fix.
    - Q3 (TASK-1788, operator-held). Should a contained parent refuse `session resume` when the session's root is outside its own write roots? I recommend refusing: it is monotonic and fails closed. This needs the operator's ruling.
    - Q4. Forge credentials (GH_TOKEN/GITHUB_TOKEN, SSH_AUTH_SOCK) for agent children. Are they absent by default, with lanes pushing through `aida ship`/`aida pr`, which run host-side? Or are they on the Claude/Codex allowlist? I recommend absent. PR-D's dropped-keys report will show whether any lane path still pushes directly.
    - Q5. dispatch.rs `build_implementer_launch_command` (Codex `--full-auto` and agy, with no posture resolution). Delete it in PR-B if `aida dispatch` has no live caller, or route it through spawn_agent? I recommend routing it, since dispatch.rs:2767 still calls it.
    - Q6. Is the host-lane `allowWrite` for the cargo slot dir and the seat target dir acceptable as the one declared widening? And is sccache Off for every lane, including uncontained host lanes, acceptable at the cost of build time? I recommend yes to both. A shared sccache is a cross-seat cache-poisoning channel (ruling O2).
    - Q7. Should PR-A first prove, with one real host probe recorded in its PR body, that `claude --bg --settings <file>` applies the settings `env` and `sandbox` blocks to the daemon-run session? If it does not, PR-C falls back to the lane_env correction for env, and to the project `.claude/settings.local.json` written at lane creation for sandbox roots. I recommend yes; it is cheap, and PR-C's design depends on it.
