  content: 'Round 6 / PR #3531: fixed argv[0] to aida in the shared control-child constructor and all TUI control paths via apply_control_env. Added real subprocess argv0 tests and ProcFacts/loop_anchor coverage. Removed the ignored control_child path parameter, eager production phase-driver path storage, and stale replacement-image comments; fixture injection remains cfg(test). Repaired all eight reported lib CI guards: inventory the shared advisor builder and its callers, recognize scoped grant cleanup before result propagation, keep gate-owned issuance on the authority floor, centralize CLI selector transport reads, narrowly inventory the TUI selector transport read, and follow the relocated grant issuer. Updated the CLI alias guard and launch-policy/OVERVIEW contract. Validation: direct cargo test --profile agent -p aida-cli-lib --lib story_2326 passed 38 tests; final-source combined STORY-2326 plus eight reported lib guards passed 46; TUI STORY-2326 passed 4; CLI launch_aliases_delegate_to_the_tested_lock_boundaries passed 1; make check-ci-fast passed all 38 gates; cargo fmt --all -- --check and git diff --check passed. Native publication declaration recorded: [AI:codex] fix(launch): preserve control child identity and repair PR-C guards (Refs STORY-2326). Edits intentionally uncommitted for host publication. Finding 1 remains open until the host commits/pushes this round and exact-head PR CI is green; the expected supervised merge hold remains in place. No queue completion, merge, review recording, commit, or push was attempted from this seat.'
