    ## 8. Open questions for the signer
    - Q1. Accept STORY-2326 as superseding TASK-1749, inheriting its signoff and C1/C2? I recommend yes. And is C1's "scrub first, allowlist last" ordering still what you want, given STORY-2326 names the allowlist as the goal? I recommend keeping it: PR-D is the allowlist, gated per vendor.
    - Q2 (TASK-1758). For Background sessions, resolve the seat only from the lane lease. A daemon-inherited role or grant without a lane fix falls to baseline. I recommend yes: it fails closed, and lane_env already computes the fix.
    - Q3 (TASK-1788, operator-held). Should a contained parent refuse `session resume` when the session's root is outside its own write roots? I recommend refusing: it is monotonic and fails closed. This needs the operator's ruling.
