  content: 'Operator 21:18 refinement: track is a tag family ''track:<owner>''. No track tag = free for any launcher to grab. Values: track:main (main-track lanes, trains), track:integration (integration agent only), track:dell1 (dell1 feeder partition; local fill-slots/auto-rework skip it), track:operator (supervised, human-driven; no headless lane). A launcher only takes a spec whose tag is absent or names its own track. Ops autoland updated 21:41 to skip any track:* other than track:main.'
  created_at: 2026-11-13T04:41:26.881771590Z
  modified_at: 2026-11-13T04:41:26.881771590Z
