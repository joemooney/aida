  content: 'integration seat claimed 22:58 MST. Design: queue_fresh_pickup_policy returns OtherTrack(owner) when the spec carries track:<owner> and the launcher''s track (AIDA_TRACK, default main) differs, so queue work/next/list/drains all refuse or skip it with the reason; the work preflight names the track; completing a spec strips its track:* tags. Integration agent tagging on first merge stays a seat procedure (already in its brief).'
