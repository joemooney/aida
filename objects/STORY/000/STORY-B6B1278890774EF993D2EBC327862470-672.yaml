title: 'track:integration tag: every lane launcher refuses a main-track lane on an integration-track spec'
description: 'Operator 2026-11-12 20:59 (emergency): one track per spec, enforced by the spec tag ''track:integration'' instead of the hand-kept ~/.aida/autoland-skip. Done in ops (20:10): ~/bin/aida-autoland.sh launch_lane skips tagged specs. Remaining (product): ''aida queue work SPEC --role implementer'' refuses a tagged spec unless the launch targets the integration branch; the launch preflight lists the track; the integration agent tags a spec when it first merges one of its commits; a promotion that completes the spec removes the tag. Retire ~/.aida/autoland-skip after that.'
