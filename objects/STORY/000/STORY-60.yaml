title: 'aida session prune: delete Claude Code session metadata older than N days'
description: |
  Companion to the session-list-enrichment story. After running aida session list --all, users will inevitably want a cleanup command:

    aida session prune --days 30 [--dry-run] [--yes]

  Walks ~/.claude/projects/<projecthash>/ for the current project + any session-worktree projects, finds .jsonl files with mtime older than threshold, deletes them.

  ## Constraints

  - Read-only by default; --yes to actually delete
  - --dry-run prints what would be deleted with size/count
  - Skip any session whose id appears in an active aida lease (defensive)
  - Log deletions to .aida/session-prune.log so the action is auditable

  ## Not auto-prune

  Manual command, not background daemon. The user is the one who decides when to clean up.

  ## Why low priority

  aida session list --all + manual rm covers the use case today. Worth a dedicated command once the list-enrichment story lands and users start running --all routinely.
