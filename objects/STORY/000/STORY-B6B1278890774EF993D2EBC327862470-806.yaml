    REVIEW FINDINGS TO ADDRESS (STORY-2913):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c7c3eb65493e
    Recorded: 2026-11-19T00:39:15.927262426+00:00
    Findings:
    1. [P1] Preserve listed blockers when merging a test-gap class. In aida-cli-lib/src/gate/kernel_deps.rs:951-999, rank assigns every test-gap rank 2 even when it is unlisted and the finding is outside sensitive code, above a listed class at rank 1. With blocking_tiers=["data-loss"], a finding {"text":"data corruption","blocking_tier":"p3","class":"data-loss","file":"src/report.rs"} plus --finding-class untested-path replaces data-loss with untested-path; blocks then sees an unlisted p3/test-gap on ordinary code and defers it. Reversing the class channels also loses the positional listed data-loss class because the embedded test-gap wins. The PR can approve and auto-file a finding that the active list explicitly requires to block. Preserve the union of blocking effects, or rank by actual path-sensitive blocking under the current policy. Add regressions for both channel orders with an unlisted test gap and a listed class.
    2. [P1] Make the invalid-policy fallback actually block every finding. In aida-cli-lib/src/gate/kernel_deps.rs:1048-1049, Policy::AllBlock returns findings unchanged. For a malformed/unknown default-branch list (which previously refused recording), pass {"text":"authority bypass remains","severity":"major","blocking_tier":"security-authority-bypass","disposition":"deferred","rationale":"later"}. from_config_text chooses AllBlock, but this early return preserves deferred; review_verdict::finding_is_deferred/disposition_verdict then permit approval and follow-up delivery. Thus an invalid list can produce fewer blockers than a valid list, directly violating the advisor fail-closed invariant, and even the claimed security floor disappears. The new invalid-policy test uses only findings already marked blocking and misses this case. Ensure invalid/unavailable policy cannot honor reviewer-supplied deferrals (and reconcile the stated all-block default with existing explicit deferrals). Add regression coverage through the canonical verdict builder for security, p1 and unknown-tier findings carrying explicit deferred metadata.
    3. [Acceptance] Quote the active policy in default and invalid-policy reviewer launches. In aida-cli-lib/src/review_blocking.rs:65-70, launch_prompt returns an empty string whenever enabled is false, including unset, unreadable and invalid config. review_launch::review_prompt therefore omits the policy section (and for strict/no-forge launches returns None), so the launched reviewer receives no active-list/default provenance quote. AC5 explicitly requires every review prompt to quote the active list; the worksheet-only quote does not satisfy launches that never generate that worksheet, and hides invalid-policy fallback from the reviewer. Always include the short active-policy/provenance quote in the launch prompt, update the old None/Some expectations, and add launch tests for unset and invalid config.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
