    Reviewed HEAD: 1097003953 (round 3)

    Finding 1 (P1, inherited deferrals): new review_verdict::reapply_policy_to_stored_findings re-decides each stored structured finding (findings[i] + object finding_dispositions[i]) under an effective policy snapshot. It is applied in review_record_kind (kind/authority routing) and in the builder both to the incoming comparison object and to the retained obj when no new findings are supplied. The CLI recorder now takes ONE effective_warned() snapshot and passes it to apply_policy, review_record_kind and build_verdict_object_with_effective (both the verdict and handshake builds). Malformed shapes (length mismatch, non-array, null/non-object metadata, empty text) are left as stored, where disposition_verdict already refuses; a stored text that looks like JSON is never re-parsed into a deferral (probe 4). Unset policy is a no-op (explicit deferrals keep today's meaning).
