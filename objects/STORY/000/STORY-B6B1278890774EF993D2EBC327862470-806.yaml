title: 'Review blocking tier: free, configurable class list (default = today), auto-filed follow-ups, operator/mandate authority to change, visible in config show and review prompts'
description: |
  Follow-up slice of TASK-3814 (#4207). Advisor ruling 2026-11-18 09:20; operator ask (Joe 09:19, "make that configurable"). #4207 ships `[review] blocking_tiers` over a fixed set (p1, data-loss, acceptance), plus a blocking rework that adds a security/authority-bypass class. This slice makes the tier fully configurable.

  ## Acceptance
  1. `[review] blocking_tiers` accepts a free list of finding classes from a documented registry (at least p1, p2, p3, data-loss, security-authority-bypass, unmet-claimed-ac, test-gap, style). Unknown classes refuse to parse.
  2. Default = today's behaviour (every finding blocks). This repo sets ["p1", "data-loss", "security-authority-bypass", "unmet-claimed-ac"] (operator ruling 09:18).
  3. Non-blocking findings are AUTOMATICALLY filed as follow-up specs linked to the PR's spec (deduplicated by finding hash), and the PR is approved.
  4. Changing the list needs operator or mandate authority (it decides what counts as a defect). The change is audited.
  5. `aida config show` lists the effective tier with provenance, and every review prompt quotes the active list.
  6. Tests: default behaviour unchanged; a custom list blocks only its classes; follow-ups auto-filed; an unauthorized change refused.
