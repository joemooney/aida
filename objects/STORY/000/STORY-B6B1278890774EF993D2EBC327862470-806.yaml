  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-2913):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c2047ff6ac25
    Recorded: 2026-11-19T03:37:51.689967091+00:00
    Findings:
    1. [P1] Reapply or validate the current blocking policy on completed draft replay. In aida-cli-lib/src/review_commands.rs:3319-3345, only the non-replay branch calls build_verdict_object_with_effective. The replay branch calls restore_pending_handoff, which returns a completed (non-sweep_pending) record unchanged at gate/review_verdict.rs:3322-3323. Source reproduction: record a standalone draft with verdict request-changes and a structured p2 finding under trusted blocking_tiers=["p1"]. Policy routes that finding to a follow-up and records approved. Then make the trusted list invalid, unreadable, or include p2, and retry the same completed launch/draft. check_replay recognizes the launch/digest and returns the old approved record. The new policy correctly makes the incoming finding blocking and routing kind request-changes, but the explicit-approval refusal does not run because the original draft says request-changes. restore_pending_handoff then restores the old approved record with deferred metadata, and the recorder writes that object and clones it into the handshake. Thus routing/hold behavior says request-changes while the canonical review remains approved under a policy that requires the finding to block. This bypasses the fail-closed/current-policy invariant through the supported parent replay path. Reapply the held policy snapshot to completed replay findings, or refuse replay when its policy-normalized result differs; ensure the written record and handshake agree with the routing kind. Add a parent-recorder regression for completed request-changes drafts normalized to approval, followed by invalid/unavailable/newly blocking policy changes. Pending-delivery replay already compares metadata; cover completed replay separately.
    2. [P2] Refresh the store-writer inventory for the renamed recorder implementation. scripts/store-writers.toml:1817-1818 still attributes write_verdict_object_for_spec and rework_hold_release::auto_release to handle_review_record_context_at, but this PR moves both sinks into handle_review_record_context_with_policy_at. Exact-head CI job 135312674492 fails check-store-writers.py with two unclassified additions and two stale rows; job 135312674489 fails the same inventory check, causing the Build aggregate failure. Update the two inventory identities and enclosing-item fields after inspecting the moved implementation, retaining their existing lock/gate/disposition evidence. This is confirmed inventory drift, not a Rust compilation error or an environmental containment failure.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
