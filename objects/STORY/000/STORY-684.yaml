title: Advisor-role code-write invariant must be a SUBSTRATE gate, not just a Claude PreToolUse hook (evaporates for Codex)
description: Uncovered gap (TASK-0421 inventory) + a substrate-as-bouncer concern. The "advisor role must not write code" invariant (STORY-670) lives ONLY in aida-advisor-code-guard.sh, a Claude PreToolUse hook. For a non-Claude agent (Codex) the hook does not run, so the invariant evaporates. Per the substrate-as-bouncer principle, a load-bearing invariant must be enforced programmatically (an MCP/CLI write-gate or git pre-commit), not in a vendor-specific hook. Move/duplicate the gate to a vendor-neutral layer. trace:TASK-0421
