  content: 'Operator 2026-11-07 18:17: the working reference implementation is ~/ai/aida-relay/bin/relay.sh (also at ~/ai/aida-relay-worktrees/runner/bin/relay.sh). Operator''s invocation: relay.sh --batch --use-existing --handoff-file ~/ai/aida/.aida/handoff/lib-split/latest.md --sessions-dir ~/ai/aida/.aida/relay-sessions-lib-split --max-sessions 12 -c 100k-180k --prompt-file ~/ai/aida/.aida/handoff/lib-split/prompt.md. It owns context-range rotation (-c min-max; --context-min soft and --context-max hard), archives the handoff, applies rate-limit circuit breakers, and does SIGTERM-then-SIGKILL child handling. For the advisor it needs --handoff-seat advisor --force-seat. Implementation options: (a) port that loop into ''aida agent new'' rotation (preferred, one launcher), or (b) have the aida shell function or ''aida agent new'' delegate to relay.sh when it is installed. Either way acceptance (1)-(5) above stands.'
