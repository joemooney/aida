  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3668):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1f900087fa69
    Recorded: 2026-11-08T07:04:30.385258768+00:00
    Review comment: https://github.com/joemooney/aida/pull/3668#issuecomment-6718538738
    Findings:
    1. BLOCKING [correctness] ci/gdma/run-upstream.py:214 raises 'Unsupported upstream runner' for any runs-on other than the literal matrix.os, and context() at :179-185 has no runner.environment, so condition() raises 'Unknown workflow context' on the new ci.yml step ifs. validate_job runs before any upstream command, so .gitlab/ci/gdma.yml:24 fails every lane, and tests/test_gdma_ci.py:65 (test_every_current_ci_expression_and_shell_is_supported, in the gates shard) feeds it the real ci.yml. Fix: teach the adapter the guarded runs-on shape and a runner.environment of github-hosted-equivalent, with the fixture still asserting the refusal of other runners.
    2. MAJOR [correctness] scripts/runner/one-job.sh:18: find's -perm /022 matches every symlink (lstat mode 0777; reproduced locally), so any symlink in /opt/aida-actions-runner makes the launcher exit. The runner bundles Node, whose bin/npm and bin/npx are normally symlinks; tarball contents not confirmed because the download was blocked by network policy. Exclude symlinks from the mode test (! -type l) while still requiring root ownership of them.
    3. MAJOR [correctness, plausible] scripts/runner/check-prerequisites.sh:16 probes bwrap without --dev /dev --proc /proc, but the suite's bwrap_live probes use them (e.g. aida-cli-lib/src/tests/task_2053_s4b_seat_trees_tests.rs:11-15). one-job.sh:45-48 sets ProtectKernelTunables/ProtectProc, which overmount /proc and are known to make a fresh proc mount in a user namespace fail with EPERM (not reproducible in this sandbox). The check can pass while those tests silently skip on dell1, since the heavy shards do not set AIDA_REQUIRE_BWRAP_LIVE, contradicting the fail-closed claim at ci.yml:155. Make the probe match the tests and smoke it under the real unit properties.
    4. MAJOR [design] ci.yml:32 sends four heavy shards per run to dell1 with no failover, but one-job.sh serves one job per manual operator command and flock allows one invocation (dell1-runner.md:16-18, 'Repeat the operator command'). With AIDA_DELL1_CI=true every same-repo PR needs four sequential human invocations or its required shards sit queued, the opposite of STORY-2672's goal and short of the ruling's 'one job then re-register'. Provide a supervised operator-credentialed re-arm loop, or scope routing to what one armed runner can serve and say so in the runbook.
    5. MINOR [test-coverage] Strict-tier refusal paths are untested: tests/test_self_hosted_runner.py covers routing and sudo steps only. Nothing exercises one-job.sh refusing non-root invocation, a root or supplementary-group runner account, a writable distribution, or an empty JIT config, nor check-prerequisites.sh refusing root, sudo or operator-home access. The symlink defect above would have been caught by such a fixture.
    6. MINOR [operability] scripts/runner/one-job.sh:12-20 and check-prerequisites.sh:4-12 use bare [ ] / command -v under set -e, so each refusal exits with no message naming the failed condition; the operator and CI log get no reason. Print the failed requirement before exiting.
    7. MINOR [plausible] docs/internal/testing/dell1-runner.md step 3 and check-prerequisites.sh omit zstd; @actions/cache falls back to gzip without it and misses caches saved by hosted runners, adding cold builds against the 40-minute job timeout. Add zstd to the install list and the check.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
