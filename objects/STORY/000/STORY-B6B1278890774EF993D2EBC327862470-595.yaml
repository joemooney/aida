    1. BLOCKING [correctness] .github/workflows/ci.yml:48 uses runner.environment in jobs.build.env, where GitHub does not provide the runner context (job-level env allows github, needs, strategy, matrix, vars, secrets, inputs). Run 42457906995 at f1802292a7c3 has zero jobs and gh reports 'This run likely failed because of a workflow file issue'; the only ci.yml change since 1f900087fa6, whose CI did start, is this line. CI (including the required aggregate) therefore cannot run at this head, and merging it would stop CI on main. Fix: remove the job-level entry and have the 'Verify self-hosted prerequisites' step, already gated on runner.environment == 'self-hosted', append AIDA_REQUIRE_BWRAP_LIVE=1 to $GITHUB_ENV after the probe passes.
