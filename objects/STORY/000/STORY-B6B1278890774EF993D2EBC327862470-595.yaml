title: 'CI capacity: add a self-hosted GitHub Actions runner on dell1 (20 idle cores) so test shards stop queueing behind the hosted-runner concurrency cap'
description: 'Observed 2026-11-07 21:00: 7 CI runs queued + 6 in progress on GitHub-hosted runners (no self-hosted runners registered); each run is ~8 jobs, so merge trains waited 40+ min on CI while dell1 sat at load 0.3. Operator decision needed (registration token, trust of running private-repo CI on dell1). Acceptance: runner registered with a label; heavy shards (lib-0/1, cli-0/1) route to it via runs-on labels with hosted fallback; median train CI wait measured before/after.'
status: InProgress
priority: Medium
owner: joe.mooney@gmail.com
feature: Uncategorized
