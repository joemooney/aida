    Recorded: 2026-11-08T07:55:37.877847012+00:00
    Review comment: https://github.com/joemooney/aida/pull/3668#issuecomment-6718981676
    Findings:
    1. MAJOR [correctness] scripts/runner/one-job.sh:25 runs every job under a random mktemp path, which makes the Rust cache unusable on dell1. Swatinem/rust-cache@v2 (ci.yml:170-173) passes absolute paths to restoreCache and saveCache: CARGO_HOME/registry, CARGO_HOME/git and <workspace>/target (rust-cache src/config.ts:14,148-149,265,276; dtolnay/rust-toolchain exports CARGO_HOME=$HOME/.cargo). @actions/cache hashes those literal path strings into the cache version (toolkit cacheUtils.ts getCacheVersion). HOME and the workspace both sit under /var/lib/aida-ci-jobs/job.XXXXXXXX, so each dell1 job gets a unique version: it can never hit a cache, and because save-if is true for lib/cli it then saves a new multi-GB entry. Result once AIDA_DELL1_CI=true: every heavy shard is a cold workspace build against the 40-minute timeout (ci.yml:43 notes healthy cached runs already take 17-25 min), and the per-job entries compete for the repo cache quota and can evict hosted caches. The runbook mentions cold builds only as something to measure, and the capacity numbers STORY-2672 requires would be taken in this state. Fix: since the flock already guarantees one runner, use a fixed job path (e.g. /var/lib/aida-ci-jobs/current, wiped per run) so main-branch pushes warm a dell1-only cache, or set save-if false for self-hosted and document always-cold. Add a fixture that the launcher job path contains no per-run random component. Reasoned from action source; not run on dell1.
    2. MINOR [operability] The provisioning list and probe omit two tools hosted images supply. (a) jq: the pinned taiki-e/install-action main.sh:676-705 needs jq and, when it is absent, calls sudo apt-get, which cannot work under NoNewPrivileges with no sudo rule, so "Install cargo-nextest" fails on every test shard. (b) openssh-client: aida-cli-lib/src/gate/review_publication/tests/admission_tests.rs:58 unwraps ssh-keygen and panics when absent, while story_2492_publication_tests.rs:38 silently skips the trusted-node signature tests, which is a skip the fail-closed probe is meant to prevent. Add jq and openssh-client to docs/internal/testing/dell1-runner.md step 3 and to the tool loop at scripts/runner/check-prerequisites.sh:6 (ssh-keygen as the probe name), and extend the refusal fixture.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
