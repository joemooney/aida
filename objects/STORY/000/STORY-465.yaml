title: 'aida status: top-priority ''Awaiting you'' section aggregating all human-gate items (PRs ready to merge, briefs for you, findings to triage, escalations)'
description: "## Friction\n\naida-chat had 5 MERGEABLE PRs sit OPEN for hours because nobody noticed the cascade was ready. No CI to wait on, no reviewers to wait on — purely the human gate. But 'aida status' didn't surface this prominently; the operator + advisor had to ASK 'is any progress being made?' to discover the system was just waiting on them.\n\nGeneralizes: the whole point of multi-agent dispatch is to make the human's intervention the ONLY bottleneck. If the bottleneck is invisible, it stays the bottleneck forever (nobody decides because nobody knows a decision is needed).\n\n## Proposed shape\n\nNEW 'Awaiting you' section at the TOP of 'aida status' (above Session, above Queue), surfacing every item where the operator is the gate:\n\n  ─── Awaiting you (5) ───\n    🟢 PR-1 ready to merge (aida-chat#1, EPIC-16 MCP foundation) — no CI, mergeable\n    🟢 PR-2 ready to merge (aida-chat#2, STORY-21 backend) — no CI, mergeable\n    🟢 PR-3 ready to merge (aida-chat#3, STORY-21 frontend) — no CI, mergeable\n    📬 1 brief filed for you: aida-chat advisor cross-project sync (claude/<file>.md)\n    🔍 4 findings awaiting triage (aida findings list)\n    🗣️ 1 escalation from headless drain (NeedsAttention spec SPIKE-12)\n\n  Each line has a recommended command in --verbose mode.\n\n### Items that qualify as 'awaiting you'\n\n- **Open PRs that are mergeable + have no pending CI + no requested-changes reviewer verdict**. Specifically NOT showing PRs waiting on CI (those are 'awaiting CI', different status) or PRs with RequestChanges (those need rebase/fix first).\n- **Briefs filed for the current user/role** that aren't acked yet\n- **Findings awaiting triage** (aida findings list count)\n- **Reviewer queue items where the verdict is yours**\n- **Escalations from headless drains** (NeedsAttention specs)\n- **Cross-project sync messages** (aida-chat → master, etc. — when this becomes a substrate primitive)\n\n### Items that DO NOT qualify (different gate)\n\n- PRs with CI pending → 'awaiting CI' (separate section or no section)\n- PRs with reviewer assigned but unverdicted → 'awaiting reviewer'\n- Specs in-progress with active leases → 'in flight'\n- Substrate hygiene findings (orphan branches, drift) → 'hygiene' (STORY-464's section, NOT this one)\n\n### Display rules\n\n- Show count in section header ('Awaiting you (N)') for immediate scan\n- When N==0: HIDE the section (don't add noise to a quiet day; the absence is the signal)\n- Order: PRs first (most actionable), then briefs, then findings, then escalations\n- Each line includes the resolution verb (gh pr merge, aida brief read, aida findings, etc.)\n- '--verbose' lifts the cap from N=5 to all items\n- 'aida status --awaiting' shows ONLY this section (focus mode)\n\n### Implementation\n\nReuse existing surfaces:\n- 'gh pr list' for open PRs + classification\n- 'aida brief list --for-agent <current-user-or-role>' for briefs\n- 'aida findings count' for triage queue\n- 'aida queue list --for reviewer' for review items\n- 'aida list --status needs-attention' for escalations\n\nThe new code is the CLASSIFIER (which open PRs are 'mergeable + no CI + no reviewer' → 'awaiting you') and the RENDERER (the aggregated top section).\n\n## Why this matters strategically\n\nThe substrate-as-product thesis (CLAUDE.md positioning) lives or dies by whether the operator can SEE what needs them. Today's status shows 'state'; this story makes it answer the actual question: 'what do I need to do RIGHT NOW?'\n\nFor solo devs (the Trojan-horse entry point): immediate clarity on next action.\nFor multi-agent operators: the bottleneck-surfacing layer that prevents the aida-chat-style 'PRs sat for hours' case.\n\nCompose with STORY-464 (passive doctor hygiene at bottom of status) for the full top-to-bottom information architecture:\n\n  TOP    ─── Awaiting you (N) ───        URGENT, human-gate\n         ─── Session ───\n         ─── Branch ───  \n         ─── PR / CI ───\n         ─── Queue ───\n         ─── Active leases (others) ───  IN FLIGHT\n         ─── Project ───\n         ─── Requirements ───\n  BOTTOM ─── Hygiene (M) ───              PASSIVE, drift\n\n## Acceptance\n\n- [ ] New 'Awaiting you' section at TOP of 'aida status'\n- [ ] Aggregates: open mergeable PRs (no pending CI, no RequestChanges), unacked briefs for current user/role, findings count, reviewer queue items needing your verdict, NeedsAttention escalations\n- [ ] Hidden when count is 0 (quiet days stay quiet)\n- [ ] '--verbose' lifts the cap; '--awaiting' shows only this section\n- [ ] Each line includes resolution verb / command\n- [ ] Performance: section adds < 100ms to status invocation\n- [ ] Tests: with 0 awaiting items (section hidden); with 5 PRs awaiting (5 lines + count); with PRs in mixed gate-states (only the mergeable ones surface here, the rest in PR section)\n\n## Composes with\n\n- STORY-385 (aida status --cleanup — sibling for cleanup-actionable; this story is for action-required)\n- STORY-456 (worktrees + open PRs section — provides the PR data this section classifies)\n- STORY-457 (working-tree state — different concern)\n- STORY-464 (passive doctor hygiene — bottom of status; this is top)\n- BUG-376 / BUG-378 (substrate-as-bouncer ceiling fixes — same operator-clarity principle)\n- feedback_match_operator_mode_specific_when_execution (when operator wants action, show actions; this is the surface)\n\n## Origin\n\n2026-05-24 user during multi-agent dispatch session: aida-chat had 5 mergeable PRs OPEN for hours because nothing surfaced the human-gate state. User to master: 'the question I am asking with whether in this case the fact that the system is waiting on a human, does that show in say aida status, how to make that more obvious?'\n\nMaster's analysis: gap is real; existing sections scatter the human-gate signal across PR/queue/findings; need a top-priority aggregator. The substrate KNOWS this state (mergeable + no CI + no reviewer = ready); it just doesn't SAY it loudly.\n\ntrace:STORY-X"
