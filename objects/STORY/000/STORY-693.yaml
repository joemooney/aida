title: 'EPIC-54: in-process data access — TUI reads specs/lists via aida-core, drop the per-read subprocess shell-outs'
description: |-
  The TUI reads ALL data by shelling out to fresh `aida`/`gh` subprocesses (preview_via_show, fetch_status, fetch_prs; the redesign's scope-list fetch + show/why verbs). Each read forks a ~287MB binary and cold-starts the full AIDA runtime (config load, store attach, cache open + freshness check) — that is the source of the show/preview/PR-nav lag (same root cause as BUG-619). aida-tui does not even depend on aida-core, so it has no in-process data access.

  FIX: aida-tui depends on aida-core (minimal features) and reads specs + lists IN-PROCESS via the cache-backed backend (aida_core::CachedGitBackend — the same path the CLI list/show uses), no subprocess per read.

  CONVERGENCE: once a spec is loaded as STRUCTURED data in-process, rendering it natively (markdown body + color-coded fields) is the same work — so this also delivers STORY-689/691's nice preview, replacing the captured-stdout modal.

  SCOPE for this increment (the redesign module first; existing TUI untouched):
  - Add aida-core dep (minimal features — the read path needs neither postgres nor the forge features).
  - Build the CachedGitBackend once from the project root; reuse it for the scope item lists (Backlog/Open) and the show modal — in-process.
  - Render the loaded spec natively in the show modal (structured fields + body), replacing the `aida show` stdout capture.
  - `why` may remain a shell-out for now (its classifier lives in aida-cli/burndown.rs, not aida-core; factoring it is a separate task) — note it; do not block on it.

  ACCEPTANCE:
  - aida-tui depends on aida-core; the redesign scope-list fetch and the show modal load in-process (no Command::new per read).
  - show is instant (load from the open cache, microseconds) — no per-read subprocess cold-start.
  - the show modal renders the spec's structured fields + body natively (not captured `aida show` stdout).
  - build/test/fmt/clippy green; in-process load covered by a test where feasible.
  - existing TUI (non-redesign path) unchanged.

  ## Test Plan

  1. Cursor up/down through scopes and press **p** on several specs in a row → **expect** the preview opens **instantly**, no lag/spinner. (Previously this shelled out `aida show` per keystroke — a ~287 MB process each time.)
