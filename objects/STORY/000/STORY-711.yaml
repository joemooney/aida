  content: 'RESHAPED (operator 2026-06-27): split this. (1) The branch/worktree-LOCK half targeted the two-agents-one-tree collision — but a lock on a SHARED tree treats the symptom; the real fix is ISOLATION (each agent its own clone/worktree) = EPIC-46/47 multi-clone work. That half moves there, not built here. (2) What survives in STORY-711 is the ADVISOR-AUTHORIZATION GATE: an agent refuses to commit unless it can verify it is acting for an advisor that authorized this work (a fail-safe, substrate-as-bouncer like STORY-684 commit gate). This BUILDS ON BUG-637 spec-claim/lease — it is the enforcement layer on top. So STORY-711 is now a FOLLOW-ON to BUG-637, scoped to the authorization gate only.'
