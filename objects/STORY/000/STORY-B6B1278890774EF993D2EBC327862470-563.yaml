    Implementation handoff for STORY-2640, following the binding advisor ruling. Edits are uncommitted; publication remains the host launcher's responsibility.

    Both modes are implemented in this change. Native/host publication commits locally, runs an exact host-initiated make check-ci-fast job, offers one repair round on red, checks the repaired head, and annotates publication with the final marker. Self-pushing lanes gate after PR discovery, annotate the result, and queue one repair before review-watch can admit a reviewer. Host-owned branch receipts hold review admission through gating, queued repair, and native publication/annotation. Publication checks the actual imported tip against the gate receipt, refusing a head changed by reconciliation instead of publishing stale evidence. Punt and hold vetoes remain checked; failed repair exits retain Refs commit treatment.

    The gate shares the BUG-2383 execution engine, cleared environment, read-only filesystem profile, seat target, and host-only results. Make jobs add network, IPC and PID namespaces; the host refuses writable paths overlapping the results. The timeout is 300 seconds. There is no unsandboxed fallback; unavailable bubblewrap records skipped(no-sandbox). Gate jobs do not count as executed cargo tests.

