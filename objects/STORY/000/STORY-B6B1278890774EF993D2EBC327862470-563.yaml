    Reviewed commit: 31eadc2c2d76
    Recorded: 2026-11-08T18:27:12.636498144+00:00
    Findings:
    1. [major] Child grant is no longer revoked on standalone error exits (regression of the BUG-2139 invariant). In standalone_implementer.rs run(), 'let mut finished = finished?' (line ~1149) and 'lane_fast_gate::native(...)?' (line ~1159) now return before revoke_standalone_implementer_grant(launch.child_grant) (line ~1179). On origin/main, finished? ran after the revoke. Scenario: a contained Codex lane hits a vendor spawn or loop error, a NativeCommitError, or an uninspectable seat (the path native_error now deliberately propagates); the launcher exits Err with the child's grant still live until expiry. session.rs keeps this right by gating inside the closure and revoking before result?. Fix: revoke on every exit (RAII guard, or capture the fast-gate Result and apply ? after the revoke), and add a test asserting a Grant-variant child is revoked on those paths; story_2640_fast_gate_real_lane_exit_paths_settle_reservations uses HeadlessChildGrant::Baseline and asserts only the marker.
    2. [minor] A real gate result can be discarded while reading its output. run_fast_gate (lane_job.rs:~1805) uses File.take(1 MiB).read_to_string, which errors on any non-UTF-8 byte, including a multibyte character split at the 1 MiB cut. The rc was already read, but the Err goes attempt -> native_error -> infrastructure, so a red head becomes fast_gate=skipped(infrastructure), gets no repair round and publishes (AC1). Separately, output over 1 MiB keeps the FIRST 1 MiB, so tail(100) omits the failing gate named at the end and the repair prompt lacks it. Fix: read the last bytes of the file and decode lossily; test with non-UTF-8 and oversized output.
    3. [minor] A self-pushing lane can report fast_gate=pass for a head that was not published. pushed_inner gates the seat HEAD, but a seat with an unpushed commit has HEAD != PR head; annotate_fast_gate then refuses on 'change head moved', and pushed_round keeps marker=pass (lane_fast_gate.rs:~677-688), so the result line claims pass for an unchecked PR head (spec: gate 'at the head it is about to publish'). Fix: compare the snapshot with the lookup_pr head first and report skipped(<reason>) on mismatch unless a known fail applies; add a test.
