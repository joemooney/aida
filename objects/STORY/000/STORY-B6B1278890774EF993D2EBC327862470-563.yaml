    REVIEW FINDINGS TO ADDRESS (STORY-2640):
    Verdict: CHANGES REQUESTED
    Reviewed commit: a3e125babafe
    Recorded: 2026-11-08T01:18:10.030612321+00:00
    Findings:
    1. [major] Fast-gate holds can still wedge review forever. Cleanup lives only in Reservation::drop (lane_fast_gate.rs:82-105); there is no signal handler, no lease-liveness check or TTL in blocks_review (:132-147) and no operator clear for .aida/fast-gates. A host lane process killed by SIGKILL, SIGINT, the watchdog, OOM or a reboot between reserve() and drop leaves pending=true, so review_watch.rs:2471 skips that PR forever. Same wedge when repair queueing fails: pushed_round :547-548 queue_repair()? returns with pending=true, head=Some and repair_queue=None, and Drop does not settle it (head is Some, native_ready false). The test queue_error_keeps_review_blocked_without_consuming_repair (:941-956) asserts this permanent block. Reachable through the :493 ensure (spec terminal, 'no repair queued'), validate_brief_agent, or brief/store write errors. Fix: release a pending hold once its owning lease is gone (or after a TTL), settle a failed queue insertion as reviewable with fast_gate=fail, add an operator release, and test the killed-lane and queue-failure cases.
    2. [major] Native publication failures are now swallowed (breaks AC3). session.rs:6798-6808, queue_cmd.rs:9121-9131 and standalone_implementer.rs:862-876 replaced publish_queue_exit(...)? with 'if let Err -> lane_fast_gate::infrastructure()'. exec_vendor_headless and the queue resume then process::exit with the vendor's status, so a lane whose push, bundle import or check_import refusal failed exits 0 with no PR. Before this PR it returned an error. native() also turns a post_exit_commit Failed result (previously 'host post-exit commit failed') into Ok(false). On top of that, infrastructure() (:109-125) overwrites a recorded 'pass' with 'skipped(infrastructure)' for a non-gate error, so a publication failure is reported as a fast-gate problem. Fix: settle the receipt and print the marker, then propagate publication/commit errors as before. Use skipped(infrastructure) only for gate-execution errors, and never downgrade a known pass/fail marker for an unrelated error. Add a test where the gate passes, publication fails, and the lane exits non-zero with fast_gate=pass.
    3. [minor] An unchanged lane can lose its advisor notice: ship_from_seat.rs publish_queue_exit notify closure (~:546-563) runs lane_fast_gate::publication_ready(...)? and finish_publication before advisor_request. A stale or pending receipt therefore suppresses the 'Queue-work lane exited without changes' advisor request, and finding 2 then swallows that error. Send the advisor request regardless of gate state, or report the refusal to the advisor.
    4. [minor] Cold-target timeouts spend the one repair round. lane_job.rs run_fast_gate uses SeedNote::new(None, ...): no target seed or overlay, unlike the seat's own cargo jobs. The timeout is a fixed 300s, and gate_result (lane_fast_gate.rs:251-257) maps TIMEOUT_RC to 'fail'. The implementer's own evidence: a cold private target timed out twice (rc=124), and warm runs took 232-239s, about 78% of the budget. A lane on a cold or slow target burns its repair round on a prompt it cannot fix, then publishes fast_gate=fail. Run the gate on the lane's warmed target overlay, or report TIMEOUT_RC as skipped(timeout) without spending the repair round.
    5. [cosmetic] Per-change notes were prepended to AGENTS.md (:1-5) and OVERVIEW.md (:1591-1608). The repository CLAUDE.md says per-change notes go in the PR body and the spec comment, because every prepended paragraph conflicts with each open PR. Drop the AGENTS.md paragraph and trim OVERVIEW to the architecture-level statement (host-run sandboxed gate, one repair round).
