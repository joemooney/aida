    - aida-cli-lib/src/standalone_implementer.rs
    - aida-core/templates/.aida/discipline/rework-brief-craft.md
    - .aida/discipline/rework-brief-craft.md (generated mirror)
    - scripts/store-writers.toml (regenerated and reviewed; only this change's additions and moved run_one sinks)

