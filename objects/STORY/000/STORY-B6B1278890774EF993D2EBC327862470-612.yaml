  author: joe
  content: 'Sketch (advisor 2026-11-08), for review before implementation. New record NeedsRuling{question, spec, pr, head, raised_by, seat, raised_at} stored in the substrate, created by a design-fork punt or a reviewer verdict''s explicit needs-ruling field, never parsed from prose. Keyed (spec, question hash) so repeats add no new record. aida awaiting lists these first, oldest first, with age. Dispatch suppression: while one is open for a head, rework routing refuses with its id; a STORY-2688 NeedsRuling state does the same. aida rule <id> records the ruling comment, clears it and requeues exactly once. Open fork: whether an unruled record escalates to the operator after a fixed age. Depends on STORY-2688 S1. Needs advisor signoff by an independent read.'
