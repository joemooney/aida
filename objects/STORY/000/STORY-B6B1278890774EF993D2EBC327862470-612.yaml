title: 'Typed needs-ruling blocker: a design fork becomes an aged record shown first in aida awaiting, and lanes stop retrying it'
description: 'Problem: on 2026-11-08 PR-3661''s design fork was punted repeatedly and the request for an advisor ruling existed only in verdict prose, so lanes kept being sent and the PR sat. Requirement: a design-fork punt or reviewer finding creates a typed blocker naming the question, spec, PR and owning seat, with an age. It heads aida awaiting, suppresses further rework dispatch for that head, and a recorded ruling clears it and requeues. Acceptance: a repeated punt yields one blocker and no new lane; a ruling requeues exactly once. Depends on STORY-2688 for dispatch suppression.'
