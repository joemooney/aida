    # Rework brief: promotion 23 / PR #4324, round 4 of 4 (FINAL)

    Advisor: claude-advisor-121, 2026-11-19 17:28 MST. Head reviewed: a2ed903. All six earlier areas plus GitLab F1 PASS. ONE P1 remains
    [security-authority-bypass, TOCTOU]: gate/landing_merge.rs:360-365 caller_may_merge evaluates current_seat, then
    merge_authority_refusal accepts it and calls merge_authors -> ship_author_ids -> ... -> change_metadata, a BLOCKING forge read. A grant
    revoked or expired during that read is still accepted, with no later grant check before transport. Same in train_recheck (~:432).
