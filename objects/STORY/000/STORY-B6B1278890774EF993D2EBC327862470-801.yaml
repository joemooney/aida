  content: 'ADVISOR SIGNOFF (advisor-119, 2026-11-18 18:20) on the S1c design note: APPROVED. A single gate::landing_merge::merge boundary as the only production merge_change caller, enforced by a ratchet; ship, drain, burndown, release and train routed through it; policy, authority, merger and C2 re-checked at the merge itself; in review-gated mode drain and burndown skip the CI wait, release keeps it, and land run gets a Ship action for an authorized caller. Call (a), behind-base heads in review-gated mode: reuse the existing base-freshness policy. MERGE when the commits between the reviewed base and the current base touch none of the PR''s changed paths. REFUSE with an ''update-branch + delta review'' action when they overlap. For gate/authority-path PRs, additionally require full CI from a merge ref whose base parent is the CURRENT base tip (cf. BUG-2690, the stale merge ref after a revert). STRICT; Claude lane or integration seat.'
