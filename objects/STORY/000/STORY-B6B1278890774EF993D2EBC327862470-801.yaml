title: 'Landing S1c: every merge path honours [landing] (drain, burndown, release; land run ships READY with no train)'
description: |
  Slice S1c of STORY-2897, split off by the advisor's ruling on #4251 round 3 (2026-11-18 04:25 MST). S1 (#4251) enforces `[landing]` in `aida pr ship`, `aida pr train` and `aida land run`'s train boarding. The other production merge paths still call `Forge::merge_change` without reading the landing policy.

  Constraint (advisor): S3 must not switch this repo to review-gated before S1c lands.

  ## Acceptance
  1. Every production merge path honours `[landing]`: the drain (phase_driver_trait / auto_complete), burndown_run and upgrade_release. That covers merger authority (advisor-only, plus the C2 author exclusion under both values), mode (no CI wait in review-gated), and routing (use_train never/always/when-behind). Enforcement sits at one shared merge boundary that all of them pass through, so a new caller cannot skip it. Regressions cover each caller.
  2. `aida land run` with `use_train = "never"`: when this caller may merge (merger rule plus authorship), a READY main-track change gets a Ship action that runs the ordinary gated `aida pr ship` once. A caller that may not merge only reports readiness. Regressions cover an authorized loop shipping once and an unauthorized loop staying report-only.
  3. Docs: the landing page lists which commands honour `[landing]`.
