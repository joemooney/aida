    # Rework brief: promotion 23 / PR #4324, round 3 of 4

    Advisor: claude-advisor-121, 2026-11-19 16:10 MST. Head reviewed: 98f00ce. F2-F6 PASS; GitHub F1 PASS. ONE finding [P1]:
    GitLab merge loop bypasses the per-attempt landing guard. Forge::merge_change_guarded's default (forge.rs:1142-1150) calls guard()
    once and then merge_change; only GitHub overrides it. GitLabForge::merge_change (4099-4210) polls/retries up to 6 times with
    sleeps and calls glab_api_put(/merge) at ~4176 with no further guard.
    Fix: implement merge_change_guarded for GitLab so guard() runs immediately before EVERY /merge PUT, including after each
    rebasing/checking wait and each retryable failure, mirroring GitHub. ALSO make the trait default safe for any future forge:
    the default must not wrap a retrying merge_change with a single guard (e.g. require each forge to implement
    merge_change_guarded, or have the default run a single attempt with no internal retry). Regression: a GitLab fake that
    returns 'checking' then success, where the guard flips to refuse between attempts, results in no /merge PUT.
    Nothing else. cargo fmt; check-store-writers.py; ratchets; targeted cargo run; check-ci-fast. Push, re-cut, and request a STRICT re-review.
