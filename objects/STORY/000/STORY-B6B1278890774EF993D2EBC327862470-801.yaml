    Regressions: (a) the grant is revoked during the authorship lookup (fake forge read that flips the grant), so no merge; (b) the same for the
    final train authority check on the last car, so no train merge; (c) control: a valid grant throughout merges.
    Nothing else. cargo fmt; check-store-writers.py; ratchets; targeted cargo run; check-ci-fast. Push, re-cut, STRICT re-review.
