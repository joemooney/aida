  content: 'Advisor 20:46 note for the #4279 (S1c) reviewer, STRICT, landing authority. Verify against the advisor signoff (18:20): (1) landing_merge::merge is the ONLY production merge_change caller, with a ratchet that fails on any new caller; (2) ship, drain, burndown, release and train route through it; (3) the authority decision sits on the gate floor (gate::ship::merge_authority_refusal), re-checked at merge time; (4) review-gated mode: only the advisor or operator merges; behind-base follows ruling (a) (merge when commits since the reviewed base don''t touch the PR''s paths, else refuse with update-branch + delta; gate paths need full CI on a current-base merge ref); drain and burndown skip the CI wait, release keeps it; land run ships a READY change once when it may merge, else reports. EXPECTED behaviour change: bug_1953''s review-gated CLI test now expects the advisor-merger refusal (exit 23). That follows the signed design and is not a regression. STORY-2914 is not in this slice. The 09:18 tier applies.'
