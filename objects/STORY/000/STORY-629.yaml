title: 'Phase 2: [glyphs] custom per-symbol override table layered on the registry'
description: |-
  Phase 2 of EPIC-45. After phase 1's registry, add a [glyphs] config table (project .aida/config.toml + user ~/.aida/config.toml) mapping each named glyph to an arbitrary replacement string, layered OVER the active profile (unicode or ascii). Resolution: a [glyphs] entry for a symbol wins over the profile default for that symbol; symbols with no custom entry fall back to the active profile. Project [glyphs] overrides user [glyphs].

  ACCEPTANCE: [glyphs] check = "OK" makes the check glyph render as OK regardless of the [ui] glyphs profile; symbols not listed are unaffected; an empty/absent [glyphs] table = phase-1 behavior unchanged. TESTS: per-symbol override beats profile; partial table leaves the rest on profile; project beats user.
