    issues:
    - type: incomplete
      severity: medium
      text: No specification of which VCS systems to support beyond git
      suggestion: Clarify that this is git-only or explicitly list supported VCS systems
    - type: ambiguous
      severity: medium
      text: The phrase 'optionally create new requirements' is unclear about who decides and how
