description: 'Slice 1 of the cross-clone coordination design (docs/plans/2026-06-16-cross-clone-coordination.md). Shared lease claims under coordination/leases/<scope>.toml on the aida-store branch; session start --owns + aida agent new pull-check-claim-push; refuse on a LIVE cross-clone lease (same-host pid + universal TTL/heartbeat liveness), --force escape + stale auto-reclaim; surface foreign leases in aida session leases. Pure decide_claim decision fn + unit tests mirroring drain_lock. Best-effort: if the store is unreachable, warn and proceed (do not block work on network). Gate: scripts/multi-clone-harness.sh MU-504 flips GAP to PASS.'
