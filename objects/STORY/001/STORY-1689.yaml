title: Promote the live dev binary automatically when main moves and its CI is green
description: |
  On 2026-10-14 the live dev binary was still at 3163cc1b21 (built 2026-10-13 05:47) roughly 20 merges later, including the night-shift unblocker BUG-2120. Nothing promotes a new binary unless someone runs `aida dev build` in the primary checkout by hand, so agents run stale fixes for hours.

  Operator stopgap in place: ~/bin/aida-autobuild.sh on cron every 30 min. It promotes only when the primary checkout is a clean `main`, origin/main has moved past the live SHA, and the newest CI run for origin/main's exact SHA succeeded. It fast-forwards main and runs `aida dev build`. Delete it when this ships.

  Want: a native mode, e.g. `aida dev build --if-main-green` (name TBD), runnable as a [[schedule.jobs]] substrate job in .aida/config.toml, with the same guards:
  - the primary checkout only; on main; no tracked changes;
  - fast-forward only, never merge or reset;
  - skip quietly when the live SHA == origin/main;
  - skip when CI for that exact SHA is not completed+success (forge-neutral: GitHub and GitLab);
  - respect --after-wave semantics (never swap under a live drain wave);
  - a single-flight lock.
  Each promote/skip outcome is logged, and the build failure route goes to the advisor seat (on CronJobFailed).

  Acceptance:
  - tests for each skip reason (dirty, off-main, unchanged, CI red, CI pending, non-ff) and for the promote path with a fake forge;
  - a schedule job entry plus a route job;
  - docs in the dev-build section of the repository guide.
