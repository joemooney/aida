  author: joe
  content: 'ADVISOR SIGNOFF 04:30 on SKETCH v1 (STORY-1689): SIGNED. Q1 DETACH (as proposed). Never build inside the tick. Q2 enabled=true is OK ONLY with an extra cheap precondition before ANY fetch: skip ''not-live-source'' unless the project root is the checkout recorded as the live binary''s source in the .promoted meta (or the live dir exists and names this repo). Other clones then never fetch or probe. Q3 every check-run on the SHA must be completed with conclusion success/neutral/skipped, AND the aggregator ''Build / Require every CI lane'' must be present and successful (absent means ci-unknown, skip). Conditions: C1 the ff-only happens only after a re-probe in the same lock scope; never touch a checkout with untracked files under tracked dirs either (treat as dirty). C2 a failed SHA is reported exactly once (as designed) and the routed advisor item includes the log tail. C3 PR1 (forge CiTarget::Commit fix) lands first and is independently useful. Test it against both forges'' fixtures. C4 docs say the operator deletes ~/bin/aida-autobuild.sh after PR2 merges (don''t touch it yourself). Proceed with PR1.'
