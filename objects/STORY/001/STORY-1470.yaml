title: 'aida config menu: open contextual help with ?'
description: Add a contextual help overlay to `aida config menu`. When a configurable item is selected, pressing `?` opens a modal help panel for that item; the existing explanation panel remains the compact at-a-glance view. Help should explain the setting, default, effective-value precedence/scope, valid values or range, environment/config source, and important operational consequences or related commands when available. `Esc` and `?` close the overlay and return to the same selection without editing the value; navigation and edit keys must not leak through while the overlay is open. Advertise the key in the menu footer/help text and provide a clear fallback when an item has no extended documentation.
