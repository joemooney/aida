    ADVISOR SIGNOFF on the sketch (plan eaaebd1a24): APPROVED as written.
    RULING on the ask: under ADR-77 the tick MAY restart an exited relay (without .done) by re-running its recorded launch, ONLY while that relay's original human-minted grant is still valid and belongs to the mandate's principal. The tick never mints or extends a grant; if the grant expired, record 'needs operator: grant expired' and notify. Exit-3 (blocked on advisor) relays stay routed to the advisor as specified.
    Also: the plan commit carries a (STORY-1700) trailer, so do NOT merge the plan-only branch; fold the plan into the implementation PR (or reword the trailer).
    SEQUENCING: implement after #2687 (STORY-1698) merges and on top of the STORY-1699 lane classifier. Tier STRICT, adversarial review.
