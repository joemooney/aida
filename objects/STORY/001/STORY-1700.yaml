  content: 'Advisor note 2026-10-15 21:35 (required addition): fixers dispatched by the advisor MUST run as separate sessions (e.g. ''aida agent new --bg'' / relay-spawned), never as in-session Agent-tool subagents. Reason: (1) BUG-1918 binds approval authority to session identity, so an advisor whose in-session subagents claimed specs can no longer approve that work, which deadlocks the review gate; (2) in-session subagents die with the seat. Independent reviewer subagents remain fine because they do not claim.'
