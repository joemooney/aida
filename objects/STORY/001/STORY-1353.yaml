    Call-site audit (31 pre-change has_advisor_authority references), 2026-09-19:

    DISPATCH (repointed): queue_cmd.rs QueueCommand::Add execution routes; mcp.rs queue_add/queue_rework authority wrapper; lib.rs maybe_autoqueue for already-Approved unparked work. Fresh queue-work auto-complete and burndown wave launch were adjacent team-gate sites and now use the same dispatch predicate. Queue remove/move/rework are also dispatch-gated.

    DISPOSITION (kept advisor): git_backend_cmd.rs add/intake status, add/edit --mode, finding promotion/archive/status transition sites; queue_cmd.rs approve/done completion/status transitions and rework's optional status transition; lib.rs DecisionRequest resolution promotion, direct status update, intake downgrade, answer promotion; mcp.rs execution_mode and status-transition gates. triage_lease.rs and lock_cmd.rs references describe this same disposition boundary. The statusline tests and MCP helper/tests remain disposition coverage.

    INTEGRITY FLOOR (new named predicate; no advisor call site reclassified): merge-hold clear now requires a present human through integrity_floor_authority_from. Existing supervised merge/CI/reviewer fences remain untouched.

    AMBIGUOUS: none. Every surviving runtime has_advisor_authority call is a status/mode/finding/archive disposition. No integrity-floor path was weakened.
