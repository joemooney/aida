- id: 01a0db37-8621-7b03-95c3-d1c63aef7dec
  author: joe
  content: |-
    Vote storage + sync (product note, 2026-09-25; operator: exact counts are not critical, an occasional lost vote is acceptable).

    Recommendation — keep it inside the existing three-way merge, no new substrate:
    - Store votes ON the idea's YAML as a map keyed by voter identity: votes: { <canonical_user_id>: { dir: up|down, at: <ts> } }. Key by canonical_user_id (case-folded, TASK-951) so one person = one key.
    - NEVER store a count. The tally is derived at read time from the map. A stored counter is the only thing that would genuinely conflict.
    - Merge in conflict.rs merge_spec_three_way as a keyed three-way merge: different voters on two machines = disjoint keys, both survive; same voter on two machines = later 'at' wins (same LWW shape as queue_entry_lww); withdrawn vote = key removed, handled with the base-aware removal semantics of merge_string_set_three_way so a retraction is not resurrected.
    - Worst case accepted: a same-voter race or a clock skew picks the 'wrong' direction for that one voter. No lost votes across different voters.
    - Rejected: per-node vote files / a separate branch (overkill for a non-critical tally), and append-only vote events (needs replay for a number nobody audits).

    Acceptance additions:
    - Two clones voting on the same idea concurrently (different voters) → both votes present after aida pull on either clone; test via merge_spec_three_way fixtures.
    - Same voter changes vote on two clones → exactly one vote for that voter after merge.
    - Vote retraction on one clone + no change on the other → retraction survives merge.
