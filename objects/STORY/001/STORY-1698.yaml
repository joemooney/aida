title: 'Fire-fighting mandate: a human-minted, time-boxed grant that lets the advisor seat ship held PRs with attested independent approval'
description: |-
  ## Why
  In an emergency the operator wants the advisor to keep shipping while they are away. Today, held PRs need a human TTY for every merge (operator decision 2026-10-15: implement this).

  ## Shape (sketch required before code; see Rules)
  - 'aida mandate start --ship-held [--ttl 8h] [--reason TEXT]' can ONLY be run by a human at an interactive TTY (the same integrity floor as merge-hold clear). It mints a time-boxed mandate grant bound to the advisor seat. It is recorded in the store (who, when, ttl, scope, reason) and visible in 'aida mandate status' and the statusline.
  - While the mandate is active, 'aida pr ship N' from the ADVISOR seat may release a merge hold and merge IF ALL of these hold:
    - an APPROVED verdict with a valid BUG-1918 recorder_attestation exists at the PR's current head;
    - the approving identity is independent of the PR's implementer AND the advisor did not author the PR's commits;
    - CI is green on that head;
    - the PR's specs are not in an excluded class: security/containment/review-authority/merge-authority-tagged or explicitly 'operator-only' specs stay human-only by default, unless the mandate was minted with an explicit '--include-supervised'.
  - Every mandate-authorized release and merge is recorded in the hold ledger and the PR comment as 'released under mandate <id> by advisor'.
  - 'aida mandate stop' (human TTY or the expiry) ends it immediately. Expiry is enforced server-side at ship time, not cached.
  - Agents can never start or extend a mandate. Non-advisor seats are never covered.

  ## Acceptance tests
  - An agent cannot start a mandate (refused without a TTY); a human can.
  - An advisor can ship a held PR under an active mandate with attested independent approval plus green CI.
  - Refused cases: expired mandate; missing attestation; stale sha; advisor-authored PR; excluded spec class without --include-supervised; non-advisor seat.
  - 'mandate stop' takes effect immediately, and the ledger entries exist.
  Tier: STRICT (merge authority). Rules: architecture change, so the implementer posts IMPLEMENTER SKETCH on this story and gets advisor signoff before implementing.
