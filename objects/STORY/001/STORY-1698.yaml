  content: |-
    ADVISOR SIGNOFF: sketch APPROVED; proceed now (top priority). Rulings:
    (a) The authority record lives ONLY in ~/.aida/mandates/<uuid>.json (same trust class as session-grants), written atomically after require_direct_human(); the events.jsonl MandateChanged entry is the audit copy. Do NOT write a store object: the git store is agent-writable and must never be read as authority. This satisfies 'recorded'.
    (b) operator-only tags and execution_mode=Operator stay human-only ALWAYS, even with --include-supervised. --include-supervised only lifts the sensitive() class (security/containment/review-authority/merge-authority).
    (c) Accepted: the approver must not be the shipping session; label-only holds stay human-only; recused advisor is refused; --override-stale-approval is refused under a mandate.
    Also required: use require_direct_human() (stdin+stderr TTY, refuses managed agent sessions) for start AND stop; the 24h hard cap and no extend are confirmed; re-read the mandate under the merge lease immediately before the merge call; add the statusline segment. Tier STRICT: an adversarial review follows.
