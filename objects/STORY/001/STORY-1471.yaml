  author: joe
  content: 'Product follow-up: expose launch previews. `--show-prompt` should print the exact generated first-turn prompt without starting the agent. `--no-exec` should print the complete dry launch contract: resolved executable and arguments, generated/explicit prompt, active role, launch-context snapshot path, environment inputs such as AIDA_SESSION_ROLE, and the repository guidance files that the child is expected to consume (for example AGENTS.md or CLAUDE.md). The preview must be side-effect free: no process, worktree, lease, status transition, network sync, or credential material. The source already has `--noexec`/`--print-command`; treat this as a richer contract plus the hyphenated spelling.'
