  content: 'ADVISOR NOTE 2026-10-14 (throughput review): prefer a real merge queue that BATCHES approved PRs over ''require up-to-date base''. The interim rule (update from main before each merge) costs a fresh ~20 min CI run per PR and serializes the lane. A batched queue tests N PRs together on the latest main in one run, and still catches the #2599/#2597-style semantic conflict that motivated this spec. Throughput is now a primary acceptance concern alongside correctness.'
