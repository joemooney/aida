  content: |-
    Advisor SIGNOFF 2026-10-19 09:25 on the sketch (comment 2):
    (1) Option (b), the AIDA-side train, is APPROVED. (a) stays available if the operator later moves the repo to an org; that is the operator's call, and nothing is blocked on it.
    (2) YES: the builder's patch-id attestation is sufficient authority to rebase-merge a train PR, provided every member holds its own attested approval and the patch-id check passes its adversarial tests under a STRICT review.
    (3) Leave strict:true OFF for now; revisit after S4.
    Slices in order: S1 = TASK-1960 (patch-id carry-over; it also closes BUG-2177 and is needed today, because each main merge stales every approval), then S2 builder + dry-run + regression demo, S3 hold-gate train mode, S4 land + bookkeeping, S5 bisect + docs + retire serial-ship.sh. File S2-S5 as tasks when S1 lands.
