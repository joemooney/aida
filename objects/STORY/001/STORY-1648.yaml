  content: 'FACTORY PLAN (night): (1) New focused module aida-cli-lib/src/main_checkout_drift.rs: pure parser of `git status --porcelain=v2 --branch` into CheckoutDrift {branch, upstream, ahead, behind, tracked paths, untracked paths}; is_drifted() (tracked/untracked changes, off main/master, ahead/behind upstream; no-upstream alone is not drift); summary_line() producing ''main checkout: N tracked changes, M untracked · on <branch> · <ahead/behind origin>''; probe() runs one `git --no-optional-locks status`; doctor_findings() lists drifting paths with best-effort lease attribution by mtime (latest lease started before the file mtime), never deletes. (2) Session-context hook template master: same line via git rev-parse --git-common-dir (works from a linked worktree) + one git status parsed in awk; silent when clean; AIDA_MAIN_CHECKOUT_DRIFT=off opt-out. (3) statusline_cmd.rs: red ''⌂!'' segment when the main worktree has drifted. (4) doctor: new opt-in-path category main-checkout-drift (alias table in lib_part2, small) appended in doctor_cmd.rs. Tests: Rust unit tests in tests/story_1648_main_checkout_drift_tests.rs (parser: clean, tracked-dirty, untracked-only, off-main, behind origin, detached; statusline marker clean vs dirty; doctor attribution + temp tree byte-identical after scan on a real git fixture; alias normalization); shell test tests/test_session_context_drift.sh (five fixtures + worktree case + <50ms delta timing via opt-out comparison, stub aida, no cargo) wired into ci.yml. Then make sync-templates/check-templates, check-ci-fast. Risks: compile-correctness without local build; statusline hot-path cost of one git status in the main checkout.'
