title: 'aida cron: per-seat periodic job registry + ledger (substrate jobs run by the scheduler tick, seat jobs delivered to whoever holds the role, vendor-neutral)'
description: |-
  Operator idea (2026-09-18): an aida cron that manages and specifies which periodic jobs each seat runs (mailbox read check, dead-session reaping, doctor, queue gc, mail-latency alerts), so a newly launched agent is populated with the entries that apply to its seat, and the substrate knows whether a job is overdue. Today these live in one Claude session's memory (the advisor created a session-only cron for aida awaiting --notice by hand; it dies with the session) and in a product-seat Monitor.

  Design, in two halves so it is vendor-neutral by construction:
  1. Registry + ledger (substrate). .aida/cron.toml (scaffolded by aida init, tracked) lists jobs: name, seats it applies to, interval, kind, command. Two kinds:
     - substrate: no LLM needed (aida session reap, aida doctor --quiet, aida queue gc --for implementer, aida awaiting --notice, aida mailbox latency, aida store gc). These are run by the system scheduler tick (STORY-1218 aida shift tick, or cron/systemd via aida cron install) regardless of whether any agent is alive.
     - seat: needs the seat's judgment (advisor: triage mailbox every 30m, groom drafts hourly; product: capture sweep at session end; integrator: merge sweep). These are delivered to whoever holds the role.
     Every run is ledgered per job (last_run, by which seat/session, result) so aida cron status shows due / overdue per seat, and TASK-1271's mailbox latency becomes one row of the same report.
  2. Delivery per vendor, same registry:
     - Claude Code: aida agent new claude --role X and the SessionStart hook read the registry and create the seat's jobs as in-session cron entries (CronCreate) with the job's prompt; a job's run reports back via aida cron done <job>.
     - Codex / Antigravity / any headless agent: no in-session scheduler, so due-ness is computed by the substrate and surfaced — the pickup prompt and the per-turn notice (.codex/hooks.json) carry "due: mailbox-triage (every 30m, last 47m ago) → run: aida mailbox inbox" — and aida cron run <job> executes a substrate job or prints the seat job's prompt for the agent to act on now. The system tick can also cold-boot a headless seat for an overdue seat job (fork-from-live is Claude-only; codex exec / claude -p are the vendor-neutral fallback).
     - No job may exist only for one vendor; the registry is the single source and aida cron status is identical under both.
  3. Precedence and safety: jobs are per-seat, not per-agent; a seat job never launches a drain or merges (that is the tick's and the gates' business); substrate jobs are idempotent and quiet when nothing to do.

  Acceptance:
  - aida cron list / status / due --seat <role> / run <job> / done <job> / install (--systemd-user | --cron) exist; aida init scaffolds a default cron.toml with reap, doctor, queue gc, awaiting notice, mailbox latency (substrate) and mailbox-triage, groom-drafts (advisor seat).
  - Launching a Claude advisor via aida agent new populates its in-session cron from the registry; launching a Codex advisor shows the same jobs as due-lines in its pickup prompt and per-turn notice.
  - A seat job overdue past its interval appears in aida awaiting for that seat and in aida status; a substrate job never appears there (the tick runs it).
  - The ledger answers "who last triaged the mailbox and when" for the night-shift post-mortem (SPIKE-82).
  - Works with STORY-1218: the tick runs substrate jobs; aida cron is the registry both consult.

  Advisor refinements (2026-09-18, from the operator's "maybe a trigger or condition?"):
  - A job's schedule is ONE of three kinds, all in the same cron.toml entry shape: `every = "30m"` (interval — the heartbeat fallback), `on = ["PrMerged", "SpecShelved", "QueueDrained", "AdvisorEscalated", "PuntFiled", "CiTerminal", "UnshippedWorkDetected", "MailReceived"]` (event — the kinds already emitted to .aida/events.jsonl, plus MailReceived for the mailbox; this formalises the product seat's overnight Monitor, which SPIKE-82 hypothesis 3 credits), or `when = "<predicate>"` (condition over the substrate snapshot the awaiting/status readers already compute: e.g. `mail.oldest_unread_age > 15m`, `drain.lock_free && queue.drain_mode_ready > 0`, `sessions.finished_unreaped > 0`). A job may combine `every` with `on` (event fast path + interval fallback).
  - Condition semantics: evaluated on every tick AND on every event; a condition job fires ONCE when its predicate turns true and not again until it has been false (once-until-cleared), so a seat is nudged once per episode, not every tick — the same rule TASK-1271 uses for the latency warning. The ledger records the episode (first_true, fired_at, cleared_at).
  - Events are read from the existing events.jsonl tail (no new bus); the per-vendor delivery is unchanged: Claude gets an in-session cron/Monitor per job, Codex/Antigravity get due-lines in the pickup prompt and per-turn notice, the tick cold-boots a headless seat for an overdue seat job.
  - Slice boundary: THIS story ships the registry, ledger, schedule kinds, aida cron list/status/due/run/done, Claude delivery via aida agent new + SessionStart hook, and Codex/Antigravity due-lines. `aida cron install` and the unattended execution of substrate jobs belong to STORY-1218's tick, which consults this registry; until the tick lands, substrate jobs run when a seat's tick delivers them or by hand via aida cron run.
  - Precedence with the seat's own judgment: a seat job's prompt is advice to the seat ("due: mailbox-triage"), never an automatic action; substrate jobs are idempotent and print nothing when idle (TASK-160).
  Operator decision (2026-09-18, fork "who owns seat-job delivery on Codex/Antigravity"): BOTH. (a) Due seat jobs always surface in the seat's pickup prompt and per-turn notice, so a live Codex/Antigravity seat acts on its next turn. (b) When a seat job is overdue and no live session holds that role, the scheduler tick cold-boots a headless seat for it (codex exec / claude -p per the configured vendor), rate-limited to at most once per hour per seat, ledgered like any run, and never for jobs that launch drains or merge.
  Acceptance addition: with no live advisor session and mailbox-triage overdue, one tick within the hour starts a headless advisor that triages and ledgers the run; a second overdue tick inside the same hour does not start another; a live advisor session suppresses the cold-boot entirely.
