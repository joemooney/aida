  content: 'Implementation landed as PR #1946 (branch story-1226, 3 commits, 22 files, +3771/-430): schedule_predicate.rs (9-field typed grammar, once-until-cleared), schedule_ledger.rs (store object schedule/<job>.yaml, CAS loop, 60 s debounce), maintenance_schedule.rs grown (JobConfig back-compat, seat/substrate/fires_task, tick every/on/when, list/due/done, aida cron alias), events CronJobFired/CronJobFailed/MailReceived, awaiting CronChannel (file-only), pickup DUE JOBS block and agent-new Due Jobs section, init sample jobs, docs. Local: 5011 cli-lib tests green, fmt + clippy clean, throwaway e2e tick→due→notice→done→store commit. Held for the advisor''s gate (guided). Deviations: headless_tail::known_kinds untouched (it is log kinds, not event names — EventKind::known_names added instead); doctor has no --quiet so the sample job is plain doctor; ci.red_prs is always 0 on the file-only snapshot (documented). Follow-up worth a spec once merged: every ledger commit advances the store HEAD and triggers a cache rebuild on next read — the debounce bounds it, but a chatty every-job will churn the cache; consider batching ledger commits per tick.'
