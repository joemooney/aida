    Acceptance additions (locked by operator decision on EPIC-65, 2026-09-14):
    - Default scope is --local (project .aida/agents.toml + project .codex/config.toml); --user targets ~/.aida/agents.toml + ~/.codex/config.toml as the explicit machine-wide opt-in.
    - Every write to a vendor-owned config file (~/.codex/config.toml or project .codex/config.toml) MUST: (1) write a timestamped backup first, (2) merge-preserve all unrelated keys/tables, (3) re-parse the result and FAIL (restoring the backup) if it does not parse. A regression test must round-trip a config whose file begins with top-level scalars (model/etc.) followed by tables, asserting an inserted [sandbox_workspace_write] table does NOT absorb those scalars.
