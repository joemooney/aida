title: 'aida config permissions set contained|native|bypass [--user|--local] + doctor heal: idempotent TOML-merge writer for the posture files'
description: |-
  The WRITER slice of EPIC-65 (depends on STORY-1127 show/check + STORY-1124's named contained posture). `aida config permissions set <tier> [--user|--local]` applies a named posture by editing the right files idempotently, merge-preserving, with a backup.

  DECIDED (ADR-32, via /aida-derisk 2026-09-15 — resolves EPIC-65 forks a+b):
  - SCOPE DEFAULT: bare `set <tier>` writes PROJECT-LOCAL (.aida/agents.toml + project .codex/config.toml); --user opts INTO machine-global (~/.aida/agents.toml + ~/.codex/config.toml). Local is the low-blast-radius default; global is explicit.
  - AIDA WRITES ~/.codex itself (on --user) via the tested merge-preserving writer + a backup — a tested writer beats the hand-edit that corrupted it on 2026-09-14.

  Tiers:
  - contained: [agents.codex] default_flags = --sandbox workspace-write --ask-for-approval never (per ADR-31) + the vendor [sandbox_workspace_write] table (network_access=true, writable_roots seeded ~/.cargo,~/.rustup,~/.aida). Claude native contained equivalent via .aida/config.toml [contained].
  - native: removes the injected flags, restores faithful-launcher prompting.
  - bypass: the explicit nuclear opt-in (--dangerously-bypass), gated with a clear warning.

  Acceptance (forks decided; safety testable/CI-gated — merge stays supervised, see mode):
  - set contained/native/bypass each produce a valid, parseable file with the rest preserved and a backup written; re-running is idempotent (no duplicate blocks).
  - Bare command targets PROJECT-LOCAL files; --user targets the machine-global files. A test asserts each scope writes the correct paths.
  - TABLE-ORDERING GATE (test): a round-trip of a ~/.codex config with LEADING top-level scalars (sandbox_mode/approval_policy/model) followed by tables stays valid — the inserted [sandbox_workspace_write] table never lands above the scalars. This is the 2026-09-14 corruption, covered.
  - HERMETICITY (test + review): every writer test targets a TEMP dir, never the real $HOME/~/.codex — verified in review before merge.
  - BACKUP GATE: the vendor file is always backed up before editing; a test asserts the .bak is written.
  - doctor --category permission-posture heal calls this to apply contained for a flagged full-access state.
  - set bypass requires the explicit tier + prints the nuclear warning; no other tier yields --dangerously-bypass (test).
