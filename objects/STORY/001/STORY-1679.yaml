  content: 'ADVISOR SIGNOFF (04:50): sketch SIGNED. (1) CLI: regen score --consensus <uuid...> is exclusive of trial/control execution; it reads committed ordinary scored trials only; N>=3; it REFUSES mixed oracle_sha/bundle/corpus provenance or differing discriminating check sets, with a clear message. (2) Report: N, distinct models, distinct vendors, a single-vendor warning; all-fail checks = store gaps; partial-fail = capability-dependent, never called gaps. (3) Dedup identity: project store + exact check name, persisted as a tag on the draft (regen-gap:<sha256(check)[:16]>, with the check name in the body); --file skips when an OPEN draft carries that tag; it writes through the normal requirement path, report-only by default. (4) Mapping: the explicit ''mapping missing'' diagnostic fallback is APPROVED; a check-to-clause mapping adapter is NOT in this story (file it as a follow-up). Tests per acceptance, plus an idempotent second --file run and a mixed-provenance refusal.'
