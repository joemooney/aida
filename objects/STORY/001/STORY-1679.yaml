title: Cross-model consensus failure as an automatic store-gap detector
description: |
  ## F32. Cross-model consensus failure as an automatic store-gap detector

  **Seen (round 3, F-13):** of 44 discriminating checks, one failed in all 15 regenerations (3 vendors, 8 models,
  3 specs) and one in all 11 store regenerations. Those two checks are exactly the contract clauses the store leaves
  unsaid. Checks failed by only some models track model capability instead.

  **Proposal:** `aida regen score` across N regenerators, ideally from more than one vendor, reports consensus
  failures as *store gaps*, linked to the contract clause the test exercises (F13), and opens them as draft
  spec-amendment tasks. It needs no human classification and is robust to any single model's quirks.

  ## Acceptance

  Depends on STORY-1669 slices 2 and 5 (recorded scores and gap classification); clause linking uses the test-to-contract mapping from STORY-1668 when present.

  - [ ] `aida regen score --consensus <trial-ids...>` (or over the last N recorded trials) computes, per discriminating check, how many regenerations failed it. A check failed by every regeneration, with N >= 3 regenerations, is reported as a **store gap**; checks failed by some but not all are reported separately as capability-dependent and are never called store gaps.
  - [ ] The report shows N, the number of distinct models and vendors, and warns when all regenerations came from one vendor (consensus is weaker).
  - [ ] Each store gap is linked to the contract clause/spec its test exercises when the mapping exists; otherwise it lists the test name and says the mapping is missing.
  - [ ] By default the command only reports. With `--file`, it opens one draft spec-amendment task per store gap (parented to the linked spec when known), skipping gaps that already have an open draft for the same check.
  - [ ] Tests: fixture results with one all-fail check and one partial-fail check produce exactly one store gap; `--file` is idempotent.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), docs/regeneration/aida-feedback.md at commit e9521ab; results in docs/regeneration/results-2026-10-11-round2.md and -round3.md. Round 3: from the AIDA store, 6 of 8 models across Anthropic, OpenAI and Google regenerate the system to 86-96% of discriminating oracle checks; two checks fail for every model.
