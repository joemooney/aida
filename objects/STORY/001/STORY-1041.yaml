title: 'Pipeline depth state contract: [drain] pipeline_depth config + drain-state persistence + status rendering (foundation for the concurrent scheduler)'
description: |-
  ## Scope (re-scoped 2026-09-12)
  Re-scoped from the full concurrent scheduler down to the FOUNDATION SLICE that shipped guided as ef9204575 (branch story-1041-2, ADR-27). The concurrent scheduler itself is tracked separately as STORY-1091.

  ## Acceptance (this slice)
  1. [drain] pipeline_depth parses and clamps to 1..3.
  2. pipeline_depth persists in .aida/drain-state.json.
  3. aida drain status renders 'N merged, K in flight'.
  4. docs/autonomous-drain.md documents the depth contract; ADR-27 records the bounded-scheduler decision.

  ## Follow-up
  STORY-1091 — the concurrent scheduler that consumes this contract (spec B implementer starts during spec A CI, serial merges).
