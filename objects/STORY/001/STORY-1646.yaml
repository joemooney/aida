- id: 01a1270b-41e3-78f0-8688-7d619e32908b
  author: joe
  content: 'Amendment to the final naming decision (2026-10-10): keep a clean-build escape hatch, because `make build-fast` deliberately builds with CARGO_INCREMENTAL=1 (TASK-1154/BUG-1684), and rustc''s incremental cache can go stale or get corrupted. That shows up as baffling compile errors, or rarely a miscompile. Shape: `aida dev build --clean` is a flag, not a separate verb, so there is still one build command. By default `--clean` deletes only `target/agent/incremental` (3.5G today), which removes the usual cause while keeping the compiled dependencies. `--clean=full` runs `cargo clean --profile agent`. Both then run the normal smoke test and promote. When a build or smoke test fails, the error message suggests `aida dev build --clean`. `aida dev rebuild` is still removed (no alias). The live directory has to be separate from target/ before `--clean` can ship.'
