  author: joe
  content: 'Naming decision (operator + advisor, 2026-10-10): `aida dev build` is the canonical command; `aida dev rebuild` (TASK-1720, shipped 2026-10-08 as a shell-wrapper case) stays as a hidden alias so existing muscle memory and docs keep working. One verb, behaviour depends on where you run it. In the primary checkout, it builds, smoke-tests and promotes to live, refusing when dirty unless --allow-dirty. In a worktree, it builds and smoke-tests only, never promotes, and prints how to try that build (`aida dev activate`). The flags are `--no-promote` (build and test only, anywhere) and `aida dev rollback` as its own subcommand. Update CLAUDE.md and the help text to say `aida dev build`.'
