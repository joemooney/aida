title: 'Single live dev binary: aida dev rebuild builds, smoke-tests and promotes atomically with rollback; keep the main checkout clean'
description: |-
  ## Problem
  The operator's PATH `aida` and `aida-server` are now symlinks to `~/ai/aida/target/agent/{aida,aida-server}` (2026-10-10), so there is a single binary during development. That makes the main checkout's build the binary every session, hook, MCP server and relay runs. Two ways this breaks:
  1. Uncommitted edits leak in. Any agent that edits or builds in `~/ai/aida` ships its unfinished work to every session. Observed: the binary in use was built from `430dc01de4+dirty` (another agent's uncommitted lib.rs split), and the main checkout currently has 21 untracked agent scratch files.
  2. A bad build goes live with no rollback. A failed compile keeps the old binary, which is fine. A build that compiles but misbehaves goes live for everyone immediately, and there is no one-step rollback. A plain `cargo build --profile agent` also bypasses `aida dev build-guard`.

  ## Proposal
  A. `aida dev rebuild` becomes the only way to update the live binary: build, smoke-test, then promote atomically.
     - Today it is a shell-wrapper case that runs `make build-fast`, so hooks and non-interactive shells can't use it. Make it a real subcommand (keep the wrapper as a pass-through).
     - Build with `--profile agent` as now. Then smoke-test the new binaries: `aida --version`, plus a read-only command against the current store (e.g. `aida list --limit 1`), and `aida-server --version`.
     - Only after the smoke test passes, atomically rename the new binaries into a separate live directory (e.g. `target/live/`), keeping the previous pair as `target/live/prev/`. `~/.local/bin/aida` points at the live directory, not at `target/agent/`, so raw cargo builds can no longer change the live binary.
     - Add `aida dev rollback`, which swaps prev back in, and have `aida dev status` show which commit is live versus built.
     - Keep the existing live-wave build guard and the MCP-server restart (restart only after promotion).
  B. Promotion refuses to run from a main checkout that isn't clean: it requires the main checkout on `main` with no tracked modifications and HEAD == origin/main. An explicit override (`--allow-dirty`, which records the dirty SHA in `aida dev status`) is allowed. Untracked files warn but do not block. Rebuilds in worktrees are unaffected (they never promote).
  C. Pre-commit HARD-refuses commits in the primary checkout (git-dir == git-common-dir) on `main`, with an env override for the operator. Merges, pulls and `.aida-store` commits are exempt. This is deliberately different from TASK-1178's warn-only worktree-scope check: in the primary checkout there is no legitimate agent commit, so blocking is the only safe choice. Note that `--no-verify` still bypasses it; the server-side backstop is D.
  D. Show it: the session-start hook and status line show `main checkout: dirty (N files)` or `not on main` when the primary checkout drifts. This covers edits that aren't commits, which no git hook can see.

  ## Server-side (operator action, not code)
  GitHub branch protection on `main` currently requires checks (merge-hold-gate, Build) with enforce_admins on, but "require a pull request" is OFF. Audit (2026-10-10): all of the last 200 first-parent commits on main came from merged PRs; none were direct pushes. One blocker: `scripts/release.sh` (lines 382-384, 430-433, 479-482) commits `chore: release vX` and pushes it directly to main. Before enabling "require PR", either change the release flow to open and merge a release PR, or add a bypass actor for releases.

  ## Acceptance
  - `aida dev rebuild` is a real subcommand. A failed build or failed smoke test leaves the live binary untouched and exits non-zero with the reason.
  - `aida dev rollback` restores the previous live pair in one step, and `aida dev status` shows the live and previous SHAs.
  - Raw `cargo build` / `make build-fast` never change the live binary.
  - Promotion refuses a dirty or diverged main checkout without `--allow-dirty`. Tests cover clean, tracked-dirty, untracked-only, off-main and behind-origin.
  - Pre-commit refuses in the primary checkout on main, with tests for the refusal, the override, merge/pull, and a worktree commit (allowed).
  - Session start and the status line flag primary-checkout drift.
  - Docs: CLAUDE.md "Develop AIDA itself" plus the dev-activate docs describe the single-binary symlink setup.
