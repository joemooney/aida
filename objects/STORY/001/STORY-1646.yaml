spec_id: STORY-1646
agreed_id: STORY-1646
title: 'aida dev build: one build command that smoke-tests and atomically promotes a single live dev binary, with --clean and rollback'
description: |
  ## Problem
  During development the operator's PATH `aida` and `aida-server` are symlinks into `~/ai/aida/target/agent/` (set up 2026-10-10 so there is a single dev binary). As a result, whatever the main checkout last compiled is what every session, hook, MCP server and relay runs:
  - Uncommitted work leaks into the live binary. Observed: the live binary was built from `430dc01de4+dirty`, another agent's unfinished lib.rs split.
  - A build that compiles but misbehaves goes live for everyone immediately, and there is no rollback.
  - `cargo clean` (or any stray `cargo build --profile agent`) deletes or replaces the live binary in place.
  - The incremental build (CARGO_INCREMENTAL=1, TASK-1154/BUG-1684) can occasionally corrupt its cache, and the only remedy today is a manual `cargo clean`, which hits the problem above.

  ## Design (decided by the operator and advisor, 2026-10-10)
  `aida dev build` is the only build command. It is a real subcommand, not a shell-wrapper case, so hooks and non-interactive shells can use it too.
  1. Build: an incremental build of the workspace with `--profile agent`, as `make build-fast` does today. Keep the existing live-wave build guard.
  2. Smoke test the new binaries: `aida --version`, one read-only command against the current store (e.g. `aida list --limit 1`), and `aida-server --version`.
  3. Promote, only if the smoke test passes: atomically rename the new binaries into a live directory OUTSIDE target/ (e.g. `~/.local/share/aida/live/`), keeping the previous pair in `live/prev/`. `~/.local/bin/{aida,aida-server}` point at the live directory. Then restart stale MCP servers.
  4. Gate promotion on a clean checkout. Promote only when run in the primary checkout, on `main`, with no tracked modifications and HEAD == origin/main. Untracked files warn but don't block. `--allow-dirty` overrides, and `aida dev status` then shows the dirty SHA. In a worktree, build and smoke test only, never promote, and print how to try that build (`aida dev activate`). `--no-promote` builds and tests anywhere without promoting.
  5. `--clean`: escape hatch for incremental-cache trouble. By default it deletes only `target/agent/incremental` and keeps the compiled dependencies. `--clean=full` runs `cargo clean --profile agent`. After cleaning it runs the same build → smoke test → promote. When a build or smoke test fails, the error message suggests `aida dev build --clean`.
  6. `aida dev rollback` swaps `live/prev` back in, in one step.
  7. `aida dev status` shows the live SHA, the previous SHA, and the latest built SHA, and flags when they differ.
  8. Remove `aida dev rebuild` (TASK-1720 wrapper case) entirely, with no alias.
  9. A setup step (e.g. `aida dev build --install-links`, or part of `aida dev activate`) creates the `~/.local/bin` symlinks to the live directory. It replaces a real file or a stale link there only after showing what it will replace.

  ## Acceptance
  - A failed build or a failed smoke test leaves the live binaries untouched, exits non-zero, and names the reason (suggesting `--clean`).
  - `cargo clean` and raw `cargo build` / `make build-fast` never change or remove the live binaries.
  - Promotion refuses without `--allow-dirty` in each refusal case: tracked-dirty, off-main, and behind or diverged from origin. Tests cover those plus a clean checkout and untracked-only (warns). A worktree build never promotes.
  - `--clean` and `--clean=full` delete exactly what they say, with a test using a temporary target dir.
  - `aida dev rollback` restores the previous pair; tests cover it plus the case where no `prev` exists.
  - `aida dev rebuild` is gone from the binary, the shell wrapper, the help text and the docs.
  - `make build-fast` stays as a build-only target (it does not promote) and its help text points to `aida dev build`.
  - Docs: CLAUDE.md "Develop AIDA itself" and the dev-activate docs describe the single live binary, `aida dev build`, `--clean` and rollback.

  ## Split out
  - Pre-commit refusal in the primary checkout, and the session-start/status-line drift indicator: separate specs, related:STORY-1646.
  - Changing the release flow so GitHub "require a pull request" can be enabled: a separate spec.
