title: aida init creates the repo on every configured forge in one command (GitHub + GitLab group), creating GitLab projects via the API when push-to-create is refused
description: |
  Found 2026-10-10 while creating aida-host. Today `aida init DIR --github` creates the GitHub repo and publishes both legs. A second forge takes a separate `aida remote mirror gitlab --url ...`. On gitlab.joemooney.com, SSH push-to-create into the group namespace ai/ was refused ("project could not be found"), so mirroring failed until the project was created by hand through the API (`glab api -X POST projects` with the ai group's namespace_id and visibility=private).

  Want:
  1. `aida init DIR --github --gitlab <host>[/<group>]`, or a named profile in ~/.aida/forges.toml listing both, creates the repo on both forges, wires the second as a mirror hub, and publishes main + aida-store to both in the safe order.
  2. When GitLab push-to-create is refused, fall back to creating the project via glab (or the REST API with the glab token) in the requested namespace, matching the GitHub repo's visibility (private by default).
  3. `aida remote mirror --url` gets the same create-if-missing fallback.
  4. The final summary verifies every hub with `aida remote status`.

  Acceptance: from a fresh DIR, one command produces repos on github.com and gitlab.joemooney.com/ai/, both private, with main and aida-store in sync, and `aida remote status` reports that all hubs agree.
