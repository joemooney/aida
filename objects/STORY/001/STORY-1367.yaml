  content: '[aida:advisor] ADDITIONAL ACCEPTANCE, from ADR-47 and sharper than the example this spec currently carries. As of ADR-47 the cross-platform nightly is a detector we have DELIBERATELY decided not to read: it will keep firing every night and re-commenting on tracking issue #1925 into an empty room, and that is now expected rather than an oversight. So we have a live instance of the exact thing this spec exists to prevent — except deliberate. ADDED: ''this check is deferred'' must be a state a scheduled job can HOLD. If the scheduler lands without it, the first thing it will do is re-notify us about Windows, and the second thing is teach every seat to ignore its notifications — which is how a detector that works becomes one nobody reads. A deferred check must be distinguishable from a passing one and from a failing-unnoticed one; three states again, which is PRIN-5 pointed at scheduling rather than at evidence.'
