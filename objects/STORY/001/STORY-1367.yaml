- id: 01a0c0b2-0189-7252-aaaa-b2854bc1ebf2
  author: joe
  content: |-
    [aida:advisor] CANDIDATE, with a sharper framing than 'nothing rebuilds after a merge'. Observed 2026-09-20: the live drain ran binary c2b3c2f0c8 (built 11:53) for five and a half hours while four orchestrator fixes sat merged on main — BUG-1445, BUG-1429, BUG-1447, and the wave's own build point. Verified by `git merge-base --is-ancestor` against the binary_sha in .aida/drain.lock.

    THE GAP IS NOT THE MISSING REBUILD. It is that NOTHING KNOWS the running binary is stale. `aida drain status` reports active; the wave reports progress; every surface agrees the system is healthy while it executes code replaced hours ago. That is PRIN-5 pointed at the binary rather than at evidence: the fact that the fix is running is absent, and absence reads as fine.

    THE COST IS NOT HYPOTHETICAL. The product seat was about to requeue eight specs in rework, reasoning that BUG-1445's no-op guard would at least DETECT a wasted round. The guard is not in the running binary. Eight specs would have gone through exactly the silent no-op the guard exists to catch, and been reported as progress.

    CHEAP DETECTOR, NO SCHEDULER REQUIRED: `.aida/drain.lock` already records binary_sha, and `aida dev status` already performs precisely this comparison — binary SHA against HEAD, reporting exact-match / ancestor / DIVERGED — for the shell's pinned binary. The capability exists and is pointed at the wrong process. A wave-start comparison is one call to something already written.

    For the scheduler: a stale-binary check is a better first job than most on the candidate list, because it is cheap, has a known implementation, and its failure mode is the one that makes every OTHER fix on the list not count.
