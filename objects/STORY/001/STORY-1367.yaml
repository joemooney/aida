- id: 01a0c0b6-36bc-71e3-8d03-de8cc25a77c6
  author: joe
  content: |-
    A seventh candidate, and unlike the other six it is not a check that nobody runs — it is a BUILD that nobody triggers.

    MEASURED 2026-09-20 21:15Z: the live drain was running binary c2b3c2f0c8, built 11:53:27. Four orchestrator fixes had merged to main since, and `git merge-base --is-ancestor` puts none of them in it:

        13:26  a8c1877576  detect rebase-only rework rounds      (BUG-1445)
        12:32  5ccfd951d5  centralize drain member liveness      (BUG-1429)
        ~14:19 b09197ab72  branch-protection misclassification   (BUG-1447)
        11:53  c2b3c2f0c8  type merge-hold refusals              (BUG-1435)  <- the build point

    So for five and a half hours the drain kept hitting defects whose fixes were sitting on main. The waves looked worse than the code deserved, and every measurement taken in that window carries a binary that nobody recorded.

    WHY IT BELONGS HERE RATHER THAN AS ITS OWN SPEC. It is the same shape as the other candidates — a question with a cheap existing answer that nobody thinks to ask — except the question is "is the running binary behind HEAD?" and the answer already exists: `aida dev status` reports the binary SHA, HEAD, and the match verdict, and `aida pull` already prints "your aida binary is now behind HEAD — run cargo build to pick up the pulled changes". The detection is built. Nobody is listening, which is this spec's entire thesis.

    THE JOB SHAPE IS SLIGHTLY DIFFERENT FROM THE OTHERS AND THAT IS THE INTERESTING PART. The other candidates report. This one has a safe automatic REMEDY: `make build-fast AFTER_WAVE=1` already exists, already refuses to swap a binary under a live wave, and already parks until QueueDrained. So the job is not "notify someone the binary is stale" — it is "queue the rebuild at the next wave boundary", which needs no human at all.

    That makes it the cheapest possible first registration: an existing detector, an existing remedy that is already safe under concurrency, and no judgment in between.

    Caveat worth writing into acceptance: a rebuild triggered automatically must never replace a binary a live wave is pinned to. The AFTER_WAVE guard handles that today and any scheduled version has to use it rather than reimplementing the check.

    Found while verifying whether eight rework specs could safely be requeued — the answer was no, because the guard that would have detected a wasted requeue was one of the four fixes not running.
