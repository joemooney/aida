title: 'aida faq topics: list FAQ topic tags with counts'
description: 'Deferred item 11 of STORY-1642. `aida faq topics` lists the tags in use on live FAQs, with a count per tag, so a reader can browse FAQs by topic (then `aida faq list --tag <topic>`). Acceptance: tags come from live (non-superseded/archived) FAQs only; sorted by count desc then name; agent output is a compact id-less table; test covers counts and exclusion of superseded FAQs.'
status: Completed
priority: Medium
owner: ''
