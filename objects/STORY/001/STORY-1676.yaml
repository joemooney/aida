title: 'aida regen score: install via the system''s own installer, flag crash-dominated scores, and audit oracle assumptions with cross-family runs'
description: |
  ## F28. A scorer must not assume a code layout the prompt did not state

  **Seen:** the scorer copied only `bin/`. Codex put its logic in `lib/host.py`, which its own installer makes
  reachable. The first score was 27.3% discriminating; the true score is 90.9%. A cross-family conclusion
  ("the store fails on GPT") was one step from being reported.

  **Proposal:** `aida regen score` installs the regenerated system with its own `install.sh` into a sandbox prefix,
  not by copying selected directories. It flags any condition whose failures are dominated by crashes (tracebacks,
  import errors, usage errors) for review before reporting.

  ## F33. Oracle assertions must not assume implementation choices the contract leaves open

  **Seen:**
  - The oracle ran `python3 bin/cargo-ps`, though the contract names Python only for `cargo-log`. The scorer copied
    only `bin/` (F28).
  - Every Claude and Codex regeneration happened to match both assumptions. Gemini's legitimate bash `cargo-ps` exposed
    the first, Codex's `lib/` the second.

  **Proposal:**
  - Before trusting an oracle, run it against regenerations from at least two model families, and audit each failure
    that is unique to one family for an unstated assumption.
  - Invoke tools the way a user would (by name on PATH, after the system's own installer), never through an
    interpreter.

  ## Acceptance

  Depends on STORY-1669 slices 1-2 (corpus + sandboxed raw score) and the slice-0 decision on how a project declares its installer.

  - [ ] `aida regen score` installs the regenerated system by running the project-declared install command (default `./install.sh` when present) with a sandbox prefix (e.g. `PREFIX=<sandbox>`), instead of copying selected directories. A missing or failing installer is reported as an install failure, distinct from oracle failures.
  - [ ] The oracle runs with the signed TASK-1730 immutable guards followed by fixed system PATH, and invokes regenerated tools through the explicit AIDA_REGEN_PREFIX locator; trial/prefix directories never enter oracle PATH. The scorer never prepends an interpreter (`python3 <file>`) unless the contract names it. A test fixture whose logic lives in `lib/` behind its own installer scores the same as one whose logic lives in `bin/`.
  - [ ] Each failing check is classified as crash (traceback, import error, usage/unknown-option error, exit 126/127) or assertion failure. When crashes are more than a configurable share of failures (default 50%), the score is flagged `crash-dominated: review before reporting` and is not shown as a headline number without that flag.
  - [ ] When scores from two or more model families are available, the score report lists checks that fail for exactly one family as "oracle-assumption audit candidates". (Auditing them stays a human step.)
  - [ ] Tests cover: installer-based layout, crash-dominated flag on/off, and the single-family-failure list.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), docs/regeneration/aida-feedback.md at commit e9521ab; results in docs/regeneration/results-2026-10-11-round2.md and -round3.md. Round 3: from the AIDA store, 6 of 8 models across Anthropic, OpenAI and Google regenerate the system to 86-96% of discriminating oracle checks; two checks fail for every model.
