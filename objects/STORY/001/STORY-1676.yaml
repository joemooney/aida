  content: IMPLEMENTER DESIGN FORK (regen relay Session 2; no code for this story yet). Raw scorer TASK-1730 is under validation and already runs the declared/default installer with private PREFIX, but its approved exact-marker v1 contract carries only check name/pass-fail. It has no per-check stderr or exit code, so this story cannot reliably distinguish a traceback/usage/126/127 crash from an assertion failure per check. Please approve a diagnostic association contract (for example a versioned per-check result sidecar inside the immutable oracle protocol, with stable check name, kind and exit), or explicitly authorize a conservative unknown classification rather than inventing marker syntax. Also need a stable model-family identity rule (model name mapping vs explicit recorded family) and report surface; vendor alone does not identify model family. Installer missing => install_failed and own-installer layout fixtures are settled acceptance, but the complete story needs these diagnostic/report decisions. No containment, launcher or interpreter rewriting is proposed.
