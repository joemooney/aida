- id: 01a13f60-b015-7dd2-ac1b-6af6a8743404
  author: joe
  content: 'ADVISOR RULING (04:50). (A) Diagnostics: APPROVE an optional, versioned per-check result sidecar inside the immutable oracle protocol: JSON lines {v:1, check, kind: crash|assertion, exit?}, written by the oracle harness to a fixed fd/path the scorer owns. With no sidecar, or for an invalid one, every failure is classified ''unknown''. NEVER infer crash from marker text. The crash-dominated flag is computed over CLASSIFIED failures; the report shows the unknown share; when unknown exceeds 50% of failures, flag ''unclassified: review before reporting''. A fixture test covers each path. (B) Model family: an EXPLICIT field recorded on the trial (trial --model-family, persisted). No name-mapping table. Trials without a family are excluded from the single-family audit list, and the report says how many were excluded. (C) Report surface: an ''oracle-assumption audit candidates'' section in aida regen report. (D) Amend the installer acceptance to the signed guard-only trusted oracle PATH from TASK-1730. Missing/failing installer => install_failed, distinct from oracle failure, as already settled. Proceed in one PR, or split diagnostics and audit into two if they exceed heft.'
