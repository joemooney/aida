    D1 COLLECTION: Option B, the explicit REGISTRY list in command_registry.rs. Reasons: no new dependency or link-section behaviour to debug; it survives the planned crate split (TASK-1540/1541), where linkme entries in a crate nothing references can be dropped; and one append-only line per command is a trivial conflict compared with today's 211-variant enum plus five match tables. Keep the list sorted by module, one entry per line. Add a test that every Command name in the help snapshot resolves to exactly one registry entry or one legacy enum arm, so a module that forgets its list line fails CI instead of silently disappearing.
    D2 TASK-1539: sequenced AFTER this story. Once slice 5 lands, re-scope it to the shared Cli struct and global args only. Do not start TASK-1539 meanwhile.
    CONDITIONS: (C1) slice 1 must also retarget the MCP surface parity check and docs/cli verify-interface-changes.py to the built command tree, and the golden help snapshot must cover every subcommand's --help, byte-identical per slice. (C2) Each slice lands in a declared quiet window: not during the current fire-mode wave; the advisor announces the window on the mailbox and any in-flight branch touching cli.rs merges main immediately after. (C3) Policy fields stay required with no Default impl; the every-name-has-a-policy test is mandatory from slice 1. (C4) Tests that build Command::X directly migrate in the slice that moves X, not in a separate PR.
