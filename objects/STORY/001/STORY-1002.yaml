description: 'Field suggestion (2026-09-09), extending BUG-900''s named-destination output after live multi-identity confusion (codex-advisor-1 / joe / role:implementer views; an advisor-queued task invisible to the implementer until the exact identity was supplied): every queue mutation (add, rework, move, remove) prints a complete destination block — owning queue identity; local vs global/role queue; routed role; and the EXACT command another agent runs to observe and to pick up the entry (aida queue list --user X --for Y / aida queue work SPEC --user X). Machine output (json/toon) carries the same fields. Acceptance: add/rework/move outputs show all four elements in human and json forms; a doc example in the queue-identity section; tests asserting the output contract.'
