    Proposed one-use prepared mutation contract: resolve actual owned project/common-Git root and acquire shared transport admission BEFORE CachedGitBackend or ordinary store writer lock; then store writer, then existing allocation/counter lock order. Move the private policy reader to shared core rather than duplicate it. Candidate IDs come from a detached in-memory counter snapshot held under the allocator-owned lock; no FileDispenser open/next, bootstrap/migration or live DispenserHandle call during candidate computation. Candidate token is scoped to one synchronous locked mutation, cannot survive lock release or an async await, and binds original store HEAD/config/policy hash, counter snapshot, complete final paths/bytes/deletions, generated metadata/oplog/history and effective commit identities/trailers. Recompute collision/hypothesis-dependent rows before serialization. Serialize once; run the real shared scanner over the COMPLETE artifact set and required identity/audit evidence, revalidate before the FIRST counter/object/oplog/ref effect, then consume the exact admitted plan once. No new outer policy lock from cached-inner/backend callbacks. No network while store/counter locks are held. Post-admission persistence failures must report honest partial state; no claim of cross-directory transactional rollback.

    Ordinary and cached entrypoints share this core contract. Server requests/batches prepare on a clone and run the synchronous admission/persist path before replacing authoritative in-memory state or broadcasting success; no partially validated request/batch rows may persist. Storage load-time migration and unsupported CLI/MCP/REST/gRPC/direct canonical writer families must refuse enabled WORK before any side effect until wired, bound to actual owned root rather than cwd. Optional non-authoritative provenance may be omitted only at new creation with honest reason; all required principal/recusal/grant/mandate/ownership/audit evidence remains mandatory and scanner refusal wins. Ordinary non-profile behavior stays unchanged.

