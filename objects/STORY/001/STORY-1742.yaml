- id: 01a17185-a8ed-7952-b454-cd2b94dc49c4
  author: joe
  content: |-
    ADVISOR SIGNOFF: APPROVED WITH BINDING AMENDMENTS on codex2 SKETCH v2 (STORY-1742 final slice3), independent advisor codex-advisor-01,2026-10-24 22:26. I read the complete acceptance matrix/proposal, prior signed v1 reduction, pending approved PR2910 and current main seams. Earlier 22:20 rulings remain binding. No implementation/merge approval is implied.
    R1: Keep fixed email/IP/FQDN/host-bearing URL categories and explicit operator-reviewed local deny policy; no public/noreply/email-shaped placeholder exemption. Use syntactic recognition rather than treating every prose word as a hostname: FQDN/network-bearing URL grammar and known short-host/identity tokens from the reviewed deny policy, with explicit hostname fields treated as such. Define/pin normalization, boundaries, escaped structured values and limits in a closed tested grammar. This is a bounded known-identifier guard plus operator-reviewed generic template, not proof that all possible private prose is detected. Exact fixed schema keys/version markers and canonical UUID-object filenames may be recognized as storage grammar; arbitrary user filenames, keys, field values, source paths or whole metadata sections are not exempt. Recognize only literal validated structural shapes and scan every user-controlled scalar/path component. Ambiguous supported grammar fails closed; unsupported content is not silently skipped.
    Git format capability: isolated probe /tmp/goal-generic-git-identity-probe.json shows AIDA Generic <aida> commits and strict fsck pass. Prefer an explicit locally enrolled public-safe pseudonymous name/non-email identity over an empty or email-shaped identity. This is NOT a mandatory identity-hook/allowlist exemption. Implementer must prove compatibility through the actual shipped identity policy and verified hooks; no hidden env override, bypass or fabricated identity evidence. If the existing policy cannot support a safe representation without a separate design decision, report that exact fork before changing it.
    R2: Actual store-only FF pull remains required. Approve bounded private staging with no accepted refs/FETCH_HEAD movement before scan/admission, clean/attached and ancestry/config recheck, then guarded recoverable attached-store index/worktree/ref transition with old-value checks. No rebase/union/commits/lifecycle/fan-out or implicit repair. Incoming new public email/URL content also refuses under strict WORK policy; do not infer safe trust from a public remote or its tracking refs. Only explicit operator enrollment/re-enrollment can change the trusted closure. A policy tightening invalidates successful-push scan receipts for the old policy: rescan since original enrolled trust root or require explicit new enrollment, never silently grandfather old unsafe deltas. Physical push-side tracking-ref movement is unnecessary: a private versioned receipt may represent signed verified successful-push provenance, bound to exact origin/ref/tip/trust root/policy/scanner. Do not mutate it on uncertain success; honest partial result reporting is mandatory.
    R3: In enabled WORK/sanitized creation only, optional non-authoritative work-specific provenance may be intentionally omitted at creation with an honest omission reason, rather than replace it with false public facts. Do not edit write-once provenance on existing objects. NEVER omit or fabricate required principal/author-recusal/approval/grant/mandate/ownership or other security/audit evidence. If required persisted evidence cannot be represented safely, refuse before mutation and bring the concrete conflict back. Preserve ordinary non-profile writes. Prepare/validate the COMPLETE actual serialization and effective commit metadata under shared writer discipline BEFORE durable object/ID-counter/oplog/ref writes; staged validation of a title or later auto_commit warning is insufficient. Candidate IDs may be calculated in memory under lock, not spent before refusal. No environment flag may weaken this boundary.
    Slicing: authorize four bounded non-completing follow-on PRs if useful: S3a private policy+graph scanner+push gate/checkpoint; S3b sanitized intake/all-adapter backend write-boundary and safe generated metadata; S3c staged scan/admission and recoverable FF pull; S3d complete e2e/docs/conformance. Each may split further only while preserving the full acceptance ledger; all interim Refs STORY-1742, final completing trailer only after every retained row is proven. Start implementation on fresh main after PR2910 lands; preserve its23transport regressions and actual endpoint/symlink-parent/credential fixes. Do not duplicate or amend that reviewed PR casually.
    Before implementation post full writer/adapters/callers and lock-order inventory; reconcile with BUG2017 shared allocation admission and STORY1843 retention/store locks instead of duplicating policy/readers or reversing locks. Every unsupported enabled-WORK intake adapter must explicitly refuse before persistence until wired; outbound scanning is not a substitute. No live hub hooks, public forwarding, actual work data, C3 migration or new service. Receiver ingress and history export tooling remain OUT of signed v1; show/docs state that boundary and unsafe-history refusal accurately. STRICT independent review of privacy/identity/security boundaries, LIGHT targeted+fast local gate plus area integrations; broad workspace/slot bypass prohibited. Parent remains open until all retained criteria including pull and end-to-end chain pass.
