title: Add a clone-local transport profile for side-effect-free synchronization
description: |
  ## Problem

  Some AIDA clones exist only to transport code or requirement-store refs between trusted hubs. In those clones, ordinary `aida pull` and `aida push` run lifecycle behavior such as pending-store commits, mailbox publication, automatic identifier gates, reconciliation, and mirror fan-out. Operators must therefore remember lower-level Git commands to avoid unrelated mutations, which makes the safe path difficult to discover and easy to misuse.

  ## Acceptance

  - An operator can enable, inspect, and disable a named transport profile for one clone without modifying any tracked project file or shared requirement-store object.
  - The effective transport profile is stored in clone-local Git or AIDA metadata and follows the worktree's common Git directory where appropriate.
  - In the transport profile, bare `aida push` executes every permitted push leg; code push is disabled and the only permitted leg is a ref-only push of the existing local `aida-store` tip to `origin/aida-store`.
  - The ref-only store push refuses when the store worktree has uncommitted changes or a Git operation is in progress.
  - The ref-only store push does not create a store commit, publish mailbox state, run lifecycle reconciliation or automatic identifier assignment, or fan out to other remotes.
  - `aida push --store-only` remains accepted but is explicitly reported as redundant in the transport profile.
  - `aida push --code-only` refuses with an actionable explanation that code push is disabled by the clone-local profile.
  - Transport-profile pulls perform only the configured Git synchronization legs and skip post-pull lifecycle mutations; their plan names every ref that can move before execution.
  - Human and machine-readable status report the effective clone profile, permitted legs, exact refspecs, and whether an invoked flag is redundant or forbidden.
  - Existing clones retain current pull and push behavior until the transport profile is explicitly enabled.

  ## Constraints

  - Repository Git hooks continue to run; the profile changes AIDA orchestration, not Git's hook contract.
  - Non-fast-forward pushes remain refused and no transport operation force-pushes shared refs.
  - A profile cannot silently broaden its permitted remotes or refspecs after configuration.
  - Configuration and diagnostics must not embed credentials.

  ## Non-goals

  - Replacing structural store reconciliation for ordinary multi-hub project clones.
  - Defining a general-purpose synchronization language or plugin system.
  - Disabling repository security hooks.
  - Automatically resolving diverged code or store history.
