  author: joe
  content: |-
    ADVISOR RULING (recorded 2026-10-26 05:05 MST; originally given 02:00 MST in the PR-2938 round-2 brief). WORK content policy scope: the policy applies only to content a write ADDS (new or changed objects, the metadata delta, appended oplog records), never to historical records or unchanged objects. Historical text the current policy would refuse must never block a new write.
    AMENDMENT after the PR-2938 round-2 review: intake and the S3a push gate must agree. One shared function decides what is scanned. For append-structured store files (oplog.yaml, metadata.yaml), BOTH intake and the push gate scan only the delta against the parent version of that file (appended records / changed values); every other blob is scanned whole, as today. So the push gate must not refuse a blob only because its unchanged prefix holds historical prose that intake correctly skipped. Grammar checks (real YAML anchors/aliases, size bounds per record) still apply to the full file on both sides.
