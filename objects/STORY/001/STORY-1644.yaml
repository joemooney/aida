  content: 'Item 9 audit (implementer, follow-up — not changed in this story). Remaining hardcoded default row limits: (1) aida search --limit default 200 (cli.rs Search) — recommend [search] limit + AIDA_SEARCH_LIMIT with the same flag>env>config>default precedence as [list] agent_limit, and the same ''count: N of M — showing first N'' notice when it cuts; 200 already avoids most silent truncation, so low priority. (2) awaiting_you::DEFAULT_CAP = 5 (status ''awaiting you'' / notice blocks, lifted by --verbose) — recommend leaving hardcoded: it''s a glanceable summary, already says ''+N more'' and has --verbose. (3) AGENT_BARE_QUEUE_TOPN = 5 (bare ''aida'' in agent mode) — same: leave, it''s a teaser pointing at ''aida queue list''. (4) field-study scan --limit 200 commits — an inspection budget, not a row cap; leave. Done here: [history] limit + AIDA_HISTORY_LIMIT (flag > env > config > 20).'
