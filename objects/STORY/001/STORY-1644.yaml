  content: 'Open question (implementer): Acceptance 6/8 say JSON carries truncated: true plus total. But the agent cap never applies to --json (TASK-970: machine shapes stay unbounded) and the list JSON is a bare array (STORY-1352 versioned read-only contract), so adding fields means an envelope — a breaking shape change. Implemented: JSON stays an unbounded bare array under the agent cap; when an explicit --limit cuts JSON rows, stderr gets ''note: truncated: true, total: M — showing first N by <sort>; --limit 0 for all''. Question: is that acceptable, or should list JSON move to an envelope ({total, truncated, specs:[...]}) behind a version bump / opt-in flag?'
