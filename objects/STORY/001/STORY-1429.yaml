  content: 'IMPLEMENTED on claude/story-1429 (a5a3e61514), all of A1-A9 plus the budget answer in one branch; no split was needed. Note on the budget test: when the budget runs out the drain stops with the hard-fail exit 3 (DRIVE_EXIT_HARD_FAIL, as BUG-1608 pinned), not 2, so drain_batch_requeued_spec_reshelve_spends_budget_twice and its pipelined twin assert 3. SpecRequeued is emitted only when a spec goes back into flight (Approved/Planned/InProgress); dropping a parked spec to Rejected goes through the owner but is recorded only by DispositionChanged. The lease gate fails closed on ANY unparseable lease file in .aida/sessions, not only one that names the spec, because an unparseable lease''s scope is unknown. Decision record: ADR-58.'
