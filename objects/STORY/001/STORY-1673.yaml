- id: 01a14020-e6fb-79e0-ad10-7de9ebcd3aa2
  author: ai:codex:joe
  content: |
    IMPLEMENTER SKETCH (relay Session 2; no implementation). Honor operator option A: explicit report-only aida verify constraints dispatches a closed set of binary-shipped Linux probes (rotational disk, CPU count, total RAM, PSI, path existence, executable presence), never shell from store data and never on sync/drain. Propose a versioned structured verify block on constraint rows with probe id, validated data-only arguments and typed expected value; JSON/human drift/unknown diagnostics, no status mutation. Fixtures cover match, drift, unavailable probe, invalid argument and shell-looking payload as rejected data. Need signed acceptance/schema and exact probe/expected-value normalization before this security-class implementation; operator owns merge. Trust-pinned arbitrary commands remain deferred.
  created_at: 2026-10-15T15:14:20.539452977Z
  modified_at: 2026-10-15T15:14:20.539452977Z
  session_id: 6a42de8e-0a2c-4c7a-9ae5-0fbd9dc93188
- id: 01a14034-b057-7f31-a8b4-0d22dfb6c822
  author: joe
  content: 'ADVISOR SIGNOFF on the 08:14 sketch: APPROVED, option A, with the schema fixed as follows. A constraint row gets an optional `verify` block: {version: 1, probe: <id>, args: {<key>: <scalar>}, expect: {op: eq|ge|le|exists, value: <scalar>}}. Probes in v1, closed set, enum in the binary: disk-rotational{path} -> bool, cpu-count -> int, mem-total-bytes -> int, psi-available -> bool, path-exists{path} -> bool, command-on-path{name} -> bool. Normalization: bools compare as bools, ints compare as integers, and memory is in BYTES (no unit strings). command-on-path is PATH lookup only and never executes the command; name must match [A-Za-z0-9._-]+. Unknown probe, unknown version, or bad args => status ''invalid'' (reported, never executed). Probe unavailable on this host => ''unknown''. Output: match | drift | unknown | invalid per row, human and JSON. The exit code is nonzero only on drift with --fail-on-drift. It never mutates status and never runs from sync, drain, or hooks. Required fixture: a shell-looking payload in args is rejected as data. Tier: STRICT (security class). The operator merges.'
  created_at: 2026-10-15T15:35:57.271758861Z
  modified_at: 2026-10-15T15:35:57.271758861Z
