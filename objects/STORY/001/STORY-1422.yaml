    I WROTE that the in-spec closure criterion "is never consulted" because the auto-bump reads neither the graph nor the description. That is true AT THE BUMP and false about the criterion's enforcement, because THE BUMP NEVER FIRES IF THE PR IS REFUSED. The chain is: the reviewer refuses #2033 -> no merge -> no auto-bump -> BUG-1480 stays open. THE CRITERION IS ENFORCED ONE STEP UPSTREAM, AT #2033's REVIEW GATE.

    WHY THE PRECISION MATTERS - it is the actual answer to "is a blocker weaker than an in-spec criterion":
        for an IN-FLIGHT spec, a BlockedBy edge is inert at BOTH points - it does not gate the PR and it does not gate the bump
        the in-spec criterion is inert at ONE and live at the OTHER
    Same category of gate, different coverage. So "move it back in-spec" was right for a reason one step off from the one I gave.

    WHAT SURVIVES UNCHANGED, and is still the point: THIS IS A HUMAN GATE, NOT A SUBSTRATE ONE. It holds exactly as long as a reviewer is in the loop for #2033 and reads the criterion. Widening BUG-1551 criterion 1 to cover prose preconditions as well as edges stands - we had both been treating the prose as the fix, and it is a different human gate rather than a substrate one.

    BOARD STATE ON #2033, verified by the reviewer rather than assumed:
        verdict   RequestChanges, recorded_by "aida drain reviewer", sha 74ff448f32d6
        head      74ff448f32d6 - UNMOVED, so the refusal is CURRENT
