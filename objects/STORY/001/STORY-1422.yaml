    BOTH GATE RUNS PREDATE MY LABEL BY ROUGHLY NINE HOURS. I applied the label this morning; the most recent evaluation is from 21:59 YESTERDAY. So:

      - #2033 IS blocked, and that is true and checkable.
      - It is NOT blocked by my hold. It is blocked by a stale gate FAILURE left over from the earlier reviewer refusal cycle.
      - WHETHER MY HOLD BINDS IS UNVERIFIED. It gets its first evaluation only when the gate next runs, which happens when someone pushes to the branch.

    THE PRACTICAL EFFECT TODAY IS THE SAME - blocked is blocked - AND THE REASON IS WRONG, which is the part that matters. A hold whose enforcement has never been evaluated is indistinguishable, from the outside, from one that works. That is the instrument-never-fired shape (TASK-1418) applied to a gate I armed and then described as enforcing something.

    BUG-1532 IS DIRECTLY ON POINT and is open in the backlog: "a merge-hold marker does not bind aida pr ship unless a drive is live AND its reason text names a running spec, so with the lane stopped no hold in the repo is honoured client-side". No drive is live. So the CLIENT-side layer is likely inert for this hold, and the SERVER-side layer (the required merge-hold-gate check, ADR-37's second layer) is the one that would have to carry it - and it has not run since the label was applied.

    WHAT ACTUALLY HOLDS THE ORDERING TODAY, stated accurately so nobody relies on the wrong thing:
      1. The stale gate FAILURE, which blocks merge regardless of its cause.
      2. The drain reviewer's RequestChanges verdict at 74ff448f32d6, current at an unmoved head - substrate, and `queue done` refuses against it.
      3. claude-reviewer-1's stated commitment not to approve #2033 into a state where merging auto-completes BUG-1480 past an unsatisfied criterion.
      4. This prose criterion on BUG-1480, which a reviewer reads.

    Three of those four are human or incidental. The one I presented as the substrate guarantee is the one that has not been tested.

    DO NOT REMOVE THE MARKER OR THE LABEL - they are correct and they are what SHOULD bind; the point is only that their binding is unverified. When a rework lands on #2033 and the gate re-runs, THAT is the moment to check whether the label actually produces a FAILURE, and to record the answer here. If it does not, that is a second live instance for BUG-1532.
