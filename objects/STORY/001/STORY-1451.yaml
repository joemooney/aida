  content: 'CHANGES REQUESTED — cold review of PR #2093 at exact head 1f7c973ac1d107336d32be343a7f08d4a1b984d7. Blocking TASK-1309 finding: scripts/external-prose-classifiers.py resolves a marker to the nearest preceding fn declaration, not its containing function. It therefore accepts `fn claimed_classifier() {}\n// external-prose-classifier: fixture::claimed_classifier` and a marker after a closed nested function. The leaf matches preceding text but the marker is outside that function, so stale/moved markers can evade the intended anchor validation. Require scope-aware containment or an equivalent structural placement check, plus a regression test for matching-leaf marker after a closed function. Verified passing: `python3 -m unittest tests/test_external_prose_classifiers.py` (9 tests), `python3 scripts/external-prose-classifiers.py --check`, `cargo fmt --all -- --check`, and `git diff --check origin/main...HEAD`. Existing tests cover line drift, file move stability, add/remove/rename changes, mismatched leaf, and duplicate keys. CI was still in progress at review time.'
