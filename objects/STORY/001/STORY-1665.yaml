  author: joe
  content: |
    [groom:night] NEEDS-DECISION. The spec itself says it needs an architecture sketch and advisor signoff. Not started on main; STORY-1653 (driver column) is completed. Options as stated:
    (1) Keep per-lease rows (status quo).
    (2) One row per live process whose cwd is the project root, with role from per-process env or the session manifest; fold or hide legacy harness leases.
    (3) Link relay processes to their spec leases through env/manifest (AIDA_SESSION_ID in /proc/<pid>/environ) instead of cwd, giving relay leases a real pid.
    Recommendation: (3) first, as its own slice. It is the smaller, more general fix (real pids on relay leases also help reaping and the liveness probes). Do (2) as a follow-up display change once (3) supplies the process-to-lease mapping. Note that /proc environ is Linux-only, so a manifest-based fallback is needed on macOS. Low priority; sketch before approval.
