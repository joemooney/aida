title: 'aida ps: one row per live process on the main checkout, and relay processes linked to their spec leases'
description: 'Follow-up from BUG-1941, acceptance (c), deferred by the night seat 2026-10-11. PR #2535 made the main-checkout pid deterministic and stopped labelling placeholder leases ''subagent''. Rows are still per lease, though, and processes whose cwd is the project root (the advisor, claude -p relays that drive other worktrees through absolute paths) are grouped under old harness-worktree leases. Options: (1) keep per-lease rows (today''s behaviour); (2) one row per live process whose cwd is the project root, with its role taken from per-process env or the session manifest, folding or hiding the legacy harness leases; (3) link relay processes to their spec leases through env/manifest (e.g. AIDA_SESSION_ID in /proc/<pid>/environ) instead of cwd, which would give relay leases a real pid. Implementer recommendation: (3) plus (2). Needs an architecture sketch and advisor signoff. Related: STORY-1653 (driver column).'
