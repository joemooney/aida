title: 'GitLab Slice 1: route the high-traffic keyboard paths through the Forge trait'
description: 'Point the direct-gh keyboard-path sites at existing trait methods: queue recover''s gh pr create --fill -> open_change; release --after-pr merge -> merge_change; pr ship / reviewer open-PR lookup -> change_for_branch; aida review''s gh pr diff + metadata -> change_metadata. Proposed mode: drive. Acceptance: these paths run through forge_for()/the trait (no direct gh spawn); GitHub behaviour unchanged (tests green); a GitLab repo exercises the GitLabForge equivalents. Depends on Slice 0.'
