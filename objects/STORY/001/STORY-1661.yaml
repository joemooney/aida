title: 'Background history indexer: keep the history index current after store commits so bare ''aida history'' rarely falls back to the digest'
description: 'Follow-up from the STORY-1650 catch-up decision (2026-10-10). STORY-1650 does only a BOUNDED inline catch-up on the bare ''aida history'' flow path, so a large gap (bulk adds, a long-idle store, a big pull) falls back to the digest with a ''behind'' note. Keep the index current off the hot path instead: e.g. a post-commit/post-pull hook or a schedule tick that runs the budgeted catch-up (BUG-1923) detached with single-flight locking (the STORY-1484 pattern). Acceptance: after a burst of 200 store commits, bare ''aida history'' shows the status flow within one tick, with no inline catch-up beyond STORY-1650''s cap; there''s no contention with the cache refresh lock; and it''s off by default where the history index is disabled.'
