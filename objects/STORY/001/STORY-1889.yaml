title: Isolate gate-authority code into a protected gate/ module so routine ship and hold changes stop needing a human merge
description: |-
  Operator discussion 2026-10-21. GATE_PROTECTED_PATHS covers 14 files, about 23k lines. The big three are large and busy: pr_ship.rs (5342 lines, 2741 of them inline tests, 28 commits in 30 days), merge_hold.rs (5228, 4784 tests, 26 commits) and review_verdict.rs (2957, 1811 tests, 26 commits). Of tonight's four human-only merges, only #2792 (mandate_ship_cover) changed a gate decision. #2798 changed store-history helpers in mandate.rs, #2797 changed commit-trailer parsing in pr_ship.rs, and #2712 was mostly a new test in merge_hold.rs.

  Acceptance:
  1. Move the gate decisions into aida-cli-lib/src/gate/: mandate ship cover, hold-clear authority, verdict acceptance (which verdict counts, attestation, same-SHA), seat authority, and the protected-path list itself. Orchestration, store-history helpers, trailer parsing and the gate-check report code stay outside and call in.
  2. Move the inline test modules out of the protected files. Tests of the gate/ core go to a separate protected test file, because weakening a gate test is a loosening. Optionally, a mandate may ship a diff that only adds lines to that test file.
  3. GATE_PROTECTED_PATHS becomes the gate/ prefix, plus .aida/config.toml and the protected test file(s). This needs the prefix matching from STORY-1888, and its ratchet test enforces that no gate decision lives outside gate/.
  4. Behaviour is unchanged. Show it with the existing story_1698/story_1700 mandate tests plus a before/after list of every refusal reason string.

  Sequencing: one human-merged refactor PR. Land it after the open PRs touching these files (#2798, #2792, #2789) merge, to avoid conflicts. Architecture change, so it needs a sketch with advisor signoff first.
