title: 'Automatic fasttrack routing: trivial specs enter the lane by rule, not by remembering'
description: |-
  Problem: the fasttrack lane (STORY-587, TASK-777, TASK-905, TASK-906) works, but only 11 specs have ever gone through it, about 2 recently. It depends on someone remembering to use it, so straightforward work takes the full ceremony.

  Proposal: route by rule at approval and dispatch time.
  - Eligible: docs-only, test-only, or a small expected diff (threshold set in config); not tagged security/authority/sandbox/credentials; no architecture tag; spec heft at most 1.
  - The router tags the spec fasttrack and says why. The advisor can veto, and anything ineligible discovered during implementation punts out of the lane (the existing punt discipline).
  - Fasttrack items get LIGHT review (pairs with the risk-tiered review story). CI stays the only gate, as STORY-587 intended.

  Acceptance:
  1. One eligibility function with table tests: eligible and ineligible cases, including a security-tagged doc fix, which stays OUT.
  2. Approval or queueing of an eligible spec auto-tags it fasttrack with a one-line reason visible in aida show and aida fasttrack status; the advisor can remove the tag with a recorded veto.
  3. A spec whose diff turns out to touch STRICT paths is punted out of the lane automatically before merge. Tested.
  4. Measured: the lane's share of completed specs, and the median start-to-done time of fasttrack items versus the rest, reported after two weeks.
  Process change: needs a sketch on this spec and advisor signoff before implementation.
