title: Flag in-progress specs nothing is working in aida awaiting after an idle threshold (STORY-1653 slice B)
description: |
  ## Why
  Slice B of STORY-1653. Slice A (PR #2542) ships the driver registry, lease owner chain, and the `driver` column in `aida ps` / `aida list --driver`. It deliberately leaves out the staleness signal, STORY-1653's design item 4 and the second half of its fourth acceptance criterion: an in-progress spec that nothing is working stays invisible until someone happens to look at it.

  ## Design
  - A config key (e.g. `[awaiting] idle_in_progress_hours`, default 24) sets the threshold.
  - Idle age = time since the spec's last activity: the newest commit on its branch/worktree if one exists, otherwise its last status change.
  - `aida awaiting` lists every spec whose driver resolves to `idle` and whose idle age exceeds the threshold as "in-progress but nothing is working it", with the age. Driven specs (`relay:`/`drain:`/`agent:`) and `queued` specs are never listed.

  ## Acceptance
  - A spec with no lease and no covering driver, in-progress past the threshold, appears in `aida awaiting` with its idle age. The same spec under the threshold does not.
  - A spec resolving to `relay:<run>`, `drain:<pid>`, `agent:…` or `queued` never appears, whatever its age.
  - The threshold is read from the config key, and the default is 24h. Idle age comes from branch commits when a branch exists.
  - TOON and JSON carry the entry. Tests use fake pids, fixed clocks and isolated HOME.

  ## Related
  - Parent: STORY-1653 (slice A: PR #2542).
