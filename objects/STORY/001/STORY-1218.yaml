title: 'aida shift tick: scheduler-run night-shift loop (launch drain waves when the lock frees, re-drive parks, reap, mailbox-latency escalation) with a systemd user timer installer'
description: |-
  Goal: make the overnight window repeatable without depending on an interactive agent being awake. The 2026-09-17/18 night worked because a product-seat session relaunched drain waves whenever the lock freed and an advisor session gated merges; both were LLM sessions holding a Monitor. The one-hour unread-mail gap the advisor found in its own audit is the failure mode: the loop moves only while an agent notices.

  Proposal: a deterministic, LLM-free tick command run by a system scheduler, composing surfaces that already exist (aida supervise for transient re-drives per ADR-26, aida session reap, aida awaiting --notice, the drain lock, aida advisor watch --once for the presence-gated fork):

  aida shift tick [--dry-run] [--json]
    1. If the drain lock is free and the role:implementer queue has entries whose execution_mode is drain (never drive/guided/operator/decide), launch the next wave: aida queue work --batch <auto or configured> --auto-complete --no-human=both --escalate-blocks --max-failures N. Wave size, max-failures and the batch selector come from [shift] config.
    2. Run aida supervise (transient parks) and aida session reap.
    3. Compute mailbox latency per seat (TASK-1271) and, above the threshold, escalate to the operator channel ([shift] notify = ntfy|mail|desktop command), never to chat.
    4. Emit one ShiftTick event with what it did; quiet when nothing to do.
    Guarded: refuses to launch when a human-gated wave is in flight, when the machine is over a load/memory ceiling, or when a drain lock is live; idempotent; safe to run every 10 minutes.

  aida shift install --systemd-user | --cron   writes the unit+timer (OnUnitInactiveSec, journal logging, PATH to the activated binary, loginctl enable-linger reminder) or a crontab line for --once; aida shift status shows last tick, next tick, what it launched.

  Why systemd user timer over cron as the default: overlap protection (OnUnitInactiveSec + the unit is a single process), journal logging, environment control, and it survives logout with linger; cron remains the portable fallback via --once. The interactive seats keep their Monitors for real-time reaction; the tick guarantees progress when they are gone.

  Acceptance:
  - With a queued drain-mode batch and no live drain, one tick launches the wave and the ShiftTick event names it; a second tick within the wave is a no-op.
  - A queued drive/guided/operator spec is never launched by the tick.
  - A transient park is re-driven by the tick (via aida supervise) without an interactive seat.
  - Mailbox latency above the threshold raises the configured notification once, not every tick.
  - aida shift install --systemd-user produces a working timer on this box; docs/autonomous-drain.md gains a "night shift" section that is the runbook.
  - Off by default; opt-in per project via [shift] enabled = true.
  - (advisor refinement 2026-09-18) The tick launches a wave through the SAME lock path as a manual `aida queue work` (one drain per repo, BUG-538): a tick that finds the lock held by a live pid is a no-op; a stale lock (dead pid) is released and logged as a ShiftTick event with the recovered pid, never force-launched over a live one.
  - (advisor refinement 2026-09-18) `aida shift tick --dry-run` prints the exact wave command, the specs it would include, the guards evaluated (lock, load ceiling, human-gated wave in flight, [shift] enabled) and the mailbox-latency verdict, and exits 0 without writing; this output is the runbook's preflight step and is covered by a test on a fixture queue.
  - (advisor refinement 2026-09-18) Built after SPIKE-82 lands: the wave-size default, the max-failures default and the guard list are taken from the spike's confirmed hypotheses, cited in the story's plan file.
  - (moved from STORY-1226 at the #1946 gate, 2026-09-18; ADR-46 §1) Cold-boot of a headless seat for an overdue SEAT job is the tick's: when a seat job is overdue and no live session holds the role, the tick cold-boots a headless seat (codex exec / claude -p per configured vendor) at most once per hour per seat, ledgered on the job (JobLedger.cold_boot_at, which STORY-1226 reserved), never for a job that would launch a drain or merge. Acceptance: with an overdue advisor seat job and no live advisor, one tick cold-boots once; a second tick within the hour is suppressed and says so; a live advisor session suppresses the cold-boot entirely; the ledger shows cold_boot_at and the seat/vendor used.
