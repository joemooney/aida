  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was punted on: design-fork: Storage location conflicts between the spec''s own records, and the choice is a data-model/store-layout decision that needs an architecture sketch + advisor signoff (repo rule) before code. (1) CR-8 reserved a slot for the originating prompt INSIDE FilingProvenance (aida-core/src/models.rs:699, provenance.rs:886) and the 2026-09-24 proxy decision says ''one field of CR-8''s provenance struct''. (2) The 2026-09-24 product decision says captured prompts live in a SEPARATE provenance/artifact location, not the requirement body, and normal views AND agent context must not include it. filed_at is serialized into the requirement YAML and rendered by aida show (requirements_cli.rs:6617/6997/7269/7728) and MCP output, so option (1) puts the prompt in every agent-context read unless each projection filters it. Option (2) adds a new .aida-store artifact path that the git/sqlite/postgres backends, archive/merge and retention must all handle. Also unspecified: the opt-in surface (config key name; whether the flag is aida add --origin-prompt / --origin-prompt-stdin plus an MCP add_requirement param, or hook-based auto-capture from UserPromptSubmit), redaction semantics (reuse an existing secret scrubber and refuse vs. mask), and retention.. No triage reason was given.'
