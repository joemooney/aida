  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-1468):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 54ba3617ef05
    Recorded: 2026-11-06T01:14:21.069469096+00:00
    Findings:
    1. BLOCKING (CI red, caused by this PR): docs/cli/02-specs.md:17 'aida show STORY-123 --origin-prompt' contains a bare SPEC-ID. The CI (contracts) step 'CLI-manual drift-guard (every command documented)' (docs/cli/verify-manual.py:813-826 spec-id leak check) hard-fails on it. Use a placeholder such as 'aida show <spec-id> --origin-prompt'. Then re-check that the step passes, including its --flag citation checks.
    2. minor: aida-cli-lib/src/mcp.rs tool_add_requirement origin_prompt branch (~L2094-2111) commits the spec and artifact, then applies the parent link in a separate update_atomically. If that second write fails, the tool returns Err after the spec was already filed, so an agent retry files a duplicate spec and a second prompt artifact. Either apply the parent edge in the same create write, or return success with a link-failed warning. No test covers origin_prompt together with parent.
    3. minor: aida-cli-lib/src/mcp.rs ~L1930: args.get("origin_prompt") treats an explicit JSON null as a capture request. It runs check_origin_prompt_support, which refuses filing on a non-git store, then errors with 'origin_prompt.text must be...'. The schema says 'Omit to opt out', and many MCP clients send null for optional fields. Treat null as opt-out; likewise treat 'redacted': null as the default false instead of erroring.
    4. cosmetic: the MCP schema declares additionalProperties:false for origin_prompt (mcp.rs ~L7516), but the handler ignores unknown keys. A typo such as {"text":..., "redact": true} is silently stored as disposition Captured. Reject unknown keys in the handler to match the schema.
    5. cosmetic: adding origin_prompt as the FIRST field of ShowArgs (requirements_cli.rs:6251) reorders existing 'aida show --help' options: -v/--verbose, --card and --brief move (cli_help_snapshot.txt ~L1071-1101). Declare the new field after the existing ones so only the new flag is added to help.
    6. minor: 'aida show --origin-prompt' conflicts only with tree/card/json. --raw, --rels, --comments, --no-git and --verbose are accepted and silently ignored. Extend conflicts_with_all, or document that they are ignored.
    7. minor: the BUG-2140 deferred-target catch-up (git_backend.rs:1057 stage_oplog_and_deferred_targets) stages earlier uncommitted ops' objects but not their provenance/origin-prompts artifacts. Scenario: a create-with-prompt whose auto-commit failed (staging error) is later committed by another write as object-only, and the artifact stays untracked until sync_objects runs. Stage the matching artifact for deferred Create targets.
    8. minor: the signoff said to reuse an existing secret screen if one exists. aida-cli-lib/src/db_reconcile.rs:1119-1145 redact_secrets already encodes the ghp_/sk-/AKIA token prefixes, and origin_prompt.rs:1026 re-implements them separately. Consider sharing one pattern set (moving it to aida-core) so the two screens cannot drift.
    9. test gap (non-blocking): the CLI 'aida show --origin-prompt' output path (requirements_cli.rs:6527-6549, human and --format json) and the WORK-transport capture refusal (storage.rs:258 / git_backend.rs:640 refuse_unsupported) have no automated test. Only clap parsing and the PR-body smoke check cover them.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
