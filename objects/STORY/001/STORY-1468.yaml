- id: 01a1ad0a-f9fc-7c33-9bf4-987f6c401076
  author: joe
  content: 'ADVISOR SIGNOFF 2026-11-05 12:00 MST on the 18:15Z sketch: APPROVED points 1-7, amended as follows. (1) Explicit intake only, as proposed: --origin-prompt-file, --no-origin-prompt and the MCP add_requirement origin_prompt. Capture is OFF by default and there is no hook capture in this slice. (2) Separate artifact provenance/origin-prompts/<uuid>.yaml in the git-canonical store; CR-8''s inline slot is superseded. (5) Backend scope: ONLY the git-canonical store implements it. sqlite and postgres refuse explicit capture with a named error BEFORE any mutation (single user, no parity work). Archive, remap and merge preservation is tested on git only. (4) Redaction: reuse the existing secret screen if one exists, otherwise a small private-key and token regex refusal; content-free errors; 64 KiB cap. (6) Retention as proposed, with no purge tooling. One PR, LIGHT gate, tests per point 7 minus the non-git backend rows except a single refusal test.'
