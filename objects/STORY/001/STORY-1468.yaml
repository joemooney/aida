  content: 'Product decision: originating-prompt capture is OFF by default. It becomes configurable opt-in (project/user policy and/or an explicit intake flag), with captured material stored in a separate provenance/artifact location rather than the normal requirement body. Normal requirement views and agent context must not include it; retrieval requires an explicit operator/agent request. The opt-in path must support redaction/secret avoidance and make the storage location and retention behavior clear.'
