attention_reason:
  category: design-fork
  detail: 'Storage location conflicts between the spec''s own records, and the choice is a data-model/store-layout decision that needs an architecture sketch + advisor signoff (repo rule) before code. (1) CR-8 reserved a slot for the originating prompt INSIDE FilingProvenance (aida-core/src/models.rs:699, provenance.rs:886) and the 2026-09-24 proxy decision says ''one field of CR-8''s provenance struct''. (2) The 2026-09-24 product decision says captured prompts live in a SEPARATE provenance/artifact location, not the requirement body, and normal views AND agent context must not include it. filed_at is serialized into the requirement YAML and rendered by aida show (requirements_cli.rs:6617/6997/7269/7728) and MCP output, so option (1) puts the prompt in every agent-context read unless each projection filters it. Option (2) adds a new .aida-store artifact path that the git/sqlite/postgres backends, archive/merge and retention must all handle. Also unspecified: the opt-in surface (config key name; whether the flag is aida add --origin-prompt / --origin-prompt-stdin plus an MCP add_requirement param, or hook-based auto-capture from UserPromptSubmit), redaction semantics (reuse an existing secret scrubber and refuse vs. mask), and retention.'
  lean: 'Separate artifact: .aida-store/provenance/<SPEC-ID>.prompt.yaml, write-once, reached only through an explicit aida show <ID> --origin-prompt (and an MCP flag); filed_at gets just a has_origin_prompt: bool marker. Opt-in: config key intake.capture_origin_prompt (default false) AND an explicit aida add --origin-prompt-stdin / MCP originating_prompt param. The prompt is ignored with a one-line notice when the policy is off. Redaction: run the existing secret-pattern scrubber and store [REDACTED:<kind>] markers with a redacted: true flag; never store raw matches. Tests: absent / redacted / captured, plus an edit-preserves-prompt test. Implement after an advisor-signed sketch, probably split into store-artifact + intake-surface slices.'
  raised_by: implementer
  raised_at: 2026-11-04T12:48:16.653817878Z
