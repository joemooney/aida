    Findings:
    1. BLOCKING (CI red, caused by this PR): commit 9ee08bfb250 adds the Build-job step 'Run originating prompt CLI output regression' to .github/workflows/ci.yml:421, but scripts/ci-gate-tiers.toml does not list it. scripts/check-ci-gates.py audit() (L229-252) reports 'CI gate is not classified' and CI (gates) step 'STORY-1853 test-speed tooling tests' fails at 1d5ab874677b. main at a8e8311 is green. Fix: add '"Run originating prompt CLI output regression" = "full"' under [tiers] next to the show-latency entry (L72), then re-run make check-ci-fast. The earlier check-ci-fast pass predates this ci.yml edit.
