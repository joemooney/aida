  content: 'Architecture sketch (Codex, 2026-09-18) — slice 1 only:\n1. Add a provider-neutral protocol module in aida-core that resolves a type protocol from META requirements using the stable tag/slug protocol:<type>, returns the META id, a <=40-line pickup block, and a one-line reminder. Resolution reads the live store each invocation so META edits require no rebuild.\n2. Seed one META protocol per supported work type during init from embedded defaults, including the spike deliverable/reviewer two-part contract. Preserve idempotency and existing-project data.\n3. Add aida protocol list/show <type> as read-only CLI projections over the same resolver.\n4. Inject the labeled type layer (type protocol < spec acceptance) into interactive pickup entry surfaces in this slice: queue work / do / worktree enter, using one shared formatter. Do not add lane, MCP, headless, or done-gate behavior (TASK-1277/1278).\n5. Extend aida awaiting --notice to print the one-line reminder only when the current session holds a spec lease; naturally disappears when the lease is cleared/done.\n6. Add focused resolver, seeding, CLI, prompt-cap, live-edit, and notice lifecycle tests; trace implementation with STORY-1221.'
