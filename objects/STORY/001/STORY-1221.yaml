spec_id: STORY-1221
agreed_id: STORY-1221
title: 'Typed protocols: per-requirement-type (and per-lane) protocol stored as META, injected at pickup and per turn while the lease is held, and checked at done'
description: |-
  Operator question (2026-09-18): agents are context-limited, so instead of hoping a model remembers how a SPIKE (or ADR, bug, docs task) is supposed to be done, AIDA should inject the type's protocol into the conversation whenever the agent works that kind of spec, and check it when the work is declared done.

  What exists today: the discipline pack (.aida/discipline/*.md) is read on demand and only its README is imported; CLAUDE.md is the always-loaded surface and is already large; the pickup prompt (aida queue work / aida do) injects a role-context snapshot and the plan brief, but nothing type-specific; skills quarantine specialised guidance but the agent has to know to invoke them; META requirements exist for AI prompts. The result is rules like "a spike is headless only when its output is an evidence-grounded report and an advisor reads it before anything builds on it" (TASK-1275/1276) living in an advisor's memory and a mailbox thread.

  Proposal: a typed protocol, one per requirement type (and optionally per lane: research, docs, keystone), stored in the substrate and loaded at the moments that matter.
  1. Storage: a protocol is a META requirement (editable, versioned in the store, exportable with the tree) with a stable slug (protocol:spike, protocol:decision, protocol:bug, protocol:doc, protocol:story, protocol:task) and a short body: purpose, deliverable shape, what must exist before done, what the reviewer checks, what stays human. aida init seeds defaults from aida-core/templates (the spike two-part test is the first one); projects edit them like META-002.
  2. Injection, budget-aware: (a) aida queue work / aida do / aida worktree enter prepend the protocol body (capped, e.g. 40 lines) to the pickup prompt for the spec's type and lane; (b) the per-turn notice hook (aida awaiting --notice, wired for Claude in settings.json AND for Codex in .codex/hooks.json per TASK-1181; any other vendor gets it through the pickup prompt and the aida command banners) adds one line while the session holds a lease on a spec — "protocol: spike — deliverable docs/spikes/<date>-<slug>.md; advisor reads before anything builds on it" — so a compacted session re-learns it every turn at ~1 line of cost; (c) the MCP server exposes aida://protocol/<type> for MCP-native clients; (d) headless drains put it in the implementer and reviewer prompts.
  3. Check at done: aida queue done / aida pr create run the protocol's machine-checkable items (a file matching the deliverable glob exists in the diff; an ADR has status accepted and a references edge; a bug PR touches a test) and refuse with the missing item named; the reviewer prompt carries the same checklist so review rounds cite it.
  4. Precedence: type protocol < lane protocol < the spec's own ## Acceptance; the injected text says which layer each line came from.

  Acceptance:
  - aida protocol show spike prints the seeded spike protocol; aida protocol list names one per type.
  - Picking up a SPIKE via aida queue work shows the protocol at the top of the pickup prompt; picking up a BUG shows the bug protocol; the text is capped and cites its META id.
  - While a session holds a lease on a SPIKE, the per-turn notice includes the one-line protocol reminder; it disappears after aida queue done.
  - aida queue done on a SPIKE whose PR has no docs/spikes/*.md refuses and names the missing deliverable; --force overrides with a ledger comment.
  - Editing the META body changes what is injected on the next pickup; no binary rebuild.
  - Token cost measured: pickup prompt grows by at most the cap; CLAUDE.md does not grow.
  - Vendor parity (operator requirement 2026-09-18): every injection channel and the done-check work identically for a Codex seat — pickup prompt, .codex/hooks.json per-turn notice, headless codex exec prompts, and AGENTS.md pointer — with no channel that exists only for Claude; the acceptance run is executed once under each vendor.
