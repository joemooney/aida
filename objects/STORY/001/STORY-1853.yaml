- id: 01a15210-d8c8-7570-ac9a-59425fd9d771
  author: joe
  content: |-
    Operator finding (2026-10-18 19:49): fix-2725 and aida-agy-batch were in test EXECUTION. Both ran the debug profile, while automatic cache seeding defaults to the agent profile. The light gates already use --profile agent (Makefile:260 test-touched, :515 check-ci-compile), so they hit the seeded cache. A full 'cargo test --workspace' / 'make check' rebuilds debug cold in each worktree and then runs unoptimized tests. Adds to the slices:
    - S0b: any local full run uses '--profile agent' (cargo test --workspace --profile agent; Makefile full-test targets default to it). Debug stays CI-only. Alternatively, seed the debug/test profile too, but agent is the cheaper default.
    - S1 measures debug vs agent test-execution time for the lib binary and the top-10 integration binaries, to decide whether CI should also move to an opt-level-1 test profile. Opt-level 1 speeds up execution; check its compile cost on a cold CI cache.
  created_at: 2026-10-19T02:49:58.216123696Z
  modified_at: 2026-10-19T02:49:58.216123696Z
  session_id: 02ae01a2-5cde-49db-b318-efb49691c3e3
- id: 01a15265-6411-7253-b501-704481711095
  author: joe
  content: 'Advisor, 2026-10-18 21:25 MST. Two new findings for this story. (1) `make test-touched` can widen to the whole `aida-cli-lib --lib` suite (~9,200 tests). merge-2750 hit it on #2750 at about 21:00 and had to kill it. S0 should cap or warn on that widening: a ''targeted'' gate that silently becomes the full suite defeats the gate discipline. (2) The operator observed that caller timeouts (the 1h tool cap, agents'' `timeout 3000`) count slot-queue wait: TOTAL 1h00m = WAIT 31m + RUN 29m. Queued runs time out, get retried, and the backlog compounds. The wrapper-side fix (a run-phase budget that starts at slot acquisition, a queue-timeout, retry-chain visibility, agent guidance to run long cargo in the background) is filed as aida-host STORY-100.'
