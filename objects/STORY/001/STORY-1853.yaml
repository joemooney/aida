  content: 'Correction to S0: the templates already say the full suite runs only in CI (implementer-discipline.md:257, aida-pickup.md:478). The violations come from briefs. The advisor''s own briefs told the integrator to run ''make check-ci'' (relay 20261017-182837, 18:55 and 19:18 mails), and fix-2725 ran ''make check'' with AIDA_CARGO_NO_SLOT=1. So S0 is: (a) advisor and fixer briefs say check-ci-fast + test-touched + check-ci-compile and never the full suite; (b) a guard. cargo-slot should refuse AIDA_CARGO_NO_SLOT for agent-role sessions, or warn loudly, so a brief can''t bypass the limiter. No template rewrite needed.'
