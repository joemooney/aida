  content: |-
    RELIABILITY CAVEAT (verified 2026-09-11): a bare mailbox nudge is UNRELIABLE at delivery-to-attention. The advisor only sees mail via the SessionStart + per-turn UserPromptSubmit hooks (aida-mail-notice.sh), so a nudge lands ONLY when the advisor takes a turn. It does NOT reach: an idle advisor sitting at the prompt (no turn = no hook), a headless -p drain mid-run (no interactive turns), or a closed session. This is the same flaw as BUG-1063. So the nudge, alone, only works against an interactive advisor a human is already driving.

    Acceptance revision: the nudge must NOT be a bare mailbox write. Tiered delivery, most-to-least reliable:
    1. If aida session send (STORY-995) is available AND the advisor is in a wake-able terminal (tmux/wezterm/Terminator plugin): mailbox-write THEN `aida session send <advisor> --enter` to force a turn so the notice fires. This is the only reliable WAKE.
    2. Else if the advisor is live but not wake-able: mailbox-write and ALSO operator-notify (STORY-1029) that a nudge is waiting the advisor may not see — so the human can poke it.
    3. Else (no advisor live): operator-notify only ("N stuck, no advisor running, start one").
    Add: a nudge whose target never acts within one min-interval ESCALATES to the operator (a nudge the advisor never read must not silently rot). And note plainly in docs: the session-independent supervisor (STORY-1051 / a cron) is the RELIABLE path — this nudge tier is a best-effort convenience that depends on a listening advisor.
