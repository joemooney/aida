title: 'aida regen trial: enforce regenerator isolation with an OS sandbox and a scrubbed environment for every harness'
description: |
  ## F30. Enforce regenerator isolation with an OS sandbox for every harness

  **Seen:** the bwrap-isolated runs (E7a, E7b) could not see the repo, transcripts, live wrapper or lock dirs. The
  honor-system Claude subagent E2r-c accidentally ran the original `tmp-sweep`.

  **Proposal:** `aida regen trial` launches every regenerator, whatever the harness, under the same sandbox
  (read-only root, the project and transcripts hidden, only the work dir writable). Isolation then becomes a property
  of the method, not of instruction-following.

  ## Acceptance

  Depends on the STORY-1669 slice-0 decision (which harnesses `aida regen trial` launches). Reuse the existing bwrap confinement in `aida-cli-lib/src/session.rs` (`bwrap_confinement_args`, `bwrap_preflight`) rather than a second sandbox implementation.

  - [ ] `aida regen trial` launches every regenerator (Claude Code, Codex, Gemini/agy, or any configured harness) under the same OS sandbox: read-only root, the project checkout, `.git`, AIDA store worktree, agent transcripts and the live tool homes (e.g. `~/.local/bin`, `~/.claude/projects`) not visible, only the trial work dir (and the frozen corpus, read-only) mounted; HOME and XDG dirs are private temp dirs.
  - [ ] The environment is scrubbed to an allowlist; each harness profile declares the minimum extra it needs (its auth file mounted read-only, named credential env vars, network on). Anything not declared is absent; the effective allowlist is recorded on the trial.
  - [ ] If the sandbox cannot be established (no bwrap / userns denied), the trial refuses to start with the existing remediation hint; there is no unsandboxed fallback.
  - [ ] A canary test: from inside a trial, attempts to read the project checkout, a transcript path and the live wrapper on PATH all fail, and the trial record shows isolation `enforced`.
  - [ ] No harness relies on instruction-following for isolation (no "do not read X" prompt as the only control).

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), docs/regeneration/aida-feedback.md at commit e9521ab; results in docs/regeneration/results-2026-10-11-round2.md and -round3.md. Round 3: from the AIDA store, 6 of 8 models across Anthropic, OpenAI and Google regenerate the system to 86-96% of discriminating oracle checks; two checks fail for every model.
