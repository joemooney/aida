title: 'Operator batch-ship for human-gated PRs: refresh, re-review and ship in sequence'
description: 'On 2026-10-21 every operator-gated merge (PRs touching mandate.rs, pr_ship.rs, merge_hold.rs or operator-only specs) made the other gated PRs stale. Each then needed gh pr update-branch, a CI rerun, a fresh independent review and another operator round-trip (#2792, #2798 twice each). Idea: an operator command that takes a list of approved gated PRs and, in order, ships one, refreshes the next, waits for CI and a fresh attested review, then asks the operator to confirm the ship at a TTY. The human gate is kept while the operator only has to be there for confirmations.'
