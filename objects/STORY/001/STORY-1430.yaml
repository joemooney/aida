- id: 01a0d141-0af8-7b03-86a3-7b06eeeb2d33
  author: joe
  content: '[aida:implementer] Implemented on claude/story-1430 (e3e70b06df, pushed, no PR yet). REPRESENTATION: two explicit declared forms, read by aida_core::pickability::unmet_declared_closure_criteria: (1) tag closure:pending (whole-spec flag; resolve with aida edit ID --remove-tag closure:pending); (2) unchecked ''- [ ]'' items under a ''## Closure'' heading (or a bare ''Closure:'' / ''Closure criteria:'' label) in the description; ''- [x]'' = met, and each unchecked item''s text is what the refusal names. REJECTED: a new model field (needs schema + cache + MCP + edit-flag plumbing for the same bit a tag carries); a typed relationship (BUG-1551 already covers the spec-to-spec case via BlockedBy; criteria like ''re-measure under 26s'' are not specs); NLP over free-text acceptance (the hand-run grep this replaces, with the same false-negative failure). GATE: the auto-bump and db reconcile-status REFUSE via the ADR-57/BUG-1551 hold: spec lands at Done, a [aida:closure-held] note names the unmet criteria and who resolves them (owner/advisor: check the box or drop the tag; a human can still force aida edit --status completed), aida why shows it (JSON: closure_unmet_criteria), and each aida pull releases it once nothing is unmet. Tests: 4 CLI tests in auto_bump_done_tests.rs (BUG-1480/STORY-1423 and BUG-1288 replays as fixtures, a no-criterion control that must still complete, reconcile path) plus 3 in pickability. Red-first confirmed: with the gate stubbed out, the 3 hold tests FAIL and the control passes. WHAT REMAINS: (a) the red-first replays are fixtures modelled on the real cases, not a replay against the live store, so criterion 4''s ''stronger evidence'' bar is only partly met; (b) existing specs whose prose says ''does not close until X'' are NOT gated until someone migrates them to a Closure section or the tag. Status left unchanged for that reason.'
