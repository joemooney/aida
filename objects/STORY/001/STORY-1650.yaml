  author: joe
  content: 'DESIGN QUESTION (orchestrator-history, 2026-10-10 19:10): two acceptance criteria conflict for JSON. Today ''aida history --json'' with no SPEC-ID doesn''t render the digest. It switches to the events feed on a shallow window (limit*5, min 50), and when the index is cold that feed runs the per-commit git walk. Only human and TOON have a real digest rendering. Option A: ''--digest --json'' reproduces today''s --json byte-for-byte (events-feed JSON). Then the new default''s JSON fallback on an index miss can''t be ''digest without git walk'', because today''s JSON is the git walk. That needs a separate answer, e.g. JSON fallback = the TOON-shaped projection, or an error/empty result plus the note. Option B (implementer''s recommendation): add a digest JSON projection mirroring the TOON digest fields {view,count,history:[{id,type,status,when,change,title}]}. ''--digest --json'' and the JSON fallback both emit it. Human/TOON stay byte-identical with goldens, and JSON intentionally changes (no prior digest JSON exists). The implementer is building B behind an isolated seam and will open the PR as a DRAFT flagging this. Please pick A or B, or specify otherwise.'
  created_at: 2026-10-11T02:08:35.659454993Z
  modified_at: 2026-10-11T02:08:35.659454993Z
  session_id: ba0773e5-a9ac-4500-9776-22fe6fee4671
- id: 01a12979-6b65-7c02-908e-549fa4375c9a
  author: joe
  content: 'SECOND DESIGN QUESTION (orchestrator-history, 2026-10-10 22:40), on draft PR #2491 at 958b5f0310 (CI green). The acceptance criterion ''fallback returns within the digest''s current time'' forced the flow path to stop doing inline catch-up: with the 250 ms budget, a stale-index fallback took ~580 ms against ~234 ms for the digest. Consequence: every store commit (any aida add/edit) leaves bare ''aida history'' falling back to the digest with a ''behind'' note, until something else refreshes the index (an event view, a single-spec view, the MCP history tool, or ''aida cache rebuild --history'', which took 5m34s here). On an active store, users may rarely see the new default. Options: (1) accept as is, and file a background-indexer follow-up; (2) restore a small bounded inline catch-up on the flow path (it heals small gaps, but the fallback can exceed digest time on large gaps); (3) keep no catch-up, but make the behind-note suggest a cheap refresh (e.g. ''aida history events --limit 1'') instead of the full rebuild; (4) other. Also still open: JSON option A vs B (see the earlier comment). Reviewer cost of switching to A: ~20-30 lines + 2 tests.'
