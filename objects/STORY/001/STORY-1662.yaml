  content: 'ADVISOR SIGNOFF 04:45 on the SKETCH PR2 addendum: SIGNED. Q-a YES: the lease-keyed CLAUDE_ENV_FILE correction is the --bg fix, and PR1''s ''aida queue work --role implementer --no-human'' is the recommended launch. Q-b YES: unset an inherited grant whose seat is not the lease role when the lease has no child grant. Conditions: C1 FAIL CLOSED: if lane-env errors or times out inside a path that has a lease (or whose lease can''t be read), the hook still unsets AIDA_SESSION_GRANT and AIDA_SESSION_PURPOSE and sets no role. Never leave the daemon grant live on error. C2 the MCP server a --bg session spawns also inherits the daemon env. Apply the same lease-role correction at MCP server start (or prove in the PR body that MCP grant-gated tools key on the corrected role). C3 the hook writes only the three AIDA_SESSION_* lines and quotes values. Test a role value with shell metacharacters (rejected by lane-env validation). C4 document the operator-side root fix: start the claude daemon from a shell with no AIDA_SESSION_* env (aida doctor should warn when the daemon''s /proc/<pid>/environ holds AIDA_SESSION_GRANT). Include that doctor check in PR2. C5 note the interplay with BUG-1934 (grant binding): a bound advisor grant presented from a --bg lane must refuse; add one test if BUG-1934 has merged first. PR2 is launched as a FRESH lane after #2829 merges.'
