- id: 01a12eab-7f73-7140-87ca-c06439430c26
  author: joe
  content: |
    [groom:night] NEEDS-DECISION (security: seat/grant semantics). Not started on main. Blocked on STORY-1654 (approved, not yet landed). Open fork the spec leaves to the implementer ("pick one"):
    A) `aida queue work <SPEC> --no-human` (implementer phase only) as the launch primitive. It reuses the drain's headless path, lease, and logs, and gets a real separate process and grant. It costs a heavier per-spec phase pipeline and less interactive steering.
    B) `aida agent new claude --role implementer`, with the parent entered via --delegate-seat implementer and issue_child seat=implementer. It is the most direct mapping to the seat model and keeps the orchestrator able to steer. It needs new delegation plumbing and lifecycle/reaping for the child.
    C) Support both, with A as the default for unattended orchestrators and B for interactive advisor sessions.
    Recommendation: A. It already isolates the process and session and produces drain-quality evidence, and the throughput comparison against STORY-1654 is easy. Revisit B only if the steering loss matters. Whoever decides should also confirm that the advisor code guard keys on the process grant, not the session id, so A actually clears it. Once decided, rewrite Acceptance to name the chosen command; the work is supervised (seat semantics).
