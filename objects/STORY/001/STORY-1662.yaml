title: Implementers launched by an orchestrator or advisor session run as separate processes with their own implementer seat
description: |-
  Split out of STORY-1654 (advisor signoff 2026-10-11, ruling Q2). STORY-1654 moves reviewers into separate processes. This story covers implementers.

  Problem: orchestrator, relay and advisor sessions launch implementers as Agent-tool subagents. A subagent shares the parent's Claude session id, harness pid and seat grant. As a result, (1) the orchestrator becomes a recorded author of everything it implements, which costs it --override-stale-approval and blurs authorship, and (2) an implementer launched from an advisor session inherits the advisor seat and trips the advisor code guard (seen 2026-10-10 on TASK-1723; Joe's comment on STORY-1654).

  Want: the orchestrator or advisor launches each implementer as a separate process with a child implementer grant (issue_child seat=implementer, parent entered with --delegate-seat implementer). Candidates: `aida queue work <SPEC> --no-human` (implementer phase only) or `aida agent new claude --role implementer`. Pick one, document it, and update the aida-orchestrate / aida-burndown skill masters and the relay prompts.

  Acceptance: an advisor-launched implementer edits code without tripping the advisor guard; the orchestrator session is not recorded as an author of a spec it only orchestrated; throughput cost is measured as in STORY-1654; template gates pass. Sequence it after STORY-1654 lands.
