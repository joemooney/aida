- id: 01a160ab-e7e2-75d0-9cdd-607d3343de7d
  author: joe
  content: |-
    SKETCH v1 (fix-story-1662, 2026-10-21). Read against origin/main 612d9b792d: queue_cmd.rs (fresh headless arm ~12890-13125, run_standalone_reviewer :13200), seat_authority.rs (issue_child, preflight_headless_child, BASELINE_SEATS), session.rs (exec_vendor_headless :3890, apply_headless_child_seat_env), review_authority.rs (as_launcher, launched_worker_tokens, author_sessions), phase_driver_trait.rs run_implementer, drain_lock.rs, aida-advisor-code-guard.sh, advisor_code_gate.rs. No code written.

    FINDING: most of the process boundary already exists. `aida queue work <SPEC> --no-human` without --auto-complete takes the BUG-2139 fresh headless arm: a separate `claude -p`, its own lease and worktree, AIDA_SESSION_ROLE=implementer, a child grant minted by issue_headless_child, AIDA_SESSION_PURPOSE scrubbed, and the ledger record written under as_launcher (launched_worker_tokens, so only the queue-work pid). What is missing is the part STORY-1654 had for reviewers: a result the caller can branch on. Today the launch execs, exits with claude's code, and reports no PR, punt or hold. Wrapping it in an --auto-complete variant is ruled out because drain.lock is global (one drain per repo), so parallel implementers would serialize and block the caller's own drain.

    (a) LAUNCH PATH. Callers run it with Bash, never the Agent tool: `aida queue work <SPEC> --role implementer --no-human --vendor claude` (run_in_background, at most 3 at once). New `run_standalone_implementer` in queue_cmd.rs, the twin of run_standalone_reviewer. It is selected by `is_standalone_implementer(role, scope_is_spec, no_human)`, which is false inside a drain (orchestrator PHASE_ENV or AIDA_AUTO_COMPLETE set), so phase 1 is unchanged. It (1) provisions the punt and hold signal files exactly as the drain does (punt::signal_path, punt::hold_signal_path); (2) appends a stop contract to the prompt: open the PR, then stop, never `pr ship`, never `review record`; (3) spawns through the existing run_vendor_headless_child and waits; (4) classifies the outcome with the drain's own PR lookup for lease.branch, printing one stdout line `implementer: pr-opened pr=<n> head=<sha>` (exit 0), `punted reason=...` (exit 32), `held branch=...` (exit 33), or `no-pr` (exit 31; the vendor's nonzero code passes through as in BUG-2187). New codes are checked against exit_code_for_error's table.
    (b) GRANT. Reuse BUG-2139 unchanged. If the launcher's grant delegates implementer, issue_child(seat=implementer) runs: delegable_seats=[], parent_grant_id=launcher, stamped on the lease, revoked when the child exits. Otherwise the child runs at baseline, since implementer is a BASELINE seat, with AIDA_SESSION_GRANT="" and a printed notice. The launcher grant is NEVER inherited: the child env sets AIDA_SESSION_ROLE and AIDA_SESSION_GRANT explicitly and env_removes AIDA_SESSION_PURPOSE. NEW: scrub_launcher_session_env also removes AIDA_AUTO_COMPLETE, the orchestrator phase/run-token env, AIDA_REVIEW_VERDICT_FILE and AIDA_NO_HUMAN_MODE, so a standalone child is never mistaken for a drain child, which would also hand it the guard's AIDA_AUTO_COMPLETE exemption. Skills must NOT `env -u AIDA_SESSION_GRANT` the launcher itself: that would force baseline. The scrub happens inside the launcher, for the child. Seat docs gain the line `aida role enter <seat> --delegate-seat reviewer --delegate-seat implementer`. Q1 for advisor: when a GRANTED launcher does not delegate implementer, fall back to baseline (recommended: no TTY friction, which is exactly what TASK-1764 asks to remove; implementer confers nothing a grant gates) or fail closed?
    (c) AUTHORSHIP. The ledger record carries only proc:<queue-work pid>. The lease's creator_pid (the caller's Bash shell) is dropped because a ledger record exists (author_sessions). active_pid and the claude child are descendants of the caller, never its ancestors, so the caller's recorder tokens (session id, shell, harness) never overlap. The caller must not `aida claim` the spec itself: queue work refuses a held lease, and the skills say so. Commits come from the child.
    (d) TEMPLATES (aida-core/templates, then sync-templates): skills/aida-orchestrate.md (line 74, "Agent used for implementers only", becomes "no Agent-tool seat work"), skills/aida-burndown.md and commands/aida-burndown.md (fan-out), skills/aida-fire.md and .aida/discipline/fire-mode.md (fixers; TASK-1764), skills/aida-solo.md and commands/aida-solo.md, discipline autonomous-burndown.md, git-sync-and-review.md (the Agent(isolation:worktree) recipe), two-seat-protocol.md, advisor-role.md, skills-portable/aida-orchestrate.md, and the aida-review.md delegate line. Relay prompts (.aida/handoff/*/prompt*.md, operator-owned and untracked) are edited in place the way fix-2661b did, with a file list on the spec. A template ratchet test refuses "implementer subagent" / Agent(... isolation:"worktree") instructions in seat skills.
    (e) TESTS, each failing before the change: is_standalone_implementer truth table; outcome classifier (pr, punt, hold, none, and a vendor nonzero exit) giving the line and exit code; child env built from an advisor env (ROLE=advisor, GRANT, PURPOSE, AUTO_COMPLETE, PHASE, VERDICT_FILE) has ROLE=implementer, GRANT=child id or "", and none of the rest; advisor code guard: the hook script fed a .rs Edit under the child env exits 0, and under the parent env exits 2; enforce_at_commit with the implementer lease plus inherited-advisor env passes; authorship: an as_launcher queue-work record plus the lease does not overlap the orchestrator's recorder_tokens; a stub-vendor launch test (BUG-826 pattern) covers end to end that the stub writes the punt file and gets exit 32 with no grant leaked. Manual acceptance, recorded on the spec: from the advisor seat (delegating implementer), launch a scratch spec. The child edits a .rs file with no guard block in its headless log, opens a PR, and is reviewed by a separate reviewer process; `aida pr ship` then passes with NO override and the advisor not among the authors.
    (f) THROUGHPUT, measured as STORY-1654 did. BEFORE: Agent-tool implementer subagents over a 24h window from ~/.claude/projects transcripts (send to PR wall-clock, turns, tokens, estimated cost; n reported). AFTER: at least 3 standalone runs (launcher wall-clock plus the headless log's result event duration, turns and cost). The table goes on the spec.
    (g) SLICES. PR1 (Refs STORY-1662): standalone implementer arm, outcome contract, exit codes, env scrub, tests, about 550 lines. PR2 (Refs STORY-1662): template masters, the ratchet test, sync, about 400 lines. PR3 (STORY-1662): docs/cli and glossary for the outcome contract, plus the e2e and throughput comments and the relay-prompt edits. Golden help snapshot if help text changes. Operator merges all three.
