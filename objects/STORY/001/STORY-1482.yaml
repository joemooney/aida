spec_id: STORY-1482
agreed_id: STORY-1482
title: Lane-targeted PRs and Done-in-lane status (no Completed until the lane lands)
description: |
  Inside a lane, every PR-producing path targets the **lane branch** instead of the default branch: drains, `aida pr`, `aida ship` and the reviewer and merge phases.

  When a PR merges into the lane branch, the spec moves to **Done**, tagged `lane:EPIC-N` or with an equivalent marker. It does **not** move to Completed, because Completed keeps its meaning of "merged to the default branch". The pull auto-bump must not promote lane-merged specs to Completed.

  ## Acceptance
  - A drain run inside the lane opens its PR with `--base epic-n-work`. The merge phase merges into the lane branch, and main is untouched (asserted by test).
  - `aida pull` / `reconcile-status` do not bump Done-in-lane specs to Completed while the lane is open.
  - `aida show` / `aida status` render these specs as "Done (in lane EPIC-N)", so their state is truthful.
  - Commit-trailer semantics are unchanged: `(SPEC-ID)` trailers on lane commits are still recognised when the lane lands.
