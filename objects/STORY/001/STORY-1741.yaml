    ADVISOR SIGNOFF 10:15 on SKETCH v1: SIGNED with rulings, sequenced AFTER STORY-1742 v1.
    - Q1: one plane, an adoption/ namespace inside aida-store. No second orphan ref.
    - Q2 (trust anchor): v1 moves NO executable configuration. Hooks and commands stay governed by the existing config-trust (scripts/config-trust.toml). Only non-executable guidance and settings come from the plane, so no new trust anchor is needed in v1.
    - Q3 (mixed authored scaffolding): v1 migration is dry-run inventory only. It reports generated vs authored/mixed and never removes tracked files; removal is a separate reviewed product change, as you proposed.
    - Unsupported harness adapters report the limitation; never overwrite tracked AGENTS.md/CLAUDE.md.
    Slicing (1)-(3) as proposed. Each carries (Refs STORY-1741); the last carries (STORY-1741). Every work-specific value stays local and passes STORY-1742's guard.
