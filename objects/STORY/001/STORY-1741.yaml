    codex2 READ-ONLY readiness map — STORY-1741, planning evidence only.
    Inspected clean committed main a01a6989984ee2c6261074fa5f9d415719d3130a (verified before/after inspection). Read full canonical spec and all4 comments, including09:53 operator ruling,10:15 signoff and proxy approval. Binding contract: ONE adoption/ namespace in aida-store; NONEXECUTABLE settings/guidance only; hooks/commands keep existing config-trust; migration DRY-RUN INVENTORY ONLY, no tracked-file removal/product-tree edits. Implement only AFTER STORY1742v1 is complete. No implementation/approval/status/claim here.

    Slice1 — discovery, nonexecuting schema and local locator/version contract (Refs STORY-1741).
    Actual entrypoints: aida-core/src/store_locate.rs::{locate_distributed_store_from332, detect_distributed_store_from273, main_worktree_candidate234, store_path_candidates433, classify_store_path188}. Current locate337 walks ancestors reading .aida/config.toml and only then resolves store paths; this is the bootstrap cycle to break. detect_distributed_store also has an explicit AIDA_STORE override; neither an env path nor a shared setting may become a trust/authority signal. Discovery must start from actual repository/common-Git identity and the conventional aida-store ref, without a product marker; resolve nonstandard/sibling locator locally and reject ambiguity/unrelated ancestor adoption before reading adoption settings. Preserve temp-root and linked-worktree boundaries. git_ops::create_store_worktree3181 and store_sync attachment paths supply existing store mechanics, but calling the entire init flow is unsafe: it writes config/.gitignore/scaffolding and can create an initial product commit. Adoption must not manufacture a product HEAD or change remotes to bootstrap. Existing config_init::config_path_for_project73 is the central product-config path helper; direct literals remain enumerated by scripts/config-trust.toml, so changing that one helper alone does not move every reader.

    Shared adoption reads/writes need an explicit immutable store revision plus schema/generator version, not “current checkout happened to exist.” The signed nonexecuting schema must allowlist only inert settings/text: no command, executable, hook body, credential, host-specific path, vendor binary or capability/authority setting is imported as policy. trusted_config::{read_trusted_config_toml97, read_trusted_config_toml_local107, read_config_at_sha134} continues reading trusted DEFAULT-PRODUCT-BRANCH config for executable settings; do not redirect it to adoption/. Existing config-trust classification/guard stays authoritative, including frozen grandfathered rows; no new trust anchor or authority exception. Credentials/preferences/node identity/transport profile remain local. New binding/locator representation and projection source revisions must not infer BUG2017 HOME allocation authority.

    Decisive slice1 fixtures: no-marker conventional discovery; nearest nested repo versus ancestor; missing/nonstandard/ambiguous locator; actual linked worktrees and genuinely separate sibling common-Git roots; unknown schema/missing/moving selected revision; fresh/no-HEAD product repo without initial product commit; executable/credential fields rejected before launch/write. Reuse store_locate::tests::detect_distributed_store_resolves_from_linked_worktree, detect_distributed_store_from_never_adopts_a_temp_root, task_2072_miss_names_every_candidate_of_the_nearest_naming_config, task_2169_miss_names_the_main_worktree_candidate_and_a_non_directory. Reuse bug_1723_config_trust_tests::{guard_rejects_an_executable_key_even_when_labelled_policy, guard_rejects_a_command_class_and_a_path_key_from_the_worktree}.

    Slice2 — deterministic local projection, reader/hook/harness integration (Refs STORY-1741).
    Actual writers to intercept: init_cmd::{complete_init_scaffolding1542, commit_init_scaffolding1425, write_memory_lane_scaffolding1241, write_init_footprint981, maybe_scaffold_codex_hooks_on_init4962, maybe_scaffold_antigravity_hooks_on_init4983, maybe_repair_codex_hooks_on_reinit5021}; scaffold_init::{write_discipline_pack_entries294, ensure_project_manifest_scaffold361, ensure_discipline_pack_gitignore_allow_list529, scaffold_user_aida_instructions725}; scaffold_cmd::{handle_scaffold_command23, run_scaffold_upgrade1005, run_scaffold_upgrade_git_hooks894}; core scaffolding::Scaffolder::{preview1299, apply_with_options2714}. apply writes artifact paths under product root, applies special overwrite rules for AGENTS/CLAUDE/template files and records skill-delivery manifests; these existing product writers cannot be called unchanged for adoption. config_cmd::handle_config_command and config_edit::{set_kv,set_kvs,remove_keys,save_doc} write TOML; config_commit::finish_config_change102 stages/commits exactly product .aida/config.toml. Route adoption-mode nonexecuting settings to the store namespace plus ignored projection; do not let normal config edits/repair/refresh silently use those product paths or auto-commit them. Inventory direct config readers/writers with the existing trust manifest, not a second policy engine.

    Local exclusion seam: git_ops::ensure_aida_runtime_excluded1037 resolves info/exclude via --git-path, including common-dir linked-worktree behavior. Its own comments deliberately let tracked .gitignore reinclusions win. A projection must be untracked and effectively ignored, never overwrite this repository's tracked .aida/config.toml or guidance; validate exclusion/path ownership, don't assume adding an exclude line is sufficient. Use staged deterministic generation and atomic replacement only within owned local projection, revision/schema/generator/hash manifest, symlink/path-escape refusal and per-worktree output separation. Shared adoption source changes use existing db::with_store_write_lock through serialization/commit; local projection replacement must not acquire a new outer lock from an already held store/cache/dispenser context. Projection refresh never allocates node IDs or rewrites requirement metadata.

    Hooks and adapters: scaffolding/codex_hooks::{scaffold_codex_hooks75, scaffold_antigravity_hooks284} currently write .codex/hooks.json/.codex/hooks and .agents/hooks.json/.agents/hooks; scaffolding/settings::generate_claude_settings_json produces .claude settings. Git hook resolution/refresh uses git_ops::{resolve_store_hooks_dir495, hooks_dir6065} and scaffold_cmd::run_scaffold_upgrade_git_hooks. Preserve host-shipped/store-hook containment and existing config-trust: executable hook bytes/commands do NOT move into adoption/. Only safe local bindings/generated outputs may point at existing trusted mechanisms; never overwrite tracked harness settings. agent_launch::{agent_initial_prompt_args3353, prepare_agent_launch_context4050, render_agent_launch_context4419, agent_launch_env_inputs5427, agent_guidance_files5467} are actual launch/context/report seams. Current report lists repository CLAUDE.md/AGENTS.md presence plus context path; that is not proof any harness reads a projection. Expose selected revision, actual delivered context/argv and supported adapter mechanism consistently in launch+preview. Report unsupported direct/external harnesses honestly; file-exists/env-var/report text alone is not capability proof or permission to create tracked AGENTS/CLAUDE files.

    Concrete current maintenance writer to keep out of shared adoption: scripts/codex-mail-wake.py::{own_health_job532, service671} writes an owned block in project .aida/config.toml and private registration/unit state, including uninstall/recovery. This is local executable scheduler/service ownership, not nonexecuting adoption material. Do not export its command/config or invoke its installer/uninstaller as an adoption side effect; keep existing reviewed ownership/recovery and intercept accidental product-config writes in adoption-mode regression. No watcher/service redesign requested.

    Decisive slice2 fixtures: clean and pre-dirty tracked bytes/index/code refs/remotes identical across adopt, normal commands, config edit, scaffold refresh/doctor repair, launch/preview and interrupted/concurrent refresh; no AGENTS/CLAUDE/harness-settings overwrite; deterministic output/version mismatch before child use; symlinked destinations and edited owned output refused/preserved; executable store content never executed. Reuse scaffolding::symlink_blocking_write, managed_merge::tests::slot_merge_replaces_drift_preserves_user_keys, refresh::tests::refresh_overlays_pristine_keeps_edited_and_unmarked and codex_hooks::tests::antigravity_scaffolding_leaves_invalid_or_non_object_hooks_json_untouched_even_with_force. Existing init tests genuinely_new_init_still_commits_scaffolding/init_appends_aida_block_to_existing_agents_md describe legacy behavior, not adoption acceptance. agent_launcher_tests::{noexec_preview_includes_prompt_source_context_path_env_and_guidance_files, agent_guidance_files_reports_vendor_specific_and_universal_files, tracked_fake_agent_receives_context_file_env_and_cleans_file} support adapter conformance, with a real private fake-harness consumption assertion needed for projection support.

    Slice3 — inventory-only migration, owned-local removal, explicit CI bootstrap/docs (Refs until final STORY-1741).
    Migration reuses scaffold inventory/header/checksum and aida_managed_diff_slice140, generated_text_matches432, managed_merge slot classification and refresh manifests as EVIDENCE of generated/authored/mixed state. Current status/upgrade/prune paths may load mutable Storage or apply/remove artifacts; do not call them as an ostensibly read-only inventory. Report every tracked candidate and preserved policy destination, mark ambiguity, and propose removals only. Never auto-remove/move product files, commit migration, rewrite history, normalize user bytes or turn mixed executable config into shared settings. Existing scaffold_init::report_and_prune_obe_scaffold902 is a writer, not the inventory executor.

    No adoption-specific uninstall exists in inspected init/scaffold/CLI surfaces. A bounded new removal entrypoint must consume projection+hook-binding ownership records, verify identity/content and restore prior binding only if still owned; preserve edited/user outputs, existing hooks, shared store/adoption source, node/common counters, mail/receipts and product index/history/branches/remotes. Do not reuse cron/watcher uninstall or delete whole .aida directories. CI bootstrap needs explicit selected store revision and deterministic manifest verification before use, without invoking product-writing init as a shortcut. Docs must distinguish supported AIDA-launched adapters from unsupported external harness discovery and policy-only plane from executable config-trust. Fixtures: authored/mixed/header-spoofed inventory has zero writes; uninstall with edited output/third-party hooks/intervening hook-binding edits and partial failure preserves data; CI fresh bootstrap/selected-revision mismatch; repeated bootstrap/uninstall idempotence; common-Git versus worktree output ownership. Capture tracked bytes, index entries, code refs and configured remotes on both clean/pre-dirty fixtures.

    Cross-story gates: main a01 contains transport_profile plus ref-only transport_executor, but transport_profile::SANITIZATION_PENDING explicitly says outbound sanitization is unavailable. STORY1742v1 real outgoing scanner/prepared mutation and trusted baseline integration is a HARD predecessor, not waived by store-only transport. All adoption source/candidate serialization and its outgoing object/history/commit metadata must pass the real shared scanner before counter/object/oplog/ref publication; no adoption/ exemption or local scanner substitute. Keep its actual enabled WORK recoverable FF-pull/E2E contract, no receiver/public-forward/history-export expansion. Main a01 does NOT yet contain BUG2017 allocation_authority/work_binding modules: their final reviewed landing/provider/bootstrap/clone identity is another concrete integration dependency, never assume unmerged local eff2 confers authority. Shared adoption writes must preserve existing store-writer -> dispenser ordering and opaque/common identity; do not enroll real HOME or create an allocation claim to make settings persistence work. STORY1843 mailbox/lifecycle preservation remains outside adoption removal. Full acceptance stays open until all three slices and real integrations are independently reviewed; this map authorizes no implementation before1742v1.

    No source edits, tests/build/Cargo, leases/claims, config/authority/service changes, synthetic mail/queue probes, verdict or status changes. Canonical comment and requested advisor FYI only. Mailbox emptiness was not queried or used as a global readiness claim. PR2919 explicitly routed new pushed head takes priority; no unmatched local candidate attestation.
