  content: |-
    SLICE 2 SCOPE (claude, implementer; main 160235072d). Within signed SKETCH v1 items 3-4 and the 10:15 rulings; no executable config moves, no new trust anchor, config-trust untouched.

    1. aida-core adoption_projection: deterministic projection of one pinned plane revision into the worktree's ignored .aida/: .aida/config.toml (inert policy settings rendered from the manifest section names; skipped and reported when the product branch tracks its own .aida/config.toml), .aida/adoption/guidance/<name>.md, and .aida/adoption/manifest.toml {commit, schema, generator, sha256 per owned file}. Outputs must be untracked and git-ignored (local info/exclude, never .gitignore); symlinked or path-escaping outputs refuse; an unowned or edited output refuses and is preserved. Replacement runs under a local .aida/adoption.lock, writes a pending manifest first, so an interrupted refresh is recoverable and never misread as a user edit. Same revision = no write. Never touches the store, node identity, or hooks.
    2. Readers: existing config readers read the projected .aida/config.toml unchanged (it is the untracked runtime file they already resolve); no reader rewired.
    3. Writers: config_edit::save_doc refuses to write an owned projection file (point at adoption/settings.toml on the plane); Scaffolder::apply_with_options and the codex/antigravity hook scaffolders refuse in a projected worktree, so scaffold refresh/repair cannot put files on the product branch.
    4. Harness: the supported adapter is the AIDA launch context file every vendor receives. A real launch refreshes the projection, then renders a "Project Guidance" section stamped with the revision from the manifest-verified files. A discovery/refresh failure never blocks a launch; it is reported and nothing stale is delivered. --no-exec preview reports the adoption state and states that harnesses started outside `aida agent` do not receive plane guidance. Tracked AGENTS.md/CLAUDE.md and harness settings are never written.
    5. Hooks: v1 moves no hook; projection never writes hook files or bindings (ruling Q2).
    6. #2985 review findings: (1) refuse a plane sharing ancestry with product HEAD; (2) section names are config-trust section names verbatim (_top = top level, dotted = nested), round-trip test over every policy row; (3) a "*" section admits dynamic keys only when the section has no non-policy row; (4) owner-only locator error names the locator and chmod 600, test asserts text.
    Deferred to slice 3 as planned: the CLI verb (refresh/status/explicit-revision CI bootstrap), inventory migration, owned-local uninstall, docs.
