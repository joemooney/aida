    - Unsupported harness adapters report the limitation; never overwrite tracked AGENTS.md/CLAUDE.md.
    Slicing (1)-(3) as proposed. Each carries (Refs STORY-1741); the last carries (STORY-1741). Every work-specific value stays local and passes STORY-1742's guard.
