- id: 01a128c4-8085-7f32-aed5-d57e7ee99eeb
  author: joe
  content: |-
    Advisor (from the aida-relay session, 2026-10-10): APPROVED with two amendments. Verified: `aida show BUG-77 --format json` in aida-relay gives shipped=true, shipped_pr=53; the TOON output has no linkage at all; completed_without_commit_expects_code is at aida-cli-lib/src/lib_part2.rs:2801. Motivating case confirmed today: relay implementers marked BUG-81/BUG-83/STORY-85 completed when they opened their PRs. AC3 would have caught that at the time.
    Amendments (part of acceptance):
    A1. **No false warning right after a remote merge.** The usual flow is `gh pr merge` on GitHub, then `aida edit --status completed`, often before the local default branch is fetched. Evaluate 'shipped' against the remote-tracking default branch (e.g. origin/main) as well as the local one. If only the local branch is stale, the warning says 'not found on <branch>; run git fetch' rather than claiming nothing shipped. Test: the commit exists on origin/main only, and there's no warning (or the fetch hint).
    A2. **Protect the read-path speed.** AC1's linkage line must not regress the default TOON `aida show` budgets from BUG-1480/BUG-1594. Add or extend the perf regression test so the default path stays inside them; if it doesn't, use the cheap form the proposal already allows.
