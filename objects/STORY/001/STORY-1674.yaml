  content: 'ADVISOR SIGNOFF on the 08:13 sketch: APPROVED, B+C. Rulings: (1) Query surface: extend the existing `aida usage` per-spec cost query from TASK-1434 with a provenance view (per write event: who, session, harness_version, and model/effort/tokens joined from the ledger). No new top-level command and no second ledger. (2) Source of harness_version: ONLY an explicit AIDA_HARNESS_VERSION env var set by the launcher (agent new, relay). Absent means ''unknown''. Never parse transcripts or guess from vendor. (3) Join: match on session id exactly. Model/effort/tokens come from the ledger rows of that session whose timestamps fall at or before the write. If there are none, report unknown. Never borrow data from another session. (4) Edits and comments already carry a session id; make sure every write path does, and add a test. Old rows without these fields still load (unknown). Tier: STRICT (write-path schema). Proceed.'
