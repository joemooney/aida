    IMPLEMENTER SKETCH (relay Session 2; no implementation). Honor the recorded operator choice B+C: retain small write provenance, preserve session identity on edits/comments, add harness_version only from an explicitly reported harness value (otherwise unknown), and join model/effort/token evidence from the EPIC-71 ledger by session/time when queried. No inferred model or duplicated cumulative-token stamps. Proposed acceptance: current/legacy write roundtrips; reported vs absent harness_version; edit/comment session identity; query fixture matching and missing ledger evidence with unknown values. Need signed acceptance for the exact query surface, reported-value source and session/time join semantics before this schema/write-path change. Recommendation: extend the existing per-spec cost/provenance query rather than introduce a second ledger.
