title: Record model, harness version, effort and session tokens on every spec write (filed_at and edits)
description: |
  ## F23. Record model, harness and token usage on every spec write

  **Seen:** to report which models did what, and at what token cost, we had to mine Claude Code transcripts after the fact (`scripts/regen-provenance.py`). The store records only a session label, and F22 shows even that can be wrong.

  **Proposal:**
  - `filed_at` (and every edit or comment) records the model id, the harness and its version, and the effort level.
  - Optionally it records the session's cumulative tokens at that moment.
  - Then "what did capturing this semantics cost?" becomes a store query rather than a research project. People evaluating AIDA will want exactly that overhead number.

  ## Acceptance

  To be written at triage; the proposals above are the starting point.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), feedback file docs/regeneration/aida-feedback.md at commit f2b8d2d; results in docs/regeneration/results-2026-10-11.md. Headline numbers: a blind agent rebuilt the 1,600-line system from the curated store at 93.9-95.5% of discriminating oracle checks (3 replicates), 22.7% without the 3 contract rows, 11.4% from the store as it stood before regenerability work; an AfterVibe Prompt A.1 spec distilled from the transcript reached 97.7%.
