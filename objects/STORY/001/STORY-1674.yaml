- id: 01a12eb9-f6bc-77f2-b57d-3d4fafaaa645
  author: joe
  content: |
    [groom:night] NEEDS-DECISION. Partially present: `filed_at` (FilingProvenance in aida-core/src/models.rs) already records code sha, branch, dirty, aida version + build sha, vendor and session id, on creation only. BUG-1920 (completed) fixed the wrong-vendor credit cited as F22. EPIC-71 (completed) made token spend attributable per spec/session via the token ledger, and TASK-1434 added a per-spec cost query.

    The fork is where model/effort/tokens come from:
    - A. Stamp at write time: extend FilingProvenance with model, harness_version, effort, session_tokens, and stamp edits and comments too. Problem: most harnesses do not expose model/effort/token count to child processes, so fields will be mostly empty or guessed (the same failure mode as BUG-1920); it also grows every history entry.
    - B. Join at query time: keep stamps small (add only harness_version, plus the existing session id on edits/comments), and answer "what did capturing this cost / which model wrote this" by joining session id + timestamp against the EPIC-71 token ledger and transcripts.
    - C. A, but only fields the harness actually reports, never inferred, with an explicit `unknown`.

    Recommendation: B, plus C's rule for harness_version. It reuses EPIC-71 instead of duplicating cost data in the store, and avoids writing guessed provenance. Schema change on every write -> supervised.
