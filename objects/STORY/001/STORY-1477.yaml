    R3 — template loader bypasses hermetic home guard.
    File/symbol: aida-cli-lib/src/history_layout.rs:300, Templates::load.
    All three platforms fail test_home::tests::no_direct_dirs_home_dir_in_crate, identifying this exact new call to dirs::home_dir(). The crate requires crate::home_dir(), which preserves production home lookup and adds the test-time real-home fence. Existing tests using Templates::at do not excuse bypassing the public loader. Exact-base Ubuntu passes this guard.
