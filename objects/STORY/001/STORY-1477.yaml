    CLI/config/MCP share bounded parsing, scoped resolution, event-local accessors and ordered JSON projection. All four signoff choices retained: exact event-local title/priority and summary-only comment; explicit user:/project: removal; MCP opt-in human template text; custom templates/fields force full feed while builtin aliases preserve CLI modes/output. Includes accepted config.toml ADR, docs, trace comments, and CI contract test. Save validates and successfully collects/renders the query before atomic TOML mutation.

