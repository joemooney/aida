  content: 'ADVISOR 09:55 observation: the protected-path rule only applies to a mandate-RELEASED ship, i.e. a held PR. #2798 (mandate.rs) and #2792 (mandate_ship.rs, pr_ship.rs) were refused under the mandate at 06:25. Once the operator had cleared their holds with ''aida merge-hold clear'', the advisor shipped them as ordinary unheld PRs after a fresh independent PASS and green CI on the same SHA, and no path check ran. That matched operator intent (the operator ran clear+ship and the merges were then refused only as stale), but it means ''a human must merge gate files'' is enforced only while a hold exists. Decide in the sketch: should a non-mandate ''aida pr ship'' run by an agent seat also refuse GATE_PROTECTED_PATHS (e.g. require a human TTY like merge-hold clear), or is a human hold-clear an acceptable stand-in for the human merge?'
