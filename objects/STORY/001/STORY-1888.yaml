title: 'Mandate gate paths: operator-added protected paths (tighten-only) and a ratchet so new gate code cannot go unprotected'
description: |-
  Operator discussion 2026-10-21. GATE_PROTECTED_PATHS (aida-cli-lib/src/mandate_gates.rs) is a hard-coded floor of 14 files that a mandate-shipped PR may not touch. Keep that floor hard-coded and non-removable: config that could remove entries would itself become the thing to protect, and .aida/config.toml is already on the list.

  Acceptance:
  1. Tighten-only extension. A 'protected_paths = [...]' list (exact paths and directory prefixes) under the existing [mandate.human_gates] table, read with the same two layers: the committed .aida/config.toml from the origin/main blob, plus the operator's ~/.aida/config.toml. The effective set is the built-in floor plus both layers; no layer can remove an entry. An unreadable committed layer fails closed, as today. 'aida mandate status' prints the effective set and where each entry came from. The refusal message names the matching entry and its source.
  2. Drift ratchet. A test fails when gate-authority code exists outside the floor. For example: any module declaring a mandate, ship, merge-hold, review-verdict or seat-authority decision function, or carrying a marker such as '// mandate-gate', must appear in GATE_PROTECTED_PATHS. The failure message tells the author to add the path, never to remove the marker.
  3. Tests cover: an operator-layer path refuses a mandate ship; a branch-only edit to the committed layer has no effect; a directory prefix matches nested files; the floor cannot be shrunk by any layer.

  This change edits mandate_gates.rs, so it needs a sketch with advisor signoff, and a human must merge it (it is self-protected).
