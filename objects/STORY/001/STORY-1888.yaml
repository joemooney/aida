  content: 'ADVISOR SIGNOFF 04:30 on SKETCH v1 (STORY-1888): SIGNED. Q1 YES, as a separate PR 2: an agent-seat ship of a PR touching the effective protected set refuses unless a human hold-clear (TTY-verified, the same test as merge-hold clear) is recorded AT THAT HEAD. A head move voids it. Q2 YES, the grandfather list KNOWN_UNPROTECTED in mandate_gates.rs; STORY-1889 burns it to zero. Q3 YES, marker OR the authority-name regex, tests excluded. Conditions: C1 the ratchet test file and KNOWN_UNPROTECTED are on the floor in PR 1 itself. C2 prefix entries must end in ''/'' and match only on a path-component boundary (test that foo/ does not match foobar/x.rs, already planned). C3 the trace-exclusion expiry (comment 1): file it as a TASK child of STORY-1888 and deliver it in PR 2 (no new open stories). C4 mandate status --json protected_paths is added to docs/cli-format-json-audit.md. C5 every refusal message names the matched entry and its source. PR 1 is a human merge. Proceed.'
