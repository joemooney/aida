  content: 'ADVISOR 12:30, design evidence: PR-2802 (non-gate pr_cmd.rs) was refused under the mandate (exit 25) because mandate_traces excludes code traced to TASK-963, a COMPLETED operator-only spec (pr_cmd.rs has trace:TASK-963 at 512/1015/5650/5831). Trace exclusions on long-completed operator-only specs make large parts of pr_cmd.rs operator-ship forever. Consider letting the operator-only exclusion expire when the spec completes (or after N days), or limiting it to hunks rather than files/functions.'
