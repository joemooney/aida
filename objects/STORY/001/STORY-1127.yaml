  content: |-
    Concrete visibility bug found via `aida config show` (2026-09-14): the [agents] section shows the global `bypass: bypass` + `codex: enabled`, which IMPLIES codex runs on nuclear bypass — but after setting [agents.codex] default_flags = [--sandbox=workspace-write, --ask-for-approval=never], codex is actually on the CONTAINED tier. config show/menu is blind to per-agent default_flags and to the entire ~/.codex/config.toml sandbox tuning (sandbox_mode/approval_policy/[sandbox_workspace_write]), so it currently MISREPRESENTS the effective codex posture.

    Acceptance addition: `config show` / `config menu` [agents] rows must display the RESOLVED per-agent tier (native | contained | bypass) accounting for per-agent default_flags overriding the global bypass knob — not the raw global bypass bit. `config permissions show` carries the full cross-file detail (incl. the codex vendor config + writable_roots/network_access); config menu surfaces the tier per agent and points to `permissions show` for the full resolution. The 'codex shows as bypass while actually contained' case is an explicit test.
