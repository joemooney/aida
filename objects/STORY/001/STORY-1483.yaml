title: Lane sync with main, drift warning, and aida lane land (one reviewed lane→main PR)
description: |
  Keep the lane close to main, and land it as one reviewed unit.

  - `aida lane sync [EPIC-N]` brings main into the lane branch. The default is a merge, which is safe for a shared branch; `--rebase` is available when the lane is single-user. Conflicts stop the command with guidance, and nothing is auto-resolved.
  - A drift signal: `aida status` in the lane, and `aida lane list`, show commits-behind-main. A warning appears above a configurable threshold (`[lane] drift_warn_commits`, with a sensible default).
  - `aida lane land EPIC-N` opens a single lane→main PR. It goes through normal advisor review and CI, and cannot be self-merged by the implementer. When that PR merges, every Done-in-lane spec is promoted to Completed and the lane is closed. The lane branch is deleted only after the merge is verified.

  ## Acceptance
  - `lane sync` merges main into the lane, and tests cover both the clean case and the conflict case.
  - Lane drift above the threshold shows a warning on `aida status` inside the lane.
  - `lane land` opens the PR against main. Its merge flips all of the lane's Done specs to Completed and removes the lane record; a test covers this promotion.
  - If the land PR is closed without merging, the lane stays open and its specs stay Done-in-lane.
