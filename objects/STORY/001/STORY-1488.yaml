title: 'Split aida-cli-lib for build throughput and merge safety: lib.rs (~110k lines) into modules, then the crate into dependency-ordered crates'
description: |-
  Operator request (Joe, 2026-09-26): cut lib.rs size to raise throughput. aida-cli-lib is ~406k lines in one crate; lib.rs alone ~110k. Every edit recompiles the whole crate and rebuilds one giant unit-test binary; lib.rs is the top merge-conflict hotspot. Architecture-class: sketch + advisor signoff before code.

  Acceptance:
  1. Baseline measured: cargo build --timings (clean + incremental after a one-line edit in lib.rs) and the unit-test build time, recorded on this spec.
  2. Slice 1 (mechanical, no behaviour change): lib.rs split into cohesive modules; no module over ~15k lines; public API and CLI output unchanged; full test suite green; landed in a quiet window with a rebase note for in-flight branches.
  3. Slice 2+: crate extraction along the measured dependency seams, one crate per slice, each with before/after timings; a split is kept only if it improves incremental build time.
  4. Template/trace conventions preserved (trace comments move with their code).
