    VISIBILITY CHANGES
    Private-at-crate-root is visible to every module in the crate, i.e. it already equals `pub(crate)`. So step A makes the change semantically a no-op: prefix every private top-level fn/struct/enum/type/const/static/trait in lib.rs, every field of those structs, and every method in root-level `impl` blocks with `pub(crate)` (about 2,000 items, ~500 fields, ~150 methods; the 6 `pub` items and the 202 existing `pub(crate)` are untouched; enum variants need nothing). Struct fields matter concretely: SessionLease is field-constructed in 37 files, RealPhaseDriver 9, RoleState 8, DoctorFinding 4, plus ResumeEntry/GitLinkage/PlanReport/WorktreeStatusRow/UsageRow from other files. Alternative (minimal: only the ~250 items referenced across files) is a smaller diff but needs compiler-driven iteration and leaves the next mover to repeat it; recommend uniform. dead_code analysis is unchanged by pub(crate). Each new module starts with `use crate::*;` (the root's private `use anyhow::{Context, Result}`, `colored::Colorize`, `serde::*`, `HashSet`, `IsTerminal`, `Uuid` and every `use <mod>::*;` are re-exported through that glob exactly as queue_cmd.rs relies on today — it has no anyhow/colored imports yet uses `Result<` 40x and `.green()` 260x), and lib.rs gains `mod <new>; use <new>::*;`. No `pub(super)`, no re-export shims, no renames.

    MECHANICS (how the move is done and proven)
    Two-phase, one PR, one commit per new module:
    - Commit A "visibility": scripted (`scripts/split-lib/visibility.py` — regex on `^fn|^struct|...`, `^    fn` inside root impls, `^    name:` inside root structs) then `cargo fmt`. Proof: token-level diff — tokenize old and new lib.rs (strip whitespace, drop `pub(crate)` tokens) and require identity; `git diff -w --word-diff` shows only `pub(crate)` insertions and rustfmt re-wraps.
    - Commits B1..Bn "move <module>": `scripts/split-lib/move.py` driven by a manifest `docs/plans/2026-09-26-story-1488-split-manifest.toml` listing for each target file the item anchors as the exact first line of each item (content-anchored, never line numbers, so the same script replays on any branch). The script cuts each item span (leading `///`/`//`/`#[...]` lines through the item's closing brace, plus an immediately following `#[cfg(test)]` block that names the item) verbatim, prepends the fixed 4-line header (`//! <purpose>`, `// trace:STORY-1488 | ai:claude`, blank, `use crate::*;`), writes src/<target>.rs, and inserts `mod <target>; use <target>::*;` into the root block. Proof per commit: (1) `git diff --color-moved=zebra --color-moved-ws=allow-indentation-change -M --stat` — every moved block shows as moved, nothing else red/green besides the header lines; (2) multiset check: `sort` of non-blank lines of old lib.rs == `sort` of non-blank lines of (new lib.rs + all new files) minus the allowed header/`mod`/`use` lines — `diff` output must be empty; (3) `cargo fmt --all -- --check` passes with no reformat (top-level items keep column 0 so rustfmt is a no-op); (4) `cargo build` and `cargo clippy --workspace` warning count unchanged (a new `unused_imports` on `use crate::*` is impossible here; a new dead_code warning means a test module lost its owner — fix the manifest, not the code); (5) `cargo test --workspace` green, same test count as baseline (3,149 in src/tests + 148 inline lib.rs + 3,685 in modules); (6) golden outputs byte-identical: `aida --help`, `aida help-all`, `aida list --format toon`, `aida status --format json` on the dev store; (7) `tests/test_mcp_stdio.sh --skip-agent-contract`.
    Exactly three non-move edits, listed in the PR: merge_hold.rs:2223 `include_str!("lib.rs")` (scans the MergeHoldAction::Clear arm) -> the new merge_hold_cmd.rs; src/tests/bug_1186_reviewer_seat_tests.rs:87 `include_str!("../lib.rs")` (scans the PhaseDriver review phase) -> `../phase_driver.rs`; src/tests/resolve_aida_exe_tests.rs:56 (allows one `current_exe()` in lib.rs) -> kernel.rs. `#[path = "tests/..."]` decls need no edit only because the new files are flat siblings of lib.rs in src/ (a `src/status/ps.rs` layout would resolve `#[path]` against src/status/ and break 241 decls) — flat layout is therefore a slice-1 constraint, not taste.
    Pre-commit gate (aida-pre-commit.sh, TASK-144): moved `///` provenance lines are credited by trimmed exact match against the `-` side of the staged diff, so pure moves pass. It is O(removed lines) subprocess spawns (~2 per line): a single 110k-line commit would take minutes; per-module commits (5–8k lines) keep it at seconds and give per-module color-moved review. lib.rs holds 2,298 `///` lines with SPEC-IDs (835 `trace:`) — all credited, since step A never touches `///` lines. Commit form: `[AI:claude] refactor(cli-lib): move <domain> out of lib.rs (TASK-<child>)`.

    CONFLICT STRATEGY (fleet is not quiet: 8 branches with lib.rs edits pushed in the last 30 min; 344 of 588 commits in 30 days touch lib.rs; 1,372 unmerged remote branches)
    - Declared window, ≤ 2 h: operator runs `aida shift disable` (night-shift job, enabled 2026-09-26 #2212) and `aida drain stop`, waits for the current `chore(integrate): batch N` to merge and `aida ps` to show no implementer seats, then the split PR is opened against that exact main, reviewed by the checks above only, and merged first. Branch the split from the merged batch commit so no in-flight PR is between base and split.
    - In-flight branches (predict with `aida pr rebase --check`, which runs git merge-tree): ship `scripts/split-lib/relocate-hunks.sh`: for each commit on the branch, take its lib.rs hunks, find each hunk's context lines (byte-identical after the move) with a unique grep across src/*.rs at the split commit, rewrite the `--- a/aida-cli-lib/src/lib.rs` / `+++` headers to that file, and `git apply --3way`; hunks that touch lines the split did not move apply to lib.rs unchanged; ambiguous hunks are listed for manual placement. Recipe in the rebase note: `git rebase --onto <split-commit> <pre-split-main> <branch>` with `git rerere` on, then the script for conflicted commits. Same helper works for unpushed worktrees. Codex seats get the note by one operator paste (they do not read the mailbox); claude seats via `aida mail`.
    - After the window: re-enable shift; the next drain wave rebases normally.

    SLICE 2 CANDIDATE CRATES (dependency-ordered, from the census; all numbers are qualified-path counts, exact for non-glob modules)
    Module graph: 253 modules, 332 module->module edges, 3 SCCs only (statusline_* x4, compete/compete_cmd, history/history_cache) — the real cycle is root items <-> modules, i.e. lib.rs. Root coupling: 38 modules use `use crate::*` (72.4k lines: the *_cmd clusters, doctor_cmd, init_cmd, git_backend_cmd, session_reap, statusline_cmd…) — these stay in the top crate; 74 modules (58.5k lines) reference no root item at all and depend only on each other (LAYER-0: cli 15.8k, events, review_verdict, integrate, pr_rebase, punt, permissions, process_probe, notify, team, worktree, worktree_lock, schedule, ship, metrics, drain_resume, drain_summary…); 64 more modules (52.2k lines) depend on the root only through the kernel closure (LAYER-1: auto_complete 13.4k, token_ledger, evaluator, glyphs/glyph_config, schedule_driver, supervisor, status_display, status_cleanup, health_*, help_*, user_alias, workflow_hints, init_bootstrap, first_run, forge_profiles…); the remaining 77 non-glob modules (113k lines: mcp 13.9k, session 6.7k, forge 5.6k, burndown 5.2k, maintenance_schedule 4.8k, awaiting_you 4.6k, history 4.4k, shift 3.7k, agent_registry, merge_hold, drain_state, pr_ship, digest…) are each blocked by 1–6 root items that slice 1 turns into module-level edges (e.g. burndown needs wait_for_ci_terminal from ci_probe; forge needs OpenPrInfo/PrLookup from pr_lookup; session needs 5 session helpers) — recompute layering after slice 1.
    Crates, one per child spec, each kept only if the measured incremental time improves (acceptance 3):
    - 2a aida-cli-kernel (~5k): kernel.rs + output_format.rs + glyphs + glyph_config + not_found + build.rs (owns AIDA_BUILD_* stamps: build_sha_short uses env!("AIDA_BUILD_GIT_SHA")). test_env/test_home/test_ambient become a normal (non-cfg(test)) `aida-cli-testkit` dev-dependency crate (test_env is used by 59 files across future crates; cfg(test) modules are not visible cross-crate). OUTPUT_FORMAT_OVERRIDE static lives here with a pub setter called by dispatch.
    - 2b aida-cli-base (~58k): LAYER-0 as-is, cli.rs foremost — 105 clap derive types whose proc-macro expansion is paid on every rebuild of the crate today. Depends on aida-core (+ kernel for glyph if any base module uses it; none does today).
    - 2c aida-cli-engine (~30k): auto_complete + autoprogress + drain_state/drain_lock/drain_caps + phase_driver/phase_gates/drain_batch/drain_next_n + token_ledger — the drain engine; blocked until its root deps are in kernel/base (post-slice-1 recompute).
    - 2d one or two LAYER-1 domain crates (scaffold/init/health/help ≈ 20k) if 2b shows the per-crate win holds.
    - top: aida-cli-lib keeps dispatch, the 38 glob clusters, mcp, sessions, and every test that spans domains. Cross-crate items become plain `pub` on internal crates marked `publish = false` — feasible only if aida-cli-lib is not published to crates.io (open question 1); otherwise `pub` + `#[doc(hidden)]` and lockstep publishing in scripts/release.sh.
    Coherence: the 16 `impl X for Y` in lib.rs are local-trait or local-type (e.g. `impl LeaseStateGlyph for aida_core::LeaseState`, `impl auto_complete::PhaseDriver for RealPhaseDriver` where the trait is in the engine crate and the type in the top crate — legal); the orphan rule only bites if trait and type both move below the impl — audit per crate move.

    EXPECTED WIN AND MEASUREMENT
    Slice 1: incremental codegen partitions by source module, so today a one-line edit in lib.rs re-codegens the 110k-line root CGU; after the split only the touched ~2–5k-line module's CGU is redone (front-end still type-checks the crate, query-incremental). Expect a measurable drop in the one-line-edit rebuild, not in clean builds. Slice 2: crates below the edited one are not recompiled at all; cli.rs derive expansion is isolated; the single unit-test binary becomes N smaller ones built in parallel (test link time is dominated by that binary today).
    Protocol (acceptance 1, recorded on this spec before slice 1; repeated after each slice, same machine, CARGO_BUILD_JOBS=3, sccache + mold as in ~/.cargo/config.toml since 2026-09-26, rustc version and `cargo build --timings` HTML attached): (a) clean `cargo build -p aida-cli` dev and release; (b) one-line edit (`let _ = 0;` in a rarely built fn) in lib.rs, in cli.rs, and in a leaf module, then `cargo build -p aida-cli` wall time, 3 runs, median; (c) `cargo test -p aida-cli-lib --no-run` clean and after the same edits; (d) `cargo check -p aida-cli-lib` after the lib.rs edit. Keep-if-improves applies to (b)-lib.rs and (c).

    RISKS
    - Step A regex over-reach (an `impl` block inside a fn, a struct literal at column 0) — mitigated by the token-level identity proof and by building after step A alone.
    - Name collisions between globs: two new modules exporting the same name would make bare uses ambiguous; impossible from a partition of one namespace, but a module-local private helper in an existing module that shadows a root name keeps shadowing (unchanged behaviour). Any ambiguity error is a manifest bug.
    - Test modules losing their owner: a `#[cfg(test)] mod x { use super::*; }` moved with a different item resolves through the glob anyway, but a test that reaches a private item of another new module now needs pub(crate) — covered by uniform step A.
    - Static/thread_local ownership: OUTPUT_FORMAT_OVERRIDE (L2326), DOCTOR_CATEGORY_ALIASES (L24335), thread_locals at L42542/44786/47130 move with their accessor fns (no cross-module access exists).
    - `#![recursion_limit = "256"]` stays on the crate root (mcp json! macro); the crate that hosts mcp.rs in slice 2 needs it.
    - Feature flags: only the tui pair and `mod client`/server_cmd (remote) are cfg-gated in lib.rs; keep both features in the top crate so no feature plumbing is needed until a crate hosting them exists.
    - Generated code: src/generated/aida.rs is committed, used only by client.rs (remote) — untouched in slice 1.
    - Blame continuity: `git blame -C -C -C` and `git log --follow` still attribute; note in the rebase doc.
    - Hook runtime on huge commits (see mechanics) and reviewer fatigue: reviewer verifies the seven checks and the three listed edits, nothing else.
    - Fleet churn: any branch merged between baseline and the split branch point invalidates the manifest — the script is content-anchored so re-running it on the fresh main is minutes; the window discipline above is what bounds it.
    - Slice 2 visibility explosion (STORY-772's finding) is real for the 77 blocked modules; the gate is the post-slice-1 recompute, not a guess.

    VERIFICATION CHECKS (named)
    V1 token-identity of step A; V2 color-moved + multiset diff per move commit; V3 fmt/clippy/warning-count parity; V4 `cargo test --workspace` green with unchanged test count; V5 CLI golden outputs byte-identical; V6 `tests/test_mcp_stdio.sh --skip-agent-contract`; V7 no lib.rs > 5k lines and no new file > 6k (`wc -l`); V8 the three include_str/path retargets are the only non-move hunks (`git diff --stat` on those files); V9 `aida pr rebase --check` prediction list + helper dry-run on the two largest in-flight branches before merge; V10 baseline and post-split timings on this spec.

    OUT OF SCOPE
    Any behaviour or output change; renaming or de-duplicating helpers; tightening visibility below pub(crate); splitting `run()` into per-command arms; nested directory layout; moving/renaming src/tests; changing clap types in cli.rs; build-profile or linker changes (mold/sccache already on); reducing test count; changing publication.

    OPEN QUESTIONS
    1. Is aida-cli-lib published to crates.io (manifest has keywords/categories; release.sh mentions "published release" but I found no cargo publish)? Decides plain `pub` + `publish = false` internal crates vs lockstep publishing.
    2. Uniform `pub(crate)` for every moved item/field/method (recommended, provable no-op) vs minimal annotation of the ~250 cross-file items?
    3. `run()` (3k lines, touches every domain): keep in lib.rs for slice 1 (lib.rs ≈ 4–5k) or move whole to dispatch.rs (lib.rs ≈ 1k, dispatch.rs becomes the hotspot)?
    4. ~45 flat files in src/ acceptable (required to keep 241 `#[path = "tests/..."]` decls untouched), or do we accept editing those decls to allow src/<domain>/ directories?
    5. Who declares the ≤ 2 h quiet window and when — right after the next integrate batch? Should the 8 currently active lib.rs branches land first or rebase after with the helper?
    6. Slice 2 order: kernel -> base (cli.rs) -> engine as proposed, or base first (largest, no root deps, no kernel crate needed) to get the earliest measurable win?
    7. Baseline machine/time: builds are capped at CARGO_BUILD_JOBS=3 and share the box with drain waves; timing runs need the same quiet window or a dedicated slot to be comparable.
    8. Child-spec structure: one TASK per slice/crate so the `(ID)` trailer completes the right thing — decompose now or at signoff?
