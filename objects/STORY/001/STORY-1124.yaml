- id: 01a0a392-bd79-7dc2-be6c-17805c516560
  author: joe
  content: |-
    Empirical validation (2026-09-14, codex exec headless on a throwaway python repo):
    - `--sandbox=workspace-write` bare: edit+run-test in workspace PROMPT-FREE ✅; but git-over-network BLOCKED (Could not resolve host) and ~/ writes BLOCKED (Read-only file system). => breaks cargo cold-fetch, git fetch/push, gh, aida pull/push under ask-for-approval=never (hard-fail, no prompt).
    - `--sandbox=workspace-write -c sandbox_workspace_write.network_access=true -c sandbox_workspace_write.writable_roots=["/home/joe/.cargo"]`: git ls-remote SUCCEEDED (returned HEAD sha) + ~/.cargo write SUCCEEDED, still workspace-confined for the rest of $HOME. => the functional middle tier.

    Proposed 'contained' posture = workspace-write + network_access=true + writable_roots seeded with the toolchain caches (~/.cargo; add ~/.rustup/~/.aida on demand). Strictly safer than the current danger-full-access YOLO, behaviorally identical for real work.

    Design implication for the story: `[agents] bypass` should accept a THIRD value 'contained' (not just true/false) that injects `--sandbox=workspace-write --ask-for-approval=never` for codex (+ the parallel Claude/antigravity sandboxed equivalent) instead of the nuclear flag, with the network/writable_roots tuning read from vendor config. Until then the hand-config workaround is: `[agents.codex] default_flags = ["--sandbox=workspace-write","--ask-for-approval=never"]` + the [sandbox_workspace_write] table in ~/.codex/config.toml.
