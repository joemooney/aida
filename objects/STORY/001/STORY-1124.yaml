title: 'Codex ''contained-autonomous'' posture: prompt-free BUT sandboxed (workspace-write + approve-for-me), a middle tier between codex-defaults and --bypass-sandbox'
description: |-
  Today aida agent new codex has two postures: bare = codex normal approval/sandbox (constant prompts) or --bypass-sandbox = --dangerously-bypass-approvals-and-sandbox (removes BOTH sandbox and approvals — the nuclear the operator wants to avoid). Add the safe MIDDLE tier: 'contained-autonomous' = prompt-free BUT sandboxed.

  DECIDED (ADR-31, via /aida-derisk 2026-09-15): contained = --sandbox workspace-write + --ask-for-approval never (NOT approve-for-me, NOT on-failure). Prompt-free with the workspace-write sandbox as the hard wall; no auto-escalation; headless-safe (never hangs on a prompt). Network/cargo/git work via the ~/.codex [sandbox_workspace_write] table (network_access=true, writable_roots=[~/.cargo,~/.rustup,~/.aida]), not via approval escalation. --bypass-sandbox stays the SEPARATE explicit nuclear opt-in.

  Add the 'contained' codex posture to the launcher, config-driven (agents.toml / .aida/config.toml), so aida agent new codex runs prompt-free-but-sandboxed without hand-assembling flag chains and WITHOUT the nuclear bypass. Surface the resolved posture in --noexec. Document the ~/.codex/config.toml persistent equivalent (sandbox_mode='workspace-write', approval_policy='never', the sandbox table) for non-AIDA codex use.

  Acceptance (fork decided; safety is testable/CI-gated):
  - A 'contained' codex posture is selectable via config; the launcher resolves it to EXACTLY: --sandbox workspace-write --ask-for-approval never (plus the sandbox table for network/writable-roots). approve-for-me and on-failure are NOT used.
  - SAFETY GATE (test, CI-enforced): a unit test asserts the resolved contained argv CONTAINS --sandbox workspace-write AND --ask-for-approval never, and does NOT contain --dangerously-bypass-approvals-and-sandbox (nor --dangerously-bypass). A second test asserts the bypass posture is the ONLY posture that yields --dangerously-bypass, and only when explicitly selected.
  - --bypass-sandbox remains the explicit nuclear opt-in, unchanged; contained never implies bypass.
  - The resolved posture (tier + exact flags) is visible via --noexec (pairs with TASK-1232).
  - SPEC-ID / internal tokens stay out of any user-facing --help / stdout (user-facing-text conventions).
