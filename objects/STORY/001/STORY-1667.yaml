spec_id: STORY-1667
agreed_id: STORY-1667
title: Decision rows with Context / Chosen / Rejected-because / Evidence / Revisit-when, anchored from code by trace:DEC-N
description: |+
  ## F2. Decision rows with "rejected because" and code anchors

  **Seen:** this project's most expensive knowledge is negative.
  - Polling for slots starved waiters.
  - An inherited lock fd deadlocked.
  - A queue lock had to be explicitly released.
  - Exit code 200 collided with the slot-busy sentinel.

  All of it lives in code comments. A rewrite deletes it.

  **Proposal:**
  - A decision row template with Context / Chosen / Rejected-because / Evidence /
    Revisit-when.
  - Code points at it with `trace:DEC-N`, so the reason is one hop away from the
    line it protects.
  - `aida show` on a story lists the decisions traced into its files.

  ## Acceptance

  Scope note: decision rows already exist (type `decision`, ids `ADR-N`), and `trace:ADR-N` markers in code already resolve under `aida trace check`. This story adds the structure and the reverse lookup; it does not add a new type or id prefix.

  1. `aida add --type decision` with no `--description` seeds the body with five headed sections: `## Context`, `## Chosen`, `## Rejected because`, `## Evidence`, `## Revisit when`. An explicit description is stored unchanged (no forced template).
  2. `aida lint <ADR-ID>` (the existing opt-in lint) reports a warning, not an error, for a decision row missing `## Rejected because` or `## Revisit when`. Existing decision rows are never rewritten.
  3. `aida show <SPEC-ID>` for a non-decision spec gains a "Decisions in its code" section: the distinct `ADR-N` ids found as `trace:ADR-N` markers in the files that carry a `trace:<SPEC-ID>` marker, each with its title. The section is omitted when there are none, and is present in `--format json` as an array.
  4. The trace-authoring guidance (the implement skill template and the repository guide's trace section) says a line protecting a negative-knowledge choice should carry `trace:ADR-N` next to its spec trace.
  5. Tests cover: seeded template on add; explicit description untouched; lint warning on a template-less decision; show listing a decision traced in a co-traced file and omitting the section when none.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), feedback file docs/regeneration/aida-feedback.md at commit f2b8d2d; results in docs/regeneration/results-2026-10-11.md. Headline numbers: a blind agent rebuilt the 1,600-line system from the curated store at 93.9-95.5% of discriminating oracle checks (3 replicates), 22.7% without the 3 contract rows, 11.4% from the store as it stood before regenerability work; an AfterVibe Prompt A.1 spec distilled from the transcript reached 97.7%.

