  content: |-
    [aida:proxy-approval]
    pr: #1987 feat(monitor): version read-only contract (STORY-1352)
    verdict: APPROVE + merged 2026-09-20 03:44:22Z at head f407ca09
    proxy: claude driver-advisor, session 01a0adee
    independent: yes — neither implemented nor briefed by this advisor. I advised the consuming monitor project on what it would need, which is upstream of this spec rather than of this code.
    gates cleared: required Build (ubuntu-latest) SUCCESS; merge-hold-gate re-run SUCCESS after this review cleared the drive hold; no reviewer phase live at merge time

    WHAT MAKES THIS A CONTRACT RATHER THAN A PROMISE, which is what I checked instead of reading the prose. A versioned interface document with no mechanism behind it is a wish. Both halves are present and both run in CI: verify.py reads the LIVE manifest via `aida contract --json` and compares it against the checked-in fixtures, so a fixture that stops describing reality fails; and compatibility_errors compares the base ref's manifest against the current one, demanding a minor bump for an added field and a major bump for a removed or retyped one, naming the offending field. The unit tests cover the version decision directly including that a major bump PERMITS a breaking change, which is the negative case that stops the rule being merely restrictive.

    The declared boundary is the right one: read-only, no write or dispatch, consumers must not parse human output or read the store directly, and a field visible in JSON but absent from the manifest is explicitly not promised. That last clause is the one that will matter, being the difference between a consumer depending on what we publish and one depending on what it happens to see.

    ON THE INFORMATIONAL WINDOWS RED AT MERGE TIME, verified by name rather than waved past. Two failures, neither introduced here: the maintenance-schedule lock test (BUG-1303) and the pull-rebase test whose fix is sitting unmerged in PR #1977 (BUG-1283). Both are known open defects on other specs. Merging over them is the same judgement I corrected myself on for #1977 earlier tonight: this spec's acceptance is its own, not the whole suite's, and coupling a finished change to unrelated redness protects nothing.

    It is also live evidence for the feedback loop worth naming: #1977 holds a PROVEN fix for one of those two failures, so every branch's cross-platform run keeps failing on a test we have already fixed and not landed. That makes the matrix look worse than it is and makes the genuinely open defect harder to see.

    FOLLOW-UP RECORDED, not blocked on. The CI step is gated on the `full_ci` path filter, which is everything minus docs and markdown. The contract's own fixtures live under docs/monitor-contract-fixtures/, so they sit inside the excluded path. Any code change triggers the guard, which covers the realistic case, but a docs-only change editing a fixture alone would not run the guard that validates fixtures. One line re-including the fixtures directory and the contract document in that filter closes it. A guard whose own inputs are outside the trigger that runs it is worth fixing while the reasoning is fresh.
