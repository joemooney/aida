  content: 'DRAFT (uncompiled) on claude/story-1487 @ 2ee9e6c567: new aida-cli-lib/src/criteria_coverage.rs — resolve_target (gap/coverage -> Coverage, else Spec; pure), Share{numerator,denominator} with percent() None on 0 denominators, WindowFigures (window + all time), CoverageReport (serde, --json emits it); (a) git log --no-merges --format=%s [--since] with the shared push_paren_spec_ids_from_line trailer parser; (b) is_work_type (Functional/NonFunctional/ChangeRequest/Bug/Epic/Story/Task/Spike, the corpus.py set) minus is_machine_filed (auto-complete failure title, Review PR-N title, auto-drafted tag, Auto-drafted description) with created_at in window, criteria via criteria::parse_acceptance_criteria; (c) criterion ids matched (uppercased) against criterion-level trace tokens from git grep over all tracked files (report.py pattern), plus criterion_trace_tokens/criterion_traced_specs raw counts; (d) git grep trace:[A-Z]+-[0-9][0-9-]* over *.rs *.ts *.tsx *.py *.sh; filesystem-walk fallback outside a checkout. cli.rs Criteria gains --window-days (default 90); lib.rs dispatch matches resolve_target; docs/cli/08-reporting.md documents the report and the documented check against spike-86-scripts (acceptance 3 handled as a documented check, not a test — needs a build and the pinned commit). Decisions: name is `aida criteria coverage` with `gap` as alias (no new clap subcommand: spec stays a positional so `aida criteria <ID>` is unchanged); trailer detection reuses the AIDA parser (accepts prose after the first id) so a <=1pp drift from the script regex is expected and documented; System/User types excluded like corpus.py. Tests: story_1487_capture_coverage_tests.rs (registered inside criteria_coverage.rs) — gap_and_coverage_are_never_spec_ids, trailer_share_counts_only_trailing_spec_groups, machine_filed_and_non_work_specs_are_excluded, report_figures_have_numerators_and_denominators (pure, incl. JSON fields), no_traces_at_all_reports_zero_of_n (real git repo, hand