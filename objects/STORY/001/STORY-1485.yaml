    4. Base handling approved: merge current origin/main into story-1485 preserving both sketch commit identities; no reset, no force-push.

    5. Standing bounds unchanged: guided lane (no unattended drain, no auto-complete), make check-ci-fast before every push, key refusal tests proven non-vacuous, no peer session as a test target, no merge/merge-hold clearance by the implementer.

