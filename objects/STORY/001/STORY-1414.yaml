title: 'Deterministic binary-freshness gate at wave launch: require the drain''s build SHA to equal main HEAD, build and re-exec if behind, instead of warning and running stale'
description: |-
  A drain wave pins a binary at launch and never checks whether it is current. Twice on 2026-09-20 that silently discarded merged fixes: once for five and a half hours across four orchestrator commits, and again for three hours after BUG-1467's provenance fix merged, during which every verdict the reviewer wrote was still unstamped because both it and the drain were on the older build.

  Both times the gap was found by a human looking, not by the system. `aida pull` prints "your aida binary is now behind HEAD" and was ignored on both occasions — including by me, after I had written myself a rule about it.

  THE MECHANISM ALREADY EXISTS AND IS POINTED AT A DIFFERENT PROCESS.

  `aida-cli-lib/src/mcp.rs` does precisely this for the MCP server:

      198:  fn check(&self) -> Option<McpRespawnPlan>       — query the on-disk binary identity
      201:  mcp_binary_is_newer_or_different(&running, &on_disk)
      213:  fn respawn(&self, plan)                          — "detected newer binary on disk; self-respawning"
      292:  fn exec_mcp_respawn(plan)                        — command.exec()

  A long-running MCP server notices a newer binary after a handled request and re-execs into it. The drain, where staleness does the most damage, has no equivalent. The drain already records `binary_sha` in `drain.lock` at wave start, so it knows what it is pinned to — nothing compares that to HEAD.

  PROPOSAL: a deterministic freshness gate at WAVE LAUNCH.

      aida queue work --batch X --auto-complete --require-head
        1. resolve HEAD of the default branch
        2. compare against the candidate binary's embedded build SHA
        3. if equal          -> launch, pin, proceed
        4. if binary behind  -> request a build for that HEAD, then re-exec into the
                                new binary and launch
        5. if build fails    -> see OPEN QUESTION

  WHY WAVE LAUNCH RATHER THAN PER-IMPLEMENTER. A wave pins one binary for all members; swapping mid-wave is what `make build-fast AFTER_WAVE=1` already refuses, correctly, because members would otherwise run under different orchestration semantics within one batch. Per-implementer freshness would reintroduce exactly that. The launch boundary is the only place where re-exec is both safe and sufficient.

  WHY A FLAG RATHER THAN ALWAYS. A drain deliberately pinned to an older binary is a legitimate debugging move — bisecting an orchestration regression, or reproducing a shelve on the binary that produced it. Default-on with an explicit opt-out would also be defensible; what is not defensible is the current state, where the only signal is a warning nobody reads.

  OPEN QUESTION, and it wants a decision rather than an implementation guess: what happens when the build fails? Refusing to launch means a broken build halts every drain — safe, total, and it converts a compile error into a full work stoppage. Launching stale with a loud, shelve-able record means work continues on known-old orchestration. I lean refuse, because a drain running unknown-vintage code is what produced tonight's confusion twice over, but the cost is real and the call is not mine.

  Acceptance:
  - `aida queue work --auto-complete` gains a flag that requires the launching binary's build SHA to equal the default branch's HEAD.
  - When behind, it requests a build for that HEAD and re-execs into the result before pinning the wave. It does not launch and then warn.
  - The wave's recorded `binary_sha` equals HEAD for any wave launched under the flag, and that is assertable after the fact from `drain.lock`.
  - The re-exec reuses the MCP path's shape (`query_aida_binary_identity`, `command.exec()`) rather than a second implementation.
  - A deliberate pin to an older binary remains possible and is explicit.
  - Build failure behaviour is whatever the open question above is decided to be, and the decision is recorded rather than implied by the code.
  - Regression fixture: launch with the flag against a stale binary; assert a build is requested, the process re-execs, and the pinned `binary_sha` equals HEAD.

  Related: this is the same argument STORY-1367 makes for scheduled checks, pointed at the binary instead — with the difference that here the remedy is already safe under concurrency (`AFTER_WAVE=1` exists and refuses to swap a pinned binary), so the gate needs no new concurrency reasoning.


  OPEN QUESTION ANSWERED BY THE ADVISOR 2026-09-20 19:33: ON BUILD FAILURE, REFUSE TO LAUNCH.

  AND THE STATED COST OF REFUSING IS FAR SMALLER THAN IT APPEARS - though it is NOT zero, corrected 2026-09-20 19:40. The question was framed as a trade: refusing converts a build break into a work stoppage, versus launching stale to keep work moving. The first half is false. `Build (ubuntu-latest)` runs `cargo build --workspace` (.github/workflows/ci.yml:121) and is a REQUIRED check on main. So if HEAD does not build, every FULL-CI member the wave produces fails its required check and nothing merges. THE EXCEPTION, and it is why this is a bounded cost rather than none: the build step is conditional on `full_ci` (ci.yml:118-121), an inverted path filter (ci.yml:45-53) matching everything EXCEPT docs/**, **/*.md, LICENSE and .gitignore. A docs-only or markdown-only PR takes the short-circuit at line 56, skips build, test, fmt and clippy entirely, and `Build (ubuntu-latest)` PASSES WITHOUT COMPILING. Those members would merge normally on a broken main, and refusing the wave blocks them. The stoppage is not caused by the gate - IT ALREADY EXISTS, caused by main being broken. The gate only relocates the discovery from "every member's CI fails, one by one, tens of minutes each" to "the wave does not start, immediately, with the reason named".

      So refusing costs ONLY the docs-only members - four path patterns' worth of exception - and buys the failure being visible at the point of decision instead of N members later. The trade is still overwhelmingly right, but the spec must not claim the cost is zero: that version is falsifiable by a single docs PR, and someone will find it. Launching stale, meanwhile, spends a whole wave on orchestration semantics known to be superseded - which is exactly the two incidents this spec exists to prevent.

  AND THE 'LOUD RECORD' ALTERNATIVE IS THE ONE WITH DIRECT EVIDENCE AGAINST IT. `aida pull` already prints "your aida binary is now behind HEAD". It was ignored twice on 2026-09-20 - once by the seat that had written itself a rule about exactly this. A control whose enforcement is a message the operator may ignore has been tested today, twice, and failed both times. "Launch stale with a loud record" is that same control with a louder message, and this spec's own evidence section is the argument against it.

  REQUIRED SHAPE OF THE REFUSAL, because a refusal that cannot be overridden becomes a different hazard:
    - The refusal names the failing build and the HEAD sha it tried to build, so the operator does not go looking.
    - An explicit override exists for the legitimate pinned-binary cases the spec already identifies - bisecting an orchestration regression, or reproducing a shelve on the binary that produced it. The override is a deliberate flag, not a fallback the gate takes on its own.
    - The override records WHICH binary the wave is pinned to and that the freshness gate was bypassed, in drain.lock alongside the binary_sha already stored there, so a later audit of a wave's output can establish what it ran under without reconstructing it from build times.

  WAVE LAUNCH IS THE RIGHT BOUNDARY - AGREED, AND FOR A SECOND REASON. The spec argues it from mid-wave semantic consistency, which is correct. The additional reason: per-implementer freshness would make a wave's members individually unauditable. Today `drain.lock` records one binary_sha for the wave, and that single fact is what let tonight's staleness be established at all. Per-implementer re-exec replaces one auditable fact with N, recorded nowhere, and the question "what was this wave running" stops having an answer.

  ADVISOR DISPOSITION: approved. execution_mode DRIVE, not drain. This is orchestrator-reliability work of the class that ships at the keyboard rather than in an unattended headless wave - a defect here disables the freshness gate for every future wave, and it would be tested by the very mechanism it modifies.
