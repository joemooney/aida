  content: 'ADVISOR SIGNOFF 04:30 on SKETCH v1 (STORY-1706): SIGNED. Q1 ACCEPT the same-uid trust anchor with the owner, 0600, no-symlink and v checks, as with mandate records. Document the limit in the PR body. Q2 YES, Scope::RelayRestart needs a re-mint; an old binary ignoring it fails closed. Add one line to the mandate start help naming the new scope. Q3 YES: PR A ''(Refs STORY-1706)'', PR B ''(STORY-1706)''; the marker-only --no-restart verb satisfies the spec. Conditions: C1 the restarted relay''s argv comes ONLY from the record''s arg= lines plus the appended --max-sessions; never from the env or the current config. C2 the 3-restart cap is per launch lineage (record sha) and survives tick restarts (relay.restarts on disk, as designed). C3 the operator crash-loop notice is deduplicated per launch sha (as designed); test it over two ticks. C4 PR B is gate-protected, so its merge goes to the operator after an independent STRICT approve. Build PR A in the aida-relay repo from its own worktree and never edit the installed relay copy directly. Proceed.'
