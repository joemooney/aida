title: 'aida regen trial: run-until-done policy and a completeness check, so effort is not scored as spec quality'
description: |
  ## F29. Cross-family trials need a completeness check or a run-until-done policy

  **Seen:** Gemini 3.1 Pro (agy, one print-mode turn, 4 minutes) wrote placeholders for two of the four tools and said
  so in NOTES. It scored 34.1%. Claude and Codex worked until finished.

  **Proposal:** before scoring, check that every required tool exists, is more than a stub, and handles `--help`. Give
  every harness a continuation policy ("continue until all required files are complete"), or score only components
  the agent claims to have finished, and report the two separately.

  ## Acceptance

  To be written at triage; the proposals above are the starting point.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), docs/regeneration/aida-feedback.md at commit e9521ab; results in docs/regeneration/results-2026-10-11-round2.md and -round3.md. Round 3: from the AIDA store, 6 of 8 models across Anthropic, OpenAI and Google regenerate the system to 86-96% of discriminating oracle checks; two checks fail for every model.
