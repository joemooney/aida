title: 'GitLab Slice 3: abstract CI-watch + delegated-review check-runs behind the Forge trait'
description: 'The deepest gap — unblocks unattended --auto-complete on GitLab. Route wait_for_pr_checks_to_register / watch_ci_terminal through ci_probe_for_branch/watch_ci/stream_ci_for_branch (implemented on GitLabForge), and abstract the reviewer''s gh api .../check-runs severity tally behind a forge method (GitLab .../statuses has a different shape). Proposed mode: guided (deepest, drain-critical). Acceptance: a headless drain on a GitLab repo watches CI + tallies review verdicts via the trait, no direct gh; GitHub unchanged. Validate live. Depends on Slice 0/1.'
