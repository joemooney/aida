  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (STORY-1486):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 372a14e28e5b
    Recorded: 2026-11-08T06:53:26.330086939+00:00
    Findings:
    1. AC3/guest: agent_launch.rs:406 gets the parent seat from current_seat(), which only returns a validated grant. Guest is a BASELINE_SEAT (seat_authority.rs:2784) that runs ungranted and is identified by AIDA_SESSION_ROLE (stakeholder_role.rs:6, permissions.rs:258). So in a guest session, 'aida agent new claude --no-exec --verbose' prints 'git_policy: write', and a guest parent launching --role implementer also prints write, contradicting launch_permission_profile.rs:7-8 and the docs. The unit test only passes with a fabricated Some("guest") parent. Fix: treat a guest env role as a downgrade input (a label can only lower the declaration, so it grants nothing) and test with AIDA_SESSION_ROLE=guest.
    2. AC3/test: the criterion requires a test that the policy is printed by --no-exec --verbose for normal, guest and --git-read-only seats. The tests call git_policy() directly and parse clap separately; nothing exercises the print in handle_agent_command (agent_launch.rs:400-415), so the wiring is untested and the guest bug above went unseen. Add an output-level test through agent new --no-exec --verbose for all three seats, asserting the declared-not-enforced line.
    3. Requester misdeclared: launch_permission_profile.rs:10-13 matches only guest, so --role requester or a requester session prints 'write (development baseline...)'. Requester is a stakeholder persona, 'not a build seat' (role.rs:749-750), and the codebase pairs it with guest (permissions.rs:258, stakeholder_role.rs:16). Spec grants Git-write only to normal development seats. Treat requester as read-only or record why not on the spec, and add a test.
    4. AC1/launch root: render_agent_launch_noexec passes plan.project_root (agent_launch.rs:6206), which agent_launch_project_root_from maps to the primary checkout, and ignores plan.launch_cwd. 'aida agent new codex --cwd <linked-worktree> --no-exec --verbose' declares the primary as the writable project and omits the worktree the agent actually runs in plus its git-dir. linked_aida_worktree_uses_common_git_identity passes the linked path directly, a path production never takes. Declare the launch cwd and test through the real caller.
    5. AC1/AC4 on the live dev install: checkout() (launch_permission_profile.rs:60-68) only walks the executable's ancestors. The supported dev binary is ~/.local/share/aida/live/aida, outside any checkout (confirmed on this host), so every launch reports 'standalone installation': the AIDA checkout is not listed read-only for consumers and no target/debug or target/release locations appear. The spec requires authorization under the resolved local AIDA checkout. Resolve the checkout for promoted builds, or get the limit accepted on the spec.
    6. Preview failure on non-Git roots: render_roots uses git_path(...)? for the project and for the AIDA checkout (launch_permission_profile.rs:107-108,128). A scaffolded project without Git, or an AIDA source tree without .git, now fails --no-exec. render_agent_launch_diagnostics shares this renderer, so --verbose on a real launch hits the same Err. Degrade to a printed note instead of failing, and add a test.
    7. Repository identity trusts ambient Git env: git_path (launch_permission_profile.rs:29-33) does not clear GIT_DIR/GIT_COMMON_DIR. With GIT_DIR exported both probes resolve to the same directory, so line 128 reports 'verified AIDA repository identity' and lists the AIDA checkout writable for a consumer. Remove those variables on the child command and add a test.
    8. Criterion anchors missing: aida criteria reports all five STORY-1486 criteria untraced. Tests carry only a module-level trace; add trace:STORY-1486.<criterion> beside each proving test so coverage records them (ac91839b, generated_profile_preserves_approval_prompts, ac325a99, acc62dfa, acc62716).
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
