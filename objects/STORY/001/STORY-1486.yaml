title: 'Scaffolded agent launch profile: root scoping and declared seat-based Git read-only policy (no approval exemptions)'
description: |
  Split from TASK-1499 by operator decision (2026-09-26, "Portability only; the permission profile moves to a separate spec"). This is the permission-shaping half of TASK-1499. Read it against STORY-1473 (seat authority is session-bound and set at a TTY), which owns seat semantics.

  DECISION (operator, 2026-10-08, re-affirmed 2026-10-11): "Profile without exemptions". The generated profile scopes roots and declares Git policy; it adds NO approval-prompt exemptions and no bypass flags.

  SCOPE:
  - aida scaffold generates an agent launch profile that distinguishes the consumer project's writable roots (source, .git, .aida, .aida-store, cache, build output) from the AIDA source/build checkout, which is read-only unless the resolved repo identity is AIDA itself.
  - Seat-based Git policy: normal development seats get Git-write by default, guest seats are Git-read-only, and --git-read-only downgrades any seat. Current adapters cannot enforce a Git-write ban (codex headless passes --dangerously-bypass-approvals-and-sandbox; bwrap always binds the worktree writable), so this story DECLARES and PRINTS the policy; enforcement is a follow-up once a backend supports it.
  - Scaffolding authorizes both target/debug and target/release under the resolved local AIDA checkout, so switching build modes needs no scaffold rerun.

  Acceptance:
  1. consumer_profile_keeps_aida_checkout_read_only and aida_self_development_uses_verified_repo_identity: the generated profile lists writable and read-only roots separately; the AIDA checkout is read-only for a consumer project and writable only when the resolved repo identity is AIDA.
  2. generated_profile_preserves_approval_prompts: the generated profile contains no allow/no-ask exemption rule and no approval-bypass flag (test).
  3. The effective seat Git policy (write / read-only, and why) is printed by --no-exec --verbose before the agent starts, for a normal seat, a guest seat and a --git-read-only seat (test). The output states that the policy is declared, not enforced, on adapters that cannot enforce it.
  4. Both target/debug and target/release are authorized; switching between them needs no scaffold rerun (test).
  5. No generated file contains a machine-specific absolute path (inherits TASK-1499's rule).
