  content: 'FACTORY PLAN (day): Approach: new gate 0b in aida-core/templates/hooks/aida-pre-commit.sh (master; .git/hooks/pre-commit symlinks to it), placed before the AIDA_ALLOW_INTERMEDIATE bypass so only AIDA_ALLOW_PRIMARY_COMMIT=1 overrides it. Gate is inert unless <toplevel>/.aida/config.toml has [hooks] block_primary_commits = true (POSIX awk parse, no binary needed). When on: primary checkout = absolute --git-dir equals absolute --git-common-dir; protected branch = main plus origin/HEAD''s branch if set. Exempt silently: MERGE_HEAD present, rebase-merge/rebase-apply dir present, aida-store branch or .aida-store path, linked worktrees. Primary checkout + protected branch -> exit 1 with message naming ''aida worktree add <SPEC>'' and AIDA_ALLOW_PRIMARY_COMMIT=1. Primary checkout + other named branch -> one-line warning, allowed. Override -> note on stderr, remaining gates run, TASK-917 sentinel still written at the end. Files: hook master (+ make sync-templates mirrors), .aida/config.toml ([hooks] block_primary_commits = true), scripts/release.sh (operator release commit on main sets AIDA_ALLOW_PRIMARY_COMMIT=1 until TASK-1721 moves release to a PR), new tests/test_precommit_primary_checkout.sh wired into ci.yml next to the provenance hook tests. Named tests in that script: refused_on_main_primary, override_allows_and_writes_sentinel, merge_commit_allowed, rebase_replay_allowed, aida_store_branch_allowed, worktree_feature_branch_allowed_silently, primary_non_main_warns, gate_inert_without_opt_in. Risks: existing hook tests and Rust tests commit on main in temp repos (no opt-in config, so inert, which the inert test covers); release.sh commit on main (handled with override); cherry-pick/revert on main in primary are refused (not in the exemption list; override available). Acceptance: each criterion maps to one named case in the shell test; make check-templates for the template criterion.'
