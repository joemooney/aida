- id: 01a129cd-b057-7b22-bd3f-08718789b633
  author: night-fable
  content: |
    PRODUCT TRIAGE (night): recommend approve because the gap is real (the only primary-checkout guard is warn-only and session-scoped), the change is one hook gate with an explicit override, and STORY-1646 deliberately split it out as a sibling rather than a child.

    Problem: an agent can commit straight into the shared primary checkout on main and nothing refuses it; TASK-1178's guard only warns and only fires for worktree-scoped sessions.

    Evidence path (verified):
    - aida-core/templates/hooks/aida-pre-commit.sh:156-174: the TASK-1178 scope gate is structurally warn-only (`|| true`) and runs only via worktree-scope-gate for scoped sessions. No gate compares --git-dir with --git-common-dir. Reusable pieces already in the hook: line 23 uses `git rev-parse --git-common-dir`, lines 339-341 detect MERGE_HEAD, lines 38-40 special-case .aida-store.
    - No [hooks] config section exists (`rg "\[hooks\]|HooksConfig" aida-core/src` finds nothing; none in .aida/config.toml), so the opt-in key is new.
    - Relationship to STORY-1646 (Approved, batch:next): its "Split out" section names this spec as a sibling (related:, not a child). No overlap: 1646 gates promotion on a clean checkout; 1647 prevents the commit. Keep separate; 1647 ships independently. Last hook change on main is 7cad9ce231 (BUG-1925); no primary-commit gate has landed.
    - TASK-1721 (release via PR, Draft) is the server-side backstop this spec relies on for --no-verify; until it lands the refusal is advisory strength only.

    Acceptance criteria:
    1. Shell test in a temp repo: primary checkout, branch main, staged file; `git commit` exits non-zero with a message naming `aida worktree add <SPEC>` and AIDA_ALLOW_PRIMARY_COMMIT=1.
    2. Same with AIDA_ALLOW_PRIMARY_COMMIT=1: commit succeeds and the TASK-917 sentinel is still written (not mistaken for --no-verify).
    3. Merge commit (MERGE_HEAD present), rebase replay (rebase-merge or rebase-apply dir present) and .aida-store path or branch: all allowed.
    4. Sibling worktree on a feature branch: allowed silently; primary checkout on a non-main branch: allowed with a one-line warning.
    5. A consumer project without `[hooks] block_primary_commits = true` sees an inert gate; AIDA's own .aida/config.toml turns it on; `make check-templates` passes.

    Scope / non-goals: no detection of uncommitted edits (STORY-1648); no server-side protection (TASK-1721). Related: related:STORY-1646 related:STORY-1648 related:TASK-1721 related:TASK-1178 related:FAQ-29.

    Suggested size: S.
