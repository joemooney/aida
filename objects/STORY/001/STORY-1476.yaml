  content: 'DRAFT (uncompiled) on claude/story-1476 @ 0167a1bc27: AcceptanceCommandPolicy (+permits, permissive()), CriterionStatus::NotRun, GradedReviewVerdict.not_run_count (serde default), execute_graded_review(.., policy) gate with NotRun escalation ahead of BOTH approve branches (A1) and no evaluator calls once anything is refused; refused chars = ; & | $ ` < > ( ) \ '' " + all C0/DEL except TAB (A3); exact word match, trailing-* opts into args (A2); reviewer prompt emits NOT RUN section whenever not_run_count>0 with do-not-execute wording (A4/A5); summary names count + repo-optin-ignored line (A6); loader acceptance_command_policy_global (crate::home_dir only, stderr notice once per review) + pure acceptance_command_policy_from_toml -> Result (Err = denied reason) + display-only repo_review_optin_present (local + TASK-969 trusted copy); config_cmd KnobSpecs run_acceptance_commands/acceptance_command_allow ReadOnly + [review] rows; story_1424 tests pass permissive() unchanged assertions; docs: autonomous-drain.md [review] section with migration notes (A7), config-trust-boundary.md row. Deviations: from_toml returns Result<Policy,String> instead of bare Policy so the fail-closed reason is testable; no CHANGELOG edit (file is generated). Tests: story_1476_acceptance_trust_tests.rs — default_policy_does_not_run_spec_command, all_notrun_with_evaluator_never_auto_approves, mixed_passed_and_notrun_escalates, failed_plus_notrun_stays_rejected, notrun_not_sent_to_evaluator (RecordingEvaluator wrapper), enabled_allowlisted_command_runs, metachar_chained_command_refused_under_prefix, word_prefix_not_string_prefix, exact_match_refuses_arguments_unless_trailing_star, star_allows_metachars, quotes_and_control_chars_refused, disabled_or_empty_policy_denies, repo_config_optin_ignored (real git + origin), repo_without_optin_has_no_notice, malformed_global_config_fails_closed, enabled_but_empty_allow_denies, missing_global_config_denies, policy_from_toml_pure, prompt_lists_notr