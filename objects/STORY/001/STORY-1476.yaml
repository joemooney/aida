title: Require trusted-config opt-in before graded review runs spec-authored acceptance commands
description: 'From the BUG-1624 audit. graded_review::execute_graded_review runs acceptance commands written in the spec itself through bash -c. The store is shared across nodes, so anyone who can write a spec can choose commands that run on the reviewer''s machine, including unattended in the drain. Proposal: run spec-authored commands only when trusted local or repo config opts in (for example an allowlist of command prefixes or a [review] run_acceptance_commands = true in the trusted layer). Otherwise mark those criteria as needing manual verification. Acceptance: default behaviour, the opt-in mechanism, a test showing a spec-authored command does not run without opt-in, and migration notes.'
