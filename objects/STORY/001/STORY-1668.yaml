spec_id: STORY-1668
agreed_id: STORY-1668
title: A contract spec kind (CLI, env vars incl. test seams, file formats, exit codes) checked against behavior and mapped to tests
description: |
  ## F3. A contract spec type, checked against the code

  **Seen:**
  - Exact interfaces (flags, env vars, output columns, JSONL fields, exit codes)
    were never written down.
  - Tests depend on them heavily: most of an R1 regeneration failure is interface.

  **Proposal:**
  - A `contract` row (or a structured section in any spec) listing the CLI
    surface, env vars with defaults, file formats and exit codes.
  - A checker diffs it against reality: `--help` output, env vars the code reads,
    JSON keys written. Interface drift then fails a gate instead of silently
    diverging, in keeping with substrate-as-bouncer.

  ## F9. Test seams are contract

  **Seen:** the oracle drives the system through env vars the specs never
  mention: `AIDA_REAL_CARGO`, `XDG_RUNTIME_DIR`, `AIDA_CARGO_LOG`,
  `AIDA_CARGO_PSI_DIR` and `AIDA_CARGO_CONFIG`.

  **Proposal:** treat test seams as first-class interface in the contract spec
  (F3). Then any regenerated system can be judged by the same tests, and tests
  stay portable across implementations.

  ## F13. Link acceptance criteria to test names

  **Seen:**
  - Acceptance sections are prose.
  - The oracle tests carry `trace:` comments, but nothing maps an acceptance
    bullet to the test that checks it.

  **Proposal:**
  - Acceptance bullets get stable ids (`AC-13.2`) that tests reference.
  - An oracle failure in a regeneration trial then maps directly to the spec
    clause that was under-specified, which makes gap classification automatic.

  ## F19. Every oracle assertion should follow from the contract

  **Seen:** trial 1's two remaining failures were byte-level details (ANSI
  spans, warning wording) that the tests checked but the contract never
  stated.

  **Proposal:**
  - A "contract coverage of the oracle" check: for each test assertion, the
    contract clause that implies it (ties in with F13).
  - An assertion with no clause means either the contract is incomplete or the
    test is over-specified. Either way it is a finding before any trial runs,
    and it costs nothing to detect once assertions and clauses carry ids.

  ## F20. Check contracts against behavior, not comments

  **Seen:** SR-21 described `psi_run` as the code comment intended ("stall
  share during the run window"). The code actually measures from before the
  queue wait (BUG-46).

  **Proposal:**
  - When a contract is drafted from existing code, an agent checks each clause
    against observed behavior: run it, or write a probe test.
  - A reverse trial (F5) catches the same class of error.
  - Contracts carry a `verified-by:` field naming the test or probe.

  ## Acceptance

  To be written at triage; the proposals above are the starting point.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), feedback file docs/regeneration/aida-feedback.md at commit f2b8d2d; results in docs/regeneration/results-2026-10-11.md. Headline numbers: a blind agent rebuilt the 1,600-line system from the curated store at 93.9-95.5% of discriminating oracle checks (3 replicates), 22.7% without the 3 contract rows, 11.4% from the store as it stood before regenerability work; an AfterVibe Prompt A.1 spec distilled from the transcript reached 97.7%.
