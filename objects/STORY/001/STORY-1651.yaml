title: 'Reorganize docs by audience: adopters, operators/power users, and AIDA contributors, with one landing page and an adopter-only published book'
description: |-
  ## Why
  The docs mix three audiences. Someone adopting AIDA lands among positioning decks, competitive analysis, dated plans, contract fixtures and multi-agent control-plane internals that are irrelevant to them. TASK-1611 archived superseded material by age (98 files) but did not split what remains by audience: docs/ still has ~65 top-level entries.

  ## Scope
  1. Adopters stay in docs/, and this is what the mdBook (docs/book.toml) publishes: getting started and first project, everyday workflows (add/list/show/edit, capture, commit trailers, history), CLI reference (docs/cli/), agent/MCP setup, and troubleshooting/FAQ.
  2. Operators and power users go to docs/advanced/: multi-node, multi-hub sync, multi-user, forges, GitLab/CI runners, autonomous drains and relays, the mailbox, and admin.
  3. AIDA contributors go to docs/internal/: architecture, plans (docs/plans/ moves, or is linked from there), monitor contracts and fixtures, agent discipline and repository guides, analytics, positioning, competitive analysis, presentations, and future-vision.
  4. docs/README.md becomes the landing page with three doors: I'm using AIDA, I'm running AIDA at scale, I'm working on AIDA. The repository README links adopters to the first door only, and contributor material through CONTRIBUTING/OVERVIEW.
  5. Reuse TASK-1611's per-file inventory (docs/archive/2026-10-cleanup/inventory.tsv, regenerated by inventory.py). Add an audience column (adopter / advanced / internal / archive / generated) so every tracked doc has exactly one audience, and a check that fails when a new doc lands without a category.

  ## Constraints
  - Don't move generated mirrors, template masters (aida-core/templates/**), live agent instructions (CLAUDE.md, AGENTS.md, .aida/discipline/**) or normative ADRs. Link to them instead.
  - Moves use git mv, so history follows. Retarget every inbound link, including from code: help text, error messages, the MCP tool descriptions and templates that name doc paths.
  - Keep internal SPEC IDs out of adopter-facing prose.
  - Keep end-user docs paths stable where external links likely exist (getting-started.md, docs/cli/): move contributor material out instead of moving adopter material in.

  ## Acceptance
  - docs/ top level contains only the landing page, adopter docs, advanced/, internal/, archive/, cli/ and the book assets.
  - The published book's SUMMARY includes only adopter and advanced pages.
  - No broken local links (the repo's link checker passes), and no code or templates reference a moved path.
  - The inventory has an audience for 100% of tracked docs, and the new check runs in make check-ci-fast.
  - A fresh reader test: an agent given only docs/README.md can install AIDA, create a project and file a first spec without opening anything under internal/.

  ## Sequencing
  Starts after TASK-1611 merges. It builds on that branch's moves and inventory.
