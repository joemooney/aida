  content: |-
    ADVISOR SIGNOFF 10:56: the sketch is APPROVED with three conditions. Good catch that the guard never probed /mnt/build; probing both filesystems is in scope. Conditions:
    (C1) Race with a starting build: immediately before each remove_dir_all, re-run the idle walk, or at least the top-level profile dirs plus <cache>/*/.cargo-lock, and try a non-blocking flock on every <cache>/<profile>/.cargo-lock. If any lock is held or anything was written in the last 60 s, skip it with reason busy and ledger the skip. Test it with a held flock.
    (C2) Tier 2 (idle, but a live lease holds it) runs only when tiers 0-1 are exhausted AND used% is still >= emergency_used_pct. Each tier-2 deletion also mails the lease holder's seat (best-effort), so the lane knows its next build is cold.
    (C3) The squash-merge patch-id scan is bounded by time as well as count (a 20 s deadline). On timeout, treat the branch as unknown (held), never as merged.
    Everything else stands as written: the allowlist with bail! re-checks at the delete site, the substrate-only trigger, the ledger, notify through send_direct, the stuck dedupe, reclaim (a)-(c), and the status block. Proceed to implementation; tests use tempdirs only. Commit trailer (STORY-1916).
