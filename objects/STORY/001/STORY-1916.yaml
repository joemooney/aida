title: 'Disk guard: emergency auto-reclaim at a hard ceiling, and an escalation when the floor cannot be restored'
description: |-
  Operator request 2026-10-23. Today disk-headroom-guard (every 30m, min_free_gib=60) only routes a due item to the advisor seat. Nothing frees space automatically, and if aida worktree reclaim finds nothing (it counts every open-PR worktree as in use, even idle duplicates, and skips everything when gh is unreachable) the guard simply keeps firing. On 2026-10-23 /mnt/build sat at 88% / 60G free; 77G of idle duplicate and merged-PR caches had to be removed by hand.

  Acceptance:
  1. Emergency tier: a configurable hard ceiling ([doctor.disk_headroom] emergency_used_pct, default 95). At or above it, the substrate job deletes, without a human, only regenerable build caches: CARGO_TARGET_DIR/worktrees/<name> dirs whose worktree is gone, whose PR is merged or closed, or which have had no write for >= emergency_idle_hours (default 2h); oldest-idle first, stopping once usage falls below the ceiling minus a margin. Never worktree sources, never the main checkout's target/agent or the live binary, never a cache written to within the idle window. Each deletion is ledgered (path, size, reason) and the operator is notified.
  2. reclaim classifies an idle duplicate (a second worktree on the same open-PR branch whose cache is idle) as reclaimable, and falls back to git merge-base ancestry against origin/main when gh is unreachable instead of skipping everything.
  3. Stuck escalation: when the floor is breached and a reclaim dry run frees less than the deficit, the routed item says so, with the top cache consumers and sizes, and escalates to the operator (aida notify) rather than re-firing silently every 30m.
  4. Visibility: aida schedule status (or aida doctor check disk-headroom) shows free space, the floor, the ceiling, the last run, and the last automatic reclaim, so the operator can see at a glance that the guard is running.
