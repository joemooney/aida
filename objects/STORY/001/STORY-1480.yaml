  author: joe
  content: 'SKETCH + ADR (implementer, claude): decision recorded as ADR-60 (option B). Design: (1) new lifecycle event kinds close the four gaps — a PhaseEnded companion to PhaseEntered so a phase has a measured END rather than one inferred from the next entry; SpecParked/clear-on-requeue so a wait on a human or the advisor is attributed instead of unknown; a planning marker; a build span. All ride the existing events.jsonl seam and the existing PhaseEntered/SpecRequeued kinds — no second timing path. (2) At terminal state a per-spec timing record is published to the store at timings/<SPEC>.yaml via the schedule-ledger CAS loop, lifecycle kinds only. (3) Cross-machine: the store''s append-union class (union by stable id) is clock-independent, while its scalar class is wall-clock LWW with a content-hash tie-break and is NOT skew-safe (BUG-578; no HLC in the codebase). So the record is a union-by-content-id span set, each span tagged with the recording node. A span''s duration is one host''s measurement; a gap between spans recorded by DIFFERENT nodes is reported unknown with both nodes named, never clamped and presented as measured.'
