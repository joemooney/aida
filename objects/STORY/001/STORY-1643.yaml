title: /aida-capture should also capture FAQ candidates (question + verified answer), following the FAQ-11 convention
description: |
  ## Problem
  `/aida-capture` (template master: `aida-core/templates/skills/aida-capture.md`) only looks for requirements, features, bugs, decisions and completed work. It has no FAQ category, and its only `aida add` example uses `--type functional`. Sessions keep producing FAQ-worthy material that nobody captures: gotchas, "why did X happen" explanations, conventions decided in conversation. On 2026-10-10 the operator had to ask for FAQs twice in one session (FAQ-1..16 were filed by hand).

  ## Acceptance
  1. **Step 1 scan** gains an FAQ lens. Signals: a question the user asked that needed investigation to answer; a surprising behaviour explained (root cause found); a convention or rule agreed in conversation; a workaround for an open bug; a "how do I...?" answered with commands.
  2. **Step 2 dedup** for FAQs uses `aida search "<words>"` plus `aida faq list completed`, because the open lens hides completed FAQs. If an existing FAQ covers it, the action is **update** (edit the body or add a comment), not a duplicate.
  3. **Step 3 presentation** has a separate `### FAQ candidates` section. Each entry is the question as a title plus a one-line answer.
  4. **Step 5 execution** follows the FAQ-11 convention: title = the question; markdown body with a bold one-line answer, `## Why` / `## How` / `## See also`, and `## Caveat` when the answer depends on an open bug; `aida faq add ... --status completed`; then `aida db merge-gate` (until BUG-1921 lands). Cross-reference new FAQs by title, never by a guessed `FAQ-N`, because merge-gate doesn't number in creation order.
  5. **Headless/zen**: FAQ captures land as `draft` with tag `faq:unvetted`, so unreviewed knowledge isn't presented as settled. Interactive captures land `completed`.
  6. Best Practices note: an FAQ answer must be verified in-session (command run, code read). Answers that are unverified stay out or get a `## Caveat`.
  7. Edit only the template master, then `make sync-templates` and `make check-templates`. The `.claude/skills` mirror is generated.
  8. Cross-link: `/aida-doc` (living-doc capture) points to `/aida-capture` for FAQs, so the two don't diverge.

  ## Related
  FAQ-11 (convention), STORY-1642 (knowledge types), BUG-1921 (FAQ IDs)
