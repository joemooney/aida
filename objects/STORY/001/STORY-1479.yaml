  content: |
    Implemented end-to-end on branch story-1479 → PR #2366 (advisor seat under Joe's 2026-10-02 TASK/STORY mandate).

    Design: aggregate sibling of the STORY-1478 timeline. Pure aggregation core (SpecCycle digest → aggregate()) so every acceptance arithmetic is fixture-tested with literal numbers; collection batched for aggregate scale (one whole-branch --name-status walk + one `git cat-file --batch` + one drain-feed pass), with STORY-1478's marker decoder shared (markers_from_touches parameterized over blob transport) so the two views cannot drift.

    Acceptance → evidence:
    - per-activity count/p50/p90/total + work/wait/unknown share: tests story_1479_activities_* and story_1479_overall_shares_*; percentiles nearest-rank, mutation-proofed (ceil→floor fails exactly the two percentile tests).
    - rework signals: CI failure rate from local CiTerminal events, reviewer bounce (>1 reviewer pass over reviewed), avg implementer passes, shelves + total parked time; rates carry num/den, zero denominator renders as no-data not 0%.
    - slowest N with dominant span incl. unknown ("51% parked" style), test-pinned.
    - exclusions counted with reasons (no drain events on this machine / undatable completion / unbuildable timeline / zero-length window).
    - human + toon + json (schema_version 1, view metrics-cycle-time); format-json audit regenerated; CLI manual 08-reporting updated, verify-manual green against branch binary.

    Perf/equivalence: live 7d run (15.7k store commits, 214 completed-in-window) byte-identical between naive and batched transports, 9m07s → 1m04s. 31 lib tests green; check-ci-fast 17 gates green; CI overlapping on push.
