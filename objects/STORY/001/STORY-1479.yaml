title: 'Aggregate cycle-time breakdown: aida metrics cycle-time (per-activity p50/p90, work vs wait, rework rates, slowest specs)'
description: |
  `aida metrics cycle-time [--since 7d] [--type T] [--tags …]` aggregates the per-spec span model (from the timeline story) across every spec completed in the window.

  ## Acceptance
  - Per activity, it shows count, p50, p90 and total time, plus the overall **work vs wait vs unknown** share.
  - Rework signals: CI failure rate, reviewer bounce rate (specs with more than one reviewer pass), the average number of implementer passes, and shelve count with total shelved time.
  - It lists the N slowest specs, each with its dominant span (e.g. "BUG-1424 — 51% shelved").
  - It excludes specs with no data in the window and reports how many were excluded and why (for example, no events on this machine).
  - Output is human, toon and json.
  - Tests use fixtures and assert the percentile and share arithmetic.
