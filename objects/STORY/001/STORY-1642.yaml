title: 'Knowledge types (faq, decision, vision, term, principle) are reference, not work: hide from default list and never pickable'
description: |+
  ## Decision (operator + advisor, 2026-10-10)
  Default `aida list` shows **work** only. Knowledge types (Decision, Vision, Term, Principle, FAQ) are reference material. They are shown only when asked for and are never pickable as work. FAQ is lightweight: no lifecycle ceremony.

  ## Problem
  - `is_work_item_type` (aida-core/src/lifecycle.rs:428) treats FAQ as work. On 2026-10-10 `aida burndown plan` listed all ten approved FAQs as "ready to fan out", so an unattended drain would have assigned implementers to answer FAQs. Interim workaround: the FAQs were set to `completed`.
  - Its guard test (`work_item_type_class_excludes_only_the_knowledge_types`) hardcodes the types it checks and leaves out `Faq`, so adding the type (TASK-1614) didn't fail it.
  - The default `aida list` and the burndown/backlog pickers decide "what is work" separately.

  ## Acceptance
  1. `is_work_item_type` → false for `Faq` (alongside Decision, Vision, Term, Principle). The guard test iterates **every** `RequirementType` variant, so adding a new type forces an explicit work/knowledge choice.
  2. Default `aida list` (and the open lens) hides knowledge types using that same rule, the way META is hidden. Shown with: `--type <knowledge-type>`, `aida <type> list` (e.g. `aida faq list`, `aida decision list`), or `--include-knowledge`. The footer note says how many knowledge rows were hidden and how to show them.
  3. `aida faq list` (and other knowledge `<type> list` aliases) shows every status except archived by default. FAQs live as `completed`, so the open lens would hide them all.
  4. FAQ is lightweight: `aida faq add` defaults to status `completed`, skips AI evaluation/acceptance prompts, and doesn't need trace comments. FAQ is in the `aida add --type` help list.
  5. `aida search` keeps returning knowledge rows (that's how answers are found).
  6. Doc stays a work type (unchanged).

  7. **Type words in the `aida list` positional.** `aida list faq` (and any built-in type word) works as `aida list --type faq`. Today it errors "Unknown status filter 'faq'". A word that is both a status and a type is not a concern: no type name collides with a status/lens word. At minimum, the error must suggest `aida faq list` / `--type faq` when the word is a type.
  8. **Knowledge listings sort by numeric ID ascending** (FAQ-1, FAQ-2, … FAQ-16), not by modified time or merge-gate assignment order. Observed 2026-10-10: `aida faq list --all` printed 12, 14, 15, 13, 16, 10, 11, 9…
  9. **Lightweight FAQ table:** `aida faq list` shows `ID` and the question (title) only. Type, Status and Priority are constant for FAQs and add noise. Other knowledge types keep Status where it means something (e.g. a Decision can be superseded). Superseded or archived FAQs are hidden unless `--all` is passed.
  10. Regression tests for 7–9, plus `aida faq list` returning all 16 completed FAQs with no flags (item 3).

  ## Related
  BUG-1921 (FAQ IDs: no pre-allocated block), BUG-1920 (attribution + help list), TASK-1614 (faq type), FAQ-10, FAQ-11

