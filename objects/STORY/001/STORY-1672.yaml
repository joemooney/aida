    [groom:night] SPLIT. Two independent tools.

    Related existing: `aida trace coverage` (diff-scoped hunk coverage with the SPIKE-47 exemptions, EPIC-34/STORY-499), `aida trace check` (trace rot, TASK-868), `aida trace scan`. None reports whole-file coverage, and nothing inspects literals.

    Proposed slices:
    1. Whole-tree trace coverage report: `aida trace coverage --path <dir>` (or `--all`) reports, per file, functions with no trace marker in or above them, reusing the existing coverage definition and exemptions. Report-only. Acceptance: fixture crate with one traced and one untraced function reports 1/2 and names the untraced one; JSON output. Drain-safe.
    2. `aida lint constants`: numeric literals inside traced regions that appear neither in the traced spec's description nor in a linked decision row, with an inline `// arbitrary` (or similar) marker to silence one. Acceptance: fixture with 15 mentioned in the spec and 40 not -> only 40 flagged; marked literal skipped; 0/1 and obvious index literals ignored. Needs a small rule decision on which literals are exempt; heuristic and noisy, so report-only.
