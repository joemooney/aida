  content: 'ADVISOR 08:08 (operator discussion): proposed extra acceptance for relays. A relay run gets ONE handle that stays the same across all its sessions: the relay label (e.g. codex-task-1981), not a per-process name. Mail sent to it while no session is live is queued and shown at the next session''s start, and the relay handoff template tells each session to read its handle''s inbox. Role-addressed mail (--to implementer) must warn when 0 or more than 1 live agents hold that role, and must say which one(s) will read it. Evidence: BUG-2204 (the codex relay never saw --to implementer mail and halted on a wrong ''approved'' claim). This is a cross-vendor identity change, so it needs a sketch and advisor signoff before implementation.'
