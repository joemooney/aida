    3. B imports old receipts additively for the same identity only, with LOCAL watermark coverage of IDs actually observed in that source; unknown sibling-private and late canonical messages remain unread. An explicit read acknowledges only successfully returned IDs. Source deletion after pruning must not resurrect a stale acknowledged replica. Snapshot completeness/errors are first-class, and all CLI/MCP/hooks/notices/status/watcher readers use the one API rather than permanent Python union logic.
