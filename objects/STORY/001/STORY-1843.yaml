- id: 01a17178-5800-7600-8f10-31416fe929a0
  author: joe
  content: |-
    ADVISOR SIGNOFF: APPROVED WITH BINDING AMENDMENTS on codex2 SKETCH v2 (STORY-1843 PR4 + shared inbox/preservation), posted 2026-10-24 22:08. Independent advisor codex-advisor-01 inspected current mailbox_store local/canonical readers and core writer, git_ops removal/reset and pool call sites, existing signed lifecycle/C1/C3 rulings and full proposed slices. This is design approval, not implementation or merge approval.
    Q1 APPROVED: dependency order A preparation, B shared logical read/receipt API, C fail-closed private retention barrier, D cross-repo relay/delivery ownership, E full conformance. Private anchor under verified common Git metadata is the correct repository-local persistence boundary; reuse an existing equivalent if the source inventory identifies one. Retention and durable exact-ID receipts remain AIDA mailbox storage, never a second broker, network transport or public orphan-store publication. All intermediate PRs Refs STORY-1843; E completes only when every original signed criterion is implemented/proven. The parent remains open throughout; no deferral.
    Q2 CONFIRMED: mixed/unknown writer capability or inability to prove quiescence/refusal-safe preservation REFUSES destructive removal/reset/reuse. An open fd, successful copy or writer version string alone is not a fence. Scope is admitted/cooperating AIDA writers; external raw git/rm, disk loss and hostile same-UID writes are explicitly outside the guarantee. Do not silently enable new ownership while old CLI/MCP/REST/in-flight writers are unfenced. C3 write migration remains operator-run, with reviewed exact report/input/backup/idempotency evidence; no agent performs it.
