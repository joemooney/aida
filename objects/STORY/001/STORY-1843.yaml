title: 'Addressable agent handles: one short name per live agent, shown on the statusline, accepted by aida agent ls and aida mailbox send'
description: |
  Operator ask (2026-10-18): 'if each agent had a short id shown on the statusline I could give that name to you'. Today the advisor could not message the two agy batch agents.

  Observed gaps (pieces exist but are not joined):
  1. aida agent ls (the registry) did not list today's agy batch sessions; only a 2-day-old antigravity-implementer-1 appeared. Raw-launched non-Claude agents are not auto-registered (aida agent register exists, but nothing calls it).
  2. Registry names are claude#<pid> / codex#<pid>, not the -n name the launcher gave (rework-2736, impl-1700). Background claude fixers show role=advisor (inherited shell role), not their real role.
  3. Mailbox identities (aida mailbox list) are a separate, polluted namespace (phantom inboxes like L, SPEC, -include, BUG-52; see TASK-1766) with no mapping to registry entries or sessions.
  4. The statusline shows role, spec and queue depth, but no handle the operator can read off and relay.

  Acceptance:
  - Every live agent session (claude, codex, agy) gets one short stable handle at session start (e.g. vendor-role-NN, or the launch -n name when given), registered in the agent registry by the SessionStart hook for each client.
  - aida statusline renders the handle for all three clients' statusline integrations.
  - aida agent ls lists live agents of all vendors with the handle, real role, spec and liveness. Dead entries are pruned or marked.
  - aida mailbox send <handle> delivers to that agent's inbox, which its per-turn mailbox notice hook surfaces. A handle that resolves to no live agent is refused with a hint, rather than creating a phantom inbox.
  - A Claude session can address an agy session by handle and the agy session sees the message on its next turn (black-box test with the agy hook shape).
  - After this ships, the operator runs the C3 write-mode mailbox migration against the advisor-approved dry-run report (rulings 1c/1d: operator-run, never an agent; not a code obligation of this story).
