    6. A is authorized now on fresh main with TASK2345/2346 traces; no production env switch for the test seam. For2346 inspect lock/snapshot semantics before removing the second lookup and preserve native resume/explicit conflicts. B/C/D are separate STRICT-reviewed bounded implementation PRs under this signed contract. Link an actual aida-relay spec/PR before D implementation; main STORY1843 completion requires its verified integration. LIGHT local tests plus fast; area integrations for STRICT, no broad workspace or slot bypass.
