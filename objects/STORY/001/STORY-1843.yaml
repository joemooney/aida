- id: 01a17274-fd06-7551-aa0f-448cff12c511
  author: joe
  content: |
    B SNAPSHOT/API SKETCH v1 (STORY-1843) — codex2; concrete choices awaiting independent advisor review

    Basis: full signed A–E SKETCHv2/comment47 and binding signoff48, latest reader inventory57/routing58, TASK2345/2346 acceptance; source main3cbb90b0c94e0e748bbfc4eb1f75d7f9c2125c68. Approved but unmerged PR2915/5ce0706e4a4deed55d70c756186a94c8bb767763 supplies a pending dependency seam, not main behavior. No source changes, claims, Cargo, live message/queue tests, ACK, install or migration. Canonical spec comment/mail are design handoff only. B does not complete A/C/D/E or TASK2345/2346.

    Problem / smallest boundary
    Pinned witnesses main-empty vs sibling6753f132 (BUG2017) and3c0a6bd8 (TASK2347), plus pool0 missing-store-alias case, establish the missing logical reader. mailbox_cmd::handle_mailbox_command currently derives checkout from store_path.parent(); TUI::resolve_project_root similarly conflates them. MCP::tool_read_inbox merges only its local root and root/.aida-store. Core::read_local_messages and CLI::read_messages_in silently skip malformed files. Fix the composition once in core, with one typed snapshot used by all ordinary readers; retain explicit source-local primitives for writes.

    Proposed core contract (names are new API choices, not implemented symbols)
    `MailboxContext { requested_checkout: CheckoutRoot, repository: VerifiedCommonGit, canonical_store: Option<StoreRoot> }`
    `ResolvedAudience { current_session_binding, exact_private_or_human_keys, explicit_shared_audience_keys, read_mode }`
    `logical_snapshot(context, audience, Query, ReadLimits) -> LogicalSnapshot`
    `prepare_delivered_ack(snapshot, rendered_selection) -> DeliveredAckPlan`
    `commit_delivered_ack(context, freshly_resolved_audience, plan) -> AckOutcome`

    Query is Inbox/ExactId/Thread/Notice/Envelope/Latency, with projection and explicit relevant-ID set where appropriate. Output contains filtered records or ID-only envelopes; per-ID read evidence; source IDs/generations and observation cut; coverage/completeness and typed errors; selected IDs/record fingerprints eligible for a later ACK. Snapshot creation is pure inspection: no files/markers/receipts/cache directories created, no migration, no durable seen state. An empty `records` Vec has NO independent caught-up meaning. `caught_up` is absent/unknown unless the requested source/audience query is complete, and always names its coverage/as-of observation.

    Authority belongs before projection, not in caller rendering
    The shared pure composition seam from TASK2345 accepts verified session/handle, intended known-person and intentional shared-audience facts. Production wrappers retain current registry/native-session/ancestry resolution and inherited-parent filtering from mailbox_root::inbox_identities; no test-only production environment switch. CLI/MCP/TUI pass those resolved facts to the same core policy; an arbitrary --agent string or inherited AIDA_USER is not a private-recipient grant. TUI must use a reusable resolver/composition wrapper rather than keep mail_identity()+raw core reads. Explicit historical/operator inspection remains a separate read-only mode with its existing authority; it cannot implicitly ACK other recipients.
    Receipt keys distinguish private identity, known human and shared role/vendor audience. Use a verified logical UUID where already present, retaining explicit legacy-address scope when ownership is only the existing string contract; never guess an old delivery onto a new UUID from handle spelling alone. Message currently lacks durable UUID/cohort delivery ownership. B must expose that compatibility/unknown state, retain existing authorized shared views and keep receipts separately scoped; it must not claim independent per-member role/cohort delivery is solved. D still owns additive delivery UUID/cohort binding and C1 migration/capability fencing. Ambiguous historical ownership remains inspectable under existing historical mode, not silently ACKable by a newly bound owner. Parent-private aliases are neither shown nor acknowledged; recipient selection precedes metadata/ID/body/error-detail exposure.

    Source inventory / canonical once
    Resolve requested_checkout from invocation cwd/project root BEFORE canonical-store fallback. Resolve StoreRoot independently through existing store_locate behavior; verify both against the same Git-common identity. Missing checkout/.aida-store is ordinary and must not replace the checkout root with main. Source identity includes common-Git identity, worktree admin identity and pinned mailbox directory identity, not just a reused path string.
    Inventory: actual checkout + bounded Git-registered product worktrees of that SAME common repository, plus canonical mailbox once, plus only verified retained sources advertised by C's eventual manifest. No neighboring-directory sweep, different clone/common-dir, role seat repository or arbitrary AIDA_STORE fallback expansion. Exclude canonical store worktree from product-local sources. Deduplicate resolved directory identities/aliases; read the canonical mailbox exactly once even when every worktree has an alias to it. Registered prunable/missing/identity-mismatched roots are coverage errors, not silently absent. A present product root with no .aida/mailbox is a successfully observed absent local source.
    Use bounded `git worktree list --porcelain -z` with a Result-returning parser, not git_ops::list_worktree_paths's current failure→empty behavior. Validate candidates against the expected common identity and pin .aida/mailbox ancestors; bounded owned regular-file/no-follow IO extends the reviewed mailbox_wake helpers. User-visible errors are source-scoped safe codes, not another recipient's filenames/body/handle catalog. Unknown clone identity refuses.

    Snapshot/read and reconciliation algorithm
    1. Resolve audience once; enumerate/pin sources and capture inventory/source generations. Read each local source and the single canonical source with shared aggregate limits. Materialize one in-memory per-source table; do not merge canonical into each local source and then infer watermark coverage from the merged table.
    2. Retain `(message ID, source ID, local-vs-canonical, raw record fingerprint)` provenance. Validate schema/ID and reconcile once by immutable ID. Reuse mailbox::message_state_rank (deleted3/archive2/retract1/ordinary0), canonical equal-rank preference only for otherwise identical payloads, and existing timestamp/ID order. Deleted markers suppress replicas; retracted records retain normal redaction. Same-ID immutable payload/audience/ownership disagreement, or contradictory marker evidence that cannot be resolved under existing state rules, is a conflict with no body/ACK eligibility, not an arbitrary sibling winner. Thread membership is reconciled first, then audience-filtered; possession of one thread ID never exposes every private thread member.
    3. Compute visible/interest IDs after current recipient filtering. For those IDs, read exact per-source receipt files directly (`.read-receipts/<identity>/<id>.txt`) and the same-recipient common anchor. This avoids scanning1107 historical receipt entries merely to answer a small inbox/envelope query. A Latency/history query can request a larger bounded ID set; unknown ACK time remains unknown.
    4. Import legacy evidence additively in memory, with the approved PR2915 LOCAL rule: watermark S applies only to eligible IDs physically observed in S's LOCAL table before canonical/other-source merge, for the SAME exact recipient/audience; explicit receipts are ID-scoped. Never apply max watermark to the union. Unknown sibling-private IDs and canonical-only late arrivals remain unread even when older. Legacy coverage is compatibility evidence, not an invented exact read timestamp. Where historical ownership/coverage cannot be established, report unknown/unread rather than manufacture proof.
    5. New receipt publication freezes legacy covered-ID sets/source evidence when an explicit ACK imports them; later old-timestamp arrivals are not covered merely by the old watermark. If an unfenced old writer later changes a legacy watermark without ID coverage, expose unresolved evidence rather than extending the imported set automatically. Mixed-writer/C3 handling remains signed C/D, not a silent B migration. Ordinary new B reads never advance timestamp watermarks.
    6. Recheck source/inventory identities and observation manifests before declaring this scan complete. A changed/unreadable source returns partial/changed coverage with no ACK eligibility. Snapshot is a captured delivered selection with a bounded stable observation cut, not a global write transaction. Later arrivals are handled by the next snapshot.

    Delivered-snapshot ACK / concurrent arrival
    prepare_delivered_ack accepts only a subset of IDs actually selected for full delivery by THIS complete snapshot and permitted audience; notice/ID-only wake/summary and read-only audit projections cannot produce such a plan. No full-inbox-newest advancement. Plan carries exact recipient/audience key, IDs, record fingerprints, source evidence and lifecycle generation. A concurrent arrival after capture is absent from the plan, including an older-timestamp arrival.
    CLI serializes/writes/flushes the selected body response successfully before committing its plan; EPIPE/failed output means no ACK. This intentionally replaces mailbox_cmd's BUG1482 pre-output/full-inbox marking under the newer signed B successfully-returned-ID rule; update that regression explicitly, do not silently preserve contradictory behavior. MCP default remains peek; explicit mark_seen stages only its shown response IDs, with a prepared-response post-successful-stdout-flush commit in run_mcp_server (currently8706–8709). Never mark inside tool_read_inbox before serialization. Response describes ack_requested, not committed-before-output; a commit error is surfaced through the existing server diagnostic/failure path and retry is idempotent. Transport flush is the measurable return boundary, not proof the human/model consumed the body. A future explicit client-confirmation protocol is unnecessary for B.
    At commit, reacquire only the short receipt lock, re-resolve current authority/generation, validate selected ID content/marker state and source identity, and refuse if retirement/ownership/conflict evidence changed. A new unrelated message does not expand the plan or invalidate already delivered IDs merely by changing directory mtime. If any source became unreadable/retired without verified retention, refuse rather than silently completing a partial ACK. New tombstone state never resurrects a body or acknowledges another ownership generation.
    Publish an atomic idempotent exact-ID receipt union under the signed private common-Git anchor, scoped to recipient/audience. Include legacy origin/coverage and unknown latency separately. One bounded per-recipient ledger or equivalent existing helper can serialize this set; no blind age pruning. One publication avoids a multi-root partial ACK transaction; existing source receipts remain read inputs. If publication fails, report ACK failure and retain source evidence. New shared receipts survive source-copy removal; legacy-only evidence still requires C's verified preservation before retirement. No receipt cleanup is authorized here.

    Cache/miss/latency contract
    First implementation needs no persistent inbox cache: one core scan, one canonical read, per-request memoized parsed records, exact-ID receipt lookups. Long-lived MCP/TUI may reuse parsed immutable bytes by pinned source identity+record fingerprint, but must refresh the source inventory/directory and relevant receipt/authority generations on every complete query. Cached absence/mtime alone cannot prove a fresh empty inbox, and errors never cache as empty. A cold miss runs bounded IO and returns incomplete if it cannot finish; no background refresh process. Exact-ID reads may prioritize deterministic files across discovered sources, but not-found is conclusive only after complete authorized coverage. ID-only watcher adapter consumes this same core snapshot rather than its permanent Python per-root union.
    ReadLimits is an absolute shared deadline/byte/entry/root budget, not N independent per-source timers: propose512roots,1MiB/message,32MiB aggregate message/receipt bytes and bounded recipient/ID lengths; validate against current reviewed helpers. Passive notice/status use their existing short caller deadline; explicit reads use a bounded foreground profile (proposal2s), watcher retains its separately reviewed caller budget. Entry/IO/receipt work checks the remaining deadline. Limits produce partial/over-budget, never zero-unread success. Do not infer stable cold/idle performance from warm cache. Known slow main receipt scans remain a conformance shape; safe exact-ID evidence lookup is the concrete reduction, not a timeout increase.

    Partial / deleted roots / write intent
    Snapshot coverage/errors are first-class: CLI renders partial/unknown and returns an actionable non-success for strict inbox/ACK; MCP returns structured completeness/error; TUI paints available authorized rows plus an incomplete badge; notice/status/watcher never equate unknown with no pending mail or advance receipt/notification state on it. Pending ACK plans require complete source/receipt coverage. Permission/corrupt/FIFO/hardlink/symlink/unknown-format cases refuse safe completeness.
    B can prove coverage of currently inventoried and verified retained sources only. It cannot rediscover mail already lost with a deleted/unregistered worktree; expose retention coverage as unestablished until signed C and do not claim repository-history-wide caught-up/completion. A source known from inventory but gone is an error. C owns retention manifests, writer fencing and removal/reset/reuse barriers; B neither manufactures retention nor auto-digests mail publicly to make deletion pass.
    Keep `read_local_messages`, strict canonical readers and explicit source snapshots for mailbox_store::digest_snapshot_to_canonical/write_snapshot_locked, archive/retract/delete/migration, store_push_pull::mailbox_publish_snapshot and digest paths637/710, and lifecycle/removal decisions. Querying globally is not write authorization: a future archive/retract command must retain its selected source/canonical target and existing locks. No mechanical all-local-read replacement, implicit push, migration or cleanup. Source-local mutation snapshots are a distinct type and cannot accept LogicalSnapshot as their writer input.

    Caller/lock inventory and bounded PR slices
    Core owns mailbox/logical snapshot/projection/receipt primitives; mailbox.rs existing local writers/read helpers stay explicit. CLI glue in mailbox_store/root/cmd passes actual checkout context. Wire read/thread/inbox/notice/summary/latency; MCP tool_read_inbox plus reply/thread resolution2799/2831; mailbox_root::mailbox_latency_warning; lib_part3 notice/status; status_awaiting803; agent_launch4174/4672; lane_liveness1449; maintenance_schedule2848; TUI redesign/mail::fetch_mail_items/resolve_project_root. Adapt approved pending mailbox_wake::snapshot and Python scan only after its dependency lands, preserving ID-only transport and notification-vs-ACK distinction. Audit direct/indirect callers, not just lexical matches.
    No source/store lock held during discovery/body output. Snapshot is lock-free pinned read; ACK takes private receipt lock only after delivery and current authority validation, never acquiring lifecycle/store locks from inside it. C's lifecycle-before-receipt boundary must be accommodated by a held-lock helper and refuse unsupported retired generations; canonical writer locks remain on explicit source-local publication. Before B/C implementation, complete the signed REST/writer/destructive-entry and lock-order inventory; this reader sketch does not claim that inventory finished.
    A remains required first: TASK2345 pure identity fixture seam, TASK2346 lock/snapshot-justified redundant lookup cleanup. Suggested B1 core/context+snapshot/conformance; B2 all ordinary reader adapters+explicit ACK+common receipts; both non-completing Refs STORY1843 and independently STRICT reviewed. A B1 helper alone is not B acceptance. C/D/E unchanged, relay STORY122 remains required.

    One shared decisive conformance fixture
    `story1843_logical_inbox_conformance`: one temp common-Git repo, main, siblingA/B, detached pooled checkout with NO store alias, one canonical store; unrelated clone; exact synthetic recipient bindings, parent/child, known human and two shared-audience readers. Seed ONE sibling-only message equivalent to6753f132/3c0a6bd8 and run the same expected snapshot through CLI inbox/exact/read/thread/notice, MCP peek+explicitmark_seen/stdioflush, status/awaiting/launch/maintenance/liveness and TUI/core. Instrument the storage reader to assert canonical read exactly once. No real recipients/queues/vendors.
    Cases: missing store alias still finds local; main ACK suppresses same-ID stale sibling replica; unknown older sibling-private/canonical-only message stays unread; arrival after delivered snapshot remains unread; broken output/serialization or ACK publication failure records no success; inherited AIDA_USER cannot reveal/ACK parent; normal child/human/shared and native resume retained; private thread filtering; tombstone/rank and same-ID divergence; corrupt/FIFO/hardlink/source replacement and cold deadline produce truthful incomplete; receipt-target lookup avoids full historical directory scan; moved/new worktree invalidates negative cache; source-root removal without C retention stays unknown/error, verified synthetic retained manifest preserves receipt without resurrection; different common repository excluded. Shared legacy-role behavior must be labeled, not mistaken for D's per-UUID cohort acceptance. Use deterministic injected IO/deadline/barriers plus child watchdog and one read-only-driver integration, no fragile unexplained wall assertion.

    Advisor review requested on the concrete core types/context, legacy coverage freeze vs unfenced watermark change, post-flush delivery boundary overriding BUG1482, receipt-anchor publication and proposed bounded read profiles. Full A–E scope is already signed; these API choices are proposals, not approval or a narrowed acceptance contract. No implementation/completion claim.
