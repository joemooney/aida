- id: 01a17175-9958-78c0-a9de-e18ac94ece00
  author: codex2
  content: |
    SKETCH v2 (STORY-1843 PR4 + shared inbox/preservation) — codex2

    Design-only inventory, authored by codex2. This is a proposal for independent advisor signoff, not approval or implementation. No claim, source changes, migration, grant/containment change, new service or completion. PR2915 F1/F2 delta review remains my first priority when a new head arrives.

    Basis: STORY-1843 full description and all 47 current comments, original SKETCH v1/SIGNOFF 10:35, PR1 boundary ruling, C3/old-writer rulings 21:40 and completion audit 12:27, UCAMI routing/adoption comments, TASK-2345/2346 including their proxy decisions, UCAMI review draft. Sources inspected: AIDA main 94124569c9b14617a4049909ddbefad5b82a846d; aida-relay 2a200901b30e92ffc98ff9b63be7b7128904f799. PR2915 is still 91071afddc41add0e43d29a9cfb463a36cd97f50 at this checkpoint; its watcher API is a pending dependency, not shipped main behavior.

    Problem and current implementation limits

    The handles/reservations now carry recipient UUIDs, but Message still addresses identity strings and does not persist the signed per-UUID delivery/cohort ownership. mailbox_store.rs reads local and canonical layers; CLI, MCP and notification readers assemble their own views. Local receipts/watermarks do not constitute one cross-worktree inbox. A main read can miss a sibling-private message, and deleting/reusing that sibling can lose the message or its receipt evidence. A role/vendor watermark still has shared-reader semantics; it cannot silently become private per-UUID acknowledgement.

    relay.sh owns the run and child rotation. Its existing run lock, AIDA_RELAY_RUN, best-effort driver registration and launch record do not establish durable AIDA recipient ownership. Driver capabilities describe telemetry/context, not proven mail delivery/idle wake. The relay's undelivered operator-addenda handling is a different policy from the signed AIDA end-of-run mail notices; do not conflate them.

    Proposed bounded slices, in dependency order

    A. TASK-2345 / TASK-2346, a small independent preparation PR.
    - TASK-2345: extract a pure inbox-identity composition function taking resolved session/handle and intentional human/shared audiences. Production wrapper retains actual ancestry/registry resolution; tests inject those inputs. Do not add a production environment switch or weaken inherited-parent filtering.
    - TASK-2346: remove the redundant second native-session lookup in agent_handle::decide after verifying the allocator's lock/snapshot assumptions. A missing binding at the first lookup is not a proof that a second lookup could never observe an external mutation; demonstrate the intended single allocation decision, rather than justify removal solely by a control-flow slogan. Keep explicit-name conflicts and native-session resume unchanged.
    - Files: aida-cli-lib/src/mailbox_root.rs, agent_handle.rs, tests/bug_231_findings_promote_tests.rs and existing handle/mailbox privacy tests. Cases: no vendor ancestry, injected child binding, inherited parent AIDA_USER/AIDA_AGENT_NAME/handle aliases, human/role/vendor audiences, same-session resume, explicit collision and absent native binding. No model launches needed.

    B. One same-recipient logical-inbox/read API; no UUID migration in this slice.
    - Put root discovery, message reconciliation and receipt interpretation behind one mailbox-store API, with reusable storage primitives in aida-core. Inputs are verified common-Git identity plus a resolved audience, never arbitrary caller-supplied filesystem roots. Include canonical mailbox, registered sibling-local roots and retained local roots belonging to that repository. Do not sweep neighboring projects, arbitrary seat clones or unverified paths.
    - A snapshot returns bounded messages/IDs, acknowledgement evidence, source identity/generation and completeness/errors. Filter to the existing authorized logical recipient/audiences before exposing metadata. Worktree location is a source, not another recipient. Preserve explicit historical/operator read-only inspection separately.
    - Deduplicate immutable message IDs through existing Message state/tombstone reconciliation. Refuse ambiguous ownership or divergent same-ID content on acknowledgement/preservation; do not select an arbitrary body. Retain current tolerant display only with an explicit incomplete diagnostic. Incomplete/over-budget snapshots cannot assert empty/unread-zero, advance acknowledgements or authorize destructive cleanup.
    - Union explicit read IDs only for the same recipient. A watermark covers IDs known in that source's local snapshot, never an unknown sibling-private or late canonical message solely because its timestamp is older. Adopt PR2915's final LOCAL watermark rule once landed. Notices/status/statusline/wake snapshots never acknowledge. Explicit read commits receipts only for IDs actually returned successfully; later arrivals stay unread.
    - Persist exact-ID receipt evidence in a private common-Git-dir anchor so source-root deletion cannot resurrect acknowledged replicas. Existing local receipt formats remain inputs; their import is additive and identity-scoped. No age-based blind purge. Compaction requires proof that affected source copies/generations are retired; otherwise retain evidence.
    - Files: aida-core/src/mailbox.rs plus proposed mailbox/logical.rs; aida-cli-lib/src/mailbox_store.rs, mailbox_root.rs, mailbox_cmd.rs, mailbox_latency.rs, status_awaiting.rs, mcp.rs (tool_read_inbox), statusline readers, and mailbox_wake.rs after PR2915 lands. scripts/codex-mail-wake.py becomes a consumer of the shared snapshot, not the permanent second resolver. Inventory all callers of read_local_messages/read_canonical_messages/read_receipts before merging.

    C. Fail-closed mailbox preservation on AIDA-managed worktree retirement/reuse.
    - Introduce a core retirement barrier shared by mail writers and worktree removal/reset. Proposed private anchor: <common-git-dir>/aida/mailbox-retained/, containing original message files, receipt evidence and a versioned recovery manifest. It reuses AIDA Message semantics and the shared reader; it is retained local storage, not a new network transport or public store destination.
    - Acquire repository lifecycle lock, resolve/pin source and destination identities, fence new writes, strictly preserve all messages/tombstones/receipt evidence, durably commit retention, then allow removal/pool reset. All cooperating send writers take the same boundary and re-resolve after a fence. Use a documented lock order: lifecycle before mailbox snapshot/receipt locks; any explicit canonical publication also obeys the existing store-writer lock. Avoid reverse acquisition in readers/sync.
    - Prefer same-filesystem rename into retained storage plus durable recovery journal. An already-open old directory descriptor is not automatically a safe writer fence: admitted writers must be quiesced or their writes remain captured at the retained location and validated before success. Cross-device preservation requires quiescence, complete verified copy, durable commit and final generation check. Unsupported/in-flight legacy writers, corrupt or unreadable mail, identity/path changes, unavailable destination or inability to prove preservation refuse removal. Leave the worktree and recovery evidence intact.
    - Do not invoke mailbox sync/push as an implicit cleanup side effect. Local private retention must not publish work mail to PUBLIC aida-store or bypass STORY-1742 transport/sanitization policy. If allowed retention cannot complete, refuse; transport refusal is not permission to delete. Preserve unread/history; retention is not acknowledgement, archival or handover.
    - Require this barrier before both deletion and pool reuse, and before releasing the state needed for recovery. Current session_end cleanup can continue after removal merely warns; mail refusal must not fall through that path and discard recovery ownership. Existing dirty/active-process/hold safeguards remain additional checks.
    - Exact inventory: aida-core/src/mailbox.rs::write_local_message (also REST writer), proposed mailbox/retirement.rs, git_ops.rs::remove_worktree_at/reset_worktree_to, worktree_pool.rs acquisition/reset/return/destroy; aida-cli-lib/src/session_end.rs, session_start.rs rollback, worktree_gc.rs, worktree_dismiss.rs, compete_cmd.rs, doctor_cmd.rs and dispatch.rs reviewer cleanup (including PR2913 when landed). Replace direct Git-removal bypasses with the shared guarded entry point. Inspect clone cleanup separately; unverified seat clones must refuse, not borrow another repository's anchor. Store-worktree removal is distinct and must not be accidentally enrolled as a product mailbox.
    - Scope limit: AIDA-managed retirement and admitted writers. Raw external git/rm, disk loss and hostile same-UID writes cannot be guaranteed by this barrier; document that boundary rather than claim universal preservation.

    D. Additive delivery ownership and relay lifetime protocol across AIDA + aida-relay.
    - Persist immutable recipient UUID/delivery ID, run UUID and explicit role cohort metadata without changing original message IDs, to/from, thread links, tombstones or historical receipts. Migrate no ambiguous legacy ownership by inference. Independent per-UUID receipts are required before claiming C1 completion: snapshot live role/vendor readers at send, print the same names, zero refuses by default; explicit queue-for-role is assigned once to the first eligible recipient. Historical unresolved addresses remain readable forever per C3.
    - One project/run UUID owns the relay label across child rotations and gaps. Controller record binds private common-root namespace reservation to supported PID/start/boot/liveness evidence and run-lock ownership. Native child/session bindings reference that UUID; shared daemon PID, label spelling or inherited environment alone never grant inbox ownership. Existing BUG-2212 liveness is reused. A paused/waiting controller remains accepting; absence of a child is not terminal end. Unobservable identity/liveness is unknown and cannot silently retire or transfer the recipient.
    - Register durably before advertising addressability; child bind/start/handoff must resolve persisted ownership. Both send admission and end/ack decisions serialize on the same recipient lifecycle generation. EXIT/TERM traps are useful fast paths, not crash recovery: existing send/start/maintenance reconciliation detects a conclusively ended controller, records terminal generation once and closes admission. No new daemon/service or grants.
    - Terminal end/stop/crash retains unread original deliveries with the old run. Durable notice outbox has deterministic key (run UUID, terminal generation, original delivery, destination UUID). Notify each sender and advisor once logically, deduplicate coincident destinations, never bounce a bounce. Avoid quoting private bodies or unrelated recipient details into advisor/shared notices. Crash/retry must not create new logical notice IDs. Failed/unavailable sender/advisor delivery stays visibly pending and retryable; ordinary dead-handle/zero-role refusals are not bypassed. Existing maintenance can retry; no model polling.
    - Exactly-once here means durable logical outbox insertion/reconciliation, not an unproven exactly-once native queue delivery. Runtime acceptance, actual notice, explicit inbox read and completed work remain separate facts.
    - Label reuse under namespace lock reports exact old-run unread count. Headless new runs require explicit leave-with-old or handover choice when unread exists. Handover creates provenance-linked deliveries for the new UUID, retaining originals/receipts/end notices; it is not renaming, silent transfer or auto-ack. Same-run resume validates its private run/session binding and is distinct from label reuse.
    - Files: aida-cli-lib/src/agent_handle.rs, agent_registry.rs, mailbox_resolver.rs, mailbox_store.rs; proposed relay_mail.rs/relay_mail_args.rs and command wiring; relay_launch.rs only for durable run linkage; relay_stall.rs only existing maintenance reconciliation. aida-relay/bin/relay.sh run setup/lock, SESSION_ENV, driver registration, child launch, handoff and terminal traps; src/driver.rs, src/profile.rs and src/bin/relay_usage.rs for a closed capability probe; docs/architecture/relay-design.md and AIDA docs/cli/06-roles-sessions.md.
    - Negotiate explicit versioned mail-lifetime capabilities, not version-string guesses or best-effort driver registration. Addressable mode fails before reservation/launch if locking, private binding, preservation or lifecycle protocol is unsupported. Any compatibility mode must explicitly say unaddressable and cannot satisfy PR4. C3 manifests/admission barrier must fence old CLI/MCP/REST/in-flight writers before new ownership becomes authoritative. No agent runs the write migration; operator-approved report SHA/input/backup/idempotency rules remain unchanged.

    E. Final conformance/integration, with a separate independent STRICT review.
    - Tests proposed: aida-core/src/mailbox/logical_tests.rs and retirement_tests.rs; aida-cli-lib/src/tests/story_1843_shared_inbox_tests.rs, story_1843_mail_preservation_tests.rs, story_1843_relay_lifetime_tests.rs; aida-cli/tests/story_1843_relay_conformance.rs. Wire each test module explicitly; do not leave uncompiled fixture files. Extend existing TASK-1717 store-writer tests and PR2915 snapshot/ledger fixtures.
    - Cross-root cases: read in main suppresses stale sibling replica; unknown old private mail and late canonical arrival remain unread; receipt survives removed source root; same-ID divergence/tombstone precedence; partial/corrupt/FIFO/symlink/hardlink/over-budget sources fail closed; cross-project isolation; parent-private alias isolation plus normal child/shared/human delivery and resume.
    - Retirement cases: send/read racing fence; live old writer; crash before/after every retention commit step; generation/path replacement; permissions/full disk/cross-device refusal; pool reset/reuse cannot expose prior occupant's private mail; denied public transport leaves mail retained or worktree intact. Test every destructive caller, not only the new helper.
    - Relay shell fixture proposed tests/shell/story1843_relay_mail_lifetime.sh; extend story106_agent_launch.sh, bug84_run_lock.sh, bug94_label_exact.sh, bug90_driver_register.sh and bug2153_session_env_scrub.sh. Use stub vendors, no Claude execution. Cases: two rotations share UUID, gap delivery, paused controller, kill9/PID reuse/unknown namespace, simultaneous send/end/read, crash/replayed notice insertion, undeliverable notice remains pending, no bounce loops, exact reuse count/headless choice, explicit handover vs resume, mixed versions/capability refusal. Preserve bug101 operator-addenda policy as distinct.
    - Capability contract is small: exact logical/native target, supported next-turn notification, proven acceptance, timeout/payload limits, resume/generation behavior and explicit unsupported states. Retain existing hook behavior; TASK-2347 remains one Codex adapter. Agy session-peer, active-context injection, Claude Mods/event.injectContext and universal idle wake are not established capabilities. Require separately scoped evidence before adding another adapter; do not invent a general broker here.

    PR slicing and signoff questions

    A is separate TASK-2345/2346 preparation; B, C and D should each be reviewable incremental PR4 sub-slices from fresh main, followed by E completing the parent only when all signed lifetime/C1 obligations are actually met. Every interim title uses (Refs STORY-1843); only the final accepted completion uses (STORY-1843). Relay repo needs its own linked implementation spec/PR, coordinated by capability compatibility; this comment creates neither. No live migration is a prerequisite performed by an agent.

    Advisor decisions requested: (1) sign this dependency order and private common-Git retention/receipt anchor, or select an existing equivalent; (2) confirm mixed/unknown writer capability means refusal of destructive retirement, rather than a best-effort flush; (3) confirm end-notice outbox may remain pending when sender/advisor has no valid delivery audience, with visible recovery, instead of weakening ordinary recipient privacy rules. These are design questions for the independent advisor, not an approval by codex2.
