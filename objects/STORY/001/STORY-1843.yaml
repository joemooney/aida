  author: joe
  content: |
    STORY-1843 B/C REQUIRED WRITER + DESTRUCTIVE-ENTRY + HELD-LOCK INVENTORY — codex2
    Read-only source assessment, main3cbb90b0c94e0e748bbfc4eb1f75d7f9c2125c68. Read the current B binding signoff /tmp/advisor-story1843-B-signoff.txt. This records inspected callchains and remaining implementation decisions, not implementation/completion/authority. No source changes, Cargo, claim/grant changes, live message/queue tests, ACK/install/migration. A2345/46 and full C-D-E remain required. ReadyBUG2222/explicitly routed2919 new-head review preempts further preparation.

    1. Actual current lowest writer boundaries
    - aida-core/src/mailbox.rs::write_local_message1154: mailbox_dir_guard1091 → create_dir_all → write_atomic of `<checkout>/.aida/mailbox/<id>.json`. This is the shared local file mutation seam, including state markers; it has NO repository lifecycle, recipient ownership, namespace or receipt lock. Existing guard follows directory symlinks and refuses layout-manifest/non-directory paths; it is not the new private-anchor safe IO/fence. Public callers can bypass CLI validation. Atomic rename avoids torn JSON, not send/retire/ownership races.
    - CLI mailbox_store::write_message49 delegates that exact core function; write_message_marker171 delegates write_message. `write_message_in36` is a SEPARATE private canonical writer, reached by write_snapshot_locked149. Adding a fence only to CLI send/write_message misses canonical publication and direct REST/core.
    - Existing receipts: mailbox_store::record_seen226 writes per-ID files; set_watermark197 reads/maxes timestamp and writes .txt/.seen. No shared recipient lock, no atomic all-ID publication or lifecycle validation. Those writes and core::read_local_watermark are a separate boundary from message JSON. B's shared receipt anchor is not present in main.
    - mailbox_migration::report224 is a snapshot/dry-run reader. Current CLI rejects non-dry-run migration. There is no live migration writer to enroll or execute now; C3 activation must gate future migration mutators separately.

    2. Local writer entry chains / locks actually held
    - mailbox_cmd::handle_mailbox_command63: Send285 → write_message; Retract642/Delete666/Archive718 → write_message_marker; archive_phantom_inboxes_for888 copies945 and marks959; archive_mailbox_older_than966 marks1012. Inbox473/474 still calls record_seen/set_watermark before output (B binding explicitly supersedes BUG1482). None of these functions acquires a mail lifecycle or receipt lock. RecipientDirectory::load/resolve and local/canonical prechecks occur BEFORE the write without a shared send/end transaction.
    - MCP::handle_request1021 first calls agent_registry::touch_mcp_agent, which can allocate/bind via agent_handle::ensure_registry_handle/reserve_handle and its namespace lock; it RETURNS before tool dispatch. tool_send_message~2770–2873 resolves recipient/thread/second-person policy then write_message(self.project_root); no long-lived registry/store lock in that tool body. tool_read_inbox2986/2988 performs receipt/watermark writes early. Future post-flush plans must be per RESPONSE, not ambient server state. Do not invoke handle_request/touch_mcp_agent as an ACK revalidation callback under receipt lock: that path writes registry/handles.
    - REST rest.rs::set_assignee_impl1066 obtains `state.store.write().await`, saves the requirement, then EXPLICITLY drop(store)~1103; queue_add returns before send_assignment_notification1162 → core::write_local_message1192. Thus the inspected REST notification holds neither that Tokio store guard nor the backend's completed queue transaction. It currently derives project_dir from store_root.parent and bypasses live recipient resolution. A C-admitted core writer must protect it; a CLI-only migration/fence cannot. Failure is currently best-effort warning, not delivery success.
    - assign_cmd::handle_assign_command updates backend and completes storage.queue_add before punt_done::send_notification187 → write_message228. comment_cmd persists backend.update_requirement~493 before mention resolution and send_notification522. No store transaction remains held by these inspected bodies when notifying. Preserve best-effort trigger semantics while refusing an unsafe mail write; do not roll back a successfully saved requirement by inventing a mail transaction.
    - Other production local writers all reach the SAME core seam: seat_occupancy/cmd::notify_holder358; dispatch::notify_advisor_outcome1959; supervise_cmd::send_advisor_nudge332; terminal_cmd::send_mail_notice591; session_reap::notify_finished_live_sessions1775; disk_emergency::mail_holder1327. Each needs lifecycle admission, even “system” messages. Their bodies add no mailbox lock.
      Actual enclosing-lock exceptions matter: seat_occupancy::run_takeover explicitly drops SeatGuard at step block~239 BEFORE notify_holder253/waiting. dispatch::finalize_request3124 HOLDS tick.lock through notify_advisor_outcome3137; reconcile/tick notification paths likewise run under their declared dispatcher lock. disk_emergency::run path1442 holds disk-emergency.lock while reclaim callback1482 calls mail_holder. These outer scopes cannot be reacquired from a future lifecycle/receipt helper. Ordinary supervise/terminal/reap functions hold no new local flock in the inspected write body; caller-owned SeatPermit/drain orchestration can still enclose them. This is not a claim that every application-wide invocation is globally lock-free.

    3. Canonical/source-local publication, distinct from a global inbox
    - mailbox_store::digest_snapshot_to_canonical144 calls db::with_store_write_lock → write_snapshot_locked149 → strict canonical re-read → rank comparison → write_message_in. Store lock is already held at each canonical file write.
    - store_push_pull::digest_mailbox_to_canonical633 reads SOURCE-LOCAL messages before acquiring the store lock638; canonical compare/write/stage/commit run inside it. `mailbox sync` and maybe_digest_mailbox(session/drain end) use this helper. No lifecycle admission exists.
    - push/pull take mailbox_publish_snapshot702 BEFORE outer with_store_write_lock at1601/2807; publish_mailbox_snapshot728 runs INSIDE that transaction and re-enters digest's store lock on the SAME thread/root. db/store_lock::acquire132 uses thread-local HELD counts, so this recursion is intentional; it does not make a different lock re-entrant. The store lock also asserts no blocks/dispense lock is held first (A1). Do not introduce Store→Lifecycle by adding an unconditional lifecycle acquisition inside write_message_in/digest.
    - These snapshots own explicit local/canonical write intent. Replacing their read_local_messages with logical union would publish sibling-private mail and potentially PUBLIC transport. B global snapshots cannot be accepted by these writer methods as interchangeable input. No C preservation implies sync/push. STORY1742 policy/writer ownership still applies to intentional publication.

    4. Destructive entry chains / current held locks and bypasses
    Core reset/remove primitives currently have NO mail preservation/fence:
    - git_ops::reset_worktree_to3696 performs checkout--detach--force, reset--hard, clean-fd. Ignored .aida mail can SURVIVE and cross pool occupants; retention is needed for reuse/privacy even when clean-fd does not delete it.
    - git_ops::remove_worktree_at4290 performs scoped git worktree remove, no repo-wide prune. remove_store_worktree3254 is a distinct public canonical-store removal path; do not treat its mailbox as a product-local source or lose canonical mail. It needs an explicit canonical-source preservation decision, not accidental exemption.
    Pool callchains:
    - worktree_pool::with_state_lock334 owns pool.lock across read/heal, ENTIRE closure and write_state. acquire515 → closure522 → reset_worktree_to607 while pool.lock HELD; return_to_pool776 → closure780 → salvage → reset807 while pool.lock HELD. No separate source lifecycle generation exists. acquire failure cleanup673 runs AFTER with_state_lock has returned, so that remove has NO pool lock; it does retain owned .git marker/holder checks.
    - worktree_pool_destroy::destroy181 → with_state_lock196 → salvage callback/pre_destroy hooks → remove_worktree_at265, all under pool.lock. Conversely teardown_worktree_path306 checks holders/clone type, runs hooks, removes331 WITHOUT pool.lock; only afterward takes pool.lock336 to remove the registry entry. Blindly imposing Lifecycle→Pool at the lowest remove would invert the first path, while taking Pool from inside Lifecycle would invert the second if both coexist.
    - integrate_checkout::ensure_integrator_checkout53 directly reset_worktree_to62 for a reused integrator tree, outside pool.lock; caller contract is the outer drain authority/guard. New acquire uses pool.acquire. Reuse must not bypass mail preservation merely because one integrator owns it.
    CLI automatic/manual paths bypassing core removal:
    - session_end::handle_session_end: seat clone→seat_clone::destroy, pool→return_to_pool1856, otherwise raw git remove1875. The function deletes lease state before removal and on refusal merely warns, then coordination::release_claim and manifest/activity cleanup still run (explicit comment1915–1932). C refusal must happen BEFORE losing this recovery/ownership state; a failed mail barrier cannot flow through the current best-effort end cleanup.
    - session_start::SetupGuard rollback/remove_owned_tree~1280–1368: owns identity/holder checks, then clone remove_dir_all1330 + pin release, pool return1345, or raw git remove1349. Also acquire_reusable_worktree error return1167. Handle/claim guards represent OWNED tokens, not a continuously held namespace flock. Setup failure is not proof no mail arrived; guard cleanup needs the same C barrier before resource/pin/claim release.
    - leases::force_cleanup_lease3015: holder check, clone destroy route; linked tree path strips runtime aliases and revokes child grant/removes lease+manifest/activity BEFORE raw git remove~3146. Grant update lock is released by revoke call, not held through remove. This is a concrete early-release gap for C; preserve recovery ownership on mail refusal. Doctor/heal/pickup/review stale-release/escalation callers reuse this function.
    - session_reap::reap_one linked path→teardown_worktree_path1211, clone path→destroy_with_shipped1397; release_lease_files must follow successful preservation/removal, not a mail-failed attempt. doctor_cmd healing paths6766/8178 use teardown;7966 uses force_cleanup_lease.
    - worktree_gc::handle_worktree_gc raw non-force git remove~355; worktree_dismiss::handle_dismiss raw force remove117 then branch/ledger cleanup; clone dismiss uses seat_clone::destroy. Both need source preservation before irreversible steps, not a warning afterward.
    - compete_cmd cleanup raw git removes691/879 and prune714/883; must not remove/prune a mail source because an arm is finished. phase_driver::teardown_failed_attempt_worktree2481→remove_worktree_at2565 then lease release; keep failed-attempt ownership if C refuses. auto_complete supplies the pure recovery teardown decision; physical removal is in phase_driver, not a separate mail-safe remover.
    - dispatch::cleanup_dead_reviewer_worktree3658 preserves review HOLD first, then raw remove/prune and branch deletion; run_review_verb3736 calls it after worker claim setup, OUTSIDE the bounded tick-lock claim block (execute_one_request_with_token2523). Claim fencing remains required; preserve-hold is not preserve-mail. finalize_request notification is a separate tick-held writer path above. prepare_lane_worktree3849 can checkout-B an EXISTING worktree3893; that is a reuse/identity boundary, not only an add path, and needs C treatment before reassignment.
    Independent clone paths:
    - seat_clone::destroy_with_shipped1577 does verified sandbox probe/HEAD+holder checks/salvage, then remove_dir_all1651, cargo-target cleanup and pin release. No mailbox retention or serialization with writers. cleanup_failed_clone429 and CreatedClone Drop~586 also remove newly created clones; ownership marker checks do not prove mail absence.
    - A private seat clone has a DIFFERENT Git common dir. B's ordinary same-common discovery must NOT silently sweep it. C must define retention using verified host_recorded_clone/main provenance and an explicit retained-source binding, or refuse destruction when that binding/preservation cannot be proved. An unverified clone never borrows main's anchor. Current salvage patches protect code, not ignored private mailbox/receipt bytes.
    Development-only shell helpers scripts/split-lib/verify_stack.py:377 and multi-clone-harness.sh:247 remove/reset their disposable fixtures; they are not a production entry-point fence. Test cleanup/source-cache/cargo-target removals are not by themselves product mailbox removal. Opaque pre_destroy/post_create hooks ARE an explicit unverified mutator surface: current pool callbacks execute under pool.lock and can launch arbitrary commands. Do not assert a complete acyclic lock graph or safe writer capability from hook strings/version names.

    5. Authority / namespace / seat dependencies actually inspected
    - gate/seat_authority::grant_check_for_at~986 → read_grant_checked633, lifetime/principal/parent checks, check_roster622 → roster_allows305 → roster_store290 + core TeamRoster::load. These are record/filesystem/process checks; they DO NOT acquire grant-update, occupancy, namespace or backend store-write locks. roster resolution reads the project's own store, not an AIDA_STORE authority redirect. In contrast update_grant~115 takes the per-grant session-grant-locks/<id>.lock exclusive lock for mutation/revoke/stamps, and drops before its verification reread. Never invoke an authority mutator to refresh an ACK.
    - agent_handle::current_session_entry_for_cwd1213/current_session_entry_for/current_session_handle_for_cwd1207 and mailbox_resolver::RecipientDirectory::load87 read process/registry/reservation facts; no namespace allocation lock is acquired by those read lookups. agent_handle::reserve_handle565/bind/release/collect_retired_reservations965 acquire namespace .lock (bounded try-lock); registry touch/ensure can enter reserve. Do not substitute touch/register/reserve for a pure reader under receipt.
    - seat_occupancy/runtime::authorize_with_caller177→SeatStore::lock208. Gate::Holder returns SeatPermit containing Some(SeatGuard), so this seat lock may remain HELD across the entire protected operation/child launch. It is not automatically released on function return. SeatStore::lock_with_timeout explicitly documents seat→queue ordering; current_caller/grant checks run again after wait. `run_takeover` deliberately drops this lock before its mail notice. A generic authorize/authorize_orchestrator under receipt would introduce Receipt→Seat, inverse to an existing holder operation that later performs mail/retirement.
    - Session/grant revocation or native resume cannot be replaced by comparing inherited role/name/environment. Existing protected gate checks remain owned by gate/seat_authority and occupancy. The receipt helper must not become an unprotected alternate grant authority or require a new grant for mail paths that currently do not require one.

    6. Lowest safe seams / proposed partial order, not current implemented guarantees
    Use core write_local_message as the final LOCAL admitted-writer seam, including REST/system writes, with a typed already-admitted/held-lifecycle variant for callers that own the fence. Canonical write_snapshot_locked/write_message_in need their own held-store + pre-admitted-mail permit; receipt publication is a third distinct helper. Add C at reset_worktree_to/remove_worktree_at plus route ALL raw CLI/clone/reuse bypasses above through explicit guarded entry points. Checking only one high-level CLI verb is insufficient.
    Actual graph constraints: protected SeatPermit/dispatcher tick/disk guard/drain scope can enclose operations; pool operations currently Pool→reset/remove; canonical operations Store→mail-write; store admission requires Store→Dispense, never reverse. Future mandatory C relation is Lifecycle→Receipt. A feasible minimal extension is outer Pool (where needed)→Lifecycle→Store (only explicit canonical publication)→Receipt, with namespace/seat resolution completed before Lifecycle and no callback under Receipt acquiring any of those outer locks. Do NOT invent an order between all ambient locks or call it proven; opaque hooks and current raw adapters require the changes below.
    Required changes/choices before doer can safely compose this graph:
    (a) For pool callers retain or deliberately restructure the actual Pool→Lifecycle order; held-lifecycle helpers must NOT take pool.lock recursively. Generic teardown's post-remove pool deregistration happens only AFTER releasing Lifecycle. Retain a durable fenced generation for that gap; post-step failure is recovery, not mail loss. Opaque hooks must run without new Lifecycle/Receipt locks; staged destroying/fenced state + bounded revalidation around them must be designed, not rely on hook trust.
    (b) For push/pull/digest, admit/fence the exact mailbox mutation BEFORE acquiring Store and pass a held permit into the existing store closure; never acquire Lifecycle opportunistically inside its re-entrant digest. Avoid network/model/hook work under new Lifecycle/Receipt locks. This may require splitting publication preparation/admission from the current long sync window. Coordinate with STORY1742/BUG2017 owners; do not reverse shared writer order.
    (c) ACK: fully resolve checked audience/authority facts before taking new locks; under Lifecycle then Receipt use a protected READ-ONLY revalidation helper for the same facts/versions, time, subject, parent grant/roster, binding and source generation. No `authorize`, `touch_mcp_agent`, GC/register, Storage save or lifecycle reacquisition inside it. On version change drop locks and retry/refuse boundedly. Existing read-only checkers show this is possible, but no current helper provides a single versioned authority snapshot; that is a concrete gap to implement/review in its proper protected owner. Version checks do not claim to block arbitrary revocation after the final observation; if stronger linearization is required it needs an explicitly reviewed authority-lock contract, not an unprotected boolean or silent new grant lock nesting.
    (d) C's generation is a durable admitted-writer/retirement state, NOT path/mtime. Fence admission and prove quiescence before preservation; original open FDs/atomic rename/copy checks alone do not fence an old writer. Strict complete copy/receipt retention and final fenced generation check precede remove/reset/reuse and early lease/pin/manifest/claim cleanup. On failure keep the tree AND recovery ownership, not just a warning.

    7. Old mutators / C3 activation and concrete remaining gaps
    Current old core writer can create directories and atomic-write without any common fence; REST/MCP processes can outlive binary promotion. A version label, successful upgrade of CLI, or local lifecycle flock does not enroll those processes. Layout-manifest regular-file barriers can make supported old pathname mutators refuse, but do not close already-open/in-flight writer windows or prove a removed root cannot be recreated. Activation must inventory/quiesce or fence actual CLI/MCP/REST/core hosts and hooks, verify upgraded admitted writers and exact manifest/layout compatibility, and REFUSE unknown/mixed writer capability. Keep C3 operator-run report/input/backup/idempotency rules; no live migration in this task. Public transport is not a private retention fallback.
    Gaps now named for implementation: source lifecycle/generation/fence core abstraction; canonical pre-admission held-lock helper; raw remove/reset/reuse/clone routing; early recovery-state deletion ordering; strict safe shared receipt writer + versioned read-only authority revalidation; hook phase/held-lock handling; explicit verified-clone retention binding; old-process/C3 activation proof. Reader API signoff alone resolves none of these. This is an entry/callchain inventory, not a grep-count assertion or proof that arbitrary external raw git/rm/same-UID writers are fenced.

    Decisive conformance additions
    A single deterministic lock-observer fixture should drive CLI+MCP+REST→core write and each named remove/reset/return/destroy/rollback/clone/reviewer path; record entered/held lock classes and barriers, not only final counts. Test Pool-held reset and Store-held digest fail an accidental reverse acquisition; SeatPermit-held send/ACK and dispatcher tick-held notice do not reacquire seat/tick; MCP two responses own distinct postflush plans; blocked receipt lock boundedly refuses; grant/roster/binding change between checked facts and receipt commit refuses without a mutating refresh. Crash/late send after fence and preservation failure must keep source+lease/pin/manifest; pool reset with ignored mail cannot hand old private bytes to the next occupant. Old REST/core writer/in-flight FD + manifest activation must refuse retirement until actual quiescence/fencing. No live tests run here. Preserve signed B: timestamp-only legacy history is UnknownLegacy (including same-source late old arrival), but a newly delivered authorized stable selection may receive a NEW exact ACK; unknown unrelated history does not permanently block it. Full ledger/refused output/publication failure stays observable. A2345/46/full C-D-E and independent STRICT exact-head review remain required.
