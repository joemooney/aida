- id: 01a17485-59d6-7311-93df-51143886bcf1
  author: joe
  content: 'Pushed integrated head `45d54bcdcfb9fda313feeb40279e7b2673178d8c` (merging `origin/main` `54c64e26a5` cleanly onto `5678ccbde7`) on PR #2924 (`claude/story-1917-slice3`) addressing `de431dbe`, `9c6fbd3d`, and `c267509d`:\n\n1. **Strict `/proc` Unknown-Coverage Fail-Closed (`verify_sole_open_fd_for_inode`, `aida-cli-lib/src/dispatch.rs`)**:\n   - Removed `.flatten()` on `/proc` and `/proc/<pid>/fd` directory iterators; any directory entry error fails closed.\n   - Any `/proc/<pid>` `symlink_metadata` error (other than a process that exited mid-scan, verified by `ENOENT`/`ESRCH` and `!proc_path.exists()`) fails closed with `unknown process coverage; fail-closed`.\n   - Any same-UID `/proc/<pid>/fd` `read_dir` error (e.g. `EACCES` on a non-dumpable `PR_SET_DUMPABLE=0` or foreign-user-namespace process) fails closed with `unknown FD coverage; fail-closed`.\n   - Any `/proc/<pid>/fd/<n>` `metadata` error where `symlink_metadata` does not fail with `ENOENT`/`ESRCH` (descriptor still open) fails closed with `unknown FD coverage; fail-closed`.\n   - Note on Linux host mechanism: ambient same-UID daemons with `PR_SET_DUMPABLE=0` (`ssh-agent`, `gpg-agent`, `(sd-pam)`) or child user-namespace sandboxes (`bwrap --unshare-user`) have `/proc/<pid>/fd` owned by `uid 0` mode `0500`, so a strict host-wide scan refuses with `EACCES (unknown FD coverage; fail-closed)` whenever such processes are alive. Unit tests use `TEST_PROC_PID_ALLOWLIST` to test both (a) fail-closed refusal on a real `prctl(PR_SET_DUMPABLE, 0)` child and (b) quiescent migration across controlled process sets.\n\n2. **Zero-ENOENT Atomic `RENAME_EXCHANGE` Staging + Exact Original Inode Rollback + Post-Flock Verification (`activate_dispatch_v2_lock_quiescent` & `acquire_dispatch_lock`, `aida-cli-lib/src/dispatch.rs`)**:\n   - `activate_dispatch_v2_lock_quiescent` never unlinks `tick.lock` before directory creation. Instead, while holding `flock(LOCK_EX | LOCK_NB)` on `leg_file`, it creates `.aida/dispatch/.tick.lock.v2-staging` (`0700`) containing `v2.lock` (`0600`) and acquires `flock(LOCK_EX | LOCK_NB)` on `v2.lock` BEFORE replacing `tick.lock`.\n   - It then calls `libc::renameat2(..., RENAME_EXCHANGE)` to atomically swap `.tick.lock.v2-staging` and `tick.lock` with zero `ENOENT` window.\n   - While holding `flock` on BOTH `leg_file` and `v2.lock`, it runs the second `verify_sole_open_fd_for_inode` scan:\n     - On second-scan refusal: it calls `renameat2(..., RENAME_EXCHANGE)` again to atomically restore the **exact original regular-file inode `(st_dev, st_ino)`** back to `.aida/dispatch/tick.lock` and unlinks `v2.lock` (`nlink = 0`) before releasing `v2.lock` and `leg_file`.\n     - On second-scan success: it writes `tick.lock/version` (`"2\n"`, mode `0600`), unlinks the swapped-out legacy inode at `.tick.lock.v2-staging` (verifying `nlink == 0`), drops `leg_file`, and returns `DispatchLock(v2_file)`.\n   - In `acquire_dispatch_lock`, immediately after `file.lock_exclusive()` returns, it re-verifies `file.metadata()?.nlink() == 1`, `fstatat_nofollow(&disp_fd, "tick.lock")` still matches `(lock_dir_meta.dev(), lock_dir_meta.ino())` (`S_IFDIR`), and `tick.lock/version` contains `"2"`, so any concurrent waiter parked on `v2.lock` during a rolled-back migration fails closed upon waking.\n\n3. **Verification on `45d54bcdcfb9fda313feeb40279e7b2673178d8c`**:\n   - `cargo test -p aida-cli-lib --lib story_1917_ -- --nocapture --test-threads=1`: **37 passed, 0 failed**.\n   - `make check-ci-fast`: **34/34 gates passed**.\n   - `make check-ci-compile`: **1/1 compile tier passed**.'
