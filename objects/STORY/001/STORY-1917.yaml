  content: |
    codex2 SOURCE PREVIEW — local checkpoint e3db5cf7fb9d7c6300a27b4adbe59493e8499e29, NOT a forge attestation/approval.

    Read complete parent/rulings R1–R6/Q1/Q2 and TASK2338–2344, inspected immutable eight-file checkpoint diff. Report: /tmp/codex2-story1917-e3db-checkpoint-preview.txt (source pins, exact symbols, fixtures and acceptance matrix). No tests/build/Cargo or live operations.

    Two consequential checkpoint findings:
    1. dispatch.rs::inspect_dispatch_inventory_readonly1898–2176 loads prior recovery fences but enumerates IDs only from request/result directories. When both halves of a previously fenced record disappear, its durable fence vanishes from inventory; reconcile_inventory_locked2214–2217 then removes recovery.json if no fences remain. Unknown execution loses target/cap protection without explicit recovery. Retain prior fences absent positive recovery; extend actual-child missing-result fixture2400 with loss of the remaining half plus restart/duplicate/cap assertions.
    2. acquire_dispatch_lock352–522 automatically flocks/unlinks the legacy inode and switches to tick.lock/v2.lock. A legacy process with an already-open, not-yet-locked FD can later lock the orphan inode while new mutators use v2. New test2736 covers an already-held lock and a fresh postmigration EISDIR open, dropping the old FD before migration; it does not prove signed Q1 open-FD races/quiescence/all old-native mutator entrypoints. Keep legacy activation refused until explicit quiescent physical-boundary proof; ordinary unlocked legacy-file discovery is insufficient. The claimed inode identity check also lacks a path/handle comparison before unlink.

    Neither area is changed in inspected concurrent R6 WIP (dispatch SHA256065c4b9abd95751c5e65a07008b8ab066f4bc295a23d3d4ca8d3cb70303024c2, mtime2026-10-25T07:24:42.056366083-07:00); this is a qualified snapshot, not an R6 review.

