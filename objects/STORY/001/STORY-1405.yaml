- id: 01a0c194-bf09-7691-b2d2-9547d1f1aa52
  author: joe
  content: '[aida:advisor] SCOPE INPUT, not a criterion change - the gate this spec proposes has an input problem measured 2026-09-20. Across 543 verdict files there are 45 key shapes and 9 verdict spellings, 468 of 543 carry NO head sha of any kind, and two values contain the string APPROVED while meaning do-not-merge (''APPROVED pending cross-platform green'' and ''CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE''). So a merge-time gate comparing verdict-to-head has nothing to compare on 86 percent of the corpus, and a gate matching loosely on APPROVED ships work a reviewer explicitly withheld. Filed as BUG-1505 and linked. Criterion 5b - the merge surfaces consulting the lease - is unaffected, but any criterion that reads the VERDICT should treat BUG-1505 as a prerequisite or state how it handles a shaless legacy verdict. The safe reading is criterion 5 of BUG-1505: cannot-determine must count as refusing.'
