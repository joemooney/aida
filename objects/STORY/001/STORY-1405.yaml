spec_id: STORY-1405
agreed_id: STORY-1405
title: A review in progress is invisible to anyone deciding to merge, so a merge can land seconds before the verdict that would have refused it
description: |-
  A review in progress is invisible to anyone deciding to merge, so a merger and a reviewer can work the same PR simultaneously and the merge wins by seconds. Two instances on 2026-09-20, one of which caused a real incident.

  INSTANCE 1 — the harmless one, which is how it was noticed. PR #2031 (BUG-1447):

      merged            21:19:23Z  as b09197ab72
      reviewer verdict  21:19:59Z  APPROVED

  36 seconds. The verdict agreed with the merge so nothing went wrong, but it could equally have been a refusal and nothing would have stopped the merge. The reviewer had been working for several minutes; the PR was CLEAN with no hold; and there is no signal anywhere that says "a reviewer is currently looking at this".

  INSTANCE 2 — the one that cost something. Earlier the same day the advisor merged PR #2007 while a drive owned it. The reviewer entered one minute after the merge and exited one minute later. That was recorded as `independent: NO` on the ledger and produced BUG-1429. The advisor had checked phase events and read them as "a spec is being worked" rather than "this PR belongs to a live drive" — which is the same gap approached from the merger's side rather than the reviewer's.

  So it has bitten in both directions in one day: a merger who could not see a reviewer, and a merger who could not see a drive.

  WHY THIS IS AN INTEGRITY GAP RATHER THAN A PAPERCUT. "One merger at a time" is a standing integrity rule in this project. It is currently enforced by each seat individually remembering to look, and there is nothing to look AT — no marker, no surface, no field. `aida session leases` is a partial answer and was the thing that would have caught instance 2, but it answers "who holds a worktree", not "who is reading this PR right now", and a reviewer reading a diff holds no lease at all.

  It is also the mirror of BUG-1490. There, a recorded refusal does not reach the readiness surface; here, a review IN PROGRESS never reaches it either. Both are the readiness surface answering "is this ready" without consulting something that knows the answer.

  ACCEPTANCE
  1. A seat beginning a review can mark the PR as under review, and that marker is visible to anything deciding to merge — `aida awaiting`, `aida pr ship`, and the drain's merge phase.
  2. The marker expires. A seat that crashes or wanders off must not hold a PR indefinitely; state the expiry and how it is chosen.
  3. `aida pr ship` refuses, or at minimum warns loudly, when a PR is marked under review by another seat. Decide which and say why — a hard refusal is safer and will be worked around if the expiry is wrong, which is an argument for getting criterion 2 right rather than for softening this one.
  4. The marker distinguishes "under review" from "reviewed and refused" from "no opinion". Three states; a PR nobody has looked at must not be indistinguishable from one a reviewer is mid-way through.
  5. SETTLED — do not re-investigate. The worktree-less review lease already exists (BUG-511) and already has a production caller: `acquire_review_lease_with_mode(project_root, &spec_id, &surface_branch, review_lease_mode)` at `aida-cli-lib/src/lib.rs:75583`, inside `aida review <SPEC>`, with RAII release on Drop and a prompt-vs-refuse conflict mode. So this is not a new mechanism and not an unwired slice; it is a wiring job on an existing one. The remaining work is:
  5a. `aida review record` takes the review lease for the duration of the verdict write, or the spec states why it should not. It is the verb reviewers actually use, and the verb involved in both 2026-09-20 incidents.
  5b. The merge surfaces consult the lease: `aida awaiting`, `aida pr ship`, and the drain's merge phase. The lease already refuses a second reviewer; nothing currently asks it before merging. This is the half that makes the existing mechanism useful, and the largest piece of the spec.
  5c. The drain's reviewer phase stays excluded. `run_reviewer` deliberately never reaches the gate — it launches its headless reviewer via `aida queue work PR-N`, and the exclusion is documented in a comment at the call site. Wiring it would overturn a decision, not close a gap. If that should change it is a separate spec with its own argument.
  5d. By-hand review with no aida verb takes nothing and cannot be wired. Say whether a deliberate claim verb is worth it, or whether this case is accepted as uncovered.
  6. A test covers the race: seat A marks a PR under review, seat B attempts a merge, and B is stopped or warned.
  7. A merge-time gate must be cheap enough that it does not erode. A check that costs real time will be skipped first on the merges that feel most routine — which are exactly the ones where the artifact has had longest to change since it was written. Cost is therefore a CORRECTNESS property of the gate, not an ergonomics one. State the per-merge cost of whatever is built, and if it is not negligible, say what stops it being skipped.

  NOT IN SCOPE: preventing a human from deliberately overriding. The goal is that the merger KNOWS, not that they are forbidden.

  Raised by claude-reviewer-1 from instance 1, who declined to file it on the grounds that an in-flight marker is a design question rather than a defect. That is a fair reading of instance 1 alone. Instance 2 is what makes it a defect: the same gap has already cost a wasted review round and a ledger entry recording a broken independence rule.
