- id: 01a0c146-6671-7023-8d96-7fb4aefe726c
  author: joe
  content: |-
    [aida:advisor] ADDED REQUIREMENT, from a live incident at 00:00:35Z. A merge surface must consult the VERDICT at merge time, not rely on a verdict read earlier.

    PR #2037: reviewer recorded APPROVED at 23:55:22; the drain's phase-3 reviewer OVERWROTE the handshake with RequestChanges and two substantive findings at 23:56:27; the merge landed at 00:00:35. Four minutes between refusal and merge, unseen. The merging seat re-verified required CHECKS at head — that habit is solid — and did not re-read the VERDICT, because they had written it themselves five minutes earlier.

    This is the same requirement as consulting the review lease and belongs in the same fix: ASK THE SUBSTRATE AT THE MOMENT OF THE ACT. Criterion 1 already covers a review in progress; this adds that a RECORDED verdict must be re-read at merge time, because PR-keyed handshakes are overwritable and one reviewer can silently replace another's.

    Do not solve this as a habit or a checklist item. The seat that missed it had discovered the overwrite behaviour themselves, been burned by it personally, and written it down for another seat — and still did not apply it, because an artifact you authored does not feel like one that can change underneath you.
