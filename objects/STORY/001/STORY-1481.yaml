  content: |
    FACTORY PLAN (night) — plan only, no code tonight. Reason: guided, needs-sketch; EPIC-74 design fork (lane vs target-branch) and V4 sketch are signed as DESIGN only with implementation NOT READY (EPIC-74 comments[16]-[17], 2026-10-08).

    ## Approach
    Two competing shapes exist: this story's `aida lane open/list/close` + lane seat, and the operator's 2026-09-28 proposal (docs/plans/2026-09-28-epic-74-target-branch-vs-lane.md) which the EPIC-74 V4 sketch adopted ("target/parent vocabulary and canonical epic isolation remain selected; no lane seat/flag/system"). Plan under V4: the store record is a target-branch declaration ON THE EPIC (field in aida-core/src/models.rs Requirement, synced like any object under `.aida-store/objects/`), not a new object kind; "lane seat" collapses to env `AIDA_TARGET_BRANCH`/`AIDA_PARENT_BRANCH` plus the existing focus marker (focus.rs:126-184). The durable part of this story is main-line EXCLUSION: every selector skips specs whose epic ancestor declares a non-default target branch and prints one visible line.

    ## Files and functions (selectors to patch)
    - aida-core/src/pickability.rs:103 `pickability` — add `BlockedReason::IsolatedSubtree(epic)` so every consumer inherits it.
    - aida-cli-lib/src/queue_cmd.rs:12937 `pick_auto_complete_head` / 13029 `pick_auto_complete_head_for_role` / 13205 `auto_complete_head_candidates` — exclusion + count line; 10687 `handle_queue_work` explicit target → refuse naming the lane/branch unless `--force`.
    - aida-cli-lib/src/queue_cmd.rs:1489 `handle_queue_command` (queue views) — exclusion line.
    - aida-cli-lib/src/burndown.rs:239 `classify` / 275 `partition` — new Pickability variant.
    - aida-cli-lib/src/shift.rs:2648 `gather_candidates` → 702 `select_wave` — `ineligibility` reason.
    - aida-cli-lib/src/integrate.rs:85 `classify_candidate` — `CandidateVerdict::SkipIsolated`.
    - aida-cli-lib/src/backlog.rs:353 `collect_backlog_candidates` and 1135 `select_pickable` — park reason (groom + backlog groom).
    - aida-cli-lib/src/worktree.rs enter path — set target/parent env from the epic declaration (replaces `lane open`'s worktree creation).
    - aida-core/src/git_ops.rs:1980 `default_branch_name` — the default everything derives from (never literal `main`).

    ## Tests (named)
    - isolated_epic_child_excluded_from_queue_work_head_with_visible_line
    - isolated_epic_child_excluded_from_burndown_partition / shift_select_wave / integrate_classify / backlog_collect / select_pickable
    - explicit_queue_work_on_isolated_spec_refuses_and_names_branch; force_overrides
    - declaration_syncs_across_clones (store round-trip)
    - clearing_declaration_restores_eligibility

    ## Risks
    - Building `aida lane *` now costs a deprecation shim if V4 vocabulary wins; the rename is free only while nothing is implemented.
    - V4 review says checked writer / strict committed reads are prerequisites; the declaration write must not race the cache (STORY-1484 territory).

    ## Acceptance check
    - AC1 (each selector excludes + prints) → per-selector tests above. AC2 (inside the lane only those specs) → env-scoped selection test. AC3 (sync via store) → clone test. AC4 (explicit target refused, --force) → refusal test. AC5 (close restores) → clearing test.

    ## Gate before implementation
    EPIC-74 ADR accepted and the lane-vs-target-branch fork decided by the advisor; V4 "NOT READY" prerequisites supplied; then this story's text is amended to the chosen vocabulary before any code.
