spec_id: STORY-1481
agreed_id: STORY-1481
title: Lane record + seat, and main-line exclusion of laned epics' specs (aida lane open/list/close)
description: |
  `aida lane open EPIC-N [--branch <name>]` records a feature lane on the epic: a lane flag, the target branch (default `epic-n-work`) and the time it was opened, stored in the aida-store so every clone sees it. The command creates or enters the sibling worktree, as `aida worktree enter` does today, and gives the session a **lane seat**. A session in the lane has its focus, target branch and statusline label (`lane:EPIC-N`) derived from the lane record, not from per-shell state.

  Main-line seats **exclude** every spec in a laned epic's transitive subtree. This covers drains (`queue work`, `burndown`, `shift`), `aida integrate`, `aida groom`, `aida backlog groom` and the main queue views. Each prints a single visible line, such as `EPIC-N: 4 specs in a feature lane (excluded)`, so nothing is silently hidden.

  `aida lane list` shows open lanes, their branches, spec counts and how far each is behind main. `aida lane close EPIC-N` removes the lane without landing it, and the specs rejoin the main line.

  ## Acceptance
  - With EPIC-N laned, an approved and queued child is **not** picked by a main-line drain, `integrate` or `groom`, and each surface prints the exclusion line. Tests cover each selector.
  - Inside the lane worktree, those same specs are selectable, and only those specs.
  - The lane record syncs through the store: a lane opened on clone A is excluded on clone B after `aida pull`.
  - Explicitly targeting a laned spec from the main line (`aida queue work SPEC` from outside the lane) is refused, with a message that names the lane and how to enter it. `--force` overrides it.
  - `aida lane close` restores main-line eligibility.
