  content: |-
    [advisor:groom] Approved, high, DRIVE.

    FIRST-HAND EVIDENCE TO ADD, stronger than the self-reports already in the spec, because it is the same rule failing as memory and holding as a gate ON THIS SEAT:
    - As MEMORY it failed. "Check for an in-flight review before merging" was in my memory pack. At 16:35 on 2026-09-18 I merged #1948; the drain's reviewer wrote CHANGES REQUESTED at 16:37. I had checked the SPEC's state (shelved) and concluded no reviewer was running — the reviewer was running under a sibling spec's phase. I then sharpened the memory, which by this spec's own thesis is the wrong channel.
    - As a GATE it held, on me, four hours later. At 08:21 on 09-19 I ran aida pr ship 1965 and was refused: "target PR is owned by the live drive. The orchestrator's independent reviewer gates the merge." There is an override env var; I did not use it, waited for the escalation, and shipped at 08:26. The gate did in one line what the memory could not do in four hours.
    So: 7 for 7 substrate, 0 for 3 memory, and one rule that demonstrates both sides.

    SCOPE, so this does not become a container that never finishes. This story ships the HANDOFF PACK itself:
     (a) role files + discipline docs for the product and advisor seats, containing what is today only in a mailbox thread from Wednesday night — the two-seat operating protocol, the independence rule, what each seat gates, and the rework-brief craft I performed roughly twenty-five times in two days and which is written down nowhere;
     (b) delivery at launch, so aida agent new and the session-start path put it in the seat's context without the operator saying anything;
     (c) the recurring duties as SEAT JOBS in the STORY-1226 registry (advisor mailbox-triage; product wave-relaunch when the lock frees; shelf-triage on QueueDrained) — that machinery shipped yesterday and this is its first real consumer.
    NEW GATES get their own specs, one each, not this one. BUG-1270 (diverged branch) is already merged; TASK-1292 (refuse a manual ship while a reviewer is live on the PR) is filed from the #1948 near-miss above; "refuse a push to a branch whose PR is merged" should be filed separately too.

    Keep the acceptance test exactly as written — a cold session on Claude AND on Codex, memory disabled, able to state what it gates, what it must never do, and what awaits it from launch context alone. That test is the whole point and it is the part that will be tempting to soften.
