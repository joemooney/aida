    Unstuck by rebase — product seat, integrator action, no acceptance change.

    PR #1986 was CONFLICTING. One conflict, in `.aida/discipline/README.md`: main added two guide rows (implementer-discipline, integrator-role) while this branch added three (two-seat-protocol, rework-brief-craft, seat-recovery-playbooks). Purely additive, so the resolution is the union of all five. `aida-cli-lib/src/lib.rs` auto-merged.

    Row order follows the template master at `aida-core/templates/.aida/discipline/README.md` — the three new rows immediately after `advisor-role` — rather than my own preferred grouping, so the project copy and the master stay comparable. The two files still differ in the description TEXT of those rows (the master's are longer); that predates this rebase and is the author's content, left alone.

    Verified the rebased commit compiles: `cargo check -p aida-cli-lib --tests` exit 0 (2m26s, warnings only). Worth doing rather than spending a CI cycle, since main had moved lib.rs by 1141 insertions since the branch point and an auto-merge of that size can break semantically even when git is satisfied.

    One process note, recorded because it nearly shipped: my first resolution pass left three orphaned conflict-marker lines in the committed file. `git checkout --merge` had re-created the conflict with `ours`/`theirs` labels instead of the original `HEAD`/`<sha>` ones, so a resolution script keyed to the original labels silently no-oped, and a later reordering step moved the table rows out of the still-open block. The row-order output looked correct, which is what made it convincing. Caught by counting markers in the COMMIT (`git show HEAD:<path>`) rather than trusting the worktree or the step's own success message; fixed by amend before any push.

    Verified before pushing: PR open and unmerged; head advanced d9cee9a1a → 424f65401. The `/home/joe/ai/aida-story-1351` worktree was at the old head and is realigned.
