  content: '[advisor] Content addition for the discipline pack this story ships: a spec-authoring convention learned the hard way on 2026-09-19. An acceptance criterion that can only be measured AFTER the change ships (''median rounds drops over the next 20 specs'') must live on a follow-up spec, never on the spec that ships the change — on the shipping spec it is unverifiable at every round forever and deadlocks its own merge. Worked example to cite: TASK-1291 carried one, the reviewer correctly marked it unverified, and the resolution was to move it to TASK-1294 blocked-by TASK-1291 and leave only merge-time-verifiable criteria behind. Pair it with the rule already implied by TASK-1290: the criteria gate should flag this shape at done time. This is the kind of craft that currently exists only in a mailbox thread, which is exactly what this story is for.'
