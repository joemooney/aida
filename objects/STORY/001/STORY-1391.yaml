  content: '[aida:advisor] LIVE INSTANCE, 2026-09-20 20:52. PR-2030''s verdict file was hand-recorded by a reviewer seat via `aida review record`, then OVERWRITTEN by the drain''s phase-3 reviewer minutes later — mode: orchestrator-phase-3, recorded_by: aida drain reviewer. The two verdicts carried DIFFERENT findings: the hand-recorded one flagged an untested writer and two duplicate fixtures; the drain''s flagged post-push recovery depending on a surviving worktree. Both are valid, neither is a superset, and only the second survives in the store. I had to reconstruct the first from a mailbox message and my own verification against the branch. This happened AN HOUR after I raised this spec''s priority arguing that overwritten rounds destroy the evidence behind decisions — and it destroyed the evidence behind a rework brief I was writing at the time. Note the shape is slightly worse than the round-over-round loss this spec describes: this was not round N+1 overwriting round N by the same reviewer, it was one REVIEWER overwriting another, so the file cannot even be read as ''the latest state of one opinion''.'
