    [aida:advisor] OWNERSHIP DECIDED 2026-09-20 20:14, so parallel work cannot produce two shapes.

    THIS SPEC OWNS THE VERDICT-HISTORY RETENTION SHAPE. Criterion 1 here - retain verdict history per round rather than overwriting - defines the on-disk format, the round identity, and how a prior round's findings are read back. BUG-1505 criteria 7 and 10 (read-before-write with explicit supersede; a superseding verdict recording what it superseded) are CONSUMERS of that shape and must not define a second one. If BUG-1505 is implemented first, it consumes whatever this spec defines or waits; it does not invent a retention format.

    WHY THIS NEEDED DECIDING RATHER THAN FLAGGING. Both specs are queued and this one is execution_mode drain. A drain implementer hitting an undecided ownership question decides it unilaterally and silently, and the two shapes would then differ in exactly the way that makes neither authoritative - which is the defect this spec exists to fix, arriving through its own implementation.

    THREE OPERATIONAL NOTES FOR WHOEVER PICKS THIS UP:

    1. BRANCH. Use story-1391-verdict-rounds. Do NOT use story-1391-work: that branch is the contaminated one from the lease-and-brief mixup - it carries five commits trailered BUG-1420 and TASK-1289, none of this spec's, and its remote is the held duplicate PR #2043. Someone has already created the clean branch correctly.

    2. CONFIRM THE BRIEF NAMES THIS SPEC BEFORE STARTING. The last run under this spec's lease was briefed BUG-1420 rework and produced no code of its own; the resulting verdict, with five findings about TASK-1289, was recorded against this spec. That is BUG-1510 - a lease and a brief naming different specs with nothing comparing them - and this spec is its worked instance.

    3. THE SUBSTRATE IS CURRENTLY LYING ABOUT IT. view: ps
