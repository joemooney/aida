    3. The two findings on the PREVIOUS verdict at this same head must NOT be actioned. Both are artifacts of the stale base: the BUG-1277 mcp queue-rework test is correct on current main and reconciling it would break a passing test, and the SPIKE-83 trailing whitespace is intentional markdown hard-line-breaks in a document that already merged. Recording this explicitly because a verdict file is overwritten each round (STORY-1391) and the dispute lives only in a spec comment - a later reader of the verdict alone would action two findings that are wrong.
