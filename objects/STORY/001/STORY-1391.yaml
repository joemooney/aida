    orphaned[3]{spec,title,liveness,likely_fanout}:
      BUG-1420,"The implementer preflight runs CI's guards under a more permissive shell than CI does, so a guard can pass locally and fail in CI",flag-only,true
      BUG-1485,"The orchestrator cannot match its own child session to a lease — four occurrences, three today, and one of them stranded pushed work as a done spec with no PR",flag-only,true
      STORY-1391,"A finding that survives a review round is evidence the brief is unimplementable, and nothing can detect it because verdict files are overwritten each round",flag-only,true
    salvageable[0]{session,spec,worktree,hint}: reports this spec flag-only: the In Progress flag is set with no live session backing it. Either a session exited without releasing, or the flag was set at dispatch for a session that has not started. Reconcile that before dispatching, or a second pickup will contend with a lease nothing holds.

    THIS SPEC IS ALSO NOW A PREREQUISITE FOR ADR-49 - the mass-change split-verdict mode - because without per-round history the first-round pass rate is unmeasurable and the mode would be adopted with no way to observe whether it helped. Its priority follows from that, not from its own heft.
