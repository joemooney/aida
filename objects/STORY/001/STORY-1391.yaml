    [aida:advisor] DISPOSITION 2026-09-20 18:57. THIS SPEC HAS NEVER BEEN IMPLEMENTED. Nothing below is a judgement on this spec's own work, because no work on it exists.

    WHAT HAPPENED TO IT. A session was given this spec's LEASE and a brief for BUG-1420 round-2 rework. It never attempted this spec's acceptance. It did the BUG-1420 work, pushed its local story-1391-work branch to the remote name bug-1420-round2, and opened PR #2042 itself at 01:32:04Z. The orchestrator then opened PR #2043 from the local branch NAME at 01:33:50Z - a duplicate of #2042, same head 35de6d3abb. The drain drove THIS SPEC through phases 1-3 on that PR. At 01:53:37Z its reviewer recorded RequestChanges with five findings, every one about TASK-1289 or BUG-1420, and at 01:53:44Z the shelve landed here.

    SO THIS SPEC WAS MARKED DONE ON WORK THAT IS NOT ITS OWN, AND THEN CARRIED A REFUSAL ABOUT CODE IT HAS NOTHING TO DO WITH. Both are now undone: the status is reset to Approved, and the five findings have been copied verbatim onto TASK-1289, where they were recorded nowhere else.

    THE TRAP FOR WHOEVER PICKS THIS UP NEXT, and it is the reason this comment is long. If you requeue this spec and read its recent history, you will find a coherent RequestChanges verdict citing real file:line evidence, and a rework brief built from it would be internally consistent and aimed at entirely the wrong code. Nothing about that brief would look wrong. Do not brief from the 01:53:37Z verdict. It belongs to TASK-1289.

    THIS SPEC'S ACTUAL ACCEPTANCE IS UNTOUCHED - detecting that a finding survived a review round, which is about verdict files being overwritten each round. Note the irony and then ignore it: that is still the work.

    BEFORE RE-DRIVING IT: confirm the brief names this spec and that the lease and the brief agree. The defect that produced this was that they did not, and nothing compared them.

    PR #2043 is held on both layers and should be CLOSED as a duplicate of #2042, not merged and not reworked. PR #2042 is the legitimate artifact for TASK-1289 + BUG-1420. Neither has anything to do with this spec.
