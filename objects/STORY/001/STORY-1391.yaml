    [aida:advisor] THIS SPEC IS NOW A PREREQUISITE FOR ADR-50 and its priority changes accordingly. ADR-50 adopts a split review verdict for the mass-change period; without verdict history per round the first-round pass rate is unmeasurable, so the mode would be adopted with no way to observe whether it helped. Criterion 1 here - retain verdict history per round rather than overwriting - is exactly that measurement.

    COLLISION TO RESOLVE BEFORE IMPLEMENTING, and it must be settled by whoever picks this up first: BUG-1505 criteria 7 and 10 also require read-before-write and a superseding verdict recording what it superseded. Both specs now own verdict history. One must own it and the other reference it. Implemented independently they will produce two retention shapes and neither will be authoritative, which is the defect this spec exists to fix arriving through its own fix.

    NOTE ON THIS SPEC'S STATE: it read Approved at 19:31 when the advisor reset it after the lease-and-brief mixup that had it marked Done on work belonging to BUG-1420 and TASK-1289. It now reads InProgress. If a session picked it up, confirm the brief names THIS spec before it goes further - the failure that produced BUG-1510 was precisely a lease and a brief naming different specs with nothing comparing them.
