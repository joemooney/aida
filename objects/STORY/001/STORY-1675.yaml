title: 'Hypothesis rows for pre-registration: prediction, refutation criterion, linked experiments, locked once a result is linked'
description: |
  ## F25. Support pre-registration: time-stamped hypotheses linked to experiments

  **Seen:** to make the pilot research-grade we wrote hypotheses before running the experiments and committed them separately (9348eeb), so git timestamps the prediction.

  **Proposal:**
  - A `hypothesis` row type (or a tag) with a prediction, a refutation criterion and the experiments that test it.
  - Once an experiment has a result linked to it, the hypothesis is locked against edits: amendments are appended, not edited in place.
  - AIDA already has decisions; hypotheses are the experimental counterpart.

  ## Acceptance

  To be written at triage; the proposals above are the starting point.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), feedback file docs/regeneration/aida-feedback.md at commit f2b8d2d; results in docs/regeneration/results-2026-10-11.md. Headline numbers: a blind agent rebuilt the 1,600-line system from the curated store at 93.9-95.5% of discriminating oracle checks (3 replicates), 22.7% without the 3 contract rows, 11.4% from the store as it stood before regenerability work; an AfterVibe Prompt A.1 spec distilled from the transcript reached 97.7%.
