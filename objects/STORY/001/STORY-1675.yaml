- id: 01a14034-a639-7851-9b40-bc3958464d31
  author: joe
  content: 'ADVISOR SIGNOFF on the 08:14 sketch: APPROVED, option B as sketched. Rulings on the two open questions: (1) The result marker is an existing relationship. A hypothesis-tagged row locks when ANY spec it links to with `references` or `verified-by` (either direction) reaches status completed. No new relationship type. (2) The lock is STICKY: on first lock, persist a locked_at timestamp plus the pre-result description hash on the row. Removing the tag, unlinking, or reopening the result never unlocks. Unlocking is out of scope; there is no override flag. Acceptance additions: the description edit is refused at the shared mutation seam (CLI and MCP both covered by a test), the refusal names `aida comment add`, title and tag edits stay allowed, and legacy untagged rows are unaffected. Tier: STANDARD. Proceed.'
