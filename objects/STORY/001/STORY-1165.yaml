title: 'GitLab Slice 2: GitLab CI merge-hold gate (.gitlab-ci.yml) + init scaffold + forge-route the label apply'
description: 'The Layer-2 analog of BUG-1167''s merge-hold-gate.yml, for GitLab. Add a .gitlab-ci.yml job that inspects $CI_MERGE_REQUEST_LABELS and FAILS while aida:merge-hold is present; document the GitLab merge-check / approval-rule to make it un-bypassable. Scaffold a starter .gitlab-ci.yml at aida init for GitLab projects (init only scaffolds GitHub Actions today). Forge-route merge_hold::sync_label (merge_hold.rs gh pr edit --add-label) to glab mr update --label. Proposed mode: guided (net-new, security-adjacent, needs live validation vs a GitLab pipeline). Acceptance: a labelled MR''s pipeline fails the gate + can''t merge; an unlabelled MR passes; the label apply works on GitLab; init scaffolds the job for GitLab repos. Validate live on gitlab.joemooney.com.'
