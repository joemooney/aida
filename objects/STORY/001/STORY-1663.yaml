title: aida pr ship supports rebase merges with the same gates as squash, so verified slice stacks stop bypassing it
description: |
  ## Problem
  `aida pr ship` only squash-merges. Verified mechanical slice stacks (the STORY-1488 lib.rs split) must rebase-merge so each module move stays its own commit (FAQ-8). So those merges go through a raw `gh pr merge --rebase --match-head-commit`, which bypasses every approval-authority check `aida pr ship` runs. The advisor-merge decision (linked) allows that only as a narrow, temporary exception.

  ## Want
  - `aida pr ship <n> --rebase` (or `--merge-method rebase`): the same gates as today (approval at head, approval authority, CI green on the pinned head, holds, completion handling), then a rebase merge pinned to the head SHA.
  - Completion: rebase merges produce no squash subject, so no trailer is derived from the title or branch. The spec completes only when explicitly requested (e.g. a final-slice flag); slices never auto-complete their spec (cf. BUG-1919 for squash).
  - Optional pre-merge hook: when the PR is a slice stack, run the configured verifier (scripts/split-lib/verify_stack.py <base> <head>) and refuse on FAIL.

  ## Acceptance
  - Rebase-shipping a PR without an independent approval at head is refused, exactly as a squash ship is.
  - A stale head (a new commit after approval or CI) is refused.
  - A rebase ship of a slice PR leaves the owning spec's status unchanged unless the final-slice flag is given.
  - After it lands, the advisor-merge decision's exception for slice stacks is removed and the two-seat docs point at `aida pr ship --rebase`.
