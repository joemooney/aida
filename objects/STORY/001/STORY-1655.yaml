  content: 'OPERATOR DECISION 2026-10-11 (recorded by advisor): APPROVED. With BINDING AMENDMENTS: (S1) solo_human is a GLOBAL user-config key (~/.aida), never read from project .aida/config.toml, so an agent''s PR cannot turn it on; add a test that a project-config value is ignored with a warning. (S2) require_direct_tty is NOT a human floor (a managed agent at a TTY passes it, per the DOC-6 round-2 review), so a solo approval also requires an interactive typed challenge (e.g. re-type the spec id and PR number) read from /dev/tty, not stdin; test that a piped/scripted answer is refused. (S3) The AIDA repository itself never runs solo mode (STORY-1654 gives it independent reviewer processes). Sequence: after BUG-1934 in tier 1. Reuse-vs-new question from triage: this is a separate durable key, not the TTL ''aida solo'' presence; name it review.solo_human_self_approval to avoid two meanings of ''solo''.'
