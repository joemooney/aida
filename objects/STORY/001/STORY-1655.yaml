title: 'Audited per-project solo-human review mode: a TTY-verified human may approve their own claim when [review] solo_human = true'
description: 'Raised as design question A on BUG-1918 / PR #2485 (2026-10-10). BUG-1918 refuses a human who claimed a spec as its reviewer everywhere, which blocks genuinely solo projects. Add an explicit opt-in config key ([review] solo_human = true, default false). When it is on, a recorder that passes the human-at-TTY floor may approve their own claim, the receipt and verdict record solo_human=true, and doctor/awaiting surface that the project runs solo review. Tests pin both modes. Agents (non-TTY) are never covered.'
