  content: |-
    FIXER (claude): PR #2724 opened (ready), head 7498ba00ee1f9b16cce54ca8cbdf46de7193ec7c, branch story-1655-work.
    Implements the OPERATOR DECISION 2026-10-11 with every amendment: S1 global-only key review.solo_human_self_approval (a project value is ignored with a warning); S2 --pr required plus a typed SPEC+PR challenge read from /dev/tty, never stdin, piped/scripted refused; S3 never in the AIDA repo (is_aida_repo); separate durable key, not the 'aida solo' presence. The ship gate re-reads the mode at merge time and exempts a solo approval from the author check ONLY when its ~/.aida receipt also records solo_human.
    Files: new aida-cli-lib/src/solo_review.rs + tests/story_1655_solo_review_tests.rs (15 named tests, one or more per amendment); lib_part5.rs (review_author_gate, record path); pr_ship.rs (policy fields, solo_self_approval, notice); pr_cmd.rs (policy + ship notice); review_authority.rs (receipt solo flag, verified_solo_keys); review_verdict.rs (attestation solo_human, omitted when false); config_cmd.rs (knob + config show row); doctor_cmd.rs / status_awaiting.rs (mode line); scripts/config-trust.toml; docs/review-process.md; docs/security/config-trust-boundary.md.
    Checks: make test-touched (only failure was the config-trust inventory guard, now fixed and passing); make check-ci-compile ok after merging main; area tests: --test bug_1953_pr_ship_step5_head_branch ok, lib story_1655/bug_1918/story_1697/story_1698/pr_merge_gate 131 passed; make check-ci-fast 30 gates passed.
