title: 'Single-flight cache refresh: flock-guarded, double-checked, with a durable refresh request and a detached worker; readers get a bounded wait and then a labelled stale read'
description: |
  From SPIKE-90 (NO-GO on a separate immutable snapshot; this is the recommended cheaper alternative). Report: docs/research/spike-90-stale-cache-snapshot.md section 4.

  Problem (measured on a copy): readers that find the cache stale refresh inline and become writers. With 4 concurrent readers and a 1-commit-stale cache the worst reader took 7-41 s (single reader: 0.8 s); with a full rebuild needed, 29-52 s (single: 13.4 s). No single-flight, no double-check under the lock: losers redo the rebuild. A stale read served by the BUG-664 guard carries no stale label.

  Design (keeps busy_timeout=0 and the retry ladder for writers; readers never enter the ladder):
  - Single-flight refresh under a kernel flock on `<canonical cache path>.refresh.lock` (history_cache IndexLock pattern); the lock winner re-checks `is_stale` before work.
  - Durable refresh request `.aida/cache.refresh-request` (target HEAD, requester) plus a detached `aida cache refresh --worker` process (setsid / DETACHED_PROCESS, log to `.aida/cache-refresh.log`, runtime cap). Not an in-process task. A pending request with a free lock is re-spawned by the next reader or by an `aida schedule` substrate job (`cache refresh --if-requested`). The request is cleared only when the cache head reaches the requested head.
  - Reader protocol: fresh -> serve; stale + try_lock won -> refresh inline; stale + lock held -> bounded wait polling source_head_sha (default 1.5 s, AIDA_CACHE_READ_WAIT_MS; 0 on --notice), then serve last committed state with a stale label.
  - Stale label: stderr `note: showing cached results from <built_at> (store has moved on; refresh in progress). Re-run in a few seconds for current data.`; JSON/TOON/MCP `cache: {stale, cache_head, store_head, built_at, refreshing}`; exit code unchanged.
  - Stale-allowed commands: list, search, status, queue list, graph/tree, digest, awaiting --notice, statusline, MCP read tools. Always strict: mutations, add's id-collision check, validate/complete/merge/integrate gates, lease/claim, cache rebuild/status.

  Architecture change: needs a sketch on this spec and advisor signoff before implementation.

  ## Acceptance
  - With 4 concurrent readers on a 1-commit-stale cache, exactly one refresh runs (asserted via a counter/log) and every reader returns in < 2 s.
  - A reader that loses the single-flight race and exceeds the bounded wait prints the stale note on stderr, sets `cache.stale=true` in JSON, and exits 0.
  - Killing the worker mid-refresh leaves the previous committed cache readable and the request file present; the next reader or schedule tick re-spawns a worker that completes it.
  - No reader path calls with_cache_write; busy_timeout stays 0; DEFAULT_CACHE_RETRY_DELAYS_MS is unchanged.
  - `aida cache status` shows cache head, store head, built_at, pending request, and lock holder.
