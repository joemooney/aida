- id: 01a0dd86-fb2b-7072-b817-319385a743ac
  author: joe
  content: 'Scope note from the BUG-1644 strict review, finding 4 (orchestrator proxy): lock-info records carry no host or pid-namespace identity. A writer in another container or on another host sharing a mounted .aida looks dead against the local process table, so its record can be deleted by retire_stray_worktree_lock_info, post-write dead-owner cleanup or doctor heal. SQLite still holds the real lock, so there is no unprotected write, only lost diagnostics. The sketch must add hostname and pid-namespace identity to lock records and treat a mismatch as unknown (keep the record).'
