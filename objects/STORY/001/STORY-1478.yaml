- id: 01a0e0fb-16ad-7933-be14-847f68878a70
  author: Codex (independent advisor signoff)
  content: |
    ADVISOR SIGNOFF: APPROVED

    Independent advisor review of SKETCH 01a0e0f6-56eb-7c90-9867-ff749639d20d. I am a new reviewing seat, not its author, product, implementer, or integrator. Approval incorporates the binding amendments below; the unamended sketch is not the implementation contract. No true product fork remains. This is design signoff, not an implementation/test-pass verdict or authorization to change queue/status.

    Evidence independently inspected
    - AGENTS.md and .aida/discipline/two-seat-protocol.md; STORY-1478 --full plus comment list (show --full alone does not include comments); EPIC-73.
    - history.rs::collect_event_records/decode_into_events/human_timestamp/event_record/collect_filtered_events_git, history_cache.rs, CLI History dispatch, events.rs::Event/read_all/read_all_with_archive and terminal variants; drain_state::mark_member_done emission; lib.rs CI/merge/build emissions; forge.rs::ChangeMetadata/gh_pr_checks_json; pr_cmd::emit_ship_pr_merged.
    - Actual store git diffs, local event lines 4779–4815 and 7140/7203, and read-only gh pr view for PRs 2015 and 2190. Source checkout: 854b7e26f7222c73845064275a18c293c9895283. All AIDA invocations used /home/joe/ai/aida/target/release/aida.
    - BUG-1424 Added commit 526462ba has author time 2026-09-20T07:08:02Z; Approved 07:11:44Z; Completed 8f076f99 at 12:55:59Z. Thus the store-observed filing-to-completion elapsed is 20,877s (5h47m57s), not EPIC-73's approximately 92-minute drain window. GitHub mergedAt is 12:55:50Z, local PrMerged is 12:55:51.296998292Z: these are distinct facts, not interchangeable completion clocks. Store Done -> InProgress at 12:28:53Z precedes the second RunStarted at 12:34:39.985486329Z; an unqualified 47-minute parked assertion is unsafe.
    - TASK-1507 was added already Approved at 2026-09-25T08:15:03Z, InProgress at 10:52:03Z, Completed at 23:48:38Z (56,015s elapsed). Local detection at 13:19:11Z is not a start; local SpecCompleted at 23:48:40Z is emission time. Credited batch PR 2190 opened 23:31:47Z and merged 23:48:10Z. Its rollup includes a skipped check with start AFTER completion and CI ending after spec completion. Do not treat the rollup as a single reliable CI interval.

    Binding amendments
    1. Preserve precise clocks and provenance. Existing HistoryEventRecord.ts/timestamp are minute-resolution LOCAL strings, already lossy; Added also omits initial status. Reuse decoded transitions/SHAs, but batch-read raw git %aI plus the Added revision's status from that SAME store snapshot. Never parse the display timestamp as UTC, substitute %ct or current modified_at, or infer initial Draft. Keep current history JSON unchanged; a timeline-local SHA metadata adapter is the bounded route (if serialized decoder shape changes instead, bump its decoder version and preserve old output). Mark these times as store author/recorded timestamps, not exact human-action times. Preserve SHA, event file+line/run/attempt, and forge repo/PR/head/check/attempt identifiers in evidence. Ordering ties must be deterministic, with store ancestry resolving same-time transitions; incompatible histories or skew do not justify invented duration.
    2. Obtain complete single-spec history independently of display filters/caps. In the current collector max_commits=0 does NOT mean unlimited; do not use that shortcut. Ensure creation was not just materialized by compaction/import; a compacted root or missing prior state is incomplete, not a new filing. Full-history side-branch observations are not automatically one causal lifecycle: reconcile against ancestry and resulting state, and mark unresolved conflicts unknown. Bypass archive/deferred hiding for an explicit resolved spec. Reject explicit --since/--until, --limit/--max-commits and event-only selectors in timeline mode rather than silently returning full-looking partial totals.
    3. Store owns the lifecycle envelope and status observations, not proof of continuous labor. Choose earliest verified filing through the latest Completed transition with no later reopening; if reopened, use the last relevant observed boundary and incomplete=true. Preserve intermediate completions/reopens; uncovered time between them is unknown. For unfinished specs use last relevant boundary, not wall-clock now or later comments; expose endpoint_kind and as_of. If filing is unknown, use an explicitly partial observed_start/observed_end interval and incomplete=true; never invent unknown duration before its known start. Document totals as coverage of that reported interval only.
    4. Every main span is half-open, ordered, positive-duration, contiguous and non-overlapping; the union equals the reported envelope and work+wait+unknown equals elapsed before display rounding. Unknown is the default. Subtract stronger evidenced work/park intervals from coarse status candidates; contradictory overlapping activities from concurrent runs become unknown on the disputed portion, not arbitrarily winning by source sort order. A store InProgress transition ends queued/parked attribution but does NOT begin implementer work. In BUG-1424, end parked attribution no later than the 12:28:53Z store re-entry and leave the following uninstrumented gap unknown until evidenced work. Done alone cannot imply awaiting-merge: BUG-1424 enters Done while CI/review still run. Queued requires an uninterrupted Approved state; awaiting approval requires verified Draft; awaiting merge requires an accepted, still-valid final work-done boundary and credited merge, with no intervening rework/shelve. CI green alone does not prove review/work is done. Between-runs endpoints alone do not prove idle time; require explicit inactive/wait state, otherwise unknown.
    5. Match phase terminals by canonical spec, nonempty run UUID, phase and attempt, not just time adjacency. CiTerminal closes CI only, PrMerged merge only, and successful RunCompleted closes matching trailing work only when its completion flags support it. A different run never closes an orphaned phase. Number actual re-entries globally per activity; deduplicate exact repeated records before numbering, preserve legitimate retries, and never fabricate a shelve from SpecRetried. For the real BUG-1424 fixture the last PhaseDonePr has an empty run UUID and there is NO RunCompleted: it cannot close build. Preserve that missing terminal, rather than adding one to make the example neat. Test a separate synthetic matching RunCompleted case for bounded build.
    6. Forge evidence is optional and read-only. Scope attribution by repo, exact spec credit, PR, head and check attempt; do not use current-head checks to backfill earlier attempts. Within an evidenced drain CI phase, keep the drain phase envelope authoritative and use verified checks as detail/provenance; outside it, union verified check intervals to fill unknown CI portions without summing parallel jobs. Reject reversed/zero-duration skipped check intervals and unresolved conflicts without erasing valid sibling evidence. PR open is only a milestone. PR merge does not replace store Completed; leave unexplained merge-to-Completed lag unknown. CI ending after completion is clipped/split. Use an injectable bounded fetcher (10s per call, 30s total, bounded pagination/output; exceeding limits marks partial forge coverage). Missing gh, auth/network failure, timeout, malformed JSON, unsupported provider or ambiguous credit keeps local/store evidence intact with one aggregated diagnostic; no live gh in tests, no auth prompts, installs, fetch/sync, PR edits or checks --watch.
    7. Resolve the sketch's open choices: post-completion spans are separate, not a second product metric; unfinished ends at last observed relevant boundary; since/until are rejected. Split any bounded phase straddling final Completed exactly there (BUG-1424 pull starts before Completed). Use separate post_completion_spans with identical row schema, and post_completion_s as the union duration of bounded known post spans, explicitly not an exhaustive post elapsed metric. Unclosed build remains a marker/coverage note. No post span contributes to primary totals.
    8. Freeze one model for all renderers: schema_version=1, view=history-timeline, canonical id, order=oldest-first, observed_start/end, endpoint_kind, as_of, spans, totals_s={work,wait,unknown,elapsed}, incomplete, coverage_notes, post_completion_spans (always array), post_completion_s (always number). Main and post rows retain required {activity,class,start,end,duration_s,source}; class is work|wait|unknown and source is store|events|github|mixed|none. Include evidence references for BOTH boundaries (empty for unsupported evidence); never label unknown as if a source explained its activity. RFC3339 UTC; numeric fractional seconds retained, display rounding only. Human and TOON show identical classification/bounds/totals and explicit incomplete coverage. Diagnostics stay in structured coverage_notes for JSON and never pollute stdout with prose. Existing non-timeline formats/behavior remain unchanged.

    Exact required tests (fixture-based, fixed clocks; names below are REQUIRED NEW tests, not tests I claim already pass)
    - story_1478_drained_bug_1424_two_runs_review_shelve: preserve actual store and event timestamps above, assert 20,877s elapsed, store re-entry cuts park, #2 phases, unknown micro/gap intervals, split pull and unclosed build. Do not hardcode 47m wait or 92m elapsed.
    - story_1478_no_drain_task_1507: actual already-Approved creation, 56,015s elapsed, sparse detection/completion, batch PR credit; no implementer, no queue across InProgress, no inferred full-open-PR wait/work; validate parallel/reversed/post-completion checks.
    - story_1478_rework_retry_and_rereview: attempts, global numbering, exact dedup, retries without false parking.
    - story_1478_shelve_resume_without_phase_terminal: requeue/store re-entry/restart variants, empty UUID and cross-run terminals, stale/reversed/orphan evidence yields unknown.
    - story_1478_precise_store_clock_and_initial_status: seconds, offsets/DST, already Approved, SHA provenance and unchanged history event shape.
    - story_1478_complete_history_compaction_and_dag_conflicts: beyond default limits, compacted/missing Added, stale/partial cache versus git, side-branch conflicts, timestamp ties/skew.
    - story_1478_partition_overlap_reopen_and_post_completion: exact union/conservation, concurrent runs, repeated Completed/reopen, last-observed unfinished envelope, split post work, matching synthetic RunCompleted versus orphan build.
    - story_1478_forge_repo_head_attempt_and_parallel_checks: exact credit, stale head/attempt, batch PR, parallel CI union, invalid sibling check, distinct merge/emission/Completed times.
    - story_1478_missing_gh_and_bad_network_json: missing binary, timeout, auth/network error, invalid payload, bounded pagination; local evidence unchanged and one diagnostic.
    - story_1478_rotated_malformed_and_missing_events: archive/live dedup, malformed lines, absent/unreadable streams, rotation loss without false precision.
    - story_1478_human_toon_json_contract_and_cli_conflicts: stable schema/nullability/arrays, same semantic model, JSON-only stdout, ID/alias/UUID equivalence, flags rejected, bare history unchanged.
    - story_1478_read_only_sources: fake forge allowlist of reads; store HEAD/object bytes, event files and queue/status/lease state unchanged. Normal disposable history-cache behavior is permitted; no new timing store or schema migration required by this feature.

    Implementation validation: cargo test -p aida-cli-lib story_1478; targeted existing history cache/parity/CLI regressions if touched; cargo fmt --all -- --check. Existing task_1507_history_cache_tests.rs tests are cache regressions, NOT the proposed sparse timeline test; no story_1478 tests currently exist. I inspected source/evidence, did not execute future tests or modify code. Scope remains the single-spec read-only view, with no aggregate metrics, new instrumentation, cross-machine event publication, queue/status changes, dispatch or merge.
