title: 'Per-spec timeline: aida history <SPEC> --timeline (work/wait/unknown spans across store, events, PR/CI)'
description: |
  `aida history <SPEC> --timeline` merges three sources into one chronological span list for a spec:
  - aida-store status transitions (git log);
  - the drain events in `.aida/events.jsonl` (phases, CI results, shelve/retry/re-run, merge);
  - the PR and CI timestamps from GitHub, when `gh` is available (skipped cleanly when it is not).

  Each span gets an activity name and a class:
  - **work:** implementer, ci, reviewer, merge, pull, build;
  - **wait:** awaiting approval (filed→approved), queued (approved→first run), shelved/parked, awaiting merge (work done → merged), between runs;
  - **unknown:** a gap that no source explains, shown explicitly rather than hidden.

  ## Acceptance
  - For a drained spec such as BUG-1424, the output lists each span with its start, its duration and its class, marks repeated phases as rework or re-review (`reviewer #2`), and ends with totals: work, wait, unknown, and elapsed time from filing to completion.
  - For a spec worked outside a drain (e.g. TASK-1507), the timeline still renders from the status transitions and PR/CI data, and labels uncovered time as `unknown` instead of folding it into a neighbouring span.
  - Output is human, toon and json. The json form includes per-span `{activity, class, start, end, duration_s, source}` so that the aggregate breakdown story can reuse the same span model.
  - Missing `gh` or a network failure degrades gracefully, with a one-line note.
  - Tests use fixture event and transition streams, covering rework loops, shelve/resume and a spec with no drain events.
