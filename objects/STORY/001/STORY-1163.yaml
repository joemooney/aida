  content: |-
    SLICE-0 SCOPING (investigated 2026-09-15) — bigger + more GitHub-behavior-critical than a binary swap; do it as a REVIEWED drive, one helper at a time, NOT a rushed edit:

    - resolve_forge_cli (lib.rs) IS a safe binary dispatcher: GitHub->resolve_gh_binary, GitLab->resolve_glab_binary. But swapping only the BINARY in a central helper is WRONG — the helpers also build gh-specific argv (`gh pr list --head <b> --state open --json number,statusCheckRollup`) and parse gh JSON. glab has different commands (mr not pr) + JSON. So routing means dispatching to the Forge TRAIT METHOD, not swapping the binary.

    - LANDMINE: the standalone helpers and the trait methods are PARALLEL IMPLEMENTATIONS WITH DIFFERENT RETURN TYPES:
      * probe_ci_state_for_branch(branch) -> CiProbe  VS  Forge::ci_probe_for_branch(branch) -> Result<CiProbeResult>  (GitHubForge impl forge.rs:1340). Different types.
      * detect_open_pr_for_branch / gh_pr_list_first  VS  Forge::change_for_branch -> ChangeLookup.
      * watch_ci_for_context  VS  Forge::watch_ci / stream_ci_for_branch.
      So each swap requires: (a) VERIFY the GitHubForge trait method is byte-equivalent to the standalone helper (same gh argv, same parse, same edge cases) — else GitHub CI detection (used by EVERY drain phase) regresses; (b) MAP the trait's return type back to the standalone type, OR migrate the ~7 callers.

    - RECOMMENDED APPROACH: one helper at a time. Start with probe_ci_state_for_branch: diff it against GitHubForge::ci_probe_for_branch (forge.rs:1340); if equivalent, route probe_ci_state_for_branch through forge_for(root).ci_probe_for_branch + a CiProbeResult->CiProbe adapter, with a test asserting the GitHub path issues the identical gh call. Then repeat for detect_open_pr_* (change_for_branch) and watch_ci_for_context (watch_ci). GitHub byte-identical is the hard acceptance bar; the existing CI/PR-detection tests are the guard.

    - WHY drive + reviewed + fresh (not end-of-marathon): a subtle GitHub regression here breaks CI detection in every drain. This is the load-bearing path. Keystone-reliability -> keyboard + review, per project discipline.
