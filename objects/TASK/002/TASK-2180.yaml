title: ship-batch dry-run plan reads hold twice; unreadable hold shows as 'CI unreadable'
description: |
  aida-cli-lib/src/pr_ship_batch.rs plan_pr (~:267-286): after TASK-2172, read_ci reads the hold label, and plan_pr reads it again for the merge-hold step. That is one extra forge call per PR in a dry run. When the label cannot be read, the plan prints "CI at <sha>: unreadable (could not read the hold label ...)" and then repeats the hold-label error. The inner text is right, but the line is still labelled as CI. Suggestion: in plan_pr, read the hold once and pass `held` to ports.ci_at_head directly.
  Also: wait_for_review (~:500) still ignores read_ci errors with `_ => {}`. This is unchanged behaviour, so a hold-label read error there is retried silently until the review timeout.

  Raised in review of PR-2835: https://github.com/joemooney/aida/pull/2835#issuecomment-6350935978
