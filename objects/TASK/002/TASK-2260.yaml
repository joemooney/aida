title: Warn that untracked files in the primary checkout stop the scheduled promote
description: |
  checkout_skip (dev_autopromote.rs:259) counts any untracked file as dirty, per advisor condition C1. The real primary checkout has 7 untracked paths today (.claude/agents, .claude/launch.json, .claude/loop.md, .claude/output-styles, .claude/routines, .gitmodules, .vscode), so dev-autopromote would skip 'dirty' on every tick there, while ~/bin/aida-autobuild.sh still promotes. Tell the operator to clean or gitignore those paths before deleting the stopgap.

  Raised in review of PR-2850: https://github.com/joemooney/aida/pull/2850#issuecomment-6372674647
