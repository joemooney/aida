title: dev rollback pin overwrites an unreported autopromote failure without the lock
description: |
  aida-cli-lib/src/dev_build.rs:1254 and dev_autopromote.rs pin_rolled_back write autopromote.json unconditionally and without try_lock(live). A Failed record for another SHA with reported=false is replaced, so that failure is never routed; the next tick rebuilds it instead. Keep the pending report or skip the pin in that case, and take the lock.
  Raised in review of PR-2868: https://github.com/joemooney/aida/pull/2868#issuecomment-6379539506
