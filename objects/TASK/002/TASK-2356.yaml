title: Other has_remote(origin) callers still read a seat-clone refusal as 'no origin'
description: |
  PR-2931 (TASK-2350) fixed the review auto-queue only. `git_ops::has_remote` still returns false when host git refuses to run in a seat clone (BUG-2169). Callers that can run from a seat clone may still take a "local-only" path by mistake. Examples: aida-cli-lib/src/status_prs.rs:636, which hides the "open a PR" hint when origin is missing, and aida-cli-lib/src/session_start.rs:1857 (CloneLaunch.has_origin). Check each `has_remote(.., "origin")` caller that can run with a seat-clone cwd, and move the ones that can to `review_gates::origin_remote_presence` / `git_ops::probe_remote`.

  Raised in review of PR-2931: https://github.com/joemooney/aida/pull/2931
