title: Store-free light path for 'aida doctor check loose-objects'
description: |
  'aida doctor check loose-objects' falls through to doctor_multi_agent (doctor_cmd.rs:148), which loads the whole store. BUG-1675 measured that at 44 s under load. disk-headroom, relay-stall and remote-drift each have a light path. Add one here before this check runs as a scheduled guard. Also add tests for the alias normalization (loose-object, git-objects and repack all map to loose-objects; doctor_root.rs:1613), and warn when [doctor.loose_objects] max is not an integer.

  Raised in review of PR-2847: https://github.com/joemooney/aida/pull/2847#issuecomment-6360081887
