title: mailbox_dir_guard refuses a symlinked mailbox directory as 'not a directory'
description: |
  aida-core/src/mailbox.rs mailbox_dir_guard uses std::fs::symlink_metadata, so a mailbox path (.aida/mailbox or the store's mailbox/) that is a symlink to a real directory is refused as "not a directory", and every send and read fails. No current code symlinks these paths, but a user or a future worktree layout might. Follow the link for the is_dir check (fs::metadata), or document and test the refusal.

  Raised in review of PR-2848: https://github.com/joemooney/aida/pull/2848#issuecomment-6365709957
