title: 'NO_SLOT guard residuals: time/xargs prefixes and no-equals assignments (printf -v, read) then export'
description: |
  aida-core/templates/hooks/aida-git-guardrails.sh exits 0 (verified at 9415a864f4) on:
  - printf 'AIDA_CARGO_NO_SLOT=1 make' > x.sh; time . ./x.sh   (time prefix before dot-source; NO_SLOT_CMD_START lacks time)
  - printf 'AIDA_CARGO_NO_SLOT=1 make' > x.sh; xargs -a x.sh env   (env fed its assignment through xargs)
  - printf -v AIDA_CARGO_NO_SLOT 1; export AIDA_CARGO_NO_SLOT   (no '=' anywhere)
  - read AIDA_CARGO_NO_SLOT <<< 1; export AIDA_CARGO_NO_SLOT
  None is named in TASK-2139/2140. Cover the time/xargs prefixes, and block a bare 'export AIDA_CARGO_NO_SLOT' (it exports a value set some other way), or record these as out of scope in the hook comment.

  Raised in review of PR-2837: https://github.com/joemooney/aida/pull/2837#issuecomment-6370512179
