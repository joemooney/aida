title: Cargo-timeout hook make resolver fails open on recipe conditionals
description: |
  aida-core/templates/hooks/aida-cargo-timeout-guard.sh make_targets_skip_cargo: an ifeq/ifdef/ifneq/ifndef line inside a recipe resets owner, so the recipe lines inside the conditional (e.g. cargo test) belong to no target. 'timeout 1h make hello' is then silent. This contradicts the header claim 'anything it cannot resolve still gets the hint'. Fix: exit 1 on any conditional directive, as include already does.

  Raised in review of PR-2801: https://github.com/joemooney/aida/pull/2801#issuecomment-6322555279
