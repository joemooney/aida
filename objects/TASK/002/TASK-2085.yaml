title: mailbox gc --phantoms skips unpadded case-mismatched known recipients (stranded ADVISOR mail)
description: |
  aida-cli-lib/src/mailbox_cmd.rs:899-913: archive_phantom_inboxes re-addresses a known recipient only when the stored `to` is whitespace-padded. Mail stored unpadded to a known id with the wrong case (e.g. `ADVISOR`, which MCP send_message wrote before PR-2805's TASK-1928 fix) is skipped. Message::addressed_to is case-sensitive, so that mail stays stranded and `gc --phantoms` never cleans it. Fix: re-address whenever known_spelling is Some and differs from r, and add a test.

  Raised in review of PR-2805: https://github.com/joemooney/aida/pull/2805#issuecomment-6324144115
