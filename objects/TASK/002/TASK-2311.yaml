title: agent dispatch-health uses the 10-min guard heartbeat bound and tells sandboxed callers to salvage live host implementers
description: |
  aida-cli-lib/src/agent_launch.rs:639 agent_dispatch_health builds its context with build_agent_classify_context, which after PR-2868 (TASK-2280) carries the 10-minute GUARD_HEARTBEAT_TTL_SECS. A host implementer row that is heartbeat-only from a sandbox (session-start rows never re-heartbeat) becomes Stale after 10 minutes. With a dirty worktree, dispatch_report_row then advises "dead agent with dirty worktree; salvage ... before rebriefing" for a live agent. Use for_display(), or report heartbeat-only rows as unverified.

  Raised in review of PR-2868: https://github.com/joemooney/aida/pull/2868#issuecomment-6379961377
