title: Verify codex/agy SessionStart hooks trigger the dead-row gc that ends unverified mail readers
description: |
  STORY-1843 PR2 (TASK-2177 fix) ends dead resumable registry rows from emit_notice_time_line, but only when the hook payload is a SessionStart event (status_awaiting.rs ~1079). Dead rows that no host-side observer collects still count as unverified readers for 24h from a sandboxed sender. The Claude path is covered. Verify that the codex and agy hook shapes reach this gc, or add a host-side trigger.

  Raised in review of PR-2848: https://github.com/joemooney/aida/pull/2848#issuecomment-6368384665
