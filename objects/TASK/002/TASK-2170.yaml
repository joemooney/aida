title: NotDetected AIDA_STORE note does not trim the value
description: |
  aida-cli-lib/src/seat_authority.rs RosterStoreError::NotDetected Display uses std::env::var_os("AIDA_STORE") with a non-empty check but no trim, unlike store_sync::aida_store_override, so a whitespace-only AIDA_STORE adds a spurious 'AIDA_STORE is set' note.

  Raised in review of PR-2831: https://github.com/joemooney/aida/pull/2831#issuecomment-6340353942
