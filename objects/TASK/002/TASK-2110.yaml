title: Seat-clone 'unpushed' count misreads squash-merged, pruned branches as unshipped
description: |
  seat_clone::probe counts commits reachable from any ref in the clone that are on no refs/remotes/origin/* and not in the pinned base (UNPUSHED_COUNT_SCRIPT, aida-cli-lib/src/seat_clone.rs). Take the normal flow: the PR is squash-merged, GitHub deletes the branch, and the seat runs `git fetch --prune`. Every branch commit then reads as unpushed. classify_clone_reap never reaps the clone ("holds N commits origin does not have"), and session end demands --force plus a salvage. The worktree path avoids this with patch-id logic (branch_unshipped_patch_count). This fails safe (it keeps work), but it is noisy. Consider treating a merged PR on the forge for lease.branch, at a head the forge confirms, as shipped. Or document the limitation.

  Raised in review of PR-2806: https://github.com/joemooney/aida/pull/2806#issuecomment-6328262097
