title: Route remaining push -u sites (init_bootstrap, init_cmd, gitlab_project_create) through the config.lock pre-clear and upstream repair
description: |
  These non-test git push -u sites still call git directly, with no clear_sandbox_config_lock pre-clear and no repair_push_upstream: aida-cli-lib/src/init_bootstrap.rs:412, 434 and 509, init_cmd.rs:4641 and 4665, and gitlab_project_create.rs:281. If the sandbox config.lock placeholder is present, the push exits 0 but no upstream is recorded. These sites were not named in TASK-2267 or TASK-2273, so this is a follow-up only.

