title: 'review watch: bound per-change notices, lock files and dispatcher logs'
description: |
  review_watch.rs: Entry.notices gains one entry per stale head while a change is open (validate_state caps it at 256, after which that change's transactions fail). Per-change {key}.lock files and logs/{key}-{token}.log are never pruned. Consider pruning notices for non-current heads and rotating logs. The spec makes locks permanent, so the lock files may be intended.

