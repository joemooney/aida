title: Mandate exclusion re-collection does not retry a dirty-store snapshot
description: |
  collect_on_stable_store (aida-cli-lib/src/pr_cmd.rs ~1866-1885, BUG-2179) retries the mandate exclusion collection only when two clean store snapshots differ. store_snapshot (mandate_traces.rs:80-87) returns Err on a dirty store ("mandate exclusion store has uncommitted evidence"). That Err returns at once through `snapshot()?`, with no retry. This is the exact #2741 failure in the advisor's 2026-10-18 comment on BUG-2179: a concurrent writer dirtied the store mid-scan. The snapshot also covers every ref (show-ref --head, ~5k refs), so on a live multi-agent store a ~30 s scan can still use up all 3 attempts.

  Two possible fixes: a bounded retry on the dirty-store error, or taking the before/after snapshots under with_store_write_lock. Keep it fail-closed after the bound.

  Raised in review of PR-2776: https://github.com/joemooney/aida/pull/2776#issuecomment-6299542117
