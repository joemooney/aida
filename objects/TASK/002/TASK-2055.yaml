title: RosterStoreError::NotDetected should say whether config.toml was missing or named a non-existent store dir
description: |
  aida-cli-lib/src/seat_authority.rs RosterStoreError::NotDetected Display: BUG-2200 acceptance (1) asks for "which path was probed and why it was rejected". The message names the probed start dir but collapses two causes (no .aida/config.toml found in the walk-up, versus a config whose store_path names a directory that does not exist, or a walk-up stopped at a temp root). Naming the config file found and the store path it pointed at would make the diagnosis one step shorter.

  Raised in review of PR-2795: https://github.com/joemooney/aida/pull/2795
