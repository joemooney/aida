title: 'Review watch: a stale pending ready wake disables READY_INTERVAL throttling for its head'
description: |
  aida-cli-lib/src/review_watch.rs throttled()/report(): wakes.retain keeps every key for the current head. Suppose a wake's delivery fails, and then the readiness kind or the approval identity changes on the same head (base moved, so Ready becomes ReadyAfterUpdateBranch; or a new approval). The old unsent wake is then never redelivered and never pruned, so throttled() returns false on every pass and the full live evaluation (CI API, carry-over git, corpus) runs every pass for that head. Prune or supersede stale pending wakes for the head.

  Raised in review of PR-2856: https://github.com/joemooney/aida/pull/2856#issuecomment-6370076755
