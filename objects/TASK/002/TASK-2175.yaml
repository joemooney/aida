title: 'test_git template-dir repair: concurrent readers can see the dir missing mid-repair'
description: |
  ensure_template_dir (aida-cli/tests/support/test_git.rs and the aida-cli-lib / aida-core copies) repairs a partial dir by renaming it aside, then renaming staging into place. Between the two renames a concurrent process may find the dir missing: a git init --template run fails, or a rename-race loser's assert(template_dir_trusted && complete) panics. Only reachable while a partial dir is being repaired.

  Raised in review of PR-2826: https://github.com/joemooney/aida/pull/2826#issuecomment-6342821731
