title: Cross-format review-authority token match only holds while the author pid is alive
description: |
  review_authority::tokens_match_with (aida-cli-lib/src/review_authority.rs:93-115) now treats a legacy-rfc3339 token and an exact linux-starttime token for the same pid as the same identity only when BOTH strictly match the currently live process. When an author token was recorded in legacy form by a pre-upgrade binary and that process has since exited, `aida pr ship`'s self-approval check (lib_part5.rs:3759, mandate.rs:1435) can no longer match it against an exact-form recorder token from the same process. The window is narrow: the binary has to be upgraded mid-session, and the session:/lease: tokens usually overlap anyway. Still, this refusal path should not depend on liveness. Consider normalising both tokens to the same scheme at record time, or noting the residual.

  Raised in review of PR-2735 (BUG-2130).
