title: Recalibrate per-test nextest budgets from more runs once the test lanes gate
description: |
  scripts/test-time-budget.toml was calibrated from only 3 nextest shadow runs on main. A test whose max measured time is under about 6.7s (x1.5 stays under the default) gets no entry and must stay under the hard 10s default_limit. Under nextest's num-cpus parallel load, the wall-clock-sensitive integration tests (bug_1594_show_bounded, bug_1956_*, bug_1993_*) may drift over it and fail the Test time budget step. Recalibrate from more gating runs.

  Raised in review of PR-2785: https://github.com/joemooney/aida/pull/2785#issuecomment-6300385815
