title: Add session-end and reap tests for a seat clone with submodules (PR-2806 round 7 coverage gap)
description: |
  The doc comment on task_2053_bwrap_submodule_ignore_dirty_keeps_the_clone (aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs) says session end, dismiss and reap all keep a clone with submodules, but the test calls only probe and destroy. A session-end test would have caught the non-exhaustive Probe match at session_end.rs:1052 (E0004) that broke b0b654a. Add: session end on a clone with submodules keeps the clone, lease and pin and runs no host git; classify_clone_reap given a real HasSubmodules probe returns Skip.

  Raised in review of PR-2806: https://github.com/joemooney/aida/pull/2806#issuecomment-6335235608
