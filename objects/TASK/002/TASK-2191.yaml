title: ensure_implementer_branch_pushed hard-fails phase 2 for clone-seat implementers; route through seat_clone::probe before S4c
description: |
  aida-cli-lib/src/orchestrator_leases.rs:1069: after S4a, git_output_checked(branch --show-current) and the push both refuse a seat clone. An orchestrated drive with seat_tree=clone therefore always fails phase 2 with 'could not verify implementer branch', even when the seat pushed. This is safe while clone seats are opt-in. S4b/S4c must read branch and unpushed state through seat_clone::probe (no host push) before the default flips.

  Raised in review of PR-2833: https://github.com/joemooney/aida/pull/2833#issuecomment-6359870563
