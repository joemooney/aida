title: 'run_emergency_probed: partial run (deletes then refusal) never saves last_emergency_refusal, so the repeat refusal re-notifies as new'
description: |
  aida-cli-lib/src/disk_emergency.rs run_emergency_probed (TASK-1-484 fix, PR-2893): the dedupe state block is gated on outcome.deleted.is_empty(), so a run that deleted something AND ended Stop::Refused never records last_emergency_refusal. The next nothing-deleted tick carrying the same refusal compares against the stale/None value and notifies again as a "new" refusal. One extra notification; arguably still news. A one-line gate tweak (save last_emergency_refusal whenever outcome.refusal.is_some()) closes it if it ever annoys.

  Raised in review of PR-2893: https://github.com/joemooney/aida/pull/2893#issuecomment-6382019618
