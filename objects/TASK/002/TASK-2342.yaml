title: 'STORY-1917: mandate statusline shows only one scope, hiding live dispatch authority and disagreeing with status_text'
description: |
  mandate::status_line (aida-cli-lib/src/mandate.rs:1964-1975) reports only one scope for a non-drive mandate:

  - a '--ship-held --scope dispatch' mandate prints 'MANDATE ship-held', hiding that dispatch authority is live
  - a multi-scope non-ship mandate prints only effective_scopes().iter().next(), e.g. 'dispatch' for {Dispatch, RelayRestart}

  mandate::status_text (aida-cli-lib/src/mandate.rs:2083-2091) correctly joins every scope, so the one-line statusline and 'aida mandate status' disagree about the same mandate's authority. The statusline is the surface an operator sees on every hook fire.

  The unwrap_or(SCOPE_SHIP_HELD) fallback at the end is unreachable (effective_scopes never returns empty) but, in wording, would display ship-held for a mandate covering nothing.

  Fix: join all scopes in status_line as status_text does, abbreviating if the width budget requires it.

  Raised in review of PR-2905: https://github.com/joemooney/aida/pull/2905#issuecomment-6390394038
