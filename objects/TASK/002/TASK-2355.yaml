title: aida ship commits sandbox-masked placeholder files in a seat clone, then the rebase aborts
description: |
  In the TASK-2350 seat clone (Claude Code sandbox), `aida ship TASK-2350 --no-merge` step 1 ("commit uncommitted work") ran `git add` on untracked sandbox deny-mask placeholders: empty read-only `.gitmodules`, `.idea`, `.vscode`, `.claude/agents`, `.claude/launch.json`, `.claude/loop.md`, `.claude/output-styles`, `.claude/routines`, `.claude/scheduled_tasks.json`. It committed them as `feat: implement TASK-2350 (TASK-2350)` (9 files, 0 lines). Step 2's rebase then failed: git could not unlink the bind-mounted placeholders ("Device or resource busy"), so it reported "untracked working tree files would be overwritten", and the abort itself failed ("could not move back to <sha>"). The worktree was left mid-rebase, even though ship printed "aborted, worktree left clean."

  Recovery: drop the junk pick from .git/rebase-merge/git-rebase-todo, then `git rebase --continue`.

  Suggested fix: ship's auto-commit should leave untracked sandbox mask entries alone (zero-byte read-only bind mounts; the seat's denyWithinAllow paths) or stage only tracked changes. Its abort path should also check that the rebase really ended before printing "worktree left clean".

  Raised by the implementer while working TASK-2350.
