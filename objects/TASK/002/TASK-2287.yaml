title: aida-fire fixer prompt STOPs on the branch the advisor's worktree add created
description: |
  aida-core/templates/skills/aida-fire.md, fixer prompt template: "Claim the spec first (`aida claim <SPEC-ID>`). If it is already claimed or has a branch or PR, STOP and report." PR-2865 has the advisor pre-create the fixer's worktree with `aida worktree add <SPEC-ID> --role implementer`, which creates the branch. A fixer that follows the prompt literally stops on its own branch. Reword it to "an unmerged branch or open PR other than this worktree's branch".

  Raised in review of PR-2865: https://github.com/joemooney/aida/pull/2865#issuecomment-6377323914
