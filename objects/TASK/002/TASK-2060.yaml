title: mandate_traces closure misses trait-mediated uses (use Trait / as _ / derive)
description: |
  A changed 'use some::Trait;', 'use x::Trait as _;' or '#[derive]' now narrows to the units that name the ident, so same-file method callers are dropped. Before, it fell back to the full file. The ac2_attribute_only_change test asserts the narrowing.

