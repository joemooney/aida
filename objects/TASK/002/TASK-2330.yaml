title: Add a direct label-only-hold case to the BUG-2216 auto-release fallback suite
description: |
  BUG-2216's acceptance names label-only among the hold kinds the no-history fallback must never release. The auto-release fallback suite (aida-cli-lib/src/tests/bug_2186_archived_history_release_tests.rs, only_rework_holds_release_on_the_markers_evidence) covers Recusal, Supervision, Decision and legacy markers, but has no direct label-only case. It is safe by construction today (a label with no typed marker never reaches eligible() — auto_release finds no hold record) and the train-side bug_2214_a_label_only_hold_stays_human_even_under_a_mandate covers the stance, but a direct auto-release test would pin the behavior against future marker-less paths.

  Raised in review of PR-2899: https://github.com/joemooney/aida/pull/2899#issuecomment-6387131107
