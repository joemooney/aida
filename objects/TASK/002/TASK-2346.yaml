title: Remove redundant native-session lookup in decide() (STORY-1843 PR-2909)
description: |
  ## Problem

  In `aida-cli-lib/src/agent_handle.rs::decide`, a second native-session lookup after the explicit-name branch duplicates the early native-resume lookup. The later block is reachable when the first lookup finds no reservation; describing it as literally unreachable is incorrect. Its successful result is redundant for cooperating reservation writers under the namespace lock held by `reserve_handle`. `preview_handle` is intentionally unlocked and best effort; the actual reservation redecides under the lock. Raw same-UID writes are outside this cooperating-writer proof.

  This records the already-approved advisor source ruling of 2026-10-25T10:46:02Z in the description so a card-only reader receives the corrected proof. It does not change the signed cleanup scope.

  ## Acceptance

  - Remove only the redundant later native-session lookup. Preserve the early native resume fast path, explicit-name collision/refusal behavior, reservation ownership/recipient behavior, bounded generation probes and counters.
  - Explain the locked cooperating-writer snapshot and best-effort preview rationale accurately in the nearby comment and PR description. Do not claim literal unreachability or freshness for preview.
  - Do not change TTL, lock scope/order, identity, grant, counter format or liveness policy, and do not add locking to preview.
  - Retain the existing allocation-skips-live/session-recipient, explicit-collision, resumed-child, named-resume, retired-resume and bounded-probe coverage named in the signed source ruling. Use one meaningful `agent_handle` filtered run plus `make check-ci-fast`; no source-text mirror test or unexplained wall-clock test is needed for this deletion.
  - Complete only after an independently reviewed current-head PR, green required CI and integration. This task supplies no full STORY-1843 completion credit.

  Raised in review of PR-2909: https://github.com/joemooney/aida/pull/2909#issuecomment-6390882870. The original finding and the corrected source proof remain in the comment history.
