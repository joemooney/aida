title: Dead native-session lookup branch in decide() (STORY-1843 PR-2909)
description: |
  In aida-cli-lib/src/agent_handle.rs decide(), the second native_session_id lookup (the `if let Some(sid) = req.native_session_id.filter(...)` block that appears after the `if let Some(name) = req.explicit` branch) is unreachable:

  - When req.explicit.is_none(), the block added at the TOP of decide() already resolves reservation_of_session and returns early for the same native_session_id case.
  - When req.explicit.is_some(), the explicit branch always returns (bail or Ok) before reaching the second block.

  So the later block never executes. Harmless but dead; removing it makes the control flow honest. Cosmetic.

  Raised in review of PR-2909: https://github.com/joemooney/aida/pull/2909#issuecomment-6390882870
