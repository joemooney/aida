title: BUG-2130 tests assert linux-starttime unconditionally; seat_occupancy keeps a redundant equality arm
description: |
  1) The new tests assert `starts_with("linux-starttime:")` without a #[cfg(target_os = "linux")] gate: aida-core/src/liveness.rs bug_2130_exact_start_identity_survives_btime_shift, plus several tests in aida-cli-lib/src/tests/bug_2130_liveness_identity_tests.rs. On non-Linux, process_start_identity returns sysinfo-start:. AIDA is Linux-only, so this is cosmetic.
  2) In aida-cli-lib/src/seat_occupancy/runtime.rs lease_scope_for_own, `start(pid).as_deref() == Some(rec) || strict_match(pid, rec)` is now redundant on its first arm, because strict_match covers both formats. That leaves the `start` parameter nearly vestigial.

  Raised in review of PR-2735 (BUG-2130).
