title: 'Mailbox resolver: a live agent named like a role makes role mail ambiguous'
description: |
  mailbox_resolver.rs resolve() counts a live agent whose name equals a role, vendor or person in its ambiguity sum. An agent launched with -n advisor makes '--to advisor' refuse for every sender. Name reservation is planned for PR2; until then, pin the behavior with a test or ignore reserved-name agents in the name branch.

  Raised in review of PR-2808: https://github.com/joemooney/aida/pull/2808#issuecomment-6331976477
