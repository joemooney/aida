title: 'close_verdict_on_merge: an archive write I/O failure after the current-file write still strands the archive open'
description: |
  review_verdict.rs close_verdict_on_merge (~L2427-2431). TASK-1671 moved prepare_archive_round ahead of the current-file write, so a refused archive entry now fails before anything is written. The archive's own write_verdict_atomic still runs after the current file is written, though. If it fails with an I/O error, the current file is left closed and the archive open, and a re-run returns already_closed, so the archive stays open and verdicts_for_sha keeps reporting the refusal as open. Fix: when the current file is already closed, also close its archive entry at that reviewed sha if it is still open.

  Raised in review of PR-2820: https://github.com/joemooney/aida/pull/2820#issuecomment-6332530277
