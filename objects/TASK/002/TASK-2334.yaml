title: Emergency scratch tier is inert without a claude-* TMPDIR ancestor in the guard process env
description: |
  scratch_at_hard_ceiling (TASK-2325, PR-2906) derives the session-scratch root from the guard process's OWN $TMPDIR via scratch_reclaim::tmp_root_from. A scheduled disk-guard tick typically runs without TMPDIR (or with a non-claude TMPDIR), so tmp_root is None and the (b) session-scratch arm never fires at the hard ceiling in production — the exact 74 GiB /tmp/claude-1000 case that motivated TASK-2325 would not be reclaimed by the emergency path. Consider discovering claude-<uid> roots under the system tmp dir (e.g. /tmp/claude-*) instead of relying on the caller's env, with the same age + own-session rails.

  Raised in review of PR-2906: https://github.com/joemooney/aida/pull/2906#issuecomment-6388225690
