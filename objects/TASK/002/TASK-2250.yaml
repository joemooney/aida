title: dev activate in a worktree exports AIDA_DEV_REPO=<worktree>, which goes stale when the worktree is removed
description: |
  After BUG-2210, `aida dev activate` run inside a worktree resolves that worktree and exports AIDA_DEV_REPO=<worktree> (dev_cmd.rs, the `export AIDA_DEV_REPO=` line in handle_dev_activate). When the worktree is removed later, an activate from outside any checkout resolves via $AIDA_DEV_REPO and fails with "not a joemooney/aida checkout" until the shell re-runs shell-init. Consider leaving the primary $AIDA_DEV_REPO in place when activating from a worktree, or falling back to the primary checkout when the env path no longer exists.

  Raised in review of PR-2857: https://github.com/joemooney/aida/pull/2857
