title: Pin whitespace-only AIDA_STORE → no seat-check note (TASK-2170 test gap)
description: |
  aida-cli-lib/src/store_sync.rs:352 aida_store_setting trims AIDA_STORE and returns None when it is blank. That is the behavior TASK-2170 asked for, but no test asserts it. The task_2170 test injects the lookup, so it never exercises the trim. Add a test for the trim/blank classification, for example by splitting out a pure `aida_store_setting_from(raw: &str)`, so a regression can't bring back the spurious "AIDA_STORE is set" note.

  Raised in review of PR-2840: https://github.com/joemooney/aida/pull/2840#issuecomment-6363783539
