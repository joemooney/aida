title: Test worktree dismiss on a hand-removed seat clone (the session-end submodule recovery path)
description: |
  session_end.rs:1060 refuses a seat clone with submodules and tells the operator to remove the clone by hand, then run aida worktree dismiss <clone> to release the lease and base pin. No test covers that recovery: dismiss on an already-removed clone directory whose lease and pin still exist. Add a bwrap test that removes the clone, runs handle_dismiss, and asserts the lease, pin and target dir are released.

