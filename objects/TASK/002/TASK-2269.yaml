title: branch -D under a re-created config.lock placeholder leaves a stale branch config section
description: |
  output_healing_config_lock retries only when the command fails. git branch -D deletes the ref and exits 0, with only a config-lock warning, when the placeholder comes back after the pre-clear, so nothing retries and branch.<name>.* stays in .git/config. Consider retrying 'git config --remove-section branch.<name>' when stderr shows a lock refusal. Race-only.

  Raised in review of PR-2863: https://github.com/joemooney/aida/pull/2863#issuecomment-6374966299
