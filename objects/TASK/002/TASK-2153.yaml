title: Adopted fallback merge-hold markers lose their placement event (TASK-1406 follow-up)
description: |
  On the contained-writer fallback in merge_hold.rs write_marker, the marker and its MergeHoldChanged placement event are written to the worktree. BUG-2176 adoption later moves the marker to the primary but not the event. Since unrecorded_marker_removals and lane-liveness now read only the primary's log, a hand-deleted adopted marker is not detected as tampering, and lane-liveness falls back to the marker mtime. The PR-2822 body acknowledges this. It pairs with TASK-2138.

  Raised in review of PR-2822: https://github.com/joemooney/aida/pull/2822#issuecomment-6337514011
