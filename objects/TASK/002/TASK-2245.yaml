title: 'TASK-2001 ratchet: a remote verb held in a local args array is never checked (queue_cmd recover_push_branch)'
description: |
  task_2001_unrouted_remote_calls (aida-cli-lib/src/tests/bug_2181_host_remote_credentials_tests.rs) matches VERB only against a literal first element of .args([...]). queue_cmd.rs:14619 recover_push_branch builds let args = ["push", "-u", "--", "origin", branch] and calls .args(args).remote_credentials(repo, "origin") (14632-14636). The function has no remote parameter, so if its routing is dropped the ratchet stays green. It is the only such site in the workspace today. Fix: resolve a local array binding before matching VERB, or require a marker on .args(<ident>) builders.

  Raised in review of PR-2837: https://github.com/joemooney/aida/pull/2837#issuecomment-6370512179
