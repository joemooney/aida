title: Child agent identity labels now override lane names for implementer launches
description: |
  apply_child_agent_identity (aida-cli-lib/src/session.rs, called from spawn_vendor_headless_with_seat_granted and build_exec_vendor_headless_command) sets AIDA_AGENT_TYPE/NAME for every seat, not just reviewer. Implementer children launched from an `aida agent new` lane now get AIDA_AGENT_NAME=<vendor>-implementer instead of inheriting the lane name. BUG-2010 lease attribution is skipped for children that don't claim their own lease, so impact looks nil, but this wider scope is undocumented and untested. Confirm it's intended and pin it with a test, or limit it to reviewer launches.

  Raised in review of PR-2781: https://github.com/joemooney/aida/pull/2781#issuecomment-6316283635
