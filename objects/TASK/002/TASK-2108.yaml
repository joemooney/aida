title: 'Reviewer reap: accept the forge''s current PR head, not only the recorded pr_head_sha (TASK-2095 follow-up)'
description: |
  session_reap.rs review_branch_within_pr_head only reaps when the review branch tip equals, or is an ancestor of, the lease's recorded pr_head_sha. A reviewer that pushed a fix-forward (tip past the recorded head) and a lease with no pr_head_sha are never reaped, so BUG-2206's leak persists for them. TASK-2095 allowed the remote PR head as an alternative.

  Raised in review of PR-2814: https://github.com/joemooney/aida/pull/2814#issuecomment-6327894451
