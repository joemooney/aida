title: Headless reviewer sandbox mounts primary .aida/review-verdicts read-only, so the phase-3 handshake cannot be written
description: |
  During the headless review of PR-2757 (launched with AIDA_REVIEW_VERDICT_FILE=/home/joe/ai/aida/.aida/review-verdicts/PR-2757.json), `aida review record TASK-1944 --pr 2757 --verdict approved --sha 960fbf0421...` recorded the per-spec verdict in the review worktree (.aida/review-verdicts/TASK-1944.json), then failed with: "the phase-3 handshake was NOT written to /home/joe/ai/aida/.aida/review-verdicts/PR-2757.json".

  Cause: the reviewer's Bash sandbox write allow-list covers /home/joe/ai/aida/.git, .aida-store and .aida/cache.db*, but not /home/joe/ai/aida/.aida/review-verdicts/. `touch` there returns "Read-only file system". So no sandboxed reviewer can write the verdict anchor its launcher sets, and a finished review becomes invisible to the orchestrator.

  Also observed: the first record attempt hit BUG-2187 (no AIDA_AGENT_TYPE set); it succeeded after setting AIDA_AGENT_TYPE=claude.

  Fix: add the primary's .aida/review-verdicts (and probably .aida/merge-holds) to the reviewer seat's sandbox write roots. Add a test that a contained reviewer can write AIDA_REVIEW_VERDICT_FILE.

  Raised in review of PR-2757: https://github.com/joemooney/aida/pull/2757
