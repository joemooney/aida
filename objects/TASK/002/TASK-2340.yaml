title: 'STORY-1917: dispatch refusals on mandate scope leave no ledger row despite the ''each request leaves a ledger row'' acceptance'
description: |
  STORY-1917 acceptance says 'each request leaves a ledger row', and the signed SKETCH v1 section 5.3 says 'Every request write, start, completion, and refusal appends an audit event'.

  check_request_authority (aida-cli-lib/src/dispatch.rs:880-922) bails on all five mandate-state paths before reaching any emit_dispatch_event call:
  - no active mandate
  - mandate expired
  - mandate stopped
  - mandate does not cover Scope::Dispatch
  - mandate does not cover Scope::ShipHeld (shipping flow/train)

  The first three have no mandate id to attribute, which plausibly justifies the omission. The last two already hold mandate.id in scope and could emit an Outcome::Refused row at no cost.

  human_gates_gate_dispatch_and_ship_with_gated_audit_rows:818 asserts exactly 2 Gated rows, which pins the current behaviour; that assertion needs updating alongside any fix.

  Raised in review of PR-2905: https://github.com/joemooney/aida/pull/2905#issuecomment-6390394038
