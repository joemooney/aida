title: Default clone seat refuses a contained launch when origin is unreachable; plan doc overclaims no new refusals
description: |
  With `[contained] seat_tree` unset (the default is now clone, TASK-2053 S4c), a contained launch runs `git clone --reference <main> <origin_url>` (aida-cli-lib/src/seat_clone.rs:422-429). When origin is configured but unreachable (offline host, stale or bad URL, credential failure), the clone fails and session start refuses, following O1's no-fallback rule. Before the flip, the same launch got a worktree and worked.

  Ruling 2 handles only a MISSING origin, by falling back with a note. Either extend that to an unreachable origin under the default knob (with a note), or document it: the plan doc's "The flip never turns a working contained launch into a refusal" (docs/plans/2026-10-16-bug-2169-contained-clone.md, S4c as built) overclaims, and docs/release-notes/2026-10-contained-seat-clone-default.md should say that origin must be reachable at launch.

  Raised in review of PR-2839: https://github.com/joemooney/aida/pull/2839#issuecomment-6378149711
