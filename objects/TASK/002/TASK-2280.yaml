title: Heartbeat liveness fallback makes crashed host sessions look live to sandboxed launch/advisor guards
description: |
  PR-2860 (BUG-2212) put the heartbeat fallback in view_for, so it reaches every list_agent_views consumer, not only `agent ls`. From an isolated PID namespace, a host session that crashed without setting ended_at still reads as live for up to UNOBSERVED_HEARTBEAT_TTL_SECS (24h) in:
  - agent_launch.rs matching_live_duplicate: a false duplicate-launch refusal
  - supervise_cmd.rs:291 live_advisor_recipient: nudges go to a dead advisor
  - terminal_cmd.rs resolve_session_target
  These fail closed, but no test covers them. Decide whether the guards should treat LivenessBasis::Heartbeat rows differently, for example a shorter window or an explicit "unverified" result.

  Raised in review of PR-2860: https://github.com/joemooney/aida/pull/2860#issuecomment-6375776160
