  author: claude
  content: 'Kept separate from STORY-1688 (advisor ruling 2026-10-20 13:20). STORY-1688 and this task overlap in one place: when a rework push moves a PR''s head past its Rework merge hold and CI goes green, lane-liveness reports `unpicked-ready-pr:PR-<n>@<sha8>` and wakes the reviewer seat. It does not change the spec''s status. This task still owns that status change (NeedsAttention back to an in-review state with PR, head and round) and the last-activity column in `aida list`. There is still no head-push event; lane-liveness only sees the new head through `gh pr list` each tick.'
