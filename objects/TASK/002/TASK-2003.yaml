title: NeedsAttention never clears on a rework push, so the needs-attention list hides active work
description: 'Observed 2026-10-20 05:45 (operator: ''why does this list look like nothing is happening?''). A review refusal or merge hold sets NeedsAttention, and it stays set until the PR merges. A rework push, re-review or green CI never moves the spec back to In Progress or In Review, so a spec in its final round looks the same as an abandoned one. Acceptance: when a new head is pushed on a PR whose spec is NeedsAttention, the spec shows an in-review state with the PR, head SHA and round; it goes back to NeedsAttention only on a new refusal; aida list shows the last activity time for each spec. Fold into STORY-1688 (lane liveness) if that fits better.'
