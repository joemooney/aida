title: 'lane-liveness: operator gate findings marked routed when [notify] is unconfigured'
description: |
  route_findings (aida-cli-lib/src/lane_liveness.rs:620-633) treats send_direct_bounded Ok with suppressed == 0 as delivered. When no trusted [notify] command is set, it returns DirectNotifyOutcome::default() (configured=false, sent=0), so a human-only hold is recorded in routed.json, reaches nobody, and is never retried. This repo has no [notify] section. Record the finding only when sent > 0 or pending > 0, and fall back to the advisor seat (or warn) when notify is unconfigured.

  Raised in review of PR-2743: https://github.com/joemooney/aida/pull/2743#issuecomment-6303344372
