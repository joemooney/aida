title: 'contained_safety_scan: pin core.quotePath=true so the added submodule line matches git''s quoting'
description: |
  aida-core/src/git_ops.rs:3871 runs git status --porcelain without -c core.quotePath=true, but porcelain_quote assumes quotePath=true. Under a user core.quotePath=false, git prints non-ASCII paths raw while the added ' M' line is C-quoted, so the two lines are formatted differently (the TASK-1943 symptom). Dedupe still works.

  Raised in review of PR-2827: https://github.com/joemooney/aida/pull/2827#issuecomment-6336460966
