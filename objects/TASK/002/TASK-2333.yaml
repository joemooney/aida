title: 'Scratch reclaim: ''live session'' protection is own-session + mtime only — decide whether other live-but-idle sessions need lease-based protection'
description: |
  scratch_reclaim::plan_tmp (TASK-2325, PR-2906) protects session scratch under the TMPDIR root by two rails only: the CALLING session's own dir (survey.live_session_dirs) and the mtime age window. Another session that is still alive but has not written for >N days (default 3) has its scratch listed and deleted by --apply / the emergency tier. The module doc acknowledges the tradeoff, but there is a stronger liveness source available (session leases / aida ps). Decide whether live_session_dirs should be populated from lease liveness, or record the mtime-only tradeoff as an accepted decision.

  Raised in review of PR-2906: https://github.com/joemooney/aida/pull/2906#issuecomment-6388225690
