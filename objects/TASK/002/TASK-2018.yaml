title: Extend git auto-maintenance ratchet to split-statement argv and shell/Python test files
description: |
  tests/test_git_maintenance_ratchet.py (BUG-2191) misses two shapes, which docs/testing/bug-2118-history-fixture-object-write.md lists as known exclusions: (1) split statements and variable argv, e.g. `let mut c = Command::new("git"); c.arg("commit")`; (2) tests/*.sh and tests/*.py fixtures that still run bare `git commit`, e.g. tests/test_distributed.sh and tests/test_cache_refresh_outputs.py. So a new fixture written in either shape gets past the guard. Follow-up: cover both shapes, or migrate those fixtures and add a simple grep ratchet for the scripts. The 46 baselined sites (production helpers like host_git_command, regen git, and aida-tui) also still need to drain.

  Raised in review of PR-2779: https://github.com/joemooney/aida/pull/2779
