title: verify_linked_worktree_main returns Ok when the tree's .git is a directory or a dir symlink (redirectable main)
description: |
  aida-cli-lib/src/session.rs verify_linked_worktree_main returns Ok early when <tree>/.git is not a regular file. A .git directory holding a commondir that names another repo's .git, or a .git symlink to another repo's .git directory, makes git worktree list (so main_worktree_root_from) report the other repo. claude_contained_settings_json would then grant that repo's .aida-store and cache. I reproduced the git redirect locally. Today the precondition (replacing the pointer file) is blocked by the TASK-1989 pointer deny, so this is defense in depth. Fix: when .git is not a file and the tree is not main itself, require a host-recorded seat clone or refuse. Add a fixture for each shape.

  Raised in review of PR-2813: https://github.com/joemooney/aida/pull/2813#issuecomment-6328499931
