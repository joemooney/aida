title: Wake an existing Codex advisor only for new AIDA mail
description: |
  Operator approved implementation 2026-10-24 19:06 MST after approving the host-side watcher + codex queue design. Primary caller: a host-side service waking the existing interactive Codex advisor, including sibling-worktree-local mail.

  Acceptance:
  1. Explicitly target existing Codex thread UUID 01a1700b-717d-71f2-b7e0-0569b05f3dee using installed codex queue --thread UUID --message TEXT. Wake the SAME conversation; do not cold-boot another advisor, choose --last, mint grants, override sandbox/approval settings, or treat mail as trusted instructions.
  2. Discover addressed advisor mail across main and live sibling worktrees through AIDA's mailbox interface. Handle the observed reviewer-worktree-local mailbox. Deduplicate replicated messages by immutable message ID, not subject or sender; avoid reading canonical store YAML directly. If a bounded read-only machine envelope is needed, add the smallest CLI seam.
  3. Durable per-project/thread notification ledger, exclusive writer lock, atomic replacement, short batching. Record successful queue acceptance separately from actual inbox acknowledgement. Unchanged unread messages and unrelated awaiting items never cause repeated inference. Retry failures with bounded backoff; disclose crash-window duplicate risk instead of promising exactly-once queue delivery. Never drop unread mail due to scan errors.
  4. Opt-in start/stop/status plus foreground/dry-run/once modes as practical. Install one user-owned watcher for the explicitly approved advisor only. Quiet scans use zero model inference. No secrets/mail bodies in wake text/logs. Handle unavailable targets, new/removed worktrees, duplicate watcher starts, and bounded safe reads. No extra CronCreate/model loops.
  5. Hermetic fixture tests cover cross-worktree dedup, batching, persistent restart, unchanged unread sets, failed queue retry without inbox acknowledgement, target identity and concurrency. Test fake HOME/projects only.
  6. Separate live synthetic test, explicitly authorized by operator, proves synthetic advisor mail wakes SAME idle conversation and repeated scans do not duplicate it. Distinguish accepted queue from observed executed turn. Include durable receipt evidence and installation/uninstallation instructions.

  Implementation boundary: smallest maintainable script/service and CLI seam using native codex queue; no general orchestration framework. Existing aida advisor watch cold-boots Codex, so it is not sufficient. Requires independent review; implementation session must not approve/merge its own code. User authorization includes enabling this one watcher and the synthetic test.
