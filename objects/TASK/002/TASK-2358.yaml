attention_reason:
  category: blocked-dependency
  detail: 'Root cause is outside this repo. The seat launcher already pre-creates the dir for clone seats (aida-cli-lib/src/session_start.rs:2779, BUG-2169 S2, since 2026-10-21). In seat 2351 the dir was created at launch (19:44:20Z) and then DELETED by the host reaper: journalctl --user -u aida-cargo-reap shows at 12:46:01 local ''reaped 0B aida-seat-aida-task-2351 (no-worktree)'' (and ''reaped 9.6G aida-seat-aida-task-2348 (no-worktree)''). /home/joe/ai/aida-host/bin/cargo-reap (30-min systemd timer, --apply) builds its ownership map only from ''git worktree list''; AIDA seat clones (tree_kind=clone) are independent clones, not linked worktrees, so every seat target is classified no-worktree and reaped with NO age gate (bin/cargo-reap ~line 412). The sandbox then cannot recreate it because target/worktrees/ is read-only. aida-host is a separate repo (gitlab ai/aida-host) outside this seat''s write sandbox, so I cannot fix it here. Current seats 2356/2358/2359 are exposed to the next reaper run.'
  lean: 'Fix in aida-host bin/cargo-reap: (1) treat a target/worktrees/<name> as owned when <worktree-parent>/<name> exists as an aida-seat-* clone or a lease in <main>/.aida/sessions/*.toml has worktree_path ending in /<name> (or cargo_target_dir == tdir); (2) age-gate the no-worktree reason (e.g. >= merged_idle_hours since newest mtime) so a fresh empty dir is never reaped. No aida-repo change is needed; close TASK-2358 once the aida-host fix lands.'
