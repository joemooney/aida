title: Sandboxed seat cannot create its CARGO_TARGET_DIR under target/worktrees/
description: |
  In seat aida-seat-aida-task-2351, CARGO_TARGET_DIR=/home/joe/ai/aida/target/worktrees/aida-seat-aida-task-2351 didn't exist. The sandbox allows writes to that path but not to its parent, so cargo (and `mkdir -p`) failed with "Read-only file system (os error 30)". This broke `cargo test` and `make check-ci-fast` until I set CARGO_TARGET_DIR=$TMPDIR/target, which then needed a cold full build (~30 min). The seat launcher should pre-create the target dir before entering the sandbox.

  Raised by the implementer while working TASK-2351.
