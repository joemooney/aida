title: Autopromote child exits non-zero on a refusal, so its systemd unit shows failed
description: |
  handle_child (aida-cli-lib/src/dev_autopromote.rs:879-910) returns the PromotionRefused Err after logging 'refused'. So 'aida dev build --autopromote-child' exits 1, and the transient systemd user unit is listed by 'systemctl --user --failed', although the state record and log say refused (not a failure). Return Ok(()) for a refusal and assert it at handle_child level.

  Raised in review of PR-2850: https://github.com/joemooney/aida/pull/2850#issuecomment-6377435068
