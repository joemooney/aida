title: Strengthen task_1981_release_status_failure_prevents_publication to prove no push
description: |
  aida-cli-lib/src/upgrade_release.rs (mod task_1981_release_status_tests): the test sets up no origin remote and only asserts `.git/refs/heads/main` is absent. That is always true in a repo with no commits. It proves the git-status error propagates out of sync_dev_release_store, but not that publication is skipped. Add a bare origin, as the shared task_1981_publication_tests.rs Fixture does, and assert its refs stay empty.

  Raised in review of PR-2796: https://github.com/joemooney/aida/pull/2796#issuecomment-6314305681
