title: 'transport: show fails entirely when origin lookup errors'
description: |
  `aida config transport show` computes `origin_matches` via
  `origin_fingerprint(root)` and propagates its error
  (aida-cli-lib/src/transport_profile.rs, `show()`), so when origin is removed,
  has multiple URLs, a divergent push URL, or mirror mode, `show` errors instead
  of displaying the enrolled profile — the diagnostic surface disappears exactly
  when the operator needs it to understand why push/pull refuses. Suggest:
  degrade to `origin_matches: false` (or null) with a safe reason string while
  still printing the profile and limitations. Planning refusals should keep
  failing closed; only `show` needs to degrade.

  Raised in review of PR-2904: https://github.com/joemooney/aida/pull/2904#issuecomment-6389521042
