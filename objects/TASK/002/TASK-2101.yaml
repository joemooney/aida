title: drop_unpushed_claim_commit reports a claim commit dropped when rollback removed nothing
description: |
  coordination.rs:904-911 (PR-2809, TASK-2069): drop_unpushed_claim_commit maps rollback_commit_if_head_matches' Ok(false) to Ok(()). That Ok(false) also covers 'claim_sha no longer an ancestor of HEAD' (a peer's pull --rebase rewrote it) and 'rebase conflicted and was aborted'. In both cases nothing was removed, so the unpushed claim commit stays local while the caller is told it was dropped. Verify removal (is_ancestor or the claim file) and surface it when nothing was dropped.

  Raised in review of PR-2809: https://github.com/joemooney/aida/pull/2809#issuecomment-6327023259
