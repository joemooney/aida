title: Test that aida ship step 1 stages tracked changes only (git add -u)
description: |
  PR-2932 (TASK-2351) changed aida ship step 1 from `git add -A` to `git add -u` (aida-cli-lib/src/pr_cmd.rs:1352). The new unit tests cover only the probes (tracked_changes_pending, untracked_regular_files, untracked_left_out_note), so reverting the staging flag to -A would still pass every test. Add an end-to-end step-1 test: a repo with a tracked edit and an untracked stray file. After step 1, HEAD should contain the edit and the stray file should still be untracked.

  Raised in review of PR-2932: https://github.com/joemooney/aida/pull/2932#issuecomment-6403120664
