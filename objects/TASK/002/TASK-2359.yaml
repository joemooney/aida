  content: |-
    Implementer finding (kind:bug-spotted, severity:minor). I could not file it as a draft TASK because `aida add` fails in this seat with "requirement ID allocation failed".

    `ship::tracked_changes_pending` (aida-cli-lib/src/ship.rs:184) uses `host_git_command`. In a contained seat clone that helper refuses and exits 1 (BUG-2169), and the probe treats the failure as pending work. So `aida ship` step 1 runs on a clean tree, `git commit` fails with "nothing added to commit", and ship aborts. I published PR-2935 manually (git push + gh pr create). Same class as TASK-2350 and TASK-2356. `aida pr auto-queue-review` also failed here (same `aida add` failure), so no review story was queued for PR-2935.
