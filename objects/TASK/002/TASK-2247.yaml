title: collect_cleanup_report probes each seat clone with no shared deadline
description: |
  In aida-cli-lib/src/status_awaiting.rs, collect_cleanup_report (around lines 41-54) calls seat_clone::probe once per clone_seat_trees entry. That is up to three sandboxed calls per clone, each bounded only by PROBE_TIMEOUT, and the callers' budgets are ignored. With several clone leases (or slow bwrap), the uncommitted-WIP detector in awaiting/status can overrun its budget. PR-2836 fixed exactly this for collect_unshipped_work_items_bounded, using probe_until.
  Fix: pass a deadline through to probe_until. A clone that gets skipped should still show as one explanatory entry, as an unreadable clone does now.

  Raised in review of PR-2836: https://github.com/joemooney/aida/pull/2836#issuecomment-6371297477
