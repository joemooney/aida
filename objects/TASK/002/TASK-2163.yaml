agreed_id: TASK-2163
title: Main guard and mirror-guard-check disagree on slash-containing default branch names
description: |
  aida_core::git_ops::default_branch_name (aida-core/src/git_ops.rs:3755) returns only the last '/' segment of refs/remotes/origin/HEAD, while the main guard (aida-core/templates/hooks/aida-main-guard-pre-push.sh) strips just 'origin/'. With origin default 'release/x' the guard flags refs/heads/release/x, but check_mirror_sync_push (aida-cli-lib/src/mirror_guard.rs:177) protects refs/heads/x, judges no ref, and refuses — mirror-sync stays blocked in such repos (fails closed, so not a security issue). Fix: strip the 'origin/' prefix instead of rsplit('/').

  Raised in review of PR-2821: https://github.com/joemooney/aida/pull/2821#issuecomment-6338485525
