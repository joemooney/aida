title: Document clone-seat submodule handling and the salvage bundle in docs/cli/03-work-autonomy.md
description: |
  docs/cli/03-work-autonomy.md, the clone-seat paragraph: it says session end --force salvages the clone and then removes it. It does not say that a clone with submodules is never removed by session end, reap or dismiss: the operator has to remove it by hand and then run aida worktree dismiss <clone> to release the lease and pin. It also describes the salvage as just a patch, but it is a patch plus a bundle (plan, S3 round 2).

  Raised in review of PR-2806: https://github.com/joemooney/aida/pull/2806#issuecomment-6338355075
