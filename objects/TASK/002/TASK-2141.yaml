title: Store-history timeout default is below the measured cold walk, and the refusal does not name the override
description: |
  mandate.rs store_history_timeout (PR-2823, TASK-1951 slice 8) bounds store-history git walks at 120 s by default. TASK-1662 measured a cold walk on the live store at 4m26s, so a cold-cache ship will now refuse with HistoryUnreadable until the cache warms. The error text "store history read timed out after 120s" does not mention AIDA_STORE_HISTORY_TIMEOUT_SECS, so the operator has no hint about how to raise the budget. Either name the env var in the timeout message or calibrate the default to the measured cold walk.

  Raised in review of PR-2823: https://github.com/joemooney/aida/pull/2823#issuecomment-6335211630
