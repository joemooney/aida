title: merge-hold clear claims the label was dropped when the unhold sync failed (marker-existed branch)
description: |
  merge_hold_cmd.rs:1119-1125: when the marker existed and sync_label(held=false) returns Err, which now also happens when the new recorded-label probe cannot read the forge, `aida merge-hold clear N` warns but still prints "Cleared merge-hold on PR #N (marker removed, `aida:merge-hold` label dropped)." and exits 0. The forge hold label stays and merge-hold-gate keeps failing. This is the same false-claim family that round 3 fixed for the no-marker branch (unread_label_clear_outcome).

  Raised in review of PR-2822: https://github.com/joemooney/aida/pull/2822#issuecomment-6337514011
