title: 'aida pr train: wait_ci errors are treated as red CI and bisect with a wrong reason'
description: |
  ForgeRails::test (pr_train.rs, around line 1268) maps every wait_ci error to CiVerdict::Red: 'no CI registered within 600s', forge NoCi, or a watch_ci API error. An infrastructure failure is then rerun and bisected down to single members, each ejected with 'CI is red with this PR alone on top of main'. That reason is wrong, and it spends about 2N CI runs. Treat a wait error as a run error (abort and eject with the real reason), and add a test.

  Raised in review of PR-2843: https://github.com/joemooney/aida/pull/2843#issuecomment-6372926096
