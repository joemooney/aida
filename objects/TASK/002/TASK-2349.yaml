    REVIEW FINDINGS TO ADDRESS (TASK-2349):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9920144980ea
    Recorded: 2026-10-26T03:17:07.475326444+00:00
    Review comment: https://github.com/joemooney/aida/pull/2937#issuecomment-6407438071
    Findings:
    1. [minor/correctness] aida-cli-lib/src/status_awaiting.rs:847: the awaiting mail block now takes own_handle from MailIdentityFacts.own_handle, which is the raw registry entry name (mailbox_root.rs MailIdentityFacts::collect: own_session.name.clone()). origin/main used current_session_handle_for_cwd() (status_awaiting.rs:822), which applies valid_handle()/handle_spelling_rejection. Failure case: a session bound to a registry entry whose name fails the spelling rules (uppercase, underscore, over max length, e.g. 'Claude_Reviewer'). On main the operator headline is current_user_id() and the shared list is empty apart from ctx/env role. On this head the operator is the invalid raw name and the shared list gains the vendor, the aliases and possibly the user, so the own and shared counts change. That contradicts the PR's 'precedence unchanged' claim and the TASK-2345 diagnosis ('preserve existing validated-handle semantics; do not silently turn raw names into newly trusted private handles'). Fix: carry the validated handle separately in the facts (or validate in the awaiting block) so the headline keeps main's semantics while inbox_identities_from_facts keeps its unvalidated own_handle. Pin it with a test.
    2. [minor/test-coverage] Nothing tests the bound-session half of the new seams. Every collect_awaiting_report_with_mail_facts call site uses unbound facts (story_465_awaiting_report_tests.rs:43 awaiting_report_unbound). mail_identity_facts_collect_reads_env_adapters (bug_231_findings_promote_tests.rs:349) asserts only the env fields, never the own_handle/own_vendor/user_is_known_person projection. This gap is how finding 1 shipped. Add awaiting-report cases with bound facts: a valid handle (operator equals the handle; shared holds the vendor/role, not the handle) and an invalid-spelling handle (falls back to the user headline). Also consider wrapping the collector test in hermetic_ancestry_seam so collect() does not read the live registry binding of whoever runs it.
    3. [cosmetic/docs] aida-cli-lib/src/tests/bug_231_findings_promote_tests.rs:1321-1329: operator_identities() was inserted between urgent_broadcast's doc comment and its fn. The '/// Build an urgent broadcast Message...' line now documents operator_identities, and urgent_broadcast has no doc. Move the operator_identities block above that doc comment.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
