title: Pin single store-hooks resolution per host_git_command with a test
description: |
  PR-2786 (BUG-2192) made host_git_command resolve the store hooks directory once and share it between the core.hooksPath pin and the refusal check (aida-core/src/git_ops.rs:108-144). That cut show's git spawns from 40 to 32. No test pins it, so a later refactor could bring back the double rev-parse + establish without anyone noticing. Add a test that counts resolutions per host_git_command, or asserts that the pinned hooks dir and the checked dir come from the same resolution.

  Raised in review of PR-2786: https://github.com/joemooney/aida/pull/2786#issuecomment-6302084451
