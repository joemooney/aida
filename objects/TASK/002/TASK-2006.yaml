title: Main-checkout .git deny misses a .git symlink to a gitfile (BUG-2012)
description: |
  contained_main_checkout_git_deny_paths: when <root>/.git is a symlink to a gitfile, symlink_metadata reports a symlink, so neither the dir branch nor the meta.is_file branch fires and nothing is denied. Use git_entry.is_file().

