title: 'Review watch: a failed ready wake is retried only after READY_INTERVAL'
description: |
  review_watch.rs report() stamps readiness.checked_at before it delivers the wake. A failed mail or event append is therefore retried only after 120 s, not on the next pass. Tests hide this because the interval is zero under cfg(test).

