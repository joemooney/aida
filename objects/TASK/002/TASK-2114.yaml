title: Covers path still completes a (Refs X) id when the squash subject mixes Refs and completion trailers
description: |
  db_reconcile.rs ~2349-2385 (BUG-106 covers path): PR-2815 skips PRs whose subject names ids only in (Refs …) groups (RefsCompletionFilter::subject_only_references). A mixed subject 'fix: x (Refs A) (B) (#N)', whose review story implements A and B, still completes A through the covers path, though the candidate scan treats A as a reference (BUG-2203). Fix: filter each covered id through refs_completion_filter(subject, message).subject(id) per PR, and test the mixed subject.

  Raised in review of PR-2815: https://github.com/joemooney/aida/pull/2815#issuecomment-6328724758
