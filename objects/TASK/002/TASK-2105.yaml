title: record_result_after_latched_halt should forget prior dispositions (BUG-852)
description: |
  auto_complete.rs:5235: record_result_after_latched_halt deduplicates by checking list membership (shelved.contains / skipped.any) instead of calling forget_batch_disposition, which every other recorder uses. Example: a spec is shelved earlier in the drain, requeued (STORY-1429) and relaunched, and after the halt latches it comes back Held or Inconclusive. It stays reported as shelved. A punted spec that is requeued would appear in both punted and skipped. Fix: gate on the result's own shelved_reason rather than list membership, and call forget_batch_disposition before pushing.

  Raised in review of PR-2812: https://github.com/joemooney/aida/pull/2812#issuecomment-6327116401
