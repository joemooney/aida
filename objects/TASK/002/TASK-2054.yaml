title: Seat-check roster refusal should name the store it read; AIDA_STORE divergence from aida team is only surfaced when no store is detected
description: |
  aida-cli-lib/src/seat_authority.rs (issuance_roster_store, ~line 982): when a project store IS detected but AIDA_STORE points elsewhere, `aida team` (dispatcher uses detect_distributed_store(), which honors AIDA_STORE) and the seat check (roster_store(), deliberately ignores AIDA_STORE) read different rosters. The refusal then still says "not allowed by the team roster ... aida team allow-seat" without naming which store's registry/team.toml was read, which is the original BUG-2200 symptom (aida team shows the seat allowed, role enter refuses). The AIDA_STORE note only appears in the NotDetected branch. Ignoring AIDA_STORE for authority is a reasonable choice; the refusal should still name the roster path it read and mention an AIDA_STORE that resolves to a different store. The agreement test (seat_check_and_team_resolve_the_same_store_from_one_cwd) pins detect_distributed_store_from, not the dispatcher's AIDA_STORE-aware resolver.

  Raised in review of PR-2795: https://github.com/joemooney/aida/pull/2795
