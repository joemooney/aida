title: 'STORY-1917: wrong-seat, principal-mismatch and missing-reviewer-delegation dispatch refusals have no tests'
description: |
  Three authority refusal branches in check_request_authority have no test:

  - wrong grant seat: aida-cli-lib/src/dispatch.rs:990-1004 (a reviewer/implementer grant must not dispatch)
  - grant/mandate principal mismatch: aida-cli-lib/src/dispatch.rs:1006-1020
  - missing 'reviewer' delegation for review/flow: aida-cli-lib/src/dispatch.rs:1026-1046

  Fixture::new(delegable) in aida-cli-lib/src/tests/story_1917_dispatch_request_tests.rs:81 takes its parameter precisely to vary the third case, yet all 7 call sites pass &["reviewer", "implementer"]. A Fixture::new(&[]) case asserting that review/flow refuse would close it.

  All three checks are correct on inspection; the gap is regression protection. dispatch.rs is in GATE_PROTECTED_PATHS, so a future refactor silently dropping one of these would have no test to catch it.

  Raised in review of PR-2905: https://github.com/joemooney/aida/pull/2905#issuecomment-6390394038
