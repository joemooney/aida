title: Test that a failed origin lookup makes the auto-queue report needs-attention
description: |
  PR-2931 tests `origin_remote_presence` directly (bug_2169_seat_clone_tests.rs). No test covers the wiring at review_gates.rs:1079-1086, where an Err must become `AutoQueueStatus::SkippedNeedsAttention` and not `SkippedByDesign`. Add one try_auto_queue_pr_review_unbumped test that passes a non-repo or unverified seat-clone project_root and asserts the needs-attention status. Side effect to note: a project_root that is not a git repo now gets a yellow needs-attention skip where it used to get the dim local-only skip.

  Raised in review of PR-2931: https://github.com/joemooney/aida/pull/2931
