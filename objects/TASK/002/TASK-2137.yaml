title: Fresh verdict with an unreadable body now fails phase 3 instead of being skipped; untested at the call site
description: |
  verdict_file_modified no longer reads the body (TASK-1814(3)), so a fresh verdict file whose body is not UTF-8 now has an mtime. phase_gates.rs:317 and :390 used to skip such a file silently; now it fails with a NoVerdict PhaseFailure ('could not read sibling verdict evidence'). That fails closed, which is acceptable, but no test covers it at the call site and PR-2820 does not mention the change.

  Raised in review of PR-2820: https://github.com/joemooney/aida/pull/2820#issuecomment-6332530277
