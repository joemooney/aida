title: Test the GIT_SSH (bare program) branch of forge.rs configured_ssh_command
description: |
  forge.rs configured_ssh_command has a third branch that falls back to GIT_SSH, a bare program name. It wraps the name in single quotes and escapes embedded single quotes. No test covers this branch: task_1951_origin_head_probe_keeps_operator_ssh_command exercises only GIT_SSH_COMMAND and core.sshCommand. Add a case where GIT_SSH points at a fake ssh whose path contains a space or a quote, and assert the wrapper is invoked with BatchMode=yes.

  Raised in review of PR-2811: https://github.com/joemooney/aida/pull/2811#issuecomment-6326770207
