title: lane-liveness review_started ignores a live reviewer once its creator pid dies (BUG-2206 Stale arm, empty live list)
description: |
  lane_liveness.rs:1297-1305 calls lease_state_for(l, &[], now) with no live sessions. Since PR-2810, leases.rs:1179-1190 returns Stale for a review_verb lease whose creator is provably dead and that has no live session in its worktree, so here creator death alone marks the review not started. A reviewer still running whose creator shell exited triggers a false unpicked-ready-pr nudge. This also changes TASK-1665 behaviour without a test. Fix: pass the live-session probe (plus the BUG-2010 registry check for codex reviewers) and test both cases.

  Raised in review of PR-2810: https://github.com/joemooney/aida/pull/2810#issuecomment-6325879491
