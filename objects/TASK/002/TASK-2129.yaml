title: 'Cargo-timeout hook: lower-case dot targets (.venv:, .env:) read as suffix rules and set implicit'
description: |
  aida-core/templates/hooks/aida-cargo-timeout-guard.sh:267 (TASK-2076). The suffix-rule detector treats any `^\.[^./]+$` target that is not all-caps as a single-suffix rule. A common Python Makefile target like `.venv: requirements.txt` or `.env:` therefore sets `implicit`. Any unrelated unknown plain-file prerequisite elsewhere (`hello: notes.txt`) then fails closed, and `timeout 1h make hello` gets the hint without a cargo path. This is a false positive in an advisory hook, not a fail-open. Option: count a target as a suffix rule only when its suffix appears in a `.SUFFIXES:` list or in GNU make's default suffixes. This pairs with TASK-2128 item 3, which proposes an explicit special-target list.

  Raised in review of PR-2817: https://github.com/joemooney/aida/pull/2817#issuecomment-6329927242
