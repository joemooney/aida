title: Train rider gate is read-once; concurrent train starts can double-carry
description: |
  The BUG-2220 rider gate reads live_trains once at the start of pr_train_handler. Two `aida pr train` runs starting concurrently both read before either opens its train PR or takes the lease, so neither refuses the shared riders. Acceptance as written ("a PR in a LIVE train") is met and the merge lease still serializes landings — the cost is wasted CI, the thing BUG-2220 aimed to stop. Consider re-checking under the lease or a short build-phase claim.

  Raised in review of PR-2900: https://github.com/joemooney/aida/pull/2900#issuecomment-6387215630
