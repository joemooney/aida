title: Drive ownership counts entries in abandoned work queues
description: |
  mandate_drive.rs queue_and_drain_claims treats any entry in any .aida-store/registry/queues/*.yaml as ownership. Abandoned queues exist (e.g. codex.yaml entries from 2026-07), so an approved spec left in one is never dispatched. Consider requiring a live owner/session for the queue, or an age bound.

  Raised in review of PR-2804: https://github.com/joemooney/aida/pull/2804#issuecomment-6323616357
