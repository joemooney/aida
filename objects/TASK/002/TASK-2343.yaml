title: 'STORY-1917: pin deny_unknown_fields on the internally-tagged DispatchVerb with a test'
description: |
  No test asserts that #[serde(deny_unknown_fields)] actually rejects an unknown field in a DispatchRequest or DispatchResult record on disk.

  Both the dispatch module doc (aida-cli-lib/src/dispatch.rs:1-19) and the signed sketch lean on deny_unknown_fields for tamper resistance of requests/<id>.json. DispatchVerb is an internally-tagged enum (#[serde(tag = "verb", ...)], dispatch.rs:71), and serde's handling of deny_unknown_fields on internally-tagged enums is a known sharp edge, so the guarantee should be pinned by a test rather than assumed.

  Test: write a request JSON with an extra top-level key and an extra key inside the action object, and assert load_pair refuses both.

  Raised in review of PR-2905: https://github.com/joemooney/aida/pull/2905#issuecomment-6390394038
