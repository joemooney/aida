title: Mailbox doc says aida agent gc/ls run outside the command sandbox; only the start hook does
description: |
  docs/cli/06-roles-sessions.md (mailbox resolver paragraph, STORY-1843 PR2) says "aida agent gc, aida agent ls and each session's start hook run outside the command sandbox". Only the SessionStart hook runs outside it. gc and ls run wherever they are invoked, and from a sandboxed shell they skip rows they cannot observe. Reword the sentence so operators know that ending host rows needs a host-side run.

  Raised in review of PR-2848: https://github.com/joemooney/aida/pull/2848#issuecomment-6368384665
