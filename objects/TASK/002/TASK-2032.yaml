title: 'host_recorded_clone: anchor main to the launcher''s main, not a process-wide host-mains set'
description: |
  seat_clone_detect::is_host_main (aida-core/src/seat_clone_detect.rs:92) checks against a process-wide HOST_MAINS set: every non-clone main ever resolved via main_worktree_root_from (worktree_gc.rs:758), plus the cwd git root. It does not check the launcher's main. No host path that resolves a seat-chosen dir was found, but a long-lived process widens the set. Pass the launcher's main into host_recorded_clone explicitly.

  Raised in review of PR-2787: https://github.com/joemooney/aida/pull/2787#issuecomment-6304296951
