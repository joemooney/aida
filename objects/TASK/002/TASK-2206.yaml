title: Drive-tick relay restart leaks AIDA_SCHEDULE_CHILD=1 into the restarted relay and its sessions
description: |
  mandate_drive.rs spawn_restart builds on scrubbed_command -> scrub(), which sets AIDA_SCHEDULE_CHILD=1. A restarted relay is a long-lived worker, not a schedule child, but it and every agent session it launches inherit the marker. doctor_cmd.rs:1152 routes lane-liveness findings (side effects) when the marker is set; shift.rs SCRUBBED_ENV already treats it as never-inheritable. The test the_live_spawn_scrubs_the_environment_and_detaches asserts it is present. Fix: env_remove AIDA_SCHEDULE_CHILD in spawn_restart (add to RESTART_ENV_SCRUB) and invert the assertion.

  Raised in review of PR-2834: https://github.com/joemooney/aida/pull/2834#issuecomment-6364063660
