title: 'NO_SLOT guard: a quoted variable name with an unquoted = passes (export "<VAR>"=1)'
description: |
  These forms pass both the main-branch guard and the PR-2818 guard (head 9b9e3f6647). <VAR> is the cargo slot-bypass variable.
    export "<VAR>"=1
    env '<VAR>'=1 make check
    declare -x "<VAR>"=1
    export <VAR>""=1
  The round-3 assigner regex in aida-git-guardrails.sh needs the opening quote to sit directly before the whole NAME= token. Suggested fix: join the adjacent quoted and unquoted segments of a shell word before matching, or match NAME followed by optional quotes before \+?=.

  Raised in round-3 review of PR-2818: https://github.com/joemooney/aida/pull/2818
