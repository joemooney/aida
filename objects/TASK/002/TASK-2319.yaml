title: Re-export ratchet misses aliased re-exports (pub use crate::gate as g)
description: |
  The STORY-1889 re-export ratchet (`gate_reexports` in
  aida-cli-lib/src/tests/story_1888_gate_paths_tests.rs) requires `gate` to be
  followed by `::`, `;`, or `}`. An aliased re-export in an unprotected file —
  `pub use crate::gate as g;` or `pub use crate::gate::seat_authority as x;` —
  is not matched, so `no_unprotected_file_reexports_gate_items` would not refuse
  it. Writing an alias is a deliberate act (the ratchet documents itself as
  drift protection, not a defence against deliberate subversion), so this did
  not block PR-2889; still, extending the regex to also match `gate\s+as\b` and
  `gate::<path> as` closes the gap cheaply.

  Raised in review of PR-2889: https://github.com/joemooney/aida/pull/2889#issuecomment-6381258221
