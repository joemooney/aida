title: Contained destructive-git deny list misses forced-push forms now reachable via Bash(git *)
description: |
  PR-2794 (BUG-2201) adds Bash(git *) to every contained session's --settings allow list, including downstream projects that previously had no git allow at all. destructive_command_deny_rules (aida-cli-lib/src/session.rs ~3341) denies `git push --force *` and `git push -f *`, but not the other forced-push spellings: `git push origin +branch`, `git push --force-with-lease`, `git -c x=y push --force`, or a flag placed after the remote (`git push origin branch --force`). Consider anchoring the denies on push plus any force spelling, or denying `git push` from contained seats that never push.

  Raised in review of PR-2794: https://github.com/joemooney/aida/pull/2794#issuecomment-6314758978
