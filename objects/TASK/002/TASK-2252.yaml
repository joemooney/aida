title: 'Review watch: round-cap wake says ''head has no review'' when the head is approved but the corpus refuses'
description: |
  aida-cli-lib/src/review_watch_notice.rs send(): the round-cap gate is evidence.approval(change).is_err(). The live Evidence::approval is live_approval (review_watch_ready.rs:255), which composes the approval gate with the corpus gate (approval_then_corpus). So an approved head that the corpus refuses still gets the cap wake saying 'Its head has no review', which is false for that head. Gate the cap on the approval alone (approval_at), or word the message for the corpus-refused case. Add a test.

  Raised in review of PR-2858: https://github.com/joemooney/aida/pull/2858#issuecomment-6371790818
