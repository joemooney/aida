- id: 01a1645a-6337-7e60-8830-18b179592a13
  author: joe
  content: |-
    SKETCH S4 v1 (visibility + default flip). Built on origin/main 7ffa46a9d0, after S3 #2806 merged.

    Three PRs, each one "Refs TASK-2053". The fresh branches come off origin/main. The old S4/S4b commits (ff51e12f85, e192ae6570, a2485c7bd3) are cherry-picked onto them and re-reconciled against the merged S3. Nothing is merged from the old stale branches.

    S4a: test-gate honesty + host git
    1. TASK-2161 (first commit): run_path_isolated_test_output forwards AIDA_REQUIRE_BWRAP_LIVE (only that var) through env_clear(), so a child that cannot get bwrap panics and does not skip. The CI live-bwrap step also tees its output and fails when it finds fewer than N "test task_2053_bwrap_... ok" lines or any SKIP line. N is the count of those tests, so that check is structural. In the PR I then quote the lines from the CI log that show each isolated test ran.
    2. Port of ff51e12f85: routine host paths stop running git in a lease tree. These are status/ps/statusbar, burndown, lane liveness, doctor lease heal, agent re-entry and the drain push. They go through host_git_command, which refuses a clone. force_cleanup_lease and salvage_worktree_patch move onto seat_clone probe/salvage/destroy. The logging-git regression test comes with it.
    3. TASK-2143 ratchet: a source test lists every remaining raw `Command::new("git")` in modules that read a lease worktree_path, as an allowlist of per-file counts. A new raw call in those files fails, with the message "use host_git_command". The counts may only go down.
    4. TASK-2162: a test runs dismiss on a hand-removed clone that still holds a lease. The lease is released, the pin is dropped, and no host git runs.
    5. TASK-2160: 03-work-autonomy.md documents submodule clones (kept, remove by hand) and the salvage bundle.

    S4b (stacked on S4a): visibility
    - Port of e192ae6570. The seat_trees enumerator covers linked worktrees plus clone-lease trees, and these consumers use it: status rows, WIP/unshipped detectors (read through the sandboxed probe), brief/show/preflight branch resolution, runaway, stray merge-hold markers and `aida worktree list`. A ship from a clone skips the post-merge pull and prints a note.
    - Port of a2485c7bd3 (TASK-2110): the commits a merged PR head reaches count as shipped, so a squash-merged, pruned branch no longer pins its clone.

    S4c: flip
    - The seat_tree default becomes clone, AIDA_DEV_SEAT_CLONE is removed, and #2694 is closed. The operator can still choose `seat_tree = "worktree"`. Release note.

    Asks:
    (a) Should S4b stay a separate PR stacked on S4a? I recommend yes: the review surface is ~600 lines each.
    (b) Is the per-file count ratchet acceptable as the TASK-2143 replacement for the grep gate?
    (c) Is S5 (the host clone pool) still needed after S4c? I would defer that decision until we have measured clone creation time with the default flipped.
  created_at: 2026-10-22T16:03:27.671237647Z
  modified_at: 2026-10-22T16:03:27.671237647Z
  session_id: 97692cb0-aaab-43f2-8620-eabef6bf9732
- id: 01a1646a-0ef0-7d12-a01c-03988038c9eb
  author: joe
  content: |-
    ADVISOR SIGNOFF 09:22 on SKETCH S4 v1: SIGNED. Proceed with S4a now.
    (a) Yes: S4b is a separate PR stacked on S4a; S4c is separate too.
    (b) Yes: the per-file count ratchet replaces the grep gate, with conditions. (1) The allowlist lives in the test file, with a comment saying counts may only go down. (2) The test also fails when an allowlisted file's count goes DOWN without the allowlist being lowered, so the ratchet tightens itself. (3) A new module that reads worktree_path is caught by matching on the field name, not only by a hand list.
    (c) DECIDE, do not defer. The S4c PR body records clone-creation wall time on this host: p50 and p95 of 5 fresh lease clones of this repo, warm and cold. Rule: p95 at or under 20 s means S5 (the host clone pool) is REJECTED as unneeded; over 20 s means S5 is filed approved with those numbers.
    Conditions: C1, TASK-2161 is the first commit, and the PR body quotes the CI log lines proving each task_2053_bwrap_ test ran. C2, S4a/S4b/S4c each carry Refs and the LAST one carries '(TASK-2053)'. C3, S4c changes a default, so the OPERATOR merges it after an independent PASS; S4a and S4b may ship normally. C4, never re-declare a block without checking live PR state (gh pr view) first.
