    ADVISOR SIGNOFF 09:22 on SKETCH S4 v1: SIGNED. Proceed with S4a now.
    (a) Yes: S4b is a separate PR stacked on S4a; S4c is separate too.
    (b) Yes: the per-file count ratchet replaces the grep gate, with conditions. (1) The allowlist lives in the test file, with a comment saying counts may only go down. (2) The test also fails when an allowlisted file's count goes DOWN without the allowlist being lowered, so the ratchet tightens itself. (3) A new module that reads worktree_path is caught by matching on the field name, not only by a hand list.
    (c) DECIDE, do not defer. The S4c PR body records clone-creation wall time on this host: p50 and p95 of 5 fresh lease clones of this repo, warm and cold. Rule: p95 at or under 20 s means S5 (the host clone pool) is REJECTED as unneeded; over 20 s means S5 is filed approved with those numbers.
