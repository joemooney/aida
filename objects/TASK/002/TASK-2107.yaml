title: verify_linked_worktree_main resolves a relative gitdir back-pointer against process cwd
description: |
  aida-cli-lib/src/session.rs verify_linked_worktree_main: back_ok runs canonicalize(Path::new(body.trim())) on <common>/worktrees/<name>/gitdir. With git >= 2.48, worktree.useRelativePaths (git worktree add --relative-paths) writes that file relative to the gitdir directory, so it resolves against the process cwd and every contained launch from such a worktree is falsely refused. It fails closed, so this is a usability bug, not an escape. Fix: resolve a relative body against the gitdir directory, and add a fixture.

  Raised in review of PR-2813: https://github.com/joemooney/aida/pull/2813#issuecomment-6327254794
