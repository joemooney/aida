title: 'transport: disable cannot clear a corrupt clone-local profile'
description: |
  `aida config transport disable` runs `load(&common)?` before matching the
  subcommand (aida-cli-lib/src/transport_profile.rs:352 area, `configure_in`), so a
  corrupt / future-version / oversize `aida-transport.json` makes `disable` bail
  with "Invalid clone-local transport profile" instead of removing it. The
  operator's documented recovery verb cannot recover; they must hand-delete a
  file the error message never names. Suggest: let Disable treat an unreadable
  profile as removable (delete without validating), or at least name the file
  path in the refusal.

  Raised in review of PR-2904: https://github.com/joemooney/aida/pull/2904#issuecomment-6389521042
