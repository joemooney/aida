title: Mandate store dirty check honours the user's global git excludesFile
description: |
  The dirty check in store_snapshot runs 'git status --porcelain=v1 --untracked-files=all' through snapshot_command (mandate_traces.rs). It sets GIT_CONFIG_NOSYSTEM, but the user's global config (core.excludesFile) still applies; only the test fixtures scrub GIT_CONFIG_GLOBAL. An untracked object file the global config ignores therefore reads as a clean store, while the working-tree loader may still read it. This gap already existed. Consider -c core.excludesFile= (or GIT_CONFIG_GLOBAL=/dev/null) on the snapshot status call, plus a test.

  Raised in review of PR-2825: https://github.com/joemooney/aida/pull/2825#issuecomment-6335244221
