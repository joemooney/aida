title: LaunchReservationGuard releases every unbound reservation of its pid, not only its own
description: |
  agent_handle.rs:637-653 LaunchReservationGuard::drop releases all reservations with launcher_pid == this pid. A process doing more than one launch would release an earlier launch's not-yet-bound reservation; that child falls back to a generated handle and mail to its launch name is refused. Scope it to the guard's own handle+recipient_id.

  Raised in review of PR-2864: https://github.com/joemooney/aida/pull/2864#issuecomment-6378690421
