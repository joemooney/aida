title: 'Review watch: a supersede racing the dispatcher spawn record holds the slot with nothing running'
description: |
  aida-cli-lib/src/review_watch.rs:1929-1930 and 1968-1971. Suppose a concurrent watcher supersedes a Reserved attempt after select returns Dispatch but before this watcher records the spawned dispatcher. Two paths then record nothing: an immediate dispatcher exit (mark_unclaimed_exit filters phase == Reserved) and a spawn failure (ensure phase == Reserved returns an error instead). The Superseding attempt is left with no identity, dispatcher or pgid. confirm() then holds the slot as "a review process was being spawned but never recorded", though nothing runs, until an operator runs `aida review watch --release`. It fails closed and is rare, but it holds a capacity slot needlessly. Fix: on those paths, record the attempt as Superseded when the phase is Superseding (the child is provably reaped or was never spawned).

  Raised in review of PR-2824: https://github.com/joemooney/aida/pull/2824#issuecomment-6336798246
