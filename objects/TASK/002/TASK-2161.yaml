title: Isolated task_2053_bwrap_ tests drop AIDA_REQUIRE_BWRAP_LIVE in the child and can skip silently
description: |
  aida-cli-lib/src/test_env.rs run_path_isolated_test_output runs the child with env_clear() and does not pass AIDA_REQUIRE_BWRAP_LIVE through. Each isolated task_2053_bwrap_ test (T7, session end, submodule ignore=dirty, and 4 more) calls bwrap_live() in the child. If bwrap fails there, the test prints SKIP and passes, so for these tests the CI live-bwrap gate is no longer fail-closed. Pass AIDA_REQUIRE_BWRAP_LIVE through to the child (or check it in the parent).

  Raised in review of PR-2806: https://github.com/joemooney/aida/pull/2806#issuecomment-6338355075
