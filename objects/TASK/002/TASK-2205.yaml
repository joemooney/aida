title: 'aida list --fields: add an ''opened'' (creation time) field and accept whitespace as well as commas between fields'
description: 'Operator request 2026-10-23. (1) Add a field ''opened'': the spec''s creation time (the timestamp in the spec record that filed_at / ''added'' events use), rendered like modified_at on the human table, TOON and JSON. Accept ''created_at'' and ''created'' as aliases. (2) The --fields value is split on commas AND/OR one or more whitespace characters, so a header line copied from existing output works, e.g. --fields ''id title status modified_at'' or ''id, title,  status''. Empty segments are ignored; an unknown field still errors with the valid list. (3) Fix the help-text drift: the --fields help must list exactly the valid set the parser accepts (modified_at, mode, origin, deferred_reason, driver, driver_kind are missing today). Generate it from the same const as the error message, and add a test that pins help == parser set. Tests for each item: the whitespace/comma mix, aliases, opened ordering, and the unknown-field error. Regenerate the golden help snapshot.'
