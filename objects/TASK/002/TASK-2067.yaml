title: Resolve unresolved trace IDs via store history and aliases so they stop blocking mandate coverage
description: 'Follow-up from TASK-1800 (AC2 slice 1, PR #2798). Item-level trace attribution was measured on the 50 frozen mandate endpoints and rejected: it never changed case-level refusals (49/50) and widened evidence (fallback 290 -> 414 as signed off, 333 after one advisor iteration). The remaining lever is the unresolved trace IDs: the 18-case audit has 30 scoped (case, ID) pairs judged unresolved (e.g. TASK-176, TASK-1335, EPIC-1-001, BUG-1-051, FR-1-043), whose frozen history or aliases are missing, and their refusals cannot be judged true or incidental. Acceptance: (1) for each unresolved ID in docs/testing/task-1800-semantic-audit.json, classify it as recorded alias, deleted-with-history, or dangling, using store history and the alias registry; (2) repair the resolution path for any alias or history that exists but is not found, keeping the comment-24 fail-closed rule (any history hit that cannot be read refuses); (3) report the before/after case-level refusals on the 50 frozen endpoints with make task-1800-replay. Named IDs and decide() fail-closed handling are unchanged.'
