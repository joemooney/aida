title: 'STORY-1917: validate_branch misses the repo''s actual default branch that the signed sketch requires rejecting'
description: |
  validate_branch (aida-cli-lib/src/dispatch.rs:492) rejects only the literal names 'main', 'master' and 'HEAD'.

  The signed SKETCH v1 requires the branch 'must not be main, master, or the repo's default branch'. On a clone whose default branch is e.g. 'develop' or 'trunk', 'aida dispatch request take --branch develop' passes validation at both the request end and the execution end (revalidate_request calls the same validator).

  Slice 2's take runner does 'git -C <worktree> checkout -B <branch> origin/<branch>' in a takeover worktree, so the blast radius is bounded, but the named sketch condition is unimplemented and untested.

  Fix: resolve the default branch (origin/HEAD or the configured default) and reject it alongside main/master, with a test.

  Raised in review of PR-2905: https://github.com/joemooney/aida/pull/2905#issuecomment-6390394038
