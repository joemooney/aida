title: 'ship-batch: review wait should build verdict-candidate spec ids the same way aida pr ship does'
description: |
  GitHubPorts::review_at_head (aida-cli-lib/src/pr_ship_batch.rs) passes known_ids=&[] to merge_approval_inputs, while the ship gate (pr_cmd.rs ~2183-2199) passes ship_gate_spec_records plus the IDs in the branch and title. A spec ID found only in the PR title can give the batch different verdict candidates than ship uses. The batch then waits to timeout while ship would accept. This fails closed, but it contradicts the sketch's no-drift claim. Share one helper.

  Raised in review of PR-2828: https://github.com/joemooney/aida/pull/2828#issuecomment-6337989557
