title: Contained launch vs os-wrap disagree on symlinked mailbox failure handling
description: |
  contained_mailbox_write_paths refuses a symlinked .aida or .aida/mailbox. claude_contained_settings_json propagates that error with `?` (aida-cli-lib/src/session.rs, BUG-2218 hunk), aborting the whole contained launch; os_wrap_rw_paths eprintln's and continues without the grant. Both fail closed, but one path bricks the launch while the other degrades mail. Decide the intended behavior and make the two paths consistent.

  Raised in review of PR-2898: https://github.com/joemooney/aida/pull/2898#issuecomment-6385738243
