title: Rework-release path skips the BUG-2214 evidence-read head fetch (head_branch=None)
description: |
  The BUG-2214 PR-1 fix fetches the PR head in mandate_ship_cover before collect_pr, but the rework-release call site (rework_hold_release.rs:584) passes head_branch: None, so the fetch never runs on that path. SKETCH v1 (c) claimed "one place covers ship's early gate, the under-lease re-read, the train's cover, and the rework release path" — the last is not covered. A rework-hold release after `gh pr update-branch` can still refuse TraceEvidenceUnreadable ("git merge-base: Not a valid commit name <new head>"). Fails closed — an availability gap, not a safety gap; the spec acceptance names ship/train only, so this did not block PR-2894. Fix: thread the head branch (available via live_head / fetch_pinned_change) into the mandate_ship_cover call, in PR-2 of the slice or a follow-up.

  Raised in review of PR-2894: https://github.com/joemooney/aida/pull/2894#issuecomment-6382289721
