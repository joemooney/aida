title: 'release.sh: re-verify HEAD after retaking the merge-lease post-confirm'
description: |-
  scripts/release.sh drops the main merge-lease before the confirm prompt and retakes it before commit (~line 642) without checking that HEAD still equals the commit the bump, cargo check, CHANGELOG and tag notes were computed on. A concurrent aida pr ship that fast-forwards the primary checkout during the prompt changes release/vX's base and leaves CHANGELOG/tag notes stale. Record HEAD before the prompt; after the retake, abort with the git restore hint if it moved.

  Raised in review of PR-2807: https://github.com/joemooney/aida/pull/2807#issuecomment-6325469771
