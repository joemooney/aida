title: advisor turn stamp is overwritten with an empty binding by an unbound presenter of the same grant
description: |
  mandate_drive.rs:2226 stamp_grant_turn always calls presence::stamp_bound_turn_clock, which overwrites the grant's turn-clock record with the latest presenter's matched binding. When a process that is NOT bound to the grant (e.g. a claude --bg daemon lane that inherited a leaked advisor grant id, STORY-1662) runs a turn, matched_binding is empty, so the stamp gets a fresh last_seen and an empty binding. advisor_live then returns false until the bound session's next turn. It fails closed (no escalation), but the advisor-liveness signal flaps. Fix: skip the stamp, or keep the previous non-empty binding, when matched_binding is empty.

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6365656262
