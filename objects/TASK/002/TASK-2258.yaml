title: Autopromote child reports a checkout-moved refusal as a failed build
description: |
  run_child (aida-cli-lib/src/dev_autopromote.rs:581-599) marks every run_dev_build error as Phase::Failed. That includes the post-build re-probe refusal at dev_build.rs:560-570 ("the checkout changed during the build"), which fires whenever origin/main moves during the ~6-minute build, for example after a git fetch or aida pull in the primary checkout. The next tick then routes CronJobFailed:dev-autopromote to the advisor as a failed build, and the SHA is marked failed. Classify this case (and the HEAD-moved case) as a non-failure, and add a test.

  Raised in review of PR-2850: https://github.com/joemooney/aida/pull/2850#issuecomment-6372674647
