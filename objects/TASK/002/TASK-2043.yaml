title: Recorder identity still binds every main-checkout lease via project_root (BUG-2199 path 2)
description: |
  RecorderIdentity::current (aida-cli-lib/src/review_authority.rs:455-472) adds project_root to the dirs used by lease_bound_by_context, so every non-harness lease whose worktree is the main checkout (e.g. a claim lease) is bound into the identity of every recorder running from the main checkout. PR-2792 neutralised this for harness leases only. Either bind by the recorder's actual cwd, or document why project_root binding is kept.

  Raised in review of PR-2792: https://github.com/joemooney/aida/pull/2792#issuecomment-6310234707
