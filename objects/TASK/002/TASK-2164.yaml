title: install-guard --force breaks non-sh pre-push hooks
description: |
  mirror_guard::chain_guard_into (aida-cli-lib/src/mirror_guard.rs ~L113) inserts a POSIX-sh chain block right after ANY shebang. With --force on a foreign pre-push hook written in python/node/etc. the result is a syntax error and every push fails. Refuse non-sh shebangs (sh/bash/dash/zsh) or chain via a sh wrapper that execs the original hook.

  Raised in review of PR-2821: https://github.com/joemooney/aida/pull/2821#issuecomment-6338485525
