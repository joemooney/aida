title: Forge::commit_checks accepts a short SHA that can never match the API's full SHA
description: |
  GitHubForge/GitLabForge::commit_checks (aida-cli-lib/src/forge.rs ~1900, ~2505) guard the SHA with git_arg_guard::is_hex_sha, which accepts 7–64 hex characters. The shared reader's require_sha (forge_commit_ci.rs:100) then compares each run's full head_sha/sha with the input using eq_ignore_ascii_case. A short SHA therefore always errs, and ci_status(CiTarget::Commit(short)) is always CiState::None. That fails closed, but silently: the caller gets no signal instead of a clear error. Either require a full 40- or 64-character SHA at the guard or prefix-match in require_sha, and add a test.

  Raised in review of PR-2849: https://github.com/joemooney/aida/pull/2849#issuecomment-6365760778
