title: issue_child prints the proc-only keyring warning on every child launch off Linux
description: |
  grant_keyring::install returns InstallError(errno 0) off Linux, so seat_authority::issue_child prints "Warning: the child grant is bound to this launcher's process only ... (errno 0)" on every launch on macOS. AIDA is Linux-only, so this is noise only. Suppress the warning when the keyring is structurally unavailable (grant_keyring::available() is false).

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6365656262
