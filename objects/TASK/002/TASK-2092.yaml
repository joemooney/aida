title: release.sh lease temp files live inside .aida/merge-locks/
description: |-
  lease_acquire runs mktemp on $lease_file.XXXXXX inside the locks dir. merge_lock::status read_dir lists every entry, so a temp file shows up as a lease, and a SIGKILL between mktemp and rm orphans it for good (the EXIT trap does not clean it). Use a dot-prefixed name that status skips, or a sibling temp dir on the same filesystem.

  Raised in review of PR-2807: https://github.com/joemooney/aida/pull/2807#issuecomment-6325469771
