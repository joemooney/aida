title: 'contained_settings_json_with_boundary: computed main-checkout denies bypass the deny_expressible fail-closed gate'
description: |
  aida-cli-lib/src/session.rs:3101-3147: deny_expressible checks only extra_deny. The main-checkout denies computed inside the function (contained_main_checkout_git_deny_paths(write_roots)) are passed to sandbox_allow_write_entries and root_rule_path, which skip an unexpressible path without reporting it. A gitdir: target containing a rule metacharacter (e.g. /x/git[1]/repo.git) is therefore dropped from both denyWrite and permissions.deny while the write roots stay granted. Production claude_contained_settings_json refuses these first via refuse_unexpressible_main_git_deny, so only contained_settings_json and contained_settings_json_with_store are exposed. Fix: include the computed denies in deny_expressible, as BUG-1982 does for extra_deny, and add a refusal test.

  Raised in review of PR-2790: https://github.com/joemooney/aida/pull/2790#issuecomment-6307743151
