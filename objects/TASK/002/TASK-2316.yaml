title: 'stamp_drain_lock_child_grant: serialise the lock read-modify-write against a concurrent takeover'
description: |
  aida-cli-lib/src/drain_lock.rs stamp_drain_lock_child_grant reads the lock, checks pid == ours, then write_atomic's it back. A forced takeover by another drain between the read and the write is overwritten with our record, which reopens the double-drive hole briefly. Re-read and verify the pid after the write, or take the same acquire lock.

  Raised in review of PR-2838: https://github.com/joemooney/aida/pull/2838#issuecomment-6380858550
