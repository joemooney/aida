title: 'Standalone implementer: exercise handle_queue_work wiring end to end and derive exit-code distinctness from one table'
description: |
  Non-blocking follow-ups from the review of PR-2829 (STORY-1662 PR1):
  1. The stub-vendor e2e test (aida-cli-lib/src/tests/story_1662_standalone_implementer_tests.rs) calls standalone_implementer::run() directly. Nothing exercises the handle_queue_work wiring: is_standalone_implementer dispatch, acquire_slot before the queue row and lease, record_child_authority, and suppression of the manual-continuation hint. Add a queue-work-level test, including the documented claim that a cap refusal (exit 34) leaves no lease, worktree or queue row.
  2. outcome_exit_codes_are_distinct_and_mapped_by_exit_code_for_error checks against a hand-written list that omits DRIVE_EXIT_HARD_FAIL=3 and TIMEOUT_EXIT_STATUS=124. Use a single exit-code table that both exit_code_for_error and the test read.

  Raised in review of PR-2829: https://github.com/joemooney/aida/pull/2829#issuecomment-6337877063
