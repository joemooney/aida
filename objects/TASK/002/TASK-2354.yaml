title: 'ownership_and_ci_share_one_wait_deadline: release assertion depends on a ~2s file-removal window'
description: |
  aida-cli/tests/task_1287_label_only_merge_hold.rs::ownership_and_ci_share_one_wait_deadline now asserts !text.contains("Drive ownership wait timed out"). It passes only if the test thread removes the drive-state file within the ~2s ownership sleep after reading the "waiting for drive release" line. wait_for_drive_release (pr_ship.rs:124) sleeps min(2s, remaining) and then times out if the probe still sees the block. If a scheduler stall longer than ~2s hits under heavy nextest load, the run takes the ownership-timeout path. That path also exits 21, so it fails only on the new assertion. This is low probability and not a production defect. Possible hardening: remove the file before the progress line is consumed, using a fixture hook. Do not raise a budget or add retries.

  Raised in review of PR-2927: https://github.com/joemooney/aida/pull/2927#issuecomment-6402489355
