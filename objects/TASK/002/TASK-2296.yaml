title: 'aida-fire fixer prompt: ''has a branch → STOP'' conflicts with the advisor pre-creating the lane worktree'
description: |
  aida-core/templates/skills/aida-fire.md, fixer prompt template: "Claim the spec first (`aida claim <SPEC-ID>`). If it is already claimed or has a branch or PR, STOP and report." PR-2865 changed the recipe so the advisor creates the fixer's worktree and branch with `aida worktree add <SPEC-ID> --role implementer` before the fixer starts. A fixer that follows the prompt literally sees its own branch and stops. Reword it to "a branch or PR other than the one your worktree is on".

  Raised in review of PR-2865: https://github.com/joemooney/aida/pull/2865#issuecomment-6377769794
