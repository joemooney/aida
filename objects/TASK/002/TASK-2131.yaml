title: fetch_merged_pr_refs_via_gh only uses gh, so already-merged rebase re-runs never succeed on GitLab or pure-git forges
description: |
  pr_cmd.rs fetch_merged_pr_refs_via_gh: on a non-GitHub forge every already-merged --rebase re-run fails to resolve the refs and skips aida pull. The 're-run aida pr ship N --rebase' hint can never succeed there. Route it through the forge abstraction (see also TASK-2115).

  Raised in review of PR-2816 (Refs TASK-1951): https://github.com/joemooney/aida/pull/2816#issuecomment-6330823809
