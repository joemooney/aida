title: NO_SLOT guard still blocks prose naming a shell (commit -m with 'bash', heredoc table rows)
description: |
  aida-core/templates/hooks/aida-git-guardrails.sh (PR-2818, TASK-1643): the shell regex's ([[:space:]]+[^;&|]*)? span crosses quotes, and the stdin-shell regex is line-anchored. A git commit -m message containing the word bash plus the NO_SLOT assignment is blocked (exit 2), and so is a mailbox heredoc with a '| tool | bash |' row. Mask quoted bodies except the matched shell -c/eval payload, or document and pin the residual false positives.

  Raised in review of PR-2818: https://github.com/joemooney/aida/pull/2818#issuecomment-6329345831
