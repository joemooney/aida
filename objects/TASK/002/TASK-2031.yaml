title: Scope a contained 'aida session resume' to the session's lease tree, not the process cwd
description: |
  aida session resume (session.rs:5653 exec_resume_command -> exec_claude_resume) builds --settings and the os_wrap boundary from the PROCESS cwd (contained_session_cwd), and ResumeTarget.worktree is the main checkout. Run from main, a contained resume of a clone seat is therefore bounded to main, not the seat's tree. Scope it to the lease tree, the way rescope_contained_settings does for agent new.

  Raised in review of PR-2787: https://github.com/joemooney/aida/pull/2787#issuecomment-6303772316
