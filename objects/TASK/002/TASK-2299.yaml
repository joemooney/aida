title: 'protected_paths: a directory entry without a trailing ''/'' silently protects nothing'
description: |
  aida-cli-lib/src/mandate_gates.rs ProtectedEntry::matches: an entry like "aida-cli-lib/src/gate" (a directory, no trailing '/') is treated as an exact path. PR changed paths are always files, so the entry never matches, and `aida mandate status` lists it with no warning. The operator thinks the directory is protected, but it is not. The signed sketch accepts this ("trailing-slash typo accepted, matches nothing"), so it is not a fail-open of the floor. Suggested fix: in `aida mandate status`, warn when an exact entry names a directory on origin/main.

  Raised in review of PR-2832: https://github.com/joemooney/aida/pull/2832
