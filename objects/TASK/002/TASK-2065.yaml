title: Unrecorded-review recovery command names only the first covered spec
description: |
  review_record_template (aida-cli-lib/src/reviewer_summary.rs) builds the recovery `aida review record` command from pr_spec_ids.first(). A PR covering several specs gets a command that records only one, so an operator following it leaves the other specs unreviewed.

