title: Pure-git already-merged refs read a possibly stale origin/<base> without fetching
description: |
  pr_cmd.rs pure_git_slice_refs prefers origin/<base> and does not fetch first (landed_commits_for_subjects does fetch). If origin/<base> is stale and behind the fork point, base commits are counted as slice subjects and confirm_rebase_merged refuses. It fails closed. Fix: fetch first, or prefer the local base when it contains origin/<base>.

  Raised in review of PR-2845: https://github.com/joemooney/aida/pull/2845#issuecomment-6371549385
