title: Cargo-timeout hook ignores pattern/suffix rules that build unknown prerequisites
description: |
  make_targets_skip_cargo counts an unknown prerequisite as a plain file, even when a pattern rule (%.html:) or old-style suffix rule (.md.html:) in the same Makefile would build it with cargo. Fix: fail closed when such a rule exists and a prerequisite is unknown.

