title: Antigravity sessions never trigger the host-side dead-row gc that ends unverified mail readers
description: |
  Follow-up from TASK-2237 (swept in TASK-2238 / PR-2858).

  The dead-row registry gc that ends unverified mail readers (STORY-1843, status_awaiting::emit_notice_time_line) runs only when a SessionStart hook payload reaches `aida awaiting --notice`. Claude and Codex both reach it: codex-hooks.json SessionStart runs aida-mail-notice.sh, and codex 0.163's session-start input schema pins hook_event_name = "SessionStart", which a test now covers. Antigravity does not: aida-core/templates/antigravity-hooks.json defines only a PreInvocation grant-expiry hook, with no session-start or mail-notice hook. An agy session's dead registry rows are therefore never ended by a host-side observer, and from a sandboxed sender they count as unverified mail readers for up to 24h.

  Acceptance:
  - An agy session start (or the nearest event agy offers) triggers the same host-side dead-row gc, or another host-side trigger ends dead agy rows. Name the agy hook event used and pin its payload shape with a test, as was done for Codex.
  - A test shows a dead agy row ends without a manual `aida agent gc`.
