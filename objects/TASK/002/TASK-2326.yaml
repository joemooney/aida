title: session_start rollback misses the owner overwrite claim_status makes
description: |
  claim_status (aida-cli-lib/src/claim.rs) reassigns req.owner when a spec is already InProgress and the claimant differs, and session_start_with_receipt (aida-cli-lib/src/session_start.rs:3000-3008) routes its Approved->InProgress bump through it. The rollback cleanup records only cleanup.status_bump when the bump happened; an owner overwrite on an already-InProgress spec is never rolled back if session start later fails, leaving the spec owned by a session that never materialized.

  Raised in review of PR-2898: https://github.com/joemooney/aida/pull/2898#issuecomment-6385738243
