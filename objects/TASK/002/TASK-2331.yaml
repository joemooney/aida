title: live_trains gh pr list --limit 100 can miss an open train PR
description: |
  live_trains (pr_train.rs:1233) lists open PRs with `gh pr list --state open --limit 100` and filters train/* heads client-side. With more than 100 open PRs, an open train PR past the limit is silently missed and its riders can board a second train (the exact BUG-2220 failure). Raise the limit or filter server-side (e.g. a head:train/ search) so the gate sees every open train.

  Raised in review of PR-2900: https://github.com/joemooney/aida/pull/2900#issuecomment-6387215630
