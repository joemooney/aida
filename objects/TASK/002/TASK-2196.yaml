title: seat-grant doctor action still points at --bind-pid; bwrap presenter test can pass as a silent skip on CI
description: |
  1. aida-cli-lib/src/seat_authority.rs doctor_scan: the finding's action says "`aida role status` shows this session's harness pid for --bind-pid". After PR-2830 round 2, --bind-pid serves only unsandboxed hooks and the MCP server, and rebind_recovery and docs/cli/06-roles-sessions.md say to start sessions from the role shell instead. Align the action text with rebind_recovery.
  2. aida-cli/tests/bug_1934_bwrap_presenter.rs returns early with an eprintln SKIP when bwrap or user namespaces are unusable. On a CI runner without bwrap (or with AppArmor blocking unprivileged userns), the only real-namespace evidence silently counts as a pass. Consider a CI step that installs bwrap and asserts the test did not skip, or an explicit opt-in env that turns a skip into a failure on CI.

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6360056858
