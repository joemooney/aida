title: Scope aida session resume's os_wrap and --settings to the lease tree, not the process cwd
description: |
  aida session resume (session.rs, build_claude_resume_exec_command / exec_claude_resume) scopes os_wrap and --settings to the process cwd. ResumeTarget.worktree is main, so a resume run from the main checkout is bounded to main, not to the seat's tree. Rescope it like rescope_contained_settings does for agent new.

  Raised in review of PR-2787 (round-2 F3): https://github.com/joemooney/aida/pull/2787#issuecomment-6311051300
