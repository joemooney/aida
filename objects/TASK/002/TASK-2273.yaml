title: Heal the sandbox config.lock before git push -u in ship paths
description: |
  git push -u call sites (aida-cli-lib/src/pr_cmd.rs:4450 pr_ship_create_pr, orchestrator_leases.rs:1125, drain_batch.rs:1444) are not wrapped in aida_core::git_ops::output_healing_config_lock. Under the empty-0444 config.lock placeholder, git push -u exits 0 but prints 'could not lock config file' and leaves no upstream configured (reproduced). BUG-2211 names push -u as an affected config write.

  Raised in review of PR-2863: https://github.com/joemooney/aida/pull/2863#issuecomment-6375592095
