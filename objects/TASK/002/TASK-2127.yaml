title: 'aida-store-pair: submodule/separate-git-dir layouts lose the Aida-Store trailer'
description: |
  aida-core/templates/hooks/aida-store-pair.sh (BUG-2117 ii) resolves the store only from dirname(git-common-dir). Submodule, --separate-git-dir and bare+worktrees layouts silently lose the trailer on code commits. Document this, or fall back to the main worktree from git worktree list --porcelain.

  Raised in review of PR-2818: https://github.com/joemooney/aida/pull/2818#issuecomment-6329345831
