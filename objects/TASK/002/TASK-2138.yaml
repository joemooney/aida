title: MergeHoldChanged readers outside unrecorded_marker_removals still read the caller's events log after TASK-1406
description: |
  After PR-2822, write_marker emits MergeHoldChanged placements to hold_store_root, and unrecorded_marker_removals reads that log. Other readers still read the caller's log. lane_liveness.rs:1402 load_human_holds calls events::read_all(project_root), so from a linked worktree it misses placements and falls back to marker mtime. On the contained-writer fallback (merge_hold.rs:610) the placement goes to the local log, but the tamper check reads only the primary log, so an adopted marker's placement stays invisible. Placements recorded in worktree logs before the change also become invisible. Route the hold-event readers through hold_store_root, or document why they are excluded.

  Raised in review of PR-2822: https://github.com/joemooney/aida/pull/2822#issuecomment-6334250410
