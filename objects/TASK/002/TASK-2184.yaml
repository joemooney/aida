title: Grant lock files never removed; role-enter eval never restores xtrace
description: |
  (1) seat_authority.rs update_grant creates ~/.aida/session-grant-locks/<id>.lock per rewritten grant and never removes it, so lock files accumulate. Remove them on revoke, or sweep them with expired grants. (2) The adopt-key eval text's '{ set +x; } 2>/dev/null' permanently turns off xtrace in the operator's shell. Save and restore the prior -x state.

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6351411790
