title: 'Merge-lease: an empty, just-created lease reads as TTL-stale and gets stolen'
description: |-
  merge_lock.rs::acquire does create_new and then write_all, so for a moment the lease file is empty. scripts/release.sh lease_is_live, and merge_lock's own stale check, parse acquired_at=0, judge the lease TTL-stale and rm it, so two mergers both think they hold main. Publish atomically in merge_lock.rs (temp + hard_link) and/or treat an empty or partial lease as live for a short grace period. This is the unfixed half of PR-2807 round-1 finding 1.

  Raised in review of PR-2807: https://github.com/joemooney/aida/pull/2807#issuecomment-6325469771
