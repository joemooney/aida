title: role status offers a transient tool-shell pid as shell_pid for --bind-pid
description: |
  seat_authority.rs grant_status sets shell_pid = chain[1], the immediate parent of the aida process. When `aida role status` runs from an agent's Bash tool, that is a per-command shell that exits right away. The status line still offers it for `aida role enter <seat> --bind-pid <pid>`, and binding to it gives a grant that can never be presented. Omit shell_pid when an agent harness is present, or label it so it is not suggested for --bind-pid.

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6338292238
