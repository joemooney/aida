title: Anchor host_recorded_clone to the launcher's main, not a process-wide host-main set
description: |
  is_host_main (aida-core/src/seat_clone_detect.rs:92) accepts any main this process ever recorded through note_host_main, plus the cwd git root. host_recorded_clone (aida-cli-lib/src/seat_clone.rs:595) trusts any of them. A long-lived process (server, orchestrator) widens that set. No exploit path is known today, but passing the launcher's main explicitly would make the grant's anchor exact.

  Raised in review of PR-2787: https://github.com/joemooney/aida/pull/2787#issuecomment-6311051300
