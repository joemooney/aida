title: collect_worktree_status_rows probes each seat clone with no shared deadline
description: |
  aida-cli-lib/src/status_sections.rs:1176-1191: collect_worktree_status_rows calls seat_clone::probe once per clone lease. That is up to three sandboxed calls per clone, each bounded only by PROBE_TIMEOUT (120 s), with no shared deadline. It runs on both the `aida status` worktree pane (status_sections.rs:323) and `aida status --json` (:3107). This is the same class as TASK-2247 (status_awaiting::collect_cleanup_report), but TASK-2247 does not name this function. Fix it in #2839 together with TASK-2247: pass a deadline through to probe_until, and show a clone the deadline skipped as one explanatory row.

  Raised in review of PR-2836: https://github.com/joemooney/aida/pull/2836#issuecomment-6376647899
