title: dev build / upgrade paths lack the AIDA_DEV_HOME_REPO fallback for a stale AIDA_DEV_REPO
description: |
  PR-2861 added the fallback to activate only. dev_build::resolve_build_repo (aida-cli-lib/src/dev_build.rs:~1575) and the upgrade_release.rs AIDA_DEV_REPO readers (~1423/1534/1596/1769) still fail when AIDA_DEV_REPO names a removed worktree. The choose_activate_repo doc says it uses the same order as resolve_build_repo, which is now wrong.

