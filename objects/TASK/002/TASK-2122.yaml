title: mailbox gc --phantoms may re-address case-variant mail away from a live reader spelling
description: |
  aida-cli-lib/src/mailbox_cmd.rs:914 (TASK-2085, PR-2817): `misspelled` re-addresses any case variant of a known id to the spelling known_mailbox_recipients keeps first (or_insert_with). If a reader's live identity is the other spelling, for example team.toml key `Joe` with USER/AIDA_USER=`joe`, mail that `joe` could read before gc is archived and copied to `Joe`. That reader can no longer see it, because Message::addressed_to is exact. Option: skip the re-address when the mismatched spelling is one of this machine's inbox_identities(), or make delivery case-insensitive for known ids.

  Raised in review of PR-2817: https://github.com/joemooney/aida/pull/2817#issuecomment-6329162664
