title: Overlapping auto-releases of one PR can supersede the winner's valid clearance and leave a false tamper hold
description: |
  rework_hold_release.rs release_with / supersede_clearance (TASK-1757 (3), PR-2845). Two auto-releases of the same PR overlap, for example the record-time release from `aida review record` and an `aida merge-hold auto-release` sweep. Release B passes its first pass. It sees A's identical clearance (`same`, so it records nothing) and waits on the hold lock. Release A runs its second pass, drops the labels, and removes the marker (clear_hold, which emits no placed:false event). B then takes the lock. Its second pass fails with "hold changed before release" because read_hold is None and not the snapshot. If A held the lock for more than 10s, B instead hits the busy-lock arm. Either way, supersede_clearance renames A's valid clearance to PR-N.superseded-*.json.

  Result: the marker and the clearance are both gone, and the last MergeHoldChanged event is placed=true. unrecorded_marker_removals flags the PR, read_hold returns MARKER_MISSING_REASON, and every AIDA merge refuses until a human clears it. A false "Auto-release authorization withdrawn" comment is also posted on a PR that was released. This fails closed, but a legitimate release ends up needing a human.

  Fix: in supersede_clearance (or before calling it), skip the supersede when the hold marker is already gone, or supersede only a clearance this run itself recorded (compare the content or a per-run token). Add a test that interleaves two releases.

  Raised in review of PR-2845: https://github.com/joemooney/aida/pull/2845#issuecomment-6376661348
