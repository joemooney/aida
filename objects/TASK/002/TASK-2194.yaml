title: ship-batch wait_for_review silently retries read_ci errors until review timeout
description: |
  aida-cli-lib/src/pr_ship_batch.rs wait_for_review (~:517-524): a read_ci Err, including "could not read the hold label", falls into `_ => {}` and is retried silently until the review timeout. The operator never sees why the wait is not progressing. The behaviour predates PR-2835 and is bounded by the timeout. Suggestion: on Err, show the reason in the periodic "awaiting" line, or stop after N consecutive failures. First noted in TASK-2180 and left unchanged by PR-2842.

  Raised in review of PR-2842: https://github.com/joemooney/aida/pull/2842#issuecomment-6359898329
