title: Store-CAS private-candidate publication and hijack marker lifecycle (A2)
description: 'Carved out of TASK-1332 item 3 by advisor ruling 2026-10-20 21:55 (option A). The CAS writers still commit on canonical HEAD, push_exact, and roll back with rollback_commit_if_head_matches (git_ops.rs ~2407); hijack_node (~4996) is the ordinary S/L shape, not the A2 private-candidate algorithm (private-candidate publication, family authority at remote acceptance, accepted-remote/failed-local-install, ambiguous transport, HIJACKED.toml ordering). First gate: an independent signoff of the A2 V3 proposal relayed on BUG-1808 (see TASK-1332 comments [7] and [10] and the task-1332 analysis comment of 2026-10-20). Code it would touch once signed: aida-core/src/git_ops.rs (push_exact_outcome, rollback_commit_if_head_matches, hijack_node, node writers), aida-cli-lib/src/coordination.rs, aida-core/src/team.rs, aida-core/src/alias.rs. AC: (1) A2 V3 signed on this spec; (2) every CAS writer publishes through a private candidate per the signed design, with a barrier test per writer family; (3) hijack marker lifecycle ordering tested.'
