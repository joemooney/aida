title: known_to_git treats any ls-tree HEAD failure as an unborn HEAD
description: |
  aida-cli-lib/src/child_store_commit.rs known_to_git: must_succeed=false makes any ls-tree HEAD failure return no HEAD paths, so a deleted tracked path is silently dropped and its deletion is never committed. Check for an unborn HEAD with rev-parse --verify -q HEAD and propagate other errors.

  Raised in review of PR-2818: https://github.com/joemooney/aida/pull/2818#issuecomment-6329345831
