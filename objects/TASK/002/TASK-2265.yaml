title: 'dev activate: HomeRepo fallback also fires when AIDA_DEV_REPO is unset, note prints ''(?) no longer exists'''
description: |
  choose_activate_repo (aida-cli-lib/src/dev_cmd.rs:~130) takes the HomeRepo branch whenever env_repo is None/empty and AIDA_DEV_HOME_REPO exists, not only when AIDA_DEV_REPO names a removed path. activate_choice_note (dev_cmd.rs:~804) then prints '$AIDA_DEV_REPO (?) no longer exists', which is misleading. docs/cli/11-dev.md:31 documents the fallback as removed-worktree-only. Gate the fallback on a present-but-missing env_repo, or word the note for the unset case.

  Raised in review of PR-2861: https://github.com/joemooney/aida/pull/2861
