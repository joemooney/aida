title: 'aida: no-complete squash-body marker is GitHub-only; GitLab and pure-git forges drop squash_body'
description: |
  PR-2815's ship side carries the non-completing declaration only in MergeOptions.squash_body. GitHubForge passes it to gh pr merge --body. GitLabForge (forge.rs ~3176) sends only squash_commit_message, and PureGitForge (forge.rs ~2935) commits with the subject only, so on those forges the marker never reaches main. Either carry the body on those forges or document that the declaration is GitHub-only.

  Raised in review of PR-2815: https://github.com/joemooney/aida/pull/2815#issuecomment-6328724758
