title: 'STORY-1917: expired-mandate dispatch refusal is untested though the test doc and signed test plan both name it'
description: |
  The expired-mandate refusal branch in check_request_authority (aida-cli-lib/src/dispatch.rs:884-892) has no test.

  The test module doc (aida-cli-lib/src/tests/story_1917_dispatch_request_tests.rs:8-9) claims coverage for 'when the mandate is expired or stopped', and the signed SKETCH v1 slice-1 test plan item 2 names 'mandate is expired/stopped' explicitly. Only the stopped branch is exercised (tests:471-476).

  This is the same doc-claims-coverage-it-lacks shape as round 1 finding 4 (HumanGates), which was fixed.

  Raised in review of PR-2905: https://github.com/joemooney/aida/pull/2905#issuecomment-6390394038
