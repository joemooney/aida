title: disk-headroom light check runs a full reclaim dry run (gh + offline scan + cache walk) when below the floor
description: |
  escalate_stuck_floor (doctor_cmd.rs, STORY-1916) calls disk_emergency::reclaimable_on, which runs worktree_reclaim::survey_from_env. That means a `gh pr list` network call, up to a 60s offline git merge scan when gh is unreachable, and a walk of every cache tree. It runs on every manual `aida doctor check disk-headroom` while below the floor, on a path BUG-1675 keeps light. In a scheduled run it repeats the cache walk that run_emergency has just done. Consider running the dry run only in the scheduled run, or reusing the emergency survey.

  Raised in review of PR-2859: https://github.com/joemooney/aida/pull/2859#issuecomment-6372979895
