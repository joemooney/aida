title: 'aida list: compute driver map over focused rows only'
description: |
  aida-cli-lib/src/requirements_cli.rs:4884: since BUG-2190 moved the focus retain to after the driver lens, list_driver_map runs over the pre-focus row set. A focused `aida list` now resolves a derived driver (lease probe) for every in-progress spec in the project, not just the focused ones. The pre-focus set is only needed when `--driver` filters rows; for display, the map could be computed (or trimmed) after focus.

