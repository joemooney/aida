title: Autopromote child lock wait (5s) is shorter than the systemd-run launch bound (20s)
description: |
  The tick holds .autopromote.lock across systemd-run, which is bounded by WAVE_UNIT_RUN_TIMEOUT=20s (dev_autopromote.rs:535-545 and :794). The child waits only CHILD_LOCK_WAIT=5s (:39 and :569). If systemd-run returns more than 5s after the unit starts, the child exits 'lock held' without claiming the record. The record then expires after UNCLAIMED_GRACE_SECS and is reported as "the launched build never started", and that SHA is not retried until main moves. Make the child wait at least as long as the launch bound, or hand the lock off before the launch.

  Raised in review of PR-2850: https://github.com/joemooney/aida/pull/2850#issuecomment-6372674647
