title: starts_in_different_schemes treats linux-starttime and sysinfo-start as one scheme; that cross-exact pair still needs liveness
description: |
  review_authority.rs starts_in_different_schemes classes both linux-starttime: and sysinfo-start: as Exact. A pair of tokens split across those two exact schemes, for the same pid, therefore still falls through to strict_match, the liveness probe, so the TASK-2049 residual remains for that pair. Either class them separately (every caller is a refusal check, so this fails closed) or say in the doc comment that the residual is accepted.

