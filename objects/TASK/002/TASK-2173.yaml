title: 'Cargo-timeout hook: $(shell ...) and != assignments run cargo at make parse time but read as safe'
description: |
  aida-core/templates/hooks/aida-cargo-timeout-guard.sh make_targets_skip_cargo skips any assignment line, so a Makefile with 'X := $(shell cargo build)' or 'X != cargo build' plus 'hello:' / '@echo hi' makes 'timeout 1h make hello' silent, though make runs cargo while parsing. Reproduced on PR-2826 head 4077e142f3 and on origin/main (pre-existing). Treat $(shell / != in an assignment (immediate := ::= !=, and recursive = expanded in a prerequisite) as unresolvable.

  Raised in review of PR-2826: https://github.com/joemooney/aida/pull/2826#issuecomment-6342821731
