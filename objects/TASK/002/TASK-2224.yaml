title: Close the write window in write_member_seats for callers without the store lock
description: |
  write_member_seats re-reads the file to compare and swap, then calls write_atomic. A caller that doesn't hold the store write lock (test_support::mint_grant_for) can still lose a write that lands between the re-read and the rename. Either take the store write lock in mint_grant_for or document the residual window.

  Raised in review of PR-2851: https://github.com/joemooney/aida/pull/2851#issuecomment-6367149662
