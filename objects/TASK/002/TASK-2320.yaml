title: BUG-2213 pathspec-mode test omits --ignore-submodules=none from production status args
description: |
  bug_2213_inherited_pathspec_modes_cannot_hide_object_dirt (aida-cli-lib/src/tests/bug_2195_store_snapshot_tests.rs) exercises the snapshot status query under the four GIT_*_PATHSPECS env modes, but its status arg vector omits --ignore-submodules=none, which the production call in store_snapshot (aida-cli-lib/src/mandate_traces.rs:~105) includes. A hypothetical interaction between an inherited pathspec mode and the submodule flag would escape the matrix. Fix: use the exact production arg vector (ideally shared via a constant) in the test.

  Raised in review of PR-2892: https://github.com/joemooney/aida/pull/2892#issuecomment-6381660547
