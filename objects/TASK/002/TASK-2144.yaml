title: Mandate store snapshot ignores other worktrees' detached HEADs that git log --all walks
description: |
  store_snapshot (aida-cli-lib/src/mandate_traces.rs:91-125) records for-each-ref tips plus this worktree's HEAD. The exclusion readers (StoreHistoryBatch, store_history_alias_map) run 'git log --all', which also walks other worktrees' HEADs (I checked this in a fixture). So store_snapshot_stable cannot see an objects/ commit made on a detached HEAD in another worktree during collection, although its doc comment claims no ref change can alter the --all history. This gap already existed (show-ref --head had it too). Fix: add the other worktrees' HEADs (git worktree list --porcelain) to StoreSnapshot.refs.

  Raised in review of PR-2825: https://github.com/joemooney/aida/pull/2825#issuecomment-6335244221
