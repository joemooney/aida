title: Consensus parent-conflict message is misleading when the mapped owner is already among several parents
description: |
  aida-cli-lib/src/regen/consensus.rs:806-818 (link_existing_draft): when existing_parent_uuids returns [owner, other], the "== [owner]" no-op check fails and the code reports a "conflicts with mapped parent ... kept existing parent" conflict, even though the mapped parent is already linked. Behaviour is safe (nothing is written), but the diagnostic is wrong. Treat "parents contains owner" as already-linked, or word the message as a multi-parent notice.

  Raised in review of PR-2745: https://github.com/joemooney/aida/pull/2745
