title: 'Mailbox resolver: one bad agent-registry record should not refuse all mail'
description: |
  mailbox_resolver.rs RecipientDirectory::load returns Err on any unreadable or unparsable .aida/agents/*.toml. agent_registry::load_entries skips such records. One torn or old-schema record blocks every direct send, including person inboxes, and drops all comment mentions (punt_done.rs). Skip and warn instead, or resolve people before the registry scan, and add a corrupt-record test.

  Raised in review of PR-2808: https://github.com/joemooney/aida/pull/2808#issuecomment-6331976477
