title: 'dev-autopromote tick: bound the pre-ff steps, or route a timed-out tick honestly'
description: |
  run_tick (aida-cli-lib/src/dev_autopromote.rs:452-538) checks its TICK_BUDGET only right before the fast-forward. Before that it can spend fetch 40s + rev-parse 2x10s + is_ancestor 30s + gh api commit_checks (30s per page) + the wave guard, which can pass the scheduler's 120s SCHEDULED_COMMAND_TIMEOUT on a slow network. The kill itself is safe because no ff has run yet. But the timeout becomes CronJobFailed:dev-autopromote (maintenance_schedule.rs:3385), and the advisor route prompt calls it 'the scheduled live-binary build failed'. A tick-level Err (for example a write_state failure) is misrouted the same way. Check the deadline before commit_ci as well, and/or reword the route prompt to cover a tick that timed out or errored.

  Raised in review of PR-2850: https://github.com/joemooney/aida/pull/2850#issuecomment-6377435068
