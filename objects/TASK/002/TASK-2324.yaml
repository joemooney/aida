title: 'aida doctor: detect a stale target/.rustc_info.json that replays a cached sccache error'
description: 'Observed 2026-10-24: a stale target/.rustc_info.json cached an sccache EPERM, and every cargo tree/metadata call repeated it until the file was deleted. ACCEPTANCE: aida doctor (or the aida dev build preflight) flags a rustc_info.json whose cached output holds a wrapper error, and offers removing it as the fix (no deletion without --fix). Test with a fixture file.'
