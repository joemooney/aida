title: role enter prints the session-key secret to the terminal when not eval'd
description: |
  require_direct_tty (seat_authority.rs) checks stdin and stderr, not stdout. So a bare 'aida role enter <seat>', with no eval and no shell wrapper, prints the adopt_key_eval_lines heredoc (role_cmd.rs) carrying the 32-byte secret to the terminal and its scrollback. Any same-user process that reads the scrollback (tmux capture-pane, a terminal log) can run 'aida role adopt-key <id>' with it, possess the key, and satisfy the grant binding from any process tree. Fix: when stdout is a terminal, omit the adopt-key lines (or refuse) and print how to eval. Also, '{ set +x; }' does not suppress 'set -v' echoing of the eval'd heredoc.

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6351411790
