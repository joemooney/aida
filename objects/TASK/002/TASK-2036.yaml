title: Main-checkout .git directory branch still skips on a bare commondir file (TASK-2005 class)
description: |
  aida-cli-lib/src/contained_boundary.rs:214 (contained_main_checkout_git_deny_paths): when <root>/.git is a DIRECTORY, the root is skipped if <root>/.git/commondir exists. A real linked worktree's .git is never a directory, so a planted commondir in a main checkout's .git exempts it from the deny. This is the same loose-trust shape TASK-2005 removed from is_linked_worktree_gitdir. Production is unaffected, because main_git_deny_paths denies <main>/.git with no commondir check, so this is defense in depth only. Fix: drop the skip, or apply the commondir-points-back check.

  Raised in review of PR-2790: https://github.com/joemooney/aida/pull/2790#issuecomment-6307743151
