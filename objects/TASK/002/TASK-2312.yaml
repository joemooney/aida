title: 'Agent-tool ratchet: ''instead''/''rather'' negations and ''and'' clauses let launch prose through'
description: |
  aida-core/src/scaffolding/mod.rs AGENT_TOOL_NEGATIONS includes instead/rather, so "launch the fixer with the Agent tool instead of a process" passes names_agent_tool_for_seat_work. "launch the implementer with the Agent tool and no worktree" also passes, because 'and' does not split the clause. Drop instead/rather, or require the negation to precede the tool name. Add both phrasings to the self-test.

  Raised in review of PR-2868: https://github.com/joemooney/aida/pull/2868#issuecomment-6379961377
