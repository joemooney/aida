title: 'BUG-2167: SessionStart hook firing after link_bg_session leaves the bg row unnamed'
description: |
  agent_launch.rs:3052-3076 / agent_registry.rs:625-628 (PR-2809): a hook that fires after link_bg_session (the --bg session starts asynchronously) resolves the linked lease but drops the contradicting env name and has no other name source, so the row is unnamed. If the spare already had an entry with the same pid_start, it keeps that entry's stale name. adopt_bg_session_identity does not run again. Take the name from the lease or manifest, or test that the post-link ordering ends with the launch's name.

  Raised in review of PR-2809: https://github.com/joemooney/aida/pull/2809#issuecomment-6327023259
