title: roster_check resolves AIDA_STORE eagerly and re-prints the unusable warning on every seat check
description: |
  aida-cli-lib/src/seat_authority.rs roster_check calls store_sync::aida_store_override before the roster is checked, including on the allow path. An unusable AIDA_STORE makes every seat issuance or child delegation print the 'unusable' warning again, on top of the dispatcher's. Resolve the override lazily, only when building a refusal note.

  Raised in review of PR-2831: https://github.com/joemooney/aida/pull/2831#issuecomment-6340353942
