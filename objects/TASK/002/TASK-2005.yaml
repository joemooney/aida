title: is_linked_worktree_gitdir trusts a 'worktrees' parent dir without commondir (BUG-2012)
description: |
  contained_boundary.rs is_linked_worktree_gitdir returns true whenever the gitdir's parent directory is named 'worktrees', even without commondir, so a main checkout whose separate gitdir lives at <x>/worktrees/<name> gets no .git deny. Real linked gitdirs always have commondir; require it.

  Raised in review of PR-2748: https://github.com/joemooney/aida/pull/2748#issuecomment-6293042943
