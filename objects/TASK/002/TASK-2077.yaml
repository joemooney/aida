title: Cargo-timeout hook inert allowlist admits awk/sed/cat command execution
description: |
  awk/sed/cat are on the inert allowlist, but quoted bodies are stripped before the check, so awk 'BEGIN{system("cargo build")}', GNU sed 'e', and cat <(cargo ...) pass as inert. .RECIPEPREFIX and top-level $(eval ...) rule generation are also not seen. Drop awk/sed, treat '<(' as non-inert, and list the remaining misses next to the 'Known misses' line in the header.

  Raised in review of PR-2801: https://github.com/joemooney/aida/pull/2801#issuecomment-6322555279
