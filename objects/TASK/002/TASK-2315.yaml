title: 'stage_resume_transcript: open the source O_NOFOLLOW and fstat it instead of symlink_metadata then read'
description: |
  aida-cli-lib/src/session.rs stage_resume_transcript checks the source transcript with symlink_metadata (regular file, owned by this uid), then reads it with std::fs::read, which follows symlinks. A swap between the check and the read gets past the signoff condition 'never a symlinked source'. Open the source with O_NOFOLLOW, fstat the handle and read from it. The source dir (~/.claude/projects/<main slug>) is host-owned, so the risk is low.

  Raised in review of PR-2838: https://github.com/joemooney/aida/pull/2838#issuecomment-6380858550
