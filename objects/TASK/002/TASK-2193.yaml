title: pr_ship_batch test Fake ignores held, so plan_pr's hold-state propagation to CI is untested
description: |
  aida-cli-lib/src/pr_ship_batch.rs: the test Fake's ci_at_head (~:1072) takes `_held` and ignores it. As a result, nothing checks that plan_pr (~:272) passes `held.is_some()` into ci_with_hold. A constant `false` there would still pass every test, and a held PR whose only red check is merge-hold-gate would then show "red" in the dry-run plan. Suggestion: record `held` in the Fake (for example ci_heads: Vec<(u64, String, bool)>) and assert it in task_2180_dry_run_reads_the_hold_once_and_names_it.

  Raised in review of PR-2842: https://github.com/joemooney/aida/pull/2842#issuecomment-6359898329
