title: Claude sessions in the AIDA repo never see the 'Where change notes go' rule
description: |
  PR-2783 (BUG-2174) puts the rule in generate_aida_md, which feeds .claude/AIDA.md and the AGENTS.md autogen block. In the AIDA repo itself .claude/AIDA.md is neither tracked nor present, and CLAUDE.md doesn't carry the rule or point at AGENTS.md. So Claude sessions here never get it, while the operator's global ~/.claude/CLAUDE.md asks them to keep OVERVIEW.md updated. Consider a one-line rule or pointer in CLAUDE.md, within aida-core/templates/context-budget.toml.

  Raised in review of PR-2783: https://github.com/joemooney/aida/pull/2783
