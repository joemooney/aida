title: aida search --fields help is hand-written and drifts from the shared parser set
description: |
  aida search --fields parses through the same toon_list_fields as aida list (requirements_cli.rs ~9460), so after PR-2852 it also accepts whitespace separators, `opened` and the created_at/created aliases. Its clap help is still hand-written and lists only a subset of TOON_LIST_KNOWN_FIELDS. Generate it from the same constants (as list_fields_help() does) and pin it with a test like list_fields_help_matches_parser_set.

  Raised in review of PR-2852: https://github.com/joemooney/aida/pull/2852#issuecomment-6368328932
