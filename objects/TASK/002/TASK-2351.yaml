spec_id: TASK-2351
agreed_id: TASK-2351
title: aida ship step 1 runs git add -A and aborts on sandbox device mounts / sweeps untracked files
description: |
  `aida ship TASK-1865 --no-merge` died at step 1 ("committing uncommitted work"): `git add -A` failed with "error: .claude/agents: can only add regular files, symbolic links or git-directories". In a sandboxed seat worktree, untracked `.claude/agents`, `.claude/output-styles`, `.gitmodules`, `.idea`, `.vscode`, etc. are bind-mounted character devices. The tree had no tracked changes, so step 1 had nothing to commit. Even so, `git add -A` would also sweep any stray untracked file into the spec commit.
  Suggestion: skip step 1 when `git status --porcelain --untracked-files=no` is empty, or stage tracked changes only (`git add -u`).
  Separately, `aida pr auto-queue-review` in the same worktree reported "no `origin` remote (local-only project)" right after a successful push and `gh pr create` (PR #2925). It is probably misreading the remote under the sandbox (.gitmodules is unreadable there).

  Raised by the implementer while working TASK-1865.
