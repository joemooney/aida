title: grant_keyring install leaks a joined session keyring when add_key fails after JOIN
description: |
  grant_keyring.rs sys::install (new-keyring branch, ~lines 151-178): KEYCTL_JOIN_SESSION_KEYRING succeeds and the thread's session keyring changes, but if add_key, SETPERM or SET_TIMEOUT then fails (e.g. EDQUOT), install returns Err before LAUNCHER_KEYRING is set. The next launch on that thread sees reuse != current keyring and joins (and chains) another keyring, so repeated failing launches add keyring objects against the quota on exactly the EDQUOT path. Fix: record the joined ring in LAUNCHER_KEYRING as soon as JOIN succeeds (return it alongside the error), or unwind the join.

  Raised in review of PR-2830: https://github.com/joemooney/aida/pull/2830#issuecomment-6365656262
