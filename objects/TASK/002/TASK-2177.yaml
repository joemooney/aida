title: 'Mailbox resolver: from a sandboxed CLI, 24h-heartbeat unverified readers keep zero-reader refusal from firing for active roles'
description: |
  mailbox_resolver.rs:44-53: each sandboxed CLI command runs in its own PID namespace, so every registry record is foreign and liveness reduces to 'last_active_at within 24h'. In the real store on 2026-10-22, 73 reviewer, 29 advisor, 9 integrator and 15 implementer unended records count as unverified readers, mostly finished headless sessions. So role sends from agents rarely refuse, and notices report many unverified readers. This is the accepted cost of the TTL; STORY-1843 PR2 session bindings or ended-record reconciliation should give real liveness.

  Raised in review of PR-2808: https://github.com/joemooney/aida/pull/2808#issuecomment-6347529888
