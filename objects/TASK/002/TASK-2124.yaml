title: TASK-1915 ship-ledger wiring pin misses '?' early exits
description: |
  aida-cli-lib/src/tests/task_1915_mandate_ship_failure_ledger_tests.rs: the pin every_exit_between_the_mandate_release_and_the_merge_ledgers_a_refusal finds exits by looking only for lines starting with 'return Err(' and lines containing 'bail!('. If someone adds a '?' early exit between the mandate release decision and the merge in pr_ship_with_method, that ship can fail without a MandateDriveAction row and the pin stays green. There are no '?' exits in the window today. Also: pr_cmd.rs:3581 (the non-mandate Ok(false) arm) makes a ledger call that never does anything, because mandate_release is always None there. A comment should say so.

  Raised in review of PR-2802: https://github.com/joemooney/aida/pull/2802#issuecomment-6329349919
