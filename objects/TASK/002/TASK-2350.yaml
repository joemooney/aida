title: aida pr auto-queue-review falsely reports 'no origin remote' in a sandboxed worktree
description: |
  In the TASK-2346 implementer seat (worktree aida-seat-aida-task-2346, Claude Code sandbox), `aida pr auto-queue-review` — both bare and with `--branch task-2346` — skipped with:

    auto-queue: no `origin` remote (local-only project) — no PR can exist, so no reviewer story was filed

  But the worktree has a working origin (`git remote -v` → https://github.com/joemooney/aida.git) and PR #2923 had just been pushed/opened from the same shell. The remote-detection path presumably trips on the sandbox environment (e.g. the deny-masked `.gitmodules` device node emits "Permission denied" warnings on some git invocations, or detection runs against a different checkout).

  Impact: reviewer auto-queue silently no-ops for sandboxed implementer seats, so review routing falls back to whoever launched the seat. Worth hardening the detection (distinguish "no remote configured" from "remote lookup failed").

  Raised by the implementer while working TASK-2346.
  Branch: task-2346  ·  Commit: 7a71a9c (PR #2923)
