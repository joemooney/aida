title: Test that aida list --format json --fields opened emits an 'opened' key
description: |
  PR-2852 (TASK-2205) added the 'opened' field. In narrowed JSON (requirements_cli.rs ~5300-5330) it is emitted only through the toon_list_cell fallback, because the full ListJsonRow has no 'opened' key. No test pins this, so a later change to the fallback could silently drop it. Add a JSON narrowing test for --fields opened (and an alias such as created_at).

  Raised in review of PR-2852: https://github.com/joemooney/aida/pull/2852#issuecomment-6369092757
