title: merge-hold-gate train mode trusts the members line without checking the commit trailers
description: |
  .github/workflows/merge-hold-gate.yml train mode reads the 'aida-train-members:' body line and checks those PRs' labels. It never checks the line against the train commits' Aida-Train-Member trailers, so a hand-made train/* PR can name any hold-clear PRs. This is no escalation over an ordinary unlabelled PR, but two-seat-protocol.md presents it as the server-side member check. Either cross-check the trailers or say the line is advisory.

  Raised in review of PR-2843: https://github.com/joemooney/aida/pull/2843#issuecomment-6372926096
