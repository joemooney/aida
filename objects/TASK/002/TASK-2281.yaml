title: PidNamespaceProbe init allowlist misclassifies runit/openrc/s6 hosts as isolated
description: |
  PidNamespaceProbe::is_isolated (agent_registry.rs) treats any pid 1 whose comm is not in [systemd, init, tini, dumb-init, docker-init, catatonit] as an isolated sandbox. Hosts running runit, openrc-init, s6-svscan or busybox init fail that check. On them an ordinary host shell gets observer.isolated = true, so unstamped legacy registry rows go unobserved (gc skips them, agent ls shows them heartbeat-based) and agent ls prints "run outside the sandbox" when there is no sandbox. Consider dropping the comm heuristic or widening the list.

  Raised in review of PR-2860: https://github.com/joemooney/aida/pull/2860#issuecomment-6375776160
