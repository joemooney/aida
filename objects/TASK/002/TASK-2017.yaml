title: test_git helper leaks one git template tempdir per test process
description: |
  test_git::git_command() (aida-core/src/test_git.rs, aida-cli-lib/src/test_git.rs, aida-cli/tests/support/test_git.rs) keeps its init.templateDir in a `static OnceLock<tempfile::TempDir>`. Rust never drops statics, so the TempDir destructor never runs and each test process leaves a /tmp/aida-test-git-template-* directory behind. Under nextest (process per test, as the CI "Nextest shadow" lanes and many local runs use) that is one leaked dir for every test that calls the helper. Two such leftovers were already in /tmp on the reviewer host during review. Fix: use a stable path keyed by content hash (written idempotently), or a path under target/, instead of a per-process TempDir.

  Raised in review of PR-2779: https://github.com/joemooney/aida/pull/2779
