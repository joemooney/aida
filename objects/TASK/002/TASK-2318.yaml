title: Seat clone over ssh stalls 30s on a passphrase/host-key prompt instead of failing fast
description: |
  run_origin_clone (aida-cli-lib/src/seat_clone.rs, clone_and_checkout) sets GIT_TERMINAL_PROMPT=0 and stdin=null, which stops https credential prompts. ssh ignores both: it opens /dev/tty for passphrase and host-key prompts. Because command_output_with_timeout_capped puts git in its own process group, ssh gets SIGTTIN and stops, so the launch waits the full 30s before the timeout falls back. Consider GIT_SSH_COMMAND / core.sshCommand with `-o BatchMode=yes` (preserving any configured ssh command) so an ssh origin that needs interaction fails at once.

  Raised in review of PR-2887: https://github.com/joemooney/aida/pull/2887#issuecomment-6380867572
