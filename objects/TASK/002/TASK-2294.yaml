title: 'Cargo-timeout hook: $(shell ...) in a target-specific := assignment or a rule prerequisite runs cargo at parse time but reads as safe'
description: |
  TASK-2173 (folded into TASK-1955 slice 8) made `X := $(shell ...)`, `X != ...`, a recursive `X = $(shell ...)` and a `$(shell ...)` in a define body fail closed in aida-core/templates/hooks/aida-cargo-timeout-guard.sh (make_targets_skip_cargo). Two other places where make runs `$(shell ...)` while it parses the Makefile still fail open:

  1. A target-specific immediate assignment: `other: X := $(shell cargo build)`. The line is a rule line (`c < eq`, and `body ~ /=/`), so it hits `owner = ""; next` and the shell check never runs.
  2. A prerequisite list of ANOTHER target: `other: $(shell cargo build)`. make expands prerequisites immediately, but the `$` only marks `bad[other]`, which matters only when `other` is reached.

  Reproduced against PR-2855 head 05e2bcd8e7: with a Makefile `other: X := $(shell cargo build)` / `hello: notes.txt` / `\t@echo hi`, `timeout 1h make hello` gets no hint. The same is true for `other2: $(shell cargo build)`. `make -s hello` on that Makefile with `touch` in place of cargo creates both marker files, which confirms that make runs both at parse time.

  Fix: treat any `$(shell` / `${shell` anywhere outside a recipe line as unresolvable (`!=` is already covered). Add both cases to tests/test_cargo_timeout_guard.sh. Impact is minor because the hook only warns.

  Raised in review of PR-2855: https://github.com/joemooney/aida/pull/2855
