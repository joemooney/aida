title: 'Cargo-timeout hook: computed variable name assigned with := reads as an unresolvable rule line'
description: |
  aida-core/templates/hooks/aida-cargo-timeout-guard.sh: the expansion-before-colon check uses c < eq, and the ":" of ":=" (or "::=") satisfies it, so "$(N)_FLAGS := -O2" fails closed and prints a false-positive cargo hint. "$(N)_FLAGS = -O2" is silent. Safe direction. Strip the assignment-operator colon before comparing, and add a fixture.

  Raised in review of PR-2826: https://github.com/joemooney/aida/pull/2826#issuecomment-6352239272
