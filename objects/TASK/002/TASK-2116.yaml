title: Explicit --no-complete squash body drops GitHub-derived Co-authored-by trailers
description: |
  pr_cmd.rs pr_ship_with_method: when the identity gate leaves the body to the forge, a --no-complete or body-marker ship now passes an explicit body (identity_gate::squash_commit_messages_body). With an explicit --body, GitHub no longer derives Co-authored-by trailers from other commit authors, so co-author credit an ordinary squash keeps is lost. Document the trade-off, or append those trailers (subject to the identity allowlist).

  Raised in review of PR-2815: https://github.com/joemooney/aida/pull/2815#issuecomment-6328724758
