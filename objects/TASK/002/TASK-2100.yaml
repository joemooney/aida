title: BatchMode append breaks plink-variant GIT_SSH in the origin/HEAD probe
description: |
  forge.rs ssh_command_with_batch_mode appends OpenSSH's '-o BatchMode=yes' to whatever ssh command is configured. When GIT_SSH or GIT_SSH_COMMAND names plink or tortoiseplink, git selects that ssh.variant, and plink rejects -o. The ls-remote probe then fails, where before this PR it forced plain ssh. AIDA is Linux-only, so impact is low. Options: skip the append when the detected variant is not OpenSSH, or document the limitation.

  Raised in review of PR-2811: https://github.com/joemooney/aida/pull/2811#issuecomment-6326770207
