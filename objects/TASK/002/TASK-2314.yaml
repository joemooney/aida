title: Mandate trace-exclusion expiry trusts an agent-mutable spec status (Rejected/Superseded)
description: |
  TASK-2168 (PR-2886, mandate.rs trace_operator_only_expired) lifts a trace-derived operator-only exclusion once the traced spec is Completed, Rejected or Superseded. I found no guard on `aida edit --status` for operator-only or ExecutionMode::Operator specs. So an agent seat can reject or supersede an operator-only spec and make the code traced to it mandate-shippable. During a "drive open list to zero" burndown, that can happen by accident. The sticky ledger exists so that loosening a tag can never loosen an exclusion; a status edit now does exactly that. Options: only count a terminal status recorded by a human or advisor (check the store history's author), only honour Completed-via-merge, or record a ledger "expired_at" stamp at the moment of a human-attested completion.

  Raised in review of PR-2886: https://github.com/joemooney/aida/pull/2886#issuecomment-6380849436
