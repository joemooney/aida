title: Pure-git already-merged re-run refuses a fast-forwarded slice
description: |
  pr_cmd.rs pure_git_slice_refs refuses an empty <base>..<slice> range. A pure-git slice merged by fast-forward (the base had not moved) therefore can never be re-run as already-merged, although slice_fork_point explicitly handles the fast-forward case (head~n). It fails closed with a clear error. Fix: confirm the fast-forward case from head~n..head.

  Raised in review of PR-2845: https://github.com/joemooney/aida/pull/2845#issuecomment-6371549385
