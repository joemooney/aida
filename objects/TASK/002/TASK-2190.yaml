title: TASK-2143 ratchet brace_delta mis-tracks raw strings, so a test module can swallow the rest of a file
description: |
  aida-cli-lib/src/tests/task_2143_clone_git_ratchet_tests.rs brace_delta treats a backslash in any string as an escape and has no raw-string delimiters. So r"\" or r#"a"b"# inside a #[cfg(test)] module leaves in_string open: the module never closes and the remaining production lines are skipped, so a raw git builder added after it goes uncounted (fail-open). A '\u{7b}' char literal also miscounts a brace. Handle raw strings and \u{..}, and add a layout test.

  Raised in review of PR-2833: https://github.com/joemooney/aida/pull/2833#issuecomment-6359870563
