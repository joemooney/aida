title: contained_mailbox_write_paths mutates the filesystem from path-computation helpers
description: |
  contained_mailbox_write_paths runs create_dir_all(.aida/mailbox), so callers that merely compute grant lists (os_wrap_rw_paths, settings builders) now create directories in the main checkout as a side effect. Pre-sandbox creation is required for the binding, but it belongs at the launch site, not inside a path-listing helper.

  Raised in review of PR-2898: https://github.com/joemooney/aida/pull/2898#issuecomment-6385738243
