title: 'review prepare: a signed-out codex challenger still waits out the 15-minute batch deadline before falling back to unchallenged'
description: |
  TASK-3955 adds a codex sign-in check before the finder's first batch only (aida-cli-lib/src/review_prepare.rs, before review_batches). When the adversarial challenger is codex (--challenger-agent codex, or auto-picked), a signed-out challenger still runs `codex exec`, retries silently until RUN_DEADLINE (15 min), and only then is recorded as unavailable. Suggest running RunnerCall::sign_in_check on the challenger pass too and, on failure, recording it as the challenger_unavailable cause up front.
  Also from F14: per-batch progress lines ("review batch i/N with <agent>") are still not printed.

  Raised by the implementer while working TASK-3955.
