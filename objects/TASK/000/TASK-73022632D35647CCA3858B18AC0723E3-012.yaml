title: 'When STORY-2809 (PR-4027) lands: wire its full-tier gate under Gate::FullCi and pass request_full: false from aida pr train --check'
description: |
  STORY-2824 acceptance (2) names the full-tier rule from STORY-2809, which is not on main yet (PR-4027 open, changes requested). --check runs typed_gate_member_with, where PR-4027 inserts full_tier_gate, so it inherits the rule on merge. Two things to do when the second of the two PRs merges: (a) keep full_tier_gate(checks, pr, &head)? between at_gate(Gate::FullCi) and at_gate(Gate::Corpus) in aida-cli-lib/src/pr_train.rs so the report names the step "full-ci" (the remedy text already exists in pr_train_check.rs); otherwise a full-tier refusal is reported under "approval"; (b) the LiveChecks built in pr_train_check.rs needs request_full: false (a compile error forces this), so the check neither requests a run nor logs a --skip-full-check override. Until then the report has no full-tier row.

  Raised by the implementer while working STORY-2824.
