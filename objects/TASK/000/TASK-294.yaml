- id: 019e4343-8850-7590-b532-63152fc664ad
  author: joe
  content: |-
    Implemented via PR-pending (commit 028fb95e):

    - `aida-worker` bash function emitted by `aida dev shell-init` — loops over `.aida/worker.cmd` directives (drain/drain-args/pause/exit/unknown→pause), wrapped in `timeout --kill-after=5s` (default 1800s, knob AIDA_WORKER_SPEC_TIMEOUT)
    - Scoped `drain <args>` lines pop from the FIFO on success so an overnight heredoc plan drains itself; `nothing to drive` substring triggers sleep (not pause) so a productive worker doesn't wedge on an empty queue
    - New `aida worker directives` subcommand (aida-cli/src/worker.rs) — pre-storage dispatch mirroring STORY-301's `aida drain` pattern, human + --json output
    - Pending directives surface in both `aida status` and `aida drain status` as a one-line "Worker directives: N pending (next: <verb>)" summary
    - Verified the plan's risk #1: GNU timeout reaches exec-chained + forked descendants; setsid-escaped grandchildren survive (documented as the residual the heartbeat followup addresses)

    Test status: 728/728 aida-cli unit tests green + 256/256 aida-core green + 8/8 new shell integration tests (tests/test_aida_worker.sh) + 12/12 new worker.rs unit tests
    Follow-up: TASK-360 (opt-in heartbeat), TASK-361 (typed wrapper subcommands), TASK-362 (promote EPIC-30 if multi-user limits hit), TASK-363 (auto-tune AIDA_WORKER_SPEC_TIMEOUT)
