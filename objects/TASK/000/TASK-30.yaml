spec_id: TASK-30
title: 'aida statusline: omit cache:fresh, only show cache:stale'
description: |-
  Per FR-1-041 follow-up discussion: cache:fresh is reassurance not signal in the typical solo / one-machine flow. The cache is self-healing — stale just means 'next read rebuilds' and the system handles it transparently. Showing 'cache:fresh' on every prompt is noise.

  **Change:** mirror the q:N pattern — only emit the cache field when it's noteworthy. cache:fresh → omitted; cache:stale → still shown (red).

  **Acceptance:**
  - aida statusline (clean cache) drops the cache part entirely
  - aida statusline (stale cache) shows cache:stale in red
  - No CLI flag needed — single-line behavior change
