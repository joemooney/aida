  minor (non-blocking): awaiting_seat_jobs (maintenance_schedule.rs:1910) now puts the operator escalation into EVERY seat's per-turn notice, including headless agent lanes that set AIDA_SESSION_ROLE (implementer/reviewer). The operator route_prompt (mail_backlog.rs:496) is imperative ('wake or relaunch each recipient ... then run aida schedule done mail-backlog-guard-route-operator'), and when the seat has no own job it becomes cron.next, so an agent lane may act on or clear the human's escalation before the human sees it. Spec-compliant per the 17:25 ruling; consider a dedicated escalation row, or restricting to human/operator-terminal sessions.
