    Implemented via PR-27 (commit 5b878d4): https://github.com/joemooney/aida/pull/27

    - New `aida db reconcile-status` subcommand for manual replay of the Done → Completed auto-bump over a wider range than `aida pull` saw
    - Flags: `--since REF` (bounded replay), `--spec SPEC-ID` (single-spec replay), `--dry-run` (preview without writing). Defaults to last 200 commits.
    - Reuses BUG-102 / STORY-86 extraction helpers (extract_spec_ids_from_commit, extract_pr_number_from_commit_subject, parse_review_story_pr_number) but manages its own scan range
    - Refuses to run on a non-default branch (same guard as pull-time helper)
    - Stamps completed_at + completion_sha the same way auto-bump does; logs each flip via record_role_activity
    - 5 integration tests cover: replays missed bump, --dry-run no-write, --spec narrows candidates, idempotent on already-Completed, refuses non-default-branch
    - CLAUDE.md updated with daily-use cheat-sheet entry + recovery hint in the "done vs completed" paragraph

