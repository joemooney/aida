description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-1476, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  aida-cli-lib/src/tests/story_1476_acceptance_trust_tests.rs:550-559 (at reviewed head): cases "*\\\\r" and "*\\\\n" contain a literal backslash followed by r/n in Rust; TOML consequently produces backslash-r/backslash-n text, which is refused by the backslash rule. Add cases that produce actual trailing CR and LF bytes in the TOML-parsed allowlist entry (e.g. construct TOML with escaped `\\r`/`\\n` at the TOML layer or insert raw control characters), and assert the raw entry is rejected before trim. Production parser currently checks `contains_refused_chars(entry)` before `entry.trim()`, so the implementation appears correct; this finding is for regression coverage.

