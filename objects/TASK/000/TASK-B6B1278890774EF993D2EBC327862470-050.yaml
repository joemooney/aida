title: 'non-blocking (minor, race): fill_digests in aida-core/src/mailbox_lifecycle/act…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-B6B1278890774EF993D2EBC327862470-010, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor, race): fill_digests in aida-core/src/mailbox_lifecycle/activation.rs hashes /proc/<pid>/exe without checking that the opened file's dev/ino still equals the exe_id scan_proc saw, and caches the digest per exe_id. If a writer exits and its pid is reused by a process on this build between the scan and the digest, that digest is attributed to the other build's exe_id (and cached for every host sharing it), which would fail open. Fix: compare file.metadata() dev/ino with the expected id in digest_file and treat a mismatch as None.
  Reviewed sha: b6f9c1895b9d1c94fd4afa2853077fbd0122c808
