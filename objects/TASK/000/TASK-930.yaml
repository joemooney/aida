title: 'aida queue list: one-line summary footer (N items · M routed · K unrouted)'
description: |-
  Add a one-line summary FOOTER to `aida queue list`: after the items, print a single line like "N items · M routed · K unrouted" (counts of total queued, items routed to a role via --for, and unrouted items). Small, visible, human-testable.

  This is the DEMO SPEC for an end-to-end lifecycle walkthrough (Draft -> advisor approval -> implementation -> human test-plan verification -> reviewer accept -> Completed) driven through the redesign TUI. Left as a Draft; the implementer will write its ## Test Plan during implementation.

  ACCEPTANCE: `aida queue list` ends with a summary footer showing total / routed / unrouted counts; counts are correct; no footer when the queue is empty (the existing empty message stands).
