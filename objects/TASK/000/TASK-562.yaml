title: 'scripts/release.sh ecosystem-watch prompt: auto-decide by age threshold + actionable refresh hint'
description: "## Friction\n\nscripts/release.sh's 'Ecosystem Watch Verification' prompt:\n\n  ─── Ecosystem Watch Verification ───\n    Ecosystem Watch last updated: 2026-05-18\n    Reminder: Major and minor releases require an ecosystem scan and refresh.\n    Has the ecosystem review been completed/updated? [y/N]:\n\nThree UX problems:\n\n1. **'Ecosystem scan and refresh' is not actionable** — operator doesn't know if it's a command to run, a doc to read, a checklist to walk, or what. No link, no command, no hint.\n\n2. **Raw date with no age context** — '2026-05-18' is meaningless without computing 'how long ago' against the current date. Operator must do mental math.\n\n3. **No auto-decision threshold** — every minor/major release the operator gets prompted regardless of how recent. A 3-day-fresh watch + a 90-day-stale watch get the same prompt; both require manual y/N.\n\nOperator's stated friction 2026-05-25: 'Major and minor releases require an ecosystem scan and refresh means nothing to me, is it a command, and if so why not run it or at least check the timestamp of some marker file or json info about when last run relative to latest commit or whatever'.\n\n## Proposed shape\n\nReplace the prompt with smart-default behavior:\n\n  ─── Ecosystem Watch Verification ───\n    File: docs/competitive-analysis/ecosystem-watch.md\n    Internal marker: 2026-05-18 (7 days ago)\n    Last commit:     2026-05-22 (3 days ago) [STORY-318]\n    Threshold for auto-pass: 14 days\n    Threshold for warn-then-prompt: 14-30 days\n    Threshold for require-action: 30+ days\n\n    [auto-pass] ✓ Fresh — continuing release.\n    OR\n    [warn]      ⚠ Stale — refresh recommended. Continue anyway? [y/N]:\n    OR\n    [require]   ✗ Too stale — refresh required before release.\n                Refresh by:\n                1. Open docs/competitive-analysis/ecosystem-watch.md\n                2. Run advisor-driven scan (or use /aida-digest with --audience self for a starting point)\n                3. Add a new dated entry for any ecosystem-shift you spot\n                4. Commit + re-run scripts/release.sh\n                \n                Override with --skip-ecosystem-check or AIDA_SKIP_ECOSYSTEM_CHECK=1.\n\nLogic:\n- Compute age from file's 'Last updated' YAML/markdown header (or from git log mtime — both, pick max)\n- <14 days: silent pass\n- 14-30 days: print warning + still proceed (y/N prompt default y)\n- 30+ days: refuse without operator override\n\n## Acceptance\n\n- [ ] scripts/release.sh computes ecosystem-watch age (max of internal marker + last-commit mtime)\n- [ ] <14 days → silent pass with brief age display\n- [ ] 14-30 days → warn + prompt (default y)\n- [ ] 30+ days → refuse without override flag (--skip-ecosystem-check + AIDA_SKIP_ECOSYSTEM_CHECK)\n- [ ] Prompt shows actionable refresh steps (file path + concrete steps + override path)\n- [ ] Test: simulate file ages via tmpfile + verify each threshold path\n\n## Composes with\n\n- feedback_competitive_analysis_is_living_doc (the underlying discipline)\n- Advisor role's 7th responsibility (ecosystem watch captain — per discipline-pack advisor-role.md)\n- STORY-472 (aida release verb — could wrap this same logic + extend with --skip-ecosystem-check flag)\n- /aida-digest skill (could be the suggested refresh-source)\n\n## Origin\n\n2026-05-25 operator hit the prompt during a release attempt: 'Major and minor releases require an ecosystem scan and refresh means nothing to me'. Master concurs — opaque-prompt + no-actionable-step is the recurring papercut shape; threshold-based smart-default is the fix.\n\ntrace:TASK-X"
