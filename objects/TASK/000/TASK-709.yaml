title: 'CI gate: deny clippy correctness lints so logic bugs can''t merge (the substrate bouncer for BUG-473''s class)'
description: 'BUG-473 (3 clippy correctness ERRORS sitting on main) only happened because CI runs clippy in warn mode, so deny-by-default correctness lints don''t block a merge. A rule in CLAUDE.md won''t hold against confident agents; the fix is a programmatic gate. Make CI fail on clippy CORRECTNESS lints (e.g. `cargo clippy -- -D clippy::correctness` in .github/workflows/ci.yml, or stop whatever forces -W) WITHOUT requiring the ~252 pre-existing style/pedantic warnings to be cleaned first. Verify the gate is red on BUG-473''s pre-fix state and green after. Depends-on: BUG-473 landing first (else this gate would block all PRs). Blocked-by BUG-473.'
