title: 'aida queue work status-aware error (TASK-217): Done case should suggest ''gh pr merge'' when user is PR author'
description: |-
  TASK-217 shipped the status-aware error for aida queue work. For Done-status specs, it currently says:

    Error: STORY-128 isn't queued. Status is Done (work finished on a branch).
      If review found issues and more commits are needed: aida queue rework SPEC --work --resume
      If just waiting for merge: nothing to do — auto-bump fires when the PR merges.

  The 'just waiting for merge' branch is misleading for solo developers. In that case YOU are the one who needs to trigger the merge — there's no autonomous merger. The message reads as if waiting passively is the right action.

  ## Observed 2026-05-14

  User reviewed PR-28, approved, queue-done'd STORY-128, then ran 'aida queue work STORY-128' to see what's next. Got the Done error. Said 'I don't know what to do now?' — because both branches of the error message implied no action: 'just waiting' framing didn't say 'YOU merge.'

  ## Proposed refinement

  Detect: if PR-N's author == current git user (or AIDA_USER), surface explicit merge guidance:

    Error: STORY-128 isn't queued. Status is Done (work finished on PR-28).
      PR-28 is OPEN, CI green, you are the author.
      Next action: gh pr merge 28 --squash    (then aida pull to auto-bump this story to Completed)

      Alternative paths:
        - Review found issues, push fixups: aida queue rework STORY-128 --work --resume
        - Waiting for a different reviewer/merger: nothing to do now; auto-bump fires on merge

  Three explicit branches instead of two. The dominant branch (you're solo + you author + you merge) is named explicitly.

  ## Detection logic

  For the Done case:
  1. Find the PR associated with the spec (already linked via 'About: PR-N' field added by BUG-102's fix)
  2. Query gh pr view N --json author,state,statusCheckRollup
  3. If author.login == current shell user (or AIDA_USER) AND state == OPEN AND CI green → surface explicit merge command
  4. If author != current user → surface 'waiting for merge by author' framing
  5. If CI not green → surface 'fix CI first' framing

  ## Composes with

  - TASK-217 (status-aware error — shipped): this is a direct extension of the Done case
  - BUG-102 (review story auto-bump — shipped): adds the 'About: PR-N' linkage this detection needs
  - TASK-110 (next-steps ordering — shipped): same family of skill-text correctness work
  - STORY-127 (workflow state-aware guidance): this TASK is an instance of the broader principle

  ## Why low priority

  The current message isn't wrong, just incomplete. Users CAN figure out 'I need to gh pr merge' from context. The fix removes that cognitive step. Quality-of-life polish.

  ## Acceptance

  - [ ] aida queue work Done-case error detects PR author + state + CI status
  - [ ] If user is author + PR is open + CI green: surface 'gh pr merge N --squash' explicitly with 'then aida pull' follow-up
  - [ ] If user is author + CI red: surface 'fix CI first' guidance
  - [ ] If user is not author: surface 'waiting for merger' framing (today's text, basically)
  - [ ] gh missing → graceful degrade to today's text
  - [ ] Tests cover: solo-dev case (author + CI green), CI-red case, non-author case, no-PR-found case

  ## Discovered via

  2026-05-14 — user observed: 'I don't know what to do now?' when status-aware error didn't surface the gh pr merge action.
