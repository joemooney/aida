title: 'aida init: auto-register the project into ~/.aida/projects.toml (the registry-fills-itself half of STORY-675)'
description: |-
  Split from STORY-675, which shipped the high-value half (the interactive detect + join-vs-create-vs-abort prompt). This is the other half: after a successful init (create or attach), append a [[project]] entry (name, path, repo, store_path) to ~/.aida/projects.toml if not already present, comment-preserving (toml_edit, like glyph_config), so the registry fills itself.

  DEFERRED on purpose: projects.toml is NOT consumed by aida today (verified: no code computes its path; its own header says EPIC-22 will wire consumption). Auto-registering into a file nothing reads is plumbing-before-consumption. REVISIT TRIGGER: when EPIC-22 (or any feature) starts READING projects.toml — implement the write half in the same change so the registry has data to read. Until then, low priority.

  Acceptance: after aida init in a new repo, ~/.aida/projects.toml gains a [[project]] entry for it (idempotent; existing hand-maintained entries + comments preserved); paired with a consumer that reads it.
