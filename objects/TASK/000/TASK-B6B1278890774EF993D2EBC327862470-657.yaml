  content: |
    IMPLEMENTER FORK (TASK-2707 PR0, claude implementer, 2026-11-02 07:5x MST)

    The signed path main/.aida/cache/ is NOT free. It already exists on the host (since 2026-10-10) and production code writes other JSON caches into it:
      aida-cli-lib/src/doctor_cmd.rs:6483        .aida/cache/worktree-verdicts.json
      aida-cli-lib/src/criteria_coverage.rs:645  .aida/cache/capture-coverage.json
      aida-cli-lib/src/status_awaiting.rs:3482/3669  .aida/cache/awaiting-nightly-red.json, cross-platform-ci-status.json
    So .aida/cache/ cannot satisfy the directory-leaf invariant ("holds ONLY cache.db and its sidecars") without also moving those.

    Options:
      F1 (taken, recommended) Put the SQLite cache in a NEW dedicated directory, .aida/cache-db/, holding only cache.db and its sidecars. The name lives in ONE constant (aida_core::db::CACHE_DIR_NAME), so a rename is a one-line change. The JSON caches are untouched.
      F2 Keep .aida/cache/ for SQLite and move the four JSON caches elsewhere. More churn (4 modules plus their tests, plus a second migration), outside PR0's stated scope.

    I am proceeding with F1 so PR0 is not blocked; if the advisor prefers F2 or another name, it is a constant change plus the migration source. Flag it on the PR review.
