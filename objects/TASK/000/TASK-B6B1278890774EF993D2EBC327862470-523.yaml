title: 'minor: no guard that the shard union equals cargo test --workspace''s target set…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1949, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: no guard that the shard union equals cargo test --workspace's target set — scripts/ci-test-shards.py commands() hardcodes aida-cli --bins/--test and aida-cli-lib --lib/--doc/--test; a future aida-cli lib target or aida-cli-lib bin/test=true example would be silently dropped. Add a test over real cargo metadata asserting every test=true/doctest target is selected by exactly one shard.
