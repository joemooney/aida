- id: 01a1ad46-b6ef-7f71-9ec3-9c6419954230
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3114):
    Verdict: CHANGES REQUESTED
    Reviewed commit: abe29b03f3cd
    Recorded: 2026-11-05T19:31:57.295861694+00:00
    Findings:
    1. BLOCKING (CI red): tests/test_containment_conformance.py:24-31 test_policy_resolves_in_script_repository_from_outside_cwd only passes when the checkout has a refs/remotes/origin/main ref. In CI, actions/checkout@v5 (.github/workflows/ci.yml:50) on pull_request fetches only refs/pull/N/merge at depth 1, so trusted_policy_sha() raises ValueError and step 'Containment conformance evidence tests' fails on job 127443672375 at abe29b03, and earlier at b493a81 (the same step passes on main at c8721a6). Fix: build a fixture repo (git init + commit + git update-ref refs/remotes/origin/main HEAD) with scripts/containment/conformance.py under it. Patch c.__file__ to that path, as the missing-ref test already does, and compare against the fixture SHA. The test must never read the real checkout's refs.
    2. ACCEPTANCE GAP: TASK-3114 says 'if it no longer applies, say so in the PR body'. PR #3438's body is only the generic from-seat publication line. It never states that TASK-2863 is resolved by the STORY-2460 advisor ruling and fresh-run record (comments[9]/[10], 2026-11-05 12:29/12:41 UTC) or that further AGY work belongs to TASK-3048, which the seat handoff explicitly requested. Fix: edit the PR body with gh pr edit 3438 --body to list each superseded finding and its disposition. No code change.
    3. NON-BLOCKING (minor): aida-cli-lib/src/lib_part1.rs:1205-1226 derive_semantic_title's pr-review branch takes the token right after the first 'review' anywhere in argv via skip_while, not the positional after the matched pr/review pair. So 'aida pr review --some-option 12' falls back to the generic title. A bare number is also always labelled PR-N, even on a GitLab project where it resolves to MR-N. Suggest using the first non-flag argument after the matched pair. Optional in this rework.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
