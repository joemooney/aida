title: 'CI: cancel superseded pull_request runs with a per-PR concurrency group, so trains are not starved by stale-head runs'
description: |-
  Seen 2026-11-06 13:15 MST: 30 CI runs were queued. A train's CI (gates) job waited 45 min behind runs for PR heads that had already been superseded. The advisor cancelled 16 of them by hand. No workflow under .github/workflows declares concurrency.

  Change: in ci.yml (and the merge-hold-gate workflow if it runs per PR), add
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  Pushes to main and train/* branches are never cancelled (they key on ref, and cancel-in-progress is false off pull_request). Check that the merge-hold-gate check still reports on the latest head after a cancel. If label events re-trigger it, the group must not drop the newest run. Document the behavior in the CI section of docs/internal/agents/aida-repository-guide.md.

  Gate: make check-ci-fast (it includes the workflow lint gates). No cargo.
