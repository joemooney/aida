  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3267):
    Verdict: CHANGES REQUESTED
    Reviewed commit: b6e7c25883a7
    Recorded: 2026-11-06T20:29:38.977704598+00:00
    Findings:
    1. ci.yml:13-15: for push-to-main runs the group CI-refs/heads/main is shared, so main CI now runs one at a time. GitHub keeps only one pending run per group, so with 3+ quick merges the middle main SHA's pending run is replaced (cancelled) and never gets CI, even with cancel-in-progress=false. This breaks the spec invariant 'Pushes to main ... are never cancelled' and is new behaviour (today every main push runs in parallel). Fix: key non-PR events uniquely, e.g. group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }} (merge_group refs are already unique), keep cancel-in-progress gated on pull_request, and update the doc paragraph.
    2. ci.yml:11 comment 'Non-PR runs keep running.' and docs/internal/agents/aida-repository-guide.md:244-264 describe the github.ref keying. Once the key changes, rewrite them to say non-PR runs are never grouped or cancelled, and drop the 'does not promise every pending push runs' caveat if it no longer applies.
    3. Gate evidence missing: the spec gate is make check-ci-fast, the implementer handoff says it did not go green (it stopped at the cargo shim), and PR CI at b6e7c258 was all queued/pending when this review was recorded. The rework head needs a green CI (gates) job, which carries the workflow-lint gates, before approval.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
