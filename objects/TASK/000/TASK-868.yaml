  content: 'EVIDENCE (verdict-tilt move 1): aida trace check on AIDAs own codebase found 442 dead trace links (6.52% hard rot) out of 6777 inline traces — 415 unknown (deleted/renumbered targets), 27 rejected; plus 3068 pointing at archived specs (soft signal). This is the concrete proof the papers self-undercut ("traces rot invisibly") was REAL — 6.52% rot existed undetected — and is now catchable by a gate. Follow-up: a chunk of the 415 unknown are deliberate EXAMPLE spec-ids in docs/skill templates (FR-0042 etc.), not real code traces — a refinement should exclude doc/template paths from the hard-rot denominator for an honest code-only rate.'
