title: Trace-rot detector + machine-checkable trace-coverage gate (aida trace check)
description: 'MOVE 1 (highest confidence). aida trace check: scan source for // trace:SPEC-ID, resolve each against the store, flag dangling/renumbered/deleted-target traces + report coverage; wire as a hard CI gate. WHY IT TILTS: neutralizes the papers sharpest self-undercut (P2b, section 3/11) - "trace comments rot invisibly, so the separate model is LESS self-healing than code". A working detector makes traces as self-healing as types (stale -> red), hardening the one uncontested Tier-1 wedge. EVIDENCE: trace-rot incidence run over AIDAs own history (catches the provenance-stealing renumbering the paper admits, #804) - self-test via dogfood on the precise admitted flaw. Size S (store/cache already resolve ids).'
