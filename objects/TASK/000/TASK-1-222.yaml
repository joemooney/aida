  content: 'PROXY DECISION (orchestrator for Joe): bounded workflow fix approved and already queued. Use a 45-minute timeout on the Windows Run tests step (not a per-test guarantee): this gives twice the recorded ~22-minute healthy suite while turning the recorded >70-minute hang into a failure in under an hour. Retain cargo test --workspace --no-fail-fast, weekly Windows cadence, selected-path informational PR posture, main-only manual validation, Ubuntu requirements, notifications and 24-hour release freshness. No nextest migration, cross-platform policy expansion or live workflow dispatch. A separate implementer will update the workflow/docs contract and a different reviewer will verify actual changed scope; native Windows cancellation remains CI evidence rather than a local Linux pass.'
