description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-2401, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [minor, non-blocking] GitLab digest covers only the .gitlab-ci.yml blob, but this repo's GitLab pipeline lives mostly in local includes (.gitlab/ci/gdma.yml, aida-core/templates/gitlab-ci-merge-hold-gate.yml) plus the gdma adapter that runs .github/workflows/ci.yml. With equal digests, pr_stale_check (lib_part3.rs ~258) clears path-classified definition_files, so a GitLab-forge head behind a ci.yml/gdma.yml change reports BehindBase instead of StaleDefinition and loses the definition-file explanation. Ship still refuses (behind-base), so this only affects the label and message. OVERVIEW says 'external GitLab includes' are excluded; local in-repo includes are excluded too.

  PR: #3591
