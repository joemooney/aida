spec_id: TASK-0439
title: Show parent requirement details in tree group headers
description: |-
  `aida list open --tree` currently renders parent groups like `EPIC-56 (5 items)` without the parent requirement's own title/status/details. That makes the parent look like a synthetic or Unscoped bucket instead of the actual requirement.

  Desired behavior: when a tree group is backed by a real parent requirement, render the parent row with its normal identifying details at the parent level, and treat the child count as metadata. For example, prefer output shaped like `EPIC-56 (5 items) Apply AXI...` or `EPIC-56 Apply AXI... [5 items]`, followed by the child rows.

  Acceptance criteria:
  - `aida list open --tree` shows the real parent requirement title/details for scoped parent groups such as `EPIC-56`, not only the item count.
  - Child rows remain nested below the parent as they are today.
  - Synthetic buckets such as truly unscoped groups remain distinguishable from real parent requirements.
  - Add or update coverage for the tree renderer so parent-backed group headers cannot regress to count-only output.
