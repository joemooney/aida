title: 'CLAUDE.md: clarify .claude/ symlink layout (per-file, not per-directory)'
description: |-
  CLAUDE.md says: 'Project-local templates at .claude/skills/, .claude/commands/, .claude/hooks/, and .claude/settings.json are symlinks into aida-core/templates/'.

  Only .claude/settings.json is a directory-level / file-level symlink. The other three are regular directories whose contents are per-file symlinks (24 skills, 25 commands, 2-of-3 hooks at the time of writing). The current wording suggests the directories themselves are symlinks, which they are not.

  Fix: rephrase to make the per-file nature explicit, and note that hooks is currently the partial-coverage exception.
