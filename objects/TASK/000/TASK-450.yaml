title: 'aida init / scaffold: offer to git-add scaffolded files so new projects can commit cleanly'
description: |-
  ## Problem

  After \`aida init\` in a new project, git status looks like:
  \`\`\`
  Untracked files:
      .aida/
      .claude/
      .codex/
      .env.example
      .gitignore
      .mcp.json
      AGENTS.md
      CLAUDE.md
      Cargo.lock     ← user's own; not AIDA-owned
      Cargo.toml     ← user's own; not AIDA-owned
      OVERVIEW.md
      src/           ← user's own; not AIDA-owned
      style/         ← user's own; not AIDA-owned
  \`\`\`

  The user has to manually \`git add\` the AIDA-scaffolded files. For a first-user this is friction; for any user it's at least an extra command.

  ## Approach

  After scaffold, offer (interactive) or auto-execute (with a flag) the \`git add\` of AIDA-OWNED files only. Specifically:
  - \`.aida/config.toml\` (the allow-listed file inside the gitignore-by-default \`.aida/\`)
  - \`.gitignore\` (AIDA wrote/modified it)
  - \`.mcp.json\`, \`AGENTS.md\`, \`CLAUDE.md\`, \`OVERVIEW.md\`, \`.env.example\`
  - \`.claude/\` and \`.codex/\` directories

  NOT user-owned files (\`Cargo.toml\`, \`src/\`, etc.) — those stay untracked, user decides.

  ## Acceptance

  - \`aida init\` ends with a prompt: *\"Stage X AIDA-owned files for commit? [Y/n]\"* — defaults to Yes. \`aida init --no-stage\` opts out.
  - \`aida scaffold apply\` gains the same prompt + flag.
  - Stages only files AIDA wrote (tracked via a known list or scaffold-manifest, see related BUG above).
  - Doesn't touch files the user owns (Cargo.toml, src/, README.md if pre-existing, etc.).
  - Print a summary at the end: \"Staged X files. Run \`git commit -m 'aida init scaffold'\` to commit.\"

  ## Out of scope

  - Auto-committing. Staging is the safe stop; the user composes their own commit message.

  ## Origin

  User observation 2026-05-22 after \`aida init\` in a new project: *\"should aida scaffold have performed a git add?\"* — small friction, easy fix, aligns with \"single command, then it's set up.\"
