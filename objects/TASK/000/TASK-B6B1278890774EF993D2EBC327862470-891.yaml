title: 'conformance.py continuation supervisor: fix the outer budget arithmetic, the nested SIGTERM/SIGKILL cleanup race, the closed-stdin error and the over-broad advisor --delegate-seat'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2465, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: conformance.py run_aida outer continuation budget is timeout+270, but nested setup can use 4x30s (advisor preflight, spec add, queue add, implementer role enter) plus the inner timeout+180 = timeout+300, so a slow setup is reported as continuation-timeout by the outer supervisor rather than the real outcome; the comment's arithmetic undercounts.

  PR: #3520
