  content: 'Advisor 13:46 ruling (carried findings from #3520, ruled once). One PR: (1) the outer budget covers the nested setup (4x30s) plus inner timeout+180, with corrected comment arithmetic; (2) the setup supervisor SIGKILLs the inner continuation group before the outer group dies, with a test of an inner group that ignores SIGTERM; (3) a closed stdin reports fixture-terminal-stdin-unavailable instead of a bare EBADF (TASK-2943); (4) the advisor setup seat drops --delegate-seat implementer unless setup needs it, matching the docs (TASK-2940). Python tests plus make check-ci-fast; no cargo. Land after BUG-2470 (#3532).'
