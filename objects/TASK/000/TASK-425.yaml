- id: 019e837c-1540-7fb2-b3bc-063c5d523a0b
  author: joe
  content: |-
    VERIFIED — no fix-forward needed. actions/download-artifact@v5 multi-artifact layout is unchanged from v4.

    Authoritative: v5.0.0 release notes + current README confirm the ONLY breaking change is single-artifact-BY-ID downloads (now extract to path/ directly instead of path/<name>/). Multi-artifact mode (no name:, only path:) still nests each artifact in path/<artifact-name>/ — README example: 'etc/usr/artifacts/Artifact-A/ ... Artifact-B/ ...'. merge-multiple:true would flatten, but release.yml does not set it.

    Empirical: PR-142 (v5 upgrade) merged 2026-05-21. Two release tags fired afterward — v0.9.1 (2026-05-23) and v0.11.0 (2026-06-01) — both Release runs completed SUCCESS. v0.11.0 shipped all four expected assets (aida-{linux,darwin}-{x86_64,arm64}.tar.gz), proving the Create Release step resolved release.yml:93-96's four artifacts/<name>/<name>.tar.gz paths. Had v5 flattened/renamed the layout, action-gh-release@v2 would have failed to find the files.

    Durable note added at the download step in release.yml (trace:TASK-425).

    Side observation (out of scope, not a download-artifact issue): the v0.10.0 git tag exists but has no GitHub Release and no release-workflow run — worth a separate look.
