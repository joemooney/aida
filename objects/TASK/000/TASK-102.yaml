  author: joe
  content: |-
    Another failed-attempt signal observed 2026-05-13: agent ran aida relations STORY-86 expecting a top-level relations subcommand. None exists — the actual command is aida rel list <ID> (under the rel subcommand tree).

    This expands TASK-102's scope: not just inline enumeration in aida show, but also adding aida relations <ID> as a top-level alias for aida rel list <ID> (or aida rel show <ID>). The aida rel tree is fine for power users; top-level discoverable verbs are what agents reach for first.

    Suggested expansion to acceptance:
    - [ ] aida relations <ID> works as an alias for aida rel list <ID>
    - [ ] aida rel as a bare subcommand surfaces 'try aida rel list <ID>' or similar discoverable hint

    Same TASK-102 pattern: failed agent attempts at command shape are diagnostic UX signals, not noise.
