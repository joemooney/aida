title: Bound init's codex mcp list/add subprocesses like the --version probe
description: |
  aida-cli-lib/src/init_cmd.rs complete_init_scaffolding: after the now-bounded `codex --version` gate, `codex mcp list` and `codex mcp add aida -- aida mcp-serve` still run via plain `.output()` with inherited stdin and no timeout. If codex answers --version but blocks on mcp (login, network), `aida init --with-mcp` can still hang. Route both through command_output_with_timeout_io with stdin=/dev/null.

  Raised by the implementer while working TASK-3965.
