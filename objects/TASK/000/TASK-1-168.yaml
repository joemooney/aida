spec_id: TASK-1-168
title: aida statusbar --once takes 68s on a surface documented as cache-fast with a 15s interval, and reports unshipped:67 where awaiting reports 38
description: |-
  aida statusbar --once takes 68 SECONDS on a surface documented as cache-fast with a 15s refresh interval, and reports unshipped:67 where awaiting reports 38

  FOUND PROSPECTIVELY, by the mechanical proxy for TASK-1-166: which surfaces are READ BY A DIFFERENT PARTY THAN THE ONE WHO RUNS THEM. The statusbar qualifies — it writes an OSC terminal title on an interval, so an operator reads it continuously and never invokes it. Second surface picked that way; both produced findings.

  MEASURED:

      aida statusbar --once     exit 0, elapsed 68s, 78 bytes of output
      aida status               exit 0, elapsed  1s

  Both are documented as cache/local-fast with no network. One is 68x the other.

  THE DOCUMENTED CONTRACT CONTRADICTS ITSELF AT THAT LATENCY. CLAUDE.md describes statusbar as "refreshed on an interval (default 15s)" and "cache/local-fast, no network, NOT a dispatch surface". A meter whose default refresh interval is 15 seconds and which takes 68 seconds to compute one sample cannot keep its own cadence — each refresh takes roughly four and a half times the interval it is supposed to refresh on. Either the interval silently slips to the sample time, or samples overlap. Neither is what the documentation describes, and an operator watching the title bar has no way to tell how stale the number in front of them is.

  AND ITS NUMBERS DISAGREE WITH THE OTHER SURFACES. Captured within about a minute of each other, same store:

      statusbar:  aida · q:27 · live:0 · STALE:8 · you:78 (11 findings · 67 unshipped)
      awaiting:   awaiting: 46   findings: 11   unshipped: 38   mail_unread: 0
      notice:     "Awaiting you: 11 findings · 8 in rework"
      queue:      count: 22 (reviewer)

    findings    11 / 11 / 11        agree
    unshipped   67 vs 38            DISAGREE, factor of 1.76
    you/awaiting 78 vs 46           DISAGREE
    q           27 vs 22            DISAGREE

  So three surfaces report three different totals for concepts sharing a name. `unshipped` is the sharpest of them because both surfaces use that exact word: 67 and 38, a minute apart, no writes in between.

  I am NOT asserting which is correct. Each may be scoping differently — q:27 could span roles or users, "you:78" may aggregate channels awaiting:46 does not. That is precisely the problem: the surfaces publish bare integers under shared labels with no scope stated, so a reader cannot reconcile them and cannot tell which one answers their question.

  WHY THIS BELONGS WITH TASK-1-167 RATHER THAN AS A PERFORMANCE BUG. The latency and the disagreement are the same defect seen twice. A surface nobody invokes is a surface nobody times, and a surface read continuously by someone who never runs the alternative is one whose numbers are never compared. Both properties follow from the viewer/validator split, not from the code being slow or the arithmetic being wrong.

  RELATION TO BUG-1503: that spec covers `aida status --format json` and `aida awaiting --format json` never returning while their bare forms are sub-second. This is a third surface in the same family, and it differs in one way that may matter to whoever fixes it — statusbar is slow in its DEFAULT form, with no flag involved, so whatever BUG-1503 finds about the json branch bypassing the STORY-707 cache path cannot be the whole explanation here.

  SCOPE: measured from the command line only; I have not read the implementation. The 68s figure is one sample with a 75s budget — it exited 0, so it is a completion time and not a timeout.
