title: 'MCP stdio test: assert spec-ID parse picks expected ID (not first regex match)'
description: |-
  tests/test_mcp_stdio.py:228 and :304 use `re.search(r'\\b([A-Z]+(?:-[A-Z0-9]+)?-\\d+(?:-\\d+)?)\\b', stdout)` to extract the newly-created spec ID from `aida add` / `aida show` stdout. The regex grabs the FIRST match. Today's output starts with the new ID (`Created TASK-NNN: ...`), so the assumption holds, but the test does not assert it — any future change to `aida add`'s output that introduces an earlier all-caps identifier (banner, hint line referencing META-001, etc.) would silently parse the wrong ID and the downstream show/comment/update assertions would fail in confusing ways.

  Suggested fix: either tighten the regex to anchor on the line prefix `aida add` actually emits (e.g. `^(?:Created|Added)\\s+([A-Z]+-\\d+)`), or assert that the parsed ID is the only valid candidate in the stdout (e.g. `assert len(set(matches)) == 1`).

  Raised in review of PR-173: https://github.com/joemooney/aida/pull/173#issuecomment-4516542408
