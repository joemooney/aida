title: 'STORY-2821: ''conflicting'' is judged by git merge-tree, not the forge''s mergeable field'
description: |
  STORY-2821 says refuse-on-conflict refuses "only when the forge reports the PR conflicting with its base". The implementation judges a conflict with `git merge-tree --write-tree` on the base and head refs just fetched from the forge: the reviewer pre-flight reuses the prediction it already computed (aida-cli-lib/src/pr_rebase.rs stale_base_launch), and the review watcher's base probe gained the same check (aida-cli-lib/src/review_watch_forge.rs merge_conflicts). The forge's own `mergeable` field is not read.

  Why: GitHub reports mergeable=UNKNOWN for a while after the base moves, which is exactly when this check runs on a project that lands every 30-40 minutes; reading UNKNOWN as "not conflicting" would let conflicting heads through and reading it as "conflicting" would refuse wrongly. merge-tree gives a settled answer from the same refs. When git cannot say (old git, timeout) the head is treated as not conflicting and is reviewed.

  Decide whether the forge's settled answer should also be consulted (e.g. refuse when either says conflicting).

  Raised by the implementer while working STORY-2821.
