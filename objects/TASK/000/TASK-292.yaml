  content: |-
    Implemented via commit 9cc522a6:

    - `aida queue work --auto-complete` with no positional SPEC now resolves the active role's queue head, inheriting the no-arg "pick the head" semantics instead of erroring "requires a SPEC id".
    - New `resolve_auto_complete_head` walks the role's queue in pickup order and returns the first orchestrator-drivable spec (Draft / Approved / Planned); In Progress / Done / terminal items are skipped with a note. `pick_auto_complete_head` is the unit-tested pure resolver.
    - Empty queue -> "queue is empty for <role>; nothing to drive"; all-in-flight queue gets a distinct capped message.

    Test status: 5/5 new unit tests green; cargo fmt + clippy clean
