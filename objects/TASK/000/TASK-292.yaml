  content: 'Correction (TASK-321, 2026-06-05): acceptance criterion 5 (''Composes naturally with --no-launch …'') is WRONG for the --no-launch half. cli.rs:3195-3198 declares the --auto-complete arg with conflicts_with_all = ["no_launch", "fresh", "list_sessions", "dry_run", "type_filter"], so ''aida queue work --auto-complete --no-launch'' is rejected by clap before it runs. The --batch X half of the criterion holds. Recording the correction here rather than rewriting this completed spec''s description.'
