    Findings:
    1. BLOCKING (CI red, caused by this PR): aida-cli-lib/src/tests/bug_2383_seat_target_overlay_tests.rs:551-559, in task_2829_the_probe_runs_the_lane_job_bwrap_in_a_nested_userns. The fake unshare is written with std::fs::write and then std::fs::set_permissions(..., Permissions::from_mode(0o755)). tests/test_executable_fixture_ratchet.py::test_test_sources_do_not_set_executable_modes_directly forbids that, and it is the step that failed: CI (gates) step 65 'Executable fixture ratchet'. The Build (ubuntu-latest) failure is only the 'Require every CI lane failure' roll-up of the same failure. Fix: replace the write + set_permissions pair with crate::test_exec::write_executable(&fake, format!(...)) and drop the PermissionsExt import. This is the ETXTBSY-safe fixture writer the ratchet enforces. The 'tests::lane_fixture_fails ... FAILED' lines in the CI excerpt are the deliberate nested fixture output of a passing bug_2383_bwrap_ test (FIXTURE_CRATE_TOML, line 1109), not a regression.
    2. Unverified at this head, must be green after the fix: CI (gates) skipped every step after 65 because of the ratchet failure: clippy (69), glyph-literal lint (70), trace/doc-header stranding gate (71) and docs-drift guards (72). Re-check them on the rework head; no defect is known.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
