  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1499, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  resolve_aida_exe_tests.rs:57 no_cli_source_outside_the_resolver_uses_raw_current_executable_lookup fails with left:1 right:0 for aida-cli-lib/src/aida_bin.rs. The guard allowlists exactly one file: 'let allowed = usize::from(path == src_dir.join("lib.rs"))'. This branch moved the resolver into the new aida_bin.rs module, which legitimately makes one current_exe() call. The test's own name says 'outside the resolver' and aida_bin.rs IS now the resolver, so the allowlist is simply stale. Fix: allow lib.rs OR aida_bin.rs. Keep it an exact-count assertion (==, not >=) so a second raw lookup in either file still fails the guard.
