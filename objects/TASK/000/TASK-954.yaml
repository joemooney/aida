title: 'STORY-710 part B: grey out UPDATE verbs when nothing is selected (require explicit selection)'
description: 'Part B of STORY-710 (part A, the carousel, shipped in commit 4d37e487c). UPDATE verbs (approve/queue/accept/defer/request-approval) require >=1 explicitly SELECTED item; when nothing is selected they render GREYED OUT (dimmed, non-selectable, hint ''select item(s) first''). READ verbs (show/why/status) stay always-available (''none = all'' is safe for reads, dangerous for updates). This is a SECOND grey-out axis on top of TASK-947 (status-applicability): a verb is enabled iff status-applicable AND (if UPDATE) has a selection. The read/update classification is a property of each Verb. Prevents accidentally mutating the focused item.'
