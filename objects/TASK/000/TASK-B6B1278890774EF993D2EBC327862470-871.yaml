- id: 01a1b02e-905c-7e51-9cee-52cfd8aba6b8
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3196):
    Verdict: CHANGES REQUESTED
    Reviewed commit: bc5afc3947fe
    Recorded: 2026-11-06T09:05:31.418521836+00:00
    Findings:
    1. 1 (major): admission.rs update() runs ensure!(super::head(&store)? == store_tip, "admission evidence changed; retry") before every push, but nothing retries: it returns Err from the closure for every state. store_tip is snapshotted before read_table's hub fetch (up to 10s per command), so any aida-store commit on this host during that window (an agent's aida comment/edit/add, a concurrent aida sync, or the verdict publication itself at review exit) refuses the transition. For Reserved that is a spurious per-poll error. For Running (dispatcher preflight) and Terminal (finish_admission at child exit) it leaves the hub claim Reserved/Running, and only review nodes admission-reconcile clears it, which needs every watcher on every node stopped and a direct human. That reintroduces round-4 finding 2's wedge through a common race. The check is also TOCTOU: the store can move right after it, so it adds little safety. Re-snapshot config/roster/verdict evidence under a short lock and retry inside the ATTEMPTS loop (or compare only the roster and this change's verdict evidence), and add a test that moves the store tip during a Terminal transition and still lands Terminal.
    2. 2 (minor): validate_anchor's comment says 'an empty shard cannot silently discard a predecessor chain', but nothing enforces it. A shard with no anchor and fewer or no records passes validate_anchor and chain(), and an anchor's predecessor_tip is never checked against the shard's actual history, so an old anchor can be replayed into a later shard. Under the trusted-writer model a buggy writer could still discard an active chain unseen. Either check that a shard's records extend the parent commit's shard unless a fresh anchor names that parent as predecessor_tip, or correct the comment and the guide.
    3. 3 (minor): story2492_admission_two_nodes_race_exactly_one_wins says the new head 'records its unreachable-hub error locally as Failed instead of leaking a slot' but only asserts is_err(). Assert that the loser's local attempt for the new head is Phase::Failed and that a later select() dispatches again.
    4. 4 (cosmetic): trace:STORY-2492.ac8cff0f (AC4: watcher discovery/no double review) is stamped on tests unrelated to AC4: shard budget, direct-human recovery gate, failed hub cancellation, sync refusal. The .Docs trace is on a clap-parse/config test, not the guide. That inflates aida criteria coverage. Trace these to TASK-3196 (or the closest criterion) instead.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
