  content: 'Promoted by joe 2026-09-21: PROMOTED. Cheap, and it is a data-integrity papercut rather than a cosmetic one: free-text finding content containing a flag-like string is re-parsed as arguments, so recording a verdict whose text contained ''--pr N'' printed a clap parse error. Reviewers write flag names in verdict prose constantly — it is the natural way to describe what a command did — so the failure lands exactly on the content most worth recording. Same family as the no-backticks-in-description hazard: the shell and the parser both reach into text that was meant as prose.'
