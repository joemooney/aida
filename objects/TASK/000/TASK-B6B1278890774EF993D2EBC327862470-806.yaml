title: Native queue-done cannot inspect branch/test changes and emits false diagnostics
description: Observed while finishing BUG-2450 in a native Codex seat with read-only .git. aida queue done BUG-2450 --yes successfully marked Done and removed the queue item, but printed current_branch_at returned None and skipped the PR check, then warned missing test-file change despite edits in five test/golden files and verified tests. Raw git status/diff can read those edits. The native Git inspection path appears unable to report evidence here; distinguish unavailable native-seat evidence from a genuinely missing test change and preserve the documented host publication handoff. This is a diagnostic follow-up to TASK-2712, not a failure of the completed BUG-2450 implementation.
