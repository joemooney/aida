    2. [cosmetic] scripts/store-writers.toml (watch_row lock_namespace_within row comment): says the local row namespace is held across audience/thread dispatch, but mailbox_wake_run.rs now drops it before snapshot and submission (round-1 finding 3 fix). Reword to audience/thread validation with short generation rechecks.
