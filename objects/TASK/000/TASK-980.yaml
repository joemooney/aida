  content: 'VERIFIED already wired by STORY-706 itself (commit d27929900, PR #1175) — not left unwired as premised. handle_statusline_command in aida-cli/src/main.rs pushes a magenta-bold focus:<LABEL> segment via crate::focus::resolve_focus(&project_root) (AIDA_FOCUS env > .aida/focus marker > none); shown when set, omitted when absent. Runtime-confirmed against a fresh debug build off origin/main: AIDA_FOCUS=EPIC-55 -> focus:EPIC-55; .aida/focus=STORY-706 -> focus:STORY-706; no focus -> no segment. POSIX/dash-safety N/A — the statusline is the aida statusline Rust subcommand, not a shell script; the settings.json statusLine command (aida statusline --color=always 2>/dev/null || printf %s "$(pwd)") is already bashism-free. No code change needed; closing as already-shipped.'
