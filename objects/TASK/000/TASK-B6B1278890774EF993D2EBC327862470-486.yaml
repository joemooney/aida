description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1803, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [non-blocking, perf] mandate.rs store_history_alias_ids runs an unbounded 'git log --all -G' over the whole store for every trace ID with no current record. On the live store (76k commits) one scan took 24.6s warm and 4m26s cold, using about 12.5s CPU each, and it has no timeout. Use one combined alternation pass for all unresolved IDs, bounded by a timeout that refuses HistoryUnreadable.
