title: Spec heft cannot be edited, so a spec that outgrows its filing-time sizing keeps a stale one that routing reads as truth
description: |
  Spec size, or heft, cannot be changed by the edit verb, so a spec that grows well past its original sizing keeps a stale heft that routing and drains read as truth.

  Observed 2026-09-20 on TASK-1303: filed at heft 2, then edited sixteen times in one day until its description reached roughly twelve thousand characters with thirteen acceptance bullets. It remained heft 2 and stayed routed for an autonomous drain, so an implementer would be handed twelve kilobytes of acceptance for a task labelled small.

  The edit verb exposes title, description, status, priority, type, owner, feature, tags, blocked-by, refs, implementation summary, risk notes, test-coverage notes, mode, origin and weight. Weight is documented as a continuous ranking score beyond the priority enum, which is a different axis from size. So there is no advisor-facing way to correct a heft that has gone stale.

  Two things follow. Heft is set at filing, when the least is known about the work, and is never revisited even though grooming is exactly the activity that discovers a spec is bigger than it looked. And a stale heft is not inert: it is a routing input, so the error is consumed rather than merely displayed.

  THE OBVIOUS REBUTTAL, AND WHY THIS INSTANCE DEFEATS IT. The natural defence of the absent flag is that heft is deliberately a filing-time artifact, and the correct response to a spec outgrowing it is to SPLIT the spec rather than to re-size it. That defence rests on an assumption: that an outgrown spec always has a seam.

  TASK-1303 does not. The advisor proposed splitting it as one documentation section plus three code fixes. Checking the bullets against what they point at showed two of the three supposed code fixes are the same single line of guide prose - session-discipline.md line 311, where one printed command carries both an inverted exit status and an over-broad regex - and that the pattern appears in no executable code anywhere in the repository. The only remaining non-prose item is an existing parity test that must keep passing, which is not work. The spec is one indivisible guide section that grew, which is why it resisted splitting all day and grew instead.

  So this is a counterexample to the premise, not an exception to the rule. The question the finding asks is therefore sharper than whether a flag is missing: it is whether the decision to omit re-sizing was made against an assumption - that outgrown work can always be split - that does not always hold. If the assumption is dropped, some way to correct heft after grooming is required, because splitting is not universally available as the alternative.

  Corroborated independently by the reviewer seat, which confirmed the edit verb's flag list and the same-line finding.

  Worth deciding rather than assuming. If heft is meant to be advisor-maintained, the flag is missing. If it is deliberately filing-time, the decision should be written down along with an answer for the case where splitting is impossible.
