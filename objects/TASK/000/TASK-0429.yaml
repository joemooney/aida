spec_id: TASK-0429
title: Define advisor autopilot policy envelope
description: |-
  Define the explicit authority envelope for advisor autopilot.

  Acceptance:
  - Specify which advisor actions autopilot may take: approve, reject, dedupe, tag, queue, park, route, comment, or ask.
  - Specify hard exclusions: architecture, security, autonomy machinery, high-risk, irreversible, cross-cutting lifecycle changes, keystone work, and anything tagged supervised/review:draft-only/risk:high/blast-radius:high unless explicitly allowed.
  - Define default bias when uncertain: park/escalate rather than approve.
  - Define how project config can narrow or widen the envelope.
  - Document examples of in-envelope and out-of-envelope decisions.
