description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2441, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (deep-pass, authority): when a branch hint is dropped rather than suffix-stripped, the branch's own spec (e.g. SPEC-...-001 for branch spec-...-001-2) leaves the train's ids, so ship_gate_spec_records_for_ids (pr_train_verified.rs:317) no longer evaluates its draft-only/supervised policy; only the title's Refs spec is checked. Before this PR the train failed closed here. aida pr ship already silently skips unresolved ids, so the train now matches ship. Follow-up: strip a trailing -N when the stripped id resolves, and drop the hint only as a fallback.

