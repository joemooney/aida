title: Drain-driven implementer lanes do not refresh their shared claim heartbeat
description: |
  BUG-2706 made the standalone implementer launcher (aida-cli-lib/src/standalone_implementer.rs run()) refresh its session claim's heartbeat every 10 minutes, so a review watcher on another host defers for the whole lane. The drain's implementer phase (aida-cli-lib/src/phase_driver_trait.rs, spawn_and_wait_watched around line 579) does not: the child session mints the lease, so the launcher has no lease id to refresh by until the child exits. A drain implementer on a foreign lane host is therefore deferred only for the claim TTL plus `[review] lane_unknown_defer_mins` (50 minutes by default).

  Suggestion: refresh by claim scope + clone path for the drain phase, or have the phase driver learn the lease id at spawn.

  Raised by the implementer while working BUG-2706.
