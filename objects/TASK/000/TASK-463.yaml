title: 'Commit message validator: support [AI:tool1+tool2] multi-author AI tags for cross-agent commits'
description: |-
  ## Problem

  The commit message validator (\`AIDA_COMMIT_STRICT\` mode in the pre-commit hook) enforces \`[AI:tool]? type(scope): description (REQ-ID)\`. The \`[AI:tool]\` allows a single tool name, but cross-agent commits today have a real pattern of multi-author work — e.g., Codex authored plan files; Claude (master advisor) is the committer. The natural tag is \`[AI:codex+claude]\` or \`[AI:codex,claude]\` to capture both, but the current validator rejects the \`+\` and \`,\` characters.

  ## Acceptance

  - Validator accepts \`[AI:tool1+tool2]\` or \`[AI:tool1,tool2]\` syntax for multi-author commits (pick one separator and document).
  - \`Co-Authored-By:\` trailers remain the canonical machine-readable form; the subject-line tag is informational.
  - Update \`docs/aida-discipline/\` (or wherever the commit format is documented) to call out the multi-author tag explicitly.
  - Add regression test cases covering: single tool, multi-tool (+), multi-tool (,), no-tool, malformed.

  ## Workaround until fix lands

  Use \`[AI:<primary-tool>]\` in the subject and \`Co-Authored-By:\` trailers in the body for additional authors. Slightly less visible in \`git log --oneline\` views but functional.

  ## Origin

  User hit the validator rejection 2026-05-22 while committing \`[AI:codex+claude] docs+scripts: ...\` for the substrate-landing PR. Fix was to drop to \`[AI:claude]\` with Codex captured as Co-Authored-By trailer. Pattern will recur as multi-agent dogfooding continues; worth structurally supporting.
