    Finding 1: fetched the prior lib-0 job log directly with gh api (job 128098033035); it and head lib-1 (job 128102222044) fail on the same config trust guard. The scanner treated owner_tests.rs's temporary config fixture write as production. Added an explicit cfg(test) boundary to that fixture function; no trust inventory exception or production policy change.

