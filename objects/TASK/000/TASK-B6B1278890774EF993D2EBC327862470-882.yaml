description: 'Split from TASK-3222 by the advisor ruling on sketch v1 (2026-11-06). Implement sketch v1 sections 1-4 and the matching section 6 tests: broker-injected per-lane AF_UNIX SEQPACKET channel at an exact synthetic epoch address (no host listener), per-message SCM_CREDENTIALS sender checks against the pinned lane, a closed v1 protocol with ONLY session_probe and request_status, the bounds and retry-key semantics, and lifecycle at PreparedLaunch/ContainedChild with refuse-on-absent. No CLI/MCP routing, no grant change. It extends contained_host.py from PR #3449, so start after #3449 merges.'
