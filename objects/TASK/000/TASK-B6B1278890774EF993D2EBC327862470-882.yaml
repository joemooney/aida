    Finding 3: spawn_vendor_headless_forking now checks require_store_service_surface before issuing its child grant. A command customization boundary, matching run_vendor_headless_child, lets the session-level regression put the requirement explicitly on the child Command. The regression exercises fresh and forked Codex session paths and asserts the refusal plus absence of vendor execution.

