    2. [minor] Prior finding 4 is still unverified in CI: the 'Store mutation channel tests' step (AIDA_REQUIRE_STORE_MUTATION_LIVE=1, gates shard) has never run. Gates at 69171ae was cancelled (step 25 skipped) and is queued at head. The PR needs a gates run where that step shows 'success' (live lifecycle and sibling-namespace tests passing, not skipped) before approval.
    3. [minor] session.rs:7269 adds require_store_service_surface only to run_vendor_headless_child. spawn_vendor_headless_forking (session.rs ~2195-2232) has no such guard: when wrapper is false it runs the child natively via reviewer_status_with_handle_guard, so an explicit AIDA_STORE_MUTATION_REQUIRED=1 on that Command silently downgrades to native instead of refusing, against sketch section 4 refuse-on-absent ('vendor paths lacking the required shared-broker/receipt ownership refuse an explicitly service-required launch'). Call the guard before 'if wrapper' there too, and add a test at the session path level; task_3225_required_service_refuses_unwrapped_launch only tests the helper function.
    4. [minor] contained_host.py exec loop calls mutation.live() every 200 ms, and service.py MutationAuthority uses settimeout(1). Any timeout permanently fails the channel, MutationRefusal propagates out of host_contained, and the vendor child is killed. A single grant_check_for/read_lease stall over 1 s (e.g. disk contention from a cargo build inside the lane) therefore kills a long-running lane. That deadline is tighter than the sketch's approved 5-second bounded I/O/lock admission. Raise the authority deadline to the sketch bound (or justify 1 s on the spec), and add a test that a slow-but-under-bound authority reply does not tear down the post-exec lane.
