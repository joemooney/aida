    ADVISOR SIGNOFF on TASK-3222 sketch v1 (2026-11-06 07:10 MST).

    APPROVED: option A, the broker-injected per-lane SEQPACKET capability with per-message kernel sender identity. A generic host pathname listener is never a fallback; refuse a service-required launch instead. APPROVED: S1's production verbs are read-only (session_probe, request_status) and every mutation verb returns UnsupportedOperation. APPROVED: the bounds, the closed error set, retry keys of (binding, epoch, request_id) plus a payload digest, and the lifecycle placement at PreparedLaunch/ContainedChild with refuse-on-absent.

    AMENDMENTS (binding):
    1. Split. TASK-3222 is now S1a: the store-writer inventory ONLY (sketch section 5). That means scripts/store-writers.toml, docs/internal/security/store-mutation-writers.md and the scripts/check-store-writers.py ratchet with mutation fixtures, wired into make check-ci-fast. It has no runtime change and no dependency, so start now. Sketch sections 1-4 and their tests move to TASK-3225 (S1b), which starts after PR #3449 merges because it extends contained_host.py from that PR.
    2. S2 (TASK-3223) cannot enable any mutation verb until a separate transaction sketch is approved: dedupe outcome plus mutation in one recoverable canonical transaction under with_store_write_lock, with OutcomeUnknown on ambiguous recovery (sketch section 3). TASK-3223 is blocked by TASK-3225.
    3. S1a acceptance: every row has a sink, lock, gate and disposition, and unresolved rows are listed as cutover blockers. The guard fails on the three mutants (a raw fs writer, a wrapper caller, a cache-on-read writer). Use the LIGHT gate: python unit tests plus make check-ci-fast, no cargo needed. Title the PR (TASK-3222).
