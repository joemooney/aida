title: Design specialized advisor routing by subsystem
description: |-
  Define how AIDA routes advisor questions, punts, findings, reviews, and queues to subsystem-specialized advisors.

  Acceptance:
  - Define routing rules for a spec with one subsystem, multiple subsystems, or no subsystem.
  - Define role naming and discovery, e.g. advisor:mcp, advisor:autonomy, reviewer:tui.
  - Define fallback to master advisor when subsystem advisor is absent or conflict exists.
  - Define how headless advisor tier selects the right advisor context for a punt.
  - Define audit trail for which advisor answered and why that advisor was selected.
