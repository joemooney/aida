title: Investigate queue-work rollback retaining a lease after reporting successful setup rollback
description: 'Found during BUG-2455 round-2 validation: queue_work_dry_run passes 14/15 tests, but task_1337_post_setup_launch_error_rolls_back_the_owned_setup fails at line 1541 because a spec-scoped session lease remains after the command reports no agent was launched and the owned setup was rolled back. Reproduces as an isolated test and with all ambient AIDA variables removed. The held-branch test and all six required-live BUG-2455 tests pass. This rework does not change rollback logic; baseline reproduction was not performed. Inspect cleanup/retention diagnostics before changing behavior. Logs: /tmp/bug2455-cli-full.log, /tmp/bug2455-cli-rollback.log, /tmp/bug2455-cli-hermetic.log.'
