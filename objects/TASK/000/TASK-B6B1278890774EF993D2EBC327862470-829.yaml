  content: 'Investigation reproduced the retained lease with the baseline test plus diagnostic-only assertion output: AIDA_TRUST_PID_NAMESPACE=0 RUST_MIN_STACK=8388608 target/debug/deps/queue_work_dry_run-300600e1df90223b --exact task_1337_post_setup_launch_error_rolls_back_the_owned_setup --nocapture. Cleanup explicitly reports: not verified free of live processes (this process runs in a separate pid namespace ... outside it are hidden). SessionStartCleanup correctly returns before releasing the lease when release_tree refuses. The rollback summary already qualifies that anything kept is named above; the old assertion hid that output. This is a fixture namespace assumption, not failed lease deletion. Fix scoped to this disposable fixture: explicitly set AIDA_TRUST_PID_NAMESPACE=1, matching existing teardown tests, and include captured launch diagnostics in lease assertion failures. No production rollback or process-guard behavior changed. Reproduction log: /tmp/task3110-untrusted.log. Full queue_work_dry_run suite and pre-push gates are running.'
