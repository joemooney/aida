    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: How to handle the same-user_id-on-two-machines queue-YAML conflict (both write registry/queues/<user>.yaml → orphan-branch merge conflict; acute for the BUG-89 "default" fallback in CI/containers)?
      a) Document distinct-user_id-per-machine as a hard requirement for shared-branch collaboration (no code)
      b) Warn when the resolved user_id is "default" and a remote "default" queue file already exists with a different machine fingerprint
      c) Make queue-YAML merges conflict-tolerant (append-merge by entry uuid instead of line-merge)
      REC: b — targets the actual hazard (the silent "default" collision) with a cheap guard; sharding already works for distinct users so (c) is premature. Captured observation, not urgent.
