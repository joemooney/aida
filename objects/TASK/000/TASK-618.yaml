title: 'Distributed queue: same user_id on two machines edits one registry/queues/<user>.yaml → orphan-branch conflict'
description: 'VERIFIED 2026-05-31 (advisor, answering operator''s ''what if different people queue on different machines''). The default ''aida queue add'' writes registry/queues/<user_id>.yaml INSIDE the orphan aida-store branch (git_backend.rs queue_add commits it; ''update queue'' commits are on origin/aida-store), sharded per user_id. Distinct users (alice.yaml / bob.yaml) never collide — clean rebase, mutually visible after sync (this is the intended sharding design). HAZARD: two machines using the SAME user_id (both ''joe'', or both unconfigured → the BUG-89 ''default'' fallback when $USER/$AIDA_USER/$USERNAME are all unset, common in CI/containers) write the SAME <user>.yaml → concurrent commits → merge conflict in the queue YAML on ''aida db sync'' rebase (store leg uses --rebase), or a rejected non-ff push. Options to consider: (a) warn when the resolved user_id is ''default'' and a remote queue file for ''default'' already exists with a different machine fingerprint; (b) make queue YAML merges conflict-tolerant (append-merge by entry uuid rather than line-merge); (c) document distinct-user_id-per-machine as a hard requirement for shared-branch collaboration. Not urgent (sharding works for distinct users); file so it''s captured before multi-machine collaboration scales.'
