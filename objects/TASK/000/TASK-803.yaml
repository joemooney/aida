title: Extract resolve_burndown_sets per-spec classification into a pure, unit-testable helper
description: 'resolve_burndown_sets (aida-cli/src/main.rs) is the core of ''aida burndown plan'': it runs the archived/deferred/status/tag/batch filters, the supervised collection, the BlockedBy/decision pickability gate, and the sign-off split — all in one store-dependent function with ZERO unit coverage. Reviewers of BUG-551 (#881) and BUG-549-class changes both noted new logic lands here untested because the function needs a live store. As the function accretes branches (supervised partition was BUG-551; sign-off split was STORY-546) the untested surface grows. Extract the per-spec classification (given a spec''s status/tags/deferred/archived/relationships + the queued set → which bucket: ready-candidate / supervised / skip) into a PURE helper in the burndown module (like burndown::split_by_signoff already is), and unit-test the bucket decisions directly. Keyboard/review (touches the burndown plan core). trace:from-review:PR-881'
