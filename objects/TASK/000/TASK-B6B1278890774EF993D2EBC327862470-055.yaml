  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-043, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Non-blocking (minor, fail-open): the reach scanner skips any path with a leading colon (story_1888_gate_paths_tests.rs:1716 path() ignores leading_colon), so a kernel or orchestrator naming ::aida_core::liveness::pid_is_alive(..) in an expression is not reported by kernel_outside_reach/orchestrator_drift and bypasses the new freeze; extern crate aida_core as x is also unhandled. Pre-existing scanner limitation shared with the dispatch facade; add a refused case and treat ::aida_core like aida_core.

