  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3644):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 334b8fbd4284
    Recorded: 2026-11-08T00:07:51.139697456+00:00
    Findings:
    1. MAJOR scripts/check-crate-globs.py:51-52: the --base growth check 'Counter(expected) - Counter(json.loads(old.stdout))' is keyed by file path, so after relocate-ledger-paths.py moves old.rs->new.rs the ledger gains a new 'new.rs' key that the base lacks and CI fails with 'crate glob baseline may only shrink relative to base'. That blocks the pure moves this tooling is meant to enable (AC3, dissolving lib_part1..6.rs). check-exec-context.py check_growth (lines 322-341) avoids this by comparing relocation-invariant fingerprints. Fix: compare the total (sum) or match retirements against additions so a pure rename passes and real growth still fails, and add a test for it.
    2. MAJOR scripts/relocate-ledger-paths.py:41-49 (advisor amendment 2026-11-07 on TASK-3428): there's no totality check. After the rewrite nothing verifies that no stale reference to OLD remains as a path key in the three ledgers (portability-allowlist '\tOLD:' rows, exec-context 'OLD:' site keys, crate-globs 'OLD' key). Add a post-rewrite assertion that fails when any old-path key or row survives, plus a test.
    3. MINOR tests/test_crate_split_tools.py: main() --base logic in check-crate-globs.py (shrink-only, bootstrap when base lacks ledger, refuse an unreadable base ledger) has no test. Only count() and check() are exercised. Add git-fixture tests covering a shrink, a growth refusal, a bootstrap, and a pure relocation (see the first finding).
    4. COSMETIC scripts/ci-gate-tiers.toml:174-175: a dangling '# trace:TASK-3428 | ai:codex' line sits alone at EOF, after the skip-reasons section, with nothing under it. Move it beside the 'Crate glob import ratchet' = 'fast' entry at line 131, or delete it.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
