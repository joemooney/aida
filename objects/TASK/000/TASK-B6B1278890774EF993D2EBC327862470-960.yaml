- id: 01a1b8c4-61f2-78b2-95d8-239bbe48c7ca
  author: joe
  content: 'REVIEW FINDINGS TO ADDRESS (PR #3644):

    Verdict: CHANGES REQUESTED

    Reviewed commit: 488ca588c423

    Recorded: 2026-11-08T00:31:18.455563758+00:00

    Findings:

    1. MAJOR scripts/relocate-ledger-paths.py:33 + scripts/check-portability-growth.py:44-47: rewrite() changes ''<rule>\told.rs:<content>'' to ''<rule>\tnew.rs:<content>'', but the growth check (which CI runs from the BASE revision, ci.yml:896-900) treats every entry in current-minus-base as an addition and fails with ''portability rules are unchanged, so the allowlist may not grow''. The portability ledger is relocated correctly but always fails CI, so the helper does not enable pure moves for any file with allowlist rows (e.g. dispatch_health_ps.rs has 16, agent_registry.rs has 12). Fix: make check-portability-growth.py relocation-tolerant the same way check-exec-context.py check_growth does (match additions to retirements by (rule, content) fingerprint, ignoring the path prefix, so multiplicity cannot grow). Note that CI pins the base copy of the growth script, so the fix applies to PRs after this one merges. Add a fixture test that runs the growth check on a relocated allowlist and
    confirms it passes, plus one where it grows and confirms it fails.

    2. MINOR scripts/check-crate-globs.py:52-54: the --base check compares only the total import count, so one PR can retire a glob in a.rs and add a new ''use crate::*;'' in b.rs and still pass, and the gate then prints ''zero additions''. AC2 says the ratchet forbids new glob crate imports. Tighten it: allow a new path key only when it takes over a retired key''s exact count (or matches a git rename, git diff -M), otherwise refuse. Add a test for the swap case.

    3. UNVERIFIED AC5: CI at 488ca588c423 had not started (CI pending, merge-hold-gate pending) at review time, and the implementer notes say make check-ci-fast was interrupted. The next round needs a green CI run at the reworked head.

    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.'
