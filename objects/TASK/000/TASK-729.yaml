title: Align getting-started.md to the new simple flow (aida add "X" / aida done / TASK ids)
description: 'Round 9 of the novice-first loop. getting-started.md still taught the old jargon-heavy flow: ''aida add --title ... --type functional'', edit --status, FR-001 ids — none of which match the simpler CLI we built (aida add "X" → TASK-1, aida done). Updated Step 3 to lead with the one-line ''aida add "..."'' (keeping the flag form as the detailed option), Step 4 to use TASK ids + add ''aida done'', and the quick-reference table to surface ''aida add "..."'' + ''aida done''. first-project.md left as-is — it''s a deliberate full-graph walkthrough (epic/story/queue). Docs now match the product a novice actually uses.'
