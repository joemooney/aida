title: '[cosmetic, non-blocking] mod.rs write_source_id: on the link fallback, a failed…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-075, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [cosmetic, non-blocking] mod.rs write_source_id: on the link fallback, a failed remove_file(temp) after a successful hard_link returns Err even though the target is already placed. The same happens when the directory fsync fails after placement. mark_nonce_era then reports an error for a marker that was written. This fails closed and is harmless, but the error is misleading.

