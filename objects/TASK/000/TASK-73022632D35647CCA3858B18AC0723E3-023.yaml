title: Train lock tests race with fork-inherited lock handles under threaded lib tests
description: |
  pr_train::tests::bug2547_abandon_is_locked_and_local_even_for_malformed_journals and pr_train_journal_lock_contention_is_typed_and_releases_on_exit (aida-cli-lib/src/tests/story_1690_train_tests.rs:5895, :5295) drop the run lock and immediately re-take it. The flock belongs to the open file description, so a child forked by a concurrent test thread while the handle was open keeps the lock until it execs. Under `cargo test --lib` (threads, many git spawns) the re-take then fails with "another train owns the train journal".

  Seen 3 times in 5 local runs while STORY-2823 briefly did slow work with the handle open; fixed there by reading the driver identity before opening the lock and caching it per process, after which 2 runs passed. The race itself predates that change and remains possible (it does not occur under nextest's process-per-test). The same inheritance applies in production: a child spawned by the train driver can hold run.lock for an instant after the driver exits.

  Raised by the implementer while working STORY-2823.
