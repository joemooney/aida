title: Stress-test + lock down distributed ID-allocation uniqueness across concurrent nodes
description: 'Verified the catastrophic invariant — N clones/nodes minting ids concurrently never collide — and added permanent regression tests. Coverage added: (1) 3-node concurrent block-claim via the real git CAS push loop, asserting non-overlapping ranges + globally-unique dispensed ids + no lost claims; (2) stale-clone claim recovers via CAS to a non-overlapping range; (3) duplicate-node-id misconfiguration still yields disjoint ranges (uniqueness rests on CAS-serialized ranges, not node-id distinctness); (4) merge-gate assigns unique, dense, deterministic short-ids across 117 mixed-type specs + is idempotent; (5) new-block floor boundary (must start above both max range_end AND agreed-counter floor — no off-by-one). Result: id-allocation holds; no collision/dup/off-by-one found. Tests in aida-core/src/git_ops.rs + node.rs.'
