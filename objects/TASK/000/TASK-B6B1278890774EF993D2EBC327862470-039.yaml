description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-030, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): aida-core/src/db/cached_git_backend.rs:239 — the fallback deadline is the lookup's start + READ_LADDER_CAP, not linked to the run-wide read-wait allowance (cache.rs:672, cache_refresh.rs:706). A budgeted caller without fast-fail whose cache scan used up the 3 s allowance gets ~0 s of scan, so its collision check always degrades. Waits before the lookup do not count against the claimed 5 s ceiling. No test covers it.

