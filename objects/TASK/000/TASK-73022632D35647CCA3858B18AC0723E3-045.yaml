title: Review engine misses repository-root credential directories
description: In the S1 reference, review_engine.rs:614 recognizes nested /.aws/ and /.ssh/ only. A repository-relative .aws/credentials or .ssh/config falls through to reviewable. Add path-component matching and root/nested fixtures before the CLI starts presenting source content.
