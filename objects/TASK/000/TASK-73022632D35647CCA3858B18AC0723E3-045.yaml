    # TASK-3320: the review engine misses repository-root credential directories (advisor-122 approved 2026-11-25 14:30, HIGH, STRICT; product-15). Lane: CLAUDE. INTEGRATION, NEW branch int40-task-3320 (cut from the integration tip after STORY-3120 S3a #4582 merged). Completing (TASK-3320) trailer. <=200 lines.
    READ: `aida show TASK-3320 --comments`. The advisor ruled its AC belongs with the S3a runner-path inventory: the review engine's file inventory and secret/credential screening must cover repository-ROOT credential directories (e.g. .aws/, .ssh/, .gnupg/, .config/gcloud, .docker/config.json, .netrc and similar at the repo root, not only nested). Findings that cite such paths must be flagged, and their contents must never be put into a runner prompt.
    TESTS: a fixture repo with root-level credential dirs → excluded from the prompt and reported; nested equivalents are still handled.
    One targeted cargo test run on this host, make check-ci-fast, then publish a NEW PR to integration. COMMIT your work.
