title: 'Duration knobs: project config is read to lower the caps; config-trust lists them under keys.worktree'
description: |
  The signoff on STORY-2828 says both "read ONLY from the global config" and "a project value may lower the cap, never raise it". PR-4060 implements the second: [mandate] max_ttl_hours and [seat] inline_grant_max_hours go through the max_grant_hours loader (gate/seat_authority.rs resolve_hour_cap), so the project .aida/config.toml is read, to lower only. scripts/config-trust.toml has no global-only class, so both keys are listed under [keys.worktree.*] as `policy` with a lower-only note. A mandate is per user, so its project layer is the project the command runs in (find_project_root). If strictly global-only was meant, drop the project read for these two keys.

  Raised by the implementer while working STORY-2828.
