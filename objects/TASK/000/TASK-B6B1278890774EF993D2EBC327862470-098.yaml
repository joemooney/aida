  Non-blocking finding carried forward from an APPROVED review verdict on STORY-B6B1278890774EF993D2EBC327862470-078, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking/minor: refuse_node_id_colliding_with_label (node_alias.rs:571) uses load_strict, so a malformed node_aliases.toml blocks every node registration (aida node acquire/init) until the alias file is fixed. This fails closed and the error is explicit, but it couples node acquisition to the health of the alias file.
