title: 'non-blocking: with incremental on, sccache reports workspace crates under --pro…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1985, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking: with incremental on, sccache reports workspace crates under --profile agent as 'cannot cache: incremental'. aida-cli-lib therefore no longer gets cross-worktree sccache hits; only third-party deps stay cached. TASK-1986's measurement should include a fresh-worktree cold build, not only an edit-rebuild.

