- id: 01a1ada8-2afd-7111-94ff-8e1b028c7c16
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3074):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1b20cf87e817
    Recorded: 2026-11-05T21:36:08.855993853+00:00
    Findings:
    1. BLOCKER (major): Commit 1b20cf87e81 subject and the PR title are '[AI:codex] fix: address CI failures and review findings (TASK-3074)'. The trailing (TASK-3074) is a completing trailer. The 2026-11-05 advisor signoff on TASK-3074 says PR-A must be titled '(Refs TASK-3074)' and PR-B completes. The implementer's own comment[5] also says the default completing title must not close TASK-3074. Merging as-is would auto-complete TASK-3074 before typed delivery correlation and unresolved/persistent escalation (PR-B) exist. The title also misdescribes a 1371-line feature as a CI fix. Fix: reword the commit and retitle the PR to '[AI:codex] feat(mailbox): record recipient request dispositions (Refs TASK-3074)'.
    2. minor: aida-cli-lib/src/mailbox_cmd.rs (MailboxCommand::Read arm) now calls crate::mailbox_action::inspect(...)? before printing. Any action-ledger error makes the existing 'aida mailbox read <id>' fail for every message, even though read previously never consulted this ledger. Triggers: corrupt or unsupported actions-v1.json, a symlinked file or anchor (action::latest errors, see corrupt_unsupported_and_unsafe_ledgers_fail_closed), or any MailboxContext::resolve_or_local error other than NotAGitCheckout. Writers should still fail closed, but the read view should degrade: print the message plus 'action: unavailable (<reason>)', or action:null with an action_error field in JSON. Add a test where a corrupt ledger still lets mailbox read print the message.
    3. minor: aida-core/src/mailbox_lifecycle/action.rs fingerprint() hashes serde_json of the whole Message (archived forced false). Message grows by the append-only #[serde(default)] non-skip pattern (urgent, intent, retracted, from_source). The next field added that way changes every fingerprint, and latest() then silently reports every existing disposition as 'action unknown'. Retract also flips the fingerprint, so a request that already has a disposition loses it from 'mailbox read' once retracted. The sketch says retraction only blocks new dispositions and retains evidence. Fix: hash a fixed, explicitly listed immutable field set (id, thread_id, from, to, timestamp, in_reply_to, subject, body, intent), and add a test that retract/archive keep an existing receipt visible.
    4. minor (test-coverage): no test exercises the 'mailbox read' view projection that this PR adds: neither the --json shape {schema:1, message, action} nor the text-mode 'action:' line. The adapter tests call mailbox_action::inspect directly, and the existing Read tests only pass json:false and check nothing about action output. Add a handler-level test for both output modes, with and without a recorded receipt.
    5. cosmetic: in text mode, 'mailbox read' prints 'action: unknown' for every message, including fyi/handoff mail where dispositions cannot apply. Both 'mailbox read' and 'mailbox disposition' (non-JSON) print a raw serde_json receipt as the human line. Print 'action: n/a (not a request)' for non-requests and a readable summary (outcome, actor, reason, evidence, until, recorded time).
    6. cosmetic (process): AGENTS.md (+6) and OVERVIEW.md (+9, a paragraph added near the top) carry per-change notes for this slice. That goes against CLAUDE.md's rule to put per-change notes in the PR body or an aida comment, and to edit AGENTS.md/OVERVIEW.md only for a real architecture change, because each added paragraph conflicts with every open PR. docs/mailbox.md#explicit-responses-to-requests already documents the ledger. Drop both hunks, or shrink them to a single pointer if the advisor considers the action ledger an architecture change.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
