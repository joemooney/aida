  content: Proposed contract committed as 5b6aaba7e61 in docs/plans/2026-11-05-task-3074-request-dispositions.md. Parent ruling approved slice 1 only and deferred approval of this lifecycle/schema. Proposal covers recipient-authorized versioned action ledger separate from read ACK, explicit acted/declined/deferred outcomes, one-reader shared-role resolution, bounded deferred deadline, exact alarm/message correlation, legacy/ambiguous recovery, and existing bounded operator notifier. Requests sign-off on schema/authority and replacing unspecified N nudges with one request plus 30-minute unresolved/persistent escalation. No runtime behavior changed. git diff --check passed; documentation-only change requires no Rust tests. Holding PR pending master sign-off per AGENTS.md Sketch-First Protocol.
