id: 01a0c1cf-f29f-7bc1-bf57-14484c3f0e36
spec_id: TASK-1-166
title: 'Three defects share a structure: the observer who would recognise the problem is the one the system arranged not to show it to'
description: |-
  Three defects found on 2026-09-20, in three unrelated subsystems, share a structure that none of the existing principles names: the observer who would recognise the problem is the one the system arranged not to show it to.

  INSTANCE 1 - THE QUEUE FILTER (BUG-1513). `aida queue list --for reviewer` passes the CALLER'S OWN rows through regardless of role. The reviewer seat sees a clean 22 rows, every one correctly tagged, and has nothing to notice. The only caller who sees the leaked row is the one who owns it, and to them it does not read as a leak - it is a spec they are already working, in a list they filtered by a role they are not in. The seat with standing to call it a reviewer-queue defect gets the correct answer; the seat that gets the wrong answer has every contextual reason to accept it.

  INSTANCE 2 - THE EXPRESS BANNER (BUG-1507 criterion 8). For a spec tagged batch:express plus lifecycle:no-preflight, the operator is shown "express tier - full gate (CI + reviewer + build)" while the preflight gate is skipped. The branch that would name the skipped phase is unreachable for any express spec. The operator is not uninformed; they are told the opposite, by the surface built to inform them. Meanwhile active_tokens() on the same struct truthfully emits "no-preflight" - into telemetry nobody reads per run. So had this ever fired, nothing anyone SAW would have looked wrong.

  INSTANCE 3 - THE INVISIBLE RED PR (BUG-1514). PR #2035 sat open 3.8 hours with failing CI, no verdict, no hold, no queue entry, and a spec reading Done. The orphan sweep excluded it because it requires green - correctly, since claiming a red PR wastes a reviewer on a branch that cannot merge. Done dropped it from every open-work lens - correctly, by the rules as written. Every surface excluded it for a locally correct reason and the composition was invisibility.

  WHAT THE THREE SHARE, AND WHY IT IS NOT PRIN-5. PRIN-5 says a coordination surface must distinguish absent evidence from good evidence, because computing a verdict over what is present errs toward reassurance. That describes a surface reasoning wrongly from incomplete data. This is different and in some ways worse: each of these surfaces reasons CORRECTLY. The queue filter correctly includes your own work. The orphan sweep correctly skips red PRs. Done correctly means work finished on a branch. The defect is in the JOIN - which observer is shown which correct answer - and it is invisible from inside any single surface, so auditing any one of them finds nothing.

  THE DIAGNOSTIC QUESTION IT SUGGESTS, which is the actionable part: for any surface that reports a condition, ask WHO SEES THIS, and separately, WHO WOULD RECOGNISE THIS AS WRONG. When those are different people, the surface cannot be validated by its users and will not be corrected by use. All three instances survived repeated auditing by two seats specifically looking for defects in these subsystems, on the same night, because in each case the auditor was on the wrong side of that split.

  THE OPERATIONAL HALF - A MECHANICAL PROXY FOR THE DIAGNOSTIC QUESTION. Authored by the reviewer seat, placed here by the finding's holder on 2026-09-20 19:56 because it arrived as a comment and the operational half of a pattern must be binding text, not commentary.

  THE PROXY: WHICH SURFACES ARE READ BY A DIFFERENT PARTY THAN THE ONE WHO RUNS THEM?

  That is answerable from the codebase without judgement, because it is a property of INVOCATION rather than of content. The qualifying shapes:

      hook-injected output        a hook computes it; an agent or operator reads it
      banners and summaries       emitted during a run; read by whoever is watching
      the statusline / statusbar  written on an interval or by the harness; read continuously,
                                  invoked never
      notifications and mailbox   composed by one seat, read by another
      commit trailers             written at commit time; read by tooling and by whoever
                                  asks "why is this line here" months later

  And the disqualifying shape is just as mechanical: anything a human types and then reads the output of. There the runner and the reader are the same person, the answer is validated by use on every invocation, and a divergence is caught the first time it matters to someone.

  EVERY INSTANCE ON THIS FINDING IS ON THAT LIST:

      the per-turn notice (TASK-1-167)          hook-injected, read by an agent, validated by
                                                 nobody — its validator is `aida awaiting`, which
                                                 the reader does not run
      the express banner (BUG-1507 criterion 8)  emitted at runtime, tells the operator "full gate"
                                                 while preflight is skipped
      the queue filter (BUG-1513)                the caller's own rows leak; the seat qualified to
                                                 call it a defect gets the correct answer
      the statusbar (TASK-1-168)                 OSC title on an interval; read continuously,
                                                 invoked never, 68s per sample
      the orphan-sweep gap (BUG-1514)            the surfaces that would show a red unowned PR each
                                                 exclude it correctly

  Six instances now, all on the list, no misses. That is not proof the proxy is complete - it is largely the set it was derived from - but it is a starting list producible today and checkable against the code.

      HOW THOSE SIX WERE ACTUALLY FOUND, corrected 2026-09-20 20:13 and this is the number that matters for anyone deciding to rely on the proxy. Being ON the list is not the same as having been FOUND BY it:

        found by applying the proxy deliberately        2   (the per-turn notice, the statusbar)
        found by other means, and on the list after     4   (the queue filter, the express banner,
                                                             the orphan-sweep gap, the merge-hold listing)

      The merge-hold listing in particular was found while chasing a DIFFERENT and wrong hypothesis - phantom markers left by direct merges - in a column the reader had grepped for an unrelated reason and did not need. The reviewer seat volunteered that correction against a more methodical account it had been offered.

      SO THE HONEST CLAIM IS NARROWER THAN 'five hits'. The proxy has a demonstrated ability to RANK surfaces by auditability, and applying it deliberately produced two findings that were not otherwise suspected. It does not have a demonstrated hit rate, because two thirds of the instances arrived by accident and were classified afterwards. A reader deciding whether to spend time on this should weigh the two prospective hits, not the six.

  WHAT IT IS NOT. The proxy identifies where this class CONCENTRATES, not which surfaces are defective. It ranks by auditability and hands back a list; a human still reads each one. That is deliberate and it is the same property that made the field-count detector on BUG-1507 usable: an instrument that narrows a search does not need the judgement that an instrument that decides would need, and the judgement was the part that failed every time tonight.

  THE ONE REFINEMENT EXPERIENCE ADDED. A surface can be on the list and still be validated, if its reader has a CHEAP way to check it. The notice's problem is not only that its reader never runs `aida awaiting` — it is that `aida awaiting` costs a minute or more and sometimes does not return, so nobody would run it to check a free one-liner even knowing they should. So the second question, asked only of surfaces the proxy returns, is: can its reader verify it without invoking something slower than the thing being verified? Where the answer is no, the surface is not merely unvalidated, it is unvalidatABLE in practice, and a fix that relies on cross-surface comparison will itself go unchecked. A component breakdown printed inline is self-validating; a cross-surface comparison is not.

  NOT A PRINCIPLE YET, AND THE TRIGGER IS REWRITTEN 2026-09-20 19:58 BECAUSE THE ORIGINAL WAS BOTH STALE AND ALREADY SATISFIED.

      The first version read "three instances in one session" and sat twelve lines below a list naming FIVE with spec ids - a count written at one moment and not updated as its own list grew, in the document about surfaces that cannot be reconciled. It also offered two promotion conditions, and the SECOND HAS ALREADY FIRED: TASK-1-167 and TASK-1-168 were both found by running the proxy against surfaces chosen from the question, before any symptom was known. Left as written, a later reader would find a satisfied trigger and promote on evidence both seats judged too thin.

      WHAT THE EVIDENCE ACTUALLY IS. Five instances, one session, two seats. Two of the five were found prospectively, which establishes that the proxy RANKS SURFACES BY AUDITABILITY - a real and narrower capability than finding instances of the pattern. But TASK-1-167 is a plain omission and TASK-1-168 is latency plus unstated scope; neither is the defining shape of two observers being shown DIFFERENT CORRECT ANSWERS. Only BUG-1513 is unambiguously that, with BUG-1507's banner and BUG-1514's composed exclusions close to it. So the prospective limb fired and was judged insufficient. The SEQUENCE matters and an earlier version of this paragraph overstated it: the reviewer seat argued first that its own hit was weaker than BUG-1513 and that the pattern should be held, and the advisor concurred. That is two seats agreeing, not two seats arriving separately - concurrence is not independence, and this session established that distinction at cost more than once. What WAS independent is the advisor's original caution: the decision not to promote, and the trigger itself, were written before either prospective hit existed. A reader should weigh this as one judgement accepted rather than two judgements converging. The reviewer arguing against promoting its own finding is still the strongest thing in the record here.

      THE REMAINING TRIGGER, stated so it cannot be satisfied by accident: promote when an instance of the SPECIFIC shape - one surface returning different correct answers to different observers, where the observer who would recognise the defect is not the one shown it - appears in a subsystem neither the queue, the lifecycle surfaces, nor the drain's reporting touched. Prospective discovery is no longer sufficient on its own, because it has been demonstrated and what it demonstrated was narrower than the pattern.

      Recorded now because the frame was produced tonight and will not survive in anyone's memory otherwise.
