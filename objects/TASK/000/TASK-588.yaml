title: 'AGENTS.md: add a compact ''direct user assignment — implement BUG/TASK-N'' runbook (no queued brief)'
description: |-
  Codex (2026-05-30) flagged: AGENTS.md covers storage model, MCP, worktree/session discipline, trace comments, commit trailers, sketch-first governance, and Codex pitfalls — but there is NO compact direct-assignment checklist for 'user says implement BUG/TASK-N' when there is no queued brief. That path (TASK-132, BUG-406) is implicit. Add an explicit short section.

  Codex's proposed 9-step draft is a good base BUT step 4 ('symlink .aida-store if needed') is now OBSOLETE — BUG-331 (shipped 2026-05-30) made sibling worktrees resolve the canonical store via git-common-dir, so NO symlink is needed. The runbook must NOT include the symlink step.

  Suggested steps (corrected): (1) aida show <SPEC>; (2) if Draft and explicitly assigned, promote to Approved; (3) start isolated session: aida session start --owns <SPEC> --role implementer --base origin/main; (4) work in the sibling worktree (NO symlink — BUG-331 resolves the store automatically); (5) implement + trace comments + targeted tests + fmt --check; (6) commit [AI:codex] ... (<SPEC>); (7) aida pr ship; (8) end session, verify Completed; (9) architecture-class → sketch first + master sign-off. Master template: AGENTS.md (check whether it's generated by generate_agents_md or hand-maintained before editing).
