description: 'The empirical gate for TASK-694''s passive-observe design (instrument-don''t-infer). Hooks load at session START, so this can''t run mid-session — recipe: (1) add a logging hook to .claude/settings.local.json (local, gitignored, NOT the symlinked settings.json) for SubagentStart + SubagentStop running a 2-line script that appends stdin to .aida/hook-debug/subagent-events.jsonl; (2) launch a fresh session and spawn a worktree-isolated subagent (Agent isolation:''worktree'') that does something trivial; (3) read the log. CONFIRM: does SubagentStart''s cwd point to the worktree dir? Is agent_id stable Start<->Stop? Any undocumented worktree/branch field? Document the verified payload on TASK-694, then remove the probe hook. SubagentStop is non-blocking (safe); SubagentStart is observability-only (safe, can''t break creation). trace:TASK-694'
