description: |-
  Per 'Beyond the Prompt: Claude Code', /insights analyzes usage patterns and is recommended monthly. AIDA has 'aida usage' (top-20 commands in 30d) and 'aida usage --auto-complete' (orchestrator telemetry), but no skill wrapper. A skill makes it discoverable.

  Acceptance:
    • /aida-insights skill scaffolded by 'aida init'
    • Skill invokes 'aida usage' + 'aida usage --auto-complete' + 'aida findings calibration --stats'
    • Surfaces the three top-line signals: most-used commands, drain success rate, advisor calibration agreement %
    • Suggests next actions (deprecation candidates, calibration-gap memories to write, etc.)

  Source: docs/competitive-analysis/2026-05-26-... (Tier 3 actionable, discoverability).
