  content: 'Promoted by joe 2026-09-21: CONFIRMED BY MEASUREMENT, and the headline number is exact. yaml.safe_load over the live store: 1209 of 4267 objects fail = 28.3%, and EVERY ONE of the 1209 is the same error — ConstructorError: could not determine a constructor for the tag ''!Custom''. Not a sample, not an estimate: the whole store parsed, one failure mode, no others. The serialised form is ''rel_type: !Custom sprint_assignment'', a YAML LOCAL TAG, which serde_yaml round-trips happily and which every standard consumer rejects by design. Consequence: any non-AIDA reader of the store — a script, a CI step, a downstream integration, another tool, a human''s one-off python — fails on 28% of objects, and fails with an error that names a YAML tag rather than anything a reader would connect to relationships. Promoted at major. A METHOD NOTE FOR WHOEVER PICKS THIS UP: my first pass grepped for a leading-''!'' pattern and found 7 objects, 0.2%, and I was one step from reporting that the 28% headline had the wrong mechanism attached. The tag is mid-line after ''rel_type: '', so the grep could not see it. The parser was right and my discriminator was blind. Run the parser, not a pattern.'
