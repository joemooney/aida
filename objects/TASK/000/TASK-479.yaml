title: 'STORY-305: harden <skill>.local.md merge beyond AIDA.md instruction'
description: |-
  Follow-up worth a TASK:

  STORY-305 ships the .local.md merge convention as an instruction to
  Claude Code in .claude/AIDA.md ('when loading <name>.md, also read
  <name>.local.md if it exists'). That works because CLAUDE.md is always
  in context, but it relies on Claude actually honoring the instruction —
  there is no runtime enforcement.

  Concrete hardening options worth weighing:
    1. aida skill render <name> CLI — emits the concatenated stock+local
       content on stdout, callable from a slash command that wants
       guaranteed merge regardless of Claude's instruction-following.
    2. Append a tiny boilerplate stub to each stock skill template's tail
       ('if <name>.local.md exists alongside this file…'). Per-skill
       enforcement, with the upgrade churn cost flagged in the
       design-choice finding.
    3. Codex parity (.codex/skills/local/, <name>.local.md extensions).
       The spec is Claude-only; codex users have no extension surface
       today.

  None of these is required by STORY-305's acceptance criteria — the
  'define and document the merge semantics' clause is satisfied by the
  chosen append-merge rule plus its docs. Filing this so the advisor can
  decide whether to escalate any of (1)-(3) to a real spec.

  Raised by the implementer while working STORY-305.
