title: 'non-blocking (minor): aida-cargo-timeout-guard.sh make_targets_skip_cargo fails…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1967, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): aida-cargo-timeout-guard.sh make_targets_skip_cargo fails OPEN on a recipe conditional: 'hello:' / 'ifeq ($(CI),1)' / '<TAB>cargo test' / 'endif' — the ifeq line resets owner so the cargo line is unowned and 'timeout 1h make hello' is silent. Same for ifdef/ifndef/ifneq. Contradicts the header claim 'anything it cannot resolve still gets the hint'. Fix: exit 1 on any conditional directive (as include does).
