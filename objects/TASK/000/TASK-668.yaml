title: 'EPIC-35 slice-1b: route the aida pr ship merge through Forge::merge_change'
description: |-
  First op of STORY-516 slice-1b routing (SPIKE-49 order: merge first). Routes the `aida pr ship` step-3 merge (main.rs, derive_pr_ship_squash_subject path) through `crate::forge::forge_for(project_root).merge_change(&ChangeRef, &MergeOptions)` instead of the inline `gh pr merge`.

  Behavior-preserving on GitHub:
  - GitHubForge::merge_change reuses the SPEC-410-pinned `pr_ship::merge_args` for the squash path → argv byte-identical (--squash [--delete-branch] [--subject S], same order).
  - Wraps the gh call in network_retry::run_with_retry → preserves BUG-286 transient-blip resilience.
  - Unified merge_change contract: Err(stderr) on failed merge across GitHubForge/GitLabForge/PureGitForge (previously all returned Ok{merged:false}); call site maps Err → activity-log + recovery-hint + bail.

  A GitLab / pure-git repo now gets its own provider's merge instead of always shelling gh.

  Verified: forge (19) + pr_ship (46) + merge_args (2) tests green; argv byte-identity structural (merge_change calls merge_args).
