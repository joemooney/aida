description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2140, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  NON-BLOCKING (cosmetic): git_backend_cmd.rs:4340 silently skips the blocks.yaml pointer commit when deferred, with no notice_store_commit_deferred call. Also, auto_commit_paths now calls refuse_embedded_repos up front and again inside every add/add_all, so each targeted write walks the full store tree (~5.4k objects) several times.

