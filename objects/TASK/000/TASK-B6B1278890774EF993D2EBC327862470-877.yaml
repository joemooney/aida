title: 'Repeated unchanged review findings: STORY-2401'
description: |-
  Identical reviewer findings recurred twice for STORY-2401; do not requeue a third implementer round until an advisor chooses a different implementer/seat or resolves the dispute.

  REVIEW FINDINGS TO ADDRESS (PR #3493):
  Verdict: CHANGES REQUESTED
  Reviewed commit: e2d13c354db1
  Recorded: 2026-11-06T10:07:23.765760875+00:00
  Review comment: https://github.com/joemooney/aida/pull/3493#issuecomment-6682353014
  Findings:
  1. [major] Train-landed PRs can never be confirmed (AC2 consumers). forge_confirmation.rs:110-116 metadata() requires on_base(...)==(state==Merged). The train lands members as rebased car commits whose subject ends '(#N)' (pr_train.rs car_message) and member_landed closes the member PR, so GitHub reports CLOSED (verified: #3486/#3488/#3448 are CLOSED, mergedAt null) while on_base finds the '(#3486)' receipt on origin/main (forge_confirmation.rs:78-91) => true != false => Pending('forge state conflicts with Git evidence'). Consequences: queue_cmd::review_pr_is_merged_or_closed (queue_cmd.rs:1102, used by the GC at :4372 and session_reap::scan_reapable session_reap.rs:881) returns None for every train-landed PR, so its review row/lease is never collected; db_reconcile::collect_stranded_review_pr_resolutions reports a lookup failure forever; phase_driver detect_merged_pr withholds credit. Trains are now the main landing path (the last 3 commits on main are train cars). Fix: treat Closed + a train-member receipt (subject '(#N)' plus the 'Aida-Train-Member: #N at <head>' trailer matching head_sha) as a consistent landed-by-train state, or exclude the receipt check from the Closed comparison; add a real-git fixture for a closed member whose car is on main.
  2. [major] Confirmation cost applied to non-destructive answers and inside per-PR loops. pr_is_merged_with_sink (pr_lookup.rs:1236) and review_pr_is_merged_or_closed (queue_cmd.rs:1107) now always do >=2 metadata reads, a 3s sleep (forge_confirmation::backoff) and a remote 'git fetch origin refs/heads/<base>' (up to 30s), even when the answer is Open, i.e. the keep/no-op answer that needs no confirmation. Callers iterate: queue GC over every review row (queue_cmd.rs:4242, :4372), session_reap::scan_reapable over every lease, db_reconcile over every stranded review story, plus drain_gate.rs:343, merge_hold_cmd.rs:116, pr_cmd.rs:2530/2854. Ten open review rows add at least 30s of sleep and ten fetches to a sweep. Fix: take one read and return immediately on the answer that authorizes nothing (Open for close/GC; not-Merged for credit), and run confirm_snapshot plus the Git fetch only when the first read would authorize the destructive or credit-granting transition. Fetch the base once per sweep, not once per PR.
  3. [minor] Squash receipt unreachable when the PR head object is not local. forge_confirmation::on_base runs 'git merge-base --is-ancestor <head> <tip>' first and bails on any exit other than 0/1 (forge_confirmation.rs:66-71). A head object missing locally gives exit 128 (reproduced), so the '(#N)' receipt check that exists precisely for squash merges is never reached. GitHub-side update-branch heads (review_watch_update.rs:133, dispatch_flow.rs:203; this PR's own head e2d13c354 is committed by GitHub) are not fetched by the base-only fetch, so a squash-merged PR becomes permanently Transient (pr_is_merged_with_sink None: pr_cmd.rs:3912 merge-error reconciliation, phase_driver credit). Fix: when the head object is absent (git cat-file -e fails), skip ancestry/tree and consult the receipt, or fetch refs/pull/N/head into the private ref too; add a test with an absent head.
  4. [minor] GitHub observe_change_metadata (forge.rs ~2307-2326) ignores its RetrySink (it is _sink), which drops the BUG-286 retry notices that pr_is_merged_with_sink's StderrSink callers (pr_cmd.rs:3912) relied on. It also routes through observe_gh_stdout, so a definitive refusal (PR not found / 404 / auth) is Transient, the same labelling the round-1 #3427 review rejected for observe_change_status. confirm_snapshot then spends 3 reads and 6s on a deleted PR. Use observe_gh and keep refusals as a known outcome, and record retries through the sink.
  5. [minor] Live pre-land member refusals now suspend the whole train instead of ejecting the refused member. LiveTrainForge::observe_gate (pr_train.rs ~2289) maps every gate Err (a new merge-hold, a withdrawn approval, a spec-policy refusal; local, settled answers) to Transient, so ForgeRails::land returns TrainCiUnavailable and leaves the train PR open until abandoned-train cleanup. The Known(Err) ejection arm is reachable only from the fake. The BUG-2214 behaviour (a lapsed mandate ejects a held member with its hold intact) is lost. Either type the gate's refusals so they stay Known(Err), or add a live-path test pinning the intended suspend behaviour and note it in the spec.
  6. [major] Completing trailer on the content commit. The branch's only non-merge commit d726665ca8f is titled '[AI:codex] chore(seat): work native Codex lane 01a1b00cf0f1 left uncommitted (STORY-2401)'. That is a bare trailer and a non-descriptive subject. Train/ship derive the squash subject from the head commit message when no subject is derived (pr_train.rs member_squash_subject, derive_pr_title_from_commit), and merge-time completion reads trailing IDs, so landing this slice can mark STORY-2401 complete while AC3 (train journal) and AC4 (workflow digest) are unimplemented. The PR title and the plan doc both say a Refs subject is required. Reword the commit to the plan's '[AI:codex] fix(forge): confirm lifecycle negatives before cleanup (Refs STORY-2401)'.
  Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
