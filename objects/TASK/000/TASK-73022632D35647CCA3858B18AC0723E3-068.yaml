title: 'First-run F5 remainder: init wires Codex/Antigravity hooks when those CLIs are absent, and ''1 files skipped'' never names the file'
description: |
  F5 in docs/plans/2026-11-27-fresh-user-walkthrough.md (branch task-3951-fresh-user-walkthrough) expects three things. TASK-3952 covers only the commit: init now leaves its files uncommitted unless asked. Two remain, reproduced again on the TASK-3952 branch in a fresh repo with a clean HOME:
  - init writes Codex (.codex, 15 files) and Antigravity (.agents/hooks.json) hook wiring when neither CLI is on PATH. Expected: scaffold only the agents it detects.
  - "1 files skipped (already exist, use --force to overwrite)" does not name the file, in a repo that had only README.md. Expected: name every skipped file.

  Raised by the implementer while working TASK-3952.
