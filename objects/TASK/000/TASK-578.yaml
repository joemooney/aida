  content: 'Implementation path (deferred to a keyboard session — touches the drain command''s arg validation): add a bool ''--drain'' to queue work that expands in the handler to auto_complete=Some("full") + no_human=Some("both") + max defaulted to queue size (99 fallback). The composition requirement (''--drain composes with --max / --max-failures / --batch'') needs ''--max'' and ''--max-failures'' — today ''requires = "auto_complete"'' — to ALSO accept ''--drain''. Clean clap idiom is an ArgGroup(''drain_mode'', [auto_complete, drain], multiple) with those flags ''requires = "drain_mode"''. There is currently NO ArgGroup anywhere in cli.rs, so this introduces the first one ON the reliability-critical drain command. Per the recursive-failure-risk discipline (TASK-456, just shipped), validation changes to the drain command''s parsing should land watched, not in an unsupervised loop — a mis-validation would surface at drain invocation. Behavior of the existing --auto-complete drain is unchanged; --drain is pure sugar. Verify with: ''queue work --drain --dry-run'', ''queue work --drain --max-failures 3'', ''queue work --max 3'' (should still error without a drain mode), and --help showing --drain prominently.'
