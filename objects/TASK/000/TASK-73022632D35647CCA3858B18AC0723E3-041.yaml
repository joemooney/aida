title: 'Throughput guard: LANE-OUTCOME sees only the lanes launched from the host it runs on'
description: |
  LANE-OUTCOME reads the lane receipts under .aida/lane-results/ of the checkout the guard runs in (aida-cli-lib/src/land_stalls_lanes.rs lane_outcome_facts). Receipts are host-local, so a lane launched on dell1 is reported only by a scheduled throughput-guard run on dell1. If only the primary host runs the scheduler, exits of lanes on other hosts are never reported.

  Options: run the throughput-guard job on every lane host, or publish the terminal lane result to the shared store so one run sees all hosts.

  Also in the same area: STALE-CLAIM judges a claim recorded on another host only after stale_claim_remote_mins (12 h), because its holder cannot be looked at from here.

  Raised by the implementer while working TASK-3827.
