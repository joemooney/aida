title: 'guided pickup of a keystone child spec took five attempts: role from queue entry, branch held by idle worktree, non-delegating grant — and the last failure left a half-started session'
description: 'Operator, 2026-10-06 18:45-18:51, launching ''aida queue work TASK-1607 --guided --branch story-1485''. Failures in order: (1) lease taken under role advisor because the operator''s shell was the advisor seat; (2) after ending it, ''InProgress but no local lease'' (status left stuck by the ended lease — same shape as TASK-1603); (3) role resolved ''advisor (cluster-derived)'' from the queue entry''s for_role despite the shell being in role:implementer — the shell''s explicit role should win or the mismatch should be stated before acting; (4) ''git worktree add'' failed because story-1485 was checked out in an idle, clean, unleased worktree — queue work could detect that and offer to retire it; (5) after creating the session, lease, worktree and Approved->InProgress bump, launch failed with ''the active implementer grant does not delegate implementer'' — a check that is knowable BEFORE any side effects. Ask: run the delegation check, the branch-availability check and the role resolution as a preflight before any state change; when a launch fails post-setup, print the exact manual continuation (worktree enter + claude ''/aida-guided-implement <ID>'') rather than only the error. Also: the guided-lane tag did not keep TASK-1607 out of ''queue work --drain'' — only ''--mode guided'' did; tag and mode should not diverge silently. Operator quote: ''aargh so many attempts to get the command line right''.'
