title: A cancelled full-tier run on an approved head is never re-requested; it reads red until someone reruns it
description: |
  `full_tier::label_plan` (aida-cli-lib/src/full_tier.rs) leaves the PR's labels alone whenever the head already carries a `ci-tier: full` check, so a request never cancels a full run. The cost: when that run was cancelled (for example by an unrelated label event, BUG-2578), the train reports it as red and nobody starts another; an operator has to rerun the cancelled jobs. A narrower rule could re-apply the label when the head's only full-tier run is completed and cancelled.

  Related: `judge_commit_checks` now judges the latest run per check name, but a check that only the cancelled run reported still counts as failed.

  Raised by the implementer while working STORY-2809.
