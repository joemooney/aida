title: 'aida schema --all: dump every object''s full field detail in one pass (+ make --json with no object include fields)'
description: |-
  Today there is no single command that shows every storable object's full field/enum detail: `aida schema` (no arg) and `aida schema --json` (no arg) emit only the catalog (name + one-line description, zero fields — verified); per-object detail requires naming each object and running the command ~10 times.

  Add a one-shot full dump:
  1. `aida schema --all` — human output: the catalog followed by each object's field detail (the same projection `aida schema <object>` already builds), in catalog order.
  2. `aida schema --json` with NO object argument should include a `fields` array per object (currently it omits them), so the machine surface is a true full dump in one fetch — useful for the CLI manual generator and aida-tutor (STORY-601) and MCP consumers (TASK-715 exposed schema over MCP).

  Contained change in handle_schema_command, which already assembles per-object detail. Mirror onto the MCP schema resource/tool for parity (STORY-82/TASK-715). trace:STORY-538. Surfaced writing the CLI manual (EPIC-40).
