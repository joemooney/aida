  content: 'ADVISOR RULING (2026-11-03): bundle. TASK-2803 and TASK-2804 are folded into this task as one ''pipe streaming hardening'' slice of the TASK-2790 follow-ups. Scope: (1) check-ci-gates.py stream_diagnostics catches OSError and ValueError (not only BrokenPipeError) and keeps draining, like the Rust reader; (2) when the parent stream is a TTY, set CARGO_TERM_COLOR=always and CARGO_TERM_PROGRESS_WHEN=auto for cargo children in dev_build.rs run_checked and check-ci-gates.py run_gate (TASK-2803); (3) a unit test for run_checked''s fetch_error branch, and a code comment on the EOF-vs-exit wait recording the inherited-stderr hang hazard (TASK-2804). Gate: LIGHT.'
