description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-2790, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking/minor: check-ci-gates.py run_gate stream_diagnostics swallows only BrokenPipeError; any other sink OSError (or a sys.stdout without .buffer) kills the reader thread, the child then blocks on a full pipe and child.wait() hangs. Catch OSError/ValueError like the Rust reader, which ignores all write errors.
