title: TASK-1205 cross-target check needs foreign SDK strategy
description: 'TASK-1205 implementation found that the exact requested Linux-runner command, cargo check --workspace --tests --target x86_64-pc-windows-msvc and aarch64-apple-darwin, fails before reaching AIDA code because third-party C build scripts require foreign SDK/toolchain pieces. ring fails on MSVC without lib.exe/Windows headers and on Darwin without Apple-compatible compiler/SDK flags; libsqlite3-sys also requires MSVC archiver/tooling. I made the Linux-hosted target check report-only and added the path-filtered real Windows/macOS PR matrix plus the required portability ratchet. Follow-up choices: provision real foreign SDKs on Linux, change feature topology so a pure-Rust no-default cross-target test compiles, or amend TASK-1205 acceptance to rely on the actual OS matrix for full-workspace coverage.'
