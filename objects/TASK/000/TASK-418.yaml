  content: 'Dismissed by joe 2026-05-21: Defensible constraint. Events without timestamps cannot be filtered by time by definition — the alternative would be to either include all untimestamped events (defeating --since''s purpose) or drop them silently (data loss). The current behavior is the principled choice; --help text could mention it as a follow-up if confusion recurs.'
