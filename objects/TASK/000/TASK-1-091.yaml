title: Advisor-driven findings-add collided with operator's queue work on cache lock. …
description: 'Advisor-driven findings-add collided with operator''s queue work on cache lock. Pattern: master fires aida findings add to capture an observation while operator simultaneously runs aida queue work. The findings-add''s schema-apply holds the cache lock long enough that operators retry-with-backoff times out. STORY-463 saved us — the lock-holder-visibility error message immediately diagnosed the cause. Mitigation: master should serialize advisor-driven writes when operator is actively running commands; batch multiple findings-add into one logical write where possible. The substrate-side fix would be: schema-apply uses a shorter critical section or a separate apply-once flag so repeat invocations don''t re-apply schema.'
