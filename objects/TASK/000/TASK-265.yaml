  content: 'Acceptance correction 2026-05-17 (per implementer pushback at design checkpoint): the original ''non-TTY mode: pretty-print degrades to a single-line summary'' criterion was based on a flawed mental model — the primary caller (/aida-pickup via Claude Code Bash tool) is ALWAYS non-TTY, so the degradation rule would make the card never appear in its own use case. **Corrected**: `--card` always renders the box regardless of TTY; `--brief` is the explicit single-line opposite for scripts. Implementer is shipping Option 1. Updating acceptance criteria below.'
