- id: 019e36df-6390-7f80-86f2-531295d895f0
  author: joe
  content: |-
    Implemented via branch task-265 (commit 775a4766):

    - `aida show <ID> --card` renders a boxed spec card — header rule, id/type/priority/status one-liner, key fields (feature/tags/parent/related), lead-prose description, acceptance criteria, git linkage.
    - `--card --brief` (single-line summary) and `--card --full` (no truncation) density variants; plain `aida show` unchanged as the canonical view.
    - /aida-pickup skill + command templates gain Step 3c to render the card right after mark-in-progress.

    Design note: the box renders whether stdout is a TTY or a pipe (the skill invokes it through the Bash tool, a captured pipe), so `--brief` is the explicit single-line mode rather than an auto-collapse-on-non-TTY.

    Test status: 551/551 aida-cli tests green; cargo fmt + clippy clean.
