title: Idle CI timeout that re-arms on base-branch movement
description: 'no-mistakes ci_timeout is an IDLE timeout: re-arms whenever CI posts progress or the base tip advances; only genuine stalls die. AIDAs worker uses a flat absolute AIDA_WORKER_SPEC_TIMEOUT, so a drain blocked on slow CI gets killed. Make the CI-wait an idle timeout with a separate absolute safety ceiling.'
