  content: |-
    Implemented --steal flag on aida queue work.

    - cli.rs: --steal bool on QueueCommand::Work
    - main.rs: pre-flight in handle_queue_work calls find_scope_lease_conflict(); without --steal, refuses with lease id/role/worktree + suggests --steal; with --steal, session_end(yes=true, force=false) the holder first
    - new pure helper find_scope_lease_conflict(): case-insensitive scope match, freshest-by-started_at wins
    - tests: 4 new unit tests in queue_work_tests covering empty/mismatched/exact/case-insensitive/freshest paths (all 239 aida-cli tests green)
    - manual smoke: `aida queue work TASK-84 --no-launch --no-pull` against the live EPIC-23 lease produces the new error naming lease 019e1cc3 and --steal

    Uncommitted-changes guard on session_end is intentionally NOT escalated to --force under --steal — that would silently discard in-flight work. The error surface tells the user to use `aida session end <id> --force` manually for the destructive path.

