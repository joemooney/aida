  content: |-
    ## When to use `aida queue work --steal` (doc seed, 2026-05-12)

    **TL;DR**: Muddle recovery tool, not daily use.

    ### Scenarios where --steal is needed

    | scenario | typical cause |
    |---|---|
    | Agent crashed mid-work | claude process killed (OOM, network, system shutdown); lease + status In-Progress lingers |
    | Forgotten cleanup | User stopped working an item but didn't mark done/rejected |
    | Cross-machine handoff | Node 3 (spock work) picked up item, went idle; node 1 (imac) wants to take over |
    | Stale after `--force` end | Session-end forcibly killed the claude; lease cleaned but req status not flipped |
    | Re-do from scratch | User wants to redo an item on a different branch / approach |

    ### Alternatives that cover ~90% of cases

    ```bash
    # Just flip the status back to Approved — claim it via normal pickup:
    aida edit TASK-X --status approved
    aida queue work TASK-X

    # Or end the holding session if accessible:
    aida session leases
    aida session end <id> --force
    aida queue work TASK-X
    ```

    So `--steal` is the one-step shortcut for the recovery dance. Without it: 2-3 commands. With it: 1 command + a confirmation prompt.

    ### Honest priority assessment

    Filed as Low because: workarounds exist; muddle-state is rare; not blocking anything. Worth shipping eventually for completeness, not urgently.

    ---

    *This comment is a documentation seed per EPIC-24 (living documentation). Future `aida doc generate` could extract sections like this into `docs/tutorials/` book chapters.*
