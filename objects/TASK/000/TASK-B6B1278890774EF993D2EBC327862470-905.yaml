description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-897, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): submit_with_runner_status (deputy_shell_cmd.rs:336) only special-cases RunnerStatus::Legacy; for RunnerStatus::Unknown (e.g. a sandboxed seat that cannot see host processes) it still bails 'no script deputy is running', while list reports 'runner: UNKNOWN'. Consider echoing the Unknown reason in the refusal.

