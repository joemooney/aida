    2. BLOCKER (fail-open, strict tier): vendor_containment_posture now maps trusted codex="aida" to ContainmentPosture::Aida (session.rs:3221). The only refusal for surfaces that are not wired is the guard in codex_tool_env::prepare_launch (codex_tool_env.rs:91), and it fires only when the child Command explicitly carries AIDA_CONTAINMENT_POSTURE=aida. Several Codex surfaces never stamp that value from containment_posture. (a) Interactive 'aida agen
    3. MINOR (test strength, G-i): task_2707_registry_and_launch_tokens_absent_in_outer_and_inner (launch_tests.rs:277-315) writes its own 'synthetic lease'/'synthetic store' files into the temp state and then scans them. That cannot detect a production lease, store or log write of OPENAI_API_KEY. Exercise the real lease/registry/log writers on the contained path (stamp_lease_active_pid, register_headless_lane_for_child, the tee log), or assert on th
