    3. contained_host.py broker_connect_contained: nested = socket_netns(dup) != lane_net treats ANY netns other than the lane's as nested, and connect_nested then connects that socket host-side with an arbitrary address. A socket in the HOST netns that ends up in the lane gets an unbrokered host connect. Today that covers the relay sockets the broker itself installs (only EISCONN saves those) and any future inherited or SCM_RIGHTS-passed host socket. This is fail-open by construction. Verify that the socket's netns is a real descendant of the lane (NS_GET_USERNS/NS_GET_PARENT owner chain up to the lane userns) and refuse otherwise. Add a test that a host-netns or relay-installed socket re-connect is refused.
    4. contained_lane.py:76 socketpair(AF_UNIX, any type) now allows SOCK_DGRAM. A unix datagram socket from socketpair can still sendto()/sendmsg() to a pathname address, which is the same bypass the docstring gives for keeping socket(AF_UNIX, SOCK_DGRAM) denied. sendto/sendmsg are only checked for MSG_FASTOPEN. The /run and /tmp tmpfs reduce the reachable targets but do not remove them. Either deny sendto/sendmsg with a non-null msg_name on unix sockets, or record the accepted residual risk on the spec. Add a live test that a socketpair dgram sendto a host datagram path fails.
    5. launch/contained.rs host_vendor_state_masks masks ~/.claude and a relocated CLAUDE_CONFIG_DIR, but not the host ~/.claude.json (and its .backup). That file holds Claude account metadata, project trust and MCP server configs, which may contain env secrets. It stays readable through the read-only HOME in a contained Claude lane. Mask it (and test it) so that C7 'host Claude state masked' actually holds.
    6. ContainedChild::vendor_exit (contained.rs ~:1209) re-reads the HOST credentials path, not the leaf bound into the lane. If the host refreshes the token mid-lane (Claude writes a new inode via rename), the lane's read-only bound token can expire while vendor_exit sees a fresh expiry, so the failure is reported generically instead of as CLAUDE_EXPIRED_IN_LANE. Separately, unwrap_or(true) labels an unreadable credentials file as expired. Capture the bound token's expiresAt at prepare time and judge against that.
