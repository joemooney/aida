    REVIEW FINDINGS TO ADDRESS (PR #3449):
    Verdict: CHANGES REQUESTED
    Reviewed commit: b29dacfa45b4
    Recorded: 2026-11-06T12:12:30.183265620+00:00
    Findings:
    1. MAJOR (AC1 keep-existing-behavior, all lanes incl. Codex, on kernels 5.19-6.8): contained_host.py:73-91 target_socket. On kernels without PIDFD_THREAD, pidfd_open(tid, 0x80) fails with EINVAL (unknown flag). The second plain pidfd_open(tid) for a NON-LEADER TID also fails with EINVAL: pidfd_create/pidfd_prepare refuse with -EINVAL when !pid_has_task(pid, PIDTYPE_TGID). It never returns ENOENT/ESRCH. The code re-raises anything not in (ENOENT, ESRCH), so the Tgid+KCMP_FILES fallback never runs, and every sendto/sendmsg (now trapped for every lane), nested connect and SCM_RIGHTS lookup from a non-main thread gets EACCES. That covers tokio worker threads in Codex and any threaded lane tool. These kernels pass the lane's own 5.19+ gate (for example Ubuntu 24.04 GA 6.8 and Debian 12 6.1). The synthetic test (launch_tests.rs, old_pidfd_open raising ENOENT for the non-leader) models the wrong errno, so it passes against code that cannot work. CI and the host run on 6.9+ kernels, so PIDFD_THREAD always succeeds there and the fallback is never exercised. Fix: when PIDFD_THREAD is unavailable, read Tgid from /proc/<tid>/status first. If tid != tgid, go straight to the kcmp(KCMP_FILES) proof plus a leader pidfd, and treat EINVAL from the plain open as non-leader. Make the synthetic mock raise EINVAL, matching the kernel. Also fix the round-2 testing note (docs/internal/testing/task-2708-round2.md:155-157), which claims the fallback works.
    2. MINOR (behavior drift, record or mitigate): contained_lane.py:124-128 now installs every lane filter with WAIT_KILLABLE_RECV. After the broker RECVs a notification, the trapped thread sleeps TASK_KILLABLE. Handled signals (SIGINT/KeyboardInterrupt, SIGALRM timeouts, graceful SIGTERM handlers, Go SIGURG) are deferred until the broker responds. Combined with the round-4 indefinite blocking-send wait (no SO_SNDTIMEO, worker held until progress), a blocking send to a stalled peer can no longer be interrupted by any handled signal, only by a fatal one. On main a blocking send() returns EINTR or is restarted per SA_RESTART. This is the accepted price of the round-3 F2 duplicate-send fix, but it is a deviation from keep-existing-behavior across all lanes, Codex included. It also raises the containment kernel floor to 5.19. Record both as accepted deviations on TASK-2708 with advisor signoff (and in the testing note), or mitigate them. No code change is required if the advisor accepts it.
