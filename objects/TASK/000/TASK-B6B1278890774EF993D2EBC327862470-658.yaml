    1. BLOCKER (CI lib-1, authority): story_1917 no_code_path_outside_role_enter_writes_grant_binding_or_calls_bind_grant_to_pid fails. session.rs:2109 (spawn_vendor_headless_forking contained arm) and session.rs:6621 (run_vendor_headless_child contained arm) call crate::gate::seat_authority::bind_grant_to_pid; only role_lifecycle.rs and gate/seat_authority.rs may. Move the binding into a seat_authority-owned launch-child API, with an advisor ruling if it changes binding semantics. Do not loosen the ratchet.
    2. BLOCKER (CI lib-1): task_1752 only_seat_authority_names_or_reads_the_grant_env_var fails. containment/launch.rs:31 (ENV allow-list literal "AIDA_SESSION_GRANT") and launch.rs:473 (explicit(child, "AIDA_SESSION_GRANT")) name the grant env outside seat_authority.rs. Use crate::gate::seat_authority::GRANT_ENV.
    3. BLOCKER (CI lib-1): headless_hint_tests headless_env_launches_route_through_shared_argv_builders fails at session.rs:7386 (spawn_vendor_headless_resume_granted). The two lines added to the issue_launch_child contained argument (session.rs:7379-7381) push headless_vendor_args_contained_in out of the 20-line window above .env("AIDA_HEADLESS", "1"). Hoist the contained-grant bool into a local, as at session.rs:2041, so the builder stays in context.
    4. BLOCKER (CI lib-1): test_home no_direct_home_resolution_in_crate fails. containment/launch.rs:460 reads std::env::var_os("HOME") directly (and :463 derives CODEX_HOME from it). Resolve the host home through aida_core::home / crate::home_dir, or add an allow-direct-home-dir marker with a justification.
    5. BLOCKER (CI lib-0): both bug_1723_config_trust_tests fail on the new scripts/config-trust.toml entry for aida-cli-lib/src/containment/launch.rs (channels other-file/write/trusted, sites=1). every_project_config_writer_goes_through_the_adoption_guard fails because launch.rs:580 writes the private Codex config.toml without write_config_atomic or config_edit. Either route the write through the guard or add a WRITE_CHANNEL_EXEMPT entry saying it writes generated vendor state, not project config. Then fix the inventory and site-count mismatch that every_config_toml_site_is_inventoried_and_every_worktree_key_is_policy reports.
    6. MAJOR (strict tier, fail-open): codex_tool_env.rs:117-127 refuse_unwired_aida_posture returns Ok when no root resolves (find_main_worktree_root fails outside a repo). It also maps any load_contained_vendor error to None via .ok().flatten(), so a corrupt or unreadable trusted policy, or a git error, lets an unwired Codex surface launch without AIDA containment under codex="aida". Refuse on error, and on a missing root unless the posture is provably not aida. Add a refusal-path test for the load-error case.
