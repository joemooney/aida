    1. BLOCKER (CI lib-1, authority): story_1917 no_code_path_outside_role_enter_writes_grant_binding_or_calls_bind_grant_to_pid fails. session.rs:2109 (spawn_vendor_headless_forking contained arm) and session.rs:6621 (run_vendor_headless_child contained arm) call crate::gate::seat_authority::bind_grant_to_pid; only role_lifecycle.rs and gate/seat_authority.rs may. Move the binding into a seat_authority-owned launch-child API, with an advisor ruling if it changes binding semantics. Do not loosen the ratchet.
