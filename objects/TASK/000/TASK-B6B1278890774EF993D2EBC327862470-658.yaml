  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3449):
    Verdict: CHANGES REQUESTED
    Reviewed commit: df6bf0e76661
    Recorded: 2026-11-06T08:43:07.243932070+00:00
    Review comment: https://github.com/joemooney/aida/pull/3449#issuecomment-6680871907
    Findings:
    1. MAJOR (shared-boundary behavior regression, AC1 keep-existing-behavior): contained_host.py:228 and :233 broker_send forces MSG_DONTWAIT on every brokered sendto/sendmsg. contained_lane.py now notifies on nr 44 and 46 for ALL lanes, and send(2) is sendto, which Rust std TcpStream::write, CPython sock.send/sendall and curl all use. So a BLOCKING socket whose send buffer is full now gets EAGAIN instead of blocking. CPython sendall on a blocking socket raises BlockingIOError, and C callers treat EAGAIN on a blocking fd as fatal. This hits every contained Codex lane, not only Claude. Fix: when the socket is blocking (fcntl O_NONBLOCK clear on the dup), do not report EAGAIN. Hand the send to a bounded worker (like connect_nested's slots and deadline) that waits for POLLOUT with a deadline, or loop poll/send off the broker loop. Add a live test: a blocking lane socket whose buffer fills, then drains, completes the send.
    2. MINOR-MAJOR (stream semantics): contained_host.py:183 (read bound 1 MiB) and :195 (iovlen<=64) refuse oversized sends with EACCES. For a SOCK_STREAM socket a short write is legal and expected. CPython sock.sendall(b) on a blocking socket passes the whole remaining length to send(), so any >1 MiB sendall from a lane tool (requests or http.client uploads, pip) now fails with PermissionError. Fix: for stream sockets, clamp the copied length to the bound (and the iov list to the first N entries or bytes) and return the partial count. Keep EACCES or EMSGSIZE only for datagram or seqpacket, where truncation changes message boundaries. Add a test that sendall of about 4 MiB through a lane socketpair or the relay succeeds.
    3. MINOR (strict tier, consistency with the F3 ruling): broker_send executes a NAMED sendto host-side on the pinned socket of whatever netns it belongs to. It never calls socket_scope, unlike broker_connect_contained (contained_host.py:293). A host-netns or foreign-netns datagram socket that reaches the lane (inherited, or SCM_RIGHTS-passed: the same class F3 called out) would get unbrokered host-network named sends. No such socket exists today, so this is defense in depth, but the F3 ruling says any foreign netns, including the host's, is refused. Fix: for a named send on a non-AF_UNIX socket, require socket_scope in {lane, nested} and refuse 'foreign' or a lookup error. Add a test that a host-netns UDP socket's named send is refused.
    4. MINOR (AC1 'vendor additions use data not new containment code'): launch/contained.rs:915 sets "nested_userns": vendor.key == "claude", a vendor-name literal inside the shared prepare path. Make it a field on the CONTAINED_VENDORS row (contained.rs:358), so a future vendor that runs its own nested sandbox, such as agy under TASK-3048, opts in by data. Assert it through the row in task_2708_claude_prepare_fake_home.
