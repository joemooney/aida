title: Design first-class subsystem representation
description: |-
  Design the durable representation for project subsystems.

  Acceptance:
  - Decide whether subsystems are new storable objects, feature-category extensions, structured tags, config entries, or another representation.
  - Define fields such as name, description, owner/advisor role, scope globs, matching tags/features, memory focus, queue routing, risk policy, and escalation policy.
  - Define how subsystem membership is computed for specs and files.
  - Define migration from current tags/features/subsystem-scoped memories.
  - Include examples for likely AIDA subsystems: autonomy, orchestrator, mcp-server, cli, tui, docs, product, security.
