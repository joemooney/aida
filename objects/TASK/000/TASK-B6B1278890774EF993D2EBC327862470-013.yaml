  content: 'ADVISOR RULING 2026-10-27 18:55 MST: option C approved. Add a gate-owned facade gate/dispatch_deps.rs wrapping exactly the external calls gate/dispatch_* make; point the allowlist at that facade alone (root allowlist = {gate, dispatch}); where a wrapped call must keep its implementation outside gate/, protect only that specific leaf file, never whole hot files (forge.rs, lib_part3.rs). B rejected (it would force human merges on hot files); A is subsumed by C. Ratchet: gate/dispatch_* may reach outside gate/ only through dispatch_deps.rs, with negative tests for the two-hop forms.'
