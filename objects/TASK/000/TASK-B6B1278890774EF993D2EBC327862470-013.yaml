- id: 01a1801b-e12d-7f32-b85c-97e39a898f6e
  author: joe
  content: |
    SKETCH (design needed; not fixed in the 014/015 PR)

    Why a ratchet fix does not close this: the gate's allowlisted definers (kernel.rs `canonical_role_name`, lib_part3.rs `load_store_for_lookup`, plus the agent_registry/forge/mandate_drive/process_probe modules) are unprotected. Their fn bodies can call any crate-root module (`util::wrap(raw)` through kernel.rs's private `use crate::*`, or a bare name resolved through a root glob), and that module can call `crate::dispatch::*`. Following this with a name scan means taking the transitive closure of every crate path the definers reach, and bare names behind a glob cannot be resolved by name at all. In practice that is the whole crate, which is not a ratchet.

    Options:
    A. Move the two allowlisted fns behind gate/ (for example `gate/dispatch_support.rs` re-exported from kernel/lib_part3 for existing callers). Their bodies are then protected. Cost: small refactor; the module entries (forge, agent_registry, mandate_drive, process_probe) still carry the same two-hop risk.
    B. Add the GATE_DISPATCH_ROOT_ALLOWLIST definer files (kernel.rs, lib_part3.rs, agent_registry.rs, forge.rs, mandate_drive.rs, process_probe.rs and what they mount) to the protected gate paths. This closes every variant, but forge.rs and lib_part3.rs are hot files, so mandate-shipped work would need human merges much more often.
    C. (Recommended) Shrink the surface first: give gate/dispatch_* a narrow gate-owned facade (`gate/dispatch_deps.rs`) that wraps exactly the external calls the gate uses. Point the allowlist at that facade alone, so the root allowlist becomes {gate, dispatch}. Then, where a wrapped call's implementation must stay outside the gate, protect only the specific leaf files (not all of forge.rs). This is A generalised to the module entries.

    Needs: advisor ruling between A/B/C before implementation. 014 (module mount #[path]) and 015 (textual macro scope) are closed by the ratchet in the same PR and do not depend on this decision.
