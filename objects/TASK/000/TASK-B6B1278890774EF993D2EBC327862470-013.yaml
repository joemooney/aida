title: (major, non-blocking, design) Two-hop laundering through definer function bodie…
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-010, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  (major, non-blocking, design) Two-hop laundering through definer function bodies is still open: kernel.rs has a private use crate::*, so changing fn canonical_role_name's body to call util::wrap(raw) (rooted to crate::util, first segment != dispatch, so dispatch_items ignores it) where unscanned util.rs calls crate::dispatch::sha256_hex makes the gate's existing crate::canonical_role_name run dispatch code with no gate edit. Bare single-segment names resolved through a root glob (note() drops lone names) are a further variant. A name-based scan cannot close this; recommend moving the allowlisted fns (canonical_role_name, load_store_for_lookup) behind gate/ or adding the GATE_DISPATCH_ROOT_ALLOWLIST definer files to the protected gate paths.

