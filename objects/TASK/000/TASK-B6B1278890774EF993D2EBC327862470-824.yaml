description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2450, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): review_watch.rs:1279 derives setup_retry from ANY prior Failed attempt on the head, so preflight failures (execute_reservation -> Failed, review_watch.rs:1788) and mark_spawn_failed (review_watch.rs:2101), which were freely retried before, now park the head terminally after two consecutive transient failures (e.g. a forge-probe flake), and select() reports 'exited without completing (no diagnostic)' because those transitions record no diagnostic. Set the retry marker only from the Exited->Failed setup conversion, or record the diagnostic.

  PR: #3408
