  content: 'REFINEMENT (operator, 2026-06-26): after ''request approval'' routes a spec, the TUI should AUTO-UPDATE the item to show it is now queued for the advisor. The verb-completion refresh already fires (BUG-633), but routing does not change the spec STATUS (stays Draft), so there is nothing visible to update without a per-item ROUTING BADGE (e.g. ''→ advisor''). That badge is the core of this spec — surface queue membership per item so a routed draft is visibly distinct.'
