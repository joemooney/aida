title: 'TUI: no queue/routing visibility — can''t see what''s routed to advisor/implementer queues'
description: 'Walkthrough finding (operator, 2026-06-26): after ''request approval'' routes a draft to the advisor queue, there is NO way to see it in the TUI — routing doesn''t change spec status (stays Draft), and the Queue scope is a stub. The operator routed TASK-941 and it ''vanished''. NEEDED: (a) make the Queue scope functional — show each role''s queue (advisor/implementer) and what''s in it; AND/OR (b) a per-spec ROUTING BADGE on item rows (e.g. ''→advisor'' when a spec is queued for a role), so a routed Draft is visibly distinct from an un-routed one. Connects to STORY-672 (fleet-wide queue view) and the queue/processing visibility question.'
