  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3472):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4a688a8796cf
    Recorded: 2026-11-08T09:09:39.510167096+00:00
    Findings:
    1. aida-cli-lib/src/review_watch.rs:2188 adds a new production read of ".aida/config.toml", but scripts/config-trust.toml has no [readers."aida-cli-lib/src/review_watch.rs"] entry. The detector in aida-cli-lib/src/tests/bug_1723_config_trust_tests.rs (is_config_toml_site matches `config.toml"`) counts this site, so every_config_toml_site_is_inventoried_and_every_worktree_key_is_policy will fail. Found by reading the guard; not executed (no cargo under review-watch policy), and PR CI was still pending. Fix: add the readers entry with channels=["worktree"], sites=1, or reuse the existing read in review_watch_ready.rs:388 and keep that one site.
    2. scripts/config-trust.toml [keys.worktree.review_watch] (line ~652) lists only required_checks. The new branch-local key max_concurrent is unclassified, contrary to the BUG-1723 doctrine that every key parsed from the worktree copy is classified. Add max_concurrent = "policy" with a one-line rationale (bounds reviewer count, launches nothing).
    3. TASK-3472 CHANGE calls for a Help-Golden trailer; commit 317e7493a87 has none, although the implementer handoff comment says the host commit should include "Help-Golden: updated". Include the trailer on the rework commit.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
