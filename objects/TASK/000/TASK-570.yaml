  content: |-
    Implemented via commit 9377ce71:

    - collect_doctor_findings: walks the queue, pushes a DoctorFinding (category `orphan-queue-entries`, safe_heal=true) for any entry whose requirement_id is missing from the store. Mirrors the detection in `aida queue prune --orphaned` (TASK-537).
    - heal_doctor_finding: new match arm `orphan-queue-entries` → `heal_doctor_orphan_queue_entry`, which delegates to `storage.queue_remove`. Idempotent — re-run on a clean queue reports `skipped`.
    - normalize_doctor_category: aliases `orphan-queue`, `queue-orphans`, `orphan-queue-entry` → `orphan-queue-entries`; updated the unknown-category error list.
    - Tests: doctor_detects_orphan_queue_entries, doctor_heals_orphan_queue_entries, doctor_orphan_queue_aliases_normalize (all green).

    End-to-end smoke (delete a spec → `aida doctor` surfaces the ghost → `aida doctor --heal --yes` removes it → re-run reports no drift) verified against a fresh `aida init` project.

    Test status: 12/12 doctor tests green; full aida-cli test suite has 2 pre-existing failures in cli.rs:2729 (a /// trace:TASK-537 leak introduced by TASK-537's PR — not from this work).
