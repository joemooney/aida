title: 'aida zen finish: bias the auto-exit decision by operator presence (STORY-561)'
description: 'Follow-up to STORY-564 (acceptance #5, deferred). Once STORY-561 presence consumers land (aida human home/away), have ''aida zen finish'' read ~/.aida/presence.toml: away → bias toward auto-exit even when a soft signal would pause; home → may still pause. ADVISORY ONLY — never overrides the integrity signals (needs-human marker / open punt / --pause-always), which stay hard. Wire into zen::classify_finish as an additional input, plumbed through handle_zen_command''s ZenCommand::Finish arm. Deferred because presence is plumbed-not-wired today (no consumers).'
