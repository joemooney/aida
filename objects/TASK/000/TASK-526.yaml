  content: 'Superseded by TASK-527 (verified 2026-06-05). TASK-526 has no acceptance body; its intent — a fast-track audit view of lifecycle:* tagged specs — is already delivered by ''aida list --tags "lifecycle:*" --show-tags'': TASK-527 added trailing-* prefix-glob to --tags (matches both ''lifecycle:no-review'' etc. AND the exact ''lifecycle'' base tag), and --show-tags already renders the tag column. Verified the filter is correct (TASK-626 carries lifecycle:no-review, BUG-410 carries lifecycle; both match). Adding a separate ''--tag-prefix'' flag would duplicate ''--tags X:*'', and a dedicated single-tag column is marginal polish that muddies the list surface for no new capability. Closing as superseded rather than shipping redundant surface; reopen with --force + concrete acceptance if a distinct column view is actually wanted.'
