    SKETCH (awaiting advisor signoff): TASK-1333 — separate parent authority root from isolated probe execution

    Author: Codex store-reconcile-sketch-author, separate AUTHOR advisor, 2026-10-08. Requires a NEW DIFFERENT advisor; no self-signoff. Exact proposed canonical comment body for root relay under companion read/converse/draft boundary. NOT posted canonically. No code, reconstitution/live vendor experiment, grant, launch, production activation, status/queue change or merge.

    ## Identity, history and verified present seam

    Read full canonical TASK-1333, origin TASK-1-224, UUID 01a10ffb-7469-7fa0-96ac-b030c8c0fc28; saved in store-reconcile-evidence/TASK-1333.json. Canonical read returned no comments. Preserve the finding from TASK-1327, its TASK-1523 blocks edge and independent STORY-1527 measurement dependency. InProgress comes from a recorded orchestrator phase-1 change at 2026-10-06T13:38:02; it is NOT evidence of an existing live doer. Queue/cache context is stale derived information and neither creates nor disproves a live owner. No ownership, lease or competing session is claimed here.

    Main/HEAD/local origin-main b46aec1e674baae5a329416d4119e67b59200a88 was inspected. reconstitute.rs::run_headless(project_root,cwd,...) resolves vendor using project_root, changes the PROCESS global cwd, then calls session::spawn_vendor_headless_with_seat with Advisor and contained=false. The shared launcher creates log/tee, resolves tuning and wait ceiling using headless_worktree_root(), issues the child there, and exports AIDA_DRIVE_ROOT derived there. headless_worktree_root discovers from ambient cwd and falls back to cwd. seat_authority::{current_grant,roster_allows,validate_child_delegation,issue_child} require actual parent grant and roster; scratch is not a trusted authority root. Do not “repair” that refusal by allowing missing rosters or copying a role label.

    Historical docs/testing/task-1327-reconstitution-launch.md pins monitor code aadafa46101198f4d794a6e7a7a5fa4b6d53b4d6, monitor store fbed31b886bea8d80e72a5648759e7f334d98309 and rebuilt investigation 978c497429. It records pre-vendor grant refusal and a separate strace with no vendor exec. Zero log and report exit 0 are not vendor success. Those are prior reported experiments, not rerun here. TASK-1-216/TASK-1327 reporting work remains intact.

    ## Owner / trigger / proposed surface

    reconstitute owns the read-only two-arm plan and isolated input/output layout. BUG-1808 owns the ONE common launch publisher and actual-child release. TASK-1607 contributes occupancy through that publisher; TASK-1612 supplies only the reviewed transport primitive, with production release unavailable. This task consumes those seams after their prerequisites exist; it must not add a parallel grant issuer, special “reconstitute spawn,” env-based release permission or alternate waiting-child protocol.

    Resolve and validate the canonical project/config authority root once at the parent entrypoint before creating probe artifacts or changing execution context. Use canonical repository/store discovery and the active parent grant/roster, not a caller-supplied scratch path or AIDA_DRIVE_ROOT as authority. Carry two distinct parent-only values through the shared launch plan: authority/config identity and per-child execution cwd. Proposed API vocabulary, not existing implementation: an immutable prepared probe execution description attached to the common launch plan; no second persistent schema. It includes arm kind, exact cwd object identity, permitted input/output surface and selected sanitized runtime configuration. Parent validates child delegation for Advisor; no automatic role substitution or additional delegable seats. A valid advisor parent that lacks advisor delegation still refuses.

    Remove std::env::set_current_dir from run_headless. Shared command/adapter construction sets the child's cwd explicitly from the execution description. Vendor/model/effort/wait ceiling are resolved in the parent against the trusted config root and reduced to allowed runtime values; config text, arbitrary project hooks, project MCP servers or a project-root path must not be inherited as “configuration.” Existing ordinary callers continue to describe their usual worktree as execution cwd through the SAME launcher. No global cwd save/restore or process-global root override is acceptable: concurrent probe/matcher/ordinary launch can interleave, and error restoration is currently best-effort.

    ## Baseline isolation is an actual dependency

    An empty cwd is not filesystem isolation. The current contained=false launch can read absolute paths through inherited HOME, environment, vendor configuration or tools. Merely passing the real root to issue_child while putting it in AIDA_DRIVE_ROOT would repair discovery by leaking the withheld context. That is rejected by this sketch.

    Arm A gets only the existing sanitized baseline inputs (bounded git subjects, README excerpt, names) plus its own fresh empty execution/output directory. Arm B gets only its deliberate store-derived prompt plus its distinct output directory; neither gets live source/store access as a side effect of authority resolution. Matchers remain distinct invocations with their explicitly supplied comparison pairs; no matcher/arm-B directory is visible to arm A. Keep BASELINE_WITHHELD and subject/README sanitizers; do not add spec IDs/criteria/ADRs/graph to baseline prompts, filenames, argv, log labels or runtime metadata visible to the leaf.

    Require the signed common containment adapter's strict-read profile, configured to expose only independently prepared runtime/vendor bytes and per-arm input/output/scratch. Broad read-only access to the host is insufficient. Parent authority root, real store, project source, other arms, canonical HOME/AIDA_HOME, project instruction/config files, parent cwd/root descriptors, host proc root/fd aliases and inherited project MCP sockets/endpoints must not be visible to the leaf. Use a per-arm minimal runtime home and explicit environment/FD allowlist in the common execution description; it must preserve the actual vendor's required supported runtime behavior without copying the project's agent context. Runtime credentials need an already-reviewed isolated delivery mechanism; this sketch does not authorize mounting all real HOME or inventing a credential broker.

    The real child grant/assignment remains scoped and validated by the parent/common publisher, and tied to the exact project, selected seat and actual child identity. No new child ability to delegate or discover arbitrary stores is granted. Parent retains the canonical grant/manifest/receipt and reports project-linked results outside the baseline. Do not export authority root as AIDA_DRIVE_ROOT, AIDA_AGENT_CONTEXT_FILE, cwd, extra writable path or “helpful” MCP config to the probe. If a common launcher contract currently requires the leaf to discover the live store to consume its grant, that is a concrete incompatibility: remain unsupported until the common owner provides a reviewed parent-only validation/leaf execution profile. Do not conceal it by copying roster/store context into scratch. A read-only grant identity alone is not proof of access isolation.

    This is narrower than a general adversarial vendor sandbox: network/model interaction retains the accepted adapter policy, but no ambient project/store tool endpoint or local filesystem alias may defeat the baseline's explicit surface. The tests must establish that local withheld context cannot be reached; this proposal makes no claim to stop a malicious model from knowing external public facts.

