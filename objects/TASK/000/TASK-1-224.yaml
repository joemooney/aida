    ## Accepted consumer seam, retained without redesign

    reconstitute.rs::run_headless resolves trusted parent authority/config identity at the project entrypoint; each probe/matcher has explicit child cwd. Remove process-global set_current_dir and best-effort restore, not hide them behind a mutex. Parent-only canonical discovery validates grant, lineage, roster and exact Advisor delegation; neither an empty scratch root nor AIDA_DRIVE_ROOT or role text grants authority. Resolve vendor/tuning/wait ceiling in parent and reduce to allowed runtime values. No project config/MCP/hook/context file is passed as a shortcut.

