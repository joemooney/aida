    CHANGES REQUESTED — TASK-1333 authority-root / isolated probe sketch

    Independent reviewer: Codex store-reconcile-independent-advisor, 2026-10-08; neither author nor coordinator. Exact sketch SHA256 8f31c5b7ca93cbbb1e65367b88e88e6b67f44029474eb2a2ab71125c42ac5c52, canonical comment 01a11c6a-d3c9-7191-a9db-6b3792fa1294. Source baseline b46aec1e674baae5a329416d4119e67b59200a88. Full report: .aida/handoff/orchestrator/run-20261008/STORE_RECONCILE_SKETCHES_INDEPENDENT_REVIEW.md. Preserve origin TASK-1-224, TASK-1327's historical pre-spawn finding, TASK-1-216 reporting fix and separate STORY-1527 block on TASK-1523. InProgress is not proof of an active doer or a satisfied dependency.

    Grounded decisions accepted: parent resolves trusted canonical project/config/authority identity; each child receives its own explicit cwd. Remove run_headless's PROCESS-global cwd mutation (reconstitute.rs:926/938), not a save/restore mutex or environment override. The old session.rs::spawn_vendor_headless_with_seat (1179) resolves tuning/root from ambient cwd, issues a grant at 1221, exports AIDA_DRIVE_ROOT at 1234 and uses ordinary Command; it is not the common publisher. seat_authority.rs::{current_grant,roster_allows,validate_child_delegation,issue_child} actually require the trusted roster and delegable child seat. Empty scratch cannot become an authority root; role labels, inherited strings or an advisor parent without advisor delegation cannot substitute. Resolve tuning in parent and reduce it to allowed runtime values, not project configuration/MCP/hooks. No global cwd or context leak is accepted.

    F1333-1 (blocking design integration): the sketch requires an “already-reviewed” isolated runtime/credential mechanism and parent-only authority/leaf execution profile without identifying one supplied by the signed common owner. This is a real unresolved dependency contract, not an approved implementation detail. Common callback/launch/pane signoffs approve shared publisher and adapter architecture, sealed executable identity, strict-read mount options and lifetime rules; they do not establish a particular vendor's working project-blind runtime home, credentials or absent leaf store-discovery requirement.

    Actual main is not that adapter. session.rs::strict_read_essential_paths (2414) includes /etc, /opt, /run and /var in addition to toolchain/library paths; bwrap_confinement_args_inner (2430 onward) falls back to broad read-only / for an empty allowlist, exposes a proc view and always binds the worktree writable. run_headless currently sets contained=false. A named strict-read flag or an empty cwd therefore does not prove the requested leaf-visible baseline surface. Do not assert a demonstrated proc escape: no live experiment was performed. The source instead establishes that allowed runtime bytes and process/socket/FD visibility have not been qualified for this consumer. Broad /run or inherited project endpoints cannot be assumed harmless merely because mounted read-only.

    Concrete same-sketch rework: name the BUG-1808-owned prepared execution profile and its exact contract (or explicitly identify it as an unprovided common-owner prerequisite). It must define the actual allowed runtime image/library/config/home bytes, selected vendor's credential delivery without real HOME/AIDA_HOME/project config exposure, environment/descriptor/endpoint allowlist, child cwd object binding, and whether/how the leaf executes without reopening the canonical grant/store. Parent retains and validates real authority through the common publisher; do not expose the trusted root, context path, canonical roster or a project-linked grant payload just to satisfy leaf discovery. Include arm A/B/matcher separation and redaction of leaf-visible metadata. Do not authorize a new credential broker, separate schema, grant issuer or special reconstitution launcher. If no accepted working credential/runtime contract is available, say “unsupported pending common-owner profile”; do not invent one or treat blanket refusal as the required successful probe.

    This reviewer settles the required boundary, not an unimplemented mechanism: use one common publisher with explicit per-child execution context, parent-only authority resolution and a genuinely restricted baseline surface. Stronger baseline read isolation governs this consumer even though ordinary vendor launch may use broad read-only filesystem access. Preserve signed default no-PID containment and bounded existing process-group lifetime scope; do not require cgroup infrastructure, hostile arbitrary-descendant extermination or a changed global containment default. Any concrete profile needed to satisfy the stronger local baseline contract needs common-owner independent design disposition and supported-runtime evidence. This is not an operator product-choice fork and requires no user question.

    Genuine implementation prerequisites, separately retained: TASK-1612 latest canonical comment 01a11c4c-b88b-78f0-bde2-8fbe2fb5e508 preserves REQUEST_CHANGES at 17b6ac3ecaafd158bdff1553bb43b4c5ca149780 for HostProfile::probe assuming PID1 instead of qualifying the actual nearer adopter, plus missing ordinary supported dynamic-runtime/lifetime positives. Its scope explicitly has no production release constructor or caller wiring. Later author work does not supply independent acceptance. BUG-1808 comment 01a11c3e-ab3f-7542-9b8c-e37baa8de847 approves only inactive infrastructure 6a1733a134b2e63f3adfd8e24606965a5d702f91, with all eight production gates still open. TASK-1607 occupancy/checkpoint is not the actual common launch/history integration. No transport checkpoint alone can supply CommittedDispatch, production grant/manifest/assignment joins or the required strict-read vendor adapter.

    Incorporated binding precedence: callback v5 owner approval 01a119af-a347-7961-b01d-66603478a59b; launch owner/consumer approvals 01a119b5-ea32-7ed0-b5e9-11858700f78b and 01a119b5-f471-7621-aaa3-5a649fa5c9a2; pane/containment owner/consumer approvals 01a119d7-0711-7613-9c2a-c0643b331549 and 01a119d7-1315-7171-bdfd-f2901ac9b751. Read their actual reports, not only the author summary. A–E, C7 F1/F2/F3, PANE-1, CONT-1/2/3, six pane conditions and explicit supersessions remain binding. Strongest applicable policy wins. No earlier finding is erased by this review or inactive checkpoint acceptance.

    Keep P4 after actual waiting-child READY as the final current-authority/roster/member/assignment/occupancy sample. Before C, a supported winning revoke/expiry/transfer/root substitution refuses with current-locked exact restoration and peer preservation. After durable immutable C, original live bound immediate dispatch consumes once under the signed historical rule; do not add a fresh leaf authority lookup that contradicts it. New/delayed/recovery attempts require fresh authority; lost ACK remains possible execution and never a retry entitlement. One issuance/publication/receipt; Git-only PreparedGitStep never becomes vendor CommittedDispatch. Home/repo/seat/store order, no callback/network/wait under seat, no ordinary child CLI bootstrap/store lookup and no inherited Rust lock remain. Pin execution objects through launch rather than checking a pathname once and reopening later. Unsupported isolation/runtime/identity must fail before grant/manifest/status/occupancy publication.

    Required proposed evidence: retain the six sketch witness groups through the eventual real common entrypoint. Include a valid delegating parent rooted at A with child in empty external scratch; unauthorized/wrong-project/roster/delegation negatives; actual successful supported vendor runtime/credential profile; sentinel withheld context attempts via absolute/relative/symlink/FD/proc/home/config/endpoint routes; actual argv/env/FD/mount/config inventory; two differently rooted probes and ordinary launch concurrently without changing parent's cwd; pre-P4 authority/cwd substitution and post-C single-consumption controls; actual-adopter/creating-thread/cancellation/lost-ACK cases; truthful output/log/unknown-score handling. Use isolated repositories, fake HOME, compiled fake leaf and owned processes; real supported-runtime qualification is additional required evidence, not a blanket refusal or helper-only mock pass. No live north-star rerun is authorized. Tests are PROPOSED, NONE RUN.

    Disposition: same-spec amendment resolving F1333-1 with the common owner, then fresh different advisor review of exact revised bytes. The architecture direction is accepted but the missing isolated execution/credential contract is not signed by this comment. Even a subsequent design approval will remain implementation-blocked until independently accepted common transport/publisher/occupancy/adapter prerequisites exist. No parallel implementation, source/status/queue/grant/launch/merge action. Preserve TASK-1593/TASK-1591/BUG-1811/BUG-1812 reservations and all prior history. Final authority-sensitive merge remains Joe/operator-owned.
