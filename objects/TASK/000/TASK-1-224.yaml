    - TASK-1607 C7 F1/F2 deadline/requester and F3 fresh holder fixes remain binding; checkpoint approval at 56f7b55b32fba77a2b8bdbdd2573d59cce0ca29f does not approve gateway/history production integration.
    - Latest BUG-1808 disposition 01a11c3e-ab3f-7542-9b8c-e37baa8de847 accepts inactive infrastructure checkpoint 6a1733a134b2e63f3adfd8e24606965a5d702f91, explicitly leaving eight production gates open. Earlier F1 owner-readable-mode and F2 retained-chain findings are preserved, not erased by checkpoint acceptance.
    - TASK-1612 canonical acceptance forbids production release, live caller wiring and an external release constructor. Latest comment 01a11c4c-b88b-78f0-bde2-8fbe2fb5e508 records REQUEST_CHANGES at 17b6ac3ecaafd158bdff1553bb43b4c5ca149780: F1 HostProfile::probe assumes PID1 instead of qualifying the actual nearer adopter. Preserve run-20261008/task1612-rework.md and .aida/handoff/task1612/CHECKPOINT_INDEPENDENT_REVIEW.md. No unreviewed dependency is supplied by that checkpoint.

