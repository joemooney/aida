    ## Races / refusal / exact future touch points

    Before shared setup, validate trusted authority/config root and distinct scratch roots; pin actual object identity, reject symlink/rename substitution, root mismatch, scratch nested under source/store or overlapping arms. Revalidate current authority/roster and assignment generation at the common P4 sample after actual waiting child READY, before immutable C. A revoke, expiry, roster loss or occupancy transfer that wins before C cancels without lifecycle residue, preserving peers. After C the original live bound immediate dispatch consumes once under the signed historical semantics; do not add current-authority revalidation that contradicts that contract. New/delayed/recovered attempts need fresh authority. Lost acknowledgement is possible execution, never permission to reissue.

    Use the signed sealed image and actual PID/start/thread/parent/FD joins, finite readiness/deadline, same-PID returned-ETXTBSY retry and owned cancellation/adopter qualification. Unknown image/runtime/host/userns/proc access or unsupported isolation refuses BEFORE grant/manifest/status/occupancy publication. No ordinary CLI bootstrap, child store lookup, network/forge wait or Rust lock crossing exec; wait/callback processing outside seat. One publication contributes grant, manifest, assignment, actual child occupancy and receipt. No source probing in the parent launch description beyond already authorized input gathering.

    Files/symbols: reconstitute.rs::{run_headless,run_store_arm,run_baseline_arm,gather_baseline_inputs,build_baseline_prompt,BASELINE_WITHHELD}; session.rs::{spawn_vendor_headless_with_seat,headless_worktree_root,resolve_headless_vendor,resolve_agent_tuning,compose_headless_command}; seat_authority.rs validation interfaces consumed by the common owner; common BUG-1808 PreparedLaunchAdapter/WaitingChild/CommittedDispatch and TASK-1607 ChildSpawn after-image are PROPOSED integration contracts, not new code to implement here. Keep reporting via read_probe_output/unknown_reason and historical launch documentation honest. The concrete adapter files belong to their owners and must be rechecked when available.

    ## Required meaningful isolated witnesses (proposed, NOT RUN)

    Use disposable repo/store, fake HOME/AIDA_HOME, compiled fake vendor, real eventual reconstitute entrypoint/common adapter, deterministic barriers and owned processes only. No real vendor/reconstitution run in the live project. An unavailable production dependency means tests pending, not mocked pass.

    1. trusted_root_empty_cwd: valid delegating parent/roster at project A plus empty arm scratch launches exactly once through common publisher; leaf records scratch cwd and sanitized tuning. Pair no grant, wrong project B, missing/corrupt roster, unauthorized Advisor child and nondelegating parent: zero vendor sentinel and unchanged grants/leases/occupancy/manifests/specs/history. Never make empty scratch itself a roster source.
    2. baseline_surface_has_no_authority_root: sentinel secret criteria/source/store/other-arm artifacts at real roots; compiled leaf attempts absolute paths, relative traversal, symlink aliases, inherited FD/proc root, HOME config and project MCP endpoint. Every route to withheld context fails; allowed baseline prompt and own output work. Arm B gets exactly its explicit store prompt; matcher gets explicit pairs; neither accidentally leaks into A. Inspect actual argv/env/FD/mount/config footprint, not just prompt text. Include required supported strict-read runtime positive; blanket refusal fails acceptance.
    3. no_process_cwd_race: run two differently rooted probes and an ordinary launch concurrently through the common plan with barriers; each observes its own root/config/cwd and parent's cwd is unchanged on success, refusal and spawn failure. Paired ordinary launcher compatibility proves no global override.
    4. authority_and_cwd_change_at_p4: replace scratch/config root or revoke/transfer/expire before C; fail without leaf execution and preserve unrelated peer state. Pair unchanged valid root; post-C original immediate dispatch remains single-use under the signed rule, while new invalid attempt refuses. Snapshot common receipt and immutable C, not just exit code.
    5. no_forged_or_duplicate_release: forged grant env, copied receipt, wrong waiting child, missing/truncated READY and lost ACK produce no extra dispatch. Controlled parent/creating-thread death before exec prevents sentinel; raced exec retains possible-execution evidence. TASK-1612 public-profile actual-adopter and supported dynamic runtime positives remain mandatory, not replaced by a declared PID1 or test-private profile.
    6. output_truth_survives_launch_failure: pre-exec refusal, zero-byte log, exit-zero/no JSON, malformed output, empty traced-test denominator and matcher failure retain unknown_reason, stderr and exact artifact/log paths; never claim vendor ran from report exit 0. Pair valid regenerated/matched output and clean exit yielding scored result in a fixture with actual traced denominator. Preserve TASK-1-216/TASK-1327 coverage.

    ## Out of scope and stop boundary

    No alternate launcher, grant widening, protected broker, new production activation, pane policy redesign, general adversarial sandbox, score/metric rewrite or live north-star rerun. No changes to TASK-1593/TASK-1591/BUG-1811/BUG-1812 external reservations. Independent design signoff, dependency acceptance, real adapter positives and later exact-head review are distinct outstanding gates. Final authority-sensitive merge remains Joe/operator-owned. Authoring this sketch clears none of them.
