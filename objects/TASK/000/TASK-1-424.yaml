description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1915, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  major (non-blocking): mandate_drive.rs PerMandate::dispatch_epoch closes an epoch when no owner appears within DISPATCH_STALE (2h) of routed_at, but routed_at is the advisor due-mail time, not a fixer dispatch. An approved spec the advisor deliberately leaves unqueued is re-routed (new approved#n item + advisor mail) every ~2h while an advisor is live; with 15 approved specs that is ~10 mails per 2h. Consider closing on owned_since_route only, or backing off the stale window per epoch.
