title: task_2712 codex bg post-exit tests fail inside the lane job runner (exit scan never clears)
description: |
  In the lane job runner (cargo test inside bubblewrap), story_2254_codex_bg_supervisor_tests::task_2712_bg_lane_commits_pending_work_after_clean_exit and task_2712_bg_lane_failed_exit_commits_salvage_with_refs fail with "the post-exit step ran once: left 0". agent_codex_background::post_exit_seat_commit returns before the step because exit_clear is false: the process-group exit scan cannot prove the lane over. That is likely PID-namespace visibility under bwrap. BUG-2705 did not touch that path (the hook still runs first in post_exit_commit_reported_as), but the implementer did not confirm the tests also fail on main. If they do, mark them environment-gated or fix the scan for lane runners so they can't hide regressions.

  Raised by the implementer while working BUG-2705.
