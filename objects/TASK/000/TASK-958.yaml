  content: 'IMPLEMENTATION DECISION (operator, guided session 2026-07-14): make the STORY-711 commit gate CONTEXT-AWARE and the DEFAULT (replacing Off). On a Refused lock verdict: under an active drain (AIDA_AUTO_COMPLETE set) -> HARD block; solo -> warn. Unlocked/Authorized -> silent no-op. Explicit [locking] off/warn/enforce still override. Rationale: only fires on a real lock conflict, so default-on is safe (solo gets a warn, never a hard block), and drains get BUG-637 duplicate-dispatch protection out of the box.'
  created_at: 2026-07-15T06:44:53.107332569Z
