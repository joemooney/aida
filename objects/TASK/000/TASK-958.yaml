decision_request:
  question: Should the STORY-711 commit-side authorization gate hard-block an unauthorized commit, or warn?
  choices:
  - label: Hard-refuse
    consequence: strongest duplicate-dispatch guarantee, but risks false-blocks on solo/manual commits
    resolution: hard block
  - label: Warn + override flag
    consequence: softer, leans on discipline
    resolution: warn
  - label: Context-aware
    consequence: hard-refuse only under active fan-out/drain, warn otherwise
    resolution: context-gated
  recommended: 2
  rationale: Duplicate-dispatch harm only arises during concurrent fan-out; a hard block on solo manual commits would be a daily papercut.
