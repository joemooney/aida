title: Push the finish-state rubric markers into batch/cluster/simple-mode templates too
description: |
  TASK-359 added the State preamble, `← recommended` rationale marker, and `⊕ Route to the advisor` row to the **orchestrator-mode** templates in aida-pickup.md Step 6 and aida-pr.md — the surfaces named in the original case study (STORY-306 / BUG-245).

  The other templates in aida-pickup.md (batch / cluster-drained / cluster-partial / simple-mode-with-more-items / simple-mode-empty) still carry their original shape: `▶` glyph alone, no `← recommended` rationale spelled out, no `⊕` row, no State preamble. The rubric prose above them ("apply the rubric to every template below") encodes the author intent generically, but a reader skimming a single template sees the older shape.

  Why it shipped that way: the orchestrator-mode templates were the case study, and pushing the explicit markers into five additional templates would have doubled the diff and risked drift while the rubric was still settling. The acceptance criteria for TASK-359 are satisfied — the structure lives in the master skill template per criterion #9, and the worked example is in place.

  The follow-up: once the rubric proves out in the orchestrator-mode templates (~couple of drains), copy the State preamble + recommended-rationale + `⊕` row pattern into the other five aida-pickup templates so each template stands on its own without leaning on the upstream prose.

  Raised by the implementer while working TASK-359.
