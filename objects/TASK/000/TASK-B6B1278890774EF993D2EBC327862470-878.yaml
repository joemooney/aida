  content: 'ADVISOR SIGNOFF on docs/plans/2026-11-06-task-3219-claude-wrapper-launches.md (PR #3514, retitled docs(plans) with Refs). APPROVED: (a) private-PTY interactive transport with a host relay, resize/signal forwarding and terminal restore, no host /dev/tty and no inherited descriptors; (b) an AIDA-owned detached supervisor for opted-in background launches, running a foreground Claude inside the wrapper. Attach/log contract for this task: aida-level logs and ''aida agent attach''-style access only; ''claude attach'' under the opt-in refuses with an explicit hint. Native --bg is unchanged. (c) Narrow resume: import only the validated, bounded transcript for an explicit ID, with identity-checked host publication on exit; refuse continue and fork. AMENDMENT (binding), four Refs slices in this order, each its own PR with one targeted regression and the required-live count: S1 coordinator (closest to headless), S2 interactive PTY, S3 background supervisor, S4 resume. CLAUDE_WRAPPER_UNWIRED stays as a per-surface refusal for unwired surfaces and is removed in S4, which carries the completing (TASK-3219) trailer. Implement S1 now.'
