  content: 'S1 coordinator implementation is ready in the native worktree, uncommitted. Routes opted-in Claude headless coordinators through PreparedLaunch, accepted receipt, explicit worker-grant binding and release; retains per-surface refusals for S2-S4 and leaves native argv unchanged. Host-only routing intent prevents a policy-removal downgrade. Added real-spawn quiet/stream/preflight-failure regression, composition/native regression, required-live CI count, and audited the extra Claude-only receipt call in the Codex spawn inventory. Required-live coordinator count: 1/1 successful. Final formatting passes; 38 fast gates passed. The final-source broader run passed 73 tests; five existing process fixtures need the matching CLI, which is building before their rerun. Recorded Refs-only native publication declaration: [AI:codex] feat(containment): wrap Claude coordinator launches (Refs TASK-3219). No completion or publication from this seat.'
