    REVIEW FINDINGS TO ADDRESS (PR #3547):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 626b32c12994
    Recorded: 2026-11-07T02:25:49.143281191+00:00
    Findings:
    1. BLOCKING: CI (lib-0) job 128266185539 and CI (lib-1) job 128266185366 'Run tests' failed at head 626b32c (run 42327533849). lib-1 also failed at every earlier head (f98994a run 42324819196, 4a7ec94 run 42321751477, 491349f run 42318803485). Main CI at merge base 4f3096c (run 42325671855) is fully green, so the failures are presumed PR-caused. The 'host artifact / parallel flake' note in the spec audit (comment 2026-11-07 02:06) was observed on dell1, not CI. The reviewer sandbox cannot download job logs (blob host denied). Name the failing tests from the CI log, then fix them, or show a flake with a green re-run at the same head.
    2. minor: aida-cli-lib/src/launch/contained_pty.rs PrivatePty::wait (around line 150) returns on child.try_wait() Some without a final drain of the master, and reads at most 16x8 KiB per iteration. Output the worker writes just before it exits can be dropped, including Claude's exit sequences (leave alt-screen, show cursor, disable bracketed paste). The host terminal can then stay in those modes even though termios is restored. Drain the master until EIO/EOF after the exit is observed.
    3. minor (test gap, AC1 'same grants'): task_3219_live_claude_interactive_private_pty only runs plan.role=None (empty AIDA_SESSION_GRANT, so bind_contained_launch_worker returns early). Production agent-new resolves a role and mints a grant through issue_launch_child_with_delegation (agent_launch.rs run_agent_generation). Add a live case that asserts the grant is bound to the attested worker PID before release, and revoked when the launch is refused before release.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
