  author: joe
  content: |-
    Implemented the four remaining independent detector kinds in pipeline_stall_signals.rs: under-cap uses configured implementer capacity plus queued implementer work and the continuous observation threshold; no-merge-90m uses actual GitHub mergedAt with bounded-history completeness checks; stale-advisor-mail passively inspects verified advisor subjects and excludes detector requests; empty-rework-exit consumes existing unchanged-head retry receipts and rechecks PR blockers. Added evidence identities to per-kind delivery episodes; age/event kinds retain accepted delivery across observation gaps. Existing nudge/request/operator fallback and side-effect-free previews remain in use. Updated the CLI guide and added six regression tests.
    Validation so far: all six new tests passed; the detector run had 23 passing tests and one existing digest wording assertion failure, now corrected. Broader supervise_cmd rerun and make check-ci-fast are still running; no-default-features CLI check, cargo fmt --all -- --check and git diff --check passed. No passing final test result claimed yet.
    Publication is blocked by this native Codex seat's read-only Git metadata. aida ship TASK-3075 --no-merge --dry-run explicitly directs host-side exit commit/publication; edits remain uncommitted for that handoff. No review verdict or pr ship action performed.
