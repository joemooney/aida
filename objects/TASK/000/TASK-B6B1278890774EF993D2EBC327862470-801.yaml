  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: Four new detector kinds are implemented and tested, but age/event alarms lose their accepted-delivery state after a single unknown or false tick, so the same merge, mail or head is mailed again. This contradicts the documented retain-across-gaps policy and the spec''s ''own suppression'' requirement.. No triage reason was given.'
