title: Make aida agent list canonical; keep ls as an alias
description: |
  `aida agent ls` is the only subcommand spelled `ls`. Everywhere else `list` is canonical and `ls` is the alias (`aida list` / `aida ls`, TASK-1463), and STORY-HOME-096's acceptance already says `aida agent list`.

  Acceptance:
  1. `aida agent list` is the canonical subcommand (clap variant renamed); `ls` stays as a visible alias, and `status` stays as an alias with its current behaviour.
  2. Help text, docs (docs/cli/, docs/agents/), templates/skills and hook messages that tell users to run `aida agent ls` say `aida agent list` (edit template masters, then `make sync-templates`).
  3. Existing scripts calling `aida agent ls` keep working unchanged (test).
  4. `aida agent list` does not collide with `list-roles`.
