title: 'Normalize parent/child relationship edges: rel add --type parent writes inverted+duplicated Parent edge with no reciprocal'
description: |-
  Follow-up from BUG-448 (which fixed the --tree VIEW by unioning Child+Parent outgoing). The underlying data model is inconsistent:

  1. 'aida add --parent EPIC' writes a Child edge on the EPIC (epic--Child-->child), nothing on the child.
  2. 'aida rel add EPIC CHILD --type parent' writes a Parent edge on the EPIC (epic--Parent-->child), DUPLICATED on repeat, nothing on the child.
  3. RelationshipType doc comments contradict observed walk behaviour: Child = 'this is child of target' / Parent = 'this is parent of target', yet --tree walks Child-OUTGOING from an epic and correctly gets CHILDREN — so the stored direction is inverted vs the doc.
  4. rel add does not dedup (EPIC-37 had the same Parent target twice).
  5. No reciprocal edge is written on the child, so the child's own 'show' doesn't reflect the parent unless separately linked.

  Normalize to ONE canonical representation: e.g. rel add --type parent FROM TO should write FROM--Child-->TO (or BUG-448-style both directions) consistently with 'aida add --parent', dedup edges, and align the doc comments with stored semantics. Then --tree could walk a single edge type and the union in BUG-448 becomes unnecessary. Architecture-adjacent (relationship storage) — master sign-off before implementation. trace:BUG-448
