title: aida add validation failure leaves phantom ID in dispenser sequence — release allocated ID on failure
description: |
  Caught 2026-05-10 — `aida add --parent <Completed-EPIC>` correctly refused per BUG-64's fix, but the dispenser had already allocated the spec ID (BUG-69 in this case). When I retried with `--force-parent`, I got BUG-70. BUG-69 now permanently doesn't exist; the sequence has a gap.

  Sibling issue to BUG-68 (phantom activity log entries). Both stem from: state mutations happen BEFORE the final commit check, so when the check fails, the partial state is orphaned.

  ## Today's behavior

  `aida add` flow approximately:
  1. Parse args, resolve parent
  2. Dispenser allocates next ID (counter += 1)
  3. Validate (parent terminal-status check, etc.)
  4. If validate fails → return error; counter stays advanced; ID was never written
  5. Activity log recorded the attempted spec_id (BUG-68 covers this)

  ## Desired behavior

  Either:

  **(a) Allocate-late**: defer dispenser allocation until AFTER validation passes. Only commit the counter increment when the req file actually gets written.

  **(b) Release-on-failure**: keep allocation order, but on validation failure release the ID back to the dispenser (decrement counter, or push onto a "released IDs" pool the next allocate can drain first).

  (a) is cleaner. (b) is more flexible (handles cases where allocation succeeds but the write itself fails later).

  ## Why low priority

  Phantom IDs in the sequence are cosmetic — `aida show BUG-69` errors with "not found," nothing actively breaks. But:
  - `aida history` and lists show non-monotonic sequences which can confuse newcomers
  - "Why is BUG-69 missing?" becomes a question
  - Composes with BUG-68 (phantom activity entries) — same fix shape would resolve both if done transactionally

  ## Acceptance

  - [ ] Failed `aida add` (validation) doesn't bump dispenser counter
  - [ ] No phantom IDs in the spec sequence
  - [ ] Composes with BUG-68's fix — both phantom-effects gone when one root cause is fixed
  - [ ] Test: try `aida add --parent <Completed>` 5 times; counter advances by 0
  - [ ] Test: try `aida add` with invalid type; same — no counter advance
