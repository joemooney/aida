title: 'STORY-2821: launch-prompt staleness note is omitted when the pre-flight itself fails or the head is level'
description: |
  STORY-2821 says the reviewer prompt always states how far behind the base the reviewed head is. The note is appended in the `aida queue work PR-N --role reviewer` pre-flight (aida-cli-lib/src/queue_cmd/work.rs) from the pre-flight outcome, so: (a) a head level with its base gets no note (nothing to state), and (b) when the pre-flight fails open on a forge/fetch error the launch proceeds with no note, since the distance is unknown. The `aida review prompt --pr` Staleness section (BUG-1434) is unchanged and still covers the unknown case there. Also: `aida review` / `aida human review` already never refused; the setting only changes the default answer of their inline rebase offer.

  Raised by the implementer while working STORY-2821.
