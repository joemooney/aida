title: 'aida queue move <id> --to-top: explicit operator control over queue head priority'
description: |-
  User direction 2026-05-22 evening: operator wants explicit control to pin a spec to the queue head without resorting to remove + re-add. Composes with TASK-490 (display-side In Progress visibility) by giving the operator a deliberate path to influence pickup order when needed.

  ## Background

  After TASK-490 surfaces In Progress items prominently in `aida status`, the queue itself remains FIFO/pickup-ordered. Sometimes the operator wants to PROMOTE a specific spec to the head — e.g., a high-urgency bug fix should be the next pickup, even though older items are queued ahead.

  Current options today:
  - `aida queue remove TASK-X` then `aida queue add TASK-X --for implementer` re-adds at TAIL (wrong end)
  - No direct "move to top" operation

  ## Proposed shape

  ```
  aida queue move TASK-X --to-top         # promote to position 1
  aida queue move TASK-X --to-position 3  # explicit position
  aida queue move TASK-X --before TASK-Y  # insert before a known spec
  aida queue move TASK-X --after TASK-Y   # insert after a known spec
  ```

  The `--to-top` form is the most common case (urgent-promotion). The other forms are nice-to-have refinements; could file separately if scope creeps.

  ## Why operator-control and NOT auto-reorder

  Per the design rationale from tonight's discussion (when TASK-490 was filed): the queue means "pickup priority" and the status means "work in flight." Auto-reorder on status change conflates two signals and breaks `aida queue next`/`aida queue work` pickup logic. Explicit operator control via `queue move --to-top` preserves the operator's intent visibly without surprising mutations.

  ## Acceptance

  - [ ] `aida queue move TASK-X --to-top` promotes TASK-X to queue position 1 (for the user's queue and the routed role)
  - [ ] If TASK-X is not in the queue: error 'spec X is not in queue; add it first via aida queue add'
  - [ ] If TASK-X is already at position 1: no-op with friendly message 'TASK-X is already at queue head'
  - [ ] Existing positions shift accordingly (TASK-X's old position 5 → 1; positions 1-4 each move down by 1)
  - [ ] Regression test: add 5 items, move position-5 to top, assert queue order = [5, 1, 2, 3, 4]
  - [ ] Help text + examples documented; trace comment

  ## Composes with

  - TASK-490 (display-side In Progress visibility — this is the deliberate operator-control complement)
  - aida queue add/remove (existing queue management surface)
  - The session-end auto-queue-reviewer pattern (which already inserts items at specific positions — this exposes that capability to the operator)

  ## Priority rationale

  LOW. Real but rare friction (most operators add items in the order they want them picked up; explicit re-prioritization is occasional). Worth shipping when the queue-management UX gets a coherent pass.

  ## Out of scope

  - Auto-reorder based on priority field or status changes (explicitly NOT this; see TASK-490 rationale)
  - Cross-user / cross-role queue manipulation (queue identity stays per-user per-role)
