description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2438, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking: bug2438_old_head_refusal_without_current_head_verdict_refuses and bug2438_malformed_reviewed_sha_refusal_is_not_superseded (bug2406_train_tests.rs) only assert merge_verified is_err. Because the ledger is recorded after the train opens, the refresh also fails on the evidence/mapped mismatch ('train proof or original source review evidence changed') or on 'no original authorized approval', so both tests still pass if the supersession guard is removed or malformed SHAs are superseded. Assert that the error contains 'train source has a refusing review' so they actually prove the refusal path.

