    Findings:
    1. BLOCKING: bug2438_old_head_refusal_without_current_head_verdict_refuses (aida-cli-lib/src/tests/bug2406_train_tests.rs:779) fails at 2e8fa0b. It goes through the shared bug2438_refuses helper, which now asserts the error contains 'train source has a refusing review' (line 769). TASK-2831 comment 3 says the implementer ran cargo test bug2438_ twice and this test failed both times: approval carry-over / enforce_corpus_gate_before_merge refuses before collect() reaches the supersession loop at pr_train_verified.rs:381-384, so that message cannot occur in this case. The PR ships a known-failing reproducer and will turn CI lib shards red.
    2. Fix direction (pick one, record it on TASK-2831): (a) leave the malformed-SHA assertion as is, and have the old-head test assert the refusal it actually hits (the corpus-gate or carry-over message) through a parameterized expected-message argument on bug2438_refuses; or (b) unit-test the train effective-verdict / is_superseded policy (pr_train_verified.rs:348-384) through a narrow seam, so removing the supersession guard is proven to fail a test; keep the integration test for the earlier corpus refusal. Do not reorder the production gates without advisor signoff.
    3. Doc comment on bug2438_refuses (lines 754-756) now says every caller refuses 'specifically for the refusing review, rather than changed evidence'. That is false for the old-head caller. Make it describe each case's actual refusal once the fix lands.
    4. PR title/body ('address CI failures and review findings') does not say that the implementer knew a test was left failing (spec status needs-attention). Say so in the PR body, or do not ship until it passes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
