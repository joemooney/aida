title: Mandate exclusion readers still read the working tree / --all, not a literally pinned commit
description: |
  BUG-056 acceptance (1) asks that the exclusion read use a pinned store commit. The fix pins the *before* snapshot and proves, via a scoped delta check (store_snapshot_stable + EvidenceScope in aida-cli-lib/src/gate/mandate_traces.rs), that nothing touching the judged specs' object paths or spec_id/agreed_id lines changed between the pin and the after snapshot — so the evidence equals the pinned read for those specs. The readers themselves (load_store_for_lookup working tree; StoreHistoryBatch / store_history_alias_map `git log --all`) were not rewritten to read at the pinned revs. A follow-up could pass the pinned tips via `--stdin` instead of `--all` and read current records from `<pinned HEAD>:objects/...`, removing the reliance on the delta proof.

  Raised by the implementer while working BUG-B6B1278890774EF993D2EBC327862470-056.
