    # PR-4112 full-sweep acceptance assessment

    Reviewed SHA: 2e8af99bc490d4724ca9ef7c64d23bce6ea763c7.
    Inspected the entire 60-file GitHub comparison, including inherited changes, tests, inventories, generated types and help, workflow, and the completion audit. The six-file TASK-3123 delta is the only delta against local origin/main; the other changes are nevertheless included in this assessment. The generated checklist named TASK-3123, BUG-2597, TASK-3105, BUG-2600 and BUG-2601 but incorrectly reported all missing. Direct `aida show --full --comments` resolved them. Additional inherited implementation specs are covered below. Old trace IDs in unchanged context do not add new completion claims.

    Evidence labels below distinguish inspected fixture source from execution. No local test or build was run, per operator policy. Cargo commands identify the relevant existing fixtures, not reviewer executions. Exact-head CI run 43782748277 passed FAST gates, FAST compile and Build (ubuntu-latest); FULL execution shards were skipped. merge-hold-gate is pending recorded clearance, not an independent test dependency.

    ## TASK-3123 — PASS

    There is no formal Acceptance section. These lines enumerate its description and binding advisor rulings, including the final doc-only rework ruling.

    - Sandboxed headless lanes do not run the incompatible aggregate directly: verified by all five template masters explicitly forbidding direct `make check-ci-fast`.
    - Explain sockets, Cargo and the aggregate tool-call limit: verified by identical rationale in all five masters and docs/internal/testing/ci-test-shards.md.
    - Native host-published seats defer after exit, leave edits uncommitted and do not claim a pass: verified by all five native-seat paragraphs and lane_fast_gate::native's host publication boundary.
    - Contained self-publishing lanes retain a pre-publication gate: verified by all five contained-lane paragraphs and the revised guide requiring `aida lane job run -- make check-ci-fast`, final-tree exit 0, rerun after edits, and refusal of publication on runner unavailability/refusal/timeout/failure.
    - Poll exit 75 in bounded calls: verified by all five masters, lane_cmd::wait_in and lane_job::wait_for.
    - Route targeted Cargo and CLI-golden work and retain separate test evidence: verified by all five override paragraphs, lane_job::validate's profile policy and AIDA_UPDATE_SNAPSHOTS allowlist; fast-gate execution explicitly does not count as targeted-test execution; unavailable/refused tests report untested=true.
    - Preserve FASTTRACK/LIGHT/STRICT policy and host/CI gates: verified by explicit override applicability, remaining ordinary push gates, and the guide's no-skip/no-reclassification statement.
    - Reuse existing host-side runner support without new runtime behavior: verified by lane_job::validate accepting the exact Make argv and run_one_authorized selecting fast_gate_namespaces. TASK-3123 changes only templates and documentation.
    - Correct only the guide in final rework: verified by commit 2e8af99bc490 changing only docs/internal/testing/ci-test-shards.md and satisfying every clause of the 23:07Z advisor ruling. The earlier lost-gate documentation finding is resolved.

    ## BUG-2597 / BUG-b6b1278890774ef993d2ebc327862470-361 — PASS

    The four supplied untraced criteria were reused verbatim as the coverage checklist; inspected diff fixtures supply coverage as follows.

    - aca41f72 — Every Completed transition stamps implementation_info.completed_at, one test per edit/review-record/close/auto-bump path: verified by models::set_status_from_str and provenance::stamp_write; fixture source for `cargo test -p aida-cli-lib bug2597_`, `cargo test -p aida-cli-lib auto_bump_picks_up_subject_refs_on_default_branch` and `cargo test -p aida-cli-lib auto_bump_flips_review_story_via_pr_number_match`. The review-record fixture asserts byte-identical terminal dates: review record itself does not transition status, as confirmed by review_commands.rs and the accepted advisor rework. Close drives advance_dispatch_close and reloads canonical objects, including a second close preserving the stamp.
    - accea352 — Projection uses latest Completed history if unstamped; full rebuild has no unexplained NULLs: verified by terminal_timestamps::status_date using max timestamp, cache::insert_one using completed_at, schema 17, and fixture source for `cargo test -p aida-core bug2597_cache_rebuild_and_upsert_project_terminal_history`. The disposable full-rebuild audit in docs/internal/testing/bug-2597-completion-dates.md lists all 966 unique unresolved records: 938 missing history, 28 derived epic rollups without persisted completion events; 42 dates are recovered. The listed counts and reasons agree.
    - aca6d651 — Rejected/Superseded closed_at comes from terminal history: verified by terminal_timestamps::closed_at, the new schema/projection, and fixture source for `cargo test -p aida-core bug2597_rejected_and_superseded_dates_use_matching_history` and the cache rebuild/upsert fixture above. Records without a matching event remain unknown, as documented in the audit.
    - acfbe302 — Idempotent backfill writes derived completed_at into canonical objects: verified by db backfill-completed-at using update_atomically, read-only dry-run routing, and fixture source for `cargo test -p aida-core bug2597_backfill_git_objects_is_idempotent` plus YAML/dry-run/idempotence fixtures in terminal_timestamps.rs.
    - Run the one-time live rewrite from this review lane: not-applicable-because the binding advisor instruction explicitly reserves live execution to the advisor after merge; the implementation is tested on fixture stores and documents the dry-run count.

    ## TASK-3105 — FAIL

    No formal Acceptance section; these criteria enumerate the description and approved narrow cancelled-run recovery.

    - Retry the approved head's sole completed cancelled full run automatically: unverified — fails for the normal held-PR rollup containing pending merge-hold-gate; F1 below.
    - Verify completed/cancelled run evidence rather than retry success, failure or live runs: verified by request_full_ci_with's gh run view and fixture source for `cargo test -p aida-cli-lib only_a_verified_completed_cancelled_full_run_is_requested_again`.
    - Preserve active CI and refuse ambiguous full-run selection: verified by retry_candidate and fixture source for `cargo test -p aida-cli-lib ambiguous_or_running_full_rollups_cannot_trigger_a_retry_probe`; its indiscriminate pending-status rule causes F1.
    - Add or reapply ci:full as appropriate, including train recovery of red full-tier evidence: verified by label edits and fixture source for the cancelled-run fixture above and `cargo test -p aida-cli-lib live_gate_preserves_running_full_ci_and_checks_red_runs_for_cancelled_retries`.

    ## BUG-2600 — PASS

    - One phase-one admission per fresh auto-complete member: verified by the consumed Phase1Admission passed from ensure_queued_for_implementer through run_auto_complete to preparation, with member/root validation and direct-entry fallback.
    - Test asserts exactly one override event, including --over-wip and canonical-branch admission: verified by fixture source for `cargo test -p aida-cli-lib bug_2600_phase1_admission_records_one_override_per_member`, covering both modes.

    ## BUG-2601 — PASS

    - Remove the 64-commit cap while keeping bounded ancestry/fallback: verified by is_recent_cache_ancestor's time-bounded merge-base with false on uncertainty and both cache callers' fallback. Fixture source: `cargo test -p aida-core bug2601_cache_ancestry_accepts_more_than_64_commits` and `cargo test -p aida-core bug2601_hour_idle_cache_refreshes_without_rebuild` (143 commits, one incremental refresh, no rebuild).
    - Measure rebuild behavior: verified by that fixture's incremental/full_rebuild counters and the implementer evidence on BUG-2601 explicitly identifying this as fixture measurement, not a production rate sample.
    - Drive the actual write-path timeout and preserve comment persistence: verified by fixture source for `cargo test -p aida-core bug2601_comment_write_survives_ancestry_timeout`, using the thread-local 2100ms spawn-delay seam against the production two-second deadline and asserting one fallback rebuild, persisted comment and current cache SHA.
    - Exercise a test that would fail on the pre-fix timeout-propagating implementation: verified by source reasoning at both former `?` sites and the injected delay. The timeout-path fixture exists.
    - Independently execute the pre-fix comparison: unverified (local execution forbidden); the judgment does not depend on awaiting this extra execution.

    ## Inherited BUG-2596 — PASS

    - Identify and record the escaping publish route: verified by canonical spec comments identifying host auto-publication of uncommitted native Codex seat work, corroborated by TASK-3799 handoff receipts; the empty historical log is disclosed.
    - After one failed repair, refuse push/PR on every native publication route and retain NeedsAttention plus gate output: verified by native/native_rounds, native_error, record_failed_gate, publication_ready, check_import and explicit ship_from_seat refusal. Fixture source: `cargo test -p aida-cli-lib bug_2596`.
    - Regression drives the failing route and proves absent push/PR: verified by bug_2596_red_native_gate_never_pushes_or_opens_pr, checking the real origin ref and recording forge for both automatic and explicit publication; the persistent-failure fixture also checks one repair and retained diagnostics.

    ## Inherited BUG-2599 — PASS under the subsequent BUG-2601 refinement

    - Unreachable or timed-out recorded ancestry cannot hard-error a write: verified by both cache callers and fixture source for `cargo test -p aida-core bug2601_comment_write_survives_ancestry_timeout`.
