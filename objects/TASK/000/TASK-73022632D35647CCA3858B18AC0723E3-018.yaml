title: make check-ci-fast cannot pass inside a headless lane sandbox (containment conformance gate needs a socket; runs cargo)
description: |
  In a contained headless implementer lane, `make check-ci-fast` stops at "Containment conformance evidence tests": 7 errors, PermissionError: [Errno 1] Operation not permitted from socket.socket() in socketserver. The runner stops at the first failing gate, so the later fast gates never run; the tier also runs cargo-backed guards and takes longer than the 60 s tool-call cap. The pickup skill tells every lane to run this gate before push, which a lane cannot do. Either route it through `aida lane job run` or skip sandbox-incompatible gates with a reason.

  Raised by the implementer while working STORY-2828.
