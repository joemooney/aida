  content: 'ADVISOR TRIAGE 2026-11-15 14:53 MST of CR on PR-4112 at 4a87bd9: BLOCKING (correctness, a lost gate). The template/launcher wording lets contained self-publishing lanes skip the pre-publication fast gate. Rework: keep the documented limitation (check-ci-fast cannot run inside the headless sandbox), but route the gate instead of dropping it. A self-publishing contained lane must still pass the lane fast-gate job (host-side runner, as lane_fast_gate.rs does) before publication, and the templates must say exactly that. No new behaviour beyond what lane_fast_gate already provides; if it does not cover contained lanes, say so in the PR and file the gap. Integration track, codex lane, merge origin/integration (not main).'
