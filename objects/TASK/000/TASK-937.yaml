title: Batch-approve from the needs-approval group
description: |-
  Batch-approve from the needs-approval group. GESTURE — EPIC-54 absorbs multi-select; EPIC-53 provides the set + the batch action.

  ## Acceptance
  - A PURE approvable-set function (drafts + intake proposals) + a batch-approve action (approve+queue N specs in one call), both unit-tested.
  - EPIC-53 ships the set + action only. The multi-select GESTURE is NOT built here (EPIC-54 provides it).

  ## Seam
  EPIC-53 = approvable-set + batch action. EPIC-54 = multi-select gesture. Do NOT build multi-select UI in EPIC-53. See docs/plans/2026-06-26-epic-53-cockpit-seam.md for the EPIC-53(content) vs EPIC-54(shell) boundary.
