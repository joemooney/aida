description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2212, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): PidNamespaceProbe::is_isolated's pid1_comm allowlist (agent_registry.rs, INITS) leaves out common host inits such as runit, openrc-init, s6-svscan and busybox init. On those hosts a normal shell is classed isolated: unstamped legacy rows go unobserved (gc skips them) and agent ls tells the user to run outside a sandbox they are not in
