title: Review-watch readiness still calls an overlapping stale head not ready under refuse-on-conflict / warn
description: |
  aida-cli-lib/src/review_watch_ready.rs evaluate() reports "N commit(s) behind <base> with overlapping paths; merge <base> into the branch" as NotReady for any stale overlapping head. STORY-2821 lets such a head be reviewed under `[review] stale_base = "refuse-on-conflict"` or "warn", but did not touch readiness (out of the story's scope). On this project the head is now reviewed and then still reported not ready until its branch is updated, which restarts CI and review on the new head — part of the cost the story set out to remove. Decide whether readiness should follow the same setting (not ready only when conflicting).

  Raised by the implementer while working STORY-2821.
  Branch: story-b6b1278890774ef993d2ebc327862470-744  ·  Commit: 0f1aae4558  (PR link added on merge)

  Acceptance (advisor 13:58, product seat batch): 1. Under [review] stale_base = "refuse-on-conflict" or "warn", review-watch readiness (aida-cli-lib/src/review_watch_ready.rs evaluate()) reports NotReady for a stale head with overlapping paths ONLY when a merge-tree of the head and its base conflicts; a clean merge-tree is Ready. 2. Under the default setting, behaviour is unchanged. 3. Tests cover all three cases. Main track.
