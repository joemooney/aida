description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-B6B1278890774EF993D2EBC327862470-008, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): aida-core/src/db/cached_git_backend.rs:234 — the read fallback returns inner.get_requirement_by_spec_id without the collision check, so a colliding id silently returns one object during contention. It applies to every for_read caller (comment_cmd.rs:540, rel_cards.rs:503), not just fast-fail show. A not-found or agreed-id lookup still scans every object (git_backend.rs:2499), so a typo'd id under contention is not bounded.

