- id: 01a181f3-bbc6-72a1-84e3-33736d3e63e6
  author: joe
  content: |-
    ADVISOR RULING 2026-10-28 03:05 MST: option A approved, closed out in this PR.
    1. First spell out the six glob imports (approval, ci_freshness, role_authority, review_author use crate::*; merge_hold_core, rework_hold_release glob crate::merge_hold::*), with no behaviour change, and add a ratchet that refuses any glob import of crate::/crate::<module>::* in gate/.
    2. Decision kernels get the full facade rule now: seat_authority, review_verdict, role_authority, review_author, solo_review, mandate, mandate_gates, mandate_drive, review_marker, fleet_lanes, operator_hold, branch_policy. Make the small moves onto the floor that the sketch lists (current_user_id, aida_home_dir, authority_*_is_terminal probes, verdict_tip_relation, current_branch_at, is_hex_sha, END_OF_OPTIONS, process_probe via aida_core). Callers import from gate/ directly, never via re-export.
    3. Orchestrating modules (approval, mandate_ship, merge_hold_core, rework_hold_release, ship, pr_ship_batch, ci_freshness, review_authority) get a per-module FROZEN outside-path inventory in a gate/ file, which is shrink-only, fails on stale entries and on any new path, and needs a human merge to grow. Use one module-level reason per orchestrator, not per-path boilerplate.
    4. Negative tests: a new outside path in a kernel fails, a new path in an orchestrator fails, a glob import fails, and a re-export fails.
    Moving orchestration back out of gate/ is a rearchitecture question for the regroup and is NOT a follow-up spec here. The ~40 bound is waived for the frozen orchestrator inventory only. LIGHT gate (check-ci-compile once if >10 files).
