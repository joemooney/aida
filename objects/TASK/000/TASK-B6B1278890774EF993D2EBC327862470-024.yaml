- id: 01a181e6-e82f-76d0-8437-29aab9b6417e
  author: joe
  content: |-
    SKETCH (BLOCKED: leaf list far exceeds the ~40-entry bound)

    Measured on origin/main a92022e with the #3004 `outside_paths` scanner over every non-dispatch_* gate module:
    - 139 distinct `crate::` paths outside gate/ (glob noise and `aida_core` removed), across 61 definer modules. That is a lower bound: approval.rs, ci_freshness.rs, role_authority.rs and review_author.rs `use crate::*`, and merge_hold_core.rs and rework_hold_release.rs glob `crate::merge_hold::*`, so bare names there can't be resolved until the globs are spelled out.
    - Per module: approval 31, mandate_ship 27, seat_authority 20, merge_hold_core 18, ship 17, rework_hold_release 17, review_authority 13, solo_review 6, ci_freshness 6, review_verdict 5, mandate_drive 5, review_author 4, role_authority 3, pr_ship_batch 3, mandate 2, mandate_gates 2, review_marker 1, fleet_lanes 1.
    - Top definers: pr_cmd 11, review_carryover 11, events 11, forge 10 (forge_for, forge_for_kind, resolve_*_forge_kind, head_matches_pin, MergeMethod), grant_keyring 7, awaiting_you 6, seat_clone 4, pr_ship 4, merge_hold 4.
    - Several definers can't move without bringing whole subsystems or hot files into gate/: forge::forge_for* (the forge client), pr_cmd::* (ship orchestration in a hot file), review_carryover::*, awaiting_you::classify_pr_review, drain_lock and drain_state. Moving them would either protect hot files (ruled out) or change behaviour.

    Options:
    A. Tiered rule (recommended). Split gate/ into decision kernels, which get the full facade rule now (seat_authority, review_verdict, role_authority, review_author, solo_review, mandate, mandate_gates, mandate_drive, review_marker, fleet_lanes, operator_hold, branch_policy: about 45 paths, about 30 after small moves such as current_user_id, aida_home_dir, the authority_*_is_terminal probes, verdict_tip_relation, current_branch_at, is_hex_sha and END_OF_OPTIONS onto the floor, and process_probe through aida_core), and orchestrating gate modules (approval, mandate_ship, merge_hold_core, rework_hold_release, ship, pr_ship_batch, ci_freshness, review_authority). The orchestrating modules get only the glob ban plus a frozen per-module inventory, and later follow-ups move their orchestration back out of gate/ so that only decisions stay. Ships in one PR within the bound.
    B. Full rule with a shrink-only frozen inventory of all ~139 paths, each with a reason. Mechanical and checkable (growth needs a human merge), but each reason would be boilerplate and nothing moves. It exceeds the bound the brief set.
    C. Module-granular leaves (one entry per definer module, 61). Weaker than path-level, still over 40.

    All options need the six glob imports spelled out first (no behaviour change).
    Needs: an advisor ruling between A, B and C (and, for A, the kernel/orchestrator split) before implementation.
