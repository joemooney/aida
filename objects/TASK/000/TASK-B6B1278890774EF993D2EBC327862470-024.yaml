title: 'Gate facade rule for every gate/ module: protected gate modules reach outside gate/ only via a facade or FACADE_EXTERNAL_LEAVES'
description: 'Follow-up from PR-3004 review F2 (advisor ruling 2026-10-28 on TASK-b6b1278890774ef993d2ebc327862470-013). gate/seat_authority.rs, gate/review_verdict.rs and other protected gate modules call unprotected crate definers whose bodies feed authority: crate::current_user_id (seat_authority.rs:721), crate::grant_keyring::read (765), crate::process_probe::process_start_identity (856), kernel.rs crate::canonical_role_name (686,1105,1110,1187,1219), review_verdict -> crate::verdict_tip_relation/current_branch_at. Extend the TASK-013 facade + shrink-only FACADE_EXTERNAL_LEAVES ratchet from gate/dispatch_* to every module under gate/, moving small definers into gate/ (old paths re-export) or listing them as bounded leaves with reasons. Never protect whole hot files (forge.rs, lib_part3.rs). Negative tests for direct, two-hop and re-export forms. No behaviour change; refusal-string inventory unchanged.'
