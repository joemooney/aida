description: |-
  Identical reviewer findings recurred twice for STORY-2630; do not requeue a third implementer round until an advisor chooses a different implementer/seat or resolves the dispute.

  REVIEW FINDINGS TO ADDRESS (PR #3662):
  Verdict: CHANGES REQUESTED
  Reviewed commit: 19839cfc31e6
  Recorded: 2026-11-08T09:57:42.491998382+00:00
  Findings:
  1. MAJOR (CI gate, new; seat-fixable): aida-cli-lib/src/codegraph.rs:130 is 111 columns after this round lengthened the bail! message. The string fits when wrapped at the macro-argument indent, so rustfmt will rewrap it and 'cargo fmt --all -- --check' (ci.yml:853) fails. Established by source trace; the formatter was not run under the no-local-gates policy. Run cargo fmt.
  2. MAJOR (process, eighth occurrence; host/advisor action): the PR body at 19839cfc31e6 is still only the 'Published from seat' boilerplate (194 bytes). Apply the AC1-AC5 status, state that this is a Refs slice, and name who completes AC2/AC5. Ready-made text is in spec comment 37 and docs/internal/testing/story-2630-seat-handoff.md.
  3. MAJOR (AC1/AC3, unchanged; host action): nothing delivers the proxy client to lanes. AGENTS.md:477 and aida-core/templates/dispatch/code-navigation.md:1 tell lanes to run bare 'codegraph callers', while scripts/codegraph/README.md:69-72,118 says bare codegraph is not routed and upstream stays on PATH; README:135-136 confirms the shared prompt does not select the client. A deployed lane following its prompt still fails ('unable to open database file', README:5-7). Fix: put the fixed absolute host client command in the template master and sync (never derive it from the seat .codegraph), provide a host-resolved PATH entry, or have the advisor defer this explicitly.
  4. MAJOR (AC2/AC5; advisor decision): the 2026-11-08 ruling requires a COMPLETING slice in which a contained Codex seat gets a correct non-empty 'codegraph callers' result with read-only grant evidence. This PR is Refs-only, README:73-76 says the AIDA-contained posture is unsupported (no mount for client, descriptor or socket), and no live seat output exists. No later spec comment accepts the deferral. Advisor must either accept a Refs slice with AC2/AC5 moved to a named follow-up, or require contained admission and live evidence here. The publication-veto punt (handoff doc lines 7-8, spec comments 34, 37, 40) is also unresolved.
  5. MINOR (repo hygiene, new): docs/internal/testing/story-2630-seat-handoff.md commits per-round session notes, against the CLAUDE.md rule that per-change notes go in the PR body and an aida comment. Now that it is committed its content is false: 'All six changed files remain uncommitted' and 'No commit, push, PR publication...' (lines 633-635 of the round's text, final paragraph), plus a 'publication remains vetoed' claim on a published PR. Move the content to the PR body or a spec comment and delete the file.
  6. MINOR (test weakened, new): tests/test_codegraph_proxy.py:276 replaced the heartbeat freshness assertion with assertEqual(observed_at, initial_observation). test_status_and_heartbeat_stay_responsive_during_query_and_stalled_peer therefore no longer shows a heartbeat being published during a query, which README:143 claims. It can also fail spuriously: the 3s heartbeat can fire between the initial read and the polls when CI startup is slow (the start deadline allows 5s). Assert observed_at stays within the heartbeat interval plus margin, or advances across a query longer than 3s.
  7. MINOR (test evidence; host action): the only test against real CodeGraph 1.6.0 (tests/test_codegraph_proxy.py:363-370) skips when codegraph is absent, as in the implementer seat (handoff doc: 18 tests, 17 passed, 1 skipped), and CI has not run at any recent head. No recorded run exercises the snapshot path against real upstream, including whether a directory holding only .codegraph/codegraph.db is accepted. Host must run it and paste the output with the AC5 evidence.
  8. CI (gate): run 42468500142 at 19839cfc31e6 is pending with 0 jobs started, and every earlier CI run on this PR that I checked was cancelled or queued, so no head has a recorded green run for tests/test_codegraph_proxy.py or codegraph::tests. merge-hold-gate fails as the expected supervised hold (label aida:merge-hold), not a code defect. Needs a green run at the final head.
  Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
