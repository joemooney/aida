- id: 019e5aa8-724c-7e72-8fe0-cfe2ca4b077e
  author: joe
  content: |-
    Codex sketch before implementation:

    1. Add a real top-level `aida import-plan <file>` command (not just the existing skill-template workflow) with flags `--request-review`, `--queue`, `--auto-anchor`, and `--dry-run`. Keep the current skill template as the human-facing wrapper, updated to call the CLI.
    2. Represent pending review with a small sentinel under `.aida/plan-reviews/pending/<SPEC-ID>.toml` carrying `{spec_id, plan_path, requested_at, status, note?}` rather than tags. Rationale: review state is operational/local like briefs, and status can summarize without mutating the spec graph repeatedly.
    3. Add `aida plan-review approve|revise|decline <SPEC> [--note <TEXT>]`. `approve` removes/moves the pending sentinel to acked/approved and comments on the spec; `revise`/`decline` records the verdict and comments, leaving an audit trail. If the sentinel is missing, fail with a helpful message.
    4. Queue gate: before `aida queue work <SPEC>` dispatches, detect pending review for that spec. Default: refuse with clear text and suggest `aida plan-review approve <SPEC>` or `--override-plan-review`. Add `--override-plan-review` only to queue work; it bypasses the gate and logs the bypass.
    5. `aida status` gets a compact section: `Plan reviews pending (N)` with spec + plan path. Omit cleanly when empty.
    6. Import behavior with `--request-review`: move/copy plan into `docs/plans/`, run/optionally fix `aida plan verify`, write sentinel, post spec comment: `Plan landed for master review: <path>. Master verdict awaited before implementer pickup.` Without `--request-review`, preserve existing import semantics.
    7. Docs/scaffold: add `docs/aida/plan-review-workflow.md` and template it through `aida-core/templates/docs/aida/plan-review-workflow.md`; update `aida-import-plan` skill invocation docs to mention `--request-review` and the review commands.
    8. Tests: CLI parse for new commands/flags; sentinel roundtrip; import with request-review writes sentinel + comment; queue work refuses pending review and accepts override; plan-review approve removes pending marker; status renders pending count.
    9. Boundary: no web `/ultraplan` UI changes; no per-advisor routing; no auto-approval heuristics. This ships the master-review handshake as a local substrate gate first.
  created_at: 2026-05-24T15:44:09.292935214Z
  modified_at: 2026-05-24T15:44:09.292935214Z
- id: 019e5aaa-ae8b-71e1-894a-5a24b222347d
  author: joe
  content: |-
    Master verdict: APPROVE — ship as sketched. Four small refinements:

    1. **Sentinel-state policy** — recommend ONE file per spec, not pending/ → acked/ directory move. Layout: '.aida/plan-reviews/<SPEC>.toml' with 'status' field flipping pending → approved/revised/declined and an append-only 'history' array of '{verdict, at, note}'. Rationale: simpler audit trail, no orphan-acked-file accumulation, no directory dance. The pending/<SPEC>.toml flavor works too but adds a state-transition operation; one-file-with-status is cheaper to implement, test, and reason about. Pick the simpler one.

    2. **Queue gate × plan-brief interaction** — state explicitly: when 'aida queue work <SPEC>' refuses due to pending review, the TASK-95 plan-brief mechanism is NOT invoked (work doesn't start, manifest not populated). When '--override-plan-review' is used, the plan brief DOES fire (the override is the explicit operator decision to trust the unreviewed plan). Document this in the workflow doc — implementer agents WILL hit override and need to know what they're trusting.

    3. **In-flight session edge case** — if a session is already running on a spec when 'aida import-plan --request-review' lands a new plan, the in-flight session's manifest already has the OLD plan (or no plan). Don't interrupt the running session; write the sentinel anyway. The gate fires on the NEXT pickup, not in-flight. Document as a known limitation: master can comment on the spec to flag the in-flight situation, or wait for session end.

    4. **Test for --override-plan-review observability** — add a test asserting the override bypass produces a log line + spec comment ('Plan-review override used by <user> at <time>'). The override should leave a substrate trace, not be silent. Substrate-as-bouncer: if the operator overrides the gate, the bypass is recorded for later review.

    Plus the rest as sketched (good shape). Ship it.

    Implementation note for Codex: AIDA's CLI flag conventions (verified from prior runs) — '--note' for arbitrary text, kebab-case multi-word flags. Match these.

    — master advisor
  created_at: 2026-05-24T15:46:35.787609578Z
  modified_at: 2026-05-24T15:46:35.787609578Z
- id: 019e9c11-7671-7a92-a427-b842a262f679
  author: joe
  content: |-
    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: This adds a plan-review handshake (sentinel + queue-work gate + `aida plan-review approve/revise/decline` + status surface). Single-master assumption holds, but it introduces a new gate/state on the plan-archival path. Worth the surface in the bugs→stability phase?
      a) Ship full shape: --request-review flag, sentinel under `.aida/plan-reviews/pending/`, queue-work warn-with-override, `aida status` line, three plan-review verbs, docs.
      b) Ship Phase-1-only minimal slice: --request-review writes a `plan-review:pending` tag + comment + queue-work warning; skip the dedicated approve/revise/decline verbs (master just edits the tag/comment) and the status pane.
      c) Defer — solo workaround ("accept first, master sweeps docs/plans/ later") is adequate for one operator; revisit when subsystem advisors / multiple plan-reviewers exist.
      REC: c — single-operator + single-master makes the gate mostly ceremony today; the friction it solves (implementer picks up an unreviewed plan in the accept→review window) is rare with one operator and well-covered by the existing workaround.
