  ## Acceptance

  - `aida health` renders non-healthy vitals before healthy vitals, with Critical rows before Watch rows.
  - Equal-severity vitals preserve the scorer's existing stable order.
  - The polish reuses the existing `HealthReport`/`Vital` data and does not add alternate lease, queue, or findings readers.
  - `cargo build && env -u AIDA_SESSION_ROLE cargo test -p aida-cli` passes.
