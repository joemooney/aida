  content: |-
    Rejected as a DUPLICATE of BUG-1704, not as an invalid finding — the gap is real, it is just already owned.

    BUG-1704 is titled for exactly this defect (`aida agent status` calls a finished seat busy) and its own description says: "BUG-1701 shipped the *evidence* (a CPU column, AC5); this spec is the *classification* fix it deliberately did not attempt." Its AC1 requires a finished seat to stop reporting `busy` and to be distinguishable by status alone, and AC2 protects the build-blocked case. That is this finding's whole content.

    Confirmed live on the dev host today: codex#1907632 is `STAT Zs`, defunct 2d11h, and `aida agent status` still reports it `busy`. Evidence recorded on BUG-1704 instead of here.

    Triaged by the advisor seat under the operator's 2026-09-28 emergency burndown authorization.
