  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2468, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): runner_status_with (deputy_shell/mod.rs) requires a literal 'run' argv; the bash script's supported back-compat start form 'aida-deputy-shell N' (bare name, case arm [A-Za-z0-9]*) has a live runner.pid but falls to native -> 'runner: NOT running', the same false negative BUG-2468 targets. Accept argv[script+1]==name too, or report UNKNOWN when runner.pid is live and argv names aida-deputy-shell but the shape is unrecognized.

