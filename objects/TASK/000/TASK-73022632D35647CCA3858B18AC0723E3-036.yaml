description: |
  dell1 autobuild has never promoted: ff-only fails on the config.toml skip-worktree override, and tip-only CI starves

  Verified 2026-11-19 from ~/.aida/autobuild.log on dell1: every */30 tick on 2026-11-18 skipped, and no line reads "promoted". The live binary moved only by hand (e207f1f at 07:01, cfbc140 at 23:50, fd4018a at 2026-11-19 15:14 by product-14).

  Update 2026-11-19 (product-14): the CODE fixes for both causes shipped in #4327 (TASK-3812, ed269f3a8) as scripts/aida-autobuild.sh: skip-worktree override save/re-apply around the ff-only merge, plus a bounded wait for the tip's CI. The newest-green promotion rule (the real fix for cause 2) is BUG-2687. What remains here is HOST work, not lane code.

  Acceptance criteria (host/operator task; not for a code lane):
  1. dell1's cron runs the repo's scripts/aida-autobuild.sh (from the dell1 primary checkout, per docs/advanced/lane-host-checklist.md) instead of the old ~/bin/aida-autobuild.sh; the old script is moved aside, not deleted.
  2. The skip-worktree override `standalone_implementer_cap = 8` survives at least one fast-forward that changes .aida/config.toml (verify with `git ls-files -v .aida/config.toml` showing the S flag and the value intact).
  3. ~/.aida/autobuild.log on dell1 shows at least one "promoted" line, and `aida doctor` per-host binary reporting (#4327) shows dell1 live within 10 changes of origin/main.
  4. Record the deploy and the first promotion as comments here, then complete.
