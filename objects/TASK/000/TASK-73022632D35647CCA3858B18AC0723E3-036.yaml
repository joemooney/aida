    old_value: |-
      dell1 autobuild has never promoted: ff-only fails on the config.toml skip-worktree override, and tip-only CI starves

      Verified 2026-11-19 from ~/.aida/autobuild.log on dell1: every */30 tick on 2026-11-18 skipped, and no line reads "promoted". The live binary moved only by hand (e207f1f at 07:01, cfbc140 at 23:50). Native `aida dev build --if-main-green` is not running on dell1 either (no ~/.aida/dev-autopromote.log).

      Cause 1, "main cannot fast-forward" (13 ticks): the primary checkout keeps `.aida/config.toml` as skip-worktree (standalone_implementer_cap = 8). `git merge --ff-only` refuses whenever an incoming commit changes that file. On 2026-11-18 that was 2edf9a4, 64468cd, 85ec930, 4abdfe5 and cfbc140. The tick stays stuck until someone resolves it by hand.
      Fix (host script ~/bin/aida-autobuild.sh): before merging, save the override as a patch with `diff -u <(git show HEAD:.aida/config.toml) .aida/config.toml`. Dry-run that patch against `git show $target:.aida/config.toml`; if it does not apply, skip and log. Then run `git update-index --no-skip-worktree`, `git checkout -- .aida/config.toml`, `git merge --ff-only $target`, re-apply the patch, and `git update-index --skip-worktree`. Never commit or discard the override. Build only after the merge, so the binary is built from the checkout's own new HEAD and is never older than its config (brief constraint).

      Cause 2, "CI is in_progress" (most other ticks): the script requires green CI on the exact origin/main tip. Merges land about every 30 min and CI takes longer, so the tip almost never has a finished run when the tick fires. `aida dev build` promotes only when main == origin/main, so promoting an older green commit is not an option.
      Fix: when the tip's run is queued or in_progress, wait for it under the flock, polling every 60s and capped at about 25 min. Then re-fetch: if origin/main moved, exit and let the next tick decide; otherwise promote on green.

      The launcher side ships in the TASK-3812 PR. `scripts/lane-run.sh` now runs `aida dev check-fresh` and refuses lanes more than 10 changes or 6h behind origin/main, which makes this failure visible instead of silent.
