title: aida queue work should forward --force-claim to its internal aida session start…
description: |-
  aida queue work should forward --force-claim to its internal aida session start invocation. Today they're decoupled — operators trying to take over a NeedsAttention spec via 'aida queue work STORY-X --force-claim' hit 'unexpected argument'. They have to either bump status first (aida edit --status approved) or use the lower-level aida session start --force-claim path directly. Small UX papercut; the existing workarounds work but the natural-feeling flag should flow through.

  Mitigation: today, aida edit --status approved is the operator-friendly clean-slate path.
