    - `seat_clone::bwrap_tests::linux::bug_2169_bwrap_t5_origin_head_and_tags`
    - `seat_clone::bwrap_tests::linux::task_2712_codex_sandbox_live_seat_commit_and_denials`

    (a) Host mail writer admission. Two BUG-2491 removal assertions need the fixture rerun to confirm the diagnosis.

    - `seat_clone::lifecycle_tests::bug_051_bwrap_session_end_ends_a_clone_whose_branch_is_an_ancestor_of_origin`
    - `seat_clone::lifecycle_tests::bug_2224_bwrap_inherited_refs_end_cleanly_but_seat_only_work_refuses`
    - `seat_clone::lifecycle_tests::bug_2491_published_checkpoints_need_no_salvage`
    - `seat_clone::lifecycle_tests::bug_2491_pushed_slice_tags_are_not_unpushed_work`
    - `seat_clone::lifecycle_tests::bug_b6b_049_bwrap_destroy_drops_the_clone_trust_entry_only_when_on`
    - `seat_clone::lifecycle_tests::task_2053_bwrap_destroy_salvages_then_removes_clone_target_and_pin`
    - `seat_clone::lifecycle_tests::task_2053_bwrap_dismiss_removes_a_seat_clone_and_its_lease`
