  content: |-
    Product 17:24: AC3 PRIMARY-HOST EVIDENCE at origin/main 29e77b8 (#4365 landed). FAIL, deterministic.

    Command (detached worktree ~/ai/aida-worktrees/task3133-evidence, primary host imac; AIDA_CARGO_FORCE_BUILD=1 because the wrapper otherwise skips an unmodified main checkout, see BUG-2708):
    `cargo test --profile agent -p aida-cli-lib --lib -- seat_clone::`

    Results, 3 consecutive runs: identical, 362 passed / 19 failed / 3 ignored each (313s, 199s, 259s). The same 19 names fail every time, so nothing is flaky; it is all one class.

    Failing (18 in seat_clone::bwrap_tests::linux, plus 1 publish test):
    - seat_clone::bwrap_tests::linux::a_clone_is_recorded_only_for_its_own_launchers_main
    - seat_clone::bwrap_tests::linux::a_clone_launched_from_inside_itself_keeps_its_boundary
