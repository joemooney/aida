title: Seat-clone broad suite depends on host lifecycle and containment state
description: |
  During BUG-2603 rework, lane job j20261115T234446341-2-0 (cargo test --profile agent -p aida-cli-lib --lib -- seat_clone::) executed 333 tests: 305 passed, 26 failed, 2 ignored. All changed publication/recovery/regeneration fixtures passed. Failures include mail retention writer-admission refusals, live advisor grant interference, nested containment Git path assertions, and root gitdir refusal. Not baseline-confirmed; needs separate fixture/environment triage. Full log: /home/dirtlab/ai/aida/.aida/lane-jobs/01a1e1976efb/j20261115T234446341-2-0.out. Targeted BUG-2603 tests and the specifically requested story_2710_host_publishes_clean_rework_or_retains_conflicts_before_launch all passed.

  Merged in 2026-11-17 (product groom): TASK-3135 reports the same class on the BUG-2623 lane (j20261116T164831316-2-0: 26 failures in gate dispatch authority cleanup/approval, seat_clone live bwrap tests, lifecycle cleanup and orphan reentry; bwrap diagnostic "fatal: not a git repository (or any parent up to mount point /)"). Log: /home/dirtlab/ai/aida/.aida/lane-jobs/01a1e541b187/j20261116T164831316-2-0.out.

  ## Acceptance
  1. Baseline first: run `cargo test --profile agent -p aida-cli-lib --lib -- seat_clone::` on unmodified origin/main inside a dell1 lane job, and post the pass/fail list here. Each failure is classified as (a) depends on host state (live grants, live advisor, mail retention, real containment paths), (b) parallel-load flake already owned by BUG-2623, or (c) a real defect (file a bug per defect).
  2. Every class (a) test is made hermetic: it builds its own temp AIDA home, grant store, mailbox and git roots, and never reads the operator's live ones. The test asserts nothing about the invoking host's seats or grants.
  3. After the fix, the same filtered command passes 3 consecutive runs in a dell1 lane job and 3 on the primary host, with no class (a) failures. Post the job ids here.
  4. Class (b) failures are linked to BUG-2623, not fixed here.
