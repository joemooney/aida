    (a) Live sandbox or invoking-lane Git context. TASK-2712 is tracked by BUG-2676.

    - `seat_clone::bwrap_tests::linux::a_contained_interactive_resume_goes_through_os_wrap`
    - `seat_clone::bwrap_tests::linux::bug_2169_bwrap_t1_rename_aside`
