    - `seat_clone::lifecycle_tests::task_2053_bwrap_reap_one_clone_releases_the_lease_only_on_removal`
    - `seat_clone::lifecycle_tests::task_2053_bwrap_session_end_and_dismiss_run_no_host_git_and_never_follow_a_clone_aida_link`
    - `seat_clone::lifecycle_tests::task_2053_bwrap_submodule_ignore_dirty_keeps_the_clone`
    - `seat_clone::lifecycle_tests::task_2053_bwrap_t7_planted_config_never_runs_on_the_host`
    - `seat_clone::orphan_reentry_tests::queue_work_reclaims_dead_clean_lane_without_an_origin_branch`
    - `seat_clone::s4_host_git_tests::task_2053_bwrap_an_empty_gitmodules_placeholder_does_not_block_salvage`

    (a) Disk-headroom fixture. 31.2 GiB available against the default 60 GiB floor.

    - `seat_clone::seat_publish_tests::story_2640_fast_gate_real_lane_exit_paths_settle_reservations`
    - `seat_clone::seat_publish_tests::task_2902_launch_paths_preserve_signals_on_refused_spawn`

    (b) BUG-2623 owns the historical parallel regressions. The gitdir, rollback and handshake cases all passed on this baseline. No independent product defect (c) isolated from this run.
