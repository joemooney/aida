title: Investigate reported silent exit-zero reconstitution probes on aida-monitor
description: TASK-1-216 now preserves missing/invalid probe-output failures even with zero criterion-traced tests, and includes artifact/log paths. The original observation of four ~1s aida-monitor runs with zero-byte headless logs is not explained by this report-layer fix. spawn_vendor_headless_with_seat intentionally returns the process ExitStatus; no live vendor run was performed during this implementation. After rebuilding, use the retained failure reason/log path to investigate vendor/runtime configuration and retry the TASK-1523 measurement. Do not infer that exit code 0 alone establishes probe success.
