title: 'aida decide <spec>: human-resolution entry alias (routes to questions answer if a DecisionRequest is pending, else questions clarify)'
description: 'Operator hit the discoverability gap (2026-06-13): tried ''aida decide'', ''aida answer'', ''aida question'' — none exist; the real verbs live under ''aida questions {answer,clarify}''. Add ''aida decide <spec>'' as the natural human-resolution entry. Smart routing: if the spec has a PENDING DecisionRequest (enumerated choices) -> behave like ''aida questions answer <spec>''; else (under-specified / needs-human, no choices) -> behave like ''aida questions clarify <spec>'' (interactive). A thin alias/dispatcher; the underlying logic stays in ''aida questions''. trace:STORY-522'
