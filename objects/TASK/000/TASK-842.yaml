title: 'integrate: multi-spec PR completion semantics'
description: 'Follow-up of TASK-836. When a single open PR carries commits for MULTIPLE specs (a cluster PR), the integrator currently drives it once via --from-pr keyed on one spec id; the OTHER specs on the PR are not individually recognized. Design question: how should the integrator (a) detect a PR completes >1 spec, (b) avoid driving the same PR once per member spec, and (c) auto-bump all member specs to Completed on merge? Decide the multi-spec recognition + completion model before implementing.'
