    Refinement 2026-05-24 from user: the '--name' value composes with prefix-match routing in STORY-459. Default name '<type>-<role>-<seq>' gives three composable specificity levels for queue/brief routing:

    - 'antigravity' = type-level (any instance)
    - 'antigravity-implementer' = type + role (any antigravity in that role)
    - 'antigravity-integrator-1' = full instance name (that one specifically)

    Acceptance addition: name uniqueness validation must consider the prefix-hierarchy — refuse 'antigravity-implementer' as a name (clashes with the type+role prefix used by other instances). Allowed names: full '<type>-<role>-<seq>' default OR a custom name that doesn't conflict with type/type+role prefixes.

