title: 'Config coherence: contained ENABLE is [agents] contained but the egress allowlist is [contained] allowed_hosts — two sections for one feature'
description: 'Review finding on STORY-605 (#862): the contained posture''s enable toggle lives at [agents] contained (and bypass at [agents] bypass, in ~/.aida/agents.toml), but the egress allowlist I added lives at [contained] allowed_hosts (project .aida/config.toml). Two files/sections for one feature — could bite operators writing configs. ADVISOR REC: unify under [contained] (matches the --contained posture name, keeps the containment config together, avoids the [agents]-spans-agents.toml-vs-config.toml ambiguity) — i.e. also accept [contained] enable as an alias of [agents] contained. Low priority: the feature is default-off so no operator configs exist yet. Config-interface decision → keyboard/review, not an unsupervised drain. trace:relates:STORY-605 trace:from-friction'
