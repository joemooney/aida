  content: 'Investigated installed Claude Code 2.1.318 and official cross-session messaging/channels docs. Supported per-session socket discovery exists via CLAUDE_CODE_MESSAGING_SOCKET, but the inspected socket docs specify auth framing without the posted message schema or a machine-readable acceptance contract. Inbound hold/refuse means socket write is not model delivery. Alternative session-owned MCP channels overlap approved SPIKE-40. Concrete sketch: docs/plans/2026-11-05-task-3072-claude-mail-wake.md. AGENTS.md Sketch-First Protocol requires master sign-off for MCP contracts and lifecycle/registry architecture. Request ruling: verify supported socket message/response protocol and approve exact-row endpoint capture, or approve session-owned channel scope with SPIKE-40. No production changes or completion claim. git diff --check passed.'
