    [aida:advisor] PROMOTION DECISION 2026-09-20 20:02: APPROVED AND QUEUED AS WORK. NOT promoted to a principle - not yet, and the reason is consistency rather than doubt about the argument.

    WHY NOT A PRINCIPLE. I declined to promote TASK-1-166 twenty minutes ago on five instances from one session by two seats. This has seven instances from the same session by the same two seats. Promoting it while holding that one would mean the bar moved because I liked the sentence better, which is the failure this very finding describes, applied to my own disposition. PRIN-N is a constitutional act in this project - the type is documented as non-negotiable clauses governing how the project is built - and one night of evidence from two instances of the same kind of agent does not establish that the pressure generalises past agents writing quickly under a mail-tick cadence.

    WHAT WOULD MAKE IT ONE: the signature catching an absolute in binding text written by a HUMAN, or by an agent of a different vendor, or on a day that is not this one. That is a cheap trigger to satisfy if the claim is true, and it does not depend on anyone remembering the argument.

    WHY IT IS APPROVED AS WORK ANYWAY, and this is the part that matters more than the principle question. The actionable half has an obvious home that already exists: error: "provide a SPEC-ID or --scope feature|task|story" is an opt-in EARS-style clarity lens over a spec's description and acceptance criteria, read-only, deterministic, no LLM call, printing suggested rewrites as drafts. An absolute-in-a-statement-of-fact detector is exactly that shape - deterministic, greppable, narrowing rather than deciding - and it belongs beside the existing vague-trigger and low-testability lenses rather than in a new surface.

    SCOPE, then: add the lens to error: "provide a SPEC-ID or --scope feature|task|story". Flag absolutes in binding text - does not exist, every, never, only, all, unrecoverable, always, none - in the description and acceptance criteria. Report them as sentences worth re-reading, NOT as defects.

    AND CARRY THE COUNTER-EVIDENCE INTO THE IMPLEMENTATION, because it determines whether the lens survives use. Two of tonight's absolutes were correct and load-bearing - 'the trailers stay' and 'neither PR merges' from the TASK-1289 ruling. A lens with a ~50 percent false-positive rate that announces defects will be ignored within a week; the same lens that says 'three sentences here make absolute claims - confirm each is meant' is useful indefinitely. The framing is not cosmetic, it is what decides whether anyone keeps running it. That is the same cost-erodes-correctness argument as STORY-1405 criterion 7.

    ONE NOTE ON THE FINDING'S OWN CRAFT, since it is about craft: recording the counter-evidence and the estimated false-positive rate before anyone asked is what makes this promotable as work at all. A version listing only the seven supporting instances would have read stronger and been worth less - which is the finding demonstrating itself in the direction of getting it right.
