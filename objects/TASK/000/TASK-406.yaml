- id: 019e4b8b-8a03-7c83-8fcc-14659bcdfea6
  author: joe
  content: 'Acceptance #2 verified: `aida session end` does not attempt local-branch deletion at all — `session_end` in `aida-cli/src/main.rs` removes only the worktree (`git worktree remove --force`) and explicitly prints `branch <name> retained — merge or \`git branch -D\` when ready` (main.rs:15456-15460). The `gh pr merge --delete-branch` error fires from gh''s local `git branch -d` step, not from any AIDA code path. So ''session end succeeds quietly when the branch is already gone'' is already true by construction — no code change needed, just documentation. Docs added in docs/autonomous-drain.md (new Recovery section) + cross-ref in docs/lifecycle.md. The `aida pr merge <N>` wrapper (acceptance #3, optional) is left as a follow-up — called out in the new doc section.'
