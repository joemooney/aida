- id: 019e2554-7722-7e11-a222-d200c6ac8e6e
  author: joe
  content: |-
    Implemented via epic-23-5 (commit 1ab784cf):

    - `pick_dev_binary_dir` now classifies each candidate binary's embedded git SHA against current HEAD: Exact (binary SHA is prefix of HEAD or vice versa) > Ancestor (`git merge-base --is-ancestor`) > recency fallback.
    - Pure helpers split out: `parse_embedded_sha` (extracts SHA from --version banner), `classify_sha_match` (Exact/Ancestor/Unrelated/Unknown), `current_branch_head_sha` (git rev-parse).
    - On recency fallback, `dev activate` prints a Warning: to stderr (eval-friendly stdout untouched) naming both SHAs and recommending a rebuild.
    - `dev activate` output gains a reason chip: (SHA matches HEAD) / (SHA is HEAD ancestor) / (recency fallback) / (explicit) / nothing for only-one.
    - `dev status` gains a "Binary SHA:" line comparing active binary's SHA against HEAD with the same match labels; DIVERGED gets a `Recommended:` rebuild hint.

    Test status: 9 new unit tests pin the banner-shape parser (short/long/+dirty/unknown/malformed/too-short) and the Exact match path. git subprocess branches validated by smoke-runs of live `dev status`. 332/332 cargo tests green.
    Follow-up: composes with BUG-97/TASK-223 (parse-failure recovery hints) — those catch version-skew at the parse site; this one prevents it at the activate site.
