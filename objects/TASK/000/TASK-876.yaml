title: Per-machine os_wrap override (AIDA_OS_WRAP env) so the sandbox can be enabled per-host without editing shared config
description: 'os_wrap is resolvable ONLY via the tracked .aida/config.toml (SPIKE-68). That makes it unsafe to "turn on": committing os_wrap=true enables it repo-wide and, being fail-closed, ERRORS every clone whose host lacks working bwrap (macOS has no bwrap; un-sysctl-ed Ubuntu blocks userns). bwrap availability is a per-MACHINE property, so its enable switch must be per-machine too. Add an env override AIDA_OS_WRAP (1/true/0/false) that takes precedence over the config value in os_wrap_enabled() (session.rs ~1111), so an operator enables confinement per-host via `export AIDA_OS_WRAP=1` (shell/.bashrc) with NO shared-config change and NO risk to other clones. Document it in docs/environment-variables.md (the canonical AIDA_* reference). This is what makes "turn on the sandbox" both safe and repeatable across machines. trace-note: pairs with TASK-864 (interactive wrap) + STORY-665 (guided setup).'
