title: When Codex ships command-backed status lines, wire aida statusline into the Codex footer
description: |-
  WATCH / DEFERRED — no active AIDA work until the upstream trigger fires.

  The AIDA-side Codex status fallback is ALREADY DONE: TASK-b6b1278890774ef993d2ebc327862470-249 scaffolded the [tui] status_line guidance + the "Codex has no command-backed status line" explanation; TASK-0414 shipped the opt-in aida-statusline bootstrap; docs/agents/codex-mcp-setup.md documents both. The only remaining piece is UPSTREAM and outside AIDA's control: Codex CLI does not support command-backed status lines (open FR: github.com/openai/codex issues #20043 and #20244).

  REVISIT TRIGGER: when Codex ships command-backed status_line support, wire aida statusline (--color=always) into the Codex footer the way it drives Claude Code's statusLine.command, and refresh docs/agents/codex-mcp-setup.md + porting-claude-code-to-codex.md Appendix A.5.

  Until then there is nothing to build — the built-in [tui] status_line fields plus aida statusline via shell/TUI are the documented fallback, and the command-backed gap is the single Claude-only dependency the migration doc names (observability, not correctness).
