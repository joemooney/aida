title: 'aida init: scaffold .antigravity/ directory + integration files (mirrors .codex/ pattern)'
description: |-
  ## Background

  \`aida init\` currently scaffolds \`.codex/\` with Codex agent integration files (\`AGENTS.md\`, etc.). With Antigravity CLI as a second supported agent (STORY-407), the same scaffolding pattern extends to \`.antigravity/\`.

  ## Acceptance

  - \`aida init\` writes a \`.antigravity/\` directory with integration files appropriate to Antigravity CLI 1.0.1's expected layout.
  - File contents are pulled from a new \`aida-core/templates/.antigravity/\` master directory.
  - \`aida init --no-skills\` (already supported) skips both .codex/ and .antigravity/ scaffolding consistently.
  - New flag if needed: \`aida init --agents=codex,antigravity,…\` to enable selective agent scaffolding (defaults to all available).
  - Templates are minimal but functional — focus on what's required for the agent to find AIDA's MCP server and discover the conventions.
  - \`docs/agents/antigravity-mcp-setup.md\` (STORY-407's deliverable) is the authoritative reference for what \`.antigravity/\` should contain.

  ## Out of scope

  - Antigravity-specific tools or extensions beyond what the generic MCP surface provides.
  - Custom configuration formats — use Antigravity's standard config conventions.

  ## Composes with

  - STORY-407 — empirical integration produces the content this task scaffolds.
  - The original \`.codex/\` integration that informs the pattern.
