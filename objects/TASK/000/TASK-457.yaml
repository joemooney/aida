  content: |-
    Naming-resolution question 2026-05-22: this task targets `.antigravity/` directory; Antigravity CLI 1.107.0 in actual use creates `.antigravitycli/` (which is a symlink to ~/.gemini/config/projects/<uuid>.json per-machine state, now gitignored).

    Two questions to resolve before implementation:

    1. Does Antigravity expect a project-tracked `.antigravity/` directory with integration files (analogous to `.codex/`)? Or does it look elsewhere entirely (~/.gemini, command-line, etc.)?
    2. If yes to #1, is the dir name `.antigravity/` or `.antigravitycli/` or something else? Confirm by inspecting Antigravity's behavior on a fresh project.

    Until resolved, the scaffolding shape is unknown. Tag as needing-research before implementation can proceed. Compose with STORY-407's setup doc (docs/agents/antigravity-mcp-setup.md) which now has empirical evidence of Antigravity's directory expectations.
