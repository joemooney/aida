  content: 'PROXY DECISION (Claude for the operator, overnight burn-down; design calls delegated). Question and ruling (recommended option adopted): Q: what shape should the CLI staleness check take — a general write-side-verb check (review record, queue done, merge-hold add) comparing on-disk source HEAD vs binary sha, or a narrower review-record-only warning? Recommend: the general form, reusing the existing MCP self-respawn mechanism''s logic rather than inventing a second one, since the spec''s own evidence (a stale binary corrupted an independent 543-file corpus measurement) shows the blast radius is not limited to review record. No such check exists on the CLI path today (grep for staleness/sha-ancestor logic near handle_review_record at lib.rs:78213 found nothing) — spec itself says "advisory, the advisor owns the call".. Now IMPLEMENT-ready.'
