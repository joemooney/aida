title: Surface nightly cross-platform failures sooner (it was red ~3 days unnoticed, blocked v0.12.0)
description: 'The nightly cross-platform workflow had been red since 2026-06-04 (3 consecutive failures) and nobody noticed until the v0.12.0 release gate forced a fresh run on 2026-06-07. Five accumulated Windows-only bugs (BUG-466 brief-path separator, BUG-468 libc::ETXTBSY un-gated, BUG-469 forge ExitStatusExt::from_raw, BUG-470 temp_root coarse-clock collision; + BUG-467 gitignore) had to be fixed-forward one CI-round at a time before the gate passed. Root process gap: PR CI is Linux-only (TASK-257) and cross-platform is nightly-only with no failure notification, so Windows debt accrues invisibly between releases. Options: (a) notify on nightly cross-platform failure (issue/Slack/desktop); (b) a weekly ''cross-platform health'' check in /aida-insights; (c) reconsider TASK-257''s ''re-add Windows to PR CI once quiet 2 weeks'' — it was never quiet. Low-cost win: fail louder.'
