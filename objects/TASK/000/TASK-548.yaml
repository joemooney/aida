  content: |-
    Implementation note: the spec's last acceptance bullet — "Test: aida queue work with no SPEC (auto-pick): agent pauses with confirmation menu (today's behavior preserved)" — rests on a stale premise. TASK-86 (already shipped) made the no-SPEC head/cluster form pass --auto-first, which the skill template already treats as a consent signal that SKIPS the confirm. So no-arg aida queue work does not pause today.

    What this PR ships instead is the spec's evident *intent*: any argument to /aida-pickup is the consent signal. Three forms now skip confirm — <SPEC-ID>, --auto-first, --batch <NAME>. Only the bare /aida-pickup (no arg, direct conversational invocation) still pauses. This generalises TASK-86's rule rather than retracting it, and is more coherent than the per-form list the skill template previously carried.

    Bare /aida-pickup behaviour: preserved (still pauses). That's the only "auto-pick the head" path that wasn't already routed through --auto-first.
