title: 'PR-3062 follow-up: torn era-marker aside must not resolve as a bare admin name; atomic write_source_id'
description: |
  Non-blocking finding from the APPROVED review of PR #3062 (TASK-b6b1278890774ef993d2ebc327862470-072) at c677f7f45156. ADVISOR RULING: a non-JSON aside body is accepted as a bare admin name only if it is a valid single path component (no slash, no NUL, non-empty, at most 255 bytes, no brace or quote, i.e. not a JSON fragment). Anything else is reported as corrupt and never removed or restored automatically. Make write_source_id atomic (temp + fsync + rename/link). Add a test for a torn aside.
  - [minor, non-blocking] leftovers.rs:155-160 scan_era_markers: any non-JSON UTF-8 aside body is taken as a bare admin name, so a torn (partial-JSON) record aside — write_source_id is create_new+write, not atomic — resolves to a bogus <common>/worktrees/<garbage> path, is judged stale, and is removed instead of kept. Not a regression (the marker was already absent), but inconsistent with era_marker_stale's fail-closed handling of a torn marker; consider treating a body that starts with '{' as an undecidable record and leaving it.
