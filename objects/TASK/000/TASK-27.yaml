spec_id: TASK-27
title: 'Scaffolder: re-extract .claude/hooks/ scripts on aida scaffold apply'
description: |-
  Today aida scaffold apply regenerates CLAUDE.md, settings.json, skills, and commands but does NOT re-extract embedded hook scripts under .claude/hooks/. So when the binary ships a new hook (e.g. TASK-1-022's aida-role-context.sh), existing projects don't pick it up via scaffold apply — only a fresh aida init does, or manual copying.

  ## Acceptance

  1. aida scaffold apply walks the embedded hook templates (aida-validate-commit.sh, aida-track-commits.sh, aida-git-guardrails.sh, aida-role-context.sh, ...) and writes them under .claude/hooks/.
  2. FileStatus::Modified detection respects user edits (same protocol as settings.json).
  3. aida scaffold status reports per-hook drift.

  ## Out of scope

  - Wiring the hooks into settings.json — that's TASK-FOLLOW-UP-B (scaffolder needs to also emit SessionStart entry referencing aida-role-context.sh).
