title: Native seat PR hold cannot resolve an existing local branch
description: 'TASK-2860 native seat: aida pr hold reports local branch task-b6b1278890774ef993d2ebc327862470-805 does not exist, but git show-ref --verify resolves da96608695759e2346569a2c72dc510b5ea1dd0e. No hold marker created. Direct git push published that branch; ls-remote confirms the SHA. Local upstream and remote-tracking updates refused read-only Git metadata. Queue done separately warned current_branch_at returned None and its PR-check did not fire. Similar hold failure is recorded in STORY-2492 comments. Diagnose CLI branch discovery in native seats; do not infer a successful PR hold from a remote branch alone.'
