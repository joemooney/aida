title: 'NON-BLOCKING minor egress_probe.py:345-350 (mutable_sockaddr race): the pointer…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-2706, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  NON-BLOCKING minor egress_probe.py:345-350 (mutable_sockaddr race): the pointer mutator alternates between private.sock and /lane/state/host.sock, a path that does not exist. A regression to CONTINUE/re-read on the pointer axis would get ENOENT and never reach a host listener, so the host's accept-queue check (egress_probe.py:569) cannot observe it. Only the symlink/rename axis targets a real host endpoint. Point the mutated sockaddr at /host-services/host.sock so the check is meaningful.
