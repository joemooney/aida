title: BUG-254 fix also propagates store-leg failures (spec only called out code-leg)
description: |
  While fixing BUG-254 (code-leg failure swallowed) I also extended the
  exit-status propagation to store-leg failures — the spec's Fix section
  only explicitly called out the code leg, but the same bug class existed
  for the store leg (Err from `git_ops::pull_rebase` was logged as a
  Warning and swallowed too).

  Reasoning: acceptance #1's phrasing "not OR-reduction across legs" reads
  as "any leg's failure must propagate, not be masked by the other leg's
  success." And the implementation was simpler when both legs share a
  single tracking pattern (Option<String> per leg, single bail at the end).

  Worth a heads-up because:
  1. It widens the behavior change beyond the spec's Fix wording.
  2. Any caller that ran `aida pull` knowing the store leg could fail
     silently — none in the orchestrator path, but worth confirming.
  3. `aida db sync --pull` mirrors this pattern (see main.rs near line
     32787 `git_ops::pull_rebase`) and was NOT touched — keep an eye on
     parity if a sibling bug surfaces there.

  File: aida-cli/src/main.rs (handle_pull_command, final match arm).
  Raised by the implementer while working BUG-254.
