    Once TASK-218 (aida queue rework) ships, the status-aware error suggestions in this TASK can shorten dramatically. Compare:

    Today's recovery for Done status (from TASK-217 spec):
      aida edit STORY-86 --status in-progress
      aida queue add STORY-86 --for implementer
      aida queue work STORY-86

    Post-TASK-218 recovery:
      aida queue rework STORY-86 --work

    Three lines collapse to one. Update TASK-217's acceptance to reference aida queue rework SPEC --work in each of the 6 status-case error messages (where applicable) instead of the manual 3-step sequence.

    Cross-link: TASK-218 (aida queue rework verb) composes here.
