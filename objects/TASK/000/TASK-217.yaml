  content: |-
    Implemented via epic-23-5 (commit e26e6c6a):

    - New helper `format_queue_work_not_queued_error` branches on the resolved spec's current status — Draft/Approved → queue+work; Planned → promote first; InProgress → likely lost-lease; Done → `aida queue rework --work --resume`; Completed/Rejected → force re-open.
    - Container types (Epic/Folder/Sprint) get a different message ("no queued children") rather than the leaf status-aware recovery, which would be misleading for parents.
    - Role pulled from AIDA_SESSION_ROLE env when available, with `<role>` placeholder fallback.
    - `aida queue work --help` long-form mentions the new behavior.

    Test status: 8 new unit tests cover all 6 status branches + container + role-fallback paths. 332/332 cargo tests green.
