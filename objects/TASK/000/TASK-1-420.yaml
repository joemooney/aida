description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1721, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: scripts/release.sh retakes the lease after the confirm prompt (~line 642) without re-checking HEAD == the commit the bump, cargo check, CHANGELOG and tag notes were computed on. A ship that fast-forwards the primary checkout during the prompt makes release/vX cut from a different base, with stale CHANGELOG/tag notes. Re-verify HEAD (and origin/main) after the retake and abort with the restore hint if it moved.
