title: 'aida agent new: read per-agent config for default flags (skip-permissions etc.) — eliminates manual flag re-typing'
description: "## Friction\n\nOperator runs Antigravity directly with 'agy --dangerously-skip-permissions' as their default (per memory user_permission_posture; controlled local environment, accepts the risk). When 'aida agent new antigravity' spawns Antigravity via the supervised launcher, the flag is NOT propagated — Antigravity prompts on every file access, including reads outside workspace (e.g., '.aida-store' which is symlinked).\n\nOperator explicitly raised: 'we need a configuration file enabling certain flags.'\n\n## Reproduced 2026-05-24\n\nLaunch sequence:\n  aida agent new antigravity --role implementer --spec TASK-542\n  # → Antigravity spawns WITHOUT --dangerously-skip-permissions\n  # → First file read prompt: 'Read: /home/joe/ai/aida/.aida-store / Reason: outside workspace / Allow access to this file?'\n\nOperator confirms each prompt; productivity drops.\n\n## Proposed shape\n\nA config file (per-project '.aida/agents.toml' OR per-user '~/.aida/agents.toml' OR both with merge) declaring per-agent default flags:\n\n  [agents.antigravity]\n  default_flags = [\"--dangerously-skip-permissions\"]\n  \n  [agents.claude]\n  default_flags = []\n  \n  [agents.codex]\n  default_flags = [\"--ask-for-approval=never\", \"--sandbox=danger-full-access\"]\n\n'aida agent new <type>' reads this config + appends the flags when spawning the agent CLI.\n\nOperator can override:\n- '--no-default-flags' opt-out per launch\n- '--extra-flag <flag>' append per launch\n- Or just edit the config file\n\nMerge order (when both project + user configs exist): user defaults base, project overrides on conflict.\n\n## Security / safety considerations\n\nThe --dangerously-skip-permissions flag exists for a reason. Documentation should note:\n- Operator is responsible for what they enable per-agent\n- Config file is under operator's control (not auto-suggested)\n- Per CLAUDE.md global preferences: 'For risky or hard-to-reverse operations confirm before acting' — config-file flags don't bypass that level of substrate-level confirmation\n\nThe config is operational defaults, not blanket permission.\n\n## Acceptance\n\n- [ ] Schema for per-agent default flags defined (.aida/agents.toml + ~/.aida/agents.toml)\n- [ ] 'aida agent new <type>' reads config + appends flags\n- [ ] Merge order: user defaults base, project overrides\n- [ ] '--no-default-flags' opt-out flag\n- [ ] '--extra-flag <flag>' append-without-overriding flag\n- [ ] aida init scaffolds a sample .aida/agents.toml (commented examples; no live flags by default)\n- [ ] Documentation: docs/agents/per-agent-config.md explaining the schema + safety considerations\n- [ ] Test: config file present + 'aida agent new' propagates flags; --no-default-flags opt-out works\n\n## Composes with\n\n- Sibling task: aida agent new --prompt (auto-inject first message) — same launcher surface\n- TASK-554 (--spec scope-binding) — same launcher surface\n- user_permission_posture memory (operator's stated preference; this lets the substrate honor it)\n- aida init scaffolding (config gets seeded by aida init)\n- feedback_substrate_as_bouncer_not_rules — substrate honors operator preferences without forcing re-typing\n\n## Origin\n\n2026-05-24 operator: 'I run agy --dangerously-skip-permissions (at least for now until we come up with a better approach) and that did not get passed in on aida new agent, we need a configuration file enabling certain flags.'\n\ntrace:TASK-X"
