  content: 'ADVISOR 2026-11-07 07:00: rejected. Standalone non-native aida-core is not a supported configuration. CI guards only ''cargo check -p aida-cli --no-default-features'', which keeps native aida-core, and there is no non-native consumer (single-user project). The failure predates TASK-3325. If a wasm/non-native consumer appears, file it with that consumer as the acceptance.'
