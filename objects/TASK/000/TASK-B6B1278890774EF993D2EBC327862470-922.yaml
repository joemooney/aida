title: Standalone aida-core without native features fails before dependency migration
description: 'While validating TASK-3325, cargo test -p aida-core --test yaml_compatibility --no-default-features failed with 63 feature-gating errors (unresolved templates, mailbox_identity, git_ops, process_probe and related native-only modules). An untouched HEAD copy in /tmp/task3325-baseline reproduced the same 63 errors using the original dependency set, so this predates the migration. Native YAML tests pass. This is separate from the required aida-cli --no-default-features guard, which retains native aida-core. Triage whether standalone non-native aida-core remains supported; no fix included in TASK-3325. Evidence: /tmp/task3325-core.log and /tmp/task3325-baseline.log.'
