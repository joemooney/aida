title: Create end-to-end Codex migration validation runbook
description: |-
  Define and execute a practical validation path proving a Codex CLI session can participate in AIDA work without relying on Claude Code-specific semantics.

  Acceptance:
  - Run or document a fresh Codex session launched through AIDA where possible.
  - Verify Codex can read an owning spec via MCP, claim work, inspect queue/brief state, make a small traced edit, run targeted tests, and write coordination state back through MCP.
  - Verify the same state is visible through the AIDA CLI after MCP writes.
  - Include negative-path checks for blocked approval/session communication and sandbox posture assumptions.
  - Capture gaps as follow-up specs rather than unresolved notes.
