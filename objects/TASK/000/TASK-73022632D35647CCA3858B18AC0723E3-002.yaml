title: Fresh headless child grant is issued from the seat root (cwd), not the root the launch preflight validated
description: |
  `spawn_vendor_headless_forking` (aida-cli-lib/src/session.rs, the `issue_launch_child(&headless_worktree_root(), ...)` call) revalidates the parent grant and its roster from the project root of the current directory. `aida queue work` has already changed directory into the seat by then, so the roster is read through the seat's `.aida/config.toml` and its `.aida-store` link. The preflight in queue_cmd/work.rs validates from the launcher's project root. The resume arms (`spawn_claude_headless_resume_granted`, `spawn_vendor_headless_resume_granted`) pass `cwd` the same way. `launch/grant.rs` states that no authority is inferred from cwd.

  Effect: a seat whose store does not resolve (missing or dangling `.aida-store` link, a branch whose `.aida/config.toml` differs) passes the preflight and is refused after worktree, lease and claim exist, as "the team roster no longer allows ...". This is a candidate cause for BUG-2544 (PR-3896 was refused 72 s after its own lease claim, both times) but is not confirmed. `host_main` is already threaded into these functions and could be the authority root.

  Raised by the implementer while working BUG-2544.
