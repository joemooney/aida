  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1955, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: aida-core/src/team.rs task_2223_the_workspace_target_passes_the_guard relies on <workspace>/target existing, because is_under_workspace_target canonicalizes it and returns false otherwise; with CARGO_TARGET_DIR pointing elsewhere on a fresh checkout the guard panics and the test fails. The removed version used CARGO_MANIFEST_DIR, which always exists. Create the dir in the test or skip when it is absent.
