  content: 'Design slice landed: docs/plans/2026-06-26-task-0438-fasttrack-lane.md (PR #1124). Two named tiers on one lane — trivial (batch:fasttrack + lifecycle:no-review, CI-only) and quick-fix express (batch:express, full gate). Reliability fixes: accept-implies-queue-and-drain (no stranding), punt-out invariant (no silent re-gate), derived status surface. Followups filed as children: STORY-692 (express filing verb), TASK-905 (lane status projection), TASK-906 (skill: tiers+litmus+punt-out), TASK-907 (wire into EPIC-0428 autopilot envelope, draft/blocked on EPIC-0428).'
