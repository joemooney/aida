- id: 01a1ba8b-d29e-7ce1-a4db-62a69a7222f6
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3641):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9d8ab6c4766d
    Recorded: 2026-11-08T09:20:30.705307716+00:00
    Findings:
    1. BLOCKING aida-cli-lib/src/launch/contained.rs:472-482: the MCP/read_url/execute_url deny list lives only in settings.json inside the lane-writable private runtime. install_private_runtime calls profile.add(&source, true), and only the credential leaf gets a read-only bind (bind_runtime_credential, :488), so under --dangerously-skip-permissions the terminal or file tool can overwrite ~/.gemini/antigravity-cli/settings.json and remove the denies for any later or re-reading agy process. Ruling item 1 (comment 36) requires MCP/browser/URL tools off, and C0-C4 would not detect this. Fix: bind settings.json read-only by handle over the writable runtime, as the credential is, and extend task_3048_live_private_runtime_preserves_read_only_credential (launch_tests.rs:2422 only reads it) to assert a write is refused with EACCES/EPERM/EROFS. Also correct containment-conformance.md ('Runtime state is private and writable') to name the exception.
    2. Strict-tier test gap aida-cli-lib/src/containment/mod.rs:244-247: the new RuntimePolicy::validate refusal for a weakened tool_denies list has no test (rg tool_denies finds no test reference to the refusal; the validate cases at launch_tests.rs:2365-2374 do not vary it). It is the only guard keeping the three denies in the shipped descriptor. Add cases for empty, reordered or missing denies that assert the 'requires MCP, URL and browser tool denies' error.
    3. Cosmetic aida-cli-lib/src/launch/contained.rs:941-942: the comment 'Explicit fixture entry only. No environment/config switch opens admission.' now sits above prepare_with_io, the shared entry for every launch, so it misdescribes the function, and it replaced the STORY-2593 trace comment explaining the binary pin. Restore that comment and keep the diagnostic note on prepare_runtime_diagnostic.
    4. Cosmetic scripts/containment/conformance.py:948-951: for agy the interpreter selection and shlex.join result are computed and immediately overwritten by diagnostic_invocation; since interpreter is only ever used for that discarded value on agy, drop the /usr/bin/python3 branch so codex keeps sys.executable and agy has one code path.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
