  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3641):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9b8a2498c235
    Recorded: 2026-11-07T23:54:34.336793812+00:00
    Findings:
    1. Ruling item 1 unmet: run_aida --vendor agy goes through 'aida queue work --vendor agy', which the production Adapter::require_conformance refuses, so the fixture never reaches agy execution and the advisor's C0-C4 live run through the AIDA boundary is impossible (containment-conformance.md new section admits this). Add a fixture/diagnostic-only entry into the shared wrapper (outer_only_argv + receipt barrier) that does not unlock production admission, with a test proving production still refuses.
    2. Ruling item 1: MCP, browser and URL tools are not disabled. vendors.toml argv_prefix only adds --disable-slash-commands; the private settings.json is now {} with no tool restrictions. Add the agy flags/settings that disable MCP/browser/URL tools and a test asserting them in candidate and wrapper argv.
    3. Ruling item 2: runtime_policy auth_hosts is not consumed by the contained launcher's egress allow-set (only tests and the Python fixture read it; contained.rs:1027/1384 handle Codex OAuth hosts only). There is no fail-closed with a named reason for an unlisted host, and oauth2.googleapis.com comes from a static string in the binary, not a measurement; no measured list is recorded on the spec.
    4. Stale native-permission data: vendors.toml:42 still sets workspace_permission = "write_file", RuntimePolicy::settings (containment/mod.rs:219) now has no production caller (dead_code warning; Makefile clippy -D warnings would fail), launch/agy.rs:227-237 tests still assert the write_file(<ws>/**) allow the ruling retired, and install_private_runtime keeps an unused _workspace parameter (contained.rs:462). Remove the field/method/tests and parameter, or cfg(test)-gate them with a stated reason.
    5. scripts/containment/conformance.py fixture_policy reads auth_hosts from the script's own source checkout (parents[2]/aida-cli-lib/src/containment/vendors.toml), not from the aida binary under test (shutil.which), so a fixture run against a different build can allow hosts that differ from the launcher's shipped data. Derive hosts from the binary under test (e.g. an aida subcommand) or assert the binary's SHA matches the checkout.
    6. Test gap (strict tier): no test covers ready() building the queue-work argv with --vendor agy, or run_aida --vendor agy getting past the output-dir check into setup with agy fixture policy; test_agy_aida_boundary_retains_hidden_output_refusal only exercises the pre-existing /tmp refusal.
    7. Cosmetic: vendors.toml:29-31 header comment still says 'Only this endpoint is present in recorded host evidence' above a two-host list; reconcile with the new inline comment.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
