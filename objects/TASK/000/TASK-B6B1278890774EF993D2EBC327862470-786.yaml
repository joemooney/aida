- id: 01a1b946-e3d3-7cc0-b513-511702d82954
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3641):
    Verdict: CHANGES REQUESTED
    Reviewed commit: cd73111610fa
    Recorded: 2026-11-08T03:08:36.050019397+00:00
    Findings:
    1. Possible fail-open, no evidence: wrapped_outer_only_argv (aida-cli-lib/src/launch/contained.rs:564-574) now passes '--settings <inline JSON>' where every recorded AGY run used '--settings <file path>' (containment-conformance.md:62-64; conformance.py:1103). Nothing shows AGY 1.5.3 parses inline JSON. If AGY reads the string as a missing path and continues, the MCP/read_url/execute_url denies are silently dropped while --dangerously-skip-permissions is set. C0-C4 probe filesystem, git, store, network and IPC, not MCP/URL tools, so the advisor's live run would not catch it. Fix: point --settings at the private runtime settings.json, which install_private_runtime already writes with the same denies, or cite recorded AGY help/output showing inline JSON is accepted and an unreadable value is refused. Add a test asserting the form chosen.
    2. Strict-tier test gap: diagnostic_launch (aida-cli-lib/src/launch/agy.rs:55-142) is a new authority path (mints an implementer child grant, runs agy with the permission bypass) and none of its refusals are tested. Add Rust tests that never exec a real vendor for: workspace/repository not fixture siblings, including via symlink (AGY_DIAGNOSTIC_FIXTURE_INVALID); report.boundary != aida; a non-agy or unknown vendor in aida-state.json refused before grant issue; a credential path that is not absolute or not the .gemini/antigravity-cli/<leaf> shape (AGY_DIAGNOSTIC_CREDENTIAL_INVALID); missing payload/runner.py; and no valid parent grant -> ChildGrantRefused with no spawn.
    3. Cosmetic: the clap args --fixture-root, --credential (ConformanceLaunch) and --vendor (RuntimePolicy) in aida-cli-lib/src/config_cmd_args.rs:116-127 have no doc comments, so their help is blank (cli_help_snapshot.txt shows empty descriptions). Add one-line help for each.
    4. Minor: shell_quote_diagnostic (agy.rs:39-49) treats only ASCII alphanumerics as safe, but conformance.py builds the expected invocation with shlex.join, whose safe set is Unicode \w. For a fixture path with non-ASCII characters (e.g. a non-ASCII HOME) the prompt's command string will not match what terminal_receipts(log, invocation) looks for, and the run reports no receipt. Fix: use the same quoting on both sides, or have Python read the invocation string from the Rust side.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
