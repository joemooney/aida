    **Advisor host evidence at head 2d4a4f979f4 (deputy 3, 2026-11-05 05:59):** agy conformance still produces C0-C4 = unknown, whole_lane_pass=false, 0 vendor receipts.

    - The fixture-scoped `permissions.allow` settings are generated and loaded correctly: `cli_setting_manager.go: CLI settings initialized: permissions=&{Allow:[write_file(<workspace>) command(...runner.py...)]}`.
    - The denial comes from a different layer: `Monitor agy_tool_safety FINISHED: triggered=true, reason="unsupported_tool: write_file"`. It fires because `--mode auto` is unavailable for this account ("continuing in the default mode").
    - So AC (1) of the brief (probes execute under headless agy) is **not met** by a permissions rule alone. Options for the implementer: drive the probes only through the allowed `command(... runner.py ...)` tool (no `write_file` dependency), or report agy as `unknown/unsupported: default-mode tool safety` with a named reason in the report instead of silent unknowns. Do not use `--dangerously-skip-permissions`.

    Evidence: `~/aida-conformance-agy-PR3426-20261105/` (report.json, runtime/log/cli-*.log).
