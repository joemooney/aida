title: Auto-derive 'Reusable helpers' section from trace graph + spec relationships
description: |-
  The single best section of /ultraplan's STORY-86 output was 'Reusable helpers — do not reimplement' — an explicit list with line refs (extract_spec_ids_from_commit, record_role_activity, Storage::update_atomically, etc.). This prevents the implementer from re-inventing parsers.

  AIDA has better source data than /ultraplan to generate this section: the trace-comment graph. Given a target spec, walk:

  1. Sibling specs (other children of the same parent)
  2. Specs in the same feature tag
  3. Specs that share tags with the target

  For each candidate sibling, harvest its trace comments and report 'these reqs touched these files / introduced these helpers; consider reusing rather than re-implementing.'

  Output as a section appendable to a docs/plans/ file or printable standalone via aida plan helpers <spec>.

  ## Acceptance

  - [ ] aida plan helpers <spec> command lists reusable helpers + files-touched derived from trace graph
  - [ ] Walks siblings (same parent) + same-feature + same-tag specs
  - [ ] Output is markdown-suitable for pasting into a docs/plans/ file
  - [ ] /aida-plan skill optionally calls it to seed the 'Reusable helpers' section
