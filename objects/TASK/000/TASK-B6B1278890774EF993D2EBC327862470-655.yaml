title: 'Containment tracer: closed model-free probe reports typed policy, filesystem and supervisor isolation'
description: |-
  Acceptance: (1) Common data-driven vendor capability/trusted-policy/launch-boundary contract and a closed model-free doctor/config probe, with precise ready/unsupported/refused cause. No arbitrary harness or stored shell through partial backend. (2) Same intended production filesystem/supervisor builder executes fixed synthetic lane with private namespaces/proc, capdrop, terminal-injection refusal, FD hygiene, typed own-write roots/protected paths and teardown. (3) Required-live fixture proves permitted synthetic writes, denied outside/proc/FD/protected-path writes and process teardown; unavailable bwrap/userns/TTY/channel fails closed. (4) Current real-vendor behavior unchanged and unsupported partial backend remains unselectable. Layers: trusted config/capability data, public diagnostics, runtime supervisor/filesystem, integration tests. Signed sliceA.

  All signed STORY2238 sketch C1-C12 and BUG2398 B1-B4 apply. Linux only, fakeHOME/synthetic tests, no global user settings or schedules. No partial backend may report AIDA containment applied or launch ordinary agents until all required protections are ready; named refusal, no fallback. STRICT independent review, operator merge floor. LIGHT one targeted test plus fast gates; shared infra or >10files adds touched-test/compile, fullsuiteCI only. Longcargo background, no slotbypass. Parent all7AC remain open until final installed-tool evidence; no slice alone completes parent.
