title: 'non-blocking (minor): child_store_commit.rs commit_store_writes_since — a path …'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2185, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): child_store_commit.rs commit_store_writes_since — a path that was staged-added in the baseline (1 A. / rename destination 2 R.) and is then deleted by the child is git-rm --cached'd out of the index, so it is unknown to both index and HEAD; commit_paths(-- <paths>) then fails with 'pathspec did not match any file(s) known to git' and the WHOLE commit aborts, leaving all of the child's other writes uncommitted (reproduced with plain git). Fix: drop such paths from refs before commit_paths (e.g. filter by git ls-files --error-unmatch / ls-tree HEAD), plus a unit test.
  Reviewed sha: 6bd0d98c4d89e5561ea6d35dd373ca8abc93ea78
