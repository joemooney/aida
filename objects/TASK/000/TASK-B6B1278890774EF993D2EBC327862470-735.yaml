description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-2772, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking/minor (plausible): lanes now get rw on ~/.local/state/cargo-slots, where the host slot wrapper writes its build log. A lane could replace the log file with a symlink, for example to a file under ~/.cargo/bin, so the host's next log write lands there. lane_job already grants the same pair, so this class predates the PR. Confirm the host wrapper opens the log with O_NOFOLLOW, or refuses a symlinked log.
