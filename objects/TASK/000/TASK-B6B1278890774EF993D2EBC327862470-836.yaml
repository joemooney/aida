    ## Implementer approach

    ### Acceptance criteria as tests
    - Command-level fixture: run production init and role scaffold/enter in a disposable policy repository; a real fake Codex executable is available, but the managed-agent role-enter refusal must stop before vendor execution, emit a named refusal report and leave C0–C4 unknown.
    - Harness: explicit --boundary aida selects only the production headless queue launch with a committed fixture policy and production seat/lease setup; unsupported vendors refuse without fallback. Native default continues through the original code unchanged.
    - Host-only: deputy 3 runs the live Codex path after merge and attaches results to BUG-2447/2448; this lane makes no live-pass claim.
    - Validation: Python conformance suite plus LIGHT checks for any compiled changes.

    ### Expected files
    - scripts/containment/conformance.py
    - tests/test_containment_conformance.py
    - docs/testing/containment-conformance.md
    - If needed, a narrow accepted-receipt diagnostic in aida-cli-lib/src/launch/contained.rs, because the existing production launcher does not currently expose its accepted receipt digest to the host harness. This adds evidence only and must not change launch authorization or preflight.

    ### Ambiguities / conflicts as questions
    None. The latest advisor ruling makes managed-session grant refusal an expected offline outcome; no identity clearing, synthetic TTY or authority-file fabrication is permitted.
