- id: 01a1ad6d-3928-7623-9f36-cabe0274be16
  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - Fixture/command-level: initialize a disposable repository through production aida init, commit its own contained.vendors.codex=aida policy, and attempt production seat establishment and requested-seat preflight without a TTY. If authority cannot be created, record the named refusal as required by the binding advisor ruling; do not bypass either check.
    - Fixture: if authority setup succeeds, run the closed C0-C4 payload through the existing contained launcher, recording fixture policy commit, accepted ContainmentReceipt digest and AIDA binary SHA. Exercise an offline fake vendor and native compatibility tests.
    - Command-level: unsupported shared vendors refuse explicitly, without fallback. Native remains the default and preserves existing behavior.
    - Host evidence: advisor deputy 3 owns the recorded Codex host run; this implementer cannot claim that run.
    - Validation: targeted conformance tests and formatting (LIGHT gate) for any implementation changes.

    ### Expected files
    - scripts/containment/conformance.py
    - tests/test_containment_conformance.py
    - Existing containment harness operator documentation, if implementation proceeds.

    ### Ambiguities / conflicts as questions
    None: the binding advisor ruling resolves the fixture-policy fork and explicitly requires a named refusal if production commands cannot establish fixture authority without the operator TTY.
