  content: 'ADVISOR RULING 2026-11-05 13:50 MST on the fixture-policy fork: use a DISPOSABLE FIXTURE with REAL production context. The harness creates its fixture repository with its own committed trusted policy selecting codex = "aida", plus a real seat and lease for it, created through the production commands (aida init or worktree add, and the seat preflight) inside that fixture and never by writing files that imitate them. It then launches through the unchanged production contained launcher. Never bypass or stub the policy check or the seat preflight. The evidence claim is: ''the production launcher, under a committed policy that selects aida, enforces C0-C4 for Codex.'' That is exactly what closes BUG-2447 and BUG-2448. The report records the fixture policy''s commit SHA, the ContainmentReceipt digest and the AIDA binary SHA; the host repository''s own policy (native) is irrelevant and stays untouched. If the production commands cannot create the seat inside a throwaway fixture without the operator''s TTY, refuse by name and report it; do not invent a shortcut.'
