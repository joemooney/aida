  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was punted on: design-fork: Production PreparedLaunch::prepare (aida-cli-lib/src/launch/contained.rs:419) requires a locally trusted committed contained.vendors.codex=aida policy (lines 433-441), required canonical store/cache roots, and a valid requested-seat preflight (lines 718-736). Current origin/main policy explicitly selects codex=native; conformance.py prepare() instead creates an unrelated disposable repository with no trusted policy or seat binding. Acceptance does not specify whether boundary=aida evidence may use a synthetic committed fixture policy plus fixture authority, or must preserve the real project policy and use an authorized production child worktree. Those choices produce materially different policy SHA/authority evidence. Need advisor ruling on the fixture policy and seat/authority contract before adding a bridge; do not bypass trusted policy, substitute a successful preflight, or silently present fixture evidence as production-profile evidence. Native behavior remains untouched; no code changes or PR.. No triage reason was given.'
