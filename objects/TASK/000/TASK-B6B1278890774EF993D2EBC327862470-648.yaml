title: Default vendor codex cannot launch under this repo's containment; allowed_hosts lacks OpenAI; doctor should flag the contradiction
description: |
  ## Why
  This repo's `.aida/config.toml` sets `[agents] vendor = "codex"` (the default vendor) while containment is on. Containment refuses Codex (BUG-2144), so the default vendor is unlaunchable. Also, `[contained] allowed_hosts` lists api.anthropic.com and statsig.anthropic.com but no OpenAI endpoint, so even a contained Codex could not reach its model.

  ## Acceptance
  1. Add the OpenAI endpoints Codex needs to `[contained] allowed_hosts`, verified against the installed Codex CLI with both API-key and ChatGPT sign-in auth (at least api.openai.com; confirm whether chatgpt.com and auth.openai.com are needed).
  2. Resolve the vendor/containment contradiction until vendor-neutral containment lands: either the default vendor is one containment can launch, or containment is scoped so Codex launches with the contained-autonomous posture (STORY-1124 / ADR-31). The operator chooses which; record the choice in the config comment.
  3. `aida doctor` flags a project whose default `[agents] vendor` cannot launch under its own containment setting, naming both settings and the fix. Test with a fixture config.
