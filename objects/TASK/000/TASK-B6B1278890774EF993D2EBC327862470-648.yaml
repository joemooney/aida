- id: 01a194ad-6aca-73b1-8e15-00360896e30b
  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **AC1 (no automated test):** add api.openai.com, chatgpt.com, auth.openai.com to `[contained] allowed_hosts`. Verified by static inspection of the installed codex-cli 0.166.0 binary: API-key auth calls api.openai.com/v1/responses; ChatGPT sign-in calls chatgpt.com/backend-api/codex and refreshes tokens at auth.openai.com/oauth/token. A live sign-in run cannot happen inside this sandbox (egress is filtered); the PR says so.
    - **AC2' (unit):** `[contained.vendors]` parse (aida/native/invalid; native refused for agy/claude/unknown); `containment_posture` tri-state (aida/native/none) with `containment_applied` still false for native; `require_vendor_containment` / `require_child_containment` / `refuse_uncontainable_agent_tool` admit codex only with `codex = "native"`; under contained+native the headless codex argv drops `--dangerously-bypass-approvals-and-sandbox` for `--sandbox workspace-write`; Claude contained argv is byte-identical with and without `codex = "native"`.
    - **AC2' reporting (unit):** `aida config permissions show` / doctor permission-posture row reads `native sandbox, not AIDA-contained` for codex under native.
    - **AC3 (fixture):** the existing default-headless-vendor-refused finding names the vendor setting, the containment setting, and the fix (incl. `[contained.vendors] codex = "native"`); it does not fire once native is set.

    ### Expected files
    - `aida-cli-lib/src/session.rs`, `lib_part2.rs`, `config_cmd.rs`, `agent_config.rs`
    - `.aida/config.toml`
    - a new test module under `aida-cli-lib/src/tests/`

    ### Ambiguities / conflicts as questions
    - The launch banner and statusline surfaces are named in AC2'. If time runs out, should they be a follow-up finding? (Plan: yes, filed as kind:deviation.)
    - The operator decision (native for codex) supersedes the advisor's vendor=claude ruling. Planned: keep `vendor = "codex"` and set `codex = "native"`.
