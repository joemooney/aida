title: 'Glossary: pin down AIDA''s orchestration / session / autonomy machinery vocabulary'
description: |-
  AIDA's specs, docs, error messages, and agent-to-agent handoffs lean constantly on machinery terms — **orchestrator, phase, drain, lease, role, session** — but none of them is canonically defined. Readers (human and agent) infer the meaning from context, which works until it doesn't: this session alone produced a "are we calling that the orchestrator?" vocab-confirmation question, and several specs hinged on precise term use (BUG-241 "phase failure", "stale lease", "the orchestrator"). Precise shared vocabulary is what keeps the spec graph and docs coherent — pin it down.

  ## Deliverable

  Populate a glossary (via the \`/aida-glossary\` skill / its conventional location) with canonical, one-paragraph-each definitions of AIDA's orchestration + session + autonomy machinery vocabulary.

  ## Terms to define (the focused machinery set)

  - **orchestrator** — the running \`aida\` process executing \`aida queue work … --auto-complete\`; a Rust state machine (\`orchestrate()\` in \`auto_complete.rs\`/\`orchestrator.rs\`) that drives the 6-phase pipeline. NOT every \`aida\` invocation — only the \`--auto-complete\` run. Each invocation is one orchestrator instance (with a run-UUID — BUG-233).
  - **phase** — one of the orchestrator's 6 stages: implementer → CI → reviewer → merge → pull+auto-bump → build. Phases 1 & 3 spawn Claude Code sessions; 2/4/5/6 run deterministic commands.
  - **--auto-complete** — the flag that turns \`aida queue work\` from a single-session launcher into an orchestrator run.
  - **drain** — working a queue (or a batch) of specs through to completion; "drain the implementer queue."
  - **batch** — specs sharing a \`batch:NAME\` tag, drained as a unit (\`--batch NAME\`).
  - **autonomy modes** — the three-mode taxonomy (STORY-287): **default** (drive every step), **--zen** (advisor on standby — auto-resolve mechanical prompts, pause on design-forks), **--no-human** (absent — auto-resolve everything; design-forks punt).
  - **session** — an AIDA-tracked Claude Code session: a lease + worktree + role, tied to a scope.
  - **lease** — the ownership record for a scope (\`.aida/sessions/<id>.toml\`); prevents two sessions claiming the same scope.
  - **scope** — what a session owns: a SPEC, an EPIC, or a PR.
  - **role** — a workflow position: implementer / reviewer / dialog (advisor). Distinct from a Claude Code subagent — see \`docs/positioning/vs-claude-code-subagents.md\` (TASK-337).
  - **worktree** — the per-session git worktree a session works in (\`aida-<scope>\`).
  - **sentinel** — the graceful-exit signal file (TASK-329); skill touches it, orchestrator reaps the session.

  (Scope is the machinery set above — keep it focused; the glossary can grow. Do NOT try to define every AIDA concept in one pass.)

  ## Relationship to existing docs (avoid duplication)

  - \`docs/aida-discipline/lifecycle-vocabulary.md\` (STORY-255 discipline pack) already covers the **spec-lifecycle verbs** — committed / pushed / PR-opened / merged / completed / released, and done-vs-completed. The glossary should **cross-reference it, not duplicate it** — the glossary owns *machinery* terms; lifecycle-vocabulary.md owns *lifecycle* verbs.
  - Decide (at plan time): does the machinery glossary ship via the scaffolding pack? These terms mean the same thing in *every* AIDA project (every project has roles, sessions, leases, an orchestrator) — so it is generic, not project-specific. Likely yes — scaffold it, like the discipline pack. (The \`/aida-glossary\` skill is for *project-specific* terms; this is AIDA's own universal vocabulary — confirm the right home.)

  ## Acceptance

  - [ ] Glossary populated with the ~12 machinery terms above, one canonical definition each
  - [ ] Each definition is precise enough to disambiguate (e.g. "orchestrator" explicitly excludes plain \`aida\` invocations)
  - [ ] Cross-references \`docs/aida-discipline/lifecycle-vocabulary.md\` for lifecycle verbs — no duplication
  - [ ] Home location decided + documented: project glossary vs scaffolded universal glossary (recommend scaffolded — terms are universal)
  - [ ] If scaffolded: master under \`aida-core/templates/\`, embedded via build.rs, shipped by \`aida init\`
  - [ ] Linked from CLAUDE.md and/or OVERVIEW.md so a new session/agent can find it
  - [ ] Extensible — a clear "add a term" note; the glossary grows as new machinery appears

  ## Out of scope

  - **Defining every AIDA concept** — scope is the orchestration/session/autonomy machinery set; spec types, relationship kinds, etc. are separate
  - **Re-defining the lifecycle verbs** — that's \`lifecycle-vocabulary.md\`'s job; cross-ref it
  - **A formal ontology / typed term-graph** — it's a glossary (prose definitions), not a schema

  ## Composes with

  - **\`/aida-glossary\`** skill (the maintenance mechanism)
  - **\`docs/aida-discipline/lifecycle-vocabulary.md\`** (STORY-255 — the lifecycle-verb companion; cross-ref, don't duplicate)
  - **STORY-287** (three-mode autonomy taxonomy — source of the autonomy-mode definitions)
  - **TASK-337** (vs-claude-code-subagents — the glossary's "role" entry should point at it for the role-vs-subagent distinction)
  - \`feedback_precise_lifecycle_vocabulary.md\` (the discipline the glossary operationalizes for machinery terms)

  ## Origin

  2026-05-18: user asked "are we calling the instance of aida that calls the claude sessions / aida pull / build the 'orchestrator'?" — a vocab-confirmation question. The term IS used consistently (error messages, BUG specs, \`aida orchestrator status\`, \`orchestrator.rs\`) but never canonically *defined*. Across this session, term-precision recurred as a need (phase, drain, lease, stale-lease, false phase-failure). A glossary makes the machinery vocabulary one-definition-each so specs and agent handoffs stay coherent.
