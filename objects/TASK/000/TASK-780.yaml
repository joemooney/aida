title: 'aida questions subcommands: make WHO-runs-it / WHEN explicit in each command''s help'
description: 'Operator (2026-06-13): the ''aida questions'' subcommand help doesn''t say who runs each + when. Make the actor explicit per subcommand: ask = ADVISOR poses a question (distills a fork; not human-run); answer = HUMAN answers, no LLM session (the human-decision drain); clarify = INTERACTIVE human+agent (authors acceptance); sweep = advisor/automated detection; list = anyone (read). Lead each --help with a one-line ''Run by: <role>, when: <trigger>''. Mirrors the SPEC-IDs-out-of-user-output discipline — surface WHO/WHEN, the operator shouldn''t have to infer it.'
