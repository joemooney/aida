title: 'Host claude --bg lanes cannot run the LIGHT gate inside Claude''s Bash sandbox: cargo-slot dir and sccache socket are denied'
description: 'Observed 2026-11-02 (advisor fire wave, 12 host lanes). BUG-2395, BUG-2386 and other lanes stalled 30-80 min: make check-ci-fast queued forever for a cargo slot (the sandbox cannot write the slot directory, while cargo ps showed free slots), or failed with ''sccache: error: Operation not permitted''. The workaround was to run the gate outside the sandbox with RUSTC_WRAPPER= (the advisor did this for BUG-2395 b830e84). Related to BUG-2383, which covers headless lanes. Expected: the generated lane sandbox settings allow the cargo slot dir and the sccache socket, or the gate degrades to no-sccache automatically. Also seen: a stopped lane left its cargo/bwrap/claude process tree alive in the worktree, blocking the next reviewer (''in use by 15 live processes'').'
