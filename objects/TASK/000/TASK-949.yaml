title: 'TUI: no ''reject'' verb — advisor can approve a draft but not reject it'
description: 'Walkthrough finding (operator, 2026-06-26): the TUI has an ''approve'' verb (Draft->Approved) but NO ''reject'' verb (Draft->Rejected). The advisor disposition is incomplete — you can accept work but not reject it from the TUI; rejecting requires dropping to ''aida edit --status rejected''. Add a Draft-conditional ''reject'' verb (advisor-gated, like approve), ideally prompting for a brief reason (a rejection comment). Mirrors the approve verb.'
