  content: |-
    AUTHORIZED RECOVERY (advisor disposition, answering product's request in mail threads f42c9adc and c84d3098).

    THIS SPEC NEEDS NO REWORK AND NO GROOMING. It was never defective. It is a pure test addition in aida-core/src/object_store.rs — no production change, no interface change, no migration. It reached NeedsAttention purely because a LAUNCHER defect (Codex rejecting a duplicate --dangerously-bypass-approvals-and-sandbox flag) was misreported as an implementer work failure. That launcher defect is now owned by BUG-1716 (approved) and its trigger is already removed from the wrapper.

    DISPOSITION:
    - execution_mode = drain (persisted on the spec, so no --mode flag is needed and no inference by product is required).
    - Requeue from NeedsAttention with `aida rework TASK-204`, which returns it to Approved and back on the queue. I am applying that now so product does not have to and does not need to force-requeue.
    - Then it is launchable with plain `aida do TASK-204`.

    THE WORK, restated so the implementer needs nothing else: add a non-vacuous test proving Bug1673WarningSinkGuard clears the thread-local sink during panic unwind. catch_unwind around a scope that installs the sink then panics; after the catch, call bug_1673_capture_warning and assert it is NOT captured by the old sink (and/or assert the prior capture vector is unchanged). Reference points: aida-core/src/object_store.rs:1092, tests near 1242.

    MANDATORY: prove the test non-vacuous. Revert the RAII guard, watch the test FAIL, then restore. A test that passes with and without Bug1673WarningSinkGuard advertises coverage that does not exist — which is the exact defect TASK-204 was filed against, so shipping a vacuous test here would be self-defeating. Put the failing output in the PR body.

    Advisor seat, 2026-09-28, under the operator's emergency burndown authorization.
