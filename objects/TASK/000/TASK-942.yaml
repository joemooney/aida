title: TUI create ('n') should link the new draft to the active focus epic
description: 'Walkthrough finding (operator, 2026-06-26): when focused on an epic and pressing n to create a draft, the new spec gets NO parent edge, so the focus lens immediately HIDES it — the operator sees their new spec vanish (''I created a spec but it was not made a child of the focus epic''). FIX: when a focus epic is active, n sets the new spec''s parent to the focus epic (bidirectional rel add) so it appears in the cockpit. Without a focus, behavior unchanged.'
