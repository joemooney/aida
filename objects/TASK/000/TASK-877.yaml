title: User/project-defined aliases (aida alias add/list/remove) — full personal+project (decided 2026-06-22)
description: 'OPEN QUESTION FOR OPERATOR (recorded 2026-06-19, do not build yet). Idea: aida alias add <name> "<expansion>" for custom aliases. Advisor pushback to resolve first: (1) the PERSONAL case is already solved by shell aliases/functions (alias al=''aida list'') - an in-aida personal-alias system just duplicates bash/zsh for no gain; (2) the ONLY differentiated form is a PROJECT-LEVEL git-tracked [alias] (like git''s .gitconfig [alias]) - shareable across a team, available where shell aliases are not (CI, fresh clones); (3) BUT that adds an expansion layer (shadowing real commands, recursion guards, parsing) AND a real concern: AGENTS should use canonical commands, not a human''s idiosyncratic aliases - custom aliases could HURT agent legibility (the substrate''s value is a stable canonical surface). RECOMMENDATION: ship the built-in alias registry (the companion STORY) first; revisit user/project aliases only if the built-in list proves insufficient, and if so limit to PROJECT-level (not personal, which is the shell''s job) and EXCLUDE alias expansion for agent/headless/MCP callers (canonical-only for agents). Decide scope on operator input.'
