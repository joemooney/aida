title: 'deputy: cancel-before-run also writes its .out note; orphaned jobs still rely on any partial output'
description: |
  Beyond the refused-job fix, a job cancelled before it ran (sweep_cancel_requests, aida-cli-lib/src/deputy/worker.rs) now also writes a one-line note to the .out file its result names, for the same reason: its result pointed at a file that was never created. Orphaned jobs (recover_orphans) were left unchanged: a job that started already has an .out file, but if the deputy died between claiming the job and opening the file, the result would still name a missing file.

  Raised by the implementer while working BUG-B6B1278890774EF993D2EBC327862470-150.
  Branch: bug-b6b1278890774ef993d2ebc327862470-150 · Commit: 9179020a5f9 · PR-3179
