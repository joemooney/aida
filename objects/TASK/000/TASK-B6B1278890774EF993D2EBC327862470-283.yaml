- id: 01a1952c-ecbc-72f3-825a-71ba43b048bc
  author: joe
  content: |-
    ## Implementer approach

    No parseable acceptance section; scope taken from the description: close the remaining gap — an orphaned job whose deputy died before opening its .out file must not leave its result naming a missing file.

    - `recover_orphans` (aida-cli-lib/src/deputy/worker.rs) appends a one-line note via the existing `write_out_note` (creates 0600 if missing, appends otherwise so partial output is kept).
    - Test: extend `orphans_are_failed_not_rerun` (unit, deputy/tests.rs) to assert the note exists for a never-opened .out, and add a case asserting partial output survives with the note appended.

    Expected files: worker.rs, tests.rs. Ambiguities: None.
