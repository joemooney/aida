description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-1796, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  BUG-1796 acceptance item 3 requires a byte-identical test of normal two-remote pull output. The added bug_1796_normal_two_leg_pull_headings_keep_their_legacy_bytes test only compares two formatting helper strings; it does not run handle_pull_command/aida pull with both remotes configured, capture the resulting output, or compare it to the pre-change output. Add a full-path regression test that configures both remotes and pins the complete normal pull output byte-for-byte.

