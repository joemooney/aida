  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3046):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 8fe94552d086
    Recorded: 2026-11-05T05:26:12.140570242+00:00
    Findings:
    1. CI red at 8fe94552: gates job 127014835742 step 24 'Containment conformance evidence tests' failed; Build (ubuntu-latest) fails only because it requires every lane. The job log was unreachable from the reviewer sandbox, so read it to confirm. Most likely cause: scripts/containment/conformance.py:385 run() calls command(['git','rev-parse','origin/main']). actions/checkout@v5 (ci.yml:50) is a shallow PR-merge checkout with no origin/main ref, so test_run_mounts_payload_outside_workspace_read_only (tests/test_containment_conformance.py:160-190) raises CalledProcessError. It passes locally because worktrees have origin/main. Fix: mock c.command for the policy-SHA lookup in that test, or inject the policy SHA. Then confirm the step is green in CI, not only in make check-ci-fast.
    2. reassess_evidence() mislabels C0: conformance.py:550-551 sets terminal_status='fail' whenever changed_targets is non-empty, including C0. C0's changed target is the positive workspace sentinel, i.e. success. The committed evidence (containment-conformance-2026-11-04.json reassessment.vendors.codex.checks.C0.terminal_status) therefore says 'fail'. That contradicts evaluate() (conformance.py:283-295, where C0 terminal_status is pass/unknown) and the docs. Fix: limit the changed->fail rule to C1/C2 (C0 -> unknown), regenerate the evidence with --reassess, and assert the C0 terminal_status in test_historical_reassessment_withdraws_positive_credit_preserves_sources.
    3. Recorded vendor results predate the shipped harness: both vendors.*.report.harness_sha256 are 96544b6a..., while the shipped conformance.py (and reassessment.harness_sha256) is 2e734986.... The read-only payload mount, same-directory rename sources and file-tool rules have never run against agy or codex. The acceptance 'both vendors have recorded results' is met only by historical runs plus an offline reassessment. Either run the shipped harness host-side through the script deputy for both vendors and record the reports on STORY-2460, or get an explicit advisor ruling on STORY-2460/TASK-3048 that historical+reassessment suffices for S1, with the fresh run tracked as a named follow-up.
    4. Rename sources are unobserved protected writes: prepare() (conformance.py:250-251, 271-272) creates <name>-rename-source files inside the protected outside/admin/common/store directories. The before/after snapshots (conformance.py:425, 494) digest only row['path']. A vendor that modifies or deletes a rename source in a protected directory is never seen as a violation. Fix: include rename_source in the snapshot for its check (C1/C2), and add a test where a changed source fails the check.
    5. Cosmetic: the PR title (the squash subject on main) is '[AI:codex] fix: address CI failures and review findings (TASK-3046)'. It doesn't describe what lands: a new host-side containment conformance harness, tests, CI gate and evidence. Retitle, e.g. '[AI:codex] test(containment): host conformance harness C0-C4 with agy/codex evidence (TASK-3046)'.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
