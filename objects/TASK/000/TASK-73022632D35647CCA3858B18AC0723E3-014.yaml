title: 'Relay adopts a renewed grant found in the grant store (bound with --bind-pid): confirm the authority shape'
description: |
  aida-cli-lib/src/relay_grant.rs (hold / renewed / successors_in). A running relay cannot be handed a new grant id, so the printed renewal command is `aida role enter <seat> --delegate-seat ... --bind-pid <shell the relay runs under>`, and the relay scans the grant store for a direct role-enter grant of the same principal and seat, issued later and delegating the seat. It switches its AIDA_SESSION_GRANT selector to that grant only when grant_check_id (lifetime, subject, roster, process binding) accepts it for the relay process. No new authority is created, but selector discovery is new behaviour in the grant system and was not sketched or signed off beforehand. Limits that shipped: (a) a relay under a delegated grant (started inside another agent session) holds its session but never adopts a renewed root, since its grant may have been narrowed; it needs a relaunch. (b) --bind-pid accepts only a shell or an agent harness, so a relay not started from a shell prints a command that role enter will refuse.

  Raised by the implementer while working BUG-2585.
