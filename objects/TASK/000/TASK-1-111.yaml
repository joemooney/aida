  content: 'DECISION (operator, 2026-05-31): skip-shelve + short retry. On phase-1 GH-verify inconclusive: (1) retry the verify a few times with backoff (e.g. 30s/1m/5m), then (2) if still inconclusive, SHELVE the spec (NeedsAttention + FailureReason ''PR verification inconclusive — GH unreachable'') and ADVANCE the batch to the next member, returning to the shelved one at end — instead of pausing the whole batch. Route through the existing EPIC-28 shelve-and-advance path (don''t invent a new one). Implementation autonomous; end-to-end validation wants a supervised drain. — master/advisor'
