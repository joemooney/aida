title: 'strip_bypass_flags() is untested and over-strips: declining bypass also drops a…'
description: |
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1500, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  strip_bypass_flags() is untested and over-strips: declining bypass also drops a non-bypass --permission-mode value (e.g. acceptEdits), silently downgrading further than intended. Fails safe (native), so not merge-blocking, but it is the security-critical path and deserves a unit test.

  PR: #2259
  Reviewed sha: c94e62801d886cc16c845f1917dd0194d002dc71

  ## Current behaviour (aida-cli-lib/src/bypass_confirm.rs:106)

  The stripper drops `--permission-mode` and unconditionally skips the NEXT argument, whatever it
  is, and separately drops any bare `bypassPermissions` token anywhere in argv. Three consequences:

  1. **Over-strip.** `--permission-mode acceptEdits` is removed entirely, so declining bypass
     downgrades past the operator's actual intent to the harness default. This is the filed finding.
  2. **Collateral over-strip.** A bare `bypassPermissions` token is removed wherever it appears,
     including as an unrelated positional argument or prompt word.
  3. **Under-strip.** The `--permission-mode=bypassPermissions` equals form matches neither branch,
     so the bypass SURVIVES a declined confirmation. AIDA's own call sites
     (config_cmd.rs, compete.rs) only ever build the space-separated form, so this is hardening
     against operator-supplied passthrough args rather than a live exploit — but it is the one
     direction of the bug that fails OPEN, and a stripper on the security path must not have one.

  ## Acceptance

  1. `strip_bypass_flags` removes `--permission-mode` **and** its value only when that value is
     `bypassPermissions`. Any other `--permission-mode <value>` pair survives the strip intact,
     value included.
  2. The `--permission-mode=bypassPermissions` equals form is stripped. No spelling of the bypass
     mode survives a declined confirmation.
  3. `--permission-mode=<non-bypass>` survives intact.
  4. `--dangerously-bypass-approvals-and-sandbox` and `--dangerously-skip-permissions` are still
     removed wherever they appear.
  5. A bare `bypassPermissions` token that is NOT the value of a preceding `--permission-mode` is
     left alone; argument order and every other argument are preserved exactly.
  6. Unit tests in `bypass_confirm.rs` cover each of 1–5, including a trailing
     `--permission-mode` with no value at all (must not panic and must not silently eat a
     following argument that does not exist). Each new assertion carries a non-vacuity proof:
     state which one fails against the current implementation.
  7. No behaviour change for the `Decision` matrix — `confirm_bypass_decision_matrix` stays green.
