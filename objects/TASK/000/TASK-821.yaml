title: 'BUG-559 substrate slice: actionable guidance when a fresh clone has aida-store checked out (auto-attach resilience)'
description: 'Substrate-lane slice of BUG-559 (the GitLab-store-now gate). When a fresh clone lands with the orphan aida-store branch checked out as the working tree (GitLab push-to-create adopts the first-pushed branch as default), the auto-attach path (try_attach_store_worktree -> git_ops::fetch_branch_into_local) fails with a raw git error: ''refusing to fetch into branch refs/heads/aida-store checked out at <clone>''. Detect that specific state and return actionable guidance (''this clone has the internal AIDA store branch checked out; run git checkout main, then re-run'') instead of the cryptic git error. Locally verifiable (simulate aida-store checked out). The SOURCE fix (a: init/glab sets the GitLab default branch to main) needs the GitLab env + glab and is coordinated with the forge lane / product seat; this slice is the substrate-side resilience. Parent BUG-559.'
