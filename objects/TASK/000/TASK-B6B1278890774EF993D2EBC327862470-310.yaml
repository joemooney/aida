title: 'aida-doctor ≈ aida-recover: ~80% scope overlap — consolidation candidate.'
description: |-
  aida-doctor ≈ aida-recover: ~80% scope overlap — consolidation candidate.

  Both skills walk a state-divergence diagnostic battery over the same substrate:
  - aida-doctor: "diagnose and heal multi-agent state drift: stale leases, obsolete briefs, orphan worktrees, orphan branches" (+ heal/mutate)
  - aida-recover: "structured diagnostic battery — session leases, git worktrees, GitHub PRs, spec graph, orchestrator/queue" (+ walk-the-operator/advisory)

  The functional difference is doctor HEALS (mutating) while recover WALKS the operator (advisory) — that's a --heal flag, not two separate skills. Recommendation: merge into one skill (advisory default + --heal), reducing two catalog entries to one. Surfaced during the 2026-05-29 skill-catalog slop audit (docs/aida/skill-catalog-audit-2026-05-29.md). Recurrence-gate: act when a third state-recovery skill/flag is proposed, or at the next catalog audit. Read-only finding — no urgency, but it's the sharpest existing slop in the 39-skill catalog.
