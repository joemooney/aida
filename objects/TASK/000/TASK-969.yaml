title: 'Config trust boundary: load code-executing config from the trusted default branch SHA'
description: no-mistakes loads process-launching config (test/lint/format commands, agent) only from a pinned default-branch SHA, fail-closed, so a pushed branch cannot self-enable. AIDA runs hooks + [intake]/config + cargo/gh from worktrees off arbitrary branches; a malicious branch editing .aida/config.toml or a hook is a comparable RCE vector. For drain/CI commands sourced from project config/hooks, read code-executing fields from the trusted default branch. Document in docs/security/.
