title: Node-local host counter now jumps past the highest filed number instead of filling gaps (contained-add fix)
description: |
  For node-local clones, CloneDispenser::next now calls Dispenser::next_above(prefix, filed_high_water) (aida-core/src/allocation_authority.rs). The host counter becomes max(counter, highest number this node already has in objects/) + 1 in one locked write, so the host skips past numbers a contained session minted without advancing the counter in .git. Side effect: a node-local counter that was behind the store for any other reason (imported or migrated objects) now jumps past the highest filed number. Before, it filled free gaps and failed after 64 consecutive taken numbers. Also new: each node-local next() lists objects/ once, which is cheap but O(store size). Contained mints need the caller to hold the store write lock (add_requirement and mint_spec_id both do). Any other caller in a contained session gets a clear refusal.

  Raised by the implementer while working BUG-b6b1278890774ef993d2ebc327862470-053.
