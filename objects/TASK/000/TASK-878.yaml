title: Auto-GC merged Agent-tool worktrees (worktree-agent-*) — they accumulate + cause stale-branch false-positives
description: 'Incident 2026-06-19: 98 Agent-tool isolation worktrees (.claude/worktrees/agent-*) had accumulated over a fan-out-heavy session - never pruned because git worktree prune only removes worktrees whose DIR is gone, and these keep their dir + a worktree-agent-<id> branch. Consequences: disk clutter AND stale local branches that make aida human''s reviews-awaiting (and possibly other branch-derived views) false-positive on already-merged work (see the companion BUG). FIX: a safe auto-GC for merged agent worktrees - extend aida doctor''s existing dead-PID/lease reaping (or a new aida worktree gc / aida doctor --heal category) to remove worktrees whose branch''s PR is MERGED (or branch fully in main), NEVER removing worktrees with unmerged commits (clean != no work - verify before delete). Respect the destructive-heal-needs-signoff rail (STORY-666): in autonomous context, removing worktrees is destructive -> gate it. Manual best-effort cleanup of the current 98 was done this session (down to ~3 unmerged).'
