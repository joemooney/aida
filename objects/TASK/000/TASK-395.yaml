  content: |-
    Verify-first (2026-06-05, advisor loop): already satisfied by `aida headless tail` (shipped under TASK-398 / TASK-487). It meets every substantive acceptance criterion:
    - follow output across one/all specs without knowing the worktree path → `--list`, no-arg picks newest, SPEC-ID or lease-prefix targeting
    - human-readable by default (clean assistant prose) with `--with-tools`/`--tools-only`/`--include-user` filters; `-n/--no-follow` to print-and-exit
    - works concurrently with the drain (tail -f polling, no daemon, no impact on the session); `--since` window filtering
    - documented in docs/autonomous-drain.md (lines ~138, ~488)
    The spec's `--raw` suggestion is redundant — the `.aida/headless-logs/*.jsonl` file IS the raw stream, and `--list` prints its path. The chosen verb is `aida headless tail` rather than `aida logs tail`, but the capability is complete. Closing as done-by-supersession rather than building a duplicate surface.
