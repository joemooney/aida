title: STORY-2894 S1 is about 640 non-test changed lines, against the 300-line slice budget
description: |
  The brief capped S1 at 300 changed lines. After rustfmt, the S1 diff is about 640 non-test lines and about 1050 with tests. The lines are in gate/train_generated.rs (~280), pr_train_regen.rs (~230), the driver's train phase in scripts/repair-generated.py (~95), and small wiring edits in pr_train.rs, pr_train_verified.rs and seat_clone.rs. AC1 bundles six components (REGISTRY rows with --baseline, the gate table with both ratchets, the driver train phase, the regen commit, the PR-body block and the journal record), and none can be dropped without leaving AC1 unmet. If the reviewer wants it smaller, it splits cleanly into (a) the Python REGISTRY rows, --baseline and train phase with their Python tests, and (b) the Rust gate table plus the live train wiring.

  Raised by the implementer while working TASK-3963.
