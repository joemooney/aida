    ? AC (0.98) — A corroborated live drain takes precedence over a requirement's terminal store status: `aida why <spec>` still classifies a completed spec as `in-flight`, including during reviewer and merge phases.
    ? AC (0.97) — `aida status <spec>` must not apply its worktree-idle stale threshold while that spec is owned by a corroborated live drain, regardless of the reported idle duration.
    ? SEM (0.96) — Drain liveness is recognized only when two runtime facts agree: the drain state contains the spec as a running member and `.aida/drain.lock` names a currently live PID; stale state or a dead/missing lock does not make the spec live.
    ? AC (0.94) — Machine-readable `why --json` reports live drain ownership with `bucket: "in-flight"`, `needs_human: false`, and a `drain` object containing normalized `phase` and `orchestrator_pid`; `status <spec> --json` exposes the same `drain` object.
    ? SEM (0.86) — For the drain's current spec, phase reporting prefers the drain state's top-level `current_phase`; for other running batch members it uses that member's own state.
    ? AC (0.88) — When `aida ps` overlays a live drain onto an existing lease row, it reports the orchestrator PID and a `drain <phase>` role, removes any dispatch attribution, and suppresses any contradictory orphan entry for that spec.
