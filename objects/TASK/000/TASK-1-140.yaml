  content: 'Reviewer round 1 on PR #1968: TASK-163: handle_why checks Completed/Rejected and returns before live_drain_spec; during the expected Done review/merge phases, aida why reports closed instead of the live drain phase and orchestrator PID. Move or integrate the live-drain check ahead of terminal handling and add an end-to-end regression for the Done + live phase-3/4 case.  The finding matters because Done is precisely the state a spec sits in during phases 3-6 (review, merge, pull, build) — the window where someone is most likely to ask ''is this still being worked?''. Concretely: in handle_why, consult live_drain_spec BEFORE the Completed/Rejected/Done terminal short-circuit, and when a live drain owns the spec report the phase and orchestrator pid instead of the closed line; keep the terminal line for a spec with no live drain. Regression test: spec Done + a live drain record in phase 3 or 4 → aida why names the phase and pid, not ''closed''.'
