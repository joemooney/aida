title: STORY-2824 touches gate-protected paths (gate/approval.rs, gate/review_marker.rs and their tests) to add read-only variants
description: |
  The train member gate was not write-free: observe_merge_path_approval_gate recorded held-gate events, an activity line and carry-over answers; enforce_corpus_decision armed a hold marker and label on a blocking verdict; review_marker::merge_gate removed expired markers; resolve_forge_kind could rewrite .aida/config.toml. For --check to change nothing I added peek_merge_path_approval_gate (merge_path_approval_decision now skips its event and activity writes when the CarryOverSite has append=false; every existing caller passes append=true, so their behaviour is unchanged), review_marker::merge_gate_peek, forge::peek_forge_kind, and a read_only flag on LiveChecks / MemberChecks. Files under aida-cli-lib/src/gate/ and gate/tests/ are protected, so this PR likely needs a human merge. Residual writes the check still makes, none of them labels, holds or journal: git fetches of the head and base (remote-tracking refs, loose merge-tree objects), a short-lived refs/aida/confirm/<uuid> when a rider's train is probed, creation of .aida/ownership/.lock if missing, and the store's first-load side effects.

  Raised by the implementer while working STORY-2824.
