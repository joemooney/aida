title: 'Phase 3: per-role Claude Code system-prompt addenda via SessionStart hook'
description: |-
  Implements the second Phase 3 deliverable from EPIC-1-005: per-role text injected into Claude Code's context at session start, so the agent sees role-specific instructions automatically when the user is wearing a particular hat.

  ## Schema

  Add to RoleState (TOML, serde default for back-compat):
  - system_prompt: Option<String> — free-form text shown to the model on session start

  ## CLI

  - aida role prompt set [--name X] <content>  — set the addendum
  - aida role prompt show [--name X]            — print it
  - aida role prompt clear [--name X]           — remove it
  - aida role show — extended to indicate when an addendum is set

  ## Hook

  New aida-core/templates/hooks/aida-role-context.sh fires on SessionStart:
  - Reads AIDA_SESSION_ROLE from env (skips silently if absent)
  - Looks up the role's TOML in .aida/roles/ then ~/.aida/roles/
  - Emits JSON envelope: {hookSpecificOutput: {hookEventName: SessionStart, additionalContext: ...}}
  - Content includes role name, purpose, system_prompt addendum

  Wire into templates/settings.json under SessionStart so .claude/settings.json (which is a symlink) picks it up automatically. Add a per-file symlink at .claude/hooks/aida-role-context.sh for this repo.

  ## Out of scope

  Seeding default system_prompt text for the starter roles (dialog, implementer, etc.) — that's a content-design decision worth its own task. This slice ships the mechanism only.
