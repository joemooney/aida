title: 'aida status: surface active leases + worktrees (what''s actually in flight)'
description: "Empirical UX gap 2026-05-23 morning: user ran `aida status` while Codex (STORY-429) and Antigravity (TASK-340) were both actively working in sibling worktrees. The status output showed nothing about either — no active leases section, no worktree listing.\n\nActual concurrent state at the moment of `aida status`:\n- Lease: 019e5590 TASK-340 implementer in /home/joe/ai/aida-task-340 (Antigravity)\n- Worktrees: /home/joe/ai/aida-story-325, /home/joe/ai/aida-story-429, /home/joe/ai/aida-task-340 (plus main)\n\nNone visible in status output. Operator's natural question 'what's running right now? where is each agent?' requires running `aida session leases` + `git worktree list` separately.\n\n## Proposed addition\n\nNew section in `aida status` between 'Queue' and 'Project':\n\n```\n─── Active sessions ───\n  019e5590  TASK-340  implementer  task-340-2  /home/joe/ai/aida-task-340  (Antigravity)\n  (no other active leases)\n\n─── Worktrees ───\n  /home/joe/ai/aida                main                  ← current shell\n  /home/joe/ai/aida-story-325      story-325            \n  /home/joe/ai/aida-story-429      story-429             ← Codex (no lease registered)\n  /home/joe/ai/aida-task-340       task-340-2            ← Antigravity (lease 019e5590)\n```\n\nThe 'who is here' annotation (Codex/Antigravity/master) could be inferred from lease role + worktree path, OR from the worktree's recent commit author. Optional polish — even raw lease+worktree listing without that inference is a huge improvement over the current invisibility.\n\n## Acceptance\n\n- [ ] `aida status` includes an 'Active sessions' subsection when leases exist; omits cleanly when none\n- [ ] `aida status` includes a 'Worktrees' subsection listing project worktrees (filtered to project-relevant; skip .aida-store and .worktrees/* internal-use ones)\n- [ ] When a worktree has an active lease, the listing shows the lease ID + role\n- [ ] Current shell's cwd is marked clearly (← annotation or similar)\n- [ ] Regression test: with N leases + M worktrees, status output includes both sections in correct format\n\n## Composes with\n\n- TASK-490 (sibling — surface In Progress queue items; same 'what's running' UX class)\n- TASK-486 (cross-platform CI status — same release-readiness signal coherence)\n- TASK-474 / TASK-489 / TASK-491 (operator-control + scope UX cluster)\n\n## Priority rationale\n\nMEDIUM. Real friction (user just hit it this morning). Operators running multi-agent drains need instant 'who is where, what's running' awareness. Currently requires multiple shell-outs to assemble."
