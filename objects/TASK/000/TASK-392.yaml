title: Align "→ next:" / "→ Next:" capitalization between finish-state rubric and skill templates
description: |-
  TASK-359 added the finish-state communication rubric in `aida-core/templates/docs/aida-discipline/session-discipline.md` and its first applications in `aida-pickup.md` (Step 6) and `aida-pr.md` (orchestrator-mode closing block).

  The rubric writes the closing-summary lead-in as **`"→ next: <action>"`** (lowercase 'n'):

  > For conclusions: an explicit *"→ next: <action>"* line that names the user-action.

  But both implemented closing-block templates write it as **`"→ Next:"`** (capital N):

  - `aida-core/templates/skills/aida-pr.md` interactive variant: `→ Next: press Ctrl+D to exit...`
  - `aida-core/templates/skills/aida-pr.md` auto-exit variant: `→ Next: session will auto-exit via $AIDA_EXIT_SENTINEL...`

  Pure cosmetics — a human reading either understands both. But if a future rubric-compliance grep checks templates against the canonical rubric string, the two will not match.

  Fix: pick one (capitalized 'Next:' reads more like a heading marker — preferred) and align the rubric prose. Two-character edit in `session-discipline.md`; no behavioural change.

  Raised in review of PR-121: https://github.com/joemooney/aida/pull/121#issuecomment-4496061354
