    Rejected as a DUPLICATE of TASK-202, not as an invalid finding — both describe the SAME defect at the SAME lines.

    TASK-202 (carried from TASK-1547) and this spec (carried from TASK-1556) both land on aida-cli-lib/src/doctor_cmd.rs:5865-5881: the store-repair guard validates a canonical .aida-store path, a .git file, distinct git-dir/common-dir and branch `aida-store`, but never checks that the common-dir belongs to THIS project — so a foreign user repository linked at .aida-store on an `aida-store` branch passes, and the healer appends and commits into it. This spec's own text says "PR blocker shared with TASK-1547".

    TASK-202 is the surviving spec: it names both the fix (compare canonical git common-dir with the main project) and the missing test (a foreign-linked-worktree rejection fixture). Kept and approved there.

    The RequestChanges instruction in this spec's body is moot: PR #2243 is already merged and TASK-1547/TASK-1556 are both completed, which is why the finding was carried forward rather than blocking.

    Triaged by the advisor seat under the operator's 2026-09-28 emergency burndown authorization.
