title: Agent-facing token-efficient output mode (adopt AXI output principles; keep emoji human path)
description: 'AIDA scores ~4-5/10 on the AXI 10 principles; the misses are concrete: token-efficient output (we print emoji/tables, --json is verbose JSON not TOON), content-first no-args (bare aida shows help not live data), minimal default schemas, structured errors. Add an AGENT-FACING output mode (e.g. AIDA_AGENT_OUTPUT / --toon / detect non-TTY agent caller) that emits token-efficient minimal-schema output with pre-computed aggregates + next-step disclosure. The human emoji path stays UNCHANGED (operator likes it; this is the agent path only). Gated on/informed by the SPIKE decision on MCP-vs-CLI weighting.'
