    - LOW-risk paths converted opportunistically: workspace.rs, jira/config.rs, workflow_hints.rs, docs.rs.
    - Concurrent-writer stress tests on the dispenser counter + session manifest + generic write_atomic; grep-guard tests fail if a bare fs::write regresses into a known-concurrent file.

    Test status: aida-core lib 251/251 + aida-cli bin 631/631 green; cargo fmt + clippy clean on touched files.
