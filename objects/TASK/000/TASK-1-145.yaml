  content: 'Re-diagnosed by the advisor and confirmed: this is NOT doc drift. Running docs/cli/verify-manual.py against current main exits 0 with all four checks green, and the three cited flags are present in the current binary (mailbox send --stdin, mailbox send --body-file, schedule tick --hook). The red came from TASK-1289''s own preflight guard checking a STALE binary: verify-manual.py compares the manual against the installed binary''s --help output, so a worktree whose source adds or renames a flag fails the guard until the binary is rebuilt. Dismissing as a finding; the real defect is folded into TASK-1289''s rework brief as a design requirement.'
