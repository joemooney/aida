title: Deploy the supplied codegraph query client on the dirtlab host
description: |
  STORY-2844 lane: the project-supplied /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent or not executable, and aida doctor check codegraph reports codegraph missing from PATH. Host action: deploy the reviewed query client under the primary checkout .codegraph/proxy-state/bin/codegraph and supply its absolute host path to lane prompts. Navigation used rg without deriving a seat executable or modifying an index. This did not block implementation.

  Merged in 2026-11-17 (product groom): TASK-3136 reports the same missing client in the native lane on the primary host (BUG-2643 lane). Both hosts are in scope.

  ## Acceptance
  1. The reviewed codegraph query client is installed at the path lane prompts name, on both the primary host and dell1 (dirtlab), and is executable.
  2. `aida doctor check codegraph` passes on both hosts, run inside a lane job (not only from the operator shell).
  3. When the client is absent, the lane prompt either omits the codegraph instruction or says "codegraph unavailable on this host; use rg", instead of naming a path that does not exist.
  4. Operator/host action is recorded here (who installed it, version or sha, date).
