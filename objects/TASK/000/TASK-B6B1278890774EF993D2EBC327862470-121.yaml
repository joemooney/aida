    ## Implementer findings (could not file as draft TASKs: `aida add` failed with "requirement ID allocation failed: Read-only file system" in this sandboxed seat)

    1. **kind:deviation, minor.** The TTY offer to pick an approved unclaimed spec on a scope refusal was not built. Under the 18:30 operator ruling, generic implementers are a pool, so that refusal no longer fires for them. The remaining refusals (singular roles, same-spec clashes) name the fix in text but offer no picker.
    2. **kind:design-choice, minor.** Role mail to the pool (`agent_registry::POOL_ROLES = [implementer]`) now queues one bind-once delivery (STORY-1843 D1 path) instead of fanning out to every live member. The pool is hard-coded; a configurable `[agent_registry] pool_roles` would need a config-trust classification.
    3. **kind:bug-spotted, minor.** 9 `aida-cli-lib` agent_registry/agent_launcher unit tests fail inside a contained seat for environmental reasons:
       - the hermetic HOME is read-only;
       - the `AIDA_CONTAINED` passthrough guard refuses the launch;
       - the seat's own identity leaks into the registry tests.
       None touch this change; the new and related tests (9) pass.

