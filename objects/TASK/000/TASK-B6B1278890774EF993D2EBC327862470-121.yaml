  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-b6b1278890774ef993d2ebc327862470-121):
    Verdict: CHANGES REQUESTED
    Reviewed commit: cd9ebe60464d
    Recorded: 2026-10-30T03:28:02.146631535+00:00
    Findings:
    1. Unmet acceptance (original AC): 'at a TTY, offers to pick an approved unclaimed spec from the queue for this role' is not built. The 18:30 ruling widened the acceptance and did not remove this clause, and the refusal still fires at a TTY for a same-spec implementer clash and for singular spec-scoped roles (reviewer). Either build the picker in enforce_agent_singleton_preflight's refusal path (agent_launch.rs:~4024), guarded by stdin/stderr TTY and not AIDA_HEADLESS, or get the advisor to amend the spec acceptance to drop it. The implementer's self-declared deviation comment is not a waiver.
    2. Regression: agent_launch.rs:2618-2635 (foreground) and :2913-2923 (--bg) now run enforce_agent_singleton_preflight BEFORE maybe_handle_agent_resume_or_duplicate. That function handles resume.direct_target (agent_launch.rs:1988) and returns before any singleton check, so 'aida agent new <vendor> --role reviewer --resume <id|latest>' used to bypass the preflight. It is now refused whenever a live same-role agent shares the launch cwd scope, and that check uses the launch cwd/role/spec, not the resumed entry's own scope. Skip the early preflight when resume.direct_target is set, or move the direct-resume branch ahead of it, and add a test.
    3. Untested refusal ordering: the core original acceptance (scope conflict refused before the bypass consent and resume prompts) is shown only by code order. No test proves enforce_agent_singleton_preflight fires before gate_agent_bypass / the resume picker on either the foreground or --bg path. Add a regression test, e.g. a conflicting live reviewer row plus a launch that would otherwise reach gate_agent_bypass, asserting the scope refusal error and no consent interaction (an injectable consent seam or a headless env that would make the bypass gate fail differently).
    4. Minor (mailbox_resolver.rs:528-532): a pool-role send where every live implementer is UUID-less (cohort.readers empty, cohort.uuidless non-empty) without --queue-for-role leaves cohort.queued=false and still refuses or fans out like a non-pool role. Under the pool semantics (one taker), role mail to a pool with any live reader should queue. Use '!cohort.readers.is_empty() || !cohort.uuidless.is_empty() || queue_for_role' or document why not, and cover it in pool_role_mail_queues_for_one_taker_instead_of_fanning_out.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
