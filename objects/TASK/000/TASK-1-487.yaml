  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1952, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): drain_lock.rs stamp_drain_lock_child_grant read-modify-writes the lock without serialising against a concurrent acquire_drain_lock takeover, so it could overwrite a successor's lock with ours. Re-check the pid after the write, or reuse the acquire lock.

