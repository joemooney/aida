title: aida queue move --help leaks trace:STORY-72 via the --after field doc comment
description: |
  The `--after` field of `QueueCommand::Move` has a `///` doc comment ending
  `... anchor. trace:STORY-72 | ai:claude` (aida-cli/src/cli.rs:2295-2299).
  Because it is a `///` doc comment on a clap field, the `trace:STORY-72`
  marker leaks into `aida queue move --help` output — the both-at-once trap
  CLAUDE.md warns about, a TASK-268 violation (SPEC-IDs must not appear in
  user-facing CLI text).

  Fix: split the trace marker onto a separate plain `//` line, the same
  shape TASK-280 used for the `top` / `bottom` / `to` fields it added in
  this PR (cli.rs:2277, 2282, 2289).

  Pre-existing — not introduced by PR-74 — and explicitly flagged by the PR
  author in the reviewer note as out of scope, worth a follow-up filing.

  Raised in review of PR-74: https://github.com/joemooney/aida/pull/74
