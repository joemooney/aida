title: 'agent gc: a pruned worktree''s era marker misses its lease when git collision-suffixed the admin name (name1)'
description: |
  aida-cli-lib/src/agent_registry_root.rs LeftoverOwners::judge matches Owner::Worktree(admin) to a lease by comparing the admin name to the worktree basename. When git collision-suffixes an admin name (for example `lane` becomes `lane1`), the names differ. A live lease is then missed, and the marker's owner can be judged Dead. This was the second note in TASK-3478's description. It was left out because TASK-3478's grooming approval covered only the anchor-level temps.

  Raised by the implementer while working TASK-3478.
