    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: TUI Catppuccin/Nord theme system is explicitly polish ("post-alpha"); the TUI is "the product" but phase is bug-clear→stability→marketing. Build now or defer to the marketing/first-impression phase?
      a) Defer to the marketing phase — theming is a first-impression lever best timed with visibility work, not during bug-clearing
      b) Build a minimal slice now (Theme struct + route hardcoded colors through it + 2-3 themes incl. one Catppuccin default) since "the TUI is the product" and first-users form opinions in 10s; defer the picker/persistence/snapshot-tests as follow-ups
      c) Reject the full 7-theme matrix as over-scoped; file a smaller "TUI honors a single configurable theme" task instead
      REC: a — it is self-described polish and the phase guidance defers demo/visibility work; theming pays off most when paired with marketing. Keep Approved as the post-stability polish marker.
