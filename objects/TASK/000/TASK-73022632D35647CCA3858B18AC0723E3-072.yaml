title: 'aida review --help: describe the group in plain English for new users'
description: |
  F9 in docs/plans/2026-11-27-fresh-user-walkthrough.md also notes that `aida review --help` describes the group as "Drive human review of a held spec" and lists 19 subcommands with no pointer to `review prepare`. TASK-3959's acceptance covered only `review prepare --help`, so the group-level text (aida-cli-lib/src/review_cmd_args.rs, the Review command's doc) is unchanged.

  Suggestion: lead the `aida review` about with "Review changes with an AI agent (start with `aida review prepare`)" and move seat-workflow subcommands under an advanced grouping.

  Raised by the implementer while working TASK-3959.
