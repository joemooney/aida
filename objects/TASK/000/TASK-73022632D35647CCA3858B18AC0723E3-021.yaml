title: worktree gc proves a detached HEAD published with ls-remote, so closed-unmerged PR heads count and local merge commits never do
description: |
  BUG-2587 asks for a detached HEAD "reachable from the default branch or from an open/merged PR head on the remote". Implemented in aida-cli-lib/src/worktree_lifecycle_gc.rs (`remote_heads`, `reachable_from`) as: reachable from any ref the default branch's remote advertises under refs/heads/*, refs/pull/*/head or refs/merge-requests/*/head. One ls-remote per scan, no forge CLI.

  Two consequences to confirm:
  1. A closed, unmerged PR head also qualifies (its commits are still on the remote, so nothing is lost).
  2. A check tree whose HEAD is a merge commit made locally (main merged with a PR, never pushed) stays kept with "detached HEAD: no branch to prove merged". If integration or advisor-merge trees are routinely in that state, they need a separate rule, for example "every parent is published and the tree is clean".

  Raised by the implementer while working BUG-2587.
