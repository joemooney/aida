title: BUG-2785 gate admits an approved rework when the change conflicts or CI failed; queue work honours a recorded override instead of its own flag
description: |
  Two calls made in aida-cli-lib/src/rework_approval_gate.rs (PR #4753):
  1. The landing reconciler (land.rs: Conflict / CiFailed -> DispatchRework -> `queue work --force-claim`) reworks APPROVED changes that cannot land. A literal reading of AC1 would refuse those and stall landing, so forge_head() reads mergeability (change_status) and CI at the head commit, and a known conflict or failed CI admits the round.
  2. `queue work` has no --despite-approval flag (handle_queue_work has 13 call sites). Its refusal names `aida queue rework <SPEC> --despite-approval "<reason>"`; the launch gate honours the recorded `[despite-approval] PR-N@<head>` comment for that exact change and head.
  The gate also fails open when the forge head cannot be read.

  Raised by the implementer while working BUG-2785.
