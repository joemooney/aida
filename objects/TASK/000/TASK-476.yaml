title: 'docs/multi-node.md: replace line-ref to current_user_id with symbol-ref'
description: |-
  `docs/multi-node.md:32` cites `aida-cli/src/main.rs:47443`, but the actual definition of `fn current_user_id` is at line 47449 (6-line drift, likely from churn between drafting and PR open).

  CLAUDE.md actively prefers symbol-refs over line-refs for exactly this drift reason — the symbol name is already given inline (`current_user_id`), so the line number adds no value and just rots.

  Fix: drop the `:47443` suffix and leave the symbol-ref alone, OR refresh the line number. Symbol-ref-only is the more durable form.

  Raised in review of PR-207: https://github.com/joemooney/aida/pull/207#issuecomment-4522658109
