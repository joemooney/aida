title: Apply the BUG-2738 landed-spec guard to review stranded --fix and the orchestrator shelve
description: |
  BUG-2738 (PR #4663) guards only the `aida review record` refusal path: before shelving, it checks leases::landed_refusal (Completed, or PR MERGED/CLOSED).

  Two other refusal-driven shelve callers still shelve without checking the PR state:
  - review_commands.rs, the stranded sweep (`aida review stranded --fix`, "verdict:stranded"). It already has row.pr, so it could reuse crate::forge::github_pr_state + leases::record_refusal_on_landed_spec.
  - phase_driver_trait.rs RealPhaseDriver::shelve_on_failure for FailureKind::VerdictRequestChanges (orchestrator phase 3).

  Both normally act on live PRs, but a stale stranded row on an already-merged PR could still reopen a Done spec.

  Raised by the implementer while working BUG-2738.
