title: 'aida plan verify: support a ''(new)'' annotation for to-be-created file refs'
description: 'Plans legitimately name files the work will CREATE (that''s the point of a plan), but plan verify errors ''file not found'' on any backticked repo-relative path that doesn''t exist — its only exemptions are placeholder patterns (angle brackets, *, path/to/, ..., NNN). The workaround (un-backtick future files) loses the path formatting and is undiscoverable. Hit while writing the EPIC-39 repositioning plan: 7 to-be-created refs all errored. Proposal: a sanctioned annotation — a path followed by ''(new)'' or ''(to create)'' on the same line downgrades not-found from ERROR to OK-new (and conversely: a ''(new)''-marked file that ALREADY exists warns, catching stale plans). Acceptance: marked future refs pass; unmarked missing refs still error; existing placeholder exemptions unchanged; convention documented in the plan template.'
