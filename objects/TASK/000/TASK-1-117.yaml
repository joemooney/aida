title: aida pr ship (no-arg) fails to resume an existing open PR
description: 'Repro tonight on task-1020 / PR #1420: the first ''aida pr ship'' created the PR, then exited on red CI with ''fix, push, and re-run aida pr ship''. After fixing and pushing, the no-arg re-run printed ''could not invoke gh pr create'' and exited 1 — the documented resume behavior (no-arg resolves the current branch''s open PR) did not find #1420 and fell through to gh pr create, which gh refuses when a PR already exists for the head branch. Workaround: pass the number explicitly (aida pr ship 1420). The failure-message advice and the resolve-if-exists behavior disagree; likely the head-branch PR lookup failed or was skipped right after branch tracking was freshly set up.'
