title: 'Drain self-publishing seat lanes: run the host leftover commit before the pushed fast gate'
description: |
  BUG-2705 gave standalone self-publishing seat-clone lanes a host post-exit commit (standalone_implementer::self_published_seat_exit) before publication and the pushed fast gate. The drain paths that call lane_fast_gate::pushed (aida-cli-lib/src/queue_cmd/work.rs ~767 and aida-cli-lib/src/session/headless.rs ~2116) now print the refusal reason (marker_with_reason), but they still refuse a seat clone with uncommitted edits without committing it. If drains run self-publishing lanes in seat clones, reuse self_published_seat_exit there.

  Raised by the implementer while working BUG-2705.
