spec_id: TASK-0430
title: Design advisor autopilot audit and reversal surface
description: |-
  Design how operators inspect and recover from advisor autopilot decisions.

  Acceptance:
  - Every autopilot action records actor, mode, reason, source evidence, timestamp, and affected spec/queue item.
  - Provide a CLI/TUI/MCP surface to list recent autopilot decisions.
  - Define rework/revert paths for approved, rejected, queued, parked, and deduped specs.
  - Include filters for risky/escalated decisions and product-role recommendations consumed by autopilot.
  - Ensure the audit trail is durable and survives agent/vendor changes.
