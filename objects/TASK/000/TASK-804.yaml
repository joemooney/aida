title: 'burndown run --verbose: stream-json tee + live per-event progress (facet a of STORY-604)'
description: 'Facet (a) of STORY-604 (live progress). ''aida burndown run --verbose'' keeps the headless ''claude -p'' launch (AUTO-PROCEED preserved — --verbose only adds visibility, never changes control flow) but launches with ''--output-format stream-json --verbose --include-partial-messages'', tees the JSONL to .aida/burndown/<drain-id>.jsonl, and renders a human-readable progress line per event to the terminal. Default (no --verbose) stays quiet. The teed .jsonl is the machine-readable substrate for future ''aida burndown status/watch'' tooling. Operator decision (2026-06-13): ship Option B as primary; Option A (--attached) deferred pending SPIKE. Independent of BUG-538.'
