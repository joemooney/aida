title: Contained reviewer's CR shelve lost its status/failure_reason before reaching the shared store
description: 'BUG-2738 r1 incident (2026-11-26). The reviewer''s request-changes shelve on BUG-2738 at 15:23:27Z reached the shared store as commit ccd1c48310 (authored 08:23:28, committed 08:24:10 -0700) carrying ONLY the shelve''s comment and its Done->NeedsAttention history entry; the object''s status stayed Done, failure_reason stayed empty and modified_at stayed 15:11:49 (from 3f707dd1b2, the implementer''s contained-session store commit). So the scalar half of the shelve was dropped while the append-only half survived. It is NOT publication-done: done_after_push_flip only moves Approved/Planned/InProgress, and BUG-2738 PR #4663 adds a test that a repeated publish-done write cannot override the CR''s park. merge_spec_three_way would keep NeedsAttention (only one side changed status, and that side is newer), so the loss happens elsewhere: suspects are the contained child-store commit path (child_store_commit.rs) racing the host''s 3f707dd1b2 commit, a store-sync stash/re-apply of the reviewer''s uncommitted object, or a whole-object rewrite from a stale copy that unions comments/history. Repro target: contained reviewer writes the shelve uncommitted while the host commits another contained session''s change to the same object; check the committed status.'
