title: disable-model-invocation frontmatter on destructive skills
description: |-
  Per 'Beyond the Prompt: Claude Code', skills with side effects should set 'disable-model-invocation: true' so they run ONLY when the operator explicitly types the slash command — never when Claude decides it's relevant. Cheap defensive UX.

  Acceptance:
    • Audit AIDA's scaffolded skills for destructive shapes (ship, force-push, delete, drain)
    • Add 'disable-model-invocation: true' to the candidate set (/aida-pr ship, /aida-changelog generate when --released-as, anything that calls 'aida queue work --auto-complete --no-human=both')
    • Document the convention in docs/aida/discipline/skill-prompt-kinds.md

  Source: docs/competitive-analysis/2026-05-26-... (Tier 2 actionable, defensive UX).
