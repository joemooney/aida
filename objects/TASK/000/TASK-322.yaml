title: aida queue work next3 --batch NAME silently swallows the next3 keyword
description: |-
  When both a `nextN` positional and `--batch NAME` are passed, `resolve_queue_work_batch` (aida-cli/src/main.rs:25596-25598) returns early on the `--batch` arm and discards the positional `id` entirely. `parse_next_keyword` then sees `None` and the `nextN` keyword is dropped with no error — the batch drain runs instead.

  The sibling contradictory-input combinations are caught with directive errors: `--max` + `nextN` ("drop --max"), `--batch` + `--type`. The `--batch` + `nextN` collision should be caught the same way rather than silently swallowing one of the two pickup targets.

  Suggested fix: after `resolve_queue_work_batch`, if `effective_batch.is_some()` and the raw `id` was a `next*` keyword, bail with a directive message (e.g. "pick one: a batch drain (--batch NAME) or a head drain (nextN) — not both").

  Raised in review of PR-77 (TASK-293): https://github.com/joemooney/aida/pull/77
