    - [ ] \`--completed\` — prune sessions whose anchor SPEC is Completed (already listed)
    - [ ] \`--interactive\` — open a picker: list candidate sessions, multi-select via space, confirm with Enter, prune the selection. The dialog-style UX a user reaches for first when \`prune\` without filter feels too blunt.
