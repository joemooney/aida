  content: |-
    ## Corrected scope 2026-05-16 — different gap than originally filed

    After seeing \`aida session prune --help\`, the original framing was based on misunderstanding what \`prune\` does. \`prune\` is disk-cleanup of Claude's \`.jsonl\` metadata files by age/orphan-ness. It is NOT a command for managing the \`aida session list\` display.

    The REAL UX gap the failed-flag attempts revealed:

    **No way to remove a specific tracked session from \`aida session list\` by ID, status, or spec.**

    The user wanted: *\"this 22-hour-old session for the already-shipped TASK-112 — get rid of its entry.\"* The actual command for that doesn't exist. \`prune\` won't help unless the file is 30+ days old (default) or the worktree is gone (`--orphans`). Active worktrees in the main repo (\`aida @ main\`) never qualify.

    ## Revised acceptance — file as separate filings

    Option A (preferred): Rename this TASK to clarify, then file TWO new ones:

    1. **\`aida session forget <id>\`** — explicit removal of a specific tracked session by Claude session UUID. Deletes the \`.jsonl\` + any AIDA-side metadata pointing at it.
    2. **\`aida session prune\` filter modes** — extend prune itself with \`--completed\` (skip prune for \`.jsonl\` files matching spec=Completed sessions, since they're rare keep-worthy artifacts) OR \`--by-spec-status <status>\` (prune ones whose anchor spec is in a given status). This is a different semantic — \"select files to prune by spec status, not just by age.\"

    Option B (smaller scope): Just file \`aida session forget <id>\`. The prune-filter extension is a follow-up.

    ## Recommendation: Option B

    Filed sibling: TASK-264 (\`aida session forget <id>\`). This TASK (TASK-263) closes as Rejected since its original framing was wrong (suggested adding \`--completed\` to prune; prune's scope is disk-level, not display-level).

    The failed-flag-attempts pattern still applies and surfaces a real gap, just not on the surface I first thought.
