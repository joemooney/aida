  content: 'Implementation: GitHub pr ship now enters the existing informational-aware per-check polling directly instead of first blocking in gh pr checks --watch. Required checks override the allow-list, non-informational failures remain blocking, and relevant pending rows have a 20-minute timeout with progress diagnostics. Regression integration coverage passes (5 tests); targeted classifier tests are running. Non-GitHub pipeline watchers remain unchanged.'
