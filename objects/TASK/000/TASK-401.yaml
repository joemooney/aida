title: 'Headless /aida-pickup: enforce push + /aida-pr before exit; never commit-and-exit'
description: "## Symptom\n\nTASK-389 ran 7m 21s in a \\`--no-human=both\\` drain on 2026-05-20. The headless implementer did **excellent work**:\n\n- Identified the fix (\\`scripts/pre-release-check.sh:114\\` jq filter \\`.[0]\\` → \\`.[]\\`)\n- Implemented it\n- Wrote a regression test (\\`tests/test_pre_release_check_no_runs.sh\\`) with two fixtures\n- **Verified the test catches the bug** by temporarily reverting the fix\n- Ran shellcheck\n- Committed cleanly (\\`3f92a65f\\` on \\`task-389\\` branch)\n- Emitted a TASK-359-compliant finish-state summary with acceptance bullets verified\n\n…and then **exited cleanly without pushing or opening a PR**, because the closing line was *\\\"Want me to grab the next queue item or stop here?\\\"* — a question that cannot be answered in headless mode and defaults to exit.\n\nThe orchestrator correctly detected this (\\`✗ phase 1 failed: the implementer session exited cleanly but opened no PR\\`), but the work is sitting on a local branch with no PR, requiring manual recovery.\n\n## Why this happened\n\nThe \\`/aida-pickup\\` skill template trains the implementer to commit + write a finish-state summary + ask what to do next. In **interactive** mode that's fine — a human answers, the implementer either continues or pushes-and-PRs. In **headless** mode there's no human, and the \\\"ask what next\\\" line becomes an implicit exit signal.\n\nTASK-359 (Completed 2026-05-20 01:00) fixed the finish-state *communication rubric* — what the summary must contain — but it didn't add a **hard pre-exit gate**: \\\"if commits exist on this branch and no PR is open, push + open PR before exiting (or punt if unable).\\\"\n\n## Acceptance\n\n- The \\`/aida-pickup\\` skill template (\\`aida-core/templates/skills/aida-pickup.md\\` — verify path) gains a **pre-exit checklist** that runs before any \\\"Want me to grab the next queue item?\\\" framing:\n  1. Are there local commits on this branch ahead of \\`origin/main\\`?\n  2. Is the branch pushed?\n  3. Is a PR open?\n  \n  If commits exist and (2) or (3) is false, the implementer must \\`/aida-pr\\` before considering the work shipped — no exception in any mode.\n- The framing \\\"Want me to grab the next queue item or stop here?\\\" only fires AFTER push + PR are confirmed. Otherwise it short-circuits to push + PR first.\n- Under headless mode specifically: if the pre-exit checklist fails AND \\`/aida-pr\\` cannot complete (e.g., gh auth issue, push permission denied), the implementer **punts** the spec to NeedsAttention rather than exiting cleanly — explicit invocation of \\`/aida-punt\\` with a structured reason naming \\\"work complete locally but unable to publish.\\\"\n- Add an orchestrator-side regression test: synthetic JSONL fixture of an implementer that commits + emits finish-state + exits without PR → orchestrator detects + the appropriate exit hint surfaces. (May already exist from TASK-359; verify and extend.)\n- Update \\`aida-pickup.md\\` discipline section to make the rule explicit: **commit + push + PR + exit is the single atomic shipping unit; no partial states under any mode.**\n\n## Out of scope\n\n- TASK-359 territory (finish-state communication content). This task is about ENFORCEMENT, not communication.\n- The interactive-mode framing of \\\"what next\\\" (still valid when a human is at the keyboard).\n- Auto-resuming after a partial commit-and-exit (TASK-396's phase-resumability scope).\n\n## Related\n\n- TASK-359 — Completed; this task is the enforcement complement to TASK-359's communication rubric.\n- TASK-358 / new BUG (transient Anthropic API → inconclusive) — distinct failure mode, not a discipline gap.\n- Memory \\`feedback_advocate_not_be_passive\\` — the right move on observing the failure pattern is to file the discipline gap, not narrate the failure."
