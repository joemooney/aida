  content: 'Sibling gap surfaced 2026-05-17: web /ultraplan PRs don''t trigger `aida session end`''s `auto-queue-review` either, since the cloud session bypasses AIDA''s session lifecycle entirely. Concretely: PR-65 (STORY-278) needed manual `aida pr auto-queue-review` after rebase to enter the reviewer queue. TASK-305''s `aida plan capture <PR>` is the same shape — both need a ''post-web-flow reconciliation'' step. Consider whether a unified `aida pr adopt <N>` command (captures plan + queues review + sets spec linkage) belongs above both, or whether they ship separately.'
