  content: 'Promoted by joe 2026-09-21: PROMOTED AS DISCIPLINE-RECORDING WORK, NOT AS A CODE FIX — and the distinction is the point of the finding. The observation is that the reaper CORRECTLY refuses all six stale leases, so stale leases are the NORMAL STEADY STATE of this repo rather than garbage awaiting collection. The consequence is a standing constraint on everything written here: any test, guard, or diagnostic that fails in the presence of stale leases is testing the wrong thing, and any fix that begins ''first clean up the stale leases'' is treating the baseline as the fault. That belongs in .aida/discipline/ where the next implementer meets it, not in a queue where it will be read once and closed. Filed twice (x2), which is the signal that it keeps being rediscovered rather than remembered — the exact condition discipline text exists to end. Companion to TASK-1418, which records the same kind of lesson about the mutation harness.'
