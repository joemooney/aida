  content: 'Recurrence #2 by joe 2026-09-20: Second sighting, and it sharpens the finding. The product seat has adopted the reading — stale leases are the normal resting state, so the defect is in whatever fails in their presence, not in the leases. They add a point I missed: the error text prints seven lease ids ''for diagnosis only (NOT --resume arguments — these are lease ids, not claude session ids)''. If stale leases are normal, that list is noise in EVERY instance of this error, and the parenthetical exists because the list invites exactly the misuse it then forbids. A diagnostic that must warn you not to use what it just showed you is showing you the wrong thing.'
