title: 'Mailbox pure core: Message model + inbox_for/thread/merge_dedup (STORY-493 slice 1)'
description: 'First slice of STORY-493. Pure, side-effect-free aida-core/src/mailbox.rs: Message { id, thread_id, from, to: Recipient (Agent|Broadcast), timestamp, in_reply_to, body } + inbox_for (direct+broadcast, excl. own, oldest-first), thread (whole conversation ordered), merge_dedup (id-keyed union of the local + canonical hybrid layers, canonical wins on collision). 6 unit tests. No I/O — the .aida/ local store, CLI, MCP, and git-canonical digest are later slices.'
