title: 'PR-3065 follow-ups: write_source_id fallback without rename/link, post-placement errors as warnings, bare_admin_name rejection tests'
description: |
  Non-blocking findings from the APPROVED review of PR #3065 (TASK-b6b1278890774ef993d2ebc327862470-075) at 2e3d79d01356. ADVISOR RULING: if a filesystem has neither RENAME_NOREPLACE nor hard links, fall back to create_new+write+fsync on the final name (the pre-#3065 behaviour) rather than failing. After the target is placed, cleanup/fsync errors are warnings, not Err. Add the missing rejection-branch and temp-reap tests.
  - [minor, non-blocking] Tests do not cover several bare_admin_name rejection branches: a body over 255 bytes, a quote-only or brace-only fragment without a slash, and '.'. They also do not cover the reap of a write_source_id temp left in <checkout>/.aida by a crashed mailbox mint. Only the anchor-side temp is exercised (leftovers_tests.rs era_marker_writes_are_atomic_and_temps_reaped).
  - [minor, non-blocking] mailbox_lifecycle/mod.rs write_source_id: when rename_noreplace is unsupported, the fallback is hard_link. On a filesystem that has neither RENAME_NOREPLACE nor hard links (some CIFS/SMB mounts), nonce and era-marker writes now fail where create_new+write used to succeed. This is an edge case on a Linux-only tool; consider documenting it or falling back to O_EXCL write of the synced temp contents.
  - [cosmetic, non-blocking] mod.rs write_source_id: on the link fallback, a failed remove_file(temp) after a successful hard_link returns Err even though the target is already placed. The same happens when the directory fsync fails after placement. mark_nonce_era then reports an error for a marker that was written. This fails closed and is harmless, but the error is misleading.
