title: Make advisor Agent-tool fan-out work spec-claimable (close the BUG-637 fan-out gap)
description: 'BUG-637 (merged) gates pickup/edit on spec-scoped LIVE leases — but only AIDA-launched work (aida queue work / aida agent new) writes a spec-scoped lease. When an ADVISOR fans an implementer via the Agent tool (worktree-isolated subagent), the lease is a generic harness-worktree scope, NOT spec-scoped — so a concurrent fan or a re-fan of the SAME spec is NOT caught. This is the exact gap that let the advisor re-dispatch already-done specs twice on 2026-06-26 (TASK-928, BUG-631). Close it: give the advisor a way to RECORD a spec-claim when fanning (e.g. aida claim <spec> / a lightweight pre-fan lease-write keyed to the subagent), so live_spec_claim_by_other catches advisor-fanned work too. Then the pre-pickup gate covers BOTH AIDA-launched and advisor-fanned implementers.'
