title: AIDA stores per-requirement transition history INSIDE each .aida-store/objects/…
description: "AIDA stores per-requirement transition history INSIDE each .aida-store/objects/**/*.yaml file as a history array of {timestamp, field_name, old_value, new_value} triples. This is the SOURCE OF TRUTH for status-transition time series — but the discovery was non-obvious enough that:\n\n- Codex (writing EPIC-29 chart implementation) searched the SQLite cache, didn't find it, and used modified_at as a fallback approximation\n- Codex documented in their architecture doc: 'transition history absent in tested substrates'  \n- Claude (winning the chart race via aida-chat's PR #13) discovered the YAML-side history by reading object_store.rs source + walks it directly for true historical burn-down\n\nThe fact that Claude's PR #13 won the chart race ON THE BASIS of finding this substrate property + Codex's submission being 'plausible second-place' on the WRONG assumption tells us this is documentation gap that costs real-world agent work.\n\nAction: document the per-YAML history property explicitly in:\n- CLAUDE.md (Storage model section)\n- aida-core/templates/docs/aida/discipline/machinery-glossary.md (substrate vocabulary)\n- Optionally a new dedicated section in OVERVIEW.md or a dedicated doc about queryable substrate properties\n\nSubstrate-as-product principle: if a property exists and matters but isn't documented, agents have to re-derive it (or get it wrong). Documentation IS substrate.\n\n— master observation, captured from aida-chat advisor's overnight cross-project report 2026-05-25"
