title: Unbound shared claims are now heal- and force-claim-eligible on creator death (reverses a BUG-2697 assertion)
description: |
  BUG-2773 made exited_holder_is_dead (aida-cli-lib/src/coordination.rs) accept a claim with lease_id = None. Eligibility requires the same host, a claim that is neither process-backed nor a reviewer claim, a provably dead creator, a heartbeat past its TTL and the clone present here. Because the admission --force-claim path uses the same predicate, unbound claims are now also force-reclaimable on that evidence. The BUG-2697 test assertion "no lease binding => refused" was replaced by "unbound with an absent clone => refused".
  Residual: a reused creator pid that has only a legacy linux-starttime identity still counts as not dead, so such a claim stays held.

  Raised by the implementer while working BUG-2773.
