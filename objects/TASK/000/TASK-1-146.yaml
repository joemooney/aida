    `gh secret list --repo joemooney/aida` shows AIDA_GITLAB_TOKEN present, created 2026-09-20T07:26:36Z. The operator provisioned it this morning, choosing scopes against the GitLab PAT screen with guidance.

    What is NOT yet established is that the token works end to end. The consumer is TASK-1273's nightly GitLab lifecycle smoke, which is still unmerged on PR #1978 (currently green on both required checks, awaiting review). Until that lands and runs once, "the credential is provisioned" and "the nightly forge job can authenticate" are two different claims and only the first is evidenced.

    So this should not close on the secret's existence alone. Suggested close condition: the first nightly GitLab smoke run after #1978 merges completes without an auth failure. If that run fails on scope rather than plumbing, this spec is the right place to reopen rather than filing new.

    Recording this rather than closing, because a credential spec that closes on "the secret exists" is exactly the kind that looks done and is not.
