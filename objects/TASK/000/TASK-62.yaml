  content: |-
    PR-11 review (2026-05-11): Windows CI failed on bg_worker_records_error_on_missing_remote despite the TempHomeEnv guard. Root cause: dirs = 5.0.1 on Windows resolves home via SHGetKnownFolderPath(FOLDERID_Profile) — env vars (USERPROFILE / HOME) have no effect, so the guard cannot isolate the test from the real user profile.

    Descoped the "Test passes on all 3 platforms" acceptance bullet here: fix-forward commit bc788e88 gates the test and the simplified TempHomeEnv guard on #[cfg(unix)] to unblock the PR. The proper Windows-capable approach is filed as a follow-up TASK (link in the next comment).
