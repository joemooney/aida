title: 'EPIC-35 create op: route gh pr create through Forge::open_change'
description: Routes pr_ship_create_pr's  through forge_for(root).open_change(OpenChange{branch,base:main,title,body}). open_change already existed (real); this wires the one execution site. open_change passes an explicit --head <branch> (the just-pushed branch) — equivalent to the prior inferred head, and what lets a GitLab/pure-git repo open its own change. Returns ChangeRef{id}; id==0 (unparseable URL) maps to the prior 'no PR number found' bail. Removed the now-unused parse_pr_number_from_create_output import. Full suite green (1615); dogfood via aida pr ship (which opens the PR). Child of STORY-521.
