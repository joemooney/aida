  content: 'Implementation: preserve arm-B launch/artifact/matcher errors ahead of the zero-denominator fallback; diagnose missing/invalid regenerated output with artifact and headless-log paths; preserve unknown recall/delta and valid empty-output behavior. The generic launcher returns process ExitStatus, not a probe-success verdict; no global launcher contract change is needed to detect silent exit-zero probes. Targeted reconstitution tests and formatting verification are running.'
