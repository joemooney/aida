  content: 'Advisor verification: confirmed in code — reconstitute.rs:1255-1258, the `_ if real_tests.is_empty()` match guard outranks `Some(e)`, so arm_b_error is swallowed whenever the traced-test denominator is empty. Second half (spawn_vendor_headless_with_seat returning success with zero output, 4x ~1s exit-0 probes with 0-byte logs on aida-monitor) still needs root-causing — likely the same class as TASK-1603''s refusal race. This bug blocks TASK-1523: the north-star measurement cannot be trusted while arm-B failures read as ''unknown denominators''.'
