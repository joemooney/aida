    REVIEW FINDINGS TO ADDRESS (TASK-3111):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 42f8998007e3
    Recorded: 2026-11-05T18:30:25.409706619+00:00
    Findings:
    1. BLOCKING (CI, TASK-2847): the 'CI (gates)' step 'Live bwrap OS-wrap confinement gate' fails at 42f8998 (job 127426812582, exit 101 from the cargo test at .github/workflows/ci.yml:352). The same step passes on main (run 42077793813) and on every other recent branch. The only change this PR makes inside that gate's filter set is the new python3 capability control appended to bug_2435_bwrap_overlay_job_cannot_remount_a_ro_bind_rw (aida-cli-lib/src/tests/bug_2383_seat_target_overlay_tests.rs:664-722). Likely causes: bwrap on the unprivileged runner refuses '--cap-add CAP_SYS_ADMIN' after '--cap-drop ALL'; unshare(CLONE_NEWNS) or mount behaves differently on the runner kernel/AppArmor than locally; or python3 is not reachable inside the lane-job bwrap profile. The control also has no skip arm for a missing python3. Make the control pass on the CI runner, or give it an explicit reported skip that the gate's ok-count tolerates, without weakening the existing negative assertions.
    2. BLOCKING (CI): 'CI (lib-0)' step 'Run tests' fails at 42f8998 (job 127426812765). lib-0 is green on main and on the recent branches. The reviewer sandbox cannot download job logs, so the failing test is unidentified. In-diff candidates: bug2441_resolved_but_uncovered_member_names_coverage_refusal and the re-asserted bug2441_unresolved_member_refuses cases (aida-cli-lib/src/tests/bug2406_train_tests.rs:348-420; the implementer saw parallel failures here and attributed them to TASK-2841); the tightened catch_all regex in adding_a_flag_to_a_command_cannot_require_a_hot_file_edit (story_1728_command_registry_tests.rs:1037-1053), which now rejects guarded wildcards and could newly flag an existing hot-file match; the presence tests; or the bug_2435 control outside the forced-live gate. Identify the failing test from the log and fix it. If it is a known flake (TASK-2841), cite it and show a green rerun at the PR head.
    3. cosmetic: aida-cli/tests/story_2479_observation_envelopes.rs:271 'assert!(!diagnostic.contains("private title"))' is redundant after the 'private' check on the previous line. Drop it, or assert on a title token that does not contain the deny pattern, so the title no-echo claim is tested independently.
    4. non-blocking note (TASK-2869): pr_review_preserves_the_missing_review_story_refusal (aida-cli/tests/queue_work_dry_run.rs:1600) sets AIDA_FROM_PR_REVIEW/AIDA_FROM_PR_NUMBER itself for both invocations. It proves that 'aida pr review' routes into the queue-work refusal gate, which satisfies the finding. It does not exercise a merge-hold or supervised-spec refusal, which the original finding listed as examples. Acceptable as is; mention it in the PR body if no second gate is added.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
