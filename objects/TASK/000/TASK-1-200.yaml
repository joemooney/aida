description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1575, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  In collect_unshipped_work_items_bounded (aida-cli-lib/src/lib.rs, end of pass 2), the new carrier-suppression retain runs BEFORE the pre-existing 'if evidenced < survivors.len() { scanned -= ...; survivors.truncate(evidenced) }'. That truncation is count-based and assumes the first 'evidenced' entries are exactly the evidenced ones. The retain can remove an evidenced survivor from that prefix and shift a never-evidenced survivor into the kept range. Repro shape: survivors [A(spec X, local-only), B(spec Y)] after the pushed-sort; pass-2 loop hits the deadline at idx 1 (evidenced=1, only A queried); spec X's carrier query is incomplete (deadline or gh failure) -> retain removes A -> survivors=[B] -> evidenced(1) < len(1) is false -> B is reported WITHOUT its --head history query or review-snapshot confirmation ever running: a row built on evidence never fetched, the exact PRIN-5 invariant this function pins. Required: run the evidenced truncation BEFORE the carrier retain (or track evidenced survivors by identity instead of count), and add a test pinning this scenario (deadline break mid-pass-2, carrier spec owning an earlier-sorted evidenced survivor, later survivor of another spec must NOT appear in rows).

