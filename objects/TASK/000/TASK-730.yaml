title: 'aida list: when finished work clutters the default view, point to ''aida list open'' (what''s left)'
description: 'Round 11 of the novice-first loop — the growing-project frontier. A returning novice''s ''aida list'' shows Completed tasks first, mixed with the to-do ones (Completed stays visible until archived, by design — STORY-441). ''What''s left to do?'' isn''t obvious, and the clean view (''aida list open'') exists but is undiscoverable. Fix: when the DEFAULT view (no status filter) includes Completed items, print a dimmed footer tip: ''aida list open shows just what''s left to do.'' Surfaces the open/closed aliases at the moment of need; additive, no default-behavior change.'
