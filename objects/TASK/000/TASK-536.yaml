title: 'backlog: drop redundant !is_terminal_status filter on Approved candidates'
description: |
  Raised in review of PR-282: https://github.com/joemooney/aida/pull/282#issuecomment-4527739506

  `aida-cli/src/backlog.rs:159-178` `collect_backlog_candidates` does:

    .filter(|r| matches!(r.status, RequirementStatus::Approved))
    .filter(|r| !is_terminal_status(&r.status))

  The second filter is dead code: `Approved` is non-terminal by definition
  (terminal statuses are Completed / Rejected / Released). Either drop the
  second filter, or — if the intent was defense-in-depth against future status
  enum changes — leave a comment naming that.

  Pure refactor, no behavior change. One-line delete.
