title: 'aida list --short (--ids-only): print bare spec IDs one per line for pipe/loop consumption'
description: |-
  ## Friction (operator, 2026-06-11)

  No `aida list --short` to get just spec IDs. Today the only ids-only path is `aida list --json | jq -r '.[].spec_id'` (needs jq) or awking the table (fragile, breaks on layout change). Operator wants a bare-id list to feed loops — e.g. `for s in $(aida list open --short); do ...`. Directly serves the burndown/groom/drain workflows.

  ## Proposal

  `aida list --short` (consider `--ids-only` / `-q` as the clearer canonical; honor `--short` as the operator's mental model — implementer/master picks the name): print ONLY canonical spec IDs, one per line, no header / no count footer / no color / no risk chips — pipe-clean. Composes with all existing filters (status / type / tags / parent / the open|closed aliases).

  ## Acceptance

  - [ ] `aida list --short` emits one canonical spec ID per line, nothing else (no header, no '<n> requirements' footer, no ANSI color) — directly usable in `$(...)` / xargs.
  - [ ] Composes with --status / --type / --tags / --parent / status-shortcut + open|closed aliases (e.g. `aida list open --short`).
  - [ ] Honors the same archive default as plain `list` (archived hidden unless --all/--archived).
  - [ ] Decide flag name: `--short` vs `--ids-only` vs `-q/--quiet`; alias the others to it if cheap. Mutually exclusive with --json/--tree (different output shapes).
  - [ ] (Optional) mirror onto `aida queue list --short` for the same loop ergonomics on the queue surface.

  ## Rationale

  Removes the `--json | jq`/awk dance for the most common scripting need (iterate spec IDs). Small, bounded; serves every loop-over-specs workflow. Same family as the scripting-friction-is-a-missing-surface-signal lesson.
