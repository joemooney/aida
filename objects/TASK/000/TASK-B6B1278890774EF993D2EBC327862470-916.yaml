description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2474, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): supersession trusts wall-clock recorded_at from any node (store is shared across 11 nodes). A recording stamped in the future (clock skew) beats a genuinely later request-changes at the same head, which weakens criterion 3. Consider rejecting/clamping recorded_at later than now plus a small skew allowance, or ordering by ledger append sequence.

