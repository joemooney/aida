title: Scaffolding generates AIDA-aware CLAUDE.md with /aida-capture skill
description: |2
    Implemented (FR-0168)

    1. Updated Scaffolding CLAUDE.md

    The generated CLAUDE.md now includes:

    Requirements Management Section:
    - Explicit instruction: "Do NOT maintain a separate REQUIREMENTS.md file"
    - CLI commands reference (list, show, add, edit, comment)
    - During Development guidelines (update status, add comments, create child reqs)
    - Session workflow guidance pointing to /aida-capture

    Updated Skills Section:
    - /aida-req - Add new requirements
    - /aida-implement - Implement with traceability
    - /aida-capture - Session-end review (new)

    2. Created /aida-capture Skill

    Located at .claude/skills/aida-capture.md:

    - Purpose: Safety net for conversational workflows
    - When: End of session, or when working without explicit /aida-req calls
    - What it does:
      a. Scans conversation for implemented features/fixes
      b. Checks against requirements database
      c. Presents summary: Missing, Outdated, Already Captured
      d. Prompts user to add/update requirements
      e. Executes captures with aida CLI
