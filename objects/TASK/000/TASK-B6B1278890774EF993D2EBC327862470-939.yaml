description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-2401, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [cosmetic] pr_stale_check now reads both digests (and calls resolve_forge_kind, which can write [forge] config) before the behind_commits==0 early return. A head that is not behind now pays about 6 extra git spawns, and a digest read error (e.g. symlinked .github/workflows) fails the gate even though nothing is stale. Move the digest reads after the early return.

