title: 'Add ''queue'' verb (Approved-conditional): route selected Approved specs to the implementer queue'
description: |-
  Add a "queue" verb to the redesign TUI — the mirror of "request approval", closing the lifecycle loop. The bottleneck is concrete (12 Approved, 0 queued): approved work has nothing routing it to an implementer.

  BEHAVIOR (mirror the existing request-approval verb almost exactly):
  - "queue" is APPROVED-conditional: appears in the verb list only when the focused/selected spec status is Approved (the symmetric counterpart to request-approval being Draft-conditional). Put this in verb_list_for in state.rs.
  - Set-level: operates on the marked selection filtered to Approved (or the focused Approved item if nothing selected). For each, runs `aida queue add --for implementer <id>` (the routing write — same shape as request-approval's `aida queue add --for advisor`). Skips non-Approved; reports routed/skipped/failed on the status line.
  - Pure logic (the Approved-conditional verb presence; the approved_selection target set) unit-tested in state.rs, mirroring the draft_selection / request_approval tests.

  ACCEPTANCE:
  - "queue" verb appears only for Approved focus; routes selected Approved specs via `aida queue add --for implementer`; non-Approved skipped with a clear status message.
  - Pure target-selection + conditional-verb logic unit-tested.
  - build/test/fmt/clippy green (clippy --no-deps); redesign module only; commit --no-verify with trace:TASK-915.

  ## Test Plan

  1. On **Open**, drill to verbs while a **Draft** spec is focused → **expect** `approve` and `request approval` appear. Focus an **Approved** spec → **expect** `queue` appears (and the draft-only verbs don't).
  2. **queue** → routes the selected Approved specs to the implementer queue (`aida queue add --for implementer`); status line reports routed/skipped.
  3. **approve** → transitions selected Drafts → Approved (runs with advisor authority).
  4. **defer** → opens a one-line **trigger input**; type a revisit condition, Enter → runs `aida defer … --until "<trigger>"`; status line reports deferred ids.
