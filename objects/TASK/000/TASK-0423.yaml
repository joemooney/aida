title: Evaluate Codex-compatible outer sandbox strategy for AIDA launches
description: |-
  Evaluate whether and how AIDA should provide an outer OS sandbox for Codex sessions comparable to the current os_wrap behavior around headless Claude drains.

  Acceptance:
  - Review docs/agents/claude-bubblewrap-sandbox.md and docs/agents/per-agent-config.md for current os_wrap scope and limitations.
  - Confirm which launch paths are currently covered: headless Claude drains, interactive Claude, Codex, and Antigravity.
  - Compare Codex native sandbox/permission profiles with AIDA outer bubblewrap confinement.
  - Decide whether Codex needs an AIDA-managed outer wrapper, or whether Codex-native permissions are sufficient for the target migration scenarios.
  - If needed, file implementation specs for a fail-closed Codex-capable wrapper, including userns self-test, doctor output, read/write/egress documentation, and verification tests.
