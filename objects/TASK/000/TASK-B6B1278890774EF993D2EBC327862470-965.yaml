title: 'Crate-split PR2b: move consumer imports of the cmdkit framework types off command_registry and drop the re-exports, so the main SCC actually shrinks (TASK-3425''s deferred SCC acceptance)'
description: |
  Follow-up from TASK-3425 (PR-3635), ruled by the advisor 2026-11-07 20:20. TASK-3425 moved the 14 command-framework types into cmdkit.rs behind re-exports from command_registry.rs, with no caller import changes. Its measurement (docs/internal/testing/task-3425-cmdkit-rework.md) shows that re-exports alone cannot shrink the main SCC: consumers still import the types through command_registry, so the module graph still reaches the registry table (largest SCC 325 on main and on the branch). The SPIKE-713 plan's 29-module reduction needs caller import changes, which TASK-3425's no-churn acceptance forbade. The two criteria contradicted each other; this task owns the reduction.

  Scope: change consumer imports of the cmdkit framework types from `crate::command_registry::X` to `crate::cmdkit::X` (mechanical, sed-able), then remove the re-exports from command_registry.rs that no longer have users.

  Acceptance:
  1. No production module imports a cmdkit framework type through command_registry; the re-exports are deleted (or kept only with a named remaining user).
  2. The TASK-3425 measurement script, run on base and head, shows the largest SCC shrinks, and the doc records both numbers. The target is the plan's ~29-module reduction; a smaller result is acceptable if the doc names the edges that still hold modules in.
  3. make check-ci-fast passes; the command-registry ratchet tests pass; help output unchanged (Help-Golden: unchanged).
  4. Sequence: start after PR-3635 merges, and touch only import lines in files with no open PR, to avoid the SPIKE-713 conflict pattern.
