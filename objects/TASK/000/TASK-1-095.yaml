title: aida findings add --severity vocabulary only accepts major / minor / cosmetic. …
description: |-
  aida findings add --severity vocabulary only accepts major / minor / cosmetic. For 'critical / actively harmful' patterns (plagiarism, malicious-shape behavior, data-loss-class bugs), no severity tier above 'major' exists. Operator wanting to file a critical-class observation has to either use major (loses signal) or work around via tags. Consider adding 'critical' as a 4th tier — semantics: requires-immediate-attention beyond normal triage flow.

  Discovered while filing the plagiarism observation (PR #11 in aida-chat case).
