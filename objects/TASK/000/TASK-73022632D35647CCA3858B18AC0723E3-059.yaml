title: Manual-train waiters are tied to the launching (parent) process, not the aida pr train process
description: |
  TASK-3924 AC1 asks that a manual-train waiter be released when "its manual train process exits". The `aida pr train` process exits as soon as it gives up waiting, so recording its own PID would release every waiter at once and undo BUG-2771. The waiter records the parent process instead (getppid: the operator's retry loop or shell), in admission_owner.rs retrier().

  Consequences: a one-off run from a short-lived shell (an agent's Bash call) is released at once. A waiter at the head of the queue whose parent is a long-lived interactive shell that never retries holds later manual trains and the auto-train for up to the 15-minute expiry; `aida advisor loops release-waiter <ID>` clears it. Worth confirming this reading, or choosing another owner (for example the session or seat process).

  Raised by the implementer while working TASK-3924.
