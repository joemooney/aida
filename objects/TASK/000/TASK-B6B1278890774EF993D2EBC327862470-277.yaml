    ## Implementer approach

    ### Acceptance criteria as tests
    - **Fixture (build check):** AC1 — new source `docs/air-gapped-development.md` added to `docs/showcase/publication.json`; `python3 docs/showcase/build.py` generates `docs/showcase/air-gapped.html`, its card in `library.html` and its record in `search-data.js`; `build.py --check` (in `make check-ci-fast`) proves no drift.
    - **Manual review:** AC2 — grep the source for SPEC-ID / PR / seat / advisor terms before commit.
    - **Manual review against docs/cli/10-storage.md + code:** AC3 — only root enrollment, upstream, pool lineage + spendability, node-local fallback and the sync-time claim check are described as current. Single-hub-without-root, pool grants to a hub, automatic block claims during push, and transfer of the root are labelled planned.
    - **Manual review:** AC4 — the bundle-crossing walkthrough step carries an explicit "untested" note (the air-gap spike has not reported).
    - **Fixture:** AC5 — diagrams as SVG assets under `docs/showcase/assets/` with <title>/<desc>, a light palette plus a `prefers-color-scheme: dark` style block; alt text from title/desc. Small build.py extension: a standalone `![alt](showcase/assets/x.svg)` line renders as a <figure>.
    - **Not testable in this PR:** AC6 — the gh-pages snapshot must come from an approved *merged* revision, so it happens after merge; flagged as a follow-up.

    ### Expected files
    - `docs/air-gapped-development.md` (new source)
    - `docs/showcase/assets/air-gapped-*.svg` (new)
    - `docs/showcase/build.py`, `docs/showcase/publication.json`, `docs/showcase/README.md`
    - regenerated `docs/showcase/*.html`, `docs/showcase/search-data.js`

    ### Ambiguities / conflicts as questions
    - The private draft artifact is not readable from this headless session (Claude Docs access denied). Page is written from the repo's documented, built behaviour covering the same topics; is a later pass against the draft wanted?
    - AC6 deploy needs a merged revision — confirm the gh-pages refresh is a post-merge step.
