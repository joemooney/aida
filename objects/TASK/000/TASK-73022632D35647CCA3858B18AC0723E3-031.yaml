title: Codegraph proxy graceful-restart fixture leaves orphan path during fast gates
description: |
  During native-lane validation of TASK-3816, make check-ci-fast failed in tests.test_codegraph_proxy.ProxyTests.test_service_query_from_read_only_seat_and_graceful_restart at tests/test_codegraph_proxy.py:384: assertFalse(orphan.exists()) observed True. The preceding 69 containment tests passed; the proxy suite ran 21 tests with one failure and one skip. No codegraph implementation changed in this lane. Investigate restart cleanup or fixture timing; preserve orphan cleanup. Host or CI must rerun the complete fast gate.

  ## Acceptance
  1. Reproduce: run `python3 -m pytest tests/test_codegraph_proxy.py -k graceful_restart` 20 times headless (no TTY; see the BUG-2624 safety rule) on origin/main and record the failure rate here.
  2. Root-cause the orphan path: either the restart cleanup races the assertion (fix by waiting, with a bounded deadline, for the cleanup to finish) or the cleanup really leaks (fix the proxy). Orphan cleanup must still be asserted; the test may not drop or weaken `assertFalse(orphan.exists())`.
  3. After the fix, 50/50 headless runs pass, and `make check-ci-fast` passes headless once.
