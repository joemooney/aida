spec_id: TASK-21
title: aida role enter / end should update PS1 like aida dev activate does
description: |-
  Symmetry with 'aida dev activate', which prepends '(aida-debug)' or '(aida-release)' to PS1 so the active build is visible at a glance. 'aida role enter <name>' currently exports AIDA_SESSION_ROLE but does not touch PS1, so there is no visual signal in the prompt that a role is active.

  Add a '(role:<name>) ' prefix to PS1 on 'aida role enter' (replacing any prior role prefix to handle role switching cleanly), and strip it on 'aida role end'. Use POSIX prefix-strip (${PS1#prefix}) keyed off the previous AIDA_SESSION_ROLE rather than save/restore, so the change composes correctly with 'aida dev activate' regardless of which was invoked first.

  Files: aida-cli/src/main.rs handle_role_enter (~3569) and handle_role_end (~3610).

  Acceptance:
  - aida role enter implementer → PS1 prefixed with '(role:implementer) '
  - aida role enter architect (already in implementer) → prior '(role:implementer) ' stripped, '(role:architect) ' added
  - aida role end → role prefix removed
  - Composes with 'aida dev activate' both ways: '(aida-debug) (role:implementer) ...' and the dev prefix survives 'aida role end'
  - No-op gracefully if PS1 is unset (non-interactive shells)
