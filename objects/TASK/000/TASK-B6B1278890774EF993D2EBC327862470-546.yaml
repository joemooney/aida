title: '[minor][non-blocking] review_verdict.rs close_verdict_on_merge (~L2393-2402) wr…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1801, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [minor][non-blocking] review_verdict.rs close_verdict_on_merge (~L2393-2402) writes the closed current file, then archive_round_by_sha refuses a refused archive entry with '?'. The current file is left closed and the archive still open; a re-run sees already_closed and never closes the archive. Fail-closed (refusal stays visible), but OVERVIEW.md's 'a refused file fails the record (or a merge close) before anything is written' is false for merge close. Call prepare_archive_round before write_verdict_atomic, as write_verdict_object does.
  Reviewed sha: d5cdd8a5763bcafc8077d26430286e1683e3c948
