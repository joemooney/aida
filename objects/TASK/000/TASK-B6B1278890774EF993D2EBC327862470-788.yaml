title: Train fixture approval receipts intermittently fail under parallel tests
description: 'While validating BUG-2441, cargo test -p aida-cli-lib --lib bug2406 -- --nocapture ran 54 tests: 49 passed, including all five BUG-2441 regressions; five existing forged-build tests (message/order/patch/source/tip) failed during Fixture::opened_on at live.gate(11), before reaching the forged-build assertion or the changed verified collect path. Refusal said the fixture independent human receipt did not re-validate. Each test already uses run_path_isolated_test. A serial rerun is in progress to determine repeatability. Investigate fixture receipt/setup behavior under parallel load; cause is not established.'
