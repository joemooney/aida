title: Define migration decision matrix for Claude Code versus Codex CLI versus AIDA substrate
description: |-
  Create a concise decision matrix that helps advanced users decide what to keep in Claude Code, what to move to Codex CLI, and what to move into vendor-neutral project infrastructure such as AIDA, scripts, CI, git hooks, or MCP servers.

  Acceptance:
  - Cover core axes: hooks, approval/defer semantics, sandboxing, status/observability, slash commands, skills/plugins, MCP, subagents, non-interactive automation, and workflow state.
  - Distinguish convenience features from load-bearing enforcement.
  - Include future-capability and lock-in tradeoffs for Claude Code and Codex CLI.
  - Provide a default recommendation for reversible migrations: keep invariants outside vendor-specific agent runtimes.
  - Link or fold the result into docs/agents/porting-claude-code-to-codex.md after review.
