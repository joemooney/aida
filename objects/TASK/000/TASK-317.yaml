title: aida queue move --to <N> slot numbering can diverge from role-filtered 'aida queue list'
description: |
  TASK-280 added `aida queue move <ID> --to <N>` absolute positioning. The
  `--to` handler builds its candidate set by filtering the user's queue
  entries on `!is_terminal_status` only (aida-cli/src/main.rs:41205-41215).

  `aida queue list`'s numbered section applies that same terminal filter
  PLUS role-routing, scope-session routing, `--scope`, role scope-tags,
  `--batch` and tag filters (aida-cli/src/main.rs:40229-40320). When a
  session has an active role (the normal case in AIDA's role-based
  workflow), the numbered slots a user sees are a strict subset of `--to`'s
  candidate set, so `aida queue move X --to 3` mid-queue can land the item
  at a different visible slot than the "slot 3" the user counted from their
  filtered `aida queue list`.

  The PR description and the `--to` field doc comment both claim "counting
  among the queue's live (non-terminal) entries — the same items `aida
  queue list` numbers". That holds for a bare unfiltered `aida queue list`
  but overclaims for the in-session role-filtered view.

  Non-blocking: acceptance criteria are met and the dominant forms
  (`--to-front` / `--to-back` / `--to 1`) are unaffected by any filter.
  Options for follow-up: (a) make `--to` apply the same role/scope filters
  as `queue list` so the numbering agrees, or (b) soften the doc comment /
  PR claim to "live entries for this user" without the "same as queue list"
  promise.

  Raised in review of PR-74: https://github.com/joemooney/aida/pull/74
