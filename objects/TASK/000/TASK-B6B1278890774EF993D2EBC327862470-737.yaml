title: Train hold follow-ups conflict with signed mandate admission and lack human named-PR release parity
description: BUG-2423 comments request (1) rejecting armed member holds as not ready and (2) human terminal release parity with pr ship for explicitly named PRs. BUG-2214 signed Q2 intentionally admits mandate-covered armed holds and tolerates the train hold gate until lease-protected release. The current train Member.release records only mandate cover, so human named-PR release needs an explicit authority representation and matching recheck/re-arm tests. Decide whether readiness means CI-ready pending authorized release, or release before train admission, while preserving BUG-2214 mandate coverage and human integrity-floor checks. The BUG-2423 CI-registration patch does not change this policy.
