title: Let an active mandate covering the seat stand in for or renew a relay's parent grant (project setting)
description: |
  BUG-2585 item (4) asked to consider this; it is not implemented. Today a relay whose parent grant expires holds its session and waits for a human to run the printed renewal command. With a project setting, an active mandate that covers the seat could renew or replace the parent grant so an unattended run needs no human at all. This changes who can mint authority, so it needs a sketch and advisor signoff.

  Raised by the implementer while working BUG-2585.
  Branch: bug-b6b1278890774ef993d2ebc327862470-350  ·  Commit: 6538b1a222  (PR link added on merge)
