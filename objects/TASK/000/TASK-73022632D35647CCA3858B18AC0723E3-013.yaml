  content: |
    ADVISOR RULING (2026-11-15 14:05 MST, proxy ruling by product seat aida-d0 recorded by advisor): APPROVE, bounded.
    - Ships as a GLOBAL ~/.aida operator knob, default OFF (old behaviour: relay holds and waits for a human renewal).
    - When on, a renewed or replacement parent grant never outlives the covering mandate and never exceeds the mandate's scope.
    - Every renewal is audited and visible in the STORY-2828 view.
    - Process: sketch on this spec + advisor signoff before code; STRICT review by claude-opus-5-5; main track.
