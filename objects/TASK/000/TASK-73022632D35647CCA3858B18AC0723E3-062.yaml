title: landing_drought::scan gained a listing seam (scan_listing) for the TASK-3931 end-to-end test
description: |
  TASK-3931 asked for a test-only change. Driving scan() end to end needed one behaviour-preserving production edit: scan() now delegates to scan_listing(exec, stalled_reviews::open_prs) (aida-cli-lib/src/landing_drought.rs:569-580). It copies the stalled_reviews::scan_open seam, and the listing call stays at the same point. Without it the test would need a gh stub on PATH, which mutates process-global state.

  Raised by the implementer while working TASK-3931.
