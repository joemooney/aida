  content: Implemented in 2cf37ec93ca and pushed to origin/task-b6b1278890774ef993d2ebc327862470-803. Git lookup refusals now retain their diagnostic and explicitly report no hold; only quiet missing-ref exit 1 reports branch absence. All 8 targeted hold tests passed (including 3 new regressions); cargo fmt --all -- --check, git diff --check and trace-header checks passed. No publication authority changes. Preparing standalone PR handoff; no ship or review-record operation.
