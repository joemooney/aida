- id: 01a1ad18-7cc3-7533-852f-fb1f321b7e32
  author: joe
  content: 'Round 2 investigation: fetched run 42071282811 job 127399567115 logs. The actual failure is deputy_shell::tests::status_tells_queued_running_done_and_cancelled_apart at tests.rs:742: status unwrap receives no script job during the existing claim window (accepted job removed before state publication). Fix polls optional published state before asserting strict running status in both running transitions. Also replaces the TMPDIR-dependent non-repository fixture with an explicit /tmp temp directory and invalid gitfile that stops Git discovery. Scope/closure is diagnostic preserved, not hold works in native seats; native-seat publication authority is unchanged. Unit execution requested through aida lane job run, but this standalone lease has no lane job runner; untested=true. Required make check-ci-fast is in progress.'
