- id: 01a1ac95-f463-7063-87c8-f96e545262a6
  author: joe
  content: 'Investigation: pr_hold_handler already passes cwd to push_and_verify_held_branch, so this is not main-worktree root confusion. host_git_command returns a fixed nonzero seat-clone safety refusal when containment cannot be attested (notably native Codex seats), and the helper discards stderr and calls every nonzero rev-parse result a missing branch. Fix preserves the refusal/error, claims absence only for quiet exit 1 with empty stderr, and retains fail-closed publication. Regression coverage includes nested sibling-worktree success, existing branch with clone safety refusal, and invalid repository lookup. Native-seat publication authorization remains unchanged.'
  created_at: 2026-11-05T16:41:11.011902912Z
  modified_at: 2026-11-05T16:41:11.011902912Z
