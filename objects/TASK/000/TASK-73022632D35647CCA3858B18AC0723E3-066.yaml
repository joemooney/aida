title: 'Orchestrator: a landed-spec refusal returns None from shelve_on_failure, so the drain treats it as un-shelved'
description: |
  RealPhaseDriver::shelve_on_failure (phase_driver_trait.rs, TASK-3501 guard) returns Ok(None) when a request-changes/reject verdict arrives on a landed spec (Completed, or PR merged). drain callers in auto_complete.rs (~3288) treat None as "un-shelvable", so the batch drain may pause on that spec instead of moving past it. The PR already merged, so pausing is the conservative choice. If advancing is preferred, the drain needs a distinct "landed, skipped" outcome.

  Raised by the implementer while working TASK-3501.
