description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-2053, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking, minor: with no seat_tree knob, a contained launch now runs 'git clone --reference <main> <origin_url>' (seat_clone.rs:422-429), so an unreachable origin (offline host, bad URL, credential failure) refuses a contained launch that a worktree served before the flip. The plan doc's 'The flip never turns a working contained launch into a refusal' (docs/plans/2026-10-16-bug-2169-contained-clone.md S4c as built) overclaims, and the release note does not say clone seats need origin reachable at launch. The advisor decides: a default fallback like ruling 2, or a doc fix.
