    1. **Verify Blockers Completed**: Confirm `STORY-2238`, `STORY-2254`, `STORY-2255`, `STORY-2256`, and `TASK-2689` (plus `TASK-2688` / `BUG-2391` if claiming burndown/watchdog parity) are `Completed` on `origin/main`.
