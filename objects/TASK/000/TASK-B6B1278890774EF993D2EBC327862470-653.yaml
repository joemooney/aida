    ## 3. Dependency-to-Evidence Map & Required Final Smoke Receipts (`TASK-2690` AC-2)

    Per operator proxy decision `01a1962b-04f1-7eb3-a68f-84ddee33f75b`, `TASK-2690` is the closure sweep for `EPIC-612` and **cannot assert full contained Codex parity until each blocker merges and the smoke receipts below are captured on the merged live binary**:

    1. **`STORY-2238` (Vendor-neutral Linux containment)**:
       - *Receipt required*: `aida config permissions show` and `aida agent new codex --role implementer --no-exec` showing `AIDA-contained` (`bwrap` filesystem ro-bind, `~/.codex` + worktree rw-binds, egress allow-list proxy with OpenAI hosts, and grant keyring) without requiring `claude` on `PATH`.
    2. **`STORY-2254` (`aida agent new codex --bg`)**:
       - *Receipt required*: `aida agent new codex --bg --role implementer --no-exec` (pure preview) and a detached Codex run receipt recording lease, child grant delegation, and containment posture.
    3. **`STORY-2255` (`Product` & `Advisor` fork-from-live on Codex)**:
       - *Receipt required*: `aida advisor watch --once --dry-run` (or unit/integration test receipt) proving `codex exec fork` / resume from a live `~/.codex/sessions` transcript instead of cold-boot fallback.
    4. **`STORY-2256` (Universal Codex mail wake & doctor check)**:
       - *Receipt required*: `aida --format toon agent wake arm <handle>` AND plain `aida agent wake arm <handle>` (verifying `lib_part1.rs::rewrite_agent_default_new` includes `"wake"`), `SessionStart` hook auto-arming a non-`agent new` Codex session, and `aida doctor` checking `codex-mail-wake` by default when `vendor = "codex"`.
    5. **`TASK-2689` & `TASK-2688` (Portable `.agents/skills/*/SKILL.md` cleanup)**:
       - *Receipt required*: `aida skill lint` and `grep -rn "AskUserQuestion\|--vendor claude" .agents/skills/` returning zero unguarded Claude-only instructions in portable skills.
    6. **End-to-End Contained Codex-Only Linux Loop Receipt (for `docs/product-integrations.md` & `docs/showcase/integrations.html`)**:
       - *Receipt required*: Citation of merged PR/commit SHAs where `product`, `advisor`, `implementer`, and `reviewer` seats ran contained on Linux under Codex (`[agents] vendor = "codex"`, `[agents] contained = true`) with no Claude fallback.

    ---

