    3. **Edit Source Markdown Files**:
       - `docs/agents/seat-parity.md`
       - `docs/product-integrations.md`
       - `docs/autonomous-drain.md`
       - `docs/agents/claude-surfaces-codex-parity.md`
       - `docs/agents/aida-repository-guide.md`
       - `docs/cli/03-work-autonomy.md` and `docs/cli/06-roles-sessions.md`
    4. **Regenerate & Verify Website Showcase**:
       - Run `python3 docs/showcase/build.py` (updates `docs/showcase/integrations.html`, `docs/showcase/library.html`, `docs/showcase/search-data.js` while keeping `glossary.html` and `authority.html` intact).
       - Run `python3 docs/showcase/build.py --check` (must exit 0).
