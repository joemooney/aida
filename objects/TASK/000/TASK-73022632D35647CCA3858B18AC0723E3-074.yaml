title: S1 lists cli-help in TRAIN_GENERATED but does not run it in the train (train_run=false)
description: |
  The sketch table lists cli-help as a derived train entry. Its regeneration runs cargo (a cold build took 12m42s), and its input glob (aida-cli-lib/src/) matches almost every train. In S1 coverage is unchanged, so every car has already passed the strict check and the tip golden is current: running it would cost minutes on nearly every train and produce no change. TrainEntry.train_run is therefore false for cli-help (aida-cli-lib/src/gate/train_generated.rs), and the driver's train phase refuses it (TRAIN_ENTRIES). S3, which excludes the golden from coverage, should turn it on and supply the offline cargo environment (CARGO_HOME, RUSTUP_HOME and a target directory), as the conflict lane does in seat_clone.rs.

  Two related choices: the train sandbox honours [contained] read_allowlist exactly like conflict-lane regeneration does (ro-bind / when the list is empty). A refused regeneration is printed to stderr and the train continues as built (today's behaviour); the refusal reason is not journaled separately, but the journaled Built records a regen commit whenever one is made.

  Raised by the implementer while working TASK-3963.
