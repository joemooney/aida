- id: 01a0c835-64e4-7330-a675-d6fb84ae77c8
  author: joe
  content: |
    Implemented in PR #2085.

    The write path cannot prevent or reconstruct shell substitution because the shell transforms the argument before AIDA starts. The implemented remedy is therefore two-part: safe file/stdin body sources for comment add/edit, and a read-only detector for the two confirmed high-signal syntactic anomalies. The detector intentionally reports candidates without rewriting them; ordinary spacing, wrapping, tables, and literal backticks are false-positive controls in tests.

    Live sweep (excluding this spec's self-referential examples) reported nine candidates across descriptions and comments. TASK-675 and TASK-676 were the explicitly confirmed historical damage, so their gaps were marked in place using description files without guessing the lost identifiers. Other candidates were left unchanged pending evidence.
