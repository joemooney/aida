  content: |-
    [aida:advisor] A FOURTH CONFIRMED INSTANCE, CAUSED BY ME, HOURS AFTER PROMOTING THIS FINDING, AND CAUGHT ONLY BY AN UNRELATED SHELL ERROR.

    2026-09-21 15:34 MST. I ran `aida comment add TASK-1289 "...execution_mode remains BACKTICK-guided-BACKTICK and I am NOT queueing this..."`. Backticks inside a double-quoted shell argument are COMMAND SUBSTITUTION. The shell executed `guided`, which does not exist, and substituted its empty stdout.

        STORED:  execution_mode remains  and I am NOT queueing this for a headless drain.
                                       ^^ the hole, with this finding's exact signature

    THE SENTENCE STILL PARSES AND READS AS COMPLETE. A reader meets "execution_mode remains and I am NOT queueing this" and has no reason to suspect a word was removed - the grammar survives, and the only trace is the double space this spec identifies as the signature.

    I CAUGHT IT BY ACCIDENT. `bash: line 11: guided: command not found` appeared in the tool output. Had the eaten word been a real command - `date`, `true`, `clear`, `env`, any binary on PATH - THERE WOULD HAVE BEEN NO ERROR AT ALL, and the substitution would have inserted that command's OUTPUT into the spec rather than deleting text. THAT IS STRICTLY WORSE THAN THE THREE INSTANCES ON RECORD, which all lost text. A silent insertion of `date` output into a requirement body would be indistinguishable from an author's own words.

    I have REPAIRED IT IN PLACE per acceptance item 2, not appended: `aida comment edit --req-id TASK-1289 --comment-id 01a0c61c-...` with the corrected content. Verified after: the damaged form now returns zero matches and the corrected form is present in the stored YAML. Item 2's mechanism works and is the right one.

    WHAT THIS INSTANCE ADDS TO THE SPEC, beyond a fourth tally mark:

      1. THE HAZARD IS NOT LIMITED TO LONG PROSE OR TO DESCRIPTIONS. Every previous instance was a
         long description or comment body. This was a single word in a routine status note. ANY
         shell-quoted argument containing a backtick is exposed, including short ones, which is
         where nobody thinks to use a heredoc.
      2. THE DELETION CASE IS THE LUCKY ONE. The failure this spec documents is text being EATEN.
         The same mechanism INSERTS arbitrary command output whenever the backticked token happens
         to name a real executable. The detector's double-space signature finds deletions and would
         not find an insertion at all.
      3. WRITING THE SPEC DOES NOT INOCULATE THE AUTHOR. I promoted this finding at 14:2x with the
         note that its prevention is "a documentation and habit fix, not a code change", and
         violated it at 15:34. A habit fix that the person who just wrote it down cannot keep for
         ninety minutes is not a habit fix. THAT IS AN ARGUMENT AGAINST ACCEPTANCE ITEM 3'S
         FRAMING, and I am recording it against my own earlier disposition rather than quietly.

         Item 4 asks whether the write path can do anything at all, and correctly expects the answer
         to be no - by the time AIDA sees the string the text is already gone. That remains true for
         PREVENTION. It is NOT true for DETECTION: AIDA receives the damaged string and could run
         the double-space signature on inbound description and comment text at write time, warning
         the author while they are still there to fix it. That is a cheap guard the spec currently
         does not ask for, and it would have caught this instance at 15:34 instead of by luck.
