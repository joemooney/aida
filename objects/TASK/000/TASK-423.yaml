title: aida queue done --force flag has blank --help description
description: "The `--force` bypass flag on `aida queue done` (added by BUG-269) is declared with a regular `//` comment to avoid leaking the SPEC-ID into clap's `--help` output (per `docs/user-facing-text-conventions.md`). The side effect is that `aida queue done --help` renders the flag with a blank description column:\n\n```\nOptions:\n      --user <USER>  User ID (defaults to AIDA_USER or system user)\n  -y, --yes          Skip confirmation\n      --force        \n  -h, --help         Print help\n```\n\nUsers running `--help` to understand the flag have no in-CLI signal of what `--force` does.\n\n**Fix:** Replace the `//` comment at `aida-cli/src/cli.rs:2462-2464` with a `///` clap doc-comment that omits the SPEC-ID, e.g.:\n\n```rust\n/// Bypass the commits-without-PR pre-check. Use only when the spec was\n/// implemented on a different branch that is already merged.\n#[clap(long)]\nforce: bool,\n```\n\nVerify after with `aida queue done --help` — the description column should be populated and the user-facing-text convention (no SPEC-ID in --help) should still be satisfied.\n\nRaised in review of PR-136: https://github.com/joemooney/aida/pull/136#issuecomment-4504095819"
