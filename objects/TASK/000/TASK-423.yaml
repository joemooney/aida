    Implemented via commit d7caf4ca:

    - Promote `--force` flag's `//` block comment at `aida-cli/src/cli.rs:2503-2505` to `///` clap doc-comments so the `--help` description column is populated (was blank).
    - Strip the SPEC-ID from the user-facing copy; keep `// trace:BUG-269 TASK-423 | ai:claude` as a plain comment so the breadcrumb survives without leaking into `--help` (per `docs/user-facing-text-conventions.md`).

    Verified with `aida queue done --help` — `--force` now shows the full description.

    Follow-up: filed TASK-447 — the sibling `--skip-pr-check` flag (BUG-285) has the same blank-description-column problem; spotted incidentally and out of scope for TASK-423.
