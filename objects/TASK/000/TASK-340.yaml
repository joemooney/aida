  content: |-
    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: Autonomy metric (autonomous-duration fraction + intervention-count per drain, drain-end summary, dated history). Verified `aida autonomy` namespace exists but ONLY carries `calibration`; the metric is explicitly not built ("broader autonomy-report views land alongside the autonomy-metric work that owns them"). Dependencies STORY-325 (punt-ledger timestamps) / STORY-301 (drain-state total) gate it. Build now?
      a) Ship the full roll-up: compute fraction + intervention-count from punt-ledger paused_at/resolved_at + drain-state wall-clock, print drain-end summary, add `aida autonomy report` history view, scaffolding-pack.
      b) Ship intervention-count only (the spec's own "cleaner maturity signal" — count of escalate-to-human punt records per drain); skip the availability-polluted duration fraction until wanted.
      c) Defer — it's a visibility/morale metric, not a reliability bug; lower value in the bugs-before-marketing phase, and it's a roll-up that gets cheaper once STORY-325/301 timestamps are confirmed populated.
      REC: b — the intervention-count is the honest maturity signal, is a thin roll-up over data the punt ledger should already carry, and lands the `aida autonomy report` surface the namespace was reserved for, without the noisy duration math.
