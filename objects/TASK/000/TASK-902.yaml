title: 'Cockpit paint floor: aida list --blocked does a full backend.load (~1.4s) — cache-project the blocked flag'
description: 'The blocked/waiting board (STORY-686) paints in ~1.4s debug, gated by its slowest leg: aida list --json --blocked, which does a full backend.load() to walk BlockedBy edges. BUG-618 fixed the QUEUE panel (storage.load -> cache summaries) but NOT this --blocked leg. To get the cockpit sub-second: cache-project the blocked flag (compute BlockedBy-incomplete into the SQLite cache at write time so --blocked reads the cache like other list filters), or a lighter blocked-walk that avoids loading all objects. The board fires legs concurrently so paint = slowest leg; this is the one to cut.'
