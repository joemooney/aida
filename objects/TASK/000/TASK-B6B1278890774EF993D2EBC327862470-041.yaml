  content: 'ADVISOR RULING 2026-10-28 05:35: fix now (not a regroup item). Scan kernels with outside_paths(text, true) like the dispatch facade, so aida_core paths count, and add each authority-feeding aida_core definer the kernels reach (team::TeamRoster::load, team::canonical_role, liveness::process_start_identity, liveness::process_identity_is_alive, liveness::pid_is_alive, liveness::process_start_time, store_locate::locate_distributed_store_from, and any others the scan finds) to the kernel leaf list with a reason. Do the same for orchestrator inventories so they are frozen too. aida-core/ is not protected, so this makes the reach enumerated and frozen, which is the facade standard. Fold TASK-b6b1278890774ef993d2ebc327862470-043 into the same PR.'
