description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2428, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: queue_cmd.rs:13216/13925 - setup rollback stays armed across the whole launch closure, so a panic after a headless reviewer/implementer has run unwinds through the armed receipt and force-removes the worktree (uncommitted work lost) and lease, contrary to the 'any other outcome keeps the setup' comment. Disarm once the child is spawned, or catch_unwind around the closure.

