spec_id: TASK-b6b1278890774ef993d2ebc327862470-251
title: 'aida-pickup.md + aida-pr.md: replace hand-written State preamble blocks with aida state-snapshot calls'
description: |-
  TASK-391 shipped the deterministic `aida state-snapshot --spec <SPEC-ID>` command but did not migrate the six finish-state templates in aida-core/templates/skills/aida-pickup.md (orchestrator / batch / cluster-drained / cluster-partial / simple-more / simple-empty) or the one in aida-pr.md (orchestrator-mode) to call it.

  Today each template still embeds the seven-row "State:" block as fixed-width text that the skill author hand-substitutes from `git status`, `gh pr view`, `aida show`, `aida session show`. The substitution drifts — that drift is exactly what TASK-391 fixed at the engine layer. The remaining work is to thread the call through each template so a reader sees the State preamble materialise from one command instead of seven manual lookups.

  Acceptance:
  - Each template's State preamble block is replaced by a directive to run `aida state-snapshot --spec <SPEC-ID> [--tests "..."] [--fmt "..."]` and emit its output verbatim above the table.
  - The skill prose mentions `aida state-snapshot --json` as the Step 5b finding-metadata source.
  - Templates' golden examples in the skill body update to match the deterministic command's output shape (any drift surfaces during the rewrite).

  Raised by the implementer while completing TASK-391.
