title: 'deputy shell: legacy bash runner detection also accepts the bare-name start form, and submit agrees with list about a live legacy runner'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2468, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): list now prints 'runner: live, pid P (legacy bash runner)' but submit (deputy_shell_cmd.rs:319, live_runner().is_none()) still bails 'no script deputy is running'. An agent that trusts list then hits a contradictory refusal; that refusal should say a legacy bash runner is live and needs 'aida-deputy-shell submit' or a native restart.

