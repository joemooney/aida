spec_id: TASK-b6b1278890774ef993d2ebc327862470-144
title: 'Contained headless child issuance: fail fast for every role, typed quota refusal, dead issuer removed'
description: |
  Bundled cleanup from the PR-3157 (BUG-HOME-045) approved review. This task absorbs TASK-HOME-143, TASK-HOME-145 and TASK-HOME-146 (advisor ruling 2026-10-31 04:15, 2026-10-28 one-ruling rule).

  1. queue_cmd.rs (~13430): the fresh headless arm mints through issue_headless_child -> issue_child, which ignores containment. Route every headless child launch, reviewer and non-reviewer, through the containment-aware issuer so a contained headless seat without a presentable key fails fast before launch. Correct the test doc that claims every path already does this.
  2. preflight_sandboxed_child_key: key-quota exhaustion must return ChildGrantRefused (not a plain bail) so it gets the same lease-release handling as the ELOOP refusal. (was TASK-HOME-145)
  3. seat_authority.rs issue_sandboxed_child has no callers: delete it, or make it the one issuer used by item 1. (was TASK-HOME-143)
  4. Add criterion-id traces to the BUG-045 tests, plus one contained record+collect test for AC ace2889c, so `aida criteria` stops listing the BUG-045 ACs as untraced. (was TASK-HOME-146)

  Acceptance:
  - A contained headless non-reviewer launch with no presentable key refuses before spawning, with a test.
  - Key-quota exhaustion in the preflight yields ChildGrantRefused and releases the lease, with a test.
  - No dead child issuer remains in seat_authority.rs.
  - `aida criteria BUG-HOME-045` reports no untraced criteria.
  Gate: LIGHT (one targeted cargo test + make check-ci-fast).
