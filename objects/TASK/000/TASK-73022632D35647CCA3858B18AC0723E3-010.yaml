title: aida pr train --check does not evaluate an active mandate's cover; such PRs report no at the mandate gate
description: |
  Acceptance (2) asks for exactly the train's gates and (3) for no writes. They conflict in one place: mandate_ship_cover (gate/mandate_ship.rs) appends to ~/.aida/mandates/exclusions.jsonl (note_exclusions) and may append a carry-over answer to the gate ledger, and LiveChecks::mandate_cover records a held-gate event and a mandate-drive action on refusal. So in read-only mode LiveChecks::mandate_cover (aida-cli-lib/src/pr_train.rs) returns "no mandate" when none is active (exact) and, when one is active and the answer depends on it (a supervised spec with no human at a terminal, or a held PR), reports not eligible at gate "mandate" with the remedy "aida pr train N --dry-run". The check can therefore say no where the train would say yes; it never says yes where the train would say no. Closing the gap needs a read-only mandate_ship_cover (exclusions computed in memory, CarryOverSite::read_only), a change inside the protected gate module.

  Raised by the implementer while working STORY-2824.
