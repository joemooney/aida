description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2491, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Non-blocking (minor): destroy_inner's slice-only checkpoint count (aida-cli-lib/src/seat_clone.rs:3881-3898) passes only caller-supplied shipped heads, not the in_main tip excuses probe_until computes. A seat that publishes through main has no origin tracking ref in its clone, so checkpoints already published read as unpublished and teardown runs an unneeded salvage; a salvage failure there can keep a clone with nothing to save.

