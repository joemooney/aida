title: 'aida list --tree: parent/child clustering view (parallel to aida queue list --tree)'
description: |-
  aida queue list --tree groups queue entries by parent EPIC for visual clustering (TASK-X under EPIC-Y, sorted by item count desc, with an Unscoped group at the end). The same affordance is missing from aida list. Use case: surveying the backlog for an EPIC's outstanding work, or seeing all children of FOLDER-X at a glance.

  Proposed: aida list --tree shows requirements grouped by parent EPIC (or first-parent typed relationship), preserving the existing --type/--status/--priority/--tag filters. Unscoped (no parent) appear under a final Unscoped group. Visual shape mirrors queue list --tree for consistency.

  Surfaced 2026-05-28 by operator: 'we have aida queue list --tree but not aida list --tree, open a task if we should have that also'.
