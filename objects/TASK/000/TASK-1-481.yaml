title: 'minor: disk_emergency::run_emergency appends the ledger once, after apply() fin…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-1916, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: disk_emergency::run_emergency appends the ledger once, after apply() finishes, while the scheduled child is killed at SCHEDULED_COMMAND_TIMEOUT (120 s). In a gh-down emergency tick, run_emergency's merged_offline (60 s budget) plus escalate_stuck_floor -> reclaimable_on -> survey_from_env's second merged_offline (another 60 s) reach the timeout (measured ~3 s per 300 commits, so the 20 s squash cap is hit per branch on 158 worktrees). A kill during run_emergency loses the Delete rows and the notice; a kill in the stuck scan routes 'timed out' instead of STUCK. Fix: append each ledger row as it happens, and reuse one survey/offline scan for both halves (disk_emergency.rs:1263, doctor_cmd.rs:1323).

  PR: #2859
  Reviewed sha: d00e3bc02715fe44ef1e5cb9db2ec6ee8342cc80
