title: 'aida push: consider warning when there is uncommitted/unstaged work'
description: 'OPEN QUESTION FOR OPERATOR (recorded 2026-06-19, do not block): the operator noted aida push does not warn if there is unstaged work, and was unsure if it should. Advisor lean: unstaged/uncommitted work is not pushed anyway (expected git behavior; raw git push does not warn either), so a hard warning risks noise. A GENTLE one-line notice ("note: N uncommitted change(s) not included in this push") is defensible and low-cost; a block is not. Proposed slice: a non-blocking notice only, opt-out-able. Decide warn-vs-silent on operator input before building.'
