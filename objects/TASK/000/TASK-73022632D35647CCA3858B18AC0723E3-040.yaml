title: 'Throughput guard: name the cause on a STUCK-REVIEW line (watcher admission busy, or a stale reviewer tree or lease)'
description: |
  The advisor's 11:58 note on TASK-3827 kept one enhancement from the 11:55 note in that spec: a STUCK-REVIEW line should name why no reviewer was launched ("watcher admission is busy" in the review-watch log, or a stale aida-pr-N reviewer tree or lease). The 12:55 brief did not list it and the TASK-3827 change does not do it.

  Why it was left out: the watcher prints "watcher admission is busy" to its own stderr (aida-cli-lib/src/review_watch.rs:2902 and :3115). No record of it exists that the guard can read, so naming it means the watcher first has to write one, in the reviewer admission path. The stale reviewer lease half is readable today (pr_lease_takeover::reviewer_target on this clone's leases) and could be added to the STUCK-REVIEW summary in land_stalls.rs classify_pr.

  Raised by the implementer while working TASK-3827.
