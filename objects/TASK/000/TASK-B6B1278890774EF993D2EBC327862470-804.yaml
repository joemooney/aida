title: Observation envelope v1 generation, validation and manual-email export
description: 'First slice explicitly authorized by the 2026-11-04 advisor ruling on STORY-2479. Implement store-independent aida intent note/validate/export, the approved exact six-key v1 canonical SHA-256 envelope with a closed observation kind, bounded reads and byte limits, explicit sensitive-content deny patterns, and tests proving manual-email round trips and no product/store mutation. Preserve intent <SPEC>. Intake policy enrollment, branch publication/pull, receipts/processing and comment recovery remain under STORY-2479 for a later slice. Acceptance: strict unknown/duplicate/type/version/kind/checksum refusals; 512 B title, 64 KiB body, 128 KiB envelope; no inferred metadata or automatic startup/store side effects; portable JSON attachment and sanitization limitation.'
