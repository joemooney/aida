title: Observation envelope v1 generation, validation and manual-email export
description: |
  First slice explicitly authorized by the 2026-11-04 advisor ruling on STORY-2479.

  ## Goal
  Capture and manually email a reviewed observation without initializing or writing a requirement store. Preserve existing spec comprehension.

  ## Acceptance
  - Add aida intent note/validate/export with the approved exact six-key v1 envelope, canonical ordered compact-JSON SHA-256, full-digest identity and INTENT-<12 hex> display label.
  - Admit only the observation kind in v1 and observation/question/request categories; refuse unknown/duplicate/missing keys, wrong types, unsupported versions/kinds, trailing JSON and invalid checksums.
  - Bound reads before parsing and enforce nonempty title <=512 UTF-8 bytes, body <=64 KiB and serialized envelope <=128 KiB. Reject special files without blocking.
  - Scan decoded title and body with explicit repeatable deny-pattern regex rules. Refusal diagnostics identify the rule without echoing its pattern or private text. Validation does not certify sanitization.
  - Local commands precede identity, telemetry, role, cache and store startup; infer no metadata and never execute imported prose. Generation/export emit only the self-contained envelope on stdout; validation requires no spec allocation.
  - Demonstrate manual-email round trips outside initialized projects, a fixed hash vector and no normalization, exact size bounds, sensitive-text refusals, and unchanged product/store refs, index and startup state. Preserve aida intent <SPEC> parsing.

  ## Remaining parent scope
  Independent intake-policy enrollment/pinned remote, orphan aida-intent publication/pull, receipts/processing and backup-comment recovery remain under STORY-2479 for subsequent slices. Existing store-only transport must remain unchanged.
