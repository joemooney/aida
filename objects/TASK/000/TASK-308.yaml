title: 'aida pr rebase <N>: CLI command to rebase a PR onto its base default (clean or abort)'
description: |-
  Wrap the standard "rebase a PR before review" recipe into a single AIDA command. Today the user runs ~6 manual git commands; this collapses it to one. Carved out from STORY-281 (orchestrator pre-flight rebase hook) so the CLI ships independently — usable manually before the orchestrator integration lands.

  ## CLI surface

  \`\`\`bash
  aida pr rebase <N>                    # auto-rebase if clean; abort + report if conflicts
  aida pr rebase <N> --check            # report-only: stale? overlap? conflicts predicted?
  aida pr rebase <N> --interactive      # let the user resolve conflicts, then continue
  aida pr rebase <N> --no-smoke         # skip the post-rebase build smoke check
  aida pr rebase <N> --base <ref>       # rebase onto an explicit base (default: origin/<PR's base>)
  \`\`\`

  ## Behavior

  ### \`aida pr rebase <N>\` (default mode)

  1. Resolve PR \`<N>\` via \`gh pr view <N> --json baseRefName,headRefName,headRepositoryOwner,isDraft\`
  2. Detect cross-fork PR — if PR's head repo ≠ origin, **abort** with message: *"PR-<N> is from a fork (\`<owner>/<repo>\`); aida can't force-push to a fork's branch. Run \`gh pr checkout <N>\` + \`git rebase\` + manual push there."*
  3. Create a temporary worktree (\`/tmp/aida-pr-rebase-<N>-<random>\` or under \`.aida/worktrees/pr-rebase-<N>/\`), check out the PR branch
  4. \`git fetch origin\`
  5. \`git rebase origin/<base>\` (where \`<base>\` is the PR's base, typically \`main\`)
  6. **If conflicts**:
     - \`git rebase --abort\` (clean up)
     - Print conflicted files + manual recipe (\`gh pr checkout <N>\` + \`git rebase origin/<base>\` + resolve + \`git push --force-with-lease\`)
     - Remove the temp worktree
     - Exit non-zero
  7. **If clean**:
     - Run smoke check (unless \`--no-smoke\`): \`cargo build --release\` minimum (configurable via \`.aida/config.toml\` \`[pr-rebase] smoke_check = "cargo build"\` or similar)
     - If smoke check fails: abort, print failure, leave the temp worktree for inspection, exit non-zero
     - If smoke check passes: \`git push --force-with-lease origin <head-branch>\`
     - Remove the temp worktree
     - Print confirmation with new SHA
     - Exit zero

  ### \`aida pr rebase <N> --check\` (report-only)

  Print:
  - PR base SHA vs current origin/<base> HEAD (n commits behind)
  - PR's changed paths
  - Files modified in those commits-since-base
  - Overlap between the two sets
  - Whether \`git rebase origin/<base>\` would conflict (\`git merge-tree\` simulation if possible, else best-guess from overlap)
  - "Recommendation: rebase needed" / "rebase clean (safe)" / "rebase will conflict (manual)"

  Exits zero regardless; this is informational.

  ### \`aida pr rebase <N> --interactive\`

  Same as default, but if conflicts arise, drops the user into the temp worktree with conflict markers so they can resolve. After they \`git rebase --continue\` and exit, AIDA finishes the push.

  ## Acceptance

  - [ ] \`aida pr rebase <N>\` works in default mode on a clean rebase: temp worktree → fetch → rebase → smoke check → force-push-with-lease → cleanup
  - [ ] Aborts gracefully on conflicts: temp worktree cleaned, conflicted files listed, manual recipe printed, exit non-zero
  - [ ] Cross-fork PRs detected and refused with clear message
  - [ ] \`--check\` mode reports stale-base + overlap + conflict-prediction without modifying anything
  - [ ] \`--interactive\` mode drops into temp worktree on conflict, picks up after \`git rebase --continue\`
  - [ ] \`--no-smoke\` skips the build sanity check
  - [ ] \`--base <ref>\` allows explicit base (for PRs against non-main branches)
  - [ ] Temp worktrees always cleaned up (success, conflict, smoke-fail, interrupt)
  - [ ] Smoke-check config: \`.aida/config.toml\` \`[pr-rebase] smoke_check\` (default \`"cargo build --release"\` for Rust projects; configurable per project)
  - [ ] Force-push uses \`--force-with-lease\` always — never plain \`--force\`
  - [ ] Tests: simulated PR with clean rebase, with conflicts, with fork origin, with --check mode
  - [ ] \`aida pr --help\` documents the subcommand

  ## Out of scope

  - **Auto-resolving conflicts** — never. Conflict resolution always needs human judgment.
  - **Pre-flight orchestrator integration** — that's STORY-281 (depends on this TASK)
  - **\`--no-human\` ack flag for the pre-reviewer hook** — STORY-281's territory
  - **Rebase across multiple PRs in sequence** — out of scope; one PR at a time

  ## Composes with

  - **STORY-281** (depends on this TASK; orchestrator pre-flight hook calls \`aida pr rebase <N> --check\` then \`aida pr rebase <N>\` if needed)
  - **TASK-285** (\`aida queue work --batch\` — batch drains are where parallel-merge windows fire most often)
  - **BUG-223** (orchestrator phase-1 branch-swap; sibling reliability work)

  ## Origin

  2026-05-17 user observation when about to queue PR-65 (web /ultraplan STORY-278 output) for headless review. The session.rs overlap between PR-65 and the just-merged PR-66 (TASK-303) means a rebase is required before review, but the recipe is 6 manual git commands. User asked: *"have we any plans to make that an aida command?"* — STORY-281 already proposed the CLI surface; this TASK splits it out so it ships independently of the orchestrator integration.

  Decision rationale: ship the CLI first, use it manually for a stretch, gather evidence about which scenarios need the orchestrator-level enforcement, then complete STORY-281 with empirical defaults.
