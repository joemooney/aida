title: Lowering [mandate] max_ttl_hours invalidates live mandates longer than the new cap
description: |
  Every load re-validates a mandate record against the cap (gate/mandate.rs record_problem). With the cap now configurable, a 72h mandate minted under `max_ttl_hours = 72` is ignored with a warning ("its lifetime exceeds the 24h cap") as soon as the key is removed or lowered, or when a command runs in a project whose config lowers it. That is fail-closed and covered by a test, but an operator editing the config mid-mandate loses the mandate without a prompt. Consider a line in `aida mandate status` or doctor.

  Raised by the implementer while working STORY-2828.
