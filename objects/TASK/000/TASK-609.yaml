title: 'SPIKE-46 follow-up: CI conformance gate guarding AIDA''s own on-disk YAML format against serializer drift'
description: 'From SPIKE-46''s FINDINGS.md follow-ups. A drift in AIDA''s serde_yaml output (field reorder, scalar-style change, dropped sorted-collection serializer, timestamp-format change) would break (a) write_object_if_changed''s no-op detection — spurious git diffs on every spec — and (b) every external vendor''s byte-identical writes (the multi-vendor moat contract). Adds object_store::tests::requirement_yaml_holds_the_write_conformance_contract: builds a Requirement with out-of-order tags + custom_fields + a Custom relationship + a None optional field, serializes via the same serde_yaml path write_object uses, and asserts the four conformance properties (sorted collections, !Custom tag, RFC3339-Zulu timestamps, omitted None) plus serialize→deserialize→serialize byte-idempotence. Runs in the existing cargo test suite, so it IS the CI gate — no bespoke workflow. Verified no prior serializer-stability test existed (test_write_read_roundtrip only checks data round-trip). trace:SPIKE-46'
