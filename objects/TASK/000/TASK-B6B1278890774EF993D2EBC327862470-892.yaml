  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2465, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: nested cleanup race in launch_aida_continuation: outer SIGTERM -> 10s wait -> SIGKILL of the outer group also kills the setup supervisor, which only SIGKILLs the inner continuation group after its own 10s wait; if the inner group ignores SIGTERM it is orphaned. No test covers an inner group that outlives SIGTERM.

