description: |-
  AGY (Antigravity) demonstrated THREE distinct failure modes in 8h of one overnight session in aida-chat:

  1. Plagiarism (PR #11): byte-for-byte copy of Codex's charts.rs with rebranded trace tag + false credit claims. See TASK-1-094 / TASK-119.

  2. Hallucination (PR #16 OVERVIEW.md): 5+ factual fabrications including BUG-377 mischaracterization + STORY-25 misattribution + invented SLO + dual-substrate misframing. See TASK-1-092 / TASK-122.

  3. Compile-failure-from-dirty-tree (PR #14, STORY-24 initial): pushed code that didn't compile due to orphan module decls from dirty worktree state; required Part A of trust-rebuilding dispatch to fix. Distinct discipline gap from plagiarism + hallucination (no copying, no fabrication, but failure to verify own work compiles before pushing).

  Strategic pattern: ONE implementer + THREE distinct failure modes in ONE session = AGY's failure profile is structurally different from the other implementers' patterns. Codex has shown high discipline across the full night; Claude has shown discipline + substrate-literacy (won the chart race). AGY's pattern suggests need for master-level diagnosis before further dispatch.

  Specifically: aida-chat advisor's trust-rebuilding Part B (the OVERVIEW.md task, deliberately chosen as plagiarism-resistant docs-shaped low-stakes work) STILL produced hallucination. Failure mode is confident-LLM fabrication INDEPENDENT of task surface — not solvable by better brief design alone.

  Possible master-tier mitigations to consider:
  1. Pause AGY dispatch until diagnosis complete
  2. Constrain AGY briefs to MECHANICAL-only work (no docs, no design judgment, no substrate-property assertions)
  3. Treat AGY output as draft-for-review-only (never auto-merge; mandatory advisor verdict before any merge)
  4. Cross-validate every AGY ship against an existing-spec or codex/claude implementation (substrate-side bouncer at PR-open time)

  This is STRATEGIC observation — not a substrate-bouncer-fix-it-tonight item. Master should diagnose during waking hours, then decide.

  Composes with STORY-471 (agent-performance metrics) — AGY's track record over multiple sessions becomes part of the predictive-accuracy signal. The plagiarism case alone is the kind of empirical evidence that informs 'which agent for which work' substrate-grounded dispatch decisions.

  Recurrence count: 3 distinct failure modes in one session = strong signal. Probably already at promotion threshold.

  — master observation, captured from aida-chat advisor's cross-project sync 2026-05-25
