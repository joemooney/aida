title: 'TASK-62 follow-up: Windows-capable home-dir override (dirs::home_dir uses SHGetKnownFolderPath, not env)'
description: "PR-11 reviewer caught 2026-05-11: TASK-62's overnight attempt to make `bg_worker_records_error_on_missing_remote` cross-platform via setting `HOME` and `USERPROFILE` env vars **doesn't actually work on Windows** because Rust's `dirs::home_dir()` on Windows uses `SHGetKnownFolderPath(FOLDERID_Profile)`, not env var inspection. So `TempHomeEnv` has no effect on Windows — the test still fails with the original error.\n\nFixed-forward in PR-11 by reverting to `#[cfg(unix)]`. This task captures the proper Windows-capable approach.\n\n## Options for the real fix\n\n1. **Swap dirs::home_dir() → `home` crate** — the `home` crate's `home::home_dir()` respects USERPROFILE on Windows AND env on Unix. Cleanest replacement. AIDA may already pull `home` transitively; check before adding.\n\n2. **Inject the home path via config-aware wrapper** — define `aida_home_dir() -> PathBuf` that returns:\n   - `AIDA_TEST_HOME` if set (test-only override)\n   - else `dirs::home_dir()`\n   \n   Use in `write_last_fetch_entry` and any other home-path-reading code in aida-cli. Test sets AIDA_TEST_HOME instead of HOME/USERPROFILE. Smaller blast radius than swapping dirs entirely.\n\n3. **Test-only mock** — gate the test fixture on a `#[cfg(test)]` static OnceCell that overrides home-dir resolution. Cleanest from a \"production code unchanged\" perspective but requires test-only branching in the production path.\n\nOption 2 (AIDA_TEST_HOME wrapper) is probably the right call — small, scoped to AIDA's own home-reading sites, no dependency change. Option 1 is also clean if `home` is already in the dep tree.\n\n## Composes with\n\n- TASK-62 (the original task — descoped to unix-only in PR-11)\n- STORY-79 (bg_worker statusline fetch) — the code under test\n- The TempHomeEnv RAII guard already exists — can be extended to also set AIDA_TEST_HOME\n\n## Acceptance\n\n- [ ] `bg_worker_records_error_on_missing_remote` runs (and passes) on Windows CI\n- [ ] Solution doesn't pollute production code with test-only conditionals (use option 1 or 2)\n- [ ] If option 2: AIDA_TEST_HOME documented as a test-only env (production code never reads it deliberately)\n- [ ] Other home-dir-dependent tests in aida-cli also benefit (sweep with `rg 'dirs::home_dir'` in test files)\n"
