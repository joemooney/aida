title: Case-insensitive user identity matching in queue/queries/owner comparisons
description: "Operator: user matching in queries should be case-insensitive. Today current_user_id() resolves the shell USER and surfaces compare it case-SENSITIVELY, so Joe != joe, Joe.Mooney != joe.mooney — splitting one person. This is the cheap normalization layer UNDER the fuller alias mapping (TASK-845): case-folding collapses case-variant aliases (joe/Joe, joe.mooney/Joe.Mooney@work.example share the joe.mooney stem) but NOT genuinely-different strings (joe vs joe.mooney@gmail.com need TASK-845 explicit links).\n\nSCOPE: fold user identity to a canonical (lowercase / Unicode case-fold) form at every COMPARISON boundary — queue filter (add/list/next/done/remove/move, the current_user_id matches), block owner matching (aida db block list / dispenser owner compares), assignment (--mine/--assigned), team roster dedup. PRESERVE the original casing for DISPLAY and storage (only the comparison is case-insensitive). \n\nCAREFUL: BUG-89 — the queue is keyed off the shell user identity; the fold is at COMPARISON, not at the stored key, so existing queues keep working but Joe now matches joe.\n\nACCEPTANCE: queue/owner/assignment comparisons match across case (Joe == joe, Joe.Mooney@x == joe.mooney@x); display keeps original casing; a unit test for the canonical-fold + the queue/owner match. FILES: aida-cli current_user_id + queue compare paths; the block-owner/dispenser compare."
