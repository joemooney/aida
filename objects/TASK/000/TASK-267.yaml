  content: |-
    ## Spec correction 2026-05-16 — strike TASK-260 table reference

    Acceptance criterion in the original spec said \"Rendering uses the Path/Action/Why table format from TASK-260 when shipped.\" **This is wrong** — implementer caught the contradiction during pickup design-checkpoint.

    TASK-260's Path/Action/Why table is for **parallel choices** (pick ONE of N: continue / pr / pause). TASK-267's hint is a **sequential step list** (do ALL in order: review → merge → pull). Different problem shapes; different formats.

    **Authoritative format**: numbered list, as shown in the spec's first preview:

    \`\`\`
    ⓘ Next steps for PR #47:
    1. ▶ Start review     aida queue work PR-47
    2. ↓ After approval   gh pr merge 47 --squash --delete-branch
    3. ↓ Then pull        aida pull   (auto-bumps TASK-259 → Completed)

       Or self-merge (solo dev — skip review):
          gh pr merge 47 --squash --delete-branch && aida pull
    \`\`\`

    - \`▶\` arrow on step 1 (primary action)
    - \`↓\` arrows on subsequent steps (flow continuation)
    - Self-merge alternative as an indented sidebar block
    - One-line degrade in non-TTY/piped output

    The TASK-260 cross-reference in the original acceptance is struck. Implementer is freed to ship the numbered-list shape without the table-format constraint.

    ## Pattern worth capturing in memory

    The shape mismatch (parallel vs sequential UI patterns) is a recurring trap. Worth a memory entry so dialog-role doesn't re-conflate them when filing future polish work.
