title: agent gc now keeps anchor-level mailbox id temps (unattributed owner) instead of reaping them
description: |
  BUG-2770 made `aida agent gc` reap only leftovers whose owner is provably dead. write_source_id temp files under the anchor dir (scan_id_temps(&anchored.anchor, ...) in aida-core/src/mailbox_lifecycle/leftovers.rs) cannot be attributed to any one checkout, so they are classed Unknown and are always kept. Before this change gc reaped them once they were 10 minutes old. If they pile up, they need an owner record (for example the minting checkout in the temp name) or a dedicated rule.

  Also: a pruned linked worktree's era marker is matched to a lease by admin name == worktree basename. Git's collision-suffixed admin names (name1) do not match.

  Raised by the implementer while working BUG-2770.
