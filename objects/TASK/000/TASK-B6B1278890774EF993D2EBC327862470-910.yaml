title: Legacy adoption test omits PID namespace and fails in a native sandbox
description: While validating BUG-2473, the unchanged leases::bug_1656_subagent_liveness_tests::bug_1656_adoption_stamps_harness_pid_and_keeps_unknown_keys failed at aida-cli-lib/src/tests/bug_1656_subagent_liveness_tests.rs:520 (adoption returned None instead of aaaa11112222). Reproduces as an exact isolated test and with AIDA_TRUST_PID_NAMESPACE=1. Its adoption_lease_fixture does not stamp pid_namespace; adopt_spec_lease_unlocked in leases.rs rejects an unstamped record through PidObserver::can_observe(None) outside the non-isolated initial namespace. Neither the test nor leases.rs nor pid_observer.rs changed for BUG-2473. The other 17 tests under bug_1656 pass. Update the fixture to express a current-namespace owner (or explicitly model legacy-namespace refusal) while retaining the production fail-closed observation rule. BUG-2473 targeted tests and adjacent dispatch/hygiene/remote-coverage/Git-access suites pass.
