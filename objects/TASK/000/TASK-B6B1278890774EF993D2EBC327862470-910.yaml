  content: 'Recurrence #2 by joe 2026-11-07: While validating BUG-2474 in a native PID-isolated seat, leases::bug_1772_harness_worktree_lease_tests::bug_1772_prune_stale_reaps_immortal_harness_leases also fails alone: fixture has no pid_namespace, prune reports No stale leases to release, expected 0 leases but sees 1. The unchanged session_leases_prune_stale path requires PidObserver::can_observe(lease.pid_namespace); an unstamped legacy row is deliberately unobservable in this sandbox. This is another fixture instance of the existing namespace-evidence finding. No lease code was changed for BUG-2474.'
