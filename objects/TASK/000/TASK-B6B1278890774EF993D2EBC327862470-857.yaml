description: |-
  Identical reviewer findings recurred twice for STORY-1651; do not requeue a third implementer round until an advisor chooses a different implementer/seat or resolves the dispute.

  REVIEW FINDINGS TO ADDRESS (STORY-1651):
  Verdict: CHANGES REQUESTED
  Reviewed commit: 98fb4600bcd8
  Recorded: 2026-11-05T15:58:05.108266583+00:00
  Findings:
  1. AC4 / tiering (STORY-1651.ac3ac0f5): .github/workflows/ci.yml:675 'Documentation audience coverage' runs AIDA_TEST_BIN=$PWD/target/debug/aida tests/test_docs_landing_smoke.py, but scripts/ci-gate-tiers.toml:48 classifies the step 'fast'. Its own header rule says any step naming target/(debug|release) is 'full'. In make check-ci-fast (no build; agent lanes build --profile agent, not target/debug) the symlink points at a missing file, so the step fails, or it silently passes against a stale target/debug/aida. Split the landing smoke into its own step tiered 'full', and keep the four no-build checks (unittest, inventory --check, check-doc-links, check-doc-paths) in the fast step.
  2. Finding 5 not fully closed (AC3 / constraint: keep end-user paths stable): aida-core/src/meta.rs:34 DEFAULT_PROTOCOLS spike text still says 'docs/internal/spikes/*.md', and its test asserts that at meta.rs:562. This is the protocol seeded into every adopter project. It contradicts queue_cmd.rs:10594 (research-lane contract: docs/spikes/<date>-<slug>.md) and the protocol_gate.rs messages (docs/spikes). Restore 'docs/spikes/*.md' in the default protocol and its test. The gate already accepts both prefixes.
  3. AC3 mis-retarget: aida-cli-lib/src/plan_intent.rs:2255 (the clap help for 'aida why --plain'), the comment at :1516 and the regenerated cli_help_snapshot.txt now say the cache is 'docs/internal/plain/<SPEC>.md'. plain_why_cache_path (plan_intent.rs:1982-1989) still writes docs/plain/<SPEC>.md, so the help text is wrong. Moving AIDA's cache to docs/internal/plain/STORY-1158.md also means the next 'aida why STORY-1158 --plain' recreates top-level docs/plain/, and test_docs_top_level_allow_list (which iterates the filesystem) then fails. check-doc-paths.py misses this because its regex cannot match '<SPEC>'. Either revert the help/comment/snapshot to docs/plain and exempt/ignore docs/plain, or make the cache path configurable and AIDA-local. Do not leave the help text and the code disagreeing.
  4. Cosmetic: docs/book.toml header still says 'Read: mdbook serve docs --open', which serves the unpruned internal/archive assets that finding 9 removed from book-serve. Point it at 'make book-serve' / scripts/build-reader-book.py --serve.
  5. CI: at reviewed head 98fb4600bcd8 all seven CI shards (cli-0/1, lib-0/1, contracts, gates, rest) were still in_progress when this verdict was recorded. merge-hold-gate fails only on the expected supervised merge-hold. The next round must show a green CI run, especially the gates shard that runs the new Documentation audience coverage step.
  Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
