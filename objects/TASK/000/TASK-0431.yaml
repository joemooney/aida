spec_id: TASK-0431
title: Integrate product-role recommendations with advisor autopilot
description: |-
  Define how the product role can feed advisor autopilot without bypassing advisor authority.

  Acceptance:
  - Product role may propose draft specs, rationale, acceptance criteria, priority, risk flags, and recommended disposition.
  - Advisor autopilot treats product output as evidence/recommendation, not authority.
  - Autopilot can act on product recommendations only when policy envelope allows and evidence is sufficient.
  - Architecture/cross-cutting calls still converge on the operator or supervised advisor path.
  - Document the handoff pattern from product conversation to autopilot disposition.
