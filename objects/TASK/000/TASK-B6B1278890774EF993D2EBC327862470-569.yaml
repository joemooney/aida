description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1721, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  cosmetic: lease temp files (main.XXXXXX) are created inside .aida/merge-locks/. merge_lock::status read_dir lists them as leases, and a SIGKILL between mktemp and rm orphans one; the EXIT trap does not clean it. Use a dot-prefixed name that status skips, or create the temp file outside the dir on the same filesystem.
