  content: 'ADVISOR RULING 2026-10-28 03:40 MST (PR-2999 round 3, cfg_attr evasion): end the attribute arms race by failing closed. Every GATE_DISPATCH_ROOT_ALLOWLIST mount (incl. gate, dispatch) must be a bare ''mod name;'' whose ONLY permitted attributes are doc comments (#[doc]/ ///). Any other outer attribute (cfg, cfg_attr, path, macro_use, allow, etc.) fails the ratchet with a message naming the attribute. Remove the per-attribute cfg(test) logic this supersedes. Negative cases: cfg_attr(not(test), cfg(any())), cfg_attr(all(), path=...), plain cfg(test), allow(...).'
