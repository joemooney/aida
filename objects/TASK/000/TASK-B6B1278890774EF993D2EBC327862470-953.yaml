  content: |
    ADVISOR RULING 2026-11-08 (design fork from the #3670 punts; review findings 1-3, TASK-3017). Scope: the four migrated probes in Part B only.

    1. A holder with an admitted witness is judged by the ownership reader as written. Live and Dead verdicts stand.
    2. An Unknown verdict whose only cause is a legacy unadmitted holder (no witness recorded, or holder admission unavailable) falls back to the pre-migration lease rule, so a crashed legacy holder is released exactly as it is on main today. Put this in ONE named reader function, with a comment that it is removed once every production holder writes a witness. Do not scatter it per call site.
    3. Every other Unknown cause, including NamespaceMismatch, stays retained. Dirty or unpushed work keeps its existing safeguards; the fallback never releases those.
    4. This keeps current behaviour for legacy holders and is no weakening of main. It does not change the fail-closed contract for admitted holders.

    Rework for #3670 (conflicting with main, so merge current main first):
    - Findings 1-2: implement the above, and test with the witness shape production actually writes, not seed_lease_heartbeat. Restore the crashed-reviewer coverage from TASK-2120.
    - Finding 3: route lease_adoption_refusal through the same verdict; add a test that hint and adoption agree.
    - Finding 4: move the branch filter first and share one store across the batch.
    - Finding 5: accepted as far as the tests above reach; no further call-site suite required.
    Part A (mail retention) stays out of this Refs slice. Different implementer per the repeated-findings rule. LIGHT gate: one targeted test plus make check-ci-fast.
