title: 'STORY-2325 remainder: mail retention on message state, plus the last four direct liveness probes routed through the ownership judge'
description: |
  Follow-up split from STORY-2325 PR-D by the advisor ruling of 2026-11-07 13:50.

  ## Part A: mail retention on message state (was ruling (2))
  Retirement of a mailbox source (session/seat teardown) checks message state, not the build/executable identity, with these rules:
  1. Delivered-but-unacknowledged mail: the source MAY retire only after the message is durably preserved in the canonical store (digested, readable by its logical reader afterwards). Before preservation: retain.
  2. Queued/undelivered mail: the source MUST be retained.
  3. The fresh writer-admission scan after fencing, under the lifecycle lock, stays MANDATORY (as in the signed sketch).
  Remove the build-identity gate only when 1-3 are implemented and tested (tests: unacked+preserved retires, unacked+unpreserved retains, queued retains, a writer admitted after fencing is caught by the scan).

  ## Part B: remaining direct liveness probes (rest of ruling (1))
  Route these through ownership::reader and remove them from scripts/ownership-liveness-legacy.json:
  (a) session_start.rs orphan_lease_to_adopt (stale_lease_recovery_for_lease); (b) session_start_with_receipt lease_is_live / probe_live_claude_sessions; (c) queue_cmd.rs queue/fill pickup filter (BUG-637) probes; (d) lane_liveness.rs review_lease_running.
  The ratchet baseline must shrink to zero entries for these paths.

  LIGHT gate. Parts A and B may be separate PRs (Refs this task; the last one completes it).
