title: 'minor: PerMandate.dispatch gets an or_default entry for every approved spec see…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1915, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: PerMandate.dispatch gets an or_default entry for every approved spec seen (even never routed), and skip_once adds a per.emitted key per (item, reason, incl. reap session ids); neither is pruned when a spec leaves Approved or a session is gone, so mandate-drive-state.json grows without bound.
