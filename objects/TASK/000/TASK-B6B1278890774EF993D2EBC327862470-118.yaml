- id: 01a18a8e-f199-70e2-851b-0ef9c7520126
  author: joe
  content: 'Implementer note (kind:deviation, severity:minor; draft TASK could not be filed: ID allocation hit a read-only file system in the sandbox). The view rule was NOT changed to treat a missing source as complete. A worktree deleted outside AIDA takes its mailbox with it, so whether it held unread mail cannot be known; the F5 test story1843_awaiting_mail_channel_shares_the_view pins that this must stay partial. Shipped instead: aida mailbox retention prune [--include-locked] [--dry-run] [--json], which drops registrations of deleted worktrees (path gone, parent present). After a prune the view is complete and ACKs work, and the partial note names the command. Folding into the canonical store is moot for a deleted tree. Retained copies of AIDA-retired trees are still not folded. On this machine the three stale sources are locked Claude agent worktrees under .claude/worktrees/ whose lock-owner pid 499913 is dead. After merge, run: aida mailbox retention prune --include-locked'
