title: Retire mailbox sources for removed worktrees so the inbox view stops reporting partial
description: '2026-10-29: every inbox read shows ''mail view partial: 3 source(s) not fully read (WorktreeMissing)'', and Codex could not acknowledge mail because of it. Acceptance: aida mailbox retention (or worktree remove) folds a removed worktree''s mail into the canonical store and drops the source; a missing source with nothing unread no longer marks the view partial.'
