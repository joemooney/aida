title: 'PR-3049 follow-ups: unreadable receipt anchor must make the relay unread count incomplete; remaining D2b review notes'
description: |
  Non-blocking findings from the APPROVED round-2 review of PR #3049 (STORY-1843 D2b) at 6750bc4a36d5. Fix all of them in a Refs STORY-1843 follow-up PR. ADVISOR RULING for the anchor_error case: an unreadable receipt anchor makes the unread count INCOMPLETE (unknown), so headless reuse refuses and settle_ended_runs inserts no end notices until the anchor reads.
  - [minor, non-blocking] aida-core/src/mailbox_logical.rs live_sources_observed ignores anchor_error. When the receipt anchor cannot be read, read relay mail looks unread but the count is marked complete. settle_ended_runs then inserts permanent end notices telling senders and the advisor that read mail was never read, and --handover writes handovers for read mail. The reuse refusal direction is fail-safe. Treat anchor_error as incomplete for the notice and handover paths, or document the tradeoff.
