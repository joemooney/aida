title: 'non-blocking (minor): scripts/test-timings.py stalled() waives ANY over-budget …'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1988, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): scripts/test-timings.py stalled() waives ANY over-budget rows whose JUnit spans overlap, including unbudgeted tests over default_limit and with no bound on the overrun. nextest runs num-cpus tests concurrently, so a PR that adds two new 30 s tests (no entries) in one binary, or a shared-fixture regression that slows several tests at once, overlaps and turns into ::warning:: only, so AC4's 'unbudgeted test over 10 s fails' no longer holds for that case. Tighten: never waive rows with no budget entry, cap the waived overrun (e.g. <= 2x entry), and/or require the overlapping rows to come from different binaries; add tests for those. Also span() comparisons would raise TypeError if one timestamp is naive and another tz-aware (only ValueError is caught).
  Reviewed sha: b60ea1beb2ccab227613e36a6b2239aca63cbd10
