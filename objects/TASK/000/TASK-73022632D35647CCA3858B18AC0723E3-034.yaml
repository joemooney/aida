  content: 'Product 2026-11-19 09:30, seen live: ''aida mandate renew --for 24h'' exits non-zero naming 2 advisor grants (bce71544, c92cbc58). Both are review-watch-controller per-pass children (subject review-watch-controller, bound to deputy runner pid 4089107, already capped at the advisor tty expiry), not seat grants. Renew should report per-pass controller children as kept/ephemeral, not as failures that tell the operator to re-enter a seat. There are also ~4076 controller grant files in ~/.aida/session-grants with no gc.'
