title: 'TASK-3820: renew keeps launcher-capped children and does not fail on skipped (expired/revoked/relay) grants'
description: |
  Choices made within S2b scope (PR-4280, commit d790cb075a, aida-cli-lib/src/gate/seat_authority.rs extend_one):
  - A descendant whose expiry is below its parent's (a launcher cap such as BUG-2486's ChatGPT child cap) is reported `kept`, not extended, so renewal never undoes a deliberate shorter cap.
  - Expired/revoked grants, anything under them, and relay-managed grants (TASK-3119 replacements, superseded predecessors, their descendants) are `skipped` and do not make the command exit non-zero; only `refused` (unbound, roster/chain failures, concurrent revoke, lock/IO, unreadable relay receipts) does.
  - Extension runs on every `aida mandate renew`, with or without --for.
  Raised by the implementer while working TASK-3820.
