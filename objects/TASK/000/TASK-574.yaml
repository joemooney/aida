    1. CI red (PR-350, run 26619373730) is TWO issues, neither a simple code bug:
       - BUG-103: "cargo did not resolve to the real cargo binary (stale rustup-init cache)" — flaky CI infra, often clears on re-run.
       - `error: untracked working tree files would be overwritten by merge` — the file→directory transition that IS this feature: .claude/skills/aida-pr.md → .claude/skills/aida-pr/ (folder-form). The checkout collides because the old .md and the new dir coexist. The branch likely needs `git rm` of the old single-file skill where it converts to folder form, and build.rs/embed handling for the SKILL.md-in-subdir layout.

    2. Stale + conflicting: 23 commits behind main; touches scaffolding/mod.rs, templates.rs, build.rs, Makefile — the same files just refactored by TASK-584 (aida-recover removal) and TASK-481 (techdebt scaffold). A rebase WILL conflict in scaffolding/mod.rs + templates.rs, and resolving requires authoring-level understanding of the folder-form-skills logic (not mine to resolve blind).

    Route: implementer session — `aida queue work TASK-574 --branch task-574 --steal` → rebase onto main, resolve scaffolding/mod.rs + templates.rs + build.rs conflicts, fix the aida-pr.md→aida-pr/ file/dir transition (git rm old form), green CI, then ship. Left NeedsAttention (correctly shelved) pending that.
