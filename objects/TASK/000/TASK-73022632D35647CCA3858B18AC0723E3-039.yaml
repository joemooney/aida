title: No CLI surface names the resolved per-seat agent model; TASK-3823 AC1 verified by config parse and code path only
description: |
  TASK-3823 acceptance 1 asks for verification "by `aida config show` and one dry-run or launch log line naming the model". Neither exists today:

  - `aida config show` renders no `[agents.<vendor>]` model, tiers or `seats.<seat>.{model,effort}` values.
  - `aida queue work <SPEC> --role reviewer --vendor <v> --dry-run` prints `vendor:` and `exec:` but not the model or effort the launch would pass.

  What shipped instead: the committed `.aida/config.toml` was parsed and the resolution path read in code (`aida-core/src/agents_config.rs` `tuning_from_file`; `aida-cli-lib/src/session/headless.rs` `resolve_agent_tuning`). The first real reviewer launch after merge is the remaining confirmation that the vendor CLIs accept `gpt-6.2-astra` and `claude-fable-5-2`.

  Related trap found while checking: `AIDA_AGENT_MODEL` / `AIDA_AGENT_EFFORT` in the launching environment override the seat config (headless.rs:880), so a dry-run from a seat launched with `--model` would name the env model, not the configured one.

  Suggested follow-up: show resolved model/effort per vendor and seat, with its source (env, agents.toml, config.toml, vendor default), in `aida config show` and in the `queue work --dry-run` plan.

  Raised by the implementer while working TASK-3823.
