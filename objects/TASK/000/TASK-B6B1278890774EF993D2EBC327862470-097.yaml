  Non-blocking finding carried forward from an APPROVED review verdict on STORY-B6B1278890774EF993D2EBC327862470-078, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking/minor: NodeAliasMap::rename (aida-core/src/node_alias.rs:253-259) retires bindings with exact-case b.label == old, while binding() matches case-insensitively. A hand-edited lowercase label in registry/node_aliases.toml would be found but not retired, which leaves the node with two current labels. set() (:195) also compares existing.node != node exactly, so a hand-edited uppercase node UUID would refuse as 'another node'. This only happens after a hand edit.
