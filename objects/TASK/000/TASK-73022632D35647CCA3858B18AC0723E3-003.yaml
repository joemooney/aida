title: 'BUG-2544 root cause still unreproduced: needs the two parallel deputy reviewer launches re-run on a current build'
description: |
  The lane commit for BUG-2544 is a further diagnostic (Refs), not a fix: a roster refusal of the parent grant now names the root and roster it read. The concurrent failure could not be reproduced on dell1 and `.aida/tmp/lanes/review-3896.log` is not on this host.

  What a lane cannot do: re-run the original deputy job (reviewers for two open PRs in parallel, subshells plus `wait`) on a build that has #3907, #3915 and this change, and read the refusal sentence. That sentence names the failed check and decides the fix.

  Evidence so far: store history shows PR-3896 claimed its lease at 17:55:45 and 18:05:18 and was refused at 18:06:30, before PR-3902 claimed (18:06:55). The refused launch was PR-3896 both times, at the post-setup issuance check; PR-3896 has two backing specs. registry/team.toml is unchanged since 2026-10-23, so a roster rewrite race is unlikely.

  Raised by the implementer while working BUG-2544.
