  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-059, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [minor] mod.rs:634-645: while a fresh marker is renamed aside and before it is hard-linked back, the marker path is absent. A concurrent resolver then sees no era, so a nonce-less mailbox (e.g. inside create_mailbox_dir_in_place's mkdir->nonce window, mod.rs:860-866) is keyed as legacy instead of refused. This is the fail-open the marker exists to prevent. Narrow (needs 3 concurrent actors after an admin-entry recreation); consider serialising the drop under the mailbox lock, or document the residual window.

