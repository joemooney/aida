  REVIEW FINDINGS TO ADDRESS (BUG-2487):
  Verdict: CHANGES REQUESTED
  Reviewed commit: 6f45718a6c0d
  Recorded: 2026-11-07T17:47:15.433918293+00:00
  Findings:
  1. AC1 unmet: aida-cli-lib/src/launch/codex_auth.rs still pins codex-cli 0.166.0 (SHA b8a11fed...; refusal text codex_auth.rs:52). The only diff is docs/internal/testing/bug-2487-codex-pin.md, which records 0.167.0 SHA cdcb45aa... as measured identity only.
  2. AC2 unmet: aida-cli-lib/src/launch/contained.rs:1397 still unconditionally adds '-P aida'. There is no pre-launch check that the pinned binary accepts each flag, and no fail-closed error naming the flag. Per the doc's own evidence, both 0.166.0 and 0.167.0 exit 2 on this argv.
  3. AC3 unmet: no test pairs the pin with the argv builder; the diff adds no test.
  4. AC4 unmet: the doc correctly says 0.167.0 is not a working upgrade, but it names no supported version or upgrade step.
  5. Completion attribution still wrong: commit cfbecb41250 '[AI:codex] fix: ... re-pin to 0.167.0 (BUG-2487)' is still in the range, and the PR title still ends with the completing '(BUG-2487)'. A squash merge would auto-complete BUG-2487 while the launcher still exits 2. Retitle to the docs(containment) subject with '(Refs BUG-2487)' and drop or reword cfbecb41250.
  6. Spec blocker (advisor action, not implementer): the acceptance premise is false, because 0.167.0 accepts -P only under 'codex sandbox'. The advisor must choose an exec-compatible profile-selection interface (e.g. a -c config override) or a different measured binary, then rewrite BUG-2487's acceptance. More implementer rework rounds only produce more docs. Option: land the doc alone as a Refs-only docs PR and keep the bug open.
  Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
