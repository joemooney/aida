title: 'drain_lock lifetime test flaky: sibling test leaks AIDA_DRAIN_BORROW/FORCE process-wide'
description: |-
  drain_lock lifetime test flaky: sibling test leaks AIDA_DRAIN_BORROW/FORCE process-wide

  Reported by the TASK-144 implementer agent (delegated observation, not independently reproduced): drain_lock::tests::lock_with_specs_is_probe_visible_for_the_guards_whole_lifetime (aida-cli-lib/src/drain_lock.rs:907) intermittently fails under parallel test execution because the sibling test at line 794 sets AIDA_DRAIN_BORROW=1/AIDA_DRAIN_FORCE=1 process-wide via EnvVarsGuard, making the second acquire return a borrowed:true guard instead of refusing. Passes with --test-threads=1 and on full-suite rerun.

  Fix shape: serialize the two tests (shared mutex / serial_test) or refactor the borrow/force inputs to be injectable rather than read from process env in tests.
