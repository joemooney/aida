title: 'TUI mission-control empty state: queue + leases + PRs + suggested actions, not just keybindings'
description: |-
  Follow-up to BUG-109. BUG-109 ships the *minimal* empty-state fix — a welcome panel with keybindings + a relaunch-with-scope banner — so first-time `aida tui` users aren't stranded on a black screen.

  The bigger vision: the empty TUI should be a mission-control dashboard, not just a key cheatsheet. When no session is hosted, show the user what's actionable:
  - Role queue head (what's next to pick up)
  - Active session leases across the project
  - Open PRs + CI rollup
  - Suggested next actions (pick up STORY-X, review PR #N, drain queue)

  Effectively the `prefix o` status overlay's content, surfaced as the *default* empty-state view rather than a modal you have to know to open. Sequencing (per dialog 2026-05-15): post-alpha enhancement — lands after BUG-110, core CLI alpha-readiness, and ahead of EPIC-27. Not an alpha gate.
