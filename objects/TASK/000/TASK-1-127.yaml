title: aida add exited 1 five times on 2026-09-06 in under 50ms; cause unverified
description: 'Global usage log: five aida add invocations (12 args each) exited 1 in 12-42ms on 2026-09-06, from a product-role session. That latency means a pre-write gate, not a store write. The TASK-647 gate holds an approved request as Draft and does not bail, so the refusal is elsewhere (possibly --queue from the product seat, or arg validation). Unverified: reproduce with the exact argv before promoting. Product direction says a draft dump must never be refused; if the refused writes were drafts, promote to BUG.'
