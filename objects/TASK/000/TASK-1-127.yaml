  content: 'Codex investigation: current main does not reproduce the product-role draft-dump refusal for the likely argv shape. Added a real-binary regression covering AIDA_SESSION_ROLE=product aida add --status draft --tags from-product:pm,recommend:approve,risk:low --queue --for advisor; it exits 0, files Draft, and appears in the advisor queue.'
