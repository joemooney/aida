- id: 01a07da4-3361-7541-8d93-7c2071cfcb19
  author: joe
  content: 'Root cause candidate CONFIRMED live (2026-09-07 13:52): aida add exits 1 fast with ''failed to parse .aida/config.toml'' when the config is invalid — an aida pull autostash had left literal conflict markers in config.toml, and appends can duplicate sections. The five 2026-09-06 exit-1s match this signature (pre-write gate = config parse). Follow-ups worth their own specs: (a) aida pull must refuse or quarantine an autostash pop that leaves conflict markers, (b) aida add should print the parse error loudly (it may have been swallowed in some shells), (c) config writes should go through a section-aware editor, never raw append.'
