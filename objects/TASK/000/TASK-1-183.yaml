  content: |-
    ADVISOR 2026-09-28 — NARROWED, half disproven. Same shape as TASK-200: the two clauses do not share a fate.

    DISPROVEN: 'never checks that the common-dir belongs to this project'. It does. is_intended_store_worktree (aida-cli-lib/src/doctor_cmd.rs:6375) ENDS with exactly the comparison the finding asks for — a canonical_common_dir() closure is computed for BOTH store_worktree and project_root and the function returns true only if they are equal (doctor_cmd.rs ~6433-6457). It also resolves a relative --git-common-dir against its root before canonicalizing, which is the subtle part. This is NOT a later fix: it is present at the reviewed sha c4ea3c9038c84ec8a04a2089035d3272e6d883ec (3 occurrences of canonical_common_dir) and landed in the very PR the finding was filed against, #2243 (4f8b0de60b). So a separate user repository linked at .aida-store on branch aida-store would already be REJECTED today.

    STILL UNMET, and broader than the finding says: 'add a foreign-linked-worktree rejection fixture'. There is no fixture — and in fact is_intended_store_worktree has NO tests whatsoever. Its only references in the whole tree are its definition (6375) and its single call site in heal_doctor_store_staging_ignore (6468). So every branch of a guard that decides whether the healer may APPEND AND COMMIT into a git worktree is unguarded by tests.

    DISPOSITION: keep open, scoped to TESTS ONLY — do not touch the guard logic, it is correct. Cover at minimum: (a) the happy path (the real .aida-store worktree is accepted); (b) the foreign-linked-worktree rejection the finding names — a DIFFERENT repo linked at .aida-store, on branch aida-store, with a .git file and a distinct git-dir/common-dir, which must be REJECTED by the common-dir comparison and nothing else; (c) a standalone (non-linked) repo at .aida-store, rejected by the .git-is-a-file check. Each test must be proven non-vacuous — removing the specific check it targets must make that test fail.
