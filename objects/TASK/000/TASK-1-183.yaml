description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1547, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  TASK-1547: is_intended_store_worktree verifies canonical .aida-store path, a .git file, distinct git-dir/common-dir, and branch aida-store, but never checks that the common-dir belongs to this project. A separate user repository can be linked at .aida-store on aida-store and pass; the healer then appends and commits there (doctor_cmd.rs:5865, 5943-5965). Compare canonical git common-dir with the main project and add a foreign-linked-worktree rejection fixture.

