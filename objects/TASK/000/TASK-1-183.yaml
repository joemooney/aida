  content: |-
    Consolidated: TASK-203 (same defect, carried from TASK-1556 via PR-2243) is rejected as a duplicate of this spec. This is now the single owning spec for the doctor_cmd.rs:5865-5881 store-repair guard hole.

    Combined scope from both findings:
    - `is_intended_store_worktree` never verifies the git common-dir belongs to this project, so a foreign repo linked at .aida-store on branch `aida-store` passes the guard.
    - The healer then appends and commits into that foreign repository (doctor_cmd.rs:5865, 5943-5965).
    - The same root-only guard also lets store repair operate on a standalone .aida-store repository or a non-`aida-store` branch (TASK-203's framing of the same gap).

    Fix: compare the canonical git common-dir against the main project before the guard passes. Test: add a foreign-linked-worktree rejection fixture, and one for a standalone .aida-store repo.

    Approved by the advisor seat under the operator's 2026-09-28 emergency burndown authorization.
