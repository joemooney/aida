title: 'Cosmetic: scripts/containment/conformance.py:292-294 trusted_policy_sha() runs …'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-3046, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Cosmetic: scripts/containment/conformance.py:292-294 trusted_policy_sha() runs 'git rev-parse origin/main' in the caller's cwd, and main() (:608-611) catches only ValueError. Running from outside the repo, or with no origin/main ref, ends in a CalledProcessError traceback instead of a 'conformance:' refusal. The SHA is also not fetched first, so it can be a stale local tip. Resolve it relative to the script's repo and turn the failure into a ValueError.

