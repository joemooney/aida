description: 'Operator request 2026-06-14: ''aida list why'' reports, for every OPEN spec, why it is in its current state — no LLM, purely the recorded assessment + state-derived reason. This is the bulk form of ''aida why <spec>'' and overlaps the existing ''aida burndown explain'' (collect_open_facts + explain_reasons: bucket + derived reason + any recorded why-open: assessment + finding links). Surface it under the consistent ''aida list <lens>'' family (open / queue / human / why) so it''s discoverable. Per spec: show the recorded advisor assessment if present (why-open: comment / processing record), else the state-based reason (e.g. ''ungroomed draft — not yet assessed by the advisor''). Operator''s mental model: the advisor ASSESSES before approving (distinct verb from review). Consider whether ''assessment'' should become a first-class recorded field vs the current why-open: comment convention. Relates to TASK-822 (aida list queue alias), the aida list lens family, and burndown explain.'
