title: 'aida session start --owns PR-N: detect that PR''s source branch is held by another lease and prompt to end it first'
description: "Recurring pattern caught across 5+ PR cycles in this session: user starts an implementer session on epic-N-batchM, opens PR-N, then runs `aida session start --owns PR-N --branch pr-N` for the reviewer session WITHOUT first ending the implementer session. STORY-71's auto-checkout (or manual `gh pr checkout N`) then fails because the implementer's worktree holds epic-N-batchM and git refuses to check out a branch already in use elsewhere.\n\n```\nfatal: 'epic-20-batch10' is already used by worktree at '/home/joe/ai/aida-epic-20'\nfailed to run git: exit status 128\n```\n\nSame pain every cycle. Manual unblock: end the implementer session, retry checkout.\n\n## Today's behavior\n\n`aida session start --owns PR-N --branch pr-N` creates the worktree on `pr-N` branch, then STORY-71's auto-checkout attempts `gh pr checkout N` (which switches to PR-N's source branch). That last step fails when another worktree holds that branch.\n\n## Desired behavior\n\nAt `aida session start --owns PR-N` time, BEFORE creating the worktree:\n\n1. Query gh for PR-N's source branch (`gh pr view N --json headRefName`)\n2. Check all active leases via `.aida/sessions/*.toml` — does any lease have `branch == <PR-N's source branch>`?\n3. If yes:\n   ```\n   ⚠ PR-10's source branch `epic-20-batch10` is held by lease 019e1574\n     (implementer session, worktree /home/joe/ai/aida-epic-20).\n     \n     gh pr checkout will fail. Options:\n       1. End that session: `aida session end 019e1574` (then re-run this command)\n       2. Force-end: `aida session end 019e1574 --force` (kills any live claude there)\n       3. Skip auto-checkout: pass `--no-pr-checkout` to start the worktree on an empty pr-N branch\n     \n     [1/2/3]:\n   ```\n4. Otherwise proceed normally.\n\n## Composes with\n\n- STORY-71 (auto-checkout for PR-N session) — this is its pre-flight check\n- TASK-53 (pre-flight conflict detection for overlapping file work) — same family of \"warn at session-start time about latent failures\"\n- BUG-75 / BUG-76 (session start cwd-relative assumptions) — all three are about session_start's brittleness when state isn't pristine\n- STORY-92 (auto-spawn on PR merge, EPIC-23) — once auto-spawn ships, the human-initiated path is rarer and this preempt is less critical but still useful\n\n## Acceptance\n\n- [ ] `aida session start --owns PR-N` queries the PR's source branch via gh/glab\n- [ ] Scans active leases for one holding that branch\n- [ ] On hit: prompts user with end / force-end / skip-checkout options\n- [ ] No regression: when no conflict, behavior is unchanged\n- [ ] Gracefully handles \"no gh/glab\" (warn, proceed without preempt — STORY-71's existing fallback)\n- [ ] Tested: simulated stale implementer lease + fresh PR-N reviewer start triggers the prompt\n"
