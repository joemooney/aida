  content: |-
    Code-verified 2026-06-30 (premise still holds, but the two sub-slices are NOT symmetric):

    [presence] block today = three knobs (aida-cli/src/presence.rs PresenceConfig): consumers (P0 master), away_drain (consumer a), home_offer (consumer d). No field for (b) escalation or (c) questions — confirmed.

    (b) escalation IS wired, but COUPLED into away_drain in resolve_drain_mode: escalate_defaults is derived from the away_drain rung (HeadlessBoth/HeadlessEscalateDefaults -> escalate; HeadlessPark -> park). So you cannot pick park-drain without also forcing park-escalation. THIS is the real, buildable slice of TASK-769: add a standalone presence.escalation knob and decouple it from away_drain. Consumer exists, just rigid.

    (c) questions is NOT presence-wired at all — no away->accumulate-quietly / home->surface gating exists. Per STORY-561 it composes with the STORY-555 questions inbox (BUILD STORY-555 FIRST). So "make (c) tunable" is premature: there is no consumer to add a knob to yet. Drop (c) from this task; it re-enters only once the questions consumer is built.

    Recommend: re-scope TASK-769 to (b)-only (decouple escalation from away_drain into its own [presence] knob); track (c) separately under/after STORY-555. Advisory framing + integrity gates unchanged.
