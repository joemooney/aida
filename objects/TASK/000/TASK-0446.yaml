title: Map regeneration oracle check identities to contract clauses for consensus amendment drafts
description: |-
  Follow-up explicitly required by the 2026-10-15 STORY-1679 advisor signoff. STORY-1679 reports a clear mapping-missing diagnostic and files unparented draft amendments; no check-to-clause adapter exists in its scope. Design a trusted, versioned mapping from exact oracle check names to contract spec/clause identities, validate references against the selected corpus/store, and use it to link consensus gaps and parent amendment drafts when a mapping is available. Preserve explicit missing/invalid mapping diagnostics, exact-check draft dedup identity, report-only default, and opt-in --file semantics.

  ## Acceptance

  - Specify and obtain advisor signoff on the mapping schema and trust boundary before coding.
  - Valid mappings link a reported consensus gap to the actual contract clause/spec and parent its amendment draft accordingly.
  - Missing, invalid and stale references remain explicit without invented links.
  - Fixtures cover valid, missing and stale mapping, and repeat filing remains idempotent.
