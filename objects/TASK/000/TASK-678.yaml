title: 'EPIC-35 orchestrator ci-watch: route watch_ci_for_context through Forge::stream_ci_for_branch (FINAL op)'
description: |-
  The final SPIKE-49 op — completes EPIC-35's gh-call-site routing. Adds Forge::stream_ci_for_branch(branch, interactive) — blocks until the branch's workflow-run CI is terminal, streaming (gh run watch) when interactive, else quiet-polling; returns CiProbeResult. GitHubForge delegates to the proven watch_ci_for_context (gh run list + gh run watch + run-id resolution + quiet-poll fallback + re-probe). GitLab bails (slice 4); pure-git NoSignal.

  Extracted ci_probe_from_ci_probe_result (reverse map, shared by ci_probe_via_forge). Crate helper watch_ci_for_context_via_forge(branch, no_human) routes through forge + converts back to CiProbe so the 2 callers (orchestrator CI phase + the --watch-ci flow) are a pure name-swap.

  Not dogfoodable via aida pr ship (that path uses gh pr checks --watch, already routed via watch_ci); validate via a watched --zen --auto-complete drain. Full suite green (1615). Child of STORY-521. After this merges, STORY-521 (and EPIC-35 routing) is complete.
