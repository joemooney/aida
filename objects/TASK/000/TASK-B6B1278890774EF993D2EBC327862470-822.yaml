title: (minor, non-blocking) pipeline_stall.rs:518 and 573-579 drop merge-hold-gate en…
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-2476, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  (minor, non-blocking) pipeline_stall.rs:518 and 573-579 drop merge-hold-gate entirely and rely on pr_has_merge_hold (aida:merge-hold label or local record). Per BUG-1693 the gate also fails for aida:merge-hold-recorded without aida:merge-hold-cleared, for example when the hold label was removed by hand. Such a PR reads ship-ready, so ready-without-train fires with 'aida pr ship N', which the required gate then refuses. Treat a latest-attempt merge-hold-gate FAILURE as a hold blocker (ready=Some(false), hold line) rather than ignoring it.

