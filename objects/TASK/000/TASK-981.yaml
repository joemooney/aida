title: 'Worktree warm-pool slice 1: pool primitives + CLI + session end --return'
description: 'Slice 1 of the worktree warm-pool (STORY-714). Ships: aida-core worktree_pool / worktree_pool_destroy / worktree_hooks modules; git_ops worktree primitives (add_detached_worktree, reset_worktree_to, furthest_ahead_default_ref, worktree_is_dirty/head_is_merged/head_sha, remove_worktree_at); the "aida worktree pool {status,acquire,return,destroy}" CLI surface; and "aida session end --return" wiring. Dry-run-by-default tiered destroy with per-risk-class --include-* flags; reservation-vs-PID-liveness leases; machine-global-only hook sourcing. 22 new core tests + help-leak regression. This is the trailer target so STORY-714 stays open for the remaining lifecycle wiring.'
