title: 'aida statusline sess: segment: include branch/batch indicator when distinct from scope slug'
description: |
  Caught 2026-05-10 — user observed that statusline `sess:EPIC-20` is the same across batch3, batch4, batch5, batch6, batch7 (all on EPIC-20 scope, different branches). Without batch info, you can't tell which iteration you're in from the prompt alone.

  ## Today's behavior

  `aida statusline` emits `sess:<scope-truncated-to-N-chars>` when cwd resolves to a lease. Scope only; branch is not shown.

  ## Desired behavior

  Append a batch/branch indicator when the lease's branch differs meaningfully from the scope slug:

  | lease scope | lease branch | rendered segment |
  |---|---|---|
  | EPIC-20 | epic-20-batch7 | `sess:EPIC-20#batch7` |
  | EPIC-20 | epic-20 | `sess:EPIC-20` (no suffix to show) |
  | PR-6 | pr-6 | `sess:PR-6` (already matches) |
  | PR-6 | pr-6-review | `sess:PR-6#review` |
  | EPIC-22 | feature-cross-project | `sess:EPIC-22@feature-cross-project` |

  Algorithm:
  1. Lowercase the scope-slug (e.g. `EPIC-20` → `epic-20`)
  2. If `branch == scope_slug` → no suffix
  3. If `branch.starts_with(scope_slug + "-")` → suffix = `#<branch-without-prefix>`
  4. Else → suffix = `@<branch>` (full)
  5. Render `sess:<SCOPE>[<suffix>]` truncated to SCOPE_LABEL_MAX

  ## Composes with

  - STORY-53 (sess:<scope> segment) — extends, doesn't replace
  - STORY-68 (aida session show) — show command displays branch already; statusline gets the compact version
  - TASK-56 (leases verbose pid+cc-session) — same family of "make session context discoverable"

  ## Acceptance

  - [ ] Statusline `sess:` segment includes branch indicator when non-trivial
  - [ ] Common pattern (`epic-N-batchM`) renders as `sess:EPIC-N#batchM`
  - [ ] Truncation respects SCOPE_LABEL_MAX (combined scope + suffix fits)
  - [ ] No regression when branch == scope_slug (unchanged behavior)
  - [ ] Renders cleanly for PR/MR sessions and free-form scopes
