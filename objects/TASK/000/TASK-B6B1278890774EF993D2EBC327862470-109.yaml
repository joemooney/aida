title: Publish autonomy and trust pages with explicit boundaries
description: |
  Slice 4 of 8 for the product documentation/showcase epic.

  [AFK after advisor approval] Expand the baseline autonomy explanation into dedicated product pages without changing the autonomy or authority machinery.

  ## Acceptance
  - [ ] The four delivery choices map exactly to operator/guided/drive/drain; decide stays outside the ladder as a non-overridable decision block. Any one-shot override claims match source/help.
  - [ ] Explain grants/mandates, review evidence at an exact commit, CI and applicable holds, with the current documented exceptions and limits. Selecting drain must not imply authority or deployment permission.
  - [ ] Reuse the bounded selector rather than maintain conflicting mode definitions; provide accessible original trust/lifecycle graphics and working cross-links.
  - [ ] Keep alpha/Linux, shared Unix-user identity boundary, harness differences and merge-versus-production-deployment limits explicit. Check claims against the base after the other active lane lands.

  ## Layers / boundaries
  Mode and policy references -> consistent site content/graphics/selector -> reader comprehension. READ protected gate/review/ledger source for evidence when necessary; do not modify aida-cli-lib/src/gate/**, review_verdict, merge-hold or ledger code. PR #3090 owns that implementation lane.

  ## Primary callers / verification
  People reading the product site or working conversationally with an AIDA-aware coding agent; agents use CLI/MCP, operators inspect/setup through the documented command surface. Cover desktop/mobile/keyboard and non-TTY agent callers as relevant. Source statements must match aida-core/aida-cli-lib and current command help. Keep internal SPEC IDs out of end-user prose. Docs-only automated repository gate: make check-ci-fast; no cargo. Do not modify the protected gate, review-verdict, merge-hold or ledger implementation lane.

  ## Approval boundary
  Draft intake only. This child is not approved, queued or implemented by this decomposition. Existing docs/product-site and hosted materials are unmerged prototypes/reference inputs, not an approved implementation to bulk merge. After advisor approval, implement this slice in its own claimed sibling worktree and PR.
