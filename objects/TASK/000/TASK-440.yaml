  content: |-
    Advisor escalated this design-fork to a human (STORY-306).

    Reasoning: TASK-440 contains a triple fork the recorded corpus does not resolve. (1) Defer-vs-do: the spec body explicitly says 'Defer until the first MCP client surfaces a need for the structured shape — the text envelope is sufficient for current Claude Code use,' yet the spec was Approved and queued for implementer pickup. (2) Declare-only (Path A) vs declare-and-emit-structuredContent (Path B): the MCP spec expects servers that declare outputSchema to also emit structuredContent matching it, so Path A is technically non-conformant and could mislead any third-party MCP client (Codex, Cursor, future agents) that ever connects — exactly the cross-agent surface STORY-361 promises ('any MCP-speaking agent can participate'). Path B is materially larger than the 'severity:cosmetic' tag from PR-162 review implies (~21 tool responses reshaped) and bullet-2 of the description lists it as a separate concern. (3) Scope of bullet-3 'backfill the original 7' is also open. The implementer's lean (Path A + file bullet-2 as a follow-up TASK) is a defensible middle ground, but it rests on the strategic call of how strictly AIDA's MCP surface conforms to the MCP spec — a positioning question for the cross-agent coordination surface STORY-361 ships. No discipline doc, plan, memory, or codebase convention records that call; no prior outputSchema use exists. To unblock, pick one: (a) confirm Path A despite the conformance gap (text-envelope-is-sufficient stance trumps third-party MCP-client concern); (b) approve Path B and accept the scope inflation past 'cosmetic'; (c) re-defer the spec to honor its own 'Defer until...' instruction and unqueue it.

    When you resolve this, record the answer (a memory, an acceptance-criteria edit, or a discipline doc) so a future advisor can resolve the same kind of fork as a recorded principle.
