title: 'MCP tool_descriptors: add outputSchema to coordination tools (and original 7)'
description: |
  STORY-361's acceptance bullet 1 says "each with input + output JSON schemas". The implementation (`aida-cli/src/mcp.rs:1404-1659`) supplies only `inputSchema`. The output of every tool is currently a free-form text block returned via MCP's `content: [{type: "text", text: ...}]` envelope, which is the convention the original 7 spec-graph tools also use.

  The MCP spec allows `outputSchema` to declare the structured shape of tool results (clients can validate or surface fields without parsing). A future iteration could:
  - Add `outputSchema` to each coordination tool describing the JSON shape returned (e.g. `claim_task` → `{lease_id: string} | {already_claimed: {by, lease_id, since}}`)
  - Switch the tool implementations to return structured JSON in addition to (or instead of) the text block
  - Backfill the original 7 spec-graph tools for consistency

  Defer until the first MCP client surfaces a need for the structured shape — the text envelope is sufficient for current Claude Code use.

  Raised in review of PR-162: https://github.com/joemooney/aida/pull/162#issuecomment-4511420914
