- id: 019e4e6c-f0b5-74f1-938e-aecc0563dcde
  author: joe
  content: |-
    Refinement 2026-05-22 from sibling agent (Codex) empirical work on the MCP roundtrip:

    The outputSchema should describe the ACTUAL MCP envelope returned today (text content array + optional isError), NOT a rich structured payload that the tool implementations don't emit yet. The honest descriptor-only shape is:

    ```json
    {
      "type": "object",
      "properties": {
        "content": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": {
              "type": { "const": "text" },
              "text": { "type": "string" }
            },
            "required": ["type", "text"]
          }
        },
        "isError": { "type": "boolean" }
      },
      "required": ["content"]
    }
    ```

    Each tool's outputSchema can either share this base envelope OR add tool-specific fields ONLY when the tool actually emits them. Don't declare rich structured payloads until structuredContent actually exists (that's STORY-399 / Path B).

    PR-172 already rebased; phase 3 re-triggers next.
