title: 'Novice-first: ''aida done <spec>'' — the simple ''I finished it'' verb'
description: 'Round 6 of the novice-first friction loop found a wall: a solo novice who captured + built a task could NOT mark it done. ''aida done'' didn''t exist (suggested ''doc''); ''aida edit --status completed'' is jargon and (off a TTY) authority-gated. The capture->build->done loop dead-ended at the last step. Fix: ''aida done <SPEC>'' marks it Completed (records status-change history), the simple completion verb. Authority: a human at a terminal (TTY) or the advisor role is the authority — so a solo novice''s ''aida done'' just works; agents/non-TTY get a friendly ''run in your shell'' message (the advisor gate stays intact; full exemption is BUG-486-adjacent, left for operator). Verified end-to-end: aida done TASK-1 -> Completed, idempotent. trace:TASK-728'
