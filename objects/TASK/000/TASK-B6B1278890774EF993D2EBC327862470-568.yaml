  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1721, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: round-1 finding 1 only half fixed. merge_lock.rs::acquire still creates the lease with create_new and then write_all, so release.sh lease_is_live reads an empty file as acquired_at=0, judges it TTL-stale and deletes a live ship's lease (scripts/release.sh lease_acquire stale branch). Treat an empty or partial lease as live for a short grace period, or make merge_lock.rs publish atomically too.
