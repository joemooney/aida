title: Codex mail-wake wakes on mail the woken seat cannot act on
description: |-
  2026-10-29: the codex-mail-wake service bound to Codex's thread delivered six advisor-addressed historical dispatch receipts; Codex (implementer) could not ack them. Acceptance: the adapter wakes only for mail addressed to the woken agent's own handle/role (configurable), and the notice says which inbox it came from. Fold into STORY-HOME-096 if that lands first.

  ## Evidence 2026-10-29 18:02 (root cause)
  scripts/codex-mail-wake.py is built for a Codex ADVISOR: watcher.py sets AIDA_SESSION_ROLE=advisor and runs `aida mailbox wake-snapshot --recipient advisor`. Installed against Codex implementer thread 01a185ba… at 17:32, it delivered the six advisor-addressed historical receipts at 17:33, but never woke Codex for the advisor's 17:52 message sent `--to codex-agent-02`; the operator had to prompt Codex by hand. Uninstalled 18:03 to stop advisor-mail wakes.
  Acceptance (replaces the above): `install --recipient <handle|role>` (default: the agent handle registered for the thread, e.g. codex-agent-02, plus its role); the notification text names the recipient inbox; the advisor-only behaviour stays available as `--recipient advisor`. STORY-HOME-096 calls install with the spawned agent's handle.
