    3-phase build (one cohesive feature, no child specs):
      Phase 1 — tracer: new aida-cli/src/changelog.rs engine (git-tag walk + commit scan + spec-graph classify + render) wired to 'aida changelog generate'.
      Phase 2 — 'preview' / 'refresh' / --out / --released-as / --since/--until.
      Phase 3 — release.sh regenerates CHANGELOG.md before tagging (--released-as v<new>); CLAUDE.md doc sync.

    Key decisions: new sibling module dispatched before storage init (Plan/Ultraplan pattern); categorize by precedence (Bug-type / tags / commit-type-prefix / spec-type fallback) into Features/Fixes/Documentation/Infrastructure/Internal/Other; one entry per spec per release (union of PRs); --released-as resolves the commit-before-tag chicken-and-egg; deterministic output for the no-flag path (idempotent refresh). No skill — release machinery, not an agent workflow.
