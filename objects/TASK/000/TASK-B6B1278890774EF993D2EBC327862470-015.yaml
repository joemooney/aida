  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-010, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  (minor, non-blocking) Textual macro scope is not covered: a #[macro_use] mod util; (or a macro_rules! defined in an unscanned module ahead of mod gate) can shadow format!/matches!, which gate/dispatch_* call bare, and expand to crate::dispatch code. Bare macro names are dropped by Reach::note, and root files are scanned only for crate::dispatch references, not for #[macro_use]. Consider rejecting #[macro_use] on root mod items and macro_rules! named like the prelude macros the gate uses.

