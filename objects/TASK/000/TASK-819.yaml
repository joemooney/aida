title: 'Doc drift: CLAUDE.md says aida history --spec <id>, actual flag is --id'
description: 'Found 2026-06-14 during GitLab Tier-1 testing. CLAUDE.md (Storage model section) states: "aida history --events and --spec <id> read from it". The CLI rejects --spec ("unexpected argument --spec found"); the actual per-requirement filter is --id (confirmed via aida history --help: "inspecting one requirement closely with --id"). One-token fix in CLAUDE.md: --spec -> --id. Low priority, but CLAUDE.md is the project source-of-truth instructions so an invented flag misleads agents.'
