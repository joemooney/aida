title: 'mandate lineage validator: reject a renewal recorded at/after the previous expiry'
description: |
  aida-cli-lib/src/gate/mandate.rs renewal_problem() accepts a renewal entry whose renewed_at >= previous_expires_at, i.e. a renewal of an already-expired mandate. extend() can never write one, because it renews only an Active mandate. Rejecting it would stop a hand-edited record from resurrecting an expired mandate. Same-uid forgery is outside the stated threat model, so this is optional hardening.

  Raised in review of PR-3175: https://github.com/joemooney/aida/pull/3175#issuecomment-6549936924
