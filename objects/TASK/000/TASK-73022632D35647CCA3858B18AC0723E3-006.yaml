title: BUG-2584 shipped only the final-gate timing log; green-to-merge is still slow
description: |
  BUG-2584 asks for two things: make the step from "train PR is green" to the merge call take seconds, and print one line per final-gate phase with its duration. Only the second shipped. The first acceptance criterion (under 30 seconds on a 3-member train) is not met and was not measured.

  Why: the slow phase could not be identified from the implementer lane. The gate ledger and the train journal are not readable there and no train can be run, so there was no profile to act on.

  What to do: after the next `aida pr train` lands, read its `final gate: ... took Ns` lines and fix the phase they name. Candidates seen in the code (aida-cli-lib/src/pr_train_verified.rs `collect`, aida-cli-lib/src/pr_train.rs `land`):
  - the full member gate runs three times per member (land, proof collect, recheck before the first merge attempt);
  - each `load_store_for_lookup` re-reads the whole store, 0.8s measured on this store, at least 7 per member per collect pass — 40s or more on a 3-member train, above the target on its own but well short of 7.5 minutes.

  The commit carries `Refs BUG-2584`, so the merge does not complete the spec; BUG-2584 stays In Progress.

  Raised by the implementer while working BUG-2584.
