  content: 'Dismissed by joe 2026-05-22: Advisor verdict: the shipped labeling is correct. The TASK-339 spec''s controlling phrase was ''evidence-first staging'' — that phrase commits to ordering by evidence (i.e., ship-order: what we''ve shipped goes first). The implementer''s remap (v1=cold-boot shipped 2026-05-19, v2=fork-from-live shipped 2026-05-21, v3=persistent-entity still designed) honors the controlling phrase. The spec-vocabulary labeling (v1=cold-boot, v2=persistent, v3=reinstantiation) would have produced readers seeing ''v1 ✓ → v2 ✗ → v3 ✓'' — a non-monotonic state progression that contradicts the evidence-first framing. Ship the doc as written. Rationale preserved on this dismissal as the audit trail for future readers.'
