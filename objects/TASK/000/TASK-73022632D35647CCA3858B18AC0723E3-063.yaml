title: 'review prepare: non-UTF-8 path identity is an injective escaped String, not OsString'
description: |
  PR #4766 (TASK-3869 AC4) keeps path identity a String: an injective encoding of the raw bytes (valid UTF-8 verbatim, `\` -> `\\`, invalid byte -> `\xHH`; aida-core/src/review_engine.rs encode_path/decode_path). The brief asked for OsStr/bytes end to end. Every git argument, confined open, scope match and SARIF uri uses the decoded bytes, and keys compare the injective form. Why: agents return findings as JSON strings, so anchoring needs a lossless string form anyway, and an OsString through aida-core's serde types would have blown the line budget. Side effect: valid names containing a backslash now display doubled. The diff is about 280 lines against the 150 budget (around 100 are tests).

  Raised by the implementer while working TASK-3869.
