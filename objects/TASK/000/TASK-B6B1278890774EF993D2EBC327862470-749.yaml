title: 'non-blocking/minor: run_checked and run_gate now wait for pipe EOF rather than …'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-2790, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking/minor: run_checked and run_gate now wait for pipe EOF rather than child exit, so a future caller whose child backgrounds a process that inherits stderr (none today: cargo with RUSTC_WRAPPER= and restart-mcp-servers.sh only kill) would hang. The Rust 'if fetch_error' branch in run_checked has no direct test; only stream_cargo_diagnostics is unit-tested.
