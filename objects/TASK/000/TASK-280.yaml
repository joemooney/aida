    Implemented via PR #74 (commit 2f15dbba):

    - Added `--to-front` / `--to-back` as visible aliases of `--top` / `--bottom`.
    - Added `--to <N>` for absolute 1-indexed positioning; counts among the queue's live (non-terminal) entries so the slot matches `aida queue list`; out-of-range N clamps to the nearest end with a hint.
    - `--to` conflicts with the relative/end flags; existing `--before`/`--after`/`--top`/`--bottom` unchanged.
    - Pure helper `move_to_absolute_position()` does the list reorder; caller renumbers with a fresh 1000-gap.

    Test status: 564/564 aida-cli tests green; live-queue smoke test passed and queue restored.
