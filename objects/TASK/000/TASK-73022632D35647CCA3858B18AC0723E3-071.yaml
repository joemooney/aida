title: 'review prepare: up-front CLI check for --challenger-agent, and plain wording for the ''using claude from the built-in default'' line'
description: |
  TASK-3958 added an up-front PATH check for the finder's agent CLI (review_prepare.rs ensure_agent_installed). Two related gaps remain:
  1. A forced `--challenger-agent` whose CLI is missing still fails late, mid-run, with the internal "challenger pass, review batch N" prefix.
  2. The notice "run review: using claude from the built-in default (no [agents] vendor)" (review_prepare.rs run_review_agent) still uses `[agents] vendor` wording, which F12 in docs/plans/2026-11-27-fresh-user-walkthrough.md calls internal. Changing it means updating the story3202 tests that count it.

  Raised by the implementer while working TASK-3958.
