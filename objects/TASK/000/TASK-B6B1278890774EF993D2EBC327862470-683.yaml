title: 'NON-BLOCKING (minor): codex ''aida session start --owns X --launch'' without --ro…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-B6B1278890774EF993D2EBC327862470-159, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  NON-BLOCKING (minor): codex 'aida session start --owns X --launch' without --role at a TTY reaches resolve_child_role's interactive role picker (session.rs new_session_for_vendor codex branch) only AFTER the worktree and lease are created; Esc returns Ok(()) leaving an orphan lease/worktree with no agent. The claude path never prompts (defaults role to AIDA_SESSION_ROLE or '-'), and the codex path also ignores AIDA_SESSION_ROLE. Suggest defaulting role from AIDA_SESSION_ROLE/implementer (or resolving it in preflight) for the start --launch path.

  PR: #3210
