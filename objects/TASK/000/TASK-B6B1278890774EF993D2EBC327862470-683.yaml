  content: |
    ADVISOR BRIEF (2026-11-01 23:32 MST). LIGHT bundle of three Codex-parity defects, one PR:
    (1) TASK-2742: `aida session start --owns X --launch` with vendor codex and no --role must not reach the interactive role picker after the worktree and lease exist. Resolve the role in preflight, defaulting from AIDA_SESSION_ROLE and then implementer, like the claude path. An Esc must never leave an orphan lease or worktree. Test both.
    (2) TASK-2737: AIDA_MAIL_WAKE is set or cleared only in run_agent_generation (agent_launch.rs ~6756), so other child spawns (headless codex in queue_cmd, dispatch and session) inherit a parent's value. Clear or set it on every child spawn path so the [agents.codex] default applies, matching the comment "a value inherited from a parent session never stands in for it". Test one non-agent-new path.
    (3) TASK-2731: shift.rs COVERED_VENDORS treats codex as measured even when the last watchdog run reported codex-sessions 'unavailable'. Gate the codex coverage claim on that source being available. Also make vendor_activity::codex_sessions_root honour CODEX_HOME. Test both.
    Gate: LIGHT. Run one targeted `cargo test -p aida-cli-lib <filter>` per item, then make check-ci-fast. If PR #3236 (BUG-2386) merges first, merge main before you push.
