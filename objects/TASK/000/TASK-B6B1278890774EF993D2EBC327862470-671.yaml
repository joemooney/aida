title: 'Non-blocking (minor): pr_lookup.rs:478 continuation_extends_id uses aida_core::…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2400, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Non-blocking (minor): pr_lookup.rs:478 continuation_extends_id uses aida_core::id_identity::DEFAULT_MINT_WIDTH (3) rather than the project's configured [ids] seq_width/node_seq_width. A project that configures a width below 3 mints IDs like BUG-1-42, and branch bug-1-42 would then associate with BUG-1. That over-associates, which errs toward blocking, and only affects non-default config.

