title: 'aida-worker: leading-whitespace directives never pop from .aida/worker.cmd'
description: |-
  `_aida_worker_pop_head` in WORKER_FUNCTION (aida-cli/src/main.rs) builds `target=$raw` from the line read by `awk 'NF && $1 !~ /^#/ {print; exit}'`, which preserves any leading whitespace. The pop awk later trims `t` via `sub(/^[ \t]+/, "", t)` before `t == target`, so an indented line like `\tdrain batch:x` never matches its own trimmed form. Effect: the line never pops; the worker reprocesses the same scoped drain on every iteration (after the first success it would re-queue another lifecycle on the same args, or just spin if the queue is empty).

  `parse_directives_from_str` uses `trim()` so `aida worker directives` displays the directive normalized — inconsistent with the pop comparator.

  Fix: trim both sides in `_aida_worker_pop_head` (build `target` from the trimmed form, not the raw line). Also worth tightening the head extraction so `$head`/`$raw` and `parse_directives_from_str` agree exactly.

  Edge case — most users won't indent directives, but a heredoc'd overnight plan could include leading-indent for readability.

  Raised in review of PR-112: https://github.com/joemooney/aida/pull/112
