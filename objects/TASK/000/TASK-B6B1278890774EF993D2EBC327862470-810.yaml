  author: joe
  content: |
    Implementation prepared in /home/joe/ai/aida-worktrees/aida-seat-aida-task-b6b1278890774ef993d2ebc327862470-810 (four modified files; uncommitted because native seat git metadata is read-only).

    Changes:
    - drain_gate unresolved-root fixture removes a separate isolated child cwd before probing; this host has /tmp/.git, so a fresh cwd under /tmp was not enough to make discovery fail. Storage remains in a separate live tempdir; the no-mutation assertions still run for both headless modes.
    - Solo self-approval fixture pins AIDA_PROJECT_ROOT/AIDA_DRIVE_ROOT and clears AIDA_REVIEW_VERDICT_FILE under its existing ambient guard, and asserts the PR handshake lands on its own gate ledger.
    - Dispatch compatibility-recorder regression runs in an exact-test child and uses review_authority::with_pid_namespace with the actual local namespace so fixture grants match the real CLI child's presenter tokens.
    - run_path_isolated_test gives its child a private TMPDIR as well as HOME. The pre-main test-home constructor uses PID-only names and sweeps stale bare PIDs: shared /tmp across native namespaces caused intermittent missing grant files. Top-level runner home cleanup remains a separately filed draft finding SPEC-b6b1278890774ef993d2ebc327862470-016; final top-level test invocations used a unique TMPDIR too.

    Validation (local standalone evidence, not a lane-job attestation): matching cargo build -p aida-cli --bin aida passed. Final rebuilt lib test binary passed all 3 bug_2139_headless_phase_seat_tests, 16 story_1655_solo_review_tests, 19 story_1917_dispatch_flow_schedule_tests, 13 test_env::tests, and 10 test_home::tests (61 total), with --test-threads=4 and a unique top-level TMPDIR. cargo test -p aida-cli --test bug_1502_format_json_audit passed 9/9; its namespace-binding fix was already present from BUG-2450. cargo fmt --all -- --check and git diff --check passed. Earlier pre-private-TMPDIR dispatch module runs were 14/19 and 9/19, with missing grant files; after the isolation fix the whole module passed 19/19. Logs: /tmp/task2861-final-tests.log, /tmp/task2861-audit.log, /tmp/task2861-fmt.log. Patch copy: /tmp/task2861.patch. No production authority or filesystem checks changed.

    Publication blocked by TASK-2879: git add refused index.lock with Read-only file system. No commit/push/PR, no review record and no merge. Preserve the seat checkout. After this owner exits, run from the host main checkout:
    aida ship TASK-2861 --from-seat /home/joe/ai/aida-worktrees/aida-seat-aida-task-b6b1278890774ef993d2ebc327862470-810 --commit-pending '[AI:codex] test(gate): isolate native seat fixtures (TASK-2861)'
    This --from-seat path only publishes a PR; the separate reviewer and merge seat must take over. Run queue done after the publication gate allows it.
