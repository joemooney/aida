  content: 'Rejected 2026-05-29 (operator triage). Blanket #![deny(warnings)] in workspace Cargo.toml is a known anti-pattern — brittle across toolchain/clippy bumps (a new lint in a future compiler breaks all local builds, not just CI). Zero-warnings is already maintained by the drain + review discipline. If belt-and-suspenders enforcement is ever wanted, the right form is CI-only RUSTFLAGS=-D warnings (catches regressions without breaking local dev across toolchains) — but that''s not worth filing now. Closing.'
