title: 'pre-release-check.sh: fix comment about ''-q'' yielding empty string (it yields tab via @tsv on null)'
description: |-
  The comment in \`scripts/pre-release-check.sh\` near the \`gh run list ... -q\` invocation says \`-q\` yields an empty string when the array is empty. Actually: \`.[0]\` on \`[]\` returns \`null\`, which then passes through \`@tsv\` as a tab-separated string. Downstream behavior is still correct (line is empty-ish → \"no prior run\" branch → dispatch) but the comment is technically inaccurate.

  ## Fix

  Update the comment to reflect the actual behavior:

  \`\`\`bash
  # \`.[0]\` on an empty array yields null; @tsv turns null into a tab string
  # of empty fields. The subsequent emptiness check catches that and routes to
  # the \"no prior run\" branch.
  \`\`\`

  Or simpler if rewriting:

  \`\`\`bash
  # An empty result (no prior run, or the json was null) falls through to the
  # \"no prior run\" branch — checked via \`-z \"\$line\"\` below.
  \`\`\`

  ## Acceptance

  - [ ] Comment updated near line 92-93 of \`scripts/pre-release-check.sh\` (on branch task-257 — see TASK-257 for context)
  - [ ] No behavior change; comment-only fix
  - [ ] Optional: add a test asserting the empty-array path routes correctly (not needed but defensible)

  ## Origin

  Non-blocking note from PR-51's adversarial review 2026-05-16. Reviewer noted: *\"pre-release-check.sh comment '-q yields an empty string when the array is empty' is slightly inaccurate (.[0] on [] → null → @tsv yields a tab string). Downstream still degrades correctly to dispatch — harmless, but worth tightening the comment.\"*

  ## Composes with

  - **TASK-257** (CI split) — same script; ship as part of the fixup PR or as follow-up
  - **STORY-254** (review of PR-51) — explicit follow-up to a review note
