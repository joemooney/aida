title: Relay renewal refusal diagnostics and expiry-hint coverage
description: |
  Deferred non-blocking P3/P4 from advisor-117 PR-4135 round 2, per round-3 brief: complete explicit refusal-code mapping with one regression per mapped refusal; add expiry-hint coverage for knob enabled/disabled; report mandate-stop as a mandate refusal instead of GrantRejection::Unreadable. Keep historical approval validation and live mandate enforcement distinct.

  ## Acceptance
  1. Every refusal the relay's parent-grant renewal can return maps to an explicit refusal code (no catch-all). One regression per mapped refusal asserts the code and the operator-facing text.
  2. The expiry hint is covered with the TASK-3119 knob enabled and disabled: enabled names the renew path; disabled names the operator relaunch.
  3. A mandate stop is reported as a mandate refusal, not as `GrantRejection::Unreadable`, with a test.
  4. Historical approval validation and live mandate enforcement remain separate code paths: a test shows an expired mandate does not invalidate an approval recorded while it was live.
