  content: |
    ## Implementer self-review

    Reviewed HEAD: cfbc140e9ee323c5889f1c8fb93c93ba43fecbb0; origin/main...HEAD contained no changes, so I also reviewed the five-file native worktree diff. No untracked additions.

    AC1: [evidence: behavioral-test] The relay, seat-authority and CLI paths assign a typed code at each refusal. The table at aida-cli-lib/src/gate/relay_parent.rs:1122 verifies stable JSON codes and human detail for 17 cases, and the publication write-failure test at aida-cli-lib/src/gate/relay_parent.rs:1208 covers the remaining two.
    AC2: [evidence: behavioral-test] aida-cli-lib/src/gate/relay_parent.rs:1229 exercises the real global knob in both modes and checks the hint consumed by the two role expiry refusal branches.
    AC3: [evidence: behavioral-test] The replacement and descendants regression at aida-cli-lib/src/gate/relay_parent.rs:850 checks MandateRefused and its nested parent form, including diagnostic text, after mandate stop.
    AC4: [evidence: behavioral-test] The recorded-approval regression at aida-cli-lib/src/gate/relay_parent.rs:939 verifies an approval at its recorded instant after the mandate has expired and rejects live grant use. Recorded approval validation and live grant checks retain their separate entry points.

    Adversarial pass: controller output and durable audit receipts take their code from the same typed refusal. Human diagnostics use the same detail prefix, with lower-level causes kept out of controller JSON and receipts. Checked malformed TOML/evidence, invalid grant handles, missing and symlinked output paths, empty bindings, zero duration, lock contention and consumed-handoff retry. Receipt discovery checks each encountered record for a recorded successor. The handoff writer's atomic link also maps a concurrent preexisting handoff explicitly.

    Authority: renewal still requires the global opt-in, a direct unrevoked parent, matching operator/subject, roster permission, a live process binding, an eligible rotation window, active scoped mandate and a durable receipt. Descendants still validate the parent chain. The historical reader checks recorded-instant evidence and grants no live authority. No existing authority tests were weakened or skipped.

    Validation: launcher job j20261119T072536120-2-0 ran cargo test --profile agent -p aida-cli-lib --lib -- gate::relay_parent, with 11 passed and 0 failed. rustfmt --check on the five changed Rust files and git diff HEAD --check passed. No PR head or CI run exists in this native seat. Filesystem write failures were exercised through the publication helpers, and the CodeGraph client was unavailable, so caller checks used rg.
