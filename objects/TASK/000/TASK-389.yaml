title: 'pre-release-check.sh: no-runs path never triggers — empty array produces tab-separated null row, not empty string'
description: |-
  While fixing the comment in TASK-283, I empirically verified that the
  `[ -z "$line" ]` check in `scripts/pre-release-check.sh` (around the
  post-fix line ~117) does NOT trigger when there are zero matching runs.

  ## Evidence

  ```
  $ gh run list --workflow=ci.yml --branch nonexistent-branch --limit 1 \
      --json status,conclusion,createdAt,databaseId,url \
      -q '.[0] | [.status, .conclusion, .createdAt, (.databaseId|tostring), .url] | @tsv' \
      | cat -A
  ^I^I^Inull^I$       # 8 chars: 3 tabs + "null" + 1 tab — NOT empty
  ```

  `[ -z "$line" ]` is false here, so the "→ no prior cross-platform run
  found." branch (and its dispatch fallback) is dead code in practice.
  It only triggers when `gh` itself errors and `|| true` swallows the
  failure.

  ## Impact

  Low. In normal use there is always a prior run, so this path was
  probably never exercised. If a brand-new project ever ran the script
  with zero prior runs, the script would propagate a row of empty/`null`
  fields downstream — `gh run watch` on a `null` databaseId would error.

  ## Fix sketch

  Replace the post-pipeline `[ -z "$line" ]` check with one that detects
  the empty-array case *before* the @tsv flattening, e.g. capture
  `.[0] // empty` or test the raw `--json` output for `[]` separately.
  Optionally add a test fixture asserting the empty-array path routes to
  `dispatch_and_watch`.

  ## Acceptance

  - [ ] No-runs case routes through `dispatch_and_watch` reliably
  - [ ] Regression test (or shell fixture) covers the empty-array branch
  - [ ] No behavior change for the normal (runs-exist) path

  Discovered during TASK-283 (comment-only fix to the same block).
