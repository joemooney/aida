description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2391, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Non-blocking (minor): shift.rs COVERED_VENDORS is a static claim. The budget-evidence guard passes for vendor codex even when the last watchdog run reported the codex-sessions source as 'unavailable' (runaway_seats.rs scan: a missing dir is pushed as unavailable and does not degrade the verdict when Claude sources are available). vendor_activity::codex_sessions_root also ignores CODEX_HOME, which Codex itself honours. So a relocated Codex home leaves the watchdog blind to Codex spend while shift tick treats codex as measured. AIDA never sets CODEX_HOME today. Consider gating the codex coverage claim on the codex-sessions source being available in the aggregates, and honouring CODEX_HOME.

  PR: #3220
