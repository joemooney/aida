  content: |-
    Implemented via PR (commit ebcb085c):

    - Added an explicit exception block in `/aida-pr` Step 3 of the master skill template (`aida-core/templates/skills/aida-pr.md`): under corroborated `aida orchestrator status = orchestrated`, `In Progress` is treated as a green-light state for covered specs. The BUG-269 gate on `aida queue done` still fires post-PR, so the no-committed-but-unshipped invariant is preserved.
    - Followed the BUG-233 / BUG-237 corroboration pattern — never the bare `$AIDA_AUTO_COMPLETE` env var. `Rejected` and `not found` stay red errors; `Approved` (never-picked-up) stays a warning.

    Test status: 6/6 BUG-269 precheck unit tests green; release build clean.
    Self-test: this very PR exercises the new code path — TASK-422 was In Progress when `/aida-pr` ran in the orchestrator phase-1 implementer.
