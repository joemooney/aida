title: 'Conformance harness hardening: no grant before output refusal, timeout reaps the lane group, named refusal for a missing manifest, pinned receipt line'
description: 'Carries four non-blocking findings from the #3475 (TASK-3131) review, ruled ONCE by the advisor 2026-11-06 01:05 MST (10-28 ruling). They were first bundled into BUG-2460, but #3482 was approved first, so it ships as is and they land here in ONE PR: (a) TASK-2922: refuse /tmp and /run --output in run_aida() BEFORE any setup, so no grant is minted for a refused output; (b) TASK-2923: on TimeoutExpired kill the whole ''aida queue work'' process group, close Network, never let the stale pre-continuation report overwrite setup evidence, and size the outer timeout to cover continuation setup plus bounded_launch; (c) TASK-2925: --await-payload with an absent manifest yields a named refusal, not a FileNotFoundError traceback; (d) TASK-2924: a Rust test pinning the ''aida-contained-receipt sha256=.. policy_sha=..'' line the harness regex depends on (keep the line; the stderr noise is accepted). LIGHT gate: the harness python tests plus one targeted cargo test for (d).'
