description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-2254, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking, fail-closed; from the BUG-2419 semantic merge): seat_authority.rs:2411-2415 accept_detached_launch_child compares pid_binding_token (now author_process_token, qualified with pidns-<ino> in a non-host pid namespace) to the unqualified review_authority::process_token. Inside a non-host pid namespace that is not AIDA-contained (e.g. a plain bubblewrap shell), every detached accept is refused with the misleading error 'start identity changed'. On the same path, session.rs stamp_lease_detached_worker_at writes active_pid without active_pid_ns, unlike stamp_lease_active_pid_at, so lease_tokens drops the worker's proc token. review_authority.rs record_detached_worker_strict records an unqualified process_token where author_process_token is expected. Fix: compare against author_process_token, set or remove active_pid_ns in the strict stamp, record author_process_token, and add a with_pid_namespace test.
  Reviewed sha: c0ff84f2d84612e2cb940d713673ed55c5222621
