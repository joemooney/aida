title: 'Substrate-grade gate: refuse aida edit --status approved for do-not-approve classes by type'
description: Followup to STORY-560. The intake launcher fences do-not-approve classes (vision/epic/principle/constraint/decision/term) out of the agent's candidate set, but the underlying 'aida edit --status approved' path is gated only on advisor authority (status transition), not requirement TYPE. A substrate-grade type gate would harden the HARD authority bound across ALL approval paths, not just intake. Broader than STORY-560; needs design (which types, config-driven?, interaction with ADR-3).
