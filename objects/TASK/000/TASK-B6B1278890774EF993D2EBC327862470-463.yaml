description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-1677, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  cosmetic: adapter::attach computes R1/R2 raw_delta and discriminating_delta while both are still 'scored' (adapter.rs:287), before completeness::finish can flip either to incomplete, so the stored delta looks comparable even when one side is incomplete. It is diagnostic-only and not rendered as a headline, but it could mislead JSON consumers.
