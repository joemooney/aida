  content: 'Advisor ruling 10:26: approved, and TASK-2937 is folded in. Scope: (1) when head_has_unpushed is None (probe timeout or bwrap failure), unshipped() falls back to the prior moved && pushed_since==Some(false) signal, so a seat with real local commits reports no-pr reason=unpushed-commits. (2) In the host_recorded_clone branch (headless_background.rs ~502), skip head_has_unpushed_commits when facts is None. LIGHT gate: one targeted cargo test on headless_background plus make check-ci-fast. Add a unit test for the None-probe fallback.'
