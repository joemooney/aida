title: 'headless_background: unreadable reachability probe settles as no-unpushed; also skip the redundant clone probe when facts is None'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2464, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): headless_background.rs:546-550 treats an unreadable reachability probe (head_has_unpushed=None, e.g. 5s timeout or bwrap failure) as 'no unpushed commits'. In settle_outcome's stale rework-PR branch (standalone_implementer.rs:327-330) a seat with real local commits and a failed probe now settles as pr-opened with the old head instead of no-pr reason=unpushed-commits. Suggest falling back to the prior moved&&!pushed signal when the probe is None. Lease safety is unaffected (finished_lease_ends needs origin at HEAD).

