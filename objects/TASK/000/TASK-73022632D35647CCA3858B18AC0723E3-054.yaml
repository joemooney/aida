title: Agent-mode CLI errors drop the anyhow cause chain (only the first line survives)
description: |
  agent_errors.rs agent_error_summary_help takes only msg.lines().next() of the Debug-formatted error. Every `with_context` cause below the outermost context is invisible to agents (AIDA_HEADLESS / agent output mode). BUG-2775 ("review batch 1" with no cause) is one instance; it was fixed locally by flattening runner errors to one line, but every other command with layered context has the same blind spot.
  Suggestion: render the summary as `{err:#}` (the colon-joined chain) or add a `causes:` list to the TOON error block.

  Raised by the implementer while working BUG-2775.
  Branch: bug-2775-run-review-errors  ·  Commit: 46793d2c72  (PR-4672)
