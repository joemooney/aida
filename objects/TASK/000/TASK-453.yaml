title: Flip MCP stdio CI gate to full roundtrip once BUG-310 ships
description: |-
  TASK-451 landed the MCP stdio compatibility suite with a staged gate: the default invocation runs descriptors + CLI->MCP read direction only. The MCP-write -> CLI-read and coordination stages sit behind `--require-mcp-write-roundtrip` because BUG-310 makes MCP `add_requirement` (and related writes) report success without persisting to the canonical store.

  Once BUG-310 merges:

  1. Add `--require-mcp-write-roundtrip` to the CI invocation in `.github/workflows/ci.yml` (the 'Run MCP stdio compatibility tests' step).
  2. Verify the full suite passes in CI.
  3. Optional: flip the script default so the flag is no longer needed, and the gate-rationale comment is removed.

  Composes with:
  - TASK-451 (landed the staged suite)
  - BUG-310 (the gating bug)
  - STORY-398 (Codex empirical roundtrip)
