- id: 01a1ba58-c126-7a81-bd8a-4c219282baf1
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3661):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1be7b346c635
    Recorded: 2026-11-08T08:31:10.204614111+00:00
    Findings:
    1. MAJOR, functional: aida-cli-lib/src/store_mutation_client.rs:50 and :66 build the object path with canonical_spec_id(id), which only uppercases. Agreed IDs are not resolved to the on-disk origin ID. TASK-3223 is stored at objects/TASK/000/TASK-B6B1278890774EF993D2EBC327862470-880.yaml, but mediated 'aida comment add TASK-3223 x' and MCP add_comment/update_requirement look for objects/TASK/003/TASK-3223.yaml and fail with a missing-object I/O error. Every origin-keyed spec (about 890 of 2837 TASK objects, including all recent work) is unreachable by the ID that CLI and MCP users hold. The ordinary paths accept agreed IDs. Resolve the agreed ID read-only to the canonical object before computing expected_revision, and test it.
    2. MAJOR, test gap: no test reaches a successful Client::comment, edit or mcp against a real object preimage. Every client and MCP test uses missing roots or refusal paths (store_mutation_client_tests.rs:173, store_mutation_mcp_tests.rs store=/missing-mcp-store, store_mutation_entry.rs tests stop at translate). root() and the --file route are also untested. That is why the ID defect above went unnoticed. Add a fixture store plus fake SEQPACKET service positive covering agreed ID, origin ID, expected_revision and the exact wire request for comment_add and spec_edit.
    3. BLOCKING acceptance gap (2026-11-07 20:35 ruling): the slice is not delivered. (a) python3 scripts/check-store-writers.py --profile mediated at this head reports 3160 unresolved writers and 293 operations, not zero; only comment add and title/description edit route, and read commands are refused too. (b) No contained-lane test proves a raw .aida-store object write is denied while a mediated comment_add succeeds; contained.rs:800 still bails for mediated. (c) This PR adds no concurrency tests for stale base, concurrent mutation or host failure after persist but before reply. Keep TASK-3223 open; this PR must remain Refs-only and cannot complete it.
    4. CI and gate evidence missing at 1be7b346c635: all 7 CI jobs and merge-hold-gate were still pending when reviewed. make check-ci-fast is not green: the implementer's handoff says it stopped at a portability finding for the literal /tmp/socket at store_mutation_client_tests.rs:20. This review did not reproduce that; if the CI gates job confirms it, change the literal or allowlist it through the normal path.
    5. PR metadata is stale. The title still says 'report unresolved mediated routing evidence', but the diff now adds early dispatch in main_entry, a SEQPACKET client and a mediated MCP server. The body is still only the seat-publication line. Rewrite both to describe staged, gated routing for comment/edit, state Refs-only with no launch authority, and say TASK-3223 stays open. Commit 30eb320657c has a subject claiming full routing and boundary denial, so the squash must use the corrected title with an empty body.
    6. MINOR, semantic drop: store_mutation_entry.rs:73-77 allows top-level file, format, verbose and canonical_ids, then ignores format and canonical_ids (run always prints JSON at :95) and reinterprets --file as a store directory in root() at :41-44. The doc at docs/internal/security/store-mutation-writers.md says the transports refuse extra fields rather than silently dropping semantics. Either honor these options or remove them from the allow-list so they refuse.
    7. MINOR, broken-pipe panic: entry runs before install_sigpipe_handler (lib_part1.rs:249), so mediated run's println! at store_mutation_entry.rs:95 panics on a closed stdout (aida comment add ... | head), after the host mutation has already committed. The caller then sees a failure for a persisted write. Use a fallible write or install the handler first.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
