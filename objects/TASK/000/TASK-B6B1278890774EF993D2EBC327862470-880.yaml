    1. BLOCKING (minor-to-major): request_status is live (MUTATION_VERBS) and reachable from every contained lane that has AIDA_STORE_MUTATION_REQUIRED=1 (session.rs:14736). service.py:286-289 now sends it to the host whenever authorize has .operation, which the production MutationAuthority always has. The host (store_mutation/mod.rs host_operation RequestStatus) runs with_store_write_lock_bounded and then redo::status, and status() calls journal() (redo.rs:163-183, 321). journal() CREATES .aida/redo, writes the format marker into the shared store and appends to git info/exclude. A read-only status query therefore (a) contends for the store-wide write lock with a 5s Busy budget, (b) leaves durable state behind, and (c) after that, every outermost store-lock acquisition by any process (store_lock.rs acquire_until -> redo::recover -> recover_inner -> journal -> ensure_store_redo_excluded) runs a git rev-parse subprocess. This contradicts the PR/OVERVIEW claim that nothing in production creates the journal; round 2's non-blocking finding assumed it. Fix: make status/lookup read-only (no journal creation; a missing .aida/redo means state=unknown), and run ensure_store_redo_excluded once, when the journal is created, not on every recover. Add a test that request_status through the real MutationAuthority path leaves no .aida/redo behind.
