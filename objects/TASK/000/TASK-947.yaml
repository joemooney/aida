title: 'TUI: grey out inapplicable verbs instead of hiding them (discoverability)'
description: 'Operator UX question (2026-06-26): the operator assumed inapplicable verbs (e.g. request-approval on a non-draft) would be GREYED OUT; today the TUI HIDES them (verb_list_for filters by the focused spec''s status). Decision: hide (less clutter) vs grey (more discoverable — the operator sees the full verb vocabulary and learns WHY a verb is unavailable for the current status). For a quiet-depth tool, greying likely wins. If adopted: render status-inapplicable verbs dimmed + non-selectable, with the status-condition shown in the hint.'
