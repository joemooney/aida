title: Autobuild script should log a line on an up-to-date run so a stale skip streak is not misread
description: |
  scripts/aida-autobuild.sh logs nothing when the live binary is already at the newest green commit (no "promoted and verified" line). The BUG-2787 reader (aida-cli-lib/src/dev_fresh.rs skip_streak) treats only "promoted and verified" or "FAILED:" as ending a skip run. So if the log holds an old skip streak followed by silent no-op runs, it still reads as "autobuild skipping since ...". This only appears when the binary is behind, and the note shows the last skip time, so the risk is low. Suggested fix: log e.g. "ok: live <sha> is the newest green" at the end of a no-op run, and treat it as ending the streak in skip_streak.

  Raised by the implementer while working BUG-2787.
