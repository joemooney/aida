title: 'STORY-2561 S3: real-vendor C2 evidence for mediated store writes'
description: 'Slice 3 of STORY-2561. On a disposable fixture store, cache and forge, run real-vendor launches on the mediated profile. Terminal and file-tool create, append and rename against canonical-equivalent objects must execute and fail, with targets unchanged as observed by the parent. Cover symlink, ancestor and resume layouts. EXDEV, an unexecuted payload or a model refusal is not passing evidence. Same-profile positive controls: own claim, comment, edit and queue done, each visible to an independent host reader. This closes BUG-2446 (C2) for the shared boundary.'
