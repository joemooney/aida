description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-052, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: aida-core/src/mailbox_lifecycle/mod.rs:544-546 source_nonce checks the era marker for staleness and then drops it (TOCTOU). Two resolvers can both judge the old marker stale; the slower one may delete the fresh marker the faster one just wrote, so a nonce-less mailbox is briefly treated as legacy. Narrow window. Fix: re-validate before removing, or rename the marker aside and re-check.

