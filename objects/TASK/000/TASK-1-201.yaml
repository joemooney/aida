title: In the carrier loop, the 'else' branch taken when pr_head_states is None (forge…
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1575, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  In the carrier loop, the 'else' branch taken when pr_head_states is None (forge enabled but collect_pr_head_state_snapshot_bounded returned None) inserts into incomplete_carrier_specs WITHOUT setting truncated=true. The spec's survivors are then dropped while scan.complete still reads true - a silent under-report, inconsistent with the query-failure branch right above it (which does set truncated) and with how snapshot-None survivors elsewhere are still reported. Required: set truncated=true in that branch (or justify on the spec why snapshot-None suppression must stay silent).

  PR: #2396
