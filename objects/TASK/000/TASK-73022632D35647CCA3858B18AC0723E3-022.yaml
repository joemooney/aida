title: 'pr train --status: step names, exit codes and driver-written sidecars chosen by the implementer'
description: |
  Three calls made within STORY-2823 that the advisor should know shipped:

  1. Step names are the journal's own (Open, Ci, Gate, Merge, Retire, Members), not the spec's list "Gate/Ci/Merge/Members/Cleanup". There is no Cleanup step in the journal; a driver that holds the lock before any journal exists is reported as running with "no train built yet".
  2. Exit codes: 0 = running (live driver), 40 = no train, 41 = orphaned journal. Registered in EXIT_CODES (aida-cli-lib/src/orchestrator_leases.rs). "No train" is therefore non-zero, which trips `set -e` scripts.
  3. The journal has no step timestamp or driver PID and denies unknown fields, so the driver now writes two advisory files: its process identity into .aida/train/run.lock, and a `<journal>.step` sidecar (aida-cli-lib/src/pr_train_journal.rs: record_driver, note_step). A train driven by a binary older than this change shows "for an unknown time" and "PID is not visible"; running vs orphaned is then decided by a momentary shared-lock probe on run.lock (lock_held), which can make a train starting in that instant refuse with the busy message.

  Also: clap's `requires = "status"` did not reject `--json` without `--status`, so that rule is enforced at dispatch (aida-cli-lib/src/pr_cmd.rs).

  Raised by the implementer while working STORY-2823.
