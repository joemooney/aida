title: 'Init greeting: teach the code-to-spec link bridge between ''aida list'' and ''aida done'''
description: 'Novice friction (operator-observed 2026-06-10): the init greeting''s loop block teaches the four verbs (add/list/done/show) but leaves a blank between ''aida list'' (see your tasks) and ''aida done <id>'' (mark finished) — the novice doesn''t know AIDA doesn''t build for them, and never learns the magic: reference the spec id in a // trace:TASK-1 comment or (TASK-1) commit trailer and ''aida show'' reveals the code linked to the spec. Rewrite the loop block to: ''The loop: capture -> build -> link -> done'', insert a dim signpost line (''build it in your editor, put (TASK-1) in your commit message'') between list and done, and reframe ''aida show'' from ''recall why'' to ''see your commit linked to the task -- that''s the point''. The persistent teacher (aida show no-linkage hint, TASK-726) already covers how-to-link for returning sessions. Doc parity: getting-started.md. Rides into v0.12.1.'
