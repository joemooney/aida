title: AIDA_ZEN treated as non-empty=on — AIDA_ZEN=0 counter-intuitively enables zen
description: |
  The `--zen` autonomy mode (STORY-287, PR-78) reads the `AIDA_ZEN` env var
  as **truthy when non-empty**, not when equal to `1`:

  - Rust pre-flight: `std::env::var("AIDA_ZEN").map(|v| !v.is_empty()).unwrap_or(false)`
    — aida-cli/src/main.rs `handle_queue_work` (autonomy pre-flight line).
  - Skill prose (4 core skills): `echo "${AIDA_ZEN:-}"`, "Non-empty → advisor-on-standby".

  Consequence: `AIDA_ZEN=0 aida queue work <spec>` or `AIDA_ZEN=false ...`
  ENABLES zen mode, because "0"/"false" are non-empty strings. A user trying
  to explicitly disable zen for one invocation would silently get it on.

  The documented contract (cli.rs `--zen` help text) is `AIDA_ZEN=1`. The
  sibling autonomy var `AIDA_HEADLESS` is described in the aida-review skill
  (step 7b) as checked for the exact value `1`. So the two autonomy env vars
  disagree on truthiness semantics — a cross-reference inconsistency.

  Suggested fix: check `AIDA_ZEN` for exact `1` (or a small truthy set
  `1/true/yes`) in both the Rust pre-flight and the skill prose, matching
  `AIDA_HEADLESS`. Low blast radius — one Rust expression + a sentence in 4
  skill templates.

  Non-blocking — surfaced by the adversarial deep-pass (Probe 1) during
  review of PR-78. Did not sink the verdict (Approved).

  Raised in review of PR-78: STORY-287 --zen advisor-on-standby autonomy mode.
