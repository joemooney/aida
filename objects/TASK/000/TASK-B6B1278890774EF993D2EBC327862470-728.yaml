title: Advisor standing orders open with a vendor-neutral delivery contract (merges and eligible-PR wait time are the measure)
description: 'Operator request 2026-11-02 20:26 MST, after a Codex advisor ran 8h without a merge while a Claude advisor shipped 24 merges in 15h. Codex''s self-diagnosis: blocked work dominated the queue, advisor authority was underused, procedure was added instead of acting, and activity was confused with delivery. Add a short contract as the first block of aida-core/templates/.aida/discipline/standing-orders/advisor.md, vendor-neutral so both vendors'' advisors read it at session start: ready-to-ship first; act once the next action is known; route around a blocker; rule forks with a recorded reason; review alongside CI; use the established deputies and check that a queued command finished; measure merges and eligible-PR waiting time. Acceptance: the contract is in the template master and its mirrors (make sync-templates; make check-templates passes), and the existing numbered orders are unchanged.'
