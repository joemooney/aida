title: Scaffold docs/extending-skills.md into target projects (STORY-305 follow-up)
description: |
  STORY-305's acceptance bullet 5 (`docs/extending-skills.md scaffolded`) was missed: the doc was added to AIDA's own repo at `docs/extending-skills.md` but is NOT scaffolded into target projects by `aida init` / `aida scaffold apply`.

  Concrete problem: the scaffolded `.claude/skills/local/README.md` (from `generate_local_skills_readme()` in `aida-core/src/scaffolding/mod.rs`) and the AIDA.md section (`aida-core/src/scaffolding/aida_md.rs:228-252`) both reference `docs/extending-skills.md` for the worked example — but that path does not exist in a fresh `aida init` project.

  Fix options:

  1. Add a `generate_extending_skills_doc()` function alongside `generate_local_skills_readme()` and emit an artifact at `docs/extending-skills.md`. Mirror the AIDA-repo copy (or split: keep the long-form / AIDA-spec-flavored copy in the AIDA repo, scaffold a target-project-flavored copy that uses generic examples).
  2. Drop the broken pointer from the scaffolded README + AIDA.md sections and accept that target projects only see the README's TL;DR (cheaper, less useful).

  Raised in review of PR-210: https://github.com/joemooney/aida/pull/210#issuecomment-4523279133
