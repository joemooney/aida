title: 'enable land housekeeping auto-release: F1 staged-only capture, F2 release TOCTOU under ownership lock, F3 private immutable ref pins'
description: |-
  Follow-up of PR #4058 (STORY-2768 slice 3a, rework TASK-3796).

  ## Context: advisor scope ruling, 2026-11-15 04:40 (round 7 CR @ 19b04fd), binding

  Round 7 found three new P1/P2 data-loss findings in the unattended release/reset path of `aida land run` housekeeping. All three are real and data-loss class, but every round since round 1 found new loss paths in unattended release/reset, so patching was not converging. Ruling: S3a lands with automatic lease release and spec reset behind a project config knob, default OFF (old behaviour: nothing released or reset). With the knob off, housekeeping salvages, records the breadcrumb and reports only. The release/reset code stays but cannot be reached unless the knob is on. F1-F3 below are preconditions for turning the knob on, not merge blockers for S3a.

  The knob landed as `[land] housekeeping_auto_release` (bool, default false), read in land_housekeeping.rs (`Unattended::from_config`).

  ## Preconditions for enabling the knob (each needs a fix and a regression test)

  - F1 staged-only capture (worktree_gc.rs, salvage_worktree_patch_with). The salvage patch is one HEAD-to-worktree diff, so a staged version that differs from both HEAD and the worktree is lost. S3a only refuses that case in the complete form (staged_and_changed_again) so the report and breadcrumb never claim completeness falsely. Enabling auto-release needs the index captured as well (for example a second HEAD-to-index patch, or an index tree pinned under a ref) so such a lane can be salvaged instead of left waiting.
  - F2 release TOCTOU under the ownership lock (land_run.rs, Keeper::release -> release_lease_files). A lease adopted between the death sample and release_lease_files gets deleted and its grant revoked. The liveness/ownership re-check and the removal have to happen under the same lease ownership lock, and a lease whose owner changed must be skipped.
  - F3 private immutable ref pins (land_housekeeping.rs, origin_evidence). The refs/aida/keep/{main,integration} fetch is shared and unlocked, so concurrent passes can mix snapshots and allow a wrong orphan reset. Pin each pass's tips to private per-pass refs (or read the object ids straight from the fetch), and compare only those.

  ## Acceptance

  - F1-F3 each fixed, with a test that reproduces the loss path first.
  - With the knob on, the existing S3a housekeeping tests and the new ones pass. With the knob off, behaviour is unchanged: with_the_knob_off_nothing_is_released_or_reset_even_for_a_salvageable_lane still passes.
  - An advisor signs off before the default changes, or before any project sets the knob.
