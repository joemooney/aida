    REVIEW FINDINGS TO ADDRESS (TASK-2606):
    Verdict: CHANGES REQUESTED
    Reviewed commit: ff7da9061d73
    Recorded: 2026-11-01T06:46:12.237870209+00:00
    Findings:
    1. AC3 (minor): docs/authority-and-seats.md:104 'Stops with your authority' says a deputy started during a mandate always exits when the mandate ends. docs/cli/06-roles-sessions.md:447 makes an exception: 'unless you started it with --keep-after-mandate'. Mention that flag.
    2. AC3 (minor): docs/authority-and-seats.md:88 lists what --ship-held still requires (independent approval of the current commit, green CI) but leaves out two conditions in docs/cli/04-git-lifecycle.md:484-491: the advisor must not have authored the work, and the stale-approval override is never honoured under a mandate. As written the list reads as complete. Add both.
    3. AC3 (minor): docs/authority-and-seats.md:110-112 says the steps listed 'refuse unless they run at an interactive terminal' and includes 'aida role add'. Per docs/cli/06-roles-sessions.md:71, role add without a mint does not refuse: it creates a label-only role and unsets the grant variable. Reword the line, e.g. 'only mints a grant at an interactive terminal'.
    4. AC5 (minor): the page uses internal terms it never defines: 'lane' (line 88, 'routes every stalled lane'), 'relay' (line 88), 'launcher' (lines 15, 61), 'typed hold marker', 'label-only hold' and 'recusal hold' (line 119), and 'agent harness'/'background agent daemon' (line 71). AC5 allows only the terms the page defines. Define them in 'The terms on this page' or rewrite them in plain words, then rebuild with python3 docs/showcase/build.py.
    5. AC6 (process, non-blocking for the diff): the gh-pages deploy can only follow merge. The spec must not be auto-completed on merge: keep TASK-2606 open until the snapshot from the merged revision is published per docs/showcase/README.md.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
