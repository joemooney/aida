spec_id: TASK-22
title: 'Phase 3: per-role scope filters (auto-apply --tag/--status to list/queue)'
description: |-
  Implements the first Phase 3 deliverable from EPIC-1-005: per-role default filters that auto-apply to 'aida list' and 'aida queue list/next' while a role is active.

  ## Schema

  Add to RoleState (TOML, serde defaults for back-compat):
  - scope_tags: Vec<String>     — auto-AND these tags into the filter
  - scope_status: Option<String> — auto-apply this status filter

  ## CLI surface

  - aida role scope set [--tags X,Y] [--status Z] — write to active (or named) role
  - aida role scope show [name]                   — print current scope
  - aida role scope clear [--tags] [--status]     — clear all or specific fields
  - aida role show — extended to display 'Scope:' line

  ## Auto-apply semantics

  When AIDA_SESSION_ROLE is set:
  - 'aida list' AND's the role's scope into ListFilter
  - 'aida queue list/next' AND's the role's scope on top of the existing role-routing filter
  - Explicit --status / --tags flags on the command line OVERRIDE the role's scope (don't compose)
  - New --no-scope flag bypasses entirely

  ## Plumbing

  - ListFilter currently has no 'tags' field; the CLI accepts --tags but the git backend drops it. Add tags: Vec<String> to ListFilter and wire through Cache::list (cache_schema.sql already stores tags as JSON array — needs a small SQL filter).

  ## Out of scope

  The second Phase 3 bullet from EPIC-1-005 — per-role Claude Code system-prompt addenda — is a separate concern and stays deferred.
