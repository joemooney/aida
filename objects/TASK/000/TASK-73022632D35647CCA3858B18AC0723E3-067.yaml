title: Unattested repair-reservation release salvages to <main>/.aida/salvage, not ~/salvage as TASK-3891 AC1 words it
description: |
  TASK-3891 AC1 says a tree is salvaged to ~/salvage before an unattested release. The implementation (aida-cli-lib/src/repair_journal.rs ForgeProbe::salvage) reuses seat_clone::salvage_complete, which writes a patch plus a bundle of unique commits to <main>/.aida/salvage/<tree dir>/. That is the existing complete-salvage format that seat teardown already uses. Each audit line and journal release record names the actual path. If the operator wants ~/salvage, either salvage_complete gets a destination parameter or the probe copies the result there.

  Raised by the implementer while working TASK-3891.
