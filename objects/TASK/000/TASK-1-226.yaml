    ADVISOR SIGNOFF: APPROVED — TASK-1335 diagnostic sketch, WITH BINDING AMENDMENTS

    Independent reviewer: Codex store-reconcile-independent-advisor, 2026-10-08; neither author nor coordinator. Exact sketch SHA256 b6c33cd55be44d1c14b27adac1b76dbdfff848b815865388fd671636e3a771ac, canonical comment 01a11c6a-b5f5-7fe1-b661-36e1a16a9189. Source baseline b46aec1e674baae5a329416d4119e67b59200a88. Full report: .aida/handoff/orchestrator/run-20261008/STORE_RECONCILE_SKETCHES_INDEPENDENT_REVIEW.md. This approves the bounded design as amended, not implementation, completion, testing, queueing or merge.

    Acceptance interpretation: choose the owning finding's honest per-spec unavailable-evidence diagnosis and retryable nonzero outcome, not its speculative offline-credit alternative. Preserve original observation, hypothesis and proxy/request history. No offline completion or wider credit authority is approved.

    Source evidence: lib.rs::handle_db_reconcile_status (78267 onward) collects subject candidates and gated squash-body references, stale review-story and covers paths, then clears normal flips if specs_with_open_prs is unavailable. The empty deferred path currently returns Ok at 78604. Its Completed sweep header uses a DIFFERENT count_completed_specs_with_open_prs result. lib.rs:75833 returns Option and currently treats valid non-array JSON/malformed rows as empty by falling through. The exact historical subject at 978c4974292a59513f53bab40b53b10be8122ca7 is `[AI:codex] feat(ci): validate Windows weekly   on main (TASK-1588) (#2436)`. I inspected push_paren_spec_ids_from_line both on b46 (92710) and at that historical build commit: BOTH skip terminal (#2436) and parse the adjacent TASK group locally. extract_spec_ids_from_commit also supports the existing leading SPEC-ID: form. Thus source does not support the claimed necessity of forge lookup to extract this subject, even at that recorded build source. It does not establish which installed executable ran, runtime state, range or historical causality. No reproduction was run; do not rewrite the hypothesis as a proved cause.

    Binding amendment D1 — precise internal evidence model and exit semantics. Use an internal checked lookup result that separates authoritative clear/open from required-evidence-unavailable, with stage/source/SHA and canonical identity retained before filtering. Preserve a compatibility Option wrapper for existing callers if needed; no new persisted field/public schema/flag. Validate the complete returned array and each required positive PR number; malformed/non-array/truncated/undecodable/nonzero/missing-executable/unsupported-provider results are unavailable, never empty. Report the actual available failure class without inventing auth/rate-limit causality from generic exit failure. No-match is not an empty final flips vector.

    Exit matrix is binding in both normal and --dry-run: (a) genuine no attributed candidate in the pinned range: success/no-op; (b) known open change, stale/reopened evidence, already-terminal, ineligible or known closure hold: existing refusal/no-op semantics, not the new unavailable error; (c) at least one actual candidate loses a REQUIRED evidence check: print precise reasons and return ordinary nonzero Result error, even if other lists are empty or dry-run; (d) only the already-Completed diagnostic query fails: warning, not a newly fatal completion gate. Do not reserve a new numeric exit family. Every early return must obey this matrix. Preserve aggregate all-or-nothing normal-flip refusal on any required lookup failure; a candidate whose own query succeeded can be reported as checked but batch-deferred, not falsely marked individually unavailable. Do not add partial completion of that normal batch. Existing independent draft/stale-review paths remain distinct; if they apply before final error, report actual partial effects. Never imply whole-sweep atomicity or unchanged-all when it is false.

    Binding amendment D2 — pure git must be an affirmative classification, and diagnostics must not repair configuration. Keep the real pure-git/no-change-request positive. Configured GitHub failures and unsupported configured GitLab are unavailable, not ForgeKind::None. forge.rs::resolve_forge_kind (1157) can WRITE repaired provider config and conflates some absent/error discovery through Option. For the diagnostic path, use a checked, non-mutating resolution that preserves origin-over-stale-pure-git behavior but reports configuration/origin discovery failure instead of downgrading a configured forge. Do not globally redesign forge policy. Both required lookup and Completed-only diagnostic must use non-mutating discovery in dry-run. Test repo config bytes as well as store objects/history/HEAD unchanged; no persistent write merely to explain a dry-run. A genuine local bare-remote/pure-git fixture remains a positive.

    Binding amendment D3 — retain exact attribution and freshness fences. Pin the actual scanned default-branch OID and range, not a printed ref later reread as HEAD. Preserve plan exclusion, existing leading/terminal subject forms, supported multi-spec parsing, canonical ambiguity refusal and origin/display mapping. Preserve current gated squash-body completion trailers and PR-derived review/covers rules, not arbitrary body/prose mentions. Do not transplant PR-ship's different TASK-1600 attribution rules into replay or weaken its existing tests. Closed-but-unmerged forge evidence, an unrelated branch-head trailer and prose-only IDs cannot acquire new credit. Preserve SHA-at/before-reopen and deliberate human reopen history, including intervening automated overwrite.

    Important source correction: reconcile's actual write transaction at lib.rs:78701 has INLINE status/stale checks; it does not call apply_auto_bump_flip. That helper at 76562 itself rechecks status/staleness, not the whole current graph's closure holds. The earlier split_closure_held_flips uses the scan snapshot. Do not claim that retaining the helper proves a concurrent new hold is fenced. At the actual atomic application seam, evaluate current canonical status/reopen and relevant closure/covers facts before granting completion; record applied versus changed-during-apply from those actual decisions. Keep new forge I/O out of the store lock. This is the sketch's stated hold/freshness invariant being made concrete, not a new completion policy. If accomplishing it requires broader authority/lifecycle changes than this bounded seam, stop that broader work for same-spec independent disposition rather than silently skipping the invariant. Existing holds and separately signed authority gates are never waived by diagnostic signoff.

    Required proposed evidence: all six original fixture groups, with real CLI targeted/sweep and dry-run/normal pairs; controlled historical subject distance; valid [] and actual open PR; unavailable/malformed responses; pure-git versus configured unreachable/unsupported forge; no candidate versus Completed-only diagnostic outage; normal batch success/A-success-B-failure; body/prose/plan/ambiguous/closed-unmerged negatives and existing accepted trailers; later commit positive versus SHA and legacy-human-reopen negatives; reopen AND closure/covers change at the real apply barrier; truthful partial-path reporting and idempotence. Snapshot config, canonical objects/history/store HEAD for dry-run. No fake bypass or live network/store reconciliation. Tests are PROPOSED, NONE RUN.

    Disposition: bounded diagnostic design approved AS AMENDED D1-D3. No missing common-launch/publisher prerequisite blocks this diagnostic design; any broader discovered integrity change remains separately gated. Preserve prior findings/history and TASK-1593/TASK-1591/BUG-1811/BUG-1812 reservations. Source changes require the separately authorized implementation workflow, exact-head independent review and applicable checks; this readiness/signoff text performs none of those actions.
