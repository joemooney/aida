    ## Blocking findings and same-author rework

    All source locations below refer to the pinned candidate, not main's different line numbers. Reproductions and complete outputs are retained in TASK1335_INDEPENDENT_CHECKS and the private scratch directory noted below.

    ### F1335-1 — P1: covers candidates can support each other after every real anchor disappears

    **File/symbol:** aida-cli-lib/src/lib.rs:79111, reconcile_apply_verdicts; :79157, covers_chain_still_supported.

    **Observed:** the algorithm initially includes every surviving covers candidate in the supporting batch. Its descending fixed point accepts a cycle even when no member has independent live completion evidence. This is not the least fixed point already used by the closure helper.

    **Real CLI reproduction:** fixtures/covers-cycle. Seed Completed TASK-74; seed Done review stories STORY-80 and STORY-81, each implementing TASK-74 and the other story. Neither review PR occurs in code history. During each real open-PR query, run the real CLI to remove that story's implements edge to TASK-74. Both barrier commands succeed before the atomic apply. The only remaining edges are the mutual cycle. Actual result: exit 0, both stories Completed, “auto-bumped 2 specs”, empty evidence SHAs, no changed-during-apply diagnostic.

    **Required outcome:** live covers support must remain rooted in a currently Completed requirement or independently justified surviving completion, and must compose with closure filtering without circular self-justification. If removal of an anchor removes the only support, all dependent candidates must stay uncompleted and report the changed evidence. This implements the signed existing covers invariant; it does not require a new generic relationship policy.

    **Required test:** retain this real barrier cycle and a multi-hop anchor-removal case; pair with an anchored cycle/chain and an independently justified completion that still succeeds. Assert final object/history/provenance and actual applied counts.

    ### F1335-2 — P1: the independent stale-review write path bypasses the promised live closure check

    **File/symbol:** aida-cli-lib/src/lib.rs:78909–78928, handle_db_reconcile_status stale_for_write loop; :78831, closure-hold mutation precedes reconcile_apply_verdicts.

    **Observed:** only normal flips receive the new identity/graph verdict. stale_for_write still finds the first matching stored ID and checks status and reopen, then marks Completed without checking current closure facts. This is an existing hole retained inside the expressly accepted D3 seam, not a claim that the patch newly introduced the old loop.

    **Real CLI reproduction:** fixtures/stale-closure. Approved STORY-20 has title “Review PR-901: fixture”; a code commit names TASK-10 and (#901). During TASK-10's query, real “aida rel add STORY-20 TASK-12 --type blocked-by” adds a blocker that remains InProgress. Reconcile exits 0 and completes STORY-20 anyway. Its persisted object contains both Completed and the unresolved BlockedBy edge. The untouched normal TASK-10 completes, so this is not a blanket-failure fixture.

    **Required outcome:** evaluate the relevant live closure/status/reopen and canonical identity facts for every completion at the actual atomic seam, including the independent stale-review path, before granting it. Preserve the independent path's existing evidence policy; do not add a new forge gate or review-target policy. Also reconcile the stated “before any mutation” guarantee with the earlier first-match closure-hold writes; currently those mutate before the new verdict pass and have no scan-UUID ambiguity decision. If a genuinely broader lifecycle repair is necessary, obtain the same-spec disposition rather than declaring D3 satisfied.

    **Required test:** real Approved/InProgress review-story barrier for new closure blocker, positive unblocked control, reopen and ID/UUID/ambiguity changes at the actual seam. Include closure-held candidates when verifying decision-before-mutation and current identity; avoid helper-only evidence.

    ### F1335-3 — P1: affirmative forge classification misses a configured provider

    **File/symbol:** aida-cli-lib/src/forge.rs:1024, forge_provider_token; :1057–1076, checked_forge_kind.

