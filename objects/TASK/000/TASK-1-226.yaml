    ## Blocking source findings

    Locations refer to the exact reviewed tree. These are observed control-flow facts and statically derived repros, **not executed CLI results**. No unavailable test result is being promoted to a pass or a failure.

    ### R1335-1 — P2: scan-held candidates still apply stale closure data and discard their live decisions

    **File/symbol:** `aida-cli-lib/src/lib.rs::plan_reconcile_seam`, lines 79191–79206, 79211 and 79259–79272; `handle_db_reconcile_status`, lines 78884–78897 and 79004.

    **Observed source fact:** a `SeamKind::Hold` receives identity, eligible-status and reopen checks, and covers-source items receive the direct-anchor check. However, `completes = |kind| kind != SeamKind::Hold` excludes every hold from the live closure calculation. No current blocker/criteria payload is produced for holds. The writer passes the original `holds_for_write` entry to `apply_closure_hold`; that helper checks freshness/status but never reads the closure graph. It can change a pre-Done status to Done and append the old blocker/criteria comment. Afterward, `seam_verdicts.into_iter().skip(holds_for_write.len())` discards every hold decision, including Changed UUID/ambiguity/status/reopen decisions. Only the earlier scan-based “stays Done” report survives.

    **Concrete static repro:** seed an eligible Approved task A with a real attributed commit and an unresolved BlockedBy B (or an unmet declared closure criterion). Seed an unaffected normal candidate C as a positive control. During A’s required open-PR lookup, use a successful private peer mutation to remove/replace A’s blocker or clear/change its closure criterion. The scan snapshot still classifies A as a hold. At the live seam, A has the same UUID, eligible status and fresh SHA; the code returns Apply without checking its new closure facts, then marks A Done and writes a note naming the old hold. The current graph no longer supports that note. In a separate variant, replace A’s UUID, add a new ID ambiguity, or make A terminal at that barrier: the new guard prevents the write, but the Changed decision is discarded and the report still states the obsolete hold outcome.

    **Required outcome:** fulfill F2’s explicit all-hold/normal/stale decision-before-mutation invariant. Decide whether a hold is still supported using current closure facts before writing its status or audit data; do not persist a stale blocker/criterion explanation. Preserve the actual live decision in the report, including held-item identity/status/reopen refusals. This does not require new permission, forge, review-target or generic lifecycle policy; conservative refusal on drift is sufficient if accurately reported.

    **Required meaningful test:** real CLI held-candidate barriers for removed/replaced blockers or changed criteria, UUID replacement, new ambiguity, reopen and terminal peer change. Assert final status, exact history/comment bytes and emitted events; an untouched genuinely held candidate must still get its legitimate hold note, and C must complete. Neither the existing normal-candidate race nor a helper-only verdict test covers this path.

    ### R1335-2 — P2: dry-run predicts stale-review completion that the same source refuses in normal mode

    **File/symbol:** `aida-cli-lib/src/lib.rs::handle_db_reconcile_status`, stale collection at 78483 onward, normal-only closure split at 78598, dry-run stale summary at 78798–78820 and return at 78829; live plan at 78874 and 79259–79286.

    **Observed source fact:** `split_closure_held_flips(&store, &mut flips)` evaluates only the normal list. `stale_review_flips` gets freshness filtering but no closure evaluation before the dry-run output. Dry-run prints every surviving stale review as “would flip … → Completed” and returns before `plan_reconcile_seam`. Normal mode now correctly evaluates these same stale reviews against the live closure graph and returns Held. Thus even a blocker already present before scanning—not a race—produces incompatible preview and actual outcomes.

    **Concrete static repro:** seed Approved review story S titled `Review PR-901: fixture`, with an unresolved BlockedBy B already present; seed eligible task A and a default-branch commit `fix: merged (A) (#901)`. Fake required lookup returns authoritative `[]`. `--dry-run` includes S in its would-complete review count. Normal mode completes A but leaves S Approved and reports its closure hold. No network failure, identity change or authority refusal is required to trigger the discrepancy.

    **Required outcome:** report the known closure-held stale review as held/non-completing in the dry-run, consistent with normal behavior, while retaining successful no-op semantics for a known hold. Do not introduce an extra required forge query or change stale-review attribution policy.

    **Required meaningful test:** paired dry-run/normal real CLI with an initially blocked stale review, unblocked stale-review positive, and declared-criterion variant. Assert preview counts/reasons, normal status/history/event counts, and full no-write dry-run snapshot. The current stale-review test exercises only a normal invocation with a blocker introduced at the lookup barrier.

