    ## Source remedies

    **R1335-1 — scan-held candidates are re-decided live (`lib.rs::plan_reconcile_seam`, writer and reporter in `handle_db_reconcile_status`).**
    - Hold items get the same identity, status and reopen checks as every other item.
    - After the completion fixed point, each surviving hold is re-derived from the LIVE graph with `closure_holders_treating_resolved`, treating the surviving completions as resolved.
    - If it is still held, the verdict is `SeamVerdict::Hold(current ClosureHold)`. The writer applies only that CURRENT payload, by decided UUID index.
    - If it is no longer held, the verdict is `Changed("its closure hold no longer applies")`. Nothing is written; a rerun decides.
    - Identity, ambiguity, status and reopen refusals are also `Changed`, and are reported.
    - Every hold verdict now feeds `outcomes`. `report_closure_holds` prints the LIVE holds after the seam in a writing run, and the scan holds only in a dry run.

    **R1335-2 — the preview matches the write.**
    - At scan, one least-fixed-point `split_closure_held_flips` pass runs over normal AND stale-review completions, iterated with the direct rooted covers rule.
    - A held stale review story is removed from the would-complete list. It is reported `Held(causes)` (`closure_hold_causes`, the new cause-only text), with no landing and no note.
    - A covers candidate whose only covered spec was just held is `Held("no covered spec is Completed or completing in this run")`.
    - The seam's closure check therefore only ever reports holds that are new since the scan.
    - No new forge query and no attribution change.

    **Covers semantics (rework-v2 item 3).**
    - `covers_chain_rooted` is deliberately DIRECT. A covered spec must be Completed in the live store, or a surviving non-covers completion in this run. This is BUG-113's existing rule: `collect_covers_completed_review_flips` only ever considered the normal batch.
    - It is not, and is not claimed to be, a general fixed point over covers candidates.
    - A story that covers only another covers candidate is not a candidate in the same run. It graduates on the next run once that candidate is Completed; the test witnesses this.
    - No new covers policy was invented. This is stated in the `plan_reconcile_seam` doc comment.

    Unchanged from b98: F1335-3..6 (strict TOML reader, diagnostic row schema, this-run-only effects, one completion per UUID) and D1–D3.
    `forge.rs` is byte-identical to b98.

