title: 'SPIKE-41 slice: WorktreeCreate/WorktreeRemove hooks → register/release an AIDA lease (substrate-capture for harness-orchestrated worktrees)'
description: |-
  The highest-leverage slice of SPIKE-41's hook-bundle. Claude Code fires WorktreeCreate when a worktree is provisioned via --worktree or isolation:'worktree' (Workflow/subagent fan-out), and WorktreeRemove on teardown — and these 'replace default git behavior', so AIDA can OWN the provisioning. Wire: WorktreeCreate hook → register an AIDA lease for the new worktree (scope from the spec/branch if derivable, else a generic 'harness-worktree' lease); WorktreeRemove hook → release it. Net: a Claude Code Workflow's parallel worktree-isolated agents become LEASE-TRACKED in the AIDA substrate — closing the exact gap quizdom's bypass exposed (BUG-431 → fell back to the Workflow tool, shipped code, populated zero substrate). Scaffold into the 'aida init' hook bundle.

  GATED on SPIKE-41 confirming the events behave as documented (fire timing, payload shape — does WorktreeCreate carry the worktree path + can the hook influence/record it?). SCOPE: substrate-CAPTURE only (register/release the lease) — NOT substrate-driven orchestration (the Workflow still decides what to do; the hook just records the worktree as a lease). Pure-testable core: given a WorktreeCreate payload {path, branch?} → the lease record to write. trace:SPIKE-41
