title: Advisor heartbeat degenerated into token-repetition during idle mail ticks
description: |-
  During quiet 'mail-check' heartbeat ticks with no work to do, the advisor agent's sampling degenerated into a stream of junk tokens (count / court / काही) while narrating "my count of the loop iterations" and "the current tick". It self-recovered and stopped; NO harm — the drain (BUG-1174) ran in separate child processes and never faltered (its headless log kept writing through the glitch, cargo fmt --check running 1s before I checked).

  Signal: an agent idling in a self-counted poll loop is exactly the failure mode "presence is not the clock" warns about. The heartbeat should be substrate/cron-driven and wake the advisor only on a real awaiting signal (mail arrived, PR mergeable, drain event, findings non-empty), never an agent narrating idle ticks it counts itself. Free-form narration of an empty loop is what degenerated.

  Fix candidates: (1) a cron/event heartbeat that wakes the advisor only when 'aida awaiting' is non-empty, rather than a continuous agent-driven poll; (2) if an idle poll loop must exist, cap its iterations and have it emit a fixed one-line status, not free-form prose that can repetition-degenerate. Pairs with the presence-not-the-clock and substrate-first mandates.
