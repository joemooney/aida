title: 'minor (non-blocking): relay_stall.rs:135-149 dead-owner findings have no age ca…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1792, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): relay_stall.rs:135-149 dead-owner findings have no age cap, and for default run-dir relays (status handoff=<run>/handoff.md) acknowledgement_marker returns None, so the only way to silence one is deleting the run dir (losing sessions/ logs). After a host reboot every running relay becomes a permanent, unackable page — the forever-page TASK-1792 item 3 removed for trap-written exits. relay.sh --status reports the same condition as plain 'exited'.

