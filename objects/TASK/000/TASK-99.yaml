  content: |-
    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: queue work still only pulls the orphan store, not the code branch (verified in --help). Pulling code before worktree creation is plausibly useful, but the orchestrator/--auto-complete drain and `aida pull --auto` stacked-rebase have reshaped this area. Implement?
      a) Implement as specced: pull default branch before worktree creation, --no-pull skips both legs, abort-on-divergence with recovery hint.
      b) Reject — superseded by the orchestrator drain pulling fresh main per-phase and the reviewer stale-base gate; manual queue work is increasingly a rare path.
      c) Minimal slice: just add a "base is N behind origin/main" warning at worktree creation (no auto-pull), pointing at `aida rebase`.
      REC: c — closes the visibility half of the original 2026-05-13 pain cheaply without the divergence-handling complexity that the orchestrator/rebase-verb already own; full auto-pull risks surprising the worktree.
