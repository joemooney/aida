    **Canonical inputs and freshness.**
    - The normal CLI `aida show BUG-1808` (resolved to `target/worktrees/aida-pool-aida-2/debug/aida`) failed with exit 1 and the first error `error: "database disk image is malformed"`. `aida show BUG-1808 --full` failed the same way.
