    ADVISOR SIGNOFF: APPROVED AS AMENDED — TASK-1332 V2, BOUNDED PROTECTIVE LOCAL DESIGN ONLY

    Independent reviewer: Codex independent_v2_advisor (/root/independent_v2_advisor), NEW independent advisor; neither root, either sketch author, nor V1 reviewer. Review date 2026-10-08 America/Phoenix. This is independent design/source judgment, not an authenticated implementation-review grant. Reviewed the complete V2 body, 32977 UTF-8 bytes, SHA256 b6c367d14a87c09a5ee054203313e7b6047863808b1dab44b3f313080c507d82, canonical comment 01a11c86-6719-7c53-b102-27c4c5db706e. Source baseline b46aec1e674baae5a329416d4119e67b59200a88. Full verdict/evidence: .aida/handoff/orchestrator/run-20261008/STORE_RECONCILE_SKETCHES_V2_INDEPENDENT_REVIEW.md and store-reconcile-v2-independent-evidence/. Root must read the complete verdict before any dispatch; this comment is not autoqueue permission.

    F1332-1 — design accepted with the explicit lock-matrix amendment below. V2 now identifies the actual backend, schedule, all six coordination, core roster/alias/node/block, direct merge-gate, sync_objects/autopush, canonical mailbox, doctor, initialization and maintenance writers. These are genuine source seams, not claims that current main is protected. Core public mutations must participate; CLI-only wrapping cannot complete the task. Retain existing db/store_lock.rs::acquire, canonical permanent inode and same-thread lexical reentrancy through one synchronous closure. No second lock, guard transfer, inherited lock FD, parallel schema or blanket lock for ordinary code repositories. Acquire before relevant canonical/branch/index/preimage reads and check ensure_store_write_safe after acquisition. Keep invocation-owned stage/commit/rebase/abort/validation together; never clean up a pre-existing rebase or restore an old snapshot over a peer. Preserve original errors and unsafe state.

    A1 (binding matrix correction): the concrete dispenser path at git_backend_cmd.rs:3773 is NOT established as a background writer: BlockRegistry::with_dispense_lock at node.rs:867 holds registry/blocks.lock through the load/dispense/save and git stage near 3896. FileDispenser also has its existing permanent counter sidecar. Add those locks to the matrix. When enlisting this canonical dispense path, take store BEFORE blocks.lock, use strict canonical collision reads under it, and keep required persistence/staging/commit in the owning finite transaction; never introduce blocks.lock -> store/cache-refresh while another path takes store -> blocks.lock. Existing internal lower locks stay in place. Auto-refill/network occurs before this finite region and is revalidated afterward; an exhausted block requiring C returns through its existing error, not a network call while holding the dispenser lock. Do not claim store-wide safety merely from its current block lock. Add a real add-versus-sync barrier positive and deadlock/nonvacuity checks before closing that row. P rows also need post-acquisition safe-state validation where current ensure_store_write_safe runs before lock; retaining a P label is not proof of that check's timing.

    F1332-2 — ordinary S/L design accepted; selected C direction accepted as the bounded common-owner proposal, NOT an implemented or fully signed CAS adapter. Ordinary retained S commits survive rejection; release for exact full-OID push to an explicitly bound destination, then lock/reread/rebase fresh current state and recapture for retry. A second rejection stays failure. No-origin/documented push=false L retains existing local semantics; configured unreachable remote is not no-origin. Origin-confirmed mirror evidence remains mandatory. Fetch can remain within the existing pull helper/store window for this repair; acquisition timeout does not bound Git/network duration, and no seat/cache/queue/drain-file critical guard may enclose it.

    The V2 private-candidate algorithm is the right selected direction for conditional push-wins: pin L/R/preimage/intent/C, construct in independent private storage unreachable from canonical refs/index/worktree and ordinary wildcard push, recompute the family predicate on every fresh base, normal-push exact C, and install only accepted remote state against CURRENT locked H with peer preservation. A failed attempt cannot leak into an ordinary later sync. No HEAD~1, blind reset-to-C, old-file restoration, blanket stale-claim rebase, or hold-seat-through-network substitute is accepted. Hooks/config/prepared effects cannot be omitted in the private preparation. A fresh local sample followed by unlock is NOT current authority at remote acceptance and cannot stand in for the signed authority owner.

    A2 (binding owner prerequisite, still UNSUPPLIED): BUG-1808's common owner must independently specify and obtain disposition for the store-CAS prepared-Git/publication join: (1) private visibility, exact normal-push binding, object lifetime and supported real hooks; (2) family authority decision and the meaning of remote success under the current home-first local authority composition; (3) accepted-remote/failed-local-install outcome and retained recoverable evidence without blind replay; (4) ambiguous transport observation and current successor handling; (5) exact owned peer HIJACKED.toml install/restore ordering. Current hijack writes the peer marker before push, removes it by pathname after rejection and clears its own marker after acceptance. The local store guard cannot serialize that peer root. Moving marker timing is a lifecycle contract, not a cosmetic lock repair. No new schema, broker, grant issuer, distributed transaction, authority freeze or implicit product fork is approved. The common local P4/C publisher cannot simply be relabeled a remote CAS transaction. These are owner engineering joins, not questions for absent Joe.

    Preserve every per-family positive and existing policy: ledger bound observation/delta/debounce and local offline retention; claim liveness/TTL/PID-start/force plus owned heartbeat/release and expected stale heartbeat; roster exact member/seat intent and migration; alias union; requested versus automatic node/range allocation and post-accept identity install; hijack peer-marker preservation and actual healthy takeover. A no-change local commit is not remote ownership proof. Release/heartbeat must check identity after refresh, not reuse the pre-pull owner sample present in current release_claim/release_lock_claim. If remote C was accepted but local installation fails, report accepted/incomplete and never retry as a new ownership attempt or undo C. Unknown transport outcome remains unknown until exact remote evidence resolves it. Ledger observation retention is not distributed claim acquisition. C and hijack implementation/activation stay pending A2; refusal-only fixtures cannot close them.

    F1332-3 — APPROVED at design level. Canonical mailbox comparison/rank merge/write AND stage/commit must hold the SAME store guard continuously, standalone or nested inside sync. Snapshot local messages before lock, then strictly reread canonical messages while held. Keep local send/watermark/network/orchestration outside. Atomic replacement alone is insufficient. Preserve newer tombstones/peer messages, idempotence and truthful best-effort failure reporting. No canonical write before lock or unlock between digest and commit.

    A3 (binding hooks/maintenance): current b46 Internal dispatch at lib.rs:5123 precedes storage initialization, role restoration skips Internal, and record-no-verify-bypass uses Git/local reporting. There is no proved cache-startup deadlock for that exact detector and no blanket BUG-1808 prerequisite for ordinary S/L repair. Test actual installed AND template profiles: installed prepare-commit-msg only reads store HEAD; template also transforms trailer; linked-store post-rewrite exits; pre-commit sentinel plus post-commit missing/stale sentinel paths must survive. Pin the actual selected binary: old PATH binary behavior is not b46 behavior. Executable commit-config/custom hooks are not presumed safe. A required reentrant writer/home/seat/tick hook needs the accepted owner adapter or named pre-mutation unsupported disposition, never hook disablement, guard environment spoofing, inherited ownership or unlock-around-commit. Preserve healthy hook effects and error observations. Pre-push/mirror stays outside store/seat. Existing tick -> store, store -> cache, server RwLock -> backend/store, and newly explicit store -> dispenser ordering must have no reverse edge. Logical drain/solo markers are not the future publisher's held drain critical flock; heartbeat thread joins occur before acquiring store.

    Optional GC configures gc.auto/gc.autoDetach and may detach beyond RAII. Keep it outside the finite sync transaction and report only Git's actual maintenance coordination. Do not call detached spawn 'settled' when the guard drops. Canonical-byte/index/HEAD-changing custom maintenance is not covered by that profile. Foreground owned/waited maintenance, if required, needs its own reviewed finite window; compaction's explicit backup/ref/reset is a separate local rewrite with its existing confirmation. No global GC disablement or process reaper policy change.

    A4 — EXACT PROPOSED CHILD SCOPE, no child created here: 'Serialize ordinary store sync, direct merge-gate and canonical mailbox with the existing writer lock'. Parent TASK-1332 remains closure-pending. Include the synchronous core lock closure; Db Sync; store legs of handle_pull_command/handle_push_command/maybe_sync_pull; auto_push_store_best_effort/maybe_auto_push_store; pull_store_before_id_allocation/push_store_after_id_allocation for ALREADY retained spec edits; core sync_objects; core/direct/nested merge_gate; remote reconcile's current-locked local frontier/merge/rollback; canonical digest and both explicit/automatic callers; preservation of existing P core/backend/cache routes and safe-state order at touched P seams. Any prerequisite finite store bytes write for these routes belongs to the same child window, not a staged-only fix. Generic code legs, fresh CAS node/block/claim/roster/alias operations (including hijack), release/tag policy, full doctor/init/dispenser/compaction inventory conversion and new runtime/publisher authority integration are excluded from this child. They remain named parent closure obligations; none is waived. Existing no-origin sync remains a positive. Existing L-only ledger/doctor/init/dispenser repairs can follow as separately bounded same-parent slices using this approved discipline and A1; do not silently include their remote C variants.

    Child acceptance: all five original witness groups apply to its routes, with pending CAS subcases explicitly carried by the parent. Run actual CLI/core entrypoints in isolated stores/local bare remotes/fake HOME with deterministic interprocess barriers, canonical-path/sibling/symlink same-inode checks, same-thread nesting, distinct-store progress, backend/spec/queue/mailbox/direct-merge-gate competitors, dirty/pre-existing-rebase/abort-failure preservation, current-preimage remote reconcile, exact pinned push/repeated rejection and origin-confirmed mirrors. Preserve valid union/rebase, offline/no-origin, hook and cache positives. Cover stale canonical mailbox tombstone and local send without store ownership; all canonical digest stage/commit inside one guard. Prove store/seat guards absent at push and the seat guard absent during hook/callback work; the store guard remains continuous through local stage/commit hooks. Prove no inherited lock FD. Counter-test removal of the new outer guard must expose the intended race in scratch; restore guard and pass. Tests are PROPOSED, NONE RUN here. Unconverted C/L writers can still race the shared store: the child is protective partial work, not a globally exclusive store or whole TASK-1332 completion. No authority freeze or disabling other routes may be added to pretend otherwise. Later parent closure requires complete matrix enlistment, independently accepted A2 integration and all healthy C/peer/ambiguous-accept/local-install-fault/hijack witnesses.

    Disposition: V2 is ADVISOR SIGNOFF APPROVED AS AMENDED for the stated local design/child boundary and explicit dependency contract. Full CAS/hijack integration is NOT READY; parent functional completion and whole-writer integrity remain pending. This settles grounded local engineering choices without requiring the absent entire common implementation merely to approve a protective slice. No source/spec/status/queue/grant/hold/launch/PR/merge/commit/push/parent mutation was performed or authorized by this review. Root must retain the full amendment in any dispatch and separately satisfy its dispatch workflow. Preserve all V1/V2 history, TASK-1335 approved D1-D3/separate implementer, and external TASK-1593/TASK-1591/BUG-1811/BUG-1812 reservations.
