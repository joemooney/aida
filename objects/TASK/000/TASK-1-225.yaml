    # BUG-1808 / TASK-1332 A2 store-CAS owner join — V2 independent design review

    **Binding disposition: CHANGES REQUESTED.** 2026-10-08, America/Phoenix.

    This is a new, different, independent design review of the whole V2 owner-join sketch. The reviewer is a Claude Opus 5.5 Claude Code session started for this review only. It did not author V1, V2, either READY, any earlier BUG-1808/TASK-1332 sketch, the earlier V1 independent review, or any common, A2-gate or root decision. No authenticated implementation-review grant is asserted. This session's runtime label has no bearing on identity with the external coordinating root.

    V2 is a substantial improvement. Findings 1, 3, 6 and 8 of the earlier review are largely answered, and R-1/R-2/R-3 are carried correctly. Even so, the source and the Git 2.43 manuals contradict several of V2's stated facts, and some joins are still implicit. In particular:
    - **The pre-push identity gate is inert in the context V2 selects.** It reads its allowlist from the store worktree.
    - **The P-side network profile is not the profile V2 verifies.**
    - **The production origin is HTTPS, and no witness covers it.**
    - **The ACCEPTED report is discarded when lineage is resolved.**
    - **Open admissions have no bounded settlement and no cross-invocation lineage**, so a restart can allocate a second id or range.
    - **The ordering between the admission COMMIT and its locator is unspecified, and P has no record type.**
    - **The F-1 matrix labels three launch-reaching callers as ordinary.**

    None of these needs a broker, a new issuer, a freeze, a distributed transaction or a product relaxation. Each is a concrete design correction.

    Root must read this entire report before relaying it. Root is the sole canonical relay. No component dispatch, inactive-component permission, production activation, parent completion, PR, merge or authority-sensitive approval follows from this report. No question goes to Joe.

