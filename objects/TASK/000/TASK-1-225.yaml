    - V2 asserts "the source has none [no such contract] for roster writes" but cites no signed text. Rows then list healthy positives as if U-1..U-3 were acceptance-neutral.
    - Core roster writers have no authorization, so "does not borrow CLI proof" has no defined observable outcome.
    - V1 §6(b)'s "TTY human … never revocable" prose is never explicitly withdrawn (V2 §1 lets non-restated V1 text "survive").

    **Required outcome.**
    - For each row, state whether any signed contract requires the authority at remote acceptance, citing the exact text.
      - If one does: the row's production join is BLOCKED by U-n, and U-n is never an acceptance waiver.
      - If none does: state the acceptance-neutral disclosure with its citation.
    - Define the core-route negative concretely, for example: the receipt records no invocation-authorization evidence for a core caller, and no CLI-derived TTY sample is recorded as authority. Preserve today's core permissiveness unless the owner records a decision.
    - Explicitly withdraw V1 §6(b).

    **Proposed test.** W6 additions: a direct core `team::allow_seat_cas` call checks the receipt fields; a revoke between ADMISSION and acceptance is reported per the row's declared disposition (BLOCKED rows record OPEN).

