  content: |
    SKETCH (awaiting advisor signoff): TASK-1332 — v2 complete writer inventory and rejected-publication boundary

    Same-lineage revision AUTHOR: Codex store-reconcile-sketch-author, 2026-10-08. Companion read/converse/draft only; the ENTIRE file is the exact proposed canonical comment for root relay. No posting, implementation, status/queue/grant/launch/merge or self-signoff. A NEW DIFFERENT advisor must judge these bytes. TASK-1335 and its D1-D3 approval are untouched.

    ## Precedence and exact amendments

    Read the complete STORE_RECONCILE_SKETCHES_INDEPENDENT_REVIEW.md and numbered store-sketch-rework.md, then actual main b46aec1e674baae5a329416d4119e67b59200a88 and fresh canonical comments. Preserve v1 TASK1332_STORE_WRITER_SKETCH.md, SHA256 f5a37695aa86a5cdb458a08403478cfee29b92b6dff44f16215367a7f6d6060c, canonical comment 01a11c6a-9e64-7b20-8553-eeb3d3862692. Independent CHANGES REQUESTED is now canonical 01a11c76-46aa-7e62-89eb-08cc04211704. Preserve F1332-1, F1332-2, F1332-3 and original TASK-1604 observation, origin TASK-1-225 / UUID 01a1101a-d324-7002-9942-3eb492b0fc4c, proxy/request comments and all prior sketches.

    This v2 replaces v1's incomplete writer inventory, blanket ordinary-sync retry applied to all writers, unsupported mailbox protection assumption, suspected Internal cache-startup cycle, and maintenance lifetime wording. Unaffected v1 owner/trigger, existing reentrant lock choice, ordinary sync window, refusal/error preservation and ALL FIVE witness groups remain normative. The independent review's accepted decisions outrank v1. New names in this document are PROPOSED contracts, not implemented or already approved mechanisms.

    ## Settled local lock and scope

    Reuse db/store_lock.rs::acquire via one narrow synchronous db closure API. Same canonical root/permanent inode, lexical same-thread reentrancy; no new lock/schema, child ownership, async guard migration or arbitrary code-repository locking. Acquire before relevant canonical/branch/index/preimage reads; check ensure_store_write_safe while held. Keep bytes/index/HEAD/rebase/admin mutations and invocation-owned rollback together. Do not abort an old rebase; keep original errors and unsafe-state diagnosis if cleanup fails. Store -> cache write is existing ordering; never enter from SQLite/cache-refresh guard or refresh a cache in this region. GitBackend canonical reads are used inside.

    Ordinary sync S below retains its commits on push rejection: capture exact branch/OID under lock, unlock, push that immutable source to the intended branch, then fresh locked reread/rebase/capture on rejection. No HEAD~1 reset, no stale whole-store save, no second-rejection success, no unconfirmed mirror. Fetch may stay inside combined pull/store guard, but no seat/cache/queue/drain-file critical lock may enclose that network interval. Writer acquisition timeout is not a Git network timeout. CAS C below is different: a rejected conditional claim must never become ordinary S history merely because a later sync pushes it.

    ## F1332-1 — concrete writer/effect matrix

    Legend: P already uses store lock at core mutation boundary; S new local finite window with ordinary retained-commit sync; C conditional push-wins intent requiring the rejected-publication algorithm below; L local-only finite mutation; I private-before-publication initialization only if actually exclusive; R read/remote-fetch-only, not permission for local mutation. Every new window is the SAME existing lock. Rows cover production CLI/core/server/MCP paths; generic Git helpers stay unlocked unless a store-specific wrapper owns the call. Lower-level bytes-only save functions are not independent transactions: every canonical caller must enlist an enclosing window.

    | Owning file / exact symbols or dispatch | Reachability / state actually touched | Current protection and required disposition / caller locks |
    |---|---|---|
    | core db/git_backend.rs::lock_store, save/save_reporting, update_spec_atomically_with_subject, update_atomically_tracked and queue writers through lock_queue_write; auto_commit/auto_commit_paths | Core, CLI, REST/server, MCP; object YAML, metadata/oplog, registry queues, index/commit | P: retain read-modify-write-through-commit region. The private commit helpers do not grant protection to other callers. CachedGitBackend::save/update_atomically/update_spec_atomically_with_subject nests same-thread store then cache. No outward callback into server or scheduler while held. |
    | cli git_backend_cmd.rs::handle_git_backend_command DbCommand::Sync | Dirty bytes incl dispenser/registry, shared index, commit, fetch refs, rebase/abort, collisions | S: protect full pending-commit/rebase window; post-window forge/auto-bump/network push. |
    | cli lib.rs::handle_pull_command, handle_push_command, maybe_sync_pull | Canonical mailbox, dirty staging/commit, structural rebase, merge_gate, retry/abort, HEAD/admin dirs | S + mailbox row: direct CLI and delegated callers. No caller drain/seat/cache guard may wrap network or callback. Deferred code reconcile outside; nested merge_gate L inside. |
    | cli lib.rs::pull_store_before_id_allocation, push_store_after_id_allocation | Precommit, branch/head/collision decision, pull retry, push | S for already-created spec commits; distinguish block-claim C below. Existing offline/no-origin behavior retained. Protect collision reread; no allocator return from a stale snapshot. |
    | cli lib.rs::auto_push_store_best_effort / maybe_auto_push_store; core git_ops.rs::sync_objects | Direct best-effort CLI lifecycle and core callers; pending bytes staged, objects/metadata commit, timed push/rebase retry | S; pin push OID, release guard before five-second run_git_with_timeout/pre-push. It cannot publish an unresolved C attempt. sync_objects must enlist bytes writers too, not only its stage. |
    | cli lib.rs::handle_dev_release store leg | Store object/registry/metadata rewrites, commit/pull/push retry | S/L from before store reads/writes, not just final commit; code release operations retain their own rules. No release/tag authority is changed. |
    | cli schedule_ledger.rs::{write_cas,write_cas_opts,write_batch_cas_opts,save}, maintenance_schedule::tick/tick_core | schedule/<job>.yaml single/batch delta, debounce, stage, commit, rebase, HEAD~1 rejection | C with observation/offline policy below; no pre-save window escape. tick owns try_tick_lock across work; retain one-way tick -> store, never store -> tick/job execution. Hook push=false is local L and stays network-free. Standalone schedule done does not borrow tick ownership. |
    | cli coordination.rs::{acquire_claim,acquire_lock_claim} | coordination/leases and coordination/locks TOML, liveness/TTL decision, rebase/commit/push, hard reset on rejection AND error | C: no speculative claim on canonical branch while unlocked. lib::session_start calls acquire_claim before lease creation (directory/existing-lease reads precede it). drain_lock/solo_lock acquire shared claim before creating local ownership marker. Existing unavailable/local-only distinction is retained; “Acquired” requires acknowledged winning evidence. |
