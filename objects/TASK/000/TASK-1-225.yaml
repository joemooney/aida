  content: |
    CHANGES REQUESTED — TASK-1332 store-writer sketch

    Independent reviewer: Codex store-reconcile-independent-advisor, 2026-10-08; neither sketch author nor coordinator. Reviewed exact sketch SHA256 f5a37695aa86a5cdb458a08403478cfee29b92b6dff44f16215367a7f6d6060c, canonical comment 01a11c6a-9e64-7b20-8553-eeb3d3862692, against main b46aec1e674baae5a329416d4119e67b59200a88. Full report: .aida/handoff/orchestrator/run-20261008/STORE_RECONCILE_SKETCHES_INDEPENDENT_REVIEW.md. Preserve original TASK-1604 observation and proxy/request comments; no live race was reproduced.

    Accepted engineering decisions: reuse db/store_lock.rs::acquire and its permanent canonical-root sidecar; expose a narrow synchronous closure, not a transferable guard. Its thread-local reentrancy is not cross-thread/process authority. Enforce lexical nested LIFO lifetime; no guard or lock FD inherited into a hook/child. Acquire before branch/dirty/index/canonical preimage reads, then ensure_store_write_safe. Hold through stage/commit/rebase/union/validation and invocation-owned cleanup. Do not abort a pre-existing rebase or another invocation's state. Read canonical data strictly, not a cache refresh under the guard. Preserve TASK-1604 private fetched ref and original Git errors. Fetch may remain within the current combined pull helper/store window for this bounded repair; acquisition timeout is not a network-duration bound. Push, mirror, forge, generic CLI refresh and backoff occur after unlocking. Push an explicit captured full SHA to the intended branch; a second rejection is failure. Mirror only origin-confirmed evidence under BUG-1803, not a mutable later local HEAD. These choices need no operator question.

    F1332-1 (blocking integrity): actual mutating writer coverage is materially incomplete. The sketch's named lib.rs/db-sync/remote-reconcile calls are necessary but insufficient. Source search and inspection find active store writers outside that inventory: aida-cli-lib/src/schedule_ledger.rs::write_cas_opts and batched ledger CAS (rebase at 372/499, stage/commit and rejected-push reset); coordination.rs::{acquire_claim,release_claim,release_stale_foreign_claim,acquire_lock_claim,heartbeat_lock_claim,release_lock_claim} (rebase at 705/858/907/1098/1281/1326, commits and resets); aida-core/src/team.rs::{set_allowed_seats_cas and the other roster CAS writers} (rebase at 243/319/393); alias.rs::link_cas (235, reset HEAD~1 at 265); git_ops.rs node registration/identity/hijack/unregister paths, merge_gate (3588), and sync_objects (3770); lib.rs::auto_push_store_best_effort (72443); direct DbCommand::MergeGate at git_backend_cmd.rs:7996; init_cmd.rs's existing-store retry at 5413. These are not generic code-repo pulls and cannot simply be excluded as network-only. The core roster/alias surfaces also have non-CLI consumers. Existing backend object/queue locks do not wrap these paths.

    Concrete rework: provide a callsite matrix covering canonical bytes, shared index/HEAD/admin state, and retry/abort/reset effects across CLI/core/server/MCP reachable store writers. Mark existing protected windows, new required windows, initialization that is genuinely private before publication, and read/fetch-only operations with source justification. Include the above omissions and search direct Git Command invocations, not only pull_rebase helpers. No lock on arbitrary code repos is requested; no new authority policy, schema or distributed lock is requested. Existing authority-sensitive caller semantics must remain with their owners. A locked db sync alone cannot satisfy the owning request to audit other network store writers while these paths can still mutate its worktree.

    F1332-2 (blocking integrity): the retry design does not resolve actual CAS writers that reset HEAD~1 after push failure. team.rs:270, alias.rs:265, schedule_ledger.rs:398 and coordination.rs:774/784/1172/1179 expose this pattern. Releasing the proposed writer lock for push permits a peer commit before recovery; reacquiring and resetting current HEAD~1 can remove that peer. Keeping push under the writer/seat region to avoid the problem conflicts with the proposed ordering and hooks.

    Concrete rework: name the rejected-publication strategy per existing CAS family. Bind each attempt's locked preimage, exact produced commit and canonical intent; reacquire and reread before any recovery. Never use relative HEAD~1 or restore a pre-push snapshot over intervening peer state. For ordinary sync preserve local commits and rebase/retry the fresh state. For distributed claim/roster/node/allocation semantics that formerly discarded a failed claim, explain how the operation re-evaluates its decision against remote/current canonical state without accidentally publishing the stale claim as accepted. A blocked recovery retaining explicit failure is safer than destructive reset, but refusal alone is not the required healthy CAS positive. Changes to authority policy require the common owner's existing review, not this task inventing a new transaction protocol. The revision must settle the actual algorithm, not defer it as an implementer choice.

    F1332-3 (blocking integrity): “publish mailbox outside the store guard through its normal writer discipline” assumes protection that is absent. lib.rs::maybe_publish_mailbox_for_sync at 72543 calls mailbox_store::digest_local_to_canonical; that function reads existing canonical messages then writes store/mailbox files with write_atomic, without the store lock. lib.rs::digest_mailbox_to_canonical at 72494 stages and commits without it. Atomic file replacement does not serialize the shared index/rebase or the canonical message-state comparison.

    Concrete disposition: local mailbox send/network/publication orchestration stays outside store/seat critical sections. Canonical digest read/merge/write plus its stage/commit must enlist this same store lock; either include the finite local digest in the sync window or give it a complete independent window before sync rereads. Never leave canonical writes running alongside rebase. Re-read canonical message state under lock. This is the existing writer discipline being completed, not a new mailbox feature.

    Hook/cache question resolved narrowly from actual source: the installed and template pre-commit have the store early-exit/sentinel path. Installed prepare-commit-msg reads store HEAD through Git; the template also computes/updates a message trailer, so they are not interchangeable fixtures. Installed post-rewrite exits for the linked store. Both post-commit bodies can invoke `aida internal record-no-verify-bypass` on sentinel mismatch. On b46, lib.rs:5123 dispatches ALL Internal commands before storage initialization; role-restore explicitly skips Internal (23263), stakeholder-role selection is environment-only (15419), and internal_cmd.rs:96 uses Git/local violation reporting. Therefore ordinary cache initialization is NOT established as a deadlock for this exact detector; do not add a blanket BUG-1808 dependency merely from that suspicion. This source conclusion is not a runtime pass or a claim about an older PATH binary. Installed commit-msg sources .aida/commit-config, so arbitrary configured executable hooks/config cannot be declared safe. Pre-push invokes ordinary AIDA mirror handling and must stay outside the guard. CacheReadScope's may_wait is thread-local; it cannot make a different hook process reentrant. CachedGitBackend holds store across cache writes; do not enter from a cache-refresh/SQLite writer and do not call cache-backed load in the new region.

    The revision must state the supported installed/template hook profiles, actual binary selection/startup path, and handling of required mutating/reentrant custom hooks. Preserve hook effects, sentinel mismatch detection and errors; no hook disablement, lock-bypass environment, child lock ownership, or unlock-around-commit gap. A genuinely required unsupported hook needs the already signed common Git adapter or separately reviewed bounded remedy. No unsupported mechanism is approved here.

    Ordering: common publication remains home -> canonical repo -> sorted seats -> store -> queues -> drain -> manifests -> verdict -> merge -> Git where applicable. Network/READY/callback/wait/reap/mail/forge stay outside seat. Do not obtain home from a store-held child or reverse any existing cache/seat/drain edge. Supply caller-held-lock rows for the additional claim/ledger/roster paths; never drop an authority holder's lock without its contract. Ordinary sync is not the future publisher. opportunistic_store_gc really configures gc.auto/gc.autoDetach and invokes auto/aggressive maintenance; a lexical guard does not prove a detached child is settled. Classify maintenance's actual effects/lifetime and keep unrelated optional maintenance out of the finite sync transaction; do not claim all Git subprocesses are covered by RAII after they outlive it.

    Required proposed evidence: retain all five original fixture groups, plus schedule/claim/roster/alias/node/direct-merge-gate/mailbox competitors against actual sync. Barrier between captured push and rejection, insert peer object/history/mailbox/registry commit, then prove recovery retains the peer and does not publish a rejected claim as won. Include uncontended positives and correct existing offline policies. Actual installed AND template hooks with missing/mismatched sentinel, stale cache and competing refresh must finish safely; no inherited lock FD. Verify current-preimage remote reconciliation, safe retained rebase state after cleanup failure, pinned pushes, repeated rejection, and origin-confirmed mirrors. Use isolated stores/fake HOME/local bare remotes, never the live project. Tests are PROPOSED, NONE RUN.

    Disposition: same-spec sketch rework for F1332-1/2/3; fresh different advisor review of revised exact bytes before implementation readiness. The lock and ordinary-sync design decisions above are grounded and settled; the omitted CAS composition is not signed. Preserve prior history and external TASK-1593/TASK-1591/BUG-1811/BUG-1812 reservations. No status/queue/grant/launch/merge action or source change is authorized by this comment.
