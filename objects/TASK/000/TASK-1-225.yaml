title: Store sync pre-commit and rebase need the existing writer lock
description: 'TASK-1604 isolates the fetched rebase target from shared FETCH_HEAD and corrects the error hint. Inspection found aida db sync staging/commit/rebase in git_backend_cmd.rs does not hold db::store_lock across that window, unlike backend spec mutations. The original report also saw cannot lock ref HEAD during chore: sync pending changes. Target isolation does not fix concurrent commits/rebases on the same store worktree; follow-up should reuse the existing re-entrant store writer lock around sync, audit other network store writers, and add concurrent-process regression coverage. No race was reproduced against the live shared store during this implementation.'
