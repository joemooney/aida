    Search evidence in store-reconcile-v2-evidence/git-writer-search.txt includes direct Command reset/stage/commit paths as well as helpers. Tests, generic PR/worktree code-repo merges, scaffolding code commits and read-only Git calls are explicitly outside this store-mutation inventory, not silently given a store lock. The search is an inventory aid, not proof that every indirect bytes writer is safe. Implementer must attach exact callsite coverage to each row and demonstrate the actual public routes; no omitted active canonical writer is waived by this sketch.

    ## F1332-2 — selected algorithms and exact missing composition

    Three families must not be conflated:

    S (ordinary retained history) uses the settled v1 algorithm. Rejection does not invalidate a spec edit or sync commit; reread/rebase current H under store guard, preserving peer objects/history/index, then push a new exact OID outside. Do not return “unchanged” after an already-successful local commit.

    L (true no-origin or documented push=false) executes the existing local intent within one guarded window, commits once, and returns its existing local result. Do not reinterpret a configured-but-unavailable remote as no-origin. Ledger offline retention remains allowed; cross-clone claim offline returns Unavailable, never distributed Acquired. Registration/roster network errors remain errors according to their current contracts. No general new offline authority policy.

    C (conditional remote push-wins) cannot safely leave a speculative commit C on the shared branch and unlock for push. Even “reset exactly C only if current HEAD == C” misses the case where a peer P or auto-push includes C while our push is unresolved; selective revert cannot undo remote ownership or dependent peer work. Therefore this revision explicitly REJECTS relative resets, whole-preimage restoration over H != C, ordinary automatic rebase of a rejected claim, and “keep local speculative claim then just report failure.”

    Selected C algorithm for common-owner disposition: prepare an invocation-private candidate that is NOT reachable from canonical local refs/index/worktree; network-publish that candidate by normal fast-forward Git push; only acknowledged accepted state is eligible for local installation. This is ordinary existing push-wins policy with private preparation, not a new distributed transaction or a promise that remote and local commit atomically. No force push, distributed lease, new authority database or schema. It is a PROPOSED integration contract, not supplied by current signed publisher or authorized for implementation by this sketch.

    1. Under the existing store lock read exact local HEAD L, tree/index and relevant canonical bytes/modes/absence, branch identity, dirty state and semantic intent I. Unknown existing rebase/dirty staged work is preserved/refused according to caller policy, never swept into C. Fetch remote R by the existing safe target mechanism (may stay within the store window); record it separately from L. Pin all required objects in independently owned candidate storage so shared GC cannot invalidate preparation. Release store and all seat/lower critical locks before candidate hook/network work.
    2. In private preparation, combine acknowledged R with the captured legitimate unpublished local history L using the existing supported merge/rebase rules, then recompute the family predicate below BEFORE applying I. No previously rejected speculative C is included in that history. Construct exact produced commit C with known parent/base and intent changes; retain L/R/preimage/C/I and preparation evidence. Private repo/index/worktree must not be the shared store, a ref underneath an ordinary wildcard push, or an object alternate whose lifetime depends on shared pruning. Do not hand-build commit-tree to omit required hooks/gates; common owner must supply a supported prepared-Git step preserving real store message/hooks/config effects.
    3. Immediately before publish, compare current local decision inputs with the captured preimage under the same store lock. Changed relevant local state invalidates preparation: discard private candidate and re-evaluate. Unrelated peer changes remain independent; they are not rolled back. This sample does NOT establish a new authority freeze across network. Existing operations needing fresh authority through remote acceptance must be handled by their already-owned authority protocol; see missing contract below.
    4. Drop the guard and normal-push exact C to the recorded branch. Rejection discards only private C; reacquire/re-read L/current canonical and freshly fetched R, then run the ORIGINAL family decision again. A foreign winner is refused/no-op, not merged away; a fresh nonconflicting intent gets a new candidate. Bound retries by the existing family limits. Peer canonical P is never on our rollback path, and an ordinary sync cannot publish C because C was never placed on its branch.
    5. Success is a remote publication observation, not local atomic installation. Reacquire store lock; reread current H/index and import acknowledged remote state via safe existing merge/rebase, preserving P. Do not reset H to L or C. Recheck applicable current family identity before returning usable ownership; if a newer successor already won, report that state rather than reclaiming it. Publish .aida/node.toml/dispenser identity only against the accepted matching registration/range. Installation failure reports “remote accepted, local install/reconciliation incomplete,” retains exact remote evidence and blocks that operation's claim of local success; it must not undo remote C or manufacture a second attempt.
    6. Transport error is ambiguous, not proof of rejection. Query exact remote identity/ancestry/content when available. If C was accepted, follow step 5; if authoritative rejection/nonacceptance is proved, retry per family; if unavailable, preserve exact uncertainty and the existing family error/Unavailable outcome, never local Acquired. No automatic inverse remote push. Private uncertain C cannot be silently resurrected by later ordinary sync. Recovery behavior beyond retained existing Git/evidence surfaces needs the owner contract below, not a new pending-claim schema here.

    Per-family intent/predicate and healthy outcome:

    | Family | Re-evaluation on fresh remote + current local state | Required positive / failure policy |
    |---|---|---|
    | Single ledger write | Rerun original mutate callback against fresh JobLedger, then should_write/debounce; no repeat of scheduler JOB itself. Bind observation payload/time outside retries when intended by caller. | Healthy changed observation commits once; no-change no-op. Network-offline existing policy may install the local observation under lock and say local-only (not a won remote CAS). |
    | Batched ledger | reapply_delta(base,next,fresh), preserving untouched peer fields, per-job should_write; never whole pre-tick snapshot. | Healthy disjoint peer-field update and batch survive; repeated failure reports accurately. Observation-local retention remains, no rejected remote ownership inferred. |
    | Lease/drain/solo acquire | decide_claim with current claimant identity, current time/TTL/PID-start/session liveness; preserve explicit force and unavailable policy exactly. | Free/stale eligible slot acquires after confirmed publication; live foreign winner refuses. A no-change local claim is not proof that remote accepted it. No rejected candidate reaches canonical ordinary sync. |
    | Release / stale-release / heartbeat | Compare current clone identity after refresh; stale release also exact expected heartbeat; heartbeat updates only still-owned record. | Healthy own release/refresh succeeds; successor and refreshed stale claimant survive. No delayed unconditional delete or old heartbeat replay. |
    | Roster set/allow/disallow/unset | Re-read roster and nodes; migrate current keys, then exact replacement/add/remove/delete intent. Existing authority caller revalidation remains owned separately. | No-origin local or acknowledged online update works; peer members/seats untouched by partial intent survive; absent remove no-op. No grant widening or new REST permission. |
    | Alias link | Load current alias registry; apply existing canonical link/union, recompute redundant link. | Nonconflicting links converge; redundant link no-op; rejected entire old file never overwrites peer aliases. |
    | Node register/backfill/identity/unregister | Re-read nodes AND block use; requested occupied ID refuses, automatic ID selects fresh free one; remote-only permits its existing block-only backfill but never writes local node identity; identity update requires current node; unregister reevaluates absence. | Two automatic concurrent registrations get distinct accepted IDs; local node config only after corresponding accepted identity. Network failure is not solo-mode success. |
    | Block claim/auto-allocation | Re-read blocks, agreed counter floor and OnAcquire active-block predicate; allocate a new nonoverlapping range on a rejection, retaining existing OnThresholdCross behavior. | Healthy peers get distinct ranges; caller receives no rejected range and dispenser never uses it. Local-only rule only where already supported. |
    | Hijack | Re-read targeted node and old clone identity/reachability; exact target before/after and marker ownership must compose with remote result. | This is the concrete cross-root gap below, not “delete marker on failure.” Healthy supported takeover plus peer-marker preservation remain required. |

    REAL MISSING COMMON CONTRACT, not a generic excuse: BUG-1808's signed common publisher defines finite LOCAL provisional Git effects before P4/C, exact local rollback and no network under seat. It does NOT currently specify this conditional remote C attempt's private visibility, successful-remote/failed-local-install recovery, ambiguous push evidence, or hijack's peer HIJACKED.toml ordering. In particular current hijack writes a remote clone marker BEFORE push and removes it by pathname on rejection; exact local writer locking cannot serialize that peer root, and moving it after push changes the authority/lifecycle ordering. Existing home-first publication could host such an adapter only after its owner independently defines these joins. No new standalone journal, schema, grant issuer or distributed two-phase commit is authorized here. Required technical owner deliverable: an accepted store-CAS prepared-Git/publication adapter specifying steps 1–6, family authority sample/remote-success semantics, exact owned peer-marker install/recovery and supported production hook profile. Until supplied, C and hijack integration are explicitly NOT implementation-ready. This revision settles the selected safe direction and per-family decisions while naming the unprovided contract; it does not claim F1332-2 is independently resolved. A fresh advisor can accept this dependency or request another bounded algorithm without asking Joe a product question.

    ## F1332-3 — mailbox canonical window

    Replace v1's “publish outside through normal discipline.” Local read/send/watermark activity and policy/network orchestration remain outside. Read a bounded local message snapshot before acquiring store. Under the same existing store lock, strictly reread canonical mailbox messages, compare by ID and message_state_rank, merge/write each eligible file atomically, stage canonical mailbox paths and commit (or include these finite operations inside sync's existing precommit window). No canonical digest write before lock, and no release between canonical comparison/write and stage/commit. digest_local_to_canonical should require/use the owning closure; direct callers cannot evade it. Atomic replacement is still useful for readers but is not writer serialization. Local messages arriving after snapshot wait for the next idempotent digest; never overwrite a newer canonical tombstone with stale local state. Failed digest/commit remains reported under existing best-effort caller policy but is not evidence of successful canonical publication. No store-lock-held send, external mailbox callback, remote network or scheduler execution.

    ## Hook, caller-lock and maintenance disposition

    Accept review correction: on b46 all Command::Internal dispatches at lib.rs:5123 BEFORE storage initialization; role restoration skips Internal and internal record-no-verify-bypass uses Git/local violation reporting. Thus installed/template post-commit's sentinel-mismatch detector is NOT a proved cache startup deadlock. No blanket BUG-1808 dependency follows from that suspicion. Test the actual selected PATH binary/version or pinned supported binary, not only same-named source; an older binary does not inherit b46's ordering by name.

    Supported evidence profiles must separately include installed hooks and shipped templates: store pre-commit early-exit/sentinel; installed prepare-commit-msg reads store HEAD whereas template aida-store-pair also transforms the message; post-rewrite linked-worktree early exit; post-commit matching AND missing/mismatched sentinel; literal supported commit-config behavior. Do not equate their bytes. Installed commit-msg sources executable .aida/commit-config: unknown/custom scripts are not proved safe. A required hook that writes the same store or enters tick/home/seat while parent holds store remains an actual cycle. Preserve hooks/effects or refuse that unsupported profile before mutation pending the signed prepared-Git adapter; never disable hooks, unlock around commit, forge guard env or transfer lock ownership. Pre-push/mirror always runs outside store/seat.

    Caller order is explicit: current scheduler tick flock -> store (no reverse edge permitted); backend -> store -> cache; server memory RwLock -> backend store (no callback to server); claim acquisition before local drain/solo marker creation; heartbeat while logical marker exists but on a distinct thread, with no inherited store ownership. Drain Drop joins heartbeat before store acquisition, never under store. No ordinary sync acquires a new home/seat/drain/queue/tick guard while store-held. Future common home -> repo -> seats -> store -> queues -> drain -> manifests -> verdict -> merge -> Git remains binding; its “drain” critical lock must not be confused with the entire lifetime of today's marker object. If actual future caller holds seat or lower-ranked critical locks, it must enlist the reviewed owner adapter; do not drop a holder's lock ad hoc. No actual current claimant liveness is inferred.

    opportunistic_store_gc configures gc.auto and gc.autoDetach=true, then gc --auto and possibly aggressive maintenance. Object packing/config/admin locks are real mutations; a detached child can outlive the Rust guard. Keep optional maintenance OUT of the finite sync transaction and claim only Git's existing object-maintenance coordination, not store-lock coverage. Its canonical-byte/index/HEAD-free supported profile must be checked; scripts or configured maintenance changing these are unsupported. If acceptance needs full store-serialized maintenance, use an explicitly foreground/owned/waited maintenance mode in a separately reviewed window, never call detached spawn then declare settlement. Store compaction's authorized ref/HEAD rewrite is L, not GC. Preserve configuration and existing optional policy; no global gc.disable/kill/reaper change here.

    ## Preserved and expanded acceptance (PROPOSED, NONE RUN)

    Retain v1 groups sync_vs_edit_serializes; sync_vs_sync_and_queue; rejection_retry_preserves_peer; pull_sync_allocation_remote_reconcile_share_guard; no_hook_cache_lock_cycle with the corrected Internal expectation. All use disposable stores/local bare remotes, fake HOME/AIDA_HOME, owned processes, deterministic barriers, exact objects/history/index/HEAD/ref/admin/config snapshots; no live project/user state.

    Add public-route competitors for single/batch ledger, all six coordination operations, core roster/alias/node/block families, direct merge_gate, canonical mailbox, auto-push/sync_objects and doctor/init-on-existing-store. Verify the same lock inode, no lost peer bytes and positive same-thread nesting; compare distinct store independence. Do not satisfy core coverage with CLI-only refusal.

    CAS peer barrier: pause network publish after candidate capture; peer commits object/history/mailbox/registry and independently pushes ordinary store. Rejected private C must be unreachable from every canonical ordinary push, peer P remains, remote fresh intent is recomputed, no stale claim/range/seat/node reported won. Pair uncontended true win, remote contention with unrelated changes, own successful claim/heartbeat/release, two unique registrations/ranges, no-origin/local policies, ledger offline retention and authoritative successor refusal. Test transport-error-after-remote-accept versus true rejection; failed local install says accepted/incomplete and never resets a peer. Hijack requires marker replacement/peer-write and accepted-marker positive under its eventual owner contract; a blanket “unsupported” is not completion.

    Mailbox barrier: two local snapshots, canonical tombstone/peer message wins before second lock, concurrent actual sync rebase. New IDs and higher-ranked state survive, stage/commit is inside window, repeated digest idempotent. Compare local-only send succeeds without store guard and no canonical write before lock.

    Hooks: run actual installed AND template profiles with matching/missing/stale sentinel, selected current binary, stale cache and competing refresh. Bound completion and prove no inherited lock FD or child store writer; malicious/required reentrant custom profile refuses before setup pending adapter. Test proper healthy trailer transformation and violation observation, not only refusal. Maintenance test distinguishes foreground completed child from intentionally detached maintenance; no false RAII settlement claim. Keep unsafe rebase/abort-failure and current-preimage remote-reconcile tests, plus nonvacuity in scratch only.

    ## Disposition and boundaries

    V2 authoring is complete for independent review; F1332-1/F1332-3 have concrete proposed remedies, F1332-2 has a selected safe algorithm plus an explicit UNSUPPLIED common-owner CAS/hijack composition prerequisite. This is not full readiness or self-clearance. No authority/distributed transaction policy is inferred, and no canonical spec/dependency edge is changed by this draft. Existing lock choice is settled; no parallel lock/schema or code-repo blanket locking. Preserve TASK-1593, TASK-1591, BUG-1811, BUG-1812 reservations. No operator question. New independent advisor judgment and any common-owner contract acceptance remain required before implementation.
