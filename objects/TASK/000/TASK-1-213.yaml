    # Batch D — single full local-CI validation: NON-PASS (Run tests failed; gates 6–37 unrun)

    **Outcome.** The one bounded run at **`65e19b9bd1f617567235c0bf42df70f9e3a89729` / tree `2ce32ba6fc46a7fa4893d329767ea9902cc8795b`** (base `bf65220959c7601427247286abc7eb16278af5a5`) is NON-PASS.

    - `Run tests` (`cargo test --workspace --no-fail-fast`) failed with **51 failures in 15 test binaries** (9881 passed, 12 ignored, 103 result lines).
    - **Two failures are batch-owned new tests**, one per member (§2).
    - The runner stops at the first failing gate, so **gates 6–37 never ran**.
    - Gates 1–4 passed. `check-templates` passed. **No external signal**: the run completed on its own.
    - No full pass is claimed. No approval transfers to this head.

    Written 2026-10-08T14:09:18-07:00 (America/Phoenix). Mechanical integrator seat (Claude Code, Opus 5.5), not an author or reviewer. No fix authored, no rerun, no baseline chasing, no push/PR/merge/record/status/hold/grant action. TASK-1612's operator-owned merge and the protected machine-record floors remain binding.

    ## 1. Run record

    | Step | Command | Start → end (-07:00) | Exit |
    |---|---|---|---|
    | driver | `run-validation.sh` → `setsid --wait strace -qq -tt -e trace=none -e 'signal=!SIGCHLD' -o driver-signals.strace timeout 14400 sandbox.sh bash inner.sh` | 12:36:38 → 14:07:20 | 0 (timeout not reached) |
    | a | rustc-wrapper probe (`cargo build -v` of a trivial private crate) | 12:36:38 | 0. `Running …/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc …`, **0 sccache mentions**: wrapper verified off |
