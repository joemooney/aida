    ## 4. Isolation (root option b) and CI differences

    - **Private clone** of the exact head: no hooks; origin URL points to a nonexistent path; `origin/main`/`origin/HEAD` pinned to `bf652209`; no `.aida-store`; clean before and after.
    - **Environment:** `env -i`, 25 variables (`sandbox-env.txt`). Private HOME/AIDA_HOME/XDG*/mode-0700 runtime/TMPDIR, empty global git config, `GIT_CONFIG_NOSYSTEM`, `GIT_ALLOW_PROTOCOL=file`, stdin `/dev/null`. No identity, grant, token, forge or display variables.
    - **Curated PATH = `tools/:guards/:sysbin/`**:
      - 2772 `/usr/bin` symlinks;
      - 17 vendor names genuinely absent, verified pre-run; 5 of them are installed on this host (`antigravity chatgpt claude-desktop code goose`) and are reachable only by absolute path, which no batch source names;
      - 32 loud guards.

      Hard-coded `/usr/bin/claude`, `/usr/local/bin/claude` and `/usr/bin/codex` in source are absent on this host. No installed tool was hidden or edited.
    - **Guard hits during tests:** `gh` ×216 (mostly `repo view --json defaultBranchRef`, `--version`, plus `run list --workflow cross-platform.yml`, `pr view 77`, `pr view 59`) and `crontab -l` ×1. All were refused with 97. CI has a real `gh`, so this is a **CI difference**; whether any failure above stems from a guarded `gh` is unverified.
    - **Cargo:** unmodified slot wrapper via the restore shim (machine-wide `/run/user/1000` slots; `check-templates` logged a normal queue wait), `CARGO_BUILD_JOBS=3`, offline, the clone's private `target/`. sccache verified off.
    - **Other CI differences:**
      - `CI`/`GITHUB_ACTIONS` unset;
      - unprivileged userns already enabled locally, whereas CI enables it after `Run tests`;
      - local git has no commit identity;
      - the gate list was read from the bf-based `ci.yml`, which lacks c677's `< /dev/null` edit. Our runner already used stdin `/dev/null`.

