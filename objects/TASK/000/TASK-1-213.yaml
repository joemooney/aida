    | post | `git status --porcelain --untracked-files=all`; `git rev-parse HEAD HEAD^{tree}` | 14:07:20 | clean; head/tree unchanged |

    `check-ci` gates:

    1. `Check aida-cli without default features`: **ok** (82.8 s).
    2. `Build all packages`: **ok** (167.7 s); one batch build through the normal slot wrapper.
    3. `TUI seam guard`: **ok** (66.4 s). This is the gate that Batch A lost to an outside SIGTERM; it passes here.
    4. `Generated protobuf mirror drift guard`: **ok** (169.7 s).
    5. `Run tests`: **FAIL** (4839.7 s).
    6–37. **NOT RUN**: GitLab live-smoke workflow guard; Weekly Windows workflow contract; External-prose classifier inventory; MCP stdio compatibility; history template CLI/config/MCP contract; single-spec show latency; MCP doc-consistency; merge-hold gate fixtures; advisor-code-guard hook; git-guardrails parse; shipped full-access launch refusal fixtures; no-origin pull warning; two-remote pull byte-identical; advisor-code-gate substrate; pre-commit provenance move-detection; agent-skill-hook installer fixtures; distributed/sibling-store integration; ~/.aida home-guard self-test; Minimal aida-cli build; CLI-manual drift-guard; Monitor contract drift guard; Performance profile guard; **Check formatting**; Removed mode-flag spelling guard; Rust test portability ratchet; Prose-classification fixtures; File-time handle portability fixtures; Executable fixture ratchet; **Run clippy**; Glyph-literal lint; Trace/doc-header stranding gate; Docs-drift scheduling guard.

    Signal observation: `driver-signals.strace` is **empty**, so no non-SIGCHLD signal was delivered to the top-level `timeout`. The limit: strace watched only that process (no `-f`, to avoid ptrace effects on TASK-1612's reaping fixtures), so a signal sent to a single deeper process would not appear. No test reported being killed by a signal.

    ## 2. Batch-owned failures (new tests; they do not exist on main, so they cannot be "pre-existing")

    **TASK-1321 — `aida-cli/tests/task_1321_rebase_linked_worktree.rs::task_1321_dry_run_json_reports_the_invoked_linked_worktree`** (0.48 s)

    ```text
    panicked at aida-cli/tests/task_1321_rebase_linked_worktree.rs:59:5:
    git ["commit", "-q", "-m", "init"] in …/tmp/.tmpWw7C9t/primary failed: Author identity unknown
    fatal: unable to auto-detect email address (got 'joe@imac.(none)')
    ```

    Fact: the fixture runs `git commit` without setting a commit identity. This sandbox supplies none (empty `GIT_CONFIG_GLOBAL`, no `GIT_AUTHOR_*`/`GIT_COMMITTER_*`), per root's "no fixture identity manufacture". Whether a CI runner passes depends on its own git identity and hostname auto-detection, which is unverified here. This is a test-portability defect for the author or reviewer to judge; the integrator authored no fix. The author's and reviewer's passing runs had a different identity environment. Unit tests `rebase_cmd::tests::{linked_worktree_cwd_resolves_to_the_linked_checkout, unrelated_or_missing_cwd_keeps_the_store_root}` **passed** in this run.

    **TASK-1612 — `aida-core` lib `launch_transport::linux::tests::image_seals_descriptor_policy_and_native_positive`** (aida-core lib result: 1332 passed, 1 failed, 7 ignored)

    ```text
    panicked at aida-core/src/launch_transport/tests.rs:385:5:
    assertion `left == right` failed: helper inherited lock
      left: -1
     right: 0
    ```

    Fact: after the test drops its deliberately non-CLOEXEC locked FD, a second `flock(LOCK_EX|LOCK_NB)` on `owned-lock` returned −1, so some process still held that lock.

    Unverified hypothesis, for the author and reviewer only: CI's `cargo test --workspace` runs lib tests on parallel threads. A fork in a concurrently running test could inherit the non-CLOEXEC FD while it is open. The author's and reviewer's passing transport runs used `--test-threads=1`. Not rerun or diagnosed here.

    The other 12 `launch_transport` tests passed (including `namespace_init_is_qualified_only_as_the_actual_adopter` and `opened_noexec_mount_and_runtime_search_path_are_rejected`; 5 subprocess-only workers are ignored, as designed). `waiting_child_bootstrap` passed 2/2.

