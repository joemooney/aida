  content: |-
    Implemented PR-N/MR-N pickup resolver in aida queue work.

    Resolver chain (in order):
    1. Head mode (no arg)
    2. Item mode (uuid / spec_id / agreed_id match)
    3. **NEW: PR-N / MR-N → search queue for "Review PR-N:" title prefix** (case-insensitive prefix, exact number — PR-14 never matches PR-140)
    4. Cluster mode (parent scope with queued children)

    Outcomes:
    - 1 match → item-mode pickup (reviewer skill auto-routed via existing derive_scope_from_entry)
    - 0 matches → error with pointer to `gh pr view N` + `aida pr auto-queue-review`
    - 2+ matches → disambiguation listing each candidate spec_id + title

    Helpers: `review_title_matches` (pure predicate), `format_review_label` (centralizes PR-N/MR-N labels for error consistency).

    7 new unit tests cover canonical happy path, case-insensitivity, leading whitespace, all rejection modes including the PR-14/PR-140 substring trap. All 251 aida-cli tests green; fmt clean.

    Smoke: PR-99 (no story) and PR-10 (Completed story, terminal-filtered) both produce the new error.

    Commit: 48344155
