title: Ratchet non_test_lines (aida-cli-lib/src/tests/story_1888_gate_paths_tests.rs) …
description: |-
  Ratchet non_test_lines (aida-cli-lib/src/tests/story_1888_gate_paths_tests.rs) can still swallow production code. A #[cfg(test)] on a struct field, field init or statement (e.g. "x: u8,") has no '{' and does not end in ';'. The skip therefore runs past the enclosing '}' and only stops when a later line opens and balances a brace, so that line is lost even when it is "pub(crate) fn ship_gate() -> bool {". I reproduced this with a line-for-line port. The shape is real: forge.rs:48 and :58 (MergeHoldRefusal) already use it, though no gate fn is hidden today. Related gaps: unbalanced braces inside multi-line string literals, and the raw contains('{') check for `opened`. Fix: end the item when its depth goes below 0, or on a trailing ',' before any brace opens. Add the struct-field shape to ratchet_skips_test_items.

  Raised in review of PR-2832: https://github.com/joemooney/aida/pull/2832
