title: 'minor (non-blocking): aida-cli-lib/src/timing_record.rs publish_to_store — if w…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2178, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): aida-cli-lib/src/timing_record.rs publish_to_store — if with_store_write_lock fails before the closure runs (lock timeout, or ensure_store_write_safe refusing a store that is mid-rebase or has a detached HEAD), write_record never runs, so the record is not written at all and publish returns None. Before this change it was always written. The stderr warning says 'not committed', which hides that the record was dropped. Since publish only runs at done/completed, the work machine's events for that spec never reach other clones. Suggested fix: on a lock error, fall back to the uncommitted write_record as before, and add a test that injects a lock or unsafe-state failure.
  Reviewed sha: 0d957f66dd92d6a16cd664aeaddac499b67a8ffe
