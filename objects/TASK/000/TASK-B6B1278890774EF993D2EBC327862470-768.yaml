  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2390, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): Codex take ignores an existing worktree that already has the PR branch checked out (run_take_verb's find_worktree_for_branch result is used only by the Claude path, dispatch.rs:2652-2683); session_start then does 'git worktree add <new> <branch>', which git refuses when the branch is checked out elsewhere with no live lease to re-enter, so the lane Fails where a Claude take would reuse the worktree.

