title: BUG-2706 reads 'lane-host state cannot be read' as a present claim whose heartbeat stopped
description: |
  BUG-2706 AC3 asks for a bounded deferral "when the lane-host state cannot be read". Main has no separate lane-host record (aida lane relay, TASK-3826, is unmerged), and the cause of the incident was that session claims never refreshed their heartbeat, so other hosts saw every lane expire after 30 minutes. The fix therefore (a) adds a launcher heartbeat on the existing shared claim and (b) treats a foreign implementer claim that is still present past its TTL as "state unknown": deferred for `[review] lane_unknown_defer_mins` (default 20) past expiry, then reviewed with a logged reason (aida-cli-lib/src/review_implementer_gate.rs remote_standing).

  Consequences to confirm: an abandoned foreign claim now holds review for TTL + 20 minutes rather than TTL; both the lane host and the watcher host need the new build; each running lane adds one store commit per 10 minutes. The setting is read directly and is not listed in `aida config show`.

  Raised by the implementer while working BUG-2706.
