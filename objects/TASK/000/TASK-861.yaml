title: aida help <topic> should show help for a topic group (it lists topics but cannot open one)
description: aida help (bare) lists topic groups but there is no way to drill into one. Support aida help <topic> (e.g. aida help queue) to show that group expanded - the commands in the group with descriptions. Today only aida help --all (everything) and aida <command> --help (one command) exist; the middle granularity is missing.
