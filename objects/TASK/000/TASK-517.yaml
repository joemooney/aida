title: 'aida ultraplan: include ''Reserved namespaces and conventions'' in assembled prompt so /ultraplan avoids namespace collisions up-front'
description: "## Why\n\naida ultraplan <SPEC> currently assembles a prompt with spec context (description, acceptance, parent/child, AIDA 11-section structure, reusable helpers from trace graph). It does NOT include the set of paths/namespaces already reserved by other AIDA commands and conventions.\n\nEmpirical 2026-05-23 evening: /ultraplan running on STORY-443 (docs namespace reshape) ran into 'aida docs build already projects requirement layers to docs/aida/ (with its own README.md). Where should the discipline pack actually land?' The /ultraplan discovered the collision DURING plan generation and had to pause and ask the operator. Master's answer (docs/aida/discipline/) would have been arrived at automatically if /ultraplan had started the work with the constraint 'docs/aida/ is reserved by aida docs build' in its prompt.\n\nThe cost is a paused /ultraplan run + operator round-trip + cognitive load. Cheap to prevent.\n\n## Proposed shape\n\naida ultraplan <SPEC> prompt-assembly adds a 'Reserved namespaces and conventions' section to the assembled prompt:\n\n  ## Reserved namespaces and conventions\n  \n  - docs/aida/         -- reserved by 'aida docs build' (requirement-layer projection: README.md + 00-*.md)\n  - docs/plans/        -- reserved by AIDA plan-archival convention (YYYY-MM-DD-<slug>.md)\n  - .aida/             -- reserved by AIDA system runtime (deny-by-default gitignore; only .aida/config.toml tracked)\n  - .aida-store/       -- reserved by AIDA orphan-store worktree\n  - .claude/           -- reserved by Claude Code (settings.json + skills/ + commands/ + hooks/)\n  - .codex/            -- reserved by Codex CLI\n  - .mcp.json          -- reserved by MCP server config\n  - CLAUDE.md, AGENTS.md -- reserved by Claude / Codex project-context conventions\n  - aida-cli/          -- workspace crate; this project's CLI\n  - aida-core/         -- workspace crate\n  - target/            -- cargo build output\n  \n  If your plan introduces new files or directories, verify they don't collide with the above.\n\n## Source of the reserved list\n\nTwo options:\nA. Hand-curated .aida/reserved-paths.toml — operator adds entries as new conventions emerge\nB. Derived: scan 'aida --help' output + scaffolding artifact paths + workspace Cargo.toml members + .gitignore patterns\n\nLean A for v1 (hand-curated, file-based, easy to read + edit), with B as a future enhancement that keeps it auto-fresh.\n\n## Acceptance\n\n- [ ] aida ultraplan <SPEC> includes 'Reserved namespaces and conventions' section in assembled prompt\n- [ ] Section sourced from .aida/reserved-paths.toml (created by aida init with the baseline reservations above)\n- [ ] aida ultraplan --json output includes the reservations array\n- [ ] Test: aida ultraplan on a spec that proposes docs/aida/<X>/ surfaces the docs/aida/ reservation in the prompt\n- [ ] Scaffolding-pack -- every project gets .aida/reserved-paths.toml with the AIDA baseline\n- [ ] Doc in docs/aida/discipline/reserved-paths.md (or wherever the discipline lands) explains how to add project-specific reservations\n\n## Companion: /aida-detect-collisions skill (optional follow-up)\n\nA skill that, given a proposed path, returns its reservation status + suggests alternatives. Could be invoked from /ultraplan as a sub-tool when collision suspected during planning. Defer until evidence accumulates that the prompt-level inclusion isn't enough.\n\n## Out of scope\n\n- Auto-deriving the reservation list from runtime scan (Option B above) -- defer; hand-curated is simpler\n- Cross-project reservation propagation -- per-project, like everything else\n- Reservation validation at file-write time -- pre-commit hook territory, separate spec\n\n## Composes with\n\n- TASK-113 (aida ultraplan prompt-assembly -- extends it)\n- STORY-443 (docs namespace reshape -- the empirical case that would have benefited)\n- STORY-444 (aida backlog groom conflict-detection -- same 'detect before colliding' family)\n- TASK-516 (aida import-plan --request-review -- master sees the assembled prompt during review; reservations visible)\n- feedback_substrate_learning_loop_calibration -- if collisions happen despite the reservation list, the absence pattern is a calibration signal: 'this convention wasn't documented but should have been'\n\n## Origin\n\n2026-05-23 user during credit-burn night: '/ultraplan asked me about discipline pack landing because aida docs build owns docs/aida/. Is there any way to autodetect? The orchestrator with skills can maybe do something.' This TASK takes the 'detect before /ultraplan starts' path; the orchestrator-with-skills variation is the deferred follow-up."
