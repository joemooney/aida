title: task_1222_ended_clone_requires_origin_coverage_and_closed_pr fails inside the lane job sandbox on unmodified main
description: |
  `aida lane job run -- cargo test --profile agent -p aida-cli-lib --lib -- task_1222_ended_clone_requires_origin_coverage` fails on main at d5f90aedd3 with no local changes (job j20261114T210749786-56-0), at the final `remove_with` of the seat clone: "mail retention refused ...: the fresh writer-admission scan could not verify every mail writer". The writer-admission scan cannot be trusted inside the lane sandbox, so a contained implementer cannot get a green run of aida-cli-lib/src/worktree_lifecycle_gc.rs tests. Either the test should inject the admission verdict or the lane sandbox should satisfy the scan.

  Raised by the implementer while working BUG-2587.
