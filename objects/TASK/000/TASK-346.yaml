title: 'Windows: production read paths need transient-open retry — read_atomic helper + concurrent-read-site audit'
description: |-
  Followup to BUG-246. That bug fixed the *test* (\`concurrent_writers_never_tear_the_file\`) by retrying transient Windows open errors. The underlying behaviour is real and affects **production** code, not just the test.

  ## The generalised problem

  On Windows, opening a file that another process is atomically replacing via \`write_atomic\` (temp-write + \`rename\`) can transiently fail with \`ERROR_ACCESS_DENIED\` (code 5) or \`ERROR_FILE_NOT_FOUND\` (code 2). POSIX \`rename(2)\` has no such window — a concurrent \`open\` always sees old-or-new. So any AIDA **read** path that reads a file a concurrent \`aida\` process may be writing is exposed on Windows, even though it is fine on Linux/macOS.

  The autonomous drain runs several \`aida\` processes at once (the reason \`write_atomic\` exists), so contended *reads* are routine: dispenser counters, session manifests, the node registry, object-store YAML, etc.

  ## Scope

  - Add a \`read_atomic\` (or \`read_to_string_retry\`) helper in \`aida-core/src/fs_atomic.rs\` — bounded retry on transient \`PermissionDenied\`/\`NotFound\`, mirroring the test fix.
  - Audit read sites that pair with \`write_atomic\`-written paths (the TASK-331 set: \`dispenser.rs\`, \`git_ops.rs\`, \`registry.rs\`, plus session-manifest and object-store reads) and route the contended ones through the helper.
  - Update the \`fs_atomic.rs\` module doc — it currently implies a concurrent reader is fully safe on Windows; add the transient-open caveat.

  ## Acceptance

  - [ ] \`read_atomic\`-style retry helper exists, with tests
  - [ ] Contended production read sites use it
  - [ ] Module doc notes the Windows transient-open window
  - [ ] A grep-guard test (like \`known_concurrent_paths_stay_atomic\`) keeps the converted read sites from regressing, if practical

  ## Origin

  2026-05-19, surfaced by BUG-246 at the v0.8.0 cross-platform CI gate. Not release-blocking — the test fix unblocks v0.8.0; this hardens production for real Windows users.
