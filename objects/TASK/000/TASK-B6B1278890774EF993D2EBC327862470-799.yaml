  author: joe
  content: 'Investigation 2026-11-05: installed agy --version is 1.5.1. Read-only agy --help, agy help acp, agy help remote-control, and remote-control start/status --help expose --conversation (resume), --input-format stream-json (stdin turns owned by that process), ACP stdio, and remote-control daemon start/status/stop. None of these help surfaces documents exact-existing-live-session injection, busy-session queue acceptance, or idempotent submission/recovery receipts. Existing AIDA mail_wake::WakeAdapter::for_vendor returns Unsupported for antigravity; launch_wake warns next-turn delivery; mailbox_wake_run::watch_row refuses non-Codex before opening a ledger or submitting. The existing Codex watcher audience, lifecycle, ledger and acknowledgement semantics should be reused once a supported AGY transport is identified. No live session was contacted, no daemon was started, and no resume was attempted. Implementation cannot safely claim exact-session delivery on this evidence. Needed to proceed: a documented supported AGY live transport with authenticated exact conversation targeting, busy/idle behavior, acceptance versus inbox ACK distinction, duplicate/uncertain-submission behavior, and a disposable-session conformance test. A launch-owned stdin/ACP broker or remote-control protocol would introduce a new lifecycle/contract and needs a sketch plus advisor sign-off under AGENTS.md. No source changes, commit, PR, or completion credit claimed.'
