title: 'PR-3058 follow-ups: judge pre-record era-marker drop asides; retriable/lock-naming refusal when the era drop cannot take the Lifecycle lock'
description: |
  Non-blocking findings from the APPROVED review of PR #3058 (TASK-b6b1278890774ef993d2ebc327862470-067) at a93c4aa63879. Fix both, with a test each.
  - [minor, non-blocking] leftovers.rs scan_era_markers: the non-JSON 'continue' runs before aside_marker(), so drop asides of pre-record markers (body = raw admin name) are never restored, reported or reaped. A lost fresh one stays lost (narrow fail-open from a PR-3056-build crash). Judge them with admin_dir(common, admin), or report them.
  - [minor, non-blocking] mod.rs source_nonce: when the drop can't take the Lifecycle lock (busy or Store lock held), a nonce-less mailbox gets the Unsafe refusal telling the operator to mv the mailbox aside, yet a retry succeeds once the lock frees. Make it retriable or name the lock contention.
