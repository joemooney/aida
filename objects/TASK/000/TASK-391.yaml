title: 'aida state-snapshot --spec <ID>: emit the finish-state State preamble deterministically'
description: |
  TASK-359's State preamble (Spec / Branch / PR / Drain / Tests / Fmt / Plan) is currently freeform prose — every skill author fills it by hand from `git status`, `gh pr view`, `aida show`, `aida session show`. That works, but it drifts:

  - Drift between what the skill prints and what is actually true (skill format vs current state).
  - Drift between skills (aida-pickup's preamble and aida-pr's preamble are written separately and can phrase the same row differently over time).
  - A headless implementer cannot reliably synthesize the rows without an unsupervised `gh pr view`, which is two seconds the rubric loses.

  Followup: `aida state-snapshot --spec <SPEC-ID>` would emit the preamble deterministically — one source of truth, callable from every finish-state skill. It already has all the inputs:

  - Spec + title + status from the spec store
  - Branch + commits-ahead + push-status from `git`
  - PR from `gh pr view` (the same call `aida pr` already makes)
  - Drain phase from `aida orchestrator status`
  - Tests / fmt — needs a lighter `aida verify last-run` or an env var the skill sets
  - Plan from the manifest

  Bonus: the headless implementer's findings (Step 5b) could carry the snapshot as machine-readable metadata, not just prose, since the same command would emit it.

  Raised by the implementer while working TASK-359.
