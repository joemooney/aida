description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-2351, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor, test-coverage): the git add -A -> git add -u switch at aida-cli-lib/src/pr_cmd.rs:1352 has no test; the new unit tests cover only the probes (tracked_changes_pending, untracked_regular_files, untracked_left_out_note). Reverting to -A would pass every test. A small end-to-end step-1 test (repo with a tracked edit plus an untracked stray file: after step 1, HEAD includes the edit and the stray stays untracked) would lock it in.
