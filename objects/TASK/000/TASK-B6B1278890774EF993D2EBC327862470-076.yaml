description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-B6B1278890774EF993D2EBC327862470-072, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [minor, non-blocking] leftovers.rs:155-160 scan_era_markers: any non-JSON UTF-8 aside body is taken as a bare admin name, so a torn (partial-JSON) record aside — write_source_id is create_new+write, not atomic — resolves to a bogus <common>/worktrees/<garbage> path, is judged stale, and is removed instead of kept. Not a regression (the marker was already absent), but inconsistent with era_marker_stale's fail-closed handling of a torn marker; consider treating a body that starts with '{' as an undecidable record and leaving it.

