title: 'Rework prompt: only a brief (not a ruling) supersedes a verdict; untimed verdicts stay authoritative'
description: |
  Design calls made in aida-cli-lib/src/rework_direction.rs (brief_supersedes_verdict, detect_main_conflict):

  1. Only an ADVISOR BRIEF / REWORK BRIEF newer than the last verdict demotes the verdict findings to SUPERSEDED CONTEXT. An "Advisor ruling" still leads the prompt (BUG-021 wording: binding over the description) but leaves the findings authoritative, because a ruling usually settles one finding rather than replacing the task.
  2. When no verdict time is known (no `Recorded:` line, no recorded findings comment), the findings stay authoritative and the brief just leads.
  3. The conflict check runs `git fetch origin <base> <head>` (best effort) during the rework pickup, then a `git merge-tree` forecast. An unknown forecast adds nothing.

  If rulings should also supersede, change brief_supersedes_verdict.

  Raised by the implementer while working BUG-B6B1278890774EF993D2EBC327862470-057.
