  content: |
    ## Summary
    Explain AIDA as a governed software factory with selectable autonomy in the existing Markdown overview and styled HTML companion. Map human-led, collaborative, supervised and autonomous delivery to `operator`, `guided`, `drive` and `drain`; describe `decide` as a separate execution block.

    The text distinguishes execution mode from authority and production deployment, and documents the explicit `--force` requirement for loosening a one-shot mode override. The HTML masthead and “In one sentence” paragraph now agree with the Markdown.

    ## Scope
    - `docs/what-is-aida.md`
    - `docs/what-is-aida.html`

    No runtime behavior or protected gate/ledger files changed. The later combined prototype's Metrics, searchable handbook, broad documentation audit and human-onboarding refactor are deferred to separately approved epic slices.

    ## Validation
    - `make check-ci-fast`: **35 fast-tier gates passed**. No separate cargo command or full build/test lane was run.
    - Added factual claims checked against `ExecutionMode` in `aida-core/src/models.rs`, `human_contract` and override classification in `aida-cli-lib/src/do_dispatch.rs`, and `aida do --help`.
    - Author self-check: two fresh-context read-only passes across the reuse/final diff. The first found an old HTML tagline; it was corrected. Final pass found no issues. This is an author self-check, not independent review or approval.

    ## Handoff
    TASK-B6B1278890774EF993D2EBC327862470-100. Operator requested independent advisor review and shipping. This PR is opened without merge or auto-merge; the Done checkpoint follows PR creation without a bypass flag.
