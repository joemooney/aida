title: 'Integration test: full --auto-complete --no-human cycle hitting stale-base block'
description: |-
  STORY-281 acceptance asked for a 'full --auto-complete --no-human cycle that hits a stale-base block and surfaces actionable next steps.' STORY-281 shipped pure classifier + message-formatter unit tests + the merge-tree integration tests in pr_rebase.rs, but skipped the full e2e because it requires a live GitHub remote with a controlled multi-PR scenario.

  ## Scope
  - Spin up a temp repo with a PR + concurrent overlapping merge on main.
  - Invoke 'aida queue work PR-N --for reviewer --no-human' (or the orchestrator path).
  - Assert: process exits non-zero, stderr contains the actionable 'aida pr rebase N' recovery hint, no reviewer session was spawned.
  - Mirror test for '--allow-stale-base' opt-out: warns, proceeds.

  ## Out of scope
  - Full orchestrator state-machine mock — already covered by orchestrate_* tests in auto_complete.rs.

  ## Origin
  STORY-281 ship, 2026-05-22.
