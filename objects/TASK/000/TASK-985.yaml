  content: 'Dogfood measurement caveat (2026-06-29): the dev environment sets CARGO_TARGET_DIR=/home/joe/ai/aida/target, so ALL worktrees (incl. pool trees) share ONE target/. The warm-pool’s per-worktree-cache benefit is therefore invisible / redundant in this setup, and the cold-vs-warm build delta CANNOT be measured here (first-ever compile 4687ms vs later 165ms reflects the shared target warming once, not the pool). To quantify the payoff before the flip: measure on a setup WITHOUT a shared CARGO_TARGET_DIR (the default for most users), or against the real aida workspace with per-worktree targets. The lifecycle itself (acquire->checkout->return->reuse-same-tree) was verified clean at the primitive level.'
