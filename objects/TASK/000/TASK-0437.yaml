title: Define cross-subsystem arbitration and master advisor authority
description: |-
  Define how AIDA handles decisions that span subsystem boundaries or exceed a subsystem advisor's authority.

  Acceptance:
  - Define when a subsystem advisor can decide locally versus when it must escalate.
  - Define cross-subsystem conflict handling and master advisor arbitration.
  - Define keystone/security/architecture/autonomy machinery defaults as master-advisor or human-gated unless explicitly delegated.
  - Clarify how advisor autopilot authority envelopes narrow under subsystem scope.
  - Include examples: MCP contract touching CLI output, TUI workflow changing queue semantics, security change affecting all agents.
