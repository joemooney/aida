title: 'Skill end-of-session menus: detect --auto-complete context, show orchestrator-aware path (not manual)'
description: "End-of-session next-steps menus in skills (\\`/aida-pickup\\`, \\`/aida-pr\\` postscript, etc.) currently render the same three Path/Action/Why rows regardless of whether the session was spawned by \\`--auto-complete\\`. Under \\`--auto-complete\\`, the menu's manual options (\\`/aida-pickup\\` to keep working, \\`Ctrl+D + aida session end\\` to stop) are **wrong** — the orchestrator owns phases 2-6 and manual intervention breaks the chain.\n\n## Observed (2026-05-16)\n\nAfter TASK-267 shipped via \\`--auto-complete\\`, the implementer's end-of-session menu offered:\n\n\\`\\`\\`\n1. ▶ Wrap up what's shipped as a PR    /aida-pr\n2. ⏵ Grab next item                    /aida-pickup\n3. 🚪 Stop here                        Ctrl+D + aida session end <id>\n\\`\\`\\`\n\nOption 3 (\\\"Stop here\\\") would HALT the orchestrator's chain — phases 2-6 won't fire if the user manually ends the session. Option 2 (\\\"Grab next item\\\") is also wrong: under \\`--auto-complete\\`, the orchestrator picks up the next item AFTER the current spec's full lifecycle completes, not in the middle.\n\nThe correct path under \\`--auto-complete\\` is **only option 1**: ship the PR, then exit Claude cleanly; the orchestrator drives the rest.\n\n## Detection mechanism\n\n\\`--auto-complete\\` sets an env var (e.g., \\`AIDA_AUTO_COMPLETE=1\\`) OR writes \\`auto_complete = true\\` into the session manifest at \\`.aida/sessions/<id>.toml\\`. Skill templates check for this and adjust the menu.\n\n## Acceptance\n\n- [ ] When orchestrator-mode is detected (env var or manifest), the end-of-session menu renders:\n  \\`\\`\\`\n  ⓘ Under --auto-complete: the orchestrator handles phases 2-6\n     (session end + wait CI + reviewer + merge + pull) automatically.\n  \n  ┌──────────────────┬────────────────────┬─────────────────────────────────────┐\n  │       Path       │   What happens     │              Why                    │\n  ├──────────────────┼────────────────────┼─────────────────────────────────────┤\n  │ 1 ⇒ pr           │ /aida-pr           │ Open the PR; orchestrator continues │\n  │   Submit PR      │                    │ from there automatically            │\n  ├──────────────────┼────────────────────┼─────────────────────────────────────┤\n  │ 2 ⏏ abort        │ Ctrl+C + aida      │ Stop the orchestrator chain; ends   │\n  │   Stop chain     │ session end --force│ the current spec and bails          │\n  └──────────────────┴────────────────────┴─────────────────────────────────────┘\n  \\`\\`\\`\n- [ ] Manual-mode menu (no \\`--auto-complete\\`) renders the existing three rows\n- [ ] Detection composes across skills: \\`/aida-pickup\\` end-of-session, \\`/aida-pr\\` post-action, \\`/aida-review\\` after verdict\n- [ ] Reviewer session under \\`--auto-complete\\` similarly: only \\\"render verdict and exit\\\" is correct; \\\"keep reviewing\\\" / \\\"stop here\\\" are wrong\n\n## Composes with\n\n- **STORY-246** (\\`--auto-complete\\` orchestrator) — this TASK is its UX-awareness layer in the spawned-session menus\n- **TASK-272** (cluster-mode batch awareness in \\`/aida-pickup\\`) — same family of \\\"skill detects its surrounding workflow context\\\"\n- **batch:workflow-hint-polish** — tagged accordingly\n- **TASK-266** (orchestrator failure telemetry) — manual abort under \\`--auto-complete\\` should log the abort as a failure mode so we know how often users bail\n\n## Why this matters for alpha\n\nFirst-users running \\`aida queue work X --auto-complete\\` expect the orchestrator to drive everything. Seeing a menu that offers \\\"Stop here → aida session end\\\" makes them think they SHOULD do that — and breaks the orchestrator chain at phase 1. Either:\n1. They follow the menu, halt the chain, get confused why nothing else happens\n2. They ignore the menu, exit Claude correctly, but mistrust AIDA's UX\n\nEither way, alpha is degraded. Context-aware menus are the fix.\n\n## Origin\n\nUser asked 2026-05-16 after TASK-267's implementer rendered the standard manual-mode menu while running under \\`--auto-complete\\`: *\\\"I am in --auto-complete, so this suggestion needs to be tweaked for that situation.\\\"*"
