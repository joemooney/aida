- id: 01a1b11f-94cd-76e2-a2f4-2fff037e06c1
  author: mcp
  content: |
    SKETCH v1 — TASK-3222 / STORY-2561 S1 — awaiting advisor signoff
    trace:TASK-3222 | ai:codex
    2026-11-06. Source inspected at 50ce509da3f7edbd12ff6636fe996c9c3a65c68f. This is the advisor-requested sketch-only deliverable: no production code, inventory file, Cargo invocation, vendor execution, PR or conformance claim.

    Authority and scope
    Read STORY-2561's operator rulings and BUG-2446 sketch v1 first, then BUG-2448 and STORY-2326. The newer operator ruling controls: cross-vendor synchronous typed host service in the shared AIDA bubblewrap boundary; own keystone, not a gate on STORY-2238/EPIC-612/STORY-2460. Native compatibility policy/labeling remains unchanged. S1 establishes transport/identity and inventories writers; S2 routes writes and cuts over permissions; S3 supplies real-vendor evidence. Current grants stay unchanged until S2. This sketch does not claim S1 by itself denies raw writes.

    1. Transport and the BUG-2448 boundary
    Propose new aida-cli-lib/src/store_mutation/{mod,protocol,service,identity,client}.rs, with host-owned StoreMutationSession and a bounded typed server, shared across vendors rather than a Codex proxy. No listening TCP port, global socket, shared mailbox/deputy spool, generic MCP forwarding, executable/argv service or shell.

    Use AF_UNIX SOCK_SEQPACKET channels created by the trusted host broker, one fresh socketpair per admitted client connection. The lane connects to an exact reserved synthetic pathname containing a fresh launch epoch, e.g. /run/aida-mutation/<epoch>/service. There is deliberately NO host filesystem listener at that address and no prefix-directory grant. Extend containment/contained_host.py::broker_connect_contained with an exact-address branch BEFORE the existing private-state pathname arm: verify the trapped task belongs to this launch, create a pair with the service end held by this launch's server, and inject only the client end using seccomp ADDFD. Read sockaddr once; never CONTINUE a caller-mutable pointer. Verify the trapped socket type matches SEQPACKET before replacement. Do not mount the service endpoint into vendor-writable state or extend the existing state_prefix allowlist.

    The capability is the broker-selected channel plus host-verified sender membership, not the spelling of the synthetic address. A sibling's broker has no mapping for this epoch; a guessed foreign epoch refuses. No abstract-name alternative, inherited service FD, arbitrary socket destination, path-prefix capability or FD-passing operation. The server refuses SCM_RIGHTS; its channels cannot convey further host capabilities. Close all server/private control descriptors across vendor exec; keep the trusted host helper non-dumpable and outside lane /proc access. Test that siblings cannot reach it via pathname, abstract socket, /proc/*/fd, inherited FD or transferred client FD. If these protections cannot be established, refuse service-enabled launch rather than fall back to a broadly reachable socket.

    This adds one explicitly typed capability to the shared connect broker, not permission to reach other host IPC. BUG-2448 remains separately owned and open until its same-profile host-IPC negatives/lifecycle evidence pass. The present contained_host.py arm accepts sockets beneath private state; this proposal must not enlarge that arm. Native compatibility launches receive no such service capability in S1.

    2. Launch-bound identity and proof
    Host fixes an immutable binding before tools execute: canonical authority/project root and store identity (opened/pinned roots and filesystem identity, not client cwd), owned canonical spec UUID(s), seat/role, validated grant and parent grant identity, lease/registry identity, permitted operation enum set, launch epoch, policy/build version, expiry, attested worker PID/start time and pinned namespace identities. Epoch is random and fresh per launch/resume, not an authority token. Never accept project/store paths, caller PID, role, user, grant selector or verb grants from JSON/env as authority.

    Receipt validation already checks worker start/namespace data in launch/contained.rs::ContainmentReceipt::validate; gate/seat_authority.rs::bind_contained_launch_worker binds the grant before ContainedChild::release. Reuse these facts, holding pidfd/namespace handles for the new session rather than relying on a stale PID string. A newly connected client is eligible only when the broker's kernel notification PID is in this pinned lane. On EVERY request, SO_PASSCRED/SCM_CREDENTIALS on the receiving seqpacket yields the actual host-visible sending task. Check sender uid mapping, process start/liveness and pinned PID/user/mount namespace membership; descendants are accepted only within that lane. Recheck immediately before dispatch. UID equality alone and SO_PEERCRED on the host-created socketpair are insufficient (the pair's creator is the host). A copied client FD used by a sibling must still fail per-message sender checks. Host authority helpers must take explicit binding data, never temporarily set the server's process-global AIDA_SESSION_* environment.

    gate/seat_authority.rs::grant_check_for(project_root, grant_id, caller) provides recorded-subject/parent/roster/lifetime checks, but is not alone a live sender check. Add an explicit service authorization adapter combining it with pinned worker/lease/process evidence and existing operation-specific gates. Revalidate inside the canonical writer-lock boundary for future mutations; a launch-time valid grant is not evergreen. Baseline/non-authoritative operations need an explicitly inventoried rule, not a new role grant. Missing, unknown, expired, revoked, foreign, sibling or uncorroborated evidence refuses.

    3. Closed protocol, bounds and retry semantics
    Proposed v1: one UTF-8 JSON object per SEQPACKET, with a fixed envelope {version:1, launch_epoch, request_id, op, data}. UUID request_id is chosen once per logical request. Tagged enums plus deny_unknown_fields at every object level, duplicate JSON keys rejected, no trailing data. Version and op are closed, not CLI strings.

    S1 production operation set is EXACTLY:
    - session_probe {challenge}: bounded echo/readiness plus the host binding's non-secret spec/role, epoch, permitted verbs and protocol version.
    - request_status {request_id}: only this launch's accepted-request state; unknown is explicitly unknown, not success or permission to resubmit a mutation.

    Neither operation mutates store/cache/queue/claims. All mutation names, including own_claim, comment_add, spec_edit and queue_done, return UnsupportedOperation in S1. S1 fixture tests may exercise a test-only atomic counter/comment handler behind cfg(test); there is no production test verb or generic mutation escape hatch. This deliberately leaves selection of S2's exact typed field schemas/gates to TASK-3223, following the writer inventory. No CLI/MCP routing or permission cutover in S1.

    Request datagram maximum 64 KiB, response maximum 64 KiB; reject MSG_TRUNC/MSG_CTRUNC, missing/multiple credential records, extraneous ancillary data, NUL/control misuse, nesting deeper than 16, more than 32 object keys, strings over 16 KiB; epoch/IDs have exact formats and challenge is at most 128 bytes. Future text fields get individual bounds under the envelope cap. Path-bearing fields (path/cwd/store/program/argv/git_config/replacement object) are invalid; text is inert data, never interpreted as a path or command. Fixed max 8 connections and 1 in-flight operation per lane, bounded 5-second I/O/lock admission, Busy refusal before acceptance and no unbounded thread-per-request. Session max 4096 accepted request IDs; refuse new IDs at capacity rather than evict accepted dedupe records. Validate sizes before allocating/parsing unbounded data.

    Response {version, launch_epoch, request_id, outcome, result OR error}; closed errors include InvalidRequest, UnsupportedVersion, UnsupportedOperation, Unauthorized, Expired, Revoked, Conflict, Busy, Unavailable, OutcomeUnknown. No raw host path/credential/child stderr leakage. A connection close/timeout is not success.

    Retry key is (host binding identity, launch_epoch, request_id), with a digest over canonical typed op/data including any expected revision. Same key + same payload returns the recorded result after current live authorization checks; same key + different payload is Conflict. Keys never cross epochs, projects, roles or lanes. Concurrent identical requests serialize. Client stores the ID before sending, retries only identical payload/epoch with bounded backoff (at most two retries), and never invents a new ID after uncertain delivery.

    S2 must persist the dedupe outcome and mutation in ONE recoverable canonical transaction under db/store_lock.rs::with_store_write_lock, not an independently written success sidecar. Host failure after persist-before-reply must replay the durable result without a second comment. The current backend does not by itself promise this multi-artifact transaction: require an independently reviewed transaction/receipt design before enabling S2 verbs. Recovery encountering prepared/ambiguous evidence returns OutcomeUnknown and never reruns blindly. No asynchronous spool ingestion. S1 probes can use bounded session memory because they are read-only; this is not claimed as crash-safe mutation idempotency. Ended epochs are not resumed; host recovery owns unresolved durable operations.

    4. Lifecycle and concrete launcher integration
    Source reality: launch/context.rs::LaunchContext::resolve currently pins argv/posture/cwd/host_main, but does NOT yet own all seat/grant/resource facts. launch/spawn.rs::spawn_agent returns a Command; it does not actually spawn. assign_seat and caller-specific identity assignments happen later. Do not start a service as an accidental side effect of constructing/cloning a context or a preview.

    Propose a private validated StoreMutationBinding within the resolved launch capability and a non-cloneable session owner created at FINALIZED launch time. Coordinate with STORY-2326's remaining consolidation: derive the binding from host facts after assign_seat, then reject any subsequent identity/posture divergence before launch. Add the lifecycle hook at launch/contained.rs::PreparedLaunch::prepare/spawn, after finalized seat/env assignments; retain ownership in ContainedChild. In session.rs::spawn_vendor_headless_forking and spawn_vendor_headless_resume_granted the current PreparedLaunch -> receipt -> bind_contained_launch_worker -> release sequence is the concrete integration seam.

    Start host server/broker mapping before child preflight/tools. Bind/attest worker while exec barrier is held, verify a session_probe through the actual lane channel, finish host registry/lease binding, then release. Receipt must attest the exact service epoch and readiness. Future mediated-profile admission also verifies S2 raw-store/cache protection before release. Any missing service/broker, unsupported platform/surface, stale binding, failed probe or absent receipt refuses launch and unwinds owned resources. S1 remains a non-cutover integration; existing launches/grants are not silently changed.

    Owner revocation first closes admission, drains or marks accepted operations uncertain as appropriate, closes channels, stops/reaps host worker, then releases lease/removes private state. Apply on normal child exit, spawn/receipt failure, lease release/reap, parent death and explicit revocation. Reuse supervised lifecycle/PDEATHSIG and bounded host event-loop checks rather than model polling/global watcher. Each request independently checks lease/grant so delayed cleanup does not grant authority. A mutation already linearized before revocation retains its durable result; later requests refuse. Resume gets a new epoch/channel after fresh checks; no inherited dead service. Background daemon, interactive/resume or vendor paths lacking the required shared-broker/receipt ownership refuse an explicitly service-required launch until integrated; no fallback to current raw grants. Ordinary compatibility behavior remains unchanged.

    5. Store-writer inventory method and proposed checked-in contract
    Use docs/plans/2026-10-19-store-writer-inventory.md as a starting index, NOT proof of completeness. At inspected HEAD, broad rg seeds found 107 Rust files with canonical-save/lock patterns and 409 with filesystem/SQLite/queue patterns (includes false positives/inline tests; these are search counts, not writer counts). The S1 implementation must classify every hit and reconcile both directions:
    A. Top-down: command_registry.rs::REGISTRY plus legacy cli.rs/run dispatch and aliases; all MCP tools and handler dispatch in mcp.rs; read-only commands that lazily create/migrate/cache; hooks, orchestrator phases, init/doctor/import/sync/background helpers and service/control descendants.
    B. Bottom-up rg over aida-cli-lib/src and aida-core/src (also aida-mcp, TUI and scripts where present): update_atomically, update_spec_atomically, add_requirement_atomic, save_reporting, write_object, with_store_write_lock, .save(, queue_add/remove/reorder, fs::write/rename/remove_file/create_dir_all, OpenOptions, File::create, SQLite execute/execute_batch/transactions and Git stage/commit/store sync. Follow wrappers/macros and callers; search YAML/metadata/cache/registry/claim/mailbox/deputy paths separately. Separate cfg(test)/fixtures, do not blanket-ignore source containing inline tests.
    C. Resolve every sink to a surface, artifact and lock/gate; resolve every mutating surface to sinks. Record unresolved/dynamic/extension cases as cutover blockers, never silently omit them.

    Concrete anchors: requirements_cli.rs::run_add/run_edit; comment_cmd.rs::add_comment_cli_relayed; edit_rebase.rs::write_edit_atomically; queue_cmd.rs::handle_queue_command (QueueCommand::Done arm); findings_gate.rs::handle_findings_add; mcp.rs::tool_add_requirement/tool_update_requirement/tool_add_comment/tool_claim_task/tool_file_finding/tool_queue_done/tool_send_message; mailbox_store.rs::write_message_with_deliveries/digest_snapshot_to_canonical; aida-core/src/storage.rs::Storage::update_atomically; db/git_backend.rs::GitBackend::update_atomically_tracked/save_reporting_with_origin; db/cached_git_backend.rs::update_atomically/rebuild_cache; db/cache.rs::rebuild_from_store. Include handoffs through their forge/orchestrator callers, not just a function named handoff.

    Propose scripts/store-writers.toml, version=1, source_revision=<audited SHA>, deterministic sorted [[writer]] records:
    id; surface (cli/mcp/hook/internal); entrypoint (path::symbol and command/tool selector); calls (path::symbol list); artifacts (canonical_objects/store_metadata/authority/cache/local_coordination/store_git); sink; lock; authorization; side_effects; disposition (s2_typed/host_only/lane_private/read_only/blocked); proposed_operation or explicit refusal; cutover_owner; evidence_tests.
    Use separate records when one handler writes multiple classes. List all existing raw/shared writable coordination channels, including local-to-canonical mailbox digestion, queue state, findings and handoff, so none becomes a generic bypass. Read-only disposition needs evidence, not a guess.

    Companion docs/internal/security/store-mutation-writers.md explains reproducible rg commands, exclusions, review method and unresolved rows, linking the old inventory rather than replacing its lock history. A later scripts/check-store-writers.py guard compares source sites/symbols against the inventory with mutation fixtures; unclassified new sinks/surfaces fail. It is a review ratchet, not a claim regex proves all writes. Do not generate either file in this sketch-only lane; those are implementation deliverables after signoff.

    6. Verification plan (not executed)
    New tests proposed: aida-cli-lib/src/tests/task_3222_store_mutation_tests.rs and containment/tests/store_mutation_tests.rs, registered alongside existing launch tests.
    - Parsing: malformed JSON, duplicate/unknown keys, unknown version/op, missing data, path/argv/whole-object fields, huge declared/actual packet, truncation, bad credentials/ancillary FD, deep nesting and bounded capacity. Assert no dispatcher call, writes or authority change.
    - Identity: wrong project/store/spec/role/epoch; same uid sibling; inherited/transferred FD; foreign namespaces; PID reuse; dead/unknown sender; expired/revoked child AND parent grant; roster removal; lease removal and authority changed after initial check. Barrier tests recheck at acceptance/write boundary.
    - Endpoint: guessed/replayed old epoch, synthetic endpoint replacement/symlink/abstract-name tricks, alternate private-state prefix and sibling launch. Inspect parent sentinels, no unexpected host connect/FD export. Generic BUG-2448 canary negative must remain denied while the exact typed probe succeeds.
    - Lifecycle: service absent/start failure, broker capability absent, probe failure, death before exec/release, service crash, parent death, lease release/reap, descendant survival, resume fresh epoch and unsupported launch surfaces. Assert refusal before tool marker; teardown invalidates already-open channels. Bound each child test with an independent watchdog.
    - Retry/concurrency: same key/same payload once, same key/different payload conflict, parallel duplicates, competing edits with stale expected revision, journal full, disconnect/timeouts. Test-only backend fault points before persist and after persist-before-reply demonstrate no duplicate fixture comment and explicit OutcomeUnknown where recovery cannot establish a result. Durable production transaction acceptance remains S2's gate.
    - Inventory: every CLI/MCP writer has a row/sink/lock/gate/disposition; mutant adds a raw fs writer, a wrapper caller and a cache-on-read writer and fails guard. Compare inventory with actual dispatch catalogs; handoff/mailbox/deputy routes cannot invoke arbitrary host code.
    - S1 regression checks after implementation: existing launch ratchet/receipt/grant tests and Claude launch goldens; native compatibility flags/label and current store grants byte-for-byte unchanged. Assert host uses fixed binary/config and verified store hooks, never lane-owned hooks/executables/config. No Cargo in this lane.
    - S2/S3 separately: fixture same-profile claim/comment/edit/queue-done positive controls read independently from host; raw terminal AND file-tool create/append/rename negatives with parent hashes/entries unchanged across ancestor/symlink/primary/resume layouts; real vendor C0 plus profile/version/grants and no conformance substitution with synthetic tests.

    Advisor signoff requested / design fork
    Choose or amend (A) exact broker-injected per-lane SEQPACKET capability with per-message kernel identity, versus (B) a different explicitly isolated shared-boundary transport with equally strong sibling/descriptor protections. Lean A; a generic host pathname listener is not an acceptable fallback. Confirm S1's production verbs are read-only probes/status while mutation schemas, crash-atomic dedupe and routing are S2 gates. The broad operator choices Q1/Q2/Q3 are already ruled and are NOT reopened. Remaining implementation selection and lifecycle/transaction details require independent advisor signoff. Per binding brief, punt TASK-3222 as design-fork now; do not implement, ship, PR, queue-done or claim S1 acceptance.
