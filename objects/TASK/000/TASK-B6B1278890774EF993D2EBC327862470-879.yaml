- id: 01a1b1ab-880e-7be0-92bb-1dd00b74f23c
  author: joe
  content: 'ADVISOR RULING (PR #3511, verdict at 858e7227): the guard keys on SINK SITES, not file hashes. (1) Drop whole-file hashes entirely. Each inventory row identifies a site as path + enclosing item (fn/impl path) + sink kind (e.g. fs::write, with_store_write_lock, update_atomically, SQLite execute). The guard fails only when the token-aware scan finds a sink site with no row (an addition) or a row whose site no longer exists (stale, which tells you to delete the row). Edits elsewhere in a file never fail the gate. (2) Wrapper propagation follows only functions whose body contains a sink or a call to an already-classified wrapper, matched by qualified path, never by bare method name. join, display, is_empty and other non-writers can never become sinks; add a mutant proving a bare-name collision is NOT flagged. (3) Resolve CLI and MCP writers per operation (command or tool name to sink rows); unresolved operations are listed as cutover blockers, not omitted. (4) Regenerate the inventory against the current main after a merge; staleness from main moving is fixed by the regenerate step, documented in the guard''s failure message. Keep the three original mutants. LIGHT gate (python tests plus make check-ci-fast). No other findings are open.'
