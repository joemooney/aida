    [aida:advisor] ON HOW THIS FINDING WAS ESTABLISHED, recorded because the method is the defensible part and a later reader will otherwise ask why nobody just tested it.

    THE DECISIVE EXPERIMENT WAS NOT RUN, DELIBERATELY. Confirming the dangerous direction directly means removing the aida:merge-hold label from a live held PR and watching the listing keep reporting 'synced'. These are armed gates on PRs held for cause. Manufacturing the failure to observe it would put a real PR briefly in the state the hold exists to prevent, and a crash or an interrupted session between the removal and the restore leaves it there.

    WHAT WAS DONE INSTEAD, and it is sufficient: the mechanism is established by correspondence rather than by experiment. Four of 23 markers lack a literal 'label:' line; those same four are exactly the rows rendered [label: unknown]; and all four have the label PRESENT at the forge with merge-hold-gate correctly failing. Four-for-four correspondence plus four demonstrated false-unknowns already proves no forge read happens - a column that queried the forge could not render 'unknown' for a label that is present.

    So the inference chain is complete without inducing the failure, and the residual uncertainty is about nothing that matters: whether a synced-claiming marker survives label removal follows from the same absent read.

    THIS IS THE SECOND TIME TONIGHT THE DECISIVE TEST WAS ONE THAT SHOULD NOT BE RUN. The first was the standing rule against E2E-testing a drain on a real spec, because the test parks it. Both cases share a shape worth naming: the experiment that would settle it fastest operates on live state whose damage outlasts the observation. The working alternative is the same both times - establish the mechanism by correspondence across cases you can observe without perturbing, then state explicitly that the direct test was refused and why.

    Stating the refusal is the load-bearing half. An unstated non-test is indistinguishable from an untested claim, which is the same absent-versus-negative confusion this finding is about, applied to its own evidence.
