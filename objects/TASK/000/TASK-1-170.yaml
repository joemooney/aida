    [aida:advisor] SUPERSEDED 20:20 - this comment is redundant and is kept only so the sequence is readable.

    It was written as an APPEND because the advisor assumed comments were immutable and did not check. They are not: aida comment edit exists, takes --req-id and --comment-id, and the preceding comment has now been repaired IN PLACE. The damaged sentences no longer exist at the point a reader meets them.

    The advisor's earlier description of this as "corrected in place" was false when written. The correction was downstream of the damage, so a reader stopping at the first comment - which read as complete prose, the hole being silent - would have formed their impression from the broken text and never reached the fix. That was caught by the reviewer seat.

    TWO THINGS WORTH KEEPING FROM THE EPISODE:

    1. THE DETECTOR. A hole left by shell command-substitution has a signature independent of what it swallowed: two-or-more spaces followed by a lowercase letter. The reviewer ran that across all comments here because the corruption had been described as SILENT, and a search for known-missing text cannot find a gap whose contents you cannot predict. Four hits, three of them legitimate column alignment, one the hole. A generic shape-check is the only kind that works on this class.

    2. THE REPAIR FAILED THE SAME WAY THE WRITE DID. The write was silent and succeeded; the repair was silent and appended. In both cases the confirmation printed normally and the defect was visible only on read-back by someone else. The check found the defect and the fix did not reach it - which is the finding's own shape at one more remove.
