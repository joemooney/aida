    MEASURED EVIDENCE, 2026-09-20 21:40 local, reviewer seat. Rediscovered this
    independently while checking whether any held PR had moved past its verdict, then
    found this spec already covered it. Recording the numbers rather than filing again.

    POPULATION: 24 open PRs, all 24 carrying a merge-hold marker.

        label: synced     20
        label: unknown     4    (PR-1989, PR-1998, PR-1999, PR-2006)

    All four "unknown" markers are single-line files with no state line at all. The
    render path treats a missing second line as Unknown (merge_hold.rs read_label_state),
    and the state line is only written by the sync path, so a marker written by hand or by
    a sweep that did not call sync_label is permanently Unknown.

    THE FOUR ARE ALL ADVISOR HAND-HOLDS. Every one begins "advisor hold:". The gap
    correlates exactly with the writer: markers placed through `aida merge-hold add` or the
    drain's supervised path carry the line; markers written by the advisor's per-tick sweep
    do not. So the blind spot is not random - it is concentrated in the holds a human
    reasoned about, which are the ones whose failure would matter most.

    NO LIVE EXPOSURE RIGHT NOW, and this is the part the surface could not tell me. I
    checked all four against the forge directly:

        PR-1989  labels: aida:merge-hold
        PR-1998  labels: aida:merge-hold
        PR-1999  labels: aida:merge-hold
        PR-2006  labels: aida:merge-hold

    All present, all BLOCKED. So every one of these holds was genuinely enforced. The
    defect is that `merge-hold list` could not distinguish that from the opposite case,
    and the opposite case is a marker with no label: `merge-hold list` shows the PR held,
    the required check passes green, and the PR is mergeable. A hold that exists only on
    paper renders identically to a hold whose bookkeeping was not recorded.

    WHY THE DIRECTION MATTERS: Unknown is a no-information state rendered as a status. A
    reader scanning the list sees three-quarters "synced" and a few "unknown" and reads the
    latter as a minor bookkeeping gap, because the common case IS a minor bookkeeping gap.
    The rare case is an unenforced hold, and it wears the same label. This is PRIN-5 on the
    merge gate specifically - the surface computes over what is present and errs toward
    reassurance.

    A REPAIR EXISTS AND I RAN IT, which I am recording because it was a write:
    `aida merge-hold list --fix` re-synced all four. It is idempotent on the forge - the
    labels were already there before and after, so nothing changed on GitHub - and it
    wrote the state line to the four local marker files. All 24 now read synced. I ran it
    as a flag probe rather than a deliberate repair; the effect was safe (it can only add
    a label, never clear a hold) but the intent was not, and it should be stated plainly
    rather than absorbed.

    WHAT THAT LEAVES FOR THIS SPEC: --fix repairing the state is not the same as `list`
    verifying it. After --fix every row claims "synced" on the marker's own authority,
    which is the exact claim this spec says cannot be trusted. A run of --fix therefore
    makes the list MORE uniformly confident without making it more verified. The fix is
    still what the title says: query the forge, or mark the column explicitly unverified.

    Siblings: BUG-1469 (marker-less holds invisible to list) and BUG-1499 (bare label with
    no marker) are the other two corners of the same 2x2 - marker without label, label
    without marker, and here, marker whose label state is unknown.
