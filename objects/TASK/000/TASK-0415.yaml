spec_id: TASK-0415
title: Add list status shortcuts and open/closed aliases
description: |-
  Improve the `aida list` CLI ergonomics for common lifecycle views.

  Acceptance criteria:
  - `aida list <status>` works as a shortcut for `aida list --status <status>` when the positional token is a recognized status.
  - `aida list draft,approved` and `aida list --status draft,approved` treat comma-separated statuses as logical OR within the status filter.
  - Status filters still compose with other list filters using AND, e.g. `aida list open --type bug`.
  - Add status aliases: `open` expands to Draft, Approved, Planned, InProgress, NeedsAttention; `closed` expands to Done, Completed, Rejected.
  - Support aliases in both positional and `--status` forms: `aida list open`, `aida list --status closed`.
  - Unknown positional shortcuts fail clearly and point users to `--status`, `--type`, `--tags`, or `aida search` rather than being silently ignored.
  - Update `aida list --help`/docs/tests to describe comma OR and alias expansions.
