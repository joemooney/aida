description: 'Operator (2026-06-13): ''aida questions sweep'' should be part of the periodic advisor cleanup/garden pass. Rationale: sweep detects vague needs-human/likely-decision specs and (with questions ask) pre-distills them into structured DecisionRequests, so the human drains them later with pure picks (questions answer, no agent) instead of firing a live clarify session per spec. Add ''aida questions sweep'' to: (1) the advisor-watch garden prompt (STORY-586 WATCH_PROMPT — between the doctor heal + reconcile steps and the mailbox step), and (2) the documented periodic garden-pass toolkit (alongside doctor heal / reconcile-status / ack OBE / read mail). Keep it sweep-only (detect + record-request); ACTUAL answering stays human (questions answer) or the /aida-decide skill (STORY-602). trace:STORY-586 trace:STORY-522'
