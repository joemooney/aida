title: 'After the BUG-046 store apply: drop dead digits (API + metadata), numeric sync-guard grouping'
description: |
  Follow-ups from the BUG-HOME-046 round-2 rework (PR-3161), bundled as ONE task per the advisor's 04:55 ruling. Do this AFTER PR-3161 merges and the advisor has run the store apply (`aida doctor --fix id-collisions --mapping docs/plans/2026-10-31-id-collision-renumber.tsv --yes`).
  1. The server REST/gRPC APIs still expose id_config.digits, which no longer has any effect. Remove it from both, and update the API docs and tests.
  2. Remove `digits: 4` from the store's metadata.yaml (a one-time store edit; single user, no shim).
  3. Switch the cache sync guard (spec_id_collisions) from text grouping to numeric id_key grouping.
  Acceptance: none of the three remains; doctor reports 0 id-collision groups; a sync-guard test covers padded twins.


  Bundled at 2026-10-31 08:40 (advisor; PR-3161 final-review findings, 2026-10-28 one-ruling rule). These absorb TASK-HOME-150/151/152:
  4. admit_numeric_identity (aida-core/src/db/git_backend.rs ~1700): build ONE agreed-id index per add/batch, not a scan of every object per row, and include IDs staged earlier in the same batch. Test with a 2-row batch whose second row collides with the first.
  5. Remove DEFAULT_PRESERVE (doctor_renumber.rs:59; it hard-codes this store's spec) and rename the test file bug_0445_init_side_channel_tests.rs to its renumbered ID.
  6. Anchor the BUG-046 tests to criterion IDs so `aida criteria BUG-HOME-046` reports none untraced; amend the AC5 criterion text to the shipped [ids] seq_width key.

  7. Native-vs-agreed collisions (found by the advisor after the 2026-10-31 store apply): `aida doctor` reports 8 groups where a legacy native spec_id equals another spec's agreed_id (BUG-34, STORY-41, STORY-42, TASK-31, TASK-32, ...), all closed specs, while `doctor --fix id-collisions --dry-run` says there are none. Make the fix tool see the same groups doctor reports (one grouping function for both), renumber the NATIVE side (the agreed ID is the shared identity), and leave doctor at 0 groups. Test: a native TASK-31 plus another spec with agreed TASK-31 is one group, and the fix renumbers the native.
