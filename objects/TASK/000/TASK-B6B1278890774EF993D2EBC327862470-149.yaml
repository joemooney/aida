  content: 'ADVISOR RULING 2026-10-31 11:11: PR-3171 round 1 is CHANGES REQUESTED; all 7 items are verified in the diff. CI (rest), read by the advisor (job 124612168488): aida-core allocation_authority::tests::bug_2017_batch_alias_conflicts_refuse_before_any_persistence fails with an unwrap on Err "spec ID BUG-7-009 is already used by requirement 01a19319... (IDs differing only by leading zeros are the same ID); nothing was written". Item 4''s new per-batch agreed-id index now refuses at a point where this BUG-2017 test expects to reach its OWN alias-conflict refusal. Most likely the fixture batch re-uses an ID that the new index sees as staged. Fix the ordering, or the fixture, so BUG-2017''s alias-conflict refusal still fires first and is asserted; do not weaken either check. This is a CI-only delta: change nothing else. Gate: cargo test -p aida-core --lib allocation_authority plus make check-ci-fast. No force push.'
