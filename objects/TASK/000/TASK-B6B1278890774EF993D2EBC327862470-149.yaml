  content: 'Round 2 (7fff083c7e0): item 1 fixed. The failing rest test was allocation_authority::tests::bug_2017_batch_alias_conflicts_refuse_before_any_persistence (bulk/cross_field arm): per-batch numeric admission refused the second add() with IdTakenError before BUG-2017''s alias-conflict check ran. BulkWriter::add now runs admit_allocations over the staged rows plus the new row, before numeric admission, so BUG-2017''s ''another UUID'' refusal fires first. Neither check is weakened. The test''s bulk arm accepts that refusal from add() or from finish(), and still asserts the message and that nothing persisted. Gates: cargo test -p aida-core --lib allocation_authority (34 ok), the db:: tests (370 ok), make check-ci-fast (36 gates ok). Item 2 is deferred: the advisor ruling says this is a CI-only delta and nothing else should change (a doc note on doctor_renumber::plan is a fine follow-up). Item 3 is still post-merge operator work: remove ''digits: 4'' from metadata.yaml, then run ''aida doctor --fix id-collisions''. Do not mark this task completed until both are done.'
