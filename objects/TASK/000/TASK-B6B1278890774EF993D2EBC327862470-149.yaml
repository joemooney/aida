    Two acceptance items need a store write that the implementer seat could not make (the store's git dir is read-only inside the contained sandbox; an attempted commit failed with "Read-only file system" and the edit was reverted):

    1. Item 2: remove the line `  digits: 4` under `id_config:` in .aida-store/metadata.yaml and commit it. Once the PR is merged, the binary ignores the key, but it stays on disk until a metadata write changes another field.
    2. Acceptance "doctor reports 0 id-collision groups": after the PR merges and the binary is promoted, run
       aida doctor --fix id-collisions --dry-run --mapping docs/plans/<date>-native-agreed-renumber.tsv
       then the same command with --yes instead of --dry-run. It renumbers the NATIVE side of the 8 native-vs-agreed groups (BUG-34, STORY-41, STORY-42, TASK-31, TASK-32, ...). Mentions of the old IDs are not rewritten because they now name the agreed holder. aida doctor should then report 0 id-collision groups.

    Item 6's AC5 amendment went through aida edit (queued for host commit).

