description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-2606, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  COSMETIC (non-blocking): run-upstream.py starts each step with start_new_session=True but installs no SIGTERM handler, so a GitLab cancel on a shell executor (interruptible: true) signals the adapter but not the detached step process group; docker executors tear down the container so this is moot for the documented image deployment. Consider forwarding SIGTERM to os.killpg of the active step.

