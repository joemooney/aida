title: 'BUG-2585: doctor shows the relay parent grant only inside 2h; ahead-of-expiry mail is sent by the relay''s turn monitor'
description: |
  The spec asks for the parent grant expiry in aida doctor beside the mandate expiry. aida doctor prints findings only, so the relay parent grant appears there (category seat-grant) only inside 2h of expiry or after it; the always-on line is in the SessionStart banner (aida role expiry). The ahead-of-expiry mail to advisor and product is sent from the relay's turn monitor (aida-cli-lib/src/agent_rotation.rs), checked once a minute while a generation runs, and only for launches with --role. The PARENT GRANT banner line needs the SessionStart hook to call aida role expiry, which it does only when AIDA_SESSION_GRANT is set (aida-core/templates/hooks/aida-session-context.sh:249); its comment there still says the call is silent above 2h.

  Raised by the implementer while working BUG-2585.
