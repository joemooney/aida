title: windows_path_key uses to_ascii_lowercase(), so a recorded lease path containing…
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-1794, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  windows_path_key uses to_ascii_lowercase(), so a recorded lease path containing a Unicode component such as Åsa does not match a canonical cwd spelling using åsa. Windows path matching is case-insensitive for such names; add a Windows-gated Unicode case-variant regression test and use a normalization that handles Unicode casing before approving this path.
