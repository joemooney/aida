    Rejected as already-addressed, not as wrong: this carried-forward finding is the BUG-1794 request-changes finding itself, fixed by the rework the approval covered — windows_path_key now folds Unicode casing (str::to_lowercase) with Windows-gated Åsa/åsa case-variant and sibling-prefix regression tests (commit 77afe9c7, content present at approved head 37af379b on PR #2410).

    Why the phantom existed: `aida review record --verdict approved` preserves the previous round's findings[] when --finding is omitted, so the carry-forward sweep read the APPROVED record as an approval WITH outstanding findings. Filed BUG follow-up to make resolved findings not carry forward (or require explicit disposition per finding at approval time).
