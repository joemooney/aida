title: 'aida config show: surface the [contained] posture block (enable + allowed_hosts)'
description: 'render_effective_policy (aida config show) renders [agents] posture, mailbox, advisor, archive, telemetry, intake, presence — but NOT the [contained] block. After TASK-798 unified the contained posture under [contained] (enable alias + allowed_hosts), config show still shows nothing for it. Add a [contained] section: ''enable'' (resolved bool + source: [contained] enable / legacy [agents] contained / default false) and ''allowed_hosts'' (the egress allowlist, empty = no egress restriction). Mirrors the BUG-533 per-section row pattern. trace:relates:TASK-798'
