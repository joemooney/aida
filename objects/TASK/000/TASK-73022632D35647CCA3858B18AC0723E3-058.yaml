    ## Implementer self-review
    Reviewed HEAD: 1112f734e4 (diff origin/main...HEAD: lane_admission.rs, lane_job.rs).

    Acceptance evidence (the spec has no formal AC list; reviewed against the description): [evidence: behavioral-test] lane_admission::tests::task_3537_non_compiling_job_skips_full_compile_slots holds every compile slot and shows (a) a non-compiling job is admitted at once without a slot, (b) it still waits on the job memory floor, (c) a compiling job still queues ('all 1 host compile slots'). lane_job.rs passes compiles = !fast_gate_job(&job) into admit_lane_job. Targeted run: cargo test --profile agent -p aida-cli-lib --lib -- lane_admission, 10 passed, 0 failed (lane job j20261128T014937348-5-0).

    Probes: (1) the call site uses the same fast_gate_job predicate as timeout_for/job_env, so they agree. (3) Slot reservation is skipped whatever N is. CARGO_BUILD_JOBS and the memory floor are unchanged. (5) Authority: seats can only submit the exact argv make check-ci-fast with empty env (validate). /bin/sh -c is host_gate only. Residual risk: a seat could edit its own Makefile so check-ci-fast compiles, skipping the lane compile cap. That only bypasses a host-health throttle, not an authority check: the job still runs in bubblewrap, offline, under the memory floor, and any cargo it runs still sees the host cargo-slot wrapper paths.

    Fixes during self-review: the first fast-gate run failed only on Check formatting (one assert line); fixed in 1112f734e4.
