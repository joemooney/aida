title: Lane job runner queues make check-ci-fast behind a host compile slot although the gate no longer compiles
description: |
  After BUG-2782, `make check-ci-fast` builds nothing (check-ci-gates.py --tier fast --no-build). The lane job runner still queues it behind lanes.max_compile_concurrency. On dell1 on 2026-11-27, job j20261127T033727851-70-0 logged "queued: all 4 host compile slots (lanes.max_compile_concurrency) are in use". The first run of the same gate waited ~7 min in the queue before its 187s run, so most of a lane's pre-push wall time is still slot wait.

  Suggestion: for `fast_gate_job` (aida-cli-lib/src/lane_job.rs:2270), skip the compile-slot admission or give it a separate pool, so the gate stays near its source-gate runtime on a busy host.

  Raised by the implementer while working BUG-2782.
  Branch: bug-2782-ccf-no-build  ·  Commit: 71f95102f1  (PR link added on merge)
