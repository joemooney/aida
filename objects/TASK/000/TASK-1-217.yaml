  content: 'Root cause: support::ensure_seat resolves AIDA_USER/USER/USERNAME, but the PTY command overwrote USER with joe when USER was absent. Windows runners commonly supply USERNAME only, so the child requested a seat for an unrostered principal. Fix pins AIDA_USER and fixture roster to one explicit test identity, clears inherited session/managed-agent flags, uses CR for Enter, and includes child diagnostics. No production authority bypass or platform skip.'
