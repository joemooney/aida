title: Surface message intent in mailbox notice + read-mail skill (fold into STORY-585 surface)
description: 'TASK-782 added the mailbox intent marker (fyi|request|handoff) and surfaced it where surfaces already exist (aida mailbox inbox, read_inbox MCP). The unread *notice* surface and the read-mail skill are owned by STORY-585''s notice/read half, which is in-flight in a sibling worktree and not yet on main. When STORY-585 lands: (1) the mailbox notice should show a message''s intent so an agent can tell an FYI from an actionable request/handoff; (2) the read-mail skill''s interpret step should call aida_core::mailbox::mail_disposition(intent, policy) and codify the notice->read->interpret->(bounded-safe? act) OR (surface+recommend) pipeline. Core API already shipped in TASK-782: Intent, ActOnMail, mail_disposition. Docs in docs/mailbox.md.'
