title: 'aida statusline + queue list: surface ''base behind by N'' for active leases on stale branches'
description: |-
  Passive-awareness surface for Pattern B (stale base — distinct from Pattern A divergence). Counterpart to the active checks in the queue-work-start TASK and queue-done-end TASK. The active checks fire at lifecycle boundaries; this one keeps the staleness visible *during* the session without nagging.

  Where it shows up:

  1. **aida statusline** (single-line, wired into Claude Code status bar): when the active lease's branch is behind origin/<default> by N >= some threshold (default 5? configurable), append a 'base:-N' or '⇩N' indicator.
  2. **aida queue list**: for each row with an active session lease, append behind-count if non-zero. Could be hidden behind --verbose or shown by default with subtle styling.
  3. **aida role show** (when a lease is active): include the behind-count line.

  Implementation pieces:

  - Compute behind-count needs git fetch first. Statusline runs frequently — don't fetch on every render. Cache in .aida/cache.db with a short TTL (~5 min). Background refresh via the existing cache pipeline.
  - Render style: subtle by default (dim color, small glyph). Loud only when behind crosses a higher threshold (e.g. red at N>20).
  - Configurable: aida.toml [statusline] base_freshness_check = true|false, threshold_warn = 5, threshold_critical = 20.

  Triggered by 2026-05-13 incident — Pattern B awareness should be ambient, not just at lifecycle boundaries. The active checks (queue work / queue done) close the gates; this keeps the user aware during work.

  ## Acceptance

  - [ ] Statusline shows behind-count indicator for active leases on stale branches (threshold-gated)
  - [ ] aida queue list rows with active leases include behind-count (subtle by default)
  - [ ] aida role show includes behind-count when lease is active
  - [ ] Cache-backed: no git fetch on every render; refresh on ~5 min TTL or cache invalidation
  - [ ] Configurable thresholds + on/off via aida.toml [statusline] section
  - [ ] No new fetch on first run if offline (gracefully shows 'base:?' or hides)
