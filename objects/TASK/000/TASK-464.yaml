title: 'Document: MCP-level worker directives vs global orchestrator queue directives — scope distinction'
description: 'Per Antigravity Phase 3 observation 2026-05-22: `post_directive` (MCP coordination tool) writes to `.aida/worker.cmd` for local worker session thread flow (pauses, shutdowns). `aida worker directives` (CLI) shows the same file. But a separate global orchestrator-queue directive concept exists (`drain TASK-N` shown in some CLI views) that''s distinct. The two are NOT the same channel; documentation should clearly distinguish them. Acceptance: docs/architecture/mcp-coordination-surface.md gains a ''Directive channels: local worker vs global orchestrator'' section explaining the scope, the underlying files, which tools/commands touch which, and when to use each. Compose with docs/agents/cross-agent-onboarding.md if the distinction affects how sibling agents should use post_directive.'
