  content: |-
    Addressed review findings F1-F6. Matching ci-status digest markers suppress false exact-read alarms after cold validator passes. process retains skipped rows in human output and a single JSON object on publication errors. Added a real on-disk awaiting_skipped regression with 83 cache parts; removed the arbitrary 82-part reader and cleanup ceiling, so larger legitimate histories remain fully visible without truncation. Added nextest and test-time budgets for the history wrapper and restored trace attribution around review-watch blocks. Python regressions cover publication refusal output and already-published old attempts after validator invalidation; unverified results still publish no statuses.

    Changed files: aida-cli-lib/src/ci_relay.rs; aida-cli-lib/src/awaiting_you.rs; tests/test_work_ci_relay.py; scripts/test-time-budget.toml; .config/nextest.toml.

    Validation: lane cargo build --profile agent -p aida-cli passed. Final ci_relay::tests run passed 4 executed Rust tests (history wrapper runs the 33-attempt and cold/warm Python scenarios), 86.74s. Awaiting render regression passed 1 executed test. rustfmt, git diff --check, Python AST and TOML parsing passed. Initial run needed the CLI binary; a later test fixture fetch-log isolation failure was corrected before the passing rerun.

    Native handoff: source edits remain uncommitted; host launcher owns commit/publication and queue completion. No implementation blockers. codegraph unavailable, confirmed by doctor; navigation used rg. untested=false.
