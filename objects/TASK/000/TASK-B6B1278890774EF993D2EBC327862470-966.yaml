title: 'Work CI relay: report (don''t silently skip) a latest attempt that is outside the 32-attempt revalidation window, naming the exact ''aida intent ci read'' command'
description: |
  Non-blocking note from the approved PR-3504 review (STORY-2480): process() (aida-cli-lib/src/ci_relay.rs:1019) skips an unverified latest-attempt result without saying so. A SHA whose result falls outside the newest-32 revalidation window keeps a pending native status until someone runs `aida intent ci read --attempt N --sha S` by hand.

  Acceptance: process() reports each skipped unverified latest attempt (SHA, attempt, reason "outside the 32-attempt revalidation window") in its human and JSON output and in `aida awaiting`, with the exact `aida intent ci read` command; a test with 33 attempts proves the report; no status is published for an unverified result (unchanged).
