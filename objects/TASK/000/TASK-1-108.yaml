    The verification concern is **resolved with no fix-forward needed** — `actions/download-artifact@v5` preserves the v4 multi-artifact subdirectory layout (`path/<artifact-name>/`) that `release.yml:93-96` rely on.

    - **Authoritative:** v5's only breaking change is single-artifact-**by-ID** downloads; multi-artifact mode (no `name:`) is unchanged.
    - **Empirical:** v0.9.1 and v0.11.0 (both released *after* the v5 upgrade merged) ran green and uploaded all four tarballs — `softprops/action-gh-release@v2` resolved every `artifacts/<name>/<name>.tar.gz` path.

    Shipped as a durable explanatory comment + `trace:TASK-425` at the download step, so this isn't re-litigated next time. → **PR #437**

