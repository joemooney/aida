  content: 'Verify-before-building (2026-05-31): the proposed fix — reorder phase-1 startup to acquire lease BEFORE bumping status — ALREADY EXISTS. session_start (aida-cli/src/main.rs ~24700) writes the lease file first, runs session_start_status_bump_preconditions_met, THEN bumps Approved→InProgress (24718), with the comment crediting BUG-379. BUG-379 landed 2026-05-24 (PR-312) — FOUR DAYS BEFORE this finding''s 2026-05-28 strand. So the strand was NOT the lease-after-status ordering bug (already fixed). Most likely it''s the BY-DESIGN failed-phase-1 outcome — a headless phase-1 that fails/punts parks the spec NeedsAttention and releases its lease, leaving ''InProgress→NeedsAttention, no lease'' — which the finding mis-diagnosed as an ordering bug. (Or the operator''s dev binary predated the BUG-379 build at that moment.) DO NOT re-implement the reorder. Recommended: re-diagnose on the current binary — repro a phase-1 failure and confirm whether the NeedsAttention+no-lease state is the intended cleanup vs a real defect; if intended, this finding is resolved-by-BUG-379 + the only real gap is the error-message wording (''spec is already In Progress'' → name the actual cause). Reclassifying away from ''reorder'' work. — master/advisor'
