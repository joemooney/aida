    Advisor publication-scope question: should the library expand beyond the six product guides (getting started, configuration, workflow, autonomy, trust and metrics) to selected CLI chapters or historical evidence? Please confirm or revise the allowlist during PR review.

    The latest human instruction explicitly says to put this question on the spec and not block, overriding the description's pre-implementation HITL pause. Conservative implementation choice: publish only these six already tracked product guides through an explicit manifest; distinguish human and operator audiences, and label historical material as excluded. Existing technical references remain source links, not silently republished handbook content. No archive/plans/spikes/internal agent/security documents, untracked/runtime data or credentials enter the search index. Future expansion requires deliberate manifest curation.

    The build stays static and source-derived. No hosted publication or access change is part of this PR; the existing owner-private hosted preview remains unchanged. This is a provisional curation choice for advisor review, not a claim that the advisor separately approved every document in an expanded handbook.
