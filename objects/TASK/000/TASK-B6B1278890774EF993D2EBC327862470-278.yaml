  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Fixture/unit (script):** new `docs/showcase/publish.py` builds the publishable tree (static pages/assets, `docs/what-is-aida.html` as `overview.html`, `.nojekyll`; links leaving the showcase rewritten to the public repo) from a git revision. A small Python unittest proves file-set selection, link rewriting, and determinism (same rev -> byte-identical tree).
    - **Config (AC1):** `pages` job in `.gitlab-ci.yml` runs `publish.py --out public` only for `vN` tags or a manual web pipeline with `PUBLISH_PAGES=true` on the default branch; never on mirrored pushes. Verified by reading the rules + YAML parse.
    - **Docs (AC2):** README section for GitLab Pages: trigger, URL shape, admin prerequisites (Pages domain, wildcard DNS).
    - **Check (AC3):** `publish.py --compare <dir>` diffs an existing published tree (checked-out gh-pages, or the downloaded `public/` artifact) against the generated tree for the same rev; documented procedure for both hosts. Same script feeds both hosts, so identical content by construction.
    - **No automated test (AC4):** whether the self-hosted instance has Pages enabled cannot be checked from this sandbox (no GitLab API credentials). Recorded as an operator blocker comment on the spec.

    ### Expected files
    - `docs/showcase/publish.py` (+ test file alongside)
    - `.gitlab-ci.yml`
    - `docs/showcase/README.md`

    ### Ambiguities / conflicts as questions
    - Should air-gapped GitLab Pages point source links at the GitLab project instead of github.com? Default stays identical (github) per AC3; `--source-base` override offered, documented as an intentional divergence.
