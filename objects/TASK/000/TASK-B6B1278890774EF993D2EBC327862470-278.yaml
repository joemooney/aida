- id: 01a1944e-b46a-77b3-942e-2ef60f4c2701
  author: joe
  content: |-
    ## Operator blocker (AC4): GitLab Pages enablement unverified

    The `pages` job is in place, but this sandbox has no GitLab API access or credentials, so it cannot confirm that the self-hosted instance has Pages enabled. Operator action: set `pages_external_url` in `gitlab.rb`, add wildcard DNS `*.<pages-domain>` (plus wildcard TLS for HTTPS), then run a default-branch pipeline with `PUBLISH_PAGES=true` and check *Deploy > Pages*. Until then the job can run, but nothing is served. Nothing in the repository works around this.
