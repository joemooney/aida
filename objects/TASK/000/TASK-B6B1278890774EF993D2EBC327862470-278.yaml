  content: 'ADVISOR REWORK BRIEF round 2 (17:18), PR-3183. publish.py is sound. ONE item: the GitLab ''pages'' job fails on every run after the first on the runner''s persistent checkout (public/ or a work dir is left over). Make the job idempotent: start from a clean output dir (rm -rf public before copying, or GIT_STRATEGY/clean flags set so leftovers cannot break it), and add a test or a documented local dry-run that runs the job''s script twice in a row and passes both times. LIGHT gate (make check-ci-fast plus the PR''s publish tests).'
