  content: 'Runbook authored: docs/agents/codex-validation-runbook.md (+ template mirror). 9-step end-to-end Codex MCP validation loop with troubleshooting table and negative-path checks. Surface notes captured while grounding: (1) `aida queue work` / `aida session start` launch CLAUDE, not Codex — Codex flow uses claim_task or session-start-as-worktree-bootstrap; documented as a boundary note. (2) CLI punt-list verb is `aida punts list` (plural subcommand), not `aida punt list`. (3) trace gate is permissive by default; AIDA_COMMIT_STRICT=true enforces. No code gaps requiring follow-up specs — all intended flow maps to a real verb/tool.'
