title: 'non-blocking (minor): aida dev rollback (dev_build.rs:1192) swaps .promoted but…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on STORY-1689, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): aida dev rollback (dev_build.rs:1192) swaps .promoted but leaves autopromote.json at phase=promoted. The next dev-autopromote tick sees live SHA != origin/main and rebuilds and re-promotes the commit the operator just rolled away from, within 15 min. Fix: have rollback record the rolled-away SHA so the tick skips it (failed-sha) until main moves, or document disabling the job before a rollback.

