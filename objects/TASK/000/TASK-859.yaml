title: aida init should prompt for configurable items (optionally launch aida config menu)
description: At init (TTY), prompt for the handful of high-value configurable items rather than leaving them at silent defaults (e.g. agent permission posture, bwrap posture, forge CLI, telemetry opt-out, node name). Optionally offer to launch aida config menu for the full surface. Non-interactive init keeps current defaults (no prompts). Builds on the existing first-machine agent-posture prompt (TASK-698) + node-name prompt.
