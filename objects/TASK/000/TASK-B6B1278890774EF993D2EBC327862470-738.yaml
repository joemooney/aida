title: aida pr hold reports branch pushed without performing or verifying a push
description: During BUG-2423 implementation, aida pr hold exited 0 saying the branch was pushed, but git ls-remote --heads origin <branch> returned no matching ref. A direct git push -u origin <branch> then created the branch. Source pr_cmd.rs::pr_hold_handler only writes HoldSignal and prints the pushed claim; it performs no push or remote verification. Standalone headless launches can therefore advertise a held branch that is not recoverable from the forge. Either perform/verify the push or clearly require pushing beforehand and stop claiming remote success. The current BUG-2423 branch was pushed directly and its remote is being verified.
