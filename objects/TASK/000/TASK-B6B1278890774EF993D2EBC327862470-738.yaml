  content: |-
    ADVISOR RULING (16:10, PR #3311 at its current head): fix every finding below. Specific rulings: (1)-(2) use aida_core::git_ops::host_git_command (or contained_seat_git_command for a proven contained clone); do not grow the ratchet allowlist. (3) Add the non-fast-forward test.
    1. aida-cli-lib/src/pr_cmd.rs:202,214,239 (push_and_verify_held_branch): the rev-parse, push and ls-remote calls use raw std::process::Command::new("git") against the lease worktree (cwd), which can be a seat clone. That bypasses aida_core::git_ops::host_git_command's BUG-2169 refusal/contained-seat path (host git would run seat-written config and hooks such as pre-push). Build all three with aida_core::git_ops::host_git_command(repo), keeping .remote_credentials(...) on push and ls-remote.
    2. CI red at 982b6bbf: seat_clone::clone_git_ratchet_tests::task_2143_no_new_raw_git_where_a_lease_tree_is_read panics (task_2143_clone_git_ratchet_tests.rs:400) because pr_cmd.rs now has 50 raw git builders vs the allowlisted 47. Fix by switching to host_git_command (count goes back to 47). Do not raise the allowlist. Build (ubuntu-latest) fails only on its 'Require every CI lane' aggregator step, so it clears once lib-0 is green.
    3. Test gap (minor): no test covers the branch where origin has the ref at a different sha with a clean push exit ((Some(tip), None) arm), nor a rejected non-fast-forward push. Add one for the non-ff case so the 'not held' refusal path is pinned beyond the unreachable-remote case.
    LIGHT gate: one targeted cargo test plus make check-ci-fast (umask 022); 'cargo check -p aida-cli-lib --tests' is mandatory before pushing. Push to the existing PR branch, then stop.
