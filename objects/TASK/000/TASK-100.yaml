    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: queue done has no stale-base/behind precheck, but the lifecycle has since gained a reviewer-side stale-base refusal (--allow-stale-base) and the standalone `aida rebase` verb. Is a queue-done-time check still wanted?
      a) Implement as specced: fetch + behind-count + Y/n/skip prompt at `aida queue done`, bypassable via --no-fetch.
      b) Reject — the reviewer pre-flight stale-base refusal + `aida rebase` verb already catch this later in the lifecycle (TASK-218/STORY-429 era), making a queue-done check redundant.
      c) Narrow to a one-line non-blocking warning in queue done output (no prompt, no fetch storm).
      REC: b — the architecture moved past per-lifecycle-moment rebase hooks toward the centralized rebase verb + reviewer gate; adding another interactive prompt cuts against the autonomous-drain direction. Confirm the reviewer gate covers the pre-PR window this targeted.
