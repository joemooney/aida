title: Wire aida worktree pool/remove (STORY-716 namespace) to the STORY-714 aida-core pool engine
description: 'STORY-714 builds the worktree-pool ENGINE in aida-core (worktree_pool.rs, worktree_hooks.rs, worktree_pool_destroy.rs); STORY-716 builds the aida worktree COMMAND namespace in aida-cli (add/enter/list). They are complementary layers (engine vs command), no collision -- merge independently. THIS task is the follow-on AFTER both land: add aida worktree pool [status] + aida worktree remove subcommands to STORY-716s WorktreeCommand clap enum, wiring them to STORY-714s aida-core engine; and optionally make aida worktree add acquire-from-pool when a warm tree is idle. Gated on BOTH STORY-714 + STORY-716 merged.'
