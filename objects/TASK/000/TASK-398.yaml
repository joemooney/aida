  content: |-
    Implemented via commit 9363ff89 (PR link added after open):

    - New CLI: `aida headless tail [<spec>|<lease>] [flags]` (`aida-cli/src/headless_tail.rs`, ~600 LOC + 30 unit tests).
    - Wired up as a `Subcommand` on `Command::Headless(HeadlessCommand::Tail{…})`; dispatched pre-storage-init alongside `aida drain` and `aida worker` so it works from any cwd and never needs the requirement store.
    - Flags shipped per the acceptance criteria: `--list`, `--with-tools`, `--tools-only`, `--include-user`, `--no-follow`/`-n`, `--since <duration>` (`10m`/`2h`/`1d`/bare-seconds).
    - Selector heuristic: a SPEC-ID pattern (`TASK-398`) matches both branch-form (`task-398-…`) and advisor forms (`advise-TASK-398-…`, `resume-TASK-398-…`) and picks the newest; a lease prefix disambiguates between concurrent drains. Ambiguous prefixes fail loudly with the candidate list.
    - Tool-input preview: prefers the dominant single-string field (`command`/`file_path`/`pattern`/`skill`/`query`/`prompt`) when present, falls back to compact JSON, truncates to 120 chars + ellipsis.
    - Follow loop reopens the file each tick so log rotation / truncation is handled gracefully; partial trailing lines stay in place across ticks. Scoped SIGINT handler exits cleanly.
    - Malformed JSONL lines bump a counter; stderr emits a one-line summary at end-of-stream.

    Test status: 850/850 tests green (`cargo test -p aida-cli`), 30 new tests in `headless_tail::tests` covering filename parsing across all three forms, selector edge cases, block-type filtering, `--since` semantics, malformed-line handling, tool-input truncation, discovery sorting.

    Follow-up: TASK-418 (advisor triage) — `--since` semantics on events without a `timestamp` field; conservative reading vs strict cutoff is a design call worth a second pass.
