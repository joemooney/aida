description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1800, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  [non-blocking, minor] forge.rs probe_default_branch now falls back to a network ls-remote (up to 3s), and default_branch_of calls it before local origin/HEAD. All 15 callers (trusted_config, drain_batch, orchestrator_leases, implementer_preflight, ...) now pay a network round-trip on non-GitHub forges or when gh fails, and the remote's answer now overrides local evidence there. This goes beyond the ship guard.

