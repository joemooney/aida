title: 'PR-3069 follow-ups: unlink partial file on fallback write failure; fault-injection tests for post-placement warnings'
description: |
  Non-blocking findings from the APPROVED review of PR #3069 (TASK-b6b1278890774ef993d2ebc327862470-078) at 1b2b235a3dd4. Fix: on the create_new fallback, if write_all/sync_all fails, unlink the final-name file before returning Err (it was created by this call, so removing it is safe). Add fault-injection tests (a seam) for that and for the warn-not-Err post-placement branches.
  - [minor, non-blocking] mod.rs write_new_synced on the no-rename/no-link fallback path: if write_all/sync_all fails after create_new (e.g. ENOSPC/EIO), the partial or empty file stays at the final name. Later write_source_id calls get AlreadyExists, and mark_nonce_era treats that as Ok, so the torn marker/nonce persists. The doc comment mentions only a crash. Suggest removing path on write/sync error in the fallback.
  - [cosmetic, non-blocking] The post-placement warn-not-Err branches (temp remove, dir fsync) have no fault-injection test; verified by inspection only.
