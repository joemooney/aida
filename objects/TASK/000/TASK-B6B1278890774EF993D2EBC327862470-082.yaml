  content: 'ADVISOR RULING 2026-10-28 15:56 MST on the #3072 non-blocking findings: ACCEPTED LIMITATION, no follow-up task. The concurrent-writer race exists only on the create_new fallback, used when a filesystem supports neither RENAME_NOREPLACE nor hard links (some CIFS/SMB mounts). ADR-72 scopes AIDA to Linux local filesystems, which have both, so that path is best-effort, and the race fails closed (the reader sees Unsafe, which is retriable), never aliased. The cosmetic test-assertion gap is accepted too. This closes the mailbox-lifecycle review chain (#3043 -> #3047 -> #3056 -> #3058 -> #3062 -> #3065 -> #3069 -> #3072).'
