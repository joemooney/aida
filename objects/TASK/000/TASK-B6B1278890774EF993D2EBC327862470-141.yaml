title: 'GitLab CI: run main on a nightly schedule instead of every mirrored merge; make jobs interruptible'
description: |-
  Operator 2026-10-30 22:00. Every GitHub merge mirrors to gitlab main and starts a full gitlab pipeline (verify, test incl. cargo test --workspace --doc, bwrap-confinement) on the home runner, which runs two concurrent root podman jobs. That duplicates GitHub CI that just passed and competes with implementer lanes on the HDD host (IO pressure ~75%+).

  Acceptance:
  1. In .gitlab-ci.yml, verify / test / bwrap-confinement no longer run for a push to the default branch; they run for merge requests (unchanged), for tags where they already do, and for scheduled pipelines on the default branch ($CI_PIPELINE_SOURCE == "schedule"). Also allow $CI_PIPELINE_SOURCE == "web" for a manual run.
  2. Add a workflow: auto_cancel: on_new_commit: interruptible block and mark those jobs interruptible: true. Release jobs and the merge-hold gate stay non-interruptible.
  3. The release (tag) jobs and the included merge-hold gate are unchanged.
  4. docs/gitlab-ci-runner.md says the main pipeline is nightly, with the one-time step to create the schedule (GitLab UI: CI/CD > Schedules, daily, target main). Creating the schedule is an operator step, not part of this PR.
  5. The header comment explains why main pushes don't run: GitHub CI already gated them.
  Gate: FASTTRACK (make check-ci-fast; no cargo). If a lint checks .gitlab-ci.yml, it passes.
