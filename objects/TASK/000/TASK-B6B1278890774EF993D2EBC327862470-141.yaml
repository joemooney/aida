    - **No automated test:** rules (MR / schedule+default branch / web) and interruptible flags — verified by reading the diff; GitLab evaluates at runtime.
    - **No automated test:** docs/gitlab-ci-runner.md nightly + schedule setup step — doc review.

    ### Expected files
    - `.gitlab-ci.yml`
    - `docs/gitlab-ci-runner.md`

    ### Ambiguities / conflicts as questions
    - verify/test do not currently run for tags; "for tags where they already do" read as: no tag rule added (unchanged).
