  content: |
    Final implementation handoff (TASK-2879)

    Changed files:
    - aida-cli-lib/src/agent_launch_prompt.rs: default implementer native finish clause and regression.
    - aida-cli-lib/src/standalone_implementer.rs: native-specific stop contract selected from resolved launch posture.
    - aida-core/templates/commands/aida-pickup.md and aida-core/templates/skills/aida-pickup.md: native finish override, tested edits left uncommitted, final handoff, host publication before queue completion.
    - aida-cli-lib/src/queue_cmd.rs and queue_misc.rs: preserve lifecycle refusal first; native seat queue-done then resolves the recorded lease branch and refuses before committed-only diagnostics/status/queue mutation.
    - aida-cli-lib/src/ship_from_seat.rs: preserve non-completing Refs PR trailers in host-created pending commits (unknown title evidence is conservative), fetch a remote branch into an invocation-private ref without changing FETCH_HEAD, and reconcile through the sandbox before bundling/pushing. Ordinary push remains non-force.
    - aida-cli-lib/src/seat_clone.rs: sandboxed remote-head merge using host identity, disabled hooks, pinned directory checks, clean branch admission and conflict abort.
    - aida-cli-lib/src/tests/bug_home_038_seat_publish_tests.rs and story_1662_standalone_implementer_tests.rs: queue/prompt/production sandbox regressions.
    - docs/cli/03-work-autonomy.md and 06-roles-sessions.md: document the post-exit boundary and recovery.

    Validation on final source:
    PASS cargo test --profile agent -p aida-cli-lib --lib task_2879 -- --nocapture (7 passed, including real sandbox merge; no skips).
    PASS cargo test --profile agent -p aida-cli-lib --lib seat_clone::seat_publish_tests -- --nocapture (33 passed; includes live-owner refusal, host commit/recovery, bad-message checks, host identity and planted-hook protection).
    PASS cargo test --profile agent -p aida-cli-lib --lib ship_from_seat:: (5 passed; includes punt/hold publication vetoes and fail-closed dispatch).
    PASS cargo test --profile agent -p aida-cli-lib --lib standalone_implementer:: (39 passed).
    PASS cargo test --profile agent -p aida-cli-lib --lib seat_clone::rework_merge_tests:: (5 passed).
    PASS cargo fmt --all -- --check and git diff --check.
    The lane job runner was unavailable in this launch; the tests above ran directly via bounded exec sessions. The initial cold build took 10m48s and the final incremental rebuild took 4m50s.

    Publication boundary: this native seat has read-only Git metadata. Edits remain uncommitted and no PR was opened, no shipping/merge/review-record command was run, and queue completion was not attempted. The existing live-owner check must remain in force until this process exits. From the host main checkout after exit, publish with:

    aida ship TASK-2879 --from-seat /home/joe/ai/aida-worktrees/aida-seat-aida-task-b6b1278890774ef993d2ebc327862470-826 --commit-pending '[AI:codex] fix(launch): hand native finishes to the host (TASK-2879)'

    If the launcher's existing post-exit step has already committed, the same command observes no pending edits and publishes that commit. Run queue completion on the host only after the PR exists, then hand the PR to a separate reviewer/merge seat. TASK-2879 remains In Progress pending publication. Full CI was not run. A conflicting remote merge refuses publication and preserves the local commit; a remote update after the pinned fetch can still refuse the ordinary non-force push. Existing merge-first rework remains BUG-2456's scope.
