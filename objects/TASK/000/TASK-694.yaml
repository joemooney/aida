- id: 019ea3d8-843d-77c0-b988-244f7d80972e
  author: joe
  content: |-
    BLOCKED on a design contradiction the instrument-don't-infer gate caught (2026-06-07). Claude Code docs (code.claude.com/docs/en/hooks): WorktreeCreate fires BEFORE creation, REPLACES default git behavior (the hook must itself create the worktree + return the path), and its stdin payload carries only the common fields (session_id, transcript_path, cwd, permission_mode, hook_event_name) — NO worktree path/branch input. WorktreeRemove is a non-blocking side-effect hook (cwd may be the worktree dir).

    Consequence: the TASK-634/694 premise — WorktreeCreate as a PASSIVE notification carrying {path,branch} that AIDA reads to register a lease — is WRONG. WorktreeCreate is an OWNERSHIP hook; passively capturing a lease for a harness-created worktree is impossible via it without AIDA taking over worktree provisioning (substrate-DRIVEN, explicitly out of SPIKE-41's capture-only scope). The TASK-634 pure core (worktree_lease.rs, payload {path,branch}→lease) is built on this wrong shape (only spec_id_from_branch is salvageable).

    Options for substrate-CAPTURE of harness worktrees (need operator/master design call):
    A. AIDA OWNS worktree creation via WorktreeCreate (it git-worktree-adds + registers the lease + returns the path). Substrate-DRIVEN; bigger; changes who provisions.
    B. Pivot to a passive observe hook — SubagentStart/SubagentStop or PostToolUse on the git-worktree command — to register/release leases without owning creation. Likely the right capture-only fit; needs empirical payload verification.
    C. WorktreeRemove (non-blocking, safe to instrument) for the release half; pair with B for create.

    Recommend NOT wiring until the design is chosen + the chosen hook's payload is empirically instrumented (the original gate, still unmet — SPIKE-41 was a docs catalogue, not an empirical payload probe). trace:TASK-694
  created_at: 2026-06-07T20:48:56.381858323Z
  modified_at: 2026-06-07T20:48:56.381858323Z
- id: 019ea3f2-fff2-7d71-8273-176451777690
  author: joe
  content: |-
    DESIGN (operator chose passive-observe, 2026-06-07). Firmed from the docs:
    - Harness worktrees (isolation:'worktree') are created INTERNALLY by Claude Code (WorktreeCreate replaces git) — there is NO Bash 'git worktree add' tool call, so PostToolUse can't catch them. The capture path is SubagentStart/SubagentStop.
    - SubagentStart/Stop payload: common fields + agent_id + agent_type + cwd. agent_id correlates Start<->Stop. NO documented worktree-path/branch field, but cwd LIKELY = the worktree dir for an isolated subagent (the one thing to confirm empirically). branch derivable via 'git -C <cwd> rev-parse --abbrev-ref HEAD'.
    - Wire: SubagentStart -> register a lease (worktree_path=cwd, branch from git-in-cwd, scope from spec_id_from_branch [reuse the salvageable TASK-634 helper] else 'harness-worktree', id keyed on agent_id); SubagentStop (correlate by agent_id) -> release it.
    - worktree_lease.rs (TASK-634) needs reshaping: WorktreePayload{path,branch} -> {agent_id, agent_type, cwd}; lease_spec_for_create derives branch from cwd's git, not a payload field. Only spec_id_from_branch survives as-is.

    PLAN: (1) empirical probe — confirm SubagentStart cwd = worktree for an isolated subagent + capture the real payload (filed as a task; can't run in THIS session — hooks load at session start). (2) wiring — gated on the probe. trace:TASK-694
  created_at: 2026-06-07T21:17:51.986625625Z
  modified_at: 2026-06-07T21:17:51.986625625Z
- id: 019ea3f7-1d9a-7150-866a-c37c465c4d30
  author: joe
  content: |-
    PROBE RESULT (TASK-701, empirically verified in-session 2026-06-07 — hooks load dynamically, fired on a throwaway Agent isolation:worktree):

    SubagentStart payload: {session_id, transcript_path, cwd, agent_id, agent_type, hook_event_name}. cwd = the worktree dir (/.../.claude/worktrees/agent-<agent_id>) — CONFIRMED, this is the gate question answered YES. No branch field.
    SubagentStop payload: {cwd, permission_mode, agent_id, agent_type, hook_event_name, stop_hook_active, agent_transcript_path, last_assistant_message, background_tasks, session_crons}. Same cwd + same agent_id as Start → correlation confirmed.
    WorktreeRemove: did NOT fire (the worktree persisted after the subagent finished — the orphan-accumulation we keep cleaning). => use SubagentStop for the lease RELEASE, not WorktreeRemove.

    Confirmed wiring (TASK-702, now UNBLOCKED): SubagentStart -> register lease(worktree_path=cwd, branch=git -C cwd rev-parse --abbrev-ref HEAD, scope=spec_id_from_branch(branch) else 'harness-worktree', key=agent_id). SubagentStop -> release lease by agent_id. Harness branches are 'worktree-agent-<id>' (no SPEC-ID → harness-worktree scope, as designed). trace:TASK-701 trace:TASK-694
