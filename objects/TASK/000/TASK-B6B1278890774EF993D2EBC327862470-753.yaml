title: 'Non-blocking (minor, fail-open): update::author_live relies on status_prs::live…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2426, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Non-blocking (minor, fail-open): update::author_live relies on status_prs::live_owned_branches -> leases::list_leases, which silently drops an unreadable lease dir or an unparseable (torn-write) lease file. Either error makes a live author look dead, so the watcher runs gh pr update-branch on a branch a live lane owns (non-destructive merge commit, but the lane's next push is rejected). Use list_leases_strict (or treat a read error as liveness unknown -> route) and add a test of the real author_live with a live lease (current tests inject the liveness closure).

  PR: #3305
  Reviewed sha: af914bb0693fd92bdaf5cccd6b8f8888360ca7c2
