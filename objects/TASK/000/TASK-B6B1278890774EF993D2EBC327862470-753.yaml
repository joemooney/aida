  content: 'ADVISOR RULING (2026-11-03 21:20 MST): bundle and fix. Fail-open liveness is the real defect: update::author_live uses list_leases_strict, and treats an unreadable lease dir or torn lease file as liveness unknown, so it never runs update-branch on a branch a live lane may own. Add a test with a torn lease file. Bundled (TASK-2810/2814, cosmetic): parks() excludes changes with an in-flight supersede, and record_skip keeps the original parked ''since'' across reason changes. Gate: LIGHT.'
  created_at: 2026-11-04T04:18:37.894262765Z
