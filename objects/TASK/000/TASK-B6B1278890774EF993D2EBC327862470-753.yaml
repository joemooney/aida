- id: 01a1a532-5c79-7a83-bae2-8ea400f2b2ec
  author: joe
  content: 'ADVISOR REWORK BRIEF (2026-11-03 23:16 MST, PR #3341 head 7a628e7a). Review requested changes. BLOCKING: list_leases_strict_all treats aida lock''s lock-only entries (lock-<slug>.toml, which do not parse as a SessionLease) as torn leases, so while any worktree lock exists the watcher never updates a dead author''s branch. Skip lock-only entries by file name or kind before strict parsing, and add a test that a present lock-<slug>.toml leaves author_live and the update path working. The deputy_shell CI failure is an unrelated flake: re-run it, do not chase it. Rule each non-blocking finding in this push: fix it or say why not, in one line on this spec. Gate (LIGHT): one targeted cargo test filter covering the changed module, plus make check-ci-fast, then push to the same PR branch. The advisor re-reviews only the delta.'
