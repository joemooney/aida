title: Standalone native implementer finish prompt conflicts with host-only commit/publication
description: Native Codex standalone implementer prompt requires commit/push/open-PR before exit, but the native sandbox keeps its seat .git read-only. BUG-2449 implementation completed with 70 targeted tests passing; git add/git commit refused index.lock with Read-only file system. docs/cli/04-git-lifecycle.md documents that native seats must leave edits pending for the launcher post-exit host commit; that step reports a separate host publication command rather than opening the PR. Align the standalone native prompt/outcome handling with this host-only finish path so completed work is not reported as a failed no-PR implementation. No sandbox bypass attempted.
