title: 'aida db block: auto-claim a new block on spec creation when available IDs cross threshold'
description: "Today, when AIDA's block of IDs for a type (BUG, TASK, STORY, etc.) runs low, the user sees a \\\"WARNING: <type> block running low\\\" message and must manually run \\`aida db block claim --type <T>\\`. This is a recurring context-switch tax — today's session hit it ~5 times.\n\nAuto-claim eliminates the manual step. When a spec-creating command (\\`aida add\\`, \\`aida pr auto-queue-review\\`, etc.) detects the aggregate available IDs below a threshold, it claims a fresh block automatically before allocating the new ID.\n\n## Acceptance\n\n### Configuration\n\n- [ ] \\`.aida/config.toml\\` supports per-type thresholds:\n  \\`\\`\\`toml\n  [block_allocation.bug]\n  auto_claim_threshold = 20      # claim when remaining drops below 20\n  auto_claim_size = 100          # claim 100 IDs at a time\n  \n  [block_allocation.task]\n  auto_claim_threshold = 20\n  auto_claim_size = 100\n  \n  # Same for story, epic, etc.\n  \\`\\`\\`\n- [ ] Per-type defaults if not configured: threshold 20, size 100\n- [ ] Global opt-out: \\`[block_allocation] auto_claim = false\\` disables for all types\n- [ ] Per-type opt-out: \\`[block_allocation.bug] auto_claim = false\\`\n\n### Hook into spec-creating commands\n\n- [ ] \\`aida add\\` checks aggregate remaining for the type BEFORE allocating; auto-claims if below threshold\n- [ ] \\`aida pr auto-queue-review\\` (called by \\`/aida-pr\\`) auto-claims STORY block if needed\n- [ ] \\`aida queue add\\` (if it ever creates new specs implicitly) auto-claims as needed\n- [ ] All paths use the same internal \\`ensure_block_capacity(<type>, n_needed)\\` helper\n\n### Output\n\n- [ ] When auto-claim fires, prints a one-line info notice (not a warning):\n  \\`\\`\\`\n  ℹ Auto-claimed BUG-517..616 (threshold crossed: 18 remaining → 118)\n  Added: BUG-117 - ...\n  \\`\\`\\`\n- [ ] When threshold NOT crossed, no extra output\n\n### Edge cases\n\n- [ ] Concurrent claim race: if two AIDA processes both try to auto-claim simultaneously, one wins; the other detects the claim and proceeds with the existing block\n- [ ] Network failure during claim: surface clear error, fall back to existing block (still has SOME IDs); user can retry manually\n- [ ] First-time setup: claim a fresh block of each type on \\`aida init\\` so threshold logic doesn't fire on first 20 specs of a new project\n\n### Tests\n\n- [ ] Threshold detection: confirm trigger fires at correct count\n- [ ] Auto-claim happens exactly once per drop-below event\n- [ ] Opt-out config respected\n- [ ] Test against the existing alarmist-warning logic (BUG-115 — same family)\n\n## Composes with\n\n- **BUG-115** (block-low warning fires on lowest block) — auto-claim makes warnings rare; BUG-115 fixes the warning logic when they do fire. Together they eliminate the noise loop.\n- **first-users alpha** — first-users shouldn't see ANY block-claim warning or be aware of the block concept; auto-claim makes the implementation detail invisible\n- **\\`aida init\\`** — \\`aida init\\` should claim initial blocks of each type so projects start with headroom\n- **\\`aida db block status\\`** — display should still show all claimed blocks; auto-claim adds new entries naturally\n\n## Why this matters for alpha\n\nFirst-users running \\`aida init\\` then \\`aida add\\` shouldn't be confronted with internal mechanics like \\\"block claim.\\\" The block concept is implementation; users care about \\\"I added a TASK, it has an ID.\\\" Auto-claim eliminates the seam where this mechanism leaks into UX.\n\n## Origin\n\nUser asked 2026-05-16: *\\\"is there an auto claim capability, add a new task and it will autoclaim if we are below a threshold?\\\"* — answer was no; this TASK files the missing feature."
