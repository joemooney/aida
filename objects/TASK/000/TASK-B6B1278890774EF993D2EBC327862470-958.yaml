    1. CI (gates) FAILS at d5c6595: step 'Help golden snapshot co-change guard' (scripts/check-help-golden-cochange.sh) rejects the PR because aida-cli-lib/src/command_registry.rs changed without aida-cli-lib/src/tests/golden/cli_help_snapshot.txt and the commit lacks a 'Help-Golden: unchanged' trailer. Since --help output is genuinely unchanged by this move, amend/add a commit carrying 'Help-Golden: unchanged'. This also means the acceptance 'make check-ci-fast passes' was not met (the guard needs no build).
