title: 'minor (non-blocking): when AIDA_STORE points at a usable store other than the p…'
description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2200, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor (non-blocking): when AIDA_STORE points at a usable store other than the project's, aida team reads the override's roster but the seat check reads the project roster (deliberately). The roster-refusal message ('not allowed by the team roster') does not name the store it read, and the AIDA_STORE hint appears only in the NotDetected branch, so the original confusing symptom can still happen under an override. Suggest naming the roster path and the AIDA_STORE divergence in the refusal (seat_authority.rs issuance_roster_store / validate_child_delegation).

