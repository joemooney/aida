title: auto-queue-review over-links a PR's review story to specs that landed on main (PR-4685 got BUG-2776/BUG-2772/TASK-3912/STORY-3120)
description: |
  `aida pr auto-queue-review` for PR #4685 (branch bug-2777-ejection-routing, 2 commits, both BUG-2777) reused review story STORY-73022632d35647cca3858b18ac0723e3-371 and linked it as implementing BUG-2776, BUG-2772 and TASK-3912 and covering STORY-3120. Those trailers belong to commits already on main (#4678, #4666/#4668, #4670). `aida ship --no-merge` had just rebased the branch onto a newer origin/main, so the covers scan probably used a stale base ref in the seat clone. The risk is that a reviewer or merge-time completion credits the wrong specs.

  Raised by the implementer while working BUG-2777.
