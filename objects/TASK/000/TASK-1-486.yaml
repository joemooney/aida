description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1952, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): session.rs stage_resume_transcript checks the source with symlink_metadata and then reads it with std::fs::read, which follows symlinks, so a swap between check and read slips through. Open the source with O_NOFOLLOW and fstat the handle instead. The source dir is host-owned, so this is low risk.

