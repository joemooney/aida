title: 'STORY-335 slice 2: rebase step in aida queue integrate (--rebase, opt-in)'
description: 'Second slice of STORY-335. Adds an opt-in --rebase flag to ''aida queue integrate'': before driving each ready member''s --from-pr merge, rebase its PR branch onto current main by composing the existing ''aida pr rebase <N> --no-smoke'' primitive (temp-worktree rebase + force-push-with-lease + cross-fork/worktree guards already battle-tested). Clean rebase → proceed to merge; rebase failure/conflict → skip that member with a clear reason and continue (punt-and-continue, EPIC-28 resilient-drain discipline; the slice-1 --dry-run forecast previews this). Default behavior (no --rebase) is unchanged from STORY-520. Smoke skipped (--no-smoke) because the subsequent --from-pr drive runs CI. Remaining STORY-335 slices: --strategy {per-item|one-branch|stacked} and the sequence-aware forecast. trace:STORY-335'
