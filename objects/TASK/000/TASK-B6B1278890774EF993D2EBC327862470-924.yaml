description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2480, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  non-blocking (minor): a TOCTOU window remains between _hung_up(notification) and the RECV ioctl in broker_connect_contained (contained_host.py:749-753, 413). If a pending notification is withdrawn and the last filtered task exits inside that window, RECV can still block. The window is far narrower than before; a bounded RECV (worker thread or a poll-with-timeout retry) would close it.

