  content: |-
    Implemented via PR-77 (commit 6ef87e33):

    - `next` / `nextN` keyword for `aida queue work` — `next` is an explicit alias for the no-arg head pickup; `nextN` / `next N` resolves a drain count.
    - `nextN --auto-complete` drains N specs from the queue head sequentially via the existing `drain_batch` machinery (`RealNextNDriver` yields the live head, `--max` pinned to N). Composes with `--no-human`.
    - `nextN` (N>1) without `--auto-complete` is rejected with a directive message; N > queue length drains all available with a note.
    - Spec-ID positionals unchanged — the `TYPE-N` hyphen disambiguates from `next`.

    Test status: 579/579 aida-cli tests green (10 new `next_keyword` unit tests; 64 `auto_complete` tests green — no regression from the shared-helper extraction).
