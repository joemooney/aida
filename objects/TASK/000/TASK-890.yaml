title: 'SPIKE-67 slice 1: git-log-as-sensor rule-adherence field study (aida field-study scan + report)'
description: 'Slice 1 of SPIKE-67. The git log is the planted sensor: aida field-study scan recomputes the stated-rule verdicts (commit_format via commit::validate_message, trace_presence) over recent commits into a local-only ~/.aida/field-study.jsonl; aida field-study report aggregates bucketed by task span. Opt-in (AIDA_FIELD_STUDY / [field_study] enabled), default OFF, honors AIDA_TELEMETRY=0, privacy floor (no message/paths/content). Deliberately avoids the keystone orchestrator and a universal commit-msg hook. New module aida-cli/src/field_study.rs + hidden aida field-study command. Docs: docs/research/ablations/2026-06-20-field-instrumentation-spike-67.md + environment-variables.md row.'
