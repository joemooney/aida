  content: 'PROXY DECISION (orchestrator for Joe): reject the missing --require-head observation as obsolete. Current main cli.rs exposes BurndownRun.require_head and lib.rs enforce_wave_launch_gate(project_root, require_head) applies it. STORY-1414 is the completed survivor for the freshness gate. dev_cmd.rs now considers target/agent in automatic selection; explicit release pinning is intentional and is not grounds to widen launcher authority. This is source verification, not a claimed native stale-binary rerun. No code or gate change required for the original missing-flag premise.'
