title: 'aida queue progress: show what an active session has shipped so far (Completed/Done) alongside what remains'
description: |-
  When an overnight implementer is draining a 13-item batch, the user wants to see progress at a glance: 'shipped 5, in flight 2, remaining 6.' Today's aida queue list shows only what's still queued — completed items disappear.

  The planned:by-SESSION_ID tag already gives partial visibility into items the session has RESERVED (visible in queue list). The gap is items the session has COMPLETED, which terminal-status filtering removes.

  ## Proposed command

  aida queue progress                          - default: progress for the most-recent active session
  aida queue progress --session SESSION_ID     - progress for a specific session
  aida queue progress --batch NAME             - progress for a batch tag (composes with TASK-229)
  aida queue progress --since TIMESTAMP        - everything touched since timestamp

  ## Output shape

  Shipped (3 items, status Completed):
    TASK-110  /aida-pr next-steps reordering
    TASK-227  /aida-review early-exit on merged PR
    TASK-228  Cancellable fallback wakeups

  In flight (2 items, status Done — PR open, awaiting merge):
    TASK-217  aida queue work status-aware error  (PR-25, CI green)
    TASK-222  aida queue list keep Done visible   (PR-26, in review)

  Working now (1 item, status InProgress):
    TASK-111  aida session end CI-aware           (worktree: /home/joe/ai/aida-epic-23-batch-5)

  Remaining (5 items, still queued):
    TASK-112, BUG-99, TASK-221, TASK-0396, BUG-97 ...

  Net: 5 of 13 reached terminal status; 1 currently working; 7 remaining.

  ## Compose with

  - TASK-222 (queue list keeps Done visible): partial overlap — TASK-222's in-flight view is the 'awaiting merge' subset of queue progress
  - TASK-220 (aida status): could include 'session progress' as one of its sections when an active lease is held
  - TASK-229 (queue work --batch): batch progress is the same view filtered by tag
  - TASK-218 (rework verb): rework items show up in 'in flight' or 'working now' depending on what rework state they're in

  ## Why medium priority

  The 'planned:by-<id>' tag already gives partial visibility. The completion gap is real but workaroundable via 'aida list --status completed' or 'aida history' for now. Worth shipping when other queue-UX work is in flight, but not blocking.

  ## Acceptance

  - [ ] aida queue progress subcommand implemented with default + --session / --batch / --since flags
  - [ ] Output groups items by lifecycle bucket (Shipped / In flight / Working now / Remaining)
  - [ ] Net summary line at the bottom ('N of M reached terminal; K working; L remaining')
  - [ ] Default 'most-recent active session' resolution works without an ID arg
  - [ ] --batch NAME variant composes with TASK-229's tag convention
  - [ ] Tests cover: active session with mixed-status items; no active session (error or 'most-recent ended' inference); empty batch (no items)

  ## Discovered via

  2026-05-13 — user observed that an overnight batch of 13 queued items had drained to 8 visible items, with no way to see what the missing 5 had become. Wanted a progress view: 'I am alluding to wanting to see progress that has been made.'
