  content: |-
    Implemented on branch epic-23-9 (commits 80292656, 501f285f):

    - `--batch NAME --auto-complete` composes — dropped `batch` from the clap `conflicts_with` set; added a re-resolving head-pickup drain loop (`drain_batch` + `BatchDriver` trait in auto_complete.rs).
    - A phase failure stops the drain at that spec (exit = failed-phase index); the rest of the batch stays queued. `--max N` caps the drain; a stall guard breaks a non-advancing queue.
    - `--auto-complete=through-ci` / `through-merge` variants compose; `handle_auto_complete` split into a non-exiting `run_auto_complete` so the loop can chain runs.

    Test status: 534/534 aida-cli tests green (7 new drain_batch_* tests); cargo fmt + clippy clean on new code.
