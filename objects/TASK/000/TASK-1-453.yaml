description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on TASK-1945, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  minor: review_watch.rs throttled()/report(): a pending (unsent) wake whose kind or approval identity is no longer current is never pruned (retain keeps every key for the head) and never redelivered, so READY_INTERVAL throttling stays disabled for that head indefinitely and every pass re-runs the full live evaluation (CI API, carry-over git, corpus). Prune or supersede stale pending wakes for the head when a different kind/approval is recorded or readiness drops.
