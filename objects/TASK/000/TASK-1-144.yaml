  content: 'Promoted by the product seat with live corroboration from 2026-09-18/19: without reviewed_sha on a PR-keyed verdict I could not tell, from the verdict file alone, whether a CHANGES REQUESTED covered the head I had just pushed or a stale one. Concrete instances: PR #1948''s round-2 verdict was written three minutes after the advisor merged an earlier head; #1953/#1944 verdicts were read against branches that had since been rebased; and twice I reported ''CI green'' for a head the verdict did not cover. recorded_at plus reviewed_sha turns ''is this verdict current?'' into a one-line check for both seats.'
