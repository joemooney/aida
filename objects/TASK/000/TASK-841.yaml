- id: 019f1c3c-4e53-76a2-b501-f53bacbb53b5
  author: joe
  content: |-
    DECISION — completion model: PER-COMMIT. Each stacked member is Completed when its OWN commit lands on the default branch (via the existing done->completed auto-bump, STORY-86), NOT held until the whole stack lands. Rationale: completed already MEANS merged-to-default-branch, so once a members PR merges it genuinely is on main; an atomic whole-stack model would need a new pending barrier and would misreport a landed member as still-Done for zero benefit. No new completion machinery required.

    IMPLEMENTED (this task): --strategy stacked is now a stack-aware ordering+gating layer over the per-item drive. Pure planner integrate::plan_stacked_integration partitions the ready set into mergeable-this-pass (bottom-of-stack / independent) vs deferred (stacked behind another still-open branch). Only the bottom layer merges; deferred members print an actionable line and the run exits 2 so --watch / a wrapping loop re-checks after the layer lands. 7 unit tests.

    FOLLOW-UP (filed separately): force-pushing a promoted childs PR branch with the stack-aware git rebase --onto origin/main <parent_sha> so the second+ layer becomes mergeable automatically (today it defers with a /aida-rebase pointer). The cascade (STORY-248) rebases the child worktree locally on aida pull but does not force-push the PR branch.
