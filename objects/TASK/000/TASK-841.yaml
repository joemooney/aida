title: 'integrate: stacked-branch accumulation strategy'
description: 'Follow-up of TASK-836. aida queue integrate has an IntegrateStrategy::Stacked variant that is accepted on the CLI but errors as unbuilt. Design question: when items build on each other (each branch on the previous), the integrator must rebase the whole stack as a unit and merge in order, and the completion semantics of an intermediate-stack spec are ambiguous (is it Completed when its own commit lands, or only when the whole stack lands?). Decide the completion model before implementing.'
