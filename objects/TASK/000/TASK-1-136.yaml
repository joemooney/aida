title: queue done leaves completed item visible in queue list
description: |-
  During BUG-1174 pickup under AIDA_HEADLESS=1, queue completion produced contradictory readback.

  Observed:
  - aida queue done BUG-1174 printed: marked done and removed from queue.
  - immediate aida queue list still included BUG-1174 with status done and for_role implementer.
  - immediate aida queue next also printed BUG-1174 as the next implementer item, despite status Done.

  Expected: either completed queue items are actually removed from queue projections, or the success copy/readback clearly explains that terminal entries remain visible until a cleanup step.
