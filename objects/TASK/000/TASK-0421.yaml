  author: joe
  content: |-
    INVENTORY DELIVERED (2026-06-25) — captured in docs/agents/porting-claude-code-to-codex.md, section "AIDA's actual Claude-Code dependency surface" (a per-capability table) + Appendix A (8 worked before/after examples). Verified against code (the shipped hooks/settings) and current Codex docs. Summary of the Claude-specific surfaces and their Codex replacement status:

    - Hook EVENTS AIDA wires (PreToolUse, PostToolUse, SessionStart, Stop, UserPromptSubmit, SubagentStart, SubagentStop): ALL SEVEN exist in Codex (incl. the two Codex added in 2026) -> port directly.
    - Hook HANDLERS: all AIDA hooks are command-type (.sh) -> Codex supports command hooks (near-identical schema: matcher/hooks/hookSpecificOutput/permissionDecision) -> port.
    - permissionDecision / defer / continue:false: NONE of AIDA's shipped hooks emit these -> no dependency, nothing to port (escalation is punt/NeedsAttention, already portable).
    - .claude/commands + .claude/skills: convenience; real workflows already live in AIDA CLI/MCP -> map prompt-only ones to Codex skills (.agents/skills/<n>/SKILL.md), state-changing ones stay CLI verbs. Codex has NO custom-slash-command files; migrate-to-codex converts Claude slash-commands to skills.
    - Command-backed status line (statusLine.command = aida statusline): the ONE hard Claude-only dependency (observability, not correctness). Already handled to AIDA's fullest extent by TASK-0413/0414 + codex-mcp-setup.md; the native-wiring remainder is upstream-gated and filed as a DEFERRED watch-item (see the new TASK above).
    - Starter memory pack (~/.claude/projects/<slug>/memory/): guidance only -> mirror key rules into AGENTS.md.
    - os_wrap around claude -p: Claude-launch-specific -> needs a deliberate Codex wrapper (tracked separately; see the bubblewrap section).

    NET: the only hard Claude-Code dependency AIDA carries is the command-backed status line, and it is observability, not correctness — everything load-bearing already lives in AIDA/git/MCP. Recommend TASK-0421 be considered substantially SATISFIED by the doc (advisor/operator to dispose).
