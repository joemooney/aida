title: Inventory Claude-specific workflow surfaces that need Codex replacements
description: |-
  Create an inventory of Claude Code-specific project surfaces that may be load-bearing during a migration to Codex CLI.

  Acceptance:
  - Inventory .claude/settings.json, .claude/hooks, .claude/commands, .claude/skills, CLAUDE.md imports, statusLine usage, and any Claude-only launch flags or workflows.
  - Classify each item as observation, guidance, enforcement, mutation, approval, session control, or UX.
  - For each load-bearing item, identify the intended replacement: Codex config/hook, AGENTS.md, project script, AIDA CLI/MCP, git hook, CI, orchestrator, or explicit no-equivalent gap.
  - Produce a migration table that can be checked into docs or attached as a spec comment.
