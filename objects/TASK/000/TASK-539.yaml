description: |-
  Refinement deferred from STORY-385 to keep PR scope tight. Add a 'Findings' section to 'aida status' showing:

  1. Pending findings count (delta since last run if tracked)
  2. Per-finding mini-table: ID + source spec + tag + verdict (one line each)
  3. JSON emission includes structured findings detail

  Compose with STORY-385's other 'needs attention' categories. Without this, the findings backlog is silent in status; user must remember 'aida findings list' explicitly. Empirically the backlog has been re-triaged 2-3x/day during heavy sessions.

  Source: STORY-385 comment 019e50ab-... at 2026-05-22.

