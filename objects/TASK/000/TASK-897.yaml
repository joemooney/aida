title: 'TUI panels: cap Backlog/History rows to most-recent N (e.g. 100) to keep the list light to build/render/scroll'
description: 'aida list --status completed --json returns all Completed (699 today, grows). The CLI query is fast (0.26s) but building/rendering/scrolling hundreds of TUI rows is heavy and clutters the panel. Cap fetch_status to the most-recent PANEL_ROW_LIMIT (CLI already returns recency-first), show a "showing N of M — aida list for all" notice when truncated. Full set stays available via aida list. Queue panel is already small. Follow-up if wanted: a real aida list --limit flag + TUI load-more pagination.'
