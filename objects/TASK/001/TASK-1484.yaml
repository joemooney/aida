  content: 'Explicit scope clarification: while a cache operation is retrying after SQLITE_BUSY or SQLITE_LOCKED, inspect the lock-info owner liveness on each bounded retry or at defined retry checkpoints. A dead owner marks the sidecar as orphaned, but SQLite availability must still be probed before proceeding; a live owner past its soft deadline remains contention, not permission to delete the lock.'
