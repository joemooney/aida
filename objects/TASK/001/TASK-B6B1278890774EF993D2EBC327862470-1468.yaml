title: 'Review follow-up: Patch-id equality also drops a branch commit that reapplies a change main later reverted ('
description: |-
  From BUG-2733
  Reviewed sha: 9e55228e4279bc1eb9672b40ae1065f6e0c93179

  Patch-id equality also drops a branch commit that reapplies a change main later reverted (same patch-id as the original main commit), so its spec trailer leaves the squash body and ship_gate_spec_records (pr_service.rs:181) even though the PR re-delivers the change; the spec then neither auto-completes nor is gate-classified. No new authority bypass (trailers are author-controlled anyway), but worth a guard: ignore base matches that were later reverted, or only match base commits whose patch is still present.
