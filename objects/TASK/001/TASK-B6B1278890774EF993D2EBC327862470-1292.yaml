title: discover-python-tests.py coverage ratchet credits only CI steps that can run (a disabled if:false step does not count as wiring)
description: |
  Follow-up from the #4479 BUG-2734 r2 review (advisor-122 ruling 2026-11-23 21:22, overridden to APPROVE; relayed by integration-30; filed by product-15). scripts/discover-python-tests.py's coverage ratchet counts a test as "wired" when ci.yml contains an invocation for it, even inside a step that can never run.

  ## Acceptance
  - AC1: The ratchet credits only CI steps that can run. An invocation inside a step whose `if:` is always false (e.g. `if: false`, `if: ${{ false }}`) or that is otherwise disabled does not count as wiring, so that test is reported as unwired.
  - AC2: Regression cases: a disabled step's invocation does not satisfy the ratchet, and an enabled step's does.
