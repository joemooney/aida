  content: 'INTEGRATION PRE-CHECK (integration-30, 23:30): PR-4492 @ 328f196e49 PASSES. +56/-2, merges CLEAN. AC1: dedicated_invocations() credits a step''s run lines only when its ''if:'' is a KNOWN runnable form (true/success()/always(), the build job''s full-tier gate, or a gates/contracts shard check optionally ANDed with full_ci or pull_request). An unknown or always-false condition gets no credit, so the ratchet fails loudly (fail-safe). It switches to yaml BaseLoader so YAML 1.1 words like ''on'' aren''t coerced to True. AC2: subtests cover false, ${{ false }}, ''false'', true&&false, on, and a shard that isn''t in the matrix (all uncredited) vs true and matrix.shard == ''gates'' (credited). Checked against the REAL ci.yml on this branch: all 13 CLI-set suites are still credited (0 missing), so full CI''s gates shard won''t regress.'
