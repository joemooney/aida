description: |-
  From STORY-2695
  Reviewed sha: 1a5f69f0aeaa47e7162649b5cacf05b59d781ed5

  scripts/runner/select-job.py (not changed by this PR; found while checking the workflow against the controller contract): the selector proposes any queued heavy-shard job of a pull_request run whose head branch starts with train/, without checking the base branch, the head repository or the labels the job requested. With the new routing, a train/ pull request into integration or from a fork keeps its heavy shards on hosted runners, where they can sit queued for minutes; the selector still proposes them, controller.py admit refuses (foreign repository or PR head mismatch), and rearm.py exits its slot loop on that non-zero status. Follow-up: have the selector propose only jobs whose requested labels include aida-dell1 and the class label, with a fixture for a hosted-labelled train/ job.
