title: 'Verify BUG-908 in the wild: confirm an implementer retry re-enters the dirty worktree and ships on a real drain'
description: |-
  ## Why
  Split out of BUG-908 acceptance item 5. The dogfood evidence (a live drain where a watchdog/transient retry re-enters attempt-1's worktree with its uncommitted changes and ships) cannot be produced inside BUG-908's own PR — BUG-908 is the fix that makes re-entry work. The reviewer correctly flagged the missing evidence (RequestChanges on PR-1739); this task is where that evidence lands, post-merge.

  ## Acceptance
  1. After BUG-908 merges, run a codex-vendor drain on a spec whose implementer phase trips the watchdog once (or inject a transient failure), and confirm from events.jsonl + the worktree that attempt 2 re-entered the SAME worktree with attempt-1's uncommitted diff intact and the spec shipped.
  2. Record the run: SpecRetried event with the reused lease/worktree, the diff size carried across, and the merged PR. Paste into this task.
  3. If re-entry still fails, reopen BUG-908 with the evidence rather than filing a new bug.

  ## Related
  BUG-908 (the fix), STORY-975 (retry), BUG-909 (Codex silence — a good spec to trigger the retry on).
