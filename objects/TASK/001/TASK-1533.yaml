title: Bind this repo's guard route jobs to their own guard once the installed aida supports CronJobFailed:<job>
description: 'Follow-up from BUG-1655. The fix lands the CronJobFailed:<job> binding and the scaffold template, but this repo''s .aida/config.toml keeps the plain form so the live tick keeps working with the currently installed binary (an older binary rejects the bound form at config load). Acceptance: 1. After BUG-1655 merges, rebuild and install aida (make install or equivalent) and confirm ''aida schedule status'' loads. 2. Then change the five route jobs in .aida/config.toml (performance, hub-drift, stranded-branches, disk-headroom, watchdog) to on = ["CronJobFailed:<guard>"]. 3. Verify with ''aida schedule status'' and one forced guard failure in a fixture or dry run that only its route becomes due.'
