title: Add the CLI help golden to STORY-2710's regeneration registry
description: |
  Follow-up of STORY-2692 (closed: #3709). Register the CLI help golden snapshot in the regeneration registry STORY-2710 introduced, so one command regenerates it with the others. Test: the registry lists it and regenerates it.

  ## Acceptance
  1. The CLI help golden (the snapshot checked by scripts/check-help-golden-cochange.sh) is registered in the generated-file regeneration registry STORY-2710 added for conflict lanes.
  2. The registry's single regenerate command rewrites the help golden along with the other entries; a conflict in the golden is resolved by regeneration, not by hand.
  3. A test asserts the registry lists the golden and that regenerating it on a clean tree is a no-op.
