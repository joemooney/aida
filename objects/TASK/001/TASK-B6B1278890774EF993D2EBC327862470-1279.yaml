title: forge::github_core_budget honours the gh test/debug seam (resolve_gh_binary_for_probe) (follow-up to TASK-3847)
description: |
  Follow-up to TASK-3847 / #4470 (advisor-122 ruling 2026-11-23 17:40; filed by product-15). forge::github_core_budget spawns Command::new("gh") directly, bypassing the test/debug seam, so AIDA_TEST_GH_BINARY / AIDA_DEBUG_GH are ignored there.

  ## Acceptance
  - AC1: forge::github_core_budget resolves gh via crate::kernel::resolve_gh_binary_for_probe() (one line), so the seam is honoured. A test uses the fake gh (AIDA_TEST_GH_BINARY) and asserts the budget reading comes from it.
