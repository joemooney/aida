title: Extend worktree GC to ended seat clones and add a weekly dry-run report
description: |
  ## Current approved scope

  The advisor's 2026-11-07 14:55 rescope replaces the destructive sweep in this implementer seat with a code change. The advisor/operator will review and apply cleanup on the host after it lands. Do not delete host worktrees or branches from the seat.

  ## Acceptance

  1. Extend `aida worktree gc` to private `aida-seat-*` clones. A clone is eligible only after its lease has ended, with no commits missing from origin (reuse the salvage/remote-coverage checks), and with a merged or closed PR. Default to a dry run; add `--apply` for operator removal and report bytes reclaimed.
  2. Also make clean linked worktrees eligible when their branch is merged into the default branch or their exact PR head is merged/closed. Preserve existing ownership, lock, live-process and mailbox-retention safeguards; uncertain evidence must retain work.
  3. Register a weekly read-only dry-run job and route its counts to the advisor. Never auto-apply cleanup.
  4. Validate with fixture repositories. LIGHT gate; host application follows publication.

  ## Historical cleanup request

  aida session reap --dry-run (2026-09-13) surfaced 226 'unshipped work' branches, most 1000+ commits ahead and 74-101 days old (abandoned worktree branches from months ago whose specs almost certainly completed via other branches). Plus ~43 on-disk git worktrees and ~68 /home/joe/ai/aida-* sibling dirs accumulated over the alpha cycle.

  NOT a blind batch-delete (clean git status != no work; some worktrees hold uncommitted work — e.g. STORY-1006 and STORY-993 are Completed but their worktrees carry uncommitted changes the reap correctly refused to remove).

  Deliberate sweep: for each stale branch/worktree, check the spec status — if Completed/merged-elsewhere, delete the branch + remove the worktree; if it holds genuine uncommitted work, salvage-commit or discard per a per-item decision. aida session reap already handles the finished+merged+exited class safely; this task is the long-tail the reap conservatively leaves (unfinished-spec or uncommitted-work worktrees, and pure branch cruft). Consider an aida worktree gc --older-than / --stale sweep if one doesn't cover it.

  Immediate: STORY-1006 + STORY-993 (both Completed) have uncommitted worktree changes — operator decision: salvage or discard, then remove those two worktrees.
