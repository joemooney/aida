title: 'First-run: the installer fails loudly on a failed download (F2)'
description: |-
  ## Acceptance
  - AC1: the documented install pipeline (installer script) uses set -euo pipefail / checks curl's exit status and HTTP status, and prints a clear error naming the URL when the download fails; it never installs or reports success on a partial/empty download.
  - AC2: a test (shell or python) simulates a failed download and asserts a non-zero exit and the message.

