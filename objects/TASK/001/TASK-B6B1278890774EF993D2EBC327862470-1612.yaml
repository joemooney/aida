    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (fixture):** documented command becomes download-then-run (`curl -fsSL URL -o install.sh && bash install.sh`) so a failed fetch exits non-zero and never pipes an HTTP error page into bash; script body wrapped in `main` so a truncated script runs nothing; release-archive download checks curl exit, empty file and archive integrity, and names the URL plus an offline path. Proven by `tests/test_install_download_failure.py` (stub curl on PATH).
    - **AC2 (fixture):** same test file asserts non-zero exit, the URL in the message, and an empty prefix for: curl failure, empty download, corrupt/partial archive, and the documented pipeline when the script fetch fails. Wired into ci.yml next to the other python unittests.

    ### Expected files
    - scripts/install.sh
    - README.md, docs/getting-started.md, docs/showcase/getting-started.html (+ search-data.js if generated)
    - tests/test_install_download_failure.py, .github/workflows/ci.yml

    ### Ambiguities / conflicts as questions
    - None
