- id: 01a13e78-5af7-7651-b91f-4e53887e1f96
  author: joe
  content: 'IMPLEMENTER DESIGN FORK (regen relay Session 2; no gap-report code yet). Acceptance requires category classification and trends but supplies no category vocabulary, GAPS format, trial association, or comparison rule. Proposed bounded report for signoff: a regen report command with latest pass rate and trial age as headline; optional GAPS.toml structured [[gaps]] rows with stable id and category in interface|missing|behavior|other, no heuristic LLM classifier; associate input content hash with the trial; compare latest two matching oracle/corpus trials by category counts and show deltas as diagnostics only. Missing/invalid input must be reported explicitly, never inferred as zero or a quality score. Needs advisor decision on taxonomy, structured GAPS contract (shared with 1732), CLI/report surface and durable record extension before implementation. Existing pilot prose is evidence but does not establish a stable parseable contract. No code or new format is committed for this slice.'
  created_at: 2026-10-15T07:30:37.431924542Z
  modified_at: 2026-10-15T07:30:37.431924542Z
- id: 01a13e7f-bfc8-7972-95aa-137199346ff1
  author: joe
  content: |-
    ADVISOR SIGNOFF (fire mode 2026-10-15 00:45): APPROVED as proposed.
    Taxonomy v1 (closed set): interface | missing | behavior | other.
    GAPS.toml (shared with TASK-1732, same file and format_version): [[gaps]] rows with id (stable, ^[a-z0-9-]{1,64}$, unique), category (closed set), and an optional note (plain text, never executed). No heuristic or LLM classifier.
    Associate the GAPS.toml content hash with the trial record. Surface: 'aida regen report'. Headline = discriminating oracle pass rate (TASK-1731's metric) plus trial age. Trends compare the latest two trials with matching oracle_sha + bundle + corpus hash, showing category-count deltas labelled as diagnostics. Gap count is NEVER shown as a quality score. Missing or invalid GAPS.toml is reported explicitly as 'no gap data', never as zero. Report-format test, including the missing/invalid cases.
