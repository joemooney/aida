title: 'Review follow-up: --once mode: PassClaim::decide calls hold_admission(root, claim, once=true). Because the c'
description: |-
  From BUG-2765
  Reviewed sha: 5f2421b51c8220f2ba2035bb3bf7140b1e493b03

  --once mode: PassClaim::decide calls hold_admission(root, claim, once=true). Because the claim is now dropped during each change's forge reads, a land/ship arriving mid-pass makes hold_admission's ensure!(!once) return an error for every later change. watch_changes_into records each one as a per-change 'refused' (record_skip with a refusal reason) and observe_dispatch_result logs a controller dispatch failure, where a clean deferral would be expected. Before this PR a --once pass could not be yielded mid-pass.
