title: 'Reap polish: scope prune to the lease''s own worktree entry, and read worktree locks from the -z listing'
description: 'Follow-up from the BUG-1657 round-6 review. Acceptance: 1. Where reap/teardown prunes a missing worktree, use ''git worktree remove --force -- <lease path>'' (scoped to that entry) instead of a repo-wide ''git worktree prune'', so another session''s temporarily unavailable worktree keeps its registration. 2. worktree_is_locked parses ''git worktree list --porcelain -z'' so paths with newlines are detected. 3. Fixture tests for both.'
