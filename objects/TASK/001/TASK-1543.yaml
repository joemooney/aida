  content: 'CORRECTION and the real blocker, 2026-09-27 20:55. My previous comment named the Windows reap failure; the operator has said Windows is not a concern right now, and Build (windows-latest) is NOT a required check (required are merge-hold-gate and Build (ubuntu-latest), and ubuntu-latest PASSES). So Windows is not what stops this. What stops it is that the APPROVED verdict does not cover the current head. Verdict on record is approved at 51221d16c2f1, but the PR head is e01a6e06e53e. A patch-id comparison (git log --cherry-mark --left-right 51221d16...origin/task-1543) shows TWO commits present in the head and absent from the approved sha, with NO equivalence marks — so this is new content, not a rebase: a853235e6b "wip: salvage task-1543" and e01a6e06e5 "fix(reap): never force-remove a worktree path that reappeared". Merging here would land two unreviewed commits, one of them a literal WIP, under an approval that predates both. That is exactly the looked-approved-but-was-not case. Needed before merge: (1) squash or rewrite the wip: salvage commit so the branch carries no WIP; (2) a fresh independent review AT the exact final head, replacing the 51221d16 verdict; (3) then clear the label-only merge-hold (no marker, no reason) and merge with --match-head-commit. Separately, the Windows reap regression stands as a real finding for whenever Windows matters again: bug_1657_removed_worktree_reaps_without_dangling_entry fails because a targeted git worktree remove cannot clear the administrative entry when the worktree directory is already gone, which repo-wide prune used to do; the scoped fix is to delete just that path entry under $GIT_COMMON_DIR/worktrees/<id>.'
