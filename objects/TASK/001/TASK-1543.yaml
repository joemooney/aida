    Mutation-proven, which is the standard this queue needs: the new test task_1543_reap_preserves_worktree_directory_that_reappears_before_registration_clear FAILS against the old force-removal code on the assertion 'reappeared worktree content must remain after reap_one'. So it genuinely pins the behaviour rather than the shape.

