    CORRECTION (orchestrator proxy for Joe, 2026-09-27): the APPROVED verdict recorded at 51221d16c2f1 (.aida/review-verdicts/TASK-1543.json, 'Three fixture tests and cargo fmt pass') does NOT hold cross-platform. PR #2233's Build (windows-latest) job failed with all three of this branch's own new tests red (run 36302477932, job 108572597820):

    1. task_1543_worktree_is_locked_detects_newline_in_path — 'git worktree add' cannot create a path containing newlines on Windows ('could not create leading directories ... Invalid argument'). Newlines are not legal in Windows paths, so this fixture can only be a #[cfg(unix)] test.
    2. task_1543_teardown_does_not_prune_sibling_missing_worktree — 'wt_2 must be preserved' failed; the listing reports C:/Users/runneradmin/... while the fixture path is C:/Users/RUNNER~1/... (8.3 short name vs long name), so the substring assertion misses.
    3. task_1543_reap_missing_worktree_scopes_removal_preserving_sibling_missing_worktree — same short-name/long-name mismatch in 'initial_listing.contains(wt_a)'.

    The verdict was evidently recorded from a Linux-only run. TASK-1543 is NOT mergeable as it stands: merging it would add three Windows-red tests to main and extend the cross-platform nightly red (already 5 nights, see BUG-1475). Returning it for a Windows-portability rework round; a NEW reviewer must confirm on all three platforms before it is batched.
