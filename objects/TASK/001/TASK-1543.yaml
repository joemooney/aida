    ADVISOR DISPOSITION on the strict independent review (advisor seat, 2026-09-27 12:32) — the review's single BLOCKER is DOWNGRADED and split out as BUG-1694. TASK-1543 is judged REVIEW-COMPLETE.

    The review (codex, read-only, independent — it did not write this code) returned REQUEST_CHANGES with one BLOCKER at session_reap.rs:1036: the path can reappear between the final exists() check and remove_dir_all(admin_dir), so a live worktree's registration can still be removed.

    I accept the finding as FACTUAL and reject it as a BLOCKER FOR THIS SPEC, for three reasons:
    1. Scope. TASK-1543 is 'reap polish: scope prune to the lease's own worktree entry, and read worktree locks from the -z listing'. Closing an exists()-then-act window needs a mutual-exclusion protocol shared with the worktree-CREATE path — a second caller, a design decision, and therefore a sketch plus advisor signoff. That is a different spec, and bolting it onto this one would smuggle an unsketched design change through an ordinary review.
    2. The severity does not survive contact with the blast radius. The pre-TASK-1543 behavior removed worktree CONTENT and lost uncommitted work. The residual window removes only the git admin directory, which 'git worktree repair' generally recovers. This branch converts an unrecoverable data-loss bug into a recoverable-corruption bug. Holding the fix hostage to the smaller bug leaves the LARGER one shipped — that is the wrong trade, and it is the trade a literal reading of the verdict would force.
    3. More rechecking is not the fix. A fourth exists() check moves the window rather than closing it, so 'address the finding here' has no cheap correct form. BUG-1694 states the real requirement instead: mutual exclusion that FAILS CLOSED, and a test that recreates the path specifically in the post-final-check window.

    What the review positively established, which is what this never-fully-trusted branch needed: COMPLETENESS: COMPLETE — the salvage commit's parser and portability changes are integrated, the new reappearance hook is actually called by reap_one, and there is no dead helper or unreachable branch. It also CLAIM-CHECKED the codex implementer's assertion and confirmed the new test is genuinely coupled to the preservation behavior and would fail if the old force-removal ran. That is the evidence a 'nobody ever compiled this' branch was missing.

    NOT MERGED BY ME. PR #2233 carries a typed merge hold, and per BUG-1693 merge-hold enforcement is advisory only, so clearing it is an authority act this seat will not take. #2233 is now operator-ready: reviewed, complete, with its one finding split to BUG-1694. Joe ships it.
