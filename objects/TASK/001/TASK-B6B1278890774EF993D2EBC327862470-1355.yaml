title: 'Mandate train check hygiene: GIT_OPTIONAL_LOCKS=0 on snapshot git, evidence=unknown on config-read failure, non-blocking history-index read (deferred from TASK-3115)'
description: |
  Deferred from the #4432 TASK-3115 rebased-head CR at b3fe0fe9 (advisor-122 ruling 2026-11-24 07:35: APPROVE, defer three p2s; filed by product-15). LOW. "mandate train check hygiene".

  ## Acceptance
  - AC1: The snapshot `git status` calls in the --check path run with GIT_OPTIONAL_LOCKS=0, so the store index is not rewritten; and a failed human-gate config read renders evidence=unknown, never evidence=read.
  - AC2: The history-index read uses O_NONBLOCK and checks is_file before reading (no blocking fs::read on a FIFO/special file). A test for each item.
