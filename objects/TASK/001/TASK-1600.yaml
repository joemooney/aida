- id: 01a10f17-ddde-77e9-bb7f-d61c4a6383f1
  author: joe
  content: 'Persistence dimension: a force-reopen does NOT stick. The drain''s exit sweep re-processed merge 2dc90ca at 02:42Z and re-completed TASK-1538 (second false completion from the SAME commit) and re-bumped STORY-1488 to Done. Any trailer in main''s history re-fires on every sweep. Mitigation applied: closure:pending tag on TASK-1538 (the closure-hold gate demonstrably stopped STORY-1488 short of Completed). The fix must make trailer-completion idempotent against an explicit reopen: a spec reopened AFTER a commit''s completion was processed must not be re-completed by re-processing that same commit.'
