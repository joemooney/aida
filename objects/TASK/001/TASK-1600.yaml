  content: 'Implementation ready for independent review: https://github.com/joemooney/aida/pull/2438 at 224c235d5e31a86b9043c65a2ab92957df446595. Both approved legs implemented. Credits come only from explicit title trailers or branch recovery and must resolve unambiguously; PR-body/mid-title prose and unrelated HEAD trailers are ignored. CLI distributed/legacy status edits and CLI/MCP rework stamp the reopen fence, with guards in live/replay candidate filtering, draft writes, completion writes, closure holds and review/forge recovery. Root-cause reproduction: completion_sha is absent-only, so a second completion retains the FIRST SHA and equality cannot block replay of the SECOND commit; closure-held Done landings can also have no completion_sha. Regression exercises both. Verification: 86 auto-bump + 103 ship + 13 completion-seam tests pass (202), cargo fmt --all -- --check and git diff --check pass. CI running at PR creation; merge-hold-gate already passed. No merge performed: advisor independently gates implementation. Files in the original pooled worktree retain the exact verified edits because its shared .git directory and role/lease symlink targets are read-only to this environment. Commit/push performed from an exact-copy writable checkout /tmp/aida-task-1600-publish; no original Git metadata, lease, or another worker''s files were forced.'
