title: Carry-over proof runs ~4 times per ship on a moved head
description: |
  After PR-2768, a ship whose head moved by a clean base merge proves the carry-over (git ls-remote origin HEAD, plus fetches of the base and any missing shas) in four places: the approval-gate preflight, the approval gate under the merge lease, the corpus-gate preflight (pr_cmd.rs ship_preflight_gates), and the corpus gate inside Forge::merge_change (merge_hold.rs enforce_corpus_gate_before_merge). This works against TASK-1966's intent. Consider passing the proof the approval gate already holds (CarryOverSite::proven) to the corpus gate, re-proving only under the lease.

  Raised in review of PR-2768: https://github.com/joemooney/aida/pull/2768
