title: 'bug_1502 parallel refusal sweep: assert the specific refusal, not just !success'
description: |
  aida-cli/tests/bug_1502_format_json_audit.rs:552-578 (TASK-1959) now runs the 521 "JSON not honoured" catalog-path refusals on up to 8 worker threads against ONE shared fixture repo/HOME. The only assertion is !out.status.success(). If a path regressed to silently succeeding when run serially, a concurrent sibling (store writer lock, cache refresh lock) could still make it fail and the test would pass. Assert the specific refusal (an unsupported --format json pin, or a clap usage error), or give each worker its own fixture.

  Raised in review of PR-2760: https://github.com/joemooney/aida/pull/2760#issuecomment-6276102322
