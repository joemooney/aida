    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit, aida-core):** `dry_run_report`/`record` take the leftover `Scope`; the CLI builds it from the same `LeftoverOwners` probe agent gc uses (shared helper). Test `task3918_retention_dry_run_holds_a_live_owners_leftovers` (leftovers_tests): a stale tomb is held (owner live) instead of reapable, and reapable when the owner is dead. CLI unit test: `retention_leftover_lines` reports held leftovers as kept, not as gc-removable.
    - **AC2 (unit, aida-core, message_state_tests):** retirement with dead-owner leftovers (empty tomb, creator staging) beside the mailbox and an admitting fresh scan retires. Finding: `fresh_scan_admits` is purely a /proc writer scan and never reads leftovers, so the refusal text cannot be caused by leftovers; the test pins that.

    ### Expected files
    - aida-core/src/mailbox_lifecycle/activation.rs, leftovers_tests.rs, message_state_tests.rs
    - aida-cli-lib/src/agent_registry_root.rs, mailbox_cmd.rs, tests/story_1843_c2_refusal_tests.rs

    ### Ambiguities / conflicts as questions
    - AC2 premise: the observed WriterAdmissionUnknown refusals come from unverified writer processes, not leftovers. Shipping the regression test plus the corrected dry-run report (which previously misattributed the problem to 460 leftovers); OK?
