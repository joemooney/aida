title: Mail-retention dry run and lane-exit retention use the scoped leftover scan, so live owners are never reported as reapable (BUG-2770 follow-up)
description: |
  Follow-up to BUG-2770 (landed 2026-11-26 05:40). Deferred by advisor-122 04:12 on #4645. Filed by product-15.

  ## Acceptance
  - AC1: the mail-retention dry run (`aida mailbox retention activate --dry-run`, activation.rs ~:234) uses the SAME scoped scan as agent gc, so it stops reporting a live owner's leftovers as reapable (it reported 460 leftovers while lanes ran on 2026-11-25).
  - AC2: a lane's exit-time mail retention no longer refuses with "the fresh writer-admission scan could not verify every mail writer" because of leftovers that belong to dead owners; a test.
