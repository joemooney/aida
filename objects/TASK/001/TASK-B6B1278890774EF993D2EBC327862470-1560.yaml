title: 'Review follow-up: Under a configured [contained] read_allowlist, sandbox_args binds only the essential paths'
description: |-
  From BUG-2784
  Reviewed sha: 9afeaa251dea1e79a3e52c7025844e32053917bb

  Under a configured [contained] read_allowlist, sandbox_args binds only the essential paths, the allowlist, the clone and main/.git. MAIN's checkout scripts/json-union-merge.py is then not visible inside the commit sandbox, so the driver always fails and every concurrent ratchet-set.json change becomes a (marker-free, see finding 1) conflict. That config is not set today. Either bind the script read-only or document the limitation.
