- id: 01a109de-9575-7674-9b30-e5440bb12906
  author: joe
  content: |
    OPERATOR DECISIONS RECORDED (Joe, 2026-10-04, via advisor session) — design confirmations resolved; scope for implementation fixed as follows.

    A — DECIDED: subject-always-at-TTY. `issue_direct` must bind the grant principal to the actual invoking identity at the TTY, never inherit a principal from ambient grant env (seat_authority.rs:150-152). Roster checks run against the subject's own ceiling. In scope for this task.

    B — DECIDED: headless advisor sub-launches stay fail-closed; no carve-out. The UX follow-up (delegation prompt in `aida role enter`) is spun out as its own task, not part of this one.

    C — RESOLVED 2026-10-04: ADR-66 amended to record per-call MCP grant revalidation (strictly tighter than the sketch's startup capture). No code change needed.

    D — DECIDED: `hold_authority_from` keeps the human-at-TTY leg as a deliberate, documented carve-out: holds are the supervision floor and emergency brake, and the brake must stay reachable by a human even when grant issuance is unhealthy. In scope: add a code comment at the leg citing the ADR-66 carve-out comment (recorded on ADR-66 today). The `|| orchestrated` leg of the same condition is NOT covered by this carve-out: the implementer must either produce a written justification on this task or route orchestrated hold authority through the validated grant like other dispatch.

    Implementation scope of this task = hygiene findings 1-5 from the description + decision A's fix + decision D's documentation/orchestrated-leg reconciliation. Drain-safe: mechanical fixes and doc/help-text updates, no architecture decisions remaining.
