    Addendum from PR #2418 round-2 CI fix (head 8f0e516f): design confirmation D.

    D. main's BUG-1793 `hold_authority_from` keeps a bare-TTY authority leg (`… || is_tty || orchestrated`), which ADR-66 removed from `advisor_authority_from` ("TTY presence only issues a seat grant; it does not bypass"). Reconcile the reasoned-hold gate with ADR-66: either drop the TTY leg so hold authority also flows only from a validated grant, or record why holds deliberately keep a human-at-TTY carve-out. Advisor's initial read: the carve-out is defensible (a human at a TTY is the supervision the hold exists to reach) but should be an explicit, documented decision, not drift.
