title: 'Contained-parent posture check: allowlist instead of denylist; --no-default-flags config gap; --cwd contained write root'
description: |-
  Non-blocking findings from the #2672 (BUG-2151) STRICT review:
  - refuse_uncontained_child_of_contained_parent is a denylist of 4 posture flags; --allowedTools, --add-dir, --mcp-config and --permission-prompt-tool still pass via -- or default_flags. Use an allowlist under a contained parent.
  - --no-default-flags skips the [agents] contained config (not reachable from a contained parent); either document it as the operator escape hatch or refuse it.
  - contained_posture() computes the write root from the process cwd, not the --cwd target.
  - codex/agy show the role picker before refusing (cosmetic).
