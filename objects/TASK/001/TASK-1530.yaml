title: 'Orchestrate skill: treat the context ceiling as a soft limit; keep the loop running through compaction instead of rotating out'
description: 'Operator decision (Joe, 2026-09-26 12:10): ''I need the context size ceiling to be a soft limit, if I am not around we need to keep working, the open list continues to grow in count.'' The orchestrate skill (aida-core/templates/skills/aida-orchestrate.md and skills-portable copy) says to rotate out at the context ceiling, which stopped all work until a human started a new session. Acceptance: 1. The skill''s Context and handoff section says the ceiling is advisory: keep running, rely on the harness''s automatic compaction, and refresh the substrate handoff after every batch so compaction loses nothing. 2. Rotation is reserved for an operator request or a genuinely broken session, and then hands off to a successor rather than stopping. 3. Edit the template masters only, then make sync-templates and make check-templates pass.'
