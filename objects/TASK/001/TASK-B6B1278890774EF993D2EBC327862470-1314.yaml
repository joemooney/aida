title: 'Review follow-up: The new AC1 regression assertion is conditional on finding the existing job and step names'
description: |-
  From BUG-2744
  Reviewed sha: ea821ddd34be72fe4f36d7ad25ca50577df3ff66

  The new AC1 regression assertion is conditional on finding the existing job and step names in AptBounds.steps() (tests/test_self_hosted_runner.py:638-657). Deleting that step or moving the apt commands into a helper lets the timeout assertion disappear while the suite still passes against the other apt steps. Require exactly one matching fast-compile install step before asserting its timeout.
