title: Align public README/overview AIDA pitch with migration positioning
description: |-
  Follow-up from TASK-0426, RE-SCOPED 2026-08-29 to the champion-product positioning (operator mandate: drop the research framing; build AIDA to win — see docs/competitive-analysis/2026-08-29-delta-champion-pivot.md).

  The TASK-0426 merge (commit ab54b89) introduced "work-in-progress infrastructure project" and "closer to a research-grade substrate" into docs/agents/porting-claude-code-to-codex.md — that is the SUPERSEDED pre-pivot posture and must not be the public voice.

  Acceptance:
  - Rewrite the AIDA positioning section in docs/agents/porting-claude-code-to-codex.md in the champion framing: AIDA is the agent-collaboration layer — stable spec IDs, typed relationships, code-to-spec traces, cross-vendor coordination (Claude Code + Codex parity) — stated as product strengths, not research hedges. No "research-grade", no "work-in-progress" identity language anywhere in the section.
  - Apply the same voice pass to README.md and OVERVIEW.md pitch paragraphs: confident product framing with PRECISE claims (alpha maturity may be stated plainly as maturity, never as identity; do not overclaim — state the precise open slice per docs/positioning conventions).
  - Employer-confidentiality rule holds: any vendor-standardization motivation stays generic, never tied to any specific employer.
  - Grep gate: after the change, `grep -riE "research-grade|research substrate" README.md OVERVIEW.md docs/agents/porting-claude-code-to-codex.md` returns nothing.
