- id: 01a13e78-515c-76a1-a291-9951a26ac585
  author: joe
  content: 'IMPLEMENTER DESIGN FORK (regen relay Session 2; no controls code yet). TASK-1730 now has the amended immutable-oracle implementation under local validation. This slice requires a new control invocation/record contract absent from its acceptance. Proposed for signoff: extend regen score with explicit --control reference|stub to run the SAME pinned oracle and emit control records, plus [regen].reference_repeats (default 3, positive). Reference roots must be independent snapshots of the pinned trusted project commit, not arbitrary user-labeled trials; alternatively advisor may approve caller-supplied reference roots with provenance explicitly unverified. Stub roots must be explicit empty/no-op systems with the same required-tool interface; how those stubs are created is unsettled. Gate ordinary score against matching oracle_sha, oracle_bundle_sha256 and corpus hash, exact same check-name set, N clean 100% reference records, one clean stub record, and clean confined execution. Preserve raw per-check R1 and compute discriminating aggregate after excluding stub-passing names; refuse an empty discriminating denominator. Any missing/stale/dirty/unconfined/nonzero-exit/guard-hit control fails closed. Need decisions on reference snapshot creation, trusted stub definition, CLI control shape, and control persistence/version before implementation. This is a new reusable record/config contract, so I will not invent it. Later independent slices will be inspected while awaiting ruling.'
  created_at: 2026-10-15T07:30:34.972147522Z
  modified_at: 2026-10-15T07:30:34.972147522Z
- id: 01a13e7f-a9f1-7220-a4fd-547c6e381062
  author: joe
  content: |-
    ADVISOR SIGNOFF (fire mode 2026-10-15 00:45): APPROVED as proposed, with these decisions.
    1. 'aida regen score --control reference|stub' runs the SAME pinned oracle bundle and emits control records (same versioned trial-record format, kind=control-reference|control-stub).
    2. Reference roots: ONLY independent snapshots of the pinned trusted project commit (exported via git, e.g. archive of oracle_sha's tree into a fresh dir per repeat). Caller-supplied reference roots are NOT accepted. [regen].reference_repeats default 3, must be >= 1.
    3. Stub root: generated by aida: an empty directory plus a no-op install (no install_command run; required_tools resolved exactly as for a trial). It is the 'do-nothing system'. No user-supplied stubs.
    4. Clean-sandbox check: each control and trial runs in a FRESH root (never reused), with the scrubbed env allow-list, and a pre-run assertion that the root contains only what was placed there. Record root_fresh=true.
    5. Gate: ordinary 'score' REFUSES to report unless control records exist matching oracle_sha + oracle_bundle_sha256 + corpus content_sha256 + identical check-name set, with the reference at 100% on every repeat and a stub run present. Refusal names the missing or failed control. Discriminating metric = checks the stub FAILS; stub-passing checks are excluded and listed.
    6. Tests: one per refusal path, plus the discriminating exclusion.
  created_at: 2026-10-15T07:38:36.401438082Z
  modified_at: 2026-10-15T07:38:36.401438082Z
