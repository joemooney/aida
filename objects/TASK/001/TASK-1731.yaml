  content: 'IMPLEMENTATION CLARIFICATION on signed stub contract: the raw scorer puts required_tools guards before system PATH; an empty stub prefix sends every tool invocation to the guard and logs guard hits, which the signed proposal says invalidate clean controls. That would make a stub control impossible for any oracle invoking required_tools. Recommended precise interpretation: aida generates no-op executables for every declared required_tool directly in fresh PREFIX/bin (each exits 0, emits no output), skips the project installer, and runs the oracle with the usual guards still behind PREFIX/bin. This is a do-nothing system with the declared interface and zero accidental fallback. Please confirm this reading, or specify how guard hits on an empty-prefix stub should participate in cleanliness. No controls code has started; #2660 final verification remains in progress.'
