title: 'Regen controls gate: reference, stub and clean-sandbox controls must pass before a trial score is reported'
description: |-
  Slice 3 of STORY-1669 (F27 + F14). Depends on slice 2.
  ## Acceptance
  - Reference control: the original system must score 100% across N repeats.
  - Stub control: hollow checks are measured and excluded from the discriminating metric.
  - Clean-sandbox check.
  - `aida regen score` refuses to report a trial until all three have passed; a test for each refusal path.
  - The discriminating metric excludes stub-passing checks (test).
