title: 'Review follow-up: [P2] Preserve smoke-failure evidence when the watch lock is busy. dev_build.rs:902-903 dis'
description: |-
  From STORY-2897
  Reviewed sha: 81cbe3ada1c6b53f5e155c698a2a61d90c062cca

  [P2] Preserve smoke-failure evidence when the watch lock is busy. dev_build.rs:902-903 discards every error from note_smoke_failure, whose zero-wait lock refusal explicitly says the failure was not recorded (main_watch.rs:1195-1201). A smoke failure concurrent with a scheduled watch pass is lost permanently; no subsequent pass can recommend the smoke-fail revert, and the build output does not even report the recording refusal. Keep the bounded try, but durably hand off the event for retry and report any failure to retain it. Add a busy-lock smoke-hook regression exercising the caller, not only note_smoke_failure without contention.
