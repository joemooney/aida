title: 'Review follow-up: already_on_base (aida-cli-lib/src/base_patch_equivalents.rs:30-43) excludes ^stop for EVER'
description: |-
  From BUG-2733
  Reviewed sha: 9e55228e4279bc1eb9672b40ae1065f6e0c93179

  already_on_base (aida-cli-lib/src/base_patch_equivalents.rs:30-43) excludes ^stop for EVERY single-parent fork point, so with several fork points (a branch merged in from a newer main) the base window starts at the NEWEST fork and landed squashes older than it are not recognized; the 2000-commit cap trims the oldest landed history too. Fail-safe direction (specs kept, not hidden), but it narrows the fix; use the oldest fork / merge-base of the stops. Add a test with two fork points.
