  content: |-
    Advisor verdict 2026-10-10 20:05: REQUEST CHANGES (round 2) on PR #2483 at 568ddc3178 (TASK-1722).

    WHAT'S RIGHT, KEEP IT: all 9 items from the 17:20 verdict are fixed, and I checked them in an independent fixture repo, not just with your tests. A placeholder tag fails V3/V4/V7. A wrong size fails ('says foo.rs=999, actual 8'). An unknown flag exits 2. The tally is real (per-check PASS/FAIL/SKIP, with 9 build SKIP without --build). The subject-based final bypass fails (FAIL 1/2/4). A real final slice that smuggles in fn evil() fails purity. A retarget: not right after a MOVE fails check 5. The 24 tests pass under 'python3 -m unittest discover scripts/split-lib/tests/' (the CI command). The diff-detected FINAL class and the wiring-only-in-its-own-file rule are right.

    BLOCKING. This is a new finding from a deeper adversarial pass, not a miss against my earlier brief. My 17:20 wording ('removed lines must reappear as added lines') is order- and location-blind, and the checker implements exactly that. That leaves it reporting PASS for changes that aren't moves:

    A. A REORDER INSIDE A MOVED BLOCK PASSES. Fixture: lib_part1 has fn grant { check_auth(ctx)?; do_write(ctx); true }. The MOVE commit creates foo.rs with do_write(ctx); BEFORE check_auth(ctx)?;. Result: 'RESULT: PASS', with purity PASS. The authorization check now runs after the write, and neither build nor tests would catch that.
       Fix: every contiguous removed hunk (as -U0 reports it) must appear as one contiguous, same-order run of lines in the commit's added text for the new module(s), ignoring whitespace-only differences consistently with your reindent handling. Blocks may land in any order relative to each other, but each block stays intact.
    B. RELOCATION BETWEEN lib*.rs FILES PASSES, AND SO DOES AN EMPTY EXTRACTION. Fixture: 'refactor(cli-lib): extract foo.rs' gives foo.rs only the header lines, removes 'let x = 1;' from fn other in lib_part2, and adds it into fn grant in lib_part1. Result: PASS (+6 -1).
       Fix: in a MOVE or FINAL commit, lib.rs and lib_part*.rs may only LOSE lines, apart from the allowed lib.rs wiring. Any non-wiring added line in lib*.rs is FAIL 3. Also FAIL 3 if a MOVE's new module receives zero non-wiring lines.

    TESTS REQUIRED: fixtures A and B must FAIL, plus a positive control where a MOVE takes two hunks from two different lib_part files, places them in foo.rs in the opposite block order, and PASSES. Keep the whole suite in the unittest discover form CI runs.

    Nothing else is outstanding. Re-request with 'PR #2483 ready for advisor review at <sha>'. I'll re-run fixtures T1–T9 plus A/B.
