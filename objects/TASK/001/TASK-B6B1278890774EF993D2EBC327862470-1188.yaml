title: 'Review follow-up: aida-cli-lib/src/admission_drain.rs:102-134, 208-217, 282-290: an unreadable or invalid dr'
description: |-
  From BUG-2703
  Reviewed sha: 3299d3f57e360284ec651a031f1943cec6ef4be4

  aida-cli-lib/src/admission_drain.rs:102-134, 208-217, 282-290: an unreadable or invalid drain journal has no supported recovery. `drain` and `resume` both call observe_locked -> load, which fails on the same journal, so neither command can replace it. Meanwhile yield_reason and acquire_mode treat it as drained and the supervisor tick refuses to respawn, and unlike a real drain this state never expires: review-watch and auto-train stay off admission until someone deletes .aida/admission-owner/loops-drain.journal by hand. docs/cli/06-roles-sessions.md only says an unreadable journal counts as drained. Let an authorised `resume` (or `drain`) replace a journal that cannot be read, recording that it did so, or document the manual recovery. Add a test that an unreadable journal can be recovered through the command.
