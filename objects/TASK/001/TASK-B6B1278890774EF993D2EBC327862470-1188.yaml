  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3246):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 363cf9809579
    Recorded: 2026-11-23T12:35:54.133826372+00:00
    Findings:
    1. aida-cli-lib/src/admission_drain.rs:60-65 and :290-298 (TASK-3246). Recovery writes recovery_resume into the version-1 journal, but the preceding reader recognizes only drain, resume and expired. The new CLI reports that both loops resumed while an already-running deputy still rejects the replacement and refuses to respawn either worker (aida-cli-lib/src/advisor_loop_service.rs:1047-1054). Rolling back also makes the recovered journal unreadable again, with no expiry for the recovery event. Keep the admission journal readable by the previous version while preserving the recovery audit, and verify the resulting journal against that reader.
    2. aida-cli-lib/src/admission_drain.rs:288-300 and :702-717. The corruption fixture covers denied resume and successful advisor resume, but never calls drain with a valid advisor grant while the journal is corrupt. Removing the drain.is_none() guard would let drain replace unreadable state with an inactive journal and would still pass these assertions. Exercise the real drain entry point with the valid advisor grant before recovery and assert that it refuses, preserves the original bytes, and leaves admission fail-closed.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-23T12:36:33.921498917Z
  modified_at: 2026-11-23T12:36:33.921498917Z
