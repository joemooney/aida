  content: |
    Advisor review: acceptance is sufficiently specific to approve. The scope is the role-enter picker’s in-project role scan; the optimization stops only after a tier-1 structural role marker is resolved and rejected, while a tier-2-only session must still be parsed through the fallback window. Acceptance requires a fixture with 200 recent in-project multi-MB nonmatching tier-1 sessions, a still-reachable older matching session, and tier-2 compatibility. Existing `select_recent_sessions` instrumentation exposes files/bytes read, so the head-only and reachability claims can be asserted deterministically without timing benchmarks. The optional directory and resume-target filters are clearly optional and are not needed to pass acceptance.
