  content: 'REWORK ROUND 1 STOP: the new no-survivors requirement cannot be guaranteed by the permitted existing helper. session::bwrap_confinement_args_inner (session.rs:2727-2782) emits filesystem binds, --proc, --chdir and --die-with-parent, but no PID namespace or descendant supervisor, and exposes no process-isolation option. A process-group kill is insufficient: controlled reproduction with the exact helper arguments plus a caller-owned new process group ran a fork+setsid installer; installer exited 0, its original group was killed, but the escaped daemon remained alive and continued writing the trial marker. Evidence: /tmp/aida-session3-1730-survivor.json (controlled daemon explicitly killed afterward). Reproduction does not modify session.rs or production argv. A setsid/reparenting descendant cannot be reliably fenced by race-prone process scans. Therefore I cannot implement item 4 or claim the new execution-environment contract with read-only reuse of this helper. Need an assigned containment-lane primitive/API or explicit authorization/design for a process-isolation capability; I will not append namespace flags, introduce cgroups/supervisors or modify session.rs on inference. #2660 returned to Draft; no new Ready/Done claim. TASK-1731 WIP is paused because it depends on this executor; it has not been pushed or called ready.'
