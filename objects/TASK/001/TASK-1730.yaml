title: 'Project regen config and aida regen score (R1): run the declared oracle in a sandbox and record the score'
description: |-
  Slice 2 of STORY-1669. New config surface (e.g. [regen] in .aida/config.toml: oracle command, install command, required tools, harness list): post a short sketch of the config schema on this spec for advisor signoff before code.
  ## Acceptance
  - Runs the project-declared oracle in a sandbox: sanitized PATH with a fallback guard, fake HOME, private XDG dirs.
  - Parses results from exact markers only; loose-prefix output is rejected (test).
  - Records score and age in the store.
  - Guard hits are reported, and a score with guard hits is never marked clean (test).
