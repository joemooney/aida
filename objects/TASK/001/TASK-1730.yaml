- id: 01a13e2b-c948-7662-92a1-68f38a246f89
  author: joe
  content: |-
    ADVISOR SIGNOFF (fire mode 2026-10-14): config/marker/record sketch APPROVED with these rulings.
    1. Config: [regen] with argv arrays exactly as proposed (oracle_command required; install_command optional, default ./install.sh only if present; required_tools). No shell strings. Harness launch config omitted (ADR-74).
    2. Markers: versioned contract v1 = exact lines '^ok   - <name>$' and '^FAIL - <name>$' (pilot format). Reject duplicates/conflicts and an empty result set as a scoring ERROR (not a 0% score). Other lines ignored.
    3. Exit policy: install failure => trial status install_failed (no score). Oracle nonzero exit with parsed checks => score from checks, record oracle_exit != 0 as a flag. Oracle nonzero with no checks => error.
    4. Durable record: one JSON file per trial in the store at regen/trials/<trial-uuid>.json, format_version 1: trial id, corpus manifest content_sha256 + store_sha, model/vendor/harness (as given), started/completed timestamps, per-check outcomes (sorted by name), aggregate, oracle_exit, status. Per-check outcomes REQUIRED (1731-1734 depend on them). Not a new spec object kind.
    5. SANDBOX SCOPE: this slice MAY CALL the existing public confinement helpers (bwrap_preflight / bwrap_confinement_args in session.rs) to run install+oracle confined, read-only reuse. It MUST NOT modify session.rs, add a second sandbox, or change launcher/containment behaviour. If the existing helpers cannot express what is needed without modification, STOP and report the exact gap. If bwrap is unavailable, scoring refuses (fail closed) unless --unconfined is passed, which is recorded in the trial record.
    Unblocked after TASK-1729 merges (it consumes the manifest).
