  author: joe
  content: 'QUARANTINE PROBE / REQUIRED STOP (per new ruling item 3). Exact helper-argument tests are in /tmp/aida-session3-1730-quarantine.json. A standalone PREFIX bind beneath private /tmp works: replacement stays counter=0 while daemon writes quarantine through 4. The CURRENT scorer layout does not: it RW-mounts the parent ScoreEnv.root and nests PREFIX beneath it. Renaming only PREFIX changes the parent directory entry visible to the old installer namespace; daemon then writes the NEW PREFIX (counter 0 -> 3), quarantine stays 0. Thus the current layout fails the promised survivor isolation. No production rework changes made. A bounded working path is available without helper edits: stage all install roots under private /tmp and make each quarantine unit an independently bound root, with no separately mounted ancestor exposing replacement entries; alternatively quarantine the whole mounted phase-root unit and recreate only the prefix inputs under its old logical path. Please approve the exact mount/root ownership layout before code; no custom mounts/namespace flags will be appended. /var/tmp standalone case denied subsequent daemon writes rather than retaining the old logical path, so it must not be assumed equivalent to private /tmp.'
  created_at: 2026-10-15T08:52:42.591406164Z
  modified_at: 2026-10-15T08:52:42.591406164Z
- id: 01a13ec8-3488-7b51-8251-097c7f1f4c4f
  author: joe
  content: 'ADVISOR RULING (02:00): your probe shows exactly the condition, so make it structural. EVERY install-phase root must be its own top-level bind, never nested inside another rw-bound root: put PREFIX (and any other install-writable dir) in sibling directories OUTSIDE ScoreEnv.root (e.g. <score-run>/trial and <score-run>/prefix, with the parent <score-run> itself NOT bound rw into either sandbox). Quarantine-rename then applies per root. Add an assertion at sandbox construction that no rw root is an ancestor or descendant of another rw root (refuse otherwise), plus a test. Re-run the fork+setsid reproduction on the real scorer layout: the new prefix and new trial counters must stay 0. #2664 (TASK-1731 controls) stays a draft until #2660 is approved; it inherits this layout.'
  created_at: 2026-10-15T08:57:50.472389949Z
  modified_at: 2026-10-15T08:57:50.472389949Z
  session_id: 20233459-56a6-48d3-8cb0-332dcfaf0277
- id: 01a13eda-14e3-7cd3-b81c-11468ac63904
  author: ai:codex:joe
  content: 'Session 4 narrow remaining execution-contract fork: the mandated fixed oracle PATH=/usr/local/bin:/usr/bin:/bin excludes the fallback-guard directory. Existing guards detect required-tool host fallback via PATH interception; unmodified source==destination helper cannot overlay them at system-tool paths. A bare required-tool call would therefore use an installed host tool without a guard event. Requested explicit advisor ruling via mailbox 55caa11d: permit immutable guard directory before fixed system entries (never PREFIX/trial entries), or define an alternative oracle-author contract. Non-nested independent-root and safe quarantine-copy implementation proceeds separately; #2660 remains Draft, no Ready/Done claim.'
  created_at: 2026-10-15T09:17:22.019586875Z
  modified_at: 2026-10-15T09:17:22.019586875Z
- id: 01a13eda-8008-7bb2-b020-f1d0e74c1fec
  author: joe
  content: 'ADVISOR RULING (02:20): ALLOW the immutable guard dir first. Oracle PATH = <frozen guard dir>:/usr/local/bin:/usr/bin:/bin. The fixed-PATH rule excludes trial-WRITABLE entries; the guard dir is aida-owned, content-addressed, hash-verified before every run and bound read-only, so it''s inside the trust boundary. Conditions: (1) no prefix or trial entry anywhere on the oracle PATH; (2) each guard logs to the inherited trusted fd, then execs the real tool by ABSOLUTE host path resolved by aida at freeze time (never a PATH re-lookup, so no recursion and no shadowing); (3) the guard set is generated from required_tools only; (4) test: a bare required-tool call from the oracle emits a guard event, and clean reflects it.'
  created_at: 2026-10-15T09:17:49.448616259Z
  modified_at: 2026-10-15T09:17:49.448616259Z
  session_id: 20233459-56a6-48d3-8cb0-332dcfaf0277
- id: 01a13ee0-591b-7d90-9beb-76de3bdd69b7
  author: ai:codex:joe
  content: 'Self-check round 2 found ordinary Python subprocess.run drops inherited fd9 by default: the required-tool guard cannot log (exit98 bad fd), but the trusted oracle can still print passing checks and exit0, producing no event. Exact bounded alternative probe /tmp/aida-session4-fifo-probe.json used unchanged helper mount order with an AIDA-owned named FIFO readonly-bound outside writable roots: default subprocess can write the evidence, empty O_TRUNC open does not erase it, unlink refuses EROFS and ftruncate refuses EINVAL. Requested advisor ruling in mail 42051dfa to use this per-run pipe channel while preserving inherited fd for survivor matching, versus adding an oracle-author pass_fds contract. No full acceptance/Ready claim.'
  created_at: 2026-10-15T09:24:12.699263720Z
  modified_at: 2026-10-15T09:24:12.699263720Z
- id: 01a13ee3-b025-7452-a4ff-52e20083d76c
  author: joe
  content: 'ADVISOR RULING (02:30), guard channel: APPROVE the named FIFO outside every writable root, in a read-only-bound dir, read by aida (replaces the inherited fd). FAIL CLOSED: if a guard can''t write its event, it exits nonzero WITHOUT exec''ing the tool, so a lost event can never coexist with a successful tool call. aida treats any guard exit code 98 or an EOF anomaly as not clean. Keep your probe as a test: the default Python subprocess.run(capture_output=True) case records the hit.'
  created_at: 2026-10-15T09:27:51.589971448Z
  modified_at: 2026-10-15T09:27:51.589971448Z
  session_id: 20233459-56a6-48d3-8cb0-332dcfaf0277
- id: 01a13ee6-28ac-7101-84ee-c2732befd967
  author: ai:codex:joe
  content: 'Implementing latest signed FIFO ruling (mail 61e1cd07) on existing draft #2660. Strengthened bounded probe additionally proved write-only FIFO permissions prevent competing-reader evidence theft: read-open EACCES, chmod/fchmod/unlink EROFS, truncate EINVAL, prior event retained (/tmp/aida-session4-fifo-permissions-probe.json). The actual FIFO read descriptor/host keepalive remain CLOEXEC; a separate inherited pipe descriptor is solely the best-effort survivor identity marker. Generated guards use FIFO locator, so ordinary Python subprocess.run does not need pass_fds. New regression and real mount tests compiling. No Ready/Done claim before current-code tests/gates/self-check.'
  created_at: 2026-10-15T09:30:33.516237958Z
  modified_at: 2026-10-15T09:30:33.516237958Z
- id: 01a13ef1-351f-70f0-834d-b201c31f6970
  author: ai:codex:joe
  content: Current final-code regen filter passed 36/36, zero failures/ignored (/tmp/aida-session4-regen-current-tests.log), including actual confined trial+PREFIX daemon isolation, raw score with detected survivors, prefix grep shadow exclusion, fresh Python home, installed absolute wrapper compatibility, default Python subprocess guard evidence, immutable guards, FIFO read/metadata/truncate denials, EOF/bounded collection, no-follow concurrent symlink swaps and absent registered-worktree overlap handling. Earlier test failures were preflight harness-cache selection and missing registered-path canonicalization; both fixed and covered. All 28 fast gates passed before the final path fix; final fast rerun and actual workspace aida dev build/smoke are running. PR remains Draft until these complete.
