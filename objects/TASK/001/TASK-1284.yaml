    REVIEW FINDINGS TO ADDRESS (PR #1957-advisor):
    Verdict: CHANGES REQUESTED
    Findings:
    1. TASK-1284 at bb08be67. The shape is right (pid + kernel start time recorded on DrainLock and Claim; decide_lock / classify_lock / decide_claim take a two-argument liveness probe; tests for same-pid-different-start). One defect blocks the merge: aida_core::liveness::process_identity_is_alive returns FALSE when the recorded start time is None or when the live start time cannot be read — the code comment calls this fail-closed, but for a LOCK HOLDER it is fail-OPEN: (a) every drain lock, drain-lock claim and process-backed session claim written by the pre-merge binary has no pid_start_time, so the first post-merge probe (aida queue work, burndown run, session reap, aida ps) reads the currently live drain as dead and RECLAIMS its lock — the double-drain hazard the lock exists to prevent (BUG-538 class), and it would trigger on the very next wave launch after this merges; (b) on any platform/path where process_start_time() returns None, every lock reads dead forever. Required: when recorded_start_time is None OR the live start time is unreadable, degrade to pid_is_alive(pid) (the pre-TASK-1284 behaviour) and never return false on missing data; only a recorded AND readable start time that DIFFERS may declare a live pid stale. Add tests: (record without start time, pid alive) → alive; (record with start time, live start unreadable) → alive; (both present, differ) → dead; (both present, equal) → alive. Non-blocking: the DrainLock/Claim JSON fixtures in drain_state tests now carry start times — also keep one fixture WITHOUT the field to lock in the compatibility path.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
