title: 'Review follow-up: Non-repair pickup modes can consume the retained lease. queue_cmd/work.rs:4954-4969 automa'
description: |-
  From BUG-2761
  Reviewed sha: 2a9f9059b3d8170886b7b80ce59efcbe4dec99c8

  Non-repair pickup modes can consume the retained lease. queue_cmd/work.rs:4954-4969 automatically selects retained repairs for --no-launch, --plan-only and --guided, and session_start.rs:3763-3784 transfers the journal and removes the predecessor. These modes skip host repair preparation and routing (queue_cmd/work.rs:6345); for --no-launch the command reports setup complete and prints a generic deferred launch with no repair instructions or host exit handler (6546-6596). A later real repair dispatch can then be blocked by the new live setup lease. Require a repair-capable launch before automatic transfer, or preserve the repair handoff through deferral with the same preparation and publication gates.
