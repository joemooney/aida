title: 'Seat occupancy: macOS process start-identity probe (proc_pidinfo PROC_PIDTBSDINFO)'
description: |
  Follow-up to TASK-1607 (STORY-1485 slice A), required by advisor condition C6 and ADR-69.

  Slice A fails closed when the seat-occupancy probe cannot read a process's start identity. On macOS the probe returns Unknown, so orchestrator-protected operations (loop starts, orchestrator spawns, queue routing, seat handoff writes) refuse there.

  Add a macOS implementation of the tri-state identity probe: read pid, parent pid, state and start time (pbi_start_tvsec/pbi_start_tvusec) via proc_pidinfo(PROC_PIDTBSDINFO). ESRCH is Dead, a zombie (SZOMB) is Dead, a differing start time is Dead (PID reuse), any other error is Unknown.

  ## Acceptance
  1. The macOS probe returns Alive/Dead/Unknown with the same evidence semantics as the Linux /proc probe.
  2. Orchestrator protected ops no longer refuse on macOS with the "unsupported platform" diagnosis; the refusal text no longer cites this spec.
  3. Unit tests cover alive, exited, zombie, PID reuse and permission-error cases on a macOS CI runner.
