  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit):** extend `is_secret_sensitive_path` in `aida-core/src/review_engine.rs` with file names `.npmrc`, `.vault-token`, `.terraformrc`, `terraform.rc`, `.dockercfg` and component pairs `.cargo/credentials`, `.cargo/credentials.toml`, `.terraform.d/credentials.tfrc.json`, `.gem/credentials`, `.config/hub`. Matching stays case-insensitive and depth-independent, so it covers root and nested paths and both separators.
    - **AC2 (unit):** one `#[test]` per new pattern, generated by a macro, each checking root, `nested/` and `a/b/` prefixes, backslash form and `classify_path_exclusion` == SecretSensitivePath, plus negatives (`.cargo/config.toml`, `docs/npmrc.md`, `terraform/main.tf`). The existing `root_and_nested_credential_paths_are_excluded` test is unchanged.

    ### Expected files
    - `aida-core/src/review_engine.rs`

    ### Ambiguities / conflicts as questions
    - Does "similar well-known token files" include `.gem/credentials`, `.dockercfg` and `.config/hub` (the gh/hub CLI token)? I am treating them as in scope because each one stores a plaintext token. I am leaving out `.yarnrc.yml`, which is usually ordinary project config.
