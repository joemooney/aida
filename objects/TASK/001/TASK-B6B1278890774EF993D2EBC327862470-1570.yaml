  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit + fixture):** `seat_preflight` refusal message gains `exit <code>` plus the last 20 lines of combined output (already bounded to 4 KiB), each line code-spanned, with key/token/secret/password/bearer assignments and >=32-char base64/hex runs redacted. The conformance harness records the tail of `stderr.txt` (where the lane's RuntimeError lands) as `report["launch"]["diagnostic"]` when the launch is not accepted.
    - **AC2 (unit):** `tests/test_containment_preflight_diag.py` loads egress_probe.py+contained_lane.py like tests/test_store_mutation.py, runs a fake probe that exits 3 printing known lines and `token=abcd...`, asserts exit code, tail, redaction; a passing probe still returns None; a zero-exit probe lacking the grant line still refuses.

    ### Expected files
    - `aida-cli-lib/src/containment/contained_lane.py`
    - `scripts/containment/conformance.py`
    - `tests/test_containment_preflight_diag.py`

    ### Ambiguities / conflicts as questions
    - None. Pass condition unchanged.
