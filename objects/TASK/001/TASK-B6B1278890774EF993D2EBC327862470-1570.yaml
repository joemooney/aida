title: Contained seat preflight refusal names the probe exit code and output tail
description: |-
  The contained lane's in-boundary seat preflight (aida-cli-lib/src/containment/contained_lane.py seat_preflight) refuses with only "contained requested-seat preflight refused" and discards the probe's output. Joe's agy conformance run on 2026-11-27 10:50 (dell1 ~/.aida/conformance-aida-agy-1795801825) passed every setup stage, including the outer seat preflight, then failed at this inner preflight, leaving no evidence of why.

  Acceptance:
  - AC1: the seat_preflight refusal names the probe's exit code and its last ~20 lines of combined stdout+stderr, code-spanned, with any secret-looking token redacted. The conformance report.json keeps it as `diagnostic` on the failing stage.
  - AC2: a test with a fake failing probe asserts the exit code, the tail lines and the redaction appear in the refusal, and that a passing probe is unchanged.

  Advisor approval 2026-11-27 11:05 (aida-d3). Standard tier; no change to the seat gate itself. After it lands, Joe reruns .aida/tmp/agy-conformance.sh once.
