title: 'Scaffold selection follow-ups: report generator''s scaffold check and the memory-lane writer should honour the saved agent selection'
description: 'Follow-up from BUG-1639 slice 1. Acceptance: 1. aida-core report generator''s scaffold check (report.rs, ~line 406) uses the project''s saved agent selection instead of the default ScaffoldConfig (thread it in from the CLI or load it in aida-core). 2. write_memory_lane_scaffolding writes .agents/skills only when Codex or Antigravity is selected. 3. Tests with fixtures prove both: a Claude-only project gets no .agents/skills from the memory-lane writer and no missing-skill report item.'
