- id: 01a104c7-e6d1-76c3-92e5-9f401abff19f
  author: joe
  content: |-
    Code Review Outcome Details:
    An independent subagent reviewed the diff prior to commit and raised 4 findings, all addressed:
    1. [Medium - Safety] The initial implementation for Item A told humans to run `merge-hold clear` then `pr ship`. The reviewer caught that doing this loses the approved-head merge pin (BUG-1532), because `clear` drops the record that `ship` relies on to pin the merge. Fixed by rewording the hint: it lists `clear` first for agents, but explicitly retains the single-step `pr ship` instruction for humans at a terminal so the pin is preserved.
    2. [Medium - Accuracy] The dry-run plan footprint (Item B) didn't clarify that the `--match-head-commit` pin is conditional, nor that a repaired `--subject` might be appended. Fixed by adding a footnote explaining this dynamic behavior.
    3. [Low - Accuracy] The GitLab dry-run note claimed it sent a specific pin, but it actually sends the MR head read at merge time and checks it. Fixed the note wording.
    4. [Low - UX] The step 5 instruction (Item C) was a ~300-character unbroken line. Added line breaks for readability.
