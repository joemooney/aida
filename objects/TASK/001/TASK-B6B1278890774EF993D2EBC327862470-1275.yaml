description: |-
  From BUG-2735
  Reviewed sha: 9b167d9eee8c1ac3c0200bf633a75d1b8f7a6c1f

  ci_probe.rs:661-670 counts the intentional budget pause toward the no-progress timer and returns NoSignal on idle expiry. A running check that normally re-arms that timer can complete during the pause and still cause phase 2 to stop with CiUnavailable (phase_driver_trait.rs:1776-1783) before the next budget reset. Keep the absolute deadline and distinguish throttled time from observed CI inactivity so the waiter can resume after the budget recovers.
