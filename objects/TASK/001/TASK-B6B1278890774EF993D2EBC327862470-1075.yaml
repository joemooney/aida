    REVIEW FINDINGS TO ADDRESS (TASK-3792):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9a33ce6ba164
    Recorded: 2026-11-19T20:43:14.644378693+00:00
    Findings:
    1. [P2; severity=p2; blocking_tier=unmet-claimed-ac] Bound the member commit-CI reader by the shared deadline. aida-cli-lib/src/pr_train_check.rs:391-405 runs the full member gate under the new scope, but LiveChecks::full_tier (pr_train.rs:2279-2285) calls GitHubForge::commit_checks (forge.rs:3135-3147), which reaches commit_ci_api (forge.rs:5545-5557). That reader discards the deadline returned by before_train_forge_call and starts a fresh COMMIT_CI_API_TIMEOUT of 30 seconds for each API page. A PR with a valid approval that reaches the full-ci gate can therefore spend 30 seconds in a stalled gh api request with --timeout 1; additional requests can start after the budget expires. The eventual check_all expiry check only changes the row after the blocking reads return. Tighten this existing runner to the remaining shared deadline, refuse spawning after expiry, and add an offline fixture reaching the full-ci step with a stalled API reader and descendant-termination assertion. TASK-3792 explicitly requires discovery and member subprocesses to share the deadline.
    2. [P2; severity=p2; blocking_tier=unmet-claimed-ac] Carry the deadline through local Git reads in the approval gate as well. In aida-cli-lib/src/gate/review_carryover.rs:946-961, deadline remains None whenever remote is None, so local merge-base/merge-tree/ancestry reads still reach kernel_deps::output_before(None), which calls unbounded Command::output. Independently, the changed approval-timestamp path (gate/approval.rs:594-615) calls kernel_deps::commit_committed_at before and after the bounded fetch; that helper (kernel_deps.rs:406-418) executes unbounded git log. A stalled git log for an existing reviewed commit blocks the ordinary train member approval gate indefinitely, without ever reaching the newly bounded fetch or returning not-checked at budget expiry. The new tests forward these local reads directly to /usr/bin/git and do not exercise this case. Propagate the same deadline through these existing gate entry points without growing the frozen inventory, and add local-log/carry-over stall fixtures. This remains a gap in TASK-3792’s claimed member-subprocess deadline, even though the newly covered worktree/origin/config discovery reads are fixed.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
