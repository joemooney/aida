    - Do not grow the gate's frozen inventory; scoped state lives in the existing runner module, not new gate edges.
    Regressions for (1) and (2) with stalled fakes. cargo fmt; check-store-writers.py; ratchets; targeted cargo run; check-ci-fast. Push.
