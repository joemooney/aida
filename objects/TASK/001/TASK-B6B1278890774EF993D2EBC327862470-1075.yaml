- id: 01a1f563-c1fd-71d1-bf3f-fa31fcafd0e7
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3792):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 64254a089e35
    Recorded: 2026-11-19T19:56:39.004920594+00:00
    Findings:
    1. Bound pipe collection by the same deadline and kill descendants after leader exit. aida-cli-lib/src/forge_lookup.rs:96 and gate/kernel_deps.rs:468 delegate to run_bounded, whose child.try_wait() success branch stops deadline monitoring. If a Git/gh wrapper forks a child holding stdout/stderr and exits immediately, bounded_process.rs:279-287 waits up to 30 seconds per pipe, and never kills that surviving process group. A one-second train check can therefore wait roughly 60 seconds and leave its descendant running. The added fixture keeps the leader in wait, so it misses this case. Preserve deadline monitoring until both streams finish, terminate outstanding group members at expiry, and add an exited-leader/inherited-pipes regression. This leaves TASK-3792's deadline and child-termination criteria unmet.
    2. Propagate the deadline through local discovery and remote-command preparation too. aida-cli-lib/src/pr_train_check.rs:297-300 scopes a deadline but calls main_worktree_root_from, which executes unbounded git worktree list --porcelain. peek_forge_kind can likewise execute unbounded git remote get-url, and both remote Git builders run configure_remote_credentials, whose configured_remote_urls uses unbounded git config before entering the bounded runner. A stalled Git wrapper or local read can therefore prevent a nonzero --timeout from ever returning rows or terminating its child. Passing a deadline only to the eventual remote command does not cover these subprocesses. Add deadline-aware existing entry points and offline stalls for worktree/origin/credential reads; do not grow the frozen gate inventory. This leaves TASK-3792's discovery/subprocess criterion unmet.
    3. Apply the shared deadline to ownership-confirmation Git reads. At aida-cli-lib/src/pr_train_check.rs:383, an existing Training ownership record invokes ownership_rider_refusal -> forge_confirmation::metadata_for. When the owning train is CLOSED or MERGED, independent ground-truth confirmation reaches forge_confirmation::base_tip and its remote fetch. forge_confirmation::git discards the Option<Instant> returned by before_train_forge_call and still uses a fresh fixed 30-second timeout, including when the shared budget is already exhausted. Subsequent confirmation reads can add further waits. A one-second member check can thus spend 30 seconds in this network fetch. Carry the remaining shared deadline through this existing confirmation runner, fail closed at expiry, and add a terminal-owning-train fixture exercising the stalled confirmation fetch. This leaves TASK-3792's member-subprocess criterion unmet.
    4. Add behavioral coverage for the changed approval-timestamp fetch path. aida-cli-lib/src/gate/approval.rs:604-614 now gets a deadline from the train checkpoint and executes through kernel_deps::output_before, but the added train-check fixture's fetch case stalls the initial member-head fetch and exits before approval_pin. Other cases stop earlier still; none constructs an approval referencing a missing commit or verifies that a timed-out approval timestamp cannot supply evidence. Add an offline missing-review-object test that reaches this fetch, proves deadline/descendant termination and unknown timestamp behavior, and includes a successful-fetch control. This changed authority-evidence path remains untested under ADR-76.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
