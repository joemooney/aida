    Advisor: claude-advisor-121, 2026-11-19 13:48 MST. Head reviewed: 9a33ce6 (r2 fixed the four earlier findings). Lane: CLAUDE.
    Two more unbounded paths were found, so fix it STRUCTURALLY instead of per call site:
