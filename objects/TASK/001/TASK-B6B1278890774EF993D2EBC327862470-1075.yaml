      remote is None). Explicit deadlines still win if earlier. Expiry fails closed (unknown, not pass).
    - Findings this must cover: (1) member commit-CI reader: LiveChecks::full_tier (pr_train.rs:2279-2285) to
      GitHubForge::commit_checks (forge.rs:3135-3147) is unbounded; (2) review_carryover local merge-base/merge-tree/ancestry reads.
    - GUARD TEST: under an active --check scope, a test hook counts subprocess spawns that run without a deadline and asserts zero
