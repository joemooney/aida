  ## Findings from PR-3979
  Reviewed sha: c5410adfab24dd3d2060a531bee9b67a70106efa

  ### finding-hash:360471e3

  Selection-audit discovery (tests/test_ci_structural_guards.py candidates()) relies on the ratchet/inventory naming convention, so source-scanning guards with other names (e.g. bug_1670 destructive_callers_do_not_use_tolerant_cache_reads, story_1728 cmdkit_framework_never_routes_through_command_registry) stay FULL-only and invisible to the audit.

  ### finding-hash:f1e29cc2

  timeout-minutes: 2 on the Build-job Rust structural ratchets step (ci.yml) is not enforced on the PR FAST path, which runs all gates inside make check-ci-fast; the test checking the key overstates the <2 min guarantee.

  ### finding-hash:8a49a174

  selected() only recognises #[path] entries under aida-cli-lib/src/(gate/)?tests/, so a future harness module from aida-core or another crate would not count as selected.
