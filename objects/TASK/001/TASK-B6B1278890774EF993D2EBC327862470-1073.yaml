  ## Findings from PR-4103
  Reviewed sha: faf6b74cf6dfa70853095c93ea26eb66748618bb

  ### finding-hash:f8c1c1f1

  is_recent_cache_ancestor (git_ops.rs:3399) caps proof at 64 first-parent commits, so a true ancestor more than 64 commits back now forces a full rebuild (~43 s on the primary) instead of the incremental refresh that merge-base used to allow (already bounded by INCREMENTAL_MAX_FILES=500). The store makes about 143 first-parent commits per hour, so a shared cache left idle for about 27 minutes pays a rebuild on its next write. Consider cat-file -e plus is_ancestor_with_timeout(...).unwrap_or(false), or a larger cap.

  ### finding-hash:305a4bf8

  bug2599_rewritten_cache_head_allows_comment_write also passes on the pre-fix code: in a tiny repo merge-base returns non-ancestor quickly, so the timeout-to-error path that caused BUG-2599 is never exercised on a write path. The write-site budget is a hard-coded 2 s with no test seam; timeout handling is covered only at helper level (Duration::ZERO test). Add a seam (e.g. the ANCESTOR_CHECK_SPAWN_DELAY pattern) so a write-path test exercises the timeout branch.


