  ## Findings from PR-3990
  Reviewed sha: 54925b1d46bf955ef6609b232b0accbe2e958e99

  ### finding-hash:6935f83d

  Per-key publication git spawns (choose_current/review_publication, ~0.15 s/key per the 2026-11-13 profile) remain on review list and the pull reconcile, so the specs ask that 2,800 keys finish in seconds and that git be O(1) per listing; neither is met or measured here (only an ignored bench). The commit trailer (BUG-2543 BUG-2551) completes both specs at merge, and no follow-up spec exists for the O(1) git work the 05:32 ruling deferred. File it, and re-measure aida pull after landing.

  ### finding-hash:2a99ebfc

  store::read_regular (aida-cli-lib/src/gate/ledger/store.rs:164) checks is_file by path, then opens without O_NONBLOCK. A FIFO swapped in between the two can still block the lossy reader, even though the doc comment says it never hangs. Opening with O_NONBLOCK|O_NOFOLLOW-free flags and then fstat-checking would close the window.


