  ## Findings from PR-3983
  Reviewed sha: cc2161c24f182358c1d82267ebac757a4ea929db

  ### finding-hash:dfed3eb6

  merge_hold_cmd.rs:952: placing a rework hold with --verdict <SPEC> still snapshots the VerdictRef (reviewed sha and seat) through read_recorded_verdict, so with two open changes under one spec it can record the other change's review. Use read_recorded_verdict_for_change(root, key, pr, head).

  ### finding-hash:76a786ef

  The hold-premise change (merge_hold_cmd.rs:631-650) has no test through premise_stale: only read_recorded_verdict_for_change is tested. Add a test where a Rework hold on change A is not flagged stale by change B's approval under the shared spec.

  ### finding-hash:7bbbf9a9

  gate/ship.rs:1109-1119: once the change has a ledger verdict, ledger_only skips the spec file entirely, even a refusal in that file at this exact head that never reached the ledger. Ledger events from another change at this head are kept (speaks_for_change), so the file and ledger paths treat same-head evidence differently. Consider keeping a spec-file record whose reviewed_sha matches head.

  ### finding-hash:4843b9fe

  Pre-existing, related: record_verdict_at_inner (gate/ledger/mod.rs:290-300) binds a spec-only aida review record SPEC to changes_for_spec().last(). With two open changes, a spec-only refusal meant for change A lands on change B's ledger, and the new reader then counts it for B (bound.number == B) whatever its head.


