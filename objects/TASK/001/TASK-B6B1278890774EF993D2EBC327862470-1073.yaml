  ## Findings from PR-3952
  Reviewed sha: 892ec22bde7b157cf2cfac428bfd7f0b46a33adb

  ### finding-hash:35d3eb09

  Each git call in HistoryIndex::current (rev-parse, rev-list --all, the anchor rev-list, the name-only log, the -G log, merge-base --independent) gets its own full AIDA_STORE_HISTORY_TIMEOUT_SECS budget, so a cold rebuild can take several budgets in total (aida-cli-lib/src/mandate_history_index.rs:158-223). Read strictly, sign-off condition 2 asks for one overall bound.

  ### finding-hash:2dfbd6d5

  Squash-merged and deleted branch tips are not reachable from main, so they stay anchors until gc prunes them. Each prune then triggers a full rebuild (both full walks). On the live store (3484 tips) the full walk comes back after every gc prune. merge-base --independent on 3484 tips measured 3.3s. Consider pruning anchors that are unreachable, or have no objects/ history, after a successful refresh.


