  ## Findings from PR-4022
  Reviewed sha: 94d87ef828e98cb6d1b61b6ed365cc607a5ba2f4

  ### finding-hash:c45fcedb

  changed_paths (land.rs:548) reads `git diff --name-only` without -z or core.quotePath=off, so a path with a non-ASCII byte comes back quoted and escaped and matches no protected entry: a new file such as `billing/é.sql` under a protected directory leaves the change eligible. Use `-z` (or `-c core.quotePath=off`) and add a test.

  ### finding-hash:5d395d55

  Carried to STORY-2805 by the advisor rulings of 2026-11-14: nothing runs promotion-check at cut or ship and nothing leads a merged change to its review; content inside a main-sync merge is not checked; --since is an unverified statement of the last cut; spec tags and effort are author-editable. STORY-2772 must not be marked complete on this slice. run_merge with --push, the tag write through `aida edit`, and the Reader/Live wiring have no test and no end-to-end run.

  ### finding-hash:5b62cb1c

  run_merge (integration_cmd.rs, the push step) returns the push error with the merge still on local `integration`; the next run refuses with local integration is not origin/integration and the operator must reset by hand. Put the branch back, or print the reset command.

  ### finding-hash:2fb703ca

  The `merged-before-review` tag can go stale: promotion-check with --tip older than origin/integration or --since past a pending merge untags a spec whose pending change is outside the range checked, and a spec whose pending change was reverted out keeps the tag because nothing removes it. Untag only when the tip is origin/integration, and untag the specs of a reverted change.

  ### finding-hash:dbd4e4d5

  docs/cli/04-git-lifecycle.md (promotion-check) says every passing change has its tag removed, but a spec keeps it while another pending change names it, and the section does not say that only an exact `git revert -m 1` with no other change clears a refusal. Also `checks = []` in the trusted config merges with no check at all; say so in the docs or refuse an empty list.


