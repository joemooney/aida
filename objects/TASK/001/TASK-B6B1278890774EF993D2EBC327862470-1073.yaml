  ## Findings from PR-4000
  Reviewed sha: 596e0a5048a4941783d1777df57bf832942810f1

  ### finding-hash:abbae117

  supervisor.rs:72 re-execs /proc/self/exe, so every restart reuses the binary image the supervisor started with; after aida dev build promotes a new live pair, a looped runner keeps restarting the old (possibly unlinked) binary until the operator restarts the loop. Consider resolving the installed aida path or documenting it.

  ### finding-hash:73e42b4b

  AC2 stderr notice (supervisor.rs:40) has no test asserting the one-line stderr output; only the runner.log half is tested.


