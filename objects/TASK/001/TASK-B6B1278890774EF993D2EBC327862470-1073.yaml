  ## Findings from PR-3972
  Reviewed sha: d6cb65736391a9e5a7f09a81c162315f2c31ae0f

  ### finding-hash:7ce2cb14

  aida-cli-lib/src/land.rs ci_of_rollup keeps the run with the greater startedAt per (workflowName, name). A rerun that is still queued may report an empty or zero startedAt, so an older FAILURE at the same head wins and the head reads CI-FAILED until the rerun starts. S2 condition 2 (only a completed failure of the latest run counts) should treat a queued or in-progress sibling as superseding, or order by completedAt/databaseId.

  ### finding-hash:6220a3dc

  aida-cli-lib/src/land.rs plain_change sets updated_at: None and most derived rows have since: None, so on the GitLab fallback no change has an age. now.rs older_than(None) is false, so the 2h unowned ATTENTION rule (F3) never fires for GitLab changes.


