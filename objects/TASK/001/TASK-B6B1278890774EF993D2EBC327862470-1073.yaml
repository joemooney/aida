  ## Findings from PR-4027
  Reviewed sha: a31c45019754f4a0a7fbf2d902c8b94fc64da747

  ### finding-hash:c239c3d3

  full_tier.rs label_plan counts any commit status in state PENDING as a run in flight. A held PR always carries the merge-hold-gate status as PENDING, so a held PR with a ci:full label left from an earlier head gets LabelPlan::Leave at re-approval and no FULL run starts. The train does not ask either while the hold stands, because typed_gate_member_with refuses a held member before full_tier_gate. The run starts only on the first train pass after clearance. Count only check runs (status not COMPLETED) on the CI workflow as in flight, or ignore the merge-hold-gate status.

  ### finding-hash:8c6f0ae6

  pr_train.rs full_tier_gate writes the train-admit-skip-full-check entry (status overridden) before the later member gates and before --max selection, so a candidate that is then refused or left out of the train still logs an override; docs/advanced/landing.md says each admission appends one entry. Write the entry after the member is selected, or word the entry and the doc as an override of the check.


