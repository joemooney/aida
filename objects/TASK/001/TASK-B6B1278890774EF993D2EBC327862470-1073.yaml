  ### finding-hash:0d56e3a6

  gate/review_freshness.rs glob(): `**` compiles to `.*` and the regex has no (?s) flag, so a changed path containing a newline never matches a freshness_strict_paths glob such as `aida-cli-lib/src/gate/**` and the PR is treated as fast. Compile with dot-matches-newline (or refuse such paths as strict) and add a case to review_watch_freshness_policy_is_closed_and_paths_raise_assurance.

  ### finding-hash:138d1871

  review_watch.rs execute_reservation: a conflict first seen by the queue-work child (protected base moves after the watcher preflight; compose_launch_prompt returns NeedsRework and the child exits non-zero) is recorded through transition(Exited) with the BUG-2450 setup conversion, so the attempt can be classed a setup failure and retried once instead of the routed Exited that the preflight path records via transition_routed.

  ### finding-hash:9b6c3c2d

  pr_cmd.rs preflight_stale_base_check_with_info fast branch: the refresh_base error and the `head moved during review preflight` ensure return before `update-ref -d` on the scratch preflight ref, so those two early exits leave the ref behind; the ordinary and conflict paths clean it up.

