  ## Findings from PR-3924
  Reviewed sha: ac90a563dabbbb791db73b6118e901255dbd05dc

  ### finding-hash:79f360e4

  queue_cmd/work.rs:4632 runs canonical_resume_branch before the STORY-2325 dead-owner reclaim sweep (work.rs:5606). An unmerged, PR-less canonical branch still leased by a proven-dead, clean owner now bails with "still has a lease" before reclaim runs, so the AC1 resume never applies after a reclaim. This is not a regression: before this PR the same case refused on branch collision after reclaim. Fix: reclaim first, or exclude reclaimable same-scope leases from the lease check.

  ### finding-hash:3975f29b

  db_reconcile.rs:2224 calls lane_recovery::reconcile_reference_in for every Refs commit in the scan window. With pre_sha=None (aida db sync --pull, pr_cmd) that window is the last 50 commits, and each call does a full storage.load() (lane_recovery.rs:117), plus forge lookups for InProgress specs. That adds repeated store loads and network calls to every sync. Fix: load once per scan, or skip non-InProgress specs using a snapshot.


