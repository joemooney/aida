  ## Findings from PR-4038
  Reviewed sha: a073b9791a16abf83fdde2c532289b923505c162

  ### finding-hash:8a372919

  store.rs:427 write_events creates the binding before the change ledger exists, and readers take no lock: a selection of the same spec racing the first append to a new change refuses once with "bound to PR-N, whose ledger is missing; run the fix command" (checked.rs:1017, :853). Retry briefly on a missing bound ledger, or create the ledger file before binding.

  ### finding-hash:d22062d4

  checked.rs:844 load_owners folds only bound changes into the ownership index; a change recovered by the full read (lost binding) is selected but its phase-3 witnesses are not folded, so a misplaced copy it would disqualify is kept.

  ### finding-hash:059e4a00

  bindings.rs:404 bootstrap adds hint entries but never removes one naming a change whose ledger does not carry the label; binding_lost (checked.rs:491) then stays true and that label reads every change ledger on each selection, with no doctor signal. Rewrite each bound label hint to exactly its bound changes, or report it in the audit.

  ### finding-hash:8a91c29a

  checked.rs:374 discovery_refusal and the doctor oversized-ledger finding recommend quarantining a ledger without saying the fix command must follow (its bindings then name a missing ledger and those specs refuse); the refusal still says it blocks every spec; bindings.rs:8 calls a binding without an event harmless, which is untrue when the ledger is missing.


