  ## Findings from PR-4015
  Reviewed sha: e15838b4c3921bbc53f0f757db24d954c753539d

  ### finding-hash:45085c26

  standing_refusal_in_head (gate/ledger/project.rs) treats a foreign refusal as superseded when the refused change's newest verdict approves, whatever commit that approval was recorded at. If the refused commit is in the judged head but the approved rework commit is not (e.g. PR-99 refused at X after merging to integration, then approved at Y, where the promotion only carries X), the carried approval rides past the refused commit. This follows the advisor ruling literally; a follow-up could require the superseding approval to be at or carried to a commit in the head.

  ### finding-hash:74641343

  The sketch listed an unbound spec refusal as a still-refuses test case; no new bug_2569 test pins it. speaks_for_change keeps unbound events by construction, so behaviour is unchanged, but a regression test would lock it in.


