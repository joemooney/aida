title: Non-blocking review findings sweep
description: |
  ## Findings from STORY-2735
  Reviewed sha: 7b7ccdf00adb0a0b772a6a6fd1a2480a772527b6

  ### finding-hash:2c7ae2ea

  [P3] .github/workflows/ci.yml:45,77: FAST check names match pr_train.rs:638 train_ci_is_shard, so seven passing FULL shards and two skipped FAST jobs display 7/9 shards passed. Readiness is unaffected. Future cleanup can rename the checks or narrow the filter and extend its fixture.


  ## Findings from PR-3971
  Reviewed sha: b39fded312b778b4a692c5a1716981b402f8c84e

  ### finding-hash:55e0cbfe

  Advisor-only gate for --rereview (work.rs check_rereview_target) trusts the AIDA_SESSION_ROLE env var rather than a verified advisor grant; any seat that sets AIDA_SESSION_ROLE=advisor can admit a re-review. Impact is limited to lifting the BUG-2530 duplicate-review refusal (no review/merge authority granted, admission is ledger-audited).

  ### finding-hash:f238ea37

  BUG-2557 asks that the admission apply when the review story changed after the verdict; the implementation does not check this mechanically (advisor judgment plus a required reason), and the related auto-queue-review Covers defect (inherited completed specs re-added) is not fixed. Both disclosed by the implementer; the Covers defect needs its own spec.


  ## Findings from BUG-2557
  Reviewed sha: b39fded312b778b4a692c5a1716981b402f8c84e

  ### finding-hash:55e0cbfe

  Advisor-only gate for --rereview (work.rs check_rereview_target) trusts the AIDA_SESSION_ROLE env var rather than a verified advisor grant; any seat that sets AIDA_SESSION_ROLE=advisor can admit a re-review. Impact is limited to lifting the BUG-2530 duplicate-review refusal (no review/merge authority granted, admission is ledger-audited).

  ### finding-hash:f238ea37

  BUG-2557 asks that the admission apply when the review story changed after the verdict; the implementation does not check this mechanically (advisor judgment plus a required reason), and the related auto-queue-review Covers defect (inherited completed specs re-added) is not fixed. Both disclosed by the implementer; the Covers defect needs its own spec.


  ## Findings from PR-3938
  Reviewed sha: 2809bc74568cee70830b3dccfd9a3963c6007ddb

  ### finding-hash:654190b6

  PR title says test(mcp): remove hard-coded temporary fixture paths, but after the merge with main the remaining diff is a containment binary-pin regression plus doc lines; retitle before squash so the landed commit subject describes the change, e.g. test(containment): reject metadata-preserving binary rewrites (Refs STORY-2593). PR body fast_gate=fail marker refers to stale head 12e20ac.


  ## Findings from PR-3970
  Reviewed sha: 6a9a2fadf50e7a6eb1cb8e41aa30f72043997ac1

  ### finding-hash:5b9e60ad

  discovery_refusal wraps every read_change error, so an aggregate budget exhaustion (total > 128 MiB) names whichever ledger the budget ran out on and suggests quarantining it, even if it is a small active change (checked.rs:432 + read_entry budget branch). Prefer naming doctor/largest files for the budget case.

  ### finding-hash:52636ea7

  quarantine_command wraps paths in single quotes without escaping embedded single quotes (checked.rs:364); a project root containing a quote yields a broken shell command.

  ### finding-hash:c7c082c2

  No test covers the doctor aggregate state over MAX_DISCOVERY_BYTES (the review-selection-unavailable label in store_repair.rs), and the reworked bug_2531 test dropped its half+1 assertion.


  ## Findings from PR-3948
  Reviewed sha: 221ec2d45f746efe44d00edb73aa1fe6ff0d1618

  ### finding-hash:5d2b67f3

  docs/internal/testing/gate-dependency-ratchet.md Follow-up filing handoff section records ephemeral seat state (a host-specific /home/dirtlab path, No child IDs exist yet); once the burn-down children are filed, replace it with their IDs


  ## Findings from PR-3968
  Reviewed sha: eea1e099ccce691971930729c83d661c7147478f

  ### finding-hash:56ed8b81

  story_2492_publication_tests.rs:1314-1315: the sleep(2100ms) + should_stop() assertion kept from main by the merge is redundant after reviewer_completion::wait has already returned via should_stop(); it adds 2.1s to the test without new coverage.


  ## Findings from BUG-2546
  Reviewed sha: eea1e099ccce691971930729c83d661c7147478f

  ### finding-hash:56ed8b81

  story_2492_publication_tests.rs:1314-1315: the sleep(2100ms) + should_stop() assertion kept from main by the merge is redundant after reviewer_completion::wait has already returned via should_stop(); it adds 2.1s to the test without new coverage.


  ## Findings from PR-3921
  Reviewed sha: d94b8ae8fc61f25702869cc5aa0a8f5e7aa8ed0b

  ### finding-hash:0cbc5c63

  PR title says isolate sccache fixtures from launcher environment, but the round-3 merge took main sccache fix and the net diff contains no sccache change (it is the legacy unknown-visibility refusal, foreign-namespace slot test, test-touched orphan-shadow fix, mail-wake umask and doc rewrap). Retitle before squash so main history describes the change.


  ## Findings from PR-3966
  Reviewed sha: f0ed9707062f6b127e73c503ff147289062fe405

  ### finding-hash:c598b8f9

  aida integration tags: promotions to main are squash merges (e.g. 82650579646 has one parent), so origin/main..origin/integration keeps every already-promoted integration commit forever (BUG-2556 commits still listed after batch 5). The "remove the tag from specs no longer ahead of main" path (integration_cmd.rs run_tags/plan_tag_changes; help text in integration_cmd_args.rs) never fires; an open multi-slice or Refs-promoted spec (e.g. STORY-2737, STORY-2749) stays/re-gets landed-in-integration after its work reached main. Fix: bound the log at the last promotion marker or compare patch-ids/tree content, and align help/docs.

  ### finding-hash:3961dae5

  The launch preflight track line (queue_cmd/work.rs handle_queue_work: eprintln "track: {launcher} (spec: {label})" via store_track_label) has no test asserting it, although the STORY-2749 description requires the preflight to list the track.


  ## Findings from PR-3973
  Reviewed sha: 46777beb1b259a466a56923f082997fc558fed8c

  ### finding-hash:198d1196

  rework_hold_release.rs with_live_io: only the pin, live_head and covered_specs reads set unread; failures in read_arming_history, read_corpus or the coverage reads become ReleaseCondition::Unmet (BLOCKED) instead of Unknown.

  ### finding-hash:c0a8d165

  land.rs Live::approval reads the approval and carry-over against refs/remotes/origin/<base>, not the pass pinned base commit (now a declared known limit).

  ### finding-hash:28356795

  land.rs Live::rounds: content_id errors on AmbiguousBase/EmptyDiff leave an unapproved change UNKNOWN on every pass instead of BLOCKED with a reason.

  ### finding-hash:6810bcf9

  land.rs:424 render: STATE column is 17 wide but READY-PENDING-COVER is 19 chars; ClearHoldAndLand prints operator clears met hold for a PendingCover row.


  ## Findings from STORY-2768
