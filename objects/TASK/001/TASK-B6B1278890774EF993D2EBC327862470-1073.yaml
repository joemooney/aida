  ## Findings from PR-3956
  Reviewed sha: 36afa067467a75d0e3201ed946f059264ee113e7

  ### finding-hash:4222a3d6

  review_launch.rs review_prompt: when launch_context fails under the fast policy the reviewer launches with the ordinary prompt and only a stderr warning; no freshness ledger event records that the review ran without current-base evidence (AC2/AC5). Record a decision such as evidence-unavailable for the head.

  ### finding-hash:8b8a3fb6

  gate/review_freshness.rs glob(): ** compiles to .* without (?s), so a changed path containing a newline never matches a freshness_strict_paths glob and the PR is treated as fast.

  ### finding-hash:1f7b8f62

  review_watch.rs execute_reservation: a conflict first seen by the queue-work child (base moves after the watcher preflight) is recorded through transition(Exited) with the BUG-2450 setup conversion, so it can be classed a setup failure and retried once instead of the routed exit transition_routed records.

  ### finding-hash:02bf8b4d

  pr_cmd.rs preflight_stale_base_check_with_info fast branch: the refresh_base error and the head-moved ensure return before update-ref -d on the scratch preflight ref, leaving it behind.

  ### finding-hash:036825d8

  gate/review_carryover.rs proved_for_refusal: the second strict-policy check (after the base refresh) returns StrictPolicy without writing the re-review-required freshness event the first check writes (AC5).

  ### finding-hash:1bf50580

  No test carries a criterion-level trace comment for the six criteria (acef95eb, ac3d0be9, ac5a9c72, ac59d017, ac984425, ac39a51c), so aida criteria reports all six untraced although each has behavioural tests in this diff. Add trace:STORY-b6b1278890774ef993d2ebc327862470-686.<ac-id> comments on those tests.

  ### finding-hash:fa83ec7a

  review_launch.rs route_rework: with several covered specs, a dispatch failure after the first subject leaves no rework-routed receipt, so the next poll dispatches queue rework again for subjects already routed. Separately, review_watch.rs watch_change skips a head with a rework-routed receipt forever, even if the protected base later stops conflicting with that same head.

  ### finding-hash:d4e2f347

  review_watch.rs Store::retain with preserve_heads (fast policy): blocking recordings on base-merge-only heads spend no round, so such heads keep being re-reviewed, and once more than 16 blocking recordings are retained the ensure fails select_with_coverage and round_for on every poll instead of routing the change to the advisor.


