  ## Findings from PR-3924
  Reviewed sha: da6f7d597ddd0bd72f93dfa330e391082a115a60

  ### finding-hash:d0b021ea

  aida-cli-lib/src/queue_cmd/work.rs canonical_resume_branch: the `still has a lease` ensure runs at pickup resolution, before the same-scope ownership reclaim sweep later in handle_queue_work. A PR-less canonical branch whose exited lane left a dead-owner lease now hard-errors without the automatic reclaim (documented as automatic), so resumption needs a manual `aida session end`. Run the lease check after the reclaim sweep, or return None for same-scope leases, and add a regression with a forge-backed fixture.

  ### finding-hash:fcb8f322

  aida-cli-lib/src/queue_cmd/work.rs canonical_branch_tip prefers the local branch and consults origin only when no local branch exists. When local residue sits at the merged head but origin carries post-merge commits pushed from another host, tip == merged head and pickup allocates a dated branch from main, omitting those commits. Compare both tips and resume when either is past the merged head.

  ### finding-hash:7d6b05ec

  aida-cli-lib/src/lane_recovery.rs reconcile_observed_in writes the `Lane exit evidence` comment before the forge lookup on every lane and session exit, including exits with an open PR, and a second `Lane recovery` comment follows when no PR is found. AC2 scopes the record to exits without an open PR; consider one comment, or skipping when an open PR is confirmed.


