  ## Findings from PR-4012
  Reviewed sha: 36ccaaeddc307d956a6032025d4aad19d3f2fa6d

  ### finding-hash:9750b6dd

  aida-core/src/test_umask.rs:19 fixture_permissions_are_private_under_ambient_group_writable_umask never establishes a group-writable ambient umask; under CI ambient 022 it passes with the init_array initializer deleted, so it cannot catch a regression off dell1. Spawn the test binary as a child with umask 002 (pre_exec or the isolated() re-exec pattern) and assert the child sees 022 (e.g. /proc/self/status Umask) and creates 0644 files.


