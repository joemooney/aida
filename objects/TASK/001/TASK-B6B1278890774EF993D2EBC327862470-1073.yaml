  ## Findings from PR-4007
  Reviewed sha: 30e4a10ed70231954a26fcbbd49c919dc958bae9

  ### finding-hash:c963d4df

  pull_store_leg_locked now captures pre_sha before committing pending changes (store_push_pull.rs:2496), so the TASK-73 print_pull_summary delta lists the local chore: sync pending changes commit as if it had landed from upstream. The collision-scan guard already checks `pending` explicitly, so pre_sha could move back after the pending commit with a separate pre-commit SHA kept for `moved`.

  ### finding-hash:45e63a87

  waiter_refuses_pull_when_remote_moves_in_flight line 382 asserts !pull_reusable(store, root, false, false), but the code repo in that fixture has no origin remote, so the assertion passes vacuously. The real code-leg veto is covered by code_remote_freshness_independently_vetoes_reuse.


