  ## Findings from PR-3956
  Reviewed sha: 352a2dbe4c8209a2b5faad48e1d59222c587cf8b

  ### finding-hash:dee3f3a7

  Review evidence files .aida/review-evidence-PR-<n>-<baseline>-<tree>.diff (gate/review_freshness.rs:303-327) are never pruned; every new head/base pair leaves a possibly multi-MB file in the primary checkout.

  ### finding-hash:bf60843e

  write_evidence now lets git truncate and rewrite the target in place (git diff --output), dropping the earlier temp+rename atomicity; a relaunch for the same PR/baseline/tree can truncate the file while an earlier reviewer is reading it (review_freshness.rs:312-317).

  ### finding-hash:97d326dd

  Store-writer ratchet blind spot: git subprocess writes via diff --output are not in GIT_WRITERS (scripts/check-store-writers.py), so the evidence-file write is invisible to the inventory. Consider classifying it or widening the vocabulary.

  ### finding-hash:15915e39

  Rework-routed receipts are keyed only by PR/head (review_freshness.rs:362-399, review_watch watch_change), so a conflict later fixed on the base alone is never re-probed for the same head.

  ### finding-hash:04ad58d8

  No watcher-level integration test drives a conflicted or evil-merge head into an actual delta-review launch, or a textual conflict into implementer rework routing (AC1 delta half, AC2 refusal half). Only helper-level delta_baseline/landed_tree tests exist.


