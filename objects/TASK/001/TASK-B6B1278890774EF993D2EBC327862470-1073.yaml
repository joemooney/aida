  ## Findings from PR-3989
  Reviewed sha: 3df4803a3af2350e80190def730f2267220abcc8

  ### finding-hash:49b64e26

  force_claim_clone_owner accepts only Dead(Absent|Exited) for lease.active_pid; a dead worker whose PID was since reused (Dead(Reused)) or that died across a reboot (Dead(Reboot)) still gets refused, so the manual session-end workaround can still be needed (aida-cli-lib/src/ownership/reader.rs:79-88). Also the fixture stores HolderRecord::refused(..) instead of a real mismatched identity record, and the raw record identity is never probed (only the clone cwd-holder check in seat_clone::destroy backs that up).


