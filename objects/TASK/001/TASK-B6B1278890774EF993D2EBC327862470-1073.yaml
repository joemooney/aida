  ## Findings from PR-4053
  Reviewed sha: 3b1384288a404f27c73f68a7b50dfac5fd47d5b6

  ### finding-hash:e95a72ea

  Read-only gap: LiveChecks::message (pr_train.rs, GitHub branch) calls pr_cmd::fetch_pr_ship_metadata_via_forge, which resolves the forge with resolve_forge_kind (pr_cmd.rs:7216) and so rewrites a stale `[forge] provider = "pure-git"` config entry during `aida pr train --check`. The handler and the approval peek use peek_forge_kind to avoid exactly this, and the PR body and docs say the config is not repaired. Route the message read (and any other forge_for/resolve_forge_kind call reached with read_only set) through the peeked kind.

  ### finding-hash:5b790bcc

  The live read-only branches have no test: pr_train_check_handler, LiveChecks::checked_corpus with read_only (verdict judged without enforce_corpus_decision arming a hold or label), LiveChecks::mandate_cover with read_only (MANDATE_NOT_ASKED and the `mandate` gate token), and the non-zero exit. The story_2824 tests script FakeChecks, so the `mandate` gate name and the no-hold-armed corpus path are verified by source reading only.

  ### finding-hash:fd4627d4

  Acceptance 2 names the STORY-2809 full-tier rule, which is not on main (PR-4027 is open). Gate::FullCi is entered and immediately left at pr_train.rs:1597-1598, so it can never be reported, and docs/cli/04-git-lifecycle.md omits it. PR-4027 adds full_tier_gate inside typed_gate_member_with, and that gate appends a skip event and requests full CI; whichever PR lands second must set at_gate(Gate::FullCi) there and make it honour read_only, or --check will write.

  ### finding-hash:d7ad1d67

  The time budget is polled only between PRs (check_all): the setup reads (default-branch lookup, PR listing, live_trains) and each PR check (several gh calls and a git fetch) are not bounded by --timeout. With the 45s default, `--check --all-open` on a repository with many open PRs is likely to report the tail as not checked and exit non-zero. `--max` is also accepted with --check and silently ignored.


