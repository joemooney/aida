  ## Findings from PR-4007
  Reviewed sha: 26a2f7666ac0b1c872c572054c277aff1657161e

  ### finding-hash:735a4b90

  record_reconcile (store_pull_coalesce.rs:301) reads the code and store HEADs after the auto-bump scan, not before. If local main moves during a running reconcile (gh pr merge in aida pr ship or a train, BUG-404 case), the watermark is written for the new HEAD although the scan never saw that commit. The post-merge aida pull (wide scan, store_push_pull.rs:3344) and db sync --pull (db_cmd.rs:733) then skip the reconcile, and the merged spec stays Done until either HEAD moves or the 15 min TTL expires. pull_reusable has the same gap: it checks containment only, so a waiter can reuse a pull whose reconcile predates the merge. Fix: capture reconcile_key before the scan and record that key; add a test that moves code HEAD between scan and record.

  ### finding-hash:cddc71c1

  pull_reusable (store_pull_coalesce.rs:233) checks the code remote with default_branch_name, but the aida pull code leg fetches and fast-forwards the current branch (store_push_pull.rs:2712-2771). On a non-default branch whose HEAD contains origin/<default>, a waiter reuses an in-flight pull even when origin/<current branch> moved after that pull fetched. Use the current branch in the freshness check.

  ### finding-hash:9d27a4fe

  A reused aida pull (handle_pull_command_coalesced, store_push_pull.rs:2655) skips mailbox_publish_snapshot, fire_schedules and mirror_sync_after_pull. Mail sent after the in-flight pull took its snapshot lives outside the store, so store_pull_reusable does not see it and it stays unpublished until the next pull or push. A reused db sync --pull also hides any conflict list the in-flight sync printed.

  ### finding-hash:376b178e

  pull_store_leg_locked captures pre_sha before committing pending changes (store_push_pull.rs:2496), so print_pull_summary lists the local chore: sync pending changes commit as if it came from upstream. Carried from round 2. Also, no test shows the aida pull store leg skipping the collision scan on a clean no-op remote; only the refusal side is tested (noop_remote_still_refuses_local_spec_id_collisions).

  ### finding-hash:3db33acc

  The post-train aida pull spin (6-14 min at 100% CPU after trains 19 and 20, advisor notes 06:17 and 06:58) happens with new upstream commits, which this PR does not bound. The wall-clock bound described in the BUG-2565 comment for commit 014bd40268 (AIDA_POST_TRAIN_PULL_TIMEOUT_SECS) is not on the PR head, so that spec comment is stale. File a separate bug for the post-train pull. The PR body is also stale: it says the env knobs were removed and lists 7 tests.


