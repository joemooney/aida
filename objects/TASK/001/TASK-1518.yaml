title: 'queue work drain: SIGTERM handler that releases the drain lock and marks leases so a stopped wave leaves no stale state'
description: 'Split from TASK-1510 (advisor Q5). When a drain wave is stopped (systemd RuntimeMaxSec or OOMPolicy=stop, or a manual stop), queue work has no SIGTERM handler, so it leaves the drain lock and leases for the next tick to reap. Add a handler that on SIGTERM stops dispatching, releases the drain lock, marks in-flight leases as interrupted (not abandoned), and exits non-zero within a bounded time. Acceptance: (1) a test sends SIGTERM to a fake drain and asserts the lock is released and the leases are marked; (2) a second SIGTERM or the timeout forces exit; (3) no behaviour change without a signal. Unix only; Windows is a no-op with a comment.'
