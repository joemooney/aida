title: 'verify constraints: reject leading // in path probes and add opt-in --fail-on-unknown'
description: 'Follow-up from the #2683 re-review (STORY-1673). (1) In constraints.rs:152, valid_path accepts ''//host/share/...''. On Windows, try_exists against a hostile shared store could open an outbound SMB connection. Reject a leading //. (2) fails_on_drift (verify_cmd.rs:98) passes unknown and invalid rows, as designed. Add an opt-in --fail-on-unknown (or --strict) so CI gates can''t go green on a host without /proc or with a typo''d block. (3) AGENTS.md still says ''six closed built-in Linux probes'', but two probes are now portable.'
