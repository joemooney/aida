title: 'Review follow-up: The new decisive path recheck at pr_cmd/mod.rs:1358 calls open_change_by_number, which sca'
description: |-
  From STORY-3038
  Reviewed sha: 369406b8ee12c6cbac47b88395cf315cce12b5ef

  The new decisive path recheck at pr_cmd/mod.rs:1358 calls open_change_by_number, which scans list_changes (pr_cmd/shipping.rs:887–900). GitHub's implementation at forge.rs:3527 leaves gh pr list at its 30-item default. A branch-resolved PR outside that page can pass initial classification and all CI, then fail with unknown paths solely because the new final lookup did not include it. Use an exact-number metadata read for the live PR and require its branch, base and head to match the evidence being evaluated. This is an additional failure point beyond the known initial numbered-ship list limitation.
