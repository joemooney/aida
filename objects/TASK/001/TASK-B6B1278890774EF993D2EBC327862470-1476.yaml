title: 'Review follow-up: base_patch_equivalents::patch_ids runs `git patch-id --stable` without `--verbatim`, so pa'
description: |-
  From BUG-2733
  Reviewed sha: efe42749706c6242f8d43f7d112fd8b05003df13

  base_patch_equivalents::patch_ids runs `git patch-id --stable` without `--verbatim`, so patch-ids ignore whitespace (and line numbers). A branch commit that differs from a main commit only in whitespace, which matters in Python, YAML or Makefiles, is treated as already on base. already_on_base then drops it from the squash body and from ship spec records, so its trailer spec misses the supervised gate and auto-completion while its real delta still lands. Trailers are self-declared, so this opens no new authority bypass, but `--stable --verbatim` would make 'already on base' exact. File: aida-cli-lib/src/base_patch_equivalents.rs:176-181.
