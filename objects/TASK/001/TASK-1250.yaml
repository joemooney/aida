title: 'aida mailbox send: accept body via --body-file/--stdin (avoid shell-substitution trap)'
description: |-
  aida mailbox send takes the message only as a positional <BODY> shell argument, so a caller must pass the whole message through the shell. When the body contains backticks or a dollar-paren, a double-quoted arg triggers command substitution and the message is corrupted before aida ever sees it (observed twice in one advisor session: a review-request mail got its backticked command names substituted, and an earlier one ran clear + an aida subcommand). This is an agent-facing papercut — agents compose rich multi-line messages and hit the quoting trap repeatedly.

  Fix: add a non-shell input path to mailbox send, e.g. --body-file <path> (read the body from a file) and/or --stdin (read the body from stdin). A caller then writes the body to a file or pipes it, sidestepping shell substitution entirely. Keep the positional <BODY> for the simple case. Mirror onto the MCP send_message tool docs if relevant. Low priority; small blast radius.
