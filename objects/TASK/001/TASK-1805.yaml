title: Test session_start's consumption of review_coexistence (explicit role + unambiguous backing re-resolution)
description: |
  TASK-1786's tests cover the QueueWorkRoleInput builder and the pure review_source_branch_conflict_decision, but not session_start.rs:1620-1632, where review_coexistence is mapped into the decision and the backing ID is re-resolved with get_requirement_unambiguous. Replacing that mapping with launch_role.as_deref(), or dropping the re-resolution, still passes every test. Add a session_start-level (or extracted-helper) test: an explicit reviewer with an ambiguous or unknown backing ID must refuse.

  Raised in review of PR-2704: https://github.com/joemooney/aida/pull/2704#issuecomment-6246426026
