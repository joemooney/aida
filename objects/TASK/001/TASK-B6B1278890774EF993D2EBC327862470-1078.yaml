title: 'STORY-2772 follow-up: exact-revert recognition after delayed approval; resolve spec identities before unmarking merged-before-review'
description: 'Split from promotion 11 (#4075 @ 0fbfcdb) round-2 review by advisor ruling 2026-11-14 23:58. (1) integration_review.rs:585-588 / integration_cmd.rs:569-573: drop_reverted considers only Finding::Pending, so after a constituent M is approved post-revert the exact revert of M becomes Unreviewed and the same snapshot is refused (fail-closed false refusal). Recognize exact reverts against all constituents incl. approved, keep the no-extra-content rule; regression: same merge/revert history, verdict missing->approved, promotion stays allowed. (2) integration_review.rs:451-465 specs_to_unmark compares raw tokens case-insensitively; origin/agreed IDs and padding aliases of one spec differ as strings, so an approved alias can untag a spec a pending change still names (visibility only: admission still refuses on the pending finding). Resolve both token sets to stored UUIDs before deciding removals; keep the mark when pending identity is uncertain; regressions for origin/agreed and padding aliases.'
