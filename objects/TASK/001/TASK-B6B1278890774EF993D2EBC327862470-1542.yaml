title: 'Review follow-up: find_verdicts retries a full JSON parse from every ''{'' in the challenger output. Adversari'
description: |-
  From BUG-2779
  Reviewed sha: a963decc80235e4a5d15b2382fd08c3dab1b58e6

  find_verdicts retries a full JSON parse from every '{' in the challenger output. Adversarial output with many '{' that each start a long, deep or unterminated value costs O(n^2) parse work. The output is bounded runner text, so this is a performance note, not a correctness or safety issue. A follow-up could cap the number of attempts or the output size.
