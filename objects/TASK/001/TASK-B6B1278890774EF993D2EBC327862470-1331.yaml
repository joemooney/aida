description: |
  STORY-3076 hardening H1 (advisor-122 ruling 2026-11-24 02:15, from the independent CR on #4506 S1, which was approved by override and merged at integration 3ecf8d43; filed by product-15). Content-selection safety in aida-core/src/review_engine.rs. Standard tier, <=150 lines. BLOCKS S2's (TASK-3862) merge; S2 may launch meanwhile. Folds in TASK-3320.

  ## Acceptance
  - AC1: (a) credential-directory exclusion matches `.aws` / `.ssh` path COMPONENTS at ANY depth, including the repo root; (b) a rename evaluates BOTH sides (old and new path) for exclusion.
  - AC2: (c) .aida runtime exclusions match EXACT components (`.aida/cache-policy.toml` stays eligible); (d) a present-but-invalid or unreadable project config (.aida/review-rules.toml) gives a contextual ERROR, defaulting only when the file is ABSENT. One test for each of (a)-(d).
