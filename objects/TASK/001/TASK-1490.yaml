title: Drain preview and drain-state member list should apply the same pickability gate as dispatch
description: |-
  Follow-up from the BUG-1608 review. auto_complete_head_candidates in queue_cmd.rs is a status-only list. It feeds drain_preview_head_members and the drain-state file's member list, so a preview or state file can still list a BlockedBy dependent that the real drain will skip. This is reporting only; dispatch is already gated.

  ## Acceptance
  - The drain preview and state-file member list use aida_core::pickability::pickability(), the same verdict as dispatch. Blocked members are shown as skipped, with their blocker.
  - A test covers a preview that includes a blocked dependent.
