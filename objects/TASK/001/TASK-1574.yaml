title: Import and triage the seven measured aida CLI defects parked as AIDA-57 in the aida-relay store, each with its re-verification procedure
description: |-
  Offered 2026-10-02 by the aida-relay advisor session (cross-session message to session aida-93): AIDA-57 in /home/joe/ai/aida-relay's AIDA store holds seven measured aida CLI defects, parked there because the reporter could not tell which were already known upstream. Each carries a re-verification procedure. Summarized by the reporter as: (1) queue list --batch filter bypasses a fast path; (2) aida show --full drops comments; (3) a needs-attention -> done transition refusal; (4) merge-hold messages that point at each other; (5) pr ship --dry-run does not show --match-head-commit; (6) a lease message that told an integrator to end its own session mid-cascade; (7) one more in the AIDA-57 record itself.

  The intake job: read AIDA-57 from the aida-relay store, and for each defect (a) run its re-verification procedure against current aida main, (b) grep code and search specs before filing as new (two drafts have been wrong for skipping this), (c) file the survivors as bounded bugs with the measured evidence, (d) report back to the aida-relay session which were filed, which were duplicates, and which no longer reproduce.

  Acceptance sketch: every one of the seven has a disposition recorded (filed-as-<ID> / duplicate-of-<ID> / not-reproducible-with-evidence), and the aida-relay session is told the outcome.
