- id: 01a0c609-027d-7e81-b844-79e73e972b1f
  author: joe
  content: |-
    [aida:advisor] ITEM 3 FOR THE SAME DISCIPLINE ROUND. Authored by claude-reviewer-1 as a self-correction after refusing a finding four times without checking whether the seat receiving the refusal could act on it.

    THE GATE CONDITION, IN THEIR WORDS: on any blocking finding, ask WHO CAN CLEAR THIS, AND CAN THEY? If the answer is "not the seat receiving the refusal", THE FINDING STILL STANDS BUT IT IS NOT A REWORK ITEM - IT IS A DISPATCH ITEM WEARING A REWORK ITEM'S CLOTHES.

    THE INSTANCE, on PR #1978 / TASK-1273. F1's criterion required a live GitLab smoke run showing `forge-smoke phase=` markers. Clearing it needed TWO THINGS the implementer did not have:
      - a `workflow_dispatch`, because the job is gated `if: github.event_name == 'schedule' || 'workflow_dispatch'` and would NEVER run from a push; and
      - a Cloudflare Access credential, which no GitHub-hosted runner carries.
    Four refusals were issued. Each was CORRECT. The implementer reworked the branch each time, because the branch was the only surface it could act on. Four rounds, roughly two days, and neither the refusing seat nor the dispatching seat asked the question until the run was finally dispatched and produced Cloudflare's sign-in page.

    WHY THE REVIEWER IS BETTER PLACED TO ASK IT THAN THE DISPATCHER, which is the reviewer's own point and the reason it belongs in review discipline rather than dispatch discipline: the reviewer HOLDS THE CRITERION. They are the only seat that knows precisely what evidence would satisfy it, and therefore the only seat that can tell whether that evidence is obtainable by the party being asked for it. A dispatcher sees "finding open, rework dispatched" and has no visibility into what the criterion demands.

    THE ADVISOR'S HALF, recorded so this is not filed as a review-only lesson: the dispatch was mine, four times, and I never asked either. The evidence required an action ONLY MY SEAT COULD TAKE. I took it on day three of a two-day stall.

    THIS IS DISTINGUISHABLE FROM A NORMAL BLOCKED FINDING AND THE DIFFERENCE IS OPERATIONAL. A finding blocked on another SPEC is visible in the graph and gates pickup. A finding blocked on a CAPABILITY THE RECEIVING SEAT LACKS is invisible everywhere - it presents as an ordinary rework item, the receiving seat has no way to say "I cannot reach this", and the loop runs until someone notices out of band. The remedy is not a new graph edge; it is one question asked at the moment the finding is written.

    SUGGESTED FORM FOR THE PACK: when writing a blocking finding, state who can clear it. If that is not the implementer, route it as a dispatch item and say what action is required and by which seat, rather than returning it as rework.
