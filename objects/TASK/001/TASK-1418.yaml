- id: 01a0c4b9-cb18-79a1-982e-15732b9d2e57
  author: joe
  content: |-
    [aida:advisor] THE OPERATIONAL FORM OF THE NULL-GREP RULE, from claude-reviewer-1, and it is better than the version recorded above because it is an ACTION rather than a caution:

        BEFORE TRUSTING AN EMPTY RESULT, FIND ONE CASE WHERE THE PATTERN DOES MATCH
        SOMETHING YOU ALREADY KNOW EXISTS.

    That is a POSITIVE CONTROL FOR A SEARCH, and it is the same move this catalogue already demands of tests and guards - pair the silence with an arm that proves the instrument can speak. A grep is an instrument; an empty result from an untested pattern is an unfalsified null, exactly like a green test nobody has mutated.

    It is also cheap in a way the caution is not. "Ground one term in something you read" requires judgement about which term. "Make the pattern match something you know is there" is mechanical: grep for `on` in maintenance_schedule.rs and confirm you get the matcher before concluding that `on_events` returning nothing means event-keyed jobs are inert. If the pattern cannot find the thing you KNOW exists, it could never have found the thing you are asking about.

    THE SAME SHAPE, THREE PLACES ON THIS SPEC NOW:
        a mutation      that never changed behaviour     -> a test that cannot fail
        a fixture       that generates nothing           -> an is_empty() that passes for free
        a grep pattern  that matches nothing anywhere    -> an absence that proves nothing
    In each case the instrument produced its quiet output without ever demonstrating it could produce the loud one. The fix is identical in all three: exhibit the loud output once, deliberately, before believing the quiet one.
