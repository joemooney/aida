title: 'Shift tick: persist the wave pid before emitting the event, and count a pid-less wave once its drain lock is observed'
description: |-
  Follow-up from the STORY-1218 slice 1 re-review. A scheduler kill landing between spawn_wave and the post-pid state save leaves a running wave that is not counted toward waves-per-day, the per-spec cap, or the no-progress breaker. The drain lock still prevents concurrency.

  ## Acceptance
  - State is saved immediately after the pid is recorded, before the ShiftTick event is emitted.
  - A pending intent with no pid whose drain lock is observed live is counted as launched.
  - A test covers the kill-after-spawn window being counted.
