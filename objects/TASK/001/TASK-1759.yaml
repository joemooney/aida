title: 'store_hooks: group-writable hooks dir accepted when the group is the user''s primary group, which may be a shared group'
description: 'From the STRICT review of #2541. store_hooks.rs:41 (1a917fc7cd) accepts g+w when the gid equals the user''s primary gid. On distros with a shared ''users'' primary group, another local user could replace the pinned hooks. This is local multi-user risk, not a sandbox escape. Fix: also require that the group has no other members, or simply require no g+w.'
