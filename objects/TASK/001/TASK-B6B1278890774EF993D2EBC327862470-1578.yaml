title: 'Review follow-up: Reconciler admission mismatch: forge_head treats a change as blocked only when the forge r'
description: |-
  From BUG-2785
  Reviewed sha: 3d7f80b08c8bb1c37284131b4705a0ec06decbac

  Reconciler admission mismatch: forge_head treats a change as blocked only when the forge reports mergeable=Known(false) or the head commit's CI aggregate is Failed, while land.rs decides Conflict by a local `git merge-tree` against the pinned base and CiFailed from the ci_base rollup. When GitHub's mergeable is still Unknown (lazily computed after a base move) the reconciler's conflict rework of an approved PR is refused at launch; it self-heals on a later pass but burns lane launches. forge_head's blocked mapping is also untested. Consider passing the reconciler's reason through or treating Unknown mergeability as not-proven-landable.
