  3) Pin how untimed transcript lines affect last_activity_minute (mutant M13 survives, but only makes the check stricter), or make them count on purpose.
  4) Mutants M8/M9 (rank tiebreak) are equivalent for trip/clear; only the seat label can differ. Optionally pin the label.
