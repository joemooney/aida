title: CI-fix and quiet-burndown child grants are not stamped on a lease, so a launcher crash leaves them live until parent expiry
description: |
  PR-2692 (BUG-2165) mints child grants for the orchestrator CI-fix child (phase_driver_trait.rs run_ci_fix, ~L3736) and the quiet burndown child (burndown_run.rs handle_burndown_run, ~L601). Both revoke the grant only in-process after the child exits. Neither calls stamp_lease_child_grant_at (session.rs:3602), so if the launcher is killed mid-child, the lease-end/reap revocation (revoke_lease_child_grant) never fires. The grant then stays live until its parent expires. The queue-work path (BUG-2139) stamps the lease. The verbose burndown path already had this gap before this PR. Not a blocker: the grant is still implementer-only with no delegable seats, and it expires with its parent.

  Raised in review of PR-2692: https://github.com/joemooney/aida/pull/2692
