title: aida comment add has no file/stdin input, so every long comment routes through $(cat) — which posts an empty comment and exits 0 when the file is missing
description: |
  `aida add` accepts `--description-from-file <PATH>` and `--description-stdin`, but `aida comment add` accepts only a positional CONTENT argument. Every multi-paragraph comment — rework briefs, design notes, verdict relays, anything containing backticks or `$` — must therefore go through `aida comment add <ID> "$(cat file)"`.

  That works, but it is a trap with two teeth:

  1. The guard is invisible. `"$(cat missing-file)"` posts an EMPTY comment and exits 0. A rework brief that silently posts as nothing is worse than one that fails, because the drain requeues against a brief that is not there. Callers have to remember `test -s "$F" &&` every time.
  2. The surfaces disagree. An agent that has learned `--description-from-file` on `add` reasonably tries `--body-file` on `comment add` and gets a clap error, which costs a round trip and teaches nothing about the right form.

  Comments are where the long-form text actually goes — briefs are routinely 50-100 lines. The file-input affordance is on the surface that needs it least.

  Acceptance:
  - `aida comment add <ID> --body-file <PATH>` posts the file's contents verbatim and errors non-zero if the path is missing or the file is empty.
  - `aida comment add <ID> --body-stdin` reads stdin; errors non-zero on empty stdin.
  - The positional CONTENT argument keeps working unchanged; supplying more than one input source is a clap conflict, not a silent precedence rule.
  - Flag names match the shape a caller who knows `aida add` would guess, or `aida add`'s existing names are accepted as aliases, so the two surfaces stop disagreeing.
