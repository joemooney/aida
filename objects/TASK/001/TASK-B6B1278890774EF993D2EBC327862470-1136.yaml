- id: 01a1fae5-16d4-7b63-927c-5c2fa94b60c0
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3827):
    Verdict: CHANGES REQUESTED
    Reviewed commit: dc2c2ee634dd
    Recorded: 2026-11-20T21:34:56.671616437+00:00
    Findings:
    1. AC2 amendment: host_lines still counts pass.foreign_lanes and substitutes zero when a configured host has no visible claim. SSH reads memory only. It cannot distinguish seven running lanes from two visible claims, show the observation age, or suppress STUCK-REWORK for a spec held there. Use fresh host-reported counts and ownership for classification and display their age.
    2. The advisor's corrected scope retained cause naming for STUCK-REVIEW. The report still has no evidence path for a busy watcher or a stale reviewer worktree/lease. Include the observed cause, or mark it unknown when evidence is unavailable. Filing a follow-up did not change this completing trailer.
    3. read_pr_failures only considers currently red heads. A PR test that failed and reran green between polls is invisible. A head is also marked read as soon as any failed job was read, even if another job is pending or another attempt on the same commit fails later. Track workflow/job attempts under the full SHA and read newly finished attempts independently of current rollup color. The eight-character rerun_key can also collide.
    4. read_base_failures retroactively marks every earlier failed attempt as a flake once the latest attempt succeeds. One test failing on attempts 1 and 2 then passing on 3 is reported as a recurrence even though no green preceded the second failure. Store the confirming green attempt/time, compare it with the recurring failure time, and link the specific failed attempt.
    5. The collection window is anchored to scan time. A main failure 24h05m ago and PR failure 10m ago are within 24h of one another, yet base_failed can suppress the PR read even with the main failure already in memory. Collect enough history to cover both halves of a valid pair and compare event times.
    6. History can be silently lost: only the most recent four failed attempts per run, first 100 listed runs and first page of jobs/checks are considered. Per-pass budgets also restart at the same oldest unread attempts or first red heads after persistent log errors, starving the rest. Page or checkpoint within the time budget, rotate retry work, and report incomplete coverage.
    7. Gh::job_tests feeds recurrence detection from extract_failure_lines, a 40-line display excerpt that includes panic messages and annotations. A failing test later in the same log is lost and the attempt is cached as complete. Extract test identities independently of the display excerpt or record truncation and retry.
    8. AC7c sees only receipts in the observing clone. A failed remote launch without a subsequent claim produces no LANE-OUTCOME on the scheduled host. Collect finished remote attempts with their launch seat, exit and follow-up evidence or provide an equivalent verified per-host scheduling and delivery path.
    9. Both the loader and classifier discard unresolved exits after 24 hours. A missed day of scheduled checks loses the wake permanently, and a configured wait of 1440 minutes or more can never produce a stall. Retain unresolved exits until followed up or durably routed.
    10. F6 loses real post-exit routing. events::read_all reads only the live file, so rotation hides a recent route. routing also omits the supervisor's ReclassifiedNeedsHuman handoff. Consult the rotated window and recognize that explicit human-triage event.
    11. queue_entries silently converts directory, entry, file and YAML errors into absence. An unreadable queue can therefore trigger a false 'nothing ... queued' wake. recorded similarly treats inaccessible receipt directories and enumeration errors as empty. Distinguish missing from unreadable and propagate uncertainty before routing.
    12. launch_seat explicitly reroutes a recorded operator launch to product. AC7c requires the launching seat when known. Preserve that destination and distinguish its lane-outcome prompt from the operator's no-landings escalation.
    13. F7 uses list_claims, which discards malformed or unreadable TOML and the actual filename, then reconstructs a path from scope. implementer_claims instead refuses admission on unreadable entries and scans legacy filenames. Inventory the real path and read status so blockers can be identified even when payload and filename disagree.
    14. implementer_admission_refuses excludes review_verb and process_backed records categorically and spec_open drops unresolved scopes. Actual implementer_claims checks all scope-matching records with canonical identity and falls back to literal identity on unknown scopes. A stale matching reservation can refuse pickup indefinitely while the report is empty. Share admission's actual decision and identity resolution.
    15. local_lease_facts labels unknown-owner leases unhealable without checking the doctor's merged-branch evidence. doctor_root includes branch_merged among stale-lease candidates. Use the same healer decision for the observed lease, and preserve unknown when a necessary observation fails.
    16. lock_claim_views uses !local_claim_process_is_dead where acquire_lock_claim uses process_identity_is_alive. They differ for a reused PID with a legacy tick-only stamp. The guard can route an unreleasable-lock warning for a lock admission would immediately reclaim. Share the actual lock decision and cover legacy identity mismatch.
    17. A remote blocking claim becomes 'dead' after TTL plus the remote threshold even when its worker is still running. The claim heartbeat is not refreshed and holder_of has no foreign process evidence. Keep unreachable owners unknown, and use fresh host liveness before recommending release. For local legacy locks the test also describes a live PID without an identity stamp as not running.
    18. other_stalls falls back to root/.aida-store and calls Storage::load. With no distributed directory, the YAML backend creates an empty regular file at that path, so an observational command can obstruct future store attachment and report an empty store on legacy projects. Resolve the existing backend read-only or return unknown.
    19. The new automatic SSH destination comes from working-tree config read by scan_and_route. A modified checkout can direct a background host-authenticated SSH connection to a different known host. Alias syntax validation and StrictHostKeyChecking do not establish that the operator authorized that endpoint for this project. Bind the destination list to trusted policy and explicitly disable agent and X11 forwarding for this probe.
    20. lane_worker_may_be_running reads an unbounded path below a clone root supplied by a shared record. A nonregular or oversized lane record can block the scheduled guard or exhaust memory. recorded has the same unrestricted read for receipt files. Require bounded regular-file reads and surface invalid evidence.
    21. Policy accepts any positive TOML i64 for flake_window_hours and lane_outcome_mins. Duration::hours/minutes and doubling the retention window can overflow and panic during normal reporting. Validate representable bounds or use checked arithmetic.
    22. A missing completion timestamp becomes updated_at or now. That can move an old failure after a qualifying flake and route a false recurrence. Keep unknown timestamps out of ordering decisions and expose the missing evidence.
    23. holder_of embeds unbounded shared lease_id and error text directly in a routed message. The invalid-ID error path still interpolates the original ID, so whitespace/control characters bypass the intended single-line quoting. Bound and sanitize all routed fields, including actual record paths.
    24. Each tick reads and sorts all historical receipts and scans all historical attempt identities against the store before applying the horizon. FollowUps::after scans that whole vector again for every recent exit. Bound or incrementally index receipt ingestion and key follow-ups by canonical spec so work does not grow with all prior launches.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
