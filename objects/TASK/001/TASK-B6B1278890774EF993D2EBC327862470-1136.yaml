description: |
  Follow-up slice of STORY-2906 (throughput guard): the AC7 classes deferred from #4372 by advisor ruling 2026-11-20 10:22, carrying the round-1 review findings:
  - AC7b MAIN-FLAKE-RECURRENCE: collect failures from ANY PR independent of approval (F4); a failed attempt that is green on rerun still counts as a failure occurrence for recurrence (F5).
  - AC7c LANE-OUTCOME: treat an explicit post-exit routing event or queued work as follow-up, so no false "nothing routed it" (F6).
  - AC7d STALE-CLAIM: inventory all admission-blocking shared records (coordination leases plus drain/solo lock claims via list_lock_claims), and do not drop an unresolved blocker just for age (F7).
  Each comes with regressions. Builds on the STORY-2906 guard once #4372 lands. Vendor-neutral. Claude lane, standard review.
