  content: |-
    [rework round 2] PR #2003 — CHANGES REQUESTED, three findings. Two of them are the same class, and that class has now appeared six times tonight. Stating them as numbered requirements.

    REQUIREMENT 1 — FILTER ON THE TYPE, NOT A PROXY FOR IT.
    `criteria_gate::untraced_lines` filters with `row.tests.is_empty()` instead of `CriterionState::Untraced`. A post-deployment criterion legitimately has zero tests, so the proxy classifies it as untraced and `reviewer_prompt_block` re-labels it — which is exactly what this spec exists to stop.

    `tests.is_empty()` is a fact ABOUT a criterion; `CriterionState::Untraced` is the JUDGEMENT the type already encodes. The whole point of introducing the state was that "has no tests" and "is untraced" are different things for exactly this case. Match the variant.

    REQUIREMENT 2 — DO NOT DETECT A CATEGORY BY MATCHING THE WORD FOR IT.
    `is_post_deployment_criterion` treats any occurrence of the bare substring `post-deployment` as an outcome criterion. So `aida criteria TASK-1293 --json` labels TASK-1293.ac1c7c47 and TASK-1293.ac595b58 as post-deployment — because this spec's own criteria discuss post-deployment criteria. The detector fires on its own subject matter.

    That is not an edge case, it is the predictable failure: any spec ABOUT a category will mention that category's name in criteria that are not members of it. A convention doc, a discipline entry, a follow-up spec — all of them trip it.

    Decide what actually marks a criterion as post-deployment and encode THAT. Candidates: an explicit marker in the criterion, a structural property (it references a state only reachable after merge), or a field. Whatever you choose, the test must include a criterion that MENTIONS post-deployment without being one — this spec's own ac1c7c47 is that fixture and it is already failing.

    THE CLASS, because it is worth seeing rather than fixing six times. Tonight: BUG-1295 (orchestrator matched `pr rebase` prose), BUG-1297 (ambiguous vs not-found by error text), BUG-1310 (external tool prose), BUG-1316's own fix (hold detected by matching the refusal sentence), BUG-1424 (per-commit proxy for a cumulative question), and now these two. Every one is a decision made by matching a string or a proxy when a type was available or constructible. Every one is reasonable-looking code. I have filed STORY-1382 proposing a ratchet rule so the seventh is refused mechanically.

    REQUIREMENT 3 — TRACE THE THREE CRITERIA.
    All three criterion IDs in the supplied untraced list still have no criterion-qualified tests: acb68aa3 to the scaffolded discipline content, ac1c7c47 to the pure and mixed traced/untraced/post-deployment cases, ac595b58 likewise. This spec ships the gate that reports untraced criteria; shipping it with its own criteria untraced is the same shape as the two findings above — the tool not applied to itself.

    Note the drain retagged this onto the live batch after it was stranded twice, and it came back reworked within minutes. The mechanism is working; these are content findings, not process ones.

    Push fixups to the existing branch. Do not open a new PR.
