title: 'Review follow-up: The new plain-check mandate path can overrun --timeout. aida-cli-lib/src/pr_train.rs:2251 '
description: |-
  From TASK-3115
  Reviewed sha: 5d32993516df48bf679c28db590822c4724702b9

  The new plain-check mandate path can overrun --timeout. aida-cli-lib/src/pr_train.rs:2251 reaches have_ship_refs_locally's raw Git status/output calls and the fallback fetch in aida-cli-lib/src/gate/mandate_ship.rs:667-670,1121-1145 and aida-cli-lib/src/pr_service.rs:545-565. Mandate trace and snapshot Git calls also bypass the scoped deadline (aida-cli-lib/src/gate/mandate_traces.rs:51-58,652-674), and store retries have their own independent query budget and backoff. check_all only discards a late result after the call returns. A stalled Git child therefore holds the report past the documented deadline. Apply the remaining deadline to preview Git commands and retries, and cover a stalled mandate-only subprocess through the report entry point.
