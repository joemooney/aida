title: 'Review follow-up: aida-cli-lib/src/codex_bg_receipt.rs:334–344: The recovery operand matcher rejects support'
description: |-
  From BUG-2747
  Reviewed sha: ed120e3245ca0e75fe8b4bc97d863e8d734432d3

  aida-cli-lib/src/codex_bg_receipt.rs:334–344: The recovery operand matcher rejects supported global options such as --canonical-ids and --format. The CLI accepts them before agent or after the recovery subcommand (aida-cmdkit/src/cmdkit.rs:96–104). In either position, the occupancy scan counts the recovery process's own UUID as holder evidence, so both recover-launch and --retire-unknown refuse even when no independent occupant exists. Recognize the parsed recovery operand with supported global options while retaining executable identity and checks for independent UUID evidence. Cover a valid flagged invocation and a UUID appearing outside the recovery operand.
