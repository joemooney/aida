    INTEGRATION PRE-CHECK PR-4558 @ dfdc2a82a9 (integration-30): PASS. 1 file (review_watch.rs), +83/-16. merge-tree is clean vs integration afbea08b75a (the branch base is 48f3c087305; H2b's files don't overlap).
    AC1: promote_approved_heads re-reads the PR (repo.change) before consuming an intent. It skips if the head or base moved since discovery, re-checks inside the edit closure, and writes the receipt only if the head and base are still current. Settlement now comes from the workflow run's status and conclusion (tier_runs::outcome/bucket), not the marker's run_in_progress.
    AC2: each 'ci-tier: fast' run is fetched by id. Its identity (id, head_sha) must match, event must be pull_request, and pull_requests must be exactly [this PR targeting this base].
    Tests: stale snapshot, absent, queued, in_progress, foreign owner, retargeted base, missing conclusion (error), moved head (error), done, again.
    OBSERVATION (not blocking): GitHub lists every open PR with a matching head in a run's pull_requests. Two PRs sharing a head therefore never settle, and FULL is never requested for them. This fails closed, the same uniquely-associated rule #4408 uses in forge_tier_runs.rs:150, so it is consistent with train admission.
    Cost: about 2-3 extra gh reads per pending intent per 2-minute tick, only while an intent is pending. No new git calls, and forge reads go through the existing pinned paths. READY after FAST.
