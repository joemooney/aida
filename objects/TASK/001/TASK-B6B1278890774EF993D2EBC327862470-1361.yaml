title: 'ci:full intent: re-read head before recording, settle on workflow conclusion, key FAST marker by PR+base (BUG-2729 follow-up)'
description: |
  Follow-up from #4425 BUG-2729 r2 (advisor-122 OVERRIDE ruling 2026-11-24 09:40; filed by product-15). MEDIUM. All three degrade to today's behaviour (an early ci:full), so they were not blocking.

  ## Acceptance
  - AC1: When recording ci:full intent, RE-READ the PR head and skip if it moved since the snapshot (head-snapshot-then-verdict race). Use the workflow run's CONCLUSION, not the marker's run_in_progress flag, to decide settlement.
  - AC2: Key the FAST marker by PR number + base, not by SHA+name alone, so PRs sharing a head cannot match each other's marker. A test for each of the three cases.
