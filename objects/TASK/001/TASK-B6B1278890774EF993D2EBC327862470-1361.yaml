    ## Implementer self-review
    Reviewed HEAD: 48f3c087305d2d3aa11251a0c6db6936e56bf7e4 plus native worktree diff. AC1: [evidence: behavioral-test] review_watch.rs:3739 rechecks discovery before consuming a verdict and checks again at label edit. The stale and moved fixture cases exercise both boundaries. review_watch.rs:3704 uses the Actions workflow conclusion. The missing-conclusion case refuses a completed marker. AC2: [evidence: behavioral-test] review_watch.rs:3699 matches a single owner by PR number and exact base. Foreign PR and retargeted base fixture cases precede a matching positive control. Reviewed empty and multiple rows, repeated IDs, malformed conclusion, SHA comparison, and movement between reads. Preserved the late-move refusal test during self-review. GitHub label edits have no atomic head precondition. No ratchet edits or new authority. git diff --check passed. Lane validation in progress.
