title: 'Review follow-up: check_draft_file checks symlink_metadata and then reopens the path with an unbounded read_'
description: |-
  From BUG-2707
  Reviewed sha: acb62fdfa138cdb6c736d49d4b6ef3f8be4b4886

  check_draft_file checks symlink_metadata and then reopens the path with an unbounded read_to_string. Replacement or growth between those operations defeats the regular-file and size checks and can hang or exhaust the reviewer. Open once with the existing no-follow/nonblocking reader, check the opened handle and limit the read to LIMIT + 1 as LaunchDraft::read does.
