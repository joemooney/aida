title: 'Arch: every grant read goes through seat_authority::grant_check (9 modules read AIDA_SESSION_GRANT directly)'
description: |-
  ## Problem
  BUG-2011 existed because two functions validated grants differently. The grant env var is still read directly in 9 modules, so a third validator can appear at any time.

  ## Evidence
  38 references to GRANT_ENV/AIDA_SESSION_GRANT outside tests, across session.rs, burndown_run.rs, team.rs, questions.rs, advisor_code_gate.rs, agent_launch.rs, autopilot_intake.rs and test_env.rs, besides seat_authority.rs. Readers in seat_authority.rs: grant_check:258, current_grant:328, session_grant_lookup:420, display_grant_lookup:457, session_grant_expiry:499.

  ## Proposed improvement
  Make the env var private to seat_authority.rs. Other modules either forward the handle to a child (through the LaunchContext of the one-launcher task) or ask grant_check. Add a guard test that bans the literal outside seat_authority.rs and the launcher.

  ## Risk
  Authority code: strict tier, needs ADR-75 (b) signoff.

  ## Effort
  Small-medium; it follows the one-launcher task's LaunchContext.
