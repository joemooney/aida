title: Plot historical AIDA codebase growth with Tokei buckets
description: |-
  Create a repeatable historical code-growth analysis for AIDA using tracked git snapshots and Tokei JSON output.

  ## Acceptance
  - Sample first-parent main history at a configurable cadence and include the current tip.
  - Classify every tracked file into exactly one documented path-based bucket, including separate Web UI and TUI buckets.
  - Preserve production, tests/automation, documentation, packaging/integration, and uncategorized totals without double counting.
  - Emit machine-readable CSV and JSON with revision/date/bucket/language/code/comments/blanks/lines/file counts.
  - Emit presentation-ready charts showing stacked production growth and supporting-corpus growth.
  - Validate current-tip totals against a direct Tokei run and document assumptions, exclusions, and rerun commands.
