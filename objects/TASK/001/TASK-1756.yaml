title: Pin runaway-seat transcript-age display paths with tests (follow-up from BUG-1962 review)
description: |
  Follow-up from PR #2598 (BUG-1962) round-2 review at 28dbe03cd6, moved out of the PR by advisor tier ruling: these surviving mutations are on display-only code in aida-cli-lib/src/runaway_seats.rs. The transcript age feeds only the "transcript last written ..." label; judge() trips without it.
  1. L367: the persisted last_written_at is never read back (`skip_deserializing` survives). Add an incremental-scan test: scan 1 at :50s; append an earlier-stamped (:30s) compaction; scan 2 reports an age from the persisted :50s. Or add a serde round-trip test.
  2. L629: the mtime branch `prev.max(mtime)` -> `min` survives. Add a fold test: a timed line at t, then an untimed line with a later mtime, gives the mtime; an earlier mtime keeps the previous value.
  3. L782: the scan_file mtime wiring (passing None) survives. Add a scan-level test with the file mtime pinned via File::set_modified.
  4. L812-831: the format_age branches are unpinned. Add a unit test at -1s, 59s, 60s, 59m59s, 1h, 23h59m and 24h.
  5. L877: the resolved-seat summary label is unpinned. Add a test asserting "pid N, transcript last written ...".
