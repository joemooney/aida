title: A shelve records against the spec the verdict is about, or marks the attribution uncertain - never silently the lease's spec
description: |
  Split from BUG-1510 (2026-09-22) at the operator's request. BUG-1510 AC1 (dispatch-time lease-vs-brief compare) is on branch claude/bug-1510 @ 0d3597cb2b; this task is containment for when that check fails anyway. Incident: STORY-1391's drain drove PR #2043, whose commits were trailered BUG-1420; the RequestChanges verdict (TASK-1289/BUG-1420 findings) was shelved onto STORY-1391. Read BUG-1510 for the full timeline. Not in scope: BUG-1507 (fail-open preflight decide), BUG-1505 (verdict-store full replace).

  Acceptance (BUG-1510 AC4, verbatim):
  1. A shelve records against the spec the VERDICT is about, or - if that cannot be determined - records that the attribution is uncertain rather than silently choosing the lease. Absent attribution must not read as confirmed attribution.
  2. A test shelves a verdict whose subject differs from the lease's spec and asserts the recorded attribution is the verdict's spec (or explicitly uncertain), not the lease's.
