- id: 01a220a7-1b10-7a12-a2f9-bdd5ecfb6671
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 0e08e12c1a (PR #4798).

    **Acceptance evidence**
    - AC1 [documentation-inspection]: docs/getting-started.md §3 "Record your first spec" (aida add with ## Acceptance, aida list, aida show <ID>, plus a note on long node-local IDs) and §4 "Prepare your first review" (branch, commit, aida review prepare --from main --specs <ID>, what each report section means, and that --run-review needs a signed-in agent CLI). Reproduced in a clean HOME and new repo; the commands run as written.
    - AC2 [behavioral-test]: tests/test_getting_started_commands.py runs the marked bash blocks in a throwaway repo (PASS against the live binary). It also checks that every documented report section appears in the real output. Mutation-checked: a renamed section label fails it, and so does `aida show TASK-1`. Wired into CI contracts shard; registered in scripts/discover-python-tests.py CLI set.

    **Probe findings and fixes**
    - `git commit -am` skips new files → the doc now says to `git add` first.
    - `--from main` on a master-default repo → the doc now names the default-branch caveat.
    - Direct os.environ read tripped the ExecContext ratchet → switched to tempfile.gettempdir().
    - The showcase generated output drifted → regenerated.

    **Residual risks**
    - --run-review is not executed (vendor sign-in and network).
    - On hosted runners the CI step is gated on full_ci, so a docs-only edit to the page skips it. Self-hosted always runs it.
    - <ID> is a placeholder; pasting it literally gives a bash redirect error.

    make check-ci-fast: exit 0 at 0e08e12c1a. No cargo test was run: no Rust changed.
