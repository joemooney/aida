  content: 'PROXY DECISION (orchestrator for Joe): the strict review asks for changes and I accept its narrowed scope. Field-level merge stays only for edit-local fields: title, description, owner, priority, feature, type, narrative, weight, origin, mode, --add-tag/--remove-tag, refs, comments and carve-outs. Refuse with a conflict, writing nothing, if any concurrent change hits an edit that (1) uses --tags replace, when current.tags != read.tags; (2) changes status; or (3) leaves NeedsAttention, when the fresh copy differs from the read copy on anything but modified_at. Add regression tests for both review probes. Also: a struct-valued field that both sides changed is a conflict, not a key-wise merge.'
