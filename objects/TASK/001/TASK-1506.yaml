title: Move aida edit and supervisor reclassify onto update_spec_atomically (replace read-recheck-write)
description: |-
  Follow-up from the BUG-1612 rebase review. The `aida edit` door (git_backend_cmd.rs, around line 6020) and supervisor `reclassify_needs_human_atomically` still do read, then recheck_before_write, then update_requirement. That is safe and matches main, but leaves a small window between the recheck and the write that update_spec_atomically closes.

  ## Acceptance
  - Both paths apply their field edits on the copy read under the store lock, via update_spec_atomically, and keep their existing refusals and messages.
  - Tests show that a concurrent change between read and write is detected, and that no edit is lost.
