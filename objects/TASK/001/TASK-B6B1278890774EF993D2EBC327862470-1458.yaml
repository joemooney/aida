title: 'Review follow-up: Inconclusive CI-cache walk is silent: ci_cache_bytes returns None when the 10s CI_CACHE_WA'
description: |-
  From TASK-3910
  Reviewed sha: 9a05bbe93970190e13a9f010fd8e9d0d78128a91

  Inconclusive CI-cache walk is silent: ci_cache_bytes returns None when the 10s CI_CACHE_WALK_BUDGET expires below the cap (aida-cli-lib/src/doctor/disk.rs ci_cache_bytes/ci_cache_finding), and ci_cache_finding maps None to no finding. The slowest walks are the largest caches, so a cache with millions of incremental files that cannot be stat'ed within 10s would produce no alert at all, weakening AC2's 'never reaches 90% silently'. Follow-up: emit an informational 'inconclusive' finding (or note) when the deadline passes, rather than silence.
