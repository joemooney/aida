  content: 'Two more instances, 2026-10-06 morning (binary cd1aa53848): (1) The aborted 06:38 interactive next4 launch (BUG-1805 escalate-flag crash) bumped TASK-1603 Approved→InProgress then died before saving a lease — leaving THIS spec stuck InProgress-no-lease, so the 06:40 headless wave skipped the race fix and selected around it. Recovery: aida edit TASK-1603 --status approved, requeue top. (2) The 06:40 wave''s first member TASK-1322 reproduced the race exactly as described: child logged ''AIDA_AUTO_COMPLETE is set but no live orchestrator run owns it — treating this as a normal interactive session'', fell back to interactive rules, and refused InProgress-no-lease — and the refusal was keyed on the ORIGIN ALIAS (scope TASK-1-215, anchor TASK-1322), supporting the alias-ID hypothesis in comment 3 (cross-ref TASK-1328). Second member TASK-1328 launched fine (''claiming it anyway''), consistent with first-member-only timing. Victim count this week: 4.'
