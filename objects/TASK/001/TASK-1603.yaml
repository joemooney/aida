  content: 'Wave-2 transcript (operator paste) confirms: both TASK-1588 children printed ''AIDA_AUTO_COMPLETE is set but no live orchestrator run owns it — treating this as a normal interactive session'' before refusing, while BUG-1801/BUG-1804 claimed anyway in the same wave. Caveat: both repro waves ran binary 62e3374 (each drain start preceded the make build-fast finishing); retest once on a HEAD build before implementing. Until fixed, the first member of every wave shelves — workaround: after the wave, launch the shelved spec directly with aida queue work <ID> (no --auto-complete env, so the race path is not taken).'
