title: 'Review follow-up: The default-policy instructions in approval_refusal and the new skill paragraph say a regi'
description: |
  From BUG-2707
  Reviewed sha: acb62fdfa138cdb6c736d49d4b6ef3f8be4b4886

  The default-policy instructions in approval_refusal and the new skill paragraph say a registry blocking_tier is required for explicit deferral. Under an unset list apply_policy preserves the input and finding_is_deferred checks severity, disposition and rationale without requiring a tier. The existing example in the same skill omits it. Describe the actual default-policy rule and cover that documented example.

  Advisor scope and acceptance

  Run after BUG-2707 lands. At #4385 bdd60daf20ca, the submission guidance at the top of the reviewer skill and approval_refusal already explain explicit deferral without blocking_tier when the list is unset. The Finding disposition and approval-time sweep section still describes a blanket requirement that contradicts them.

  - Align the finding-disposition section and the review prompt's unset-list explanation with the recorder's effective policy. With the list unset, a complete explicit deferral uses text, severity, disposition deferred, and a nonempty one-line rationale. The configured-list and invalid-policy branches must remain accurately described.
  - Exercise the documented example without blocking_tier through the validator and the recorder's policy rule. Keep the implementation to guidance and regression coverage. Preserve the recorder's classification and approval rules.
