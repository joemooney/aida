title: 'Review follow-up: Onboarding-task fallback keys only on the --commit flag. When AIDA_INIT_COMMIT_SCAFFOLD=1 '
description: |-
  From TASK-3952
  Reviewed sha: 2c764ec06581bdf3bc0bc1f9cbad815646a0f5f0

  Onboarding-task fallback keys only on the --commit flag. When AIDA_INIT_COMMIT_SCAFFOLD=1 requests the commit and the commit then fails, commit_requested is false, so no onboarding task is seeded (init_cmd.rs:2454). This differs from a failed --commit run. Follow-up: derive the 'commit was requested' signal from should_auto_commit_scaffold's decision.
