title: 'Review follow-up: Duplicate salvage on retry: in reclaim_exited_branch_clone (aida-cli-lib/src/queue_cmd/wor'
description: |-
  From BUG-2778
  Reviewed sha: 70b9880abb40efc7fabb59c352a2fe98a31fbffb

  Duplicate salvage on retry: in reclaim_exited_branch_clone (aida-cli-lib/src/queue_cmd/work.rs:4251) each retry re-runs seat_clone::destroy. For a clone whose only unpublished state is checkpoint refs (not unshipped), destroy_inner salvages before it reaches the retention gate (seat_clone.rs, 'facts.unshipped() || checkpoints' branch), so a transient refusal that retries writes up to three salvage patches for the same clone. No data is lost; it adds salvage clutter. Skip a salvage when one exists at the same HEAD, or salvage once outside the retry.
