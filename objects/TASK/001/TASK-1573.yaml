title: Two individually-green PRs merged 53s apart left main red for 16 minutes — decide the merge-race defense (require up-to-date branches, a merge queue, or re-run-at-merge) for CI-gated PRs
description: |-
  Incident 2026-10-02: #2350 added a second .aida/config.toml read-site to implementer_preflight.rs (merged 21:40:32Z); #2345 landed the config-trust guard with sites = 1 from a merge preview that predated #2350 (merged 21:41:25Z). Each PR's CI was green; their union was red on bug_1723_config_trust_tests::every_config_toml_site_is_inventoried_and_every_worktree_key_is_policy until #2353 (merged ~00:05Z next day). Every open PR inherited the red in the meantime (six lanes blocked; BUG-1767's PR #2359 among them).

  Any committed-inventory guard (config-trust sites, allowlists, ratchets — the repo has many) is structurally exposed to this race: the PR that changes the counted thing and the PR that records the count can both be green against stale previews. Candidate defenses, one to be chosen deliberately: (1) GitHub 'require branches to be up to date before merging' on main — simplest, serializes merges at the cost of re-run churn; (2) a merge queue, which batches and re-tests the union; (3) keep optimistic merges but auto-re-run the head-of-main CI after every merge and alert on red within a minute instead of on the next PR's inherited failure.

  Acceptance sketch: with the chosen defense active, replaying this incident's shape (two PRs, each green alone, red combined) cannot leave main red silently — either the second merge is blocked until re-validated, or a main-is-red alert fires from the merge itself.
