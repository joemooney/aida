description: |-
  From STORY-2695
  Reviewed sha: 1a5f69f0aeaa47e7162649b5cacf05b59d781ed5

  aida-cli-lib/src/pr_train.rs train_infrastructure_failure: the change lists the two new dell1 workflow steps, but a dell1 host failure usually never reaches a completed step. When the job-started gate refuses (source fetch failure, policy changed during setup, assigned class changed), scripts/runner/controller.py stops the unit, so the job ends failed with no completed failing step. The function returns None for a step that is not completed, for an empty step list and for any unlisted step, so the train treats a host fault as a test red and bisects or ejects members. Follow-up: classify a dell1 job that ended before any workflow step ran as infrastructure, with a fixture built from a refused job's real API payload captured at operator acceptance.
