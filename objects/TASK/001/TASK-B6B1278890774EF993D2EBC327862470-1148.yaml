description: |-
  From STORY-2897
  Reviewed sha: 81cbe3ada1c6b53f5e155c698a2a61d90c062cca

  [P2] Paginate the workflow jobs used for failure evidence. forge.rs:3223-3235 reads only the first 100 jobs and never checks total_count. A failed job on a later page is reported as absent on every retry, so its link/log and any unbuildable trigger never reach the alert or fix spec. The pre-existing github_run_job_failed_steps already has bounded pagination and completeness checks; reuse that approach for the report and cover a failed job on page two.
