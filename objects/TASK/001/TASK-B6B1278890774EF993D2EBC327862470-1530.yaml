description: |-
  From BUG-2776
  Reviewed sha: 1eba036e95ffbc060aba8b5844232897f0def674

  Test gap: the production end closure in reclaim_retained_review_tree (`aida session end <lease> --yes --skip-ci` subprocess, aida-cli-lib/src/queue_cmd/work.rs:216-230) is never exercised. bug_2776_review_watch_reclaims_only_a_clean_exited_leftover_on_a_moved_head injects a stub that force-removes the worktree, and bug2776_reclaimed_leftover_dispatches_the_moved_head_in_the_same_pass stubs the whole reclaim. No test shows that a real session end on a stale or ending-retained reviewer lease removes the checkout. If it refused, the code fails closed ('session end refused' / 'session end kept the checkout'), so this is a coverage gap, not a safety hole. Follow-up: add one integration test that runs the real subprocess against the BUG-2776 lease shape.
