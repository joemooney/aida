title: 'Review follow-up: `review_vendor_token_rates_per_1m` (aida-core/src/vendors/mod.rs) hard-codes per-1M token '
description: |-
  From STORY-3120
  Reviewed sha: 9082645444672a4f7a21f619a8259089de36e018

  `review_vendor_token_rates_per_1m` (aida-core/src/vendors/mod.rs) hard-codes per-1M token prices by model-name substring (e.g. opus 15/75, 'mini'/'flash' 0.80/4, 'o3' 10/40). These values are stale, and the substring matching misclassifies (any model containing 'mini' matches, including 'gemini'). It only drives advisory telemetry cost estimates, so this is a follow-up: source the rates from config or label them as estimates.
