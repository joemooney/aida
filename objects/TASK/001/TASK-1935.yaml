title: 'Strengthen STORY-1728 early-dispatch test: recursive scan, any receiver, prelude helpers'
description: |
  run_dispatches_early_handlers_before_any_store_is_opened (aida-cli-lib/src/tests/story_1728_command_registry_tests.rs:523) scans only run()'s own text. It does not inspect prelude helpers (enforce_stakeholder_role_capabilities, maybe_prompt_role_restore, maybe_run_asciinema_wrapper, warn_if_cwd_removed). It looks for dispatch sites with non-recursive read_dir (:556) instead of production_sources, and it only matches the 'invocation.' receiver. early_handlers_run_without_a_store_and_continue_reaches_the_store_phase (:461) uses a synthetic handler only. Consider also pinning that Distributed arms return Continue except regen/mcp-serve/jira/github/gitlab (advisor ruling 2b).

