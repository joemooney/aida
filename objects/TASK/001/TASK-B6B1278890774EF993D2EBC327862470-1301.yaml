  content: 'INTEGRATION PRE-CHECK r2 (integration-30, 01:44): PR-4500 @ 415457c4d0 PASSES the upheld F1. The rework commit 415457c4d04 makes DetectorSpecs::branch_id ALWAYS try known store IDs first, longest-first (the whole branch, then each prefix ending at a ''-'' boundary), and fall back to the heuristic work_spec_id_from_branch only when no known ID matches. So task-42-2026-fix with an active TASK-42 resolves to TASK-42 again (the old prefix rule), while ''-'' boundaries keep task-420-x from matching TASK-42, and branches with no known prefix resolve via the parser as before. New regression task_3860_admits_leaseless_branch_with_numeric_suffix asserts exactly that row (branch task-42-2026-fix, spec_id TASK-42). The other commits in the range come from its integration merge. Merges CLEAN.'
