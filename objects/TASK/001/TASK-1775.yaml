title: 'BUG-2131 hardening: write the contained-store marker before the git version check; route git_backend''s raw diff --cached through host_git_command'
description: 'From the #2663 STRICT review, non-blocking: (1) session.rs:2417-2427 skips writing the aida-contained-store marker on old git, and the comment claims the session then has no store write access, but with the primary checkout as write root .aida-store stays writable. Write the marker BEFORE the version check. (2) db/git_backend.rs:636 runs a raw ''git -C <store> diff --cached --quiet'' bypassing host_git_command (empirically didn''t trigger a planted clean filter on 2.43, but route it anyway). (3) Optional: don''t cache the git version forever in long-running servers.'
