title: 'survivors(): document or test the CLONE_PARENT + FD_CLOEXEC guard narrowing'
description: |
  aida-cli-lib/src/regen/score/roots.rs:283-300 (PR-2761) now skips a close-on-exec guard copy held by any process whose PPid is the scorer. A clone(CLONE_PARENT) sibling of a scored command, which BUG-2160 says must still be counted, can set FD_CLOEXEC on its guard copy and, with cwd/exe outside the roots, escapes counting and the kill. That's about as strong as closing the guard fd (already an evasion), but TASK-1956 says to preserve survivor-detection limits. Add a test or an explicit comment acknowledging the narrowing.

  Raised in review of PR-2761: https://github.com/joemooney/aida/pull/2761#issuecomment-6282336765
