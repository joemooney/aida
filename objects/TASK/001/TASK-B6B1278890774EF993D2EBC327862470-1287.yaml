title: 'Review follow-up: aida-core/src/mailbox_logical.rs:2326 promotes every retained lookup OverBudget error to a'
description: |-
  From TASK-3851
  Reviewed sha: e94099b539b9cd19d00f797a8dd872a305a5d623

  aida-core/src/mailbox_logical.rs:2326 promotes every retained lookup OverBudget error to a receipt-anchor error. The same code is returned for a single oversized retained sidecar at :2517 and for running out of retained-probe slots at :2501 or :2516, even while the deadline and receipt reads are healthy. An unrelated, independently observed record then loses ACK eligibility at :972, and a relay snapshot can report receipts_unknown at :816, suppressing all end notices in aida-cli-lib/src/relay_mail_outbox.rs:291. Preserve per-ID isolation for lookup failures and carry retained discovery incompleteness separately from receipt-anchor health. Add a mixed fixture with a failed retained lookup and an independently readable delivery.
