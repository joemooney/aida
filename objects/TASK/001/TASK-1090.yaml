  content: 'Grooming refinement after overlap check: aida ps ALREADY surfaces running/stalled/orphaned agents with PID liveness (live/STALE), and drive_robustness.rs already holds resume/salvage logic. So do NOT build a parallel ''aida dispatch-health'' report (would duplicate aida ps). The genuine new value is the ACTIONABLE per-row hint: for a STALLED/crashed row, emit the next command (salvage-commit the dirty worktree, resume same vendor, or rebrief a fallback vendor). Implement as an EXTENSION of aida ps (a hint column / --hints flag, or a salvageable section) reusing drive_robustness.rs''s existing resume/salvage helpers — a small delta, not a new surface. Keeps the interface from sprawling (one running-work surface, now actionable).'
