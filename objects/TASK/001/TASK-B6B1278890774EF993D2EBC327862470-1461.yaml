title: 'Review follow-up: aida-cli-lib/src/doctor/worktrees.rs:1530-1540 — The write-ahead attestation event records'
description: |-
  From BUG-2755
  Reviewed sha: 696fd8422f05691585f0f2f06339b8f5a0aaa397

  aida-cli-lib/src/doctor/worktrees.rs:1530-1540 — The write-ahead attestation event records outcome 'salvage destination <dest>' before rename_noreplace runs. When the rename then fails (EXDEV, EEXIST), or the lease-removal check fails, the command refuses and keeps the lease, but the durable event still says a salvage happened. Retries add more such events. Nothing in the record separates intent from completion. Record the event as an intent, or add a completion/failure record, so the audit trail shows what actually happened. The EXDEV case in repair_attestation.py should assert the event state.
