    4. Supply a new exact HEAD/tree/base for a different independent whole-scope reviewer. Keep the other failures and unrun gates open. This report does not dispatch rework, grant a seat, bypass the actual new-code dispatch refusal, or permit an old-binary/identity/environment/direct-JSON/forge workaround.

