    ## R1613-1 — blocking, medium: command description exceeds its existing context budget

    At `aida-core/templates/commands/aida-pr.md:2`, TASK-1613 changed the canonical description from `Run /aida-pr.` (**13 bytes**) to `Open implemented work for independent review through aida ship` (**62 UTF-8 bytes**). Exact Git blobs establish that C inherits the member's command unchanged. The common base and bf65 still have the 13-byte description.

    `aida-core/templates/context-budget.toml:6` sets `command_description_max_bytes = 48`. That file and `aida-core/tests/context_budget.rs` are byte-identical across the common base, bf65, all four members, and C. The test trims the value after `description:` and uses Rust string byte length, then checks each generated `.claude/commands/*.md` artifact against that limit at line 64. Thus this is a member-introduced violation of an unchanged contract, independent of authority, cache permissions, bwrap, or later main movement.

    The actual final CI log independently corroborates the source finding: `repository_and_generated_scaffold_stay_inside_context_budgets` fails at `aida-core/tests/context_budget.rs:64:13` with `.claude/commands/aida-pr.md: 62 bytes` (full log lines 11412–11428). Earlier 23 template and 14 agent-pack unit tests did not include this integration test; template parity can faithfully reproduce invalid content. The earlier member APPROVE does not supersede this finding.

    Numbered remedy and verification, **for later legitimately authorized owning-lane rework only**:

    1. Shorten the canonical command description to **at most 48 UTF-8 bytes**, retaining its review-handoff meaning. Preserve the command body, explicit successful-PR autoqueue, preview, managed-child stop contract, draft constraints, and independent-review boundaries. Do not raise the budget, weaken assertions, or broaden lifecycle scope.
