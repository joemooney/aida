title: 'Review follow-up: Test gap (lane_job.rs:1890-1906): no test drives run_one_authorized to show the job really'
description: |-
  From TASK-3911
  Reviewed sha: dcc174ec7be643fcf34c7170094b967c265431b2

  Test gap (lane_job.rs:1890-1906): no test drives run_one_authorized to show the job really waits on a held compile slot, holds the slot for the job's whole run, or receives CARGO_BUILD_JOBS in its environment. The three new tests exercise admit_job directly; AC2's test only checks that cargo_build_jobs comes back from admission. A follow-up should add a fixture-lane test (Sandbox::TestUnwrapped) that sets cargo_build_jobs and asserts the child sees CARGO_BUILD_JOBS. Source reading confirms the wiring is correct: the admission binding lives until the function returns, and the bwrap lane wrapper does not --clearenv.
