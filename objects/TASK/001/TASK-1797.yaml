title: 'Operator: add a GitHub tag ruleset protecting v* tags (contained-seat origin-side residual)'
description: From the BUG-2169 signoff (O3). Contained seats can push to origin, and release.yml fires on v* tags. Add a repository tag ruleset that restricts creating, updating and deleting v* tags to the operator, or to the release workflow identity. Operator action in GitHub settings.
