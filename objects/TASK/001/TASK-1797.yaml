- id: 01a1af7b-903c-7031-b00e-02363567f2a9
  author: joe
  content: 'Done 2026-11-05 23:12 MST (operator-approved; advisor ran it via gh): GitHub tag ruleset ''protect-release-tags'' (id 26674914), active, targets refs/tags/v*, restricts creation, update and deletion, with an EMPTY bypass list, because seats push with the operator''s GitHub identity. Verified: pushing v0.0.0-ruleset-test was rejected (''push declined due to repository rule violations''). To release, set the ruleset to Disabled, push the tag, then set it back to Active (repo Settings, Rules, Rulesets).'
  created_at: 2026-11-06T06:11:13.084482231Z
  modified_at: 2026-11-06T06:11:13.084482231Z
