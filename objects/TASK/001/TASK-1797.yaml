  content: 'OPERATOR RULING (2026-11-03 19:37 MST, relayed by advisor): stays parked. A v* tag ruleset with an admin bypass protects nothing, because contained seats push with the operator''s GitHub token, which is admin. A ruleset with no bypass blocks the operator''s own release tags unless enforcement is toggled for each release. Real protection needs a distinct release identity (the release workflow token or a deploy key) that is the only allowed tag pusher. Revisit when a separate release identity exists.'
