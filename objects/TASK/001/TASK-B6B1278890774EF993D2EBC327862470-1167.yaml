title: 'Review follow-up: The episode can name the wrong first red commit and never corrects it. A commit older than'
description: |-
  From STORY-2897
  Reviewed sha: f037b9d28788d3673950b9986e88d91d0d0e42af

  The episode can name the wrong first red commit and never corrects it. A commit older than the first red one that reads as unknown (CI cancelled by a newer push, a transient forge error, or the pass deadline turning the remaining reads into errors) is skipped, the episode opens at a newer red commit, and its PR and specs go into the alert and the fix spec's `fixes` links. Later passes skip everything older than red_sha (`!past_red`, main_watch.rs:620-621), so an older commit that later reads red is ignored. The alert does not say that unjudged commits lie between the held green commit and the named one.
