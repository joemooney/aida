title: 'Opt-in --panes tmux: burndown/queue-work fan-out spawns implementers into titled tmux windows (dedicated drain session)'
description: |-
  Give the operator a live view of a fanned-out drain: with --panes <host> (or [burndown] pane_host in config), each worktree-isolated implementer is spawned into a visible, titled terminal pane instead of an invisible background process. See SPIKE-77 findings doc (docs/research/2026-07-07-spike-77-cmux-ux-signals-fleet-watch.md).

  BACKEND DECISION (2026-07-11): tmux is the FIRST backend. The spike's decision rule — the first backend follows the operator's actual daily driver — resolved when the operator adopted tmux for daily activity (2026-07-11, fresh ~/.tmux.conf; supersedes the wezterm-native default and the 2026-07-07 zellij evaluation). tmux also carries the resilience mandate natively: implementers spawned into a tmux session live in the tmux SERVER, so they survive terminal/GUI death and SSH drops — the lifetime-coupling caveat recorded against wezterm does not apply here (docs/help should state the persistence as a positive instead).

  Constraints (from the spike, unchanged):
  - OPT-IN ONLY; bare command behavior byte-identical (faithful-launcher rule, STORY-495 — no hidden opinion).
  - Graceful degrade: pane-host binary absent or its probe fails -> warn once, fall back to current background spawning; never fail the drain over display.
  - Record the returned pane-id in the session lease so aida ps / the fleet-watch skill can cross-reference pane <-> spec.
  - Do NOT wire pane-kill to lifecycle — the drain must never destructively reach into the operator's terminal; panes outlive their sessions and the operator closes them.

  tmux 3.4 primitives (installed on operator machine; stable surface):
  - Spawn: tmux new-window (or split-window) -P -F '#{pane_id}' returns the new pane-id on stdout; -c sets cwd; -d spawns without stealing focus. Target a dedicated aida-drain session (created detached via new-session -d if absent) so implementer windows never crowd the operator's working session.
  - Title: rename-window <SPEC-ID> (allow-rename is on in the operator config); select-pane -T for pane titles.
  - Input/inspect: send-keys; capture-pane -p -S <n> for scrollback; list-panes -a -F <format> emits machine-parseable per-pane fields (format strings are exact; no JSON needed).
  - No blocking-spawn verb (zellij's --block-until-exit has no tmux twin); the drain already tracks completion structurally via leases/exit codes, so fire-and-forget spawn is sufficient.

  Deferred backends (facts retained from the 2026-07-07 probes; build the adapter seam only when a second backend is actually implemented):
  - wezterm 20240203: cli spawn/split-pane (return pane-id), send-text/get-text/list --format json/kill-pane/set-tab-title; precise --pane-id addressing. Fire-and-forget spawn only. Panes die with the GUI — the lifetime-coupling caveat applies to this backend.
  - zellij 0.44.3: run -- cmd returns terminal_<id>; --block-until-exit[-success|-failure] (synchronous spawn); per-pane external addressing via --pane-id on dump-screen/write-chars/focus-pane-id; attach -b detached background sessions; KDL layout files; WASM plugins + zellij pipe (relevant to STORY-765). Weaknesses: list output is text not JSON; reactive in-terminal scripting requires a plugin.

  Acceptance:
  - aida queue work --batch X --auto-complete --panes tmux (tmux server reachable) produces one titled tmux window per fanned implementer under a dedicated drain session; drain semantics (leases, phases, exit codes) unchanged.
  - Same command with tmux absent (or no server reachable) completes identically to today plus a single warning line.
  - Lease TOML carries the pane-id when pane-hosted; absent otherwise.
  - Implementer windows survive closing the terminal emulator that launched the drain (tmux server persistence) — verified by detach/reattach.
  - Docs/help state the persistence behavior and that the operator owns pane cleanup (no pane-kill wiring).
