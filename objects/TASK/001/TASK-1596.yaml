title: Register monthly merged-worktrees guard + advisor route in the schedule registry
description: 'Operator request (Joe, 2026-10-04) after a 116-worktree buildup made pr-ship step 6 crawl: add a monthly read-only guard (doctor check merged-agent-worktrees --fail-on-findings) with an advisor route job prompting the human-at-TTY cleanup (aida worktree gc --yes --force). Force stays OUT of the scheduled job by design: gc --force is refused in unattended contexts, and the guard/route split is this repo''s established pattern (STORY-1367).'
