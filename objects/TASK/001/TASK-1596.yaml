comments:
- id: 01a108b8-85ad-71ab-9e11-e8517d534975
  author: joe
  content: |
    Scope correction (2026-10-04): this is a small CODE task, not a config tweak. The schedule registry validates `command` against a hard allowlist, and `doctor check merged-agent-worktrees --fail-on-findings` is not on it — registering the job today errors out `aida schedule status` entirely (verified, then reverted).

    Implementation:
    1. Add `doctor check merged-agent-worktrees --fail-on-findings` to the scheduled-task command allowlist (near the existing doctor-check entries).
    2. Verify `aida doctor check merged-agent-worktrees` exists as a check category and exits non-zero on findings like its siblings; add it if the category is heal-only today.
    3. Ship the config pair in the init scaffold's schedule_section() alongside the other guards, DISABLED by default (like stranded-branches-guard), with this comment rationale: guard is read-only monthly (`every = "30d"`); the destructive `aida worktree gc --yes --force` stays human-at-TTY (refused unattended by design) and must never be scheduled. Route prompt: "Merged agent worktrees have accumulated again (monthly guard). Review the findings, then a human at a terminal runs `aida worktree gc --yes --force`; never schedule the force run itself."
    4. In THIS repo's .aida/config.toml, enable the pair once the allowlist ships.

    Watch-out recorded for the enablement: if the "undecidable batched-integration" worktree class is never removable by gc --force, the guard trips every run — disable and file the gap instead of living with noise.
  created_at: 2026-10-04T21:01:13.005369922Z
  modified_at: 2026-10-04T21:01:13.005369922Z
