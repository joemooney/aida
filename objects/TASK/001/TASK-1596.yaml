- id: 01a108be-adf1-74e4-a962-28f51e58b46e
  author: joe
  content: |
    Evidence update (2026-10-04): the operator ran `aida worktree gc --yes --force` — it removed ZERO of the 33 flagged trees; the whole backlog was the "undecidable batched-integration" class, which even --force skips ("flagged for operator decision — not auto-removed"). Consequence for this task: the monthly guard MUST ship disabled-by-default and stay disabled in this repo until BUG-1800 lands (verdict caching and/or a disposition verb); otherwise it trips on every run, which the registry doctrine classifies as noise.

    The 33 were manually dispositioned by the advisor seat the same day under operator delegation: each branch tip archived under refs/archive/batch-era/<branch>, then worktree removed and branch deleted (registry 116 → 85 worktrees). The archive refs are the reversibility net and the model for BUG-1800's disposition verb.
