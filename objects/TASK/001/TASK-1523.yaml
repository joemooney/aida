title: 'North-star check: run STORY-1425''s two-arm reconstitution measure on aida-monitor and publish the AIDA-vs-no-AIDA delta as VIS-2''s executable test'
description: |
  From SPIKE-86 section 8 item 5, resolved by OPERATOR DECISION on SPIKE-86 (Joe, 2026-09-26): STORY-1425's comparative measure becomes the north star's executable check, run on aida-monitor (a project that used AIDA from its first commit), NOT on aida-hub and not on AIDA's own corpus. Without it VIS-2 is asserted rather than measured.

  Depends on STORY-1425 (two-arm reconstitution measure: arm B = store context, arm A = what a non-AIDA project keeps: git log subjects, README, file and symbol names; plus the coverage denominator reported alongside recall).

  Acceptance:
  1. A documented, repeatable command runs the STORY-1425 two-arm measure against ~/ai/aida-monitor at a pinned commit and pinned store head, over a stated spec sample (all specs with acceptance criteria, or a fixed seeded sample if cost requires it).
  2. The output reports per spec and in aggregate: arm A score, arm B score, and the delta (B minus A), plus the coverage figures from STORY-1487 for the same project; never arm B alone.
  3. The first run's results are committed as a dated snapshot (for example docs/positioning/YYYY-MM-DD-north-star-check-aida-monitor.md) with the exact commands, pins and model used, and linked from VIS-2 by comment.
  4. The check states its pass condition in the snapshot: VIS-2 is supported when the aggregate delta is positive and exceeds the run-to-run variance measured by at least two repeated runs.
  5. Re-running with the same pins reproduces the aggregate delta within the stated variance.
