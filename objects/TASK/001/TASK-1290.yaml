- id: 01a0bae8-43e6-7a21-8105-67970e88252d
  author: joe
  content: '[advisor] Scope addition from the TASK-1291 round-1 review (2026-09-19): the criteria gate should also flag a criterion that is POST-DEPLOYMENT BY CONSTRUCTION — one that cannot be verified at merge time because it measures the change''s effect rather than its behaviour (''measured over the next N specs'', ''after this ships'', a median or rate that needs a post-merge window). TASK-1291 carried exactly one and it would have been marked unverified at every round forever, deadlocking its own merge; I moved it to TASK-1294 (blocked-by) and amended the acceptance. This shape is cheap to detect heuristically and belongs in the same report as untraced criteria, under a distinct label — ''not verifiable at merge time: belongs on a follow-up spec'' — because the remedy is different: an untraced criterion needs a test, this one needs to move. It is also a distinct failure class from the four in the 0919 analysis: not the implementer under-testing and not the reviewer being strict, but a spec-authoring defect.'
