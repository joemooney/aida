  content: 'NEXT PRIORITY (from the STRICT review of #2711 @afad958ccd; pre-existing, not a regression). Hunk scope still misses module-level traces that are not in the file header. Missed: traces between items (e.g. between two use statements, above a const/struct/static, after macro_rules!), a module-level trace at the end of the file, and inner-module headers (mod inner { //! trace:X ... }). Leading comments attach only to fn/impl items. Fix (ADD-only): add every comment line that is neither inside an Items range nor attached as a leading comment to an item, and treat inline-module headers like the file header. Also pin an item-level trace in the call-site test. Do this before the classification slice.'
