title: Measure and reduce mandate trace-exclusion fallback rate (semantic false positives)
description: 'Follow-up from the TASK-1790 item 3 review (#2709). Trace-derived exclusions refuse about 24/50 ordinary-mandate PRs beyond the named checks; hunk scope gains 1 case and 46/50 fall back to the full file, so the mandate is close to inert. Acceptance: (1) classify the refusals on the frozen last-50 set as true supervised touches vs incidental co-location; (2) cut the full-file fallback rate (e.g. module-level item attribution, non-Rust hunk scoping) without dropping any true touch; (3) keep ADD-only and fail-closed. STANDARD review unless authority code changes.'
