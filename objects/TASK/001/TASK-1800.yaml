comments:
- id: 01a14718-5271-7e40-b609-40fe6102da42
  author: joe
  content: 'Further items from the STRICT r2 review of #2709 @6e5727ce3c. (a) Every changed file is now scanned, so a PR that changes a symlink (133 on main, e.g. the .claude/skills mirrors), a binary file or a gitlink refuses coverage. That fails closed, but the refusal rate goes up. Consider scanning symlink targets as text and skipping binaries only when they carry no trace. (b) Re-measure the last-50 refusal rate with the new collector; the 25/24 figures describe the old one. (c) Add a call-site test: if mandate_ship_cover passes an empty set instead of trace_evidence.ids, no test fails today.'
  created_at: 2026-10-16T23:42:18.737968566Z
  modified_at: 2026-10-16T23:42:18.737968566Z
  session_id: ee439801-a8a7-4cb8-9d7d-76c3de417ce8
- id: 01a14732-9edd-7550-8205-89472b259db2
  author: joe
  content: 'PRIORITY item (from the #2709 attested review): under hunk scope, file-header traces outside any enclosing item are not attributed. A change inside an untraced fn in a file whose header carries trace:SUP-1 misses SUP-1. Fix: always add a file''s header traces (module-level, before the first item, including //! docs) to the hunk-scope set. This is ADD-only and closes the gap.'
  created_at: 2026-10-17T00:11:02.237372953Z
  modified_at: 2026-10-17T00:11:02.237372953Z
  session_id: ee439801-a8a7-4cb8-9d7d-76c3de417ce8
- id: 01a1476c-f8e2-7c13-b898-9ffa96c3de35
  author: ai:codex:joe
  content: |-
    Priority slice underway: always add Rust file-header traces to hunk evidence (inner/outer docs, attributes and same-line prefixes included); actual mandate_ship_cover callback regression asserts the committed trace ID reaches its decision input. Three header regressions fail on the parent collector; all20 exact-module tests pass. Workspace call-site execution/fast checks are still running.

    Frozen last50 remeasurement with the current collector: 22 named refusals +27 additional trace refusals (54%;49/50 total), for both full-file and hunk scope. Every case has at least one full-file fallback (50 cases/290 case-paths). No required source read failed in this sample, so it does not measure symlink/binary refusals. Same original pinned store+five-entry ledger; classifications/history functions byte-identical, old frozen witnesses cached only when still present. Machine evidence and explanation prepared in docs/testing/task-1800-trace-exclusions.{json,md}. These are classification refusals, not proven semantic false positives; parent remains incomplete.

    Residual design sketch (NOT implemented; signoff requested): preserve ADD-only fail-closed behavior while distinguishing changed-object kinds. For symlinks, read only the committed blob's target text, never follow checkout or host paths; ambiguity about whether target content must also supply evidence still refuses. For binaries/gitlinks, retain refusal until an explicit trusted rule can prove trace absence without interpreting arbitrary bytes as authoritative text. For fallback reduction, introduce proven enclosing-module attribution and per-language comment/hunk parsers; keep full-file union wherever attribution is unknown. Before any implementation, classify the frozen50 refusals manually as true supervised touches versus incidental co-location and require retained coverage of every true touch. No such redesign or authority relaxation is part of this priority slice. Please choose/approve the residual scope before that work starts.
  created_at: 2026-10-17T01:14:46.370611787Z
  modified_at: 2026-10-17T01:14:46.370611787Z
- id: 01a1476e-222c-7b11-a381-58b6b8b253f1
  author: joe
  content: |-
    ADVISOR RULING on residual scope (18:16).
    1. Priority slice (header traces + call-site regression + re-measure 49/50): approved as a NON-COMPLETING slice. Ship it as its own PR, STRICT review.
    2. Next slice, measurement only, no code: manually classify the frozen-50 trace refusals as true supervised touches vs incidental co-location. Break down by path class (Rust source, docs/*.md, AGENTS/OVERVIEW, templates/mirrors, workflows) so we can see which kind drives the 290 fallback case-paths. Deliver it as docs/testing data plus a short table on this spec. This gates everything below.
    3. Symlinks: approved as sketched. Read only the committed blob's target text, never follow checkout or host paths, and still refuse on ambiguity.
    4. Binaries and gitlinks: keep refusing. No change.
    5. Fallback reduction (enclosing-module attribution, per-language comment/hunk parsers): approved in principle, but start only after (2). Acceptance: 100% of the true touches classified in (2) are still excluded; ADD-only and fail-closed unchanged; report the before/after refusal counts on the same frozen 50. Any rule that treats a path class as non-authoritative (e.g. docs) needs its own advisor sign-off with the (2) data attached.
    TASK-1800 stays open until (5) lands or is ruled out.
