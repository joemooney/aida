title: Report whole-tree Rust function trace coverage
description: |-
  Implements the first of the two PRs signed on STORY-1672, advisor comment 2026-10-15 08:38. This child exists so the first partial merge cannot auto-complete the parent story.

  ## Acceptance
  - Add aida trace coverage --all / --path <dir>, Rust only, reusing the existing trace-marker definition and SPIKE-47 file exemptions.
  - Report functions lacking a marker in or directly above them per file; fixture with one traced and one untraced fn reports 1/2 and names the untraced function.
  - Human and JSON output. Report-only; nonzero coverage exit only with explicit --fail-on. Existing diff-scoped mode remains unchanged, with a regression test.
  - No constants scanner in this slice and no store mutation. STANDARD independent gate; operator merges. Parent story remains open until slice 2.
