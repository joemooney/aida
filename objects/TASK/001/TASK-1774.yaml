title: 'Confinement helper: optional --unshare-pid (pid namespace) so callers can guarantee no process survives a confined phase'
description: 'From TASK-1730/#2660: the strict bwrap helper (session.rs bwrap_confinement_args_inner) offers only filesystem binds + --die-with-parent; a fork+setsid daemon survives installer exit and killpg. Regen works around it with snapshot isolation, but a hard guarantee needs an opt-in pid-namespace flag (--unshare-pid, plus --as-pid-1 handling) in the helper. STRICT containment change; serialize with the other launcher-file work.'
