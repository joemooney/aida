- id: 01a2125a-8940-76d0-9258-6f72847090ce
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3878):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 2161550dbc3e
    Recorded: 2026-11-25T09:22:50.270867783+00:00
    Findings:
    1. AC2 — aida-cli-lib/src/stalled_reviews.rs:60,153–157 uses the PR's baseRefOid as the live base tip and takes the forge snapshot before acquiring the sweep lock. GitHub returned afbea08b75a58cf8d9618068cb5efd495790b244 for conflicting PR #4559's baseRefOid in both pr list and pr view, while the integration branch ref was 1fef6c600c2ea8dd8fae5ed90e4c2056c18c5514. Advancing the real base can leave the dedup key unchanged and suppress a required repair, or an older snapshot can queue work for a PR that changed before the write. Resolve the pinned repository's actual base ref and revalidate the open PR, head, target ref and conflict observation at admission.
    2. AC1/AC2 — aida-cli-lib/src/stalled_reviews.rs:102–114,158–174 checks only local lease files. An active implementer in another clone can have a retained shared coordination claim and no local session file, so this pass reports and queues its already-owned work. Use the cross-clone implementer ownership evidence as well, resolving scope aliases against the canonical spec identity and preserving unknown ownership as a refusal.
    3. AC1/AC2 — aida-cli-lib/src/stalled_reviews.rs:88–99,174,197,223 interprets every non-reviewer queue row for any associated spec as queued repair. An ordinary queued implementation or a row routed to another role suppresses both the conflict finding and repair. Distinguish applicable implementer rework for the change from unrelated queue entries.
    4. AC1/AC2 — aida-cli-lib/src/stalled_reviews.rs:123–130 reads and parses the verdict ledger on every row before checking mergeability, even during heal and even on nonconflicting PRs. A refused ledger or malformed verdict timestamp on an unrelated PR aborts the entire sweep before later conflicts can be reported or repaired. Use ledger data where available for approval ranking, retain its read error as a diagnostic, and keep conflict work independent of unrelated review evidence.
    5. AC2 — aida-cli-lib/src/stalled_reviews.rs:134–149,220–231,307–311 queues only specs[0] through generic queue rework. The PR, head and base are free-text in the note. When two open changes share a spec, the first queued row suppresses the other and pickup refuses multiple changes without an explicit branch (session_start.rs:474–501). Multiple branch/title IDs also let the first resolvable alias pick an arbitrary target, and an unresolved spec produces a heal hint that silently does nothing. Bind repairs to the exact change and validated spec through pickup, and emit an actionable diagnostic when ownership cannot be resolved.
    6. AC2 — aida-cli-lib/src/stalled_reviews.rs:86–114,223–232 checks lease and queue snapshots once. Its directory lock coordinates repair-journal writers, while ordinary queue writers and implementer admission can proceed. A worker can acquire an Approved spec before the child enqueues it, because the existing rework lease check covers status flips, and a newly queued row can be replaced or moved by generic rework (queue_cmd/rework.rs:652–664,1055–1097). Reconcile ownership and queue contents in the admission transaction, preserving existing work that appeared after discovery.
    7. AC2 — aida-cli-lib/src/stalled_reviews.rs:186–192,222–237,316–324 lacks a durable receipt for enqueue and advisor delivery. If rework writes the reason comment and queue insertion fails, a retry refuses forever on the comment. If the row is consumed between enqueue and advisor acceptance, a retry can likewise refuse or skip delivery. For NeedsAttention transitions the child embeds the reason in an audit comment (queue_cmd/rework.rs:873–898 and requeue.rs:82–84), so the exact-content check can also miss a prior enqueue. Persist the per-tuple enqueue and pending-delivery state across retries and pickup, and reconcile accepted delivery independently of a mutable queue row or comment format.
    8. AC2 — aida-cli-lib/src/stalled_reviews.rs:65,217–236 aborts the batch at the first per-PR rework or mail failure. An otherwise routine child refusal, such as a spec protected by the existing rework guards, can indefinitely starve unrelated repairable PRs listed later. Preserve the failing PR's diagnostic and continue with independent candidates, returning a partial failure after the sweep.
    9. aida-cli-lib/src/stalled_reviews.rs:60–67 and repair_journal.rs:228–245 hold an exclusive repository-wide directory lock across queue children and advisor delivery, while existing journal readers and writers fail immediately on contention. An unrelated supported repair can lose its publication attempt when recording validation after compilation (seat_clone.rs:5639–5665). Limit exclusion to the repair admission boundary or make contention an explicit recoverable outcome for existing callers, and cover overlap between a sweep and in-flight publication.
    10. aida-cli-lib/src/stalled_reviews.rs:166–171,197–204 conflates dead or unverified lease ownership with a retained journal reservation and always directs the operator to inspect repair reservations. The dead-lease fixture has no reservation for that PR, so this recovery action cannot identify or clear its blocker. Keep the required blocked status and provide the lease identity and lease recovery action when that is the cause.
    11. AC1 — aida-cli-lib/src/tests/stalled_reviews_tests.rs:66–104 checks that an unknown-spec conflict and two blocked cases produce text. It gives no behavioral evidence for resolving the backing spec, rendering its head and known age, suppressing a known live implementer or applicable queued rework, or ordering an approved conflict ahead of an unapproved one. Extend the detection fixture to exercise those paths and trace it to TASK-3878.AC1.
