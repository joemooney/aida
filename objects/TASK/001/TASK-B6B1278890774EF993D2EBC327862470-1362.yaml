title: 'Stalled-review detector slice 2: flag open PRs that conflict with their base and queue a conflict-repair rework'
description: |
  Slice 2 of the stalled-review detector (STORY-3095; filed by product-15 2026-11-24 after Joe flagged #4487 BUG-2742 sitting in a merge conflict for hours unseen until train #4524 dropped it). A 09:45 sweep found 6 open PRs conflicting with main with no lane running (#4487, #4464, #4416, #4401, #4396, #4376).

  ## Acceptance
  - AC1: `aida doctor check stalled-reviews` also reports every open PR whose GitHub mergeable state is CONFLICTING (with the base) and has no active implementer lane or queued rework, showing PR, spec and head, and how long it has conflicted where known. Approved PRs that conflict are flagged first (they block landing).
  - AC2: For a conflicting PR with no lane, the detector queues ONE conflict-repair rework for the implementer (merge the base, resolve, no scope change) and notifies the advisor, deduplicated per (PR, head, base tip). Tests for detection and dedup.
