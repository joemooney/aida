- id: 01a211fd-4452-77c0-aec0-df9c3f7f246c
  author: joe
  content: |-
    AUDIT VERDICT (not a lane instruction): integration pre-check for PR #4566 @ 2161550dbc (TASK-3878, STORY-3095 slice 2)

    Result: AC1 PASS. AC2 behaviour PASS; AC2 tests are a REQUIRED gap.

    AC1, detection (PASS):
    - `mergeable` and `baseRefOid` are now in the pinned `gh pr list` fields.
    - A CONFLICTING PR with no live implementer lease and no non-reviewer queue entry is reported with PR, spec and head.
    - Approved PRs sort first: either reviewDecision is APPROVED, or the ledger approval is at the current head.
    - Conflict evidence doesn't depend on review age.
    - The base tip is checked to be a full SHA.
    - A dead or unadoptable lease, or a retained repair reservation (matched by PR, branch or spec), shows as "blocked: reservation repair needed" and is never auto-queued. That fails closed, which is correct.
    - "Conflict age" is measured from the first repair request, and shows "unknown" before one exists. That is acceptable under "where known".

    AC2, queue and notify (behaviour PASS):
    - `doctor heal stalled-reviews` queues one `queue rework --for implementer` with the marker `conflict-repair-<pr>-<head>-<base>`, then checks the queue receipt.
    - It notifies the advisor on the marker thread.
    - Duplicates are suppressed by either the queue note or the mailbox thread.
    - If the reason was recorded but neither receipt exists, it fails closed.
    - When the base tip moves while an older rework is still queued, `queued_here` stops a second entry.

    REQUIRED: the dedup test only exercises the `should_queue` helper, but the AC says "Tests for detection and dedup". Add a production-path test that drives `scan_rows(..., repair=true)`, with `queue_rework` and the notifier behind test seams, and shows:
    (a) the first run queues once and notifies once;
    (b) a second run at the same (PR, head, base) queues and notifies nothing;
    (c) a new base tip while the earlier entry is still queued doesn't queue a second one.
    A test that calls only the helper doesn't prove the caller's path, which is the same lesson as TASK-3874.

    Security lens:
    - The repair-journal read now goes through `open_verdict_entry` (openat with O_NOFOLLOW against the `.aida` dir fd), which is stronger than before.
    - The rework is spawned through `control_child` with argv built only from validated SHAs and the PR number.
    - Untrusted branch and title strings are used only for matching.
    - No seat-clone commands and no new remote git.

    Observations (not blocking):
    1. Locking: `queue_repairs` holds an exclusive flock on `.aida` across the child `queue rework` and the mail delivery. The module doc says "no lock across child execution or mail delivery". The exclusion is intentional: `RepairGuard::lock` uses try_lock_shared and fails closed with "conflict repair sweep active". Either update the module doc or note the exception.
    2. `gh pr list` often returns `mergeable: UNKNOWN` until GitHub computes it. Conflicts can be missed (a false negative), but nothing is ever flagged by mistake.
    3. Heal is manual. The scheduled job runs only `check`. If a heal schedule job is added later, it needs its own `maintenance_schedule.rs` command_table entry (BUG-2762).
    4. `list_leases_strict_all` means one malformed lease file now fails the whole check. That fails closed, but it is noisy under `--fail-on-findings`.

    Self-approve limits: this touches lease and repair-journal locking code, so it waits for the independent reviewer verdict before merging into integration.
