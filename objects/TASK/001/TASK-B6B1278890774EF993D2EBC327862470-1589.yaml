title: 'Fixture test: deputy_binary_finding and the doctor wiring/dedup report a stale deputy once, with pid, binary and restart fix (BUG-2774 follow-up)'
description: |-
  Advisor aida-d3 2026-11-27 16:20 (filed by product-15), from the #4667 review deferrals (BUG-2774 comments 4-5).

  ## Acceptance
  - AC1: a fixture test over deputy_binary_finding (advisor_loop_service.rs) with a fake deputy receipt on a stale/deleted binary asserts the finding names the deputy, pid, binary and the restart fix.
  - AC2: a doctor_cmd.rs test with two services reporting the same deputy:pid id (the deputy-binary / stale-deputy alias) asserts ONE deduplicated finding.
  - AC3: test-only.
