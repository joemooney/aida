description: |-
  From BUG-2748
  Reviewed sha: c5f7b33e0117f37812644ab1ba3722431ddc902b

  aida-cli-lib/src/codex_bg_receipt.rs:615–632 reopens valid terminal reservations after upgrade. The protected-base recovery writer could reconcile a Prepared attempt as Exited with Owner::Released and no supervisor or worker. The new reader classifies that persisted receipt as Unknown. The named scope blocks again, and pruning, ordinary recovery and unknown retirement all refuse it. The revised writer only fixes receipts created after the upgrade. Preserve a verified compatibility path for already reconciled Prepared receipts and exercise it with a receipt in the old writer's format.
