title: 'First-run: the default commit hook does not show a red failure on an ordinary commit (F8)'
description: |-
  ## Acceptance
  - AC1: in a freshly initialised repo, an ordinary commit (no SPEC trailer, no trace marker) does not print a red failure or FAIL line from the default hook; at most a single neutral hint.
  - AC2: a test commits in a fresh aida init repo and asserts exit 0 and no failure wording.

  Source: docs/plans/2026-11-27-fresh-user-walkthrough.md (on branch task-3951-fresh-user-walkthrough / PR #4782), section F8. Advisor aida-d3 2026-11-27 20:30 priority order; filed by product-15 for laning now (one spec per lane).
