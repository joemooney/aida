  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (command-level):** `aida-cli/tests/task_3957_fresh_init_commit_hook.rs` runs the real `aida init` (hooks installed) in an isolated HOME + new repo, commits `Configurable greeting`, and asserts the hook output has no `failed`/`FAIL`/`✗`/red ANSI and at most one hint line. Fix: in permissive mode `aida-core/templates/hooks/aida-commit-msg` prints one neutral line instead of the red block; strict mode keeps the refusal.
    - **AC2 (command-level):** the same test asserts exit 0 and no failure wording.
    - Existing shell tests (`tests/test_release_skip_ai_warnings.sh`, `tests/test_multi_agent_commit_tag.sh`) grep `conventional format` in default-mode output; the hint keeps that phrase.

    ### Expected files
    - `aida-core/templates/hooks/aida-commit-msg`
    - `aida-cli/tests/task_3957_fresh_init_commit_hook.rs`
    - possibly a one-line getting-started note that init installs a commit hook (`--no-hooks` opts out)

    ### Ambiguities / conflicts as questions
    - None. The example ID changes from `FR-0042` to `TASK-12`, the style a fresh project issues.
