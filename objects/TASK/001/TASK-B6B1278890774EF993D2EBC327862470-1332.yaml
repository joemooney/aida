    # TASK-3867: SMALL backlog fix (advisor-122 throughput plan 2026-11-22 20:40: fill dell1 with small Approved specs; relayed by product-15). Lane: CODEX. New branch, new PR.

    Read `aida show TASK-3867` and implement its acceptance criteria and nothing more. Reproduce first. If main already behaves correctly, add the regression test and say so in the PR body.
    SMALL-PR RULE: target <=300 changed lines and 1-2 ACs. If it can't fit, implement AC1 only plus its test, and list the rest in the PR body for product to split.
    Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
    Add `// trace:TASK-3867 | ai:codex` (`# trace:` for Python or shell). Commit `[AI:codex] fix(...): ... (TASK-3867)`. One targeted test run, then `make check-ci-fast`, then ship a PR INTO the `integration` branch (base: integration, NOT main). COMMIT your work.

    PRODUCT QUESTIONS: lanes cannot reach product by mail (mailbox over budget). If you need a product answer (a follow-up spec ID, a scope call), PUNT with the exact question in your exit summary; product reads lane exits and relaunches with the answer.

    NEW TESTS: if make check-ci-fast rejects new test names as unregistered, ADD them to scripts/ratchet-set.json (entries only; no other ratchet/gate changes) and list the added entries in the PR body. That is pre-approved; do not punt for it.
    GUARD (advisor-122 02:52): those ratchet-set.json entries must name tests ADDED IN THIS SAME PR. No removals, no renames of existing entries, no filter widening that covers pre-existing tests; reviewers treat any other ratchet-set.json change as a gate edit.

    INTEGRATION (advisor-122 ruling 2026-11-24 07:55; product-15): branch `int36-task-3867`, cut from origin/integration 88d8f9c4b01. PR base MUST be `integration`. <=250 lines.
    SCOPE (ONLY these items): H2a CORRECTNESS: length-framed inventory digest; duplicate ledger rows and observation IDs reported as ambiguous; checked/saturating token arithmetic; budget cap honoured or rejected; single-bracket citations.
    RULES: ONE TEST PER ITEM (register in scripts/ratchet-set.json as same-PR entries). The PR body MUST list every item -> its test (or deferred, with reason). You MAY reuse code from the branch of closed PR #4519 (`int32-task-3867`), but every behaviour change needs its test. A refactor with no tests will be rejected (that is why #4519 was closed). Do not touch items belonging to the other half (H2a/H2b).
