title: 'STORY-3076 H2: review_engine robustness and behaviour hardening (digest framing, ambiguity, arithmetic, globs, CRLF, anchors, batching scope, budget cap, citations, facets)'
description: |
  STORY-3076 hardening H2 (advisor-122 ruling 2026-11-24 02:15, from the independent CR on #4506 S1; filed by product-15). LOW priority, standard tier; launch after S2 (TASK-3862) lands in integration. Folds in TASK-3319 and the -047 citation item.

  ## Acceptance
  - AC1: Robustness: a length-framed inventory digest; duplicate ledger rows and observation IDs reported as ambiguous; checked/saturating token arithmetic; globs compiled once with bounded brace expansion; CRLF-normalized trimming; resolved anchor coordinates kept separate from submitted hints; a linear line-anchoring matcher.
  - AC2: Behaviour: same-stem batching scoped to directory/package; the budget cap honored or rejected (TASK-3319); single-bracket citations accepted (-047); Rust facets keyed on language, not ID prefix. Tests for each item; split into H2a/H2b if over ~300 lines.
