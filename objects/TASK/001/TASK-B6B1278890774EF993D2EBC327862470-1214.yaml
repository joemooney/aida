title: 'Review follow-up: read_record charges the 32 MiB inventory budget only after read_to_string succeeds at line'
description: |-
  From BUG-2706
  Reviewed sha: 0dd153cdba571ded54199aac9b4953967ac3237f

  read_record charges the 32 MiB inventory budget only after read_to_string succeeds at lines 125–131. Invalid UTF-8 payloads consume I/O but never count, so a scan under the store writer lock can read more than a gigabyte across the permitted entry count. Charge actual bytes read before decoding or parsing and stop at the aggregate ceiling.
