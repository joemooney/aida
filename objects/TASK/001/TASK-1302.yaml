    TWO THINGS I FOUND BY APPLYING THIS ENTRY'S OWN RULE TO ITSELF — I ran the command it recommends rather than reading it:
      - It exits 1 on the CLEAN case. grep -c returns count 0 / exit 1 when no markers are present, and exit 0 when they are. The success outcome looks like a failure to set -e or any caller checking pipeline status. Notable in an entry whose thesis is that a step's report misleads, and it ships downstream where it will be pasted into scripts.
      - ^=======$ false-positives on a markdown setext heading underline (seven equals signs): count 1, exit 0, on a file with no conflict. The documented incident was a conflict in a markdown file with a table, so this is the exact file class the advice targets.
    Both fail safe by over-reporting. Neither blocks.

