title: Spawn-boundary ratchet counts launch markers in inline test modules as production launch sites
description: |
  The spawn-boundary ratchet bug_2398_final_spawn_boundary_ratchet (aida-cli-lib/src/tests/bug_2398_codex_tool_env_tests.rs, launch_markers/launcher_calls) counts launch markers in the whole source file, inline #[cfg(test)] modules included. A test that only builds a Command to inspect its env (for example STORY-2745 story2745_headless_child_does_not_inherit_the_launcher_seat calling apply_headless_child_seat_env(&mut cmd, ..)) then counts as a production child-launch site. LAUNCH_INVENTORY has to be bumped for something that spawns nothing, and that is how #3950 failed the ratchet at its approved head (promotion 12 glue commit 10d112cef5c).

  Acceptance: launch_sites ignores code inside #[cfg(test)] items (or production_sources strips inline test modules before counting); the session.rs inventory count drops back by the test-only site; a regression test shows that a test-module call to apply_headless_child_seat_env does not change the count, and that the same call in production code still does.
