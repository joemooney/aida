title: '`/aida-oversee` skill (judgment layer) — after the loop is dogfooded'
description: |-
  The /aida-oversee skill: the judgment layer that turns the shipped 'aida supervise watch' loop into a watchable supervisor an operator runs in a SEPARATE TERMINAL, largely without intervention. An agent runs the loop, interprets ambiguous drift, distinguishes benign parks from genuine human-decisions, salvages/triages, and coordinates with the advisor through the SUBSTRATE (mailbox), not by relaying through the operator.

  This is the near-term enabler of the operator goal (2026-09-13): reduce the drudgery of babysitting the automation so operator+product time focuses on how the product behaves. Running it against a real drain IS the dogfooding that satisfies STORY-1107's revisit trigger, so it is sequenced BEFORE STORY-1107 (the role formalization). Authority per ADR-29: coordinate + realign-queue + fire reflexes + escalate; never drive/merge.

  Acceptance (operator-contract focused):
  1. A skill (/aida-oversee <objective>) an agent runs that loops 'aida supervise watch --objective <EPIC> --interval N', adding judgment: it decides which drift/parks are benign vs genuine human-decisions rather than acting mechanically.
  2. The operator-facing contract is explicit and honest: a crisp 'what needs YOU' summary (seeded by aida awaiting) at a defined cadence AND on genuine escalations, quiet otherwise. 'Largely absent' must never become 'silently drifting'.
  3. Coordinates with a live advisor through the substrate (mailbox/queue), not through the operator.
  4. Never drives or merges; escalates those.
  5. Dogfood: run it against one real drain toward a named objective; cite the administrative view + the escalations it surfaced in the PR. That run satisfies STORY-1107's revisit trigger.
