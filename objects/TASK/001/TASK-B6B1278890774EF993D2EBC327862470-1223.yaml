title: 'Review follow-up: The ignored-path protection collapses directories with ls-files --directory and treats any'
description: |-
  From BUG-2688
  Reviewed sha: 10c94367b4bae34c5d7ac728eee380af20f34869

  The ignored-path protection collapses directories with ls-files --directory and treats any changed descendant as a collision. If an ignored directory contains only build/local.cache and the incoming tree adds build/version, the distinct files can coexist, but pickup refuses. Compare actual ignored leaves and file/directory type conflicts. Add a non-overlapping sibling as a positive control alongside the overwrite test.
