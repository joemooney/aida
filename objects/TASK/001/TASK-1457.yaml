description: |-
  From the BUG-1527 strict review (2026-09-23). Add: a MockPhaseDriver test asserting the dispatched spec's status stays unchanged when phase 1 fails ShippedMismatch (AC6); negative tests that a same-spec rename (BUG-223), a stacked branch and a both-ids branch still proceed; a test of the new ensure_spec_done_after_pr attribution gate. Also: a legitimate rename whose commits carry no trailers currently fails ShippedMismatch with a misleading 'swap' message, so classify it separately. And ensure_spec_done_after_pr now skips the Done write on the normal path when commits carry no trailer; decide whether that is intended and test it.

  ## Acceptance
  1. The tests above exist and pass.
  2. A trailer-less rename yields a distinct, accurately worded outcome.
