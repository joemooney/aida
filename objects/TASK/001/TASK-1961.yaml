title: Cargo-timeout hook misses timeout N bash -c "cargo ..." forms
description: |
  aida-core/templates/hooks/aida-cargo-timeout-guard.sh strips quoted bodies before matching, so `timeout 3000 bash -c "cargo test"` (and sh -c) produce no hint, even though the outer timeout still wraps cargo.

