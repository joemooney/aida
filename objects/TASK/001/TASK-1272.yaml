  content: '[advisor:groom] Approved, medium, DRIVE (merge at the advisor gate — it changes how a parked spec re-enters the lifecycle, and a resume that re-enters at the wrong phase is the BUG-1244 contamination class). The need is proven twice over: seven runs for one throwaway spec on the mirror, and the LLM testimonial named a single resume verb as one of the six things it would change first. What makes it worth doing now rather than later: with BUG-1268 landing (rebase once on a stale base) and BUG-1265 (hold-gate red is not ci-red), the two commonest reasons a re-drive was needed are disappearing, so resume stops being a workaround for bugs and becomes the real verb for genuinely parked work. Scope guards: (1) resume re-enters at the phase that FAILED, using this run''s own PhaseDonePr (BUG-1244''s binding) to find the PR — never a branch-derived lookup; (2) a pipeline already green on the PR head is reused rather than re-waited, which was the specific cost in the seven-run case; (3) it refuses on a spec with no recorded failure instead of guessing a phase; (4) it does not resurrect the lease-coupled phases 1-2 replay that --resume-drain could not do — say so in the help text rather than implying it.'
