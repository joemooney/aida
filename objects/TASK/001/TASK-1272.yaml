  summary: 'The drain-reviewer RequestChanges at f4e2cb3c67 is SATISFIED, and the fix is better than the one the finding asked for. That refusal was recorded by the headless drain reviewer, which has exited; I did not author any commit on this branch, so I reviewed the rework independently. THE DEFECT: reconciled_shelved_phase takes max(recorded, probed), so a spec shelved ci-red and pushed again computed max(Ci, Reviewer) = Reviewer and skipped finish_ci, reaching merge on a pipeline nobody validated. THE FIX: an intermediate commit (c674af1c3d) added a phase-name check (start == Reviewer -> Ci); 4a3c433d6a REPLACED it with ci_gated_start_phase(start, ci_green), keyed on the FACT rather than the phase name, and its doc comment states why the phase-name version was insufficient - recorded Ci against a probed Merge skips CI too, and no Reviewer-only check catches that. That is the half-fix-leaves-the-shape trap identified and avoided by the implementer, not by me. I VERIFIED THE WIRING rather than the helper, because a correct unit behind an unwired seam is the failure mode this repo keeps hitting: the gate is called at lib.rs:78602 in handle_from_pr, replacing the old inline check. I ALSO TRACED THE FACT IT KEYS ON, since a gate fed a stale input is the same defect one door over - facts.ci_green is a current-head forge probe on BOTH paths (drain_cmd.rs probe_resume_facts and the seeded-PR refresh at lib.rs:78536), and only CiProbe::Green counts, so a PENDING pipeline reads not-green and holds the resume at Ci. Terminal-green is therefore what is required, which is what the finding asked for. The requested integration test exists and covers the real path rather than the helper.'
