  content: '[aida:advisor] REFUSED, NOT NEARLY-SHIPPED. Tagged refused-awaiting-rework 2026-09-20 19:42. This spec reads Done while PR #1981 carries a refusing verdict at f4e2cb3c67 and is held on both layers. Done is literally true - work finished on a branch - and operationally misleading: the drain''s ineligibility line reads ''Done - awaiting merge; route via aida queue work --from-pr or aida integrate'', and BOTH of those routes SHIP a PR. Following that hint here attempts to merge work with open findings. The spec is also absent from aida list --status needs-attention and from findings, so it appears on no surface that would route a rework round to it. NOT REQUEUED DELIBERATELY: BUG-1476 means a rework round on a spec with an existing PR may produce no commit, and three reviewer cycles were burned this afternoon proving that. The tag makes it findable now; the systemic fix is BUG-1515, which requires surfaces reading Done to read the verdict beside it rather than adding a sixth lifecycle state.'
