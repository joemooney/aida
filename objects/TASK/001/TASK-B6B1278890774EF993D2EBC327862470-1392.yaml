title: 'Rollover-tolerant persisted readers: unknown-field tests for advisor-loop Service/Binding/Failures, review_watch_pause, admission Hub; gate pickup_retry_at with the counter (BUG-2758 follow-up)'
description: |
  Follow-up from #4550 BUG-2758 (advisor-122 OVERRIDE->APPROVE 2026-11-24 18:52 at 0ec9c312; filed by product-15). MEDIUM. The 2026-11-24 review-watch outage class (an older binary rejecting a newer binary's persisted field) can recur in other persisted readers.

  ## Acceptance
  - AC1: Unknown-field regression tests (an extra field still loads) for each persisted reader: advisor_loop_service Service / Binding / Failures, the review_watch_pause journal, and the admission Hub deserializer; make each tolerate unknown fields where it does not yet.
  - AC2: (F4) pickup_retry_at is not written before the pickup_retries counter is non-zero (or both are gated together). Test.
