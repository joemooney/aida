  content: 'Context from the STORY-1475 review: STORY-1475 now ships a minimal pack-local manifest, .aida-delivered (one skill name per line, in .codex/skills/ and .antigravity/skills/). It is written by Scaffolder::apply and by refresh, and applies only to REFRESH_DELIVERED_SKILLS = [aida-orchestrate]. This task should generalise it: seed from existing manifests, then remove the allow-list. Also note that the include_aida_<name>_skill flags (for example include_aida_orchestrate_skill) are ScaffoldConfig defaults only and are not saved per project. Refresh rebuilds ScaffoldConfig::default(), so a project cannot opt out of a delivered skill through config today. Decide whether the manifest, or a persisted [scaffold] setting, should carry opt-outs.'
