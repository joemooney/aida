description: |-
  From STORY-3202
  Reviewed sha: e82f91c3ca988e163ee867fafd0651bab5ce57ee

  aida-cli-lib/src/vendors/host_diagnostics.rs agy_auth_probe_check KeyringOnly fix text tells the operator to sign in with `env -u DBUS_SESSION_BUS_ADDRESS agy` (or set GEMINI_API_KEY). The live dell1 finding recorded on STORY-3202 (product-15 2026-11-26 23:42) is that agy picks file-based token storage when it detects an SSH session (cli.log: 'Using file-based token storage because SSH session detected'), and the verified fix was signing in from `ssh -t <host> agy`. Unsetting DBUS_SESSION_BUS_ADDRESS is not shown to switch agy to file storage, so the named fix may leave the operator keyring-only. Name the verified `ssh -t <host> agy` path (keep GEMINI_API_KEY only if agy honours it headless) and assert it in story3202_agy_auth_probe_classifies_without_hanging.
