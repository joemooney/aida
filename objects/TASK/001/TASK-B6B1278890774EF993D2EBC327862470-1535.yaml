  Test gap (deferred): the new tests exercise retry_transient_admission_with with synthetic outcomes and admission_gap directly, but nothing exercises the wiring: retire_with's mapping of WriterAdmissionUnknown{transient:true} to RetentionRefusal.transient_admission (aida-core/src/mailbox_lifecycle/guard.rs:214-224), nor the two call-site predicates (aida-cli-lib/src/dispatch.rs:2547-2551, aida-cli-lib/src/queue_cmd/work.rs:4260-4263). A mutation that drops the flag survives the suite. Its only effect would be no retry, so the barrier still fails closed and this is not an authority path. Add one test that drives retire_checkout through a transient FRESH_SCAN refusal and then a pass.
