title: 'Review follow-up: backlog_report.rs driver_activity/stale_claims: lane logs are named <branch>-<session>.jso'
description: |-
  From STORY-3143
  Reviewed sha: d529d3b23b5c867f25514c44633fc8333b2cd11a

  backlog_report.rs driver_activity/stale_claims: lane logs are named <branch>-<session>.jsonl (standalone_implementer.rs:1621, queue_cmd/work.rs:7683), and a lane log only counts toward a spec when the branch name contains the spec ID. Lanes on branches like report-backlog-s3, and lanes whose logs live on the lane host rather than in the local .aida/headless-logs, add no driver activity. For those specs the stale-claim test quietly falls back to status age, the S2 behaviour. This fails safe: it can only over-prescribe a release command and never acts. Follow-up: map logs to specs through the lease/session record instead of the file name, or list the specs with no activity source among the unavailable signals.
