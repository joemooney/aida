    F2: current-caller and persisted-requester validation share the canonical local `seat_authority::validated_grant` implementation. Ack and release install a callback that reads the persisted grant/roster at handover under the seat lock, rather than carrying a pre-lock authority snapshot. It checks grant handle, subject, session, seat, revocation, expiration, roster ceiling and the existing direct-grant constraint. Missing/invalid authority cancels the request without demoting the holder. Request records now persist the validated subject; legacy records deserialize but cannot transfer without that binding. Existing provably-dead requester release behavior is retained.

