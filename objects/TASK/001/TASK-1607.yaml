    Use eventual REAL foreground/queue/rework/TUI/phase/pipelined/pane/containment entrypoints, fixed compiled fake vendors, fake HOME/AIDA_HOME, owned private server/processes, deterministic barriers/clocks and storage faults. No live peers or stores. Include installed-version Codex compatibility separately: pinned wrapper/package translation, native leaf identity, argv/cwd/stdio, package root and four manager flags, signals and exit behavior. Source/manual inspection cannot supply those positives.

