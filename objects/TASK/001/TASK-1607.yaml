- id: 01a119ac-15f8-7141-a1dd-87492a75b840
  author: task1607-launch-v2-author
  content: |
    SKETCH (awaiting advisor signoff): TASK-1607 — consume the BUG-1808 launch COMMIT and image amendment

    Author: Codex `task1607-launch-v2-author`, native thread `01a1199f-fe3b-7983-92ad-7bec4eb7f2e9`, Joe-assigned separate sketch revision author, not an approver. Canonical role check returned advisor; AIDA_SESSION_ID absent. No review grant asserted. Written 2026-10-07 America/Phoenix. No source/build/test/live experiment, status/queue/grant/hold change or merge. Final authority-sensitive merge is operator-owned.

    ## Consumption and exact precedence

    Consume, without a second schema or launcher, [BUG-1808-launch-commit-addendum.md](BUG-1808-launch-commit-addendum.md), SHA256 `4d67af90b7320da207c7f1181ff7ab95d52d27d0fe5e4890be256d1afbf571ec`. Its single transition table and predicates A/J/O/I/W/C are the proposed owner contract. Canonical owner-comment identity and exact readback are recorded in TASK1607_LAUNCH_V2_READY.md after posting. This reference is to an UNSIGNED proposal, not approval.

    It amends the first TASK sketch comment `01a11997-3fca-7e32-88ba-2b329d2484c9` / SHA256 `22132f33f50fc481b01bfa2b068e46ec391625545aedf58cc2be6fbec80671e6`, answering actual verdict `01a1199c-f282-7fe3-868a-e3700eba3ab3` / SHA256 `0b0ce1a632fcb00930df601673f1feaa63c8a9cdef9fbfa899a68d04edc7f496`. The actual report and receipt were read, not just author readiness. Both old files/comments remain unchanged. The owner's pin table includes BUG-1808 v3/v4 and their actual decisions.

    Signed ADR67–69/C1–C7 comment `01a11414-7a30-7c81-a448-8daae92280d9`, C1 classification `01a11416-624f-71c3-a7cf-2f838abb9069`, ADR70/C8 `01a1146c-d0b2-7d00-8420-3f57927b290b`, C7 findings/refinements and exact-head checkpoint remain binding. Signed STORY-1485 sketch is faa07e4acb, independent signoff `01a1098d-c88a-7637-9f1c-6ffffb7c5310`; two-slice decision `01a109d7-c733-7769-9c89-6f697d02c566` remains. No proposal overrides those decisions without independent signoff.

    C7_F3_INDEPENDENT_REVIEW.md approves ONLY core at `56f7b55b32fba77a2b8bdbdd2573d59cce0ca29f`. Owner checkout remains story-1485 at that SHA; main is `199e591b07aa76a59cd34f0a41946f918501f6ba`. PRODUCTION_GATEWAYS_READY.md is **NOT READY**, with inherited diagnostic LIVE_CHILD_UNRECORDED=true / RETRY_AUTHORIZED=true. That diagnostic was not rerun. The production inventory's 1321 candidates across 222 files is not semantic coverage proof.

    Exact replacements to old TASK steps 3–5: actual PID binding and occupancy child after-image are provisional until the SAME BUG-1808 P4 decision; final authorization/generation check is parent-owned under ordered guards. Finish/retain proof, drop all locks, then release. Child validates immutable one-shot dispatch/channel/image, takes NO seat/home lock and makes NO fresh authority decision. Remove the old “transfer before final lock invalidates RELEASE” rule and final-exec-under-seat C8 expansion. ETXTBSY retries revalidate the same committed attempt's transport/image, not current issuer authority. All unaffected old first-action/channel/storage/parent-death/FD/no-peer/acceptance obligations stand, amended where their expected generation-race result assumed that rejected second check.

    ## TASK-1607 integration points

    Proposed `SeatPermit::commit_waiting_child` is an in-process contribution to the owner's enlisted seat after-image and P4 O predicate, not a separately committing launcher. `ChildSpawn` references the owner's publication/assignment/activation/receipt and stores committed generation/issuer identity/image digest. No parallel authority array or durable seat reservation. `verify_activation_for_exec` becomes immutable committed-dispatch verification, preferably named `verify_committed_dispatch_for_exec` so it does not imply a new gate. A legacy child row still supplies C7 scope where valid; it cannot release a new process.

    Fresh runtime and seat lifecycle classification stays home-first then seat; local locked authority reads use preentered guarded APIs. Seat stays before queue. Git/store hooks and all child/READY/RELEASE waits, mailbox/network/forge, termination, reaping and ETXTBSY sleep are outside seat. A no-guard ordinary/plain-shell one-shot cannot manufacture holder occupancy. Current holder/requester grant and deadline revalidation preserves C7 F1/F2/F3, including contention races; the new shared guard must not revive pre-lock authority snapshots.

    Already committed children may continue assigned work after transfer. The retained generation describes the authorization at dispatch; it is not required to equal a later holder's generation for that one exec. New peer spawn/LoopStart/Handoff still requires new authorization. Later privilege checks remain current: a child's first ordinary AIDA operation may itself refuse after a grant-chain revocation, even though its earlier committed process launch remains valid. Such a separate refused operation must have no changes of its own. Do not move queue-work setup into that operation to hide a second same-invocation refusal.

    ## Actual entrypoint dispositions

    | Entrypoint | Required owner, actual leaf and support disposition |
    | --- | --- |
    | `dispatch_agent_new -> run_tracked_agent` foreground | Shared publisher stages session/context/registry before C; exact bootstrap PID becomes native vendor PID via descriptor exec. Registry is never best-effort after spawn. Required positive. |
    | `handle_queue_work` interactive/fresh/headless, standalone reviewer | Shared pickup owner issues one scoped child grant. `spawn_vendor_headless_with_seat`, `run_standalone_reviewer`, reviewer launch plan and low wrappers consume J; no second issue_child. Required positives with matching native/adapted vendors. |
    | `spawn_claude_headless_resume`, interactive resume, advisor_watch | Authorized owner binds retained native conversation/predecessor/actor and new activation. Resume preserves actor, new sibling reviewer does not share actor. Ambiguous or unsupported resume refuses before writes; never silently fresh-launch requested old actor. |
    | `exec_claude`, `exec_codex_session`, `exec_claude_resume`, `exec_vendor_headless` | Retain actual supervising AIDA parent and same-PID bootstrap-to-leaf exec. A CLI process that formerly execed vendor cannot be mistaken for a subsequently spawned leaf. Required positives; one issuance. |
    | RealPhaseDriver implementer/reviewer/resume, pipelined member | Driver owns one phase attempt/grant; direct assigned leaf replaces nested queue-work setup. J binds token/member/phase/attempt/actor/grant and live parent/member at P4, not shared current. Root/first admission/first phase setup is one refusal boundary; registration before status/release. Later phases/admissions are separate transactions. |
    | App::spawn_tab / queue_work_argv / PtyHost | PTY's actual AIDA queue launcher is publisher and creating parent. Its owned bootstrap gets planned terminal stdio; TUI receives only launch-result locator and verifies retained C before tab-success persistence. TUI/PTY host PID is not leaf proof. Explicit `--no-launch` is setup-only and needs a new authorized activation later. Both actual PTY positive and setup-only expiry refusal required. |
    | `pane_host::host_implementer_in_tmux` | Existing shell/rc/tmux PID rendezvous cannot satisfy sealed-helper exec or actual creating-parent evidence. Proposed managed pane support MUST introduce a descriptor-preserving authenticated local host adapter with exact outer owner -> inner creating supervisor -> bootstrap joins, using the SAME owner schema, before any grant/setup publication. This revision does NOT assert that adapter exists or specify a new pane wire format. Until independently concretized/implemented, refuse managed pane at P0 with diagnosis, before tmux/session/grant/setup writes. No fallback after an uncertain pane result. Pane positive acceptance remains outstanding and blocks full TASK-1607; a refusal is not a positive substitute. |
    | `agent_new_bg_dispatch` / native Claude daemon | P0 refusal before context/registry/grant/setup. Dispatcher PID/stdout/native session text does not bind a pre-exec daemon leaf. No guessed mapping or stopping existing daemon/peer. This retains the earlier explicit unsupported boundary. |
    | `os_wrapped_program_and_args` / bwrap / namespaces | Preserve all requested read/write mounts, settings, environment and parent-death containment. Current bwrap argv/--die-with-parent alone is not a descriptor/host-PID/inner-thread adapter. Refuse this managed variant before writes until exact image-FD passage, innermost supervisor/creating-thread lifetime, host-visible PID/start mapping, credentials and adopter are specified and tested. Never unwrap or count bwrap PID as vendor. Existing containment positive remains an explicit integration blocker, not waived acceptance. |
    | Native images / installed Node-to-native Codex / scripts | Use owner SealedExecImage and CodexNodeNativeAdapter contract. Codex wrapper is translated, not launched as trusted leaf. Compiled fake vendor and supported native/adapted installed variants are required positives. Unknown shell/interpreter/JS chain and credential-changing variant refuse before setup; required missing variants remain blockers. |
    | macOS/Windows/unknown probes | Keep ADR69 and TASK-1609/1610 diagnoses; no fabricated start identity. No platform promise from Linux descriptors. |

    The explicit pane/containment gaps do not authorize deleting those inventory rows, rewriting the acceptance, or marking full production ready. A different advisor can approve the bounded Linux common mechanism independently while requiring these adapters before full activation. Their absence is stated here instead of inventing an executable launch chain.

    ## Proposed tests — no tests run

    Use actual CLI and production dispatch/phase/TUI paths, isolated HOME/AIDA_HOME and temporary repositories/stores, fixture-only grants, fake forge, deterministic pipes/events and controlled clocks. The compiled fake native vendor's FIRST action writes/fsyncs sentinel {PID, boot/start, activation, image identity}; only then does it invoke assigned-scope operations. Snapshot canonical objects/full inline history/store HEAD; queue bytes/order/metadata; refs/reflogs/index/FETCH_HEAD/worktree admin/dirs; grants/manifests/registry/receipts; seat generations/children/requests/tombstones/outbox; run tokens/member snapshot; calibration/stack/review/signal/logs; publication locator/journal; FD/process inventory; peer data and permanent lock inode identities. Initialize caches/infrastructure, and separately test missing-infrastructure unchanged refusal. Do not use live peers/store/timers as fixtures.

