  author: joe
  content: |-
    Decision (C1, drain-child classification, guided 2026-10-06): a caller is classified by (anchor, grant, persisted child record), never by env labels.
    1. HOLDER: caller anchor == the seat record's holder anchor (pid + start identity) AND validated grant session == holder grant session -> protected ops pass under a reservation.
    2. CHILD: caller's ancestry contains a bound/holder or tombstoned anchor, but its own anchor differs (drain-spawned headless implementer/reviewer: its own claude/codex process, usually no grant). Own-scope ops pass with no claim and no reservation: queue done/dequeue/status edits/comments/commits on its own spec, where 'own spec' is the spec recorded on the committed spawn reservation for that child (falling back to the child's registered session lease scope). Protected ops (start a loop, route or enqueue other specs, spawn peers) refuse: a delegated worker cannot use its parent's occupancy.
    3. DEMOTED: caller anchor == a tombstoned anchor (former holder still alive) -> every protected op refuses, including an implicit claim of a fresh generation (C4); only explicit `aida session seat takeover --force` from a fresh anchor, or the tombstoned process dying, clears it.
    4. ORCHESTRATOR-GRANT, NOT HOLDER: validated grant seat is single-occupancy, anchor is not the holder -> implicit claim (ADR-68) if the seat is empty or provably dead, else a refusal naming the holder (C3).
    5. ORDINARY: none of the above -> unaffected.
    Required test (C1): drain-shaped parent->child where the child completes its own scope (queue done + status edit) while the parent holds the seat, and the same child is refused when it enqueues another spec.
