    ## Source and OS evidence; stop boundary

    Pinned source confirms `pane_host::host_implementer_in_tmux` shell/rc/default-zero result and `RealPhaseDriver` fallback; `PtyHost::signal_tree` guesses negative PID then bare PID; `App::spawn_tab` persists immediately after host spawn. `os_wrapped_program_and_args` writes managed settings and uses stock pathname argv; its mount builder has no PID unshare. Occupancy record_child captures after spawn and supplies empty start on failure. Source bytes and the author's recorded installed-image hashes match the pinned comparisons in inputs.json. None is the proposed production adapter.

    Documentary kernel checks: [parent-death signal](https://man7.org/linux/man-pages/man2/PR_SET_PDEATHSIG.2const.html) covers creator-thread death, fork clearing and credential resets; it cannot kill arbitrary forked tools. [PID namespaces](https://man7.org/linux/man-pages/man7/pid_namespaces.7.html) define ancestor visibility, zero outer parent and PID-init teardown. [Unix sockets](https://man7.org/linux/man-pages/man7/unix.7.html) ground credentials/SCM_RIGHTS; [proc status](https://man7.org/linux/man-pages/man5/proc_pid_status.5.html) qualifies namespace vectors. [tmux 3.4 source](https://raw.githubusercontent.com/tmux/tmux/3.4/spawn.c) closes extra descriptors and distinguishes multi-arg exec from shell; [its manual](https://raw.githubusercontent.com/tmux/tmux/3.4/tmux.1) defines -D/-N. [bubblewrap v0.9.0 source](https://raw.githubusercontent.com/containers/bubblewrap/v0.9.0/bubblewrap.c) exposes monitor/clone/init, credential drops, FD closure and final execvp. Upstream source is not distro-byte equivalence or a live probe.

