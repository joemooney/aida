    Retain EVERY inventory row: CLI/MCP/core/backend queue writers (including direct backend.queue_add and bulk conditional removal), schedule/backlog/assign/archive/defer/doctor/init, findings/promote/review routing, advisor_watch, all launch/phase/pane/PTy/resume gateways, handoff, supervisor delivery to valid live holder and no independent timer loop. C1 assigned own-scope direct review/implements graph remains; assigned child cannot peer-spawn or start a loop. Missing env/seat/role cannot erase bound/demoted lineage. Valid plain-shell one-shot exemption retains its narrow scope and cannot manufacture a holder. LoopStart always requires occupancy.

    History remains UUID-idempotent projection into existing events/history; durable successful projection precedes clearing outbox. A launch receipt is not a replacement history ledger. Preserve C2/C3 notices, C4 demotion/env-omission fencing, C5 amendment disclosure, C6 macOS/Windows release disclosures and TASK-1609/1610, C7 checkpoint-only scope, C8 local-only region, disabled --kill. Keep TASK-1337 role/delegation/branch-before-setup, idle-clean-unlocked-unleased manual retirement, and post-authorized startup-failure worktree-enter/guided continuation. Keep TASK-1603 independent token records, living member/parent joins, checked dynamic snapshot registration and permanent sidecars.

    Git PreparedGitStep credentials/dispatch are Git-only; vendor CommittedDispatch is private common publisher output. Stricter sealed Git runtime/config/attributes/hooks/loader cannot be replaced by vendor's trusted system loader or broad vendor filesystem policy. Actual formatter/restaging/store trailer/glyph/skill-sync effects and parent-serviced callback pump remain under home without seat. No Git callback under seat; no child normal CLI re-entry. Recovery quiesces exact old Git domains, uses fresh Git-only credentials and never creates a vendor permit. Callback v5 actual six amendments remain binding in full.

    ## Proposed deterministic real-entrypoint acceptance — NONE RUN

    Run future tests only in fake HOME/AIDA_HOME/temp stores/repositories with owned fixture processes, private tmux and namespace resources. A fixture native vendor writes/fsyncs first-action PID/start/image sentinel. Real installed-version Codex translation compatibility must additionally be witnessed in isolated state: Node never serves as vendor PID, exact pinned wrapper/package selection, argv/cwd/stdio, four manager flags/package root, signal forwarding and exit behavior. A missing required installed positive stays open; no blanket wrapper refusal satisfies it.

