    Full before/barrier/after snapshots: canonical objects/history/store HEAD; refs/reflogs/index/FETCH_HEAD/admin dirs; queue order/metadata/calibration; all grants/leases/manifests/registry/receipts; seat children/generation/requests/tombstones/outbox; run/member/phase/attempt snapshot; review/punt/hold/signal artifacts; locator/journal/staging; permanent lock inode identities; full owned and peer PID/start/TID/parent/namespace/credential/mount/FD snapshots and vendor sentinel evidence. Old setup remains exact for new activation refusal. Production hook/cross-repo recovery and all original launch/C7/TASK-1337/TASK-1603 tests remain. Later guard-removal/restoration proves refusal nonvacuity; neither these proposed names nor documentary hashes are passes.

