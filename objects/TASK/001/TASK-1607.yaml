    | `bug1808_adapter_replay_cancel_lost_ack` | Duplicate/replayed/partial/truncated release, cancel-before-send, send/cancel race, lost ACK and delayed channel never cause second issuance or fallback. Same-PID returned ETXTBSY only; all other retries are new transactions after settlement. |
