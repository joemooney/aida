- id: 01a11997-3fca-7e32-88ba-2b329d2484c9
  author: task1607-launch-sketch-author
  content: |
    SKETCH (awaiting advisor signoff): TASK-1607 bounded pre-execution launch commitment

    Author: Codex `task1607-launch-sketch-author`, native thread `01a11990-0129-7ad1-a1b1-c291bdca1a84`, advisor role verified by `/home/joe/ai/aida/target/agent/aida role current --check`. AIDA_SESSION_ID is unset; no invented AIDA session/lease or independent approval is asserted. Written 2026-10-07 America/Phoenix. A DIFFERENT advisor must sign this proposal and its prerequisite amendment.

    ## Authority and observed gap

    Owner: existing TASK-1607 implementer, branch `story-1485`, worktree `/home/joe/ai/aida-worktrees/aida-task-1607`, lease `01a119224b9d`. Inspected clean exact HEAD `56f7b55b32fba77a2b8bdbdd2573d59cce0ca29f`; main authoring cwd is a different checkout at `199e591b07aa76a59cd34f0a41946f918501f6ba`, with pre-existing untracked files left alone. C7 canonical verdict is `approved` at that exact head, recorded 2026-10-08T03:16:21.665963503Z by task1607-c7-f3-reviewer. Its inherited findings/actionability fields do not negate its explicit checkpoint-only summary. C7 approval is retained, not extended to production acceptance.

    Read TASK-1607 description/all 18 comments, signed sketch faa07e4acb and STORY-1485 independent signoff, ADR-67–70/C1–C8, C7_F3_INDEPENDENT_REVIEW.md, PRODUCTION_GATEWAYS_READY.md (NOT READY), PRODUCTION_GATEWAY_INVENTORY.md and production-audit/record-failure.log. The recorded diagnostic, not rerun here, says `LIVE_CHILD_UNRECORDED=true RETRY_AUTHORIZED=true`: EACCES in SeatPermit::record_child leaves a live child and unchanged seat record. A parent crash after spawn/before save has the same source-level hole. This proposal closes vendor execution before durable binding, not all production gateway work.

    ## Existing utilities and exact source anchors

    All code anchors below are at 56f7b55 unless stated otherwise; paths are relative to its worktree.

    - `aida-cli-lib/src/seat_occupancy/runtime.rs:105–141`, SeatPermit/record_child: accepts a PID after work starts, substitutes empty start identity on capture failure, then saves. `authorize_with_caller:188` refreshes caller under lock; retain that F3 fix.
    - `seat_occupancy/mod.rs:139` ChildSpawn contains identity/spec/generation/what/time, not grant/assignment joins. `classify:299` and `prune:403` preserve exact child scope after reparenting and retain Unknown identities. `record_child:887` has no launch barrier.
    - `seat_occupancy/store.rs:72,123`, lock_with_timeout/save: permanent sidecar, ten-second bounded acquisition; save calls `aida-core/src/fs_atomic.rs:91::write_atomic`, which writes then renames WITHOUT file/directory fsync. Atomic visibility alone is insufficient for a durable launch release.
    - `aida-core/src/process_probe.rs:26,131,162` provides PID + Linux boot/start identity and tri-state capture/probe. Do not use the permissive boolean liveness compatibility helpers as proof.
    - `aida-cli-lib/src/process_retry.rs:23,72` only retries ETXTBSY (five retries, 50 ms); it is not a startup handshake. Retrying status/output can launch and wait; never put those calls under occupancy lock.
    - `lib.rs::run_tracked_agent:32512` spawns at 32584, registers afterward around 32617, then waits. `agent_new_bg_dispatch:29449` expressly leaves process ownership with Claude's daemon around 29757. Registry PID alone is not the future exec identity.
    - `session.rs::spawn_vendor_headless_with_seat:1179`, `spawn_claude_headless_resume:3035` issue child grants then use status; `exec_vendor_headless:2769` actually spawns/waits and stamps a lease afterward. True exec paths include exec_claude, exec_codex_session and exec_claude_resume. `spawn_reviewer_launch_plan` and guided_session_launch dispatch among these.
    - `pane_host.rs::host_implementer_in_tmux:154` launches a shell command, then waits on tmux and an rc file; its current fallback is unsafe after uncertain activation. `session_manifest.rs:77` and `orchestrator.rs:88::RunMarker` do NOT contain the proposed reciprocal activation/child-grant binding. `seat_authority.rs::issue_child` is the existing issuance owner primitive.
    - `internal_cmd.rs::handle_internal_command:17` has no bootstrap entry today. Bootstrap dispatch must precede ordinary CLI initialization/store/cache/hooks, not run them while merely waiting.

    ## Ownership: precise prerequisite, not a second launcher

    BUG-1808 canonical independent decision `01a11983-323f-7a13-85b7-87635929a4e2` binds implementation order: BUG-1808 owns common LaunchPublisher, publication guard, assignment/activation schema and receipts FIRST; BUG-1802 consumes later. Its v3 and v4 addendum remain proposed, not approved or implemented. They cannot supply today's missing identity by assertion. The existing manifest and RunMarker source above proves the prerequisite is absent.

    TASK-1607 therefore must NOT independently introduce a competing bootstrap format or call the unsigned whole publisher approved. Proposed minimal amendment for independent signoff: extract a first, separately reviewable BUG-1808 shared-local-launch slice, including the ONE assignment/activation vocabulary and transport below. TASK-1607 depends on that concrete slice and adds only its occupancy commitment/exec validator. BUG-1808 retains ownership of shared code and later composes its multi-resource publisher with the same API. BUG-1802 remains a later consumer, never a prerequisite for launch or reviewer process identity. No dependency/status/queue edits are performed by this author.

    The prerequisite deliverable is explicit: a parent-owned prepared assignment joins canonical repo, manifest/lease scope, issuer grant/session, distinct child grant where delegation applies, actual child PID/start, activation ID, selected seat, and run token/member/phase/attempt for phase launches; reciprocal persisted records and a durable receipt validate this join. It must implement fresh/current and already-issued consumer paths with exactly one grant issuance owner. An inherited driver handle or shared DrainState.current cannot fill a missing join. C7 no-grant child classification remains valid core behavior; it does not authorize an unbound production phase to execute under its parent's grant. This is the existing BUG-1808 independent B decision, not newly invented review policy.

    The first slice may expose transport plus durable binding/receipt without enabling BUG-1802 provenance enforcement. It must not claim BUG-1808's full late-refusal atomicity is solved. If its required shared assignment publication cannot be separated from BUG-1808's pending Git/callback mechanism, that exact publication integration is the prerequisite for affected pickup paths; keep those gateways disabled until it is approved and implemented. Foreground support alone cannot satisfy TASK-1607's all-gateway activation criterion. No circular dependency: the common primitive has no dependency on occupancy; TASK-1607 supplies a local policy callback.

    ## One mechanism: owned waiting bootstrap, record, release, checked exec

    Proposed shared APIs in `aida-cli-lib/src/launch_publication.rs` (BUG-1808 owner): `PreparedLaunch`, `WaitingChild`, `LaunchPublisher::{spawn_waiting,bind_waiting_child,release_bound_child}`, and `bootstrap_main`. `session::spawn_bound_vendor` is the sole covered vendor launch adapter. `WaitingChild` owns the Child/pidfd and private channel; release consumes a non-cloneable committed binding token. These are proposed names, not current APIs.

    TASK-1607 replaces the production use of raw `SeatPermit::record_child(pid,...)` with `commit_waiting_child(&WaitingChild, &CommittedAssignment)`; `verify_activation_for_exec` is the corresponding leaf validator. It cannot authorize an arbitrary Spawn: it accepts only this already recorded activation on its inherited authenticated channel. ChildSpawn adds references to the shared assignment/activation/receipt, issuer identity/grant session, command digest and deadline, not another assignment schema or durable reservation state machine. Legacy child rows retain their C7 classification but cannot release a new activation.

    1. **Prepare outside seat lock.** Resolve exact executable/argv/cwd/environment/stdio and authoritative local roots, caller and child role, grant/assignment, run admission and current scope graph. Perform network/Git/hooks/publication preparation, log/PTY setup and unsupported-adapter checks here. Preserve TASK-1337 selection/delegation/branch checks before setup; preserve TASK-1603 token-specific membership registration before phase status and launch. Publication coordination, if present, acquires its outer locks before seat; seat remains before queue. No callback under seat may discover/reenter a home/repo/store lock. Authority/scope read-set must be locally revalidated before commitment, not trusted merely because preparation passed.
    2. **Spawn ONLY the bootstrap under a fresh local permit.** Use a pinned AIDA executable with an early internal bootstrap dispatch, not a shell or vendor init. `Command::spawn` returns its owned Child; no READY/completion wait occurs under seat lock. Capture actual returned PID/start with process_probe, acquire an identity-bound handle, verify pinned helper executable and expected direct parent. Missing/Unknown identity refuses; never synthesize an empty start. Bootstrap only initializes its fail-closed channel and waits; it cannot run pickup, vendor hooks, worktree code, grant issuance or vendor logs. It is safe if it starts before its record exists.
    3. **Durable bind under current generation.** Freshly validate current holder/grant, pending request, generation and exact assignment/scope. Bind the same child's actual identity into the existing shared assignment publication and seat child reference. The prerequisite must provide already prepared local binding writes/receipt; do not execute multi-resource Git publication under seat. When outer publication work remains, unlock, finish it outside seat, then reacquire and revalidate before completing the seat bind. Failure never yields a release token. Grant/assignment receipt and seat reference must all be durable before release; orphaned references confer no execution right.
    4. **Unlock before handshake waits.** Drop all publication/home/repo guards as well as seat before waiting or sending RELEASE; never have a parent wait for a child that must acquire its outer guard. Parent receives bounded READY and authenticates its actual sender against the owned Child PID/start; then sends one fixed-size RELEASE frame containing activation ID, unpredictable channel nonce, command/binding digest, issuer identity, repo/seat/generation and absolute monotonic deadline. Release is a nonblocking full-packet send; partial/truncated/oversized/wrong-state frames fail closed. No send success or ACK alone means vendor execution succeeded. Parent retains channel and Child ownership until startup settles; waits/tee/registry presentation/forge/mail/child completion are outside seat.
    5. **Final local exec commitment.** Receiving RELEASE is insufficient. Bootstrap checks exact sender parent and channel, its own PID/start and deadline, then enters any required shared publication guard BEFORE boundedly acquiring the SAME permanent seat lock. Shared recovery/Git/hook work completes before seat acquisition; immutable receipt and local authority reads under seat never reenter an outer guard. It re-reads durable binding/receipt, requires exact current generation, still-valid issuer authority and assignment, no intervening takeover/request/demotion, and exact command digest. Compare the retained issuer, not bootstrap's inherited environment. Same-generation authority failure refuses. It validates one recorded activation, not child permission to spawn a peer. On success it performs same-PID exec with the seat guard and any required outer local authority guards all close-on-exec. No pending publication recovery, Git, queue or store write remains. The kernel closes those guard FDs on successful exec before vendor userspace runs; failure explicitly drops all guards. If the common publisher requires an outer guard for current authority validation, it cannot be released early to introduce a check/exec race. There is no ACK or peer wait under this guard. A transfer winning before this final lock invalidates old RELEASE; a transfer winning after exec sees an already bound in-flight child. This second check closes the unlock-to-delayed-release race without a reservation that blocks transfer.

    C8 amendment requested explicitly: a bounded local bootstrap exec and final generation validation belong to local commitment; all READY/RELEASE waits, publication/Git work and completion remain outside the seat lock. Ordinary callers stay ordinary, and plain-shell one-shot exemption remains: the shared launcher can use its own assignment receipt, but must not manufacture an occupancy holder/child row for an unrelated ordinary invocation. Orchestrator-bound launches cannot take that exemption. Activation validators are selected from trusted classified plans, never an env flag. No public release command or resumable release file is added.

    ## Process/channel details and bounded failures

    Linux initial adapter: unnamed AF_UNIX SOCK_SEQPACKET socketpair, SOCK_CLOEXEC, SO_PASSCRED; validate kernel SCM_CREDENTIALS on READY/RELEASE against expected actual sender plus process_probe start. Socketpair SO_PEERCRED at creation alone is NOT child PID proof. Neither nonce nor supplied PID text replaces the OS join. One endpoint per owner, no clones into siblings. Only the bootstrap endpoint and sealed launch description survive the helper exec via explicit descriptor mapping; the helper immediately restores CLOEXEC. Seat/queue/grant locks, parent endpoint and all unrelated descriptors are closed on helper exec. Final vendor exec closes control/error/description/lock FDs; intended stdio alone survives. Error reporting uses a CLOEXEC error channel; EOF can also mean death, so it is not proof of successful exec.

    The direct child's minimal startup sets PR_SET_PDEATHSIG(SIGKILL), then verifies getppid and captured parent start, closing the death-before-prctl race. Spawning thread must remain alive through startup (no short-lived pool-thread spawner). No credential-changing/set-id/capability exec is supported; it can clear the death signal. Keep parent-death protection through exec; the supervising launcher waits outside locks. Normal parent exit must follow child completion. This governs only the invocation's own child, never existing peers. Linux's documented thread/exec caveats are part of the adapter: https://man7.org/linux/man-pages/man2/PR_SET_PDEATHSIG.2const.html ; credential transport: https://man7.org/linux/man-pages/man7/unix.7.html ; exec descriptor rules: https://man7.org/linux/man-pages/man2/execve.2.html .

    Channel ownership is a safety property: every parent error/drop path invalidates the owned bootstrap via its pidfd BEFORE closing a possibly released channel; closing an unused/unreleased channel simply yields EOF/refusal. A crash closes it and delivers parent-death death protection. The bootstrap rejects EOF/HUP even with queued RELEASE before final exec, and never clears parent-death protection in a check/exec window. A raw close-after-RELEASE path without cancellation is forbidden and must have a regression. No remote transport can independently disappear in this local socketpair. Timeout while waiting closes without exec; final lock has a short remaining-deadline budget. Deadlines bound retries and protocol waits, not an impossible guarantee against a hung kernel/filesystem syscall.

    Durability: add a narrowly used `SeatGuard::save_durable` (or strengthen its writer after review): exclusive sibling temp, write_all, file sync_all, rename, parent-directory sync_all, exact readback/digest before token. Shared assignment receipt must offer equivalent durability. A post-rename/fsync error may leave the new row visible: no RELEASE; preserve evidence and reconcile exact child outside lock, never assert unchanged bytes. Pre-rename EACCES leaves the old row. No vendor work exists in either failure case. Readback alone is not a substitute for fsync.

    | Boundary/failure | Required outcome and retry evidence |
    | --- | --- |
    | Spawn failure; parent death before helper startup/record | No vendor. Helper exits on parent/channel check; no valid token. Owned process is reaped outside lock; no persistent reservation. |
    | Capture/READY credential/assignment/save failure | No RELEASE and no sentinel. Unlock first, terminate/reap ONLY owned identity/handle; report failed step. Unknown capture does not permit bare-PID signaling: unreaped owned Child/handle or channel shutdown supplies cleanup ownership. |
    | Parent death after record, before RELEASE | Durable exact child may remain; bootstrap dies without vendor. Next holder may transfer normally; retry requires proof old assignment attempt is dead/settled, not age expiry. |
    | RELEASE send failure | No automatic fallback. Kill/settle owned attempt outside lock; partial/invalid packet never executes. If delivery might have occurred, retained exact identity/receipt means execution cannot be claimed absent. |
    | Death after RELEASE but before exec | Parent-death protection/owned cancellation prevents vendor entry; deterministic pre-exec barrier test required. Child may have acquired final lock; exit releases it. |
    | Death after successful exec | Work MAY already have begun and sentinel may exist. It was durably recorded under a valid generation; protection targets the owned child. Do not claim retroactive nonexecution or auto-respawn from absent ACK. |
    | Generation transfer, stale/duplicate/wrong-child RELEASE | Final lock rejects changed generation; nonce/identity/activation mismatch refuses. One bootstrap consumes one frame and execs once. Replay cannot manufacture another owned process or grant. |
    | Exec fails, including ETXTBSY | Drop guard before bounded backoff. Retry exec in the SAME bootstrap/PID with fresh final validation, within original deadline, never a new spawn. Definitive error retains exact binding and TASK-1337 manual continuation. |

    One activation/assignment attempt cannot be launched twice: a fresh attempt requires the predecessor positively dead/settled; Alive/Unknown refuses that retry, not unrelated seat transfer. Unrecorded unreleased bootstraps cannot execute, so they cannot create the old global crash-Unknown wedge. Once RELEASE might have been consumed, dead alone does not prove work never happened; new work needs ordinary explicit retry/resume semantics with retained prior attempt evidence. Cleanup must not erase that evidence, unlink permanent sidecars, restore whole snapshots over peers, or signal a guessed/reused PID. No automatic pane-to-background retry on uncertainty.

    ## Caller adapters and support boundaries

    - Foreground `dispatch_agent_new -> run_tracked_agent`: launcher owns shared publisher, real vendor is bootstrap exec PID; required registry/binding persistence precedes release. Terminal title and completion handling remain outside lock.
    - Headless/fresh/reviewer/resume helpers in session.rs and advisor_watch use the same adapter. Split `.status()` into prepare/spawn-waiting/bind/release/wait. Issue once at authorized launcher, consume in wrappers. Resume retains its verified assignment/native lineage but gets a fresh activation/PID; an arbitrary --resume UUID is not authority.
    - True same-PID CLI exec paths must become a supervising AIDA parent plus bootstrap-to-vendor exec, or consume a pre-bound bootstrap activation already supplied by that parent. Do not record the CLI's PID and then spawn a different vendor. The bootstrap's exec is the same-PID boundary; a resume command is not permission to skip it.
    - Phase driver (`RealPhaseDriver`, pipelined launches, spawn_and_wait_watched) uses token/member/phase/attempt bindings from the prerequisite. Assigned child executes its one activation without a new peer Spawn or recursive grant issuance. Preserve run registration before child status bump and preserve C1 own-spec/direct-review graph behavior.
    - Pane/TUI: current tmux rc rendezvous/PtyHost wrapper PID is insufficient. Supported adapter must place the AIDA publisher INSIDE the pane/PTY as actual bootstrap parent, authenticate the upstream assignment using the shared schema, and bind actual host-visible vendor PID/start before release. This local publisher is an assigned activation consumer, not a new delegated peer launcher. tmux/outer driver setup/waits stay outside seat. Until this parent/host-PID adapter is implemented and tested, refuse that managed variant BEFORE setup; never label wrapper identity valid or silently fall back. Containment/PID namespaces similarly require authenticated actual host-PID/start mapping and retained containment, else refuse. This temporary refusal is not full positive acceptance.
    - Native `agent_new_bg_dispatch`/Claude daemon: refuse before setup. Dispatcher stdout/session ID and dispatcher PID cannot provide pre-exec daemon binding. No guessed daemon mapping and no peer stop. Unsupported platforms retain ADR-69/TASK-1609/1610 refusal; disabled --kill remains disabled.

    ## Proposed named acceptance witnesses — NONE RUN

    Actual CLI plus production phase/TUI entrypoints, fixture HOME/AIDA_HOME and temp git/store, fixture grants and owned compiled fake vendor. Its FIRST action writes/fsyncs a unique sentinel with actual PID/start and activation, then invokes assigned-scope AIDA operations. Deterministic pipe/event barriers, injected clocks/I/O faults; no sleeps as synchronization, no live store, timers or existing peers. Snapshot exact seat record/generation, shared assignment/grant/receipt, queue/status/run membership and peer rows. Preserve all C7 tests and TASK-1337/1603 regressions.

    Entry matrix: `aida agent new <fixture vendor> --role implementer --spec S` foreground; `aida queue work S --guided --role implementer --no-pull --vendor claude`; fresh and verified `--resume=C --no-human=both`; `queue work PR-N --role reviewer --no-human=both --no-pull`; production RealPhaseDriver implementer/reviewer/pipelined resume via fake-vendor queue auto-complete fixtures; actual pane host and App::spawn_tab/PtyHost route. Unsupported daemon/namespace/platform cases must explicitly refuse, not count as positive coverage. Fake forge performs no network.

    - `task1607_launch_save_failure_never_runs_vendor`: EACCES before rename; also file-fsync/rename/dir-fsync faults. No sentinel, actual child dead/reaped, exact old-or-new durable evidence as specified, no release token. Clear fault and explicitly retry once: one sentinel, matching recorded PID/start. This replaces the unsafe diagnostic's success criterion.
    - `task1607_launch_parent_death_boundaries`: kill ONLY owned launcher before spawn, after helper starts/before record, after durable record/before release, after send/before final exec, and after successful exec. First five no sentinel; last allows exactly one with pre-existing durable evidence. New process can acquire seat within bounded deadline; no automatic respawn.
    - `task1607_launch_unknown_identity_refuses`: missing start, Unknown/error, reused PID, wrong READY credentials, wrong issuer/member/attempt/repo/grant. No vendor or empty-start launch row; unrelated peer unchanged. Restore proof for positive control.
    - `task1607_launch_stale_duplicate_channel`: barrier after record and before release; transfer generation through actual seat CLI; stale frame must refuse. Replay on same channel, another child's channel, a new invocation and after deadline cannot execute twice or authorize another child. Valid sibling activation control executes once.
    - `task1607_launch_release_failure_and_fd_hygiene`: fail send/close parent channel before release and after send using production cancel path; parent death with queued frame; leak-check all inherited FDs; sentinel absent before exec, no leaked lock/endpoint preventing bounded retry. Exercise dropped parent handle and failed exec error-channel EOF separately.
    - `task1607_launch_exact_binding_positive`: at fake vendor first action, assert exact canonical receipt/ChildSpawn/assignment/process/grant/scope/generation joins already durable and no seat FD inherited. Same-PID exec and verified resume retain expected identity; wrapper-PID substitution fails.
    - `task1607_launch_child_scope_no_peer`: launched child successfully completes assigned spec/status/direct review-story/rework/punt routes from C1; unrelated enqueue, peer launch, LoopStart and Handoff refuse even after env omission. Fixture peer first-action sentinel stays absent.
    - `task1607_launch_no_network_or_wait_under_lock`: instrument actual entrypoints for forbidden forge/network/mail/status/output/completion waits under seat; block fake vendor completion and prove seat commands still progress. Force ETXTBSY and READY delay to verify waiting occurs unlocked. Prerequisite publication hooks must not reenter seat.

    Every failure case needs its matching successful actual-entrypoint control. Later implementation must demonstrate nonvacuity by removing/restoring the relevant record/release/final-generation guard in isolated source, preserving C7 F1/F2/F3 and disabled-kill witnesses. These are test requirements, not reported passes.

    ## Independent decision requested

    Sign or amend (1) BUG-1808-owned shared slice/dependency, including its actual assignment publication prerequisite; (2) this local record/release/final-exec sequence and C8 clarification; (3) explicit pane/daemon/containment support boundaries and required positive adapters. No unresolved point is delegated to a vague future identity service. Until different-advisor signoff and prerequisites land, TASK-1607 production remains NOT READY. Full gateway audit/history/acceptance and operator-only authority merge remain outstanding. No code/test/build/commit/push/merge, status/queue/grant/hold/lease changes or live experiments were performed by this sketch author.
