title: 'agy review vendor follow-ups: no agy call from aida init, a typed timeout, the correct ssh sign-in fix text, docs (STORY-3202 follow-up)'
description: |
  BINDING follow-up to STORY-3202 (advisor-122 2026-11-27 01:13; plus 2 findings from the p54 #4736 review; filed by product-15). STORY-3202 completed with p54.

  ## Acceptance
  - AC1: NO outward agy call from `aida init`: lane_host::report (reached from init_cmd.rs ~2252) skips agy_lane_probe / the networked `agy models` call; only `aida doctor --lane-host` runs it. Test with a fake agy on PATH that records calls.
  - AC2: agy_auth_probe classifies a Timeout by a TYPED deadline error from RunnerCall::run (as AuthRequired does), not `contains("deadline")`. Test: a failing fake agy whose stderr says "deadline" → Failed; a real deadline → Timeout.
  - AC3: the KeyringOnly fix text says "sign in once from an ssh session (`ssh -t <host> agy`), which writes ~/.gemini/antigravity-cli/antigravity-oauth-token" (agy uses FILE token storage under SSH and the keyring otherwise; the live dell1 finding), not `env -u DBUS_SESSION_BUS_ADDRESS`. Test the text.
  - AC4: docs/review-process.md lists `--agent agy` (explicit only: never a default or an automatic challenger until its confinement is verified) and states that `[agents] vendor` is read from the merge base / trusted config, never the PR checkout.
