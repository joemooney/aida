- id: 01a0ded5-176c-74e3-a71b-7e73e767754c
  author: joe
  content: |-
    Review round 4 (fresh strict Opus reviewer): APPROVE WITH NITS on origin/claude/task-1515 @ 3d56853e55.
    TESTS (scratch worktree, CARGO_BUILD_JOBS=3, fake HOME): aida-core --lib task_1515 11/11 ok on 3 runs (39s, 35s, 24s; no flakes). cache 139 ok / 1 ignored. cache_lock 21 ok. bug_1644 9 ok. aida-cli-lib --lib cache 82 ok / 1 ignored; doctor_ 163 ok; mcp 168 ok. cargo fmt --check clean. The merge into current origin/main (7c6faed690) is clean.
    MUTATIONS (all reverted; worktrees removed): (M1) incremental rows applied in autocommit, with only the stamp in a transaction: CAUGHT by incremental_rows_roll_back_when_the_stamp_fails and concurrent_reader_sees_whole_incremental_refreshes. (M2) the full rebuild stamps the HEAD captured before the incremental attempts: CAUGHT by head_moving_every_attempt_full_rebuilds_at_current_head. (M3) the HEAD re-check after the pre-lock reads removed: CAUGHT by 3 tests. (M2') only the post-loop re-capture removed: SURVIVED, and that is benign. After a HEAD-moved decline the loop variable is already the current HEAD, so the re-capture only matters on the Err-break path (see nit 2).
    A (withdrawal complete): OK. aida-cli-lib has an empty diff against the merge base 12138a0403. id_candidates and get_requirement_unambiguous are byte-identical to both the merge base and origin/main (compared by md5). The stale note, the MCP rearm and the stale full scan are gone. The only stale serve left is main's BUG-664 foreign-writer shortcut, which is unchanged except that it is skipped while a migration is pending. A lock error ending the incremental refresh goes to Err, then full_rebuild, then its own ladder, then fail: two ladders, exactly like main. A test covers it (read_path_lock_error_falls_back_to_full_rebuild_then_fails, for both list_summaries and the constructor).
    B (kept features): OK. The rebuild writes rows, edges, head, built_at and schema_version in one IMMEDIATE transaction. The incremental refresh writes all rows plus the stamp in one transaction, and a decline or Err rolls everything back. The migration drop is deferred into the rebuild transaction when rows exist. Empty tables are migrated in one locked transaction that re-checks the migration condition first. restamp_head and refresh_epics_then_restamp write an empty SHA while the migration is pending. The HEAD-moved decline has a bounded retry (3 attempts), then a rebuild at the re-captured HEAD. The shortcut is skipped while pending. The epic YAML read inside the transaction (stored_status_for_spec_id) does not touch self.cache, so there is no mutex deadlock.
    C (pending migration plus a foreign writer): NOT a regression. It fixes a main bug. The premise that main served the old-schema snapshot is wrong. Main's Cache::open COMMITS the drop at open time and deletes the head. With only a live sidecar (lock free), the BUG-664 shortcut then serves EMPTY tables. REPRODUCED on a 4,530-spec store copy with the schema stamp set one lower and a live pid-1 sidecar: main 'aida list --format json' printed [] (3 bytes, rc 0), and cache.db was left with 0 rows and no head. The branch rebuilt: 4,530 rows, head set, list 16.5 KB, show 2.96s against main's 5.17s. With the SQLite lock actually held, main's open waited the drop ladder and failed, and the branch's read waits the rebuild ladder and fails, so availability is the same. Serving old-schema rows is genuinely unsafe for a column whose meaning changed (a missing column heals through with_cache_schema_retry, but a changed meaning would be served silently), so the skip is justified. How long pending lasts: it ends at the first successful full rebuild by any new-binary process (about 1-3s at this store size). It recurs only if an older binary rebuilds again (the TASK-1478 alternation, which predates this spec).
    D (performance, release builds of origin/main 7c6faed690 and of origin/main merged with the branch, on separate copies of the 4,530-spec store): no slowdown. Warm fresh cache: 0.062-0.068s on both. Warm, external commit plus live sidecar: 0.09s on both. Cold page cache (fadvise DONTNEED), no cache.db, incremental, and sidecar plus external commit: CPU time medians match (0.078/0.080, 0.141/0.143, 0.099/0.177, 1.13/1.22s, branch/main), and block-read counts are identical. Wall-clock times were dominated by the machine's load average (8-10). Main and branch alternated as the faster of the two, with no systematic difference. CAUTION for future reviewers: two worktrees sharing one CARGO_TARGET_DIR produced an identical binary for the second build (the md5 matched). I touched the sources and rebuilt, then verified by md5 and a unique string.
    E (CacheLockExhausted / is_cache_lock_error): acceptable to keep. It is small, Display/{:#} are unchanged, the type is constructed in production and is_cache_lock_error is cfg_attr(allow(dead_code)), and the new test uses it to assert that the lock path fails. STORY-1484 needs it. Delete it if STORY-1484 has not claimed it in about 2 releases.
    FINDINGS:
    1. NIT: the rebuild comment at cached_git_backend.rs:159-168 says 'tracked separately as a follow-up bug'. Name BUG-1663.
