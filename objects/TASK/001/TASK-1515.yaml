  content: 'PROXY DECISION (orchestrator for Joe) on round-3 REQUEST CHANGES: the stale-serve-on-lock-error requirement (my round-1 item 2) is WITHDRAWN from this spec. It widens the read path to mutating callers (BUG-1664 class) and costs show performance; it belongs in STORY-1484''s single-flight design, which must first enumerate the mutating readers. Round-4 scope: (1) restore main''s lock-error behaviour for the incremental refresh (full-rebuild fallback, then fail) on ALL paths, with no stale snapshot served on a lock error; (2) restore main''s id_candidates / get_requirement_unambiguous resolution semantics, so show has main''s performance (the round-3 full-scan-when-stale is removed with the stale serving); (3) KEEP: single-transaction full/incremental writes, atomic migration, empty stamp while migration is pending, HEAD-moved decline with retry at the current HEAD and rebuild stamped at the current HEAD, shortcut skipped while migration is pending; (4) drop the stale stderr note and MCP rearm if nothing emits it any more; (5) correct the ''older stamp self-heals'' comment (see BUG-1663); (6) add the M1 test only if an error-as-fresh check still exists. Follow-ups: BUG-1663 (ghost row after revert-during-load), BUG-1664 (mutating sweeps on a stale snapshot, high). STORY-1484 inherits stale-serve plus an MCP structured stale flag. Then round-4 fresh strict review.'
