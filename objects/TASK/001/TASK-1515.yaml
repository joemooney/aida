title: Stamp cache freshness in the same transaction as the rows (full and incremental), and make migration drop, apply and rebuild atomic
description: |
  From SPIKE-90 (report section 4.1 rule 5). Today a full rebuild commits the rows in one transaction and then stamps source_head_sha, built_at and schema_version in three separate transactions; incremental refresh commits one transaction per changed row and then stamps the SHA. A concurrent reader can therefore see rows from HEAD B labelled as HEAD A, or a migration's committed empty tables before the rebuild (Cache::open drop, then apply, then a later rebuild). This makes staleness detection imprecise and is the only case where the live WAL cache is actually unreadable, which is the window an immutable snapshot would have covered.

  ## Acceptance
  - rebuild_from_store writes rows plus source_head_sha, built_at and schema_version in one transaction.
  - try_incremental_update applies all changed rows plus the SHA stamp in one transaction (the 500-file fallback to a full rebuild is unchanged).
  - A schema-migration drop plus apply plus rebuild commits atomically, so a concurrent reader sees either the old tables or the fully rebuilt ones, never empty tables (test with a reader connection held open across the migration).
  - busy_timeout=0 and the retry ladder are unchanged; with_cache_write still wraps the (now single) write transaction.
