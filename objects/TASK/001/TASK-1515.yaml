  content: |-
    Review round 3 (fresh strict Opus reviewer): REQUEST_CHANGES on origin/claude/task-1515 @ 3fec216b73.
    TESTS (scratch worktree, CARGO_BUILD_JOBS=3, fake HOME): aida-core --lib task_1515 16/16 ok on 3 runs (53s, 46s, 41s; no flakes). aida-core --lib cache 144 ok / 1 ignored. bug_1644 9 ok. cache_lock 21 ok. aida-cli-lib --lib cache 82 ok / 1 ignored; doctor_ 163 ok; mcp 168 ok. The merge 22c37f4452 is clean in db/ and mcp.rs.
    MUTATIONS (all reverted; the worktree was removed clean): (M1) resolver treats an Err from cache_snapshot_is_stale as fresh: SURVIVED, no test drives is_stale to Err. The code is correct; this is a test gap. (M2) the stale filter dropped from get_requirement_unambiguous: CAUGHT by both unambiguous_resolution_ignores_stale_snapshot_* tests. (M3) full rebuild stamps the pre-attempt HEAD: CAUGHT by head_moving_every_attempt_full_rebuilds_at_current_head. (M4) foreign-writer shortcut ignores migration_pending: CAUGHT by foreign_writer_shortcut_skipped_while_migration_pending.
    E2E: release binary of this branch versus a main-equivalent release binary (b331809ce7), each on its own copy of this repo's store (4,528 specs).
    FINDINGS:
    1. HIGH (blocker; A is not closed): the stale-read fix covers id resolution only. Other MUTATING consumers still act on the read-tolerant snapshot. With_inner/open/advance_backend now return Ok on a lock error (main failed the command), so they newly reach these paths: (a) opportunistic_queue_gc (queue_cmd.rs:1137, runs on every `aida queue list`) and `aida queue gc` (queue_cmd.rs:4187) drop entries whose summary is Completed, Rejected or archived; (b) `aida archive --older-than` (archive_cmd.rs:248, then 329) and maybe_auto_archive_sweep after `aida pull` (lib.rs:17981, opt-in by config) select by stale status and modified_at, re-read the object, and archive it WITHOUT re-checking status or age. REPRODUCED end to end: take a Completed spec (CR-1-173), commit a reopen to Approved plus a queue add in the store, restore the older cache snapshot, hold BEGIN IMMEDIATE on cache.db, and run `AIDA_CACHE_RETRY_COUNT=0 aida queue list --user role:implementer`. MAIN fails the command (rc 1) and the entry survives. BRANCH exits 0, prints the stale note, and commits "gc dead queue entries", which removes the live, reopened entry (confirmed in the commit diff by uuid). The archive paths have the same shape: a reopened spec's stale row says Completed with an old modified_at, and the authoritative re-read only checks `archived`, so the reopened spec is archived. Fix: mutating consumers use a strict freshness variant (for example a list_summaries_for_write that calls ensure_cache_fresh), or skip or refuse when cache_snapshot_is_stale(). For defense in depth, re-validate each candidate's predicate (status, archived, modified_at) on the authoritative object before mutating. That also closes the pre-existing BUG-664 foreign-writer variant. Add a test per consumer (queue gc under a held lock, archive sweep of a reopened spec).
    2. HIGH (blocker; measured perf regression, D): `aida show` calls get_requirement_unambiguous (git_backend_cmd.rs:4104). With a stale snapshot, the resolver now pays a full inner.load(). That is the common case when a foreign writer's lock sidecar is live, which main served in O(1). Measured on 4,528 specs with an external commit and a live sidecar: warm page cache, main 0.09s versus branch 0.47s (three runs each). Cold (POSIX_FADV_DONTNEED on the store), main 0.17-0.37s versus branch 1.24s, 1.46s, 2.52s and one 19.31s outlier. That exceeds the 1000 ms show budget (BUG-1606 class). With a fresh cache the extra rev-parse is not measurable (0.07s versus 0.09s). Fix without losing the safety: in the stale case, compute authoritative candidates as the snapshot plus the delta. Take changed_object_files(recorded, HEAD), drop candidates whose file changed, re-read only the changed files, and match the id, so the cost is O(changed). Fall back to the full scan only when recorded is empty, not an ancestor, or a migration is pending. Alternatively, let the pure-read show accept a stale answer.
    3. MEDIUM (B; pre-existing, non-blocking, follow-up): "stamp older than rows self-heals" is false in the ABA case. The rebuild stamps H, but the worktree load can see a commit H' that lands during the load. If a later commit reverts that file's content, or deletes a file added in H' (or a failed write reverts an uncommitted file the load read), the next diff from H shows no net change for it. The newer or ghost row then persists as "fresh" until a full rebuild, which can bring back a deleted spec. The stamp is never NEWER than the rows (confirmed), and the incremental path's HEAD re-check closes the committed variant there. Main has the same hazard with a wider window, because it captured HEAD before the incremental attempts. Correct the comment at the rebuild re-capture. File a follow-up: after the load, if HEAD moved, re-read diff(H..now) before stamping (bounded), or load objects from the commit tree instead of the worktree.
    4. LOW (C): the pending-migration skip is correct (M4). The note has exactly one print site, eprintln at cached_git_backend.rs:471. It never reaches stdout, --json or JSON-RPC payloads. The MCP dispatch is sequential, so the process-global AtomicBool rearm per tools/call is correct. Under hypothetical concurrency the worst case is a missed or duplicated stderr line. Note that MCP clients generally do not surface stderr to the agent, so SPIKE-90 rule 4's label is not visible in MCP results. Consider a stale flag in the tool result (follow-up).
    5. LOW/NIT (D): the retry loop is bounded (3 incrementals, then one rebuild). A lock error on attempt 2 or 3 is handled exactly like attempt 1: stale on read, Err on write. A non-lock decline with a coincidental HEAD move re-diffs harmlessly. The thread-local hook is take-and-restore and cleared by each test, and libtest runs each test on its own thread, so hygiene is fine. STALE_READ_NOTED is process-global across parallel tests, but no test asserts on printing. Stderr noise in task_1515 is one note line. Add a test for M1 (is_stale Err must take the full scan).
    6. OK (E): migration atomicity, the empty SHA on restamp while pending (write_while_migration_pending_leaves_head_empty), and the single-transaction incremental with rollback on a stamp failure all still hold. The tests pass, and the delta does not touch cache.rs.
