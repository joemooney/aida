title: 'Decide: should a contained parent''s ''aida session resume <id>'' be refused when the session''s checkout root differs from the launcher''s write roots?'
description: 'From the #2689 STRICT review (non-blocking). session.rs:5095: an id-prefix resume makes the child''s write root the main checkout, so a contained parent in a linked worktree (roots [proj-wt]) can resume a session and get a child that can write in proj. This matches BUG-2157''s acceptance (the session''s worktree), but it widens the parent''s write boundary. Advisor leans toward refusing a cross-root resume under containment (fail closed) unless the operator wants it allowed. Needs an operator or security ruling before implementation.'
