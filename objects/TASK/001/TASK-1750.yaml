title: 'Arch: one process-liveness primitive (pid + start time) instead of 5 helpers and 24 raw kill(pid,0)//proc checks'
description: |-
  ## Problem
  Liveness is decided in many places with different semantics (bare pid, zombie handling, pid reuse). So leases, registries and watchdogs disagree about whether a session is alive.

  ## Evidence
  - Separate helpers: aida-core/src/worktree_pool.rs:272 pid_is_alive, aida-cli-lib/src/merge_lock.rs:120 pid_alive, vendor_activity.rs:133 lease_pid_alive, advisor.rs:450 is_alive, alongside the canonical aida-core/src/liveness.rs:672/699 (process_identity_is_alive checks the start time against pid reuse).
  - 24 raw `kill(pid,0)` or `/proc/<pid>` checks outside liveness.rs.
  - Today's symptoms: BUG-2010 (aida ps reports live Codex/agy lanes as dead: the lease recorded a transient pid), #2613/BUG-2120 r1 (several registry entries per session id, one picked arbitrarily, fail-open), BUG-1285 (dead-pid lease reclaim).

  ## Proposed improvement
  Route every liveness question through aida_core::liveness (pid plus recorded start time). Records that store a pid must store its start time. Add a guard test banning raw kill(pid,0)//proc checks outside liveness.rs.

  ## Risk
  Lease and lock reclaim behaviour changes; this is strict-tier (gate) code under ADR-76.

  ## Effort
  Medium.
