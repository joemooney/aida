- id: 01a13bb4-542c-7480-8b46-9a790355ffaa
  author: joe
  content: |-
    SKETCH for the cache_lock identity consolidation; needs advisor signoff before anyone implements it.

    Today there are two formats:
    - liveness::process_start_identity = rfc3339 via sysinfo, seconds resolution, no scheme prefix. Recorded by drain_lock, merge_lock, worktree_pool, solo, triage, review_marker, the drain orchestrator, agent_registry and advisor.
    - cache_lock::live_start_identity = 'linux-starttime:<ticks>' from /proc/<pid>/stat (exact), or 'sysinfo-start:<rfc3339>' elsewhere. It fails closed (Unknown) on a scheme mismatch.

    Hazard: switching the canonical format makes every record already on disk compare unequal. process_identity_is_alive treats unequal as dead, so a new binary would reclaim LIVE drain/merge locks right after an upgrade.

    Proposal:
    (1) Move live_start_identity and parse_proc_stat_starttime into liveness.rs as process_start_identity_exact (scheme-prefixed). cache_lock re-exports it. No format change.
    (2) Teach process_identity_is_alive to compare by scheme. A recorded value with a 'linux-starttime:'/'sysinfo-start:' prefix compares against the exact identity; a bare rfc3339 value compares against process_start_identity (legacy). No record is misread.
    (3) Optionally switch writers to the exact format later. Old records stay readable via (2).
    Steps 1 and 2 are behaviour-neutral for existing records. Under ADR-76 this is strict-tier.
  created_at: 2026-10-14T18:37:16.204762970Z
  modified_at: 2026-10-14T18:37:16.204762970Z
  session_id: 734cc2be-ef3d-49bf-80e8-0872a9bf5e27
- id: 01a13cb1-e03d-7de3-92a5-a672e54d74d7
  author: joe
  content: |-
    ADVISOR SIGNOFF (STRICT tier) on the cache_lock identity consolidation sketch: approved for steps (1) and (2). Conditions:
    (a) Unrecognized scheme prefix or unparsable record => Unknown, which callers treat as NOT dead (never reclaim). Fail closed toward holding the lock, not stealing it.
    (b) Tests: legacy rfc3339 vs live (alive/dead); linux-starttime exact vs live (alive/pid-reused); sysinfo-start; cross-scheme record; garbage prefix => Unknown/no reclaim. Plus a round-trip test proving an on-disk record written by the current binary still reads alive after the change.
    (c) Step (3) (switching writers to the exact format) is a SEPARATE PR, landing no earlier than one release after (1)+(2), so an N-1 binary never reads a format it cannot parse. Note that in the PR.
    (d) The cache_lock re-export keeps its public path; no behaviour change in cache_lock itself.
    Implementer may proceed. PR needs a STRICT review before merge.
