title: 'Review follow-up: SessionClaimHeartbeat::drop joins a thread that may be inside a fetch or push using an unb'
description: |-
  From BUG-2706
  Reviewed sha: 9a5565b17c8552116a9ba459a9f8a31a7011af43

  SessionClaimHeartbeat::drop joins a thread that may be inside a fetch or push using an unbounded Git subprocess. A stalled remote during a refresh can keep an otherwise finished launcher from returning, and a stalled pull holds the shared writer lock. Bound or cancel the refresh I/O and join on shutdown within a defined deadline.
