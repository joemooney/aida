title: 'Review follow-up: contained_lane.py SECRET_ASSIGNMENT redacts only the first whitespace-delimited token afte'
description: |-
  From TASK-3927
  Reviewed sha: 95866f79ae773d8edb6d2ab8f04cc105e6afc27c

  contained_lane.py SECRET_ASSIGNMENT redacts only the first whitespace-delimited token after `key=`/`password:` etc., so a quoted multi-word value (`password = "two words"`) leaks the remainder (`words"`). Probe output is AIDA's own role probe written to the operator's terminal/report.json, so exposure is low; extend the pattern to consume a quoted value and add a test.
