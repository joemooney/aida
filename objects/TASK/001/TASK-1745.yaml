title: 'Follow-ups from #2595 (BUG-1999): assert every crash step fires in the recovery matrix test'
description: |-
  From the MERGE r3 review of #2595 at c7f2afcc14:
  (1) recovery_with_old_format_crash_during_normalization_preserves_records skips with 'if first.is_ok() { continue; }' and never asserts that each named step crashed at least once. Removing a step() call in production silently shrinks the matrix (mutation M11 survives). Record which steps fired and assert full coverage.
  (2) dev_build.rs:788: say only that the marker must come before .rollback/.promoted moves.
  (3) Add a doc comment to recover_live_dir_with_steps (dev_build.rs:763).
