title: 'Review follow-up: aida-cli-lib/src/tests/doctor_cmd_story_462_doctor_tests.rs:4617 — The EXDEV regression as'
description: |-
  From BUG-2755
  Reviewed sha: eb2e718dbedddf53460aab314d05c520db5e6c2c

  aida-cli-lib/src/tests/doctor_cmd_story_462_doctor_tests.rs:4617 — The EXDEV regression assumes the default temporary directory and /dev/shm are on different filesystems and that /dev/shm is writable. A supported Linux run with TMPDIR=/dev/shm can instead successfully move the fixture and release its lease, then panic at unwrap_err and leave a fixture under /dev/shm. Use managed fixture directories proven to be on different mounts or inject EXDEV at the rename boundary.
