title: 'aida merge-hold add <pr>: place a hand-hold symmetrically (marker + label) so a PR held outside a drain releases through aida merge-hold clear'
description: 'Advisor note on #1946 (2026-09-18 22:26): a PR labelled aida:merge-hold by hand with no marker file leaves the required merge-hold-gate check red with nothing for aida pr ship to release; the advisor had to clear the label, wait for the gate to re-run, then ship. BUG-1236 (#1958, merged) made the drain''s own holds symmetric; hand-holds still are not. Add aida merge-hold add <pr> [--reason]: writes the marker (write_hold), mirrors the label via the BUG-1236 sync_label (recording the sync state), prints the release command. Implementation exists on commit e94c6039d6 (pushed to the bug-1236-keyboard branch after #1958 had merged, so it never landed); cherry-pick it. Acceptance: aida merge-hold add N writes .aida/merge-holds/PR-N and the label; aida merge-hold list shows it as synced; clear N releases both; help text documents it.'
