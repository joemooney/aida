    Recurrence evidence (2026-09-13, same session, within ~10 min): the operator asked for TWO capabilities that ALREADY EXIST but were undiscoverable —
    1. an autonomy 'flip the switch' → /aida-solo (exists).
    2. `aida role show` to check the active role → `aida role show` AND `aida role current` (the git-branch--show-current analog) both exist; `aida status` shows it too.

    This is the Trojan-horse quiet-depth tradeoff biting: deep capability, no discovery path. Broaden this task from 'autonomy modes' to a general DISCOVERABILITY surface: a lightweight 'what can I do / where am I' overview (e.g. `aida help` topics, an `aida modes`/context summary, or a first-run tour) that names the role commands, the autonomy ladder, and the read surfaces (why/status/digest). The bar: a user who doesn't already know a command exists should be able to find it. Two find-what-exists misses in one session = the signal to act.
