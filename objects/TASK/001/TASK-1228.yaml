title: Surface AIDA's autonomy modes as ONE coherent concept (cron/groom --apply · /aida-solo · [intake]/solo-posture · zen) — they're scattered and undiscoverable
description: |-
  Operator (2026-09-13) proposed 'auto-approve drafts as a matter of protocol when the advisor isn't busy, configurable, tied to modes' — and it turned out the CAPABILITY already fully exists, just scattered across three unrelated surfaces the operator couldn't find (they'd forgotten /aida-solo existed). The gap is DISCOVERABILITY, not capability.

  The three faces of the same 'do more autonomously' idea:
  - aida groom --apply [--then-drain] — headless auto-approve of the safe fence + drain (now on a durable cron).
  - /aida-solo — the LIVE in-session warm driver (groom→implement→integrate with judgment, keystone-parked).
  - [intake] policy + solo posture (presence::current_solo, TASK-827) + --zen — the config dials.

  Acceptance:
  - One place (a doc section + a discoverable command, e.g. `aida autonomy` or an `aida modes` overview) that names the autonomy ladder and how to engage each rung (headless cron / live solo / zen / the config knobs), so a user finds it without prior knowledge.
  - The relationship is explicit: cron = always-on headless; /aida-solo = live supervised; [intake]/--risk = the dials.
  - Cross-link from README + the discipline pack.
  Not new machinery — a naming/surfacing/doc task over existing capability.
