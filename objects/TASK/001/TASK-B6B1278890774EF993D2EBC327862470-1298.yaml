  aida-cli-lib/src/standalone_implementer.rs:1572–1583 — The early reservation also moves the only memory-floor reading ahead of store sync and worktree setup. The final handoff rechecks disk and accepts an existing reservation without rechecking memory. If RAM plus free swap falls below the configured floor during that setup, a normal pickup can spawn without the reasoned memory override that the previous late admission would have required. Recheck memory against the held reservation at launch and preserve override auditing.
