title: 'BUG-1972 test gaps: same-host different-path mirror re-run, env-token-used notice, and redaction at each call site'
description: 'Follow-up from the round-2 advisor review of #2582 (APPROVE at e241935dc0). All low; the code is correct today. (1) Pin a same-host, different-path re-run (e.g. ai/proj vs team/elsewhere): replacing same_remote with a host-only comparison currently survives every test and would bring back the round-1 bug on one host. (2) Assert the spec-required notice when the env token is used (gitlab_project_create.rs ~211-218); a mutation suppressing it survived. (3) Capture output at the redaction call sites (''already points at'', ''added remote'', push ''still failed''). Today only the helper is tested, and dropping redaction at any call site survived.'
