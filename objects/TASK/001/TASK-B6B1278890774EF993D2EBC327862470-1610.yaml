title: 'First-run: aida init never commits to the user''s branch without asking (F5)'
description: |-
  ## Acceptance
  - AC1: aida init shows what it will write (paths + line counts) and leaves the changes UNCOMMITTED by default; committing requires an explicit --commit (or an interactive yes).
  - AC2: no commit is created on the user's current branch unless asked; a test in a fresh repo asserts HEAD is unchanged after a default init.
  - AC3: existing callers that rely on the commit (CI, scripts) pass --commit explicitly; the help text says so.

  Source: docs/plans/2026-11-27-fresh-user-walkthrough.md (on branch task-3951-fresh-user-walkthrough / PR #4782), section F5. Advisor aida-d3 2026-11-27 20:30 priority order; filed by product-15 for laning now (one spec per lane).
