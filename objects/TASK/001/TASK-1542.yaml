comments:
- id: 01a0e007-84a4-7a30-8a78-27b4930e5c84
  author: joe
  content: 'Caveat carried over from TASK-1518 (strict review): the SIGTERM handler stamps only leases whose creator_pid is the drain process itself. In the pipelined batch route the implementer/reviewer phases run as child processes (queue work <spec> re-exec with AIDA_DRAIN_BORROW), so a lease minted by such a child records the child''s pid, not the drain''s, and is NOT stamped interrupted_at on a wave stop — it falls back to the plain dead-process reading in aida ps. When forwarding SIGTERM to in-flight children here, either have the child stamp its own leases on the forwarded signal or widen the drain''s match to leases whose creator is a descendant of the drain pid.'
  created_at: 2026-09-26T23:23:04.228049299Z
  modified_at: 2026-09-26T23:23:04.228049299Z
  session_id: 71dca616-6150-461d-b64f-18c8288c6e1c
- id: 01a0e040-0d99-71e2-b9fc-be82e2b12456
  author: joe
  content: 'Scope additions (TASK-1518 review): Windows stop --now messaging/docs (kill is a no-op there); release_lock_if_pid should also compare pid_start_time when both are present; don''t clear DrainState on stop --now while the drain is still alive.'
