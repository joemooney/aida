title: 'Drain stop follow-ups: forward SIGTERM to in-flight vendor children on a manual stop, and record ''stopped'' in the drain-state file'
description: 'Follow-up from TASK-1518. Acceptance: 1. On SIGTERM outside a systemd unit, the drain handler forwards SIGTERM to each in-flight vendor child it launched (active_pid), waits a bounded grace, then exits. 2. The drain-state file records a stopped state with time and reason, so ''aida drain status'' shows Stopped instead of Stale. 3. Tests in a child process (as TASK-1518''s signal test does).'
