title: Light entry path for the performance and remote-drift doctor checks (like disk-headroom)
description: 'Follow-up from BUG-1675: ''aida doctor check performance'' and ''check remote-drift'' do not need the store for their own findings but go through the full store load, so under load they can time out (exit 124) and trip their guard routes. Acceptance: 1. Both single-category checks skip the store load and full findings pass, keeping report shape and --fail-on-findings behaviour identical. 2. Tests with injected inputs; one real-probe wiring test each. 3. Measured runtime on this repo recorded on the spec.'
