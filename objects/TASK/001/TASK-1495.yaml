title: Re-derive the max_failures default after five shift nights
description: |
  Follow-up from the shift-tick plan (docs/plans/2026-09-24-shift-tick.md, STORY-1218). The max_failures default for unattended drain waves was set before any real night-shift data existed. After five real shift nights (the shift started 2026-09-25 06:18, so earliest about 2026-09-30), re-derive it from evidence.

  ## Acceptance
  - Collect, for each of at least five shift nights: waves launched, specs attempted, shelve events, and how many waves hit the max_failures budget, from .aida/events.jsonl (cite the query or script used).
  - Recommend a default with the arithmetic shown: keep or change, and why (for example: the budget stops a runaway wave without cutting off waves that would have recovered).
  - If the default changes, change it in code and in the docs that state it, with a test pinning the new value.
  - If fewer than five nights of data exist when picked up, stop and record that instead of guessing.
