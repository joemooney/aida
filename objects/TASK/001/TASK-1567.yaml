  content: |
    Third independent reproduction, 2026-10-02, in a fresh worktree
    `/home/joe/ai/aida-bug1681` cut from `main@30638a79ea`.

    `aida-cli-lib/src/generated/aida.rs` was left modified by **every** build-ish
    command in the session, not just the first: `cargo check -p aida-cli-lib --lib`,
    then `cargo test -p aida-cli-lib --lib <filter>`, then `make check-ci-fast`. I
    reverted it with `git checkout --` and a later gate regenerated it again, so a
    single revert before committing is not enough.

    Concrete cost this time: `git add -u aida-cli-lib/src` staged it, and it was
    caught only because the staged-file list was inspected before `git commit`. Any
    seat that runs `git add -A`, or that reverts once and then runs another gate,
    ships an unrelated generated-proto change in a spec's PR.

    Suggested acceptance to add if this is picked up: after a full
    `make check-ci-fast` on a clean tree, `git status --porcelain` is empty. That is
    the predicate a seat actually needs, and it is stronger than "cargo check does
    not dirty the tree" because the regeneration recurs per gate.
