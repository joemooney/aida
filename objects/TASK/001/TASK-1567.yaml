    Reproduced independently in relay session #16, in a brand-new worktree created
    from `main` at `30638a79ea`. A plain `cargo check -p aida-cli-lib --lib` left
    `aida-cli-lib/src/generated/aida.rs` modified; so did the later `cargo test` and
    `make check-ci-fast` runs. It had to be reverted with `git checkout --` twice
    during the BUG-1769 work to keep that PR's diff clean, and the first commit
    attempt had already staged it.

    So this is not a one-worktree artifact: every seat that builds this crate picks
    up the same spurious modification, and any seat that runs `git add -A` ships an
    unrelated proto change. That is also one plausible contributor to the
    long-standing uncommitted files in `/home/joe/ai/aida` — a build alone is enough
    to dirty a file there, so "whose lane is this?" has at least one answer that is
    nobody's.
