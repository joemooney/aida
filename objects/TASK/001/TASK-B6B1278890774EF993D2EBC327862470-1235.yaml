title: 'Review follow-up: pickup_retry invokes preflight_queue_work_branch inside Store::transaction while holding t'
description: |-
  From BUG-2720
  Reviewed sha: 2fcffa9987591527cab7610b758675e6fe3844a7

  pickup_retry invokes preflight_queue_work_branch inside Store::transaction while holding the global admission lock and the train-member lock. This waits for git worktree list, and on an occupied checkout also checks Git cleanliness and process liveness. A slow or stalled Git subprocess for one occupied worktree can prevent all other reviews and train admissions. Probe outside the lock and verify the token, head and deadline again when committing the selection.
