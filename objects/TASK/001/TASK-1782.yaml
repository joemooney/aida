title: 'agent stop: distinguish recycled vs unknown identity in the not-signalled message; test a live process with pid_start=None'
description: |-
  Follow-up from BUG-2148 #2676 round 2 (approved under the 2-round cap).
  - agent_registry_root.rs (unconfirmed branch ~251-262 and the final bail!) prints one message for both cases.
    - Recycled (recorded identity differs from the live process): the agent is gone. Say so and suggest 'aida agent gc', which already reaps these via the lenient check.
    - Unknown (pid_start missing/unreadable): it may really be the agent. Suggest 'ps -p <pid>', then a manual kill.
  - Add an agent_stop_in_project test: a live sleep with pid_start=None gives Err, no signal, and the entry kept.
  - Also fix the SIGKILL re-check test race: have the TERM-ignoring sh write a ready marker after 'trap' and wait for it before sending TERM.
