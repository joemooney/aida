title: Authority trailer field sits before %s in the history log formats, so a tab inside a trailer value corrupts the subject
description: |
  aida-cli-lib/src/history_cache.rs parse_header uses splitn(7, '\t') with the %(trailers:...) field placed BEFORE %s in the LogStream --format. A literal tab inside a trailer value (git unfold joins folded lines but does not strip tabs inside a value) shifts text into the cached subject column. history.rs collect_filtered_events_git uses the same ordering (there it only truncates the trailer field). Fix: put the trailer field last in both formats, or replace tabs in the trailer output.

  Raised in review of PR-2739: https://github.com/joemooney/aida/pull/2739#issuecomment-6255086840
