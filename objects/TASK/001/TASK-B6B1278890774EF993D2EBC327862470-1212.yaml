description: |
  Deferred under MASS-CHANGE mode (advisor-122 ruling 2026-11-22 12:15 MST) from the PR #4373 (TASK-3826) Changes Requested verdict at 2a0c351161. These findings were blocking (unmet claimed AC / below-tier) and now defer; #4373 fixes only p1, data loss and security findings in its final round.

  ## Findings to address
  1. [p2/unmet-claimed-ac] aida-cli-lib/src/lane_relay.rs aida-cli-lib/src/lane_relay.rs:1434 — TASK-3826 AC3, round-3 item 4. place_brief retires previous pending files across vendors before publishing the new file. A subsequent head-gate refusal removes the new file and leaves the earlier brief absent from pickup. A failed delivery with no returned path also retracts every pending brief for the spec. Stage by round, retract only that round, and retire prior files on confirmed admission. Check both vendor mailboxes after refusal.
  2. [p2/unmet-claimed-ac] aida-cli-lib/src/lane_relay.rs aida-cli-lib/src/lane_relay.rs:508 — TASK-3826 fresh routing. Fresh checks for an open change at queue routing, then admit returns immediately for Fresh. An open change appearing while the launcher waits for capacity is missed. Re-read fresh eligibility for the spec after slot acquisition, and cover a change opening between routing and admission.
  3. [p2/unmet-claimed-ac] aida-cli-lib/src/lane_relay.rs aida-cli-lib/src/lane_relay.rs:650 — TASK-3826 AC5. nap returns true even after sleeping the entire remaining budget, and the next probe or admission read uses its own timeout (150 seconds over SSH). A late idle reply can even authorize launch after wait_timeout. Bound host operations by the remaining deadline and reject late observations. The existing timing test allows 150 seconds for a 100-second budget.

  ## Acceptance
  - AC1: Each finding above is fixed with a regression test that fails before the fix, or explicitly closed with advisor sign-off as not applicable to the landed code.
