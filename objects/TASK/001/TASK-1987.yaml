title: Cargo.toml [profile.agent] comment misattributes CARGO_INCREMENTAL=0 to the CI workflow
description: |
  The comment at Cargo.toml:81-83 says "CI exports CARGO_INCREMENTAL=0". No file in .github/workflows sets it; Swatinem/rust-cache@v2 sets it implicitly. CI also never builds with --profile agent (only the dev profile and --release), so the profile change cannot reach CI either way. Reword the comment to state the real reason.

  Raised in review of PR-2765: https://github.com/joemooney/aida/pull/2765
