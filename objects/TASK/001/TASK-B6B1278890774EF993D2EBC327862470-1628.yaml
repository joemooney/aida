  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit):** `aida --help` / `aida -h` (no other args) route to the short tiered overview instead of the clap wall; `review prepare` joins the Getting started set. Tests in `help_grouping_tests.rs`: the set holds init/add/list/show/review prepare, and the root-help-flag predicate matches `--help`/`-h` only when bare. The full list stays at `aida help --all` (unchanged, pointed at from the overview footer).
    - **AC2 (unit):** `review prepare` gets a plain one-line about and a long help that opens with three examples (PR, range, local branch); dev-only flags move under an `Advanced` heading; `--path` example made neutral. Test renders the clap long help and checks example order, heading placement and absence of AIDA source paths.
    - **AC3 (golden):** regenerate `cli_help_snapshot.txt`; spec-id leak test extended to the review prepare help.

    ### Expected files
    - `aida-cli-lib/src/help.rs`, `aida-cli-lib/src/cli_entry.rs`, `aida-cli-lib/src/review_cmd_args.rs`, `aida-cli-lib/src/review_prepare.rs`, `aida-cli-lib/src/tests/help_grouping_tests.rs`, golden snapshot.

    ### Ambiguities / conflicts as questions
    - None.
