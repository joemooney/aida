title: 'First-run: aida --help and review prepare --help are written for new users (F3, F9)'
description: |-
  ## Acceptance
  - AC1 (F3): bare aida --help shows a short, grouped overview of the commands a new user needs (init, add, list, show, review prepare) with a pointer to the full list; the full list stays available (e.g. aida help --all).
  - AC2 (F9): aida review prepare --help leads with the 3 common invocations (review a PR, a range, local work) and plain-English flag descriptions; developer-only flags are grouped under an advanced heading.
  - AC3: golden help snapshots updated; no internal SPEC IDs in help text.

  Source: docs/plans/2026-11-27-fresh-user-walkthrough.md, sections F3, F9 (on main after #4782). Advisor aida-d3 2026-11-27 20:30 priority (g); grouped by area by product-15 for laning now.
