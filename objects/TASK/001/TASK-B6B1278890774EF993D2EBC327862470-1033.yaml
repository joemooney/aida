title: 'Cosmetic sweep 1: dead code, wording and docs findings from approved reviews'
description: |
  Bundled non-blocking review findings, swept together in one PR per operator direction 2026-11-08. Each section is the original finding verbatim; fix it or state in the PR why the code has since changed. One PR, no new follow-up specs.

  ### TASK-3043
  [cosmetic] Non-blocking: HandoffWriter.snapshot_owner stamps worktree and role into the snapshot log as 'retention metadata' (seat_rotation.rs:328), but pruning was removed in round 6, so nothing reads them. Drop them or relabel as diagnostics.

  PR: #3669
  Reviewed sha: 8a9ddc796a0719d25546fe4a65a42a0fc8bd922a

  ### TASK-3056
  NON-BLOCKING, cosmetic: render_roots (aida-cli-lib/src/launch_permission_profile.rs:188, 209-211) lists the resolved executable and then target/debug and target/release without deduplicating, so a binary run from either target directory appears twice under executable_locations.

  PR: #3671
  Reviewed sha: ad74c5720cbcbae3b3b4f4bf3ca48471829e4a9a

  ### TASK-3058
  COSMETIC (non-blocking): the "--sandbox" | "-s" arms in the denylist after the new sandbox branch in aida-cli-lib/src/launch/contained.rs are unreachable and can be removed.

  PR: #3689
  Reviewed sha: ea14bd1cbb8339b2bc79711207bdc3771d50438f

  ### TASK-3060
  Non-blocking (minor, narrowed carry-forward): AGENTS.md:34-36 and OVERVIEW.md:1613-1615 still change for this bug. The body-file notes are gone, but the remaining '(ID)' completing-form edits are per-change notes that CLAUDE.md reserves for real architecture changes; docs/cli/04-git-lifecycle.md is the home for them.

  PR: #3667
  Reviewed sha: 5f64ea6609498dae663d8c205ce7ae62db056839

  ### TASK-3061
  NON-BLOCKING, cosmetic: aida-cli-lib/src/review_watch.rs:1332 leaves State.max_concurrent write-only. Admission at :1401 uses the watcher's own max, and the persisted value is only range-checked at :1173. If two watchers ever run with different limits, each enforces its own and state.json shows the last writer, with no refusal or log. No over-admission beyond the highest configured cap.

  PR: #3700
  Reviewed sha: 1b0c00f83d7ccb63854fdcdf9506fad56bbf1674

  ### TASK-3062
  Non-blocking (cosmetic): aida-core/templates/commands/aida-pickup.md:29-30 shows the completing-lane declaration with --commit-body-file unconditionally, then says to add the flag for required trailers, so the optional flag reads as mandatory. NATIVE_STOP_CONTRACT got an explicit omit sentence; this template did not. Note bug_2493_native_prompts_name_safe_body_file_surface pins the current string.

  PR: #3667
  Reviewed sha: 5f64ea6609498dae663d8c205ce7ae62db056839

  ### TASK-3064
  F20 (cosmetic, non-blocking; aida-cli-lib/src/ci_relay.rs:1203 CiCommand::Read): the outer 'if !intake.ci_verified(path)' duplicates the same guard inside Intake::verify_ci_read (intent_intake.rs:879), so the outer check can be removed with no behavior change.

  PR: #3692
  Reviewed sha: 045f1aa47966d51c3f397a4a6fc46643da56f739

  ### TASK-3067
  COSMETIC, non-blocking: docs/cli/11-dev.md:26 says alternating with plain Cargo or make build-fast 'can recompile the CLI and server build scripts'; the build scripts rerun and the aida-cli-lib and aida-server crates recompile, so the stated cost is understated. Unverified: promotion itself was not run end to end; the test proves the stamp equals short HEAD, which is what check_staged_sha compares.

  PR: #3702
  Reviewed sha: 89e9aa9191a6fbc7a1e6f59c3b7be138d4fbc9d9

  ## Acceptance
  Every section above is fixed or explicitly answered in the PR body; behavior is unchanged except where a finding requires it.
