title: Commit the deputy timeout regression test; aida awaiting shows a dead deputy
description: |
  Follow-up of BUG-2529 (closed: STORY-2775 plus aida land cover it). 1. Commit the timeout regression test that was run but never committed. 2. 'aida awaiting' reports a deputy whose runner is dead instead of listing its jobs as waiting. A test for each.

  Related: BUG-2625 acceptance 3 (deputy job meta stays "running" after its runner dies). Whoever lands first covers the shared part; the other then only adds its own test.

  ## Acceptance
  1. The BUG-2529 deputy timeout regression test is committed under aida-cli-lib tests and passes in CI. It asserts that a job exceeding its timeout is killed and reported terminal with a timeout result.
  2. When a deputy's runner process is dead, `aida awaiting` shows that deputy as dead (name, last runner pid, since when) and lists its queued jobs as stranded, not as waiting.
  3. A test starts a runner, kills it, and asserts the `aida awaiting` output for both a queued and an in-flight job.
