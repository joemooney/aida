    REVIEW FINDINGS TO ADDRESS (TASK-3801):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 768640005c55
    Recorded: 2026-11-19T17:29:22.690221024+00:00
    Findings:
    1. Support dead legacy bash deputies in awaiting (TASK-3801 AC2). In aida-cli-lib/src/deputy_shell/mod.rs:896-898, dead_deputies_in accepts only RunnerStatus::Dead(RunnerInfo). That variant can only originate from runner.json; a supported bash deputy with runner.pid but no runner.json returns NotRunning when its PID disappears and is skipped completely. Its legacy job IDs/meta.json are also outside queued_ids/job_ids/locate. Thus killing a bash deputy leaves awaiting without the required dead deputy/PID/time or stranded-job evidence. Collect positive legacy death evidence and its jobs as well, with a killed-legacy-runner regression. On the protected base BUG-2625 already provides LegacyRunnerFate and legacy job readers; the omission also exists on the original PR head.
