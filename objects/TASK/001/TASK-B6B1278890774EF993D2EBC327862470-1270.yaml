title: 'Review follow-up: The new fleet-wide Doctor pass expands retained lookups to every observed seat message wit'
description: |-
  From TASK-3846
  Reviewed sha: 213633ea4fc71054e613deaca6af55f9759c655a

  The new fleet-wide Doctor pass expands retained lookups to every observed seat message without a work or deadline check for absent files. aida-core/src/mailbox_logical.rs:2277 calls RetainedDeliveries::lookup, whose loop at line 2427 runs one file open per retained directory per candidate. A miss skips the byte charge, and neither loop checks the deadline. Thousands of messages and retained directories within the listing limit can consume millions of lookups and exhaust the shared two-second deadline before existing per-reader backlog checks start. Check the deadline and an aggregate lookup budget even on misses, and report remaining candidates as unexamined. Cover a miss-heavy scan with an exhausted budget.
