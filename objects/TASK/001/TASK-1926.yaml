title: Widen or document the scope of bug_1985_host_status_guard (only aida-core/aida-cli-lib, only literal Command::new("git"))
description: |-
  Follow-up from the #2731 review (BUG-1985, finding 4). bug_1985_host_status_guard scans only aida-core/src and aida-cli-lib/src, and only literal Command::new("git") builders, including .args(var) wrappers. It misses a git binary passed as a variable and a status call in another crate (aida-cli, aida-server, ...).

  ## Acceptance
  - The guard's doc comment states its exact scope, or the guard is widened to the other crates and to variable git-binary builders.
  - The guard self-test covers whichever forms are claimed.
