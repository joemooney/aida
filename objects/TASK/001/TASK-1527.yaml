    | `cache_cmd.rs::handle_cache_refresh`, 133–170 | Opens backend before watchdog; worker error appends failure. Use bounded early registration, cap before backend work, one shared token result update. |
    | `refresh_worker.rs::{spawn_detached_worker,record_worker_exit}` | Reaper appends another failure on nonzero, clean exit records nothing. Capture same token and record both nonzero failure and clean nonfailure idempotently. |
