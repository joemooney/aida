    ## 3. Numbered response to R1–R6

    1. **R1 addressed in sections 4–5:** preselect ordinary strict exceptions before
       any tolerant write; command-derived show fence honors no-detach with zero
       launches and zero strict fallback. Late suppression blocks reservation/spawn
       and leaves the spent operation observe-only; next independent invocation may
       preselect strict. No RequestLock around SQLite to invent atomicity.
    2. **R2 addressed in sections 6 and 10:** a pre-spawn syscall/current_exe/log-open
       error is `launch_error`, not worker failure. No launch-specific suppression,
       replacement threshold, delay or strict fallback is proposed. Capacity and
       wait errors are neither worker nor launch failures. Mixed-population tests
       distinguish exact worker counts from legacy compatibility.
    3. **R3 addressed in sections 6–7:** dead/old/stale never implies a failed worker.
       Clean reaped exit durably records nonfailure; known success/not_run is absorbing.
       Orphan outcome loss remains unknown; recovery uses real flock and staleness.
       Both report orders and the review's two lost-report counterexamples are tests.
    4. **R4 addressed in sections 5 and 8:** all new registration/terminal lock
       acquisitions are try-lock/bounded; worker cap is armed before backend work,
       watchdog reporting never blocks. Modern identity table has no legacy PID-only
       shortcut and no identity sampled from a reused PID after reap.
    5. **R5 addressed in sections 6 and 9:** `at` remains FIRST FAILURE time for every
       terminal worker error. Add `started_at` for launch. Old serialization keeps a
       recently failed long-running worker in its correct window after optional fields
       disappear. No legacy deduplication or reconstructed tokens.
    6. **R6 addressed in section 10:** finite constants, disjoint retention categories,
       protected recent failures, live-slot protection and finite unknown retirement
       under age/admission pressure. No unknown outcome becomes failed; no immortal
       Unknown slot can prevent admission forever. Pruned callbacks are no-ops.

    These responses propose concrete resolutions for independent review, not a claim
    that this author has cleared the CHANGES REQUESTED verdict.

    ## 4. R1 — read-policy selection and phase table

    Use the existing `CacheReadScope` to carry an internal per-canonical-cache-path
    phase record for the invocation/MCP call. Proposed states are FreshCheck,
    PreselectedStrict, TolerantAttempt, HandoffOnly, ObserveOnly and Served. They are
    transient execution state, never persistence or runtime authority. A constructor
    can advance this state without having served rows. Subsequent query/repin on
    that same path must not restart a spent TolerantAttempt or spawn again. Reset on
    scope exit/error and between MCP calls; distinct cache paths are distinct work.
    One attempt here means one tolerant SQLite write attempt across constructor,
    query and post-busy repin in this invocation for this cache, not a counter reset
    that hides constructor work. A later independent invocation can retry normally.

    Command classification at `lib.rs` configures `Ordinary` or `BoundedShow` before
    backend creation alongside existing interactive/budget settings. Show is selected
    from `Command::Show`, not ReadBudget==0, a sidecar, worker token or user env. Keep
    show's current zero cache wait for human/TTY, local/global JSON and TOON.
    Ordinary advisory zero-wait paths retain their own signed policy; do not quietly
    turn every zero-wait caller into show. Strict mutations/cache commands are not
    converted to this tolerant protocol. Explicit --sync/network/tree scope remains
    as separately signed on BUG-1674, not expanded here.

    | Phase / observation | Ordinary reader | BoundedShow | Next phase / locks |
    | --- | --- | --- | --- |
    | Compatible and already fresh | Serve pinned fresh rows if still fresh at snapshot | Same | No request/spawn/SQLite write |
    | Incompatible/missing/unusable/migration/unsupported flock | Existing signed general strict/error path, chosen before tolerant attempt | Existing bounded explicit unavailable/upgrade outcome; never introduce a strict escape | No incompatible stale success; existing show escape sites remain separately tracked |
    | Preselection: no-detach true | Select strict inline exception, zero detached launches | Forbid launch AND strict/full-rebuild fallback; compatible stale Deferred | No tolerant fast-fail first; show does not need to reserve |
    | Preselection: known three-worker or legacy-compat suppression | Select ordinary A7 strict inline exception | Forbid launch AND strict fallback; compatible stale Deferred | Select before tolerant SQLite attempt |
    | Preselection: unsuppressed, detach allowed, compatible incremental possible | One fast-fail incremental attempt | Only existing bounded permitted attempt; never enlarge zero budget to create it | Release RequestLock before SQLite; hold RefreshLock |
    | Incremental succeeds | No spawn; later pinned rows/metadata decide fresh label | Same | Restore fast-fail scope, ObserveOnly/Served |
    | Incremental typed busy | No second write/ladder/full rebuild | Same | Fully rollback, restore scope, retain RefreshLock, HandoffOnly |
    | Incremental ordinary decline/full rebuild needed | Q1 interactive strict exception must be preselected when the full-rebuild condition is known before attempting; ordinary noninteractive hands off. If discovered only after a tolerant attempt, handoff only for this operation | Handoff only, no inline full rebuild | No decline-to-second-write inside post-attempt phase |
    | Non-lock incremental error | Propagate error | Propagate bounded error | Never swallow as WriterBusy/Deferred |
    | Handoff recheck: became fresh | No spawn | Same | ObserveOnly, then pinned snapshot |
    | Handoff reservation sees threshold crossed since preselection | No spawn, NO second SQLite attempt; Deferred with suppression diagnostic | Same | ObserveOnly for rest of this scope/cache |
    | Hint/reservation lock/write fails or capacity refuses | Deferred, no launch, no strict fallback from this spent phase | Same | ObserveOnly, useful compatible stale rows |
    | Reserved then actual spawn fails | Launch diagnostic only, Deferred, no second spawn/SQLite attempt | Same | ObserveOnly |
    | Reserved and actual launch succeeds | Release guard, wait only remaining invocation budget, observe | Same with zero cache wait | One launch per handoff phase; no loop back to writer |

    **Preselection and late-threshold linearization:** under RefreshLock, and before
    any tolerant SQLite attempt, use a short RequestLock RMW/read to obtain the
    suppression summary and set the in-scope policy branch. Release RequestLock before
    SQLite. Missing/corrupt hint is handled by the existing hint recovery semantics,
    not invented suppression; if a usable summary cannot be read/serialized within
    budget, choose Deferred rather than guessing a strict or spawning branch.
    No-detach can preselect without request locking. The phase remains fixed after
    selection. A suppression result that selects strict is not cancelled merely
    because failures expire a moment later; it is an ordinary preselected strict
    operation, not a tolerant one-attempt operation.

    After the tolerant attempt, the reservation RMW rechecks suppression against its
    current timestamp. If the third worker failure was recorded between preselection
    and reservation, it wins at reservation: no slot/spawn, Deferred, observe-only.
    This operation was admitted to the tolerant branch before that failure and cannot
    be retroactively made strict without violating A13. The next **new invocation**
    that observes suppression preselects A7 strict recovery; no later helper/backend
    inside this invocation may fake a new admission. This is the explicit proposed
    phase interpretation of A7/A13 submitted to the independent gate, not an A7
    waiver or instruction to implementers to choose a policy. Test this ordering.

    Reservation under RequestLock is the launch-admission linearization point. A
    failure recorded after a successful reservation does not revoke that already
    admitted launch; future reservations are blocked. Do not hold RequestLock through
    spawn or SQLite to try to make an OS launch atomic with a failure report. Tests
    must cover both sides of this point. Existing ordinary explicit strict operations
    are not constrained to one SQLite attempt; the tolerant post-busy phase is.

    For full-rebuild cases whose need cannot be determined without attempting an
    incremental, an ordinary TTY invocation cannot run a second strict write after
    that attempt: defer/handoff now; a fresh invocation or explicit strict command
    may select strict. No new rule permits show inline rebuilding. Preserve known
    Q1 TTY full-rebuild preselection, ordinary no-detach and pre-observed suppression
    strict controls. This specified boundary needs independent ratification with R1;
    it is not silently changing the signed retry ladder.

    ## 5. C1 — guard handoff, observation and bounded lock access

    `freshen_for_read`/`file_and_spawn_refresh` split policy selection from a helper
    that can ONLY file/reserve/spawn/observe. Remove strict refresh calls from that
    post-attempt helper. Use existing scoped `wait_remaining`/`wait_poll`/`may_wait`.
    No source rewrite of show identity or entire deadline propagation is in scope.

    | Step | Locks / transaction | Work and exit rule |
    | --- | --- | --- |
    | 1. Deadline and acquire | Shared invocation deadline; try RefreshLock | Start deadline once before any wait, never reset after backend open/spawn/repin |
    | 2. Winner double-check and preselection | RefreshLock; brief RequestLock only for summary | Compatible/current check; table in section 4 selects branch; release RequestLock |
    | 3. Tolerant incremental | RefreshLock + one IMMEDIATE attempt | Fast-fail, no retry sleep; on typed busy rollback completely and restore RAII fast-fail scope |
    | 4. Handoff reservation | RefreshLock, NO SQLite/store write lock; bounded RequestLock | Recheck freshness, RMW request target/history, suppression/retention/capacity; reserve UUID once; atomic replace |
    | 5. Launch | RefreshLock only | Existing current_exe worker launch, explicit paths, same token; release RequestLock before any spawn/log/subprocess work |
    | 6. Parent result recording | RefreshLock + bounded RequestLock, no SQLite/store write lock | Record known launch outcome/child PID without overriding child's terminal result; failure here never causes replacement launch |
    | 7. Release and observation | Release RefreshLock and RequestLock | Poll only remaining budget; never writer-loop, never second launch; final label observes durable outcome/flock |
    | 8. Serve | ONE pinned SQLite read snapshot | Returned rows, cache_head and built_at share snapshot; later commit cannot relabel old rows fresh |

    The same handoff/wait helper serves existing non-TTY full-rebuild and
    departed-holder branches; their prior wait consumes the same remaining budget.
    Losers never enter SQLite writer/ladder. Same-thread nested refresh still
    short-circuits; independent threads contend. Writers do not acquire this refresh
    flock as a new requirement. Actual transactional head rechecks remain correctness;
    flock is single-flight, diagnostic process records never provide ownership.

    All NEW request-lock acquisitions by readers use try-lock followed, if appropriate,
    by polls limited by the same remaining deadline; zero budget permits one try.
    No new deadline after spawn or for result recording. A failed result RMW leaves
    the prior durable reservation: child registration/reaper may later record, but
    parent does not retry spawning or fabricate tracking success. Every initial hint,
    reservation, result or diagnostic-write failure preserves usable stale reads
    (BUG-1778). Structural directory-at-file-path failure fixture is portable; chmod
    alone is not sufficient on Windows.

    Requested needs durable pending request/matching admitted attempt and an actual
    successful launch, not reservation or PID 0. If final observation finds terminal
    failure, terminal non-run/clean exit with no holder, missing token, or outcome
    unknown with no observed holder, report Deferred rather than stale local spawn
    success. WorkerRunning means real observed RefreshLock holder, including inline
    refresh; requester/diagnostic PID is not that proof. A just-successfully spawned,
    nonterminal matching token may report Requested; it is a launch observation, not
    proof of future progress. Fresh pinned cache means fresh. WriterBusy only describes
    an actual fast-fail SQLite error, never promises a worker. Hint/launch failures use
    existing Deferred wording. Known suppression is visible without a false progress
    promise. Keep one emit, object cache metadata, array shape/stderr, per-MCP reset.

    No new RequestLock acquisition blocks while holding SQLite/store write locks.
    Worker registration releases RequestLock before trying RefreshLock. Worker result
    or clear under RefreshLock happens only after SQLite transaction ends. Reaper
    uses RequestLock only; watchdog one try only. Never call a public locking helper
    recursively from a locked RMW, acquire RefreshLock while holding RequestLock,
    unlink permanent lock sidecars, or use unlocked writes. Bounded lock attempts do
    not claim to interrupt arbitrary uninterruptible filesystem I/O.

    ## 6. R2/R3/R5 — populations, persisted fields and result transitions

    Keep one bounded `attempts` array in the existing JSON request. Proposed additive
    serde-defaulted fields are `attempt_id` (UUID), `kind` (worker/launch),
    `outcome`, `started_at`, `finished_at`, `worker_identity`, and `launch_error`.
    Existing `at`, `pid`, `error` stay readable. New writers preserve bounded unknown
    fields; an unknown enum value is preserved/unattributed, not interpreted as failure
    or a parse-error reset. The token is passed by a private worker argument/environment
    field from current_exe's parent; it is not permission, path authority, a lease,
    a freshness proof or a way to choose a different cache/store.

    | Record category | Evidence | Count / old fields |
    | --- | --- | --- |
    | Reserved launch | Durable admitted slot, no successful OS spawn yet | No worker; `error=None`, started_at/at diagnostic time, pid unknown/0 |
    | Running worker | Successful OS child launch or self-registration of explicit worker, token matched | No failure; PID is actual child, never reaper |
    | Failed worker | Matching child's durable error return OR captured reaped nonzero exit (signal/watchdog included) | One exact failed-worker ID; `error=Some`, `at=first failure observation time`; finished_at same |
    | Succeeded / AlreadyFresh / not_run LockHeld | Durable normal worker result | Zero failures; terminal nonfailure; never alone authorizes clear |
    | clean_exit | Captured exit 0 with detailed report absent | Terminal nonfailure; exact work result/current freshness still unknown |
    | launch_error | current_exe/log-open/rotation/spawn syscall failed BEFORE a child exists | Separate diagnostic; `launch_error=Some`, `error=None`, no worker PID; NEVER counted as a failed worker |
    | outcome_unknown | Lost terminal report/reaper, wait() error, registered process gone, unknown identity, abandoned reservation | Zero exact failures; recover by real flock/staleness; no guessed historical result |
    | capacity / request-lock timeout / bookkeeping I/O refusal | No admission, or no reliable record update | Diagnostic only; neither worker failure nor launch_error; may leave existing token outcome unknown |
    | Legacy error | No understood modern identity/kind, `error=Some` | Unattributed historical error, existing compatibility behavior; never claimed as a distinct worker |

    **There is no new launch-specific backoff.** Launch diagnostics alone cause no
    suppression, strict fallback, replacement threshold or delay. Each invocation's
    phase permits at most one admitted launch, with ordinary next-invocation behavior
    unchanged. Repeated OS launch failures can produce repeated Deferred reads and
    bounded logs/history; fixing that with another backoff is not authorized here.
    The OS spawn success is the worker-existence boundary. The spawner must return
    that fact separately from later parent bookkeeping/reaper-setup errors: an error
    after a child exists is an observation/tracking error, never a pre-spawn
    launch_error or proof that the child failed. Preserve the child handle for owned
    cleanup/reaping; do not retry launch from that error.

    Two real failed workers plus any modern launch diagnostics still yield exact
    failed_worker_count=2 and no A7 worker suppression. Replace the existing test that
    uses cfg(test) spawn refusal to certify worker crash suppression.

    `finish_attempt(cache, token, witnessed_outcome, now)` is the single locked RMW for
    self-report/reaper/clean exit. It only updates a matching retained token in an
    existing request; never creates a request or missing slot. Direct worker/tick
    allocates its token on admission; child startup with a supplied token cannot
    create a replacement if that token disappeared. Retarget retains tokens; clear
    and new request do not. Repeated callback never inserts or renews age.

    | Current retained state | Incoming evidence | Transition |
    | --- | --- | --- |
    | Reserved/running/outcome_unknown | Child registered or parent reports successful spawn | Fill corroborated identity/PID if missing, mark running only if not terminal; no conflicting identity replacement |
    | Reserved/running/outcome_unknown | Durable worker error / reaped nonzero | Failed worker exactly once; `at=finished_at=now` on this FIRST failure observation; retain started_at |
    | Reserved/running/outcome_unknown | Durable Refreshed/AlreadyFresh | Succeeded terminal, error=None, finished_at=now |
    | Reserved/running/outcome_unknown | Durable LockHeld | not_run terminal, error=None, finished_at=now |
    | Reserved/running/outcome_unknown | Reaped exit 0 | clean_exit terminal, error=None, finished_at=now; detail can remain unknown |
    | Reserved, no child ever created | OS launch preparation/syscall error | launch_error terminal, error=None, separate diagnostic timestamp |
    | Any nonterminal | wait error, dead/PID reused/foreign/unknown identity, elapsed age, currently stale cache | outcome remains unknown/nonterminal; NO failure transition |
    | Known succeeded/not_run/clean_exit | Any later abnormal observer | Absorbing nonfailure; optional conflicting-evidence diagnostic, no error/count/time change |
    | Known failed worker | Repeated self-report/nonzero reaper (either order) | Same token, same first failure time/count; do not renew 600s window |
    | Known failed worker | Contradictory later success | Keep first witnessed failure and surface inconsistent evidence; never use an inferred-death failure to reach this state |
    | Any terminal | Delayed parent registration/running update | No terminal override; may fill matching diagnostics only |
    | Missing/pruned/cleared token, even refiled same target | Any callback | No-op; no reconstruction/matching by PID/error/time |

    Normal production self-report error must be paired with a nonzero command return;
    LockHeld/refreshed success with zero. Tests inject impossible contradictory
    observers to prove absorbing protection, not to justify guessing a real outcome.
    An observation timestamp is not asserted to be the historical instant of death.
    Parent reaper must handle status.success() by writing clean_exit, not return
    without recording. If that write also fails, acknowledge lost outcome; do not
    convert it to failure later.

    ## 7. R3 — parent death and honest recovery

    | History | Durable interpretation | Recovery |
    | --- | --- | --- |
    | Parent alive, worker self-reports Err, then nonzero reaped | One witnessed failed worker; both RMW orders/repeats identical | Request stays, gate counts once |
    | Signal-only death or watchdog nonzero with live parent | Parent's captured wait status witnesses failure of its captured token | One failure; no PID resampling needed |
    | Parent exits; child writes terminal report | Use that report once, independently of parent survival | Fresh-current clear or pending hint as appropriate |
    | Parent exits; registered child dies; no report or captured wait status | Outcome unknown, even with exact dead identity and stale cache | Try real flock, re-derive staleness, new admitted worker can recover; never infer failure |
    | LockHeld returned; detailed report write fails; parent reaps zero | clean_exit nonfailure, not exact LockHeld if detail lost | Another holder/request determines recovery |
    | LockHeld returned; report and parent observation both lost; cache later stale | Unknown, NOT failed | Same real-flock/staleness recovery |
    | Worker successfully refreshed; HEAD moves/new request survives; success report lost; parent reaps zero | clean_exit nonfailure despite current stale cache | New worker may refresh newer HEAD |
    | Same successful history, no surviving parent observation | Unknown, NOT failed | Same recovery; current staleness cannot reconstruct old success/failure |
    | Parent and child disappear between spawn and identity registration | Unknown launch/outcome, not known failure | Reservation can retire by section 10; freshness remains re-derivable |
    | wait() fails | Unknown exit outcome | Diagnostic and later real-flock recovery; do not retry count by probing PID |

    There is no orphan failure inference and no abandoned-attempt suppression policy.
    A known dead process tells us only it cannot still work. A positively live process
    is protected for bookkeeping retention, not a reason to steal or manufacture
    freshness. Neither live, gone nor unknown sidecar overrides the kernel flock.
    No new supervisor, watcher, schedule, signal listener service, lock steal or kill
    is added. The explicit accounting limit is unavoidable: if both terminal report
    and parent's wait result are lost, exact failure evidence is unavailable. A7
    counts witnessed failed workers, never hypothetical ones. Discarded records
    further limit accounting as explicitly shown by the retention diagnostics.

    ## 8. R4 — startup/cap and identity phase tables

    Worker entry needs a narrow route before the ambient backend's constructor can
    refresh. In `lib.rs::run` after typed command/path classification and before any
    backend construction, route `CacheCommand::Refresh { worker: true, ... }` to a
    small worker entry helper in cache_cmd.rs. It validates the explicit store/cache
    pair, uses the existing path derivation, and never lets an ambient constructor
    perform untracked work before admission. Keep other cache commands on their
    existing strict route. `--if-requested` should likewise check/admit its request
    before a constructor can accidentally do the pending refresh; no request is the
    existing silent no-op. This is existing-command dispatch plumbing, not a new
    public command or worker service.

    | Startup phase | Cap / RequestLock behavior | Allowed effect / refusal |
    | --- | --- | --- |
    | W0 typed worker entry, explicit paths selected | Record monotonic t0 and arm existing process watchdog immediately at t0+120s floor, before new request I/O or backend open | No refresh work yet; invalid args return normal error before work |
    | W1 early registration | ONE RequestLock try, no blocking/polling | Supplied retained token: self-register exact identity monotonically. Manual worker: atomically file/admit token if pending stale work must be done. Contention/error/full capacity: diagnostic registration_deferred, clean no-work exit; no untracked backend refresh |
    | W2 open after admission | Watchdog already active; RequestLock released | Construct explicit backend in cache-snapshot/open mode that does not trigger tolerant constructor spawn; worker flag forbids recursion |
    | W3 cap adjustment | When backend's existing last_full_rebuild_ms becomes available, set deadline ONCE to t0+max(120s,2×last_full_rebuild_ms); never now+cap, never extend an expired deadline | Missing/unreadable duration retains floor as existing fallback; startup time is included |
    | W4 refresh body | Existing RefreshLock patience, normal strict worker policy; no RequestLock held while acquiring flock or in SQLite transaction | Run `run_refresh_worker`; transactional guards unchanged |
    | W5 outcome/clear | One RequestLock try for result (or bounded by remaining cap if factoring existing worker helpers); no fresh per-call deadline | Failure to report is lost evidence/diagnostic, not another worker failure. Preserve original command result |
    | Wcap deadline expires at any covered phase | Watchdog attempts result recording with try-lock ONCE; never waits for RequestLock | Existing nonzero cap exit still occurs; reaper may witness if self-report unavailable |
    | Wdone normal return | Cancel/join or disarm watchdog through bounded notification | No late watchdog can kill a completed reusable process; normal CLI process may exit as usual |

    W1's registration refusal is a nonfailure no-work outcome, not a failed refresh.
    Parent reaper's exit zero can record clean_exit when the lock becomes available;
    if not, the reservation stays unknown until recovery/retirement. OS launch really
    occurred, but no work was claimed, so never claim fresh data from this exit. A
    supplied token lost through clear/pruning/downgrade is not recreated: clean
    registration_deferred exit with no backend refresh. A deliberate manual worker
    without a supplied token may allocate one under the same admission rules.

    The cap adjustment deliberately includes startup rather than granting another
    120s after open. If metadata cannot be obtained before the armed floor expires,
    the floor applies (the same missing-duration fallback), with honest diagnostic;
    no blocking metadata read is allowed to delay the watchdog. No new runtime knob
    changes the floor or multiplier. A shorter cap is test-only. Process-wide cap
    starts before the first newly introduced bookkeeping attempt, not after it.
    This does not promise to interrupt OS uninterruptible I/O; tests hold a normal
    flock beyond the test cap and must show no indefinite bookkeeping wait.

    Parent result recording and reaper terminal recording also use bounded/try-lock
    updates. Reaper owns the captured child handle and token, so status is sufficient
    outcome evidence. After spawn, parent may fill actual child PID but must not
    sample a start identity after `wait/try_wait` has reaped that child. Simplest
    implementation: **parent does not sample start identity at all**; child
    self-registration supplies it. If child dies too early, leave identity unknown
    and use captured wait status for exact outcome. This avoids a reused PID race.
    A post-spawn parent RMW must not replace child's identity or overwrite terminal
    state. RequestLock contention there never causes a second launch.

    Modern attempt identity has its own narrow classifier built from the existing
    probe primitives, NOT `classify_lock_owner`'s legacy-compatible policy. Do not
    change legacy lock-info cleanup semantics.

    | Modern stored/probed identity | Classification | Consequence |
    | --- | --- | --- |
    | Required PID/start/boot/ns missing, invalid, or local domain unavailable | Unknown | No dead/failed inference; eligible unknown-retention rules |
    | Recorded boot or namespace differs from current local domain | Unknown/foreign | No local PID interpretation, kill or ownership claim |
    | Same boot/ns; process probe is denied/unreadable/indeterminate | Unknown | PID lookup failure is not definite absence |
    | Same boot/ns; comparable scheme and equal live start identity | Positively live matching worker | Protect slot while currently verified; never count age as failure |
    | Same boot/ns; comparable scheme, live PID but different start identity | Original worker gone, PID reused | Outcome still unknown absent report/wait; do not bind new process to old token |
    | Same boot/ns, full recorded identity, reliable probe proves PID absent | Original worker gone | Outcome still unknown; retention/recovery may proceed |
    | Same domain but start-identity schemes differ or live start cannot be read | Unknown | Do not use PID-only fallback |
    | Direct child wait status captured with its handle/token | Exact terminal exit evidence irrespective of later PID reuse | Use section 6; never probe a now-reused PID to fill identity |

    On platforms without comparable boot/ns/start primitives, nonterminal identity
    may remain Unknown; actual self-report/wait status still works. Hostname is display
    only. The classifier runs outside request/store/SQLite write locks; RequestLock
    RMW rechecks token/revision before applying its observation. Stale observations
    never authorize killing or stealing. Positive-live protection is based on that
    admission pass's observation, not a permanent persisted boolean.

    ## 9. R5 — timestamp and mixed-writer compatibility

    For a modern failed worker, preserve b46's meaning exactly:

    * `started_at` = launch/reservation timestamp (additive, immutable diagnostic).
    * `at` = first witnessed FAILURE timestamp once `error` becomes Some; set once.
    * `finished_at` = the same first terminal timestamp for modern readers; new
      counting uses `at` for error rows so losing finished_at cannot change window age.
    * For pending/nonfailure rows, `at` may remain diagnostic start time and is never
      counted without an error. Modern launch_error lives in `launch_error`, with
      `error=None`, so field loss does not turn launch diagnostics into worker errors.

    A worker that starts 900 seconds before failing now has `started_at=now-900`,
    `at=now`, not an immediately expired error. An old serializer drops optional
    fields but retains `{at,pid,error}` with the correct RECENT FAILURE age. Repeated
    reports, retarget and old-writer roundtrip do not renew it. Window remains inclusive
    0..=600 seconds; at age 601 it no longer counts. Invalid/future failure times are
    unattributed/unusable for the existing predicate, never rewritten to now to force
    suppression. Observation time is retained, not guessed death time.

    New exact-worker summary: unique understood modern failed worker tokens in the
    window; launch, pending, capacity, wait error and unknown outcomes excluded.
    **Compatibility fallback uses the existing old-reader projection, explicitly
    labelled:** if any retained legacy/unattributed error rows exist, separately
    compute the b46-style count of retained `error` rows in the same window (including
    modern worker errors, never modern launch_error), threshold 3. Expose that as
    `legacy_compatibility_suppressed`, not “three distinct workers.” With only modern
    records it is not a separate gate; exact-worker gate is the only A7 count. This
    preserves conservative existing behavior for legacy populations rather than
    inventing a guessed launch/unknown threshold. Two modern workers plus one modern
    launch error do not satisfy EITHER predicate. Two modern workers plus an
    unattributed historical error may conservatively trigger the explicitly labelled
    legacy condition; it is not claimed to meet the exact three-worker proof.

    An old writer can also create legacy errors for its own failed spawns or append
    duplicate observers; the new reader cannot reconstruct their provenance. Never
    deduplicate legacy rows by PID/time/error, guess missing tokens, or relabel them
    exact. Actual old serializers ignore/drop new fields; new writers preserve
    unknown fields within the bounded format. If token is erased, later modern
    callback no-ops and state is explicitly downgraded/unattributed. Old pending row
    is unknown, not failed. Modern launch diagnostics disappear under old serializer
    rather than becoming legacy errors; report this diagnostic-loss limit honestly.

    No seamless exact mixed-writer guarantee: exact counting requires retained modern
    identity/outcome records. Conservative legacy suppression retains normal ordinary
    strict recovery and show's no-inline/no-launch exception from section 4. Successful
    explicit cache refresh with compatible current-HEAD clear remains recovery; no
    manual deletion of permanent lock sidecars. Eventual normal retirement/restart of
    old worker/MCP binaries is for the authorized activation owner, not this sketch.
    No activation, install or runtime-authority change is performed or implied.

    ## 10. R6 — finite retention, admission and serialized size

    All constants below are proposed storage/diagnostic bounds for independent review,
    **not new spawn-backoff thresholds**. Existing suppression constants stay 3 and
    600 seconds. The single request file uses disjoint record quotas:

    | Constant | Value | Category / purpose |
    | --- | ---: | --- |
    | MAX_ERROR_RECORDS | 10 | Modern failed-worker plus legacy `error` records |
    | MAX_OTHER_TERMINALS | 10 | succeeded/AlreadyFresh/not_run/clean_exit; no error |
    | MAX_LAUNCH_DIAGNOSTICS | 10 | Pre-spawn launch_error records; no error |
    | MAX_NONTERMINALS | 8 | Reserved/running/outcome_unknown incl registered Unknown |
    | UNKNOWN_DIAGNOSTIC_TTL_SECS | 600 | Diagnostic retention age, NEVER failure/suppression |
    | MAX_REQUEST_BYTES | 131072 (128 KiB) | Bound for JSON written by modern helpers |
    | MAX_ERROR_TEXT_BYTES | 1024 | Error/launch diagnostic text; UTF-8 boundary truncation |
    | MAX_IDENTITY_TEXT_BYTES | 256 per textual component | Diagnostic bounds; invalid oversized identity becomes Unknown, never matching |

    At most 38 attempt records after a normal modern RMW. Tokens/timestamps are fixed
    length; known path/binary diagnostics and preserved unknown-field data count toward
    the byte cap. Terminal times and started_at are immutable; no last-seen refresh
    extends retention age. A formatter can show discarded/unattributed accounting
    limits but must not invent exact totals for records intentionally pruned.

    Run retention/admission under the EXISTING RequestLock, with liveness observations
    collected before it and token/revision rechecked inside it. Algorithm:

    1. Load complete request or use the existing missing/corrupt-hint handling. Preserve
       target/request revision and all retained token identities. Partition understood
       records by the disjoint categories above; unknown non-error records are
       nonterminal/unattributed. No record is classified failed from age/identity.
    2. Error quota: first protect the newest **three distinct modern in-window worker
       failures** if available. Also protect enough newest remaining in-window error
       rows to retain the existing compatibility predicate (at most three additional
       rows). Union <=6 fits quota10. Fill remaining slots with newest in-window error
       records, then newest expired/invalid error diagnostics up to10. Drop others.
       Ties use stable existing array order/token; repeated reports do not reorder.
       Success/not_run/launch/pending volume never competes for this quota. Dropping
       a fourth+ worker error may reduce displayed historical count but cannot erase
       the still-true >=3 predicate. Report retained counts, not lifetime totals.
    3. Other terminal quota: keep newest10 by first terminal timestamp (invalid times
       ordered by stable array order), prune oldest. Launch diagnostics: newest10 by
       original diagnostic time, separately. Neither category contributes to worker
       or legacy-error predicate. Repeated callbacks never renew timestamps.
    4. Nonterminal quota: positively live matching workers from this observation pass
       are protected. For all other nonterminals, including registered-gone and
       registered-Unknown, discard diagnostics at age>=600 from immutable started_at
       (legacy at if started_at absent). A missing/invalid/future retention timestamp
       is unverifiable and is eligible for admission-pressure pruning; never repair
       it to a newer timestamp or use it as a failure time. Positive-live protection
       overrides age retirement.
    5. If an admission needs a slot and eight nonterminals remain, remove the oldest
       **not positively live** slot, even if younger than600; stable order breaks ties
       or orders unknown timestamps. Label this diagnostic eviction, NOT death,
       failure or cancellation. Thus registered Unknown records cannot permanently
       saturate capacity. If all eight are positively live, refuse admission with
       Deferred/capacity diagnostic; no launch, worker failure, launch_error or strict
       fallback from the spent tolerant phase. Future operations re-probe live slots;
       when one is no longer positively live it can be retired on admission. No timer
       or recurring cleanup job is needed.
    6. Reserve the new token only after suppression, capacity and byte checks pass.
       A callback for any pruned token remains absent forever; it cannot reinsert
       itself. Child with missing admission token exits registration_deferred without
       untracked refresh. A worker already doing legitimate work whose diagnostic
       token was pruned is not killed; its SQLite/flock correctness is independent,
       but its later lost callback cannot be counted. This is an explicit accounting
       limit of pruning Unknown records, not a claim to know that worker was dead.
    7. Serialize atomically. Bound known diagnostic strings on insertion before the
       byte check. Preserve unknown fields when they fit. If an existing record's
       opaque fields make the request exceed128KiB, do NOT silently drop those fields
       or rewrite failure timestamps/tokens to squeeze it: refuse the hint mutation
       with a format-size diagnostic and serve usable stale reads Deferred. Existing
       missing/corrupt hint recovery stays separate; an oversized parseable hint is
       not secretly called corrupt. Explicit fresh-current clear can remove it under
       existing rules. No unbounded write is emitted and no worker admitted without
       a persisted slot. Tests report this compatibility limitation separately from
       the normal finite Unknown-slot recovery guarantee.

    All-live saturation can legitimately remain Deferred while those eight workers
    are positively live; their completion/departure makes later admission possible.
    Unknown saturation cannot: on the next admission one eligible record is evicted.
    No live process or lock is retired by diagnostic eviction. Plain explicit strict
    refresh remains the recovery verb and does not need detached admission capacity.
    Request retarget preserves retained history; successful current-HEAD clear resets
    it as before. Same-target clear/refile uses new UUIDs; old callbacks are no-ops.
    No parallel tombstone store, token resurrection or unbounded history.

    ## 11. Clear, status and accepted scope retained

    All success clears, including plain `handle_cache_refresh`, converge on the
    existing freshness-under-RefreshLock contract. Check compatible cache against
    **current** store HEAD after commit, not requested target or ancestor. Then under
    RequestLock re-read request and compare the captured revision/membership
    (target/requested_at and tokens as applicable); leave a concurrently changed
    request intact. No SQLite/store write lock is held while taking RequestLock.
    A late HEAD move can always require new work; the next reader re-derives it.
    Process exit zero, success record, target==storeHEAD and a dead PID never authorize
    clear. No-token no-request error callback never creates a new request. Preserve
    BUG-1779 RMW serialization and newer-request protection; no sidecar lock deletion.

    Factor a small shared observation/formatter for
    `cache_cmd::{handle_cache_command,print_refresh_status}` and
    `mcp::tool_cache_status`, with population summary reused by doctor. Explicit CLI
    cache status and MCP cache_status remain **strict**, refreshing each invocation/
    call and propagating refresh errors. Do not wrap a failed strict refresh in a
    success-shaped stale report or convert other MCP reads. Preserve current text
    envelope/descriptor schema unless an additive declared field is explicitly
    reviewed; A9's separate scoped label contract remains intact.

    Show cache_head, store_head, built_at from compatible observation; pending target/
    age; actual refresh-lock held/free/unsupported/unknown; diagnostic writer record
    and classification; exact recent worker failures, separate launch diagnostics,
    legacy/unattributed errors, unknown outcomes, retained/pruned accounting limits,
    last errors and the specific worker/legacy suppression reason. No launch-specific
    suppression exists. Requester PID or SQLite write lock-info is not flock-holder
    identity; report unknown if unestablished. Target==storeHEAD with stale cache is
    pending; only compatible observed cache freshness at current HEAD warrants
    “cache observed fresh.” Schema/missing/read error is unavailable, not satisfied.
    The formatter is observational and never clears/heals. Tests witness stale target
    semantics before strict status repairs it, then real CLI/MCP transport and a
    second MCP call after state change. Doctor wording must mention show's bounded
    exception rather than universally promise all readers take strict recovery.

    The only show changes here are command-derived helper policy and its no-launch/
    no-inline boundary. Do not implement resolver, UUID/native path/alias selection,
    committed historical YAML blob, dirty-object semantics, graph enrichment or
    whole-invocation deadline machinery in this child. Existing strict escape sites
    on flock errors and rollup-identified show identity defects remain separately
    tracked; this delta may not introduce new ones. Preserve BUG-1801 zero cache wait.
    BUG-1674 still requires one 4s operational deadline, aggregate wait<=1500ms,
    external useful result<5000ms, default linkage and complete fresh post-activation
    in-lineage 24h dogfood evidence on both limbs. None is certified by these tests.
    TASK-1526's four-reader default-budget <2s certificate also remains outstanding;
    its current 60s single-flight unit test is not that certificate.

