    ## R1 — APPROVED: preselection and late-suppression phase

    V2 §§4–5 resolves the actual contradiction between A7/Q1 strict exceptions and A13’s spent tolerant attempt. Ratify ordinary no-detach/pre-observed suppression strict preselection BEFORE any tolerant SQLite write. Preserve known Q1 TTY full-rebuild preselection. After admission to the tolerant branch, busy or ordinary decline enters handoff/observe only: no second SQLite write, ladder, full rebuild, or a constructor/query/repin trick that resets the phase. Unknown-before-attempt full-rebuild need discovered afterward follows that same handoff rule; a subsequent independent invocation or explicit strict command can select strict. This preserves the strict exception when selected and the one-attempt constraint once selected, rather than making one override the other mid-operation.

    Ratify reservation RMW as launch-admission linearization. If the third witnessed worker failure lands after tolerant preselection but before reservation, it blocks reservation/spawn, leaves Deferred and no second write, and the next independent ordinary invocation can select strict. If reservation wins first, that admitted launch is allowed; later reservations stop. The OS launch need not be atomic with a failure report, and RequestLock must not span SQLite or spawn. This is a concrete phase interpretation of A7/A13, not permission to ignore suppression for future work.

    Show uses actual command-derived BoundedShow policy. No-detach and suppression mean BOTH zero launch and zero strict fallback. Zero budget alone does not classify an advisory caller as show. The narrow fence is approved without certifying existing broader show escape sites. Shared remaining deadline includes new RequestLock polls and parent recording; zero allows one try. Hint/lock/write/capacity failure preserves useful compatible Deferred rather than a new strict escape.

    Proposed witnesses are sufficient for this design gate: real separate BEGIN IMMEDIATE holder and changed title/status/relationships, absent/misleading sidecars, guard-held file/reserve/launch barrier, counting from before constructor through repin, ordinary strict controls, both sides of the third-failure/reservation race, actual human TTY/local JSON/global JSON/TOON show, and unrelated budget-zero control. The mutation must fail the ordering or attempt assertion, not fixture setup. Current source cannot pass those witnesses unchanged.

    ## R2 — APPROVED: launch diagnostics are separate, with no new backoff

    V2 §§6,9–10 uses actual OS child creation as the existence boundary. current_exe/log-open/rotation/spawn syscall failures before a child exists are terminal launch diagnostics with launch_error and error=None. They cannot enter either modern exact-worker suppression or the old error projection. No launch-specific threshold, delay, strict fallback or replacement policy is approved. Repeated failed launches remain possible across invocations with bounded diagnostics; this is the honest consequence of preserving the signed three-WORKER rule.

    After a child exists, parent bookkeeping/reaper setup errors cannot relabel it a failed launch or justify another launch. Retain the child handle for owned cleanup and captured exit evidence. Wait errors, registration/capacity refusal and request bookkeeping failures are not invented worker failures. A genuine nonzero child outcome can count even when start identity was never registered; the captured handle/token supplies its provenance.

    Tests reach genuine failed log-open and spawn boundaries, use narrowly injected current_exe failure where needed, and prove two real failed workers plus launch failures still allow a viable launch; a third real failed worker suppresses. Synthetic counter rows or cfg(test) spawn refusal cannot certify this. V2’s explicit absence of launch backoff resolves R2 without guessing numeric policy.

    ## R3 — APPROVED: witnessed outcomes and absorbing nonfailure

    V2 §§6–7 correctly separates “process is gone” from “process failed.” Known success, AlreadyFresh, LockHeld/not_run and captured clean_exit are terminal nonfailures and absorb later abnormal observations. Real error/nonzero updates count once by token and retain first failure time in either self-report/reaper order. Contradictory observers are surfaced diagnostically; the design never manufactures a first failure from death/age/current staleness.

    Both V1 counterexamples are now explicit: lost LockHeld report followed by stale cache; successful refresh with a later HEAD move/new request and lost success report. Captured exit zero establishes nonfailure in both; without either terminal report or wait result, outcome remains unknown. A known-dead orphan can permit ordinary flock/staleness recovery without being counted failed. Signal-only and watchdog failures are still witnessed through a live parent’s captured wait status or durable failure report. No new supervisor is needed to invent unrecoverable history.

    Known nonfailure absorbing versus first witnessed failure immutability is internally consistent for normal production pairing (Err/nonzero and success/zero). The contradictory-evidence tests check robustness, not a new source of failure inference. Clean exit never proves current cache freshness or grants clearing authority. Both observer orders, parent-death boundaries, genuine signal/watchdog cases and the two lost-report histories are required implementation witnesses; their recovery and exact/unknown count assertions make them non-vacuous.

    ## R4 — APPROVED: early cap, try-only registration and modern identity

    V2 §8 supplies the missing ordering. Route the typed worker with explicit paths before an ambient constructor/notices can refresh; arm the existing watchdog at monotonic t0 before new request I/O/backend open. Registration is one RequestLock try. Missing supplied token, contention, write/size/capacity refusal yields clean registration_deferred and NO backend refresh; it is not a failed refresh. A manual no-token worker may deliberately admit a new token under the same rules; a supplied lost token may never be replaced.

    Ratify the startup-relative cap adjustment: initial deadline t0+120s, then once metadata is available t0+max(120s,2×last_full_rebuild_ms), never now+cap and never reviving an expired deadline. If metadata cannot be obtained before the armed floor, floor applies. These are the existing floor/multiplier and missing-duration fallback applied early, not a new timeout number. Including startup closes an actual unbounded region while preserving the approved formula for known metadata. Watchdog reporting is one try and cannot postpone nonzero exit; normal completion disarms it. Bounds do not purport to interrupt kernel-uninterruptible I/O.

    Ratify the modern identity table: comparable local boot/ns and equal start identity is positive live; comparable local unequal start identifies the original process as gone/PID reused but not failed; absent/foreign/unreadable/uncomparable identity is Unknown. Legacy diagnostic cleanup remains unchanged. Existing bool/Option probes must be interpreted conservatively where they cannot distinguish absence from unreadability. Parent does not sample start identity; the child supplies it. Reaper uses its captured handle/token, not a fresh PID lookup. Probe outside RequestLock and recheck retained token/revision inside it; observations do not grant kill/steal/freshness authority.

    The planned held-RequestLock startup and watchdog cases distinguish prompt clean refusal from a real cap failure; backend-open stall proves the cap is armed first. Delayed parent updates, post-spawn contention, each parent-exit boundary and PID/domain cases address the actual source hazards. No Cargo/process run is needed to approve this explicit design; results must be obtained later.

    ## R5 — APPROVED: first-failure at and labelled conservative compatibility

    V2 §9 preserves b46’s at semantics for error rows. started_at is additive launch time; at becomes FIRST witnessed failure time when error first appears, and finished_at matches it. Repeated reports/retarget cannot renew that time. A worker started 900 seconds earlier and failing now remains a recent error after a real old serializer drops the new fields. Counting uses at; losing finished_at does not prematurely expire the failure. Inclusive 0..600 and expiry at601 remain unchanged. Invalid/future timestamps are not repaired into fresh evidence.

    Ratify the explicitly named legacy compatibility fallback already allowed by V1 R5: when legacy/unattributed errors remain, compute the retained b46 error projection in the same window, separately from exact modern distinct-worker IDs. Modern2+launch never suppresses. Modern2+legacy1 may conservatively suppress under the labelled compatibility condition, never described as three proven workers. Old code can have written duplicate observations or spawn errors; no correct deduplication/provenance recovery is available from at/pid/error. This preserves a documented legacy limit rather than falsely promising exact mixed-writer semantics.

    New writers preserve bounded unknown fields; old writers can erase tokens. Such callbacks no-op instead of reconstructing identity by PID/time/error. Launch diagnostics lose detail under old serialization but remain non-error rows. Tests require actual b46 serialization or a byte-identical focused roundtrip, the long-worker/600/601 boundaries, token loss, legacy pending/future times, launch downgrade and explicit fresh recovery. Old processes’ retirement/activation is a later owning-seat operation, not part of this approval.

    ## R6 — APPROVED: finite retention and recoverable Unknown pressure

    Ratify the actual V2 constants as diagnostic storage/admission bounds: 10 error records, 10 other terminals, 10 launch diagnostics, 8 nonterminals; 600s Unknown diagnostic age; 128KiB modern serialized-write cap; 1024-byte error text and 256-byte identity components. These are not a new suppression predicate or a change to the signed 3/600 worker rule. The original ten-error capacity is preserved; additional disjoint categories prevent successes/launches/pending volume from displacing the qualifying failures.

    The priority algorithm is sufficient: protect newest three distinct modern in-window failures plus enough remaining recent errors for the compatibility predicate (union at most six, within ten), then fill the remainder in specified stable order. Other terminals and launch errors have separate quotas. Repeated callbacks do not add or age-refresh rows. Thus success volume cannot turn a still-valid suppression predicate false merely by filling history.

    Nonterminal liveness is an admission-pass observation, not persisted authority. Positive-live matches are protected despite age. Other records, including registered Unknown, retire at age>=600 or under immediate admission pressure when all eight slots are occupied; unverifiable dates are pressure-eligible, never rewritten. Unknown pressure therefore cannot create permanent capacity lockout. Eight positively live attempts legitimately refuse the ninth without failure accounting; a later operation reprobes them. Eviction removes diagnostics only, never kills/cancels work or declares death/failure. Unknown on an unsupported platform can be pruned while real work continues; SQLite/flock correctness remains, and exact accounting for the removed token is honestly unavailable.

    Membership fencing is adequate without a parallel tombstone store: terminal/nonterminal pruning and clear/refile remove tokens permanently to callbacks, retarget retains still-present tokens, same-target refile allocates fresh UUIDs. A child missing its supplied admission exits before work; a worker already admitted and running is not killed by diagnostic eviction. Its late callback is a no-op, not a resurrection.

    The byte bound is a write bound, not a claim to bound all reads of arbitrary existing files. Oversized parseable opaque extensions are not silently dropped or called corrupt: refuse mutation/admission and serve compatible Deferred; explicit compatible fresh-current clear remains recovery. That compatibility limitation is distinct from normal Unknown-slot saturation, which must recover automatically. No infinite history/tombstones/supervisor is introduced.

    The proposed three-failure-plus-success-volume, all-live ninth-slot, Unknown pressure and 599/600 age, invalid/future age, expired601 failure, pruning/retarget/same-target ABA and byte-cap witnesses exercise all these boundaries. A failure at setup or a model-only success is not sufficient. Tests must show the actual serialized file and admitted/no-admitted worker behavior.

    ## Whole-design consistency and implementation evidence gate

    Accepted C1 fundamentals remain: rollback and restore fast-fail scope before hint work; preserve RefreshLock through file/reserve/spawn; release it before bounded observation. Child registration releases RequestLock before attempting RefreshLock. Parent/reaper/watchdog do no SQLite/store work while holding RequestLock, and no locked helper recursively calls a public locking helper. The child can register promptly during the parent’s launch window but cannot refresh through the held flock.

    Accepted C2 fundamentals remain: one token per admitted attempt, one terminal RMW, no duplicate self-report/reaper count, no token reconstruction. Current freshness under RefreshLock plus captured request revision/membership under RequestLock authorizes clear; success/exit0/target==HEAD/ancestor equality alone does not. Preserve BUG-1778 hint-error degradation at every new write point and BUG-1779 serialized RMW/newer-request protection. Permanent sidecar locks are never unlinked.

    The returned label belongs to the pinned rows/head/built_at. Requested needs durable matching admission and actual launch, and cannot survive observed terminal/no-progress evidence; WorkerRunning requires real observed refresh flock, not a requester PID. A newly launched nonterminal Requested is a launch observation, not a guarantee of future progress. One shared invocation/per-MCP-call scope emits once and resets on exit/error; strict callers remain strict. A stale earlier result cannot be retroactively labelled fresh by a later backend.

    CLI cache status and MCP cache_status continue strict refresh on every invocation/call and propagate errors. The observational shared formatter does not clear or heal and distinguishes actual cache freshness from target==HEAD. The stale-target formatter witness MUST precede strict repair; separately exercise actual CLI/MCP transport and two calls after a state change. The cache_status text envelope/descriptor contract is preserved; no blanket conversion of other MCP tools or schema expansion is approved. Doctor shares the same retained population summary and describes the bounded-show exception honestly.

    V2 §12 is a sufficient proposed evidence plan, not evidence already produced. Its actual production-spawn, real separate SQLite/flock holders, changed rows/relationships, readiness barriers, both race orders, private HOME/XDG/TMP/Git configuration, scrubbed inherited settings, same-current_exe binary proof, fake reachable forge/vendor launchers and owned-child cleanup directly address the weak existing fixtures. Record tested source/binary hashes/features, exact commands/discovered cases/results and targeted mutation failures. A timing-only tiny fixture, timeout-only useful-result claim, PID0, or three fake spawn failures cannot pass the implementation gate. Preserve the targeted transaction/migration/head-recapture/refill/epic/nesting/strict-mutation/label regressions and unchanged strict retry delays. Full workspace validation remains batch-once, not a new build per design child.

