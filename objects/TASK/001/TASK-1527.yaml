    ## 2. Pinned source: existing implementation versus proposed changes

    | Existing symbol / source | Verified behavior / proposed bounded change |
    | --- | --- |
    | `cached_git_backend.rs::freshen_for_read`, 546–560 | Typed incremental busy rolls back then drops refresh guard and returns WriterBusy, with no C request. Add policy preselection and guarded handoff after the one tolerant attempt. |
