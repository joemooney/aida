description: |-
  From BUG-2740
  Reviewed sha: 833284c12f44606b5f680b675adc6d851eceb167

  aida-cli-lib/src/queue_cmd/work.rs:5153 and aida-cli-lib/src/standalone_implementer.rs:1572. Moving the cold-start wait ahead of the disk-floor preflight reverses their order. On a host with full cold-start capacity and disk below the floor, a pickup now waits for a slot before it can return the typed disk refusal and queue deferral. Preserve a disk-floor refusal with the existing deferral semantics before the potentially unbounded slot wait, and recheck disk at launch.
