title: 'aida mailbox: retire read/stale messages so the inbox read-view is not buried under OBE handoffs (archive + unread-default)'
description: |-
  ## Why
  Operator (2026-09-11): the per-turn unread trigger (aida mailbox notice) is sound — it fires on UNREAD only and correctly ignored six read June handoffs today, surfacing the two live advisor messages. But aida mailbox inbox renders ALL messages oldest-first with no prune/archive, so a reader wades through months of OBE handoffs to reach the current ones. The mailbox has send/inbox/notice/list and no way to retire a read message — the same gap specs closed with an archive tier and the queue closed with gc.

  ## Acceptance
  1. aida mailbox inbox defaults to showing UNREAD + a small recent tail (e.g. last N read, configurable), newest-first; --all shows the full history (current behaviour). The two live messages are never buried under read ones.
  2. aida mailbox archive <id> retires a read message (hidden from the default view, preserved for --all/--archived); aida mailbox archive --older-than 30d --read-only sweeps stale read mail. Never touches unread.
  3. aida mailbox gc (or the sweep above) is safe to run from a maintenance pass; a broadcast/handoff whose referenced specs are all Completed/merged is a prime archive candidate (advisory, not automatic).
  4. --unread and --all keep working; notice is unchanged (already unread-only, never marks seen).
  5. Ordering: default newest-first (the live item is on top); --all may stay oldest-first for thread reading.
  6. Test: an inbox with 2 unread + 6 read-and-old shows only the 2 (+ recent tail) by default; archive hides a read message; unread is never archived.

  ## Related
  STORY-441 (spec archive tier — same pattern), queue gc, aida awaiting (the unread trigger that already works right).
