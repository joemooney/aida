title: Route the remaining unchecked id lookups through the ambiguity-refusing resolver
description: BUG-1535 made edit, show, del, comment, archive, assign, defer, --parent and the MCP update/comment/relationship tools refuse an ambiguous id. About 171 call sites still use the old unchecked lookup, including MCP tool_post_punt (mcp.rs ~3011), tool_triage_finding (~3288), session_start (lib.rs ~33942) and the pull auto-bump by commit trailer. Route every write-path lookup through the checked resolver, where an ambiguous id refuses. Reads may warn. Also, an unreadable YAML currently drops out of the on-disk ambiguity re-check and lets a write through; treat unreadable as ambiguous for writes (PRIN-5).
