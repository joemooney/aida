  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #4321):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 05a3466d26a3
    Recorded: 2026-11-19T17:34:19.364221970+00:00
    Findings:
    1. Enforce the compile gate on self-publishing conflict lanes (TASK-3804 AC1). The new check is reached only through seat_clone.rs:5343-5355 commit_pending. queue_cmd/work.rs:860-866 still selects host_conflict_task(..., false) for vendors other than contained Codex (vendors/headless.rs:12-14), and rework_direction.rs:260-262 tells those lanes to commit and ship themselves. Such a lane can resolve, commit and publish an uncompilable merge without check_repair_tree or recorded validation. Route every supported conflict-repair publication through the same exact-tree compile gate, or refuse unsupported publication routes; add a regression covering a self-publishing lane. The implementer self-review also explicitly identifies this uncovered route. This finding does not depend on newer base changes.
    2. Check the merged project rather than one hard-coded package (TASK-3804 AC1). lane_job.rs:2269-2278 always runs cargo check --profile agent -p aida-cli-lib --tests --locked. aida-server, for example, is a workspace member outside that package dependency graph, so a conflict resolution containing a compile error there can receive successful validation and be published. The same unconditional package selector also rejects otherwise valid conflict repairs in other AIDA-managed repositories that have no aida-cli-lib package. Select the compile scope from trusted project policy and cover the merged workspace/affected build targets; add a regression with a failing crate outside aida-cli-lib and a valid non-AIDA project. This finding does not depend on newer base changes.
    3. Make refusal delivery idempotent across acceptance/receipt failures (TASK-3804 AC2). repair_journal.rs:376-385 persists accepted_delivery only after the mailbox subprocess returns. If the mailbox accepts the message and the host exits before saving, or advisor_request times out after acceptance, the next attempt sees accepted_delivery=None and sends another message for the same PR/head. The new documentation explicitly permits this duplicate, but the claimed acceptance criterion requires one mail per head. A sender-side lock only serializes live attempts and cannot close this gap. Use a stable PR/head delivery identity with mailbox deduplication or recoverable acceptance reconciliation, and test accepted-send followed by interrupted/failed receipt persistence. This finding does not depend on newer base changes.
    4. Exercise the production repair sandbox path in committed regression coverage (ADR-76). lane_job.rs:1830-1861 introduces source-mount rewriting, target fallback, network/IPC namespace changes and snapshot cwd selection, but no test reaches this branch with repair_snapshot=Some. The new task_3804_compile_failure_keeps_conflict_resolution_off_origin test replaces the entire compile callback with an injected error at bug_home_038_seat_publish_tests.rs:2332-2346; existing fast-gate tests pass None. Consequently removing the new read-only bind or namespace isolation would leave these tests green, and no real compiler fixture establishes that a valid snapshot succeeds while an invalid one fails through check_repair_tree. Add a production-runner regression with positive controls for compilation and negative controls for source writes and network/IPC access, including target fallback. The disposable fixture mentioned in self-review is not committed reproducible coverage. This finding does not depend on newer base changes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
