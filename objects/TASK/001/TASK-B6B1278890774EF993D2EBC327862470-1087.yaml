title: 'STORY-2710 residue: compile-check merged tree, one mail per head, BUG-2558 rev-parse residual'
description: |
  Follow-up of STORY-2710 (closed: #3832 slice 1 plus STORY-2768). 1. Compile-check the merged tree before publishing it. 2. Send one mail per head, not one per attempt. 3. Fix the BUG-2558 rev-parse residual. A test for each.

  ## Acceptance
  1. Before a conflict-resolution lane publishes a merged tree, it runs a compile check (`cargo check` through `aida lane job`) on that tree and refuses to publish on failure, naming the failing crate. Test: a merged tree that does not compile is not published.
  2. Rework/conflict mail is sent once per PR head, not once per attempt. Test: three attempts on one head send one mail; a new head sends one more.
  3. The BUG-2558 rev-parse residual is named on this spec (file:line and the failing case) and fixed with a regression test.
