    ## Implementer self-review
    Reviewed HEAD: 7ea7f37fcb (round 3, PR #4321).
    AC2 [evidence: behavioral-test]: refusal-delivery lookup now uses mailbox_store::read_all_messages_strict (local + canonical; any read/parse failure is an error). Inbox readers stay tolerant. On a lookup error notify_refusal_with does not send, records RefusalNotice.delivery_unknown in the journal and returns an error naming the PR and head (printed to stderr by report_repair_refusal). The post-send-failure reconcile no longer treats a read error as false (it was unwrap_or(false)).
    Regression: repair_journal::tests::task_3804_malformed_accepted_notice_fails_closed_through_real_mailbox. It writes a real accepted message, adopts it, drops the journal receipt, corrupts the file, asserts the tolerant reader skips it, then shows two retries refuse without sending, delivery_unknown is set and the mailbox still holds one message. All 8 task_3804 tests pass (lane job).
    Probes: fail-open removed from the send-error path. Residual risk: any malformed message anywhere in the mailbox now blocks refusal notices for every PR until it is fixed. This is fail-closed on purpose.
    Gates: cargo fmt, check-store-writers OK. In make check-ci-fast, 'Containment conformance evidence tests' failed because the lane sandbox denies socket creation (PermissionError, environmental). check-ratchets needs a cold compile longer than the 60s tool cap, so I left it to CI.
