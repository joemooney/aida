title: 'Review follow-up: base_patch_equivalents only drops branch commits whose patch-id matches ONE main commit (1'
description: |-
  From BUG-2733
  Reviewed sha: 9e55228e4279bc1eb9672b40ae1065f6e0c93179

  base_patch_equivalents only drops branch commits whose patch-id matches ONE main commit (1-to-1). Real promotions land as a single squash of several constituents (e.g. main a387b7e [promotion 40] combines integration #4588 and #4591), so a promotion built from integration (merge-shaped, the BUG-2733 report) still carries those constituents in base..head with unmatched patch-ids and still inherits their stale supervised specs. AC1's stated patch-id mechanism and test are met, but the linear cherry-pick build remains required in practice; follow-up should resolve constituents via promotion receipts / the squash table instead of patch-ids. Does not depend on base commits since the head.
