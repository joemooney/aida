title: Implementer self-review with the reviewer rubric before push, as a project setting (track B2)
description: |
  Track B2 of the landing-path decision (2026-11-16). Many review rounds catch defects the implementer could have found itself. Before pushing, the implementer lane runs the reviewer's rubric on its own diff and fixes what it finds, which costs one lane turn instead of a review cycle.

  Acceptance:
  1. New project setting, off by default (behaviour unchanged when absent); this project turns it on.
  2. When it is on, the implementer brief and skill tell the agent to run the reviewer rubric (the same text the reviewer receives, single-sourced from the template, not copied) against `git diff origin/main...HEAD` before pushing, and to record the self-review result as a spec comment.
  3. When the lane pushes without that comment, the lane result says so (it does not block).
  4. A template test asserts the implementer brief embeds the reviewer rubric from the single source.
  5. Measured with the landing-metrics command: report rounds per landed PR one week before and one week after enabling.
