- id: 01a20c61-9ceb-7ba2-b408-72234273f5ba
  author: joe
  content: 'INTEGRATION PRE-CHECK (integration-30, 00:12): PR-4498 @ 9bb10185cc PASSES the advisor''s 23:07 follow-up. +178/-28, merges CLEAN, standard tier (watch reporting). AC1: forge::commit_ci_api_read returns a typed WatchAuthenticationFailed (''GitHub CLI authentication failed while reading commit CI; refresh gh credentials'') when gh exits 4 or stderr carries an auth marker (http 401, bad credentials, ''to get started with github cli'', GH_TOKEN, authentication required). main_watch::scan_history propagates only that error (''judged'' is now fallible), so an expired login FAILS the pass (non-zero exit, CronJobFailed fires) instead of reading as Pending; other check errors still judge as before. AC2: the scheduled ''land watch'' runs with ''--format human'' (full error chain on stderr), and record_outcome_local uses watch_failure_error for it: ''exit N: <first Error: line> | <final cause>'', each capped at 240 chars. Tests in story_2897_main_watch_tests and maintenance_schedule_tests. Note: the auth detection is keyed on the existing verify_jobs flag (commit_checks_for(sha, true), forge.rs:3314), so any OTHER verified-checks caller (e.g. a train gate) also gets the clearer auth error. It still fails the same way, so this is benign.'
