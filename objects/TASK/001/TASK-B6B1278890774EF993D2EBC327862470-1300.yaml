title: main_watch reports a gh authentication failure (non-zero, clear cause) instead of Pending; CronJobFailed keeps a compact failed-step + cause summary
description: |
  Follow-up to TASK-3218 / #4491 (advisor-122 ruling 2026-11-23 23:07, overridden to APPROVE; relayed by integration-30; filed by product-15). Both issues pre-date #4491.

  ## Acceptance
  - AC1: main_watch tells a gh AUTHENTICATION failure apart from pending CI. With expired or missing gh auth, red-main-watch currently reads as Pending and exits 0, so CronJobFailed never fires. It must exit NON-ZERO with a clear auth cause. Test with a fake gh that fails auth.
  - AC2: The routed CronJobFailed trip keeps a COMPACT failed-step + cause summary, not just stderr's last line. Test.
