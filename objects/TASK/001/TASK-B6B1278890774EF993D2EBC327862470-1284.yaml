title: 'Review follow-up: aida-cli-lib/src/forge.rs:1907 — The resolver can return a relative executable from PATH ('
description: |-
  From TASK-3852
  Reviewed sha: a2f048d7d0cdfb74977229c352068cb6c35339d8

  aida-cli-lib/src/forge.rs:1907 — The resolver can return a relative executable from PATH (kernel.rs:415–425). It checks that candidate from AIDA's current directory, then the API command sets its cwd to the main worktree. With a relative PATH entry such as ./bin from a linked checkout, the API spawn can miss the checked binary or execute the main checkout's different bin/gh. Make the selected executable absolute before setting current_dir, and cover relative PATH in the linked-worktree fixture. See https://doc.rust-lang.org/std/process/struct.Command.html#method.current_dir
