  content: 'Batch 67 conflict-resolution review: APPROVE — merge 6621a9ab88 correctly combines BUG-1616, BUG-1617 and TASK-1502. (1) collect_event_records (history.rs:606-624) calls resolve_history_window(opts, Utc::now(), &Local), then collect_filtered_events(&resolved_opts) as a 3-tuple, and returns (records, window_exhausted). Callers are consistent: mcp.rs:2568 and status_cmd.rs:1085 destructure a 2-tuple, and every collect_filtered_events call site (history.rs:383, 493, 564, and the tests) uses 3-tuple arity. run() resolves once (history.rs:362-364), and digest, progress and events all use the resolved opts. (2) The tests are the exact union of the three branches plus main: 38 #[test] fns, no losses and no duplicates. The union includes history_reports_delete_and_add_that_git_pairs_as_rename, all 10 resolve_history_window/format_resolved_window tests, relative_since_bounds_the_actual_git_log_walk (updated to 3-tuple), and the 8 window_exhausted tests. (3) --no-renames is present at history.rs:706 (event walk), history.rs:982 (build_digest_rows) and lib.rs:72364 (print_pull_summary). (4) resolve_history_window builds resolved via opts.clone() (history.rs:250), so max_commits_explicit survives the rebind, and window_exhausted_notice_text still gates on it (history.rs:465). (5) docs/cli/08-reporting.md keeps the --max-commits default sentence, the --since/--until bullet, and one Gotchas paragraph with both the window-exhausted text and the Window-line sentence, with no duplication. f8bcb4fef0 does not touch these files. cargo test -p aida-cli-lib --lib history: 57 passed, 0 failed (incl. mcp tool_history_json_carries_window_exhausted_field).'
