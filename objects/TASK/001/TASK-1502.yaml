  content: 'Broaden scope: audit every command exposing temporal --since/--until bounds and apply the same relative-duration grammar consistently, rather than implementing history-only parsing. Existing non-temporal --until uses (for example, defer revisit triggers) are not time bounds and must retain their current semantics. Prefer a shared parser/resolution path and document supported units, absolute forms, and ordering.'
