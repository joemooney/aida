- id: 01a0d7ed-7c7d-77c0-ba5d-c7fc8a5fa67c
  author: joe
  content: 'PROXY DECISION (orchestrator for Joe), recorded late because it was earlier only in the dispatch brief. A bare ISO date means LOCAL midnight, via the local zone. Rework per the review: (1) Resolve bare dates and zone-less datetimes against chrono::Local (make the parser generic over TimeZone; tests use FixedOffset). The zone shown must be the resolved instant''s own offset. Add a DST test. The ambiguous/nonexistent error must be reachable. (2) Keep the old absolute forms: zone-less ISO datetimes (''2026-05-01T10:00'', ''2026-05-01 10:00'') are read as local time. For MCP/help backward compatibility, also accept ''<N> <unit>(s) ago'' phrases (minute/hour/day/week). (3) Correct the docs: do not claim git parity. Say plainly that a bare date means local midnight. Fix the test comment at history.rs:2134. (4) Fix the nits: the doc placement, and the help text for proxy approvals, status --activity and review classes should list w and ISO dates. (5) Moving digest, calibration/assess and tail onto the shared parser is a follow-up, filed separately, not part of this slice.'
