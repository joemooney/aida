title: Support relative durations for aida history time bounds
description: Allow aida history --since and --until to accept compact relative durations such as 5h and 7d, interpreted relative to the current time. For example, --since 7d --until 5h selects history from seven days ago through five hours ago. Preserve existing absolute date/time forms, validate units and ordering, and show the resolved time window in verbose or human-readable output so the interpretation is unambiguous.
