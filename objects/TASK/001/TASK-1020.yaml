    ADVISOR REVIEW FLAG — DECISION vs IMPLEMENTATION DISCREPANCY (2026-07-16, PR-1420, for operator confirmation):
    The recorded guided decision was 'autopilot as a HIGHER TIER — a 4th AutonomyMode variant that BOTH auto-disposes AND suppresses pauses' (couples authority+pauses onto one axis). But PR-1420 (implemented in the operator-steered session) instead made autopilot a GROOMING-STAGE AUTHORITY POSTURE that is ORTHOGONAL to the pause ladder — 'the three-mode ladder (--zen/--no-human/default) governs pauses' stays separate; autopilot only governs disposition authority via effective_envelope (base + [autopilot] overrides + a demote-only solo invariant), and deliberately does NOT wire groom --autopilot auto-execution.

    ADVISOR ASSESSMENT: the orthogonal implementation is SOUNDER than the recorded decision. Autopilot is a grooming-stage concern; pauses are drive-stage — coupling them (the higher-tier option) is operationally incoherent and re-opens the mode-vs-posture question ADR-10 separated. This is the orthogonal option originally recommended. Well-built + tested. Let it stand; RECONCILE the record: the effective decision is ORTHOGONAL POSTURE, not higher-tier. Operator: confirm in the morning.
