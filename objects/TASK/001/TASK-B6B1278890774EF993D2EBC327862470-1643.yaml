description: |-
  From TASK-3960
  Reviewed sha: d27e23fa707754ff014d117cfbbb418e4e8ed09e

  docs/showcase/getting-started.html (generated by docs/showcase/build.py) renders a broken fragment as a visible paragraph: `<p>     tests/test_getting_started_commands.py. Keep them working as written. --&gt;</p>`. The source docs/getting-started.md adds a two-line HTML comment, and build.py (line ~189) skips only lines that start with `<!--`, so the continuation line leaks into the public page. Fix: make the doc-test note a single-line comment (or teach build.py to skip multi-line comments) and regenerate.
