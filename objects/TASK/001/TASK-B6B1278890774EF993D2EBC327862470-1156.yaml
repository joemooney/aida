title: 'BUG-2703 follow-up: drain/yield hardening (yield is not degradation, clock-bounded drain, invalid-UTF-8 intents)'
description: |
  Follow-up hardening for BUG-2703 (admission yield and drain), filed by advisor ruling after round 4 (cap):
  - review_watch.rs:2900: an intentional drain or writer-preference yield is recorded separately from a discovery error; next_pass_report and pass_degradation do not mark the worker degraded or count a refused change.
  - admission_drain.rs:226: a drain's effective expiry is bounded relative to OBSERVATION time (a backward clock step cannot extend it past the documented maximum).
  - admission_owner.rs:740: an intent file with invalid UTF-8 (bounded, regular) follows the same stale-record policy as other malformed intents; it never blocks admission indefinitely.
  Each with a regression. Claude lane, standard review.
