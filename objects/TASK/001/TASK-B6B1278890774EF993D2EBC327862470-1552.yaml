title: 'Review follow-up: remote_create.rs reconcile_pass: `unreachable = push_failures.len()` counts every non-race'
description: |-
  From BUG-2759
  Reviewed sha: 93f4e52f10c22eb3ff71fcc5fdb77190347a6310

  remote_create.rs reconcile_pass: `unreachable = push_failures.len()` counts every non-race push failure (Unreachable, but also ProtectedRef, PermissionDenied, RemoteDeclined, Other), so a protected or declined hub still gets the 'once they are reachable' advice, even though the comment says only an unreachable hub warrants it. Fix: count only PushFailure::Unreachable plus Err transport failures. Wording only: the cause text is still correct.
