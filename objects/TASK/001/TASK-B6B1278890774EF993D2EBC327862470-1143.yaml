title: 'Review follow-up: Yielded settlement snapshots keys before prune acquires admission.lock and reloads state. '
description: |-
  From BUG-2703
  Reviewed sha: d0d953c3461a95653bc8dc20f6cb44f9abf978cf

  Yielded settlement snapshots keys before prune acquires admission.lock and reloads state. Another watcher already in a pass can reserve a new change between those reads. prune treats that new key as closed and can discard the unclaimed local reservation before dispatch. Reconcile lost dispatchers under the lock without filtering on an older key set.
