title: 'Review follow-up: .github/workflows/ci.yml ''Test time budget'' on dell1: the host-prepared tree has one commi'
description: |-
  From STORY-2695
  Reviewed sha: 1a5f69f0aeaa47e7162649b5cacf05b59d781ed5

  .github/workflows/ci.yml 'Test time budget' on dell1: the host-prepared tree has one commit and no origin remote, so `git fetch --no-tags --deepen=1 origin ...` fails and every test is held to its strict limit (docs/internal/testing/dell1-runner.md 'Always full' records this as a rollback trigger). That drops the BUG-2414 untouched-test tolerance on the host where load varies most (two concurrent slots sharing the machine with build lanes), so a near-limit test no train member edited can turn a train red. Follow-up: give the dell1 job a changed-file list, for example by having the controller prepare the parent commit or write the list, so untouched tests keep the tolerance.
