- id: 01a1a485-126e-73f0-b9e1-92c923eaa8d3
  author: joe
  content: |-
    ## Implementer approach

    New report-only doctor category `stranded-commits` (module `aida-cli-lib/src/stranded_commits.rs`), wired into `doctor_multi_agent` off the hot `collect_doctor_findings` path. Per `git worktree list` record (linked worktrees and the main checkout; contained seat clones skipped — host git never runs there):
    1. **Unpushed branch**: `rev-list --count <branch> --not --remotes`; reported with ahead count, tip sha, age, `git -C <wt> push -u origin <branch>` recovery. Skipped when the branch spec is terminal (Completed/Rejected/Superseded) or the content is already landed on the default branch (`branch_content_fully_landed`, run only for survivors) — otherwise every squash-merged branch whose remote was deleted would false-positive.
    2. **Dangling reflog commits**: read the worktree HEAD reflog + current-branch reflog (bounded entry count), keep entries whose subject names a SPEC-ID, then one `rev-list <cands> --not --all` (all refs + every worktree HEAD) to find the unreachable ones. Drop terminal specs and commits whose subject matches a reachable commit since the oldest candidate (rebase / squash rewrites). Grouped per (worktree, spec): newest sha, count, age, recovery `git branch recovered/<spec> <sha>`. `--heal` pins (creates `recovered/<spec>` branch, never overwrites, never deletes).

    ### Acceptance criteria as tests
    - **Unit (git fixture):** committed-but-unpushed branch in a linked worktree → finding with ahead count.
    - **Unit (git fixture):** branch reset past a `(TASK-N)` commit → finding naming the dangling sha and the `recovered/task-n` pin command; heal creates the pin branch.
    - **Unit (git fixture):** clean worktree (pushed, no dangling) → no findings; rebased-away commit whose rewrite is reachable → no finding.
    - **No automated latency test:** budget kept by design — reflogs only, bounded entry count, one batched reachability call; no fsck.

    ### Expected files
    - `aida-cli-lib/src/stranded_commits.rs` (new)
    - `aida-cli-lib/src/lib.rs` (mod)
    - `aida-cli-lib/src/doctor_cmd.rs` (wire scan + heal route)
    - `aida-cli-lib/src/doctor_root.rs` (category aliases)

    ### Ambiguities / conflicts as questions
    - Acceptance mentions an opt-in fsck mode; adding a new doctor flag changes the CLI surface. Shipping reflog-only and filing the fsck flag as a follow-up — OK?
