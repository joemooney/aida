title: 'Pre-push gate misses test-compile breakage from main drift: add a cheap ''cargo test --no-run'' tier to the gate fixers run after merging main'
description: 'Observed 2026-10-14: #2641 and #2645 both passed make check-ci-fast after merging main, then went red in CI with E0063 (a new AgentLaunchConfig.contained field from #2640 was missing in test initializers). check-ci-fast deliberately builds nothing. Proposal: a ''make check-ci-compile'' (cargo test --workspace --no-run with the agent profile and sccache) that agent fixers run after any main merge, or check-ci-fast running it when the merge touched struct definitions.'
