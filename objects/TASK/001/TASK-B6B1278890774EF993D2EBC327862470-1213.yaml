title: 'Mass-change deferred findings from PR #4387 (TASK-3133) final round'
description: |
  Deferred under MASS-CHANGE mode (advisor-122 ruling 2026-11-22 12:15 MST) from the PR #4387 (TASK-3133) Changes Requested verdict at aa380d29b2. These findings were blocking (unmet claimed AC / below-tier) and now defer; #4387 fixes only p1, data loss and security findings in its final round.

  ## Findings to address
  1. [major/mutation-kill] aida-cli-lib/src/tests/bug_2169_contained_clone_bwrap_tests.rs The new regression at line 517 can pass if the previous fixture_tempdir is restored. In a normal build outside /tmp or a named seat, the old helper chooses the target relative to the compile-time CARGO_MANIFEST_DIR. Relocating the executable, cwd and TMPDIR leaves that path unchanged. Assert that the actual fixture root is a direct child of the designated private-fixture base under /tmp, or exercise the old target-selection input with a controlled workspace whose target resolves under target/worktrees. Verify that restoring the previous helper fails on an ordinary checkout.
  2. [major/untested-path] aida-cli-lib/src/tests/bug_2169_contained_clone_bwrap_tests.rs Making fixture_tempdir always use /tmp also moves the TASK-2712 live Codex denial test there on primary hosts. Its existing preflight explicitly skips when Codex grants writes to an unlisted sibling under /tmp (and fails when live coverage is required). A host that previously exercised the denial assertions outside /tmp can now lose that coverage solely because of fixture placement. Give that live test a fixture location outside both the ambient temporary write grant and target/worktrees.

  ## Acceptance
  - AC1: Each finding above is fixed with a regression test that fails before the fix, or explicitly closed with advisor sign-off as not applicable to the landed code.
