  content: |-
    SKETCH (implementer, 2026-09-27) — per-wave resource limits, scope-limited to CONSTRAINING the systemd-run wave unit.

    Shape:
    1. schedule_driver.rs gains a pure WaveLimits { memory_high, memory_max, cpu_weight, io_weight, tasks_max } plus a pure builder/validator over the raw TOML values. build_wave_unit_argv appends -p MemoryHigh= -p MemoryMax= -p CPUWeight= -p IOWeight= -p TasksMax= next to the existing RuntimeMaxSec/OOMPolicy=stop. No new flag class: still no timer flag, no Restart=, no --scope; the TASK-1510 argv allowlist test is extended with exactly these five properties.
    2. Config: [shift] wave_memory_high (default 40%), wave_memory_max (50%), wave_cpu_weight (50), wave_io_weight (50), wave_tasks_max. Committed config or local layer, same get() precedence as every other tunable.
    3. Guard: a wave_limits_error, exactly like max_runtime_error — a value that does not parse, a weight out of systemd's 1..=10000, or memory_high above memory_max refuses the launch on BOTH launch paths (fail closed on configuration, never silently unlimited).
    4. Doctor: a pure classifier over the user manager's cgroup.controllers (located from /proc/self/cgroup's user@UID.service ancestor) plus a report-only finding when the memory controller is not delegated. Warn only; the wave still launches (fail open on delegation), and nothing forces the detached fallback.
    5. Not in scope and not touched: enabling, scheduling or starting any unattended run, who may dispatch, the tick unit files (A12 keeps them limit-free), and the cron driver.

    Evidence on the incident machine (70 GB): 40%/50% resolve to 28.2 GiB / 35.3 GiB, so the reclaim throttle engages below the 30 GB the 2026-09-25 runaway reached and the hard kill stays inside the wave's own cgroup. A trivial transient probe unit confirms the five properties are accepted and that IOWeight with the io controller NOT delegated does not fail the start, which is the fail-open evidence.
