title: Per-wave resource limits for systemd-run drain waves (MemoryHigh/MemoryMax, CPU/IO weights, TasksMax, delegation doctor warning)
description: 'Split from TASK-1510 by advisor amendment A8. After TASK-1510 runs each drain wave in its own transient unit, add resource limits so an out-of-memory wave kills only itself (the 2026-09-25 oomd terminal-kill class). Scope: MemoryHigh/MemoryMax (advisor defaults 40%/50% of total memory), lower CPU/IO weights, TasksMax, wave_memory_* config keys, a wave-limits guard, and a doctor warning when the user manager lacks memory-controller delegation (warn only, never force a fallback). Needs its own SKETCH plus ADVISOR SIGNOFF. blocked-by TASK-1510.'
