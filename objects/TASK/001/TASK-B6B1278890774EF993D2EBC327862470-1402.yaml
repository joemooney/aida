title: 'Review follow-up: aida-cli-lib/src/review_watch.rs:3724–3738, 3760–3764: A successful FULL request writes a '
description: |-
  From TASK-3877
  Reviewed sha: dfdc2a82a951731a9174a3f8020e7d7a3b721ad7

  aida-cli-lib/src/review_watch.rs:3724–3738, 3760–3764: A successful FULL request writes a receipt containing only the head SHA. After a same-SHA retarget, that receipt short-circuits before the new base reaches the FAST ownership check. If the retargeted PR has completed FAST and still needs FULL, the old target's receipt suppresses the new request indefinitely. Include the base in the receipt identity, define how SHA-only receipts are handled, and test a completed request followed by a same-head retarget with its own settled FAST.
