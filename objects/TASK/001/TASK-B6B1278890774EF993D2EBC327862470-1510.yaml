title: 'Review follow-up: TASK-3917 follow-up: the 10-minute refusal cache (advisor_loop_train.rs Refusals/REJUDGE) '
description: |-
  From TASK-3917
  Reviewed sha: 02ed97be57e00b936cfb972411934302f69ce733

  TASK-3917 follow-up: the 10-minute refusal cache (advisor_loop_train.rs Refusals/REJUDGE) is keyed only by (PR, head). State that changes without a head move is not seen for up to 10 minutes: an approval being recorded, CI turning green, a train ending, or a rider's train being abandoned. AutomaticPrescan (and with it abandoned-train detection) loads only when some uncached change needs judging, so riders of a dead train can wait out the whole window. The delay is bounded and the implementer flagged it, but it adds latency on the landing path. Fix: invalidate the cache when a verdict-ledger, approval or train-journal change is seen, or shorten the window for approval and train refusals.
