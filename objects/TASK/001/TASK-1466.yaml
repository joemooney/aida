title: Rename AIDA product report intake to aida feedback
description: Rename the AIDA-product feedback composer currently exposed as `aida report bug|idea|--recheck` to the clearer `aida feedback bug|idea|--recheck` surface. Preserve the semantic distinction between `aida feedback` for issues/ideas about AIDA itself, `aida idea` for the current project, and `aida add --type bug` for bugs in the current project. Keep `aida report` as a documented compatibility alias during migration, preserve paste-ready output, local upstream:aida filing, --copy, --no-file, and recheck behavior, and make help text explain the distinction.
