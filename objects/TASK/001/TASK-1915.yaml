description: 'Non-blocking findings from the PR #2725 STRICT round-2 review, deferred by advisor ruling 2026-10-18 07:45. Only F1, F2, F9 and F10 are fixed in the scoped round 3. F3 audit gaps: ledger a MandateDriveAction for rework-hold releases under a mandate (rework_hold_release.rs:229-233), for mandate-released ships whose gh pr merge fails (pr_cmd.rs:3177/3202/3255-3266), and for the third gap the review lists. F4: narrow the dead-lease expiry step to lease release only, or ledger everything reap_quiet does (worktree teardown, branch deletion, GC), including skipped or failed reaps; remove the unreachable Err arm (mandate_drive.rs:829-834). F5: emit_due must write the event and the mail atomically, or dedup on the key at read. F6: on a corrupt or unreadable mandate-drive-state.json, fail closed (refuse and ledger, don''t reset to defaults); handle save_state errors on the mismatch path (:783); set mismatch_notified only after the notice succeeds (:760). F7: dedup skip rows per (key, reason). F8: key the unowned-spec dispatch head on a dispatch epoch, so a dead fixer gets re-routed; count queue- and drain-claimed specs as owned (:1376, :1446). Parent: STORY-1700.'
