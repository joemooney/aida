title: 'STORY-1853 slice S6: CI job fan-out (parallel test shards + gates jobs, aggregate ''Build (ubuntu-latest)'' check)'
description: 'Per the advisor ruling on STORY-1853 (2026-10-19 08:30), split ci.yml''s build job into parallel jobs that share the rust-cache key: (a) the aida_cli_lib unit tests; (b) and (c) the aida-cli integration binaries in two deterministic halves; (d) the remaining crates plus doc tests; (e) the non-test gates. An aggregate job named ''Build (ubuntu-latest)'' needs all of them, so branch protection and merge-hold-gate are unchanged. AC: (1) PR CI wall time is 12 min or less (today 35). (2) The passed+ignored test count is at least main''s, with both counts recorded in the PR. (3) The required check name is unchanged and merge-hold-gate still passes. Owner: codex-impl.'
