  author: joe
  content: 'Advisor 14:10, include in the ci.yml rewrite: the trace-gate step''s guard `git -C .aida-store rev-parse --is-inside-work-tree` is TRUE for a plain directory inside the main checkout, so a stray .aida-store dir makes it run `reset --hard origin/aida-store` on the MAIN checkout (seen on PR-2760, run 39309026167). Compare `git -C .aida-store rev-parse --show-toplevel` against "$PWD/.aida-store" (or check for .aida-store/.git as a gitfile); otherwise fail with the ::error:: message. Also fail any test shard that leaves untracked files at the repo root.'
