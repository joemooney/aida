  aida-cli-lib/src/review_commands.rs:3519 — Announcement deduplication checks mark.exists() after releasing the ledger locks and writes the mark after emitting. A second identical recorder can see the event already standing and the mark still absent, so both announce it. A crash between emit and mark gives the same duplicate on retry. The simultaneous-approval fixture finishes the inner command before the outer append and misses this interval. Deduplicate by the appended act identity at the announcement sink.
