  content: |
    Pinned source inspection at PR #4378 head 4602d292b515. The exclusive lock now serializes concurrent recorders, and a failed emit leaves a pending mark for retry. The after-append window remains: announce_review_once in aida-cli-lib/src/review_commands.rs runs emit() and then separately writes announced_at. If the event was appended successfully but that mark write fails, or the process stops between them, the next call sees a pending mark and appends again. The events.rs sink used here appends each accepted call and does not reconcile a stable recorded-act identity. The pending-mark test injects an emit failure before a successful append, and the concurrent-recorder test lets the first recorder complete its mark. Add a regression at the successful-append/failed-mark boundary. Require evidence for one delivered event on retry while preserving retry after a failed append. This is evidence for the round-5 exactly-once item, and the existing merge hold remains in force.
