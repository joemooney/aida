title: 'Review follow-up: The scoped timeout does not reach the initial Git common-directory lookup performed by the'
description: |-
  From TASK-3115
  Reviewed sha: 4848978e584a8a68c3ba90a2760c2b471629f5e4

  The scoped timeout does not reach the initial Git common-directory lookup performed by the mandate store's host_git_command builder. On a cold lookup, aida-core/src/git_ops.rs:579–602 synchronously runs rev-parse through Command::output before the new deadline-aware runner gets a command. If that lookup stalls, the report can still overrun --timeout. Include command construction in the scoped budget and exercise cold store discovery in the timeout fixture.
