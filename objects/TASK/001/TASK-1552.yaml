title: 'Pre-flight retraction follow-ups: unheld NotOurs rework rounds, stale Rework hold on AlreadyRetracted, and three test gaps'
description: |
  Three non-blocking findings from the strict independent review of TASK-1529 (2026-09-27), grouped because they sit in the same code path.

  1. `NotOurs` leaves a guards-failing PR published with no hold and no marker (lib.rs:102995-103007) — prose only, which is the state TASK-1289 and TASK-1529 set out to remove. Under the branch-keyed ownership rule this is the COMMON case, not an edge case: on rework round 2, round 1's PR is still open on the branch, so round 2's refusal goes unenforced.
  2. `AlreadyRetracted` never clears a previous failed retraction's Rework hold and never performs the Done to InProgress return. A close that succeeded but whose status read failed therefore leaves the spec Done, with a closed PR and a stale hold.
  3. Test gaps: nothing covers the merged race, the unreadable-forge path, or a spec-search-resolved target. Separately, the tempdir fixtures have no store, so `return_spec_to_implementer_after_retraction` no-ops and the Done to InProgress return is only covered by the pure flip test.

  Acceptance: each of the three is fixed or explicitly declined with a reason, and each fix carries a fixture test that fails without it.
