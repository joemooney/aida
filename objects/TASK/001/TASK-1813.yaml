title: Sibling verdict publication hard_link window trips the nlink!=1 reader refusal
description: |
  phase_gates.rs:508-509 (sibling_verdict_sweep_for_phase3) publishes evidence with std::fs::hard_link(temp, dest) and then remove_file(temp). Between the two calls dest has st_nlink=2, and TASK-1801's anchored reader refuses any verdict with nlink != 1. A concurrent publisher's collision read (:513) or a concurrent phase-4/ship read in that window fails spuriously with NoVerdict. It fails closed, but it is a real race the new rule introduced. Fix: publish with renameat2(RENAME_NOREPLACE), or retry the collision read once the temp has been unlinked.

  Raised in review of PR-2712: https://github.com/joemooney/aida/pull/2712
