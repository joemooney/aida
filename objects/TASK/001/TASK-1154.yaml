title: Add make build-fast (CARGO_INCREMENTAL=1) for ~43% faster iteration rebuilds
description: 'Measured 2026-07-17: an incremental release rebuild after a one-function edit is 55.7s vs ~98s non-incremental (-43%). The build is codegen-bound (cargo check front-end is only 6.5s; mold link -1s; crate-split ~0). Add a build-fast target that sets CARGO_INCREMENTAL=1 for local iteration. Kept SEPARATE from build-release so the shipped-release path stays pristine (incremental slightly reduces cross-CGU optimization); actual releases build fresh via CI release.yml anyway.'
