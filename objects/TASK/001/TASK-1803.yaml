title: 'No-number pr ship: resolve default branch on non-GitHub forges, clarify unknown refusal, use gh PATH-walk'
description: 'Follow-up from the #2706 TASK-1795 r2 STRICT review (two-round cap; advisor ruled merge-with-follow-up, 2026-10-16). 1) forge.rs:3938 returns unknown for every non-GitHub forge, so a GitLab or pure-git clone without refs/remotes/origin/HEAD refuses every no-number ship on a feature branch, including the first ship that creates the MR. Add a time-limited ''git ls-remote --symref origin HEAD'' probe that works on any forge. 2) The unknown-evidence refusal (pr_cmd.rs:2288-2291) says ''on the default branch; pass a PR number'', which is false on a feature branch. Say the default branch could not be determined and suggest ''git remote set-head origin --auto''. 3) Production resolves bare ''gh'' (forge.rs:3943-3946) instead of the existing PATH-walk fallback. Use the shared resolver. AC: regression tests for a GitLab feature branch without origin/HEAD (ship proceeds via ls-remote), the refusal wording, and a stripped-PATH gh resolution.'
