title: 'Integration test: implementer non-zero exit WITH an open PR proceeds to CI+review (not shelved as tool-exit)'
description: 'Follow-up to BUG-1140/PR #1812. The fix (fall through to substrate resolution on a non-zero implementer exit) has no automated test — the path is subprocess-integration-level. Add a test that stands up a fake implementer which commits+pushes+opens a PR then exits 1, and asserts the phase resolves via PR lookup (proceeds to CI/review) rather than returning a tool-exit PhaseFailure. Guards against a regression re-introducing the exit-code-trusting shelve.'
