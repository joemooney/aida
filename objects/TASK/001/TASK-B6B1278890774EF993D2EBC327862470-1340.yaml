  13. aida-cli-lib/src/review_prepare.rs:430–434,491–503,691–708 — Git inventory relies on UTF-8 decoding of NUL-delimited paths, so a valid non-UTF-8 Git pathname aborts the entire command. UTF-8 names containing line breaks or Markdown delimiters are interpolated into the report and can break its structure. Keep paths lossless through selection and use an escaped, unambiguous representation in the report.
