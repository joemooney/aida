title: 'Review follow-up: Member-induced drift has no hold or ordering change (aida-cli-lib/src/pr_train.rs route_dr'
description: |-
  From BUG-2777
  Reviewed sha: 7f1fa7dfed0edf8dc9313469364795b5f3f05194

  Member-induced drift has no hold or ordering change (aida-cli-lib/src/pr_train.rs route_drift_ejections). The message says the PR is 're-queued for the next train, alone or behind the earlier member', but nothing reorders or isolates it. If the earlier member keeps boarding without landing or being held as a red culprit, overlap::order puts it ahead again, and the PR is re-ejected for member-induced drift every train with no hold and no landing-drought cause. Classification also compares against the train's initial main, so a member landed mid-run costs one extra re-ejection; the implementer listed both as residual risks. Follow-up: record a soft member-induced row, or board the PR alone or first on the next train.
