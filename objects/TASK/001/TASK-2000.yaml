id: 01a158d7-725a-72a0-864f-d475ea392e54
spec_id: TASK-2000
agreed_id: TASK-2000
title: MCP show_requirement linkage is not under the show linkage deadline
description: |
  PR-2772 (BUG-1993) puts the CLI `aida show` surfaces (human, card, json, TOON) under SHOW_LINKAGE_DEADLINE (4 s) via collect_git_linkage_until, but the MCP show_requirement tool (the "mcp x2" callers listed in the PR body) still calls the unbounded collect_git_linkage. It is the same user-facing "show" operation, so on a loaded host an MCP show can still exceed the 5 s ceiling the spec was about, through unbounded resolve_default_branch_ref, worktree list, and an unclipped per-call budget sum. Decide whether MCP show should use collect_git_linkage_until (rendering unknowns the same way) and add a shim test if so.

  Raised in review of PR-2772: https://github.com/joemooney/aida/pull/2772
