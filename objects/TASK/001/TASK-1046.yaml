  content: 'Live probe result (2026-07-07, codex-cli 0.142.3, claude-less validation project): codex exec in a project carrying the scaffolded .codex/config.toml (mcp_servers stanza registering aida mcp-serve) reported MCP-MISSING — the project-local config was NOT merged; the aida MCP tools were not discoverable. The TASK-0424 assumption that codex merges a project .codex/config.toml over the user config does not hold for this codex version (mechanism candidates: project-config support removed/changed, or gated on interactive project-trust that a headless exec never grants). Residual work re-scoped UP: verify current codex config-merge semantics against its docs, and either (a) translate the registration into the USER ~/.codex/config.toml via an explicit opt-in command (never silently mutate user config), or (b) document codex mcp add aida ... as the setup step. Note the mitigation: the token-efficient CLI is the primary agent surface (the codex implementer completed the full lifecycle via CLI alone in this same validation), so MCP absence degrades typed access, not capability.'
