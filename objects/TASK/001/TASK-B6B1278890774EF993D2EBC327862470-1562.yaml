  aida-cli-lib/src/lane_salvage.rs push skips check_staged's seat_trailer_check (ship_from_seat.rs:2533-2572) on the imported range. A salvage onto an open PR branch can therefore add commits with no or unresolvable spec trailers, which normal publication refuses. The impact is limited: the head is announced as unverified and needs a fresh independent review, which would see the commits. Consider running the trailer check (or at least logging its result) before the salvage push.
