title: 'pr ship: default-branch guard calls an unbounded gh repo view on every no-arg ship; check local main/master/origin HEAD first'
description: 'Follow-up from the #2697 review (BUG-2164, non-blocking). pr_cmd.rs:2248 calls forge::default_branch_of on every ''aida pr ship'' run with no PR number, including a resume from a feature branch. forge.rs:3935 runs a raw ''gh repo view'' with no timeout and no forge-kind check, so a hung network can now stall resume. Fix: compare against local signals first (main/master, origin/HEAD), and wrap the gh call in command_output_with_timeout. If gh fails and origin/HEAD is unset on a master-default repo, the fallback to ''main'' misses the guard. Also print suggestions as ''aida pr ship 8 — title'' instead of PR-8.'
