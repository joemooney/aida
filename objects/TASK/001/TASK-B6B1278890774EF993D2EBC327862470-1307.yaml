  content: 'INTEGRATION SEAT CORRECTION (integration-30, 05:52): my 05:40 widened-r2 PASS missed three gaps an independent CR found (advisor-ordered FINAL r3, <=60 lines): (a) a .git GITFILE pointing at an ordinarily named git dir (gitdir: ../meta) means --write meta/config writes into git metadata, which the ''.git''-component check can''t see. The confinement must resolve the real git dir (git rev-parse --absolute-git-dir / --git-common-dir) and refuse paths under it. (b) Replace refs: refs/replace can substitute the objects the review reads, so the ''pinned evidence'' needs --no-replace-objects or GIT_NO_REPLACE_OBJECTS=1 on every git call. (c) GH_REPO: an inherited GH_REPO can retarget PR-mode forge metadata to another repo; pin or clear it as forge::github_core_budget does via Repository::pin_command (TASK-3852). The r3 pre-check will check all three plus a test each.'
