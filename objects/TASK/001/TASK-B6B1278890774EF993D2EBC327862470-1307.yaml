  content: 'INTEGRATION FIDELITY + SECURITY PRE-CHECK (integration-30, 04:05): PR-4511 @ 657d344388 (STORY-3076 S2) PASSES. HOLD the merge until H1 #4510 (TASK-3866) is in integration. Joe-authored; merges CLEAN; +1072. Fidelity vs 0fdac177513: aida-cli-lib/src/{lib.rs, review_cmd.rs, review_cmd_args.rs} patch-id MATCH; review_prepare.rs DIFFERS by the required arg-safety hardening only. EXTRAS: the CLI help golden snapshot, the cli-format-json audit doc row, a ratchet-set group (4 review_prepare tests) and store-writers rows, which is the standard new-command and write-sink inventory. Security: every user ref (--commit/--from/--to/--path, PR base/head) passes git_arg_guard::reject_option_like before git, and rev-parse/merge-base use --end-of-options, so the ''diff ... <range> --'' calls can''t take an option-like range. Git diff runs with -z (unusual paths) and errors propagate (no silent empty inventory). --write is confined: relative-to-root, Normal components only, directories walked via pinned /proc/self/fd with O_NOFOLLOW|O_DIRECTORY, a non-regular destination refused, written via tempfile + rename. Blocking tests present: option_like_endpoints_refuse_before_git (--commit --help, --from -p, --to --stat), write_confines_new_and_existing_paths (.., absolute outside, symlinked dir, symlinked leaf; outside file untouched), git_inventory_and_content_errors_propagate, root_commit_preserves_unusual_git_paths.'
