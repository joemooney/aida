title: TASK-1752 grant-env guard exempts tests/ dirs wholesale, not test helpers by name
description: |
  The TASK-1752 acceptance comment asks the guard to "exempt test helpers explicitly, by name". `rust_files` in aida-cli-lib/src/tests/task_1752_grant_env_guard_tests.rs:40-43 skips every directory named `tests`, and `production_lines` skips every inline `#[cfg(test)] mod … { }` block. That is a structural exemption, not a named list. Nothing escapes today: I checked that no non-cfg(test) `#[path = "…tests/…"]` module exists, and test_env.rs (a cfg(test) helper outside tests/) is still scanned and passes because it uses the GRANT_ENV constant. But a production file that lands under a `tests/` directory, or a `#[path]` module without `#[cfg(test)]`, would be skipped silently. Possible hardening: assert that every file skipped under `tests/` is reached only through a `#[cfg(test)]` `#[path]` declaration, or record the advisor's acceptance of the structural rule on the spec.

  Raised in review of PR-2763: https://github.com/joemooney/aida/pull/2763
