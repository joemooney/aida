  author: joe
  content: 'Rejecting after verifying against code (my filing diagnosis was wrong). extract_spec_ids_from_commit ALREADY handles (#NN) suffixes + multi-id/prose parens (proven by extract_spec_ids_robust_multi_spec_prose_trailer: ''(TASK-800 / STORY-610 slice 1a) (#869)'' -> both ids). STORY-758''s ''(Strategy B, STORY-758)'' was dropped by an INTENTIONAL release-note guard: a paren that LEADS with prose (like ''release: stuff (foo BUG-23)'' -> empty) is ignored to prevent false completions. Loosening it regresses that guard. Impact is one-off: of the 3 non-conforming prose-led-paren commits on main, only STORY-758 was actually stranded (now fixed); STORY-710 + TASK-731 were completed via conforming sibling commits. Root cause is authoring (non-conforming trailer), already covered by the (SPEC-ID) convention + AIDA_COMMIT_STRICT. A detection-only doctor check would be over-engineering for a one-off. No code change warranted.'
