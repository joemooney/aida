    ## Implementer self-review
    Reviewed HEAD: 7ac565fd1c (CI-fix round on PR #4373; scope = the two commits after the merge of main at c2272d72d2, not a re-review of the whole relay diff).

    Root cause of the red fast tier at c3a15b8/c2272d7: not the three items in the CI-fix brief (the classifier doc, shard map and Cargo.toml lines are fixture output from the tooling self-tests; `external-prose-classifiers.py --check` and the shard tooling tests pass on this tree). The real failures were ratchets:
    - story_2326_ambient_aida_inputs_have_a_disposition: AIDA_LANE_RELAY_GATE had no disposition. Now in DROPPED_AIDA_KEYS (operation-local; launch/spawn.rs already strips it from vendor children).
