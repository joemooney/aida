        dangling authoritative brief with an ordinary error.
     P2 Fresh mode is a real routing constraint: the host must not resume an open rework or canonical branch in Fresh mode.
     P2 timeouts use elapsed wall time including host-command duration; never sleep past the remaining deadline.
     P2 coverage of the production boundary: at least one test drives Live/Machine dispatch (spawn and lane_running argv built for real,
        with a stub ssh binary on PATH), not FakeWorld only.
    cargo fmt; check-store-writers.py; ratchets; targeted cargo run; make check-ci-fast. Push.
