title: 'Review follow-up: Rollout hazard (lane_admission.rs:62-64): HostConfig/Settings use deny_unknown_fields, so '
description: |-
  From TASK-3911
  Reviewed sha: dcc174ec7be643fcf34c7170094b967c265431b2

  Rollout hazard (lane_admission.rs:62-64): HostConfig/Settings use deny_unknown_fields, so once the new [lanes] keys are added to /etc/aida/lanes.toml, any older aida binary still running on the host (a launcher or lane runner not yet restarted) refuses every lane launch with 'invalid lane admission settings'. The doc's dell1 instruction (07-project-setup.md) should say to set the keys only after every launcher and runner on the host runs a binary that includes this change.
