  content: '[architecture-signoff] APPROVED. Use project-local gitignored .aida/derived/token-ledger-v1.sqlite with atomic replacement and owner-only permissions. Require exact vendor-session evidence before any project/session/run/spec/seat attribution; timestamps may only narrow an exact join. Retain only allow-listed numeric vendor usage fields and content-free identifiers/provenance—never prompts, responses, tool arguments, environment, or credentials. Phase means evidenced orchestration lifecycle phase; explicit rework is assigned only from a retained rework launch/lease, and round is independent/nullable with a reason when absent or ambiguous. Keep pricing, billing reconciliation, Antigravity without a proven schema, drain_summary changes (BUG-1418), and new orchestrator persistence out of scope. If retained evidence cannot prove a dimension, emit null plus reason and file a follow-up rather than expanding scope. Proceed with implementation and the complete fixture/idempotence/query test plan.'
