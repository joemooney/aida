title: Store-lock holder diagnostics across PID namespaces, with a fallback for unreadable cmdline (deferred from BUG-2740)
description: |
  Deferred from the BUG-2740 / #4481 r2 review (advisor-122 ruling 2026-11-23 21:10; filed by product-15). BUG-2740 AC2 makes store-lock timeouts name the holder PID + command when visible. Two gaps were deferred.

  ## Acceptance
  - AC1: Holder diagnostics work across PID namespaces (a lock holder inside a lane sandbox/bwrap is named correctly from the host and vice versa), or explicitly say "holder in another PID namespace: <ns id>".
  - AC2: When the holder's /proc/<pid>/cmdline can't be read, fall back to the comm/exe name, or "holder unavailable" with the PID. Tests for both.
