  BUG-2772 AC1's second clause (a pin protecting a commit on no remote is refused with the salvage hint) and AC3's matching unique-commit refusal test are not implemented: the advisor's authoritative brief on the spec (comment 0) superseded the remote-reachability rule with a no-clone + no-lease predicate, and the implementer flagged the divergence (comments 1-2). In practice no data is at risk: a seat pin only ever names the base commit the clone borrowed via alternates, resolved from main's own refs, so once the clone directory is gone the pin protects nothing. Follow-up: amend BUG-2772's AC text to match the brief, or add the unique-commit guard if the advisor still wants it.
