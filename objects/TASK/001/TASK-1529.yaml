- id: 01a0e74b-0253-7ea3-bb8e-4445cbcfbcd0
  author: joe
  content: 'Architecture sketch: the current post-publication preflight path resolves an open PR by branch, so branch equality alone can mistake a same-branch operator PR for the implementer''s publication. Add optional author login to forge ChangeMetadata (GitHub author.login, GitLab author.username), expose the authenticated forge account from each CLI (gh api user / glab api user), and close only when both lookups succeed, the change is open, and the identities match case-insensitively. Missing/error identity data fails closed. The driver fake will cover matching identity, different author, unknown author, and merged state; parser fixtures cover GitHub and GitLab author extraction. This adds a Forge trait operation and extends the metadata contract.'
