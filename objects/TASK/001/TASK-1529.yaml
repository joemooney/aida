title: 'Pre-flight guard: retract the published PR when the post-publication pre-flight guard fails'
description: 'Implements the operator''s decision on TASK-1289 (option B, retract on failure; recorded 2026-09-26). TASK-1289 completed with the boundary still advisory. Acceptance: 1. When the pre-flight guard fails after an agent-opened PR is accepted, AIDA converts the PR to draft (or closes it) and comments the failing guard output; the spec returns to in-progress for the same implementer. 2. A passing guard leaves the PR untouched. 3. The retraction is idempotent and never touches a PR the agent did not open. 4. Tests with a fake forge cover fail, pass and not-ours cases.'
