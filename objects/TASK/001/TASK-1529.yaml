  content: 'DRAFT (uncompiled) on claude/task-1529 @ 28da0ad9e1: implements ADR-51 retract-after with the two advisor additions from TASK-1289. New aida-cli-lib/src/preflight_retraction.rs: decide_target (only a PR that was NOT open on the branch before the implementer launched is the agent''s to retract; same number = NotOurs), verify_closed (only an observed Closed counts; Open/Merged/unreadable = failure), RetractionOutcome, and a durable marker .aida/preflight-retractions/PR-<n>.json (state retracted|retraction-failed, spec, branch, guard detail, error, attempts). RealPhaseDriver: new preexisting_phase1_pr recorded in run_implementer via project_forge().change_for_branch before spawning; retract_refused_publication now returns RetractionOutcome — skips NotOurs/AlreadyMerged/already-closed (idempotent), closes with the guard note, re-reads change_status to VERIFY, writes the marker, and on failure also places a typed Rework merge-hold (merge_hold::typed_hold + write_typed_hold) so no AIDA merge path takes the still-open PR; on verified success returns the spec Done→InProgress for the same implementer (retraction_in_progress_flip under new aida_core::conflict::PREFLIGHT_RETRACT_AUTHOR, lease untouched). New refused_preflight_failure builds the PhaseFailure whose text names the outcome distinctly (retracted / already closed / STILL OPEN retraction failed / left untouched). RecordingForge gained scripted state, close_error, close_takes_effect and a comments log. Tests (forge_seam_tests, fake forge, tempdir): closes+verifies+records (fail case), passing guards touch nothing (pass), pre-existing PR never closed while a new PR on the same branch is (not-ours), close-ok-but-still-open and close-error both yield a failed retraction with marker + merge-hold, idempotent second run, and the pure Done→InProgress flip; module unit tests for decide_target/verify_closed/marker attempts. Decisions to confirm: close rather than convert-to-draft (the Forge trait has no draft conversion; close_change already posts the guard output); ''not ours'' is defined by a branch-keyed pre-launch snapshot, not PR author; a failed retraction places a Rework-kind merge-hold. Left: aida human / status --awaiting do not yet surface the marker (the merge-hold surfaces). Compile risks: forge Box<dyn Forge> borrowed across close+status calls in retract_refused_publication, ChangeState import in the test module, HoldReasonKind::Rework path/visibility, and the hook''s cargo fmt already reformatted the files.'
