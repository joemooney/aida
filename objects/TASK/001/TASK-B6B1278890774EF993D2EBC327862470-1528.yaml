title: 'Review follow-up: run_review_agent hard-errors when [agents] vendor names a vendor with no review runner (e.'
description: |-
  From BUG-2775
  Reviewed sha: 46793d2c72c82cc39b20ba2ae9a81b17ebc8cd17

  run_review_agent hard-errors when [agents] vendor names a vendor with no review runner (e.g. agy): `agy has no review runner; use claude or codex`, so a project whose default lane vendor is agy cannot use --run-review without --agent. The error is explicit (an improvement over the previous hidden refusal), but a fallback to DEFAULT_REVIEW_VENDOR with the stated reason, or naming --agent in the error, would be friendlier. aida-cli-lib/src/review_prepare.rs run_review_agent.
