title: 'Review follow-up: The parallel finder in `review_batches` (aida-cli-lib/src/review_prepare.rs) runs up to 4 '
description: |-
  From STORY-3120
  Reviewed sha: 9082645444672a4f7a21f619a8259089de36e018

  The parallel finder in `review_batches` (aida-cli-lib/src/review_prepare.rs) runs up to 4 runner calls at once. Each call still carries its own 15-minute RUN_DEADLINE and its own STDOUT_CAP/STDERR_CAP buffers, so peak memory is 4x the caps and there is no single global deadline. The S8e scope text asked for 'one global deadline; caps not multiplied'. Wall time is no worse than before, so this is a resource-bound refinement.
