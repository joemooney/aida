    INTEGRATION PRE-CHECK PR-4561 r2 @ 47ed765135 (integration-30): PASS. merge-tree is clean vs integration b911ef916bb. The branch is based on afbea08b75a, so a raw diff vs integration shows TASK-3877 reversed; that is an artifact, and the 3-way merge keeps it.
    F1: canonical_module_stem keys a trailing tests/ or test/ directory as its parent (path-component match, not a substring), so src/tests/foo_tests.rs pairs with src/foo.rs. A repo-root tests/<x> joins src/<x> only when that key exists. The ORIGINAL tests/parser_test.rs case is restored and still pairs into module:src/parser, and a direct src/foo ↔ src/tests/foo_tests assertion was added.
