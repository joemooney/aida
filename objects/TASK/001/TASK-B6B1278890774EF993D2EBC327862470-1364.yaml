    F3: criterion traces (AC1/AC2) on the new tests.
    F4: the guide now describes directory-qualified stems and the tests/ rule.
    NIT (not blocking): crate-level <crate>/tests/foo.rs keys as <crate>/foo, which doesn't pair with <crate>/src/foo.rs. The src/ fallback only applies at the repo root. That's fine for this repo, where integration tests are feature-named. READY after FAST plus the independent review.
