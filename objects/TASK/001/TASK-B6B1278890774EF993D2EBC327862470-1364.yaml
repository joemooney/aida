title: 'Review engine H2c: directory-scoped same-stem batching; Rust facets keyed on language, not playbook ID prefix'
description: |
  H2c of the STORY-3076 review engine (deferred from H2b #4525 TASK-3872 AC2; advisor-122 disposition 2026-11-24 10:23; filed by product-15). LOW, small, integration track.

  ## Acceptance
  - AC1: same-stem batching is scoped to the directory/package: files that share a stem in different directories or packages are not batched together. Test.
  - AC2: Rust review facets are keyed on the file's LANGUAGE, not on the playbook ID prefix. Test.
