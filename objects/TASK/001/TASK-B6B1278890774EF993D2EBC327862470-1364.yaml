  content: |-
    INTEGRATION PRE-CHECK PR-4561 H2c @ 1cd44c480f (integration-30): PASS on the ACs, with ONE design finding for an advisor ruling and a doc nit. 3 files, +70/-30. merge-tree is clean vs integration afbea08b75a.
    AC1: canonical_module_stem now returns <dir>/<stem>, with the directory kept case-sensitive. Pairing keys therefore differ across directories. The playbook packer also splits a batch when the same stem reappears from another directory. Test: A/src/file.rs, a/src/file_test.rs and a/tests/file.rs give 3 single-file batches.
    AC2: enrich_with_content_facets takes (path, body) samples, keeps only .rs paths and ignores the playbook ID. Test: a 'custom' playbook with an a.Rs sample gets rust_unsafe_ffi; a 'rust-custom' playbook with only .py samples gets none.
    The ratchet set adds the 2 h2c names.
    FINDING (needs a ruling): AC1 says 'directory/package', but the change scopes by EXACT directory. That drops this repo's own companion layout: aida-cli-lib/src/foo.rs plus aida-cli-lib/src/tests/foo_tests.rs (24 real pairs today, e.g. stalled_reviews.rs / tests/stalled_reviews_tests.rs), and Rust crate-level tests/foo.rs next to src/foo.rs. Those used to pair and now land in separate batches. The test change from tests/parser_test.rs to src/parser_test.rs papers over it. Suggested fix (about 5 lines): treat a trailing tests/ or test/ component as its parent directory when computing the key, so src/tests/foo_tests.rs pairs with src/foo.rs. Different crates stay separate. Add a test.
    DOC NIT: docs/internal/presentation/aida-code-review-engine.md:79-80 still describes 'Crate-Qualified Generic Stems' for lib/mod/main only; all stems are now directory-qualified.
