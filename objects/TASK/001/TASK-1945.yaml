  content: |-
    ADVISOR SIGNOFF 2026-10-19 22:18: the SKETCH (codex, 03:52Z) is APPROVED with 3 conditions. Approved: `aida review watch` in its own review_watch module via command_registry; the bounded poll; reviews dispatch only through the ordinary attested `aida queue work PR-N --role reviewer` path and never synthesize a verdict; the per-PR lock plus versioned atomic state under .aida/review-watch/; the launch reservation persisted before spawn, with a PID/start receipt; at most 2 concurrent reviewers; one notification per head/verdict identity, with a sent receipt only after success; the ship-ready output is REPORT-ONLY and it never merges; anchored verdict readers; refusal on unknown evidence; the acceptance tests (a) to (e) plus concurrency/PID-reuse/cap tests.
    Condition 1 (slicing; one PR each, strict review): S1 = discovery + dispatch + state/locks + stale-overlap author notification. S2 = head-change supersede (the only slice that signals processes: PID+start-identity check, our recorded process group only, reap before re-admit). S3 = the ship-ready report + the advisor wake. Don't put process termination in S1.
    Condition 2 (carry-over): ship-ready must NOT require reviewed_sha == head exactly. Use the same TASK-1960 clean-merge carry-over proof that aida pr ship uses (and the verdict-corpus gate will use once TASK-1968 lands), so a gh pr update-branch doesn't force a re-review. A changed own diff still requires one.
    Condition 3 (stale base): a stale NON-overlapping base can be reviewed and reported as 'ready after update-branch'. Don't auto-run update-branch from the watcher in S1-S3; leave that for a later, separately signed-off step.
