title: 'Review follow-up: AC1 says ''ENOENT on the path AND no mount'', but attest_clone_lease''s pin() (aida-cli-lib/s'
description: |-
  From BUG-2755
  Reviewed sha: f694d9696a374985b149f9ee6227fe59e0e98c8e

  AC1 says 'ENOENT on the path AND no mount', but attest_clone_lease's pin() (aida-cli-lib/src/doctor/worktrees.rs:79-95) only walks to the first existing ancestor and checks that it canonicalizes to itself. It does not detect that the ancestor is an empty mount point whose filesystem is unmounted (e.g. a lane-host NVMe not mounted), and the confirmation warning does not tell the operator the tree was found absent. In that state the operator-attested release ends the lease as 'tree absent, nothing to salvage' while the tree still exists on the unmounted filesystem. No data is deleted, and the release needs a typed-ID human attestation. Follow-up: show 'tree absent' in the prompt, or refuse when the nearest existing ancestor is on a different st_dev than the lease's recorded main/expected filesystem.
