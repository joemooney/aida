title: Find a Codex :workspace config that honours extra writable roots, or replace the TASK-2712 live control
description: |
  From TASK-3133 / PR #4387 evidence (product-15, 2026-11-22; advisor-122 ruling 21:52 "fails on main" branch). The live control in `task_2712_codex_sandbox_live_seat_commit_and_denials` (aida-cli-lib/src/tests/bug_2169_contained_clone_bwrap_tests.rs) FAILS under AIDA_REQUIRE_CODEX_SANDBOX_LIVE=1 at EVERY extra-writable-root location tried: main 5470336db35 on imac (root under target/worktrees), #4387 f41a18b0 on imac and dell1 (/var/tmp), and #4387 58cb2188 on imac and dell1 ($HOME/.cache). Each time: "Codex :workspace denied a configured extra writable root: ... Read-only file system". Codex versions are codex-cli 0.171.0 (imac) and 0.167.0 (dell1). The installed Codex :workspace sandbox ignores the configured extra writable root (--add-dir), so the live control can't pass on any host we have.

  ## Acceptance
  - AC1: Either find a Codex :workspace configuration (flag or config key for the installed versions) that honours an extra writable root, and make the live control pass under REQUIRE on imac and dell1; OR replace the live control with an equivalent check this Codex can satisfy, and document why. Evidence: the required-live command passing on both hosts.
