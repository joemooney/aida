description: |-
  From BUG-2730
  Reviewed sha: 08ee6da5263965a55c163aef2b8cb0a425781f6f

  Deferred follow-up (BUG-2730, p3): on GitHub, discover_rich -> forge::github_open_changes_detailed uses remaining_call_budget and propagates its error with `?` from live_pass_with. If the listing itself outlives the scoped run deadline, the guard exits with an error. It does not report an empty PARTIAL inventory, which is the GitLab discover_with behaviour. This is unlikely, because discovery runs first under a 60s cap within the 220s budget. Fix: treat deadline exhaustion in the rich listing the same way as the GitLab path.
