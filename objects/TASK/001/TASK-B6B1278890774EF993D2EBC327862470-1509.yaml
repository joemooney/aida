title: 'Review follow-up: TASK-3917 follow-up: the read-only pre-scan (AutomaticPrescan::admits, LiveChecks read_onl'
description: |-
  From TASK-3917
  Reviewed sha: 02ed97be57e00b936cfb972411934302f69ce733

  TASK-3917 follow-up: the read-only pre-scan (AutomaticPrescan::admits, LiveChecks read_only=true/request_full=false, pr_train.rs ~5830) refuses a PR whose full-tier CI is Missing or Failed without the side effect the real pass has in full_tier_gate (pr_train.rs ~1818, TASK-3105: request a full-tier run). If every open PR is refused that way, train_wanted returns false, the real pass never runs, and the auto-train never requests or retries the full run. review_watch's promotion pass still makes the first request for approved PRs, but its per-head receipt stops a retry after a flaked full run, so an approved PR can stall until someone relabels it. This was partly true already under BUG-2769's legacy gate. Fix: have the pre-scan count a Missing/Failed full tier on an otherwise-admissible PR as wanted (or perform the request), and add a test.
