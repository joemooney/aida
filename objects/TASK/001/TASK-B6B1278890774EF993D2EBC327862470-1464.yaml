description: |-
  From BUG-2736
  Reviewed sha: dfa658dd96d93a1a377ec8aa8d895e2e3da5de7a

  Deferred (round-1 F3, carried): review_commands.rs passes no PR or head association to leases::shelve_spec_on_failure, so a still-current refusal for an older PR can shelve a Done spec whose Done status came from a different change. The fix is to bind shelving to the change that earned Done. This is outside the advisor's 'do not change WHEN shelving happens' scope.
