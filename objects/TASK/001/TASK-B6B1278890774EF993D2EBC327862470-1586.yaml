  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: TASK-3933 at e53f2b99 (2 commits behind main; none of the findings depend on code main has changed since). The root-cause fix is correct: the contained child env allowlist keeps AIDA_USER and drops USER, and conformance-launch now issues its grant through the shared launch::issue_contained_child, which exports AIDA_USER = grant.subject. The production Codex/wrapper headless path uses the same issuer. Moving the AIDA_USER export ahead of apply_child_agent_identity/assign_seat is safe: nothing in between writes or removes AIDA_USER. prepare_runtime_diagnostic builds the child env from selected_environment, so the AC4 test models the real path. AC1 is verified by task_3933_contained_child_presents_its_grant_subject at the helper level only (the probe emission is untested, see finding 2). AC2 is verified by task_3933_diagnostic_and_production_share_the_contained_issuer plus inspection: agy.rs has no issuance of its own, and headless.rs calls issue_contained_child. AC3 is verified by inspection: grant_check_for and the subject comparison are unchanged, no override was added, and no SubjectMismatch test was weakened. AC4 is verified by task_3933_contained_child_presents_its_grant_subject (Valid with the binding, SubjectMismatch without). Blocking: CI (fast compile) is red at this head in the ''Ratchet set'' step (exit 101). The job log could not be fetched (blob host denied in the sandbox), but source analysis points to story_2539_vendor_literal_ratchet: the PR adds a new HeadlessVendor::Codex comparison inside spawn_vendor_headless_forking, and that ledger may only go down.. No triage reason was given.'
