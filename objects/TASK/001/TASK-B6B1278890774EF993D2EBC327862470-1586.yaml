title: conformance-launch mints the contained child grant through the production issuance path (agy SubjectMismatch)
description: |-
  Advisor aida-d3 ruling 2026-11-27 15:00 (filed by product-15). Joe's agy conformance rerun on dell1 at b90f128 (report dell1:~/.aida/conformance-aida-agy-1795816094/report.json) refused at seat_preflight: `seat_grant_valid=false cause=SubjectMismatch`. All setup stages passed. Production contained claude lanes cross the same boundary daily with a valid delegated child grant, so the boundary and the subject check are correct. The defect is that the hidden diagnostic entry `conformance-launch` does not mint/bind the contained child grant the way production does (likely binding the fixture launcher's subject, or a pid-namespace-relative identity, instead of the contained child's).

  ## Acceptance
  - AC1: the SubjectMismatch diagnostic names BOTH subjects (expected vs presented: kind + redacted ids, no secrets).
  - AC2: conformance-launch reuses the PRODUCTION contained child-grant issuance path verbatim (one shared function); any duplicated issuance in the diagnostic entry is deleted.
  - AC3: SubjectMismatch and the subject check are NEVER relaxed.
  - AC4: a test proves conformance-launch's grant subject equals what a production contained launch presents.
