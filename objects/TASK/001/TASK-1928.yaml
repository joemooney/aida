title: MCP mailbox send does not canonicalize a known recipient to its stored spelling (CLI does)
description: |
  aida-cli-lib/src/mcp.rs:2747-2753 trims `to` but stores it verbatim, while the CLI path (mailbox_cmd.rs:146-155) maps a known identity to its stored spelling via known_mailbox_recipients. Message::addressed_to (aida-core/src/mailbox.rs:506) is case-sensitive, so MCP `to: "ADVISOR"` opens a phantom ADVISOR inbox that `aida mailbox gc --phantoms` also does not clean (not a mention body, not a rejected shape).
  Raised in review of PR-2737: https://github.com/joemooney/aida/pull/2737
