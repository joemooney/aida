title: 'Review follow-up: already_on_base excludes every fork point (`main ^stop1 ^stop2 ...`), so the base window s'
description: |-
  From BUG-2733
  Reviewed sha: efe42749706c6242f8d43f7d112fd8b05003df13

  already_on_base excludes every fork point (`main ^stop1 ^stop2 ...`), so the base window starts at the NEWEST fork point. A branch commit that forked from an older stop and was copied to main between the older and newer stops is not detected, and is kept. This fails safe (the spec stays gated) but narrows the fix. On the real origin/integration there are 13 stops; the all-stops window is 194 commits against 308+ from the oldest. Excluding only `git merge-base --octopus <stops>` would cover the full span. File: aida-cli-lib/src/base_patch_equivalents.rs:75-86.
