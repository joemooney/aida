description: |-
  From TASK-3927
  Reviewed sha: 95866f79ae773d8edb6d2ab8f04cc105e6afc27c

  contained_lane.py preflight_refusal: `text[:LIMIT]` truncates from the END, so when the 20-line code-spanned tail exceeds 4096 chars the most recent (most diagnostic) probe lines are dropped and a closing backtick can be cut; it also bounds characters, not bytes (U+FFFD from errors='replace' is 3 bytes), so the docstring's '<= 4 KiB' is not guaranteed. Prefer trimming oldest tail lines until the encoded message fits.
