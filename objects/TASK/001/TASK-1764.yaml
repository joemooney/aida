title: 'No non-interactive way for an advisor-launched fixer subagent to take an implementer seat: it inherits the advisor grant, the code guard blocks its edits, and role enter needs a TTY'
description: 'Observed 2026-10-14 in fire mode: the BUG-1953 fixer subagent (spawned by the advisor seat) was blocked by aida-advisor-code-guard on its first edit; ''aida role enter implementer'' requires an interactive terminal, so it retried the edit as the hook allows. Fire mode authorises the advisor to fix via subagents. Need a sanctioned, auditable delegation path (e.g. a --delegate-seat implementer child grant for subagents) instead of guard retries.'
