title: CI gate scripts fall back to tomli when tomllib is unavailable (split from TASK-3840; strict gate path)
description: |
  Split from TASK-3840 (product-15, 2026-11-23 12:55) after its integration-bundle lane correctly punted. scripts/check-ci-gates.py and scripts/check-exec-context.py import tomllib unconditionally, so on a Python without tomllib (3.10, per the work CI report) the gate runner stops at line 36 before reading scripts/ci-gate-tiers.toml. A tomli fallback changes the parser dependency of the FAST gate runner and the exec-context guard, so this is a GATE/GUARD path: main track, strict review.

  ## Acceptance
  - AC1: Both scripts fall back to `tomli` when `tomllib` is unavailable, and fail with a clear message naming both modules when neither is present. Parsing results are identical either way.
  - AC2: Test: run both scripts' TOML loading with tomllib hidden (tomli present → identical parse; both absent → the clear error, non-zero exit).
