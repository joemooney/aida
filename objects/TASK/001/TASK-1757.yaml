title: 'Auto-release follow-ups: hold-lock across second pass, docs, stale clearance cleanup, production-read wiring test'
description: |
  Non-blocking follow-ups from the round-4 strict review of PR #2614 (STORY-1687) at 7eeea2e04e:
  1. The re-arm race between the validator's second pass and marker removal (deferred under R6). Fold it into the hold-lock follow-up: take the hold lock across the second pass and the release write.
  2. Document that the auto-release label/marker order differs from the human `aida merge-hold clear` path, and why.
  3. When the second pass refuses, a stale clearance file and authorization comment remain. Clean them up, or mark them superseded.
  4. Add a thin wiring test proving `auto_release` uses the production read functions (forge head, hold, corpus, requirement lookup), not only the injected fixtures.
