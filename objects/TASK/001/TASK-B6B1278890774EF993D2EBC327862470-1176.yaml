title: 'Review follow-up: At review_commands.rs:3711, repeat && placed is used as evidence that this refusal was nev'
description: |-
  From BUG-2662
  Reviewed sha: d21536f1c46bd0168f00444bbedc68c90d93cbd7

  At review_commands.rs:3711, repeat && placed is used as evidence that this refusal was never announced. An already announced refusal whose hold was subsequently released also satisfies that condition on retry, producing a second ReviewVerdictRecorded event for the same verdict. Conversely, a failed mixed filing with an equivalent pre-existing hold can miss the announcement on successful retry. Track announcement by the recorded act independently of hold placement.
