title: Read commands that call load() or list_requirements() use the strict refresh and can stall ~51 s behind a writer; give them the read-tolerant path
description: |
  From SPIKE-90 (case C2). `CachedGitBackend::with_inner` runs the read-tolerant freshness check, but `load()` and `list_requirements()` then call the strict `ensure_cache_fresh`, which refreshes and enters the ~25.6 s write ladder. Measured on a copy with a stale cache and a live, visible foreign writer: `aida search`/`status`/`queue list`/`show`/`history` returned in 0.02-0.48 s, but `aida graph tree EPIC-62` took 51.5 s and exited 1. aida-cli-lib has roughly 300 `.load()` call sites in 35 files.

  ## Acceptance
  - The backend exposes an explicit strict-vs-read freshness entry point; read-only commands (at minimum graph/tree, digest, burndown/fleet views, MCP read tools) use the read path, and mutating commands keep strict.
  - A test: stale cache + live foreign writer, `aida graph tree <EPIC>` completes in < 2 s and exits 0 (labelled stale once the SPIKE-90 refresh story lands).
  - Call-site classification is recorded in the PR; no mutating path is moved to the tolerant read.
  - Depends on the SPIKE-90 single-flight refresh story's reader protocol for the final wiring.
