- id: 01a1613d-b47f-7432-8baf-856248669478
  author: joe
  content: 'ADVISOR 18:35 (new item for the next slice): `aida merge-hold clear N` on a PR that was never forge-held still adds the aida:merge-hold-cleared label. merge-hold-gate then fails with ''Clearance label has no matching recorded hold'' (PR-2809: cleared label added 16:57, no recorded label in its history). A later `merge-hold clear` reports ''No merge-hold'' and leaves the orphaned label in place, while the ship error tells the operator that clear ''re-syncs'' it. Fix: clear adds the label only when a recorded hold exists, and the re-sync removes an orphaned cleared label. Add a test for both.'
  created_at: 2026-10-22T01:33:16.287529942Z
  modified_at: 2026-10-22T01:33:16.287529942Z
