  content: 'ADVISOR 19:18: PR-2816 (slice 4) MERGED 19:05. Folded its round-3 notes into the completing slice: TASK-2130 (already-merged bookkeeping uses the --rebase flag, not the PR''s actual merge method), 2131 (fetch_merged_pr_refs_via_gh is gh-only, so it fails on GitLab and pure git) and 2132 (landed_commits_for_subjects has no lower bound at the merge point).'
