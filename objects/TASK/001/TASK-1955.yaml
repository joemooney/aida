  author: joe
  content: 'ADVISOR 13:16: PR-2807 (TASK-1721) round-3 non-blocking notes, for the slice-6 release/lease work. (1) IMPORTANT: merge_lock.rs::acquire still creates the lease with create_new and then write_all, so release.sh lease_is_live can read an empty file as acquired_at=0, judge it TTL-stale and DELETE a live ship''s lease. Write via temp file plus link in Rust too, and make release.sh treat an empty or unparsable lease as live, not stale. (2) release.sh retakes the lease after the confirm prompt without re-checking HEAD == the commit the bump, CHANGELOG and tag notes were computed on; refuse if HEAD moved. (3) Lease temp files main.XXXXXX inside .aida/merge-locks are listed by merge_lock::status, and a SIGKILL orphans them; use a dot-prefixed name that status skips. (4) Add TASK-1721 per-criterion trace anchors on the release-flow tests. (5) Tests 4d/4e are source-greps; prefer behavioural probes.'
