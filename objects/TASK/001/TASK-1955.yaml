- id: 01a15f94-3c26-75f2-bcc7-c53f4e4675cf
  author: joe
  content: |-
    ADVISOR 10:50: PR-2801 (TASK-1967) round-2 non-blocking notes on aida-cargo-timeout-guard.sh, where the make resolver should fail closed. Handle them in a TASK-1955 slice: - non-blocking (minor): aida-cargo-timeout-guard.sh make_targets_skip_cargo fails OPEN on a recipe conditional: 'hello:' / 'ifeq ($(CI),1)' / '<TAB>cargo test' / 'endif' — the ifeq line resets owner so the cargo line is unowned and 'timeout 1h make hello' is silent. Same for ifdef/ifndef/ifneq. Contradicts the header claim 'anything it cannot resolve still gets the hint'. Fix: exit 1 on any conditional directive (as include does).
    - non-blocking (minor): make resolver treats an unknown prerequisite as a plain file even when a pattern rule (%.html:) or suffix rule (.md.html:) would build it with cargo; 'docs: out.html' + '%.html: ; cargo run' is silent. Fix: fail closed when any pattern/suffix rule exists and a prerequisite is unknown.
    - non-blocking (cosmetic): inert allowlist includes awk/sed/cat, which can run commands after quoted-body stripping (awk 'BEGIN{system("cargo build")}', GNU sed e, cat <(cargo ...)); .RECIPEPREFIX and top-level $(eval ...) rule generation are also not seen. All are silent. Drop awk/sed from the allowlist or treat '<(' as non-inert; list the remaining misses next to the existing 'Known misses' header line.
  created_at: 2026-10-21T17:48:32.678559458Z
