  content: 'ADVISOR 21:27 (bug note for the sweep): a reviewer launch refused at child-seat delegation (''no valid parent seat grant is active'', or ''grant does not delegate reviewer'') still leaves a reviewer lease on PR-N whose owning session is dead and whose worktree is gone. The next `aida queue work PR-N --role reviewer` then refuses until --force-claim. Seen on PR-2806 and PR-2820 at 21:07. Fix: check the grant before acquiring the lease, or release the lease on any refusal after it. Add a test: a refused delegation leaves no lease.'
