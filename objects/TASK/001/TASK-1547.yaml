title: 'Existing stores get the *.tmp.* ignore rule: widen the doctor repair and info/exclude guards'
description: 'Follow-up from BUG-1677: new stores ignore write_atomic staging files (*.tmp.*), but existing stores don''t — the doctor store-gitignore repair early-returns when .aida/node.toml exists, and ensure_lock_excluded skips info/exclude when .gitignore already has .aida/*.lock. Acceptance: 1. The doctor repair (or ensure_*_excluded) adds ''*.tmp.*'' to an existing store''s ignore/exclude idempotently without rewriting the user''s other lines. 2. Fixture tests for a store with an existing hand-written .gitignore.'
