  author: joe
  content: 'Round-4 correction from BUG-1677: do NOT widen info/exclude. A store attached as a linked worktree resolves ''git rev-parse --git-path info/exclude'' to the PROJECT''s shared common dir, so a staging-file rule written there hides the user''s own *.tmp.* files (that was the round-3 blocker). ensure_store_lock_excluded now writes only the anchored .aida/*.lock. The staging patterns are store-scoped and single-sourced as aida_core::fs_atomic::STORE_STAGING_IGNORE_PATTERNS / store_staging_ignore_block(); this task should make the doctor repair append that block idempotently to an EXISTING store''s tracked .gitignore (its early-return on .aida/node.toml is the gap), not touch info/exclude, and not use a bare *.tmp.*. workspace::tests::bug_1677_store_gitignore_hides_every_staging_name_and_nothing_else is the git check-ignore pattern to extend to the repaired-store fixture.'
