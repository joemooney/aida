title: Kill paths (drain_signal.rs SIGTERM) must use a strict liveness variant where 'cannot tell' means 'do not signal'
description: 'From the #2653 (TASK-1750) STRICT review. drain_signal.rs:217/:251 use process_identity_is_alive to decide whether to SIGTERM, where ''alive'' is the DANGEROUS answer. After #2653 an unparseable active_pid_start_time reads alive and would be signalled (previously skipped). No writer produces such values today. Add a strict variant (Unknown => do not signal) and use it on every kill/signal path. Also tighten recorded_identity_format to plain ASCII digits so ''linux-starttime:+5''/''007'' classify Unknown. Prerequisite for BUG-2130 (step 3).'
