title: 'STORY-1221 slice 1 shipped without CLI-level tests: add regression tests for protocol injection at queue work / do / worktree enter and for the awaiting --notice reminder appearing only while the curr'
description: |-
  Origin: the drain reviewer's round-2 finding on PR #1948 (verdict written 16:37, two minutes after the advisor merged at 16:35 — merged over an in-flight review; see the STORY-1221 ledger). The finding is valid: c25ba5c1 adds only aida-core META tests; `cargo test -p aida-cli-lib --lib protocol` discovers 0 tests, so the CLI injection and the notice lifecycle — the user-visible half of the slice — are untested.

  Add, in aida-cli-lib:
  1. Pickup injection: for a spike, a bug and a story fixture, `queue work`, `do` and `worktree enter` pickup prompts start with the type protocol block, cite the META id, are capped at PROTOCOL_PICKUP_LINE_CAP lines, and carry the precedence label (type protocol < spec acceptance) before the spec's own acceptance; a type with no protocol row injects nothing.
  2. Notice lifecycle: `aida awaiting --notice` adds the one-line protocol reminder only while the current worktree holds a lease on the spec; zero lines with no lease; the line disappears after `queue done` / lease release (TASK-160 quiet contract).
  3. Seed path from the CLI: `aida protocol seed` on a store with two of six protocols adds four and is idempotent (the core test exists; add the CLI-level one).
  Acceptance: `cargo test -p aida-cli-lib --lib protocol` discovers and passes at least 6 tests covering the three groups; no behaviour change.
