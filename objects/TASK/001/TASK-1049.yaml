  content: 'Broadened per ADR-7: the real fix is that aida zen must reuse the FULL shared --auto-complete per-spec orchestration (implement->CI->review->merge->pull), identical to burndown — NOT a truncated implement+PR+handoff. The missing independent reviewer is the visible symptom; the root cause is zen ran only the implementer phase. Fix = call the same orchestration primitive, and the review (plus CI-wait, merge-gate, auto-bump) all come for free.'
