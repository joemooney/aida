title: Warm-pool fallback ignores [worktree_pool] worktree_parent, so pickup worktrees escape the one folder-trusted directory BUG-1700 built
description: |
  OBSERVED: `pickup_worktree_path` (aida-cli-lib/src/lib.rs:36840) hardcodes the historical sibling layout — `project_root.parent().join("<repo>-<slug>")` — and never consults `[worktree_pool] worktree_parent`. Every other worktree creator does: `acquire_session_pool_worktree` (lib.rs:37194), `integrate_checkout` (integrate_checkout.rs:87) and lib.rs:65017 all pass `worktree_pool_config_worktree_parent(project_root)` as `AcquireOptions.parent_dir`.

  `pickup_worktree_path` is the fallback taken whenever the warm pool cannot serve a tree. Reproduced live on 2026-09-30 running `aida queue work BUG-1743`:

      Warning: warm-pool acquire failed (reset pooled worktree /home/joe/ai/aida-pool-aida-1); falling back to a fresh worktree
      worktree: /home/joe/ai/aida-bug-1743

  So a project that has correctly configured `worktree_parent` still gets worktrees scattered into the project root's parent the moment the pool misses — silently, with only a warning about the pool, nothing about the layout.

  WHY IT MATTERS: BUG-1700 built `worktree_parent` precisely so an operator running agents WITHOUT `--dangerously-skip-permissions` can accept the Claude Code folder-trust prompt ONCE for a single directory and have every later worktree inherit that trust. `doctor_cmd::worktree_trust_findings` (doctor_cmd.rs:1605) states the intent in its own remediation text: "launch an interactive agent in <parent> ONCE and accept the folder-trust prompt; every worktree nests under it, so trust inherits and no later worktree prompts again", and when the key is unset it recommends `"../aida-worktrees"` by name.

  A pickup worktree that ignores the key defeats that guarantee exactly when it matters: it is a fresh untrusted path with its own modal, and the alternative — granting the shared parent `/home/joe/ai` — also grants every unrelated project on the machine.

  SECOND, SEPARATE FINDING: this repository does not set `worktree_parent` at all. `.aida/config.toml` has no `[worktree_pool] worktree_parent` key, so even the pool path uses the sibling default here. `aida doctor` should already be emitting the unset-key finding above. Whether that finding is actually surfacing, and why an operator hitting the trust modal repeatedly never saw it, is worth confirming as part of this fix.

  NOT PROPOSED: a new layout. `../aida-worktrees` is the shipped, documented convention (lib.rs:17329 ships it as the commented example in the generated config) and the doctor's trust logic, tilde expansion (`expand_worktree_parent_tilde`) and lexical `..` normalisation are all built around it. An earlier draft of this spec proposed moving worktrees to `<root>/.aida/worktrees/<slug>` instead; that was written without knowledge of BUG-1700 and is withdrawn. Nesting inside the project root would also make the main checkout a filesystem ancestor of every worktree, which BUG-1743 shows is how an upward root resolution silently lands on the real repository.

  ## Acceptance
  - With `[worktree_pool] worktree_parent` set, a pickup worktree created via the warm-pool FALLBACK path lands under that directory, not under `project_root.parent()`. Verified by asserting the created path on disk after forcing a pool miss — not by unit-testing the resolver alone, since the resolver was never the part that was wrong.
  - With the key UNSET, the created path is byte-identical to today's `<parent>/<repo>-<slug>`. Existing projects see no change. `aida-core/src/worktree_pool.rs:834` already pins this invariant for the pool path; match it here.
  - All three `pickup_worktree_path` callers honour the key — queue_cmd.rs:11215, lib.rs:36873 and lib.rs:37369 — INCLUDING the `queue work --dry-run` preview, which must print the same path the real run creates. Proven by test: preview/reality divergence is the exact defect BUG-1628 consolidated this resolver to prevent.
  - A relative value (`"../aida-worktrees"`) and a tilde value (`"~/aida-worktrees"`) both resolve the same way here as they already do for the pool path, reusing `expand_worktree_parent_tilde` rather than reimplementing it.
  - Confirm whether `aida doctor` currently reports the unset key in THIS repository, and if it does not, say why. An operator repeatedly accepting folder-trust modals is the exact condition the finding exists to catch, so a silent doctor is part of the defect.
  - Prove the fix by mutation: revert the resolver change and show the new test fails. A test that passes either way advertises coverage that does not exist.
