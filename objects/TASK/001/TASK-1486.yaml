title: 'No-project refusal: keep the explicit-store guidance in agent output, fix tracker-command wording, and refresh the admin guide'
description: |-
  Follow-ups from the BUG-1603 review.
  (1) In agent mode (non-TTY stderr) the no-project refusal is shortened to its first line plus 'help: aida init'. That drops the --file / -p / REQ_DB_NAME / AIDA_STORE guidance and the '-p <default>' hint, and a bare 'aida init' could lead an agent to initialise a stray project in a random directory. Agent output must keep the explicit-store alternatives.
  (2) Jira, GitHub and GitLab tracker commands skip distributed detection. Inside a distributed project with no local db they now say there is no .aida/config.toml, which is false. Route them through distributed detection or give accurate wording.
  (3) docs/admin-guide.md (around lines 654-675) still documents a registry 'default:' key and describes AIDA_DB_NAME as the 'Default project name'. Update it to the fail-closed behaviour.
  (4) In a declared-distributed project whose store is not attached, init --refresh falls through to a stale cwd requirements.db. It should refuse or attach instead.

  ## Acceptance
  - The agent-mode refusal lists the explicit-store options, and does not suggest only 'aida init'.
  - Tracker commands inside a distributed project resolve the distributed store or refuse with accurate text.
  - The admin guide matches the behaviour.
  - init --refresh in declared-but-unattached distributed mode does not seed a stale local db.
  - Tests cover (1), (2) and (4).
