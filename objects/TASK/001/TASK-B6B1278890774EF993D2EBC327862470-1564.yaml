title: 'Review follow-up: aida-cli-lib/src/vendors/host_diagnostics.rs agy_auth_probe classifies Timeout with `e.to_'
description: |-
  From STORY-3202
  Reviewed sha: 1783608c2a472560286c5a4445f3bf009084e080

  aida-cli-lib/src/vendors/host_diagnostics.rs agy_auth_probe classifies Timeout with `e.to_string().contains("deadline")`. That matches the runner's message text, not a typed cause, so any agy failure whose stderr tail contains 'deadline' is reported as Timeout instead of Failed. The fix is a typed deadline error from RunnerCall::run, as AuthRequired already does for sign-in failures.
