title: 'Review follow-up: Coverage of the boost is narrower than TASK-3823 intends: because reviewer seat tuning is '
description: |-
  From TASK-3823
  Reviewed sha: b4dccb59840c4b1b6aa0d00faacc1919f4e1baa8

  Coverage of the boost is narrower than TASK-3823 intends: because reviewer seat tuning is read from the review worktree's branch-local `.aida/config.toml` (the PR head), reviewers of PRs whose head does not contain this commit keep the vendor default model after landing, until the branch is updated from main. For the two-day window this delays the boost on every already-open PR. If immediate, host-wide effect is wanted, put the same `[agents.codex.seats]` / `[agents.claude.seats]` reviewer entries in `~/.aida/agents.toml` on the review-watch host (lowest precedence, but it applies wherever the checkout's project files set no tuning: aida-core/src/agents_config.rs:216-239), or update open PR branches from main. Pre-existing resolver behaviour, not introduced by this diff.
