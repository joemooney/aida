    Advisor disposition, 2026-11-21 02:23 MST. Verified every open GitHub PR head against the landed TASK-3823 commit 012b95ef890, and parsed the exact .aida/config.toml blob at each head. All 12 open heads (4364, 4373, 4376, 4377, 4378, 4380, 4381, 4382, 4385, 4387, 4388, 4389) contain both exact reviewer seat values. The worktree-inheritance observation was correct. The proposed host-wide override and PR branch refresh would add changes outside the config-only temporary mandate, with no open branch missing the settings at this inspection. Reject that additional work for this temporary boost. TASK-3173 retains the live effective-model acceptance and TASK-3824 owns the planned rollback.
