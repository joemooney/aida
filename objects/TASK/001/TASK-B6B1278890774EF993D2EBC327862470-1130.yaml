title: 'Review follow-up: [P2] Continue settlement maintenance while review-watch yields admission. aida-cli-lib/src'
description: |-
  From BUG-2703
  Reviewed sha: 36e1d02a7af0338feb8ff4c6de2f1ef92ecc5171

  [P2] Continue settlement maintenance while review-watch yields admission. aida-cli-lib/src/review_watch.rs:2881-2888 continues before store.prune and advance, so a waiting ship suppresses the maintenance needed to make prior attempts quiescent. In particular, a claimed Superseding attempt remains active even after every descendant exits: transition_classified deliberately leaves it Superseding, reap_dispatchers only terminalizes unclaimed attempts, and only advance confirms and clears it. admission_quiescent rejects active attempts before confirming process exit. Thus the ship's intent keeps the watcher from clearing the very attempt blocking that ship until the ship times out; an active drain can retain the condition for hours. Run settlement-only reconciliation while yielding, without discovery or new launches, and add a regression with a superseding claimed review whose descendants finish during the wait.
