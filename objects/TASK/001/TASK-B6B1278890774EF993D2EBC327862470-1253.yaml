title: 'Review follow-up: Plain --check --json labels unavailable mandate evidence as read. At aida-cli-lib/src/pr_t'
description: |-
  From TASK-3115
  Reviewed sha: 5d32993516df48bf679c28db590822c4724702b9

  Plain --check --json labels unavailable mandate evidence as read. At aida-cli-lib/src/pr_train.rs:2260-2266 every preview refusal becomes a string, so trace-collection errors and unreadable exclusion history or ledger evidence become MemberGateError::Refused and check_one emits evidence="read" (aida-cli-lib/src/pr_train_check.rs:147-160). The command guide promises evidence="unavailable" when an evidence read fails. Preserve the refusal classification across both supervised and hold paths, and assert JSON output for unreadable evidence and a settled policy refusal.
