title: 'seat-recovery-playbooks.md template: add a ''Stacked PR after its base is squash-merged'' playbook'
description: |
  Upstream suggestion from aida-relay TASK-70 (PR joemooney/aida-relay#79). Hit three times in one day there: squash-merging the base of a stacked PR leaves the stacked branch conflicting, because it still carries the base's original commits.

  Recipe: (1) merge the base WITHOUT deleting its branch (deleting first auto-closes the stacked PR); (2) retarget the stacked PR to main; (3) delete the base branch; (4) git rebase --onto origin/main <old base head> <stacked branch>, then push --force-with-lease (old base head = the base PR's last headRefOid); (5) verify with git range-diff against the approved head before merging — a changed patch needs re-review.

  ## Acceptance
  - aida-core/templates/.aida/discipline/seat-recovery-playbooks.md (template master) ships a 'Stacked PR after its base is squash-merged' playbook with the five steps above.
  - The discipline README.md index row for seat-recovery-playbooks.md mentions stacked PRs.
  - `make sync-templates` has been run and `make check-templates` passes.
  - No new propagation mechanism: existing projects receive it through the normal scaffold refresh path.
