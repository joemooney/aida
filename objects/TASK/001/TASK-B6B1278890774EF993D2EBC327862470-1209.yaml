title: 'Review follow-up: On a resumed review, moving a retained same-head draft into the new launch directory prese'
description: |-
  From BUG-2707
  Reviewed sha: 14c0451a5928d949f71fd6681831a1c27d42fd95

  On a resumed review, moving a retained same-head draft into the new launch directory preserves its modification time. submit_draft discards the metadata at aida-cli-lib/src/review_draft.rs:466 and reports acceptance, so the reviewer exits. LaunchDraft::read then rejects that unchanged file as stale at line 153, leaving the review unrecorded. Make the launch freshness cutoff available to the in-session check, retain the parent's independent check, and cover a retained draft with an older modification time.
