title: 'Review follow-up: The FAST-only writer provides no shared warm cache for first runs of later PRs (.github/wo'
description: |-
  From BUG-2744
  Reviewed sha: ea821ddd34be72fe4f36d7ad25ca50577df3ff66

  The FAST-only writer provides no shared warm cache for first runs of later PRs (.github/workflows/ci.yml:65, 141-145, 171-175). Non-PR runs always choose FULL, so this writer runs only on pull_request events. GitHub scopes its entries to the individual PR merge ref, as shown by the actual saved entry under refs/pull/4503/merge. Every new PR starts cold with this implementation, and a failed install on its first attempt leaves its retry cold too. As a follow-up, provide a trusted base-branch cache seed if first-run reuse is needed for the recurring timeout scenario. See https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache
