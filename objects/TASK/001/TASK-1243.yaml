title: 'Merge-lease: wire the lease across pr ship''s check→merge→pull (drain phase split to follow-up)'
description: |-
  Follow-up to STORY-1171 slice 1 (#1873, the merge_lock primitive + aida merge-lock status, ADR-38). Slice 1 landed the tested primitive but is wired NOWHERE (acquire-side is #[allow(dead_code)]). This slice wires it so the acceptance ('two concurrent merges to main serialize; one waits, bounded') actually holds.

  Wire merge_lock::acquire/release (RAII MergeLease) around the merge critical section per ADR-38 (check→merge→pull width):
  - pr_cmd::pr_ship_handler — acquire on the target branch before the merge_change block, hold the guard through the merge + aida pull, auto-release. On WouldBlock (a live holder outlasts DEFAULT_WAIT) print a refuse message + return Err.
  - the drain RealPhaseDriver merge phase (lib.rs ~84592) — same lease so drain-vs-pr-ship serialize.
  - Pick ONE acquisition level (caller, not forge::merge_change) to avoid self-deadlock.

  Keyboard/guided, NOT an autonomous drain — it modifies hot merge paths (a wrong wire breaks all merges). Remove the #[allow(dead_code)] once acquire is called. Acceptance test: two concurrent pr-ship merges to main serialize (one waits, bounded); the drain merge and a pr ship serialize against each other.
