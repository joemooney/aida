title: Implement concurrency-safe evaluator circuit breaker and health state
description: |-
  CONTEXT:
  Under ADR-56, consecutive remote evaluator failures (e.g. 3 consecutive timeouts or 5xx responses) must trip an in-memory circuit breaker so subsequent calls fail fast without blocking caller threads or wasting deadline budgets.

  REQUIREMENTS:
  - Implement EvaluatorCircuitBreaker scoped to endpoint + model.
  - Concurrency-safe state transitions: Closed (normal), Open (tripped after N consecutive failures; cooldown duration 60s), Half-Open (allows 1 trial request to probe recovery).
  - Uses monotonic clock (Instant) to avoid clock skew.
  - Zero blocking network probes on the critical request path; health state is inferred directly from evaluation results.
  - Emits structured state transition events for telemetry.
