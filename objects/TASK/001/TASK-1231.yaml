    HAND-OFF + DECISION (operator, 2026-09-14): the execution_mode fence fix goes to the ADVISOR (its own acceptance criterion; it caught the two misses; merge stays with it). Operator confirmed: KEEP UNSET for selection (defers implications to the advisor).

    Recipe (advisor's, operator-confirmed):
    1. Emit execution_mode in `list --format json` (structurally absent today; even `--fields mode` is ignored for JSON — a BUG-1149 cousin).
    2. Selection fence: exclude execution_mode ∈ {drive,guided,operator,decide}; KEEP drain + unset.
    3. Add a test: a drive-mode spec with NO keystone tag (the case PR #1827's tag-net misses).

    Wrinkle to avoid a third miss: `pr_ship::merge_requires_supervision(mode)` returns true for EVERYTHING except Drain — so it ALSO excludes unset. Do NOT reuse it verbatim for SELECTION (it would drop unset, contra "keep unset"). Selection predicate = exclude only the 4 supervised modes, keep None+Drain. The MERGE gate correctly still treats unset as supervised — a different, also-correct decision (unset drains but won't auto-merge; the advisor merges it).

    Base to build on (PR #1827 / branch task-1231-autoprogress): the command is built + tested (project resolution + wrong-store guard + lock-skip + single-spec drain loop + pure-seam tests). The tag-net (is_keystone_class) can STAY as defense-in-depth. Two impl options for the mode fence: (a) emit execution_mode in the list-json serde struct (I couldn't pinpoint it) + parse in select_ready_from_json; or (b) pivot ready_specs to in-process store load (.aida-store + CachedGitBackend::open) reading r.execution_mode directly + leased_spec_ids(root) for in-flight. Advisor's call.
