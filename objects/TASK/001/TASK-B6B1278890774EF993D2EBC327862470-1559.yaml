  content: |-
    ## Implementer self-review
    Reviewed HEAD: ed07101ce1 (git diff origin/main...HEAD, 1 file, +117/-5).

    **Acceptance evidence**
    - AC1: `pr_set` (sort+dedup) is the waiter identity in `queued_train_admission`; legacy unsorted rows are normalized at comparison; new/adopted rows store the set. Test `task3925_same_set_in_another_order_adopts_its_waiter` ([2,1] then [1,2,1] then [2,1,2] all hit one row).
    - AC2: owner dropped from the match; on refusal the matching row keeps id/since/position and takes the new owner + expiry; on admission it is removed. Test `task3925_same_set_from_another_parent_adopts_its_waiter` (other live parent → me; old parent exit no longer releases it).
    - AC3: the two tests above + FIFO assertion ([10],[1,2],[30]) + `task3925_recycled_pid_is_dead_and_released` (same pid, starttime+1 → released, no yield). 5/5 admission_owner task39* tests pass via lane job.

    **Probes**: (1) both sides normalize via `pr_set`. (3) legacy duplicate rows of one set: first is adopted, admission removes all; others expire by TTL/owner death. (4) empty set ("all ready PRs") retries adopt each other — intended. (5) waiters grant nothing; no authority path changed; no tests weakened.

    **Residual risk**: two different operators training the same set now share one waiter (intended by AC2).
