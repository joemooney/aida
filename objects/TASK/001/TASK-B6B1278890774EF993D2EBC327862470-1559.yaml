title: 'Manual-train waiters: an order-insensitive PR set, an identical retry adopts its live waiter, a recycled-pid test (TASK-3924 follow-up)'
description: |
  Follow-up to TASK-3924 (advisor-122 2026-11-26 23:34; filed by product-15). #4728 lands with these deferred.

  ## Acceptance
  - AC1: manual-train waiter identity uses the ORDER-INSENSITIVE (sorted, deduplicated) PR set, not the exact argv order.
  - AC2: a manual train whose PR set equals a LIVE waiter's ADOPTS that waiter (takes over its queue position, refreshes its owner pid + start time) instead of queueing behind it, so retrying from another terminal or a deputy never self-blocks.
  - AC3: tests: the same set in a different order → adopts; the same set from a different parent → adopts; a different set → queues FIFO; a recycled pid (same pid, different start time) → treated as dead and released.
