  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit):** `queued_train_admission` normalizes the PR set (sort + dedup) once; waiter identity and the stored row use it; comparison normalizes legacy rows too. Proven by `task3925_same_set_in_another_order_adopts_its_waiter`.
    - **AC2 (unit):** identity is the PR set alone (owner dropped from the match): a matching live waiter is adopted — keeps its id/since/queue position; its owner and expiry are refreshed on refusal; removed on admission. Proven by `task3925_same_set_from_another_parent_adopts_its_waiter` and the order test.
    - **AC3 (unit):** the two tests above, `task3925_different_set_queues_fifo` (assertion inside the adopt test), and `task3925_recycled_pid_is_dead_and_released` (same pid, starttime+1).

    ### Expected files
    - `aida-cli-lib/src/admission_owner.rs`

    ### Ambiguities / conflicts as questions
    - None ("start time" read as the owner ProcIdentity starttime; the waiter `since` keeps its queue position).
