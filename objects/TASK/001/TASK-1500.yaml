- id: 01a0df05-bb62-7281-abe1-6af2c389adb3
  author: joe
  content: |-
    SKETCH (awaiting advisor signoff):

    CONTEXT FOUND. "YOLO" here = the existing bypass posture: [agents] bypass = true in ~/.aida/agents.toml or .aida/agents.toml (load_agents_bypass), AIDA_PERMISSION_MODE / [behavior] permission_mode = bypassPermissions (queue work only), or an explicit --permission-mode bypassPermissions. Init already has a TTY-gated, idempotent first-machine posture picker (maybe_prompt_agent_posture, native default). What is missing is a confirmation step at LAUNCH time, when bypass is about to be applied. This spec adds that step and the setting that turns it on or off. Operator decision: on by default.

    1. OWNER AND TRIGGER
    - Owner: the supervised launch path, meaning the four launchers that already resolve bypass: aida agent new, aida session new, aida session start --launch, and interactive aida queue work.
    - Trigger: after posture resolution, the effective posture is bypass (from any source) AND the confirm setting is on. The launcher then asks once, before it spawns or execs anything.
    - Init is only the place where the setting gets chosen and written. It does not launch agents.

    2. SURFACE (exact names)
    - Config key: .aida/config.toml [agents] confirm_bypass = true|false. It sits next to the existing [agents] enabled/vendor keys and is also valid in ~/.aida/config.toml. Default when absent: true.
    - Strictest value wins. Bypass is confirmed unless an explicit `false` is read from a trusted scope and no scope says `true`. Trusted scopes: the user config, or the trusted default-branch copy of the project config (trusted_config.rs). A `false` in a branch-local or linked-worktree copy is ignored. Reason: a pushed branch must not be able to switch the prompt off.
    - Init prompt, TTY only, in the full footprint, under the existing !no_agent_config gate, shown only when the key is absent:
      "Ask before launching agents with permission prompts turned off (bypass)? [Y/n]"
      Y or Enter writes true. n writes false and prints a one-line warning with the file path.
    - Launch prompt, TTY only:
      "<agent> will launch with permission prompts turned off (source: <[agents] bypass in ~/.aida/agents.toml | --permission-mode flag | AIDA_PERMISSION_MODE | .aida/config.toml>). Continue with bypass? [y/N]"
      y means bypass for this launch only. N or Enter downgrades the launch to the native posture and continues. Nothing is persisted.
    - Env: no environment variable can turn the prompt OFF. Optionally AIDA_CONFIRM_BYPASS=1 can force it on (open question). An env override that disables it would let an agent disable it inline, so none is provided.
    - Visibility:
      - aida config permissions show: human and JSON output gain a confirm_bypass row with its value and source.
      - aida agent new --noexec preview: permission_posture block gains "confirm bypass: on (default|<file>)".
      - queue work pre-flight posture line: appends "(confirmed at prompt)" or "(prompt declined; native)".
      - Init summary: one line naming the value and file.
      - CONFIG_KNOBS: new KnobSpec {section "agents", key "confirm_bypass"} marked EditSafety::ReadOnly (security-relevant), so config menu and config edit cannot toggle it.

    3. RACES AND FAIL-CLOSED BEHAVIOUR
    - Non-TTY init (--yes, CI, an agent's Bash tool): never prompts. Writes confirm_bypass = true explicitly only when the key is absent, so the setting shows up in the file. It never writes false. No init flag can write false, so there is deliberately no --no-confirm-bypass.
    - Existing config: a present key is never re-prompted or overwritten (same idempotency as the telemetry knob). A missing key on an existing project resolves to true, which is fail-closed. See open question 1.
    - Re-running init (including --force/--refresh): same as existing config. No re-prompt. The value is kept.
    - Launch with no TTY (stdin or stdout not a terminal, via authority_stdin_is_terminal so tests can inject it) while confirm is on and bypass resolved:
      - Config-, env- or knob-derived bypass: downgrade to native and print a one-line notice. The launch still happens.
      - Explicit --permission-mode bypassPermissions flag: refuse with an actionable error ("bypass needs confirmation at a terminal; run from an interactive shell or set [agents] confirm_bypass = false in your user config").
    - Read errors on either config file, or unparsable TOML, resolve to true.
    - No new file writes happen at launch, so there is no write race. Init writes through config_edit::set_kv (section-preserving). Launch reads once per launch. A concurrent edit is picked up by the next launch.

    AGENT SELF-ESCALATION (explicit call-out)
    - Guarded by this design: a non-TTY agent cannot (a) answer the launch prompt, (b) get bypass on a launch it starts (it is downgraded or refused), (c) write confirm_bypass = false through init, (d) flip it through config menu or config edit (ReadOnly), or (e) disable it through an env var.
    - EXISTING HOLE, fix proposed as in scope: `aida config permissions set bypass` (handle_config_permissions_command -> apply_permission_posture) has NO TTY gate today. The shipped .claude/settings.json allowlists Bash(aida *), so a native-posture Claude agent can run it without a prompt and give every later launch bypass. Proposal: when confirm_bypass is on, `set bypass` needs a TTY plus a [y/N] confirmation. Non-TTY refuses with an error. `set native` and `set contained` stay ungated, because they only reduce access.
    - Residual, out of this spec's threat model and documented, not closed: (i) an agent that already runs in bypass can edit any file, so it is already YOLO. (ii) A pty wrapper (script -c) can fake a TTY. (iii) Unattended drain children (claude_headless_args_*, which force bypassPermissions) are gated by dispatch authority, not by this setting.

    4. FILES BY SYMBOL
    - NEW aida-cli-lib/src/bypass_confirm.rs, kept small so lib.rs does not grow:
      - load_confirm_bypass(project_root) -> ConfirmBypass { on, source }: strictest-wins over the user config and the trusted project copy.
      - pure decide(resolved_bypass: bool, source: BypassSource, confirm_on: bool, tty: bool) -> BypassDecision { Proceed, Prompt, DowngradeNative, Refuse }.
      - prompt_confirm_bypass(): reads y/N.
    - lib.rs:
      - apply_agent_default_flags and the agent new handler around it: apply the decision to default_args and to the explicit_permission path.
      - resolve_interactive_launch_mode_for_root (session new / session start --launch).
      - maybe_prompt_agent_posture's neighbour: new maybe_prompt_confirm_bypass, called from the init block next to maybe_prompt_agent_posture.
      - render_agent_launch_noexec: preview line.
    - queue_cmd.rs handle_queue_work: after resolve_queue_work_permission_mode, apply the decision before launch. Pre-flight line.
    - config_cmd.rs:
      - CONFIG_KNOBS entry.
      - handle_config_permissions_command Set arm: TTY gate for Bypass.
      - PermissionPostureReport, permission_posture_report and render_permission_posture_report: confirm_bypass row and JSON field.
    - aida-core/templates/agents.toml: comment block pointing at the new key. Mirror via make sync-templates.
    - docs/cli/06-roles-sessions.md and docs/environment-variables.md: note that no env var disables the prompt.

    5. NAMED TESTS (fixtures only: fake HOME through test_home and test_env::AmbientGuard with injected stdin_is_terminal; tempdir projects; no real claude/codex spawn, all through --noexec or the pure decide())
    - confirm_bypass_decide_matrix: every combination of (bypass source x confirm on/off x tty) maps to the right decision. The explicit flag with no TTY gives Refuse. The knob with no TTY gives DowngradeNative.
    - confirm_bypass_absent_key_defaults_on
    - confirm_bypass_strictest_wins_user_vs_project
    - confirm_bypass_false_ignored_from_branch_local_copy
    - confirm_bypass_unreadable_config_fails_closed
    - init_non_tty_writes_confirm_bypass_true_never_false
    - init_rerun_preserves_existing_confirm_bypass
    - init_tty_prompt_writes_choice (injected stdin)
    - agent_new_noexec_non_tty_bypass_knob_downgrades_to_native: argv has no --permission-mode bypassPermissions.
    - agent_new_non_tty_explicit_bypass_flag_refused
    - session_launch_mode_non_tty_downgrades
    - queue_work_permission_non_tty_downgrades (pure resolver-level)
    - config_permissions_set_bypass_refused_without_tty_when_confirm_on
    - config_permissions_set_native_allowed_without_tty
    - config_knob_confirm_bypass_is_readonly
    - permissions_show_json_includes_confirm_bypass

    6. OUT OF SCOPE
    - Unattended/headless drains (queue work --drain, burndown run, shift waves) and their forced bypass.
    - Contained posture: unaffected, because dontAsk inside the sandbox is not bypass.
    - Codex/agy native config files (~/.codex/config.toml danger-full-access) set outside AIDA.
    - Retiring or migrating the setting later: removing the key and the module is the whole migration, because the setting has no side state.
    - Hardening against fake TTYs.

    7. OPEN QUESTIONS
    Q1. Existing projects and machines that already set [agents] bypass = true (the operator's own fleet) will start seeing a [y/N] prompt on every interactive launch after upgrade, because an absent key means on. Accept that, or treat "absent + bypass already set before upgrade" as off with a one-time notice? Recommendation: accept it. It is fail-closed, and a single `confirm_bypass = false` line in ~/.aida/config.toml ends it.
    Q2. Launch prompt default: N (fail-closed, proposed) or Y (less friction)?
    Q3. A non-TTY explicit --permission-mode bypassPermissions is refused, not downgraded. Is anything legitimate relying on that today? Candidates: orchestrator / pane_host launches that pass the flag through aida agent new; agent new --bg's forced bypass. Should those carry an internal "operator-dispatched" marker instead, and who mints it?
    Q4. Should the `aida config permissions set bypass` TTY gate apply even when confirm_bypass is false? Proposed: gate only when on.
    Q5. Add AIDA_CONFIRM_BYPASS=1 (force-on only), or no env var at all?
    Q6. Where may `false` come from: trusted default-branch project copy plus user config (proposed), or user config only? A committed project `false` would switch the prompt off for teammates.
