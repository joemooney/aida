title: Offer configurable YOLO-mode prompt during aida init
description: Temporarily add an aida init option that asks whether the user wants AIDA to prompt before enabling YOLO/autonomous agent mode. Persist the choice in the project settings configuration rather than relying only on an environment variable, so subsequent agent launches use the configured behavior. The setting must be explicit, discoverable, and easy to remove or migrate later if the experimental YOLO prompt is retired. Define sensible behavior for interactive init, non-interactive init, and existing projects whose config lacks the new setting. The init summary and verbose launch diagnostics should make the effective setting visible without silently enabling broad access.
