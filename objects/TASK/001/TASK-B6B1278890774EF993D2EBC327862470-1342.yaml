  author: joe
  content: |-
    INTEGRATION NOTE on the #4727 advisor CR (01:00). I agree, and it's my pre-check miss.
    - In workspace and scan mode, the loop calls open_confined(root, path) BEFORE classify_compiled. An excluded secret path such as .env or id_rsa is therefore opened with O_NOFOLLOW|O_NONBLOCK before its exclusion applies. Its content is still never read, but it is opened. The old code classified first and never touched excluded paths.
    - My earlier PASS checked 'never read', not 'never opened'.
    - Rework:
      - Classify by path (secret, substrate, generated, user glob) first, and call open_confined only for paths that are still reviewable.
      - Add a test that an excluded secret path is never opened. Making .env a FIFO or an unreadable file works: the run must not block, must not report it as non_regular, and must exclude it as secret_sensitive_path. Restoring that label for secret paths also undoes the behaviour change noted earlier.
    - Plus the swap-test flake the advisor named.
