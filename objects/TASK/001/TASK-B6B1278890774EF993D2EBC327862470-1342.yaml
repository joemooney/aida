description: |
  review prepare hardening II, NARROWED by advisor-122 2026-11-26 14:44 (product-15 audit 14:40; originally deferred from the STORY-3076 S2 #4511 review). STRICT.

  DELIVERED by STORY-3120 (S3a/S5a/S5b/S5c), no further work: (14) --no-textconv on content reads; (9) consistent pathspec scoping (--literal-pathspecs); (11) rendering of anchoring outcomes; (8) rename-aware churn.

  ## Acceptance (remaining scope)
  - AC1 (10): gitlinks, submodules, symlinks and other non-regular entries are SKIPPED from the review inventory with a named reason, never followed or read through. Tests for each kind.
  - AC2 (12): --specs resolves store IDs ONLY through the trusted store (never from PR-controlled files), with a refusal on unknown IDs. Tests.
  - AC3 (2)(6): PROOF tests for pinned-root confinement on reads AND writes, including a concurrent re-parent / symlink swap.
  - AC4 (13): a lossless non-UTF-8 path round trip, with escaping, proven by a test.
  <=300 lines; lane after STORY-3120 S5c merges (same files).
