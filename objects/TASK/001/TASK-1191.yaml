title: rework findings lookup can attribute another spec's verdict (len==1 fallback)
description: |
  rework_findings_block_for_spec (queue_cmd.rs, PR-1638) resolves a verdict by: spec-keyed file, then a scan of all blocking verdicts filtered by verdict_mentions_spec, then — when exactly one blocking verdict exists — that verdict regardless of whether it mentions the spec. Multiplicity edge: rework of spec A while spec B's RequestChanges verdict is the only blocking file on disk attributes B's findings to A's pickup. Low likelihood (per-spec file usually exists; mention-check runs first) but the failure mode is confidently-wrong context fed to an implementer.

  Fix sketch: drop the len==1 unconditional fallback, or require the verdict's PR to resolve to the spec via the forge/queue linkage before attributing.

  Raised in review of PR-1638: https://github.com/joemooney/aida/pull/1638#issuecomment-5527596055
