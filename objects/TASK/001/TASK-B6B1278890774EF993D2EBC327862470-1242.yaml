title: 'BUG-2722 follow-up: refuse attestation during an in-flight host publication; strengthen the PTY refusal fixtures'
description: |
  Follow-up of BUG-2722 / PR #4403 (advisor-122 approve-with-follow-up ruling, 2026-11-23 01:12 MST; filed by product-15). The r4 CR at 960f8410b2 confirmed items 1, 3 and 4 (merge validation retained across successor bases; preview outside the lock with compare under the lock; --json refused). These remain, and are accepted as follow-ups because the release command runs only for a human at an interactive terminal who chooses when to attest, and the alternative (hand-editing the repair journal) is strictly worse.

  ## Findings
  1. BUG-2722 / TASK-3804, aida-cli-lib/src/repair_journal.rs:343 and aida-cli-lib/src/ship_from_seat.rs:2284: attestation can revoke an exact-tree validation while a host publication is in flight. The publisher releases RepairGuard after its validation check and later pushes the staged ref. The ownership recheck only requires a matching host lease record and accepts the dead-owner record that attestation also accepts. Attestation keeps that record and tree in place, so it can complete and clear validation while the publisher still proceeds with its earlier result. Coordinate release with the publication admission boundary so an attested release cannot complete ahead of a push admitted under the revoked validation.
  2. BUG-2722 round-four item 2, aida-cli/tests/support/repair_attestation.py:36 and aida-cli-lib/src/doctor_cmd.rs:345: the PTY test sets AIDA_AUTO_COMPLETE without a live token. The drive-seat flag predicate rejects that case before the corroborated orchestrator check runs. Removing doctor_running_autonomously from the mutation route leaves every new assertion passing, contrary to the requested guard-removal regression. Cover headless-only and corroborated orchestrator contexts at the real CLI boundary and arrange the guard and its test so the intended orchestrator check is observable, or consolidate the redundant guards and prove the authoritative check with those inputs.
  3. aida-cli-lib/src/repair_journal.rs:349 and aida-cli/tests/support/repair_attestation.py:58: the concurrent PTY test changes only the journal entry, so it exits before the post-confirmation lease check. The live-lease fixture tests only the initial preview. Dropping the post-confirmation lease check would still pass both. Exercise a matching live lease appearing after preview with the selected journal entry untouched, and assert typed confirmation refuses without writing a release.

  ## Acceptance
  - AC1: Attesting a release while a host publication for the same entry is mid-flight is refused, with the in-flight evidence named. A test covers it.
  - AC2: The PTY fixtures assert the integrity-floor, managed-agent and orchestrated refusals strongly enough that removing any one check fails a test.
