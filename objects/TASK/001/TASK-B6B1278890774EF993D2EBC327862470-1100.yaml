title: 'Measure TASK-3815 self-review: review rounds per landed PR, 7 days before vs after enablement'
description: |
  Follow-up to TASK-3815 (implementer self-review before push), split out by product on 2026-11-17 04:30 because a before/after measurement cannot exist before the setting merges.

  Acceptance:
  1. Once TASK-3815 is merged and enabled for this project, and TASK-3813's landing-metrics command is on main, record the enable date as a comment here.
  2. Seven days after enablement, run the landing-metrics command for the 7 days before and the 7 days after, and post both outputs (mean and median review rounds per landed PR, by vendor) here.
  3. Write a one-paragraph conclusion: did rounds drop, stay flat or rise? Recommend keeping, tuning or disabling the setting. The advisor rules on it.
  No code change unless the conclusion calls for one (that would be a new spec).
