description: |-
  From TASK-3963
  Reviewed sha: dd85481f4923fcb0d8c707c20a5fad7306893198

  aida-cli-lib/src/pr_train_regen.rs stage(): the host checks each changed output's reported `after` sha256 against the bytes, but never checks the reported `before` sha against the tip's blob. `before` feeds only the Aida-Train-Regenerated trailer and the PR-body audit block, so a wrong value cannot change what is committed; it can only misstate the audit record. Follow-up: compare `before` with the sha256 of the tip blob (or `absent`) and refuse on a mismatch.
