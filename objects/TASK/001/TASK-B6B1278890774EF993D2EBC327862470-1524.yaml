title: 'Review follow-up: p3 follow-up (BUG-2773): aida-cli-lib/src/coordination.rs unbound_claim_blocker condition '
description: |-
  From BUG-2773
  Reviewed sha: 67629843c466be9583facbb0ee20f8c5e445a77a

  p3 follow-up (BUG-2773): aida-cli-lib/src/coordination.rs unbound_claim_blocker condition 3 reads agent rows through agent_registry::load_active_entries, which silently skips unreadable or unparseable rows (agent_registry.rs:2143-2148). A corrupt unended agent row on the claim's scope is therefore not seen, while the lease table and lane records in the same predicate fail closed. Failure scenario: an unbound claim older than 24h with a dead creator, no session lease, no lane record, a clean clone, and a truncated .aida/agents/<id>.toml naming the scope is released. Other independent signals (24h floor, strict lease table, clean-clone check) make this narrow; it is documented as residual risk (a) in the implementer self-review. Follow-up: use a strict agent-row reader here so an unparseable row retains the claim, with a refusal test.
