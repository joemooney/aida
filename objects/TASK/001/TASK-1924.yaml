title: configure_git_remote_credentials scopes the helper to the first stored URL but takes creds from the first credentialed one (url/pushurl on different hosts)
description: |
  aida-cli-lib/src/gitlab_project_create.rs configure_git_remote_credentials (~:540-560): `clean_stored` is the FIRST stored URL (credentialed or not), while `stored_creds` is the first CREDENTIALED one. Example: remote.X.url=https://hostA/... (clean) and remote.X.pushurl=https://u:tok@hostB/... In that case the pushurl is rewritten to clean B via insteadOf, but the helper is scoped to credential.https://hostA. So (1) B's token is offered to host A's credential requests, and (2) pushes to B lose their credential and fail, where before the PR they used the embedded token. This is a rare config. Fix: derive the scope per credentialed URL, either one scoped helper per host or pair each creds with its own clean URL's scope. Add a url-A + pushurl-B test.

  Raised in review of PR-2736 (round 3, head 2b5fca7031).
