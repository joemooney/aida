  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - AC1 [behavioral]: unit tests in a new gate/train_generated.rs: the TRAIN_GENERATED table cross-checks the embedded REGISTRY (name, outputs, argv), and a floor ratchet checks that no train path matches the protected floor. The canonical regen message, the trailers and the PR-body block are tested. The regen commit is checked in verify_structure (parent = last car, canonical message, touches only G). The journal record comes from Built.regen (Built is already journaled). Python driver 'train' phase and the store-writers --baseline handling in the conflict lane: fixture tests run the embedded driver in temp git repos.
    - AC2 [behavioral]: add_car and the patch-id checks are not changed; existing story_1690 train tests stay green.
    - AC3 [behavioral]: the driver test reruns the cheap generators and refuses when the output changes; it refuses when a generator writes any unregistered path. Rust re-checks that the regen tree differs from the tip only in the selected outputs. The cars' patch-ids are not touched.
    - AC4 [behavioral]: driver tests: clean-tree regen is a no-op (report shows no change, so no commit); a non-zero exit, a write outside the outputs, non-determinism, and an E2 violation (changed reviewed row, or a new non-blocked row) each refuse. Rust tests: a protected-set match disables the entry, and the regen-commit check refuses paths outside G or a non-canonical message.

    ### Expected files
    - scripts/repair-generated.py, aida-cli-lib/src/gate/train_generated.rs (+ gate/mod.rs), aida-cli-lib/src/pr_train.rs (Built.regen, regen step in the live build, PR body), pr_train_verified.rs (verify_structure), seat_clone.rs (inventory paths + pinned generators), Built literals in tests.

    ### Ambiguities / conflicts as questions
    - cli-help regeneration runs cargo (a cold build took 12m42s) and S1 changes no coverage, so a tip regen almost always does nothing. I plan to list cli-help in TRAIN_GENERATED as Derived but not train-run in S1 (train_eligible=false) until S3 needs it. I will file this as a design-choice finding.
