description: |-
  Slice 1 of the SIGNED STORY-2894 sketch (advisor aida-d3 2026-11-28 01:36; sketch docs/plans/2026-11-28-story-2894-generated-file-regen-sketch.md, PR #4806). Filed as a child so it can lane while the sketch PR is open (one spec per lane).

  ## Acceptance (sketch section 6, S1)
  - AC1: add the showcase-search and store-writers rows (with --baseline handling) to REGISTRY; add gate/train_generated.rs with the classes, the cross-check and the floor ratchets; add the driver's train phase; add the ONE regen commit at the train tip (Q2) with [AI:aida-train] trailers (Q5), the PR-body block and the journal record.
  - AC2: approval coverage does NOT change in S1.
  - AC3: the advisor's 01:16 requirements hold: deterministic regeneration (run twice → identical bytes), only registered paths may change, and the PR's own non-generated diff is re-verified unchanged (patch-id over non-generated paths).
  - AC4: tests: regeneration on a clean tree is a no-op; each section-4 failure mode refuses.
  - Touches gate/: needs a human merge.
