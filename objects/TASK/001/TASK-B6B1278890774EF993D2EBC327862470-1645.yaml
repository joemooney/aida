- id: 01a22178-aa0b-7d12-8e06-4ffce675e845
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3963):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1df06dd6599b
    Recorded: 2026-11-28T09:22:51.186247507+00:00
    Findings:
    1. aida-cli-lib/src/pr_train_regen.rs run_and_stage: the train runs the generators (docs/showcase/build.py, scripts/check-store-writers.py and anything they import) from the PR-controlled train tip, on the operator host, with the whole filesystem read-only bound (`--ro-bind / /` when [contained] read_allowlist is empty). Their output is committed into the regen commit and pushed with the train branch, so a car that edits a generator can read host secrets (e.g. ~/.ssh, forge tokens) and publish them through docs/showcase/search-data.js or the inventory. Conflict lanes deliberately bind base-pinned copies of these same generators (seat_clone.rs regenerate_repair_outputs, extended in this PR for build.py and check-store-writers.py), and the signed sketch section 3 says the train phase 'applies the existing offline sandbox'. Fix: bind the base (main) versions of the registered generators over the tip worktree as seat_clone does, and skip regeneration when a car changes a generator; or limit reads to the worktree plus the essentials.
    2. aida-cli-lib/src/pr_train_regen.rs regenerate: `load_human_gates(project_root).map(|g| g.protected).unwrap_or_default()` fails open. When the committed or operator gate config cannot be read, ProtectedPaths::default() is the floor only, so an output the operator protected in config (e.g. scripts/store-writers.toml) is regenerated and committed anyway. The mandate-gate convention is 'Err gates everything' (gate_reason), and sketch section 4 says an entry whose path is in the effective protected set is disabled. Fix: on Err, disable every train entry (no regen commit) and print the reason. Add a test for that refusal path; only the happy-path runnable() split is tested now.
    3. Sandbox test gap in aida-cli-lib/src/pr_train_regen.rs: the only end-to-end test of the bwrap regeneration step (the_train_tip_gets_one_regen_commit_and_a_clean_tip_gets_none) returns early and passes when bwrap cannot run, which is common on CI runners that restrict unprivileged user namespaces, so the sandboxed refusal path may never run in CI. The generator-timeout path (command_output_with_timeout -> 'the generators timed out') and the launch-failure path, both section-4 failure modes, have no test. Fix: make the skip visible or required on the Linux CI job, and add timeout and launch-failure refusal tests.
    4. Sketch section 4 says the refusal reason is 'printed and journaled' and that a path written outside the outputs triggers an advisor mail naming it. regen::regenerate only eprintln!s the refusal; neither the train journal nor the mailbox records it. That is acceptable for S1, where a refusal leaves the train as built, but it should be tracked.
    5. aida-cli-lib/src/pr_train_verified.rs verify_structure checks the regen commit but does not add it, or its report, to the returned proof vector. The coverage-audit proof lists the cars and the tip but has no per-commit record of the regen commit.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-28T09:24:45.707950Z
  modified_at: 2026-11-28T09:24:45.707950Z
