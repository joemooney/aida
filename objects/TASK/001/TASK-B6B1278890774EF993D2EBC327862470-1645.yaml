  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: REQUEST CHANGES at 4521f5d84a92 (TASK-3963, STORY-2894 S1; strict gate-tier review). The design matches the signed sketch. Generators are pinned from the base and ro-bound over the tip, and a car that changes a generator disables its entry. The bwrap sandbox is offline with one writable mount (the checkout) and clearenv/PYTHONSAFEPATH. The driver runs each entry twice, refuses writes outside the outputs, non-100644 modes and E2 violations, and rolls back. Rust re-checks the report, the sha256 and 100644 mode, stages only the reported paths in a private index, writes one canonical regen commit with no completion ID, and verify_structure re-checks it as the single last commit on the last car. Every refusal leaves the train as built. AC2: approval coverage is unchanged (add_car and patch-ids are untouched). AC3/AC4: determinism, registered paths only, unchanged car patch-ids, the clean-tip no-op and the section-4 refusals all have tests. One blocker: CI is red at this head because the new gate/train_generated.rs lacks the `// mandate-gate` marker and is not classified as a kernel/dispatch/orchestrator. Two gate-floor ratchets fail in CI (fast compile), which also fails Build (ubuntu-latest). Two non-blocking follow-ups: the sketch''s advisor mail on an outside-output refusal, and the PR body''s read_allowlist claim. The base is 2 commits ahead on .github/workflows/ci.yml; no finding depends on those commits.. No triage reason was given.'
