    ## Implementer self-review
    Reviewed HEAD: 1df06dd6599bc217b4f072c85c494af648c96fbf (PR #4808). Reviewed git diff origin/main...HEAD.

    Acceptance evidence:
    - AC1 [behavioral]: REGISTRY rows plus --baseline (scripts/repair-generated.py with_baseline; seat_clone.rs inventory and pinned generators). gate/train_generated.rs: TRAIN_GENERATED, TrainClass, the ratchet tests every_train_entry_matches_its_embedded_registry_row and no_train_output_is_on_the_protected_floor_and_a_config_match_disables_it. Driver train phase. pr_train_regen.rs regen commit with trailers; pr_body_block in train_pr_body; Built.regen (journaled). verify_structure accepts only one trailing regen commit.
    - AC2 [behavioral]: add_car and the patch-id and merge-tree code are unchanged; the existing train test literals only gain regen: None.
    - AC3 [behavioral]: determinism by double run (python test_each_failure_mode_refuses_and_rolls_back, case 'is not deterministic'). Registered paths only: driver refusal, verify_regen, and Rust sha256 and 100644 checks on staged outputs. The cars' patch-ids are untouched, and verify_structure re-proves them before the regen check.
    - AC4 [behavioral]: clean-tip no-op (python test_clean_tip_regeneration_is_a_no_op; Rust the_train_tip_gets_one_regen_commit_and_a_clean_tip_gets_none). Each section-4 failure mode refuses: exit, unregistered write, non-determinism, changed reviewed row, non-blocked new row, protected path (runnable), regen commit touching other paths or with an edited message (verify_regen test).

    Deep-pass findings and fixes: (1) verify_structure did not re-check E2, so I added ledger_check there and in regen_commit. (2) The sandbox ignored [contained] read_allowlist; it now honours it as conflict lanes do. (3) A new ambient PATH read tripped the exec-context ratchet; switched to Environment::capture. (4) The driver's new write site needed a store-writers row, which I regenerated.

