  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3963):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4521f5d84a92
    Recorded: 2026-11-28T11:38:37.799320048+00:00
    Findings:
    1. CI red, caused by this PR: the new gate module aida-cli-lib/src/gate/train_generated.rs fails two gate-floor ratchets in the CI (fast compile) Ratchet set step (job 140945042990, group story_1888_gate_paths). (1) gate::mandate_gates::story_1888_gate_paths_tests::every_floor_source_file_carries_the_marker (story_1888_gate_paths_tests.rs:600) reports 'floor files without a `// mandate-gate` line: ["aida-cli-lib/src/gate/train_generated.rs"]'. (2) every_gate_module_is_a_dispatch_module_a_kernel_or_an_orchestrator (story_1888_gate_paths_tests.rs:3632) reports 'gate/train_generated.rs: in 0 classes'. Build (ubuntu-latest) 'Require every CI lane' then fails because COMPILE=failure. AC1 claims the gate module with its floor ratchets, so the head cannot land. Fix: add the `// mandate-gate` marker line to gate/train_generated.rs and register it in exactly one class (it is pure decision logic, so GATE_KERNELS fits; otherwise the orchestrator inventory with a reason). Do not drop it from GATE_PROTECTED_PATHS. This does not depend on the base's newer ci.yml commits.
    2. Sketch section 4 says that when a generator writes outside its entry's outputs, the refusal also sends an advisor mail naming the path. S1 records the refusal only on the stderr warning, Built.regen_refused (journaled) and the train PR body's aida-train-regeneration-refused: line (pr_train_regen.rs regenerate). The refusal itself works and is tested (task_3963_bwrap_a_generator_writing_outside_its_outputs_refuses). Follow-up: add the advisor mail, or record in the sketch that S1 leaves it out.
    3. The PR body says the regeneration sandbox honours `[contained] read_allowlist`. pr_train_regen.rs toolchain()/sandbox_args bind only the fixed TOOLCHAIN list, the python3/git install prefix and the checkout; no read_allowlist is consulted. The behaviour is the stricter one, so only the PR description is inaccurate. Follow-up: correct the description, or wire the allowlist if it was intended.
