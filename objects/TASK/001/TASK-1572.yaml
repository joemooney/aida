title: Unify aida list's row_parked_lens with the epic child-walking lens attribution (effective_needs_attention_lens_with_source)
description: 'Promised by BUG-1771/PR #2339''s own doc comment on row_parked_lens (git_backend_cmd.rs): the --status shelved/needs-decision filters and the --format json status_lens field deliberately read the ROW''s own parked fields, so an EPIC that is NeedsAttention only via a parked child matches neither lens and carries no lens label — consistent between filter and label, but inconsistent with the child-walking effective_needs_attention_lens_with_source in lib.rs (~:19065). Unify so epics attribute a child''s lens in BOTH the filter and the label, in the same change (filter/label consistency is the invariant to preserve; cross-vendor review of PR #2339 flagged the gap, disposition: documented limit, follow-up here).'
