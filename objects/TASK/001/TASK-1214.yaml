    1. aida-cli-lib/src/history.rs:5160: the #[clap(long, conflicts_with_all = [...])] on HistoryArgs::timeline still lists "events", but the hidden --events field was deleted in this PR. clap's debug_asserts.rs:220 panics with "Argument or group 'events' specified in 'conflicts_with*' for 'timeline' does not exist". That breaks every history invocation and every test that builds the full CLI tree (cli_arg_tree_has_no_definition_conflicts, retired_mode_flags_refuse_and_subcommands_parse, history_positional_spec_id_parses, docs_sweep::*, help_catalog::*, story_1650_history_status_flow, bug_1502_format_json_audit, journey, contracts). Round 3 fixed only the digest list at :4959. Fix: drop "events" from the timeline list, then rg every conflicts_with/requires list in the 8 touched arg structs for any other deleted field name.
    2. AGENTS.md:1-5 and OVERVIEW.md:1-5: the PR prepends a per-change paragraph ('STORY-1028 mode flag aliases are retired...') to both files. CLAUDE.md says per-change notes go in the PR body and an aida comment on the spec, not AGENTS.md/OVERVIEW.md, because each prepended paragraph conflicts with every open PR. Removing aliases is not an architecture change. Revert both hunks; the note already lives in the TASK-1214 comment.
    3. Validation gap: the round-3 commit 330dde83 was pushed with Rust validation untested=true, per the TASK-1214 comment (the graph test job timed out compiling). The new run_graph regression task_1214_bare_graph_and_follow_execute and the regenerated cli_help_snapshot.txt golden have never run green. After fixing finding 1, run the targeted tests (cli::tests::, graph_cmd::tests::task_1214, the help snapshot test, story_1728 policy parity) before pushing so this round does not go out red again.
