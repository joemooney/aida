    REVIEW FINDINGS TO ADDRESS (TASK-1214):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1e32efd38e22
    Recorded: 2026-11-08T00:20:13.876949688+00:00
    Findings:
    1. aida-cli-lib/src/graph_cmd.rs:443 and :484: with no subcommand, the None arm now passes tree=true, i.e. (id, false, false, true, false). handle_graph_command (graph_cmd.rs:68-77) counts tree plus a non-empty --follow as two modes and bails with 'choose at most one graph mode'. So 'aida graph STORY-1 --follow carved-out-to', documented in docs/cli/02-specs.md:73/188 and in the policy TSV row 'graph --follow TASK-1', now always fails. On main the None arm passed tree=false, and handle_graph_command already falls back to tree when no mode is set (graph_cmd.rs:122 else branch). Fix: pass tree=false in both None arms (or tree = follow.is_empty()), and add a regression test that runs 'graph <id> --follow <type>' through run_graph or handle_graph_command. A parse-only test would not catch this.
    2. Cosmetic: aida-cli-lib/src/upgrade_release.rs:1191 resolve_release_bump's error still says 'specify only one of --patch / --minor / --major', naming the retired flags. It is unreachable from the CLI now that the mode is a single subcommand, but the wording should say 'patch / minor / major' (or the arm should be dropped) so the retired spelling does not linger.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
