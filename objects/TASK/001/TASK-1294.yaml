agreed_id: TASK-1294
title: 'Measure whether the round-1 full sweep actually reduced rounds-to-merge: median rounds per spec over the 20 specs after TASK-1291 lands, against the 2026-09-18/19 baseline'
description: |-
  Split out of TASK-1291 by the advisor 2026-09-19, because it is POST-DEPLOYMENT by construction and cannot be an acceptance criterion on the spec that ships the change.

  Question: did requiring an exhaustive first-round reviewer sweep actually reduce the number of rounds a spec takes to merge, or did it only move the cost into a longer first round?

  Baseline, already measured and not to be re-derived: over 2026-09-18 12:00 to 2026-09-19 09:30, 40 shelves across 19 specs — 26 verdict:request-changes, 10 ci-red, 4 tool-exit — with worst tails of five rounds (BUG-1244) and four (TASK-1285, BUG-1265, TASK-1271, BUG-1232). Source: .aida/events.jsonl, SpecShelved events in that window, counted per spec.

  Method (CORRECTED 2026-09-19 — the earlier PrMerged-bound form is wrong and would produce a false null; this correction was previously written only as a comment, which does not bind an implementer, so it is now in the description where it belongs): once TASK-1291 is merged, take the next 20 specs that reach Completed. BOUND THE WINDOW WITH THE STORE, NOT WITH A FEED EVENT. Each spec's Done-to-Completed transition is a real commit in the aida-store branch's git log, which is the authoritative time series for spec state, so use that commit's timestamp as the window's close and the spec's first RunStarted in the feed as its open. Then count SpecShelved events in the feed within that window. DO NOT bound the window with PrMerged. Per BUG-1286, PrMerged is buried by trailing phase events for drain-driven specs and is absent entirely for specs closed outside a drain, so exactly one closed spec in the entire recorded history ends on it. An implementer following the old form would measure a window that closes for roughly one spec in five hundred, produce a null result for mechanical reasons, and report it honestly as a null — which this spec's acceptance permits. That is the worst available outcome: a correct-looking negative finding about TASK-1291's value, caused by a measurement bug rather than by the change being ineffective. If the store-bound window cannot be built for some spec, say so and exclude it by name rather than substituting a feed event. Report median and distribution against the baseline, and split the shelve causes the same three ways, since a drop in verdict:request-changes with ci-red unchanged is the specific effect this change predicts. Note the confound honestly: TASK-1289 (pre-flight guards) and TASK-1290 (criteria gate) target the other two categories and may land inside the same window, so attribute by CAUSE rather than by total, and say so if the windows overlap.

  Acceptance: a dated report comment on this spec giving median rounds-to-merge before and after with the per-cause split, the spec ids in the sample, and an explicit statement of which other changes landed inside the measurement window. A null or negative result is a valid outcome and must be reported as such rather than re-cut until it looks positive.

  Convention this exists to honour: an acceptance criterion that can only be measured after shipping belongs on a follow-up spec, never on the spec that ships the change.

  SAMPLE MATURITY AND HETEROGENEITY, added 2026-09-20 — the precondition is now MET and a new confound has appeared that matters more than the original one.

  THE SAMPLE IS RIPE. TASK-1291 merged 2026-09-19T20:07:33Z and 25 specs have merged since, against the 20 this measurement requires. The earlier blocker — dispatched before its sample existed, six merges against twenty — has expired. That was the honest reason this could not run and it no longer applies.

  BUT THE 25 ARE NOT ONE POPULATION, and a single median across them would be a number without a meaning. Three things changed inside the window and they push in different directions:

    TASK-1291  should REDUCE rounds — round 1 became an exhaustive sweep rather than one finding at a time
    TASK-1290  should reduce them further — untraced criteria now reach the reviewer's first round
    BUG-1277   changed how reworks are QUEUED mid-window, so the mechanism being measured moved during the measurement

  And several specs in the sample were implemented by parallel lanes rather than by the drain. Those never passed through `queue done`, their rounds were gated by the advisor rather than by an orchestrator reviewer, and some were merged at the gate without a reviewer phase at all. They are a different process being measured by the same ruler.

  ADDITIONAL ACCEPTANCE
  11. Report the per-cause split as the primary result, not the median. The causes were the point when this was filed and they are more so now, because a total conflates three changes that should move rounds in different directions.
  12. Report lane-driven specs as a SEPARATE population from drain-driven ones, named individually. Do not let them dilute the drain figures, and do not silently exclude them either — a reader needs to know how many there were and that they were governed differently.
  13. State which of the three in-window changes each measured spec was exposed to. A spec that merged before TASK-1290 landed cannot show its effect, and treating the window as uniform would attribute to one change what belongs to another or to none.
  14. If the per-cause split is too thin to support a conclusion once it is partitioned this way, SAY SO and report the counts. A partitioned sample of 25 may simply be too small, and reporting that honestly is a real result — it tells us what a later measurement needs rather than manufacturing a finding from a sample that cannot carry one.

  Heterogeneity analysis contributed by the product seat; the maturity figures verified against the store's own history.
