title: 'Draft-landed auto-bump follow-ups: bidirectional sweep counts, one-time affected-spec count, and a reopen guard'
description: |-
  Follow-ups split from BUG-1506 (proxy decision 2026-09-22). (1) BUG-1506 AC3: the BUG-1454 sweep runs in both directions and reports both counts (Completed-with-open-PR, and pre-Done-with-merged-trailer). (2) AC4: measure and record the pre-Done-with-merged-trailer count once. (3) Reopen guard: a spec deliberately reopened to Draft must not be flipped back to Done when pull runs with pre_sha=None. It needs its own field; reusing completion_sha would block the legitimate Done->Completed bump.

  ## Acceptance
  1. aida db reconcile-status (or the sweep) prints both directional counts.
  2. The one-time count is recorded in a spec comment with date and population.
  3. A test: a spec reopened to Draft after its trailered commit landed stays Draft on the next pull.
