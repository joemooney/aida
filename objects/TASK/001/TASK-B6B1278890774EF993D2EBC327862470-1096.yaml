title: 'Landing metrics: merges per hour, READY wait and review rounds per PR (track B1)'
description: |
  Track B1 of the landing-path decision (2026-11-16). We cannot tell whether landing or review-round changes help without numbers. STORY-2868 A3 accepts the landing driver by these numbers.

  Amended 2026-11-17 00:35 by product after the implementer's design-fork punt. The first version required no new recording, but READY history is not retained anywhere: now.json is overwritten each pass, train journals are deleted when they reach a terminal state, and the gate ledger has no READY transitions. So this task records READY from now on and labels anything older as approximate.

  Acceptance:
  1. Record: each `aida land status` / `aida land run` pass (dry-run included) appends a line to an append-only event log whenever a change's readiness flips, with the PR, head SHA, old and new state, and timestamp. Unchanged state appends nothing. The writer is registered in scripts/store-writers.toml.
  2. Report: one command (for example `aida land metrics --since 7d`) prints, for a window: merges per hour (git history of main); for each hour in which a PR was READY, whether at least one merge happened; the longest READY-to-merge wait and the PRs waiting over 2h; mean and median review rounds per landed PR (REQUEST CHANGES verdicts before the approving one, from verdict history), by vendor and spec type.
  3. Any part of the window before recording began uses approval time as an approximation of READY time, and the output marks those numbers "approx (no READY record)". The two kinds are never mixed silently.
  4. `--format json` emits the same numbers plus a source field per metric.
  5. Tests: a fixture event log with known READY intervals, merges and verdict rounds gives each number exactly; readiness unchanged across passes writes no event; a window that straddles the recording start marks the earlier part approximate.
  6. A pass of land status/run gets no more than 1 second slower from recording.
