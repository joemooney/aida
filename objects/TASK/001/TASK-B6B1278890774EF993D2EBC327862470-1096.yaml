title: 'Landing metrics: merges per hour, READY wait and review rounds per PR (track B1)'
description: |
  Track B1 of the landing-path decision (2026-11-16). We cannot tell whether landing or review-round changes help without numbers. Add a read-only metrics command over existing data (verdict history, gate ledger, git history of main, train journals). No new recording.

  Acceptance:
  1. One command (for example `aida land metrics --since 7d`) prints, for a window: merges per hour; for each hour in which a PR was READY, whether at least one merge happened; the longest READY-to-merge wait and the PRs waiting over 2h; mean and median review rounds (REQUEST CHANGES verdicts before the approving one) per landed PR, broken down by vendor and spec type.
  2. `--format json` emits the same numbers for scripts.
  3. Tests build a fixture history with known merges, READY intervals and verdict rounds, and assert each number exactly.
  4. The output names the data source of each number, so a wrong number can be traced.
  5. Runs in under 30 seconds on the live aida store.
