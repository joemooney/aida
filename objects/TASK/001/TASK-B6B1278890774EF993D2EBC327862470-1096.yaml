  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: Acceptance requires exact historical READY hours and READY-to-merge waits with no new recording, but the named sources do not retain the required state. land::derive (aida-cli-lib/src/land.rs) depends on historical conflict, live reviewing ownership, CI, approval, and hold observations. gate/ledger/event.rs records verdict/hold/carry-over/freshness events, not READY transitions or complete historical CI/conflict/ownership. now.rs:459-471 replaces the sole .aida/cache/now.json snapshot every pass. pr_train_journal.rs:110-115 and 146-148 delete terminal journals and step clocks. Approval time therefore cannot truthfully substitute for READY time; historical READY intervals are not identifiable. Decide whether to permit unavailable/explicitly estimated READY metrics in a read-only first slice, or authorize retained observations for future windows. No implementation or publication declaration made.. No triage reason was given.'
