title: 'Standalone reviewer hardening: key coexistence on explicit --role reviewer plus backing spec; open verdict files O_NOFOLLOW|O_NONBLOCK; bound the FIFO test'
description: |-
  Follow-ups from #2680 (BUG-2149/2150) round 2, approved. The advisor accepts deferring these:
  1. Step-2 coexistence keys on the RESOLVED reviewer role, not the explicit --role reviewer flag plus the backing spec, as signed. It is low risk today (an inferred reviewer only arises for PR-scoped pickups with a review target), but it should match the signed condition: plumb the explicit flag and backing spec into the lease check.
  2. TOCTOU between symlink_metadata and read_to_string: open the candidate with O_NOFOLLOW|O_NONBLOCK and check the file type on the open handle.
  3. The fifo_symlink_verdict test hangs on regression; bound it with a timeout or watchdog so a regression fails instead of stalling CI.
  4. Optional: add a ctime check alongside mtime freshness (condition (a) said mtime/ctime).
