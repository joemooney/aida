title: aida-handoff Step 1 should run /aida-capture (incl. FAQ lens), not sweep mentally
description: |
  `aida-core/templates/skills/aida-handoff.md` Step 1 says "Run the `/aida-capture` sweep mentally". As a result, a handoff never actually runs the capture skill or its FAQ lens (STORY-1643). Relay sessions write a handoff at the end of every session, so FAQs, missed requirements and decisions from those sessions go uncaptured unless someone remembers to run capture.

  Evidence (2026-10-12 advisor session): four FAQs were filed by hand without the FAQ-11 convention and had to be rewritten (FAQ-51..54). Running `/aida-capture` afterwards found two more (FAQ-55, FAQ-56) and a correction to DOC-7.

  ## Change
  - Step 1: invoke `/aida-capture` (follow its workflow, including the FAQ lens and its autonomy-mode rules) instead of doing the sweep "mentally". Keep the three residue bullets as the minimum checklist.
  - Headless: capture's own rules already apply (draft, plus `faq:unvetted` for FAQs). No prompt.
  - Edit the template master only, then `make sync-templates` and `make check-templates`.

  ## Acceptance
  - aida-handoff Step 1 names `/aida-capture` as a step that runs, not a mental sweep.
  - Mirrors are regenerated, and `make check-templates` and `make check-ci-fast` are green.
