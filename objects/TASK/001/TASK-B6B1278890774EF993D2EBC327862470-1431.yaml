  review_watch.rs:928 and :1690. The doctor finding reads a cached display string without checking whether its hold survives. In particular, --release clears attempts and leaves skipped intact, so a released hold continues to emit a stalled-reviews finding and can fail the scheduled check until a later watcher pass. Tie the diagnostic to the current held receipt and its head, and cover clearing after release.
