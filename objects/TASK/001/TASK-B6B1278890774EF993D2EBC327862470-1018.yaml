  content: 'Advisor 2026-11-09: test-time-budget is ejecting trains on noise. PR #3731 ejected at 11.7s vs the 10s unbudgeted limit with all 8077 tests passing; PR #3732''s train had a 10.4s overrun and #3639 failed the same step repeatedly. Touched files get no tolerance, while untouched tests get 15s. Proposal: apply the same tolerance to touched tests so a train is never ejected for a sub-2s overrun, or make the budget a warning for train runs.'
