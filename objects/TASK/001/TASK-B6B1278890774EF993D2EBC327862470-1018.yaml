title: 'PR CI: 53% of decided runs fail and 42% of all runs are cancelled; job runtime has doubled since Oct 31'
description: 'Measured 2026-11-08 over 926 PR runs since Nov 6: 272/517 decided runs failed, 388 cancelled, 6.4 runs per branch. Main run wall time 12 min on Oct 31, 20-36 min on Nov 8; 12-21 runs queued with 1-3 running gave about 73 minutes per run for PRs. Of 60 sampled failures, gates ratchets that check-ci-fast should catch locally were the largest avoidable group (store writers 13, portability 9, CLI manual 7, ExecContext 5). Investigate job growth; STORY-2640 addresses local gate escape; STORY-2672 addresses runner capacity.'
