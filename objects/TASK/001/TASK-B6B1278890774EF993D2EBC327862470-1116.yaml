- id: 01a20a22-8dcc-7a22-a13f-6488a5205cb0
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3155):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 886764893671
    Recorded: 2026-11-23T17:23:10.843581420+00:00
    Findings:
    1. TASK-b6b1278890774ef993d2ebc327862470-1116.ac26a714 — aida-cli-lib/src/lane_disk_deferral.rs:66-76: Splitting the entire note and dropping whitespace-only segments changes unrelated text. For example, an existing note 'ops ·  · later' becomes 'ops · later' after stripping the new marker. Preserve the unrelated note bytes while replacing a recognized marker and cover a note with consecutive separators.
    2. TASK-b6b1278890774ef993d2ebc327862470-1116.ac26a714 — aida-core/src/db/git_backend.rs:3364-3367: The update resolves an already-discovered persisted owner as an alias again. With two existing queue files whose owners are subsequently linked, resolve_queue_user returns the first alias match it encounters (lines 435-452), even when the exact named file comes later. Both iterations can update the first file and miss the matching row in the second. Carry the exact file identity through the locked update and exercise persisted alias sibling queues.
    3. TASK-b6b1278890774ef993d2ebc327862470-1116.acedb911 — aida-cli-lib/src/lane_disk_deferral.rs:174-198: The regression applies the edit and removal after discovering owner names, before annotation reads any queue row. A regression that lists the current rows inside annotate_selected, then writes those snapshots back with queue_add, would still pass every assertion. Make the fixture contend at the row read/write boundary and demonstrate that an unlocked snapshot/upsert path fails while the current edit survives and the removed row remains absent.
    4. aida-cli-lib/src/lane_disk_deferral.rs:92-109 and aida-core/src/db/git_backend.rs:3364: A requirement with no row now goes through the write preflight and lock for every unrelated queue. When store writes are unsafe or the lock cannot be acquired, defer reports that the requirement 'stays queued' even though it has no queue row. Avoid write admission for unrelated queues while retaining the locked re-read for any actual update.
    5. scripts/store-writers.toml:2737-2739 and 2828-2829: The new entries say 'caller-owned' locking even though the Git backend acquires the store lock and the SQLite backend opens its own immediate transaction. The scanner also drops the outgoing annotation/facade caller sites because its queue writer vocabulary excludes queue_update_notes. Inventory the new facade calls and record the actual backend lock and refusal conditions.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-23T20:39:26.412150166Z
  modified_at: 2026-11-23T20:39:26.412150166Z
