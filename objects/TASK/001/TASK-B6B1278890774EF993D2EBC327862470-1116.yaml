description: |
  From BUG-2684
  Reviewed sha: bbb5fb3a75048a9c4b4363d1b44b019c942c8ae3

  [P2] lane_disk_deferral.rs:86-92: snapshot-then-queue_add can overwrite a concurrent queue edit. Deferred; noted on BUG-2684.

  ## Acceptance
  1. Make disk-floor annotation update the current queue entry's note while preserving its order, owner, routing, and any unrelated note text added by another writer. Replace the prior disk-floor marker if present.
  2. Add a deterministic regression for an interleaved edit and removal. The edit survives annotation, and a removed row stays absent. Requirements without an existing queue entry acquire none.
