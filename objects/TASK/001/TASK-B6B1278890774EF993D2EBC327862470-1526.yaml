    Scope: Parked type + parked/park(unpark) in pr_train_journal.rs; parked_recovery/park_recovery/parked_line in pr_train.rs; parked predicate + token ticket in acquire_mode, resume_train, yield_reason_before in admission_owner.rs; parked line in train-status (JSON parked_recovery + text) and pr train --check (text admission: line).
