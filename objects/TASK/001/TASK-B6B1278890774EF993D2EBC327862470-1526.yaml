title: 'Auto-train recovery is a resumable step: persist state, release run lock + admission before an external wait, re-acquire and re-validate (BUG-2774 AC1)'
description: |
  Split from BUG-2774 AC1 (advisor-122 2026-11-26 10:40; filed by product-15). BUG-2774 shipped reporting only (#4667). Its lane left AC1 undone: "the recovery's train run lock makes a plain release refuse review-watch's join; it needs an admission design decision". STRICT: a SKETCH with advisor signoff comes BEFORE any code.

  DIRECTION (binding): recovery becomes a RESUMABLE step. Before waiting on any external or deputy job it
  (a) persists its recovery state (train id, step, expected main tip);
  (b) releases BOTH the train run lock and admission;
  (c) waits outside the locks with a bounded deadline;
  (d) re-acquires through normal admission (no queue jumping, but it keeps its fairness position as with BUG-2771) and RE-VALIDATES the main tip, the train PR state and the members' heads.
  On any drift it abandons that recovery step and recomputes; it never resumes blind.

  ## Acceptance
  - AC1: a SKETCH comment, signed off by the advisor, naming the state file, the functions, and exactly what a concurrent review-watch join or a manual train may do in the gap, with a proof that each is safe.
  - AC2: an implementation of (a)-(d) per the sketch.
  - AC3: tests: a deputy job blocks for longer than the deadline and review-watch admits work meanwhile; main moves during the wait → recompute; a member head moves → recompute; recovery keeps its fairness position.
