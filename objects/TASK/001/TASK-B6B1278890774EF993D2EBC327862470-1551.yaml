    DEFERRED (#4728 approval @a4f7da72, final, 2026-11-26; product-15):
    - Waiter identity is (exact PR list, parent-process identity) (admission_owner.rs queued_train_admission `mine`, retrier()). A retry of the same train from a DIFFERENT parent (another terminal, a deputy-submitted script, or the same PRs in a different order) counts as a new waiter and is refused "queued behind" its own earlier waiter until that parent exits or the 15-min TTL ends. Follow-up: key waiter identity on the normalized (sorted) PR set, and let an identical retry adopt its own waiter.
    - AC1 says a recycled pid releases the waiter, but the tests cover only an exited child; add a same-pid, different-start-time (forged start time) owner case.
