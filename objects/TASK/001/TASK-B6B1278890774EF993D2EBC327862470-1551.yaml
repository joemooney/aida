title: 'Manual-train waiters: release on process exit, a FIFO queue where admission clears only its own waiter, status/--check line tests (BUG-2771 follow-up)'
description: |
  BINDING follow-up to BUG-2771 (advisor-122 2026-11-26 20:28; filed by product-15). #4711 lands with these deferred. Worst case today: an abandoned manual-train waiter pauses the auto-train for up to WAITER_TTL (15 min), and a second waiter can be lost.

  ## Acceptance
  - AC1: release a manual-train waiter when its manual train PROCESS EXITS (record pid + start time; a dead or recycled pid releases it), plus an explicit release command surfaced in `aida advisor loops train-status` (which also names the waiter file and its expiry).
  - AC2: a FIFO waiter QUEUE (not a single slot): each manual train that gives up enqueues itself; admission clears ONLY the waiter it admits; the auto-train yields while any live waiter is queued.
  - AC3: tests asserting the waiter line in `aida advisor loops train-status` (status_lines) and in `aida pr train --check` text/JSON (check_report); pid exit releases; two waiters are both kept and admitted in order.
