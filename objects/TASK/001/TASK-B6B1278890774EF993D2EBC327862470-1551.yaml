- id: 01a21baf-ca6c-71a1-b166-b0180b0ef7e3
  author: joe
  content: 'ADVISOR RULING (2026-11-26 23:33) on the #4728 deferrals: LAND. (a) The self-block (the same PR set from another terminal or deputy queues behind its own earlier waiter, up to the TTL) is a papercut, not a correctness issue: Joe''s /tmp/train loop retries from one parent, so its own retries match. Follow-up: identity = the sorted PR set (order-insensitive), and a waiter whose parent is alive but whose PR set equals the new request is ADOPTED rather than queued behind. (b) Follow-up: the recycled-pid/different-start-time test. Both go in the next slice; not blocking.'
