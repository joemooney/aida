  content: 'Dry-run census against the live store, 2026-09-24, from ''aida db migrate-related-edges --dry-run'' on branch claude/task-1426. Nothing was written and the store HEAD did not move. Found 158 legacy custom related edges on 100 specs (related: 140, related-to: 17, relates-to: 1) out of 4404 specs scanned. Plan: convert 144 to References (orphans), delete 14 where a References edge to the same target already exists (twins), and delete 0 repeats of a converted edge. The 14 twins are on the same 11 specs the spec names: BUG-1443, BUG-1445, BUG-1450, BUG-1452, BUG-1453, BUG-1454, BUG-1461, BUG-1462, BUG-1465, STORY-1133 and TASK-1293. Out of scope and untouched: implements/implemented-by (681/680), sprint_assignment/sprint_contains (13/13), depends-on (1), duplicate-of (1). There is one pre-existing duplicate edge in the store, a doubled Child edge on STORY-511. It is not on any spec this migration touches, so it does not block the run. The migration refuses before writing if a spec it would touch holds a duplicate of any edge type.'
