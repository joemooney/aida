title: Harden the raw-home-lookup ratchet and route the last unrouted site
description: |
  Follow-up from the TASK-1513 independent review (non-blocking notes 1, 2 and 4).

  TASK-1513 added a source-scan ratchet that keeps new raw home lookups out of `aida-core/src` and `aida-cli-lib/src`. The reviewer confirmed the scan is NOT vacuous (95 + 534 files scanned, 0 offenders) but found several ways a future author can reintroduce the gap without the scan noticing. None is a fence leak today; all are ratchet-completeness gaps.

  Acceptance criteria:

  1. `std::env::home_dir()` is detected. It is un-deprecated and warning-free on rustc 1.92, and the current needle is the literal `dirs::home_dir`, which `std::env::home_dir` does not contain — a silent miss today. Add it to the needle list, with a test proving a file containing it is reported as an offender.
  2. The scan tolerates multi-line splits. It is line-based, so `std::env::var_os(\n "HOME"\n)` slips past. Either normalize whitespace before matching or scan tokens; prove it with a fixture using the split form.
  3. The self-exemption is path-based, not name-based. `p.ends_with("home.rs")` / `ends_with("test_home.rs")` matches on whole path components, so a NEW file named `home.rs` anywhere under the scanned trees is silently exempt. Compare against the exact manifest-relative path (e.g. `manifest_dir.join("src/home.rs")`), and add a test that a decoy `src/foo/home.rs` containing a raw lookup IS reported.
  4. The scan covers the remaining workspace members: `aida-server`, `aida-tui`, `aida-cli`, `aida-crate`, `aida-generate-types`, plus `build.rs` files and `*/tests/` trees. Today the only offender in that blind spot is `aida-server/src/main.rs:302`.
  5. `aida-server/src/main.rs:302` is routed through `aida_core::home::home_dir()`. It is the last raw `dirs::home_dir()` in the workspace. The reviewer judged leaving it is acceptable for correctness (no `tests/` dir in that crate, so no fence exposure, and identical behavior on unix) — this is for consistency and to let the widened scan pass.
  6. Layer 2 (`assert_hermetic`) covers `config_dir`, not just `home_dir`. `aida_core::home::config_dir()` at `scaffold_cmd.rs:400` and `remote_create.rs:879` never passes through `assert_hermetic`. Layer 1's env redirect covers it so there is no leak today, but the "refuse at the source" property should not be home-only.

  Out of scope: changing the resolver's precedence, and the Windows/MSYS2 behavior change (separate follow-up).
