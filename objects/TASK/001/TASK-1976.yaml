title: 'TASK-1752 grant-env guard: env-read detector misses split, aliased and vars() reads'
description: |
  `is_env_read` in aida-cli-lib/src/tests/task_1752_grant_env_guard_tests.rs:164-167 flags a read only when `env::var(`/`env::var_os(` and `GRANT_ENV` sit on the SAME line. These do not trip it:
  - a rustfmt-split call: `std::env::var(\n    crate::seat_authority::GRANT_ENV,\n)` (rustfmt splits this once the line passes 100 columns)
  - an alias: `use crate::seat_authority::GRANT_ENV as G; std::env::var(G)`, or `let k = seat_authority::GRANT_ENV; std::env::var(k)`
  - iteration: `std::env::vars().find(|(k, _)| k == GRANT_ENV)`
  The literal ban (`AIDA_SESSION_GRANT` named outside seat_authority.rs) is robust. Only the "reads GRANT_ENV directly" half is heuristic. Why it matters: TASK-1752 exists so that a third grant validator can't appear unnoticed, and a split read is the likeliest way one would. Suggested fix: match over the whitespace-normalised file text (join the production lines, collapse whitespace), and/or ban `GRANT_ENV` outside `.env(`/`.env_remove(`/`EnvVarsGuard` contexts. Add a self-test fixture for the split form.

  Raised in review of PR-2763: https://github.com/joemooney/aida/pull/2763
