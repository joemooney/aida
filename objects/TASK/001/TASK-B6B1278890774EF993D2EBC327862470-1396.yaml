title: 'Bounded ContainedChild teardown via explicit close(): deadline over TempDir + mutation Session cleanup, recovery record under the state dir, typed error (TASK-3884 split)'
description: |
  Split from #4538 TASK-3884 r2 (advisor-122 ruling 2026-11-24 20:18; filed by product-15). STRICT, drive. Prereq hardening for STORY-3080.

  ## Acceptance
  - AC1: ContainedChild teardown is BOUNDED through an explicit close() (not Drop): the TempDir recursive cleanup and the optional mutation Session teardown run under one deadline; past it, a RECOVERY RECORD is written under the AIDA state dir (not env temp_dir) with a bounded write.
  - AC2: close() returns a TYPED ERROR when the recovery record cannot be written (and logs it); Drop only falls back to best-effort and never silently loses the recovery item. Test: a stuck child, the caller returns within the deadline and the recovery is recorded; an unwritable state dir gives the typed error.
