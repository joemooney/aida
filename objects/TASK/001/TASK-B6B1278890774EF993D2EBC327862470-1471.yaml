title: 'Review follow-up: PassClaim::decide''s staleness recheck (aida-cli-lib/src/review_watch.rs, decide) compares '
description: |-
  From BUG-2765
  Reviewed sha: 6657fe56512ef5c5774381433b10bfe2c18168d9

  PassClaim::decide's staleness recheck (aida-cli-lib/src/review_watch.rs, decide) compares only current.head and current.base, and forge::Change.base is the base branch name, not a SHA. The base probe (repo.probe: overlap/behind/conflict) now runs without the claim, so a land can move main between the probe and the dispatch decision, and decide() does not notice. Before this PR the pass held admission, so no land could happen between probe and decision. Effect: Notify/Dispatch can rest on stale base evidence for up to the snapshot TTL. This is self-correcting: the next pass re-probes, and the launched reviewer pins the protected base at launch. Follow-up: carry the probed base SHA in the snapshot and compare it in decide(), or re-probe when the protected base tip has moved.
