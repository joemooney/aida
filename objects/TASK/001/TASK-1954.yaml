  content: |
    Advisor triage 2026-10-19: further items rolled into this sweep (full text below; each original is superseded by this sweep).

    ### BUG-2129: usage telemetry logs any command invoked with a leading global flag (aida --format toon show X) as <root>, hiding it from per-command latency budgets
    Found while writing BUG-1993's phase-timing test. `usage::derive_cmd_shape` (aida-cli-lib/src/usage.rs) stops at the first token starting with `-`. So any invocation that puts a global flag BEFORE the subcommand, such as `aida --format toon show BUG-1`, is logged with cmd `<root>` instead of `show`.

    Impact: those calls disappear from the per-command latency and error stats, including `aida doctor check performance` show budget, which reads `usage.jsonl` by cmd. Observed: `{"cmd":"<root>","args_count":4,...}` for `aida --format toon show BUG-1`.

    Fix sketch: skip known global flags, and their value when the flag takes one (`--format <v>`, and any other `global = true` options in cli.rs), before capturing the subcommand path. Keep it cheap, because the statusline logs on a hot path. Add a unit test for `--format toon show X` resolving to `show`.

    ## Acceptance
    - `derive_cmd_shape(["aida","--format","toon","show","BUG-1"])` returns `show`, and the same holds for every other value-taking global flag.
    - A bare `aida --version` / `aida` still returns `<root>`.
