title: Document why aida pr ship does not auto-rebase
description: |-
  Add a section to docs/git-workflow.md explaining why aida pr ship does not auto-rebase stale branches: rebasing invalidates the green CI check (new SHAs), squash-merge rarely needs a rebase, and the no-surprises working-tree rule. Note the autonomous orchestrator exception (STORY-429).

  ## Acceptance
  - docs/git-workflow.md has a section covering the CI invalidation penalty, squash-merge behavior, the no-surprises rule, and the --auto-complete orchestrator exception.
