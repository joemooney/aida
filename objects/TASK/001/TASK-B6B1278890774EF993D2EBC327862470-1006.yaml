- id: 01a1bd53-8a31-7b00-878d-29be78ff3767
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3608):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 30b86ebdc427
    Recorded: 2026-11-08T21:52:06.937396248+00:00
    Findings:
    1. Required coverage gap: no test drives RealPhaseDriver::resume_implementer with a receipt (phase_driver_trait.rs:3426,3480), and no test covers a fresh no-change seat with an existing open PR (native_pr Found at phase_driver_trait.rs:888,999). task_3608_fresh_and_resumed_no_change_reach_batch_classification only returns a mocked ImplStep::NoChange for the resumed case, and task_3608_resumed_existing_pr_still_ships uses mocked ImplStep::Pr, so it would pass with this PR production code removed. TASK-3608 asks for fresh and resumed tests that reach final classification and keep the existing PR path intact. The new resume routing through run_queue_resume_to_exit, including the contained flag changing from false to self.contained, is also unexercised.
    2. Required precedence is untested: no test has a receipt present with a failed exit or watchdog failure, a punt signal, or a hold signal (including the new resume hold branch at phase_driver_trait.rs:3430). publish_queue_exit receipt writing is never exercised either: task_3608_host_no_change_survives_lease_discovery hand-writes the hex path, so clean_exit=false writing no receipt, the writer/reader key agreement, and the new dirty-tree bail (ship_from_seat.rs:597) have no coverage.
    3. Resume publication failures are misclassified: run_queue_resume_to_exit now publishes inside the closure whose error is mapped at phase_driver_trait.rs:3369 to FailureKind::Spawn with could not resume the implementer session. A resumed child that ran and then hit a publish or bundle failure reports a false spawn failure and takes the non-shelving hard-fail exit 3 path. On the fresh path the same publish error is a child exit that falls through to substrate classification.
    4. Resumed lookup can report NoChange during a forge error: at phase_driver_trait.rs:3445-3453 the branch fallback maps every non-Found ChangeLookup to None, and :3480 now turns None into NoChange. If the spec search returns NoOpenPr and the branch lookup is unreachable or errors, an existing PR is reported as no-change with exit 0. The fresh path keeps transient lookups distinct through Phase1PrResolve. Only a confirmed empty branch lookup should yield NoChange; transient results should stay Inconclusive.
    5. Minor: receipts are only consumed by the drain, but standalone_implementer.rs:1170 and queue_cmd.rs:14179 also call publish_queue_exit and discard the outcome. Every standalone or explicit-resume no-change lane therefore leaves a permanent file in .aida/native-no-change/, with no pruning. Write the receipt only for the drain callers, or remove it when the lease ends.
    6. Minor: both NoChange returns (phase_driver_trait.rs:894,1122 and :3480) reach finish_no_change without end_implementer_session, so a seat with nothing to preserve keeps its lease and seat clone until a later reap. Whether this blocks an immediate re-drain was not verified. End the session, or document that the lease is deliberately retained as it is for punt and hold.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
