  rework_worktree_inventory decodes the entire NUL-delimited inventory as UTF-8. inspect_queue_work_branch now uses it for ordinary branch pickups too. One unrelated worktree with a non-UTF-8 pathname blocks pickups on every other branch. Parse the records as bytes, preserve pathname bytes with OsStr, and scope any refusal to relevant evidence. Add a case with a non-UTF-8 worktree on an unrelated branch.
