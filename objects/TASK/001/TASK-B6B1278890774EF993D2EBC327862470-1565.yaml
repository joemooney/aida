title: 'Review follow-up: aida-cli-lib/src/lane_salvage.rs guarded_push (about lines 375-405): a salvage onto an ope'
description: |-
  From BUG-2781
  Reviewed sha: 654544da3f9f922cbc67b344a85adfb760a64c26

  aida-cli-lib/src/lane_salvage.rs guarded_push (about lines 375-405): a salvage onto an open PR's branch does not apply the BUG-2596 red fast-gate veto (crate::lane_fast_gate::refuse_failed_gate) that ship --from-seat runs before publishing (ship_from_seat.rs:2147). Scenario: a lane's fast-gate receipt for the branch reads `fail`, the lane commits a further change and is then SIGTERMed. The salvage fast-forwards the PR head onto a head with a recorded red gate, where normal publication would refuse it. Impact is limited: the head is announced 'salvaged, unverified', it is not train-eligible until fresh CI and an independent review at that head, and the self-publishing seat could have pushed it itself under AC2. Suggested follow-up: when the receipt is `fail`, fall back to salvage/<lane> as the PR-head-guard refusal does, and add a test for it.
