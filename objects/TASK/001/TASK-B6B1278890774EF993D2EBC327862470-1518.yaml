title: 'Review follow-up: Merged/closed detection is GitHub-only and degrades silently: review_commands.rs:3609 call'
description: |-
  From BUG-2738
  Reviewed sha: 5a1122ae5b2334814944b81c225392581cc5ccb4

  Merged/closed detection is GitHub-only and degrades silently: review_commands.rs:3609 calls forge::github_pr_state (raw `gh pr view`) rather than the forge abstraction (forge::forge_for(root).change_metadata, used by the stranded sweep). On a GitLab-forge clone, or in a contained reviewer seat where gh/network is unavailable, pr_state is None and a Done spec whose PR already merged is still shelved to NeedsAttention -- exactly the BUG-2728 shape. Fail-closed to today's behaviour, so not a regression; follow up by routing through forge_for and/or noting the degraded case in output.
