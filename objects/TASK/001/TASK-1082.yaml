title: 'did-you-mean: suggest nearest existing spec id when show/edit hits ''not found'''
description: 'Surfaced by a wrong-usage error-path UX self-test (2026-07-01). When a user typos a spec id (e.g. TASK-11 instead of TASK-1, or a transposed prefix), aida show/edit/queue-work returns "Requirement not found: <id>" plus a generic "help: aida list" hint. Good, but a fuzzy did-you-mean against existing ids (Levenshtein/prefix match over the cache id set, threshold ~1-2 edits) would close the loop the way clhelp already does for subcommand typos ("some similar subcommands exist: list, lint"). On-brand quiet-depth polish; low priority. Scope: cache already holds all ids, so it is a cheap nearest-match over that set at the not-found branch. Verified NOT a false alarm: the "not found" path is a real branch, exit code is correctly 1. Everything else in the error-path audit was solid (invalid status/type/priority all enumerate valid values, exit codes correct) — this is the one gap.'
