  content: |-
    ## Implementer self-review
    Reviewed HEAD: 7ba7fc3512 (git diff origin/main...HEAD, 3 files +114/-3).

    Acceptance evidence:
    - AC1 [behavioral-test]: lane_salvage.rs guarded_push checks crate::lane_fast_gate::failed_receipt(main, branch) before the BUG-2618 PR head guard. A red receipt sends the push to salvage/<lane>. The reason "PR #N head not moved: red fast-gate receipt .aida/fast-gates/<hash>.json for <branch> reads fail" goes into pr_refused, so the lane note, attempt record and spec/PR announcement all name it. push_fast_forward (the no-force ff check) is unchanged.
    - AC2 [behavioral-test, real-git fixture]: bug_3928_red_fast_gate_receipt_salvages_to_the_salvage_ref: the PR branch stays at its old head, salvage/<lane> is at the tip, and the note and announcement name the receipt. bug_3928_green_or_absent_receipt_fast_forwards_the_pr_branch covers both the pass and absent cases. Lane job: 23 passed, 0 failed (bug_2781 + bug_3928 filters). make check-ci-fast exited 0 (47 fast gates).

    Probes: (1) The receipt is keyed on the lease branch, the same key that ship --from-seat's refuse_failed_gate uses. (4) A corrupt receipt is treated as red. (5) Fail-closed: an unreadable or corrupt receipt counts as red and goes to the salvage ref, never the PR branch. The refusal path is tested. No test was weakened. The no-PR path already targeted salvage/<lane> and is unchanged.
    Residual risks: for an unreadable receipt the note still says "reads fail" (a wording imprecision only). The diff is 114 lines against a budget of about 100; 73 of those lines are tests.
