  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - AC1 [behavioral-test]: `lane_salvage::guarded_push` reads the branch's fast-gate receipt (new `lane_fast_gate::failed_receipt`) before the PR head guard. A `fail` receipt, or one it cannot read (fail-closed), routes the push to `salvage/<lane>`; the note/announcement says `PR #N head not moved: fast-gate receipt .aida/fast-gates/<hash>.json for <branch> reads fail`. No-force fast-forward check unchanged.
    - AC2 [behavioral-test, fixture layer, real git]: `bug_3928_red_fast_gate_receipt_salvages_to_the_salvage_ref` (PR branch untouched, salvage ref at tip, note names the receipt) and `bug_3928_green_or_absent_receipt_fast_forwards_the_pr_branch` in tests/bug_2781_lane_salvage_tests.rs.

    ### Expected files
    - aida-cli-lib/src/lane_salvage.rs
    - aida-cli-lib/src/lane_fast_gate.rs (reader + cfg(test) receipt setter)
    - aida-cli-lib/src/tests/bug_2781_lane_salvage_tests.rs

    ### Ambiguities / conflicts as questions
    - None (a red receipt with no open PR already targets salvage/<lane>; unchanged).
