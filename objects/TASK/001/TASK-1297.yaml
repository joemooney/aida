title: 'A --batch drain must report what it SKIPPED, not only what it drained: the launcher drove a batch of three while sixteen approved specs routed to the same role sat invisible for hours'
description: |-
  Observed 2026-09-19 by the product seat. This is the answer to why throughput sat near one spec per hour, and it was neither the implementer nor CI.

  The standing launcher was relaunching `queue work --batch followups-0918h`. That batch had drained to three open members. Meanwhile sixteen approved specs routed to role:implementer — the whole followups-0918i set groomed that morning, plus BUG-1283 filed an hour earlier — were invisible to the drain, because --batch filters members before the drain looks at the queue. Every wave for hours re-drove the same two or three specs; the last reported shipped 0, shelved 2. The queue was nineteen deep and the drain could act on three.

  The defect is not the filter, which is doing what it was asked. It is that the wave reports only what it drained and never what it declined to see, so a mis-pointed launcher is indistinguishable from an empty backlog. Both look like "nothing left to ship".

  This is the second time this week a filter silently discarded work: BUG-1264 was a batch member dropped because its object lived under an alias, and the remedy there was the same shape — never drop silently, emit a SpecSkipped event and a visible line. That fix covered unresolvable members; this covers members the filter excluded by design.

  Fix: at wave start-up, and again in the closing summary, the drain states both numbers — "batch <name>: 3 members; 16 other approved specs routed to role:implementer are not in this batch". Both are in hand at start-up, since resolving batch members already requires reading the role-routed queue. Emit it as an event as well as a line so a monitor can render it; a wave that drains its batch while the queue holds other ready work is the exact condition an operator wants surfaced.

  Acceptance: a wave launched with --batch on a batch of N, while M other approved specs are routed to that role outside the batch, prints both counts at start and at QueueDrained and emits them as an event; M == 0 renders no extra noise; the counts are correct with the role fallback in play (queue_list_with_role_fallback, per BUG-1264); unit test on the pure count derivation.
