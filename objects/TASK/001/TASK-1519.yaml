- id: 01a0e809-ea2d-76b2-9083-f9d62eae74b7
  author: joe
  content: |-
    NON-BLOCKING review finding (advisor, at merged head 0500c7ad) — worth a follow-up, not a revert.

    The Pristine proof validates SKILL.md ONLY, but the prune caller removes the whole directory with
    remove_dir_all. So an operator file added ALONGSIDE a pristine SKILL.md — e.g.
    .agents/skills/aida-foo/notes.md — is deleted with it, unproven.

    Narrow: it needs an aida-prefixed directory outside the expected set, holding a pristine SKILL.md,
    plus operator-added siblings. But the guard's own stated intent is that 'shared portable skills
    belong to the operator unless we can prove AIDA generated this exact, unedited regular file', and a
    sibling file is precisely something AIDA did not generate. The proof and the blast radius are
    mismatched: one file is proven, a whole tree is removed.

    Fix shape: either prune by FILE (remove the proven SKILL.md, leave the directory), or extend the
    pristine proof to every file in the directory and skip the directory if any file is unproven.
