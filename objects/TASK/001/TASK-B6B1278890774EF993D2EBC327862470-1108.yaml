title: 'Review follow-up: [P2] aida-cli-lib/src/doctor/remote.rs:454-470 switches fetch to the scratch --git-dir and'
description: |-
  From BUG-2672
  Reviewed sha: ef678e7f9515ed47f5d7485680fa6b18fbf00926

  [P2] aida-cli-lib/src/doctor/remote.rs:454-470 switches fetch to the scratch --git-dir and reconstructs only the remote URL. Repository-local transport settings are consequently absent from the fetch (for example core.sshCommand selecting a required SSH identity, a local credential.helper, or remote-specific proxy/uploadpack settings). ls-remote against the original repository can succeed while this fallback fails, turning an otherwise classifiable recent fast-forward into an uncertainty finding on every scheduled check whenever the advertised objects are missing locally. Preserve the original remote's required transport configuration safely in the isolated fetch, and add coverage for a transport configured only in the source repository. The existing fixture uses plain local bare remotes and cannot detect this.
