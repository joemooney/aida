title: 'Review follow-up: Deferred timeout follow-up: a plain mandate check can hang on an irregular history-index p'
description: |-
  From TASK-3115
  Reviewed sha: b3fe0fe9f31fb80280a9599406e9b479a5dd1826

  Deferred timeout follow-up: a plain mandate check can hang on an irregular history-index path. aida-cli-lib/src/mandate_history_index.rs:195–199 reads the optional disk index with blocking fs::read regardless of publish_index. A FIFO at that path, including a symlink to one, can hold the check past --timeout before check_all can report not-checked. Open and validate a regular file without a blocking open and treat unreadable cache data as a rebuild under the existing scoped deadline.
