title: 'Review follow-up: The archive key omits the package versions selected by the fresh apt index (.github/workfl'
description: |-
  From BUG-2744
  Reviewed sha: ea821ddd34be72fe4f36d7ad25ca50577df3ff66

  The archive key omits the package versions selected by the fresh apt index (.github/workflows/ci.yml:158, 167-175). If a repository publishes new package versions while the runner image and workflow are unchanged, restore still reports an exact hit, apt fetches the replacement archives, and save is skipped. Subsequent retries keep restoring the obsolete archive and fetching the replacements. Tie the key to the resolved package versions or otherwise allow a refreshed immutable entry when apt must fetch replacements.
