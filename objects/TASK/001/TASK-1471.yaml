  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-1471):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4b0807520f13
    Recorded: 2026-11-04T16:50:04.422403551+00:00
    Findings:
    1. aida-cli-lib/src/requirements_cli.rs:7447 gates the reverse (Doc -> spec) scan on 'degrees.in_degree > 0'. in_degree is a cache projection that single-row writes do not refresh: upsert_requirement_on (aida-core/src/db/cache.rs:3626-3645) keeps the target's prior in_degree, and 'aida doc add --about' (doc_cmd.rs:121-134) goes through update_requirement/upsert. Incremental pulls use the same upsert path. Repro: a spec with no inbound edges, then 'aida doc add --about SPEC', then 'aida show SPEC' shows no Documentation section until 'aida cache rebuild'. This is the main use case for AC1/AC4. Fix: drop the gate (the store has 7 Docs, so a typed list_summaries scan is cheap) or query reverse References edges directly. Do not rely on cached degree counts.
    2. AC7 coverage is unit-level only (show_docs.rs tests feed collect_linked_docs hand-built candidates). No test drives run_show / 'aida show' end to end. Nothing proves (a) a reverse-linked Doc shows up in the human view right after 'aida doc add --about' without a cache rebuild, which would have caught finding 1, or (b) the JSON/TOON output is byte-unchanged when Docs are linked (AC5 is shown only by reading the code). Add a CLI-level test for direct and reverse links that covers both.
    3. Minor: requirements_cli.rs:7440,7452-7455 swallow errors ('if let Ok(Some(..))' and 'list_summaries(..).unwrap_or_default()'). A cache or read failure then looks exactly like 'no linked Docs' and the section silently disappears. Print a dimmed warning or propagate the error, like the Relations block does with read_target(..)?.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
