  p3 follow-up: when .aida/train-fix-first.json is unreadable, fix_first_hold returns 'held: <error>'. That fails closed for every PR, as intended, but check_one only maps reasons starting with FIX_FIRST to the fix-first gate, so `aida pr train --check` shows these rows under the culprit gate with the culprit remedy. Give unreadable-record refusals their own gate label and a remedy that names the file (aida-cli-lib/src/pr_train_check.rs:150).
