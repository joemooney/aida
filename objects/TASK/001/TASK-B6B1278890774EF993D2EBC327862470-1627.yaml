    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 unit:** `task3958_run_review_on_uncommitted_work_says_what_to_do` in review_prepare.rs — workspace-mode refusal names "commit your change, then run `aida review prepare --run-review --from main`" or drop --run-review.
    - **AC2 unit:** `task3958_missing_agent_cli_is_reported_up_front` — preflight before any batch runs names the CLI, its install command, and `--agent`.
    - **AC3 unit:** `task3958_signed_out_claude_names_the_sign_in_step` in launch/review_runner.rs — a claude printing `Not logged in · Please run /login` on stdout (empty stderr) yields AuthRequired with "not signed in: run `claude` and use /login" and the agent's own line, never `stderr: (empty)`.
    - **AC4:** each test asserts the message carries no SPEC ID pattern / `--lane-host` / "finder pass" jargon.

    ### Expected files
    - `aida-cli-lib/src/review_prepare.rs`
    - `aida-cli-lib/src/launch/review_runner.rs`
    - `aida-cli-lib/src/vendors/review_runner.rs`

    ### Ambiguities / conflicts as questions
    - None (F14 codex hang and F11 empty range are out of scope).
