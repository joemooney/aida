title: 'First-run: review prepare errors say what to do next (F10, F12, F13)'
description: |-
  ## Acceptance
  - AC1 (F10): --run-review on uncommitted work says what to do (commit, or use the workspace mode) instead of a bare refusal.
  - AC2 (F12): a missing agent CLI is reported up front (before any work) in plain words: which CLI, how to install it, or how to pick another with --agent.
  - AC3 (F13): a signed-out agent CLI is reported as 'not signed in: run <cli> login', never as 'stderr: (empty)'.
  - AC4: no internal SPEC IDs or seat jargon in these messages; a test per message.

  Source: docs/plans/2026-11-27-fresh-user-walkthrough.md, sections F10, F12, F13 (on main after #4782). Advisor aida-d3 2026-11-27 20:30 priority (g); grouped by area by product-15 for laning now.
