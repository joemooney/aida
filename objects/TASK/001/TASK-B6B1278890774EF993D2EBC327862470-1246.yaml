  aida-cli-lib/src/main_watch.rs:1292-1310,1326-1335. When a verified green commit arrives just before the shorter deadline, the closing Git range can time out solely because this pass has no time left. close() permanently records the outcome as unattributed, clears the episode, and never retries the range, leaving revert/recovery metrics wrong even if Git is healthy next pass. Retain the verified green observation and retry the unresolved attribution on the next pass, or preserve an explicit pending attribution. Add a fixture where the closing range exhausts this pass and is available on retry.
