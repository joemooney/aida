  Residual throttle bypass (named in the PR body): a seat controls its own Makefile and may submit `make check-ci-fast`, so it can make that target compile and skip the lane compile-slot cap. The memory floor, bubblewrap sandbox and offline network still apply, and this is a host-health throttle, not an authority boundary. Follow-up: run the fast gate's make with a host-pinned recipe, or give non-compiling jobs a separate small pool, so a redefined target cannot take unbounded compile concurrency (aida-cli-lib/src/lane_job.rs:1896, lane_admission.rs:541).
