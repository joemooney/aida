  open->landed only covers PRs created in the last 60 days with a 1000-row cap (forge.rs GitHubForge::landing_opened_since). A long-lived PR that lands inside the 14-day window but was opened earlier drops out of the median/p90 without notice, which biases both toward short PRs. List by landed PR number instead, or report how many landings had no open time.
