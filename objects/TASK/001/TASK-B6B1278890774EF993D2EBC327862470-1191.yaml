  From BUG-2703
  Reviewed sha: 3299d3f57e360284ec651a031f1943cec6ef4be4

  aida-cli-lib/src/review_watch_pause.rs:247-251 with aida-cli-lib/src/gate/test_support.rs:171-179: human_operator requires both stdin and stderr to be terminals, but AmbientGuard::set_terminal switches stdin, stdout and stderr together, so no test distinguishes the two checks (removing either one leaves every test passing). The documented refusals are tested for drain, resume and pause: no terminal at all, an agent identity or session id or headless marker, and a seated session without a grant. Add a case with only one of the two streams a terminal so the conjunction is pinned.
