title: Deputy shell runner re-execs itself onto the current live binary between jobs when its exe is deleted or stale
description: |
  advisor-122 2026-11-26 10:27 (filed by product-15). BUG-2774's new reporting caught it again: deputy "default" (pid 3364365) runs a DELETED live binary after the advisor's two promotions today, so the auto-train is blocked-deputy, and only Joe may restart that deputy. This happens after EVERY format-changing promotion (memory: BUG-2654 ENOENT, restart-runners-after-promotion), and each time it costs an operator step and a stalled train.

  ## Acceptance
  - AC1: the deputy shell runner checks between jobs, only when IDLE (no job running). When /proc/self/exe reads "(deleted)", or its build sha differs from the live binary's, it execs the live binary with the SAME args, name, binding and grant, and logs the old sha, the new sha and the reason.
  - AC2: it NEVER re-execs mid-job. A job in flight finishes first, and a job submitted during the re-exec window is queued, not lost.
  - AC3: tests: deleted exe → re-exec when idle; a sha mismatch → re-exec when idle; a job in flight → no re-exec until it ends; the binding survives (a job after the re-exec still binds and runs).
  - AC4: the same rule for the relay/runner loops that hold the live binary, if they share the runner code.
