title: rework findings block lacks the commit-or-punt contract sentence
description: |
  The findings block rework_findings_comment() prepends to a rework pickup prompt (PR-1638, BUG-814) names the findings but not the behavioral contract from BUG-814 acceptance (3): the rework must produce at least one commit OR an explicit punt naming which finding it disputes — never a silent no-change pass-through. PR-1637's variant carried this sentence; the merged re-implementation dropped it. Without the teeth, a rework implementer can still no-op past the findings.

  Fix: append one contract sentence to the rendered block (and pin it in the prompt test).

  Raised in review of PR-1638: https://github.com/joemooney/aida/pull/1638#issuecomment-5527596055
