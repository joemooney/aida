  content: |-
    ## Implementer self-review
    Reviewed HEAD: f3220a04d87ea755d43d2254d76e3b3d01d33785 (git diff origin/main...HEAD).
    Acceptance evidence: AC1 the port is byte-identical to origin/story-2897-fresh's merge-base diff except the lazy-policy closure (checked with an interdiff of the two patches). help_surface_matches_golden_snapshot passes on this base, so the --needs golden plus the --pr reorder is correct here. AC2 isolated timings (lane runner, agent profile, host load 3-17): two_node_ship_watch_rework_and_train_entry_points main 109.6/112.7/143.6s vs branch 90.5/94.7/89.5s; bug_2398_final_spawn_boundary_ratchet main 7.49/7.40/7.37s vs branch 3.64/7.53/7.41s. In isolation the port is not slower, so the CI deltas look like shared-runner contention. The fix still removes the one avoidable cost: review record now reads the landing policy (3 git spawns) only for a WAITING verdict. AC3 title ends (TASK-3916); Refs STORY-2897 is in the body.
    Probes: P1/P2 n/a (no new parsing). P3 the needs empty/1/N cases are covered by the existing story_2897 tests. P5 refusal paths unchanged: WAITING still loads and enforces the policy, every non-waiting verdict refuses non-empty needs without it, and story_2897_needs_only_on_waiting_verdicts and story_2897_submit_draft_validates_needs_under_the_launch_landing_policy still cover them. No test weakened.
    Residual risk: readiness evaluate still loads the landing policy once per change report (3 git calls). I did not cache it per pass, because forge::Repository outlives the watch loop and caching there would freeze policy changes. make check-ci-fast exit 0.
