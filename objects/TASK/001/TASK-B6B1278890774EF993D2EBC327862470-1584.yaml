title: 'scan() wiring test: the scheduled landing-drought job wires every cause through scan() (STORY-3131 follow-up)'
description: |-
  Deferred to S3 by advisor-122 (2026-11-26 01:04, #4634 S2 ruling); filed as a child by product-15 per advisor 13:08. Each landing-drought cause (conflict, missing/held review, held train lock, ci-red) is unit-tested, but no test proves the scheduled landing-drought job reaches every cause through scan().

  ## Acceptance
  - AC1: one end-to-end test runs the scheduled job's entry point against a fixture where each cause is present, and asserts each cause appears in the output (and failing() for the failing ones).
  - AC2: test-only; no behaviour change.
