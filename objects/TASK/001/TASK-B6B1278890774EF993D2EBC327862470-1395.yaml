description: |-
  From TASK-3874
  Reviewed sha: f3d120c1fd5db11c0d63f4451b73dd68298b82c8

  aida-cli-lib/src/forge.rs:7168 — The explicit fetch can also download from the repository's configured `fetch.bundleURI` and update `refs/bundles/*` before looking up the requested OID. `--refmap=` and `--no-write-fetch-head` do not control this separate Git path. Prevent bundle retrieval for the advisory fetch so verdict collection only requests the pinned object from origin. Git source: https://github.com/git/git/blob/v2.43.0/builtin/fetch.c#L2185-L2189 and https://github.com/git/git/blob/v2.43.0/bundle-uri.c#L360-L381
