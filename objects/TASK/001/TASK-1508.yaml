  content: |-
    Review: REQUEST CHANGES — independent review of claude/task-1508 @ dad4fd4e27. One test gap; the rest is sound.

    BLOCKING
    R1 The agent/piped footer gate is untested. history.rs:484 print_fallback_footer returns early under agent_output_mode(). I deleted that gate in a throwaway copy and all 6 task_1508 tests still passed (mutation M1 survived). Fix: make the gate testable, for example fallback_footer_text(source, agent_mode) or a footer_for(source, agent_mode) helper, and assert None when agent_mode is true. For contrast, M2 (footer on any GitWalk) is caught by task_1508_switched_off_index_is_a_walk_without_footer.

    NON-BLOCKING
    N1 doctor_cmd.rs:8968 history_index_doctor_line. When AIDA_HISTORY_CACHE=0, the missing-index line says 'aida history builds it as it goes', which is false while the index is off. Suggest adding a 'switched off (AIDA_HISTORY_CACHE=0)' state.
    N2 The doctor line lives only in fsck. I accept that: fsck's 'cache freshness' is the only cache check doctor has (bare doctor has none), which matches the sketch's 'Cache check'.

    VERIFIED OK
    - Scope is exactly slice 2. The history_cache.rs changes are only: cache_enabled made pub(crate), #[allow(dead_code)] dropped from CacheAnswer.tip, and Clone added on HistoryCacheStatus. serve and eligibility are untouched.
    - HistorySource: history.rs:725 checks cache_enabled() first, so a disabled index gives GitWalk{fallback:false}. A serve() miss or error gives fallback:true. The footer wording has no internal nouns, and a test asserts that.
    - MCP (mcp.rs:2568+): source and index_tip are purely additive (index_tip is null for a walk), and outputSchema documents both. The only other caller, status_cmd.rs, is adapted.
    - The doctor line cannot fail fsck. status() opens the DB only if it exists and opens the lock without create, and a test asserts the index is not created.
    - Docs are accurate: env var parsing matches 0/false/off/no, and the budget default of 1500 matches DEFAULT_INDEX_BUDGET_MS.
    - Tests use temp stores only; history_db_path is asserted under the tempdir.
    - cargo test -p aida-cli-lib --lib: task_1508 6/6, task_1507 54 ok (1 ignored), history 118 ok, mcp 165 ok, doctor 156 ok.
