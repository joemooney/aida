title: Execute the codex validation runbook in a genuinely codex-mandated environment
description: |-
  STORY-762 closed with an explicit, honest ceiling:

    "REMAINING for full acceptance: repeat in a genuinely codex-mandated environment."
    "No such environment was reachable from the dev host, so simulation is the acceptance ceiling."

  That ceiling has lifted. This is the single highest-value item in the epic and the ONE thing that
  cannot be done from the dev host: a mandated-environment host has a different Codex version, sandbox
  policy, auth mode, network posture and possibly enterprise-managed hook trust (`requirements.toml`
  [hooks], which bypasses the `/hooks` trust prompt). Every other item in this epic is inference until
  this run happens.

  SETUP:
    1. `~/.aida/agents.toml` -> [agents] vendor = "codex"
    2. `aida init` in a real project (must include the BUG-793 fix, or the project config -- MCP
       registration and hook wiring alike -- is silently discarded)
    3. work as normal for a day

  WHAT TO CAPTURE -- friction, not just failures. The previous run's most valuable output was its
  friction list (non-TTY prompts, role authority, ack env vars), none of which were crashes:
    - anything that errors, prompts unexpectedly, or hangs
    - anything that silently does nothing where Claude would have acted
    - whether the MCP server is discoverable (the previous run's live probe FAILED; BUG-793 is the
      likely root cause and this is the re-test)
    - whether enterprise-managed hook trust blocks the scaffolded hooks
    - whether the sandbox policy permits the launches AIDA makes

  Attach results as a comment here, and file anything that cannot degrade gracefully as its own bug
  rather than leaving it as prose. That is how the last run produced BUG-704/705/706.
