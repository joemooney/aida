title: Dead-queue pruning split across queue prune --orphaned/--merged + queue gc — fold into queue prune --terminal or sharpen the cross-references so the right verb is obvious
description: |-
  From-audit finding: removing dead queue entries is split across queue prune --orphaned, queue prune --merged, and queue gc, and it is not obvious which verb removes which class. Sharpen the surface so the right verb is discoverable (the lower-risk half of the title fork; a new --terminal umbrella verb is out of scope here).

  ## Acceptance
  - THE help text for queue prune --orphaned, queue prune --merged, and queue gc SHALL each cross-reference the sibling verbs.
  - THE queue prune help SHALL state which entry class each flag targets: orphaned removes entries whose target spec was deleted, merged removes shipped entries, gc removes entries whose target is archived or terminal.
  - WHEN an operator runs queue prune with no flag, THE output SHALL name the available pruning flags and what each removes.
  - A test SHALL assert the queue prune help text names the sibling pruning verbs.
