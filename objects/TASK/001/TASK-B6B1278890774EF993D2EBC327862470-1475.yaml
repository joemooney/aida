    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit):** `[landing] max_prs_per_train` parsed by `LandingPolicy::from_config` (positive integer; unset/invalid = None with a warning). The auto-train entry `advisor_train_handler` (the only all-ready automatic caller, max hard-coded 10) resolves its max from the trusted policy via `auto_train_max`, so unset keeps 10. Explicit `aida pr train N...` and dispatch_flow lists keep their own max. Tests in `landing_policy.rs` parse valid/invalid values.
    - **AC2 (unit):** extract the bounded-train split in `pr_train_handler` into `split_bounded_train`; test that with policy max 3 and 6 ordered ready PRs the first pass admits 3 and leaves 3 waiting, and a second pass over the waiting set admits the next 3 in order.
