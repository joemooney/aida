title: 'main_watch pass budget includes watch_root git calls; per-notice full mailbox read (deferred from #4422 TASK-3209)'
description: |
  Deferred from PR #4422 (TASK-3209) r1 CR at bb5f778f (advisor-122 ruling 2026-11-23 03:24; filed by product-15). r2 fixes only the two checkpoint-correctness findings.

  ## Findings
  1. The scheduler's 120s pass timer includes watch_root's two 30s git calls (land.rs:1838 / review_watch_forge.rs:115), so the time budget for real work is smaller than intended.
  2. The per-notice FULL mailbox read in the watch pass is a perf cost that grows with mailbox size.

  ## Acceptance
  - AC1: The watch-root git calls either don't count against the pass budget or are bounded and accounted, and a test shows the work budget is preserved.
  - AC2: A notice no longer triggers a full mailbox read (incremental or bounded), with a test or measurement.
