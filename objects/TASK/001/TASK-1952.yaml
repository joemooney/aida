  content: "Advisor triage 2026-10-19: further items rolled into this sweep (full text below; each original is superseded by this sweep).\n\n### BUG-1992: BUG-1929 follow-up: harden the raw-store-git guard test and route the remaining store/worktree git calls through host_git_command\nFound by the strict round-4 review of #2541 (BUG-1929) at c6174e7545 (APPROVE; these are non-blocking).\n## Findings\n1. MEDIUM: bug_1929_store_git_guard (bug_1929_contained_store_tests.rs ~:777 regex, ~:818 scan) flags a raw git call only when nearby code names a store-ish variable. Not flagged: `let dir = detect_distributed_store().unwrap(); Command::new(\"git\").arg(\"-C\").arg(&dir)...`, `self.root`/`root` (git_backend.rs:621 already passes unflagged), aliased `PCmd::new(\"git\")`, helper indirection, crates other than aida-core/aida-cli-lib.\n2. LOW: aida-core/src/db/git_backend.rs:621 auto_commit_paths runs raw `git -C self.root diff --cached --quiet` over the store without a justification comment (tested not exec-capable).\n3. LOW: worktree_dirty_entries (status_sections.rs:58; callers :168, status_awaiting.rs:50, doctor_cmd.rs:5914, worktree_gc.rs:269) runs raw git status per worktree, skipping the store only by branch name read from a HEAD under <main>/.git/worktrees (writable via BUG-1982).\n4. LOW: the F1 regression test fails at fetch_branch(..).unwrap() (~:985) before its marker assertion on old code; assert the marker first for a clearer message.\n## Acceptance\n- The guard treats store-owning modules (db/git_backend.rs, db/cached_git_backend.rs, store_sync.rs, store_cmd.rs, store_locate.rs, store_push_pull.rs) as raw-call-forbidden, matches `\\w+::new(\"git\")` aliases, and fails on each bypass shape above (test per shape).\n- git_backend.rs:621 routed through host_git_command \n\n### BUG-2016: Contained launch derives the main checkout from the worktree's sandbox-writable .git pointer\nFollow-up R1b from the round-5 advisor review of PR #2541 (BUG-1929), a1121bad7c.\n\nclaude_contained_settings_json derives the main checkout from write_roots.first() through main_worktree_root_from (worktree_gc.rs:725), which trusts the worktree's .git pointer file. That file is inside the granted write root, so the sandbox can rewrite it. The reviewer confirmed that rewriting a pool worktree's .git to 'gitdir: <other>/.git' makes git worktree list report <other>. The next launch or resume in that worktree would then grant <other>/.aida-store and its cache files.\n\nThis adds little on its own: a rewritten pointer already gives a host escape through other unhardened host git calls (the BUG-2012 class). But the main checkout used for write grants should come from host-owned data (the spec lease / session record), not from a file the sandbox controls.\n\n## Acceptance\n- The contained launch and resume derive the main checkout from host-owned lease/session data, or verify the pointer against it and refuse on mismatch.\n- A test rewrites the worktree's .git pointer to another repo and asserts that no store or cache path of the other repo is granted (and that the launch refuses or falls back to the leased main).\n- Related: BUG-2012, BUG-1929, BUG-1971.\n\n### BUG-2117: Store-commit hook hardening follow-ups: skip commit-config sourcing for any store toplevel; prepare-commit-msg can forge an Aida-Store trailer\nResiduals from the round-6 advisor review of PR #2541 (BUG-1929), c448e8e5e7. Both MINOR.\n\n(i) aida-commit-msg skips sourcing .aida/commit-config only when AIDA_STORE_WRITE_GUARD is set or the branch is aida-store. A hand git commit on a detached store HEAD still sources the sandbox-writable file. The allowlist does not run on that path. Skip the source whenever the hook's toplevel is a store tree (the .aida-store root, or the git dir differs from the common dir and the toplevel is the store worktree).\n\n(ii) prepare-commit-msg (aida-store-pair) can pick a planted nested .aida-store/.git inside the store and run git -C <planted> rev-parse HEAD. That executes nothing, but it lets the sandbox forge an Aida-Store: trailer on a store commit. Resolve the store only from host-owned data.\n\n## Acceptance\n- A hand commit on a detached store HEAD with a planted commit-config does not source it (test).\n- A planted nested .aida-store/.git does not influence the Aida-Store trailer (test).\n\n### BUG-2154: Contained launch continues when the contained-store marker write fails (eprintln only), leaving old-git store protection to config alone\nFrom the #2670 STRICT review: session.rs:~2531 prints the marker write error and continues; the behavior predates TASK-1775. On git < 2.40, host store git then relies only on contained config.\n## Acceptance\n- If the marker write fails, the launch grants NO store write paths (or refuses the contained launch).\n- A test injects a marker write failure and asserts no store write paths.\n- Also guard the raw rev-parse at aida-core/src/db/yaml_backend.rs:102 or mark it raw-git-ok with a reason."
