  content: 'TASK-1959 measurement (2026-10-19, debug build, 18aa13a): one ''aida add'' in a fresh --no-hooks fixture spawns ~190 git processes; ~130 of them are the host-git hardening lookups that precede each real git call (rev-parse --git-common-dir x2 + config --blob :.gitmodules, repeated ~43 times). ''aida init'' and ''aida add'' take ~5 s each in debug, which is the floor under every binary-driving integration test (task_1717, bug_1947, task_1335, journey, task_1290 fixtures). Memoizing these per process/cwd (the TASK-1942 item) is the largest remaining lever on STORY-1853 integration-test time; it needs a security call on the TOCTOU window, so it is not done in TASK-1959.'
