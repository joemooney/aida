    What must change:
    1. **A slice PR may not amend its own gate.** Tooling commit 3e3df5af4e changes verify_stack.py so that a commit EARLIER in the same PR passes. It sits after the commit it un-fails, so under main's checker the stack is red. Split it into its own small PR off main (normal commit format with (TASK-1538), like #2498/#2508). I'll review and merge it first, then the stack is re-verified with main's checker.
