title: Report unexplained Rust numeric constants in traced code
description: |-
  Implements the second of the two report-only Rust slices signed on STORY-1672, advisor comment 2026-10-15 08:38. This child exists so separate slice PRs cannot prematurely auto-complete the parent story. No source work started.

  ## Acceptance
  - Add `aida lint constants`, Rust only, scanning numeric literals inside traced regions only; reuse existing trace-marker conventions and resolve owning specs through AIDA.
  - A literal is explained when its normalized value (strip `_` separators and type suffixes; compare hex/decimal by value) appears in the owning spec description or in a decision row linked to that spec.
  - Exempt only 0 and 1 and any literal on a line carrying `// arbitrary` (optionally `// arbitrary: <reason>`). No other heuristic exemptions in v1.
  - A test fixture proves the rule: the spec mentions 15; code has 15 and 40 and a marked 7; only 40 is flagged.
  - Human and JSON output name file:line, value and owning spec.
  - Report-only, no store edits, nonzero exit only with explicit `--fail-on`.
  - Keep existing `aida lint` behavior and the first trace-coverage slice intact; update affected command documentation.
  - STANDARD independent gate for this slice, operator merges. Use only this child ID in its completion trailer; parent STORY-1672 stays open until both slices are merged and verified.
