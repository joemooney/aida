title: Propagate two 2026-09-21 method memories into the scaffolding pack - check-ignore names the winner, and provenance-by-bracketing with its does-not-verify caveat
description: |-
  Two discipline memories written on 2026-09-21 generalize past this repo and were ruled for scaffolding propagation by the advisor. Propagation is a COMMIT to `aida-core/templates/memories/`, not a write to a local pack, so it needs an implementer.

  WHY THESE TWO. Both are about a surface returning something TRUE that is not the thing asked. Neither contains AIDA-specific content; both are wrong the same way in any repo.

  1. CHECK-IGNORE NAMES THE WINNER. `git check-ignore -v <path>` reports the winning rule under git's precedence order, where `.git/info/exclude` OUTRANKS `.gitignore`. It names the FIRST match - not the only one, and not the causal one. With two rules covering a path it will ALWAYS point at info/exclude, which reads as attribution and is not. Attribution requires REMOVING the candidate rule and re-testing in a scratch repo. Live mis-read: an advisor concluded a merge-hold marker was ignored "machine-local, not designed" when the repo's own deny-by-default `.aida/*` was doing it on every clone - a conclusion that made the defect look smaller than it is.

  2. RECONSTRUCT PROVENANCE BY BRACKETING. Date an artifact by its OWN event, not by a remembered wall-clock or an mtime; then bracket the instant with the nearest durable records either side and read what they say. Recovered the reason for a merge-hold whose own reason lived only in a gitignored, clobbered file. CAVEAT THAT MUST SHIP WITH IT: bracketing RECOVERS a reason, it does not VERIFY one. What comes back is what the adjacent records say, not what the person acted for; the two coincided in the live case and need not. Always label the output as reconstructed, never cite it as provenance, and NAME THE BRACKETING RECORDS so a later reader can re-judge the inference - a reconstruction whose brackets are named can be re-judged; one asserted bare becomes provenance in somebody's next summary.

  BODIES ARE WRITTEN AND READY TO COPY FROM:
      ~/.claude/projects/-home-joe-ai-aida/memory/feedback_check_ignore_names_the_winner.md
      ~/.claude/projects/-home-joe-ai-aida/memory/feedback_reconstruct_provenance_by_bracketing.md

  THE GOTCHA THAT WILL BITE SILENTLY, verified by the advisor rather than taken on report. The pack is marker-driven off `aida-core/templates/memories/` - 44 files, 43 carrying `propagation: scaffolding-pack`, embedded by build.rs. The two frontmatter shapes DIFFER:

      local pack                        templates/memories (masters)
      ---                               ---
      name: kebab-case-form             name: snake_case_matching_filename
      description: ...                  description: "..."
      metadata:                         type: feedback           <- TOP LEVEL, not nested
        node_type: memory               propagation: scaffolding-pack
        type: feedback                  originSessionId: <uuid>
        originSessionId: <uuid>

  A STRAIGHT COPY keeps `type:` nested under `metadata:` and drops the `propagation:` marker, so the file lands in the directory and NEVER JOINS THE PACK. It would look done and ship nothing - the absent-vs-good-evidence shape (PRIN-5) arriving in the delivery path rather than in a gate.

  THE PACK IS COMPILE-TIME EMBEDDED, SO THE VERIFICATION STEPS ARE ORDERED AND THE ORDER IS THE POINT. Verified: `aida-core/build.rs:83` does `embed_directory(&mut code, "templates/memories", "memories")`, and `aida memories check --help` says it compares the local pack against "THIS BINARY'S EMBEDDED MASTER". So copying files into the source tree changes NOTHING about the `aida` on PATH until a rebuild, and both checks below run through that binary. Found by claude-reviewer-1 before pickup.

      ON A STALE BINARY, criterion 4 PASSES SPURIOUSLY - a binary predating the copy has no knowledge of
      the two files, so there is no drift to report and it prints clean. Clean means "the binary does not
      know about them", which is indistinguishable from "they propagated correctly". CRITERION 4 AS
      WRITTEN WOULD BE SATISFIED BY DOING NOTHING AT ALL.

      ON A STALE BINARY, criterion 2 FAILS SPURIOUSLY - the files are in the tree but absent from the
      embedded pack, so the scaffolder correctly omits them, and an implementer goes hunting for a
      frontmatter bug that is not there. The likeliest "fix" is to start editing the marker they already
      got right.

  That is PRIN-5 inside this spec's own verification - absent evidence computing as good evidence - on the spec whose whole subject is a surface returning something true that is not the thing asked.

  ACCEPTANCE, IN ORDER:
  1. Both memories exist under `aida-core/templates/memories/` with MASTER frontmatter: snake_case `name:` matching the filename, quoted `description:`, TOP-LEVEL `type: feedback`, and `propagation: scaffolding-pack`.
  2. The bracketing memory ships with its caveat paragraph intact, including the name-the-brackets clause. The caveat is load-bearing, not a closing line: without it the technique manufactures provenance.
  3. REBUILD FIRST - `make build-fast` - so the embedded pack contains the two files. This is an ORDERED STEP, not a note. Every check below is meaningless before it.
  4. CONFIRM THE BINARY POSTDATES THE COPY before running any check - `aida dev status` (SHA vs HEAD) or equivalent. A shell on a stale dev pin is the common way this goes wrong and it is SILENT.
  5. THE PROPAGATION PROOF: scaffold into a throwaway target and show BOTH FILES PRESENT IN THE OUTPUT. Listing the templates directory does NOT satisfy this. This is the criterion that actually discriminates - positive evidence from the delivery path.
  6. `aida memories check` is clean afterwards. THIS IS A REGRESSION GUARD, NOT A PROPAGATION PROOF, and nobody may treat a clean result as the demonstration - see the stale-binary note above. Criterion 5 is the demonstration.

  OUT OF SCOPE: any other memory in the local pack. This is two files, chosen because they are pure method with no project content.
