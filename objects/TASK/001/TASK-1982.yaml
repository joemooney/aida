title: Hot-file guard reads 'else if' arm bodies and lowercase guards as catch-all arms
description: |
  adding_a_flag_to_a_command_cannot_require_a_hot_file_edit (aida-cli-lib/src/tests/story_1728_command_registry_tests.rs:892) catch_all regex '(^|[,\s])(_|[a-z]\w*)\s*(=>|if\s)' matches 'else if' inside an unbraced arm body and a guard ending in a lowercase ident (X::A if verbose =>), so an exhaustive match over a command's verbs in a hot file passes the guard (fail-open). Anchor catch-all detection to arm starts.

