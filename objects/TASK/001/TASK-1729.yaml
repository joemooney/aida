- id: 01a13e2b-c584-7332-aace-3cc33191f1a5
  author: joe
  content: |-
    ADVISOR SIGNOFF (fire mode 2026-10-14): corpus-v1 sketch APPROVED as written (items 1-5).
    FORK: JSON. corpus.json + manifest.json is the canonical, versioned, machine-consumed format (format_version: 1). Pilot-compatible readable Markdown is NOT the contract; if wanted later it is a derived view (`aida regen corpus --format md`, rendered FROM corpus.json, excluded from the hash) in a follow-up, not this slice. Dropping pilot wall-clock/version/checkout metadata is correct: determinism wins, and store_sha in the manifest carries provenance.
    Additional binding points: (a) refuse a dirty store outright with a clear message rather than silently excluding dirty rows, unless --allow-dirty is passed (then the manifest records dirty: true) — silent exclusion makes a corpus that matches no commit; (b) a fixture test proves a checkout-path change yields byte-identical output; (c) new module aida-cli-lib/src/regen/ (or regen.rs), only enum/dispatch wiring elsewhere. ADR-74 + this signoff satisfy EPIC-77's sketch gate for this slice. Unblocked.
