title: 'aida regen corpus: freeze the store export into a deterministic corpus dir'
description: |-
  Slice 1 of STORY-1669 (replaces aida-host scripts/regen-corpus.sh).
  ## Acceptance
  - `aida regen corpus <dir>` writes a deterministic corpus for a given store commit (same commit -> byte-identical output).
  - Excludes code, tests, docs and git metadata.
  - Writes a manifest with the store SHA and a content hash.
  - A test covers the exclusion rules and determinism.
