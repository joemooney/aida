title: Unify digest, calibration/assess and tail --since/--until on the shared time-bound parser
description: 'Follow-up to TASK-1502. digest, calibration/assess and tail still use their own --since/--until grammars. Move them onto queue_cmd::parse_since_arg (durations m/h/d/w, RFC3339, bare ISO date = local midnight, zone-less datetime = local, ''<N> <unit> ago''), and update the help and docs. Acceptance: every --since/--until flag in the CLI accepts the same grammar, and a test lists each flag.'
