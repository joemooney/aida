title: 'Review follow-up: Wording: when the retries are spent on writers that run a deleted binary, the final error '
description: |-
  From BUG-2778
  Reviewed sha: 70b9880abb40efc7fabb59c352a2fe98a31fbffb

  Wording: when the retries are spent on writers that run a deleted binary, the final error still says they 'should exit on their own' (retire.rs WriterAdmissionUnknown Display). Its only next step is the dry run. A long-lived old-binary MCP or server process does not exit by itself, so the final refusal should say how to stop or restart the named pid.
