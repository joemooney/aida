    - AC1 [behavioral-test]: `pr_train::tests::task3930_low_budget_handler_never_resumes_a_stale_retained_journal` drives `pr_train_handler_with_dispatch_ctx` (ADVISOR_LOOP + all_ready) in a path-isolated child process. The fixture has a real repo with a resolvable origin HEAD, `[forge] provider = "github"`, a fake gh reporting core 1/5000, and a stale retained Open journal for #3902. Asserts: Ok; the back-off line on stderr; no "Skipping retained train journal" line; no run.lock; the journal entry is unchanged (train/stale-1, Open); gh received only the rate_limit probe. The lane job passed (1 passed).
