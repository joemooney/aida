title: Record P-enrolled-host protected launch ADR and reconcile BUG-1669 acceptance
description: |
  Design-only prerequisite for BUG-1669; no implementation or installation authorization.

  Record Joe's three operator decisions (literal same-user anti-forgery, every AIDA-managed launch across projects on this host with unmanaged clients excluded, and P-enrolled-host broker/isolated-worker direction in principle). Reconcile BUG-1669 AC2's old terminal/orchestrator::detect wording and AC4's old positive fixture with protected consent; retain the literal protection goal, never substitute writable state/env/PTY corroboration.

  Acceptance:
  - A reviewed ADR and BUG-1669 acceptance update state the protected boundary, host-wide enrollment/admission rule, cross-repo scope, unprotected/unknown route refusal, and explicit unmanaged-client exclusion.
  - The ADR incorporates independent architecture signoff 01a0e11e-12db-7cd0-a3d1-39df79961a63 amendments M1-M5 and separates architecture signoff, concrete installer/backend/credential proposal, disposable privileged proof, deployment approval, and operator-held merge gates.
  - Inventory the design decisions and unresolved concrete operator approvals (backend/platform, privileged service installation/trust root, actual credentials, current-run migration, rollback/recovery); do not imply any has already been granted.
  - Link BUG-1679's protected binary identity/admission dependency and keep PR #2226 operator-held.
  Out of scope: service/VM installation, credential migration, live scheduler/watch changes, code launch-path edits, permission bypass, or claims of deployed protection.
