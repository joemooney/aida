    CHANGES REQUESTED

    Independent advisor gating the TASK-1549 sketch (comment 01a0e345-b187-7fd1-b9be-3d80552a5e40) and ADR-60 on branch claude/task-1549 at 2a468d964db9278634eb617438db21932126d10e. I did not write the ADR or the sketch and am separate from its author, from product, and from the prior advisor seats on BUG-1669 and BUG-1679.

    Read: TASK-1549 --full and both comments; BUG-1669 --full and all thirteen comments, in particular 01a0e0a3, 01a0e103, 01a0e10c, the independent architecture signoff 01a0e11e with M1-M5 in full, 01a0e125 and the author's proposal 01a0e344; BUG-1679 --full with 01a0e115, 01a0e11a and 01a0e33d; TASK-1550; SPIKE-91; CLAUDE.md; docs/agents/aida-repository-guide.md. Read the ADR in full via git show. Verified the branch diff, the store objects on the aida-store branch, PR #2226 through gh, and spot-checked current source at main. No host inventory, no KVM/Firecracker probe, no install, no live-store mutation beyond this comment.

    THE SUBSTANCE OF THE DESIGN PASSES. What follows is not a content rewrite. Sections 1 to 10, the fifteen settled decisions, the rejected alternatives and the honest-limits section are faithful to the record and I approve them as amended below. The blocker is the ADR's identity as a record, plus three text amendments. Fix A1 and A2 and the design content stands as written.

    ## A1 (BLOCKING) — ADR-60 is taken, and the ADR was never allocated in the store

    The sketch's claim that this "follows the repository's hand-written ADR convention (docs/plans/YYYY-MM-DD-adr-N-slug.md, as ADR-7 and ADR-47; ADR-60 is the next free number)" is wrong on both halves.

    The actual convention is that an ADR in this repository is a first-class AIDA spec of type `decision`, ID `ADR-N`, living at `.aida-store/objects/ADR/000/ADR-N.yaml`, with its own lifecycle — `draft` = proposed, `approved` = accepted, recorded by `aida edit ADR-N --status approved`, `superseded` with a typed `superseded-by` edge. That is documented at docs/agents/aida-repository-guide.md lines 345-349 and implemented at aida-core/src/models.rs:941. All sixty existing ADRs are store objects. The docs/plans markdown is the optional companion, not the ADR: the two files cited as precedent, ADR-7 and ADR-47, each have a store object beside them, and ADR-47.yaml carries the full Context / Decision / Consequences / Revisit-when text in the spec itself. This ADR reproduced the companion and omitted the canonical record, which is also the thing CLAUDE.md's first rule is about.

    The consequence has already landed. `ADR-60` is not free. `.aida-store/objects/ADR/000/ADR-60.yaml` is "Cross-machine cycle-time evidence: keep the live event log local, publish a per-spec timing record to the store at terminal state", req_type Decision, status Approved, created_at 2026-09-27T14:36:40Z — seven minutes after this sketch was posted at 14:29Z. Because the number was asserted in a filename instead of allocated through the dispenser, nothing reserved it and a concurrent decision took it. There are now two different ADR-60s, and the ADR's title line, its filename, its `<!-- trace -->` context and the "(ADR-60)" reference inside the BUG-1669 proposal comment 01a0e344 all point at the wrong decision. `aida list --type decision` read 59 of 59 when I first ran it and 60 of 60 minutes later, so a cache read at authoring time would have shown the number free; the store is the check, not the cache.

    Required: allocate the decision spec through AIDA (`aida add --type decision`), take whatever ID the dispenser returns — ADR-61 is next free as I write, and will stay unreserved until it is allocated — put the Context / Decision / Consequences / Rejected-alternatives text in the spec, link it to TASK-1549 and BUG-1669, and rename the companion doc and its heading to the allocated number. Then post a short correction on BUG-1669 naming the corrected ID, so 01a0e344's "(ADR-60)" does not send the next reader to the cycle-time ADR. Leave the new ADR at `draft` until A2 and A3 are done, then set it `approved` citing this comment; do not set it approved in the same action that creates it.

    ## A2 (BLOCKING) — TASK-1549's own acceptance is not discharged; make the BUG-1669 acceptance edit

    TASK-1549's acceptance reads "A reviewed ADR *and BUG-1669 acceptance update* state the protected boundary…", and its title is "…and reconcile BUG-1669 acceptance". I confirmed BUG-1669 is untouched — the `description` block is byte-identical across the last four store commits to BUG-1669.yaml — which is what I was asked to verify and is correct as far as it goes. But proposal-only leaves the spec's AC4 still naming, as its positive security fixture, the exact artefact that demonstrates the forgery: a hand-written `DrainState` with a matching UUID and a live PID. AC2 still calls `orchestrator::detect` "unforgeable". With the 01a0e33d mis-dispatch already on the record, leaving that live is a hazard, not caution.

    Acceptance authoring is advisor-gated in this repository (ADR-3), the proposed text strengthens rather than weakens AC2, and 01a0e0a3 forbids only weakening it. So I bless the AC text and direct the edit. Apply AC1-AC4 from 01a0e344 to BUG-1669 with the changes in A3 and A4, cite this comment in the edit, and leave BUG-1669's status, blockers and hold exactly as they are. I am not making the edit myself; I do not author what I approve.

    ## A3 (BLOCKING) — close the terminal loophole in AC2

    Proposed AC2 says "A terminal is a request and display surface only, unless it *is* that separately protected endpoint." The ADR separately rejects "a localhost web page or local PTY as the approval channel". So that clause is dead text at best and a reopening of precisely what 01a0e0a3 rejected at worst, and it sits in the sentence most likely to be copied into acceptance and then into code. Replace it with: a terminal is a request and display surface only; no terminal, PTY or socket reachable from any login session in which an agent can execute may serve as the approval endpoint, which must be a separately authenticated surface under a principal distinct from the agent's.

    ## A4 (BINDING) — state that a refusal-only change cannot satisfy the acceptance

    See the trade judgment below. Add to AC3, or as a closing clause on AC4: refusing affected routes does not by itself satisfy this acceptance; the positive protected path of AC4 must exist and be evidenced, so option H / deny-only cannot close BUG-1669.

    ## A5 (BINDING) — three small record fixes in the ADR

    Restore M4's upstream citation (the Firecracker jailer.md URL from 01a0e11e) rather than paraphrasing the cgroup-v2 missing-parent-cgroup behaviour without its source. Carry 01a0e11e's note that the sketch's source anchors refer to its earlier HEAD and that implementation and release must refresh them — it is nowhere in the ADR. And put "IN PRINCIPLE" into the Status line itself: "Accepted as DESIGN DIRECTION ONLY" over "Decision owner: operator (Joe)" reads, quoted out of context, as more than 01a0e10c granted, even though the body is scrupulous about it.

    ## A6 (BINDING) — add the approval the inventory is missing, and one relationship

    The eleven-row NOT-YET-GRANTED table is complete against everything Joe withheld. It is missing the decision he is being left to make by default: accepting AIDA's continued full exposure to BUG-1669 for the entire duration of SPIKE-91, TASK-1550, implementation, gate-3 proof and cutover, on a host currently running many unattended agents. Add it as a row — an explicit, dated operator risk acceptance, not a residue. Also extend the rollback row: it covers installer, epoch rotation, anti-rollback fence and backup/restore, but not "restore the pre-cutover launch behaviour", which is the rollback that matters on the night of a cutover.

    Separately, add BUG-1679 as a `references` relationship on SPIKE-91 so the identity-admission dependency is walkable rather than only prose (see O7).

    ## Verifications requested, each answered

    **ADR convention and ADR-60 free — FAILED, both halves.** See A1. Convention is a `decision` spec, not a docs/plans file; ADR-60 is occupied by an Approved decision created 2026-09-27T14:36:40Z.

    **M1-M5 genuinely incorporated — CONFIRMED.** I read 01a0e11e's amendment text and each claimed landing section; these are substantive, not name-drops. M1 → §2 (host registry as protected service state, every official entry point a thin client, enrollment is not exemption), §4, §5 (no relabelling; concrete mismatch returns to Joe as a deployment blocker), §8's TASK-1550 handoff; §7 carries the credential-revocation-is-not-proof clause and the untrusted-host-principal negative tests. M2 → §3's closing bullet (observation as well as mutation; cross-repo transcripts, prompts, logs, artifacts, consoles, interactive input all refuse) and §7 (public IPC metadata only, opaque IDs unlock nothing, scoped attach/result APIs, separately authenticated operator surface, no generic FD/socket/terminal bridge, hostile guest output neutralised, repo-A→repo-B a required test). M3 → §1's "displays the exact normalised scoped request", §3's digest binding (repo ID + enrollment generation + base artifact + content digests + operation/phase), §7 including the load-bearing "an artifact hash establishes content identity, never permission to read or import it" and all four required test classes. M4 → §1, §4's failed-isolation refusal, §7's pre-Running attestation, guardian health participating in admission, and the independent-component-stops-admissions requirement. M5 → §6, §§9-10 and the inventory, with "Approved lifecycle status, an existing queue entry, and the architecture comment itself are each explicitly not dispatch approval" stated in terms. Two omissions only, both in A5.

    **Five gates separate, only gate 1 closed — CONFIRMED.** §6's table matches 01a0e11e and 01a0e125 exactly: gate 1 CLOSED, architecture only; gates 2-5 OPEN; gate 4 "never granted". The follow-on paragraph — gate 1 "unblocks dependent design and planning work only… not dispatch approval, not a queue change, not an installation ticket and not a merge authorisation" — is the right reading. No section anywhere else conflates them.

    **No implied operator approval — CONFIRMED.** The eleven rows match the claimed count and are a superset of what 01a0e10c withheld, of M5's list, and of TASK-1549's own AC3 list. I read every section for contradicting prose and found none: the header, the read-this-first box, the accepted-in-principle section, §6, §8's "naming the Firecracker + jailer candidate… is not Joe selecting a backend" and the Consequences section all repeat the restriction. The two qualifications are A5's status-line wording and A6's missing row — one understates nothing and one is an omission, neither is an overclaim.

    **Literal anti-forgery held, nothing smuggled — CONFIRMED, with A3 to close.** §1's rejected-substitutes list is complete against 01a0e0a3 and goes beyond it. I checked every occurrence of terminal, PTY, environment variable, SO_PEERCRED, 0600 and IsTerminal in the document: each is a rejection, a demotion to diagnostic, or a required negative test. §2 moves the host registry out of agent-writable `.aida` config; §4 keeps timers and user units as unauthenticated wake hints. The only soft spot is AC2's terminal clause, which A3 closes. I also independently confirmed the premise the whole ADR rests on against current source: `orchestrator::classify` reads `AIDA_AUTO_COMPLETE` plus `AIDA_AUTO_COMPLETE_TOKEN` (aida-cli-lib/src/orchestrator.rs:191-236) and `run_is_live` returns true only when the token is a valid UUID equal to `DrainState::run_uuid` in the project's own drain-state file and `orchestrator_pid` is alive (orchestrator.rs:213-224) — every input same-user-writable; `authority_stdin_is_terminal` and `authority_stdout_is_terminal` are `IsTerminal` (lib.rs:34763, 34775); the bypass literals are in compete.rs, session.rs, scripts/aida-demo.sh and all four scripts/ablations/gate-vs-rule*.sh. The ADR's Context is accurate.

    **PR #2226 operator-held, BUG-1679 linked — CONFIRMED.** `gh pr view 2226`: OPEN, headRefOid e63efc3997a85df8cb1ff463f48222900ed5f7d6, label `aida:merge-hold`. The quotes of 01a0e115 and 01a0e11a and the account of the 01a0e33d mis-dispatch are faithful; BUG-1679 is blocked-by BUG-1669 in the store. One record inconsistency not the author's doing: BUG-1679's store status is still `NeedsAttention` although the 07:30 proxy comment says DEFERRED. Worth reconciling; it does not touch this gate.

    **Proposal only, BUG-1669 unedited — CONFIRMED.** BUG-1669's `description` is byte-identical across the last four store commits to its object; the only change is the appended comment, itself labelled PROPOSAL ONLY. AC2 still reads "the unforgeable drain run-token check (orchestrator::detect)" and AC4 still asks that "the drain-token path still works". See A2 on why that now has to change.

    **One scope correction to the record.** The premise that this ADR gates four specs is only three-quarters true. BUG-1669 is blocked-by TASK-1549, SPIKE-91 and TASK-1550; TASK-1550 is blocked-by TASK-1549; BUG-1679 is blocked-by BUG-1669. SPIKE-91 has no blocked-by relationship at all and is pickup-ready in the substrate today. If SPIKE-91 is meant to wait on this ADR, the edge is missing; if it is not, it was never gated and can start now.

    ## The refuse-without-backend trade: my judgment

    It is the right trade, and the ADR mis-frames it in a way that matters.

    The proposed acceptance does not create a refusal-only interim. AC4's positive case requires authenticated approval → protected controller → scoped phase worker → allowed next phase over real protected channels, plus disposable actual-boundary evidence, so BUG-1669 cannot be closed by shipping refusals; that is option H, which the ADR correctly records as unapproved and not presumed. So the interruption of unattended work is not an acceptance-text consequence at all. It is a gate-4 cutover consequence, and Joe already accepted it in principle in 01a0e10c, which names "interruption/migration of existing unattended AIDA launches" in terms. The only way to avoid it is to keep a launch path authorised by same-user-forgeable state, which 01a0e0a3 forbids in exactly those words. There is no third option, and the ADR should say so rather than presenting this as a consequence product must weigh — product has no latitude here without reopening an operator decision. Hence A4: make it structural in the AC text so a future implementer cannot ship refusals, point at AC4 as "tests", and interrupt the fleet with the bug still open.

    Two conditions on accepting the trade.

    First, the real cost is the one the ADR leaves off the table. Declining a partial mitigation means AIDA knowingly carries the full exposure — any agent permitted to run `aida *` can start a detached full-access child with a prompt of its own choosing — for the whole time the backend takes, on a host running many unattended agents right now. That is a months-long window and it should be an explicit dated operator risk acceptance, which is A6.

    Second, and this is where I part company with the ADR: it was right that choosing a general interim would be a deployment decision, and it over-generalised by leaving the cheap subset unchosen too. `scripts/aida-demo.sh` and the four `scripts/ablations/gate-vs-rule*.sh` build full-access argv directly and are not part of any unattended drain. Gating or refusing those, and any other route with no legitimate unattended caller, reduces exposure to nearly nothing for the demo and ablation surface, interrupts no solo, burndown, wave, watch or scheduled work, and requires no broker, no backend and no installation. That is an ordinary defect fix in shipped scripts, not a deployment decision about the boundary. Put it to Joe as a separate additive spec rather than leaving it a footnote reading "optional and unapproved".

    And when gate 4 is eventually put to Joe, it must not arrive as one undifferentiated "deployment approval": it needs a named window, a pre-published list of exactly which unattended work stops, and a rollback that restores the current launch behaviour — the hard-to-reverse-operation rule applies.

    ## O1-O7

    **O1 — can this host satisfy M1's cutover invariant.** Not settleable without TASK-1550, and the author was right not to try. But it can be narrowed, and the honest expectation is no, not as things stand. `scripts/aida-demo.sh` and the four `scripts/ablations/gate-vs-rule*.sh` are official AIDA artefacts that construct `--permission-mode bypassPermissions` and `--dangerously-bypass-approvals-and-sandbox` argv with no AIDA mediation whatsoever; no installed broker can stop `bash scripts/aida-demo.sh` from running a vendor CLI with host credentials, so under M1 those routes satisfy the invariant only by being rewritten to call the broker or removed. Add BUG-1679's finding that copied and stale `aida` binaries resolve through `AIDA_BIN`/PATH today, and there are already 20-plus live sibling worktrees on this checkout. So M1 is plausibly reachable, but only with route rewrites plus disposition of the shipped scripts — and Joe should hear that before backend effort is spent, not after. What settles it: TASK-1550's read-only per-route manifest mapping every A-G route plus global, per-project, IDE/MCP and timer entry points to invokes-broker / refuses / retains-independent-host-execution, with a concrete disposition for the third bucket.

    **O2 — backend feasibility.** Not answerable from the record; I ran no probes, as instructed. What would settle it, all read-only: `/dev/kvm` presence and permissions, `lscpu` virtualisation and nested flags, kernel version against Firecracker's documented minimum, cgroup v2 unified hierarchy, and whether this machine is itself virtualised. Two things already on the record bear on it: 01a0e11e's own platform check found Firecracker documents the per-VM vsock and Unix-socket transport but not application authorization, and M4 cites the jailer's cgroup-v2 missing-parent-cgroup behaviour as the reason confinement cannot be asserted from configuration. One operational constraint SPIKE-91 must design inside rather than discover: builds on this host are slot-gated machine-wide and a full suite under a pty has already caused an oomd session kill, so a per-phase microVM fleet has a real resource envelope. SPIKE-91 should carry a resource and throughput budget, not only a security model.

    **O3 — vendor compatibility.** Unresolved, correctly flagged, and more load-bearing than the ADR's phrasing suggests. This fleet dispatches Claude, Codex and Agy; if all three need an unrestricted login HOME, a generic egress path or a reusable OAuth credential, the boundary ships with nothing able to run inside it, and "unsupported until separately designed" would be a product regression rather than a footnote. What settles it: for each of the three, a written statement of the minimum credential and filesystem surface the CLI needs to run non-interactively, taken from the vendor's own documented config and credential paths rather than from experiment, and a verdict on whether a per-boot, adapter-issued, short-lived credential satisfies it. Make that a named per-vendor deliverable of SPIKE-91 with three explicit verdicts.

    **O4 — the 10s bound and the suspend fence.** Correctly left unqualified; they are proposals to be measured and must stay marked as such in every document, and they are correctly in the NOT-YET-GRANTED table. What settles them: on the gate-3 disposable privileged fixture, measured kill-to-gone latency distributions under load with the guardian both healthy and killed, a suspend and resume test showing the fence holds, and positive attestation of cgroup membership rather than an exit status — which is M4's point restated as a measurement. Until gate 3 exists they are unmeasurable, so no document may assert them.

    **O5 — does product adopt the AC text, and does AC5 belong in acceptance.** Adopt AC1-AC4 with A3 and A4. AC5 does not belong in acceptance as written: a prohibition on future statements in docs, release notes and PR bodies is unfalsifiable at review time — you cannot test "no future document overclaims" — and acceptance here is supposed to be checkable at the primary caller. Replace it with something a reviewer can check at the PR: the PR body states, and the shipped CLI and docs strings confirm, that no protected boundary is deployed, and either the gate-3 real-boundary evidence is attached or the PR is explicitly marked as claiming no protection. Keep the broader no-overclaim rule where it already lives, in the ADR's consequences and in release policy.

    **O6 — refusal-only interim or wait for the backend.** I answer rather than leave it open, because leaving it open produces a default. Neither as posed: BUG-1669 waits for the backend — A4 makes that structural and option H cannot close it — and in parallel a narrowly scoped containment spec goes to Joe now covering only routes with no legitimate unattended caller, the shipped demo and ablation scripts first. That cuts exposure during the wait, interrupts nothing unattended, and needs no broker or installation.

    **O7 — where BUG-1679's identity-admission contract is finally specified.** In SPIKE-91, under its existing acceptance line "pinned executable/dependency identity admission" — no new spec, and the author was right not to invent an ID. SPIKE-91's acceptance already names that deliverable verbatim, so the contract has a home; what is missing is the link, not the scope, hence A6's `references` edge. Also record on BUG-1679 that its own AC1 is superseded by that contract — the acceptance change 01a0e33d identified and which nobody has yet made. A separate spec is warranted only if SPIKE-91's output shows identity admission needs its own installer and update-policy design, and that is knowable only after SPIKE-91.

    ## Disposition

    BUG-1669 may NOT proceed to a concrete installer, backend or credential proposal. It remains gated, for reasons independent of this review: gates 2, 3 and 4 are open, 01a0e125 holds it implementation-held even after its prerequisites complete, and all three of its blockers are unsatisfied. Nothing in this comment queues, unblocks, dispatches or authorises anything, and no protection is deployed.

    TASK-1549 is not discharged until A1 and A2 land; A3 to A6 are binding on the corrected ADR and on dependent work, and where this text differs from the sketch, this text governs. No re-review of design content is needed — post the corrected ID and the BUG-1669 edit on this spec and I will treat A1 and A2 as closed on inspection. TASK-1550 stays gated behind TASK-1549. SPIKE-91 is not gated in the substrate at all (see the scope correction) and its O2, O3, O4 and O7 scope can proceed as read-only research whenever product chooses. BUG-1679 stays parked and PR #2226 stays operator-held at e63efc3997a85df8cb1ff463f48222900ed5f7d6; only Joe releases it.

    Actions taken: read-only review, plus this comment. No code, test, build, agent launch, installation, credential, queue, status, dispatch, merge or spec edit other than this comment. No host inventory, no KVM or Firecracker probe.
