  content: |
    INDEPENDENT RE-REVIEW — APPROVE

    Fresh reviewer seat. I did not write the ADR, the sketch, the rework, or advisor verdict 01a0e351-5a7c-78a3-a0fb-bb79f078cb6a. I verified artifacts, not the rework report 01a0e35b.

    Read: TASK-1549 and all five comments; ADR-61 --full (description, relationships, history, its one comment) and ADR-60; BUG-1669 --full with its store diff and the new correction comment 01a0e35a-0c74; BUG-1679 --full with 01a0e115, 01a0e11a, 01a0e33d and the new 01a0e35a-6425; SPIKE-91 and TASK-1550; BUG-1688; CLAUDE.md. Verified both commits on claude/task-1549 at 2dd823f15b10c2bc7669afae5de1803e5a985c9e, the aida-store object history for ADR-61/BUG-1669/BUG-1679/SPIKE-91/TASK-1549, and PR #2226 via gh. No host inventory, no KVM/Firecracker probe, no install, no spec edit other than this comment.

    DESIGN-ONLY — CLEAN. `git diff --name-status origin/main...claude/task-1549` is exactly one path: `docs/plans/2026-09-27-adr-61-p-enrolled-host-protected-launch-boundary.md`, 608 lines added, no other file. No production code, no launch-path edit, no script, no test, no config. The second commit is a rename plus 113/33 text change inside that one file. All 33 deleted lines are amendment-mandated removals (the ADR-60 heading, the old status line, the paraphrased jailer sentence, the "unless it *is*" clause, the proposal-only framing, old AC5, the "consequence product must weigh" paragraph, the unextended rollback row, the "optional and unapproved" Option H tail). Nothing else was weakened or dropped.

    A1 — VERIFIED. ADR-61 is a real `decision` spec in the store, not an asserted number. Store history: `02de920862 add ADR-61` at 07:47:20 with `status: Draft`, six further edits still Draft, then `89a0313153` at 07:52:39 flipping Draft -> Approved, and the spec's own history array records exactly one change, status Draft -> Approved at 14:52:39Z. Created draft and approved in a separate later action, as A1 directed. Five References edges present and resolving: TASK-1549, BUG-1669, SPIKE-91, TASK-1550, BUG-1679. The full Context / Decision (ten parts) / Consequences / Rejected-alternatives / Revisit-when / Recorded-by text is in the spec, not only the companion. Companion file renamed to `...adr-61-...md`, H1 is "ADR-61:", and the trace marker at the file foot is `<!-- trace:ADR-61 | ai:claude -->` — corrected, not stale. The file opens with a "Canonical record" box naming ADR-61 as the decision, this file as the companion, and the ADR-60 collision as a corrected error rather than silently dropping it. BUG-1669 carries correction comment 01a0e35a-0c74, item 1 of which states 01a0e344's "(ADR-60)" is wrong, names what ADR-60 actually is, and says "Anywhere 01a0e344 says ADR-60, read ADR-61". ADR-60 independently confirmed unrelated: "Cross-machine cycle-time evidence: keep the live event log local, publish a per-spec timing record to the store at terminal state", type decision, Approved, tags aida:history/aida:metrics/observability, no overlap with launch authority.

    A2 — VERIFIED, including the reversal. BUG-1669's description now carries AC1-AC5 with the header "reconciled 2026-09-27 under ADR-61 and advisor direction 01a0e351-... amendments A2/A3/A4; supersedes the original AC1-AC4 wording". The word "unforgeable" is gone from AC2; `orchestrator::detect` appears there only in the list of things that "grant nothing", plus "retained as a diagnostic classifier only". The critical check passes: AC4 now reads "Reverse the old writable-state / live-PID positive fixture into a required forgery NEGATIVE: hand-written DrainState with a matching UUID and a live PID must now FAIL, as must a fabricated PTY answering yes and both IsTerminal observations forced true", with the positive case redefined as authenticated approval -> protected controller -> scoped phase worker -> allowed next phase over real protected channels. The forgery artefact is a required failing test, not a passing security fixture. Unchanged as directed: status Approved, blocked: true, three blockers TASK-1549/SPIKE-91/TASK-1550 all `satisfied: false`. The store diff for the edit (4d3ac20255..1d7641410f) touches only `description`, `modified_at` and one appended comment — no status, blocker or relationship field moved. The 01a0e125 implementation hold is intact and restated in both the description footer and the correction comment.

    A3 — VERIFIED in both places. "unless it *is* that separately protected endpoint" appears nowhere on the branch or in the store; grep for it returns nothing in the companion doc, and BUG-1669's AC2 and ADR-61's part 9 both carry the replacement verbatim: a terminal is a request and display surface only, and no terminal, PTY or socket reachable from any login session in which an agent can execute may serve as the approval endpoint, which must be a separately authenticated surface under a principal distinct from the agent's.

    A4 — VERIFIED as structural. BUG-1669 AC3: "Refusing affected routes does not by itself satisfy this acceptance: the positive protected path of AC4 must exist and be evidenced, so option H / deny-only cannot close this bug." AC4 closes with "A change that only refuses does not satisfy this criterion", and its positive case plus "disposable actual-boundary evidence; a privileged suite that skips is not a pass" makes the requirement load-bearing rather than exhortative. A refusal-only change cannot satisfy AC4 by construction, so it genuinely cannot close BUG-1669. Mirrored in ADR-61 part 9 and in the Option H rejection.

    A5 — VERIFIED, all three. M4's citation is a real URL in both the spec and the companion: https://github.com/firecracker-microvm/firecracker/blob/main/docs/jailer.md, attached to the missing-parent-cgroup behaviour rather than paraphrasing it. The stale-source-anchor note is carried in the companion's read-this-first box ("the signed sketch's line-number anchors refer to its earlier HEAD (854b7e26f7, spot-checked at 43c0429198). Symbols are authoritative, line numbers are not: implementation and release must refresh every anchor") and in the spec's Context. Status line, identically in spec and companion: "Accepted IN PRINCIPLE as design direction only — NOT approved for implementation, installation, credential migration, deployment or merge" — IN PRINCIPLE present and all five disclaimers present. "Decision owner: operator (Joe)" is replaced by "Decision relayed from", which is the more honest framing for a relaying seat.

    A6 — VERIFIED, all three. The inventory is headed "NOT YET GRANTED (12 rows)" and has 12 data rows; the new one is "Explicit, dated operator acceptance of continued exposure", marked "NOT YET GRANTED — must be an explicit dated risk acceptance, not a residue", owner product -> Joe, naming the whole SPIKE-91/TASK-1550/implementation/gate-3/cutover window and the host currently running many unattended agents. The rollback row now ends "and restoring the pre-cutover launch behaviour (the rollback that matters on the night of a cutover)" and is jointly owned by SPIKE-91 + TASK-1550. SPIKE-91 carries `references BUG-1679` in the store (commit 6a29cb9d5f, rel_type References), so the identity-admission dependency is walkable. The gate-4 framing requirement (named window, pre-published list of which unattended work stops, rollback restoring current behaviour) is in the spec's Consequences and the companion's part 9.

    JUDGMENT 1 — ADR-61 at `approved` is CORRECT and does not overstate authorization. Three reasons. (a) It is what the repo's decision lifecycle means: `approved` = accepted for a `decision` spec, and the CLI itself renders ADR-61's status as "Accepted" in structured output. It was also the explicit instruction in A1 ("then set it `approved` citing this comment"), done in a separate action with comment 01a0e35a-99d4 citing it. (b) The disambiguation survives out-of-context reading, which is the real test. The first section of the description, before Context, is "STATUS / Accepted IN PRINCIPLE as design direction only — NOT approved for implementation, installation, credential migration, deployment or merge... No protected boundary is deployed; AIDA today still launches full-access agents behind same-user-forgeable corroboration". That sentence falls inside the truncated preview `aida show ADR-61` prints, so a reader who runs nothing else still sees it next to `status: approved`. (c) Reinforced four more times independently of this thread: the gate table (gate 1 closed, gates 2-5 open, gate 4 never granted), part 8's inventory pointer, the Consequences opening "Now, design only: nothing in the running system changes", and the ADR's own comment spelling out that "approved" means the decision is recorded and is not dispatch, installation, backend selection, credential migration, deployment or merge. I could not construct a reading of the spec text that infers authorization. Non-blocking observation, not the architect's doing: an approved decision spec still advertises `aida queue work ADR-61 -> in-progress` in its `next` block, which for this particular ADR is the one affordance a careless reader could mistake for a dispatch path. That is substrate behaviour shared by all 61 ADRs and belongs in a substrate spec, not here.

    JUDGMENT 2 — BOTH REFUSALS WERE CORRECT. On the SPIKE-91 blocker: the verdict posed it as a disjunction ("if SPIKE-91 is meant to wait on this ADR, the edge is missing; if it is not, it was never gated"), and A6 required only the References edge to BUG-1679, which was added. Adding a blocked-by would change pickup eligibility, which is a queue change, and the dispatch mandate 01a0e2dc excludes queue changes from this seat in terms. It would also invert the real dependency, since SPIKE-91's read-only research is what answers the ADR's own O2/O3/O4. The architect did the right thing instead of nothing: it answered the question either way and documented it in a "Gating correction" paragraph stating that this ADR gates three of four downstream specs, that SPIKE-91 is pickup-ready today, and that gating it would need a deliberate explicit edge. Subsequently confirmed by proxy decision 01a0e360 on SPIKE-91 ("SPIKE-91 stays UNGATED... do NOT add a blocked-by edge"), which reached the same conclusion for the same reason. On BUG-1679's acceptance: refusing was not merely defensible, it was required. Operator decision 01a0e11a says "do not narrow BUG-1679 now" and "No merge, unhold, acceptance weakening, or completion is authorized"; 01a0e115 routed the acceptance revision to product; and A2's blessing was explicitly scoped to BUG-1669's text, so no advisor had blessed any BUG-1679 wording and ADR-3's advisor gate was unsatisfied. O7's instruction was to "record on BUG-1679 that its own AC1 is superseded", and recording is exactly what happened: comment 01a0e35a-6425 states the supersession, says in its first line that it is not editing acceptance and why, points at SPIKE-91 as the home of the contract, and adds two facts for whoever eventually reconciles it. The store diff for BUG-1679 (a7da9744a0) touches only `modified_at` and the appended comment — description, status, blockers untouched. Had the architect edited it, that would have been a blocker in this review.

    NOTHING BROKEN BY THE REWORK. PR #2226 verified still OPEN at e63efc3997a85df8cb1ff463f48222900ed5f7d6 with `aida:merge-hold`. BUG-1679 still blocked-by BUG-1669, acceptance unchanged. TASK-1550 still Approved, blocked-by TASK-1549, unsatisfied. No status, hold, blocker, queue or merge state moved anywhere except ADR-61's own intended Draft -> Approved. BUG-1688 ("Gate or refuse full-access launches in shipped scripts that have no legitimate unattended caller") exists as a `draft` spec filed by the coordinator, not by this seat, and authorizes nothing; the companion's part 8 correctly records the cheap subset as separable, not authorised, and unable to close BUG-1669.

    Two record wrinkles, neither blocking and neither introduced by the rework. First, TASK-1549's store status went to Done at 07:30:44, twelve minutes before the CHANGES REQUESTED verdict that said "TASK-1549 is not discharged until A1 and A2 land", and it stayed Done throughout the rework. It is harmless in this substrate because Done does not satisfy a blocker — BUG-1669 still shows TASK-1549 as `Done, satisfied: false` and completion comes at merge via the commit trailer — but a spec sitting at Done under an open CHANGES REQUESTED verdict misreads at a glance, and the honest sequence is Done after the re-review, not before it. Second, BUG-1679's store status is still NeedsAttention while its 07:30 proxy comment says DEFERRED; the architect carried this forward as a note for whoever reconciles that spec rather than fixing it, which was right.

    DISPOSITION. A1 through A6 are verified applied in the artifacts, not merely claimed. The two judgment calls are both sound. TASK-1549's deliverable is discharged: a reviewed ADR exists as a canonical decision spec and BUG-1669's acceptance is reconciled. Nothing in this comment queues, unblocks, dispatches, installs or merges anything. BUG-1669 remains Approved, blocked, implementation-held with three unsatisfied blockers; gates 2-5 remain open, gate 4 never granted; BUG-1679 stays parked; PR #2226 stays operator-held and only Joe releases it; no protected boundary is deployed.

    Actions taken: read-only review plus this comment. No code, build, test, agent launch, installation, credential, host inventory, KVM or Firecracker probe, and no spec edit.

    VERDICT: APPROVE
