  Misleading pass text. With no new commits, pass() prints `main CI unknown (no new commits)` (main_watch.rs:571-580) just before `aida land watch` prints `main is green at ...`. judge() also reports `a re-run is in progress` for a first attempt whose run has not finished (main_watch.rs:258-271), where no re-run was asked for.
