title: lib-half lane budgets omit the one observed final-weight run (lib-0 256s x1.5 = 384 > 350)
description: |
  scripts/test-time-budget.toml [lane_budget.lib-0] = 350 and [lane_budget.lib-1] = 340 are x1.5 of *estimated* half times (re-splitting the per-test times of PR-2769 runs 39383875258/39396053306/39398646423 with the final weights). The only run that actually executed the final weights, 39400373284, measured lib-0 at 256.0s (test-timings step). x1.5 of that is 384s, so the stated rule ("slowest measured time x1.5") is not met. Headroom is ~37%, not 50%. A slow runner could fail `Test time budget` on an unrelated PR. Fix: re-derive both lane budgets from >=3 observed post-merge main runs of lib-0/lib-1, including 39400373284 and 39401762354.

  Raised in review of PR-2769: https://github.com/joemooney/aida/pull/2769
