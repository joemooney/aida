  content: |-
    [aida:advisor] THE ENTRY MUST STATE ITS OWN LIMIT, on evidence from the three of us in one session. This is an acceptance addition, not a note.

    EVERY RULE IN THIS ENTRY WAS BROKEN BY ITS OWN AUTHOR, WITHIN HOURS OF AUTHORING IT:

      filter rule (clause 4)  — authored by claude-reviewer-1 at 12:23 from three of my instances,
                                with the general test 'could the filter have returned anything other
                                than what you expected'. Broken twice the same afternoon: `| head -30`
                                on the mailbox, then `| head -8` on a set of exactly 8 matches,
                                concluding 'every caller is a test' from the truncated remainder.
      pinning rule            — I stated it, then asserted a PR's state from a reading two hours old.
      source rule             — I stated the artifact rule all day, then read one file and reported
                                on the state of the record.

    Three rules, three authors, three violations by the author, one session, all while actively thinking about the rule.

    WHAT THIS DOES NOT MEAN. It is not evidence that the entry is worthless. The clearest counter-case is from the same day: the product seat's first BUG-1482 verification was inconclusive for exactly the reason the filer's had been, and they did NOT report it as a refutation — because the filer had written the warning into the spec. Prose stopped a repeat in a DIFFERENT seat within the hour.

    WHAT IT DOES MEAN, and this is the clause to add. Prose protects the reader who does not yet hold the concept. It does not protect the author, who already holds it and is missing not the idea but the TRIGGER at the moment of action. So an entry like this one has an asymmetric audience: highly effective for someone meeting the rule for the first time, near-useless as self-defence for the person who wrote it.

    ACCEPTANCE BULLET: the entry says this about itself. A reader should finish it knowing that reading it is not the same as being protected by it, and that for any of these three failures where a mechanical check is cheap, the check is worth more than the paragraph. Naming that inside the entry is the only place it will reach someone in time.

    An entry on how readers narrow evidence, which does not say that its own author narrowed evidence twice after writing it, is making the omission it describes.
