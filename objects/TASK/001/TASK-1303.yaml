title: 'Session-discipline report-vs-artifact entry: add the pinning rule and correct the two command caveats'
description: |
  Follow-up to TASK-1302 / PR #2023, which is approved and merged. Five additions to the \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"Verify against the artifact that ships\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" section of the session-discipline guide. Master first, then mirror to the project copy - the two are required byte-identical by the discipline-pack parity test.

  1. THE PINNING RULE (the advisor flagged this on TASK-1302 as a follow-up rather than a round; recording it here so it survives).
  An artifact reference must be PINNED, not re-derived: capture the identifier and its content in the same operation, and quote that identifier. A head can move between two individually-correct commands a minute apart and both readings will look authoritative. This is the gap the table does not close - its first row recommends \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"git show HEAD:<path>\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" and HEAD is exactly the thing that can move underneath you. AUTHORSHIP SUPPRESSES THE RE-READ REFLEX, and that is what makes this clause hard to follow rather than hard to understand. Worked case: a reviewer recorded a verdict, re-verified the CI checks at the head five minutes later, merged - and did not re-read the verdict, which a second reviewer had overwritten with a refusal in the interval. The same person had discovered that overwrite behaviour that morning, had it happen to their own verdict, and had written the warning down for someone else. The stale-green shape is already distrusted because it arrives from elsewhere; an artifact you authored does not feel like evidence that can change underneath you, so no reflex fires. State it that way: the reading most likely to be stale is the one you wrote yourself.

  2. THE RECOMMENDED COMMAND EXITS 1 ON THE CLEAN CASE.
  Verified empirically: grep -c with that alternation returns count 0 and exit status 1 when no markers are present, and exit 0 with a count when they are. The SUCCESS outcome therefore looks like a failure to set -e or to any caller checking the pipeline status. This matters more than usual here because the entry is scaffolded to downstream projects and the command will be pasted into scripts, and because an entry whose thesis is \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"a step report can mislead\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" should not ship a check whose exit status misleads. Either note the inversion inline or recommend a form that does not invert, for example piping to a count comparison rather than relying on the grep exit.

  3. THE MARKER REGEX FALSE-POSITIVES ON MARKDOWN.
  Verified empirically: the ^=======$ branch matches a markdown setext heading underline of exactly seven equals signs, reporting count 1 and exit 0 on a file with no conflict at all. The incident the entry documents was a conflict in a markdown discipline file containing a table, so this is the exact file class the advice targets. It fails safe by over-reporting, so this is precision rather than correctness - but a one-line caveat costs nothing.

  4. THE THREE NARROWING CLAUSES, as ONE section with the relationship stated.
     - FILTER / narrowing in SPACE: checking the artifact rather than the step's report does not help if you then look only at the part of the artifact you already believe. A grep, a jq selector, a --json field list, a 2>/dev/null and a head are all filters. The test: could the filter have returned anything other than what you expected? A filter can also change what the instrument DOES, not only what you see of it - a piped read that suppresses a write is the case that proves it. A SECOND VARIANT NEEDS A DIFFERENT TEST, because the first one cannot detect it: a narrow PATTERN does not drop rows, it never admits them. Nothing is suppressed, so asking what the filter excluded returns nothing to notice, and the result comes back looking plausible - a wrong pattern usually returns zero and announces itself, a narrow one returns a number. Three counts in one session failed this way and each needed a third reader: a *.md glob that missed a .yaml file, an equality test on one writer's name that would have silently narrowed to a historical cohort the moment that name changed, and a match on one phrasing of a refusal that missed the same gate's other phrasing. The test that works here interrogates the PRODUCER rather than the filter: when counting by a string, ask what OTHER strings the same producer emits for the same event.
     - PRE-REGISTRATION / narrowing in TIME: when you can state what an outcome will look like, state it before you look, and state separately what it will NOT establish. An explanation formed after the evidence fits by construction.
     - SOURCE / narrowing in SOURCE: knowing WHICH ARTIFACT holds the fact is prior to reading it correctly. Reading the right file correctly, when it is not the whole record, produces a confident wrong answer no care in the reading would catch. Worked case: a verdict appeared destroyed because the PR-keyed handshake was overwritten; the spec-keyed record written by the same command was intact. Code instance the same day: a coordination surface reading the forge's review decision correctly while the refusal lived in the substrate. THIRD instance, on WRITING rather than reading: three binding items were recorded as comments whose opening words asserted they were acceptance, while the description's acceptance section did not contain them. A spec queued for automation would have shipped without them. The self-certifying form is what hid it - a comment that says \\\\\\\\\\\\\\\"putting this in acceptance\\\\\\\\\\\\\\\" reads as done to anyone skimming, including its author moments later, the same shape as a doc comment that certifies the code beneath it. The verification move is the same as for reading: after writing a binding item, read the spec back and confirm the words are in the section that binds, not in the one you just wrote.
  None of the three is detectable by reading more carefully, which is what makes all three rules rather than cautions.
  ACTIONABLE HALF of the source clause: when a write produces more than one artifact, establish the full set before concluding anything about the record.

  5. A TEST YOU HAVE NEVER OBSERVED FAIL IS NOT YET EVIDENCE - one line under the existing CI row, generalising it from jobs to any check.
  The operational form is what makes it a requirement rather than an aspiration: revert the change with the test in place and show it red. \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"The test must be capable of failing\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" is a property nobody can check by looking. Limiting case, same day: a test named for the production path it claimed to guard used include_str! on its own module and split_once on two markers whose first occurrences were its own string literals; it scanned ~93 characters of itself and passed identically before the fix, after the fix, and with the fix reverted.
  AND THE SHARPER FORM, which justifies ADDING a test rather than trusting the suite you have: a mutation that breaks everything demonstrates nothing. Showing a test red establishes it CAN fail. Showing it red under a mutation narrow enough that the rest of the suite survives establishes it catches something NO OTHER TEST catches - a different and stronger claim. Worked case: a first mutation removed a filter from both branches of a lookup and broke the pre-existing positive test too, proving nothing about the new test's contribution; narrowing the mutation to one branch left the positive test green and the new test red.

  6. SEVERITY AND URGENCY ARE THE TWO CLAIMS NEVER READ OFF AN ARTIFACT.
  Every other part of a report has a source someone can point at: the file, the line, the run id, the timestamp, the patch-id. Severity and urgency have none - they are always inferred from the facts rather than found among them. That is why they are the parts to state tentatively when writing, and the parts a reader should discount first when evaluating.
  Two worked cases from one session, both the author's own. A defect was reported as \\\"serious\\\" without anyone asking which way it FAILED; the failure direction turned out to be closed - it refuses rather than authorises - which reversed the disposition entirely. And a branch was reported as urgent on a cost-of-delay argument that did not hold, because there was nothing to rebase; the underlying finding survived, the urgency did not.
  The pattern in both: the finding was read, the severity was reasoned forward from it. State the facts with their sources, then state severity separately and mark it as judgement. A reader who cannot tell which is which will take both on the same authority - and severity is the half most likely to be wrong.

  7. A CLOSING PARAGRAPH ON THE ENTRY'S OWN AUTHORITY - not a clause, the last thing in the section.
  Drafted by the advisor, placed by the reviewer, read back - which is the rung discipline applied to this spec itself. Ships downstream, so no identifiers. Suggested text, wording free to change; the two load-bearing claims are that CARE is what failed, and that the substitute is an ARRANGEMENT rather than an effort:

      A note on this entry's own authority. Every rule above was broken by the person who
      wrote it, within hours of writing it, while actively thinking about that rule. Each
      time the error was caught - and not once by its author noticing. It was always a
      second reader holding a different piece of the record: a different file, a different
      timestamp, a different half of the same command's output.

      So the entry is not an argument for reading carefully. Care is what failed in every
      case recorded here. It is an argument for arranging work so that someone else holds
      a piece you do not, and for treating their disagreement as information rather than
      friction. Where you cannot have that, spend the mechanical checks above - they are
      a poor substitute for a second reader and much better than nothing.

  ## Acceptance

  - The section states the pinning rule, tied to the table row that recommends reading HEAD.
  - The section carries all THREE narrowing clauses - space, time, source - as one section with the relationship stated, not as three unrelated cautions. A reader who takes only one must still come away with the general form: the evidence you narrow is the evidence you will reason from.
  - The filter clause states that a filter can change what the instrument DOES, not only what you see of it.
  - The source clause carries its actionable half: when a write produces more than one artifact, establish the full set before concluding anything about the record.
  - A line under the existing CI row generalises it to any check: a test you have never observed fail is not yet evidence, and the operational form is revert-the-change-and-show-it-red.
  - That line also states the narrow-mutation form: a mutation that breaks everything demonstrates nothing; isolating a test's unique value needs a mutation the rest of the suite survives.
  - The exit-status inversion is either fixed in the recommended command or called out inline where the command appears.
  - The setext false-positive is noted, or the regex is tightened so a markdown heading underline does not match.
  - Master and project copy remain byte-identical and project_discipline_pack_matches_master still passes.
  - No SPEC-IDs appear in the guide text, since it is scaffolded downstream.
  - The section states that severity and urgency are the two claims with no artifact behind them, always inferred rather than found, and therefore to be stated tentatively by a writer and discounted first by a reader.
  - The section ends with a closing paragraph stating that every rule in it was broken by its own author while writing it, that no instance was caught by its author's care, and that the entry is therefore an argument for an arrangement in which a second reader holds a different piece of the record - not an argument for reading more carefully. It must also say what a reader without that arrangement should do instead.
  - The filter clause carries BOTH tests and says why the first does not cover the second: ask what a filter could have excluded, and separately ask what other strings a producer emits for the same event, because a narrow pattern suppresses nothing and so leaves nothing to notice.
