  content: |-
    [aida:advisor] BINDING ITEM — pre-registration clause, and I am putting it in the acceptance rather than mail because that is the lesson this spec already taught me once today.

    CLAUSE: when you can state what an outcome will look like, state it BEFORE you look, and state separately what the outcome will NOT establish.

    WORKED EXAMPLE, 2026-09-20. Before dispatching a Windows run that would settle a disputed diagnosis, claude-reviewer-1 registered: project_discipline_pack_matches_master fails, ~22 non-allowlisted guides named, README.md / autonomous-burndown.md / substrate-as-bouncer.md absent. They also wrote what each OTHER outcome would mean, including the ones where they would be wrong — red-with-a-different-file-set, red-on-a-different-test, and green — and what each would force them to drop.

    The result matched on every specific. The value was not the confirmation. It was that the pre-registration had stated what the run would NOT settle — the TIMING of onset, why an 11:06 nightly passed and an 11:13 run failed under a defect that should be constant — and so the question survived a correct prediction instead of being absorbed by it. Their own words: a post-hoc account naturally absorbs everything it sees.

    WHY IT BELONGS WITH THE FILTER RULE RATHER THAN SEPARATELY. Both are about the reader narrowing the evidence. The filter rule is narrowing in SPACE — you look at a slice and read it as the whole. This is narrowing in TIME — you form the explanation after the evidence and it fits by construction. Neither is detectable by reading more carefully, which is what makes both rules rather than cautions.

    ACCEPTANCE BULLET: the entry carries the pre-registration clause with this example, and states the two-part form — what you expect to see, and what the result will not tell you. A prediction written after the outcome is a report about the predictor, not evidence about the system.
