- id: 01a22049-f16d-76d1-83d3-16d3afb26fc9
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: TASK-3891 adds an unattested sweep, `aida doctor heal repair-reservations` with no --id/--attest, behind RepairGuard::release_dead_reservations. The core logic is sound and fails closed. OPEN, unknown or unreachable forge state, a live or unverified lease, an unreadable tree and a failed salvage all keep the reservation. Forge and salvage run unlocked and are re-proven under the journal lock, and ReleasedMerge is recorded, so require_validated_merges still fences the published repair merge. AC1: behavior verified by task_3891_releases_closed_and_merged_dead_lanes_after_salvage, but the salvage destination is <main>/.aida/salvage/<tree>/, not the ~/salvage the AC names (implementer-flagged deviation; unmet as worded). AC2: verified by the same test (printed line and journal ReservationRelease reason carry id, PR state, salvage path or ''nothing to salvage''). AC3: verified at unit level by task_3891_open_unknown_or_live_keeps_attested_path. Blocking: this is a new authority path that releases without attestation, and nothing tests its operator gate or the production forge-state mapping (ADR-76 strict tier). CI pending at review time.. No triage reason was given.'
