  content: 'Design refinement: treat the history cache as append-only by default. When the aida-store HEAD is a descendant of the indexed HEAD, decode only the new commits and extend the cache. Do not rebuild merely because the cache is old. Rebuild or repair only for corruption, incompatible schema, missing indexed commits, or detected non-fast-forward/history rewrite; record the reason and source-head transition in cache metadata.'
