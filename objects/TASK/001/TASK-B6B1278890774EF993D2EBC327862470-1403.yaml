  aida-cli-lib/src/review_watch.rs:3696–3703: The singleton pull_requests requirement stalls automatic promotion when Actions associates a run with multiple PRs sharing a head, including cases where the metadata contains enough independent information to distinguish branches. The integration pre-check records this limitation, and the fixture covers only mismatching singleton owners. Use additional authoritative run-to-PR evidence where available to distinguish those runs, retain refusal for genuinely ambiguous evidence, and test both cases with shared-head PRs.
