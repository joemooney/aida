title: 'Persona gate parity polish: one shared refusal-label function so CLI and MCP emit identical text per operation, and a real (CLI argv, MCP tool) parity test for guest and requester'
description: |-
  Follow-up to BUG-1197 (#1913), split out by the advisor so the security fix could land. The drain reviewer's round-3 findings (later withdrawn by its own round-4 approval of unchanged code) were valid polish against the BUG-1197 acceptance ("refusal text identical on both surfaces"; "a parity test asserting the set of refused MCP tools == the set of refused CLI commands"):

  1. Refusal-text parity: stakeholder_mcp_action_label (mcp.rs) defaults denied tools to "writes" while the CLI stakeholder_action_label (lib.rs) renders the equivalent command as "database writes" / other operation-specific labels. Share ONE label function across transports (map MCP tool → the same StakeholderAction label the CLI uses: db_sync → "database writes", session_* → "session writes", role_* → "role writes", queue_* → "queue operations", add_relationship → "relationship writes", add_comment → "comment writes", update_requirement → "editing requirements", add_requirement → "adding requirements") so the refusal string is byte-identical for the same operation.
  2. A REAL parity test: stakeholder_mcp_policy_covers_every_descriptor_via_shared_actions compares the MCP decision to the shared action it was derived from (tautological). Add a table of (CLI argv, MCP tool) pairs — (["aida","db","sync"], "db_sync"), (["aida","session","start","--owns","X"], "session_start"), (["aida","role","enter","advisor"], "role_enter"), (["aida","queue","add","X"], "queue_add"), (["aida","edit","X","--title","y"], "update_requirement"), (["aida","list"], "list_requirements"), (["aida","mcp-serve"], none) — and for guest AND requester assert the allow/refuse decision matches and, when refused, the refusal text is identical.

  Pairs naturally with BUG-1211 (CLI requester --parent/--feature/--owner refusal, shared field const) — do both in one PR if convenient; trailer both ids.

  Acceptance: identical refusal text per operation across surfaces (test); the parity table test exists and passes for both personas; existing stakeholder tests green.
