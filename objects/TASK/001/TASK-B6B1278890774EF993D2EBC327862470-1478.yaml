title: 'Review follow-up: Cost and cap: BASE_WINDOW=2000 does not fit this repo. Over 2000 main commits, `git log -p'
description: |-
  From BUG-2733
  Reviewed sha: efe42749706c6242f8d43f7d112fd8b05003df13

  Cost and cap: BASE_WINDOW=2000 does not fit this repo. Over 2000 main commits, `git log -p` with these flags is 151 MB and took 84s here, beyond both PATCH_CAP (64 MiB) and CALL_TIMEOUT (20s), so a long-lived branch silently falls back to keeping every commit (the pre-fix behaviour). Each call also runs log -p twice (forward and -R) over the same window, and ship calls already_on_base about 3 times (co-author override, squash body, spec records). Computing the window once per head, or deriving the reverse ids from the forward read, would bound the cost. File: aida-cli-lib/src/base_patch_equivalents.rs:19-27,86-91.
