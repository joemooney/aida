description: |-
  Advisor aida-d3 2026-11-27 14:47 (filed by product-15): the BUG-2784 review's CR item 4 follow-up.

  ## Acceptance
  - AC1: merge_publication_head runs its git merge with the same union-merge env (json_union_merge_config / sandbox_git_config_env) that rework prep applies, if it does not already; a test proves a disjoint ratchet-set.json addition merges cleanly through merge_publication_head.
  - AC2: a doc note (docs, not code unless trivial) records the read_allowlist visibility residual: if main's scripts/json-union-merge.py is absent or unreadable inside the sandbox, the wrapper falls back to a text merge (markers on conflict; a clean text merge passes as git's default).
