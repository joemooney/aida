    ## Implementer self-review
    Reviewed HEAD: d862b39140

    **AC1** [behavioral-test]: no code change needed. `merge_publication_head` (aida-cli-lib/src/seat_clone.rs:3762) already sets `merge_env = lane_merge_env(main, &identity)`, the same helper `prepare_rework_merge` uses (seat_clone.rs:3548), which chains `json_union_merge_config(main)`. `bug_2784_publication_merge_unions_json_list_additions` (aida-cli-lib/src/tests/bug_home_038_seat_publish_tests.rs:7130) pins it: a disjoint ratchet-set.json addition on the seat and the remote both land through `merge_publication_head`. Ran it via the lane runner, 1 passed, and with --nocapture there was no `SKIP (bwrap unavailable)` line, so the real sandbox ran.

    **AC2** [documentation-inspection]: docs/internal/testing/ci-test-shards.md has a new paragraph after the ratchet-set paragraph. I checked each claim against the code. The driver script resolves from main (`json_union_merge_script`). The sandbox read_allowlist binds only allowlisted paths (`sandbox_args`), so main's scripts/ may be missing. When the script fails, the wrapper runs `git merge-file`, which leaves markers on a conflict (the missing-script case is pinned by `bug_2784_rework_git_unions_disjoint_json_list_additions`).

    Probes: the diff is docs-only, so there is no parsing, multiplicity or authority surface. Fixes: I reworded one ambiguous closing sentence. Residual risk: none new. `make check-ci-fast` exit 0.
