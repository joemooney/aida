  author: joe
  content: 'Advisor scope addition from TASK-1574 intake (AIDA-57 item 3, re-verified 2026-10-03): the existing -c/--comments flag is SILENTLY IGNORED in agent output mode — ''aida show BUG-1669 --full --comments'' renders 5,009 bytes (no bodies, no count, no hint) while AIDA_OUTPUT_FORMAT=human with the same flags renders 168,551 bytes and ''aida comment list'' renders the full 156KB trail. This is the measured mechanism behind the relay team''s ''show --full drops comments'' false-negative report (a reviewer nearly concluded an accurate quotation was fabricated). Therefore AC3 (''both flags accepted on both surfaces'') must mean --comments in agent mode ACTUALLY PRINTS BODIES, not merely parses. Add an explicit test: agent-mode show --comments contains a phrase from a deep comment.'
