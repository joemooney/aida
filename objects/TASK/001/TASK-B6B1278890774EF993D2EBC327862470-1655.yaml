title: 'Review follow-up: OPENCODE/PI review vendors (aida-cli-lib/src/vendors/review_runner.rs) were never run agai'
description: |-
  From STORY-3120
  Reviewed sha: 46c45d8538e1bbecd7b695f1f8c764a7dbb4c300

  OPENCODE/PI review vendors (aida-cli-lib/src/vendors/review_runner.rs) were never run against real binaries: neither is installed on the hosts. Two things are unchecked: whether `opencode run` reads the prompt from stdin, and whether OPENCODE_CONFIG_CONTENT's deny-all schema takes precedence over the global config. confinement_verified=false keeps them opt-in only (--agent), never auto-picked, and refused for --post-comment. Run a live smoke test before documenting them as supported.
