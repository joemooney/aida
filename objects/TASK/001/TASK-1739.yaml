title: 'BUG-1984 follow-ups: /proc/self/fd cross-check for the bind window (A1), test no-checkpoint-on-close, reopen back-off, skip snapshot handles, TUI-safe rebind note'
description: |
  Follow-ups from the merge-seat review of PR #2586 (BUG-1984, APPROVE at 2fb843988a) and the advisor's A1 ruling.

  1. **A1, close the bind window:** the holder records `stat(path)` just after `open_at` (cache.rs ~1647). A host replace inside that window (schema writes, lock retries), or before a sidecar is first adopted at a later check, records the new inode and never sees the split. On Linux, cross-check with `stat("/proc/self/fd/N")` for SQLite's own fds (find them by readlink-matching cache.db/-wal/-shm under /proc/self/fd). That reads the open file without opening a new handle, so no POSIX locks are dropped. Keep stat-at-bind as the non-Linux fallback.
  2. Test the disabled checkpoint-on-close (`SQLITE_DBCONFIG_NO_CKPT_ON_CLOSE`); a mutation removing it survived.
  3. Back off after a failed reopen instead of retrying on every `conn()` call.
  4. Skip the identity check on `read_snapshot` handles, so a pinned read transaction older than 60s isn't swapped out from under its reader.
  5. Route the rebind note away from raw stderr while a TUI owns the terminal (same issue as the existing cache notes).
