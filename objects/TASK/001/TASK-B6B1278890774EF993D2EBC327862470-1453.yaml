  summary: 'TASK-3911 completing. AC1 verified by task_3911_unset_knobs_admit_at_once_and_set_ones_parse plus source: max_compile_concurrency lives in the host [lanes] table (/etc/aida/lanes.toml, where the existing lane admission knobs already live). Unset admits at once. When set, abstract-socket host slots are held in run_one_authorized from job start to job end, so extra jobs wait in the runner. Range is validated at 1..=256. AC2 verified by the same test plus source at lane_job.rs:1904: CARGO_BUILD_JOBS is inserted into the job env before cmd.envs, and the lane bwrap wrapper does not clear the environment. AC3 verified by task_3911_job_waits_below_memory_floor: the job waits below min_job_memory_headroom_gib, gives its slot back while waiting, is refused when memory cannot be read, and stops cleanly when the lane ends. AC4 verified by task_3911_third_compile_job_waits_for_a_slot. The job timeout starts after admission, so time spent queued does not count against it. The host fast gate goes through the same path. A missing config file means defaults. Two non-blocking follow-ups: an integration test gap and a rollout ordering note. The 4-commit stale base does not touch these files. CI was pending at review time; merge-hold-gate is green.'
