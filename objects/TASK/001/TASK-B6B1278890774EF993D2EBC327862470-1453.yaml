title: 'Cap concurrent lane compiles by memory: [lanes] max_compile_concurrency and cargo_build_jobs knobs, plus a memory check at job start (dell1 OOM 2026-11-25)'
description: |
  advisor-122 2026-11-25 15:00 (filed by product-15). At 14:53 on dell1, 8 concurrent Claude implementer lanes each compiled aida_cli_lib (one rustc process uses 5-14G at peak) in check-ci-fast or cargo test. Load hit 247, 62/62G RAM and 7/7G swap were in use, and the kernel OOM-killed 23 processes in 30 min, including a NON-AIDA container workload on the host (uid 100997 "bundle"). Lane admission counts lanes and checks free RAM only at LAUNCH (MIN_GB), not at compile time. The product launcher was clamped to 5 by hand.

  ## Acceptance
  - AC1: a project knob in config, `[lanes] max_compile_concurrency` (default unset = today's behaviour), limits how many lanes on one host may run a cargo compile or test job at once; extra jobs queue in the lane-job scheduler instead of starting.
  - AC2: a knob `[lanes] cargo_build_jobs` (default unset) sets CARGO_BUILD_JOBS for lane jobs, so each lane's peak memory stays bounded.
  - AC3: lane-job admission also checks available memory at JOB start (not only at lane launch) and waits when below a configurable floor.
  - AC4: a test showing that with max_compile_concurrency=2, a third compile job waits until one finishes.
