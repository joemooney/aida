title: 'Review follow-up: [P2] Restrict review-pass health checks to the review watcher or instrument auto-train too'
description: |-
  From BUG-2674
  Reviewed sha: 0aeae185378bb67e48c086b5ddc961e8851a82b0

  [P2] Restrict review-pass health checks to the review watcher or instrument auto-train too. advisor_loop_service.rs:204-219 now applies pass_degradation to TrainStatus as well as Status. review_watch_train_service.rs includes this same file with TRAIN=true, but advisor_loop_train.rs:79-114 never calls record_pass/controller_pass_report and never writes auto-train/last-pass.json. Every otherwise healthy live auto-train worker therefore becomes degraded after the 15-minute no-report grace, reporting 'no discovery pass since the worker started' even while completing successful train passes. Guard the review-specific health calculation for TRAIN, or provide train-specific pass evidence and deadlines. Cover a healthy long-lived train status.
