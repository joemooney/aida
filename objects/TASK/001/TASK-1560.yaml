  content: |
    ## Cross-link: the worked example is BUG-1737

    The description's `BUG-???? (filed alongside this)` is **BUG-1737** — `aida list`'s count
    reading as the backlog when it is a 6x-narrower active view.

    It is the worked example of the fourth tier: the session-#8 lesson was originally written as a
    Claude-only memory saying "remember 52 is an active view, the real number is 332". That is the
    weakest available fix — per-agent, erasable, and it asks every future seat to compensate for a
    surface that misinforms them. Filing it as a defect means no seat has to remember anything.

    **Use it as the discriminator when classifying the memory pack under AC2:** for each entry, ask
    whether it is a habit an agent should carry, or a symptom of something the substrate should stop
    doing. If the latter, it becomes a spec and does not belong in a discipline doc at all.

    Both specs are `draft` deliberately — I filed them, so I must not approve them. They need
    independent disposition.
