description: |
  From BUG-2674
  Reviewed sha: ffd52c08797563a2ef81537637e9b1d2db088a85

  [P2] review_watch.rs:3072-3075, 3088, 2913-2917: when a pass stops on a global error, the accumulated refused/busy evidence is dropped (only the stop is recorded, busy=0). Deferred; noted on BUG-2674.

  ## Acceptance
  1. In a review-watch pass, observe a busy change, a refused change, then a whole-watcher stop. Assert that the final pass report retains the earlier busy count and refusal evidence and records the stop separately with its diagnostic.
  2. Processing stops at the whole-watcher failure. Preserve the bounded refusal sample, total refusal count, and existing suppression of a superseded image's report.
