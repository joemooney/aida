title: 'Review follow-up: [P2] Retain failed confirming rerun requests for retry. main_watch.rs:868-878 sets rerun_r'
description: |-
  From STORY-2897
  Reviewed sha: 81cbe3ada1c6b53f5e155c698a2a61d90c062cca

  [P2] Retain failed confirming rerun requests for retry. main_watch.rs:868-878 sets rerun_requested=true even when rerun_failed returns an error. A temporary API failure (or a pass deadline exhausted before the POST) permanently suppresses the promised confirming rerun; a flake instead ages into a fix BUG/operator alert at 30 minutes without ever being rerun. Track successful requests per run and retry failed runs on later passes without repeating successful requests. Cover a failed POST followed by success.
