    (a) Promisor lazy fetch: the local cat-file probe sets GIT_NO_LAZY_FETCH=1. I verified on this host's git 2.43.0 (the same version as dell1) with a promisor clone missing the object. With the variable, git prints 'lazy fetching disabled' and does not fetch; without it, the same probe fetches.
