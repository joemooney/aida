title: 'BUG-2737 deferred: resolve the risk merge base when the target advanced after review prep; bound the gh resolver inside the risk timeout'
description: |
  Deferred from #4477 BUG-2737 (landed 7e7e5f16240 with advisor-122 approval; filed by product-15 per the 2026-11-24 09:00 ruling). LOW. Two medium items.

  ## Acceptance
  - AC1: (F1, event.rs:283) When the target branch advanced after the review checkout was prepared, review_risk_pr_base must still resolve the merge base correctly: fetch the advanced base OID, or fall back to a bounded remote merge-base, instead of a local-only `git merge-base` that misses it. Test with a base that advanced after preparation.
  - AC2: (F2, forge.rs:6971) The 15-second risk-evidence timeout must cover resolve_gh_binary_for_probe (`gh --version`) too, so a stalled resolver cannot block appending the verdict; the advisory evidence degrades to STRICT on timeout. Test with a stalled resolver.
