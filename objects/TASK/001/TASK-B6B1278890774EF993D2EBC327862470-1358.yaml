    FIX: build the fetch with aida_core::git_ops::host_remote_git_command(root, "origin") and the cat-file with host_git_command(root), keeping the same flags. Add a REFUSAL test (the seat-clone refusal fires through this path). Details: `aida show TASK-3874 --comments`.
