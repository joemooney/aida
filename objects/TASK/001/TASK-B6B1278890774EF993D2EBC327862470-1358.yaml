    INTEGRATION PRE-CHECK PR-4548 @ f81cee0cb8 (integration-30): ONE REQUIRED FIX (security), otherwise PASS.
    AC1: review_risk_base_object fetches the forge-observed base OID when it is missing locally (validates 40/64 hex, --no-write-fetch-head, --refmap=, --no-tags). The test advances the target after checkout. Good. AC2: the whole lookup, including resolve_gh_binary_for_probe, runs inside with_forge_lookup_deadline(15s). The stalled gh --version test proves the result is None, so the tier is Strict. Good. merge-tree vs integration a3397751429: clean.
    REQUIRED (F1, forge.rs review_risk_base_object): the new network fetch and its cat-file probe are built with raw Command::new("git") in root, plus .remote_credentials(). Remote-contacting host git must start from aida_core::git_ops::host_remote_git_command(root, "origin") (cat-file: host_git_command(root)). That builder refuses to run in a contained seat clone (BUG-2169), where seat-written config such as core.sshCommand, remote.origin.uploadpack, url.*.insteadOf or protocol.ext.allow would otherwise execute on the host during the fetch. It also applies host_git_hardening (fsmonitor off, hooks pinned). Raw git here makes a verdict append in a seat-controlled checkout a host command-execution path. The fix is about 4 lines; keep the current flags. Add a test that the fetch is refused in a seat clone root, or assert via the existing bug_1929 guard pattern.
    Route: a micro-round on the same branch; READY follows after FAST on the fixed head.
