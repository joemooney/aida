- id: 01a210a3-1ac6-7830-9014-104f0f59e4ac
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3874):
    Verdict: CHANGES REQUESTED
    Reviewed commit: f3d120c1fd5d
    Recorded: 2026-11-25T02:55:59.772504258+00:00
    Findings:
    1. aida-cli-lib/src/forge.rs:7160 — The supposed local check can contact a promisor remote in a partial clone. Resolving `<base>^{commit}` parses the object, and a missing object causes Git to launch an implicit fetch before `host_remote_git_command` can configure credential handling. A stored credential-bearing HTTPS URL can therefore reach a transport child's argv, bypassing BUG-2181 protection. Make the presence check strictly local on supported Git versions and route missing-object transport through the credential-aware fetch. Cover the partial-clone case. Git source: https://github.com/git/git/blob/v2.43.0/object-name.c#L1113-L1118 and https://github.com/git/git/blob/v2.43.0/promisor-remote.c#L15-L32
    2. aida-cli-lib/src/tests/task_3874_review_risk.rs:52 — TASK-3874 AC1 is only tested at the object helper. The test calls `review_risk_base_object` directly, so removing its call at forge.rs:7147 would still pass the advanced-base regression and the stalled-resolver regression. Drive the production PR lookup with a fixture that reports the advanced base and matching head, then assert that the returned base resolves to the expected merge base.
    3. aida-cli-lib/src/forge.rs:7168 — The explicit fetch can also download from the repository's configured `fetch.bundleURI` and update `refs/bundles/*` before looking up the requested OID. `--refmap=` and `--no-write-fetch-head` do not control this separate Git path. Prevent bundle retrieval for the advisory fetch so verdict collection only requests the pinned object from origin. Git source: https://github.com/git/git/blob/v2.43.0/builtin/fetch.c#L2185-L2189 and https://github.com/git/git/blob/v2.43.0/bundle-uri.c#L360-L381
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-25T02:57:34.406639499Z
  modified_at: 2026-11-25T02:57:34.406639499Z
