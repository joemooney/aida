  author: joe
  content: |-
    PARKED (advisor 05:13): needs a sketch before any further implementation. The r4 independent CR (#4560 @ 3e62e18b) found two HIGH issues:
    (1) the probe is built with host_git_command, so .gitmodules discovery reads objects before the guard decides;
    (2) it inherits GIT_CONFIG*, so the guard can be blinded.

    Sketch requirement: the partial-clone guard runs with a SANITIZED environment (no GIT_CONFIG*), makes NO object access before its decision, and is built from a minimal raw command.

    #4560 is closed unmerged. r2 (1bb67f0b4dd) is being reverted from integration via #4573, so p38 ships without TASK-3874.
