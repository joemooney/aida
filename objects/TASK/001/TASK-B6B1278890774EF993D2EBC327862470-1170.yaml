title: 'Review follow-up: write_state (main_watch.rs:341-347) renames a temp file that was never synced, while the j'
description: |
  From STORY-2897
  Reviewed sha: f037b9d28788d3673950b9986e88d91d0d0e42af

  write_state (main_watch.rs:341-347) renames a temp file that was never synced, while the journal is fsynced. After a power loss the state file can be empty or truncated, and every later pass then fails until someone repairs it by hand (see the silent-failure finding). Sync the temp file (and the directory) before the rename.

  Advisor scope and acceptance

  Recheck the persistence protocol after STORY-2897 lands. The S3a head 964a98c30ed already syncs the temporary state data before rename. The watch state replacement there returns after rename without syncing the directory entry. A directory sync after publication is needed for that rename's durability.

  If the shipped rework still has this gap, complete the atomic state replacement under the trusted watch directory using the existing persistence helper where it fits. Propagate failures and preserve restart consistency between the cursor, episode and pending journal transitions. Cover failures at the publication boundary with the existing watch failpoint/restart pattern. Keep this limited to the residual durability requirement.
