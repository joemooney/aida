- id: 01a207c9-e239-77d0-82a0-c0c4cb574dfe
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3195):
    Verdict: CHANGES REQUESTED
    Reviewed commit: bf941b3731f0
    Recorded: 2026-11-23T09:41:48.543349518+00:00
    Findings:
    1. TASK-3195 — aida-cli-lib/src/main_watch.rs:719–721 and :595–607. On restart after the rename succeeds but its directory sync fails, read_state can see the new cursor, episode and pending event in the live filesystem. Startup immediately calls flush, which appends and syncs the journal before doing another directory sync. If power fails after the append reaches disk but before the state rename is made durable, the old cursor and episode can return while the journal already has red_start. Scanning the red commit again assigns a fresh UUID at :613, so ID deduplication cannot prevent a second start. Before flushing a pending transition on startup, successfully sync the pinned state directory and propagate a failure before any append. Extend the failpoint case to assert that a failed retry still leaves the journal empty before a successful retry.
    2. TASK-3195 — aida-cli-lib/src/tests/story_2897_main_watch_tests.rs:665–668. The replay assertion counts events through read_journal, which deduplicates by UUID at main_watch.rs:586. A retry that appends the same transition twice would still satisfy both the count and ID assertions. Count physical committed records for the pending ID, as the adjacent boundary test does with the raw journal.
    3. TASK-3195 — PR #4418 description. The advisor brief asks the PR body to say when main already handles directory sync and the change adds regression coverage. The published body has only seat publication and fast-gate metadata. Add the baseline behavior and the scope of the added coverage to the description.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-23T09:43:20.889932641Z
  modified_at: 2026-11-23T09:43:20.889932641Z
