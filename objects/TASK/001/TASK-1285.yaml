  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #1959, advisor round 1):
    Verdict: CHANGES REQUESTED
    Findings:
    1. dev_cmd::binary_change_conflicts(pinned, target, activation) returns true whenever `activation` is true, so `aida dev activate` is refused in EVERY shell while any wave is live (the new test rebuild_refusal_decision_only_blocks_the_pinned_binary asserts this). Activation only edits the calling shell's PATH; it replaces no file and cannot change the binary the wave's children exec. Fix: activation is never refused — remove the activation branch (conflict = the operation would replace the pinned binary file, i.e. only the build-guard path); `aida dev activate` may PRINT the live-wave/binary line as information; drop `--after-wave` from activate or document it as wait-then-activate. Update the test (activate while a wave is live → Ok) and the CLAUDE.md sentence.
    2. (non-blocking) aida dev status / aida ps print binary_mtime_secs as a raw epoch; render local time like the rest of the CLI.
    Everything else stands: lock fields with serde defaults, build-guard refusal with the wave id, AFTER_WAVE=1 parking on QueueDrained with an EOF cursor and a lock-gone bail, tests.
    Contract: one commit for finding 1; the drain reviewer's findings (if any) stack on top.
