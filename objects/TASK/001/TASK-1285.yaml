    REVIEW GAP, recorded deliberately: no drain reviewer verdict exists for this PR. The drain shelved this spec at 12:46 with "CI is red on PR-1959: merge-hold-gate" — the hold-gate-only-red defect, third occurrence, now split out as BUG-1265 (approved, drain-safe, queued). Re-driving to obtain a reviewer round would hit the same shelve at the CI phase, before the reviewer, until BUG-1265 lands, so waiting could not produce one. I verified no live reviewer was working the PR (no orchestrator agent children, no verdict file touched) before shipping.
    reasoning: both advisor findings verified resolved in the final source — binary_change_conflicts is pinned == target with guard_binary_change called only from handle_dev_build_guard, so aida dev activate is never refused during a live wave (it only edits the calling shell's PATH); drain_lock takes binary_path from crate::resolve_aida_exe() with the mtime read from that path, so the BUG-217 no-raw-current_exe guard passes. The wave pin itself: DrainLock carries wave_id, binary_sha, binary_mtime_secs and binary_path behind serde defaults so older locks still parse; aida ps and aida dev status print the live wave and its binary; make build-fast refuses to replace the pinned binary while its wave is live, and AFTER_WAVE=1 parks on QueueDrained with an EOF cursor so a stale event cannot release it and a vanished lock bails instead of hanging. This closes SPIKE-82 gap 7 and makes the "never rebuild under a live drain" rule a programmatic gate rather than a habit.
