    1. TASK-1285 at 3b0a5f1f. Slice 1 shape is right: DrainLock records wave_id, binary_sha (AIDA_BUILD_GIT_SHA), binary_mtime_secs and canonical binary_path with serde defaults so old locks still parse; aida ps / dev status print the live wave and its binary; make build-fast runs a hidden `aida dev build-guard` that refuses to replace the pinned binary while its wave is live and, with AFTER_WAVE=1, parks on event_wait::wait_for_queue_drained (cursor starts at EOF so an old QueueDrained cannot release it; bails if the lock disappears without the event) — both tested. One defect blocks: dev_cmd::binary_change_conflicts(pinned, target, activation) returns true whenever activation is true, so `aida dev activate` is REFUSED in every shell while any wave is live (the test rebuild_refusal_decision_only_blocks_the_pinned_binary asserts exactly that). Activation only edits the calling shell's PATH; it replaces no file and cannot affect the wave's children. Required: activation is never refused (drop the activation branch; guard_binary_change is called only from build-guard, or from activate purely to PRINT the live-wave line), and --after-wave on activate is removed or documented as wait-then-activate; update the test and the CLAUDE.md sentence accordingly. Non-blocking: Makefile guard runs whichever `aida` is on PATH — a released 0.9.x prints the bootstrap note and proceeds, acceptable; dev status prints binary_mtime_secs as a raw epoch — render it as local time like the rest of the CLI.
