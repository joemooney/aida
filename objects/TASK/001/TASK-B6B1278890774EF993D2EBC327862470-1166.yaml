title: 'Review follow-up: A watch that keeps failing is silent. A corrupt state file (`fix or remove it`, main_watch'
description: |
  From STORY-2897
  Reviewed sha: f037b9d28788d3673950b9986e88d91d0d0e42af

  A watch that keeps failing is silent. A corrupt state file (`fix or remove it`, main_watch.rs:332-339), an invalid journal line (read_journal fails flush at line 553), a failing `git fetch` (history, line 1462) or lapsed gh credentials fail every pass, and the only record is the schedule ledger: .aida/config.toml adds no `on = ["CronJobFailed:red-main-watch"]` route job, unlike hub-drift-guard, landing-health-guard, dev-autopromote and the other guards. A red main is then never reported and nobody is told the watch is down.

  Advisor scope and acceptance

  Recheck after STORY-2897 lands. At S3a #4389 964a98c30ed the red-main-watch substrate job has no failure route. Handle job failures through the existing routed CronJobFailed mechanism. Keep the observation pass independent of requirement-store writes.

  - Route a failed red-main-watch invocation to the advisor seat with the failed job name and existing trip evidence. Include scheduler timeouts through the same route. Point the recipient to the failed step and preserve its diagnostic within the existing display bounds.
  - Check that the route qualifies exactly for red-main-watch failures and that a successful pass produces no failure item. Use existing scheduler cadence and deduplication, and preserve other jobs' routes.
