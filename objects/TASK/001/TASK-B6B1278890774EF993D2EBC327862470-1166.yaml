  A watch that keeps failing is silent. A corrupt state file (`fix or remove it`, main_watch.rs:332-339), an invalid journal line (read_journal fails flush at line 553), a failing `git fetch` (history, line 1462) or lapsed gh credentials fail every pass, and the only record is the schedule ledger: .aida/config.toml adds no `on = ["CronJobFailed:red-main-watch"]` route job, unlike hub-drift-guard, landing-health-guard, dev-autopromote and the other guards. A red main is then never reported and nobody is told the watch is down.
