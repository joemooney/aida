title: 'Review follow-up: parse_intent checks expiry only relative to registered_at. After a backwards clock correct'
description: |-
  From BUG-2703
  Reviewed sha: d0d953c3461a95653bc8dc20f6cb44f9abf978cf

  parse_intent checks expiry only relative to registered_at. After a backwards clock correction a future-dated intent with a live or unknown owner can withhold claims beyond the maximum. Adding slack to an extreme representable timestamp can also panic during admission or status. Use checked arithmetic and bound the remaining lifetime relative to observation time.
