title: 'Review follow-up: TASK-3823.acb3be0a: no CLI or launch line naming the effective reviewer model was obtained'
description: |
  From TASK-3823
  Reviewed sha: b4dccb59840c4b1b6aa0d00faacc1919f4e1baa8

  TASK-3823.acb3be0a: no CLI or launch line naming the effective reviewer model was obtained, and the codex CLI's acceptance of `gpt-6.2-astra` is unverified (AIDA passes model names through unvalidated, so a rejected name fails every codex reviewer launch on a head carrying this block). The spec comment of 2026-11-20T16:31Z moves this evidence post-landing, but its premise is wrong: `[agents.<vendor>.seats]` is NOT read from the default branch. `queue work --role reviewer` chdirs into the review worktree (aida-cli-lib/src/queue_cmd/work.rs:6614) and resolves tuning from that checkout's `.aida/config.toml` (aida-cli-lib/src/session/headless.rs:493, aida-core/src/agents_config.rs:112; registered as a worktree-channel key in scripts/config-trust.toml:910-913). The post-landing check as written ('first review-watch reviewer launch after landing must name the model, else revert') can therefore fail for a correct config: a PR whose head predates the landing does not carry the block, and the codex headless log inspected for PR-4369's first reviewer contains no model field at all. Run the check on a PR whose head contains the landed commit, with AIDA_AGENT_MODEL and AIDA_AGENT_EFFORT unset in the launching environment, and read the composed vendor argv (codex `-m gpt-6.2-astra`; claude `--model claude-fable-5-2 --effort high`). This review's own launch log names claude-fable-5-2, but the launch carried AIDA_AGENT_MODEL=claude-fable-5-2, so it does not prove the config path.

  Advisor acceptance handoff

  This is TASK-3823's pending post-landing acceptance check for the product seat. Use an already-needed, admitted review-watch reviewer launch with a PR head carrying 012b95ef890 and the exact reviewer settings. All 12 PR heads inspected on 2026-11-21 carried those settings. A PR-4373 pickup preview resolved Codex but printed no model or effort, so the preview does not satisfy this check.

  Record the exact PR head, checkout, vendor and effective model and effort arguments from the real launch, with AIDA_AGENT_MODEL and AIDA_AGENT_EFFORT clear in the launching environment. Verify that the vendor accepted the configured model and the reviewer began normally. Capture one eligible launch per vendor while the boost remains in force, or explicitly report which vendor was not exercised. Record only the evidence fields needed for acceptance and omit credential material. TASK-3171 covers adding a diagnostic. TASK-3824 retains the scheduled rollback.
