  content: 'Slice 3 implementer (claude): re-drive (A5/A6/A7) and mail-latency escalation are built on claude/task-1492. Cold-boot is NOT built: the signoff leaves these choices open, and the brief says to stop rather than improvise. (1) Which seat is launched for a job with seats=["*"] or several seats, and how is a seat name mapped to AgentSeat / vendor? (2) What does ''no live holder of that role'' read: agent_registry entries with role + live pid, presence, or discover_live_advisor_session? (3) What does ''overdue'' mean for a seat job: due_since older than its interval (STORY-1226 wording), or any due? (4) ''Never for a job that would drain or merge'': seat jobs are free-text prompts, so what is the test? An explicit per-job opt-in such as cold_boot = true, or something else? (5) Authority: a headless advisor launched by claude -p / codex exec with the seat''s normal permissions can approve or merge, which conflicts with ''never grant authority unattended''. What permission profile or prompt contract applies, and is cold-boot also a separate default-off local switch like redrive? (6) Where is the 4/day total counted: shift-state or ledger cold_boot_at? Also for the advisor, on mail latency: the signoff says ''per recipient''. On this box, 15 recipients have old unread mail, including junk addresses (33492, SPEC, main.rs), so the first enabled tick sends one combined notification for all 15. Should it be limited to known seats?'
