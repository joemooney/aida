title: Document or close the nlink=2 window in the verdict publish link-then-unlink fallback
description: |
  review_verdict.rs link_then_unlink (fallback for publish_verdict_no_replace when renameat2 RENAME_NOREPLACE is unsupported) hard-links temp to dest and then unlinks temp. Between the two calls dest has nlink=2, so a concurrent anchored reader (read_verdict_body) refuses the canonical verdict. This only happens on filesystems without no-replace rename. Document the window, or have readers retry once on an nlink refusal.

  Raised in review of PR-2712: https://github.com/joemooney/aida/pull/2712#issuecomment-6275752654
