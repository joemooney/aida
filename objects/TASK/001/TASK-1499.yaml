title: Make aida scaffold portable across local binary installations
description: 'Extend aida scaffold and agent-launch diagnostics so projects using a locally built AIDA binary work across machines without hard-coded checkout paths. Resolve the effective aida executable from an explicit override when configured, otherwise from the running executable or PATH; verify it is executable before launch; and report the resolved path in --no-exec --verbose output. Scaffold project integration and permission metadata without committing machine-specific absolute paths. The generated launch profile should distinguish the consumer project''s writable source, .git, .aida, .aida-store, cache, and build roots from the AIDA source/build checkout, which should remain read-only unless AIDA itself is being developed. Include the seat-based Git policy: normal development seats get Git-write by default, guest seats are Git-read-only, and --git-read-only can downgrade any seat. Routine AIDA commands should run without Codex approval prompts under the trusted development profile; remote and destructive operations remain separately gated. Acceptance: a scaffolded project resolves a locally built AIDA binary on at least two different filesystem layouts; diagnostics show the actual binary path and effective access policy; no generated project file contains a machine-specific absolute AIDA checkout path; and guest/read-only policy is visible before agent execution.'
