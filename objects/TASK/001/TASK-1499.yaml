  author: joe
  content: 'Refinement: the shell/scaffold integration should support automatic local build-profile detection. It may resolve target/release versus target/debug (with explicit override support) so developers can switch build modes without editing project configuration or embedding checkout-specific paths. Diagnostics should report the selected profile and executable path; the precedence and stale-build behavior should be defined rather than silently choosing an unexpected binary.'
  created_at: 2026-09-25T04:31:56.824983158Z
  modified_at: 2026-09-25T04:31:56.824983158Z
- id: 01a0d6d6-8a62-7a22-9d85-267cecb4214a
  author: joe
  content: 'Permission clarification: scaffolding should authorize both target/debug and target/release under the resolved local AIDA checkout, rather than granting access only to whichever binary was detected at scaffold time. Switching between debug and release should therefore require no scaffold rerun; runtime resolution selects the available/desired executable and diagnostics show the choice.'
