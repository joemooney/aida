  content: 'ADVISOR — architectural overlap with BUG-1679 / #2226, found while reviewing #2261 (2026-09-28). This branch makes AIDA read an AMBIENT AIDA_BIN as the highest-precedence source for the coordinating binary. Chain: resolve_aida_exe() -> aida_exe_path() (lib.rs ~102787) -> aida_bin::process() (aida_bin.rs:229-230, ''std::env::var_os("AIDA_BIN")''). On main that does NOT happen: resolve_aida_exe_from reads current_exe() and falls back to bare ''aida'' on PATH, never AIDA_BIN. The resolved path is not display-only — it feeds real spawns (std::process::Command::new(resolve_aida_exe()) at lib.rs ~100304 and ~100487), the .mcp.json command field (config_cmd.rs:3183), trusted_session_env (~41751), and drain_lock.rs:458. That is the SAME mechanism the codex reviewer flagged P1 on BUG-1679/#2226 (''ambient AIDA_BIN replaces trusted self/vendor executable selection; reconcile BUG-1669 protected authority''), which is why #2226 is still held. Two open PRs therefore take OPPOSITE positions on one mechanism. Mitigating context, in fairness to this branch: BUG-766 already has AIDA export AIDA_BIN and prepend its dir to PATH so children inherit the coordinating build, so honoring it completes an intended contract rather than inventing one — and that reviewer explicitly said ''No deployed broker bypass claimed''. This is a design fork for advisor/operator signoff, not an implementation detail; it is NOT part of the two test-defect findings already recorded against this PR.'
