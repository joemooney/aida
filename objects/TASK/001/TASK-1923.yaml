title: phase_driver_trait.rs:507 implementer-phase store commit masks watchdog diagnosis (BUG-2140 follow-up)
description: |
  The implementer phase runs commit_contained_child_store_changes("implementer phase")? BEFORE the BUG-420 WatchdogTripped classification. If the store commit is refused (an embedded-repo plant, or an unsafe store with pending changes) on a watchdog-tripped implementer, the drain sees FailureKind::Internal instead of the shelvable Watchdog failure with its BUG-1299 hint. The reviewer phase (phase_driver_trait.rs ~2137) already calls the commit best-effort inside the watchdog arm; mirror that pattern for the implementer phase.

  Raised in review of PR-2749: https://github.com/joemooney/aida/pull/2749
