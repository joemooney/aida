spec_id: TASK-1784
agreed_id: TASK-1784
title: worktree add after a hand-deleted worktree refuses with a misleading 'no local lease holds it' instead of re-minting
description: |-
  Follow-up from BUG-2143 #2675 round 2 (approved).
  - After 'rm -rf' of a spec's worktree, 'aida worktree add <SPEC>' exits 1: 'spec is InProgress but no local lease holds it'. The non-advisory lease still exists; it just isn't re-enterable.
  - Fix: when the only lease holding the spec is a non-advisory lease whose tree is gone, treat it as the caller's own (end it, then mint fresh). Otherwise, name that lease and 'aida session end <id>' in the error.
  - Add a test that mints through the real session_start; the current e2e stubs the mint and uses a repo-wide prune.
  - Document in the PR/CLI docs that spec leases at the project root are no longer re-entered.
