  scripts/check-ratchets.py MANUAL_SURFACE (lines ~30-33) misses CLI-surface files: clap derives (#[derive(Args|Subcommand|Parser)]) also live in aida-cli-lib/src/*_cmd.rs and other modules (e.g. memories_cmd.rs, autonomy_cmd.rs, goal_cmd.rs, help.rs, gate_cmd.rs, maintenance_schedule.rs), so a flag added there without regenerating the help golden makes local `make check-ratchets --manual auto` skip docs/cli/verify-manual.py. The brief asked 'when unsure, run it'. CI's Ratchet set step still runs it unconditionally (--manual always), so this is a local-coverage gap only. Follow-up: widen the set (e.g. any aida-cli-lib/src/**/*.rs whose diff touches clap attributes) or match *_cmd.rs.
