- id: 01a21817-f7f1-70c3-b620-0977c35be86f
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: ee342144b5 (git diff origin/main...HEAD; 3 files).

    Acceptance evidence:
    - AC1 [behavioral-test]: pr_train.rs admit_member is the one predicate (ownership + train-rider refusal, typed_gate_member_with, culprit hold). The real pass's member loop calls it; the pre-scan calls it through AutomaticPrescan::admits (read-only LiveChecks, dry_run ownership, ADVISOR_LOOP guard set and restored). train_wanted no longer calls train::eligible directly; eligible still runs inside the typed gate under the advisor loop, as it does in the pass. Test: pr_train::tests::task3917_member_predicate_refuses_a_rider_before_any_gate_read.
    - AC2 [behavioral-test]: Refusals cache keyed by (PR, head), 10 min window; Unavailable never cached; live-train listing loaded lazily. Test: task3917_idle_polls_rejudge_a_refusal_only_on_a_new_head_or_after_the_window.
    - AC3 [behavioral-test]: task3917_a_long_hold_names_the_running_train_phase and task3917_a_long_hold_names_the_recovery_phase. TEST_HOLD_WARN_MS is reset by a drop guard that also serializes the tests that shorten it.
    - Local: one lane cargo run, filter 'pr_train:: train:: admission', 425 passed, 0 failed. make check-ci-fast: exit 0.

    Probes:
    - Consistency: the pre-scan keeps only candidates the pass lists (train branches excluded, other base refused and cached).
    - Multiplicity: 0 changes means not wanted; it stops at the first admitted change; abandoned trains mean wanted (the pass closes them, freeing their riders).
    - Fail-open/authority: the pre-scan only decides whether to claim. An Unavailable verdict or a load error still means a pass runs or a failure is recorded, as before. The pass re-judges everything under the claim, so a wrong 'wanted' costs one pass and grants nothing.

    Residual risks:
    - A refusal that clears without a head move (CI turning green, an approval recorded) waits up to 10 min before the pre-scan sees it. I chose that trade between forge budget and latency.
    - The diff is 352 insertions, above the brief's 200-line budget. About 200 of those lines are tests; production code is about 150 net.
