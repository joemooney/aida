title: Auto-train pre-scan and real pass share one admission predicate; cache pre-scan forge reads (BUG-2769 follow-up)
description: |
  Follow-up to BUG-2769 (landed 2026-11-26 05:40 via train #4651). Deferred by advisor-122 (02:27 and 04:50 rulings on #4640). Filed by product-15.

  ## Acceptance
  - AC1: the auto-train pre-scan (train_wanted) and the real pass use ONE predicate (typed_gate_member_with + ownership), not the legacy eligible gate, so they cannot disagree.
  - AC2: dedupe or cache the pre-scan forge (gh) reads per poll so an idle loop does not spend the shared ~5000/h GitHub budget.
  - AC3: tests for the running-train and recovery AC4 phases, and reset TEST_HOLD_WARN_MS after the bug2769 tests (a test-isolation leak).
