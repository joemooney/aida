description: |-
  From TASK-3878
  Reviewed sha: 2161550dbc3e121e18305b3811c7917e8e6bd93f

  aida-cli-lib/src/stalled_reviews.rs:60–67 and repair_journal.rs:228–245 hold an exclusive repository-wide directory lock across queue children and advisor delivery, while existing journal readers and writers fail immediately on contention. An unrelated supported repair can lose its publication attempt when recording validation after compilation (seat_clone.rs:5639–5665). Limit exclusion to the repair admission boundary or make contention an explicit recoverable outcome for existing callers, and cover overlap between a sweep and in-flight publication.
