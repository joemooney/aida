  content: |-
    ## Implementer self-review
    Reviewed HEAD: 5739c066c3 (git diff origin/main...HEAD; 5 files).

    Acceptance evidence:
    - AC1 [behavioral-test]: lane_host.rs first_run_summary + task3961_first_run_summary_is_one_line_without_fail (unit, pass); init_cmd.rs calls report_summary in place of the per-check render and the separate bwrap block. aida-cli/tests/task_3961_init_output_short.rs asserts no line starts with FAIL, no UsernsBlocked, exactly one 'aida doctor --lane-host' pointer (command-level, pass).
    - AC2 [behavioral-test]: advisor hint removed; implementer sentence, global-role install lines and bypass line only under --verbose. Same integration test asserts each phrase is absent (pass).
    - AC3 [behavioral-test]: review_prepare.rs code_span pads only for backtick-edged, space-wrapped or blank content; acceptance_block prints a visible note for empty acceptance. task3961_code_spans_are_unpadded_unless_needed, task3961_missing_acceptance_is_a_visible_note (unit, pass).
    - AC4: the integration test above.
    make check-ci-fast: exit 0 (after listing the two review_prepare tests in scripts/ratchet-set.json).

    Probe findings: (1) code_span: CommonMark strips one space each side only when both are present, so padding stays for ' x ' and for backtick-edged content; unit-tested. (2) The 0-item case of the summary prints 'ready'; advisory (NOTE) checks are not counted; unit-tested. (3) BUG-585: removing the hint does not dead-end agents, because the 'aida done' refusal off a TTY names 'aida role enter advisor' (checked by hand on the released binary). (4) No authority or gate path changed: the summary uses the same inspect(root, false) as before and only changes rendering.

    Fixes during review: ratchet-set listing for the new review_prepare tests.
    Residual risks: users who relied on init's bwrap line now see it only via aida doctor; the batch prompt for a spec with empty acceptance still prints an empty section (prompt input, not the report).
