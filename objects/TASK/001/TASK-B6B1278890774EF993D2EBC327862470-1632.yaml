- id: 01a220d1-e699-7283-8e9f-0f00e63596e8
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: TASK-3961 meets its four acceptance criteria in its own tests, but it breaks two existing tests that still expect the old output. That matches the red CI at this head (cli-1, fast compile, Build). AC1 is verified by lane_host::task3961_first_run_summary_is_one_line_without_fail and aida-cli/tests/task_3961_init_output_short.rs: no FAIL lines, no UsernsBlocked, exactly one `aida doctor --lane-host` pointer, advisory checks not counted. AC2 is verified by the same integration test: the advisor hint is removed, and the implementer sentence, global-roles lines and bypass line now print only under --verbose. BUG-585 is not reopened, because punt_done.rs:582''s off-TTY refusal still names `aida role enter advisor`. AC3 is verified by task3961_code_spans_are_unpadded_unless_needed and task3961_missing_acceptance_is_a_visible_note. The padding rule follows CommonMark:
    pad only for backtick-edged, space-wrapped or blank content. AC4 is verified by task_3961_init_output_short.rs. Blocking: (1) bug_2752_codex_init_and_advisor_launch (aida-cli/tests/support/codex_init.py:99) runs `aida init` without --verbose and asserts that ''global roles installed'' is printed. init_cmd.rs:5320 now hides that line, so the test fails. (2) review_prepare.rs:3595 (s5_comment_over_cap_goes_on_stdin_truncated_with_fences_balanced) asserts the truncation note ends with ''` report.md `''. The note is built with code_span (review_prepare.rs:1716), which now prints ''`report.md`'', so the test fails. Both need updating to the new output, for example by passing --verbose to the codex_init.py init call or dropping that assertion, and by changing the s5 expectation to ''`report.md`''. After that, re-check CI for anything else these jobs hid.. No triage reason was given.'
