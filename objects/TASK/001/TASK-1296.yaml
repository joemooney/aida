    THE DEFECT THE LANE FOUND IS THE MOST VALUABLE PART OF THIS CHANGE, and it was not in the spec. A closed-unmerged PR never produces a merge commit, so it can never appear in the PR-to-SHA map, and it produces no Done candidate either. Both collections stay empty in precisely the case this feature exists to handle, so the pre-existing early-out would have skipped detection entirely. Both early-outs are now patched.

    The feature would otherwise have shipped looking correct and doing nothing, and its tests would have passed, because a test that constructs a stranded spec also constructs the conditions the early-out skips. Naming the shape for the next reader: a guard correct for every case anyone had considered and silently wrong for the one being added. Found by implementing rather than reviewing, which is the honest order — a reviewer reads that early-out and sees a function that looks right, because it was right until the requirements moved.

    WHAT I CHECKED RATHER THAN ASSUMED. The forge cost is bounded: the collector reaches the network only for specs that are Approved or InProgress, carry a parseable Review-PR number, and are not already resolvable from the git log. That third filter is the one that matters and it is present, so this is not a per-pull round trip for every spec.

    I also measured the cost I was worried about instead of asserting it. The store load moved ahead of the early-return, so every pull now pays a full load even on a no-op. On this repo that is about 0.6s across 3976 spec files — real but modest, and the drain calls pull after every merge. If it surfaces in the latency percentiles, the cheap fix is a cache-backed pre-check, since "are there Approved/InProgress specs whose title matches the Review-PR pattern" is answerable without parsing every YAML.

    ONE EDGE RECORDED RATHER THAN BLOCKED ON. `ClosedUnmerged` writes status Rejected. That is right for an abandoned PR and wrong for one closed in favour of a replacement — a rebase into a fresh PR, or a split — where the review story should follow the successor rather than terminate. Under the distinction settled earlier today, Rejected means declined with nothing adopted, and a replaced PR is not that.

    I did not hold, because the implementation makes a wrong rejection both findable and reversible: it writes an audit comment naming the PR and reason, and records a field change carrying the prior status. If this ever fires on a replaced PR, the fix is to look for a successor rather than assume abandonment.
