  content: 'Rework evidence at head 32e95b531f: GitLab pipeline 324 succeeded on the exact pushed SHA. Full test job 699 succeeded in 642.39s. Exact-SHA warm verify job 701 succeeded in 83.18s, logged identical previous/current verified SHA, and contained zero Compiling and zero Checking lines. GitHub Build also passed. The original blanket hash-to-time helper was proven unsafe because Cargo can reuse stale output when changed input receives an older synthetic mtime; it is replaced by last-successful-SHA state, changed paths retain fresh mtimes, and the target cache namespace is bumped to v2. Focused real-Cargo regression proves changed sources rebuild and exact-SHA retries are fresh. The 2026-09-19 punt remains explicitly unrecoverable per completed BUG-1285 and BUG-1450. Merge hold remains armed; status remains NeedsAttention pending independent review. Evidence: GitLab pipeline 324, verify job 701, test job 699, GitHub Actions run 35680474496.'
