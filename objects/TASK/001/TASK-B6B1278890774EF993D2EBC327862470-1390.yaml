  aida-cli-lib/src/test_env.rs:166–181. Both contention fixtures hold a flock and attempt the production call on the same thread, keeping the lock held until the call returns. A regression to blocking lock_exclusive deadlocks the test before its elapsed-time assertion. Use an independently controlled lock holder with bounded release or a watchdog child so that the blocking mutation produces a bounded test failure.
