title: 'Review follow-up: leases.rs record_refusal_on_landed_spec evaluates landed_refusal on the pre-read copy and '
description: |-
  From BUG-2738
  Reviewed sha: 5a1122ae5b2334814944b81c225392581cc5ccb4

  leases.rs record_refusal_on_landed_spec evaluates landed_refusal on the pre-read copy and does not recheck inside the update_spec_atomically closure, so under a concurrent status change the comment's 'status left <X>' can misstate the written status. Harmless to status (closure does not touch it, and the fallthrough shelve keeps the STORY-332 guard), but the check belongs inside the atomic read for consistency with shelve_spec_on_failure.
