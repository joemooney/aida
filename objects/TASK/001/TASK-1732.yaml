- id: 01a13e78-5640-76d2-93c0-ab88ba8ba024
  author: joe
  content: 'IMPLEMENTER DESIGN FORK (regen relay Session 2; no R2 code yet). Acceptance names a name-mapping adapter generated from GAPS, but neither the GAPS file format nor allowed adapter operations is specified. Parsing arbitrary prose into executable shell code would create an unapproved execution/containment surface. Proposed bounded contract for signoff: optional structured GAPS.toml at trial root with [environment] mappings from contract env name to regenerated env name (string-to-string safe identifier maps, no values/shell expressions); generate an argv/env adapter from that data only, preserving the same immutable oracle and confinement. Run raw R1 first, then a fresh scratch/install for R2; require identical check-name sets; record adapter input hash, sorted mappings, R1/R2 aggregates and R2-R1 delta in a versioned trial extension. The fixture renamed env var is implementable with that contract. Need decisions on structured input path/schema, mapping direction and scope (env-only vs executable/flag names), and persistence/version compatibility before code. TASK-1730 remains under validation; no new sandbox or launcher changes are proposed.'
  created_at: 2026-10-15T07:30:36.224135923Z
  modified_at: 2026-10-15T07:30:36.224135923Z
- id: 01a13e7f-bb24-7293-a057-835c18fd8eb8
  author: joe
  content: |-
    ADVISOR SIGNOFF (fire mode 2026-10-15 00:45): APPROVED as proposed. Shared contract with TASK-1733: ONE file, GAPS.toml at the trial root, format_version = 1, parsed strictly (unknown keys => error).
    [environment]: string-to-string map, contract env name -> regenerated env name. Both sides must match ^[A-Z_][A-Z0-9_]{0,63}$. No values, no shell. Adapter = for each mapping, export NEW=<value of contract var> into the oracle's environment (the immutable oracle and confinement unchanged). No other adapter operations in v1. A command/argv mapping is a later spec if ever needed.
    Run R1 first, then a FRESH root + install for R2. Require identical check-name sets, else error. Record adapter_input_sha256, sorted mappings, R1/R2 aggregates and delta in a versioned trial extension (trial format_version bump or an extension block; implementer's choice, documented). Fixture: renamed env var flips R1 fail -> R2 pass.
  created_at: 2026-10-15T07:38:40.804472819Z
  modified_at: 2026-10-15T07:38:40.804472819Z
  session_id: 20233459-56a6-48d3-8cb0-332dcfaf0277
- id: 01a13ee2-f591-71e3-8e17-9be5c5c292d4
  author: ai:codex:joe
  content: Forward execution-environment compatibility fork discovered while implementing the signed TASK-1730 rework (no R2 code yet). The approved [environment] identifier grammar permits e.g. AIDA_REGEN_TRIAL_ROOT = "PATH" or "PYTHONPATH". Exporting NEW=contract-value in the immutable oracle environment would then reintroduce trial-controlled PATH/import roots and defeat the new trusted-environment contract. Please rule on protected mapping targets (and source scope) before R2 implementation; ordinary identifier validation alone cannot preserve the invariant. Recommend denying oracle execution/control targets while permitting explicitly scoped locator aliases for regenerated-tool interface variables. Exact deny/allow scope needs advisor signoff, not an invented interpreter/env policy.
  created_at: 2026-10-15T09:27:03.825376313Z
  modified_at: 2026-10-15T09:27:03.825376313Z
- id: 01a13ee3-b429-7710-a80a-56a72e37f959
  author: joe
  content: 'ADVISOR RULING (02:30), adapter scope, amending my TASK-1732 signoff: identifier validation isn''t enough. TARGETS (the env names the adapter sets) must NOT be in the protected set: PATH, HOME, SHELL, ENV, BASH_ENV, IFS, TMPDIR, PWD, OLDPWD, and any name with the prefixes LD_, DYLD_, PYTHON, PERL, RUBY, NODE_, JAVA_, CLASSPATH, GIT_, XDG_, AIDA_, LC_ (LANG too), plus any variable the scorer itself sets for the oracle. SOURCES may not be AIDA_* internals or protected names. A violation is a hard error naming the mapping. Mapped VALUES are copied verbatim from the source variable; never path-expanded. Test: a mapping AIDA_REGEN_TRIAL_ROOT->PATH (and ->PYTHONPATH) is refused.'
  created_at: 2026-10-15T09:27:52.617772868Z
  modified_at: 2026-10-15T09:27:52.617772868Z
  session_id: 20233459-56a6-48d3-8cb0-332dcfaf0277
- id: 01a13efc-62c8-7b03-949a-3bba851aef32
  author: joe
  content: 'Session 5 remaining value-transport fork before R2 code: the protected-name ruling permits safe caller variables but ScoreEnv deliberately env_clear()s the caller environment. Proposed bounded transport: validate the complete mapping first; capture ONLY its explicitly named, nonprotected source variables from the caller once (never import the whole environment), copy those source names verbatim into raw R1 as the contract interface, then the same sources plus renamed target aliases into fresh R2; missing source = hard error naming the mapping, values never expanded or persisted. Confirm this transport/missing-source policy or specify the permitted source. R1 would otherwise have no contract variable and the renamed-env fixture would measure absent input rather than naming compatibility. No R2 code started.'
