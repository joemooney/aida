title: Warn before a seat grant expires; relay refuses to launch a seat whose grant has under 1h left
description: 'Follow-up from the BUG-1983 sketch (D5). MAX_GRANT_AGE is 24h, and relay seats routinely outlive it. BUG-1983 makes review record refuse on an expired grant, so long relay seats will hit a hard stop mid-run. Scope: (1) the SessionStart hook and the statusline warn when the active grant expires in under 2h, naming the expiry time and the re-enter command; (2) the relay launcher refuses to start a seat session whose grant has under 1h left, telling the operator to re-enter first. Done when: both behaviours are tested with a fixture grant near expiry, and an expired grant never surfaces first as a refusal in the middle of a relay run. Should ship no later than BUG-1983''s D3.'
status: InProgress
priority: Medium
