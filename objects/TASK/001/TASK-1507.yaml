  content: 'PROXY DECISION (orchestrator for Joe): accept round 3. Rework: B3, record the times of ALL commits in each merge''s parallel region (both sides plus the merge-base/fork point); fall back when the served range contains a second shared by more than one of them. B4, a budgeted catch-up commits a partial batch only if the old tip is an ancestor of the batch''s last commit; UNIQUE-constraint and ancestry failures are treated as corruption and trigger a reset, never a permanently dead index. N2a, when checking liveness, ignore aida-store-pre-squash-* backup refs and remote-tracking refs (only local branches and worktree HEADs count), so a compact still resets. Turn the reviewer''s probes (scratchpad/tests_with_probes.rs) into regression tests. If round 4 still finds a correctness bug, the orchestrator will narrow slice 1 to the conservative rule: fall back whenever the served range overlaps any merge''s parallel window.'
