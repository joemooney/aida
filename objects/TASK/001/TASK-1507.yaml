  content: |-
    MEASUREMENTS after rework (N3), 2026-09-25. Release build of claude/task-1507 at b61e37f04e. Store: a fresh clone of aida-store at 346d45df (37,769 commits, 25,762 events); neither the live store nor ~/.aida was touched. Host load average 4-6.

    Full build (aida cache rebuild --history, schema v2): 18.8 s, and 12.3 s on a second run; 73 MB max RSS. The rebuild now ends with the WAL truncated to 0 bytes.

    First attempt (NO_CKPT_ON_CLOSE only): a one-commit catch-up with --id got WORSE, at 2.0-3.2 s. strace showed one fsync of history.db taking 1.07 s on every run. The rebuild had left a 7.6 MB WAL behind. Each new process re-reads a WAL it never reset as un-checkpointed, so SQLite's auto-checkpoint copied all of it again on every commit. Fix: turn wal_autocheckpoint off. The index writer (the lock holder) runs wal_checkpoint(TRUNCATE) itself once the WAL passes 4 MB, and always after an explicit rebuild.

    After the fix, one new commit plus the query, with the requirements cache refreshed beforehand so only the history index is timed:
    - history events --id TASK-1505 -n 50: 0.03-0.09 s (5 runs); the git walk takes 0.68 s
    - history events --since 1d -n 50: 0.06-0.10 s (3 runs)
    - strace: 0 fsync calls on history.db*; the WAL stays small (about 260 KB after 10 catch-ups)
    - warm (no new commit): 0.02 s
    Before the rework this was 0.65-3.5 s, most of it the fsyncs of the close-time checkpoint.

    A plain aida history events call straight after a new commit still takes 0.9-1.7 s wall. All of that is the requirements cache (cache.db) refreshing for the moved HEAD: 13 fsyncs on cache.db-wal, 0.06-0.2 s each. It is outside the history index and was also included in the earlier figures.
