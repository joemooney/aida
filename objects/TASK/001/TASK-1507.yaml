    MEASUREMENTS (A8), slice 1, 2026-09-25. Release build of claude/task-1507. Store: a fresh clone of the live aida-store at HEAD 17309929 (37,721 commits); the live store and ~/.aida were not touched. Host was busy (load average 7-11), so wall times are noisy; each figure is one run unless noted.

    Cold full build (`aida cache rebuild --history`): 21.2 s wall, 73 MB max RSS; a second run under heavier load took 43.9 s. Result: 37,721 commits, 25,730 events, 26 MB file. The sketch estimated 1-3 min.

    Warm queries (index tip == HEAD). Each row: index-served / git walk (AIDA_HISTORY_CACHE=0). Output was byte-identical in every row.
    - `history events --shipped -n 10` (default 50-commit window): 0.052 s / 0.45 s
    - `history events --since 1d -n 50`: 0.053 s / 2.2 s
    - MCP default shape (`--all -n 100 --max-commits 500`): 0.025 s / 4.7 s
