title: Decide where GitLab CI runs before the canonical-hub flip
description: 'Prerequisite for EPIC-44, from the operator decision on 2026-10-12. GitLab CE and gitlab-runner (docker executor, concurrent=2) both run on the 6-core dev box. If GitLab becomes canonical, every MR pipeline is a full Rust workspace build competing with agent builds and aida dev build, which is the load behind today''s parallel-load flakes. Choose one: (a) a runner on another machine; (b) limit the local runner to concurrent=1 with CPU limits and accept slower pipelines; (c) keep GitHub Actions as CI on the mirror. Also port the PR-only gates (trace, coverage, doc-intent) to CI_MERGE_REQUEST_* and authenticate glab to gitlab.joemooney.com. Done when: a recorded decision, plus a GitLab MR pipeline running the full gate set without degrading local build times.'
