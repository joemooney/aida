    ## Blocking findings and bounded rework

    ### 1. Delivery does not contain the requested alias (AC 1–3, 6)

    **Important / delivery blocker.** At exact shared head, `cli.rs::PrCommand`, `lib.rs::run` and `pr_cmd.rs::handle_pr_command` lack the new verb. `docs/cli-format-json-audit.md:380` records a command classification without delivering that command. Done cannot be accepted for this whole delivery. This is not a finding of intentional falsification or an attribution to an operator.

    Reproduction: `git diff 5d4180e5ded8a55ad1b02beac5571c190d3da0ac 42d8338a5eedb7e56c955be8117434e781f3efb4`; inspect the complete PrCommand and pre-clap rewrite chain above. Compare `git show 74c9ad174f7c4cf2ab323f2a30f43d2874468e72`, and run `git merge-base --is-ancestor 74c9ad174f7c4cf2ab323f2a30f43d2874468e72 42d8338a5eedb7e56c955be8117434e781f3efb4` (actual exit 1). This statically proves non-delivery without running a potentially mismatched installed binary.

    Remedy: root must reopen/hand off **the same TASK-1715** through the authorized canonical path, then assign routine bounded work to a Sonnet implementer in a **fresh isolated branch**. Preserve both existing lines and PR 2458. Salvage/reconcile the real implementation selectively only after fixing findings 2–3; do not move the whole unrelated parent history or overwrite a peer branch. Required proof: new exact source head/tree and full diff, parsing N/PR-N/MR-N, equivalent shared queue-work dispatch, isolated refusal coverage, and a fresh different independent reviewer after the fix. This audit does not perform reopening, queueing or implementation.

    ### 2. Existing separate implementation does not resolve numeric identifiers by configured forge (AC 1, 2, 6)

    **Important / salvage blocker.** At separate commit 74c9ad174f, `lib.rs:6350` synthesizes `queue work id.clone() --auto-complete` without converting numeric input to a configured-forge change ID. Its `queue_cmd.rs:5899–5971` calls `parse_pr_arg(s)`; `lib.rs:92807` accepts a bare number, whereas `parse_review_scope:37475` requires PR-/MR- and returns None for that number. The queued-review-story lookup therefore has no typed forge for N. With the ordinary envelope unset it falls through to `resolve_pr_to_spec` (`queue_cmd.rs:5960`), whose source at `lib.rs:93100–93178` scans PR review titles and invokes `resolve_gh_binary` / `gh pr view`. It does not resolve the configured forge. A GitLab project's numeric N can therefore take GitHub backing-spec resolution instead of becoming MR-N; a matching GitHub backing spec can also replace the requested numeric scope with an implementation spec. If the envelope guard applies, the same absent typed lookup can refuse instead. These are static conditional paths, not claimed live subprocess outcomes.

    Explicit PR-N and MR-N are forwarded into the existing queue pipeline, which is the correct direction for reuse. MR-N does not match `parse_pr_arg`, and remains available to existing typed review-scope logic. No blanket assertion that GitLab support is wholly absent is warranted. The defect is the required numeric configured-forge mapping; delegation alone does not repair the identifier.

    Remedy: normalize bare numeric input with the existing configured-forge machinery into PR-N/MR-N before the common queue-work path, retain explicit identifiers consistently, and keep all gates shared. Do not add another lifecycle, shell recipe, authority override or new forge default. Required tests: number under GitHub and configured/self-hosted GitLab, explicit PR-N/MR-N, collision/lookup-failure cases as relevant, and equivalent queue arguments plus gate refusal. These tests must use private fake forge/store/config/runtime and assert no unexpected gh path for numeric GitLab. No runtime test was executed here.

    ### 3. Help, documentation/templates and coverage do not fulfill whole acceptance (AC 4–6)

    **Important / acceptance blocker.** Shared delivery has none of these changes. Even the separate implementation changes only three Rust files: `cli.rs:2037–2045` describes review but incorrectly calls `pr ship` “shipping merged code”, omits that authorized review can proceed to merge, and omits the `ship --no-merge` distinction. It adds just `cli.rs:16247::pr_review_alias_parses_properly`, asserting one PR-123 parse. No numeric/configured-forge/GitLab dispatch-equivalence or shared-refusal test is added. No lifecycle guidance or normal-generation review/aida-pr template updates exist in that commit. The shared table row is not that documentation or coverage.

    Remedy: complete the requested help distinctions, lifecycle guidance and relevant source templates, coordinate with the actual TASK-1613 compatibility refresh without undoing its thin delegation/--no-merge/explicit-autoqueue guidance, then generate outputs through the normal tooling. Keep `queue work PR-N --auto-complete` compatible. Add meaningful parser/dispatch tests for GitHub and GitLab plus representative existing refusal behavior using the shared gate path. Run focused existing checks, generation consistency and formatting on the eventual source head; attach actual commands/exits. No broad workspace suite is requested by this finding, and no existing full CI result transfers to the future head.

