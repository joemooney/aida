    ## Parser/remapping examination before judgment

    Immutable selected source files were exported with `git show <full-SHA>:<path>` into reviewer scratch `/tmp/task1715-audit-nr9i9dti`, with no `.git`, store, session links or live runtime linkage. See [numbered immutable excerpts](task1715-delivery-independent-evidence/numbered-source-excerpts.md) and [input hashes](task1715-delivery-independent-evidence/export-sha256.json).

