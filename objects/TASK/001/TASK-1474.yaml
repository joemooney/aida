title: Sync completed_at into the cache so aida list --sort completed uses the real completion time
description: TASK-1464's completed sort uses modified_at on Completed rows as a stand-in for completion time. The model already has completed_at and completion_sha (STORY-86, stamped by the auto-bump), but they aren't in the cache schema, so a post-completion edit (tag or comment) skews the sort. Add completed_at to the cache (with a schema-drift rebuild, BUG-627) and sort on it.
