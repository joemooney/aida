description: |-
  From BUG-2769
  Reviewed sha: 9b9aa8a69391fe68e5054a0d8d26e45b27800b4b

  advisor_loop_train.rs train_wanted: the unclaimed pre-scan judges PRs with the legacy `eligible` gate. That gate had no callers before this PR. The real pass uses typed_gate_member_with plus ownership, riding, culprit and supervised/draft-only refusals, and the two gates can disagree. (a) `eligible` admits but the pass refuses, e.g. an approved, green, supervised PR: every poll is 'wanted', so the claim is taken for a full gating pass that can only refuse. The hold is bounded and released, but the BUG-2769 starvation window does not shrink to zero. (b) `eligible` refuses but the pass would act, e.g. a failed or cancelled required check: the pass no longer runs, so its side effects for non-admitted PRs are skipped. These are the TASK-3105 full-tier retry request through full_tier_gate/request_full_ci, the BUG-2412 abandoned-train close, and the BUG-2750 store pre_pass. The approved-head-full-ci schedule job partly covers the first. No test pins that the pre-scan agrees with the pass's member gate. Follow-up: share a read-only pre-check with the real gate, or add a parity test.
