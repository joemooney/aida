title: 'Store-resolution polish: surface the init --refresh attach failure, route --file <dir> trackers/mcp through the distributed path, and give tracker imports the dispenser node id'
description: |-
  Non-blocking notes from the TASK-1486 review.
  (1) init --refresh drops the error from try_attach_store_worktree, so the user sees 'not attached' but not why (offline, diverged). Print the cause, as the main resolver does.
  (2) unattached_distributed_root misses the BUG-433 shape: .aida-store/objects present, no config, no aida-store branch. Make it agree with detect_distributed_store.
  (3) --file <dir> with a tracker command or mcp-serve still exits 'not yet supported'. Route it through run_on_distributed_store.
  (4) Tracker imports via run_on_distributed_store skip the per-write store auto-push and the dispenser, so oplog entries get node_id 0. Use the dispenser's node id and honour auto-push.
  (5) docs/admin-guide.md: say that an unattached distributed project first tries auto-attach; state that -p is ignored inside a distributed project; refresh the stale footer.

  ## Acceptance
  - Each item is fixed, or documented as deliberate, with a test where it changes behaviour.
