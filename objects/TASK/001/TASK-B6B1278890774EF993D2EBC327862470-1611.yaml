  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (command-level unit tests in review_prepare.rs):** when no reviewable files are in scope, `review prepare` (and `--run-review`, which then never starts an agent) prints a "Nothing to review" message naming the resolved range, notes uncommitted changes when a range is empty but the tree is dirty, and exits with new named code 5 (registered in EXIT_CODES, documented in `review prepare --help`).
    - **AC2 (same tests):** Markdown/JSON report carries a nothing-to-review line instead of `Passed: true`; SARIF gets `invocations[0].executionSuccessful=false` plus a notification saying no files were reviewed.
    - **AC3:** test `--from HEAD` with no committed changes (dirty tree → hint) and a workspace-mode run with a clean tree.

    ### Expected files
    - `aida-cli-lib/src/review_prepare.rs`
    - `aida-cli-lib/src/orchestrator_leases.rs` (EXIT_CODES row + mapping)
    - `aida-cli-lib/src/tests/golden/cli_help_snapshot.txt`
    - `scripts/ratchet-set.json` if listed

    ### Ambiguities / conflicts as questions
    - Does "empty" include a range whose changed files are all excluded? Treated as yes (0 reviewable files), and the message says how many were excluded.
