title: 'First-run: an empty review range reports ''nothing to review'', not a green pass (F11)'
description: |-
  ## Acceptance
  - AC1: aida review prepare (incl. --run-review) on an empty diff/range prints 'nothing to review' with the range it resolved, and exits with a distinct non-zero code documented in --help.
  - AC2: SARIF/report output for an empty range says no files were reviewed (never a pass).
  - AC3: tests for --from with no changes and for a workspace with no changes.

  Source: docs/plans/2026-11-27-fresh-user-walkthrough.md (on branch task-3951-fresh-user-walkthrough / PR #4782), section F11. Advisor aida-d3 2026-11-27 20:30 priority order; filed by product-15 for laning now (one spec per lane).
