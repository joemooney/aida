title: Cache schema-version check uses != so a dev build and the installed aida rebuild each other's cache on every alternation
description: 'From the TASK-1474 review: cache.rs ~987 compares SCHEMA_VERSION with !=, so when a newer dev binary and an older installed aida alternate on one project, each full-rebuilds the cache the other wrote. Older binaries already tolerate extra columns (the drift check only flags missing ones, and INSERTs name their columns). Rebuild only when the stored version is older than ours, or the required columns are missing, and let an older binary run on a newer additive schema.'
