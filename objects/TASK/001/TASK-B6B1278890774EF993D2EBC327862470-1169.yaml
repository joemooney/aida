title: 'Review follow-up: `aida land metrics` now fails as a whole when the watch journal has one invalid committed '
description: |
  From STORY-2897
  Reviewed sha: f037b9d28788d3673950b9986e88d91d0d0e42af

  `aida land metrics` now fails as a whole when the watch journal has one invalid committed line: land_metrics.rs:588 propagates read_journal's error with `?`, which also hides the merge, readiness and review-round numbers that do not depend on the journal. Report the red-main block as unavailable instead.

  Advisor scope and acceptance

  At S3a #4389 964a98c30ed, land_metrics still propagates a watch journal error before rendering the independent report. Proceed after STORY-2897 lands, and first recheck the landed S3a reader.

  - With a corrupt committed red-main journal line or an unreadable journal, keep merge, readiness, and review-round metrics available. Show that red-main metrics are unavailable in both human and JSON output, with a bounded diagnostic. Preserve the available red-main result shape for existing JSON callers.
  - Keep the existing valid-journal and absent-journal behavior. A truncated trailing line retains the journal reader's current handling. Exercise the CLI report with one corrupt committed line and assert independent metrics survive. Keep strict journal reads on paths that use it as state or transition evidence.
