title: 'Mass-change deferred findings from PR #4381 (TASK-3827) final round'
description: |
  Deferred under MASS-CHANGE mode (advisor-122 ruling 2026-11-22 12:15 MST) from the PR #4381 (TASK-3827) Changes Requested verdict at 160e9b17ed. These findings were blocking (unmet claimed AC / below-tier) and now defer; #4381 fixes only p1, data loss and security findings in its final round.

  ## Findings to address
  1. [p2/unmet-claimed-ac]  leases.rs:812 — The guard still has a blocking session-lease read. live_pass_with partitions shared claims before attaching lane evidence. For a same-host sibling clone, probe_session_liveness_with calls list_leases, which still uses read_to_string. A FIFO in that clone’s session directory stalls the entire observation. Use the bounded regular-file reader on this path and cover the production partition operation.
  2. [p2/unmet-claimed-ac]  lane_hosts.rs:249 — After 24 hours View::holder discards an unreleased expired claim, and View::hosts drops it too. A long-running lane without heartbeat renewal then gets a second STUCK-REWORK route. The authoritative round-3 interim rule requires unknown until release or affirmative liveness evidence. The three-day fixture currently asserts the opposite.
  3. [p2/unmet-claimed-ac]  land.rs:1087 — branch_names still treats a hyphen inside a multipart spec ID as a delimiter. A TASK-1 claim therefore holds task-1-216-work, suppressing a stall for TASK-1-216. Branch-only matching also misses equivalent padded IDs. Compare an exact branch or its complete parsed spec identity, including node segments and numeric padding.
  4. [p2/unmet-claimed-ac]  lane_hosts.rs:144 — judge validates heartbeat_at.trim() and computes expires, then recomputes the state through claim_staleness, whose heartbeat_age_secs parses the untrimmed value. Whitespace around an expired timestamp therefore yields Reporting and suppresses stalls indefinitely. Classify from the validated heartbeat or consistently reject it.
  5. [p2/unmet-claimed-ac]  land_stalls.rs:1375 — build_report sanitizes unknown lines before it appends the landing-history failure. landing_times returns Git stderr verbatim, so a failed git log can still add multiline, unbounded diagnostics to the report. Sanitize after the last insertion and cover the landings error path.
  6. [p2/unmet-claimed-ac]  lane_hosts.rs:458 — The routed-text filter leaves invisible formatting characters such as U+206A through U+206F and U+034F in host names, errors and messages. These values can still display identically while carrying different text. Apply a complete policy for default-ignorable characters and cover omitted ranges.

  ## Acceptance
  - AC1: Each finding above is fixed with a regression test that fails before the fix, or explicitly closed with advisor sign-off as not applicable to the landed code.
