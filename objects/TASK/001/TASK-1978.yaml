title: 'CI shard planner: guard that shard union covers every cargo test --workspace target'
description: |
  scripts/ci-test-shards.py commands() hardcodes aida-cli --bins/--test and aida-cli-lib --lib/--doc/--test selections. If aida-cli gains a lib target, or aida-cli-lib gains a bin or a test=true example, cargo test --workspace would run it but no shard would, and nothing fails. tests/test_ci_test_shards.py only checks synthetic packages. Add a test over real 'cargo metadata --no-deps' asserting every test=true/doctest=true target of every workspace member is selected by exactly one shard.

  Raised in review of PR-2762: https://github.com/joemooney/aida/pull/2762
