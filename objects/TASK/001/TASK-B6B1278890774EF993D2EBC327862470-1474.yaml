title: 'Review follow-up: Patch-id equality is not proof that the change is on base. If main landed X'' and later rev'
description: |-
  From BUG-2733
  Reviewed sha: bc5438855b63b22bf94baf3687a0ee3b4d1ca1c6

  Patch-id equality is not proof that the change is on base. If main landed X' and later reverted it (R), a branch still carrying the original X re-introduces X's change on merge, but already_on_base drops X (its patch-id is in the base window), so X's supervised spec escapes the train's supervised gate. Consider excluding patch-ids whose change was later reverted on base (or requiring the title trailer for such commits), or record an advisor ruling accepting the limit, which the AC's patch-id wording invites.
