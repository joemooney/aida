  content: 'Added (product-15, 2026-11-22 17:03): the S3a FINAL-round finding at 78d0e918, a p2 unmet-claimed-ac on observational metrics, deferred under mass-change: [P2, unmet-claimed-ac] aida-cli-lib/src/main_watch.rs:824,1107,1413. If a tip was merged and observed green on Monday and an independent rerun first turns it red on Friday, the new reconciliation passes the original commit to open(), which timestamps red_start on Monday. Even a report restricted to Tuesday then counts known-green time as red, and the original green merge can count as a red merge. This occurs with just one episode. Preserve the commit date for attribution, record the rerun failure or observation time as the start of this episode, and distinguish this opening from a merge in the metrics. Extend the unchanged-tip test with a delayed rerun and assert zero red minutes before it and zero intervening merges.'
