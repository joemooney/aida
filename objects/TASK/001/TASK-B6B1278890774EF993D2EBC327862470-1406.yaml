  aida-cli-lib/src/session_reap.rs:1498–1505 and aida-cli-lib/src/session_hygiene.rs:139–153 (hygiene error routing). The new catch-all maps storage or rename I/O errors to skipped, including a failed restore after moving the seat. Hygiene routes failed outcomes and activation refusals, so a permanently blocked save or a clone already moved with failed mail settlement can now produce a successful scheduled hygiene run. The generic 'seat clone kept' message also hides whether it actually moved. Distinguish expected eligibility refusals from operational failures and keep the salvage path in the latter outcome when the move already happened.
