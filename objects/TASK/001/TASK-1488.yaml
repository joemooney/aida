title: Migrate the remaining legacy Custom edges whose spellings now parse to standard types (depends-on, duplicate-of, verified_by, replaced_by)
description: |-
  Follow-up from the BUG-1602 review. The shared relationship-type parser now maps depends-on, verified_by, relates_to, replaced_by, duplicate-of and similar spellings to standard types. Edges written by the old CLI under those spellings were stored as Custom(<spelling>). A typed `rel remove` now resolves to the standard type and does not match them. The 2026-09-21 census found Custom depends-on (1) and duplicate-of (1).

  ## Acceptance
  - Extend `aida db migrate-related-edges`, or add a sibling, to convert Custom edges whose spelling parses to a standard type via parse_relationship_type, with the same orphan/twin rules, dry-run, per-spec commits and idempotency.
  - Alternatively, extend rel_remove_matches' legacy sweep to cover every family; pick one approach and justify it.
  - Run a dry-run census on the live store and record it on this spec. After merge, the orchestrator applies it.
  - Tests cover a legacy Custom depends-on edge being converted and being removable.
