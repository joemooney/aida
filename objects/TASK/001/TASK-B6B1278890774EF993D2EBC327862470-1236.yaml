title: 'Review follow-up: apply_pr_state_snapshot reads only no_verdict_retry_at and no_verdict_blocker. Pickup retr'
description: |-
  From BUG-2720
  Reviewed sha: 2fcffa9987591527cab7610b758675e6fe3844a7

  apply_pr_state_snapshot reads only no_verdict_retry_at and no_verdict_blocker. Pickup retries use pickup_retry_at instead, so a permanently capped pickup with no verdict continues to project retry_backoff=true, retry_exhausted=false. PR state tells the reconciler to reobserve indefinitely when an operator is required. Project the pickup deadline and exhausted state into the PR facts and cover a capped pickup.
