decision_request:
  question: Which policy do you authorize for the performance guard under fleet contention? This records direction only. If you choose budget recalibration, specify the new ceiling and tolerance and the contention assumption. If you choose contention-aware measurement, specify the load metric, numeric threshold, and whether samples are excluded or bucketed. The task must remain parked until any required values are captured; the agent must not infer them.
  choices:
  - label: Keep current budget
    consequence: Retain the current ceiling and tolerance and treat fleet-contention trips as load signals, accepting that this may mask real regressions during those periods.
    resolution: directive:keep-current-budget-as-load-signal
  - label: Raise the budget
    consequence: Raise ceiling and tolerance only after you choose exact values and state the contention assumption; choosing this direction alone does not authorize an inferred number.
    resolution: directive:raise-budget-needs-operator-values
  - label: Make measurement contention-aware
    consequence: Record host load and either bucket or exclude samples above your chosen metric threshold; you must specify the metric, numeric threshold, and behavior.
    resolution: directive:contention-aware-needs-operator-threshold
