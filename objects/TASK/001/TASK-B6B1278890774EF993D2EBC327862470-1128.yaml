title: 'Review follow-up: Make the test-only spawn marker compatible with the ambient-input inventory guard. aida-cl'
description: |-
  From TASK-3792
  Reviewed sha: 7bc5f1c5324ccf83c41003c8874002972a35bebc

  Make the test-only spawn marker compatible with the ambient-input inventory guard. aida-cli-lib/src/bounded_process.rs:117-118 introduces AIDA_TEST_SCOPED_DEADLINE_SPAWN as a standalone cfg(test) constant, but story_2326_launch_ratchet_tests::production only skips cfg(test) modules, so the literal remains in its inventory scan and has no disposition. Both supplied exact-head CI fast jobs fail story_2326_ambient_aida_inputs_have_a_disposition on this literal, which also fails the Build aggregate. Move the literal into an excluded test-only module or give it an explicit safe dropped disposition consistent with existing test inputs; do not make it an ambient production input. This is a nonblocking P2 under the configured review policy; readiness still requires passing CI. It does not depend on the protected-base changes to scripts/store-writers.toml.
