description: |-
  From BUG-2703
  Reviewed sha: 3299d3f57e360284ec651a031f1943cec6ef4be4

  Cleanups in aida-cli-lib/src/admission_owner.rs. (a) `train` and `cooperative_train` (lines 514-523) have no production caller after this change; only tests call them, and the STORY-2857 and BUG-2650 tests exercise these zero-bound entry points instead of ship_admission and manual_train_admission. Mark them test-only or move the tests to the production entry points. (b) flock_holders (line 133) decodes the minor number as `(dev >> 12) & !0xff`, which keeps high major bits for device majors of 4096 and above; the mask should be 0xffffff00. Diagnostic text only. (c) The opening section of the PR body still says the drain accepts an 'unseated operator' and that status shows 'the controller's claim'; the code and docs/cli/06-roles-sessions.md now require an operator at an interactive terminal outside any agent session and show both workers' claims.
