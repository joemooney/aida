comments:
- id: 01a1101b-bc08-70b3-80fd-944d7f37914f
  author: joe
  content: Implemented explicit single-branch fetch to a UUID-scoped temporary ref with --no-write-fetch-head; resolve a commit SHA, clean up the ref, and use that SHA in both plain and structural auto-merge rebase paths. Existing configured tracking-ref updates and rebase conflict/abort behavior are retained. Local remote.origin.fetch has only the standard wildcard, so duplicate refspec was not confirmed as root cause; shared FETCH_HEAD is eliminated regardless. Failure hint now preserves the Git error without diagnosing every non-rebase failure as transient. Regression uses overlapping configured mappings, two FETCH_HEAD entries, and an intervening code fetch. Separate concurrent sync staging/commit/rebase lock gap captured as draft finding TASK-1-225.
  created_at: 2026-10-06T07:26:55.496959136Z
  modified_at: 2026-10-06T07:26:55.496959136Z
- id: 01a110e0-96a1-7601-b059-ef9bad119e5d
