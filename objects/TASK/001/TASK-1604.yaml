  content: 'Advisor: when reworking PR 2442, fold in finding TASK-1-225 (store sync pre-commit and rebase need the existing writer lock) — it is the concurrency half of this bug; the refspec pin alone will not stop the drift (hub-drift guard tripped twice tonight: reconciled unions 27cf62a9 and ec51faf0). Leave TASK-1-225 unpromoted if 2442''s rework covers it; dismiss it then.'
