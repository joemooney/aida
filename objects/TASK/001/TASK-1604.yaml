title: 'orphan-store pull fails with ''fatal: Cannot rebase onto multiple branches'' — aida-store fetch resolves to multiple refs'
description: 'Three occurrences 2026-10-05 evening, all during drain pre-pickup pulls (''aida db sync --pull''): wave-1 BUG-1803 pickup, wave-2 TASK-1588/BUG-1801 pickups. git pull --rebase of origin/aida-store fetches FETCH_HEAD with more than one candidate, so rebase refuses. Same window also produced ''fatal: cannot lock ref HEAD: is at 1aaf34fa but expected 0b03629a'' during a ''chore: sync pending changes'' auto-commit — concurrent store writers racing the pull. The CLI labels it ''transient (e.g. network); re-run aida pull'', which is wrong: ''multiple branches'' is a refspec/config shape (duplicate fetch refspec or wildcard matching aida-store twice), not connectivity, and it recurs deterministically under drain concurrency. Pickups proceed on the local view, so the failure is masked rather than harmful tonight, but cross-clone coordination silently degrades. Diagnose: git config --get-all remote.origin.fetch in the affected clones/worktrees; fix the refspec or make db sync pull fetch an explicit single ref (git fetch origin aida-store && rebase FETCH_HEAD).'
