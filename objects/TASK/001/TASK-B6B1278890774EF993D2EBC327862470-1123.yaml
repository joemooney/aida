title: 'Review follow-up: Keep unrelated project deputies out of operator awaiting reports. In aida-cli-lib/src/depu'
description: |-
  From TASK-3801
  Reviewed sha: 768640005c55bef865e331d70f2a1e0be1058617

  Keep unrelated project deputies out of operator awaiting reports. In aida-cli-lib/src/deputy_shell/mod.rs:927-937, the empty-stranded-jobs check is conditional on session.is_some(). With no AIDA_SESSION_ID, a dead queue containing only project A jobs is emitted by awaiting in project B: the earlier project filter removes every job but the code still pushes the deputy and increments the actionable count. Require relevant project evidence independently of the session filter, and cover two projects with an operator/no-session collector test. This behavior is identical in the original head and protected-base landed tree.
