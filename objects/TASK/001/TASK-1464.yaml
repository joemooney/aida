title: Add useful date sorting to aida list
description: 'Allow `aida list` to sort requirements by useful lifecycle dates, at minimum creation date and completion date when present, with a clear default direction and stable tie-breaking. Acceptance: sorting is selectable through an explicit CLI option, works with existing filters and output formats, handles missing completion dates deterministically, and documents the supported sort keys.'
status: Approved
priority: Medium
owner: ''
