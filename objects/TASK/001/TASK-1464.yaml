  content: 'Scope clarification: date sorting also needs date fields in `aida list --fields`. Expose at least `created_at` (opened), `modified_at`, and `completed_at` when present; consider explicit names such as `opened_at` only if it is a true alias rather than a second stored timestamp. Missing completion dates must render consistently and remain sortable. Keep fields available in human, TOON, and JSON projections, with date formatting documented.'
