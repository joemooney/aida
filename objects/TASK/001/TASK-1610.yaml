title: 'Seat occupancy: Windows process start-identity probe (GetProcessTimes)'
description: |
  Follow-up to TASK-1607 (STORY-1485 slice A), required by advisor condition C6 and ADR-69.

  Slice A fails closed when the seat-occupancy probe cannot read a process's start identity. On Windows the probe returns Unknown, so orchestrator-protected operations (loop starts, orchestrator spawns, queue routing, seat handoff writes) refuse there.

  Add a Windows implementation of the tri-state identity probe: OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION) + GetProcessTimes creation time as start identity, GetExitCodeProcess to distinguish exited processes, parent pid via a Toolhelp32 snapshot. ERROR_INVALID_PARAMETER for a missing pid is Dead, a differing creation time is Dead (PID reuse), access-denied or other errors are Unknown.

  ## Acceptance
  1. The Windows probe returns Alive/Dead/Unknown with the same evidence semantics as the Linux /proc probe.
  2. Orchestrator protected ops no longer refuse on Windows with the "unsupported platform" diagnosis; the refusal text no longer cites this spec.
  3. Unit tests cover alive, exited, PID reuse and access-denied cases on a Windows CI runner.
