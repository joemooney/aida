title: 'Review follow-up: aida-cli-lib/src/dispatch_flow.rs:292 invoke_pr_train_with_ctx passes the PR as a named tr'
description: |-
  From BUG-2767
  Reviewed sha: f7538e24f20a874b18dea010f8fb2bc85be59679

  aida-cli-lib/src/dispatch_flow.rs:292 invoke_pr_train_with_ctx passes the PR as a named train (all_ready=false), so prs_named_on_command_line is true and culprit_admission (pr_train.rs:5552) silently clears a culprit hold whenever `aida dispatch flow <PR>` runs, recording the clearance as '<user> (named on `aida pr train`)'. An automated advisor dispatch flow for a culprit at its red head therefore re-admits it, which is the re-admission BUG-2767 targets, and the recorded clearance names the wrong surface. Follow-up: treat only an interactive or operator-named train as clearance, or record the dispatch request as the clearer.
