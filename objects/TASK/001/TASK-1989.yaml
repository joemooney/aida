title: 'Contained boundary: deny a linked worktree''s own .git pointer file to Edit/Write tools'
description: |
  contained_main_checkout_git_deny_paths (aida-cli-lib/src/contained_boundary.rs:192) skips roots whose .git is a file (linked worktrees), so the worktree's own `.git` gitdir pointer stays writable under Edit(//<root>/**). If a contained session rewrites the pointer to an in-worktree gitdir that has hooks or core.hooksPath set, the operator's next git command in that worktree runs those hooks outside the sandbox. This is the same escape class BUG-2012 closes for main checkouts. A fix could be an exact-path deny of <root>/.git (the file only) for every write root.

  Raised in review of PR-2748: https://github.com/joemooney/aida/pull/2748
