title: 'Docs follow SPIKE-86: replace the missing-index headline and Trojan-horse passages in OVERVIEW, README and the repository guide with VIS-2 / ADR-59 / TERM-5'
description: |
  From SPIKE-86 (report sections 4 and 7), adopted by OPERATOR DECISION on SPIKE-86 (Joe, 2026-09-26). The substrate now says VIS-2 (supersedes VIS-1), ADR-59 (supersedes the Trojan-horse framing) and TERM-5 (control plane = corpus-integrity layer). The prose still says the old things, and SPIKE-86 found prose wins over the store for an agent's attention, so the docs must agree.

  Acceptance:
  1. OVERVIEW.md line 6 no longer leads with "your project's missing index"; the headline states the VIS-2 pitch (comparative, no whole-system regeneration promise).
  2. The Trojan-horse passages are replaced with the ADR-59 framing (the TUI is a view onto the control plane; the humble first surface is `aida why` plus the memory lane): OVERVIEW.md (the "Public face" section, line ~52 and Risk 2 at ~129), README.md item 6 (~line 61), and docs/agents/aida-repository-guide.md line ~9.
  3. OVERVIEW.md's architecture section describes the four layers from VIS-2 / TERM-5 (intent store, control plane as corpus-integrity layer, execution, surfaces).
  4. `git grep -n -i "trojan"` and `git grep -n "missing index"` over README.md, OVERVIEW.md, CLAUDE.md and docs/agents/ return only lines that describe the old framing as superseded history. Dated snapshots under docs/positioning/ and docs/competitive-analysis/ are NOT edited (they stay frozen).
  5. If any edited file is a generated mirror of aida-core/templates/, the template master is edited and `make sync-templates && make check-templates` pass.
  6. CLAUDE.md stays within the budget in aida-core/templates/context-budget.toml.
