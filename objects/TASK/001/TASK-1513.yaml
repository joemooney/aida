  author: joe
  content: 'Review: APPROVE (independent reviewer, 2026-09-27, strict; did not write the code). Five probes, all answered with file:line evidence. (1) No fence escape at any rerouted site: the cfg(test) arm routes to test_home::home_dir() which ends in assert_hermetic; init_cmd.rs:71 and reconstitute.rs:604 moved INSIDE the fence (tighter than main); git_ops.rs:2618-2626 lands in the temp home because $HOME always wins under redirect, and the one theoretical widening (HOME+USERPROFILE+AIDA_TEST_HOME all unset) is unreachable -- no aida test ever unsets HOME. (2) The ratchet is NOT vacuous: reimplemented both scans over the sha''s trees, 95 + 534 files scanned, 0 offenders each, so the tests pass for the right reason. Bypass forms exist (std::env::home_dir() is un-deprecated on rustc 1.92 and not in the needle list; line-based scan; name-based self-exemption; only 2 crates scanned) -- ratchet-completeness gaps, not fence leaks; filed as follow-up. (3) DELETE path cannot escape: file_name() is a single readdir component (no / or ..), must strip the aida-lib-test-home- prefix and parse a dead pid, root is only temp_dir(); file_type() does not follow symlinks and remove_dir_all uses openat O_NOFOLLOW, so a TOCTOU swap fails rather than escapes; MAX_SWEEP=64 bounds it; whole module is #[cfg(test)] so it is in no shipped artifact. (4) aida-server/src/main.rs:302 unrouted is acceptable, not a gap: no tests dir, no fence exposure, identical on unix; follow-up for consistency. (5) No OnceLock/caching in home.rs -- var_os is read on every call, so a later set_var is always observed; the pre-existing REDIRECT OnceLock panics rather than silently returning the real home. Also verified the native feature gate, libc availability, and that Rust 1.82 features break no MSRV (no rust-version, no rust-toolchain).'
