title: 'Review follow-up: forge.rs:1901 bypasses the shared gh probe binary resolution in kernel.rs:500. The standar'
description: |-
  From TASK-3847
  Reviewed sha: eacfd4b52870557151340a24d44b1b772be6c929

  forge.rs:1901 bypasses the shared gh probe binary resolution in kernel.rs:500. The standard test override, debug diagnostics, and fallback executable search do not apply, so the report can silently say unknown when other forge probes resolve gh. Route it through a resolver that honors the probe controls while keeping executable resolution and the API call bounded.
