title: 'Review follow-up: Budget arithmetic in .github/workflows/ci.yml Live bwrap step: each of the two watchdog in'
description: |-
  From BUG-2788
  Reviewed sha: c69eb5939c5b2b4ac8074fd3b609b915466f66c5

  Budget arithmetic in .github/workflows/ci.yml Live bwrap step: each of the two watchdog invocations has a 480s overall deadline that starts only after its own `cargo test --no-run` build, so the worst case (2x480s of tests plus two builds) exceeds the step's 15-minute timeout. If the lib selection runs slow but under its per-test limits, GitHub can kill the step during the second selection before the watchdog prints anything. A single stalled test is still caught by the 120s per-test timeout, so AC2/AC3 hold. Follow-up: derive the overall deadline from the time left in the step, or use one budget shared by both selections.
