title: 'Review follow-up: aida-cli-lib/src/doctor/worktrees.rs:1558 — The final attestation record is written with `'
description: |-
  From BUG-2755
  Reviewed sha: a27b058adf026bfb5b43f4dc1bfc4e7819751d86

  aida-cli-lib/src/doctor/worktrees.rs:1558 — The final attestation record is written with `?` after the salvage/release closure has run. If that second write fails after a successful rename and lease removal, the command exits with an error even though the lease is already released and the tree moved, so the operator sees a failure for a completed action. If the closure itself failed and the record write also fails, the record error replaces the original salvage error (for example EXDEV). Treat the completion record as best-effort after the action, or report both errors. Keep the original `done` error as the primary result.
