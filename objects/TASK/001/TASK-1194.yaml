title: aida status leads with a live-drain line when a drain is in flight
description: |-
  Live discovery failure (2026-09-05): with a drain actively running, the operator ran aida status (the natural first command) and got role/queue/counts — zero indication a drain was in flight. They had to ask which command shows what is going on (aida drain status).

  Fix: aida status (the bare sub-second view; --full too) prints one line when a live drain exists, above or beside the queue section:
    ▶ drain in flight: spec 2/5 STORY-821 (implementer) — watch: aida drain status
  Source + liveness rules identical to STORY-824 (statusline segment): read .aida/drain-state.json + drain.lock, kill -0 the pid; dead pid renders nothing here (drain status --clear owns stale diagnosis). Same sub-second budget — two local file reads, no store load, no network. Share the probe helper with STORY-824 rather than duplicating it (one drain_liveness_probe used by statusline, statusbar, and status).

  Acceptance:
  - Live drain: aida status shows the line with correct position/spec/phase; bare status stays sub-second
  - Stale lock (dead pid) or no drain: output byte-identical to today
  - Helper is shared with the STORY-824 call sites (unit-tested once)
