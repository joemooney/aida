    **Rules the table encodes:**

    - **Engine automatic rollback versus the closure-issued fixture.** E6 is a **closure-issued `ROLLBACK`** fixture. It proves the already-in-autocommit cleanup branch: the finish step issues **no** ROLLBACK, and the outcome is recorded as `already_autocommit`, never as `rolled_back_explicit`. An SQL-engine automatic rollback (for example after `SQLITE_FULL`, an IOERR or an interrupt) is **not** produced; no supported non-raw seam exists. The branch is keyed on the real `is_autocommit()`, so it covers either cause, but no evidence row is labelled "engine rollback".
    - **E5** is a real statement abort that leaves the transaction open, so an explicit ROLLBACK is issued and counted.
    - **No mocked values.** Fault seams inject an `Err` at a call boundary, or **substitute a different real SQL action** (E14 and E20 execute a real PRAGMA with another value). Every PRAGMA value recorded by O-change, O-armed, O-tx, O-restore and O-write is read from the real connection. No seam returns a PRAGMA value.

    ### 6.3 Preparation truth (answers the relayed-only O-change paragraph too)

    - **O-change** increments by 1 **iff** a real read-back after a set attempt returned a value ≠ P. It records `unknown` when that read-back errors. It is separate from O-armed, which means verified NORMAL only. A real change followed by a failed verification is change ≥ 1 (or unknown) with armed 0. It is never a successful admission.
    - **After any possibly effective set** (E12–E17), read the actual state:
      - == P → `verified_unchanged`, recorded only with that read-back as evidence;
      - ≠ P → restore P and verify;
      - unreadable → restore P and verify;
      - restore fails or verification is unreadable or mismatched → retire under §3.
    - **No set issued** (E11) is a code-path fact: the set statement was never sent. It is not inferred from a missing observation. It is recorded as `no_set_issued` and **no** restoration is claimed.
    - There is no `not_needed` value anywhere in V4.
    - A failed preparation never reaches BEGIN or the application closure. The preparation error stays primary, and restore and retire details are kept inside it (or inside Retired when retirement occurs).

