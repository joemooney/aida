    ## 2. Independently verified source and external semantics

    Immutable basis: `ff9ac13c4fb18f2c7e63f39ef112cca8c7d8a578`. Observed HEAD and main: `c67728c1dcaf8a577539d920bdc6a3c86126cebb`. The complete ff9ac→c677 aida-core diff is empty. Relevant current workfile bytes equal those immutable core blobs. Cache command and MCP files also match; lib.rs and git_backend_cmd.rs have unrelated later differences, with inspected classification/constructor symbols unchanged. I inspected the diff only to establish that boundary, taking no substantive action on reserved work.

