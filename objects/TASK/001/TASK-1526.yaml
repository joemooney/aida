    `bug_1609` passed on the re-run.

    **Not reproducible on a 6-core host.** `cargo test -p aida-core --lib
    db::cache_refresh` ran 40× clean, and the full `cargo test -p aida-core --lib`
    ran 3× clean. The CI runner is smaller and more contended, which points at the
    two wall-clock-sensitive shapes in the new tests:

