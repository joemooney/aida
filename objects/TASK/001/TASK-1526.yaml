    ## 3. Whole-design judgment

    ### 3.1 F1: ConnSlot, Retired and quarantine

    | Question | Independent answer |
    | --- | --- |
    | Avoids a mandatory fallible replacement allocation? | **Yes.** `mem::replace(slot, Retired(RetiredSlot{cause, close: NotAttempted, quarantined: None}))` builds an inline enum value. It needs no `Connection`, no `open_in_memory` and no SQLite allocation. `Option<Connection>` is a bounded slot of one per handle, because retirement happens once. The only possible allocation failure is in diagnostic Strings, and Rust's infallible allocator aborts there anyway. It is not part of SQLite's failure surface. |
    | Is the resource order enforced by the borrow checker? | **Yes, for normal control flow, with one structural fix (A1).** The `with_cache_write` closure captures a shared `&Connection` derived from `&scope`. `Transaction::new_unchecked(&conn, Immediate)`, every `CacheTx<'_>` and every `Statement<'_>` are locals of one closure invocation, and the closure has no borrowing return type (`Result<bool>`). Once `with_cache_write` returns, consuming the `LiveConn` requires exclusive access, which the compiler refuses while any derived borrow is alive. Cache code uses no `prepare_cached`, backup or blob, and `close()` flushes rusqlite's own statement cache. On unwind, the language drop order (inner frames first) drops `tx` and statements before `WeakCommitScope::drop`; that guarantee comes from drop order, not the borrow checker. **The defect:** as written, `WeakCommitScope { live: LiveConn, done }` implements `Drop`, so its `live` field cannot be moved out (E0509). §3.2 also names two retire signatures (`retire(self: LiveConn)` and `retire(&mut ConnSlot)`). See A1. |
    | Is the close outcome honest? | **Yes, with corrections A4 and A2.** A `Closed` result is truthful: `sqlite3_close` returning OK proves that the zombie close ran `sqlite3RollbackAll` and `BtreeClose`, so this connection's locks were released. On `CloseFailed`, the design keeps the returned connection, quarantines it, and reports release as `Unconfirmed`. The ByClose rule (rollback failed or unconfirmed, COMMIT never executed, and close == Closed) is sound: the changes were never committed, and the destruction rolled back any open transaction. When COMMIT was executed, or when close failed, the result conservatively stays `Unknown`. **Correction (A4):** "an I/O-level close error" is not a possible cause. Per source, BUSY (unfinalized statements or backups) and MISUSE are the only failures, so the quarantine branch is defensive and reachable only by injection. A successful retirement close can also run SQLite's ordinary close-time checkpoint under the handle mutex; E1's post-result syncs of 0.601683s and 2.505229s show it may cost seconds. Policy is unchanged and no latency claim is made. |
    | Is poison handled once, with the cause and count preserved? | **Yes.** On the first `PoisonError` with a `Live` slot, the handle retires as `Poisoned` and the count goes up by 1. Every later `PoisonError` takes `into_inner()`, finds `Retired`, and returns the first cause with `first_report:false`. `clear_poison` is never called. The weak-path unwind (cause `Unwind`, then the guard drop poisons the mutex) and a strict-path panic are distinct and both preserved. The pre-lock precheck can return only the `retire_cause` atomic; it cannot return the `close` outcome. See A6. |
    | Is the unwind path non-panicking, given rusqlite's internal `unwrap` and `assert`? | **Acceptable, with the reliance declared.** `interrupt_lock` can be poisoned only by a prior panic in `close` or the interrupt machinery. No `InterruptHandle` exists anywhere in the tree, and the assert holds until a successful close. The `RefCell` borrows in `close` are free after unwinding. V4 states the reliance honestly and does not claim impossibility. |
    | Is there one real post-acquire gate, and is `LiveConn`'s `Deref` sound? | **Yes, with A1 applied.** The only post-acquire check is the slot discriminant. The `retired` AtomicBool is not re-read after acquisition. Shared `Deref` is enough at every production site (production code has no `&mut Connection`, `.transaction()` or savepoint use). The `Deref` invariant ("a live `LiveConn` implies a `Live` slot") holds only if no `LiveConn` survives a retirement; A1 guarantees that. A5 removes a precedence hole in the `done == false` non-panic backstop. |

    ### 3.2 F2: S-d, M9 and M10

    - **S-d** is sound.
      - The H-prelock hook fires only after V's precheck has **seen live**, and immediately before `lock()`.
      - W's H-tx hook waits, with an 8s bound, only for V's "attempting" signal. V needs no lock that W holds to emit it, so there is no cyclic wait.
      - The test joins V only after W's `freshen_for_read` returns.
      - Whether V actually blocks or acquires the lock after W releases, its precheck happened before the retirement. The post-acquire gate is therefore necessary and reached.
      - `upsert_requirement` locks (:1824) before `with_cache_write`, so in the retire variant `write_wrapper_entry(V) == 0`, as V4 declares.
    - **M9** deletes only the discriminant gate. It is not equivalent to correct code, and it reaches O-expose:
      - The precheck has passed.
      - No poison is set.
      - `upsert_requirement` has no F-entry.
      - No AtomicBool is re-read.
      - The `Retired` variant is inspected only by the deleted gate.
      - O-expose counts every `LiveConn` construction, so it reads 1 under M9 and 0 under correct code.
      - Under M9, V's later panic poisons the mutex. It is correctly treated as a recorded effect, not the detection point.
      - I found no manufactured schema and no mocked write.
    - **M10** is independent and feasible. H-snap-premint runs after `ensure_live()`. `retire_for_test()` uses the real `lock_conn` and `retire`. `read_snapshot` then mints from the file, and only the deleted post-mint recheck can refuse it. The schedules of M9 and M10 share no fence.

    ### 3.3 F3: S-b and the strict labels

    - **S-b matches the source.**
      - The upsert has no BEGIN.
      - In WAL mode, its reads succeed while W holds the write lock.
      - `DELETE FROM requirements_cache` opens a write transaction and gets `SQLITE_BUSY` at once (`busy_timeout` 0), even when no row matches.
      - `is_sqlite_lock_error` re-runs the whole closure after the first `Write`-category delay. With T's flag false, fast-fail off and the environment unset, the default ladder is `[100…12800]` ms.
      - A steady-state `Cache::open` of C is write-free (BUG-664), so it does not stall behind W.
      - No production transaction boundary changes.
    - **The held-period and post-release observers are distinct.** `own_setting_while_held` is a separate real PRAGMA read, and O-write(upsert) fires only after `upsert_requirement_on` returns `Ok`. During the held period, `write_attempt(T)` is 1. After the retry it is at least 2, which is consistent.
    - **The strict-label placements** match the source for `strict_incremental`, `upsert`, `delete`, `set_meta`, `truncate` (after the DELETE batch) and the rebuild labels (after BEGIN, before the refill skip).
    - **M2 and M7.** M2 fails the value-2 assertions in S-b, which is feasible. M7 is correctly declared unaffected by S-b. However, the M7 detector list elsewhere overreaches; see A3.

    ### 3.4 F4: counts, seams and mutants

    **Reachability.** I traced every row from E1 to E24 and from A1 to A5 against the source:

    - **E2** (reached-head skip): tx 1, closure 0, then an explicit ROLLBACK.
