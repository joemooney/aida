    ## 4. Numbered findings and binding amendments

    Each item below gives the file and symbol, the fact, the required outcome and the required future test. All are design amendments only. **None authorizes code.**

    **A1. The guard must leave `WeakCommitScope` by value, and retirement needs one entry point.**

    - **File and symbol:** `cache.rs`, proposed `WeakCommitScope`, `LiveConn` and `retire`; V4 §3.2 step 5, §3.3 and §3.7.
    - **Fact:** A type that implements `Drop` cannot have a field moved out of it. §3.2 and §3.3 also give two retire signatures.
    - **Required outcome:**
      - `WeakCommitScope` holds `Option<LiveConn>` (or an equivalent that cannot be accessed after it is taken).
      - Ordinary retirement and `Drop` both `take()` it, and `LiveConn::retire(self, cause)` consumes the guard.
      - A single private `retire_slot(&mut ConnSlot, cause)` serves both `LiveConn::retire` and the poison path in `lock_conn`.
      - No `LiveConn` may exist after its slot becomes `Retired`. `Deref` stays an unreachable invariant check.
    - **Required future test:** In every T1-R retirement row (E16–E24, A5, poison), assert that the post-retirement O-expose count for the retiring call is 0 and that no invariant panic occurs. A compile-level review confirms that there is no `&mut`-based retire on a live `LiveConn`.

    **A2. The successful-close control must be one that close actually changes.**

    - **File and symbol:** V4 §9 T1-R, `retired_handle_ordinary_close_releases_write_lock_for_separate_connection`.
    - **Fact:** In E19 the COMMIT has already released the WAL write lock. A separate `BEGIN IMMEDIATE` therefore succeeds even if `close()` were skipped, so this control is vacuous for close.
    - **Required outcome:** Run the separate-connection control on **E18**, where the transaction provably stays open until close.
      - At a cfg(test) H-before-close point, a separate connection's `BEGIN IMMEDIATE` returns BUSY, which witnesses that the lock is held.
      - Immediately after `close = Closed`, `physical_release = Confirmed` and `rolled_back = ByClose`, the same separate attempt succeeds with no BUSY, and a new snapshot shows the old rows.
      - For E18 combined with FAIL_CLOSE, the separate `BEGIN IMMEDIATE` stays BUSY while the connection is quarantined, which is the honest `Unconfirmed` state. Success after the handle drops is recorded only as a post-drop observation.
      - Keep E19 as the committed-rows visibility check.
    - **Required future test:** The E18 sequence above, plus a mutant **M11**: "a successful close skipped (the connection is moved into quarantine unclosed)". M11 must fail the E18 post-close separate-writer assertion, not a timeout.

    **A3. M7 needs an exact edit, and its detector list must match that edit.**

    - **File and symbol:** V4 §6.4 M7 and §5.3.
    - **Fact:** "`READ_REFRESH_ATTEMPT` alone selects NORMAL" gives no location. If the edit replaces admission in `apply_incremental`, the strict upserts in S-a1 and S-k1 never enter `apply_incremental` and cannot detect it.
    - **Required outcome:** Pin M7 as "in `apply_incremental`, `Strict` plus a live `READ_REFRESH_ATTEMPT` takes weak preparation".
      - The declared detectors become S-a2, S-k2 and S-q.
      - S-a1, S-k1, S-b, S-c, S-d and S-nd become declared unaffected controls for M7. They remain M2 detectors.
      - Any other placement must restate exactly which schedules reach it.
    - **Required future test:** Under M7, the declared detectors fail their value-2 assertions inside the feasible operation, and the controls pass.

    **A4. Correct the close facts and disclose the close-time checkpoint.**

    - **File and symbol:** V4 §3.3, "Why close is expected to succeed", and §12.
    - **Fact:** The bundled `sqlite3_close` returns only OK, BUSY or MISUSE. A successful close may run the unchanged close-time WAL checkpoint while the handle mutex is held.
    - **Required outcome:**
      - Delete "I/O-level close error" as a cause.
      - State that the quarantine branch is defensive and reachable only by injection, given the resource order.
      - State that the retirement close can incur SQLite's ordinary close-time checkpoint cost on the failure path. The policy is unchanged, and no latency claim is made.
    - **Required future test:** None beyond A2. The injected-refusal label stays.

    **A5. The `Drop` backstop must be unreachable on ordinary errors.**

    - **File and symbol:** `cache.rs`, `apply_incremental`'s weak path; V4 §3.7 (`done == false`, not panicking).
    - **Fact:** If a reachable `?` returned between scope creation and finalization, the handle would retire inside `Drop`, but the caller would receive the raw primary error. A raw lock error would become WriterBusy. That violates the precedence `CacheHandleRetired > WeakCommitPrepare > primary`.
    - **Required outcome:**
      - Structure the weak path as an inner function that returns a typed outcome without using `?` past finalization. The outer function maps that outcome to the precedence-correct `Result`.
      - The `Drop` backstop fires only while panicking.
      - The weak `with_cache_write` closure must run at most once. Admission check 3 guarantees an empty ladder; state that dependency, because `DropBehavior::Ignore` plus a re-invocation would be incoherent.
    - **Required future test:** A cfg(test) `weak_scope_backstop_fired` counter is 0 in every E and A row except E23 and E24.
    - **Required future test, the `weak_closure_invocations` counter (corrected at root's request):**
      - **What it counts:** executions of the body of the weak `with_cache_write` `FnMut` closure itself, the closure that starts the weak transaction.
      - **Kept separate:** it is not the application-closure counter (`apply_closure_entered`, the "clo" column of V4 §6.2), and it is not the tx column.
      - **When it is 1:** wherever that body is reached, including when BEGIN then returns busy (E8, E21) or a non-lock error (E9).
      - **When it is 0:** on every exit before the wrapper's closure runs. That covers:
        - preparation failure (E11–E17), because the wrapper is never called;
        - the sidecar-create failure (E10), because `write_lock_info_at`'s `?` at `cache.rs:824` comes before `with_cache_retry_observed`;
        - the read-only refusal, because `cache.rs:817–822` returns before the closure;
        - admission refusal (A1–A4), because the weak closure is never constructed;
        - admission retirement (A5).
      - **Strict closure is not counted:** in A1–A3, the Strict path's own closure runs once (`strict_tx 1`). That is a strict-closure execution and is not counted here.
      - **E22** inherits the value of its base row.
      - **Under A5**, the counter is never more than 1 (no re-invocation).

      Exact values, checked against V4 §6.2, `with_cache_write` (:807–829) and `apply_incremental` (:1769–1803):

      | Row | `weak_closure_invocations` | Reason |
      | --- | :-: | --- |
      | E1 success | 1 | body reached; BEGIN, closure, commit |
      | E2 reached-head skip | 1 | body reached; BEGIN, then skip before the application closure (clo 0) |
      | E3 epic-miss decline | 1 | body reached |
      | E4 FAIL_IN_TXN_SQL | 1 | body reached |
      | E5 stamp RAISE(ABORT) | 1 | body reached |
      | E6 closure-issued ROLLBACK | 1 | body reached |
      | E7 FAIL_COMMIT | 1 | body reached |
      | E8 real busy | 1 | the sidecar claim does not fail on an existing record (returns `Ok(false)`); body reached; BEGIN is BUSY (tx 0) |
      | E9 FAIL_BEGIN_NONLOCK | 1 | body reached; the injected error replaces BEGIN (tx 0) |
      | E10 FAIL_SIDECAR_CREATE | 0 | the `write_lock_info_at` error comes before the closure (wrapper entry 1, write_attempt 0) |
      | E11–E17 preparation faults | 0 | preparation fails before `with_cache_write` is called |
      | E18 FAIL_ROLLBACK with FAIL_IN_TXN_SQL | 1 | body reached |
      | E19 success with FAIL_RESTORE | 1 | body reached |
      | E20 success with RESTORE_WRONG_VALUE | 1 | body reached |
      | E21 busy with FAIL_RESTORE | 1 | body reached; BEGIN is BUSY |
      | E22 base row with FAIL_CLOSE | same as base | 0 for E16 and E17; 1 for E18–E21 |
      | E23 PANIC_IN_CLOSURE | 1 | body reached; the panic happens inside it |
      | E24 E23 with FAIL_CLOSE | 1 | as E23 |
      | A1 identity refused | 0 | refused admission takes the Strict path; the strict closure runs once (not counted) |
      | A2 thread refused | 0 | as A1 |
      | A3 no retry scope | 0 | as A1 |
      | A4 read-only forced | 0 | refused; the Strict `with_cache_write` returns `CacheReadOnly` before any closure (wrapper entry 1, write_attempt 0) |
      | A5 not in autocommit | 0 | retired at admission, before preparation and before the wrapper |

    **A6. Precheck errors must define what they say about close.**

    - **File and symbol:** `lock_conn` step 1, F-entry and F-snap; V4 §3.5.
    - **Fact:** These paths read only `retire_cause` and cannot report the close outcome.
    - **Required outcome:** Either store a copy of the close outcome atomically before `retired` is set, or define that pre-lock `Retired` errors carry `close: NotReported`. T1-R assertions for later callers must use the chosen form.
    - **Required future test:** Three later calls (§9 E23) assert the chosen close field on both the precheck path and the post-acquire path.

    **A7. Hook and environment hygiene.**

    - **File and symbol:** `cached_git_backend.rs`, `task_1515_after_incremental_reads`; S-k1, S-k2, S-q and S-nd.
    - **Fact:** The AFTER_READS slot is restored after each call, so it is not one-shot. `AIDA_CACHE_NO_DETACH` is process-global.
    - **Required outcome:**
      - Each S-k hook closure must limit itself to one action with a counter, and assert its call count.
      - Every S-nd test that sets the no-detach environment variable runs under the existing serialized environment guard.
    - **Required future test:** The hook-call count is recorded alongside each S-k and S-q result.

    **A8. Constraints on the entry witnesses.**

    - **File and symbol:** `lib.rs`, `run` and `run_from_args`; `git_backend_cmd.rs:1202`.
    - **Required outcome:**
      - `run_from_args` is `pub(crate)`, pure delegation, and adds no new flag, environment variable or authority.
      - Tests drive it with `--file <fixture store dir>`. They do not change the working directory and do not use `init <DIR>`.
      - Restate the W-amb claim as "every command dispatched through `handle_git_backend_command`'s ambient (non-notice) constructor".
      - If the code gate rejects the extraction, use V4's fallback with the "run→helper not test-witnessed" label.
    - **Required future test:** The §7.2 matrix as written, plus an assertion that the process working directory is unchanged after each call.

    **A9. Spell out the constructing-site preconditions, and make P6 and A2 deterministic.**

    - **File and symbol:** V4 §6.1 and §7.3 P6; `freshen_for_read`'s winner branch.
    - **Fact:** The policy-Allow precondition for building a token lives in the approved V2 §4.1(2) and is not restated in V4.
    - **Required outcome:**
      - Incorporate V2 §4.1(2)'s ordered list by reference: won lock not nested, rechecked stale, no migration, usable snapshot, ancestor, not read-only, live retry scope, and policy Allow.
      - Under Deny, no token is built. P1, P3 and P6 therefore expect `weak_commit_refused == 0` and exactly one Strict write at value 2. This replaces P6's "≥ 1 or".
      - Declare `ReadWinnerTxn` to be `Send`, so that row A2 is reachable. Otherwise, mark A2 as enforced at compile time and drop it.
    - **Required future test:** P1, P3 and P6 with these exact counts. A2 (or the replacement compile-time evidence) as declared.

    **A10. Assertion order must not pre-empt the declared mutant detections.**

    - **File and symbol:** V4 §6.4 and §9 T1.
    - **Required outcome:** In each row, check the declared reach witness and the mutant's first failing assertion **before** any count the mutant removes. For example, E1 asserts admit, the tx count and the tx value before change or armed, so that M1a is detected at the O-tx value. Every other mutant row follows the same rule.
    - **Required future test:** The predeclared order per row is recorded in the test source. A failure that occurs earlier in the order is not counted as detection.

    **Informational, not binding.**

    - §1.2 above: the relayed 51599-byte body keeps its final newline. The 810 bytes removed are the paragraph, its line terminator and the following blank line. The hashes are unaffected.
    - A label for the strict write-through `recompute_epic_status_from_hierarchy` would add coverage. Any label already detects M2, so it is optional.

    **No CHANGES-REQUESTED-level blocker remains.** Each finding above has an exact, local remedy that does not change the approved architecture. The four V3 findings (F1–F4) and the V3 review's §4 wiring notes are resolved by V4 together with A1–A10.

