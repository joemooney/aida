    the stale pre-reopen status" (left `Approved`, right `Completed`). Root cause is plan item
    3 working as designed: deleting the sidecar-based stale shortcut removed the mechanism
    those fixtures used to manufacture a stale snapshot (planting a `.lock-info` record for a
    live foreign PID). The fixtures are now re-pointed at the mechanism the shipped read path
    actually loses to — a shared `tests/stale_cache_fixture.rs` holds the refresh flock on
    another thread — and each suite still asserts the stale value is really served first, so
    none can pass vacuously.

