  content: |
    ADVISOR DECISION: APPROVED bounded pre-C reader contract, with binding amendments

    Independent Codex advisor, separate from product, implementer, sketch author and reviewer. This is a design-fork disposition, not an implementation review or merge approval. Read AGENTS.md, two-seat/rework/recovery disciplines, TASK-1526 and its latest implementer comment (01a0e0f3-e940-7d22-9071-2323499cbd52), the live worktree punt, STORY-1484 sketch/signoff A2-A6/A9-A13/Q1-Q4, TASK-1527, and current source/WIP in /home/joe/ai/aida-task-1526 at base 854b7e26f7222c73845064275a18c293c9895283. Also read the subsequent BUG-1674 signoff and STORY-1484 amendment so this ruling does not override show's separately bounded contract.

    Finding: the punt is valid. Q1 and the incremental-busy winner reference machinery deliberately assigned to C, which depends on B. Strict inline rebuilding for all pre-C non-TTY winners would defeat the signed-off Q1 latency choice. Pretending that a request/worker exists would defeat A2/A9. The following interim contract resolves that sequencing gap within advisor design authority; no Joe/product policy change is required. It does NOT provide autonomous refresh liveness before C, and does not close STORY-1484.

    BINDING AMENDMENTS TO TASK-1526

    B1. Existing, readable, compatible committed snapshot; non-TTY/full-rebuild-needed winner: double-check freshness under the canonical refresh flock. If still stale and incremental cannot safely complete (missing/empty stamp, non-ancestor head, excessive diff, or ordinary decline requiring full rebuild), do NOT enter full_rebuild/inner.load, the normal SQLite ladder, or spawn/file anything. Release the guard and return the compatible snapshot with stale=true and RefreshState::Deferred, serialized as refreshing:"deferred". Null cache_head/built_at is honest when unavailable; never invent either. Deferred means this invocation deferred refresh and promises no background progress. Suggested binding meaning for the note: "note: showing results cached at <time>; refresh is deferred. Run `aida cache rebuild` for current data." Use the existing unknown-time rendering when necessary. No "refreshing", "requested", or "re-run in a few seconds" promise in this state. A later strict operation or explicit rebuild can restore freshness before C; a repeated non-TTY read need not do so. Non-ancestor alone is not grounds to reject otherwise compatible rows.

    This is an explicit PRE-C exception to A2's trigger list and Q1's request/spawn step: Deferred is allowed for a proven full-rebuild-needed decision or when a previously observed refresh holder disappears without making the cache fresh. Diagnostic sidecars never authorize it. Do not use Deferred as a catch-all to swallow corruption, schema, I/O, or arbitrary application errors. It remains a truthful fallback state after C wherever no running/requested refresh can be established.

    B2. Incremental winner: exactly one SQLite write attempt under A13's fast-fail scope. A typed SQLite busy/locked error permits compatible stale results with refreshing:"writer_busy" after rollback/release; no request file, detached worker, or invented Requested state. The busy result is evidence of contention, not evidence that an AIDA process is bringing the whole cache current. Render a factual note such as "note: showing results cached at <time>; the cache write lock was busy and refresh was deferred. Re-run to retry, or run `aida cache rebuild` for current data." No unconditional progress/time promise. A new read after contention clears must retry incremental refresh normally, not retain a sticky busy verdict. If a final check establishes a genuinely fresh snapshot, return it fresh instead.

    B3. Losers retain the default 1500ms bounded polling (configured ReadBudget; budget 0 for advisory paths), committed metadata checks, and no with_cache_write/SQLite ladder. WorkerRunning is the existing protocol name for an OBSERVED refresh-flock holder, including an inline refresher; it does not assert a detached process exists. Recheck at the return decision: if the holder disappeared and data remain stale, use Deferred, not WorkerRunning. Budget is a maximum, not a required sleep: do not spend it waiting for a worker B never launched. Never reset/extend the wait merely because a holder disappeared or another backend is opened during the same bounded wait operation. No holder-health/progress guarantee is inferred from a lock-info record.

    B4. Preserve the existing exception boundaries. Interactive human TTY full-rebuild winners may use Q1's strict inline rebuild under flock. Missing/unreadable cache remains on the signed-off BUG-683/BUG-1097 strict/error paths; a missing stamp on a usable compatible snapshot is NOT a missing cache. Pending migration never serves old-schema rows: retain Q2's at-most-15s holder polling only without store/SQLite write locks, then the specified upgrade error; budget-0 advisory paths remain silent successful exits without serving old-schema data. Unsupported flock errors retain the signed-off fail-closed strict fallback. These exceptions must not leak into the normal compatible non-TTY stale branch. BUG-1674's show-specific deadline/error exceptions supersede these general TTY/migration/unsupported-flock rules when that separate work lands; B does not implement or claim the show fix.

    B5. No mutation relaxation and no lock-error escalation. Keep all BUG-1664/BUG-1670 strict/revalidation paths, ID collision checks, gates, lease/claim, and explicit cache commands strict. Opportunistic sweeps still skip when not fresh per their existing contract. Fix ensure_cache_fresh's current Err branch as well as the new tolerant path: typed lock exhaustion propagates on strict paths after their existing incremental retry policy; it must not fall through to full_rebuild. Other safe full-rebuild reasons remain distinct. Keep busy_timeout=0 and DEFAULT_CACHE_RETRY_DELAYS_MS unchanged. Restore the one-attempt scope on every exit so later strict calls do not inherit it.

    B6. Preserve A3/A4/A5/A9: transaction head recheck, canonical sidecar helper, same-thread nesting without self-wait/self-labelling, independent reader threads contending normally, and no blocking refresh wait under a store/SQLite write lock. Labels describe the committed rows actually served (including their head/built_at), not metadata fetched after a later commit. One invocation/per-MCP-call collector; stale observations survive later fresh backend reads; object JSON/TOON cache metadata always present, arrays unchanged and stderr-labelled, and every tolerant MCP call carries structuredContent.cache plus text. Add Deferred to the existing shared enum/collector rather than introducing another output contract. Updating the plan and WIP enum/notes is implementer work, not performed by this advisor.

    REQUIRED NAMED TESTS (acceptance names; not claimed present or passing)
    All fixtures use isolated stores/caches and fake HOME. Use barriers plus refresh/full-load/write/retry/spawn/request counters; tiny-fixture timing alone cannot prove the selected path.

    1. non_tty_full_rebuild_winner_serves_deferred_without_worker: missing stamp, non-ancestor, large-diff and ordinary full-rebuild decline cases; useful compatible stale result, exact Deferred label/provenance, zero full load/rebuild/ladder/request/spawn. Cover JSON/TOON, non-TTY human and tolerant MCP seam; advisory budget 0 adds no wait. Assert the configured wait budget and ordinary fixture completion <2s, without claiming a universal whole-command CPU bound.
    2. deferred_full_rebuild_repeats_honestly_until_strict_refresh: repeated reads stay accurately labelled; explicit strict rebuild makes the next read fresh. No false promise of autonomous recovery.
    3. reader_incremental_lock_error_does_not_full_rebuild: real separate SQLite BEGIN IMMEDIATE holder; absent AND misleading sidecar variants; one write attempt, zero retry sleeps/full rebuild/request/spawn, useful WriterBusy stale result and unchanged committed rows/head/built_at. Include constructor and already-open backend reads. Replace the superseded task_1515_read_path_lock_error_falls_back_to_full_rebuild_then_fails expectation, retaining its integrity assertions.
    4. writer_busy_next_reader_retries_incremental_after_lock_release: catch-up succeeds after the holder releases; busy scope/verdict does not leak.
    5. strict_incremental_lock_error_propagates_without_full_rebuild: strict callers fail on exhausted contention, do not serve stale, preserve their configured ladder, and perform no fallback rebuild. Include a strict call after a tolerant busy call to prove scope restoration.
    6. refresh_holder_exits_without_refresh_returns_deferred: both release and crash; committed cache remains stale, no fabricated WorkerRunning/Requested and no wait-budget restart.
    7. tty_full_rebuild_winner_remains_strict_before_c: explicit human/TTY mode still refreshes; JSON/TOON modes do not accidentally take this branch even with a TTY attached.
    8. stale_rows_and_label_metadata_share_snapshot: barrier-controlled writer commit cannot label older returned rows with the newer stamp or stale:false.
    9. stale_allowed_outputs_cover_deferred_writer_busy_and_worker_running: enumerate A9's stale-allowed surfaces, object/array shapes, one stderr note, always-present object cache metadata, and fresh/error/nested collector reset; extend stale_note_wording_matches_refresh_state and mcp_read_tool_result_carries_cache_object_each_call.

    Retain the previously binding named B tests: single_flight_four_readers_one_refresh (one-commit incremental fixture); losing_reader_past_wait_prints_stale_note_and_json_flag_exit_0; lock_winner_rechecks_is_stale_and_skips_work; reader_path_never_calls_with_cache_write (LOSERS only); flock_unsupported_falls_back_to_strict_refresh; migration_pending_reader_never_serves_old_schema (include Q2 timeout and silent budget-0 cases); nested_freshen_in_lock_holder_does_not_wait (plus independent-thread contention); refresh_txn_rechecks_head_inside_txn; second_process_skips_refill_after_migration_committed; head_recapture_after_incremental_err_break_stamps_current_head; epic_status_preresolved_before_incremental_txn; lock_info_foreign_host_is_unknown_and_kept; lock_info_foreign_pidns_is_unknown_and_kept. Add refresh_wait_refuses_while_store_or_sqlite_write_lock_held. Preserve existing strict mutation and busy-timeout/ladder regressions. No requirement to run tests against live cache locks.

    WHAT STAYS IN C / ROUTING
    TASK-1527 retains ALL durable request writing/clearing, Requested state backed by real request/spawn evidence, detached worker and worker commands, explicit store/cache arguments and CLOEXEC, retry/recovery scheduling, runtime cap/log rotation, cache-status/doctor request/worker fields, AIDA_CACHE_NO_DETACH, and 3-failures/10-minute backoff. C replaces the Deferred full-rebuild and no-request WriterBusy branches with Q1/request handling, then performs the bounded wait; A7 still clears only when fresh at current HEAD. Worker crash/respawn/backoff/no-detach tests stay C. Neither B nor this decision satisfies the parent story's worker-liveness acceptance. TASK-1514 caller expansion and BUG-1674 show implementation remain separate.

    The implementer MAY resume the dependent reader-protocol work under these amendments AFTER product routes this decision and performs the authorized lifecycle/punt transition. No further design signoff is needed for this particular fork; implementation remains subject to independent review. I have not edited code, run implementation validation, changed status/queue/lease, written a punt-resolution response, resumed the implementer, or cleared Needs Attention. Product owns that handoff. This comment is the binding decision on TASK-1526; the parent signoff otherwise remains in force.
