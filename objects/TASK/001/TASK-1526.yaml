    ## 2. What the first failure actually shows

    ### 2.1 Primary witness, preserved as measured

    From `logs/v3-zero-first.stdout`, SHA-256 `81fc0483…a3e529`, and its receipt `de2e8d2f…e389`:

    - The run used the binary with SHA-256 `8b262e2c…fa87a`, exit 101, and AC1 panicked at `cached_git_backend.rs:4348`. The load average was `[12.17, 12.69, 17.58]` before the run and `[13.12, 12.87, 17.51]` after. Affinity was all six CPUs and the timeout was 45s.
    - `PROBE_READY` arrivals were `[3,1,0,2]` with `all_four_before_acquire:true`. `PROBE_HELD` reported `winner:3`, `real_refresh_flock_held:true` and `hold_ms:0`.
    - **Losers 0, 1 and 2.** Each started at about `18:59:56.37314` and ended at `18:59:57.90118`–`.90134`, for 1.528038–1.528182s. Each returned 256 rows labelled `stale:true, refreshing:worker_running`, pinned to cache head `738b2234…` and `built_at 18:59:51.828911521`, with **empty counters**.
    - **Winner 3.** It started at `18:59:56.373197` and ended at `18:59:59.021488`, for **2.648286s**. It returned 256 fresh rows with `gen1`=2 at pinned head `55705f5d…`. Its counters were `incremental:1, write_attempt:1` and no `retry_sleep`.

    This failure is not re-measured, re-selected, filtered or subtracted here. It stays the binding first failure.

    ### 2.2 Diagnostic decomposition (never acceptance credit)

    `wait_remaining` (`cache_refresh.rs:535–545`) starts a loser's deadline when the loser first enters the contended branch. That happens after the `BEFORE_ACQUIRE` barrier releases all four readers together. So a loser's total time is its pre-barrier time, plus the 1500ms budget, plus its tail. In V3, all of that adds up to 28ms over the budget. That bounds the winner's pre-barrier constructor time at about 28ms, and the winner's own post-release work at **≥ 2.62s**.

    The same arithmetic on the two V2 first runs:

    | Case | Winner elapsed | Losers' (pre-barrier + tail) | Deliberate hold | Winner work after release, excluding the hold (diagnostic lower bound) |
    | --- | ---: | ---: | ---: | ---: |
    | v3-zero-first | 2.648 | ≤0.028 | 0 | ≥2.62 |
    | v2-short-first | 2.229 | ≤0.141 | 0.250 | ≥1.84 |
    | v2-expired-first | 3.603 | ≤0.148 | 1.650 | ≥1.81 |

    This table is used **only** to locate the cost: it is the winner's, and it repeats across three independent first runs. It is not an acceptance figure. No hold is subtracted from any acceptance clock.

    ### 2.3 Source map of the winner path at the pin

    The winner's path runs from the constructor to its useful result:

    1. `CachedGitBackend::open` → `with_inner` (`cached_git_backend.rs:40–47`).
    2. `Cache::open` → `open_connection_inner` (`cache.rs:719–747`). This open uses the full ladder: `with_cache_retry_observed(... "open cache" ...)` at `cache.rs:720` with `DEFAULT_CACHE_RETRY_DELAYS_MS = [100…12800]` (`cache.rs:563`).
    3. `ensure_cache_fresh_for_read_with_schema_retry` (`:45`) → `freshen_for_read` (`:496`).
    4. `current_head_sha` (one `git rev-parse`), `is_stale`, then `RefreshLock::try_acquire` with the barrier, which this reader wins.
    5. A recheck with a second `git rev-parse`, a third `git rev-parse`, and `is_ancestor_with_timeout` (`:538`, one `git merge-base`, polled every 5ms).
    6. `ReadRefreshAttempt::new()` (`:546`) → `try_incremental_update` (`:878`):
       - `changed_object_files` (one `git diff`).
       - Two targeted YAML reads through `GitBackend::get_requirement_by_spec_id`, which read the file directly with no store scan (`git_backend.rs` symbol).
       - Ancestor-epic pre-resolution.
       - The `TASK_1515_AFTER_READS` hook (`:950`).
       - A head recheck (one `git rev-parse`).
       - `Cache::apply_incremental` (`cache.rs:1769–1803`).
    7. Inside `apply_incremental`, under `with_cache_write` (`cache.rs:807`):
       - Create the lock-info sidecar (no fsync).
       - `BEGIN IMMEDIATE` (`:1788`).
       - `refresh_head_reached`, which runs two git children while the write lock is held (`cache.rs:576–597`).
       - Two row upserts and the stamp.
       - **`tx.commit()` (`:1799`)**.
       - Clean up the sidecar.
    8. Constructor return, then the query: `with_cache_schema_retry` → `tolerant_read` → `freshen_for_read`, which is now fresh (one `git rev-parse`). Then `current_head_sha`, `read_snapshot` (a new read-only connection with `BEGIN DEFERRED`), and the 256-row list and provenance.

    The losers run the same git spawns, constructor, snapshot and 256-row query, all inside their 28ms, so those parts are cheap on this host. The winner-only work is: one `git merge-base`, one `git diff`, three more `git rev-parse` and one more `git merge-base` (two of them inside the write transaction), two small YAML reads, two upserts, the sidecar create and remove, and **one durable commit**.

    Nowhere in the pinned crates is `synchronous` or `wal_autocheckpoint` set: `git grep` finds them only in `history_cache.rs`. rusqlite 0.31 is built `bundled`, with SQLite's compile default `SQLITE_DEFAULT_SYNCHRONOUS=2` (FULL) and the same value for WAL. So the commit at `cache.rs:1799` fsyncs `cache.db-wal`. If the WAL also crosses the 1000-page auto-checkpoint threshold, the commit runs a checkpoint with further fsyncs of the WAL and the database.

    Two observations support this, and both are corroborating, not decisive:

    - **V1.** The bulk fixture went through the per-row product filing and write-through path, one durable cache commit per row, and timed out at 45s during setup in all four attempts. That would be expected if each durable commit cost hundreds of ms or more on this host.
    - **`host.json`.** Captured at 18:48 UTC, it records `Dirty: 5925292 kB`. On ext4 in data=ordered mode, an fsync while that much is dirty can wait behind journal writeback.

    This sketch does **not** claim that this host's fsync cost explains the whole interval. E1 decides that.

    ### 2.4 The loser constructor retry is a separate finding and does not explain the winner

    In V2, some readers recorded exactly one `retry_sleep` with zero writes. The counter at `cache.rs:875` also counts open-time retries (`cache.rs:720`). This is consistent with SQLite returning a busy/recovery error to concurrent openers while one connection initializes the WAL index. Because the barrier absorbed those 100ms sleeps before the loser clocks' budgets started, no measured AC1 failure is attributable to them. The decisive V3 case recorded **zero** retries. L1 therefore does not claim to fix the constructor retry. That item is handled separately in §5 (L2), as an accounting rule plus a design fork for the advisor.

