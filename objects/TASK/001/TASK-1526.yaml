      - Classifier exclusion under `.context(…)`, with zero schema rebuilds.
    - **T1-A `read_winner_admission_seam_refuses_or_retires`.** Rows A1–A5, each labelled SEAM, each proving its path before its assertion.
    - **T1-R: retirement.** Named narrow tests:
      - `retired_handle_ordinary_close_releases_write_lock_for_separate_connection`: E19 → `close = Closed`, `physical_release = Confirmed`. Immediately afterward, a **separate** new `Cache::open` connection acquires `BEGIN IMMEDIATE` with no BUSY, and a new snapshot shows the fresh rows. This is the actual successful-close control.
      - `retired_handle_injected_close_failure_quarantines_connection`: E22 on E19 and on E18.
        - Assert `close = CloseFailed(injected)`, `physical_release = Unconfirmed`, `rolled_back = Unknown` (E18), and that the slot is `Retired{quarantined: true}` (cfg(test) inspector).
        - Same-handle query, mutation, `read_snapshot` and early-exit APIs all return Retired, with O-expose 0.
        - Primary, restore and close diagnostics survive two `.context()` wrappers. No WriterBusy and no schema recovery.
        - Dropping the handle does not panic.
        - **No** release claim is made at retirement time. A separate-connection write after the handle drops is recorded only as a post-drop observation.
      - `retired_handle_unwind_retires_once_and_poison_preserves_cause`: E23 under `catch_unwind`. No double panic; O-retire = 1 with cause `Unwind`; close recorded. Three later calls, from this thread and from two others, each return `Retired{Unwind, first_report:false}`, and O-retire stays 1.
      - `retired_handle_unwind_with_injected_close_failure_does_not_double_panic`: E24.
      - `poisoned_strict_mutex_retires_once_with_poisoned_cause`: a cfg(test) panic inside a strict upsert closure poisons the mutex. The first later call returns `Retired{Poisoned, first_report:true}` with close observed; later calls keep that cause, and the count stays 1.
      - `waiting_same_handle_caller_after_verified_restore_writes_at_default` and `waiting_same_handle_caller_after_live_precheck_gets_retired_without_exposure`: §4.1 (M9 target).
      - `retired_handle_fences_every_data_entry_and_keeps_exempt_getters`: V3 T1-R(r2) plus `recheck_migration` on a retired handle.
      - `snapshot_mint_racing_retirement_returns_retired` (M10 target) and `snapshot_pinned_before_retirement_remains_readable`.
    - **T2 `strict_paths_keep_their_connection_durability`.**
      - S-a1, S-a2, S-b, S-c, S-d, S-k1, S-k2, S-q, S-nd1, S-nd2 and S-nd3 (§5.3).
      - Every §5.2 label fires at 2.
