    ## 4. Proposed correction L1 — winner commit without a durable sync

    ### 4.1 Owner, trigger and handler

    - **Owner.** The aida-core cache layer: `Cache::apply_incremental` (`cache.rs:1769`) and the existing thread-local `ReadRefreshAttempt` / `READ_REFRESH_ATTEMPT` (`cache.rs:602, 612–622`).
    - **Trigger.** Only the read-path winner's single fast-fail incremental attempt sets `READ_REFRESH_ATTEMPT`. That happens at `cached_git_backend.rs:546` in `freshen_for_read`'s winner branch. The flag is also set around the one-attempt TTY `ensure_cache_fresh` at `:576`; see §4.3 for how L1 behaves there.
    - **Handler.** Inside `apply_incremental`, while holding this handle's connection mutex and **before** `with_cache_write`/`BEGIN IMMEDIATE`, when `READ_REFRESH_ATTEMPT` is set:
      - Read the current `PRAGMA synchronous` and `PRAGMA wal_autocheckpoint`.
      - Set `synchronous=NORMAL` and `wal_autocheckpoint=0` on this connection.
      - Run the existing closure unchanged: one attempt, because the ladder is empty under `READ_REFRESH_ATTEMPT`.
      - Then restore both values exactly as read, after the transaction has committed or rolled back. The restore is a guard that runs on `Ok(true)`, `Ok(false)` (decline), a typed lock error (busy `BEGIN IMMEDIATE`, i.e. WriterBusy), any other error, and unwinding. Pragmas are changed only outside a transaction.
    - **No other call site changes**: no new API, no new lock, no new thread or process, no schema change and no configuration knob.

    ### 4.2 Why it is safe for a derived projection

    In WAL mode with `synchronous=NORMAL`, SQLite documents that the database stays consistent. An application crash loses nothing: the WAL frames are already in the OS page cache. A power loss or OS crash may roll back the most recent commits. For this cache, a rolled-back incremental commit loses its rows **and** its stamp together, because they are one transaction (TASK-1515). After a reboot the cache is therefore at its previous committed head, which is honestly stale, and the next reader or the worker refreshes again from the canonical Git store. The next FULL commit by any writer fsyncs the WAL, and with it the earlier NORMAL frames.

    Suspending auto-checkpoint for this one transaction only moves the checkpoint to the next strict writer or worker commit, or to the existing close-time checkpoint. `NO_CKPT_ON_CLOSE` is **not** proposed. So the WAL stays bounded exactly as it is today. This is the same reasoning behind `history_cache.rs:1089–1113` (TASK-1507).

    The 2026-10-05 corruption comment on STORY-1484 happened under today's FULL setting, with a binary replaced mid-stream. L1 does not claim to address that, and must not be read as reducing corruption protection. NORMAL in WAL mode adds risk to durability, not to consistency.

    ### 4.3 Boundaries

    - L1 covers **only** `apply_incremental` under `READ_REFRESH_ATTEMPT`.
    - These all keep FULL and auto-checkpoint: `ensure_cache_fresh` strict incremental (no flag); the write-through `upsert_requirement`/`delete_requirement`; `rebuild_for_refresh`/`rebuild_from_store`/`rebuild_after_cache_schema_drift`; the C worker, which takes the strict path; and `cache rebuild`/`verify --fix`.
    - **TTY one-attempt rebuild at `:576`.** That branch runs `ensure_cache_fresh()` under `READ_REFRESH_ATTEMPT`. If it chooses the incremental path, it reaches `apply_incremental`, and L1 applies. If it chooses `full_rebuild`, L1 does **not** apply, because only `apply_incremental` carries the handler. The advisor must confirm that the Q1 interactive incremental may use L1. The recommendation is yes: it is the same derived single transaction.
    - **Nested or recursive use.** A nested `freshen_for_read` returns early (`:522–524`). If the guard ever finds the connection already at NORMAL, it records and restores the value it read, not a hard-coded FULL.

    ### 4.4 Explicit advisor ruling needed (a design fork, not a human question)

    STORY-1484's Out of scope list says "Changing … WAL". L1 keeps journal_mode=WAL and changes the per-transaction **sync and checkpoint scope** for the read-path winner only. This author reads "WAL" as journal mode and leaves the reading for the gate to rule on. **If the gate rules that L1 falls under that exclusion**, the signed B scope has no grounded remedy for a sync-dominated winner. The remaining options would be a winner deadline or handoff, which needs TASK-1527 V2's phase machinery (rejected alternative X2, §9), or removing inline refresh from readers entirely (X3). That would be an advisor design fork escalated with E1's data, not a human policy question.

    ## 5. L2 — constructor-open retries: accounting rule plus a design fork

    **Grounded facts.** Every `Cache::open` runs its open under the full ladder (`cache.rs:720`), whose worst case is about 25.5s. Every CLI invocation creates a `CacheReadScope` (`lib.rs:1124`) and configures a read policy (`lib.rs:3862`), mutations included. So `Cache::open` cannot tell a tolerant read from a strict command. Changing open patience at that point would shorten it for strict commands too.

    **Proposed binding accounting (test-only, no product change).**

    - Split the cfg(test) counter: increment `open_retry_sleep` when the sleep happens outside `holding_write()` during `open cache`, and keep `retry_sleep` for everything else. The legacy `retry_sleep` total may be kept as the sum.
    - The acceptance test (§7, T4) requires **zero write-path retry sleeps** and **zero `with_cache_write` by losers**. It counts open retries honestly **inside** each reader's measured elapsed time. It does not require zero open retries, because A13 scopes the no-ladder rule to the post-race loser. The probe's stricter zero-retry assertion was the probe author's choice, not a signed criterion.

    **Fork for the advisor.** Either:

    - **(a)** accept the pre-race open ladder as outside A13, with its cost always counted in AC1; or
    - **(b)** bound the open retry by the invocation's shared read deadline, only for constructors opened by an ordinary stale-allowed read. That needs a read-intent flag passed from command classification in `lib.rs:3852–3868` into `CachedGitBackend::with_inner`, and it must leave strict commands' open patience unchanged.

    The recommendation is **(a) for this correction**. The decisive failure had zero retries; every observed open retry resolved at the first 100ms step; and (b) changes the open path shared with BUG-683, BUG-1097 and BUG-1752, which is a larger change. If the gate prefers (b), it becomes a separately sketched item. It must not be folded silently into L1.

    ## 6. E1 — the one proposed attribution experiment (not executed)

    - **The question.** In the decisive zero-delay fixture on the pinned binary, what share of the winner thread's time after release is spent in `fsync`/`fdatasync` on `cache.db-wal`/`cache.db`, compared with child-process (git) lifetime and everything else?
    - **Design.** Run once, recording the first result only, with no source change.
      - **Executable.** The retained V3 test binary `task1526-default-budget-independent/target/debug/deps/aida_core-0a54d692a9eb69e2`. Before running, verify SHA-256 `8b262e2cb3b4f724b793bb29b366c784a12290d36cd4c2f8886850f1331fa87a`, or abort and report that the evidence is missing. Do not rebuild.
      - **Invocation.** The same bwrap sandbox, allow-listed environment and test filter `db::cached_git_backend::tests::independent_default_budget_zero_delay --exact --nocapture --test-threads=1` as `logs/v3-zero-first.result.json`. The one difference is the prefix `/usr/bin/strace -f -tt -T -y -o /evidence/../task1526-latency-attribution/strace.txt -e trace=fsync,fdatasync,sync_file_range,execve,wait4,flock`. strace is in `/usr`, so it is visible inside the sandbox, and `ptrace_scope=1` allows tracing a child.
      - **Same supervision.** A 45s timeout, a reaped process group, and no rerun.
      - **Host data.** Record `/proc/meminfo` `Dirty`/`Writeback`, load averages and affinity, before and after.
      - **Output.** Write everything to a **new** folder, `task1526-latency-attribution/`. Every existing V1–V3 artifact stays byte-identical; check this with `artifact-integrity.json` before and after.
    - **Attribution.**
      - The winner thread is the thread ID whose `flock(... cache.db.refresh.lock, LOCK_EX|LOCK_NB) = 0` succeeds first and that later issues `fsync`/`fdatasync` on `cache.db-wal`; the `-y` paths identify the file.
      - Its window runs from that flock to its last traced syscall before the `PROBE_READER` line with `"reader":<winner>`, cross-checked against the probe's printed UTC times.
      - Compute `S` (the sum of sync durations on the cache files), `G` (the sum of `execve` to the matching `wait4` return for git children of that thread), and `W` (the window).
    - **Decision rule, fixed now.**
      - **D1:** `S ≥ 0.5·W` and `S` is the largest component. L1 is grounded, and it goes to the new gate together with E1's data.
      - **D2:** `G ≥ 0.5·W`. L1 is withdrawn. The next step is a sketch revision for **L3**: reuse one captured HEAD per freshen decision, and remove git children from inside `BEGIN IMMEDIATE` while keeping A3's in-transaction head recheck. It is not designed here.
      - **D3:** neither. No remedy is grounded. The missing evidence is the time spent per phase (YAML reads, SQL, hook coordination). The next bounded measurement would be cfg(test) phase timestamps in a private export (E2), proposed separately.
      - **D4:** the trace fails, setup times out, or the winner thread cannot be identified. Record that, do not retry, and report the exact missing evidence.
    - **Limits.**
      - strace slows the traced process. E1's elapsed times and libtest outcome are recorded but are **never** acceptance evidence for or against AC1, and they never replace the first failure.
      - E1 tests no remedy, selects no load window, applies no outlier filter, subtracts no hold, resets no counter and raises no budget.
      - If E1 happens to finish in under 2s, it certifies nothing.

    E1 needs no Cargo build, workspace build, install or canonical write. It is offered because L1's selection depends on attribution. If the gate judges the source and environment grounding in §2.3 sufficient without E1, it may say so explicitly; this author does not claim that.

    ## 7. Binding amendments and named tests (all proposed and unrun)

    **Amendment L1** (§4), conditional on E1 reaching D1, or on the gate's explicit waiver of E1. **Amendment L2-accounting** (§5). **Fork L2(a)/(b)** and **ruling §4.4** to be decided by the gate.

    **Positive tests:**

    - **T1 `read_refresh_winner_commits_without_durable_sync_and_restores`.** A cfg(test) observer inside `apply_incremental`, after `BEGIN IMMEDIATE` and before commit, records `PRAGMA synchronous` and `wal_autocheckpoint` on the transaction's connection.
      - The read-path winner must see `1` (NORMAL) and `0`.
      - After the call, the same handle must read its prior values (`2` and `1000` by default), on each of these exits: success; a real decline (BUG-1606 epic miss); an injected `INCREMENTAL_ERROR`; and a **real separate `BEGIN IMMEDIATE` holder**, which produces WriterBusy, with an absent sidecar and with a misleading one.
      - On each exit, a strict `upsert_requirement` that follows on the same handle observes FULL.
    - **T2 `strict_paths_keep_full_sync_and_autocheckpoint`.** The observer sees `2` and the configured auto-checkpoint for: strict `ensure_cache_fresh` incremental, write-through upsert and delete, `full_rebuild` refresh and reconcile, schema-drift rebuild, the worker's strict refresh, and `rebuild_cache`. This includes a strict call made immediately after a read-path refresh on the same thread, and one made concurrently on another thread.
    - **T3 `read_refresh_normal_sync_keeps_txn_atomicity`.** Re-run the TASK-1515 atomicity assertions (`task_1515_concurrent_reader_sees_whole_incremental_refreshes`, `task_1515_incremental_rows_roll_back_when_the_stamp_fails`, `refresh_txn_rechecks_head_inside_txn`) through the read-path winner branch. Rows and stamp must never be torn, and a decline rolls everything back.
    - **T4 `single_flight_four_readers_default_budget_every_reader_under_2s`** (AC1 acceptance). Promote the independent V3 design unchanged:
      - Fixture and readers: the real 1500ms default, with `AIDA_CACHE_READ_WAIT_MS` unset; 256 meaningful rows; exactly one stale commit retitling two rows; a fresh `CacheReadScope` per reader thread, with empty counters checked before `open`; clocks from before `open` to the useful result and its pinned head and `built_at`; a four-way `BEFORE_ACQUIRE` barrier; the real `TASK_1515_AFTER_READS` path witness; zero hold.
      - Assertions: one `incremental`, one `write_attempt`, zero `full_rebuild`, zero write-path `retry_sleep`; open retries counted and included; stale rows with `gen0`, `worker_running` and the baseline head and `built_at`; fresh rows with `gen1` and the new head; no request file; every elapsed time **<2,000,000µs**.
      - Run: as a single-test invocation by a **new independent measurement session**, on the actual loaded host class, first execution only, with load and `Dirty` recorded.
      - The existing 60s `single_flight_four_readers_one_refresh` stays byte-unchanged and remains **not** a latency certificate.

    **Negative and non-vacuity controls** (each must fail at the named assertion, not during setup):

    - **M1.** L1 removed: T1 fails at the observer (`synchronous=2`).
    - **M2.** NORMAL applied at `Cache::open`: T2 fails.
    - **M3.** Restore skipped on the decline, error or busy exit: T1's restore or strict-follow-up assertion fails in that branch.
    - **M4.** The existing `skip_refresh` mutation: T4 `PATH_WITNESS` fails.
    - **M5.** The existing `serialize` mutation: T4 `NONVACUITY` fails.
    - **M6.** L1 also armed for losers: the existing `reader_path_never_calls_with_cache_write` and T4's loser zero-write assertion fail.

    **Retained.** All B1–B6 named tests, the A-series tests listed in `01a0e0fb…`, and the BUG-1778/1779 regressions run unchanged. No existing assertion is relaxed.

    ## 8. Sequencing with TASK-1527 and the other gates

    - **No C integration has to come before L1.** L1 touches only `cache.rs` `apply_incremental` and the existing `ReadRefreshAttempt`. It does not use `file_and_spawn_refresh`, `refresh_request.rs` or `refresh_worker.rs`.
    - **Keep TASK-1527 blocked-by TASK-1526.** No dependency is removed and no worker is added. The order is TASK-1526 L1 → independent review → merge → TASK-1527 V2 implementation, rebased.
    - **Overlap.** V2's R1 phase table (§4) runs "One fast-fail incremental attempt" under the same `ReadRefreshAttempt` and adds a RequestLock read/RMW under RefreshLock before the SQLite attempt. That RMW is `refresh_request.rs`'s tmp-and-rename with no fsync. V2's implementer must keep T1, T2 and T4 green, and run T4 again as a new independent measurement after V2 lands, because V2 adds work to the winner's path. V2's ordinary-strict preselection (no-detach or suppression) uses strict `ensure_cache_fresh` and so keeps FULL. That is correct, and those paths are outside AC1's fixture.
    - **Ownership.** This sketch does not reinterpret V2's approved design, does not start its code, and does not change its owner.
    - **Out of scope here.** BUG-1674 (whole-command show deadline and provenance), TASK-1674 (full show and the 24h gates) and STORY-1484 closure all stay separate and unmet. L1 may shorten show's winner commit as a side effect, but no show claim is made. CLI process-exit cost, such as the close-time checkpoint, is outside AC1's measured path and is not claimed either.
    - **Untouched.** Reserved TASK-1593, TASK-1591, BUG-1811 and BUG-1812, and the batch C and D branches.

    ## 9. Rejected alternatives

    - **X1: raise or reshape the 1500ms budget, or lower AC1.** Forbidden. TASK-1565 is KeepCurrentBudget, not a numeric waiver.
    - **X2: a winner deadline before `BEGIN IMMEDIATE`, then hand off to the C worker.** This needs V2's post-attempt handoff phases, which are not started, and would turn the measured fixture into zero refreshes. It is not proposed.
    - **X3: no inline refresh by readers; always use the worker.** That changes STORY-1484's design and the "exactly one refresh" counter, so it would be a new architecture fork.
    - **X4: disable sync globally, or `NO_CKPT_ON_CLOSE` for the cache.** Too broad: it changes durability for strict writers. Rejected.
    - **X5: drop the two git children inside the transaction now.** That is only D2's path; L3 is not designed unless E1 points to it.

    ## 10. Limits and stance

    There is no universal OS or latency bound, no fleet guard, no whole-command CPU bound and no 24h claim. L1 cannot bound fsync-independent costs such as CPU starvation or slow reads. The rule that ReadBudget bounds polling, not all work, stays as it is. The future acceptance is T4, measured fresh by an independent session. The first failure remains on record whatever happens.

