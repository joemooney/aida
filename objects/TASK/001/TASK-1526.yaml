    - [Independent baseline/result checks](task1526-default-budget-independent/baseline-and-result-verification.json), [source identity](task1526-default-budget-independent/source-identity.json), [complete export checks](task1526-default-budget-independent/complete-export-verification.json)
    - [V1→V2 fixture change](task1526-default-budget-independent/fixture-only-v1-to-v2.patch), retained V1/V2 binaries and all unfiltered first logs
    - `build*.py`, `run_probe*.py`, `logs/build*-result.json`, `binary*.json`, `toolchain.txt`, `host.json`, `environment.json`, and the final nonrecursive `artifact-integrity.json`.

