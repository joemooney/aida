    ### 4.3 Admission, unchanged from the approved boundary

    Under the mutex, before O-prep, all of these must hold: the token's handle identity equals `self`, its thread equals the current thread, `READ_REFRESH_ATTEMPT` is set, `conn.is_autocommit()`, and the cache is not read-only.

    - An identity, thread, flag or read-only mismatch → `refused`: Strict durability, nothing else changed. The existing retry scope still applies.
    - Not in autocommit → retire, with cause `admission_not_autocommit`.
    - The token is consumed by the call. It is never stored, cloned or rebuilt.

