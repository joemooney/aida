    `TASK1526_LATENCY_REWORK_SKETCH_V4.md`: 62925 bytes, SHA-256 `383017916ce28dcafe3fed3a4df7ee950319c84d0f602eb3fe130e7d254080e2`.

    This READY note does not embed its own hash. The separate `task1526-latency-v4-hash-manifest.json` lists every input, and it does not list itself or this note.

    ## Response to the V3 review, F1–F4

    1. **F1, retirement ownership and close (V4 §3).**
       - The in-memory placeholder is gone. `Mutex<ConnSlot>`, with `ConnSlot` being `Live(Connection)` or `Retired{cause, close, quarantined: Option<Connection>}`. Retirement is an in-place `mem::replace`, with no fallible allocation.
       - **The single post-acquire gate is the slot discriminant.** The precheck is only an optimization. Poison with a `Live` slot retires once as `Poisoned`. Every later caller receives the **first** cause, and the count does not change.
       - The borrow checker enforces the resource order: the transaction, statements and borrows all end before close.
       - There is one explicit `Connection::close()`, and its Result is observed. `Closed` means physical release is **confirmed**. `CloseFailed` means the connection is **quarantined**: never served again, and dropped only when the handle drops. Release is then **unconfirmed**.
       - No cleanup service, loop or raw `sqlite3_close_v2`.
       - On unwind, the `WeakCommitScope` owns the guard and makes one best-effort close, with no claim made.
       - Precedence is unchanged. Primary, rollback, restore and close diagnostics are kept inside Retired. `committed:true` is preserved.
       - Named narrow tests cover ordinary close success with a **separate-connection** write control, injected close failure, unwind, unwind plus close failure, and poison.
    2. **F2, S-d/M9 (§4).**
       - H-prelock fires only **after a witnessed live precheck**, immediately before `lock()`. The winner then retires under its mutex and releases. The waiting caller is joined only after the winner returns.
       - The target is O-expose(V) == 0 plus a typed `Retired{RestoreFailed}` Result.
       - M9 deletes exactly the slot-discriminant gate. The text explains why the precheck, poison, F-entry and the AtomicBool do not mask it.
       - No manufactured schema and no mocked write. The restore-success positive and the independent M10, with its positive pinned snapshot, are kept.
    3. **F3, S-b (§5).**
       - The actual strict upsert is kept, with its unchanged autocommit statements (no BEGIN, as verified in the source).
       - The BUSY witness comes from its **first modifying statement**, the DELETE, through the real `Write` retry ladder and a one-shot callback.
       - `own_setting_while_held` (a real PRAGMA read) is kept separate from O-write(upsert), which fires only after a successful modifying attempt, after release.
       - No production transaction change and no join while the winner is held.
       - Placements are given for every mandatory strict label. M2 and M7 detection versus unaffected-control status is declared per schedule.
    4. **F4, counts (§6).**
       - Rows E1–E24 cover the ordinary winner, and rows A1–A5 cover the labelled SEAM cases: invalid identity, thread and missing-retry tokens on a writable autocommit handle; read-only forced (no prep, transaction or closure; wrapper 1, write 0); and not-in-autocommit retirement before prep.
       - The closure-issued ROLLBACK fixture is distinguished from an engine automatic rollback, which is not evidenced.
       - M6-ii accepts tx ∈ {0, 1} and is detected by the loser's zero `weak_prep_attempt`, checked first.
       - Real set and read-back rules: unknown state → restore and verify, or retire. There is no `not_needed` value. Faults inject an `Err` or substitute a real SQL action, never a PRAGMA value.

    **V3 review §4 notes (§§3.6, 5.3, 7):**

    - The W-amb probe sits before the ambient constructor (`git_backend_cmd.rs:1202`) for every CLI cache arm.
    - W-exp and W-stop sit before the watchdog, and `worker_watchdog_spawned` must be 0.
    - W-mcp fires on every call, so the second `list_requirements` call gets its own observation.
    - The `run_from_args` delegation extraction is proposed, with a stated fallback composition.
    - P6 gets its own stale input.
    - The S-nd fixtures are specified so that weak = 0 is true.
    - F-snap failure precedence is complete.

