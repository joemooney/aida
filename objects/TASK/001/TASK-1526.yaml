    ## 1. Pins

    The source basis is `ff9ac13c4fb18f2c7e63f39ef112cca8c7d8a578`. HEAD at writing is `c67728c1dcaf8a577539d920bdc6a3c86126cebb`. `git diff ff9ac13c4f HEAD -- aida-core` is empty (re-checked). `mcp.rs::handle_tools_call` is at `:1088` in HEAD. Blob hashes: V1 §1.2 and review 2 §2. The rusqlite 0.31.0 transaction semantics are in `transaction.rs:186–247`: commit and rollback consume the transaction, Drop ignores finish errors, and `set_drop_behavior` plus `is_autocommit` are available. bundled SQLite (from review 2 §2): synchronous is connection-local and cannot be changed inside a transaction, and WAL allows a single writer.

    ## 2. Finding 1 — complete handle-wide data-operation retirement

    ### 2.1 Inventory (corrected)

    There are **20 production** `conn.lock().unwrap()` sites and **6 test** sites (26 in the whole file; V2's "26 non-test" was wrong). Production sites by line and function:

    - `1421 recheck_migration`
    - `1442 set_meta`
    - `1454 get_meta` (used by `source_head_sha`, `built_at`, `last_full_rebuild_ms`)
    - `1520 truncate`
    - `1623 rebuild_projection` (used by `rebuild_from_store`, `rebuild_for_refresh`, `rebuild_from_store_after_schema_drift`)
    - `1781 apply_incremental`
    - `1824 upsert_requirement`
    - `1862 recompute_epic_status_from_hierarchy`
    - `1884 ancestor_epic_ids`
    - `1890 delete_requirement`
    - `2080 list_summaries`
    - `2121 search`
    - `2149 requirement_count`
    - `2161 pending_decision_count`
    - `2174 degrees_for_id`
    - `2201 spec_id_for_uuid`
    - `2218 spec_id_collisions`
    - `2273 query_id_rows` (used by `id_rows_for`, `id_rows_all`)
    - `2314 uuid_for_spec_id`
    - `2328 descendant_ids`

    **Non-lock data entry points and early exits** on a `Cache` handle:

    | Entry | Pre-lock behavior at the pin | V3 fence |
    | --- | --- | --- |
    | `read_snapshot` (`:1391`) | Opens a **new** read-only connection without the original mutex | Fence F-snap (§2.2) |
    | `source_head_sha` (`:1476`) | Returns `Ok(None)` before locking when `migration_pending()` | Entry fence F-entry |
    | `is_stale` (`:1509`) | Through `source_head_sha` | Inherits F-entry / F-lock |
    | `search` (`:2094`) | Returns `Ok(vec![])` for an empty escaped query before locking | F-entry |
    | `apply_incremental` (`:1778`) | Returns `Ok(false)` while a migration is pending, before locking | F-entry |
    | `rebuild_projection` (`:1562–1622`) | Derives rows from the store before locking (no handle data is returned) | F-lock at `:1623`, plus F-entry for uniformity |
    | `recheck_migration` (`:1421`) | Non-`Result` bool | Returns the current `migration_pending()` without querying when retired; never exposes the connection |
    | `has_usable_snapshot` (`:1414`) | Atomic bool used to choose a branch | Returns **false** when retired, so callers take strict paths that then fail fenced |

    **Exempt, precisely.** Immutable or diagnostic getters that expose no connection and return no cached data stay available on a retired handle: `path()`, `lock_info_path()`, `is_read_only()` and `migration_pending()` (an atomic flag). V2's blanket "every later call fails" is narrowed to "**every data operation** fails".

    `CacheTx` methods exist only inside one `apply_incremental` transaction, while the mutex is held, so they are covered by F-lock.

    ### 2.2 Mechanism

    These changes are internal to `cache.rs`, with no new framework.

    - **`retired: AtomicBool`** on `Cache`. Every flag access in this protocol uses SeqCst. The flag is **set only while the setter exclusively holds the connection mutex.** When retiring, the setter also swaps the real file connection for an in-memory placeholder and drops the old one, still under the mutex. Dropping the old connection runs `sqlite3_close`, which rolls back any open transaction and releases the database write lock now, not when the handle is eventually dropped. After retirement no NORMAL file connection remains.
    - **F-lock** is a private `lock_conn(&self) -> Result<MutexGuard<'_, Connection>>`. It does an optional pre-check (an optimization only, never an invariant), then `lock()`. A `PoisonError` sets `retired`, swaps and drops the connection, and returns `CacheHandleRetired{cause: Poisoned}`. **After acquiring**, it rechecks `retired` and returns `CacheHandleRetired` without exposing the connection. All 20 production sites use it. `recheck_migration` uses a non-erroring variant that returns the flag.
    - **F-entry** is `ensure_live(&self) -> Result<()>`, the first statement of every `Result` data entry with a pre-lock early exit (`source_head_sha`, `search`, `apply_incremental`, `rebuild_projection`). A call that begins after the store is linearized after retirement and fails. A call that passed its F-entry check before retirement, and exits without touching the connection, linearizes before retirement and returns data that did not come from the bad connection.
    - **F-snap** in `read_snapshot`: `ensure_live()` first (optimization), then mint the new read-only connection, `BEGIN DEFERRED` and the schema check, then **recheck `retired`**. If retired, drop the new snapshot and return `CacheHandleRetired`. A snapshot whose post-mint check saw "live" was pinned before retirement. It is an independent handle reading committed data and is legitimately usable (review 2 finding 1).
    - **Recovery.** Only a separately explicit `Cache::open` or a new `CachedGitBackend` opens a fresh connection. A retired handle is never repaired in place.
    - **Error propagation.** `CacheHandleRetired` and `WeakCommitPrepare` have `source() = None`; inner diagnostics are rendered into the message. **Every** classifier (`is_cache_lock_error`, `is_cache_schema_drift_error`, `is_cache_read_only_error`, `is_cache_unwritable_error`) first checks `chain().any(|c| c.is::<CacheHandleRetired>() || c.is::<WeakCommitPrepare>())` and returns false. This holds even when the error is wrapped in `.context(...)` and its message contains "no such column", "database is locked" or similar text. As a result, `with_cache_schema_retry` never rebuilds, `freshen_for_read` never reports WriterBusy, and nothing becomes stale success.

    ### 2.3 Retirement table

    | Trigger | Set by, under the mutex | Connection | Later calls on the same handle | New handle |
    | --- | --- | --- | --- | --- |
    | Restore or verify fails after finish (rows 9a and 9b, §5) | The eligible `apply_incremental`, before releasing its guard | Swapped and dropped | F-lock, F-entry and F-snap return `CacheHandleRetired`; exempt getters work | Fresh connection at the compiled default |
    | Rollback fails, or autocommit is not confirmed (row 8) | Same | Swapped and dropped, which rolls back the transaction and releases the write lock | Same | Same |
    | Unwind with the mutex held (row 10) | Scope Drop, best effort, under the still-held guard | Swapped and dropped | F-lock maps the poison to retired; F-entry and F-snap see the flag | Same |
    | Admission sees not-in-autocommit (§4) | Admission, under the guard | Swapped and dropped | Same | Same |

    ## 3. Finding 2 — T2 schedules with feasible barriers

    Every schedule records `(cache_id, db_path, conn_id, thread_id, label, PRAGMA synchronous value, barrier order)`. "Same database" means the same `cache.db` file. "Different database" means a separate temporary cache file, labelled `different_database_control` in the record.

    | Schedule | Order | Required counts and outcomes | Explicitly not claimed |
    | --- | --- | --- | --- |
    | **S-a**: other handle, same thread, before BEGIN | The winner pauses at hook **H-armed** (verified NORMAL, before `with_cache_write`). Variant **a1**: on the same thread, open handle B on the same database and run a strict `upsert` of an *unrelated* row. Variant **a2**: run `ensure_cache_fresh` (strict incremental) on handle B. Then resume the winner. | B's O-write `upsert` (a1) or `strict_incremental` (a2) fires once with value **2**. a1: the winner gets tx_observed=1 at value 1, closure=1, and commits. a2: B has already refreshed to the target, so the winner gets **tx_observed=1, closure=0, reached-head skip**, which is legitimate. `weak_commit_refused=0`. | Nothing about a concurrent write during the transaction |
    | **S-b**: other thread, same database, during the transaction | The winner pauses at **H-tx** (O-tx fired, transaction held, write lock held). Thread T on handle C (same database) reads its own `PRAGMA synchronous` (=2, recorded) and starts a strict `upsert`. Its first `BEGIN` hits SQLITE_BUSY, and the existing strict ladder sleeps. A cfg(test) one-shot callback on T's first `retry_sleep_write` sends a signal. The main thread waits for that signal (bounded at 8s; a timeout is a **test failure**, not detection), asserts C's post-BEGIN O-write count is **0**, then releases the winner. | While the winner is held: C post-BEGIN hits = 0, `retry_sleep_write`(T) ≥ 1. After release: T's retry succeeds, and C's O-write `upsert` = 1 hit at value 2. The winner commits and restores. | That two same-database writers ever overlap. The test never waits inside H-tx for a write that cannot happen. |
    | **S-c**: concurrent writer on a different database | While the winner is at H-tx, thread U on handle D (**a different database**) runs a strict upsert to completion. Then the winner is released. | D's O-write `upsert` = 1 at value 2, with no busy. Labelled `different_database_control`. | Any same-database concurrency claim |
    | **S-d**: same handle, other thread | The winner pauses at H-tx. Thread V calls a strict `upsert` on the **same** handle A. A cfg(test) pre-lock hook in `lock_conn` sends "attempting" before `lock()`. Once the main thread has received it, it releases the winner. V is **joined only after** the winner's `apply_incremental` has returned (verified restore and mutex release). | Restore succeeds: V acquires after release, sees exact P, and its O-write `upsert` = 1 at value 2. **Retire variant** (with the FAIL_RESTORE fault): V returns `CacheHandleRetired` with **zero** O-write hits. | — |
    | **S-k**: nested strict call before acquire | The hook between token construction and `apply_incremental` (after `try_incremental_update`'s reads, at the existing AFTER_READS point) runs, on the same thread. Variant **k1**: a strict `upsert` of an unrelated row on the **same** handle A. A's mutex is free at that point, so this is not recursive. Variant **k2**: `ensure_cache_fresh` on handle B (another `Cache` on the same database). | k1: A's O-write `upsert` = 1 at value 2, then the winner proceeds (prep 1, tx 1 at value 1, closure 1). k2: B's `strict_incremental` = 1 at value 2, then the winner reaches the head-reached skip (tx 1, closure 0). In both, `weak_commit_refused=0`. | No recursive same-mutex test inside the transaction (forbidden) |
    | **S-q**: Q1 fallback | An interactive scope plus `task_1515_move_head_during_reads`: the winner declines with `Ok(false)` before `apply_incremental` (prep=0, armed=0). It falls to `:576` and the strict `ensure_cache_fresh` incremental runs at the new head. A separate non-ancestor fixture goes to a full rebuild. | `strict_incremental` = 1 at value 2; `rebuild_for_refresh` = 1 at value 2. Weak counts 0. | — |
    | **S-nd**: no-detach / suppression fallback | Existing seams: `AIDA_CACHE_NO_DETACH` in the test, or a pre-seeded suppressed request in the existing format; `SPAWN_LOG` armed. Reach `file_and_spawn_refresh`'s strict `ensure_cache_fresh`. | `strict_incremental` or `rebuild_for_refresh` = 1 at value 2. Weak counts 0. No real spawn. | — |

    M2 (NORMAL at open) and M7 (retry flag used as authority) must fail on the actual value-2 assertion inside these feasible schedules, never through a timeout or setup failure.

