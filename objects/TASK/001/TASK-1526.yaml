    ## 7. Invocation policy, actual entry map and worker phases

    ### 7.1 Policy (V3 kept)

    - **Sticky Deny.** `CacheReadScope::new()` inherits the enclosing `weak_commit` value. Today `new()` resets `Collected` to default, so this inheritance is a required change. `configure_read_policy` may tighten Allow → Deny but never loosen. Dropping a scope restores the caller's value. `reset_cache_read_observations` never touches the policy. A read-only getter, `weak_commit_policy()`, carries no authority.
    - **The single classifier helper.** `lib.rs:3838–3868` is extracted into `configure_invocation_cache_policy(&cli, &raw_args)`, and `run` calls exactly that helper. Every `Command::Cache(..)` (rebuild, status, verify, and refresh in plain, `--worker` and `--if-requested` forms) maps to Deny.
    - **Per-call MCP policy.** `handle_tools_call` (`mcp.rs:1088`) calls `mcp_call_weak_commit_policy(tool_name)` right after its per-call `CacheReadScope::new()`. `cache_status` maps to Deny; every other tool keeps Allow.

    ### 7.2 Actual-entry witnesses (cfg(test) in aida-cli-lib; local probes, no public knob)

    | Probe | Exact location | Proves |
    | --- | --- | --- |
    | **W-amb** | `git_backend_cmd.rs::handle_git_backend_command`, immediately **before** `CachedGitBackend::with_inner(inner, &cache_path)` (`:1202`). Records `(command label, weak_commit_policy())`. | Every CLI arm reaches the ambient constructor under the dispatcher-installed policy. Every `Command::Cache` arm goes through this constructor before `handle_cache_command` (`:1230`). |
    | **W-exp** | `cache_cmd.rs::handle_cache_refresh`, before the explicit `CachedGitBackend::open(store, cache)` | The explicit worker route stays under Deny |
    | **W-stop** | `handle_cache_refresh`, immediately **before** `if worker {` and the watchdog `thread::spawn`. A cfg(test) one-shot `STOP_BEFORE_WORKER_WATCHDOG` returns `Ok(())` when armed. A cfg(test) counter `worker_watchdog_spawned` sits on the spawn line. | A worker-entry test stops before the watchdog. It asserts `worker_watchdog_spawned == 0`, so no `process::exit` thread is left alive. |
    | **W-mcp** | `handle_tools_call`, right after `mcp_call_weak_commit_policy`. Records `(tool_name, policy)` **on every call**. | Each MCP call has its own scope-entry observation |
    | **W-mcp-cs** | `tool_cache_status`, before its constructor | `cache_status` constructs under Deny |

    **Driving the real entry.** `run` reads `std::env::args()` (`lib.rs:3729`), so it cannot be called in-process with a chosen argv. V4 proposes one narrow, behavior-preserving extraction: `run_from_args(raw_args)`, with `run()` delegating to `run_from_args(std::env::args().collect())`. This is pure delegation and changes no cache or transaction behavior.

    Tests create the `CacheReadScope` exactly as `main_entry` does. They call `run_from_args` against a fixture project under the crate's existing hermetic environment guard, and then assert:

    - `cache rebuild`, `cache status` and `cache verify` → W-amb records Deny.
    - `cache refresh` (plain) and `--if-requested` → W-amb records Deny.
    - `cache refresh --worker --store X --cache Y` → W-amb records Deny, W-exp records Deny, then W-stop. Watchdog spawned 0.
    - `list`, `search` and `show` → W-amb records Allow.
    - MCP: `handle_tools_call(cache_status)` and then `handle_tools_call(list_requirements)` on one fixture server. W-mcp records `[(cache_status, Deny), (list_requirements, Allow)]`. W-mcp-cs records Deny.

    If the gate rejects the extraction, the fallback is the composition V3 stated: the classifier helper test, plus W-amb driven from `run_on_distributed_store`, plus code review that `run` calls the helper before dispatch. In that fallback, the run→helper call is **not** test-witnessed. No owned child process is used, because a release binary carries no cfg(test) probes. C's future watchdog repair is not imported.

    ### 7.3 Core worker and explicit-entry phases (T2(n), core cfg(test), policy forced to the classifier's real output)

    | Phase | Action | Required records |
    | --- | --- | --- |
    | P0 | Fixture at S0, cached; commit S1 (one real changed object) | Stale |
    | P1 | Ambient `CachedGitBackend::with_inner` under Deny | `strict_incremental`(P1) = 1 at 2; weak prep 0; head = S1 |
    | P2 | Commit S2 | Stale |
    | P3 | Explicit `CachedGitBackend::open(store, cache)` | `strict_incremental`(P3) = 1 at 2; weak 0; head = S2 |
    | P4 | Commit S3 | Stale |
    | P5 | `run_refresh_worker(&explicit)` | `strict_incremental`(P5) = 1 at 2, **not** AlreadyFresh; weak 0; head = S3 |
    | P6 | Commit S4 (asserted stale), then a nested default scope inside Deny and an eligible-looking stale read | `weak_commit_refused` ≥ 1 or a Strict write at 2; `weak_prep_attempt` 0; after the nested scope drops, the getter still returns Deny |

    **Stated composition.** aida-core cfg(test) counters cannot be read from a separately built CLI. §7.2 shows that the actual entries run under Deny; §7.3 shows that under Deny the constructors and the body write strictly and never prepare weak mode. C's future early worker route must reuse `configure_invocation_cache_policy`. It is not implemented here.

    ## 8. Transition and outcome tables (consistent with §6.2)

    ### 8.1 Eligible-path transitions

    | # | Event | Action | Result | Handle |
    | --- | --- | --- | --- | --- |
    | 0 | Migration pending | F-entry; `Ok(false)` before the mutex | — | live |
    | 1 | Admission refused (checks 1–4) | Strict path | as Strict | live |
    | 1n | Not in autocommit | Retire `AdmissionNotAutocommit` (§3.3) | Err(Retired) | retired |
    | 2 | Read P fails | No set issued | Err(Prepare) | live |
    | 3 | Set error, wrong value, or unreadable read-back | §6.3: read-back; restore and verify if changed or unknown | Err(Prepare), or 9c | live / retired |
    | 4 | Armed; `with_cache_write` pre-closure error | Confirm autocommit; restore; verify | Primary error, or 9c | live / retired |
    | 5 | Armed; BEGIN busy | Same | Typed lock error → WriterBusy, or 9c → Retired (never WriterBusy) | live / retired |
    | 5n | Armed; BEGIN non-lock error | Same | Err(begin), or 9c | live / retired |
    | 6 | After BEGIN: O-tx; head reached | Checked explicit ROLLBACK; confirm; restore | Ok(true), or 8 / 9 | live / retired |
    | 7a / 7b | Closure `Ok(false)`, or an `Err` with the transaction still open | Checked ROLLBACK; confirm; restore | Ok(false) or Err(primary), or 8 / 9 | live / retired |
    | 7b′ | `Err` and already in autocommit | **No** ROLLBACK; `already_autocommit`; restore | Err(primary), or 9 | live / retired |
    | 7c | COMMIT Ok | Confirm; restore | Ok(true), or 9 (`committed:true`) | live / retired |
    | 7d | COMMIT Err | ROLLBACK if not in autocommit; confirm; restore | Err(commit), or 8 / 9 | live / retired |
    | 8 | Rollback failed or autocommit unconfirmed | Retire: explicit close; ByClose or Unknown per §3.5 | Err(Retired{committed:false}) | retired |
    | 9a / 9b / 9c | Restore fails or mismatches after finish / before any transaction | Retire | Err(Retired{committed, rolled_back}) | retired |
    | 10 | Unwind | Transaction drops (Ignore); scope `Drop` retires with one best-effort close | Panic continues | retired (poisoned) |
    | 11 | Abort or kill | No RAII; SQLite recovery; the setting dies with the connection | — | — |

    ### 8.2 Inner versus public outcome (V3 §5.2 kept)

    | Inner `apply_incremental` | Public `freshen_for_read` |
    | --- | --- |
    | Ok(true) | Ok(None) |
    | Ok(false) | The existing flow: Q1 strict `ensure_cache_fresh`, or `file_and_spawn_refresh` (Requested, Deferred, or a strict no-detach/suppression fallback) |
    | Err(typed lock) | `Some(WriterBusy)` if still stale, else None |
    | Err(Prepare / Retired / other) | Err, propagated |

    The rollback witness **H-after-restore** (V3 §5.3) is kept unchanged. It runs inside `apply_incremental` after O-restore, before returning, and takes a separate pinned snapshot through a different handle.

    ## 9. Tests (all proposed, unrun)

    - **T1 `read_winner_commit_runs_at_normal_and_restores_exact_prior`.**
      - Rows E1–E24 of §6.2 through the real winner branch, with the declared counts and assertion order.
