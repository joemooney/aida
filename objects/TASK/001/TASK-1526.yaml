    - **T3 `read_winner_normal_commit_keeps_txn_atomicity_and_provenance`.**
      - Through the eligible winner, with E1 (tx 1 at 1, closure 1), E2 (closure 0), E3 (rollback witness), E5 (stamp abort, real trigger) and E6 (closure-issued fixture, no explicit ROLLBACK).
      - A concurrent pinned reader is never torn. A pre-commit snapshot keeps its old rows, head and `built_at` (B6). A new snapshot shows rows and head together.
      - All TASK-1515 assertions are unchanged. This is consistency evidence, not durability evidence.
    - **T4 `single_flight_four_readers_default_budget_every_reader_under_2s`.** As in V3:
      - Fixture: real 1500ms with no override; 256 meaningful rows; one commit retitling two rows; four pre-acquire arrivals; the real held path; zero hold; constructor-inclusive clocks and counters.
