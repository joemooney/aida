    ## Status audit: this spec reads `in-progress` with no live session and no PR (2026-09-29, session #10)

    Checked while sizing STORY-1484 as a candidate. Recording so the next session does not re-derive it.

    - Branch `task-1526` exists on **local, origin and gitlab**, all three at `22935f599a` (in sync).
    - **No open or merged PR** — `gh pr list --state all --search 1526` returns only unrelated hits
      (#1526, #2213, #2046; the last is BUG-1526, a different spec).
    - **No worktree** — `git worktree list | grep 1526` is empty.
    - The branch is **one commit** ahead of main: `22935f599a wip: salvage task-1526`.

    That single commit carries **2,313 insertions / 199 deletions across 24 files**, including a new
    `aida-core/src/db/cache_refresh.rs` (+422), a large `cached_git_backend.rs` change (+1070),
    `cache_lock.rs`, `cache.rs`, a new `tests/test_cache_refresh_outputs.py` (+221), and a plan doc
    `docs/plans/2026-09-26-task-1526-bounded-cache-reads.md`.

    **This is a substantial stranded body of work, not a stale status flag.** It is unverified: the
    commit message is `wip: salvage`, it does not follow the `[AI:tool] type(scope): summary (SPEC-ID)`
    format, so it carries no completion trailer, and nothing here establishes that it builds or passes.

    ### Recommended next action — do NOT simply resume it

    Before any implementation session picks up STORY-1484 slice B, someone should spend one session
    answering, in order:

    1. Does `22935f599a` build, and does `cargo test -p aida-core --lib` pass on it?
    2. Has main moved under it in a way that makes the rebase larger than the salvage is worth?
       (It is 1 commit ahead of main but main has advanced; check `git log --oneline origin/task-1526..main | wc -l`.)
    3. Does it implement the **ADVISOR SIGNOFF amendments A2-A6 and A9-A13** that this spec's
       description requires, or is it a different design?

    If (1) or (3) fails, **re-scope rather than salvage**: heft 40 with `execution_mode: guided` is not a
    relay-session item in any case, and inheriting an unverified 2,300-line WIP is worse than starting
    from the signed-off sketch.

    Also noted: STORY-1484 still carries the `needs-sketch` tag, but its description and both slice specs
    say the sketch AND advisor signoff already exist ("implemented exactly per the ADVISOR SIGNOFF on
    STORY-1484"). **The tag is stale** and should be dropped so the story stops reading as design-blocked.
