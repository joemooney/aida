    ## 6. F4 — admission cases, complete counts, preparation truth

    ### 6.1 Admission (under the guard, in this order)

    1. Token identity == `self`.
    2. Token thread == current thread.
    3. `READ_REFRESH_ATTEMPT` is live.
    4. Not read-only.
    5. `conn.is_autocommit()`.

    Checks 1–4 failing → `refused{reason}`, then the **Strict** path, nothing else changed. Check 5 failing → retire `AdmissionNotAutocommit` before prep. The token is consumed by the call and never stored, cloned or rebuilt.

    **The only ordinary creator** is the winner branch of `freshen_for_read`. Deliberately invalid admissions are reached **only** through a narrow cfg(test) seam, `apply_incremental_with_token_for_test`, and every such row is labelled **SEAM**. The ordinary read-only backend returns at `freshen_for_read`'s first read-only check and cannot naturally create a token.

