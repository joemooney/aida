    ### 5.2 Inner versus public outcome

    `freshen_for_read` returns `Option<RefreshState>` or an error; it **never** returns a bool. Tests assert the two layers separately.

    | Inner `apply_incremental` | Public `freshen_for_read` (winner branch) |
    | --- | --- |
    | Ok(true) | `Ok(None)` (fresh) |
    | Ok(false) | Falls through to the **existing** flow. Interactive with budget > 0: Q1 strict `ensure_cache_fresh` (`Strict`). Otherwise: `file_and_spawn_refresh` → `Requested` (SPAWN_LOG), `Deferred`, or a strict fallback for no-detach or suppression. A later strict phase is separate and does not erase the rollback witness. |
    | Err(typed lock) | `Some(WriterBusy)` if still stale, else `None` (B2) |
    | Err(WeakCommitPrepare / Retired / other) | `Err` propagated (not stale success, not WriterBusy) |

    ### 5.3 Observation boundary for decline and rollback tests (T1(b), T3)

    A cfg(test) hook **H-after-restore** inside `apply_incremental` runs after O-restore and before returning, still under the mutex. It takes a **separate pinned snapshot** through a different handle (`Cache::open` + `read_snapshot`) and records the old rows, head and `built_at`. That is the rollback witness. The public phase is asserted afterward and independently. Non-interactive scope with SPAWN_LOG armed: `Requested`, one logged spawn, no real process, and no strict fallback racing the rows (no-detach and suppression unset). Production pre-C and C behavior is not changed to make the fixture simpler.

    ### 5.4 Invocation policy, nesting and per-call phases (finding 4)

    - **Sticky deny.** `CacheReadScope::new()` **inherits** the enclosing scope's `weak_commit` value. `configure_read_policy` may tighten Allow→Deny but can never set Allow when the enclosing value is Deny. Dropping a scope restores the caller's value. `reset_cache_read_observations` resets observations only, never the policy. A read-only getter, `cache_refresh::weak_commit_policy()`, is exposed for wiring tests; it carries no authority.
    - **The single classifier helper.** `lib.rs:3845–3868` is extracted into `configure_invocation_cache_policy(&cli, &raw_args)`. The real dispatcher calls this exact helper. It maps every `Command::Cache(..)` to Deny: `refresh` (plain, `--worker`, `--if-requested`), `rebuild`, `status`, `verify` and any other subcommand.
    - **MCP.** `handle_tools_call` (`mcp.rs:1088`) calls `mcp_call_weak_commit_policy(tool_name)` immediately after its per-call `CacheReadScope::new()` and before dispatch. `cache_status` → Deny; every other tool inherits the server scope (Allow). Each call gets its own scope, so a Deny call does not leak into the next one.

    **Worker and explicit-entry phase table (T2(n)):**

    | Phase | Actions (core test, actual Deny policy from the classifier output) | Required records |
    | --- | --- | --- |
    | P0 | Fixture S0 cached; commit S1 (one real changed object); stale | — |
    | P1 ambient constructor | `CachedGitBackend::with_inner(GitBackend::new(store), cache)` under Deny | `strict_incremental` (phase=P1) = 1 at value 2; `weak_prep_attempt` = 0; head = S1 |
    | P2 | Commit S2 (a **second** real changed-object commit) | stale again |
    | P3 explicit constructor | `CachedGitBackend::open(store, cache)` (`handle_cache_refresh`'s explicit route) | `strict_incremental` (phase=P3) = 1 at value 2; weak 0; head = S2 |
    | P4 | Commit S3 (a third real change) | stale |
    | P5 worker body | `refresh_worker::run_refresh_worker(&explicit_backend)` | `strict_incremental` (phase=P5) = 1 at value 2 (**not AlreadyFresh**); weak 0; head = S3 |
    | P6 nesting | Inside the Deny scope, create a nested default scope and run an eligible-looking stale read | `weak_commit_refused` or Strict at value 2; after the nested scope drops, the policy getter still returns Deny |

    **aida-cli-lib cfg(test) wiring witnesses.** These are local to that crate, call the core getter, and use no new feature or framework:

    - In `handle_cache_refresh`, before the explicit `open`: record `weak_commit_policy()`.
    - At the start of `tool_cache_status`, before its constructor: record the same.
    - Tests run the real classifier and dispatch entry for parsed argv (`cache refresh --worker --store X --cache Y`, `--if-requested`, plain, `rebuild`, `status`, `verify`) → Deny recorded. `list`/`search`/`show` → Allow.
    - MCP: `cache_status`, then `list_requirements`, in two successive `handle_tools_call` calls on a fixture project → Deny is recorded in the first call, and Allow is restored for the second.

    **Stated composition.** aida-core cfg(test) counters cannot be read from a separately built CLI process. So the CLI-level evidence ("the actual entry runs under Deny") and the core-level evidence ("under Deny, constructors and body write strictly and never prepare weak mode") are composed, and that composition is declared openly. C's future early worker route must reuse `configure_invocation_cache_policy`. It is not implemented here.

    ### 5.5 Cleanup-count distinctions (finding 4, last item)

    Sidecar-create failure, non-lock BEGIN error, FAIL_COMMIT (transaction left open → explicit rollback), auto-rollback (7b′, no explicit ROLLBACK issued) and failed rollback (8) are **five distinct rows** in §4.2. Each has its own finish and restore values. No branch reports `rolled_back_explicit` when SQLite had already rolled back.

