    The pinned dependency is rusqlite 0.31.0 with bundled libsqlite3-sys 0.28.0. The bundled C source defaults synchronous and WAL synchronous to 2 absent overrides; cache open sets WAL/busy_timeout=0 but no synchronous override. Build scripts permit compile overrides, so a future implementation test must read actual settings, not infer every executable's runtime PRAGMA from this source alone. E1 directly witnesses the retained executable's sync calls.

    The local SQLite `PragTyp_SYNCHRONOUS` implementation rejects changing the safety level inside a transaction. rusqlite's `Transaction::commit` consumes the transaction; its Drop calls finish/rollback but **discards the returned error**. Thus “transaction dropped” is not sufficient proof that the connection is in autocommit or that a later PRAGMA restore succeeded. The cache mutex uses `.lock().unwrap()`, so an unwind while holding it poisons it; a successful post-panic same-handle strict call is not currently guaranteed.

    SQLite documents that WAL/NORMAL preserves atomicity and consistency but may lose committed transactions on power/OS failure; it does not imply fsync-free execution. WAL header reuse and checkpoints may still synchronize. FULL adds a WAL sync at commit. [SQLite synchronous](https://www.sqlite.org/pragma.html#pragma_synchronous). Auto-checkpoint is a per-connection commit callback; setting zero disables it and replaces a prior WAL hook. Restoring its threshold is not executing a checkpoint. [SQLite auto-checkpoint API](https://www.sqlite.org/c3ref/wal_autocheckpoint.html). A pinned WAL reader has a fixed transaction end mark, consistent with the existing row/provenance requirement. [SQLite WAL concurrency](https://www.sqlite.org/wal.html#concurrency).

    ## 4. R1 — scope fork: L1 is not within the existing signed exclusion

    **Blocking.** The parent expressly excludes changing WAL alongside busy_timeout and the retry delays. No A/Q/B amendment read here narrows that exclusion to the literal journal_mode string or authorizes weaker durability/checkpoint scheduling. L1 changes both, even if journal_mode remains WAL. The source's derived-cache status makes a scoped durability tradeoff plausible; it does not silently amend the signed scope. No code may rely on the sketch author's narrow reading.

    Disposition: require a **separately explicit, independently approved durability/checkpoint fork on the same TASK-1526 and its parent contract**, not another worker feature and not necessarily another requirement. The revised sketch must state what portion of the original exclusion it replaces, the exact connection/operation boundary, the power-loss durability tradeoff, checkpoint/lifetime limits, restoration failure semantics and the tests below. Root can relay that complete proposal; root or its author cannot sign it. This report does not yet approve that fork because R2–R4 remain substantive design gaps. E1 D1 makes the sync direction grounded; it does not resolve those gaps.

    The original “WAL stays bounded exactly as today” assertion is false as a general guarantee. A long-lived handle can execute repeated read-refresh transactions, each disabling automatic checkpoint during its commit. Restoring 1000 afterward does not checkpoint immediately; there may be no later strict commit or final close for a long time. Long readers can also prevent checkpoint completion. No new worker/checkpointer is authorized to paper over this. The next sketch must either omit wal_autocheckpoint=0 and state remaining behavior, or explicitly design and obtain approval for the bounded existing-lifecycle checkpoint consequence. E1 did not observe an in-window database-file checkpoint sync; it does not establish that disabling auto-checkpoint is needed for this fixture.

    Do not promise `commits_without_durable_sync` from a NORMAL observation. E1 contains two in-window WAL fsyncs plus a directory sync; available source makes WAL-header/commit effects plausible, but this trace does not identify every SQLite phase or prove which sync a proposed remedy removes. A remedy has not been run. Preserve atomic rows/stamp and freshness recovery; describe weakened durability honestly rather than calling all protection unchanged.

    ## 5. R2 — operation boundary, nested strict calls and Q1

    **Blocking.** Reusing READ_REFRESH_ATTEMPT alone as the durability selector is insufficient. It is ambient on the thread, spans changed-object preparation, and is also armed around the TTY ensure_cache_fresh call. A nested strict refresh before the outer connection mutex is acquired can inherit it on the same handle or another handle. `guard.is_nested()` only short-circuits nested tolerant freshening; direct strict ensure_cache_fresh does not use that check. The proposed “if prior NORMAL, restore NORMAL” protects value restoration but does not prove that strict work executed FULL.

    Binding correction for the revised proposal: select weaker durability only by explicit internal authorization for the actual tolerant incremental operation on its connection; an unrelated/nested strict call must not inherit it from the retry flag. This is an implementation-local operation distinction, not a new public API, policy environment variable, lease, authority key, or C phase implementation. State how same-handle sequential strict calls, nested strict-before-acquire, distinct-handle same-thread calls and concurrent-thread strict calls behave. Do not recursively lock the same non-reentrant mutex inside its transaction to manufacture a nesting test; that would test a deadlock, not restoration.

    Q1 ruling: the ordinary tolerant incremental attempt is the same category at human TTY and non-TTY; a future expressly approved fork may cover that category in both. It must **not automatically cover apply_incremental called by Q1's strict ensure_cache_fresh fallback**, ordinary no-detach/suppression strict preselection, a worker's strict body, migration/schema repair, or explicit commands. Their strict durability remains unchanged. Current TTY source has a one-attempt retry flag, but ensure_cache_fresh can still perform multiple logical incremental attempts on moving HEAD or fall back to rebuild. A retry flag alone does not certify one whole-operation attempt or make a strict path tolerant. Preserve current TTY one-attempt lock behavior; do not restore the long ladder or introduce C's future phases here.

    V2's approved ordinary strict preselection and post-attempt observe-only interpretation remain intact. Future C integration must deliberately preserve the approved durability boundary, not infer it from a now-overloaded boolean. A worker's ambient constructor is a separate current-source limitation: its end-to-end strict invariant must be tested at actual entry, and cannot be claimed proven merely by observing its later strict body. Do not implement V2 early to satisfy T2.

    ## 6. R3 — restoration is a fallible state transition

    **Blocking.** The proposal names “restore on all exits” but leaves crucial error paths undefined. A best-effort destructor cannot promise exact restoration, propagate errors normally, or make failed rollback disappear.

    The revised design must specify this finite transition table before implementation:

    | State/event | Required behavior |
    | --- | --- |
    | Read either original PRAGMA fails | No weak-mode transaction starts; surface the original error. |
    | First setting succeeds, second setting fails | Restore the setting already changed; attempt every necessary restoration even if one fails; no transaction starts. Preserve both the primary and restoration diagnostic if applicable. |
    | Both settings applied, BEGIN returns real busy/locked | No application closure ran. Restore outside transaction, then permit the existing typed WriterBusy fallback only if connection state is safe. Wrong/missing sidecar cannot select the result. |
    | Reached-head skip, real decline, closure/SQL/stamp error, commit success/error | Complete or roll back the transaction, confirm autocommit, then restore exact prior values while retaining exclusive access to this handle. Do not add a second transaction/write retry. |
    | Rollback/autocommit confirmation or either restore fails | Do not advertise a safely restored reusable handle, treat it as ordinary WriterBusy, or feed it to generic schema/full-rebuild recovery. Specify explicit error precedence and fail-closed connection retirement/unusable state before any later strict work. A successful commit followed by restoration failure cannot be described as a rolled-back transaction. |
    | Unwind | Rollback precedes restore; cleanup does not double-panic or mask the original panic. Define what happens to a poisoned mutex/connection; later strict work must not unknowingly reuse NORMAL. Drop is a backstop, not the sole fallible success path. |
    | Process abort/kill | RAII cannot run; the connection dies. Rely only on the declared SQLite transactional/durability model, never an all-exits restoration claim across process death. |

    Exact prior-value restoration and strict FULL are different assertions. Default fixture values should be 2/1000; a separate nondefault-prior test proves exact restoration. Do not accept a pre-existing unexpected NORMAL as evidence that strict FULL was preserved. A general connection/WAL-hook policy change is not hidden in numeric threshold restoration; verify there is no custom hook on the eligible handle or explicitly exclude that case.

    The design may keep the transaction and mutex boundaries structurally unchanged, but must make restore failure observable and prevent later strict reuse. That choice needs a concrete reviewed design; this report does not supply speculative product code. Arbitrary PRAGMA/I/O errors are not licenses for stale success. B1/B2's compatible snapshot/error classification and schema exceptions remain binding.

    ## 7. L2(a) — accepted accounting, no deadline waiver

    Accept option **(a)** for this correction: the existing pre-race healthy-open ladder is not the post-race loser's prohibited refresh/write ladder. A13 resolves the original acceptance contradiction at the race; B3's lost-race path still never calls with_cache_write or retries SQLite refresh. Constructor work remains part of the whole reader's AC1 clock. A slow constructor can therefore fail AC1 even when every post-race assertion passes. The ladder's configured delay sum is about 25.5 seconds, not a universal bound on open work, filesystem calls or the whole command.

    The decisive original failure has zero retry sleeps, so L2 is not its fix. V2's constructor retries are consistent with open contention; the old aggregate counter does not establish the exact SQL statement. No broad claim that every constructor is safe or fast follows.

    Binding test-accounting amendments:

    1. Preserve the existing `retry_sleep` aggregate semantics for retained tests; add explicit open/write/other categorization rather than silently redefining the old counter. Tag the actual operation/phase, not merely `!holding_write()` (not every nonwrite retry is open). Reconcile aggregate == all categories and retain raw per-reader counts.
    2. Count from before Cache::open through query/provenance. No post-constructor reset, no hidden other bucket, no elapsed subtraction. Empty-map observation before a fresh reader scope is a fixture assertion; do not use destructive counter reads mid-measurement.
    3. Add a with_cache_write **entry** witness. Existing write_attempt is counted deeper inside the retry wrapper; zero attempts cannot prove the wrapper was never called when read-only/sidecar failure returns earlier. Each loser must have zero wrapper entries, write attempts, incremental/full-rebuild attempts and post-race retry sleeps.
    4. New T4 may distinguish genuine pre-race open retries from prohibited write retries, but must retain them in elapsed time and reporting. This is a stated contract interpretation, not “promote V3 unchanged”: V3's auxiliary all-retry-zero assertion is stricter, and the test change must be explicit. No existing assertion is weakened in place.
    5. A read-specific constructor deadline, option (b), remains a separately designed change requiring actual read intent and preservation of strict open behavior. Do not retrofit it from CacheReadScope existence or budget==0, and do not bring it into L1.

    ## 8. T1–T4 and M1–M6: meaningful evidence requirements

    All remedy tests remain **proposed/unrun**. E1 runs the original immutable probe, not these tests. The following corrections are binding on a revised proposal; they are not code authorization.

    | Test/control | Disposition and required non-vacuity |
    | --- | --- |
    | T1 weak-mode/restoration | Retain success and real epic-miss decline. Observe entry after setting but before BEGIN as well as the actual transaction connection after BEGIN. Busy never reaches the latter, so require zero transaction-observer hits and a real one-attempt busy witness. Replace INCREMENTAL_ERROR as restoration evidence: it fires before apply_incremental. Add an in-scope SQL/stamp failure, partial-setting failures, both restore failures, commit/rollback failure handling, and unwind. Assert restored values or explicit unusability, not a silent fallback. Release the real external writer only after useful busy result/state assertions and before the strict follow-up write. |
    | T2 strict durability | A single observer inside apply_incremental does not observe upsert/delete/rebuild/schema repair. Place test-only observations on each actual writing connection and prove each named path reached its operation. Include same-handle follow-up, nested strict-before-acquire, same-thread other handle and concurrent other thread. Distinguish actual worker entry from its strict body and the future V2 gate. Nondefault prior restoration is separate from default FULL strict controls. |
    | T3 atomicity/provenance | Existing TASK-1515 assertions remain. Exercise through the eligible read winner with proof weak-mode transaction observer fired. A direct apply_incremental call with no read policy may just retest FULL. Require actual concurrent snapshots, changed rows, stamp-abort rollback, reached-head skip that never runs the stale closure, and real in-transaction decline. Normal-mode consistency is not power-loss durability proof. |
    | T4 latency | Keep actual 1500ms default/unset override, 256 meaningful rows, one changed commit/two titles, four pre-acquire arrivals, real refresh-held path, zero deliberate hold, constructor-inclusive clocks/counters and pinned head/time. Exactly one real refresh/write, no full rebuild/request in this fixture, every reader <2,000,000us. Accept either correct fresh or correct stale rows, not all-fresh. Include L2 categories and wrapper entries. New independent measurement on actual implementation, first result, no host-load selection. Existing 60s test unchanged. |
    | M1 remove L1 | Must reach the real eligible transaction, then fail expected PRAGMA observation. Renaming the test or a setup failure is not detection. A PRAGMA assertion proves setting, not zero fsyncs. |
    | M2 NORMAL at open | Reach each strict write and fail its actual connection setting assertion. A fixture refusing to build because its own open assertion fails is not adequate T2 evidence. |
    | M3 skip restoration | Separate branch mutants for real in-transaction decline/error, real busy, partial-setting failure and restore-failure handling. Require an armed-settings witness first. Pre-apply INCREMENTAL_ERROR cannot kill an omitted restoration. Include both settings and nondefault original values. |
    | M4 skip_refresh | Retain the existing counter/path mutation: useful rows can return, but real held-path witness must fail. Do not claim historical V2 mutation proves a newly changed T4 automatically. |
    | M5 serialize | Retain four-way readiness failure at NONVACUITY. Exactly-one counter alone must not pass serialized readers. Preserve readiness timeout as a failure, not a reason to retry. |
    | M6 arm L1 for losers | **Insufficient as written.** Changing a flag/PRAGMA on a loser does not make it call apply_incremental/with_cache_write. Add zero L1-entry/PRAGMA-change observations for losers; this mutant must fail those. Separately force loser wrapper entry and require the new wrapper-entry assertion to fail, even if it returns before a write attempt. The current reader_path_never_calls_with_cache_write test only checks write_attempt and cannot establish the stronger entry claim. |

    Retain the full B1–B6/A-series named coverage: stale rows/labels from one snapshot, strict mutation/revalidation, shared budget across opens, same-thread nesting and independent-thread contention, no blocking under write locks, migration/schema refusal, unsupported-flock strict exception, reached-head skip, refill skip, head recapture, epic pre-resolution and output collector reset. BUG-1778 structural hint-write degradation and BUG-1779 RMW/newer-request protection remain unchanged. A real separate SQLite BEGIN IMMEDIATE holder must still be held at the busy response in absent and misleading/Unknown sidecar variants; sidecar contents never witness SQLite contention.

    ## 9. E1: correction, one actual execution, D1 and limits

    The original E1 could not be run literally and produce its promised evidence:

    * `/evidence/../task1526-latency-attribution/strace.txt` resolves outside the only bound evidence directory; the old sandbox has no such output mount.
    * Binding the old evidence directory writable would allow fixture/cwd changes to preserved inputs. A new private root is required.
    * Identifying the winner by a later fsync is circular: a nonsync winner could never be classified. The original filter omitted clone/fork and output writes, so parent-thread/child/result attribution was underspecified.
    * “Last traced syscall before PROBE_READER” is not useful-result completion and can omit untraced work. Summed child lifetimes plus wait times would double-count elapsed intervals.

