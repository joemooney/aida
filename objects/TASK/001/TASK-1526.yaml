    - **R3.** An 11-row transition table: read, set or verify failure; with_cache_write returning early; a real BEGIN busy; reached-head skip; decline; SQL, stamp or commit error; checked explicit rollback and autocommit confirmation; restore and verify failure; unwind; process death.
      - Error precedence, highest first: `CacheHandleRetired` > `WeakCommitPrepare` > primary > Ok.
      - Classification helpers exclude both new types, so a restore failure can never become WriterBusy, a schema rebuild or stale success.
      - Retirement is fail-closed: all 26 mutex sites go through `lock_conn()`, and poisoning maps to retirement.
