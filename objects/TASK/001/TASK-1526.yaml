    ## 3. Independent scope and technical-choice disposition

    ### DX-1 — APPROVED as an explicit limited parent amendment

    Adopt the full requested amendment as follows: replace the signed parent's prohibition on changing WAL durability **only** for the one admitted ordinary read-winner incremental transaction on its own connection. It may run with synchronous=NORMAL; it must restore its exact prior level before reuse or retire the handle under the complete fail-closed design. All strict incremental/write-through/rebuild/migration/schema-repair operations, workers and explicit cache-command operations retain their prior strict durability. No eligibility derives solely from READ_REFRESH_ATTEMPT, environment, sidecar, numeric budget, scope existence or worker token. The explicit actual-operation/connection token remains necessary. The exception is a durability change, not merely an unchanged journal_mode string.

    Unchanged: journal_mode=WAL; busy_timeout=0; DEFAULT_CACHE_RETRY_DELAYS_MS; auto-checkpoint threshold (normally 1000); close-time checkpoint behavior; the signed strict callers and schemas; one incremental/one write attempt; losers' no-writer rule; shared budget; atomic rows/head/time and labels. No new checkpointer, worker, framework, public knob or authority-bearing key. No claim of a stronger WAL bound. This approval does not silently amend C or show.

    The power-loss tradeoff is accepted for the Git-derived projection: eligible committed refresh rows and their stamp can be lost together after OS crash/power loss, until synchronization; recovery re-derives staleness against canonical Git. This is not equivalent to FULL durability. Process death alone does not persist a lowered connection setting into a newly opened connection. SQLite atomicity/consistency assumptions remain; this is no corruption fix or absolute hardware/filesystem guarantee. No fsync-free or <2s claim follows merely from NORMAL.

    **Technical choice approved:** retain automatic and close-time checkpoints. E1 supplies no evidence that auto-checkpoint suspension is needed, and repeated temporary suspension could defer checkpoints indefinitely. A normal automatic checkpoint may still cost time inside the eligible commit. Its cost remains in AC1; no deadline waiver is attached. The history cache's policy is not an authorization source.

    ### R2 — operation boundary approved, evidence completion still required

    The non-Clone/non-Copy private token passed explicitly through try_incremental_update to apply_incremental, checked against handle/thread/retry/autocommit state, is grounded. Strict call sites receive Strict explicitly. Q1's ordinary tolerant attempt may be eligible at TTY or non-TTY; its later strict ensure_cache_fresh fallback may not. Current no-detach/suppression helper strict calls remain Strict; future C strict preselection remains Strict without implementing its phases here. Workers/explicit cache invocations and MCP cache_status are denied before every constructor.

    Allow is merely absence of the invocation-level veto. It does not authorize a strict mutation, gate, lease/claim, rebuild or repair to pass a read-winner token. Constructors shared by commands are tolerant in current source; their existence does not replace the strict revalidation required before a state-deciding operation. Do not claim that this proposal makes every constructor a strict constructor. Retain the full strict mutation/revalidation tests, including work invoked within otherwise stale-allowed commands.

    Binding boundary details: Deny must survive any nested helper scope in that invocation, while scope exit restores the caller and each independent MCP call gets its own classification. A denied worker constructor must not gain Allow through a default nested scope. The private token must not be stored beyond the synchronous call or reconstructed/reused. Address/thread checks are a validity restriction, not persistent ownership authority. Mismatched token tests must show no weak preparation; a Strict fallback still obeys the existing retry scope. Tests for actual strict writers, worker constructor/body and nested cases remain required; findings 2–4 correct their evidence design.

    ### R3 — substantial correction accepted, retirement completion blocked

    Accept explicit checked finish, autocommit confirmation, exact restore/verification, primary diagnostics, and retirement over reusable unsafe state. Accept priority `CacheHandleRetired > WeakCommitPrepare > primary > Ok`, provided tests prove contextual wrappers and schema/lock-looking diagnostic strings cannot change the first two classifications. Accept committed:true after successful COMMIT followed by failed restore. Unwind always retires, best-effort cleanup never double-panics, and abort/kill makes no RAII promise.

    The table needs no second transaction, retry or global reset. COMMIT errors must be evaluated using actual autocommit, with checked rollback when needed; consumed rusqlite transactions cannot supply that proof on their own. Already-automatically-rolled-back SQL errors must not be falsely described as a successful explicit rollback; conservatively retiring on an uncertain rollback outcome is permitted. Non-lock BEGIN failures and pre-closure sidecar errors must also finish through the stated safe cleanup/error precedence, not escape with NORMAL left active. The retirement implementation boundary remains blocking under finding 1.

    ### L2(a) — APPROVED, no timing relief

    Keep aggregate retry_sleep unchanged; add actual Open/Write/Other categories, each sleep in exactly one bucket, and require equality with the aggregate. A genuine pre-race open retry is reportable and permitted by this explicit interpretation; all its time stays inside each reader's <2s clock. It is not a fix for the original zero-retry winner failure. Add write_wrapper_entry at the first line of with_cache_write; a deeper write_attempt is insufficient. No hidden bucket/reset/subtraction. Every loser has zero write-wrapper entry, write attempt, incremental/full rebuild, write/other retry sleep and weak-mode entry. This is an explicit change to the new T4 auxiliary assertion, not a silent change to V3 or retained tests. Constructor deadline option (b) remains out of scope.

    ## 4. Numbered blocking findings — concrete design rework

    ### 1. Retirement is promised handle-wide but only mutex sites are specified

    **Files/symbols:** V2 §§5.3–5.4, T1(g/h), T2(m); cache.rs::read_snapshot :1391, source_head_sha :1476, search :2094, apply_incremental :1769; proposed lock_conn.

    **Fact:** The proposed replacement covers mutex users, but read_snapshot creates a new connection without using the original mutex. Several Result paths can return before locking. The text says every later call fails and a retired reader cannot return stale success, yet that fence is not specified on these paths. It also does not fix the ordering of the retired check relative to a waiting mutex acquisition: a caller can observe false, wait behind the winner, and acquire after that winner retires. Checking only before lock would violate the same-handle concurrent requirement. Mutex poisoning is an additional path, not a substitute for the retirement flag after an ordinary restoration error.

    **Required outcome:** Define a complete data-operation retirement boundary. Set retirement while the connection remains exclusively held; after acquiring that mutex, recheck the flag before exposing the Connection (a precheck may be only an optimization). Poison always returns CacheHandleRetired. Explicitly fence read_snapshot and data-returning early exits on the retired originating handle; no snapshot minting or same-handle recovery may bypass retirement. Immutable path/diagnostic getters may remain available if the blanket “every call” statement is narrowed precisely. A separately explicit new Cache::open/backend may recover with a fresh connection; an already-pinned independent snapshot remains a different handle. Keep primary retirement error propagation out of schema recovery and stale success.

    **Required test:** Hold the winner at a controlled restore-failure boundary, let a same-handle strict caller reach lock acquisition, retire then release; that caller must return CacheHandleRetired without O-write. Also call read_snapshot, a normal data query, and representative pre-lock early-return Result paths on the retired handle; none returns a new usable data handle/result. Exercise poison and an ordinary non-poisoned restore failure separately. New independent open must show default strict settings and correct committed/rolled-back rows. Mutate the post-acquire retirement check and snapshot fence independently; each must fail the intended assertion. Correct the inventory to 20 production plus 6 test lock sites and explicitly list non-lock data entry points.

    **Disposition:** Blocking design incompleteness. This is not permission to invent a broad connection framework; complete the existing proposed per-handle retirement design.

    ### 2. T2's O-tx concurrent writer cannot reach its required observer

    **Files/symbols:** V2 §7.2 T2(k/l/m); cache.rs::apply_incremental/with_cache_write; bundled SQLite WAL write acquisition at sqlite3.c:68169.

    **Fact:** O-tx occurs after winner BEGIN IMMEDIATE. A second handle connected to the same database cannot acquire another SQLite write transaction while that winner remains paused. busy_timeout=0 gives busy; the strict outer ladder may retry, but if the winner waits for that second writer's post-BEGIN O-write before releasing, the schedule stalls/fails before its proposed witness. This is a test deadlock/lock-exhaustion problem even though the two Rust mutexes differ. It does not prove strict FULL. The same-handle thread also cannot be awaited to completion before the winner releases its mutex. “Another handle” must identify whether it means the same cache file or another database.

    **Required outcome:** Specify separate schedules, with no cyclic barrier: (a) same-thread other-handle strict write while winner is armed **before BEGIN**, then let winner proceed; (b) different-thread, same-database connection may read its own synchronous value while winner is in O-tx, and may start a write attempt, but its post-BEGIN write observer is required only after winner release; (c) a genuinely concurrent successful write during O-tx may use an explicitly different database, and is identified as such; (d) same-handle thread signals attempted entry, blocks, then is joined only after verified restore/retirement and mutex release. Do not claim the separate-database control proves same-database concurrent write success. Keep the nested-before-acquire test outside the mutex and account for a second handle refreshing the target before the original winner resumes (reached-head skip is then legitimate).

    **Required test:** Each strict label must actually fire on its own writing connection at 2 after an allowed BEGIN/statement, with distinct cache/connection/thread identities and barrier order recorded. For the held-transaction same-database interval, require zero second-writer post-BEGIN hits while held, an actual pending/failed acquisition witness as appropriate, then a successful strict write after release. No test may wait inside O-tx for an impossible second writer. The retirement variant from finding 1 returns error instead of writing. M2/M7 must fail the real PRAGMA assertion in feasible schedules, not timeout/setup.

    **Disposition:** Blocking evidence-design contradiction; do not implement the current T2(m) literally.

    ### 3. Observer placement and several mutants contradict the failure paths

    **Files/symbols:** V2 §7.1 O-armed/O-tx; §7.2 T1(d/f), T3; §7.3 M1/M3d/M6a; cache.rs::apply_incremental :1788–1793; cached_git_backend.rs::try_incremental_update :950–960.

    **Facts:**

    - O-tx is placed “inside the eligible closure,” but reached-head skip must occur before the application closure. T3 nevertheless requires tx_observed==1 in every case, including that skip. Under the literal placement, correct code cannot satisfy both.
    - O-armed fires only after a verified set to NORMAL. Prepare verification mismatch/partial-set failure exits before that point. M3d nevertheless demands weak_commit_armed==1 before testing omitted partial-set restoration.
    - M1 removes setting NORMAL while preparation still verifies NORMAL. Correct preparation then refuses before BEGIN; that mutant cannot reach the required O-tx value assertion. A setup/prepare error is expressly not the requested detection.
    - M6a says a loser constructs a token and reaches apply_incremental. Existing loser code has no live ReadRefreshAttempt; the proposed admission check therefore downgrades it to Strict. Token construction alone cannot guarantee the stated weak_commit_armed failure, although forced wrapper/write entry can independently be detected.

    **Required outcome:** Place the transaction observer in apply_incremental immediately after successful BEGIN and before refresh_head_reached, separate from an application-closure-entry observer. For reached-head skip require tx_observed=1/value1 and closure_entered=0; real busy has armed=1, tx_observed=0. Add a distinct preparation-attempt/state-change witness for partial-set/verification-error cleanup; do not redefine “verified armed” to make it fit. Explicitly distinguish an error returned before any mutation, a successful set followed by failed/mismatching verification, and failure during restoration.

    Define mutants by actual edits/reachable branches: a removal of the weak-mode preparation block can retain the independent transaction observer and then fail value1; a lone failed setting with verification retained should instead prove the expected prepare refusal. These are different controls. M3d must witness an actual changed setting on the eligible connection before the induced verification failure, then omit restoration and fail the exact-P/retirement assertion. For M6, retain both (i) an invalid loser token/refused-admission control that proves no weak preparation, and (ii) a genuine illicit weak-entry mutant that also establishes the retry precondition, or directly mutates the weak-entry boundary. It must violate loser zero-weak-entry; wrapper-only/read-only M6b independently violates zero wrapper entries. Do not count a refused token as a successful loser-weak-mode mutation.

    **Required test:** Revised T1/T3 and M1/M3d/M6 declare observer counts/outcomes per branch before execution. The observer queries the actual transaction/connection, never a mocked value. Include P=3 restoration separately from default2 strict controls. Failed mutation setup or a failure before the intended observer is not detection. Preserve all old TASK-1515 assertions and old 60s test unchanged.

    **Disposition:** Blocking internally inconsistent test/mutant plan. These are concrete static reachability facts; no additional measurement is needed to repair them.

    ### 4. Whole-entry/body and decline evidence still needs non-vacuous phase boundaries

    **Files/symbols:** V2 T1(b/g), T2(n/o), M8; cached_git_backend.rs::{with_inner,freshen_for_read,try_incremental_update}; refresh_worker.rs::run_refresh_worker; cache_cmd.rs::handle_cache_refresh.

    **Fact:** In T2(n), the actual constructor can refresh the one stale commit strictly under Deny. Immediately calling run_refresh_worker can then be AlreadyFresh with no strict body write. “Every O-write=2” is vacuously true for that body and cannot prove the stated constructor-plus-body writing invariant. M8's core “force Allow” and the CLI classifier test are a declared composition, but without distinct reach witnesses they can test unrelated paths. Similarly, freshen_for_read does not return Ok(false); a real apply_incremental decline flows into Q1/file_and_spawn_refresh. Depending on scope/no-detach/spawn controls, later strict refresh can change rows or a worker can be launched before T1 inspects the rollback. The design currently mixes the inner transaction result with the public reader result.

    **Required outcome:** Keep the composition honest but make each phase mandatory. On a stale fixture under the actual Deny configuration, witness the constructor's Strict incremental transaction and zero weak entry. After constructor completion, advance HEAD by a second real changed-object commit, then invoke the actual strict worker body so its own strict transaction observer must fire; identify both phases in the records. Cover ambient and explicit constructor routes, plain/worker/if-requested/rebuild/status/verify classification and actual per-call MCP cache_status placement. Classification tests must target the same helper wired into the real dispatcher; nesting/reset tests prove policy survives and restores as intended. Do not implement C's future early route as a shortcut.

    For decline/rollback tests, state the observation boundary explicitly: observe the eligible apply_incremental outcome and a separate pinned snapshot after rollback/restore but before any permitted caller fallback, or configure the caller's existing test seams to prevent further work while preserving its real flow. Record inner Ok(false) separately from public RefreshState/error; never assert that freshen_for_read itself returns bool. A strict recovery performed later is a separate phase and cannot erase the rollback witness. Use existing private fake spawn/refusal controls for these non-worker tests; no live worker may race the row assertions. Do not change production pre-C/C behavior merely to simplify the fixture.

    **Required test:** Distinct nonzero constructor and worker-body strict O-write counts, both2, weak counts0 under Deny. M8 maps the real classifier to Allow, fails its classification assertion, and the corresponding core constructor control reaches real weak preparation; no fake counter assignment. T1(b) real epic-miss decline proves application closure entered, changes rolled back, exact prior restored and old snapshot coherent at its declared boundary; later result semantics are independently asserted. Sidecar-create failure after arming and non-lock BEGIN failure also need explicit cleanup/observer counts; FAIL_COMMIT (an injected error leaving an open transaction) proves that branch only, while auto-rollback/autocommit and failed-rollback cases must be distinguished.

    **Disposition:** Blocking evidence completeness. The current body-already-fresh sequence and conflated inner/public outcomes cannot certify the promised invariant.

