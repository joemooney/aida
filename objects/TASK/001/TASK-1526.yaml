      - Losers: zero weak counters (checked **first**), then zero wrapper, write, incremental/rebuild and write/other retry counts. Open retries are reported and counted inside the clock.
      - Every reader **<2,000,000µs**. Correct stale or fresh rows; not all-fresh.
      - **First result only**, run by a new independent session on the actual implemented remedy. The original 60s test is byte-unchanged.

    **Retained unchanged.** All nine B-decision tests by exact name, every original named control listed in V3 review §5, and the BUG-1778 and BUG-1779 controls. None was run here.

