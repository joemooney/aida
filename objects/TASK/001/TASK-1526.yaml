    **Contradictions.** I found no contradictory observer within a row.

    **Seams.** The seams are honest. Each one either injects an `Err` at a call boundary or substitutes a different real SQL action (E14, E20). **No seam returns an invented PRAGMA value.**

    **Rollback kinds.** V4 correctly keeps engine rollback and closure-issued ROLLBACK separate. Only the closure-issued fixture is evidenced, the branch is keyed on the real `is_autocommit()`, and no row is labelled "engine rollback".

