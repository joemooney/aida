    - **R2.** Eligibility is an explicit `IncrementalDurability::ReadWinner(token)` argument. It is constructed only at the ordinary winner site, `freshen_for_read` `:546–547`, and is bound to that handle and thread. It also requires a deny-only `WeakCommitPolicy` derived from actual command classification: every `Command::Cache(..)` subcommand, including `--worker`/`--if-requested`, and the MCP `cache_status` tool map to `Deny`.
