    | 8 | Rollback fails, or autocommit not confirmed | Retire (swap and drop the connection, which rolls back and releases the write lock) | Err(Retired{committed:false, rolled_back:Unknown}) | retired |
    | 9a/9b | Restore fails or mismatches after finish | Retire | Err(Retired{committed, rolled_back}) | retired |
