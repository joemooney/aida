    | **O-admit** | `apply_incremental` with `ReadWinner`, after the mutex is acquired, after the admission check (§4.3) | `admitted` or `refused{reason}` (`weak_commit_refused`) |
    | **O-prep** | Immediately after admission, before reading P | `weak_prep_attempt` +1 |
    | **O-change** | Immediately after executing the set statement (whatever it returned), reading back `PRAGMA synchronous` | `weak_setting_changed` +1 iff the value read ≠ P; records the value |
    | **O-armed** | After verification has confirmed the value == NORMAL | `weak_commit_armed` +1 (now meaning "verified armed" only) |
    | **O-tx** | In `apply_incremental`, **immediately after a successful `BEGIN IMMEDIATE`, before `refresh_head_reached`**, reading `PRAGMA synchronous` on that connection | `weak_tx_observed` +1, value. Strict calls record `strict_tx_observed` and value. |
    | **O-closure** | First statement of the application closure | `apply_closure_entered` +1 |
    | **O-finish** | After the finish step | `finish ∈ {committed, rolled_back_explicit, rolled_back_auto, rollback_failed, not_started}` |
    | **O-restore** | After the restore attempt | `restore ∈ {restored(P), restore_failed, verify_mismatch, not_needed}` |
    | **O-retire** | When `retired` is set | `retired` +1, cause |
    | **O-outcome** | The value `apply_incremental` returns | `inner ∈ {Ok(true), Ok(false), Err(kind)}` |
    | **O-write(label)** | Inside each strict write closure, after BEGIN or the first statement, on its connection | `(label, value)` |

