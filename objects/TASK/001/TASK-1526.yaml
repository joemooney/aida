    | `strict_incremental` | `apply_incremental` with `Strict`, immediately after a successful `Transaction::new_unchecked(Immediate)` (the same point as O-tx) |
    | `upsert` | `Cache::upsert_requirement` closure, after `upsert_requirement_on` returns `Ok` |
    | `delete` | `Cache::delete_requirement` closure, after `delete_requirement_on` returns `Ok` |
    | `set_meta` | `Cache::set_meta` closure, after `set_meta_on` returns `Ok` |
