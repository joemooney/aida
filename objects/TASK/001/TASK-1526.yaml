    ## 1. Binding limited approvals, first failure and E1 (unchanged)

    These are binding design amendments **only**. They are not a whole-design approval, a performance pass or a code release.

    - **DX-1.** One admitted ordinary read-winner incremental transaction may run at `synchronous=NORMAL` on its own connection. Afterward it restores the exact prior level, or the handle retires. Automatic and close-time checkpoints stay unchanged. The power-loss tradeoff is accepted for the Git-derived projection: committed refresh rows and their stamp may be lost together after an OS crash or power loss, and staleness recovery re-derives them. This is not equivalent to FULL. It makes no fsync-free claim, no <2s claim and no corruption claim.
    - **R2.** A private non-Clone/non-Copy `ReadWinnerTxn` is passed as `IncrementalDurability::ReadWinner`. Every other call site passes `Strict`. A deny-only `WeakCommitPolicy` applies before every constructor. `Allow` grants nothing.
    - **R3 parts.** These parts are accepted:
      - checked finish;
      - autocommit confirmation;
      - exact restore with verification;
      - error precedence `CacheHandleRetired > WeakCommitPrepare > primary > Ok`;
      - `committed:true` after a commit that succeeds and is then followed by a failed restore;
      - unwind always retires;
      - no RAII promise on abort.
    - **L2(a).** The aggregate `retry_sleep` is unchanged. The `Open`, `Write` and `Other` categories must sum to it exactly. `write_wrapper_entry` sits at the first line of `with_cache_write`. Each reader's clock includes its constructor. Option (b) is out of scope.

    The controlling first failure is unchanged: winner reader 3 at **2.648286s**, FAIL, with `incremental:1`, `write_attempt:1` and zero retries. The losers took 1.528038–1.528182s and returned useful old rows. E1 ran once and is diagnostic only: D1, S=1.571231s of W=1.943812s (80.832%). Its winner time of 1.955642s is **not** AC1 credit. No rerun, no second E1 and no new attribution is requested.

