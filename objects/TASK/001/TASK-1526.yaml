    ## 0. Binding limited approvals carried forward (review 2 §3)

    These are binding design amendments **only**. They are not a whole-design approval, a performance pass or a code release:

    - **DX-1.** One admitted ordinary read-winner incremental transaction may run at `synchronous=NORMAL` on its own connection. It restores its exact prior level, or the handle retires. Auto-checkpoint and close-time checkpoint stay unchanged. The power-loss tradeoff is accepted for the Git-derived projection. No fsync-free claim, no <2s claim, and no corruption fix. Text: V2 §3, unchanged.
    - **R2 boundary.** A private non-Clone/non-Copy `ReadWinnerTxn` passed explicitly as `IncrementalDurability`. Every other call site passes `Strict`. A deny-only `WeakCommitPolicy` applies before every constructor for `Command::Cache(..)` and each MCP `cache_status` call. `Allow` is only the absence of that veto. It grants nothing and does not make constructors strict.
