    ## Merge disposition — HOLD for one focused session, then merge either way

    The re-run of the failed job on `54c6f1248d` **passed**, so CI run `36626825833` is now green
    overall and the failure is intermittent, not deterministic.

    Green-on-re-run is not the same as green, and here the intermittent test covers `RefreshLock`
    — a **new production primitive this PR introduces**, not inherited trunk code. Merging now
    would move a known-intermittent lock primitive onto `main`, where every later PR inherits it
    and the signal gets much harder to attribute. So I am not merging on a re-run.

    This is a time-boxed hold, not an open-ended block. **One focused session**, using the method
    that cracked the migration flake: inject the contention deliberately — hold a second open
    file description's flock on the sidecar across the final `try_acquire` — and see whether the
    panic reproduces byte-identically at `cache_refresh.rs:427:9`.

    - **If it reproduces:** there is a real defect in the descriptor lifecycle. Fix it, and merge.
    - **If one honest session of injection cannot reproduce it:** the evidence then points at
      runner test-timing rather than a live defect. File it as a tracked bug against the merged
      code and **merge** — an approved 2,500-line PR should not sit indefinitely on a test that
      resists reproduction.

    Do not spend that session hunting for ambient load: 120 consecutive local runs of the whole
    `cache_refresh::` module at `--test-threads=8` were clean.

    Everything else on this PR is settled: independent review APPROVED across two rounds with no
    remaining blockers, and the carrier blocker is fixed and empirically proven load-bearing.
