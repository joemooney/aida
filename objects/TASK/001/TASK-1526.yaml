    Complete-blob hashing is source identity, not a claim to audit every unrelated line. The separate receipt records full Git blob IDs, c677 and workfile comparisons and dependency hashes.

    Pinned rusqlite 0.31.0 `transaction.rs:186–247` consumes Transaction on commit/rollback and ignores finish errors in Drop. DropBehavior::Ignore and explicit checked completion on the still-owned Connection are supported. **Connection::Drop only flushes its prepared-statement cache; InnerConnection::Drop calls close and discards its Result.** `Connection::close(self)` at lib.rs:792 returns either success or `(Connection, Error)` on failure. `Connection::open_in_memory()` at :456 returns Result; replacement allocation is fallible. Those are distinct facts from transactional Drop and are central to finding 1.

    Bundled libsqlite3-sys 0.28.0 `sqlite3.c:138787` confirms connection-local synchronous state and rejection inside a transaction. `:68169` permits only one WAL writer. `:179318–179431` implements close: unfinalized statements/backups can return BUSY without destroying the connection. Successful destruction rolls back an open transaction; merely asking Drop to close is not the same observation. Current official [SQLite close documentation](https://www.sqlite.org/c3ref/close.html) corroborates that API distinction. I am not claiming such a leaked resource is present in today's Cache implementation or that a real close failure was measured.

    The [SQLite synchronous documentation](https://www.sqlite.org/pragma.html#pragma_synchronous) and [WAL concurrency documentation](https://www.sqlite.org/wal.html#concurrency), read as primary references, support the retained NORMAL power-loss tradeoff and one-writer/pinned-reader model. They do not certify latency or unconditional shutdown success. Local bundled source is the version-specific basis. Automatic and close checkpoints remain unchanged, including any costs they impose.

    ## 3. Numbered blocking findings

    ### 1. Swap-and-drop retirement lacks a complete fallible close/ownership outcome

    **Files/symbols:** V3 §§2.2–2.3, §4.2 PANIC/rollback-failed rows, §5.1 rows 8–10, T1-R(r3/r4), §8; proposed cache.rs::lock_conn/WeakCommitScope retirement; rusqlite lib.rs::{open_in_memory,close,Drop}, inner_connection.rs::{close,Drop}.

    **Fact:** V3 newly requires an in-memory placeholder, but opening it is a fallible operation. No branch specifies what happens if it cannot be created during an ordinary error or unwind. The proposal then drops the real file connection and repeatedly asserts that this rolls back/releases the write lock now and leaves no NORMAL file connection. Its final limit simultaneously acknowledges ignored close errors. Actual rusqlite Drop does not provide the Result that would justify those unconditional outcomes. Its explicit close API does.

    A normal successful-close T1-R(r4) probe establishes that fixture's observable release; it cannot fill the missing production error branch. This is precisely the same distinction already accepted for explicit transaction rollback versus ignored transaction Drop. The correct retirement fence can prevent API reuse even when physical close is unconfirmed, but it must not then claim physical rollback/release. Rust resource scope usually makes close succeed here; the design must state and preserve that resource-order invariant rather than turn it into an unqualified all-failures guarantee. Poison handling must not repeatedly allocate/swap placeholders or erase the original retirement cause merely because every later lock acquisition returns PoisonError.

    **Required outcome:** Use a bounded per-handle ownership representation with an explicit absent/retired state, avoiding mandatory replacement allocation on the error/unwind path (for example an internal optional connection slot; this is not a framework). If another representation is chosen, fully specify its allocation-failure behavior first. Retire while holding exclusive access before any connection can be exposed. Ensure transactions, statements and borrowed handles leave scope before attempted close. On ordinary fallible exits, observe explicit close success/error and preserve primary, rollback, restore and close diagnostics and committed state. Specify the owned returned connection's fate after close error; never silently restore it to live service, lose its cleanup ownership, report close success, or promise immediate lock release. A non-reusable quarantined connection with honestly unconfirmed release is acceptable; it must stay inaccessible through all Cache APIs and must not create a cleanup service, loop, or new authority. Unwind remains non-panicking best effort plus retirement, with no unsupported rollback/close-success claim. No raw sqlite3_close_v2 workaround is implicitly approved.

    This is an independently grounded design choice: **physical close failure may be reported as unconfirmed while logical retirement remains mandatory**. It is not permission to return stale success or weaken exact restoration before reuse. Preserve `CacheHandleRetired > WeakCommitPrepare > primary > Ok`; add close diagnostics inside the highest-priority error, not a new recovery classification. Successful commit followed by retirement remains committed:true.

    **Required future tests:** Retain actual separate-connection write acquisition after successful retirement close and exact committed/old snapshot checks. Add narrow failure injection at the actual close call and, if replacement allocation remains, its actual constructor boundary; distinguish injected refusal from a measured SQLite failure. Verify same-handle queries/mutations/snapshot minting still return Retired, no schema recovery/WriterBusy occurs, the returned connection remains owned but unavailable, close diagnostics survive context wrapping, and cleanup does not double-panic. Exercise ordinary restore-failure retirement and unwind/poison separately; assert first-retirement cause/count is not replaced by subsequent poisoned callers. All are proposed, not executed now.

    ### 2. M9's required successful write is inconsistent with the replacement connection and its barrier is underspecified

    **Files/symbols:** V3 §3 S-d, §4.4 M9, §6 T1-R(r1); cache.rs::upsert_requirement :1823, upsert_requirement_on :2944, delete_one_uncommitted :3086; proposed F-lock.

    **Fact:** The M9 row says deleting only the post-acquire check makes the waiting caller write. Under the specified swap, it instead acquires an empty in-memory Connection. The actual upsert reads `requirements_cache` (some read failures are swallowed), then the first DELETE requires `requirements_cache`; an empty placeholder has none of `requirements_cache`, `requirements_fts`, `hierarchy_edges`, `cache_meta`. It cannot reach a successful real-cache upsert/O-write-after-write as promised. A missing-table error is not that intended witness and could engage schema recovery if exercised through a backend wrapper. No schema should be manufactured in a retired placeholder to make the mutant pass setup.

