    - **L2(a).** The aggregate `retry_sleep` is preserved. Retries are categorized by actual operation (`Open`/`Write`/`Other`) and must reconcile with the aggregate. A `write_wrapper_entry` counter is added at the first line of `with_cache_write`. Constructor time stays inside AC1.
    - **Tests.**
      - New observers: O-armed, O-tx on the transaction's connection, and O-write per actual strict writing connection. Fault points sit inside the eligible path; pre-apply `INCREMENTAL_ERROR` is not used as restoration evidence.
      - T1: success, real decline, SQL/stamp/commit faults, reached-head skip, a real separate BEGIN IMMEDIATE busy holder (absent, misleading and Unknown sidecar; tx-observer 0), prepare faults, retirement, unwind, and a nondefault prior of 3.
      - T2: per-path strict labels (including the Q1 fallback via a HEAD move, no-detach, the worker constructor and body under `Deny`, a cli-lib classification unit test) and the four concurrency cases.
      - T3: atomicity through the eligible path.
      - T4: AC1 with the explicitly changed retry accounting. It is first-result only, run by a new independent session on the implemented remedy.
      - Mutants M1–M5 revised; M6 replaced with M6a/M6b plus `write_wrapper_entry`; new M7 (retry flag used as authority) and M8 (classification fails open).
      - The original 60s test and all signed positives are unchanged.
    - **E1.** Recorded as diagnostic only: D1, S=1.571231s, W=1.943812s, 80.832%; the diagnostic winner was 1.955642s and is **not** credit. No rerun. **The first failure at 2.648286s remains controlling.**

