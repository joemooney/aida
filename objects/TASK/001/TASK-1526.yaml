    | 4 | Armed; `with_cache_write` pre-closure error (read-only, sidecar) | Confirm autocommit, restore, verify | The primary error, or row 9c | live / retired |
    | 5 | Armed; BEGIN busy or locked | Confirm autocommit, restore, verify | The typed lock error (→ WriterBusy), or row 9c (→ Retired, **not** WriterBusy) | live / retired |
    | 5n | Armed; BEGIN non-lock error | As 5 | Err(begin), or 9c | live / retired |
    | 6 | After BEGIN: O-tx; reached-head true | Explicit `ROLLBACK` (checked), confirm autocommit, restore | Ok(true), or 8 / 9 | live / retired |
