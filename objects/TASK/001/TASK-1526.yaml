    # TASK-1526 latency rework sketch — the read-path winner commits with a durable sync

    **DESIGN ONLY. Not approved, implemented or measured.** Every test below is a proposal and has not been run. No pass is claimed. A NEW independent advisor, different from this author, the root, the evidence author and the eventual implementer, must dispose this artifact before anything is queued.

    Author: an independent sketch-author session (advisor role, separate native session). Prepared 2026-10-08 (America/Phoenix). This author wrote no product code, made no canonical writes, sent no mail, and changed no queue, grant, hold, lease, branch, PR or install. The only files written are this sketch, its READY note, and copies of the three fresh canonical reads under `task1526-latency-sketch-inputs/`.

    ## 0. Summary

    The measured AC1 failure comes from the **winner**, not the losers. The three losers return honestly stale in 1.528s, inside their budget. The winner is the only reader that performs an inline incremental refresh, and it returned in 2.648s with no deliberate hold. Across all three completed first-run cases, the winner spent between about 1.8s and 2.6s of its own time after the barrier released it, beyond any deliberate hold (§2.2). So the overrun is systematic, not one outlier.

    From the source, one operation sits only on the winner's path and can plausibly cost seconds on this host: the SQLite `COMMIT` of the incremental transaction. The cache never sets `PRAGMA synchronous`, so it runs at SQLite's default of FULL. In WAL mode, FULL fsyncs the WAL file on every commit. The host was a loaded six-CPU machine with an ext4 root on `/dev/sda2`, 93% full. Its `host.json` snapshot, taken about eleven minutes before V3, showed **5.9 GB of dirty page cache**. Losers make no durable write. The in-repo precedent is `history_cache.rs:1089/1111`, which already runs its derived WAL index with `synchronous=NORMAL` and `wal_autocheckpoint=0`, for this reason.

    **Proposed correction (L1).** Run only the read-path winner's single fast-fail incremental transaction with `synchronous=NORMAL` and the WAL auto-checkpoint suspended. Restore both values on every exit. Every strict writer, rebuild, migration, schema repair, detached worker and explicit cache command keeps FULL durability. This preserves the real incremental refresh, the single write attempt, the same-transaction stamp, honest stale labels and every strict contract. The read budget is unchanged.

    **This attribution is source- and environment-grounded, but not instrumented.** The measured run did not record per-phase timestamps or syscalls. So L1 is proposed **conditional on one bounded, read-only attribution experiment (E1, §6)**, which uses the immutable V3 executable byte-for-byte under `strace`, with a decision rule fixed in advance. If E1 attributes the time elsewhere, L1 is withdrawn and this sketch states what the next step is. In no case does E1 supply acceptance credit.

    ## 1. Inputs, authority and pins

    ### 1.1 What was read

    - **Fresh canonical reads.** `aida show TASK-1526 --json`, `STORY-1484 --json` and `TASK-1527 --json` were read via the installed CLI, not the raw-YAML fallback, at 2026-10-08 ~12:10 MST. Copies are retained in `task1526-latency-sketch-inputs/`.
      - TASK-1526 is now **Approved**: history shows Completed→Approved by joe at `2026-10-08T19:07:38Z`, and `reopened_at_sha` is `bf65220959`. It has **19 comments**. The newest, `01a11ce9-9663-74f3-bfb5-8ecf7b1b10ca`, is the full canonical relay of the 20194-byte evidence report.
      - STORY-1484 is Approved, with closure pending and **11 comments**.
      - TASK-1527 is **Approved**, reopened at `2026-10-08T19:07:45Z`. It has **2 comments**: the 10-02 post-merge review, and the relay `01a11ce9-9cbd-76e2-9bb2-5823b66ee92e` of the V2 gate. Its only relation is **blocked-by TASK-1526**, which is unsatisfied.
      - Every description and comment was read in full. The retained `input-hashes.json` fallback was not needed.
    - **Binding contract, in this precedence:**
      - STORY-1484 AC1: four concurrent readers on a one-commit-stale cache, exactly one refresh, every reader <2s.
      - STORY-1484 sketch `01a0df08-c181-7530-b249-2740141c2a0b` and signoff `01a0df0d-f964-78f3-a715-046e37e50915`, amendments A1–A13 and answers Q1–Q6. A13 scopes "no `with_cache_write`/ladder" to **losers**; the winner's one fast-fail incremental attempt is allowed. Its Out of scope list says "Changing busy_timeout, DEFAULT_CACHE_RETRY_DELAYS_MS, or WAL."
      - TASK-1526 decision `01a0e0fb-8d6b-7790-b04b-f808236dbe2d` (B1–B6 and the named tests), adopted by product in `01a0e0fd-bc48-7600-bc20-b0a8f781d0f7`. B3 keeps the **1500ms default** and the shared bounded wait. B5 keeps `busy_timeout=0` and the ladder. B6 requires rows and labels to come from one committed snapshot.
      - BUG-1674 companion `01a0e0f6-c7b4-7c61-a5f5-8f1b6975a105`. It stays separate; nothing here claims show's whole-command deadline.
      - TASK-1565: root approved **KeepCurrentBudget**, which is not a numeric waiver.
    - **Evidence.** The full 20194-byte `TASK1526_DEFAULT_BUDGET_INDEPENDENT_EVIDENCE.md` (REQUESTCHANGES), `probe-v3.rs`, the first-run logs for `v3-zero-first`, `v2-short-first` and `v2-expired-first` (stdout, stderr and receipt), `host.json` and `results-summary.json` keys.
    - **TASK-1527 V2.** I read V2 READY in full; the V2 independent review's header, authority, source table and R1–R4 rulings; and the V2 sketch's section headings plus the §4 R1 phase table. I did **not** re-read the whole 63551-byte V2 body. The sequencing claims in §8 are limited to what those parts state.
    - **Discipline.** AGENTS.md (headings, Cache read behavior and Sketch-First Protocol), `two-seat-protocol.md`, `rework-brief-craft.md`, `seat-recovery-playbooks.md`, and `TASK1565_DECISION_ACCEPTANCE.md`.

