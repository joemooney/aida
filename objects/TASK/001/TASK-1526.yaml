    ## 3. F1 — retirement through an owned, bounded connection slot

    ### 3.1 Representation (internal to `cache.rs`, no framework)

    ```text
    Cache {
        conn: Mutex<ConnSlot>,          // was Mutex<Connection>
        retired: AtomicBool,            // pre-lock fence only (F-entry, F-snap, has_usable_snapshot)
        retire_cause: AtomicU8,         // copy of the first cause, for pre-lock errors
        …unchanged fields…
    }
    enum ConnSlot { Live(Connection), Retired(RetiredSlot) }
    struct RetiredSlot {
        cause: RetireCause,             // Copy
        close: CloseOutcome,            // Copy: NotAttempted | Closed | CloseFailed { code: i32, injected: bool }
        quarantined: Option<Connection>,
    }
    ```

    - `RetireCause` is one of: `RestoreFailed`, `RestoreVerifyMismatch`, `RollbackFailed`, `AutocommitUnconfirmed`, `AdmissionNotAutocommit`, `PrepareRestoreFailed`, `Unwind` or `Poisoned`, plus `TestInjected` under cfg(test).
    - The `Live → Retired` transition is an in-place `std::mem::replace` of the slot. It needs **no replacement connection**, no `open_in_memory` and no fallible SQLite allocation. The slot's size is fixed by the enum. `Option<Connection>` is the bounded optional slot.
    - Snapshot handles built by `read_snapshot` wrap their own connection as `ConnSlot::Live` and follow the same rules on their own handle.

    ### 3.2 The single post-acquire gate: `lock_conn`

    `lock_conn(&self) -> Result<LiveConn<'_>>`, where `LiveConn` wraps the `MutexGuard<'_, ConnSlot>` and dereferences to `Connection`. In order:

    1. **Precheck (an optimization only).** If `retired` is set, return `CacheHandleRetired{cause: retire_cause}` without locking.
    2. **H-prelock (cfg(test), one-shot).** Runs only after step 1 observed live. It records `precheck_live=true` with the cache and thread IDs, then signals. It sits **immediately before** `self.conn.lock()`.
    3. **`lock()`.** On `Err(PoisonError)`, take `into_inner()` and continue to step 4 with `poisoned=true`.
    4. **The gate.** Match on the slot discriminant:
       - `Live` and not poisoned: build `LiveConn` (O-expose records `Live`).
       - `Live` and poisoned: retire in place with cause `Poisoned` (§3.3), then return Retired.
       - `Retired`: return `CacheHandleRetired{cause: slot.cause, close: slot.close, first_report:false}`. Nothing is re-retired, the count does not change and the slot is never replaced.
    5. `LiveConn` is built **only** in the first arm of step 4. Its `Deref` matches `Live` and treats any other state as an internal invariant violation. That is unreachable while the gate exists, because only `retire(self: LiveConn, …)`, which consumes the guard, can change the slot while a `LiveConn` lives.

    **There is exactly one post-acquire check: the slot discriminant.** The `retired` AtomicBool is **not** re-read after acquisition. Code review must reject a second post-acquire check, because it would make M9 (§4) equivalent.

    `recheck_migration` uses a non-erroring variant:

    - `Live`: query as today.
    - `Retired`: return `migration_pending()` without querying.
    - `Live` and poisoned: retire with cause `Poisoned`, then return the flag.

    All 20 production lock sites (V3 §2.1 inventory, unchanged) call `lock_conn`. The 6 test sites use `lock_conn` or a cfg(test) accessor built on it.

    ### 3.3 The retirement procedure and resource order

    `retire(slot: &mut ConnSlot, cause) -> RetireReport` is called only while the guard is held exclusively. It runs in this order:

    1. **Resource-order precondition, enforced by the borrow checker.** `retire` needs `&mut ConnSlot`, which is unavailable while any `Transaction<'_>`, `CacheTx<'_>`, `Statement<'_>` or `&Connection` derived from the slot is alive. So by this point the eligible path has finished its transaction (checked commit or rollback), or dropped it with `DropBehavior::Ignore`. `Connection::close` then flushes rusqlite's statement cache itself.
    2. **Logical retirement, which always happens.**
       - `let old = mem::replace(slot, Retired(RetiredSlot{cause, close: NotAttempted, quarantined: None}))`.
       - Then `retire_cause.store(cause)` and `retired.store(true, SeqCst)`.
       - cfg(test) O-retire increments by one with the cause.
       - If the slot was already `Retired`, nothing happens: the existing cause is returned and the count does not change.
    3. **Explicit ordinary close, with its result observed.** `match old { Live(c) => c.close(), … }`. There is exactly one close call site.
       - `Ok(())` → `close = Closed`. SQLite destroyed the connection. By `sqlite3.c:179465`, any transaction still open was rolled back, and this connection's locks are released.
       - `Err((c, e))` → `close = CloseFailed{code: e's extended code, injected}` and `quarantined = Some(c)`. The connection is still open. Whether its transaction and write lock were released is **unconfirmed**.
    4. The report carries `cause`, `close` and the close error text to the caller. The first caller's error carries the full diagnostics: primary, rollback, restore and close. Later callers receive the Copy cause and close outcome only (§3.5).

    **Quarantine.** A quarantined connection stays inside the `Retired` slot. It is unreachable through every `Cache` API: `lock_conn` never builds a `LiveConn` from `Retired`, and no accessor returns it. It is never restored to service and nothing loops over it. There is no cleanup thread, service or timer, and no raw `sqlite3_close_v2`. It is dropped only when the `Cache` handle drops. At that point rusqlite's `InnerConnection::Drop` makes one more close attempt and discards the result, which is rusqlite's own behavior and not a design promise. If that attempt also fails, the SQLite handle stays open until the process exits. Meanwhile, other connections may see `SQLITE_BUSY` and take today's honest strict-ladder or WriterBusy paths.

    **Why close is expected to succeed, with no guarantee claimed.** `sqlite3_close` refuses (BUSY) only while unfinalized statements, backups or blobs exist. Cache code creates statements only through borrows of the connection, which step 1 forces to have ended, and the statement cache is flushed inside `close`. Cache code creates no backups or blobs. A failure therefore needs an outside cause, such as a leaked statement or an I/O-level close error. That branch is defensive. It is tested by an **injected** refusal and labelled as such. No measured SQLite close failure is claimed.

    **rusqlite-internal panics, declared rather than assumed away.** `InnerConnection::close` calls `.unwrap()` on its internal interrupt lock and asserts that the lock is non-null. Only rusqlite's interrupt-handle machinery uses that lock, and no aida code calls `get_interrupt_handle`. The design relies on rusqlite's invariant here. It does not claim close can never panic.

    ### 3.4 Ordinary, unwind and poison paths

    | Path | When retirement runs | Close | Physical release | Returned |
    | --- | --- | --- | --- | --- |
    | Ordinary: rows 8, 9a, 9b, 9c and A5 (§8.1, §6.2) | In the eligible `apply_incremental`, after checked finish or a refused admission, before the guard drops | Explicit `close()`, result observed | `Closed`: **confirmed**. `CloseFailed`: **unconfirmed**, connection quarantined | `Err(CacheHandleRetired{…, close, physical_release})` with all diagnostics |
    | Unwind (row 10) | `WeakCommitScope::drop` while panicking. The scope **owns** the `MutexGuard` (§3.7), so its `Drop` runs after the transaction (`Ignore`) has dropped and before the guard drops. | One best-effort `close()` | Recorded in the slot and in O-retire only; nothing is claimed to the caller | The panic propagates. No unwrap or double panic in our code. The guard drop poisons the mutex. |
    | Poison found by a later caller (a panic elsewhere while the mutex was held) | The first `lock_conn` that sees `PoisonError` with a `Live` slot | Explicit `close()` | As in the ordinary row | `Err(Retired{cause: Poisoned, first_report:true})` |
    | Every later call on a poisoned or retired handle | — | — | — | `Err(Retired{cause: <first cause>, first_report:false})`; count unchanged; no swap |

    The poison flag is never cleared (`clear_poison` is not used). Retirement already makes the handle unusable, so later `PoisonError`s only lead to the existing `Retired` arm.

    ### 3.5 Errors, precedence and classification

    `CacheHandleRetired` has these fields:

    - `cause` and `first_report`;
    - `committed: bool`;
    - `rolled_back` ∈ {`Yes`, `No`, `Unknown`, `NotStarted`, `ByClose`};
    - `close: CloseOutcome` and `physical_release` ∈ {`Confirmed`, `Unconfirmed`, `NotApplicable`};
    - `primary`, `rollback`, `restore` and `close_error`, each an `Option<String>`.

    `rolled_back = ByClose` is reported **only** when all three hold: the checked rollback failed or was unconfirmed, `COMMIT` was never executed, and `close == Closed`. When close failed it stays `Unknown`.

    `source()` is `None`; inner diagnostics are rendered into the message. The precedence `CacheHandleRetired > WeakCommitPrepare > primary > Ok` is unchanged. Close diagnostics live **inside** the Retired error. They add no recovery class.

    Every classifier (`is_cache_lock_error`, `is_cache_schema_drift_error`, `is_cache_read_only_error`, `is_cache_unwritable_error`) first returns false when `chain().any(is CacheHandleRetired || is WeakCommitPrepare)`. That holds even under `.context(…)` wrappers whose text contains "no such column" or "database is locked". So `with_cache_schema_retry` never rebuilds a retired handle, and `freshen_for_read` never reports WriterBusy for one. Because there is no placeholder connection, no "missing table" error can come out of a retired handle in the first place.

    A commit that succeeds and is then followed by retirement stays `committed:true`. The rows are durable at DX-1's level and visible to new handles.

    ### 3.6 Non-lock entries (V3 kept, with failure precedence completed)

    - **F-entry.** `ensure_live()` reads `retired` (SeqCst) as the first statement of `source_head_sha`, `search`, `apply_incremental` and `rebuild_projection`. A call that passed its check before retirement and exits without touching the connection is linearized before retirement.
    - **F-snap.** `read_snapshot` runs in this order:
      1. `ensure_live()`.
      2. H-snap-premint (cfg(test)).
      3. Open the read-only connection, then `BEGIN DEFERRED`, then the schema check.
      4. Recheck `retired`. If it is set, drop the new snapshot and return Retired.
      - **On failure in step 3:** check `retired` before returning. If it is set, return Retired, with the step's error rendered as `mint_failed_at=<open|begin|schema>`. Otherwise return that step's error unchanged.
      - The structural-drift branch still sets `migration_pending` as today. An early error is never reported as a completed post-mint check: O-snap records one of `minted_live`, `minted_then_retired`, `mint_failed(step)` or `mint_failed_retired(step)`.
      - A snapshot minted live before retirement is an independent handle on committed data and stays usable.
    - **Exempt getters.** `path()`, `lock_info_path()`, `is_read_only()` and `migration_pending()` still work on a retired handle. `has_usable_snapshot()` returns false once retired. `recheck_migration` is covered in §3.2.

    ### 3.7 How the weak path holds the guard

    `apply_incremental(…, ReadWinner(tok), …)` calls `lock_conn` and moves the `LiveConn` into `WeakCommitScope { live: LiveConn, done: bool }`. Admission, preparation and restore use `scope.conn()`. The `with_cache_write` closure borrows `scope.conn()` immutably to create the transaction (`Transaction::new_unchecked`, as today). The transaction uses `DropBehavior::Ignore`, and every finish is explicit and checked.

    After `with_cache_write` returns, the borrow ends. The checked finish outcome, autocommit confirmation and restore then run on `scope.conn()`. Retirement consumes the scope's guard through `retire`. On normal completion `done = true`, so `Drop` does nothing. If `done` is false while not panicking (an early `?` return through an unhandled path), `Drop` retires with cause `AutocommitUnconfirmed`. That path is unreachable when every exit is explicit, and it exists only as a backstop. Strict calls keep today's structure, with `lock_conn` in place of `.lock().unwrap()`.

    ## 4. F2 — S-d, M9 and M10 with witnessed barriers

    ### 4.1 S-d schedule (one handle A, threads W = winner and V)

    1. W runs the real winner branch on a stale one-commit fixture and pauses at **H-tx**: O-tx has fired at value 1 and `BEGIN IMMEDIATE` is held, with A's mutex held by W's scope.
    2. The H-tx hook starts thread V, which calls `A.upsert_requirement(unrelated row)`. V's `lock_conn` precheck sees live. **H-prelock** then records `precheck_live=true` for V and signals "attempting", immediately before `lock()`. V blocks on A's mutex.
    3. The H-tx hook waits for "attempting" (bounded at 8s; a timeout is a **test failure**, never a detection) and then returns. W continues:
       - **Restore variant:** W commits, restores to P=2, verifies and returns `Ok(true)`, releasing the guard.
       - **Retire variant (FAIL_RESTORE armed on W):** W commits, the restore fails, W retires `RestoreFailed` (close `Closed`) under its guard, and returns `Err(Retired{committed:true})`.
    4. Only after W's `freshen_for_read` has returned does the test thread join V. No join happens while the winner is held.

    **Declared assertions:**

    | Variant | V's Result | O-expose(V) | write_wrapper_entry(V) | O-write(upsert, V) | Other |
    | --- | --- | --- | --- | --- | --- |
    | Restore (positive) | `Ok(())` | 1, slot `Live` | 1 | 1 at value **2** | Exact P on A afterward |
    | Retire | `Err` whose chain has `CacheHandleRetired{cause: RestoreFailed, first_report:false}` | **0** | **0** (`upsert_requirement` calls `lock_conn` before `with_cache_write`) | **0** | `full_rebuild=0`; no lock, drift or read-only classification; O-retire = 1 (W's) |

    ### 4.2 M9: the post-acquire gate removed

    - **Exact edit.** In `lock_conn`, step 4 is replaced by building `LiveConn` without inspecting the slot discriminant. The precheck, H-prelock, poison mapping, F-entry and F-snap are all left as they are.
    - **Reach.** In the retire variant, V's precheck saw live (witnessed by H-prelock) before W retired. The mutex was not poisoned because W did not panic. `upsert_requirement` has no F-entry. So V reaches the mutated point holding a guard over a `Retired` slot.
    - **Detection.** O-expose(V) records one exposure with the slot state `Retired`, so the declared `O-expose(V) == 0` fails. Under the mutant, V's later `Deref` hits the invariant violation (a panic in V). That is recorded but is **not** the detection point. Detection is the exposure assertion, evaluated before the Result assertion.
    - **Why no remaining guard makes M9 equivalent.**
      - The precheck has already passed (witnessed).
      - Poison is not set in this schedule.
      - There is no F-entry on this function.
      - The `retired` AtomicBool is not re-read after acquisition (§3.2 rule).
      - There is no placeholder that could make "absence" an implicit second check: an absent slot is the `Retired` variant, which only the deleted gate inspects.
    - **Not claimed.** M9 is not detected by a successful stale-file write, by a fake PRAGMA, by a schema error or by a timeout.

    ### 4.3 M10: the snapshot fence removed (independent of M9)

    - **Exact edit.** Delete F-snap step 4 (the post-mint recheck) and the post-failure recheck.
    - **Schedule.** Arm H-snap-premint. It calls `cache.retire_for_test()`, a cfg(test) accessor that takes the real `lock_conn` and invokes the real `retire(TestInjected)`, so close outcome `Closed` is recorded. The hook then returns and `read_snapshot` proceeds.
    - **Preconditions asserted.** The fixture schema is healthy (no drift branch). O-retire = 1 is recorded **before** O-snap. The precheck saw live (H-snap-premint runs only after the precheck).
    - **Expected.** `Err(CacheHandleRetired{cause: TestInjected})` and O-snap `minted_then_retired`. **Under M10** a usable snapshot is returned, so the assertion fails.
    - **Positive companion.** A snapshot minted before `retire_for_test` still lists the committed rows after retirement.

    ## 5. F3 — S-b and the complete schedule set

    ### 5.1 S-b: other thread, same database, during the winner's transaction (strict upsert kept)

    The chosen witness is the **actual strict upsert**. Its autocommit statements are not changed. The strict-incremental BEGIN witness is covered separately (S-a2, S-k2, S-q, P1/P3/P5) and is never relabelled as upsert coverage.

    1. W pauses at **H-tx** (BEGIN IMMEDIATE held on A).
    2. Thread T opens handle C, a separate `Cache::open` on the **same** `cache.db`. Thread T has the default strict ladder: `READ_REFRESH_ATTEMPT` is false on T, fast-fail is off, and `AIDA_CACHE_RETRY_COUNT`/`_MS` are unset.
    3. T reads **its own** `PRAGMA synchronous` through a cfg(test) read accessor on C. It records this as `own_setting_while_held = 2`. This is a separate record, **not** an O-write.
    4. T calls `C.upsert_requirement(unrelated row)`:
       - `write_wrapper_entry(T) = 1`, then the sidecar claim, then `write_attempt(T) = 1`.
       - The reads in `upsert_requirement_on` succeed under WAL, so O-upsert-read(T) is ≥ 1. (This is a cfg(test) counter under the upsert label scope; it shows that the reads ran.)
       - The **first modifying statement**, `DELETE FROM requirements_cache`, returns `SQLITE_BUSY`.
       - `with_cache_retry_observed` classifies the lock error. Its cfg(test) one-shot **RETRY_WRITE_CALLBACK** fires at the first `Write`-category retry, before sleeping, with `(action="upsert cached requirement", code=DatabaseBusy)`. The callback signals. `retry_sleep` and `retry_sleep_write` each go up by 1.
    5. The H-tx hook waits for that signal (bounded at 8s; a timeout is a failure). While W is still held, it asserts `O-write(upsert, T) == 0` from the shared test sink. Then the hook returns. W proceeds to commit and restore, and T's retry re-runs the whole closure.
    6. **O-write(upsert)** sits in `Cache::upsert_requirement`'s closure **after `upsert_requirement_on` returns `Ok`**: after the first modifying statement and every later statement of that attempt have succeeded. It reads `PRAGMA synchronous` on C's connection. Expected: exactly 1, at value **2**. If W has not committed by T's first retry, more BUSY retries are allowed and recorded (`retry_sleep_write` ≥ 1).
    7. T is joined only after W has returned.

    Records: `(cache_id, db_path, conn_id, thread_id, label, value, barrier order)` for A and C.

    **Not claimed.** That two same-database writers overlap. That the held-period PRAGMA read is an O-write. That a timeout is a detection.

    **M2 / M7 under S-b.** M2 (NORMAL at open) makes `own_setting_while_held` and O-write(upsert) read 1, so the value-2 assertions fail inside a feasible operation. M7 is **not** detected by S-b, because T's retry flag is never set. S-b is an unaffected control for M7.

    ### 5.2 O-write placement per mandatory strict label (cfg(test), actual connection)

