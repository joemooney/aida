    Complete-blob hashing is source identity, not a claim to audit every unrelated line. The separate receipt records full Git blob IDs, c677 and workfile comparisons and dependency hashes.

    Pinned rusqlite 0.31.0 `transaction.rs:186–247` consumes Transaction on commit/rollback and ignores finish errors in Drop. DropBehavior::Ignore and explicit checked completion on the still-owned Connection are supported. **Connection::Drop only flushes its prepared-statement cache; InnerConnection::Drop calls close and discards its Result.** `Connection::close(self)` at lib.rs:792 returns either success or `(Connection, Error)` on failure. `Connection::open_in_memory()` at :456 returns Result; replacement allocation is fallible. Those are distinct facts from transactional Drop and are central to finding 1.

    Bundled libsqlite3-sys 0.28.0 `sqlite3.c:138787` confirms connection-local synchronous state and rejection inside a transaction. `:68169` permits only one WAL writer. `:179318–179431` implements close: unfinalized statements/backups can return BUSY without destroying the connection. Successful destruction rolls back an open transaction; merely asking Drop to close is not the same observation. Current official [SQLite close documentation](https://www.sqlite.org/c3ref/close.html) corroborates that API distinction. I am not claiming such a leaked resource is present in today's Cache implementation or that a real close failure was measured.

    The [SQLite synchronous documentation](https://www.sqlite.org/pragma.html#pragma_synchronous) and [WAL concurrency documentation](https://www.sqlite.org/wal.html#concurrency), read as primary references, support the retained NORMAL power-loss tradeoff and one-writer/pinned-reader model. They do not certify latency or unconditional shutdown success. Local bundled source is the version-specific basis. Automatic and close checkpoints remain unchanged, including any costs they impose.

    ## 3. Numbered blocking findings

    ### 1. Swap-and-drop retirement lacks a complete fallible close/ownership outcome

    **Files/symbols:** V3 §§2.2–2.3, §4.2 PANIC/rollback-failed rows, §5.1 rows 8–10, T1-R(r3/r4), §8; proposed cache.rs::lock_conn/WeakCommitScope retirement; rusqlite lib.rs::{open_in_memory,close,Drop}, inner_connection.rs::{close,Drop}.

    **Fact:** V3 newly requires an in-memory placeholder, but opening it is a fallible operation. No branch specifies what happens if it cannot be created during an ordinary error or unwind. The proposal then drops the real file connection and repeatedly asserts that this rolls back/releases the write lock now and leaves no NORMAL file connection. Its final limit simultaneously acknowledges ignored close errors. Actual rusqlite Drop does not provide the Result that would justify those unconditional outcomes. Its explicit close API does.

    A normal successful-close T1-R(r4) probe establishes that fixture's observable release; it cannot fill the missing production error branch. This is precisely the same distinction already accepted for explicit transaction rollback versus ignored transaction Drop. The correct retirement fence can prevent API reuse even when physical close is unconfirmed, but it must not then claim physical rollback/release. Rust resource scope usually makes close succeed here; the design must state and preserve that resource-order invariant rather than turn it into an unqualified all-failures guarantee. Poison handling must not repeatedly allocate/swap placeholders or erase the original retirement cause merely because every later lock acquisition returns PoisonError.

    **Required outcome:** Use a bounded per-handle ownership representation with an explicit absent/retired state, avoiding mandatory replacement allocation on the error/unwind path (for example an internal optional connection slot; this is not a framework). If another representation is chosen, fully specify its allocation-failure behavior first. Retire while holding exclusive access before any connection can be exposed. Ensure transactions, statements and borrowed handles leave scope before attempted close. On ordinary fallible exits, observe explicit close success/error and preserve primary, rollback, restore and close diagnostics and committed state. Specify the owned returned connection's fate after close error; never silently restore it to live service, lose its cleanup ownership, report close success, or promise immediate lock release. A non-reusable quarantined connection with honestly unconfirmed release is acceptable; it must stay inaccessible through all Cache APIs and must not create a cleanup service, loop, or new authority. Unwind remains non-panicking best effort plus retirement, with no unsupported rollback/close-success claim. No raw sqlite3_close_v2 workaround is implicitly approved.

    This is an independently grounded design choice: **physical close failure may be reported as unconfirmed while logical retirement remains mandatory**. It is not permission to return stale success or weaken exact restoration before reuse. Preserve `CacheHandleRetired > WeakCommitPrepare > primary > Ok`; add close diagnostics inside the highest-priority error, not a new recovery classification. Successful commit followed by retirement remains committed:true.

    **Required future tests:** Retain actual separate-connection write acquisition after successful retirement close and exact committed/old snapshot checks. Add narrow failure injection at the actual close call and, if replacement allocation remains, its actual constructor boundary; distinguish injected refusal from a measured SQLite failure. Verify same-handle queries/mutations/snapshot minting still return Retired, no schema recovery/WriterBusy occurs, the returned connection remains owned but unavailable, close diagnostics survive context wrapping, and cleanup does not double-panic. Exercise ordinary restore-failure retirement and unwind/poison separately; assert first-retirement cause/count is not replaced by subsequent poisoned callers. All are proposed, not executed now.

    ### 2. M9's required successful write is inconsistent with the replacement connection and its barrier is underspecified

    **Files/symbols:** V3 §3 S-d, §4.4 M9, §6 T1-R(r1); cache.rs::upsert_requirement :1823, upsert_requirement_on :2944, delete_one_uncommitted :3086; proposed F-lock.

    **Fact:** The M9 row says deleting only the post-acquire check makes the waiting caller write. Under the specified swap, it instead acquires an empty in-memory Connection. The actual upsert reads `requirements_cache` (some read failures are swallowed), then the first DELETE requires `requirements_cache`; an empty placeholder has none of `requirements_cache`, `requirements_fts`, `hierarchy_edges`, `cache_meta`. It cannot reach a successful real-cache upsert/O-write-after-write as promised. A missing-table error is not that intended witness and could engage schema recovery if exercised through a backend wrapper. No schema should be manufactured in a retired placeholder to make the mutant pass setup.

    Also, “pre-lock hook … before lock()” does not explicitly put the signal after the optional early retired check. If the hook precedes that check, the controller can retire before the waiting caller checks, and M9 still refuses through the remaining precheck. The test can therefore miss the independently required after-acquisition fence.

    **Required outcome:** Put the waiting signal after the caller has actually observed live at the optional precheck, immediately before the blocking mutex acquisition; then retire under the winner's mutex and release. Define the intended assertion at the actual accessor boundary: a retired connection must never be handed to an operation. A cfg(test) boundary observation may record actual connection exposure/operation entry, not fake a successful SQL write or fake PRAGMA value. A direct Result assertion for typed Retired versus a later schema error is also meaningful if expressly declared; call it a fence/type failure, not a successful stale-database write. Adapt this witness to finding 1's final ownership representation so a redundant absent-slot check cannot silently mask the precise mutant. State which check is mutated and why the remaining guards do not make it equivalent/unreachable.

    **Required future test:** S-d ordinary restore success proves a waiting strict write really executes after verified restoration at P=2. Its separate retirement variant proves typed Retired and zero exposure/wrapper/SQL entry. M9 removes only the designated post-acquisition gate after a witnessed precheck; it fails the declared boundary/type assertion, not timeout, schema setup, or a fictitious file write. M10 remains a distinct snapshot test and cannot substitute for M9. Do not call a surviving equivalent mutant detected.

    ### 3. S-b describes a BEGIN/post-BEGIN witness absent from the strict upsert it actually calls

    **Files/symbols:** V3 §3 S-b and §4.1 O-write; cache.rs::{upsert_requirement,upsert_requirement_on,delete_one_uncommitted,with_cache_write,with_cache_retry_observed}; SQLite WAL acquisition at sqlite3.c:68169.

    **Fact:** `Cache::upsert_requirement` holds the mutex and calls `with_cache_write` around `upsert_requirement_on`. Neither wrapper starts an explicit transaction. The helper first performs a read, then DELETE/other statements in the connection's existing mode. S-b nevertheless says this strict upsert's first BEGIN hits BUSY and requires a post-BEGIN upsert hit only after winner release. There is no such BEGIN. If “after first statement” means its first SELECT, an observer may run while the other writer is held, contradicting the specified zero held-period hits. If it means a successful first write, the schedule can be sound, but that exact placement/meaning is not the stated BEGIN witness.

    **Required outcome:** Do not change production upsert transaction boundaries to fit the test. Choose and state one supported schedule: use a real strict apply_incremental/ensure_cache_fresh transaction on handle C for the BEGIN/post-BEGIN witness, retaining separate mandatory upsert controls; or keep upsert and place O-write after its first successful modifying statement, with an explicit read-versus-write observation distinction and a BUSY witness from that actual modifying statement. Record the connection's real PRAGMA separately while the winner is held. Retry-sleep callback remains on C's first Write retry, with default strict retry policy enabled on that thread. Release the winner on receipt of that callback, before joining C; no wait for a successful second writer during the held transaction.

    **Required future test:** Held interval has an actual acquisition failure/retry, own PRAGMA=2, zero chosen successful-write/BEGIN observer hits; released interval reaches that observer and completes the intended strict operation at 2. All database identities and orderings are recorded. M2 and M7 fail an actual value assertion in a feasible operation, never a timeout or missing observer. Keep all independent upsert/delete/meta/rebuild labels nonzero; do not relabel an incremental witness as upsert coverage.

    ### 4. The complete count table still merges incompatible admission cases and overpromises mutant reach

    **Files/symbols:** V3 §§4.2–4.4, §6 “Every row … real winner branch”; cache.rs::with_cache_write :807–829 and proposed admission; cached_git_backend.rs::freshen_for_read :506–548; V3 M6-ii.

    **Fact:** §4.3 includes read-only mismatch among Strict refusals, while §4.2's single token-refused row requires strict_tx=1 and closure=1. Actual with_cache_write returns CacheReadOnly before invoking its closure, so a forced token on a read-only handle cannot meet those counts. An ordinary read-only usable backend returns before the winner branch and cannot naturally construct that token at all. Conversely not-in-autocommit is explicitly a retirement trigger but has no matching count/outcome row. These cannot all be subcases of an ordinary eligible winner with the universal counts currently demanded.

    M6-ii correctly adds ReadRefreshAttempt, so illicit weak preparation is now reachable. It still says tx (or skip) is at least one. If the illicit loser arrives while the genuine winner owns BEGIN IMMEDIATE, its one fast-fail BEGIN can be BUSY: prep/change/armed can fire while tx=0, exactly as the legitimate busy row already specifies. It must fail the loser zero-weak-entry assertion without requiring an impossible simultaneous writer. A deterministic schedule after winner release can instead force a transaction/skip, but that ordering is not specified. The corrected M1a and M3d concepts are sound; they do not cure these other contradictory rows.

    **Required outcome:** Split valid eligible, invalid-token-on-writable-autocommit, read-only refusal, missing retry scope, and not-in-autocommit cases, with exact per-branch counts and reach boundaries. Deliberately invalid admissions may use a narrow test-only call seam and must be labelled as such; do not pretend the real ordinary creator emits them. Read-only forced admission has no weak preparation and no transaction/application closure. Not-in-autocommit retires before prep with the close semantics of finding 1. State whether auto-rollback evidence is an SQL-engine automatic rollback or the current closure-issued ROLLBACK fixture; the latter proves the already-autocommit cleanup branch, not an actual engine-generated automatic error. No cleanup ROLLBACK should be counted when that fixture has already ended the transaction.

    For M6-ii, select either a deliberate post-release ordering with tx=1/skip, or accept the genuine held-writer branch with prep/change/armed>0 and tx=0; in either case the named failing assertion is the loser's zero weak-preparation/armed counter. Never require tx>0 to recognize genuine illicit preparation. For setting/restore mismatch faults, state exactly which real SQL action is omitted/changed or which read errors: actual value observers cannot be implemented by returning invented PRAGMA values. Set-error plus unreadable read-back is unknown state requiring restore/verification or retirement, not “not_needed” based on absence of an observation.

    **Required future tests:** A predeclared expanded count/inner/public table covers these cases; each invoked test states ordinary winner versus invalid-admission seam and proves its path before any failure assertion. No mocked setting values, setup-error credit or zero-hit strict vacuity. M1a retains O-tx while removing the dependent preparation/restore block; M1b remains a refusal control only. M3d witnesses real change but zero verified armed. M6-i remains invalid-token control only. M6-ii reaches the chosen actual contention state and fails zero weak entry, independent of M6b's wrapper-only witness.

    ## 4. Whole API, schedule and wiring disposition

