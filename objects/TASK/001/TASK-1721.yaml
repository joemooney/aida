title: Route releases through a PR so GitHub can require pull requests on main
description: |
  ## Problem
  Branch protection on `main` requires checks (merge-hold-gate, Build) with enforce_admins on, but "require a pull request before merging" is OFF. That is the only guard that `--no-verify` and non-Claude agents cannot bypass. Audit (2026-10-10): all of the last 200 first-parent commits on main came from merged PRs. The one direct-push path is `scripts/release.sh`, which commits `chore: release vX` and pushes it straight to main (lines 382-384, 430-433, 479-482; used by `aida dev release`).

  ## Change
  Change `scripts/release.sh` / `aida dev release` so the version bump goes through a PR: branch `release/vX` → open a PR → wait for checks → squash-merge with `--match-head-commit` → tag the merged commit → push the tag. That is the same ship discipline as every other change. Tag pushes are unaffected by the PR requirement.
  Then the operator enables "Require a pull request before merging" on main, with 0 required approvals (the AIDA review gate handles approvals), and keeps enforce_admins on.

  ## Acceptance
  - `scripts/release.sh patch --dry-run` prints the planned sequence (branch release/vX, push branch, `gh pr create`, wait for checks, squash-merge with `--match-head-commit`, tag the merged SHA, push the tag) and performs no `git push origin HEAD` or `git push origin main`; the manual-fallback text no longer tells the operator to push main directly.
  - An integration fixture against a local bare remote whose pre-receive hook rejects non-tag pushes to main completes a release end to end.
  - The tag points at the squash-merged commit on main (`git merge-base --is-ancestor vX main` holds) and the Cargo.toml version on main equals X.
  - The bump commit keeps the AIDA_RELEASE=1 commit-msg hook suppression.
  - `aida dev release` still waits for the release artifact after the merge, with a timeout covering CI duration; docs/cli/11-dev.md and the release docs are updated.
  - Operator runbook step added: enable "Require a pull request before merging" (0 required approvals, enforce_admins on), then verify once that a direct `git push origin main` is rejected.
