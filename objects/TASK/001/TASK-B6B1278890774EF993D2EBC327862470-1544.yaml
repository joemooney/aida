title: 'Review follow-up: aida-core/src/mailbox_lifecycle/activation.rs restart_step joins the writer''s argv unquote'
description: |-
  From TASK-3922
  Reviewed sha: 1e0b7323fcaa8ba2928dea62a3589b5640e0177a

  aida-core/src/mailbox_lifecycle/activation.rs restart_step joins the writer's argv unquoted into a backticked `rerun ...` command: an argument containing spaces or shell metacharacters renders a command that does not reproduce the original invocation when copy-pasted, and every argument (possibly a grant id or token passed on the command line) is copied into the refusal reason text that can be persisted or relayed. Shell-quote the shown arguments and consider redacting value-bearing flags.
