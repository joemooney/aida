title: 'aida pr ship on a drive-owned PR: report the owning phase + liveness, offer --wait <secs>, and prompt-or-explain at a TTY instead of a bare refusal'
description: 'Operator request (Joe, 2026-10-05) after PR 2431: ship refused twice with ''target PR is owned by the live drive'' while the drive''s reviewer phase was mid-flight; the operator had no way to tell whether to wait, for how long, or whether the drive was hung. Shape: (1) at a TTY, the refusal should name the owning run/phase and its liveness evidence (e.g. ''reviewer phase, headless log last written 12s ago'') and the expected outcome (''escalates merge to you on completion''); (2) --wait [secs] polls until the drive releases the PR, then proceeds with the ship (exit non-zero on timeout); (3) any interactive prompt must sit behind the same direct-TTY + non-managed-agent predicate as issue_direct (TASK-1597 lesson). Headless behavior stays a plain fail-closed refusal. AIDA_PR_SHIP_ALLOW_IN_DRIVE=1 remains the explicit override.'
