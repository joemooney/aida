    REVIEW FINDINGS TO ADDRESS (PR #2444):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 2747ca024040
    Recorded: 2026-10-06T14:18:54.561306890+00:00
    Findings:
    1. [P2] TASK-1602: pr_cmd.rs:1924-1977 retains already_merged from before --wait. If the drive merges while waiting, ship still watches CI and attempts another merge; red checks make it exit 1 for an already-merged PR, while green checks falsely claim this run shipped it. Reprobe PR metadata after release and enter the existing already-merged sync/cleanup path. Add OPEN-to-MERGED wait coverage asserting no CI/merge call and no claimed merge act. Reproduced with the PR-head binary; evidence in PR-2444-review.md and PR-2444-merged-wait.txt.
    2. [P2] TASK-1602: pr_ship.rs:77-89 displays shared state.run_uuid as the owning run solely because current equals the member spec. In a pipelined overlap, set_run(B, run-B) followed by set_phase_inner_with_tuning(A, phase-3) leaves run-B while current becomes A. The direct-TTY reproduction prints TASK-1602 with run sibling-run-B. Correlate run identity to the owning spec, or report it unavailable if uncorroborated; add overlap-interleaving coverage. Evidence in PR-2444-review.md and PR-2444-run-mismatch.txt.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
