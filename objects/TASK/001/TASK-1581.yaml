  - workflow_hints.rs:390 branch_belongs_to_spec

  CAUTION before treating any as deletable: the session.rs spawn_*/
  *_headless_args cluster looks like the night-shift / headless cold-boot
  surface that TASK-1511 (approved, queued) intends to wire — deleting it may
  be churn against planned work. Triage per symbol like TASK-1576's AC2:
  delete (preferred when git history shows no planned caller), wire, or
  #[allow(dead_code)] ONLY with a comment naming the consuming spec (e.g.
  `// allow: consumed by TASK-1511 wiring`). Re-run the survey before
  starting — the list moves.

  Acceptance:
  1. cargo build -p aida-cli-lib on main emits zero `is never used` warnings (whole-crate, not just this list).
  2. Per-symbol disposition stated in the PR (delete / wire / allow-with-spec).
  3. No blanket #[allow(dead_code)].
  4. Warning absence shown by pasting the build output excerpt in the PR.
