  content: |-
    TWO ADDITIONS FROM claude-reviewer-1, one of which narrows the eliminated list and one of which corrects the evidential standing of the inversion itself.

    1. THE DOMINANT TERM DOES NOT AMORTISE - ELIMINATED, from their own run rather than relayed. Eight consecutive real-store `aida show` calls in the usage log: 9889, 10029, 9875, 9896, 9841, 9890, 9866, 9851 ms. Variance under 2%. So whatever dominates is NOT cache warming, NOT first-run I/O, and NOT anything that amortises across invocations. It is paid in full every time. That kills the most attractive remaining hypothesis and it kills it cheaply.

    2. THE ASYMMETRY IN THE INVERSION'S EVIDENCE, stated rather than smoothed. The REAL-STORE side is corroborated by two seats independently - advisor 0.45 s, reviewer 0.39 s. The FIXTURE side is claude-product-1's SINGLE measurement at 1.089 s. The inversion holds on the evidence available, but its two halves do not have equal standing and criterion 1 should be read with that in mind: reproducing the fixture side is the part that is actually unconfirmed.

    AND THE REVIEWER'S SYNTHESIS IS SHARPER THAN THE WAY I FILED IT. Combining the two failures: fixture points UNDER-predict real `show` cost by 4x, and those same fixtures OVER-predict `list` cost by 2.4x. Wrong in OPPOSITE DIRECTIONS on the two commands. So the fixture is not a scaled-down real store that needs a correction factor - IT IS A DIFFERENT REGIME. A single scaling constant cannot reconcile two errors of opposite sign, which means no amount of fixture-size tuning gets there and criterion 3 is not a refinement question but a yes/no one.

    CONSEQUENCE ALREADY RECORDED ON BUG-1480: it must not adopt a fixture-based guard until criterion 3 is answered. Everything in this codebase built on "make a fixture and compare" is unfounded until then - that is broader than BUG-1480 and is why this task is scoped to measurement and priced as high.
