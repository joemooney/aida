title: 'Tier local testing by risk: fixer/relay templates stop running the full suite per PR; nightly full-suite job'
description: |-
  Operator 2026-10-15 05:39: TASK-1767 (docs-only) spent 23 minutes in cargo test while 6 cores sat at load 30, and every fixer runs a full local suite that CI repeats at the PR head.
  ## Acceptance
  - The aida-fire fixer template, the discipline README, the relay lane prompts and the pickup/implement skills state the tiers:
    - FASTTRACK (docs/templates/one line): make check-ci-fast only, with no cargo.
    - STANDARD: targeted cargo test -p <crate> <filter> for the touched modules, plus make check-ci-compile.
    - STRICT or heft>=7: the above plus the area's integration test binaries.
    - The full workspace suite runs only in CI.
  - Add a scheduled nightly full-suite job (aida schedule) that files a bug on red.
  - Add a make target such as 'make test-touched' that derives test filters from the files changed against origin/main.
  - Edit the template masters, then run make sync-templates.
