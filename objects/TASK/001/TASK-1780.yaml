- id: 01a13f98-5bc3-7163-8498-acfc5a3f26f1
  author: joe
  content: |-
    ADVISOR DESIGN (05:46, operator discussion). Programmatic gate, derived from the DIFF, not a spec flag:
    (1) The cargo wrapper (~/.local/bin/cargo; the master lives wherever the slot wrapper is versioned) runs, before test/build, git diff --name-only origin/main...HEAD plus the working tree. It intersects that list with the dependency paths in the target dir's *.d dep-info files, which include include_str!/include_dir! inputs. If the intersection is empty, it skips with 'no compile inputs changed; CI covers it' and exits 0. --force-build overrides. With no dep-info (a cold target), it falls back to the patterns *.rs, Cargo.*, build.rs, .cargo/, rust-toolchain*, and embedded template dirs. It skips only when the compiler provably would not see the change.
    (2) The spec's tier/heft chooses the DEPTH (targeted, area integration or full), not whether to compile.
    (3) Seed per-worktree CARGO_TARGET_DIR from main's warm target at worktree creation (cp --reflink=auto, else cp -al for immutable deps). The TASK-1767 cost was 27 min of COLD build of aida-cli-lib, not test selection.
    Tests: a docs-only diff skips; an embedded-template diff builds; an .rs diff builds; --force-build; the cold-target fallback.
