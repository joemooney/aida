title: 'Review follow-up: The E2 re-check in Rust (gate/train_generated.rs ledger_violation) and in the Python drive'
description: |-
  From TASK-3963
  Reviewed sha: 3ab9a48e3ebcd6e6204749eaf43e97be4758351a

  The E2 re-check in Rust (gate/train_generated.rs ledger_violation) and in the Python driver only compares the `writer` array of scripts/store-writers.toml. The regenerated `operation` and `mediated_route` tables, and the top-level `version`, are committed with no host re-check. Today's base generator forces operation rows to blocked and copies mediated_route verbatim, so this is not exploitable. Extend the post-condition to refuse a changed mediated_route, a non-blocked operation row, or a version change, so the guarantee does not rest on the generator alone.
