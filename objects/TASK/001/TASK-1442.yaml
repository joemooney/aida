  content: 'Claude implementer result: branch claude/task-1442 @ 13c374ac56 (2 commits, pushed, no PR). The guard pr_open_spec_guard_violation (pure core) refuses to open a PR when no commit in main..branch carries the expected spec''s trailer, and the refusal names the expected id plus the ids the trailers carry instead. It is wired into (a) aida pr ship (the leased-branch create arm) and the human finish ceremony, where it exits 1; and (b) the drain''s own PR-open paths open_orchestrator_pr_for_implementer_worktree / open_orchestrator_pr_for_pushed_branch plus their try_open_* wrappers and 3 RealPhaseDriver sites, via the non-exiting ensure_pr_open_spec_attribution, which returns Err so the phase shelves instead of killing the drain. AC1 met; AC2 met by pure tests (BUG-1420-trailered branch leased to STORY-1391) plus an orchestrator-seam test with a fake gh stub in real_phase_driver_wiring_tests.rs (28 pass). REVIEWER NOTES: open_cluster_pr is deliberately unguarded (--single-branch batches legitimately carry several specs); an unleased ''aida pr ship'' skips the check.'
