title: 'Record the instrument-trigger test in observation-discipline.md: ask what must be true of an instance BEYOND the defect for a check to see it'
description: |
  Filed by the driver advisor 2026-09-20 23:14. The rule is the reviewer's sharpening of a
  generalisation drawn from four of tonight's own measurement failures. It is generic,
  cheap to apply, and belongs in the discipline pack rather than in any one spec.

  THE OBSERVATION. Four checks used tonight each under-counted, and they share a property:

      mojibake detector    fired only if a non-ASCII character had been present
      fixture shortcut     fired only if `[test]` appeared in the title
      "pre-existing"       held only if the producer was the tool that prompted the check
      TOON-header probe    fired only if the greedy capture had reached a header

  IN EVERY ONE, THE INSTRUMENT'S TRIGGER IS A PROPERTY OF THE INSTANCE RATHER THAN OF THE
  DEFECT. Each check keys on something the defect USUALLY carries instead of on the defect
  itself, so its count is a lower bound and its misses are not random — they are precisely
  the instances lacking the incidental feature.

  The contrast case proves it is not hindsight: the flattened-scalar detector fires on the
  producing PATH HAVING RUN, which IS the defect, and it found 78 where the others found 6.

  THE RULE, phrased as an answerable question rather than a caution:

      WHAT MUST BE TRUE OF AN INSTANCE, BEYOND THE DEFECT ITSELF, FOR THIS CHECK TO SEE IT?
      If the answer is not "nothing", the count is a LOWER BOUND and must be reported as one.

  WHY IT IS CHEAPER THAN THE ADJACENT RULE. The "what else does this change exclude"
  question needs you to imagine an unnamed population. This one is answerable by READING
  THE PREDICATE — no knowledge of the population required, no imagination, and it produces
  a concrete disposition (report as a lower bound) rather than a prompt to think harder.

  WHY IT ALSO EXPLAINS THE SEVERITY SKEW. The missed instances are the ones without the
  incidental feature, and an incidental feature that announces itself — `[test]` in a
  title, an em-dash in prose — is exactly what makes an instance EASY. So a
  property-of-the-instance trigger preferentially finds the easy cases and skips the hard
  ones. Tonight the three severe id collisions were the three that lacked `[test]`.

  ## Acceptance
  1. The rule is added to `aida-core/templates/.aida/discipline/observation-discipline.md`
     as a named, quotable test, with the question in the form above.
  2. At least two of the four worked examples are carried with it — the contrast between
     the mojibake detector (6) and the flattened-scalar detector (78) is the one that makes
     it land, because both were run against the same store on the same night.
  3. The severity-skew consequence is stated: a property-of-the-instance trigger misses the
     hard cases preferentially, so the misses are not a random sample.
  4. The disposition is explicit: when the answer is not "nothing", report the count AS a
     lower bound rather than silently qualifying it in prose.
  5. It does NOT go in CLAUDE.md. Specialised guidance lives in the discipline pack; the
     pack README's pointer table is updated if the file is not already listed there.
  6. Tagged for scaffolding propagation if the pack's marker convention applies, so
     downstream projects inherit it without a code change.

  NOT IN SCOPE: changing any of tonight's specs. TASK-1313 already carries the three-
  aperture table that motivated this; this task is about making the rule reusable, not
  about re-litigating the instances.

  7. THE RULE'S TEXT MUST SAY WHEN IT IS APPLIED: while WRITING the check, by reading the
     PREDICATE — before the check has ever been run and with no results in hand.

     Reviewer's addition, and it is the reason the test is cheap rather than a nicety. A
     rule that needs results to apply is a rule nobody applies at the only moment it would
     help. Every one of tonight's four under-counting checks was written, run, and reported
     before anyone asked what its trigger required; asking at write time costs one sentence
     and needs no population.

     So the rule is phrased for the author of a predicate, not for the reader of a count.

  8. A SECOND, SMALLER TEST FOR THE SAME FILE — verify a CONVERSION against a known event,
     not by recomputing it.

     Reviewer's method, 2026-09-20. A unit conversion (timezone, epoch, base) that is
     checked by redoing the arithmetic is checked in the same direction that produced it,
     so a systematic error survives the check. Landing the converted value on an
     independently-known event settles it instead:

         a verdict's recorded_at converted from UTC to local was verified by matching the
         time the reviewer had separately recorded WRITING that verdict, not by subtracting
         seven hours again.

     WORKED COUNTER-EXAMPLE, same night: marker mtimes printed in local time were compared
     against verdict timestamps left in UTC, producing an apparent seven-hour gap between a
     hold and its verdict where the real gap was five to seventeen minutes.

     AND THE REASON IT MATTERS MORE THAN AN ORDINARY SLIP: the error direction was toward
     ALARM. A seven-hour gap is a far more serious-looking finding than a five-minute one,
     and alarming findings get escalated before they get checked. An instrument that errs
     toward alarm buys itself less scrutiny, not more.

     Keep this shorter than the criterion-1 rule — one paragraph plus the two examples.
     It belongs in the same file because it is the same class: how a measurement earns
     being reported.

  9. VOCABULARY AND SHAPE ARE THE SAME QUESTION, and guarding one does not guard the other.
     Worked example from 2026-09-20 23:45, added because the rule's own author walked into
     the second half ninety minutes after filing the first.

     THE TASK: count recompiles in a GitLab job log, to test the criterion "the job log
     shows no recompiles of unchanged crates".

     THE GUARD THAT WORKED: counting four spellings — Compiling, Checking, Fresh, Building
     — rather than only Compiling, on the explicit reasoning that clippy emits Checking and
     a single-spelling count would key on a property of the instance. That reasoning was
     right.

     THE GUARD THAT WAS MISSING: every one of the four patterns carried a TRAILING SPACE.
     In that log the cargo verb is followed immediately by an ANSI reset escape, not a
     space — `...[92m    Compiling[0m aida-core` — so all four matched nothing, and
     reported zero IN AGREEMENT. The agreement read as corroboration.

         with trailing space    Compiling 0   Checking 1 ("Checking out")   Finished 0
         without                Compiling 5   Checking 4                    Finished 2
         escape-stripped        5 compiled, 3 checked, aida-core TWICE

     Conclusion reported: criterion met, fully cached build. Actual: eight unit lines on a
     commit that changed one test file. Retracted within ten minutes by a second seat.

     THE TELL WAS INSIDE THE SAME MESSAGE. "Finished" was reported as TWO lines from one
     grep and ZERO from another in the same report, because only one of the two omitted the
     trailing space. A pattern returning 0 for something the same message counted as 2 is
     not measuring what it claims — and the author did not see it, because four zeros
     agreeing with each other looked like evidence.

     SO THE TEST IN CRITERION 1 HAS TWO HALVES AND BOTH MUST BE ASKED:
         VOCABULARY  does the pattern cover every word the producer emits?
         SHAPE       does it cover every FORM the line takes — leading whitespace,
                     timestamps, colour codes, anchors, trailing separators?
     Both are the same question — what must be true of a line, beyond containing the thing,
     for this pattern to see it — and answering one is not answering the other.

     CHEAP DISCRIMINATOR, from this instance: if a set of related patterns all return zero,
     check one of them against a line you can SEE in the file. A null result that agrees
     with other null results is the least falsifiable output a grep can produce.

     CAUSE PINNED BY TESTING BOTH HYPOTHESES, 2026-09-20 23:48. The first diagnosis offered
     was ANCHORING; the actual fault was the TRAILING SPACE. Both were present in the
     diagnosing seat's own pattern, so they attributed the zero to the one they noticed:

         grep -c "Compiling "      unanchored + trailing space   0
         grep -c "Compiling"       unanchored, no space          5
         grep -c "^ *Compiling "   anchored + trailing space     0
         bytes after the verb:     Compiling<ESC>[0m aid

     The anchor would also have killed it, but it was never load-bearing for the patterns
     that actually ran, which were unanchored. A two-variable failure reported as one
     variable — and an implementer told the anchor is the hazard would write unanchored
     patterns with trailing spaces and get zeros again.

     THE DURABLE FACT: IN A CI LOG, THE CHARACTER AFTER A CARGO VERB IS NOT A SPACE. It is
     an ANSI reset. Any pattern with a trailing space returns zero, and it returns zero for
     EVERY verb, because they share one formatting convention. Consistency across spellings
     is exactly what a shared formatting bug produces — so agreement between sibling
     patterns is evidence of a common fault at least as much as of a common truth.

     THE CHEAPEST CHECK, and better than the one first written here: not "is my pattern
     right" but "DO MY OWN NUMBERS AGREE WITH EACH OTHER". The tell in this instance was
     Finished=2 from one grep and Compiling=0 from another in the same report. That fires
     without suspecting the pattern, without knowing the format, and without knowing which
     of two faults caused it.
