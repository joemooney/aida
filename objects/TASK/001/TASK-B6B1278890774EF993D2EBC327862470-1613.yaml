    REVIEW FINDINGS TO ADDRESS (TASK-3955):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c4a52a471c72
    Recorded: 2026-11-28T05:12:44.566967756+00:00
    Findings:
    1. AC1/AC2 unmet for a codex challenger: the sign-in check guards only the finder (review_prepare.rs:390-394 calls call.sign_in_check, never pass.sign_in_check). With `aida review prepare --run-review --adversarial` and a claude finder, codex is the default challenger pick; a signed-out codex challenger's `exec` retries silently until the per-batch deadline (challenger deadline = finder.deadline = RUN_DEADLINE, 15 min, review_challenger.rs:142), then the report says only 'challenger: unavailable' with a deadline error. No `codex login` hint and a 15-minute silent hang, which AC2 forbids. The implementer's self-review names this gap (P3) and defers it, but the PR completes TASK-3955. Fix: also run the probe for the challenger pass (when it is codex) before the first batch, with the same message, or degrade it to unchallenged naming `codex login`. Add a test for the challenger case.
    2. Test gap: the review_prepare wiring is untested. task3955_signed_out_codex_fails_fast_with_the_sign_in_hint exercises RunnerCall::sign_in_check directly. No test drives handle_review_prepare --run-review --agent codex with a signed-out fake codex and asserts that the run fails before any batch runs, with the `codex login` message. Removing the call at review_prepare.rs:392 would pass every test.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
