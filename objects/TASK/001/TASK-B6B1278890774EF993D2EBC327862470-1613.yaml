title: 'First-run: a signed-out Codex fails fast with the sign-in hint instead of hanging (F14)'
description: |-
  ## Acceptance
  - AC1: when codex is not signed in, aida review prepare --run-review (and lanes using codex) detect the auth prompt / auth error within a bounded time and fail with 'codex is not signed in: run codex login' (the same class as BUG-2775's vendor preflight).
  - AC2: never hangs silently; a test with a fake codex that waits on an auth prompt asserts the bounded failure and message.

  Source: docs/plans/2026-11-27-fresh-user-walkthrough.md (on branch task-3951-fresh-user-walkthrough / PR #4782), section F14. Advisor aida-d3 2026-11-27 20:30 priority order; filed by product-15 for laning now (one spec per lane).
