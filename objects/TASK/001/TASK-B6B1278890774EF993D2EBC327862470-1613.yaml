- id: 01a22067-ed7d-76d0-8fc9-caa1d9e49af5
  author: dirtlab
  content: |-
    ## Implementer approach

    Repro (empty HOME, codex 0.167.0): `codex exec` with no sign-in never reports it; it retries the Responses WebSocket until killed (the review deadline is minutes). `codex login status` answers locally in ms: `Not logged in` on stderr, exit 1.

    ### Acceptance criteria and evidence
    - **AC1 (unit, launch/review_runner.rs):** before the first codex batch, review prepare runs `codex login status` through the same hardened, confined runner spawn (same auth files the review sees) with a 20s bound; not signed in -> `codex is not signed in: run codex login, then retry`. Skipped when OPENAI_API_KEY is passed (login status does not count an API key). Lanes: codex lane launch already refuses at admission with a `run codex login` hint (codex_auth token_expiry); this change covers the review runner path, which had none.
    - **AC2 (unit):** fake codex whose `exec` waits forever (auth prompt) and whose `login status` says Not logged in -> run fails in <10s with the message; a fake whose `login status` hangs -> bounded failure naming the sign-in check, never a silent hang.
    - Also print `run review: using codex (from --agent)` so the named-agent path is not silent (F14).

    ### Expected files
    - aida-cli-lib/src/vendors/review_runner.rs
    - aida-cli-lib/src/launch/review_runner.rs
    - aida-cli-lib/src/review_prepare.rs

    ### Ambiguities / conflicts as questions
    - None
