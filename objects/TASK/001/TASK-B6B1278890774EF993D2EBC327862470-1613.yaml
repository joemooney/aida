  content: |-
    ## Implementer self-review
    Reviewed HEAD: aa819cccf5 (round 2). Fixes for CR @c4a52a47:
    1. Challenger sign-in: review_prepare.rs now runs sign_in_check on the challenger pass before the first batch. A signed-out codex challenger is never asked. review_batches starts with its cause set, so every finder row comes back unchallenged and the run exits 4 (S5d). The cause names `codex login` and --challenger-agent.
    2. Wiring test: task3955_signed_out_codex_is_refused_before_any_batch drives handle_review_prepare --run-review with a signed-out fake codex, once as finder (fails with the hint, no exec, no report) and once as forced challenger behind a claude finder (exit 4, cause has the hint, exec never runs, 1 unchallenged finding). Removing either call fails it: the finder hangs, or the challenger's marker appears.
    Evidence: 13 targeted tests pass (task3955, bug2783, s5d_, s3a filters). make check-ci-fast: 47 gates passed.
    Probes: a zero-batch run skips both checks. A codex/codex pair fails on the finder first. A signed-out challenger still counts as unconfined for --post-comment (fail-closed).
    Residual: the challenger test forces --challenger-agent codex. The default pick takes the same code path but has no separate test.
