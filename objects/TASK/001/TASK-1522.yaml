title: 'Intent-capture effort target: report the criterion-to-test share of newly completed specs against a configurable floor (default 50%)'
description: |
  From SPIKE-86 section 8 item 4, resolved by OPERATOR DECISION on SPIKE-86 (Joe, 2026-09-26) as "the effort-balance target": option (b), set a target that rebalances effort toward intent capture. Evidence: intent work (criteria, traces, reconstitute) took 6.6% of attributed changed lines over 30 days against the control plane's 50.9%, and criterion-level tracing covers 10 specs.

  The target is a floor on criterion-to-test tracing for newly completed work, measured by the capture-coverage report (STORY-1487) and reported, not enforced (PRIN-9 is advisory; raising enforcement is a separate operator decision).

  PROXY DECISION (orchestrator for Joe) on the starting number, which Joe may overrule by comment: of work specs (story/task/bug) completed in a rolling 30-day window that carry acceptance criteria, at least 50% have at least one criterion with a traced test. The number lives in project config with that default.

  Acceptance:
  1. The capture-coverage report shows the criterion-to-test share for specs completed in the last 30 days next to the configured floor, and states "below floor" or "at or above floor".
  2. The floor is read from project config; the default is 50%; changing it changes the verdict (test).
  3. `aida status` (or the digest) shows a one-line intent-capture indicator when the share is below the floor, and nothing when at or above (test).
  4. Nothing blocks a merge, a drain, or a completion because of this metric (test: a spec completed with no traced criterion still completes).
  5. The current AIDA value at filing is recorded in a comment on this spec once implemented, as the baseline.
