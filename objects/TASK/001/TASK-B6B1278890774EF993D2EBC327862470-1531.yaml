title: 'Review follow-up: aida-cli-lib/src/review_watch.rs:1970: the reclaim runs whenever an exited held-tree attem'
description: |-
  From BUG-2776
  Reviewed sha: 1eba036e95ffbc060aba8b5844232897f0def674

  aida-cli-lib/src/review_watch.rs:1970: the reclaim runs whenever an exited held-tree attempt exists. That includes after pickup_retries >= 3 and while the watcher is paused (pause::current is checked after the reclaim). In the capped case the checkout is ended, but pickup_retry still returns 'pickup retry cap reached' with retained=false. The PR stays held until someone runs `aida review watch --release`, and it never reaches the AC3 retained/doctor surface. PRs that hit the cap before this lands (the live #4638/#4634/#4627 shape) get no automatic dispatch. Follow-up: skip the reclaim when the retry is capped or the watcher is paused, or reset/release the cap once a reclaim succeeds.
