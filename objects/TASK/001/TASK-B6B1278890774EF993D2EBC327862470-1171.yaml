title: 'Review follow-up: The smoke spool can lose an entry. note_smoke_failure appends to the spool without a lock '
description: |-
  From STORY-2897
  Reviewed sha: f037b9d28788d3673950b9986e88d91d0d0e42af

  The smoke spool can lose an entry. note_smoke_failure appends to the spool without a lock precisely while a pass holds the watch lock (main_watch.rs:1230-1239), and that pass's replay_smoke_spool reads the file and then rewrites or removes it (lines 1279-1311). An entry appended between the read and the write/remove is dropped, although the build output said it was kept.
