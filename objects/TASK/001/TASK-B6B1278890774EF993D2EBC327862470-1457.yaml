title: 'Review follow-up: SNAPSHOT_TTL is measured from pass discovery (claim.observed), not from the per-change hea'
description: |-
  From BUG-2765
  Reviewed sha: 5f2421b51c8220f2ba2035bb3bf7140b1e493b03

  SNAPSHOT_TTL is measured from pass discovery (claim.observed), not from the per-change head re-read that supersede() already performs via repo.change. In a pass longer than 60s, every later change pays an extra `gh pr view` in decide(). That adds load on the shared GitHub rate budget. Consider stamping observed per change after the supersede re-read.
