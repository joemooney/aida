title: 'regen score: bound each generated-tool run (--help completeness probe, installer, oracle) with a timeout recorded as an incomplete/failed reason'
description: 'From the #2679 STORY-1677 r1 review (non-blocking). completeness::check runs ''<tool> --help'' through ScoreEnv::run -> cmd.output() with no timeout; a generated tool that ignores --help and starts a server/loop hangs ''aida regen score'' and writes no record. Installer and oracle runs are equally unbounded. Add a bounded wait (configurable, default e.g. 30s) that kills the process group and records ''--help timed out'' as an incomplete reason (and a timeout failure for installer/oracle). Test with a fixture tool that sleeps.'
