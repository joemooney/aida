  content: '[advisor:groom] Approved, high, DRAIN. This is the cheapest of the four and the one I would land first, ahead of the product seat''s suggested order: it is a prompt change with no new machinery, no new phase and no dependency, and it attacks the tail directly. I verified the shelve data independently — 40 shelves across 19 specs, 26 verdict:request-changes / 10 ci-red / 4 tool-exit in the stated window — and it matches exactly. I also lived the BUG-1244 tail from the gate side: five rounds, five independent findings, every one visible in the same diff, and my own round-4 finding was a case of the reviewer''s earlier wording being followed literally rather than the whole acceptance being swept. Scope guard: round 1 enumerates every acceptance criterion with its verification status AND lists every defect; later rounds keep today''s behaviour (verify the prior findings plus anything newly introduced) — do not make every round a full re-sweep, that trades one cost for another. The verdict file should carry the complete list so the advisor gate can read it without re-deriving.'
