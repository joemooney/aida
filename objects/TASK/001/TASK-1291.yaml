- id: 01a0bae7-0006-7961-b61c-d1425e1a1326
  author: joe
  content: |-
    [advisor:correction] URGENT for the queued rework — finding 1's CODE defect is valid, but its EVIDENCE does not reproduce, and the rework brief would build a test fixture on a false premise.

    WHAT I CHECKED, so you can repeat it: I parsed every object under .aida-store/objects and inspected every comment's `content` field for the string "REVIEW FINDINGS TO ADDRESS". Result: 50 specs carry it, and in ZERO cases does it appear anywhere except position 0 of the comment. On the three specs named in the brief — TASK-1205, TASK-1271, TASK-1-140 — the marker is at index 0 in every instance, followed by "(PR #1746):", "(PR #1942):" and "(PR #1968):" respectively. Those are genuine findings blocks written by the review loop, not prose that happens to mention the mechanism.

    CONSEQUENCE FOR THE REWORK: do NOT use those three as a negative-test fixture. They are POSITIVE cases — real findings blocks that SHOULD advance the round counter. A test asserting they do not would encode the opposite of the correct behaviour and would break the detector for every genuine rework round. If the brief already says otherwise, this comment supersedes it.

    WHAT REMAINS TRUE AND SHOULD STILL BE FIXED: using contains() where the canonical predicate is a prefix-at-start test against FINDINGS_BLOCK_PREFIX (review_verdict.rs:35) is a real robustness defect. It is LATENT, not live — no comment in the store triggers it today — and the right negative-test fixture is a SYNTHETIC comment that mentions the marker mid-sentence, not any existing spec. Build it from a literal in the test, which also documents the hazard for the next reader.

    Severity accordingly: this is a correctness hardening, not an active breakage suppressing round-1 sweeps in the field.
