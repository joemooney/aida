- id: 01a0eb15-5b75-7b10-b721-5d0093ca28ed
  author: joe
  content: |
    Advisor design pass (Session #12), read of the code before dispatch. Four findings; the first
    two change what has to be built.

    **1. AC 7 IS ALREADY SATISFIED. Verify it, do not rewrite it.** `docs/agents/seat-parity.md`
    (the "Skill discovery (non-Claude skill packs)" section, ~L46-L89) already carries the discovery
    matrix headed `Codex 0.157.0 | Antigravity (agy) 1.2.11`, with the legacy and `.claude/skills`
    rows filled in against 0.157.1 / 1.2.12 (TASK-1521); it already states a `SKILL.md` under
    `.agents/skills/` must be a regular file; and its closing paragraph already corrects the earlier
    claim, in the right nuance — `.codex/skills/` is *a* Codex surface, 0.157.1 still reads it, but
    not the canonical one and not one Antigravity reads.
    `docs/agents/porting-claude-code-to-codex.md` ~L751-755 likewise names
    `.agents/skills/aida-review/SKILL.md` as the Codex form, records the 0.157.0 symlink-skip and
    says to write a regular file, and points at the matrix. The only residue of the old claim is in
    two other docs: `docs/agents/codex-mcp-setup.md` L336 and L358, and
    `docs/agents/antigravity-mcp-setup.md` L210. Those three lines are what "corrected wherever it
    appears" still means. Note they are NOT generated mirrors of their masters for this text — the
    masters under `aida-core/templates/docs/agents/` contain no `.codex/skills` or
    `.antigravity/skills` mention at all — so the edit is to the `docs/agents/` copy only, and the
    pre-existing content divergence between master and copy must be left exactly as it is.

    **2. The check's "do not transcribe the header by hand" is not a preference, it is impossible.**
    `scaffolding::compute_checksum` (mod.rs:537) hashes with
    `std::collections::hash_map::DefaultHasher` and truncates to 8 hex chars. That is SipHash-1-3
    with an implementation-defined internal state; no `sha256sum`/`cksum` pipeline can reproduce it,
    and it is not even guaranteed stable across Rust releases. So the AIDA-Generated header
    `<!-- AIDA Generated: v{SCAFFOLD_VERSION} | checksum:{hash} | DO NOT EDIT DIRECTLY -->` cannot be
    produced in shell at all. **Resolution: the two targets call a Rust driver built from the working
    tree** — an example target, `cargo run -q -p aida-core --example agent_skill_pack -- <sync|check>`.
    This satisfies AC 6 exactly as written: cargo rebuilds `aida-core` whenever
    `aida-core/templates/` changes (`build.rs` emits `cargo:rerun-if-changed=templates/`), so the
    bytes come from the WORKING TREE, never from a previously installed binary's embedded copy. It
    also satisfies AC 2 better than a shell derivation could: call
    `inventory::portable_skill_inventory(&ScaffoldConfig::default())`, which *is* the rule, instead
    of re-implementing it. (The shell derivation AC 2 describes does happen to agree today — every
    `include_*_skill` flag in `ScaffoldConfig::default()` is `true` and `skill_enabled` ships any
    name absent from `INCLUDE_FLAGS` — but it would diverge silently the day a default flips.)

    **3. New: orphan `aida-*` directories are drift (call this AC 4b).** `make sync-templates` removes
    an `aida-*` directory under the pack that the derived inventory no longer contains, and
    `make check-templates` reports it as drift. Rationale: an orphan is precisely the failure the
    derived inventory exists to prevent — a skill moved to `[[claude_only]]` would keep being offered
    to Codex from a stale copy forever, and neither AC 1 nor AC 4 as written would catch it. Deletion
    stays inside AC 5's `aida-` fence, so `local/` and `typesafe-ai/` (both present in this repo's
    pack today) are untouched. Measured motivation: this repo's `.agents/skills` holds 24 `aida-*`
    directories where the current inventory wants ~53 — it is 29 skills stale and nothing reports it.

    **4. AC 4 compares raw bytes exactly (`==`), not `generated_text_matches`.** The trimming
    comparator exists for formats an external writer also touches; here the sync itself wrote the
    bytes, so any difference is real drift and the tolerant comparator would hide a trailing-newline
    regression in the oracle.

    Implementation shape, so AC 8 is testable without shelling out: put the logic in
    `aida-core/src/scaffolding/` as pub functions over a project root — render the pack (one
    `BTreeMap<PathBuf, String>` keyed by path under the pack, values `wrap_with_aida_header(path, raw)`
    for every `PortableSkillFile`, which is what `create_artifact` does and is
    `rendered_pack_skill(PORTABLE_PACK, name)` for the `SKILL.md` entries), then `sync` and `check`
    over that map. The example target is a thin argv wrapper. AC 8's fixture test then calls sync
    then check on a tempdir and asserts clean, mutates one byte and asserts a failure, and asserts a
    planted non-aida directory is byte-identical across a sync (AC 5).
