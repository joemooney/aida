title: 'BUG-2621 follow-up: identify the admission.lock holder behind auto-train/review-watch contention and close findings 1 and 3 (holder validation, alerts, recovery regressions)'
description: 'Split from BUG-2621 r3 by advisor-117 on 2026-11-16 18:35. BUG-2621 r3 ships only finding 2: the unconditional WouldBlock success is removed and a contention regression is added. Findings 1 (holder validation/alerts, investigation-first) and 3 (recovery regressions) from the CR at #4167 b4f3971 move here. Holder evidence: advisor-117 sampled /proc/locks for .aida/review-watch/admission.lock and .aida/auto-train/admission.lock for 15 min while auto-train was reporting ''review-watch lock busy'' every few minutes; results will be posted as a comment here. Lane notes: docs/internal/testing/bug-2621-holder-investigation.md (on the #4167 branch).'
