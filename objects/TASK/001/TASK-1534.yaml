title: 'aida worktree gc: use the landing-commit trailer check so batch-landed branches are no longer ''no merge signal'''
description: 'Follow-up from BUG-1657. doctor_cmd''s worktree gc always sets spec_trailer_on_main = false. Acceptance: 1. worktree gc computes the field with session_reap''s spec_trailer_landed_on and applies the same content proof (patch-id or merge-tree no-op). 2. Fixture test: a batch-landed branch is reported reclaimable; one with an unshipped commit is not.'
