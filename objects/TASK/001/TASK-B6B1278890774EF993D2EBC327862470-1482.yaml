  pr_train.rs:626 records a culprit hold for a single-member InfraRed that has already used its one rerun ('no test result after one rerun'), so a repeated infrastructure failure holds the PR at an unchanged head until someone names it. That matches the existing ejection semantics but may hold PRs for runner outages. Follow-up: consider not recording infra-only reds as culprits.
