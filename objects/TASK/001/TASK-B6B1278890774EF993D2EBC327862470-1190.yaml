title: 'Review follow-up: aida-cli-lib/src/admission_owner.rs tests: three new tests depend on sub-second scheduling'
description: |-
  From BUG-2703
  Reviewed sha: 3299d3f57e360284ec651a031f1943cec6ef4be4

  aida-cli-lib/src/admission_owner.rs tests: three new tests depend on sub-second scheduling margins and can fail on a loaded full-suite shard. bug2703_one_second_bound_acquires_a_holder_released_after_registration requires the whole acquisition inside a 1 s bound after a helper thread polls for the intent, sleeps 150 ms and drops the claim; bug2703_registration_wait_does_not_extend_the_bound relies on 300 ms and 500 ms windows around a 3 s deadline; bug2703_one_second_bound_refusal_names_the_current_holder shares the 1 s bound. The CI run at this head was the fast tier (test shards skipped), so none of these has run in CI yet. Widen the margins (a longer bound with the same proportions) or make the handoff event-driven.
