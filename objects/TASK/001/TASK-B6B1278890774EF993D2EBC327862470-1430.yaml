description: |-
  From BUG-2763
  Reviewed sha: 14a5d0f2168490d925f2cf18dc924ac3a987b637

  review_watch.rs:1654. The moved-head predicate includes retryable fetch failures whenever they inherited setup_retry, even though the existing setup-hold branch excludes retryable_fetch and retry accounting is per head. The fast path through execute_reservation in story_2401_review_exhausted_fetch_is_capped_per_head records the still-running test process as dispatcher, so its expected new-head dispatch at task_1993_review_watch_tests.rs:2986 now statically resolves to EXIT_ALIVE. Keep the fetch cap scoped to the old head and retain the coverage in cargo test -p aida-cli-lib story_2401_review_exhausted_fetch_is_capped_per_head.
