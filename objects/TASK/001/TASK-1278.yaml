  content: 'Architecture sketch (Codex): introduce a shared ResolvedProtocol renderer in aida-core that loads optional META tags protocol:<type> and protocol:lane:<lane>, emits deterministic labeled layers in precedence order (type then lane, with spec acceptance remaining authoritative at injection sites), and enforces one shared 40-body-line budget across protocol layers. Extend protocol show with --lane and make CLI/MCP both call the same renderer so resource bytes match CLI stdout. Register aida://protocol/{type} and aida://protocol/{type}/{lane} templates/read routing. At headless implementer and reviewer prompt construction, resolve the target spec type plus lane tag, then prepend the same capped block before the existing prompt. Add unit tests for merge/precedence/cap, MCP parity, and prompt construction. Requesting master sign-off before PR per Sketch-First Protocol.'
