title: 'Typed protocols slice 3: lane layer (research, docs, keystone) + MCP resource aida://protocol/<type> + headless implementer/reviewer prompt injection'
description: 'Child of STORY-1221 (typed protocols). After the story lands storage + pickup/notice injection for the TYPE layer, this task adds: (1) the optional LANE layer (protocol:lane:research, protocol:lane:docs, protocol:lane:keystone) with precedence type < lane < spec ## Acceptance and each injected line tagged with its layer; (2) the MCP resource aida://protocol/<type> (and /<type>/<lane>) mirroring aida protocol show, so MCP-native clients see the same text; (3) headless drains prepend the resolved protocol (same 40-line cap) to the implementer and reviewer prompts. Acceptance: aida protocol show spike --lane research prints the merged text with layer tags; the MCP resource returns byte-identical text to the CLI; a headless drain''s implementer prompt file (.aida/headless-logs) shows the protocol header; the cap holds; unit tests on precedence merge and cap.'
