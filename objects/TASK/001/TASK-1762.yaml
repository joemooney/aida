title: 'History list views follow-ups: when without tz in JSON, ''closed'' vs ''aida list closed'' (Done), filter alias/priority validation, human golden test, approved-transition help text'
description: 'Non-blocking from the #2639 (STORY-1664) review: (1) the JSON ''when'' field is local YYYY-MM-DD HH:MM with no offset, while since/until are RFC3339; (2) the ''closed'' view excludes Done but ''aida list closed'' includes it, so document or align; (3) --status closed/open aliases are rejected and an invalid --priority silently returns empty; (4) no human-table golden test, although the acceptance criteria named one; (5) help should say that ''approved'' counts NeedsAttention->Approved and reopen->Approved; (6) verify that renumbering doesn''t make ''opened'' show a renumbered spec as newly filed.'
