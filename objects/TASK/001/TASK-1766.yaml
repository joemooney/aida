title: 'Mention/recipient follow-ups: ignore @tokens inside code spans; warn on all-uppercase handles (@QA silently dropped vs --to QA accepted); store trimmed recipient id; round count after shaless rounds'
description: 'From the #2650/#2647 reviews. (1) extract_mentions (punt_done.rs) ignores backticks, so `@param` / `@dataclass` in comment text still become recipients. (2) The mention parser silently drops all-uppercase handles via the needs-a-lowercase-letter rule, while --to accepts them, so a custom @QA agent would get no mail. Warn, or align the two paths. (3) recipient_id_rejection checks the trimmed id but Recipient::Agent stores the untrimmed one. (4) review_verdict archive_current_round drops shaless previous rounds, so the round count resets to 1 after a PR-keyed handshake write.'
