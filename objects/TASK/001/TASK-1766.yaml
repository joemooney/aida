  content: 'Advisor 2026-10-15: live evidence that this matters. The mailbox list shows phantom recipients created by mentions: ''L'', ''L4425'', ''L4448'', ''-include'', ''33492'', ''BUG-52'', ''EPIC-20'', each with 18-21 unread and 5 urgent, piling up since June. Sources: @-tokens in pasted strace/CI/line-number text (e.g. ''file.rs:L4425'', ''-include'', ''@33492''). Added acceptance: a mention resolves only to a KNOWN agent/role id (registry or roster); an unknown handle is dropped with a warning, never delivered. Spec-ID-shaped and numeric tokens never count as mentions. Add a one-time cleanup that archives the existing phantom inboxes.'
