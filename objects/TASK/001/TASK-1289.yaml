- id: 01a0c1c8-cf14-7563-a359-7e6b733a0502
  author: joe
  content: '[aida:advisor] LINEAGE ITEM a2 WIDENED 2026-09-20 19:27 TO THREE LEGS. A destructuring bind in the test does not reach the other two sites that enumerate the same phase set independently. THREE sites enumerate it: (1) the express force-off block, which clears no_ci_wait / no_review / no_build and not no_preflight; (2) the test''s three-field conjunction; (3) banner_summary()''s hardcoded string ''express tier - full gate (CI + reviewer + build)''. Fixing (2) alone leaves (1) and (3) able to narrow independently the next time a field is added. SO a2 IS: a2i force-off derived from the field set rather than a hand-written list of three assignments; a2ii the test''s conjunction replaced by a destructuring bind over every field so a new field breaks compilation; a2iii banner_summary() DERIVED from the skip set, or its express branch falling through to the parts-building path so a residual skip is still named. a2iii is the one that cannot be deferred: the banner is USER-FACING and currently tells the operator ''full gate'' for a spec whose preflight is skipped, while active_tokens() on the same struct emits ''no-preflight'' - the two surfaces contradict each other, and the truthful branch at the parts-building path is unreachable for any express spec. A hardcoded summary string is also the only one of the three that no compiler or test can catch, because there is no field whose omission is detectable. Raised by the reviewer seat while verifying the fourth surface.'
