- id: 01a0c1cf-8b30-75c2-b7ee-be570f8b6093
  author: joe
  content: '[aida:advisor] LINEAGE ITEM a2 REVISED AGAIN 2026-09-20 19:36: a2i, a2ii and a2iii ARE ONE CHANGE, not three legs. The earlier note treated the banner as a separate repair on the grounds that a hardcoded summary string is uncatchable by any compiler or test. That is true of the string''s current shape and false of the situation. The five skip fields are hand-enumerated in SEVEN production sites in auto_complete.rs - from_tags match arms, the trivial expansion, the express force-off, is_empty(), active_tokens(), RECOGNIZED_LIFECYCLE_TAGS, and banner_summary()''s parts - so adding a field needs seven correct hand edits and the compiler checks none, every site being an if-over-a-bool rather than a match over a sum type. REVISED a2: one table, const SKIPS: [(accessor, token, human); N], with is_empty(), active_tokens() and banner_summary() ITERATING it, plus one destructuring bind in the test so a sixth field breaks compilation at one known site. The banner then cannot omit a field because it no longer names fields, and the hardcoded express string becomes a prefix on a derived list rather than a replacement for one. CONSEQUENCE FOR SEQUENCING: shipping the force-off fix and the test bind while deferring the banner is NOT a partial fix - it leaves the only OPERATOR-FACING surface hand-maintained, which is the one surface where a divergence is invisible to the person it misleads. Also note the two surfaces use different vocabularies for the same fields - active_tokens emits ''no-preflight'', the banner says ''implementer preflight'' - so a substring property test between them cannot work either. Raised by the reviewer seat with a detector that reproduces: grep -oE ''no_(preflight|ci_wait|review|build|harvest)'' | sort | uniq -c gives 7/7/7 against 5/5, a two-item candidate list from seven sites.'
