- id: 01a0ba87-d3de-7112-b943-ba63f85d30a3
  author: joe
  content: '[advisor:groom] Approved, high, DRIVE (merge at the advisor gate). Rationale for drive rather than drain: a guard that refuses to open a PR sits in front of EVERY wave, so a misfire halts all throughput at once — the same class as TASK-1285''s build guard, which I also gated. The failure mode is loud rather than silent, which is why it is drive and not guided. Evidence confirmed from my side: I sent #1952 back for hard-coded temp paths, #1959 for the undocumented hidden dev build-guard subcommand, and BUG-1244 round 3 for the portability ratchet — three of the five cited rounds passed through my gate, each costing a fresh implementer session plus a full CI cycle for something that runs locally in seconds. Scope guards: (1) the guard list is READ FROM .github/workflows/ci.yml or from [preflight] config, never hand-copied, so it cannot drift — that is the whole point; (2) the refusal names the failing guard, the offending line and the remediation command, so the implementer can fix it without a round trip; (3) lifecycle:no-preflight opts a spec out and the escape must be honoured, because a genuinely unrelated change should not be blocked by an unrelated guard; (4) the guards run in the WORKTREE, not the main checkout. Do not add guards CI does not run — parity is the contract.'
