- id: 01a0de74-e77b-7963-9e3f-3dda98e2161d
  author: joe
  content: 'PROXY DECISION (orchestrator for Joe) on the review (REQUEST CHANGES): (1+3) the pre-commit hook TEMPLATE keeps the OLD rule (block only bare IDs and trace: markers on /// lines). The ''no spec ID in prose'' rule stays in the cli.rs help guard (the CI test) only, NOT the hook that ships to user projects. (2) Add word boundaries (^|[^A-Za-z0-9_]) to the hook''s ID pattern, and keep the hook and cli.rs patterns genuinely in lockstep (or document the difference). Add a hook test: prose mentions ADR-12, FR-1-042, DEBUG-2, SCR-4 in a non-CLI .rs file pass, and a bare trace marker on /// is still blocked. (4) Nits: session end help uses a placeholder example (e.g. task-<n>); reword the lock help without ''early slice'' internal-speak; add DOC to both ID patterns. Then a fresh re-review.'
