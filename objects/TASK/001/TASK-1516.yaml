title: Remove internal spec IDs embedded in prose of user-facing clap help (~20 /// lines in cli.rs) and tighten the help guard
description: 'From BUG-1652: the existing guards (cli.rs source_doc_comments_carry_no_spec_id_provenance, BUG-629) reject only bare SPEC-IDs or trace markers on /// lines. SPEC-IDs inside descriptive prose are allowed by design, so user-facing --help still shows internal IDs at cli.rs ~909 (TASK-5), 1151 (STORY-711/BUG-637), 1539 (TASK-489), 2800-2804 (STORY-716/742/714), 2820 (STORY-88), 3649 (DOC-3), 4738 (STORY-21), 9610 (TASK-1), 9650 (ADR-3/ADR-7), 11517 (STORY-720), 11588 (TASK-123), 13025 and 13627 (STORY-42), 14000 (TASK-0424), 14170/14199 (TASK-1055). Reword each, keeping IDs that name real user-visible artefacts only if explicitly for developers/operators, and extend the guard to prose-embedded IDs, with an allowlist for deliberate developer-facing help.'
