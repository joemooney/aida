title: 'Discipline: lane briefs and specs target <=300 changed lines and 1-2 ACs; split larger work before launch'
description: |
  Advisor-122 standing rule (2026-11-22 20:40 MST; filed by product-15): every new brief and spec targets <=300 changed lines and 1-2 acceptance criteria. Anything larger is split into vertical slices BEFORE launch (aida-decompose). Evidence: today's large PRs (#4388 BUG-2688, 20 files, 5 rounds then parked; #4373 TASK-3826 parked; #4381 TASK-3827 parked; #4395 BUG-2714 parked) did not converge under strict review, while small ones (#4399 BUG-2716, #4391 BUG-2711) approved in 1-2 rounds.

  ## Acceptance
  - AC1: The template master's product-role guidance and the rework/brief-craft discipline (aida-core/templates/, then `make sync-templates`; `make check-templates` passes) state the rule: <=300 changed lines and 1-2 ACs per lane brief or spec, split into vertical slices before launch otherwise, with the one-line rationale.
