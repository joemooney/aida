title: 'Pre-flight retraction: treat a PR as ours only if its author is the agent identity (add author to ChangeMetadata)'
description: 'Follow-up from TASK-1529. Acceptance: 1. ChangeMetadata carries the author login (GitHub/GitLab); 2. retraction skips a PR whose author differs from the agent''s forge identity even when it appeared after the pre-launch snapshot; 3. fake-forge tests for same-branch operator PR opened mid-phase (not retracted).'
