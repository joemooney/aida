title: aida init --refresh only covers the memory pack — extend it to skill/command/codex+antigravity prompt packs so template fixes (BUG-731/TASK-1162) reach existing installs without --force
description: |-
  Operator ask 2026-07-21: 'I need codex to have the same/similar skill set.' Root gap: codex's ~/.codex/prompts/aida-guided-implement.md is the stale Jul-7 version (0 $ARGUMENTS placeholders, still references AskUserQuestion) — so codex didn't recognize /aida-guided-implement TASK-1169. The CONTENT fixes shipped (BUG-731 rewrote the codex prompt pack for arg-substitution + vendor-neutral language; TASK-1162 wired guided vendor parity) but there is NO WAY to deliver them to an existing install: `aida init --agent codex` is idempotent (won't overwrite existing files), and `aida init --refresh` covers ONLY the memory pack. The only refresh path is `--force` (overwrites everything incl. user edits; also unsafe in the dev repo per BUG-718).

  Fix: extend the marker-driven, edit-preserving --refresh mechanism (already built for the memory pack: overlay updated pack files whose body-checksum is unchanged, leave edited files alone) to ALSO cover:
  - .claude/skills/ + .claude/commands/ (Claude)
  - ~/.codex/prompts/ (codex)
  - .antigravity/skills/ (antigravity)
  So `aida init --refresh` (or a scoped `--refresh-prompts` / `aida scaffold refresh`) brings ALL agent packs current with the embedded templates, preserving local edits, without --force. This is the sustainable cross-vendor parity mechanism — every future template fix reaches codex/antigravity the same way it reaches Claude.

  Acceptance:
  - `aida init --refresh` overlays updated skill/command/codex-prompt/antigravity files whose bodies the user hasn't edited (checksum match), leaves edited/unmarked files untouched — same contract as the memory pack refresh.
  - After refresh, ~/.codex/prompts/aida-guided-implement.md matches the current template (has $ARGUMENTS, vendor-neutral).
  - Files carry a scaffold-checksum marker (like the memory pack) so edit-detection works.
  - No --force needed; safe in the dev repo (respect the BUG-718 symlink hazard — refresh must not overwrite through symlinks).
  - Docs: the parity story in the codex/antigravity setup docs.
