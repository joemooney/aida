title: Create a cold-reader positioning path for agent migration audiences
description: |-
  Follow-up from TASK-0426. Review docs/positioning/README.md, docs/positioning/agent-decision-matrix.md, and related hub pages for readers comparing Claude Code, Codex CLI, and other coding-agent tools without prior AIDA context.

  Acceptance:
  - Add or revise a short path that explains where AIDA sits in the agent landscape without assuming internal project knowledge.
  - Clarify the adopt / do-not-adopt threshold using the same durable-shared-state framing as the Codex migration guide.
  - Preserve the agent-agnostic vs per-agent-convenience distinction from docs/aida/discipline/agent-agnostic-vs-claude-specific.md.
  - Link outward to deeper comparison docs instead of duplicating every neighbor analysis.

  BINDING CONSTRAINT (advisor re-scope 2026-08-29): execute in the champion-product framing — AIDA presented as the agent-collaboration layer (stable spec IDs, typed relationships, code-to-spec traces, cross-vendor coordination), stated as product strengths. No "research-grade" / "work-in-progress" identity language. Precise claims only (state the precise open slice; never overclaim). Vendor-standardization motivations stay generic — never tied to any specific employer.
