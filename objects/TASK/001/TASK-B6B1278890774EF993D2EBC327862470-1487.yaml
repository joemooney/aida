title: 'Review follow-up: The breach kill in run_watched is incomplete. guard() returns as soon as the direct child '
description: |-
  From BUG-2768
  Reviewed sha: e430c0baf88df0c260070b7093e640e9838d6a29

  The breach kill in run_watched is incomplete. guard() returns as soon as the direct child exits after SIGTERM, so group members that survive SIGTERM (nextest's test processes or rustc) are never sent SIGKILL. A runner cancel or timeout SIGTERMs python, which dies without raising BaseException, so the start_new_session cargo group is not signalled at all. Both cases rely on the Actions runner's orphan-process cleanup. Consider always sending SIGKILL to the group after the grace period, and installing a SIGTERM handler that forwards to the group.
