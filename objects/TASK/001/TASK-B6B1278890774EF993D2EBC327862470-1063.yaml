title: 'Crate-split PR5: extract aida-term and aida-cmdkit leaf crates (re-exports keep every path)'
description: 'Per SPIKE-713 (docs/plans/2026-11-07-aida-cli-lib-crate-split-deep-dive.md) section 5.1-5.2 and section 7 row 5; EPIC-613 step 3. Acceptance: (1) new crate aida-term holds glyphs, glyph_config, toon, output_format, cache_output, git_arg_guard, process_retry, network_retry, usage with no clap and no dependency on aida-cli-lib; glyph_config takes the project root as a parameter; the gate->git_arg_guard and usage->cli edges are inverted. (2) new crate aida-cmdkit holds the cmdkit framework types, GlobalArgs, spec_arg and stakeholder_role (AddArgs coupling broken per 5.2); REGISTRY stays in aida-cli-lib. (3) aida-cli-lib re-exports keep all existing crate:: paths, so no importer line changes. (4) ledgers (exec-context-legacy.json, store-writers.toml, config-trust.toml) rewritten with scripts/relocate-ledger-paths.py in the same PR. (5) dell1 clean build and one-line-edit rebuild timed before and after, recorded on this spec. Two PRs (term, then cmdkit) are acceptable.'
