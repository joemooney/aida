title: 'review-watch reclaim: check pause and the retry cap before reclaiming; a capped PR surfaces with a next step; a real-subprocess reclaim test (BUG-2776 follow-up)'
description: |
  BINDING follow-up to BUG-2776 (advisor-122 2026-11-26 11:48 + 12:55; filed by product-15). #4678 landed on the reviewer's final approval with these deferred. The residual defect: a paused or capped review-watch can still end a CLEAN reviewer checkout, and a capped PR stays silently held.

  ## Acceptance
  - AC1: check pause AND the pickup retry cap BEFORE any reclaim; a paused or capped watcher NEVER ends a checkout.
  - AC2: when the cap is hit, the PR goes to the BUG-2776 AC3 doctor surface with a named next step, never a silent hold; a successful reclaim followed by a successful pickup RESETS the cap.
  - AC3: ONE test of the REAL reclaim path with a fake `aida` on PATH: assert the argv `session end <lease> --yes --skip-ci`, and handle a NON-ZERO exit (no dispatch, the hold kept, a named cause). No network. Plus tests: paused → no reclaim; capped → no reclaim + surfaced; reclaim + pickup → cap reset.
