- id: 01a219be-e28b-7092-94a4-ece7d8277ae3
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 34653344c1 (git diff origin/main...HEAD, 5 files, +173/-27).

    Acceptance evidence:
    - AC1 [behavioral-test]: review_watch.rs select_with_probes reads pause::current and the cap (pickup_retries >= 3) before reclaim_tree and skips it when either holds. Test bug2776_reclaimed_leftover_dispatches_the_moved_head_in_the_same_pass: paused and capped passes use a reclaim closure that panics if called; both pass.
    - AC2 [behavioral-test]: a capped held tree becomes Admission::Held{retained:true, why:'pickup retry cap reached'}, so watch_pass adds it to the retained list. retained_blocks surfaces a PICKUP_RETRY_CAP cause at once with the fix line, which feeds landing_drought::retained_findings (doctor). Unit test bug2776_retained_checkout_block_surfaces_after_thirty_minutes covers it. Reset: the new RetainedReview::Reclaimed makes the retry due in that pass, the dispatched attempt gets pickup_retries == 0, and setup_retry stays true. Covered by the same select test.
    - AC3 [behavioral-test]: task_3921_real_reclaim_runs_session_end_and_keeps_the_tree_on_refusal runs the real reclaim_retained_review_tree with a recording fake aida that exits 3. It checks argv 'session end <lease> --yes --skip-ci', the result Kept('reclaim check failed: session end refused: seat busy: lease in use'), and that the tree and lease file are still there. A fake gh means no network. The fake is injected through the aida_exe_path seam (kernel::test_aida_exe) because aida_exe_path does not consult PATH.
    - Lane job: 6 targeted tests passed (bug2776/bug_2776/task_3921/bug2720_exited). make check-ci-fast exit 0.

    Probes: P1: the cap string is now a single const shared by the refusal and the surfacing filter, so the two cannot drift. P3: a reclaim during a backoff pass would otherwise not reset, so a reclaim now makes the retry due. P5: the refusal paths (paused, capped, non-zero session end) are each tested. No existing test was weakened. The BUG-2776 test's post-end assertion moved from Free to Reclaimed, and a second call still asserts Free.
    Residual risks: the no-dispatch-on-refusal check is made at the reclaim-function level (Kept). The select-level Kept leads to a held skip, which is covered by the existing dirty case and not driven through the subprocess. A pause set between the snapshot and the reclaim is the same race the launch check already had.
