  author: joe
  content: 'Reviewer round 3 on PR #1942: TASK-1271: CLI inbox and MCP mark_seen call record_seen for every message in the full inbox before advancing the watermark. On the first post-upgrade read, messages already at or below the prior watermark receive a new receipt timestamp, so max_read_latency_ms reports now-sent_at rather than an actual recorded read latency. Capture receipts only for messages newly acknowledged past the pre-read watermark (while still advancing the watermark to the newest), and add a regression test with an existing watermark proving old read messages are not backfilled.  Concretely: in both the CLI inbox path and MCP mark_seen, compute the pre-read watermark first and call record_seen only for messages sent after it (newly acknowledged); messages at or below the prior watermark get no receipt, so max_read_latency_ms never reports now-minus-sent_at for history. Add a test: a mailbox with two old (pre-watermark) and one new message → exactly one receipt recorded, latency computed from the new one only.'
