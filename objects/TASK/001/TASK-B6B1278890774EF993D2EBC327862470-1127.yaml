title: 'Fix-forward: make bug_2684_floor_reclaims_ended_overlays_by_ownership assert only its own fixture bytes (flaky 32 != 48 on main)'
description: |
  Fix-forward for a flaky main test, advisor ruling 2026-11-19 (second recurrence today).

  bug_2684_floor_reclaims_ended_overlays_by_ownership (landed with #4277) intermittently fails on main CI with
  "freed 32 != 48" (main runs at b820668 ~10:20 MST and fd4018a ~14:40 MST). The assertion compares a host-wide freed-bytes total,
  so other overlays or concurrent cleanup on the runner change it.

  Acceptance:
  1. The test asserts only on its OWN fixture's overlays: each fixture overlay owned by an ended lane is removed and its exact
     bytes are counted, and overlays it did not create are ignored (no host-wide freed total in the assertion).
  2. The ownership semantics under test are unchanged; no production code changes.
  3. The test passes 20/20 in a loop locally (one targeted cargo run) and is green on its PR's full tier.
  Test-only, codex lane, FASTTRACK review. Trailer (Refs BUG-2684) is NOT used; this task completes on its own.
