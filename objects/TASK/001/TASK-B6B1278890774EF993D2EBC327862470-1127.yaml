    # Brief: TASK-3821 (fresh start; advisor-121, TOP priority, unblocks autopromote)

    Test-only fix-forward for the main flake worktree_lifecycle_gc::tests::bug_2684_floor_reclaims_ended_overlays_by_ownership (aida-cli-lib/src/worktree_lifecycle_gc.rs ~:2432). It failed twice on main today with `freed` 32 != 48 (runs 44572712812 and 44617559510).
