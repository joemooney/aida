  content: 'Product 14:44: codex lane queued on dell1 (top priority), brief:

    # Brief: TASK-3821 (fresh start; advisor-121, TOP priority, unblocks autopromote)


    Test-only fix-forward for the main flake worktree_lifecycle_gc::tests::bug_2684_floor_reclaims_ended_overlays_by_ownership (aida-cli-lib/src/worktree_lifecycle_gc.rs ~:2432). It failed twice on main today with `freed` 32 != 48 (runs 44572712812 and 44617559510).

    Change the test so it asserts only on the bytes of ITS OWN fixture overlays (ended, another-ended, stale.unknown), not on the host-wide freed total that other overlays and timing can perturb. Keep every existing eligibility/reason assertion.

    NO production code change.

    Prove stability: run the test in a 20/20 loop (e.g. `for i in $(seq 20); do cargo test -p aida-cli-lib --lib bug_2684_floor_reclaims_ended_overlays_by_ownership || break; done`) and quote the result in the PR body.

    Trailer: (TASK-3821). FASTTRACK review.

    Before pushing, run `python3 scripts/check-store-writers.py`.'
