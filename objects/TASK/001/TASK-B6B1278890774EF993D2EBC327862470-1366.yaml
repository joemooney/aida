title: 'Review follow-up: init_cmd.rs:5326–5333. Propagating the optional native prompt error with ? converts an exi'
description: |-
  From BUG-2752
  Reviewed sha: d4a4583e95c8cf22a43aa1b9ad40fa5c177b838c

  init_cmd.rs:5326–5333. Propagating the optional native prompt error with ? converts an existing warning into a partial-init failure after storage and scaffolding have already succeeded. For example, an initialized project with a valid inline root contained table is readable by the policy loader but rejected by offer_init_codex_native before consent. Interactive init now exits before role setup, registry registration and other remaining setup. Preserve a clear opt-in error and continue the independent init steps as the previous caller did.
