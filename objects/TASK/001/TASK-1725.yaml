title: Link ADR-73 (advisor merge authority) from the vendor-neutral two-seat discipline docs
description: |
  Add a short 'Advisor merge authority' section to aida-core/templates/.aida/discipline/two-seat-protocol.md stating the ADR-73 conditions in brief (independent APPROVE at head; green CI on the pinned head; no holds; no recorded authorship by the advisor; signoff for sensitive changes; audit comment). Note the slice-stack exception until STORY-1663, and that enforcement arrives with BUG-1918. Then run make sync-templates and make check-templates. Docs-only; fasttrack lane.

  ## Acceptance
  - two-seat-protocol.md (template master) has an 'Advisor merge authority' section listing the six ADR-73 conditions in one line each and linking ADR-73.
  - The section states the slice-stack exception (until rebase-merge support lands) and that mechanical enforcement is pending.
  - The section is vendor-neutral (no Claude-specific wording).
  - `make sync-templates` has been run and `make check-templates` passes.
