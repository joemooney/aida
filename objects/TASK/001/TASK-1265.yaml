title: 'Rework no-op guard: make the unchanged-head predicate content-based (git diff / git cherry, SHA compare as fast path) so a rebase-only or amend-only round is still a no-op'
description: |-
  Split out of BUG-1213 (#1924) by the advisor at the drive gate on 2026-09-18 so the guard could land; both were items 3 and 4 of the round-2 rework and are not in the merged PR.

  1. Round number: derive_queue_work_prompt calls rework_pickup_prompt(findings, pickup, 2) — the round is hardcoded. Compute it as 1 + the number of prior `[rework` comments on the spec (or recorded request-changes rounds in .aida/review-verdicts history), so the prompt header and the rework-no-op failure text read "ROUND 3/4" truthfully. Test: a spec with two prior [rework] comments yields ROUND 3.

  2. Content-based no-op predicate: RealPhaseDriver::rework_no_op_failure compares the PR head SHA captured in begin_rework_guard with the head after phase 1. An implementer that only rebases onto main, or amends without changing the tree, moves the SHA with no new work and slips past the guard (the BUG-1207 round-4 shape, where the auto-rebase had already changed the head). Make the predicate: no-op when `git diff <before> <after>` is empty (tree-identical) OR when `git cherry <before> <after>` reports no `+` commits (nothing patch-unique after the snapshot); keep the SHA equality as the fast path. Reuse the patch-id helpers the force-push guard already has (pr_rebase / branch_unshipped_patch_count_default). Tests: fixture repo where the branch is rebased with no new commit → no-op; a genuine new commit → not a no-op.

  Acceptance: both tests green; the existing rework_no_op_is_shelvable and unchanged_rework_head_shelves tests unchanged; prompt header shows the computed round.
