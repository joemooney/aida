- id: 01a1f153-6c47-7202-a2f3-7e8ba41490cd
  author: joe
  content: |-
    Product 2026-11-18 18:03, deployed on dell1 (Joe approved the trimmed variant).
    - Backup: dell1:~/lane-run.sh.bak-20261118-pre-TASK-3819 (the previous 49-line wrapper).
    - New ~/lane-run.sh, installed by atomic mv so running lanes keep the old inode. It runs the tracked wrapper (bash ~/ai/aida/scripts/lane-run.sh SPEC --role implementer --no-human --vendor V ...; the tracked file is not +x on dell1, so it's called via bash). It contains ZERO aida ship calls: both auto-publish branches (ship --commit-pending of seat edits; ship of committed-but-unpushed work) are removed. It now only logs 'NOT PUBLISHED by wrapper (TASK-3819/BUG-2648)' when a seat holds unpushed work.
    - Kept host plumbing the tracked script lacks: PATH for non-login ssh, umask 022, pre-launch store sync/pull/push (prevents 'store pull refused: uncommitted changes'), post-lane store sync, and end-finished.sh lease cleanup (it ends a lease only when the seat is pushed, clean and process-free, otherwise KEEP).
    - Smoke test: bash scripts/lane-run.sh --help reaches aida queue work.
    - imac check: no auto-publish wrapper (no ~/bin/auto-publish*, no script calling ship --commit-pending, no cron entry, no running process).
    Known cost: work AIDA does not publish itself now stays on the seat. That's the BUG-2648 intent; the stall check and lane logs surface it.
