title: Deploy the tracked scripts/lane-run.sh (BUG-2648) on dell1 in place of the hand-written ~/lane-run.sh, and confirm the primary host has no auto-publish path left
description: 'Operational remainder of BUG-2648 (code landed via #4216 at 325920e, full review clean). (1) On dell1, replace ~/lane-run.sh with a link to, or exec of, the repo''s tracked scripts/lane-run.sh, keeping backups. It delegates to aida queue work and never publishes after a punt, refusal or crash (allow-list: publish only on pushed, or a clean exit with unpushed commits). (2) Confirm the primary host (imac) has no equivalent wrapper that publishes seat clones unconditionally. (3) Record evidence: diff of the host scripts and one lane run showing a punt does not publish. Product seat / operator host maintenance.'
