- id: 01a1340c-b5f7-71a0-8cd4-86239838f092
  author: joe
  content: |-
    FACTORY PLAN (antigravity):
    • Approach:
      1. Statusline drift contract test: Extract the drift segment rendering logic in statusline_cmd into `primary_checkout_drift_statusline_segment(drain_root: &Path) -> Option<String>` and wire it into `handle_statusline_command`. In `statusline_tests.rs`, add a contract test pinning the exact rendered segment for both clean checkouts (None) and drifted checkouts (exact red bold "⌂!", or plain "⌂!" when uncolored) across untracked, tracked-dirty, off-main, and behind-upstream states.
      2. Timing test load independence: In `tests/test_session_context_drift.sh` Section 7, warm up both probe paths, increase sample runs to 10 to smooth outlier jitter, and adopt a generous 250ms threshold with an explicit explanatory comment explaining CI runner load resilience without sacrificing protection against unbounded regressions.
    • Files and functions to change:
      - aida-cli-lib/src/statusline_cmd.rs: extract and call `primary_checkout_drift_statusline_segment`
      - aida-cli-lib/src/tests/statusline_tests.rs: add `statusline_drift_segment_contract_for_clean_and_drifted_checkouts`
      - tests/test_session_context_drift.sh: update Section 7 timing test with warmups, 10 samples, generous 250ms bound, and explanatory comment
    • Tests to add / verify:
      - statusline_drift_segment_contract_for_clean_and_drifted_checkouts (new Rust unit contract test)
      - bash tests/test_session_context_drift.sh (verified 20 consecutive times under parallel test load)
      - make check-ci-fast
    • Risks:
      - Thread safety in tests: avoiding cwd modification by passing &Path to the drift segment function.
      - Colored override leakage: ensure colored override is reset after tests.
    • Acceptance mapping:
      - Contract test asserts exact drift segment for drifted and clean: verified by `statusline_drift_segment_contract_for_clean_and_drifted_checkouts`
      - Timing test uses generous bound with explanatory comment: verified by `tests/test_session_context_drift.sh` section 7
      - 20 consecutive runs pass under parallel test load: verified locally via parallel loop
  created_at: 2026-10-13T06:56:50.679784909Z
  modified_at: 2026-10-13T06:56:50.679784909Z
