title: STORY-1648 status-line drift wiring has no contract test, and its timing test may flake on loaded runners
description: 'Noted by the fresh reviewer of PR #2523 (STORY-1648), non-blocking. (1) No contract test pins the status-line output for the primary-checkout drift indicator (the format a statusline script consumes). (2) The timing assertion in the new test can flake under CI load. Acceptance: a contract test asserts the exact drift segment for drifted and clean checkouts; the timing test uses an injected clock or a generous bound with a comment explaining it; 20 consecutive local runs pass under parallel test load.'
