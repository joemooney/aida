  content: 'ADVISOR DISPOSITION (advisor-122 13:27): APPROVED, HIGH, standard, drain. Evidence: /var/cache/aida-ci reached 255G (incremental target-v2 dirs, never pruned) and took the imac root to 90%. Prune is bounded (size + age), skips while a CI job holds the cache (lock or job check), and alerts at a configurable size. One slice, at most 300 lines.'
