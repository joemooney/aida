title: 'Bound the local GitLab CI target cache (/var/cache/aida-ci): prune stale incremental dirs, alert above a size cap'
description: |
  Joe 2026-11-25 12:39: "I am 90% full on / on this computer" (the imac primary, 915G). The cause was the local GitLab runner cache /var/cache/aida-ci (255G): target-v2-0 and target-v2-1 (one per CI_CONCURRENT_ID) with CARGO_INCREMENTAL=1 (STORY-1216, deliberate for speed) grow without bound; debug/incremental alone was 64G + 55G. Product-15 deleted both incremental dirs while no CI job ran: / went from 90% to 77%, 205G free. It will regrow.

  ## Acceptance
  - AC1: a bounded prune for the CI target cache: incremental session dirs older than N days (or LRU above a size cap) are removed when no CI job is running, with a configurable cap and age (defaults e.g. 60G per slot, 7 days).
  - AC2: the existing disk-headroom-guard (or doctor) reports /var/cache/aida-ci size and alerts above the cap, so this never reaches 90% silently again.
