    READ: `aida show TASK-3910` (evidence: /var/cache/aida-ci/cache/target-v2-{0,1} grew to 255G, with debug/incremental 64G+55G; CARGO_INCREMENTAL=1 is deliberate per STORY-1216, .gitlab-ci.yml ~line 75).
    AC1: a bounded prune: remove incremental session dirs older than N days (default 7), or LRU above a per-slot cap (default 60G), ONLY when no CI job is running (e.g. a pre-job step in .gitlab-ci.yml scoped to its own CARGO_TARGET_DIR slot, which is naturally race-free, or a runner-host script). Prefer the in-job slot-local prune.
    AC2: the existing disk-headroom guard/doctor reports the CI cache size and alerts above the cap.
    Test the prune logic (a fixture dir tree with old/new incremental sessions). One targeted cargo test run on this host if Rust changes, make check-ci-fast, then publish a NEW PR to main. COMMIT your work.
