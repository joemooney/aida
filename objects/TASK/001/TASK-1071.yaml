title: 'Recurring glyph-registry gaps: info/notice glyphs (ⓘ ℹ ⦿ 📨) used raw won''t honor AIDA_GLYPHS=ascii — add them to the registry or have glyph-lint flag new raw glyphs'
description: |-
  The info/notice glyphs (information, notice, bullet-notice, mailbox) are emitted raw in some code paths, so AIDA_GLYPHS=ascii does not downgrade them. Route them through the glyph registry and guard against future raw glyphs.

  ## Acceptance
  - THE information, notice, bullet-notice, and mailbox glyphs SHALL each be registered in the glyph registry with an ascii fallback.
  - WHEN AIDA_GLYPHS=ascii is set, THE rendered output SHALL emit the ascii fallback for each of these glyphs.
  - WHEN a raw glyph literal is not resolved through the glyph registry, THE glyph-lint check SHALL flag it.
  - A test SHALL assert that with AIDA_GLYPHS=ascii set, none of these four glyphs appear as raw unicode in the rendered output.
