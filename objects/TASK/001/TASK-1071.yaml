title: Info/notice glyphs render raw and ignore AIDA_GLYPHS=ascii — register them and have glyph-lint flag raw glyphs
description: |-
  The info/notice glyphs (information, notice, bullet-notice, mailbox) are emitted raw in some code paths, so AIDA_GLYPHS=ascii does not downgrade them. Route them through the glyph registry and guard against future raw glyphs.

  ## Acceptance
  - THE information, notice, bullet-notice, and mailbox glyphs SHALL each be registered in the glyph registry with an ascii fallback.
  - WHEN AIDA_GLYPHS=ascii is set, THE rendered output SHALL emit the ascii fallback for a glyph in this set.
  - WHEN a raw glyph literal bypasses the glyph registry, THE glyph-lint check SHALL flag it.
  - A test SHALL assert that with AIDA_GLYPHS=ascii set, the rendered output contains the ascii fallback for a glyph in this set rather than its raw unicode form.
