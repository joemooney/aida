title: 'Recurring glyph-registry gaps: info/notice glyphs (ⓘ ℹ ⦿ 📨) used raw won''t honor AIDA_GLYPHS=ascii — add them to the registry or have glyph-lint flag new raw glyphs'
description: |-
  The info/notice glyphs (information, notice, bullet-notice, mailbox) are emitted raw in some code paths, so AIDA_GLYPHS=ascii does not downgrade them. Route them through the glyph registry and guard against future raw glyphs.

  ## Acceptance
  - THE info, notice, bullet-notice, and mailbox glyphs SHALL be added to the glyph registry with ascii fallbacks.
  - WHEN AIDA_GLYPHS=ascii is set, THE rendered output SHALL emit the ascii fallback for each of these glyphs, not the raw unicode.
  - THE glyph-lint check SHALL flag any raw glyph not resolved through the registry.
  - A test SHALL assert that with AIDA_GLYPHS=ascii set, none of these glyphs appear as raw unicode in the rendered output.
