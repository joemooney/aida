    ## Findings → remedy

    - F1: `with_store_write_lock` (outermost) calls new `git_ops::ensure_store_hooks_supported` after the safety
      check and BEFORE `f`. It inspects executable in-transaction hooks (pre-commit, prepare-commit-msg, commit-msg,
