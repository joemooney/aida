    ## 8. Non-blocking observations (author/advisor discretion)

    - **N1 — classifier limits.**
      - False negatives: `$(command -v aida) edit …` and `$(which aida) queue add …` pass as "probes"; quoting tricks (`a''ida`) and indirection (sourced scripts, `run-parts`, hook managers) go undetected.
      - False positives: trailing `# aida …` comments, here-doc prose, non-UTF-8 hooks.
      - The shipped exemption accepts any `hooks/*` template body under any hook name. That includes `aida-track-commits.sh`, which runs `aida edit`/`aida comment add`. Key the exemption by hook name → template.
      - An undetected reentry degrades to the existing 60 s lock timeout with a propagated error; it is not a deadlock. The author documented this limit.
    - **N2** — Hook `metadata` errors other than absence are skipped silently. A non-UTF-8 hook is refused as unreadable.
    - **N3** — Reconcile's identity-scrub inputs (`git_out(diff)` → `None`, `read_to_string` errors for hub-without-branch) still fail open. These are pre-existing and hard to trigger, since the tips' objects were already listed.
    - **N4** — `sync_objects` while holding a *different* store's lock commits locally, then `push_exact` refuses. The retained S commit and the error are truthful; consider checking `any_store_write_lock_held` before staging.
    - **N5** — "Committed:" is printed even when `commit` returns `Ok(false)` (Db Sync, push leg). This is pre-existing and cosmetic.
    - **N6** — `push_store_after_id_allocation` keeps one cached collision check before capture. This is documented; local duplicates are otherwise P-protected.
    - **N7** — `maybe_sync_pull` ignores the second-abort result and reduces the error to its first line (pre-existing). There is no abort-failure witness.

