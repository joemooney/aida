    ## F1332-2 — selected algorithms and exact missing composition

    Three families must not be conflated:

    S (ordinary retained history) uses the settled v1 algorithm. Rejection does not invalidate a spec edit or sync commit; reread/rebase current H under store guard, preserving peer objects/history/index, then push a new exact OID outside. Do not return “unchanged” after an already-successful local commit.

    L (true no-origin or documented push=false) executes the existing local intent within one guarded window, commits once, and returns its existing local result. Do not reinterpret a configured-but-unavailable remote as no-origin. Ledger offline retention remains allowed; cross-clone claim offline returns Unavailable, never distributed Acquired. Registration/roster network errors remain errors according to their current contracts. No general new offline authority policy.

    C (conditional remote push-wins) cannot safely leave a speculative commit C on the shared branch and unlock for push. Even “reset exactly C only if current HEAD == C” misses the case where a peer P or auto-push includes C while our push is unresolved; selective revert cannot undo remote ownership or dependent peer work. Therefore this revision explicitly REJECTS relative resets, whole-preimage restoration over H != C, ordinary automatic rebase of a rejected claim, and “keep local speculative claim then just report failure.”

    Selected C algorithm for common-owner disposition: prepare an invocation-private candidate that is NOT reachable from canonical local refs/index/worktree; network-publish that candidate by normal fast-forward Git push; only acknowledged accepted state is eligible for local installation. This is ordinary existing push-wins policy with private preparation, not a new distributed transaction or a promise that remote and local commit atomically. No force push, distributed lease, new authority database or schema. It is a PROPOSED integration contract, not supplied by current signed publisher or authorized for implementation by this sketch.

    1. Under the existing store lock read exact local HEAD L, tree/index and relevant canonical bytes/modes/absence, branch identity, dirty state and semantic intent I. Unknown existing rebase/dirty staged work is preserved/refused according to caller policy, never swept into C. Fetch remote R by the existing safe target mechanism (may stay within the store window); record it separately from L. Pin all required objects in independently owned candidate storage so shared GC cannot invalidate preparation. Release store and all seat/lower critical locks before candidate hook/network work.
    2. In private preparation, combine acknowledged R with the captured legitimate unpublished local history L using the existing supported merge/rebase rules, then recompute the family predicate below BEFORE applying I. No previously rejected speculative C is included in that history. Construct exact produced commit C with known parent/base and intent changes; retain L/R/preimage/C/I and preparation evidence. Private repo/index/worktree must not be the shared store, a ref underneath an ordinary wildcard push, or an object alternate whose lifetime depends on shared pruning. Do not hand-build commit-tree to omit required hooks/gates; common owner must supply a supported prepared-Git step preserving real store message/hooks/config effects.
    3. Immediately before publish, compare current local decision inputs with the captured preimage under the same store lock. Changed relevant local state invalidates preparation: discard private candidate and re-evaluate. Unrelated peer changes remain independent; they are not rolled back. This sample does NOT establish a new authority freeze across network. Existing operations needing fresh authority through remote acceptance must be handled by their already-owned authority protocol; see missing contract below.
    4. Drop the guard and normal-push exact C to the recorded branch. Rejection discards only private C; reacquire/re-read L/current canonical and freshly fetched R, then run the ORIGINAL family decision again. A foreign winner is refused/no-op, not merged away; a fresh nonconflicting intent gets a new candidate. Bound retries by the existing family limits. Peer canonical P is never on our rollback path, and an ordinary sync cannot publish C because C was never placed on its branch.
    5. Success is a remote publication observation, not local atomic installation. Reacquire store lock; reread current H/index and import acknowledged remote state via safe existing merge/rebase, preserving P. Do not reset H to L or C. Recheck applicable current family identity before returning usable ownership; if a newer successor already won, report that state rather than reclaiming it. Publish .aida/node.toml/dispenser identity only against the accepted matching registration/range. Installation failure reports “remote accepted, local install/reconciliation incomplete,” retains exact remote evidence and blocks that operation's claim of local success; it must not undo remote C or manufacture a second attempt.
