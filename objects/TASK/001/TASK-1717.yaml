    ## 4. Numbered blocking findings

    The reproductions below are **source-derived and were not executed by this reviewer**.

    ### B1 (P1) — The F1 hook classifier refuses the default `aida init` hook profile, so every A4 route fails closed on scaffolded projects

    **Where**
    - `aida-core/src/db/store_lock.rs:202–206` `with_store_write_lock` calls `git_ops::ensure_store_hooks_supported` at every outermost acquisition, even for pure captures and no-op windows.
    - `aida-core/src/git_ops.rs:3648` `ensure_store_hooks_supported`; `:3677` `is_shipped_hook` (at `:3730`, a byte-identical comparison to `EMBEDDED_TEMPLATES` after `trim_end`); `:3680/:3743` `aida_writer_call`.

    **What is wrong**
    - `aida init` / `scaffold apply` writes git hooks through `Scaffolder::create_artifact` → `wrap_with_aida_header` (`aida-core/src/scaffolding/mod.rs:585`, `:1251…`). Every `.git/hooks/*` file gets `# AIDA Generated: v… | checksum:…` and `# To customize…` inserted after the shebang, and is then chmod 0755 by `apply`.
      - `include_pre_commit_hook` defaults to `true` (`mod.rs:972`).
      - The installed post-commit fixture in this candidate (byte-identical to the live `.git/hooks/post-commit`, sha256 `7bfca18a…546a`) proves this header form is what actually gets installed.
    - So an installed AIDA pre-commit is **never** byte-identical to the template. It falls through to `aida_writer_call`, which flags quoted prose and the template's own binary-path strings in the shipped `aida-pre-commit.sh`:
      - line 54: `echo "pre-commit: refusing bulk … from an aida binary without …"`
      - line 98: `_dbg="$__aida_repo_root/target/debug/aida"`
      - line 135: `printf '… no aida on PATH …'`
    - The store is a linked worktree. `git rev-parse --git-path hooks` resolves to the project's common `.git/hooks` (observed: `/home/joe/ai/aida/.git/hooks`), so this pre-commit is in scope for every store transaction. The template itself has a store branch at line 40.
    - **Result:** on a project scaffolded with default hooks, the following refuse with "the `pre-commit` hook … runs `aida` … is not a shipped AIDA hook":
      - `aida db sync`
      - `aida pull` / `aida push` (store legs)
      - `aida add` with an origin (the pre-allocation window is unconditional)
      - `aida mailbox sync` and the session-end / drain-end digests
      - `aida db merge-gate`, `--sync` reads, per-write auto-push and `remote reconcile --execute`
    - The same failure follows any version drift between the binary's embedded template and an installed or symlinked template. In this dev repo, pre-commit is a symlink to the main checkout's template, so a binary built from a different template revision refuses every store sync and `aida add`.
    - This violates A3 and the sketch: "Preserve healthy hook effects", "Supported evidence profiles must separately include installed hooks and shipped templates … Do not equate their bytes".

    **Why the tests missed it**
    - The fixture runs `init --no-hooks` (test lines 409–416).
    - `installed_hook_profile_completes` (lines 1155–1166) installs the **template bytes** for pre-commit and commit-msg. That matches only this dev checkout's symlinks, not a scaffolded install.
    - The core test `task_1717_hook_classification` checks only `is_shipped_hook(template)`, never the wrapped form.

    **Reproduction**
    1. In a disposable project, run `aida init` without `--no-hooks` (or `Scaffolder::apply` with defaults), leaving `core.hooksPath` unset.
    2. Write a pending store file.
    3. Run `aida db sync --pull --push`, `aida add x --type task` (with an origin), `aida pull --store-only` and `aida mailbox sync`.

    Source predicts each one exits non-zero with the refusal naming `pre-commit` and line 54.

    **Required outcome**
    - Every supported installed AIDA hook form, including the generated-header copies `aida init`/`scaffold` write (current and supported older scaffold versions), must classify as supported and run with its effects intact.
    - Classification must not treat quoted echo/printf prose or the template's own binary-resolution strings as an `aida` writer invocation.
    - Unsupported custom reentrant hooks still get the named pre-mutation refusal.
    - Whether a drifted, older AIDA-generated hook is supported or refused with explicit upgrade guidance is a product/design choice. Route it to the advisor; do not hard-fail silently.
    - Keep: no hook disablement, no env spoofing, no unlock.

    **Required tests**
    - A CLI witness over a hook profile produced by the real scaffolder (default `aida init`, unset `core.hooksPath`), driving db sync --pull --push, pull, push, add with origin, mailbox sync and merge-gate to success with the pre-commit sentinel, store-pair and trailer effects intact.
    - A core unit test that `wrap_with_aida_header(".git/hooks/<name>", template)` is supported for every shipped git hook.
    - A drift-case witness for whichever disposition is chosen.
    - Keep the existing reentrant and executable-config negatives.

    ### B2 (P2) — The "checked" dirty decision fails open; the push leg reports a mailbox digest as published (and a completed push) without committing it

    **Where**
    - `aida-core/src/git_ops.rs:1299` `has_changes` returns `Ok(!stdout.is_empty())` and ignores `GitResult.success`. `git()` (`:38`) returns `Err` only when spawning fails. A failing `git status` therefore reads as **clean**.
    - The rework presents the windows as checked (`has_changes(store_path)?` at `lib.rs:73564`, `:18038`, the pull leg, and `git_backend_cmd.rs:1192`), but the `?` covers only spawn errors. `auto_push_store_best_effort` (`lib.rs:72540`) still uses `.unwrap_or(false)`. `remote_create.rs:2329` uses `worktree_is_dirty` (`git_ops.rs:2083`), which fails open the same way.

    **Reproduction (push leg)**
    1. Create a disposable project with a local bare origin.
    2. Make the store worktree's index unreadable while HEAD stays readable: `chmod 000 "$(git -C .aida-store rev-parse --git-path index)"`. `git status` now exits 128 with empty stdout; `rev-parse HEAD` and `push` don't need the index.
    3. Place a local mailbox message in `.aida/mailbox/` and run `aida push --store-only`.

    Inside the window (`lib.rs:73552–73577`):
    - `publish_mailbox_snapshot` writes `mailbox/<id>.json` into the canonical worktree.
    - `has_changes` returns `Ok(false)`, so nothing is staged or committed.
    - `report_mailbox_published(n)` prints "published N mailbox message(s) to the canonical store".
    - HEAD is captured and `push_exact` pushes the already-published head ("Everything up-to-date").
    - "store push complete" is printed and the leg exits 0.

    The digest was never committed, yet it is reported as published and the push as complete. This is exactly the false-publication outcome F3 and the F1332-3 mailbox rule ("Failed digest/commit … is not evidence of successful canonical publication") forbid. `auto_push_store_best_effort` likewise prints "auto-pushed aida-store" over uncommitted pending changes.

    **Required outcome**
    - In every A4 window, the pending-changes decision uses a checked status: a failed `git status` is an error carrying git's stderr.
    - Stage, commit and publish then follow each route's existing failure policy: a failed leg for push/pull/db sync, an allocation stop, a best-effort warning plus deferral for auto-push and lifecycle digests.
    - No "Committed", "published", "push complete" or "auto-pushed" message unless the local transaction actually committed.
    - Use the same checked status for reconcile's dirty precondition. Changing the shared helper or adding a strict variant are both acceptable, as long as other callers keep their behavior.

    **Required tests**
    - Unreadable-index witnesses through `aida push --store-only` (with a local mailbox message) and per-write auto-push: non-zero or deferred, no false success text, canonical bytes and HEAD unchanged, origin unchanged.
    - Healthy controls retained.

