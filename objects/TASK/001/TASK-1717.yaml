    Required outcome: preserve historical failures; supply actual B mutation/restoration results, exact source/build-input/profile/environment provenance, immutable CLI/core-test copies and SHA256, and post-restoration four-A/two-B controls. Then fill the missing required route, failure, hook/cache and lifetime witnesses using qualified artifacts and private fixtures. A version string, source header, git checkout restoration or historical run 7 is insufficient. No duplicate cold build, broad suite or independent execution is requested in this checkpoint. Root must notify final evidence before any later focused reviewer probe.

