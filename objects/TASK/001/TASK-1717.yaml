    ## Numbered blocking findings

    All reproductions below are **source-derived proposed private reproductions, not executions by this reviewer**. Some error swallowing/tolerant readers predate this commit; they are identified as carried-forward failures of explicit A4/A3 acceptance, not misrepresented as newly invented regressions.

    ### F1 — Required reentrant hooks are still executed after mutation with no unsupported-profile disposition

    **Priority P1.** `git_backend_cmd.rs::db_sync_local_window` (stage/commit around 1193), `lib.rs::handle_push_command` (73536), and core `git_ops.rs::merge_gate_locked` / `sync_objects` run ordinary Git hooks while holding the store lock. This is the intended continuous window for supported hooks. However, neither the new closure nor these callers qualifies/refuses a required reentrant writer profile before staging or canonical writes. The shipped `aida-core/templates/hooks/aida-commit-msg:22` actually sources `.aida/commit-config` as executable shell. READY's sentence “unsupported/unproved (not exercised)” is documentation, not the binding A3 pre-mutation disposition.

    Reproduction: in a private store, select an executable commit hook (or sourced commit-config) that calls the pinned real CLI to edit an existing spec in the same store. Invoke a dirty `db sync`. The parent has staged data and waits for its Git/hook child; the child opens the same permanent lock on another process/thread and waits for the parent until timeout. No ownership inheritance or reentrancy crosses this boundary. An error-ignoring hook can instead conceal the failure. This is distinct from the supported early Internal sentinel detector, which source does dispatch before storage initialization at lib.rs:5123 and which must remain supported.

    Required outcome: preserve the supported hooks and their effects. A required unsupported reentrant profile must get the agreed named disposition before canonical/index mutation, or use the independently accepted owner adapter. Do not disable hooks, spoof env ownership, transfer FDs, drop another caller's guard, or unlock around commit. Required test: actual writer-reentry and executable-config negative with unchanged preimages, paired with healthy literal-config, real installed/template, trailer and sentinel positives on a qualified binary. Do not classify this away as excluded CAS work: these are ordinary A4 commit callbacks.

    ### F2 — The new “canonical” reads are not strict; mailbox can replace an unreadable/newer record

    **Priority P1.** `mailbox_store.rs::write_snapshot_locked:113` calls `read_canonical_messages`, which delegates to `read_messages_in:57`. That helper silently continues on read errors (67–69) and parse errors (70–72). The digest then treats missing map entries as new (120–127) and atomically replaces the same filename. Holding the lock does not make that evidence complete. A valid tombstone with an unreadable file but writable directory can be overwritten by an older local message; malformed canonical bytes are similarly overwritten without a warning. This violates the explicit strict canonical reread and preservation contract.

    Related claimed strict scans in `lib.rs::ensure_no_spec_id_collisions_canonical:17945` and `git_backend_cmd.rs::db_sync_local_window:1218` use `GitBackend::load`. Its unchanged object loader (`object_store.rs:545`, especially 604–639) warns/skips unparseable/unreadable records and returns `Ok`; additionally the sync preimage uses `unwrap_or_default()` at 1219. Thus “non-cache” is established, “strict” is not. An invalid newly pulled canonical object can pass the new collision validation and be pushed; it is not a failing load merely because the helper returns Result.

    Reproduction: put a canonical mailbox message with the same ID as a stale local copy behind a read failure (non-root private fixture) or invalid JSON; run explicit digest and automatic pull/push digest. Separately have a bare peer deliver an invalid YAML object before db sync --pull --push. Observe the current reader branches' skip/overwrite or incomplete validation. Required outcome: errors in the canonical write-decision scan are preserved and prevent treating an unknown record as absent or a partial scan as validated. Keep ordinary tolerant inbox/read behavior if required; use strict mutation validation at these seams. Test healthy tombstone/new-ID/idempotence and valid union alongside read/parse failures, with exact bytes/index/HEAD and no false publication.

    ### F3 — Touched local windows discard stage/commit failure and announce success

    **Priority P1.** `lib.rs::handle_push_command:73545–73556` ignores both `git_ops::add` and `commit` errors, prints `Committed`, captures the old HEAD and can report `store push complete`/return success after pushing that old commit. With no origin it returns `Ok(None)` even though the local commit failed. `pull_store_leg_locked:74271` and `pull_store_before_id_allocation:18031` also discard those failures; pull can replace the original hook error with a later dirty-tree/rebase error. These are inherited patterns moved into the new acceptance-critical windows, not fixed by locking. `publish_mailbox_snapshot:72679` prints “published” before the enclosing commit succeeds, exacerbating false mailbox success reporting.

    Reproduction: private fixture with a pending canonical note/message and a pre-commit hook that prints a unique diagnostic and exits nonzero; run `aida push --store-only` against an up-to-date local bare origin, and repeat without origin. Source predicts old-HEAD success plus retained staged work, not the intended committed local result. Exercise pull and pre-allocation through their real entrypoints too.

    Required outcome: propagate the original local failure into the leg's existing error/best-effort policy, preserve pending data, and do not print committed/published or push an old head as completion of the failed local transaction. Best-effort callers may warn/defer, but must retain the true error. Required tests: failing stage/hook/commit plus healthy no-origin and online controls; verify exact exit, diagnostic, canonical/index/HEAD and remote observations. No broad reset or rollback of unrelated pending work.

    ### F4 — Remote reconcile still has unchecked rollback and escaping partial-mutation error paths

    **Priority P2.** The new locked preimage at `remote_create.rs:2343` is correct for the ordinary late-peer race. But `reset_to_pre:2361` ignores spawn/status failure, and the error at 2396 promises “the local store is unchanged” regardless. `BlockRegistry::load(...)?` at 2434 exits after successful merges without going through the owned rollback at all. Other fallible post-merge HEAD reads similarly escape the local recovery path. `ls_objects:2405` converts a failed tree read into an empty set, weakening loss validation. These carried-forward paths are now inside the claimed complete current-preimage/validation/rollback window and still violate its failure contract.

    There is also an execute early return at 2321 using the unlocked discovery `needs_action`; a local writer can advance after discovery and before this branch, producing a stale “every hub already agrees” result without the new locked frontier check. This does not itself erase the peer, but it is an unqualified current-state success path.

    Reproduction: a healthy merge/fast-forward followed by malformed block-registry validation, and a merge refusal with an owned injected reset failure; compare complete locked preimage and report. Separately pause after equal-tip discovery, let an ordinary local writer advance, then resume execute. Required outcome: all owned partial-mutation failures receive coherent checked recovery while holding the same guard, preserving original and cleanup diagnostics; never claim unchanged unless established. A fresh locked no-op decision must consider current local state. Required tests: rollback success/failure, validation read failure, stale no-op and healthy union/late-peer controls. Do not repair with stale discovery reset or broad restoration over peers.

    ### F5 — Public core sync_objects can push while an enclosing store guard is still held

    **Priority P2.** `git_ops.rs::sync_objects:3818` acquires a reentrant inner closure and pushes at 3840 after only that inner scope ends. Its new documentation at 3815 expressly permits a writer's “own enclosing store-writer transaction.” In that use, the outer guard remains held. `push_exact:290` only debug-asserts no lock; debug therefore panics after the local commit, while release builds proceed into hooks/network under the outer store guard. The public closure provides no way for sync_objects to release its caller's guard, nor should it.

    Reproduction: core caller `with_store_write_lock(root, || { write_required_bytes(); sync_objects(root, message) })` with a local bare origin and an observing pre-push hook. This also exposes the tension between “bytes before calling” (unguarded prerequisite bytes) and “enclosing transaction” (held guard over push). The single top-level core witness does not exercise this composition. Absence of current production callers does not waive a named public core A4 obligation.

    Required outcome: make the supported bytes/local-commit/capture and outermost publication composition explicit and safe. Unsupported nested publication must be rejected before local effects, or the supported caller must capture under its outer transaction and publish only after that caller releases it; never silently release caller ownership. Add same-thread nested/local positive, independent thread/process exclusion, and a real pre-push observation on both debug and ordinary release behavior as applicable. Keep existing lexical LIFO semantics.

