    REVIEW FINDINGS TO ADDRESS (TASK-3820):
    Verdict: CHANGES REQUESTED
    Reviewed commit: d790cb075a4e
    Recorded: 2026-11-19T04:10:20.157411740+00:00
    Findings:
    1. [P1][blocking_tier=acceptance] aida-cli-lib/src/gate/seat_authority.rs:4145-4150: Do not infer an intentional launcher cap solely from child.expires_at < parent.expires_at. Start with an ordinary parent/child pair with equal expiries; renewal extends the parent but a transient child write/lock failure refuses the child (or the process exits before visiting it). On retry the still-live child is now below its parent, so this branch reports kept/capped and never extends it again, even after the failure clears. This breaks S2b coverage and recovery after the explicitly supported partial success. Persist/distinguish an actual launcher cap from a previously missed extension, and add a two-pass partial-failure/retry regression proving the uncapped child catches up while genuinely capped children retain their cap.
    2. [P1][blocking_tier=security] aida-cli-lib/src/gate/seat_authority.rs:4174-4216: Revalidate expiry reductions under the record lock before writing new. The intentional-cap decision uses the pre-lock scan snapshot. If cap_launch_child_expiry (seat_authority.rs:3235, invoked by launch/contained.rs for ChatGPT credential TTL) shortens a child after that snapshot and before renewal acquires its lock, the locked checks accept the changed record and overwrite its shorter expiry with new. This removes the launcher authority deadline that the explicit BUG-2486 preservation branch is meant to retain. Preserve/refuse concurrent shortening and check actual cap evidence under the lock; add a deterministic interleaving regression showing the credential-capped expiry survives renewal.
    3. [P1][blocking_tier=acceptance] aida-cli-lib/src/gate/seat_authority.rs:4192-4203: Revalidate the entire ancestor chain and its relay ownership at the locked mutation boundary. grant_check_identity_at and the ancestor supersession loop run before acquiring the target lock; inside it only the immediate parent lifetime/deadline and superseded_by(cur.id) are checked. For root -> child -> grandchild, pause renewal on the grandchild record lock after prevalidation, revoke the root, then release the lock: the immediate parent remains live, so renewal writes/reports the grandchild extended despite its invalid chain instead of refusing. Likewise, superseding an ancestor through relay renewal during the wait is missed because only the descendant ID is rechecked, violating the explicit no-extension rule for superseded predecessors descendants. Freshly validate every ancestor, delegation/roster and relay supersession before mutation (with the required synchronization), and add deterministic ancestor-revoke and ancestor-relay-supersession interleaving tests.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
