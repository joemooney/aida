  content: |-
    ## Implementer self-review
    Reviewed HEAD: ab78b795bf (PR #4280, round 2 of review on d790cb075a4e).

    Fixes, one per finding:
    - F1 (P1, inferred cap): a launcher cap is now recorded on the grant (SeatGrant.launch_expiry_cap, written by cap_launch_child_expiry in the same locked update that shortens the expiry). Renewal keeps only grants with that marker; the child<parent inference is gone. Regression: task_3820_child_missed_by_a_partial_run_catches_up_but_a_launcher_cap_holds (pass 1 fails the child's write through an injected error, pass 2 extends it to the parent's expiry; the capped sibling keeps its cap and marker).
    - F2 (P1 security, cap racing the write): the locked re-check keeps a grant that gained a cap after the scan and refuses one whose expiry was shortened since the scan, so a shorter expiry is never overwritten. Regression: task_3820_launcher_cap_landing_before_the_locked_write_survives (the real cap_launch_child_expiry runs between prevalidation and the locked write; the credential-capped expiry survives).
    - F3 (P1, stale chain): inside the target's record lock, renewal takes every ancestor's record lock (bounded 2s, descendant before ancestor, so no lock cycles), re-reads the chain, then re-checks relay replacement and supersession of every link, grant_check_identity_at (lifetime, principal, roster and delegation of every ancestor), the parent's new expiry and the inline root. revoke_by_id and relay_parent::renew take those same per-grant locks, so a revoke or supersession either lands before the check (and wins) or waits for the write. Regressions: task_3820_ancestor_revoked_before_the_locked_write_refuses_the_grandchild (root revoked; immediate parent still live; grandchild refused, not rewritten) and task_3820_ancestor_superseded_before_the_locked_write_refuses_its_descendant (real relay renew of the root between prevalidation and the child's write; child refused).

    Interleavings are deterministic through a cfg(test) thread-local seam (BEFORE_LOCKED_RENEWAL) that runs just before the locked re-check.

    Evidence: aida lane job cargo test --profile agent -p aida-cli-lib --lib -- task_3820 bug_2486 gave 16 passed, 0 failed. cargo fmt --check is clean. make check-ci-fast stopped at 'Containment conformance evidence tests' because this sandbox denies AF_UNIX sockets (socket.socket(AF_UNIX) gives EPERM even on a clean stash). That is environmental and not this change; later gates did not run locally, so CI has to cover them.

    Probe 5 (authority): the only new write path is the extension itself, reached only behind require_direct_human. Every new branch refuses or keeps: a lock timeout, an unreadable ancestor, an unreadable receipt or a missing verdict all refuse. No existing test was weakened. The BUG-2486 cap test still passes, and the first TASK-3820 test now caps through the real launcher API.

    Residual risks: a child capped before this release has no marker, so a renewal would extend it to its parent's expiry. Launch child grants are short-lived and bound to their launcher, so the exposure ends when those grants do. Holding ancestor locks can make a concurrent relay renew-parent refuse with parent-busy for that moment; the relay retries on its next rotation.
