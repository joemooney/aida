    REVIEW FINDINGS TO ADDRESS (TASK-3820):
    Verdict: CHANGES REQUESTED
    Reviewed commit: a3729cf5b889
    Recorded: 2026-11-19T06:06:59.006086967+00:00
    Findings:
    1. [P1][blocking_tier=security] aida-cli-lib/src/gate/seat_authority.rs:70-72,4179-4192: Preserve launcher deadlines for grants issued by the existing binary before this schema change. The protected-base cap_launch_child_expiry only shortened expires_at and persisted no launch_expiry_cap; the new serde default reads every such record as None, and map_or(new, ...) therefore treats it as freely renewable. Concrete upgrade case: an existing live role-enter root expires in 4h and its delegated ChatGPT child was capped by the old launcher to a credential deadline in 30m. Run the new mandate renew --for 8h before those 30m elapse: the root extends, the child passes the chain/locked checks, and its expiry becomes 8h rather than retaining its 30m launcher deadline. Being process-bound or short-lived does not preserve this deadline once renewal rewrites it. Old running launcher binaries can also continue creating this record shape after deployment. Distinguish positively recorded renewable uncapped grants from legacy records with unknown cap provenance (for example with an explicit schema/eligibility marker), and refuse extension or require relaunch for ambiguous legacy children rather than inferring uncapped from a missing field. Add a regression deserializing a real old-format capped child without the new member and prove renewal cannot extend it past its original deadline, while retaining the new-format partial-failure retry test. This is introduced by the new extension path and is independent of the newer base changes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
