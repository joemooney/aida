  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3820):
    Verdict: CHANGES REQUESTED
    Reviewed commit: ab78b795bfa1
    Recorded: 2026-11-19T05:04:35.055881786+00:00
    Findings:
    1. [P1] Persist the launcher deadline even when it does not initially shorten the child. aida-cli-lib/src/gate/seat_authority.rs:3265-3270 records launch_expiry_cap only on the shortening branch; the early return at 3252 also skips it. For a live delegated child expiring in 1h, cap_launch_child_expiry(child, now+2h) succeeds without recording the credential deadline. Renewing the mandate to 8h then treats that child as uncapped and extends its authority to 8h, past the launcher credential deadline. The same omission occurs if the child is concurrently shortened below the deadline before the locked cap update. Record the absolute launcher deadline under the record lock for every eligible delegated child, independently of whether expires_at must decrease, and make renewal honor it. Add an ample-credential-deadline-then-renew regression; existing tests cover only a deadline below the current expiry. This concerns fresh grants and does not depend on legacy records.
    2. [P1] Refresh the lifetime check after acquiring ancestor locks. aida-cli-lib/src/gate/seat_authority.rs:4301 captures at before lock_grant_record_bounded can wait up to two seconds per ancestor, and line 4378 validates the entire chain using that old timestamp. A child with less than a second remaining can pass the first lifetime check, wait behind its live parent record lock for 1.5 seconds, and then be written with an extended expiry after the child has expired. The parent can already have been extended earlier in this same renewal, so parent.expires_at >= new does not prevent this. This violates TASK-3820 never-revive semantics at the mutation boundary. Recheck the child and whole chain against fresh time after all ancestor lock waits and receipt reads, immediately before accepting the extension. Add a deterministic regression holding the parent lock until the child expires and assert refusal with no expiry rewrite.
    3. [P2] Classify the new ancestor-lock writer sites in scripts/store-writers.toml. Existing exact-head CI jobs 135343436098 and 135343436172 both fail the store-writer inventory ratchet for seat_authority.rs::lock_grant_record_bounded additions OpenOptions::new, fs::create_dir_all and truncate. The latter job successfully completes workspace compilation before this guard fails; this is a reproducible inventory omission introduced by the new function, not a compiler error. Regenerate and review the three inventory classifications against the pinned base, retaining the guard. The aggregate Build failure follows these failed lanes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
