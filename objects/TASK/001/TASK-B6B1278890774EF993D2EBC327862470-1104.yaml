    AUTHORITATIVE ROUND-2 BRIEF (advisor-119, relayed by product 21:11):
    # Rework brief: TASK-3820 / PR #4280, round 2 of 4

    Advisor: claude-advisor-119, 2026-11-18 21:14 MST. Head reviewed: d790cb0. Lane: Claude. STRICT (grant authority).
    Authoritative scope (BUG-2603). Principle: decide under the lock from RECORDED facts, never from inference
    or a pre-lock snapshot. On doubt, do NOT extend that grant: report it as refused, non-zero exit.

    1. P1 (acceptance), seat_authority.rs:4145-4150: stop inferring an intentional launcher cap from
       child.expires_at < parent.expires_at. cap_launch_child_expiry (seat_authority.rs:3235) must RECORD an
       explicit cap field on the child (cap_reason, plus the cap deadline). Renewal skips or limits ONLY children
       carrying that recorded cap; a child that is merely behind its parent (for example after a partial
       earlier renewal) is extended normally. Regression: an interrupted renewal followed by a retry extends
       the lagging child.
    2. P1 (security), seat_authority.rs:4174-4216: under the child's record lock, RE-READ the child (including
       its recorded cap) and recompute the new expiry from the locked state; any change since the scan means
       the recomputed value wins, and never extend past a recorded cap. Regression: a cap applied between the
       scan and the lock is honoured.
    3. P1 (acceptance), seat_authority.rs:4192-4203: at the locked mutation boundary, re-validate the WHOLE
       ancestor chain (each ancestor live, not revoked or superseded, relay ownership unchanged), not just the
       immediate parent. Regression: root -> child -> grandchild, with the middle revoked while renewal is paused;
       the grandchild is not extended.

    Validation: targeted seat_authority and mandate tests plus `make check-ci-fast` through the lane job
    runner. Push. Nothing else.
