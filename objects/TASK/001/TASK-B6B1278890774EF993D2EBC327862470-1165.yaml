title: 'Review follow-up: The pass budget equals the scheduler''s kill ceiling, so a slow pass is killed instead of d'
description: |
  From STORY-2897
  Reviewed sha: f037b9d28788d3673950b9986e88d91d0d0e42af

  The pass budget equals the scheduler's kill ceiling, so a slow pass is killed instead of degrading. PASS_BUDGET is 120 s (main_watch.rs:52) and SCHEDULED_COMMAND_TIMEOUT is 120 s (maintenance_schedule.rs:3876). While an episode is open the scan does not stop at a green commit: every pass re-reads the checks of every commit since last_green, up to 50 (main_watch.rs:561-570), each costing several `gh api` calls, before advance() runs (line 637). In a long episode with many merges the child is killed during the scan on every pass, so confirmation, the fix spec, the fix-window escalation and the close never run, exactly when they matter. The fetch and git calls (30 s each) are also outside the forge deadline. Suggested fix: make PASS_BUDGET clearly shorter than the job timeout, and run the time-based part of advance() before or independently of the full rescan (or cache verdicts of commits already judged green/red at a completed attempt).

  Advisor scope and acceptance

  Recheck after STORY-2897 lands. The S3a rework owns the individual child deadline and partial-read classification. This follow-up owns the overall scheduled-pass deadline. At #4389 964a98c30ed the pass and scheduler both allow 120 seconds, and Git uses a separate per-call timeout.

  - Establish sufficient headroom before the scheduler kill ceiling for a pass to stop optional work, report partial progress and persist justified transitions. The same overall deadline must cover fetch, Git, forge calls and repeated scans.
  - Check a slow or repeatedly pending production-equivalent pass with a controlled clock and bounded child fixtures. It should return a diagnostic before the outer kill deadline and resume without advancing past unresolved evidence. Preserve time-based observational transitions when the scan uses the remaining budget.
  - Keep this follow-up observational. Spec filing, rerun initiation and store-mutating escalation retain their separate S3b gate.
