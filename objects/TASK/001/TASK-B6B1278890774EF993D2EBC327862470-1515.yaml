title: 'Review follow-up: The busy-lock match in promotion_pass tests format!("{e:#}").contains("review-watch lock b'
description: |-
  From BUG-2766
  Reviewed sha: 58740fb4ce96577f40a2083d55173230f23da94a

  The busy-lock match in promotion_pass tests format!("{e:#}").contains("review-watch lock busy"), but RuntimeLock::lock attaches that same context to every non-WouldBlock flock error (review_watch.rs lock(), generic Err branch), so a real lock I/O failure (ENOLCK/EIO) is reported as 'skipped (busy)' and the pass exits 0. Match on io::ErrorKind::WouldBlock via downcast instead of the context string.
