title: 'Review follow-up: Exclude unrelated project deputies from operator awaiting reports. At aida-cli-lib/src/dep'
description: |-
  From TASK-3801
  Reviewed sha: f195fb6d4710bd8bd12ffb0375ee2de8bad93d2c

  Exclude unrelated project deputies from operator awaiting reports. At aida-cli-lib/src/deputy_shell/mod.rs:927-937, only session-scoped reads suppress an empty stranded_jobs list. With no AIDA_SESSION_ID, a dead native queue containing exclusively project-A jobs is still emitted and counted actionable while awaiting runs in project B: the project filter removes every job, but the deputy is pushed anyway. Require relevant-project evidence independently of the session filter and cover two distinct projects with the no-session collector. This behavior is present in both the original reviewed head and protected-base landed tree and is unaffected by the base-only tests.rs change.
