description: |
  Deferred from the PR #4388 (BUG-2688) r4 CR at 291758c1 under the advisor-122 ruling (2026-11-22 13:55 MST). r5 fixes only the data-loss finding.

  ## Finding
  2. [P2, unmet-claimed-ac] aida-cli-lib/src/seat_clone.rs:4299 — If a retained registration points to a path now occupied by another repository’s worktree, fresh pickup refuses with “does not match host registration” and gives no command for obtaining the missing evidence. The reused-path regression explicitly exercises this case but checks only the generic message. Include the expected host registration and one quoted, read-only command that displays the conflicting registration evidence, and assert that diagnostic in the regression (BUG-2688 AC1).

  ## Acceptance
  - AC1: The registration-mismatch refusal includes the expected host registration and one quoted, read-only command that shows the conflicting registration evidence. The reused-path regression asserts that diagnostic.
