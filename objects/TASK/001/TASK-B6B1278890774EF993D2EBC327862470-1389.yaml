title: 'Review follow-up: A legacy reader predating BUG-2720 can still lose all watcher state access on the first re'
description: |-
  From BUG-2758
  Reviewed sha: 0ec9c312e7c18bc0ffbbdba200c79e964ebb5d5e

  A legacy reader predating BUG-2720 can still lose all watcher state access on the first retry backoff, while pickup_retries is zero. review_watch.rs:1691 writes pickup_retry_at before the counter increments, and the old Attempt rejects that field and aborts the whole snapshot, including unrelated ordinary reservations. Document this mixed-version case and the required supervisor upgrade order, or keep retry metadata outside the legacy-readable snapshot during rollover.
