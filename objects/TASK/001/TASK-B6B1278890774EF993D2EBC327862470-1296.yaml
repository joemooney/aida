  aida-cli-lib/src/seat_clone.rs:1623 and aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs:2637–2645. An existing clean Claude seat whose only extra file is its empty sandbox-created .gitmodules now becomes dirty if its originating checkout did not add an ignore rule. The previous dispatch and reap paths explicitly recognized that placeholder. The old end-to-end regression now adds /.gitmodules to the parent excludes, a rule absent from the project’s tracked .gitignore and optional for existing seats. Preserve recognition of the known generated stand-in or reliably install the intended ignore policy for existing seats while retaining user-created .gitmodules content. Cover the original fixture conditions.
