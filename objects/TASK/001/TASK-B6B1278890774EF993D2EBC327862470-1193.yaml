description: |-
  From BUG-2707
  Reviewed sha: 1f53ccdae5191f51e6dc905d6cb1be5c5cb8681e

  Concurrent submissions can acknowledge inconsistent state. write_in unlinks a fixed temporary name before creating it, and submit_draft publishes the draft and receipt separately before unlinking pending.json unconditionally. Overlapping retries can publish a different writer’s temporary file, leave mismatched draft and receipt, or remove a replacement pending draft. Serialize acceptance per launch and consume only the pending generation that was validated.
