title: 'worktree enter: Next-block is misleading — stale cd, unexplained source, premature session-end, and no actual next action'
description: |-
  Observed 2026-07-18 operator dogfood, verbatim reaction to the `aida worktree enter TASK-1155` output: "you don't tell me what to do next, the instructions here seem peculiar, a cd already happened, and I don't know if I need the source and ending the session before doing anything seems premature."

  Four defects in the Next: block:
  1. It prints `cd <worktree>` even when the aida() shell wrapper has ALREADY auto-evaled the cd (the operator's prompt was sitting in the worktree directly below the instruction telling them to cd there). Detect the wrapper-eval path and drop the line, or annotate "(already done)".
  2. `source .aida/session-env.sh` gives no benefit statement. Say why in-line: shares the parent repo's cargo build cache (CARGO_TARGET_DIR) so the first build is warm instead of a cold full-workspace rebuild. Cannot be auto-applied to the user's shell, so the why must sell the step.
  3. `aida session end <id>` is rendered as the third of three next steps; it reads as do-this-now. It belongs under a separated "When finished:" header.
  4. The block never states the actual next action — the reason the operator entered at all: launch your agent in the worktree and implement (e.g. `claude` then `/aida-implement <SPEC>`), or work by hand and finish with `aida ship`. Lead with that.

  Acceptance:
  - With the shell wrapper active, no stale `cd` instruction is shown (or it is marked already-done).
  - The source line carries a one-phrase benefit ("warm build cache").
  - Session end is visually separated as an at-the-end action, not a sequential next step.
  - The first line under Next: is the implement action for the entered spec.
  - Same treatment for `aida worktree add`'s output where applicable.

  Additional acceptance (operator, 2026-07-18):
  - With the aida() shell wrapper active, `aida worktree enter <SPEC>` leaves the shell cd'd in AND with CARGO_TARGET_DIR exported - no manual source step. Implement by extending the same emitted-and-auto-evaled shell payload that already carries the cd (session-env.sh is a single export line). Keep the no-double-eval convention (TASK-667).
  - The printed `source .aida/session-env.sh` instruction appears only for wrapper-less invocations where the emitted shell was not evaled.
