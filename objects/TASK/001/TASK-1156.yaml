title: 'worktree enter: Next-block is misleading — stale cd, unexplained source, premature session-end, and no actual next action'
description: |2-


  Additional acceptance (operator, 2026-07-18):
  - With the aida() shell wrapper active, `aida worktree enter <SPEC>` leaves the shell cd'd in AND with CARGO_TARGET_DIR exported - no manual source step. Implement by extending the same emitted-and-auto-evaled shell payload that already carries the cd (session-env.sh is a single export line). Keep the no-double-eval convention (TASK-667).
  - The printed `source .aida/session-env.sh` instruction appears only for wrapper-less invocations where the emitted shell was not evaled.
