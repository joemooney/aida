description: |-
  From the strict review of TASK-1448 (APPROVE at 6902e6659e).
  (1) Pass the approved reviewed_sha as gh pr merge --match-head-commit (MergeOptions.match_head), from both merge() and pr ship, to close the race between the check and the merge.
