- id: 01a1efb8-ece5-7621-b9d9-1c724bf3943e
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3814):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 000a4730584a
    Recorded: 2026-11-18T17:31:26.323611092+00:00
    Findings:
    1. [P1][acceptance] Resolve follow-up parents through canonical spec identity, including agreed IDs (aida-cli-lib/src/findings_gate.rs:2174-2186). The new lookup matches only r.spec_id or UUID, while GateSpec::resolve deliberately retains the caller's label and the normal review/collector supplies friendly IDs. This PR itself covers TASK-3814, whose stored spec_id is TASK-b6b1278890774ef993d2ebc327862470-1097 and agreed_id is TASK-3814. An otherwise approvable P2 review recorded against TASK-3814 reaches missing_parent and fails with 'deferred findings require a canonical source spec', leaving delivery pending rather than filing the linked follow-up and approving. Use the shared canonical resolver/UUID (and identity-based deduplication) instead of the restricted label search. Add direct recording and host-handoff regressions using an agreed ID different from the native spec_id, including retry through aliases. Existing filing tests retrieve and pass the native spec_id, hiding this AC2 failure.
    2. [P1][acceptance][untested-path] Apply the sensitive exception to the existing positional --finding-class channel before deciding dispositions (aida-cli-lib/src/review_commands.rs:2977-2981; aida-cli-lib/src/gate/kernel_deps.rs:651-670). A gate/sandbox finding supplied as --finding JSON with blocking_tier p2 and --finding-class untested-path is deferred because apply reads only JSON's class member. resolve_finding_classes runs afterward, and apply_finding_classes attaches the classification after kind/build decisions without reevaluating disposition_verdict. Thus an explicitly classified untested gate path can be approved and filed away, violating AC4. Merge resolved positional classes into the policy input before every kind/authority decision, preserve them through recording, and add an end-to-end CLI regression covering canonical and alias --finding-class spellings. The new tests cover embedded JSON class only.
    3. [P2][acceptance] Limit the mutation-kill/untested-path exception to sensitive paths (aida-cli-lib/src/gate/kernel_deps.rs:651-670). sensitive_class is determined solely by class and overrides p2/p3 for every finding; there is no gate/sandbox scope check. Consequently a P2 untested-path or mutation-kill finding in ordinary reporting or documentation code still requests changes despite the opt-in policy and prompt promising that other P2/P3 observations become follow-ups. Preserve unconditional security/authority-bypass blocking, but distinguish sensitive gate/sandbox findings before applying the ADR-76 exception, or require an explicit sensitive-path tier and avoid globally overriding ordinary classes. Add paired regressions for the same low-priority class inside and outside sensitive code. This is an AC2 policy mismatch, not a request to implement STORY-2913's deferred free-list feature.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
