    2. [P1 positional class] review_blocking::apply_with_classes merges --finding-class into the JSON class before dispositions; both review_commands call sites use it; the builder's re-apply sees the merged class and it is retained in finding_dispositions. Tests: task_3814_positional_classes_join_policy_input, task_3814_positional_finding_class_blocks_gate_untested_path_end_to_end (production handler: canonical + alias spellings refuse explicit approval and remain a refusal; paired no-class/perf control is approvable).
    3. [P2 scope] security/authority-bypass block unconditionally; mutation-kill/untested-path block only when the finding's file/path names gate/sandbox/authority/seat/containment/mandate code (docs extensions excluded). Paired test: task_3814_adr76_exception_is_scoped_to_sensitive_code.

