title: Add a dated rate table and auditable per-spec cost query over the token ledger
description: |
  Operator priority 2026-09-22: turn the attributable token ledger into auditable cost estimates without converting missing evidence into zero.

  Build the next EPIC-71 slice after TASK-1427: a separately versioned, dated rate table and a read-only cost query over ledger records.

  Requirements:
  - Store rates as data, not branching application code. Each entry names provider, exact raw model identifier or explicit alias, currency, effective-from/effective-to dates, source URL and source revision/date.
  - Price token classes independently where supported: uncached input, cache creation/write, cache read/cached input, output, and reasoning/thinking output. Never silently collapse a class onto a different rate.
  - Match only exact provider/model/effective-date evidence. Unknown model, missing rate/class, ambiguous alias, or out-of-range timestamp remains explicitly unpriced with a reason.
  - Preserve raw measured token totals and provenance. Estimated cost is derived and must never overwrite ledger facts or claim invoice reconciliation.
  - No network call is required at query time. A pinned initial snapshot may be adapted from a documented public price map, with its license/provenance recorded.

  Acceptance:
  1. A versioned rate schema and pinned dated fixture/snapshot are checked in, with source, currency, effective dates, token unit, and per-class rates.
  2. The usage query can report estimated cost for one spec and group it by phase, vendor/model, and round when those dimensions exist.
  3. Output shows priced measured tokens, unpriced measured tokens, unknown/unattributed coverage, rate-table version/date, and local-estimate-not-billing semantics in human, JSON, and TOON forms.
  4. Tests cover exact match, effective-date boundary, unknown model, missing token-class rate, explicit alias, measured zero, unknown usage, mixed priced/unpriced aggregation, and implementation-review-rework grouping.
  5. Dollar arithmetic uses a fixed decimal/integer minor-unit representation with documented rounding; no floating-point accumulation drift.
  6. Rebuild/query remains deterministic and offline; no transcript content or secrets enter the rate table or output.
  7. Documentation gives exact commands and states that vendor billing reconciliation, negotiated discounts/credits, and real-time budget enforcement remain out of scope.

  Sketch-first: before implementation, post the proposed rate-file location/schema, matching/effective-date rules, arithmetic/rounding model, update provenance, and CLI changes for driver signoff.
