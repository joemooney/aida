title: 'Review follow-up: [aida-cli-lib/src/pr_train.rs route_drift] Sometimes the drift comes from an earlier train'
description: |-
  From BUG-2777
  Reviewed sha: 4cbdf727160da85e30e54b7a37db8b4a9a0c9ed3

  [aida-cli-lib/src/pr_train.rs route_drift] Sometimes the drift comes from an earlier train member rather than from main, so the PR branch is already up to date with main. Then update_change_branch fails as a no-op, and route_drift reports 'the branch does not update cleanly ... conflict repair' and escalates to the advisor, which misdiagnoses a train-ordering drift as a merge conflict. The implementer listed this as a residual risk. Suggested follow-up: tell an already-up-to-date refusal apart from a real conflict, and route it to a re-train without the earlier member (or a re-review).
