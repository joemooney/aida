agreed_id: TASK-3782
title: Train CI wait line shows shard progress and runner-queue time instead of only the unregistered Build summary job
description: 'While a train waits, it prints ''train PR #3815 CI waiting: Pending(["Build (ubuntu-latest) (not registered yet)"])''. Build (ubuntu-latest) is the summary job that GitHub creates only after every CI shard finishes, so that line is shown for the whole run and says nothing about progress; the operator asked (2026-11-10) what command gives more insight. Observed on run 42913999193: 4 of 7 shards had succeeded, 3 were running, and 3 shards had queued ~10 min for a runner before starting. Acceptance: (1) the wait line names the CI run id and per-shard state, e.g. ''4/7 shards passed; running: lib-1, gates, rest''; (2) a shard still queued shows how long it has waited for a runner, e.g. ''queued 9m (runner)''; (3) a not-yet-registered summary job is described in plain words (''Build summary appears after all shards finish'') rather than as a pending check; (4) a failed shard is named at once, without waiting for the summary; (5) works for GitLab pipelines through the forge layer with the same fields where available; (6) unit tests over recorded check-run fixtures (all queued, partial, failed shard, summary registered).'
status: Approved
priority: Medium
owner: joe.mooney@gmail.com
feature: Uncategorized
