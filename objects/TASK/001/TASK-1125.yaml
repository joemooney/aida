title: 'Paper: write up the TASK-1123 supervised reviewer-bypass as a field observation (cause taxonomy for SPIKE-67 / section 13)'
description: |-
  The TASK-1123 supervised drive self-merged with 0 independent reviews — the first field observation in the regime section 13 flagged as unmeasured. Worth writing up because: (1) it carries a cause analysis, (2) characteristic of the program, it embarrasses a deferral decision (BUG-710 explicitly deferred supervised coverage on "the human is watching") rather than flattering the system, (3) the cause taxonomy sharpens SPIKE-67 instrumentation before the cross-repo harvest.

  Cause taxonomy to record (three distinct failure classes this one incident spans):
  - delivery-rot: stale ~/.codex/prompts (source fixed, machine not re-scaffolded) — detection gap, see the aida doctor follow-up.
  - gate-scope: the BUG-710 guard keyed on AIDA_HEADLESS, missing the supervised/interactive mode — fixed unconditionally in BUG-716 (drain-lock signal).
  - violation vs guard: the model DID free-lance to aida pr ship; substrate-as-bouncer (the merge gate) is what actually held, not the prompt.

  n=1, but exactly the evidence the field pivot was designed to collect. Deliverable: a short incident writeup under docs/research/ feeding SPIKE-67 + section 13.
