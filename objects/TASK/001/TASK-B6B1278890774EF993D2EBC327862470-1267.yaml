description: |
  Split from BUG-2735 (advisor-122 ruling 2026-11-23 15:13; product-15). BUG-2735 AC1 adds the shared core-budget check and back-off. This follow-up makes the budget visible.

  ## Acceptance
  - AC1: `aida doctor` (a check) and `aida land status` show the remaining GitHub core REST budget (remaining/limit, reset time), using the cached rate_limit reading, and warn below 20%.
  - AC2: They name the top consumers since the last reset when known (review-watch, auto-train, main-watch, seat watchers), or say "unknown". Test with a fake rate_limit response below the threshold.
