title: 'Review follow-up: config_cmd.rs:1746–1747 and 1783–1785. The new auto-commit can absorb unrelated edits made'
description: |-
  From BUG-2752
  Reviewed sha: d4a4583e95c8cf22a43aa1b9ad40fa5c177b838c

  config_cmd.rs:1746–1747 and 1783–1785. The new auto-commit can absorb unrelated edits made after the clean check and before the initial read, or after save_edit_doc and before Git reads the working file. The prompt-time string comparison does not cover either interval, and finish_config_change checks only whether the path is dirty before committing its live contents. Bind auto-commit to the verified starting config and the intended output, or leave the change for deliberate commit when concurrent edits prevent that proof.
