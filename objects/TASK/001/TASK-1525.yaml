title: 'Architecture comparison doc: AIDA''s control plane against durable-execution engines (Temporal-style) and merge queues (Bors, Zuul, Mergify)'
description: |
  From SPIKE-86 section 6, adopted by OPERATOR DECISION on SPIKE-86 (Joe, 2026-09-26). A whole-word search found 0 mentions of Temporal, Airflow, Argo, Nomad, Zuul, Bors, Mergify or Aviator in docs/positioning/ and docs/competitive-analysis/. That is a gap on the ARCHITECTURE side only: the control plane (about half the engineering) has never been benchmarked against the two families it most resembles. No market-side vs-* page is wanted.

  Acceptance:
  1. A new contributor-facing doc under docs/architecture/ (not docs/positioning/) compares AIDA's control plane with (a) durable-execution engines (Temporal-style event history, replay, checkpointing, activity retries) and (b) merge queues (Bors, Zuul, Mergify, GitHub merge queue, Aviator).
  2. For each family it states: which properties AIDA already has (with the AIDA command or module that provides it), which it lacks, and which it deliberately does not want because its workers are non-deterministic LLM agents.
  3. It names "resumable orchestrator checkpointing" (the round-2 moat document's gap P1) and says whether a durable-execution property would close it.
  4. It links TERM-5 and VIS-2 and is linked from OVERVIEW.md's architecture section.
  5. It makes no market claim and is not added to docs/positioning/.
