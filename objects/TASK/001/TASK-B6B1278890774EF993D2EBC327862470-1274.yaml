title: 'Review follow-up: ci_watch.rs:64-70 kills the interactive gh child with SIGKILL after printing the budget me'
description: |-
  From BUG-2735
  Reviewed sha: 9b167d9eee8c1ac3c0200bf633a75d1b8f7a6c1f

  ci_watch.rs:64-70 kills the interactive gh child with SIGKILL after printing the budget message. On terminals where gh enabled the alternate screen, that bypasses its screen restoration and leaves subsequent AIDA output on the alternate screen. Use bounded graceful cancellation that restores the terminal before printing the back-off. GitHub CLI handles SIGINT for that purpose. https://github.com/cli/cli/blob/v2.105.0/pkg/iostreams/iostreams.go#L361-L388
