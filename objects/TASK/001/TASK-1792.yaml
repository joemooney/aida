title: 'relay-stall check: detect SIGKILL/OOM-dead relays still marked running, ignore run-dir handoff.md.done as an ack, and age-cap or distinguish deliberate Ctrl-C exits'
description: 'From the #2690 (STORY-1699 heartbeat) review, non-blocking. (1) relay_stall.rs:246 trusts the raw state file, so a relay killed with -9 or by the OOM killer stays state=running and is never flagged; check the pid/lock (with start-time identity) as relay.sh:1277 does. (2) relay_stall.rs:207 treats the run-dir handoff.md.done (relay.sh''s live sentinel) as an operator ack; only the seat handoff''s .done should count. (3) state=exited covers a deliberate Ctrl-C stop and has no age cap, so an intentionally stopped relay pages forever; add an age cap or a ''stopped by operator'' distinction. Tests for each.'
