title: Implement deadline-aware async retry adapter for EvaluatorEngine
description: |-
  CONTEXT:
  Under ADR-56, remote evaluators must not rely on unconstrained client timeouts. A caller-specified deadline (e.g. 2–5s for review-context preparation) must govern total execution time across all retry attempts.

  REQUIREMENTS:
  - Implement a generic async retry wrapper DeadlineRetryAdapter wrapping EvaluatorEngine.
  - Takes an operation deadline Duration or Instant from the caller.
  - Enforces deadline cutoff: aborts and falls back if remaining time budget is exhausted (< 500ms).
  - Performs max 1–2 retries with backoff only for classified transient errors.
  - Integrates idempotency keys on requests to prevent duplicate billing.
  - Fails closed to caller when budget expires (PRIN-5).
