title: Lane ship declaration accepts a multi-ID completing trailer for folded specs (one-spec-per-lane until then)
description: |
  Found 2026-11-24 (product-15; advisor-122 ruling 06:14). A lane that folds several specs into one PR can't publish: the lane's ship declaration rejected the completing trailer "(TASK-3296 TASK-3286 TASK-3293 TASK-3321)" because the launcher accepts a single spec ID. The lane punted and product had to publish #4516 from the host.

  ## Acceptance
  - AC1: The launcher / lane ship declaration accepts a multi-ID completing trailer `(ID-A ID-B ...)` when every listed spec is approved and assigned to that lane's PR, and refuses unknown or unassigned IDs with a clear message.
  - AC2: Test: a folded lane publishes a PR whose title carries all listed IDs, and landing completes all of them.
  Until this lands: ONE spec per lane (related specs as Refs only).
