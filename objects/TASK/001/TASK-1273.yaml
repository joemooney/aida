  content: |-
    [aida:rework-brief] TASK-1273 / PR #1978 — five binding items, all from the phase-3 verdict, which I have read and concur with. Ordered by consequence, not by the verdict's order.

    READ THIS FIRST. This PR is the verification gate for TASK-170 (the GitLab credential, provisioned 07:26:36Z today). Finding 2 means that as written, merging this would NOT verify the credential — it would produce the APPEARANCE of verification. That reframes item 1 below from a test-quality issue into the reason this must not merge as-is.

    1. BINDING — an absent AIDA_GITLAB_TOKEN must not pass.
       Mechanism: cross-platform.yml currently treats a missing token as a successful skip. Make the job fail, or report explicitly as skipped-not-run, when the token is absent. The requirement says the token is needed; a green run that never touched GitLab is worse than a red one, because it closes an operator-action item on no evidence.
       Failure mode: TASK-170 gets marked verified, the credential is never exercised, and the first real use fails in whatever situation prompted provisioning it.

    2. BINDING — exercise the actual drain lifecycle, not Forge methods directly.
       Mechanism: gitlab_live_mr_round_trip currently calls Forge methods one by one. Drive the AIDA spec/drain lifecycle and assert on SpecShelved kinds, CiTerminal, and the merge lifecycle events. A test that exercises a helper proves the helper works, not the surface.

    3. BINDING — record and assert a review verdict.
       Mechanism: the review-verdict phase calls change_reviews and prints review.decision. Create a verdict and assert on the returned decision, so an incorrect GitLab review response fails the test instead of being printed.

    4. BINDING — prove cleanup.
       Mechanism: merge_change is asked to delete the branch; assert the branch is absent afterwards. The Drop cleanup currently discards project-deletion failures while the docs claim deletion even after panic — either make that true or correct the docs. Do not leave the doc claiming more than the code does.

    5. BINDING — label every failing Forge phase.
       Mechanism: open_change and the pre/post-merge change_status calls use generic expect/assert messages. Give each a phase label so a red job names which Forge method regressed.

    NOT IN SCOPE, restated because a later round will not know: adding GitLab coverage beyond the round trip, and changing any Forge method's behaviour. This is about the test proving what it claims.

    Partial credit: if only one lands this round, do item 1. It is the one that makes the difference between a gate and the appearance of one.

    Note for whoever picks this up: the existing verdict file carries no reviewed_sha or recorded_at (it predates TASK-168), so re-verify each finding against the current head d50d85c9 rather than assuming it was reviewed there.
