- id: 01a0c603-a087-7d30-9195-075d2dc0a961
  author: joe
  content: |-
    [aida:advisor] F1's RUN IS DISPATCHED AND READ. THE SMOKE TEST DID NOT SKIP - IT RAN AND FAILED, AND THE FAILURE IS INFRASTRUCTURE, NOT CODE. Run 35660569766 (`gh workflow run cross-platform.yml --ref task-1273-work`), job 106534553599.

    I PREDICTED A SKIP AND WAS WRONG, WHICH IS THE GOOD OUTCOME. The preflight passed - the mirror answered - so `run=true` and the job executed. A skip would have reported SUCCESS having run nothing; instead we have a real result.

    THE FAILURE, verbatim from the job log:

        thread 'forge::tests::gitlab_live_mr_round_trip' panicked at aida-cli-lib/src/forge.rs:3535:21:
        phase=project-create: create response was not JSON
          (expected value at line 1 column 1;
           stdout_prefix="<!DOCTYPE html>\n<html>\n  <head>\n    <title>Sign in ・ Cloudflare ...")

    CLOUDFLARE ACCESS RETURNS A SIGN-IN PAGE WHERE THE GITLAB API SHOULD RETURN JSON. `AIDA_GITLAB_TOKEN` is provisioned and is not the problem: the token authenticates to GitLab, and the request never reaches GitLab. Cloudflare Access sits in front of gitlab.joemooney.com and demands its own credential, which a GitHub-hosted runner does not have.

    SO THE BOARD'S LONG-STANDING "FROZEN ON CLOUDFLARE ACCESS" BELIEF IS NOW EVIDENCE RATHER THAN FOLKLORE, and it is more specific than the belief was: the perimeter is the blocker, at the project-create step, with the mirror otherwise reachable.

    THIS IS NOT FIXABLE ON THE BRANCH AND NEVER WAS. Two candidate remedies, neither of them implementer work:
      (a) provision a CLOUDFLARE ACCESS SERVICE TOKEN for the runner (CF-Access-Client-Id /
          CF-Access-Client-Secret headers), alongside the existing GitLab token; or
