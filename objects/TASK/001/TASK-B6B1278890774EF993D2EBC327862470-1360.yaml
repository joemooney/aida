title: Lane ship step uses the completing (SPEC) trailer when every AC is claimed; Refs only for declared partial slices
description: |
  Lanes keep titling FULL fixes "Refs X", which skips merge-time completion (2026-11-24: #4477 BUG-2737 and #4435 TASK-3171 both landed complete but left their specs open). Advisor-122 ruling 2026-11-24 09:35; filed by product-15.

  Slice 1 (this task) is the PREVENTIVE half. A post-land detector (flag Refs-titled landed PRs whose spec has no remaining open AC) is slice 2, a separate follow-up.

  ## Acceptance
  - AC1: The lane ship step titles the PR with the completing "(X)" trailer when the lane's exit summary claims every acceptance criterion of X, and uses "Refs X" ONLY when the brief or the exit summary declares a partial slice.
  - AC2: Tests for both cases: an all-AC-claimed exit produces "(X)"; a declared-slice exit produces "Refs X".
