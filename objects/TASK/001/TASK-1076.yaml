title: 'TUI spawn_drive omits --solo: a drive on an epic-parented spec routes into the epic worktree'
description: |-
  spawn_drive in aida-tui/src/redesign/mod.rs runs aida zen <id> without --solo. For a spec parented to an epic (or under an active focus), zen routes the drive INTO the scope worktree per ADR-6, rather than its own worktree/PR. The operator cannot see which routing will happen and cannot choose — a standalone bug/task silently lands in the epic worktree.

  DESIGN DECISION (advisor): do NOT override ADR-6 default-into-scope silently in either direction. Instead make the routing VISIBLE and give the operator a per-drive toggle.

  ## Acceptance
  - WHEN the operator invokes the drive verb on a spec that would route into a scope worktree, THE TUI SHALL display the resolved routing (into-scope vs solo) before launching the drive.
  - THE drive affordance SHALL offer a solo toggle that, WHEN selected, launches aida zen <id> --solo.
  - WHEN the operator launches the drive without toggling solo, THE TUI SHALL preserve the current ADR-6 default routing.
  - THE displayed routing text SHALL name the target worktree scope when the drive would route into an epic.
