  content: 'IMPLEMENTATION DIRECTIVE (guided decision): implement `integrate --strategy stacked` auto-promotion of deferred stacked children BEHIND an explicit `--promote-stacked` opt-in flag. Default stays the current exit-2 `/aida-rebase` manual pointer (no behavior change unless opted in). When --promote-stacked: rebase --onto + force-push-with-lease the promoted child branches in a temp worktree, gated by a LEASE GUARD — never force-push a PR branch whose lease you don''t hold. Seams: the integrator/`integrate` strategy dispatch in main.rs; the existing exit-2 /aida-rebase pointer; git_ops force-with-lease. Keep the safe default; the opt-in carries the unattended-force-push risk behind the lease guard. Gate + PR, do NOT merge (keystone).'
