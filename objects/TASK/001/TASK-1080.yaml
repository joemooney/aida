decision_request:
  question: Should integrate --strategy stacked auto force-push-rebase promoted stacked children, or keep the manual /aida-rebase handoff?
  choices:
  - label: Auto stack-aware promotion
    consequence: fully autonomous stacked drains, but integrator force-pushes origin PR branches unattended
    resolution: auto
  - label: Keep exit-2 /aida-rebase pointer
    consequence: human does the rebase
    resolution: manual
  - label: Behind --promote-stacked opt-in
    consequence: default manual, opt-in autonomous with lease guard
    resolution: opt-in
  recommended: 2
  rationale: Unattended force-push of shared PR branches is exactly the hazard class in memory; ship behind an opt-in with the lease guard, keep the safe default.
