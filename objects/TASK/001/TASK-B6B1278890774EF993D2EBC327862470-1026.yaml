description: |-
  Non-blocking finding carried forward from an APPROVED review verdict on BUG-2493, which has since completed — recorded here so it keeps a queryable home once the verdict record stops being read.

  Non-blocking (minor, carried forward): a native-lane body line ending in a different spec, e.g. 'done (BUG-7)', is credited on a (#N) squash that bypasses aida pr ship (trailer_coverage.rs:34 commit_completion_ids); aida pr ship neutralizes it and the docs warn against it, but the host does not validate declared bodies. Ordinary lanes share this exposure, so a guard can follow separately.

