  author: joe
  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 18:16):
    # TASK-3922 r1 on #4702 (advisor-122 ruling 2026-11-26 18:17: FIX FIRST, since a raw argv echoed into logs is a secret-leak class; product-15). Lane: CLAUDE. STRICT. MAIN, existing branch task-3922-salvage-idempotent / PR #4702. Keep the "(TASK-3922)" title. <=120 lines.
    BINDING:
     (1) The writer-admission refusal (aida-core/src/mailbox_lifecycle/activation.rs restart_step, retire.rs Display) shows ONLY: the pid, comm, exe path + sha (or "(deleted)"), and a restart hint built from an ALLOWLIST (the subcommand name plus the non-secret flags we recognise, e.g. "aida deputy shell run --name <n>", "aida mcp-serve"). NEVER the raw argv. NEVER the value of any flag whose name matches grant|token|secret|key|password|session (case-insensitive, both --flag VALUE and --flag=VALUE, and bare key=value args). Unrecognised args are omitted, not echoed.
     (2) TEST: an argv carrying `--session-grant XYZ`, `--token=ABC` and `token=DEF` produces a refusal in which none of XYZ / ABC / DEF appears; a recognised deputy argv yields the allowlisted hint.
     (3) Fix the stale AdmissionGap doc comment (activation.rs ~289: "exit on their own").
    One targeted cargo test run on this host, make check-ci-fast, then push to #4702. COMMIT your work.
