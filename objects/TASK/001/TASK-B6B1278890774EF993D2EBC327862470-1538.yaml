  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit + bwrap fixture):** `salvage_capped` records `# head: <oid>` in the patch and, before writing, compares the new patch body and bundle ref header with the newest salvage in `.aida/salvage/<clone>/`; identical (same clone, head, checkpoint/unpushed refs, changes) returns the existing path and writes nothing. Pure helper `identical_salvage` unit-tested without bwrap; `task_3922_bwrap_repeated_destroy_writes_one_salvage` drives `destroy` twice (skips without bwrap).
    - **AC2 (unit, aida-core):** `admission_gap` appends a per-pid next step to every unverified writer: `kill <pid>` plus the restart (MCP: reconnect from its client; otherwise rerun its command line). Display drops "should exit on their own". Test in bug_2778_admission_retry_tests.
    - **AC3 (unit):** test that `retire_with`'s refusal maps `WriterAdmissionUnknown{transient:true}` to `transient_admission` (factor the mapping into a named fn), and that the two dispatch/work.rs predicates are named fns (`refusal_is_transient`, `kept_is_transient`) tested against transient/non-transient outcomes.

    ### Expected files
    - aida-cli-lib/src/seat_clone.rs, aida-cli-lib/src/dispatch.rs, aida-cli-lib/src/queue_cmd/work.rs, aida-cli-lib/src/tests/ (new test file)
    - aida-core/src/mailbox_lifecycle/{activation,guard,retire}.rs, bug_2778_admission_retry_tests.rs, mailbox_lifecycle_stub.rs

    ### Ambiguities / conflicts as questions
    - None (the brief cites dispatch.rs for both call sites; the second is in queue_cmd/work.rs).
