title: 'Writer-admission retry: idempotent salvage per clone+head, the refusal names the stop/restart command, wiring tests (BUG-2778 follow-up)'
description: |
  BINDING follow-up to BUG-2778 (advisor-122 2026-11-26 15:16; filed by product-15). #4693 was approved with these deferred (comment on BUG-2778).

  ## Acceptance
  - AC1: a salvage is IDEMPOTENT per clone + head: reclaim_exited_branch_clone (queue_cmd/work.rs ~4251) / seat_clone destroy_inner skip writing a salvage when an identical one (same clone, same head, same checkpoint refs) already exists, so the transient-admission retries never write duplicate salvage copies. Test.
  - AC2: the final writer-admission refusal names the STOP/RESTART command for each unverified pid (e.g. a deleted-binary MCP/server or deputy), instead of "should exit on their own". Test.
  - AC3: wiring tests: retire_with maps WriterAdmissionUnknown{transient:true} to RetentionRefusal.transient_admission (aida-core mailbox_lifecycle/guard.rs ~214), and both dispatch.rs call-site predicates route a transient refusal into the retry.
