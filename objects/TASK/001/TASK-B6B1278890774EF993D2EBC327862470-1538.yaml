- id: 01a21a7f-f01d-7263-b892-0adf53e9c8d8
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: b57763c257

    Acceptance evidence:
    - AC1 [behavioral-test]: seat_clone.rs identical_salvage + salvage_capped returns the newest salvage when patch (now carrying '# head: <oid>') and bundle bytes are identical. Tests: seat_clone::task_3922_tests::the_newest_identical_salvage_is_reused (unit), lifecycle_tests::task_2053_bwrap_task_3922_repeated_teardown_writes_one_salvage (ran live under bwrap: two teardowns -> one patch+bundle; a new change -> a second pair).
    - AC2 [behavioral-test]: activation.rs restart_step appends 'stop it with `kill <pid>`, then <restart>' to each unverified writer (MCP: reconnect from its client; else rerun its args, first 6 shown; empty cmdline named). Display no longer says 'should exit on their own'. Tests: bug_2778_admission_retry_tests::{a_deleted_binary_writer_is_named_and_transient, a_live_unknown_writer_is_named_and_never_transient, a_non_mcp_writer_is_restarted_with_its_own_arguments}.
    - AC3 [behavioral-test]: retire_with_maps_a_transient_admission_refusal (aida-core, injected run); dispatch::reuse_refusal_is_transient and queue_cmd::work::kept_for_transient_admission are now named and passed directly at both call sites; tests lane_reuse_retries_only_a_transient_refusal, rework_reclaim_retries_only_a_clone_kept_for_a_transient_refusal.

    Probe findings / fixes:
    - Probe 5 (fail-open): a first draft compared only the bundle header; a damaged earlier bundle with an intact header would have skipped a fresh bundle before SalvageUnshipped removes the clone. Fixed to full byte comparison (any difference writes a new salvage).
    - Probe 3: newest patch chosen by stamp name (lexicographic = chronological); a truncated earlier patch never matches (marker line); a truncated new salvage skips dedupe.

    Residual risks:
    - The restart command joins argv with spaces, unquoted; an argument with spaces is shown ambiguously (informational text only).
    - If git bundle output ever varied for identical refs, a retry writes a duplicate (safe direction). Live bwrap test showed it stable.
    - Diff ~290 lines incl. tests, over the brief's 200-line budget; production code ~110.

    Tests: aida-core bug_2778 8/8; aida-cli-lib task_3922 + neighbouring task_2053 salvage tests 7/7; make check-ci-fast exit 0.
