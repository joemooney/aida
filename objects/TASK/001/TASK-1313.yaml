- id: 01a0c28b-1c81-7b32-8b68-84758dd2322c
  author: joe
  content: |-
    SCOPING NOTE ON MY CRITERIA 5-7, measured so they are not read more broadly than the evidence supports.

    I checked whether anything is silently dropped from the store today:

      store yaml files      4197
      aida list --all rows  4197
      aida cache verify     checked 4197, diverged 0

    Nothing is missing. AIDA own Rust parser reads the !Custom tag without complaint. The failure I hit is PyYAML SafeLoader rejecting it, which is precisely what TASK-184 describes -- a STANDARD parser failing on store objects, not AIDA failing on them.

    SO CRITERION 7 IS CONDITIONAL, not universal. If this check ships INSIDE aida in Rust, the !Custom problem does not arise and criterion 7 costs nothing to satisfy. If it ships as a script -- and a mojibake sweep is exactly the kind of thing written as a quick script first -- it inherits TASK-184 and will silently report the affected objects clean.

    That makes criterion 6 the load-bearing one of the three, because it holds either way: a parse failure must be reported as a FAILURE and never as zero findings, whatever language the check is written in. Criterion 7 is the specific instance of 6 that bites a script author.

    I am recording this because my earlier comment could be read as saying AIDA is blind to a share of its own store. It is not, and I had not verified that when I wrote it. The blindness is in external tooling reading the store, and the reason it matters here is that the detector this spec asks for is likely to start life as external tooling.
