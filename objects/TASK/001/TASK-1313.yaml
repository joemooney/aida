title: 'aida doctor has no check for round-trip artifacts in stored spec text: a read-modify-write through rendered output swallows neighbouring fields into the description and mis-decodes UTF-8'
description: |
  Filed by the driver advisor 2026-09-20 22:38 on the reviewer's suggestion, after a
  corruption incident in this repo's own store.

  WHAT HAPPENED. The driver advisor edited spec descriptions by extracting them from
  `aida show --full` and round-tripping through a unicode_escape decode. That mis-decodes
  UTF-8: an em-dash became mojibake. Three specs were damaged over roughly an hour.

  The repair pass then reached TWO of three and was reported as complete, because the
  verification grepped for the mojibake form the FIRST corruption produced, while the
  repair had re-encoded the survivor into a different form. BUG-1522 kept three damaged
  sequences through a repair that was announced as clean.

  Final state of the damage, established by reading raw bytes rather than parsed text:

      file bytes   c3 83 c2 a2 c3 82 5c 78 38 30 c3 82 5c 78 39 34
      parsed       U+00C3 U+00A2 U+00C2 U+0080 U+00C2 U+0094

  where 5c 78 is a literal backslash-x: YAML's escape for U+0080 inside a double-quoted
  scalar. So the file stores escape TEXT and the parser yields control characters — two
  layers, and a reader inspecting either one alone describes it differently. Both
  descriptions of this incident were correct about different layers.

  ALL THREE SURVIVING INSTANCES WERE IN CRITERION-ADJACENT TEXT, which is why this is not
  cosmetic:

      1  the c9 rationale: "...passes silently <garbage> which is the exact failure this
         whole spec exists to..."
      2,3 the denominator paragraph: "The recent slice is the workable one <garbage> 84%
         of the last 24h carry a sha <garbage> so the predicate is viable for live work"

  That second passage is the one that stops a later reader softening a criterion. An
  implementer reading a criterion through mojibake either guesses or stops.

  CURRENT STATE: repaired. A sweep of all 4196 object files finds zero remaining.

  THE DETECTOR IS FOUR LINES AND ITS PRECISION MATTERS. The reviewer's form is: a lead
  character in {U+00C2, U+00C3, U+00E2} IMMEDIATELY FOLLOWED BY a latin-1 supplement
  character. Zero false positives across 4196 files.

  The advisor first ran a version that dropped the "immediately followed by" clause and
  flagged six additional files — BUG-1111, BUG-1452, BUG-1310, BUG-1106, BUG-1450,
  STORY-1405 — all of which are CLEAN. A single Â, Ã or â is an ordinary letter; it is the
  PAIR that indicates a mis-decode. A check shipped in the loose form would send readers to
  six healthy specs and train them to ignore it.

  ## Acceptance

  SCOPE CORRECTED AGAIN 2026-09-20 22:48. THE PRODUCER IS IDENTIFIED AND MOJIBAKE IS THE
  WRONG PRIMARY DETECTOR — it finds 6 of the 9 damaged specs, and which 6 depends on
  nothing but whether the round-tripped text happened to contain a non-ASCII character.
  Reviewer's finding; reproduced by the driver advisor.

  THE PRODUCER: A READ-MODIFY-WRITE THROUGH RENDERED OUTPUT. A seat reads a spec with
  `aida show` (which emits TOON when piped), captures stdout, and writes it back through a
  description edit. Two things happen in that round trip:

    1  the TOON rendering carries the NEIGHBOURING FIELDS, so the closing quote,
       execution_mode, relationships and next blocks are swallowed into the description
       value — the spec's description ends up containing its own rendered output;
    2  the capture path decodes UTF-8 as latin-1, so any non-ASCII character is
       mis-decoded. An em-dash becomes the mojibake this spec was originally about.

  (2) only fires when the text HAPPENED to contain a non-ASCII character. (1) fires every
  time. So mojibake is the visible third of the damage and the swallowed block is the
  whole of it.

  Confirmed by the git log: each corruption entered in exactly one commit, and BUG-1106's
  diff at b1b3b0aa27 (2026-09-12T10:23) shows the description converted from a YAML BLOCK
  SCALAR to a double-quoted single-line scalar with literal escapes, mis-decoding the
  em-dash in the conversion. The text was not born corrupted; it was re-serialised.

  MEASURED, parsed-value scan of all 4197 store objects:

      descriptions containing swallowed TOON        9
        of those, also carrying mojibake            6
      mojibake WITHOUT swallowed TOON               0

  Perfect correlation, one direction only. (A tenth match, TASK-1208, is a FALSE POSITIVE
  on a `next[N]{` probe against ordinary prose discussing the convention — checked, not
  counted.)

  THREE OF THE NINE WERE THIS SESSION'S OWN, and they are now clean: BUG-1522
  (16331 -> 8963), BUG-1531 (9598 -> 6446), BUG-1466 (4378 -> 3928). The earlier repair
  had fixed their em-dashes and left the swallowed blocks in place — it addressed the
  symptom a detector could see and not the damage that produced it. Six pre-existing
  instances remain, untouched: BUG-1106, BUG-1111, BUG-1310, BUG-1450, BUG-1452,
  STORY-1405.

  1. `aida doctor` gains a check for round-trip artifacts in stored spec text, reporting
     the spec id, the field and the offset.
  2. THE PRIMARY PREDICATE IS THE CAUSE, NOT THE SYMPTOM, AND IT IS LINE-ANCHORED AT
     COLUMN 0. A description containing a TOON row header AT THE START OF A LINE is a
     round-trip artifact:

         ^(?:relationships|next)\[\d+\]\{      or      ^execution_mode:

     ANCHORING IS WHAT SEPARATES THE LEAK FROM PROSE, and it is not a refinement — the
     unanchored form flags this very spec. A genuine swallow puts the header at the start
     of a line because that is where the TOON renderer emits it. Prose discussing the
     convention puts it inline, usually inside backticks.

     MEASURED over all 4197 store objects, parsed descriptions:

         unanchored                        10 hits
         anchored (leading indent allowed)  6 hits
         anchored at column 0               6 hits   <- identical set

         dropped by anchoring: BUG-1422, STORY-1132, TASK-1208, TASK-1313
         retained:             BUG-1106, BUG-1111, BUG-1310, BUG-1450, BUG-1452,
                               STORY-1405

     Four false positives removed, no true positive lost, and the two anchored forms agree
     exactly on the current store.

     USE THE COLUMN-0 FORM. It costs nothing today and it closes the case a leading-indent
     anchor would still flag: a spec quoting a TOON sample as an INDENTED CODE BLOCK. No
     such spec exists in the store today, so this is a cheap guard against a shape someone
     will eventually write rather than a fix for an observed miss.

     THE TRADE-OFF IS CONCATENATION, NOT INDENTATION. An earlier draft of this criterion
     named an indented swallowed block as the risk the anchor buys. That is the wrong
     failure mode. Checked against what actually precedes the header in all six real
     instances:

         BUG-1106    ...role-queue refusal.\n"\n        BUG-1450   ...pending review.\n"\n
         BUG-1111    ...the same run's retry.\n"\n      BUG-1452   ...than an accident.\n
         BUG-1310    ...reading alongside this.\n"\n    STORY-1405 ...independence rule.\n

     Six of six at a line start, every one preceded by a newline, four of them by a closing
     quote on its own line. Nothing is indented or close to it. Meanwhile all four false
     positives are mid-line, which is what makes the separation exact.

     The realistic miss is a MID-LINE APPEND: if a capture path strips the trailing newline
     before the header, or the description's own last line lacks one, the header lands mid
     line. Then the unanchored form catches it and BOTH anchored forms — column-0 and
     indent-allowing alike — miss it identically. So anchoring does not trade false
     positives against indented blocks; it trades them against concatenation. An
     implementer told to watch for indentation will not think about a missing newline.

     THE LIMIT OF THE EVIDENCE, stated because it bounds the claim: all six instances came
     from ONE producer (the greedy-DOTALL capture path), so they share its newline
     behaviour by construction. Six of six establishes that the CURRENT producer emits
     line-anchored headers. It does not establish that the next one will.

     That argues for the mid-line case being a required FIXTURE rather than for weakening
     the anchor — see 7f. If that test proves awkward to satisfy, the honest resolution is
     to report the anchored form as primary and keep the unanchored form as a second,
     noisier pass a human can eyeball: four known false positives is a readable list, not
     the flood that makes a check ignorable.

     THIS SPEC IS ITSELF THE WORKED EXAMPLE. Its own description contains the sentence
     defining the predicate, so the unanchored form flags the document that defines the
     detector, in the clause that defines it.

  3. THE MOJIBAKE CHECK IS RETAINED ALONGSIDE IT, not instead of it. The two find
     overlapping but different sets: a round trip through a path that does not emit TOON
     would corrupt encoding without leaving a row header. Its predicate is the alternation
     — a lead character in {U+00C2, U+00C3, U+00E2} followed by EITHER a latin-1
     supplement character OR the literal backslash-x plus two hex digits.
  4. THE CHECK STATES WHICH LAYER IT SCANS, and this is what made two seats disagree about
     the same six files for an hour:

         FILE TEXT      the damage reads as lead char + literal backslash-x-8-0
         PARSED VALUE   the same damage reads as lead char + U+0080 + U+0094

     because YAML's parser turns the escape into the control character. A file-text scan
     needs the (b) alternative; a parsed-value scan catches them with (a) alone. Scan the
     parsed value, or scan both and say so. Without this the alternation is still
     under-specified.
  5. The check REPORTS and does not repair. Repairing a swallowed block means
     reconstructing what was displaced, and the pre-corruption text is in the orphan
     branch's git history — a recoverable edit for whoever owns each spec, not a guess.
  6. Coverage is the whole object store and every text field, not only descriptions.
  7. TESTS, negative cases load-bearing:
     7a. a legitimate lone Â/Ã/â produces NO mojibake finding;
     7b. prose that merely DISCUSSES the TOON convention produces no round-trip finding.
         TWO negative cases are required, both real: an INLINE mention (TASK-1208,
         TASK-1313, BUG-1422, STORY-1132 all match unanchored and must not match), and an
         INDENTED CODE BLOCK containing a TOON sample, which a leading-indent anchor would
         still flag and the column-0 form must not;
     7c. a raw-form mis-decode produces one finding;
     7d. an escaped-form mis-decode produces one finding;
     7e. a swallowed TOON block with NO non-ASCII character produces one finding. This is
         the case the original spec would have missed entirely;
     7f. a swallowed header appended MID-LINE (no newline before it) is still found.
         Both anchored forms miss this shape, so satisfying 7f requires either a
         second unanchored pass or a smarter predicate. It is required because the
         six observed instances all come from ONE producer and prove only that THAT
         producer emits line-anchored headers.

  ## Open question

  WHICH SEAT OR TOOL RUNS THE ROUND TRIP is not established. The pattern is in use since at
  least 2026-09-12 and produced instances as recently as 2026-09-20 18:29, from more than
  one seat. The three from this session are accounted for — a greedy DOTALL regex over
  `aida show --full` output, which matched to the last quote in the rendering and swallowed
  every field after it. Whether the older six share that exact mechanism or only the
  anti-pattern is unknown, and the git diffs are the place to settle it.
