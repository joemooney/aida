title: aida doctor has no check for mojibake in stored spec text, so a corrupted acceptance criterion is invisible until someone reads that one spec
description: |
  Filed by the driver advisor 2026-09-20 22:38 on the reviewer's suggestion, after a
  corruption incident in this repo's own store.

  WHAT HAPPENED. The driver advisor edited spec descriptions by extracting them from
  `aida show --full` and round-tripping through a unicode_escape decode. That mis-decodes
  UTF-8: an em-dash became mojibake. Three specs were damaged over roughly an hour.

  The repair pass then reached TWO of three and was reported as complete, because the
  verification grepped for the mojibake form the FIRST corruption produced, while the
  repair had re-encoded the survivor into a different form. BUG-1522 kept three damaged
  sequences through a repair that was announced as clean.

  Final state of the damage, established by reading raw bytes rather than parsed text:

      file bytes   c3 83 c2 a2 c3 82 5c 78 38 30 c3 82 5c 78 39 34
      parsed       U+00C3 U+00A2 U+00C2 U+0080 U+00C2 U+0094

  where 5c 78 is a literal backslash-x: YAML's escape for U+0080 inside a double-quoted
  scalar. So the file stores escape TEXT and the parser yields control characters — two
  layers, and a reader inspecting either one alone describes it differently. Both
  descriptions of this incident were correct about different layers.

  ALL THREE SURVIVING INSTANCES WERE IN CRITERION-ADJACENT TEXT, which is why this is not
  cosmetic:

      1  the c9 rationale: "...passes silently <garbage> which is the exact failure this
         whole spec exists to..."
      2,3 the denominator paragraph: "The recent slice is the workable one <garbage> 84%
         of the last 24h carry a sha <garbage> so the predicate is viable for live work"

  That second passage is the one that stops a later reader softening a criterion. An
  implementer reading a criterion through mojibake either guesses or stops.

  CURRENT STATE: repaired. A sweep of all 4196 object files finds zero remaining.

  THE DETECTOR IS FOUR LINES AND ITS PRECISION MATTERS. The reviewer's form is: a lead
  character in {U+00C2, U+00C3, U+00E2} IMMEDIATELY FOLLOWED BY a latin-1 supplement
  character. Zero false positives across 4196 files.

  The advisor first ran a version that dropped the "immediately followed by" clause and
  flagged six additional files — BUG-1111, BUG-1452, BUG-1310, BUG-1106, BUG-1450,
  STORY-1405 — all of which are CLEAN. A single Â, Ã or â is an ordinary letter; it is the
  PAIR that indicates a mis-decode. A check shipped in the loose form would send readers to
  six healthy specs and train them to ignore it.

  ## Acceptance

  ACCEPTANCE CORRECTED 2026-09-20 22:44. The predicate first written here MISSES 6 OF THE
  7 CORRUPTED FILES IN THIS STORE. Caught by the reviewer against their own detector;
  re-measured by the driver advisor before correcting.

  THE TWO FORMS. A mis-decoded em-dash (U+2014 = E2 80 94, read as latin-1) appears in the
  store in two shapes:

      RAW      lead char + latin-1 supplement char        (what BUG-1522 held after repair)
      ESCAPED  lead char + literal backslash-x + 2 hex    (YAML's escape for the control
                                                           characters inside a quoted scalar)

  The strict predicate — lead char IMMEDIATELY FOLLOWED BY a latin-1 supplement character —
  matches the raw form only. In the escaped form the next character is a backslash, so it
  matches nothing. Measured across the object store:

      files scanned         4197
      files affected           6      raw 0, escaped 25
      per file   BUG-1452 8, STORY-1405 6, BUG-1450 5, BUG-1106 2, BUG-1111 2, BUG-1310 2

  BUG-1522 was the RARE case and was visible only because a failed repair had pushed it
  into a second mangling layer. The common form was invisible to the strict rule.

  1. `aida doctor` gains a check that scans stored spec text for mojibake and reports the
     spec id, the field and the offset.
  2. THE PREDICATE IS AN ALTERNATION. A lead character in {U+00C2, U+00C3, U+00E2} followed
     by EITHER
         (a) a latin-1 supplement character, or
         (b) the literal two characters backslash-x followed by two hex digits.
     A LONE lead character is NOT a match: Â, Ã and â are ordinary letters, and requiring
     the pair is what keeps the check from firing on healthy text. Reject the
     single-character form IN A COMMENT saying why, and reject the (a)-only form in a
     comment too — (a) alone is the spelling that missed 6 of 7 here.
  3. The check REPORTS and does not repair. Guessing the intended character is how
     BUG-1522's second corruption layer was produced.
  4. It covers the whole object store and every text field, not only descriptions.
  5. TESTS, and the negative cases are the load-bearing ones:
     5a. a file with a legitimate lone Â/Ã/â produces NO finding;
     5b. a raw-form mis-decode produces exactly one finding;
     5c. an ESCAPED-form mis-decode produces exactly one finding.
     A suite with only 5b passes against the (a)-only predicate, which is the defect this
     correction exists to prevent.

  ## Open question, not this spec's job to answer but worth its priority

  THE PRODUCER IS UNIDENTIFIED AND WAS ACTIVE BEFORE THIS SESSION'S EDITING INCIDENT. All
  six escaped-form files were last modified between 2026-09-12 10:23 and 2026-09-20 18:29,
  and the driver advisor's faulty edit method did not run until roughly 21:30. All six
  carry the corruption in the `description` field. So something that writes descriptions
  has been producing mojibake for at least eight days, independently of the incident that
  prompted this spec.

  That raises this check's value: it is not a one-off cleanup after one seat's bad tooling,
  it is a detector for an ongoing and unattributed producer. Identifying the producer is a
  separate investigation and should be filed separately once the check makes the instances
  visible.
