title: Bisect halves drop a member whose PR head moved since the parent train was built, instead of re-testing the superseded head (BUG-2767 follow-up)
description: |
  Follow-up to BUG-2767 (#4615, in review and provisionally live). advisor-122 2026-11-25 20:05 (filed by product-15). Bisect half #4613 (of #4611, built 01:50Z) carried #4482 at its ORIGINAL member head 04aa3b22, although #4482 had since moved to an approved fix head cd340a59. The half re-tested the superseded head and went red on the same store-writer inventory row: a wasted ~45 min CI cycle.

  ## Acceptance
  - AC1: when a bisect half (or any follow-up train) is built, a member whose PR head has moved since the parent train was built is DROPPED from the half as superseded, not tested. It re-enters later at its new approved head through normal admission.
  - AC2: the drop is logged and named in `aida pr train --check` / the train body ("superseded: head moved 04aa3b22 → cd340a59").
  - AC3: a test: a member whose head moved is dropped from the bisect half, and the remaining members are still tested.
