  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - AC1 (unit, `drive_into`): before building any follow-up train (bisect half, stale requeue, infra rerun) the driver reads each member's live forge head through a new `Rails::member_head` hook (live impl: `forge_confirmation::metadata`, Known reads only). A moved member is dropped as superseded, never built or tested; it re-enters via normal admission. The first composition is not re-read (it was just admitted).
    - AC2: the drop is an `Ejected` with reason `superseded: head moved <old> → <new>; ...` (logged in the run summary and commented on the member PR), carried in `Built.dropped`, and rendered as a `Superseded:` line in the train PR body.
    - AC3 (unit, story_1690_train_tests): red 3-member train, one member's head moves; the bisect halves exclude it, the other members are still built/tested, it is ejected with the superseded reason.

    ### Expected files
    - `aida-cli-lib/src/pr_train.rs`
    - `aida-cli-lib/src/tests/story_1690_train_tests.rs`

    ### Ambiguities / conflicts as questions
    - An unreadable head (transient forge read) keeps the member in the half at its admitted head (the land-time re-gate still refuses a moved head). OK?
