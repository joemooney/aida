title: 'Regen scorer hardening follow-ups from #2660: guard pipe path is trial-redirectable; survivor detection evadable; no timeouts; bwrap tests silently skip'
description: 'From the #2660 round-2 adversarial review (non-blocking): (1) guards write to $AIDA_REGEN_GUARD_PIPE, so trial code the oracle invokes can redirect it to /dev/null and drop events: pin the FIFO path into the frozen guard scripts at freeze time and verify it is a FIFO (S_ISFIFO). Document that guards detect accidental fallback, not a hostile trial (same class as absolute-path calls). (2) A daemon that chdirs to / and closes fds evades survivor detection; the quarantine still isolates the filesystem, but pid/net namespaces are shared (depends on TASK-1774 --unshare-pid). (3) Add install and oracle timeouts; bound snapshot copy depth and size. (4) bwrap-dependent tests return early when bwrap is absent: make CI provide bwrap or mark them explicitly skipped-with-reason.'
