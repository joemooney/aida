title: Make --zen a typed engine parameter (kill the AIDA_ZEN env-var side-channel) — fully realize ADR-7 uniform autonomy parameterization
description: 'ADR-7 holds that autonomy mode parameterizes the per-spec engine pauses uniformly across zen/integrate/queue-work. Today only half-realized: --no-human is a clean typed engine parameter, but --zen is threaded as an AIDA_ZEN env-var side-channel read in scattered spots. Converge --zen to a typed parameter threaded through the engine like --no-human, removing the env-var reads, so autonomy mode is uniformly parameterized. CAREFUL: touches the autonomy keystone engine threading - ship supervised at the keyboard, not via unattended zen/drain. Surfaced by the ADR-7 guided-implement decision dialog.'
