title: 'CI gate candidate: compile aida-cli with --no-default-features so the cfg-stub twins (e.g. tui feature) stay buildable'
description: 'Surfaced during PR 2429 (tui_entry.rs slice-1 module 2): the extracted handle_tui_command carries a cfg(feature = "tui") implementation and a cfg(not(feature = "tui")) stub twin, but CI has no --no-default-features build, so a broken stub only fails for users building without default features. The 2429 self-check caught this and verified the stub compiles manually. A cheap gate (cargo check -p aida-cli --no-default-features, or workspace-wide) closes the gap for all ~45 slice-1 modules and any other feature-gated pair. Candidate for ci-gate-tiers; keep it in the fast tier if check-only.'
