title: 'Review follow-up: Multiplicity: admission_owner.rs record_waiter keeps a single manual-train.waiter file and'
description: |-
  From BUG-2771
  Reviewed sha: d50327f98225c7efecf58776048dfded12f1843e

  Multiplicity: admission_owner.rs record_waiter keeps a single manual-train.waiter file and writes/removes it outside the admission serializer. Two operator trains for different PR sets overwrite each other (only the last is shown/kept, `since` resets), and one train's successful admission (remove_file in manual_train_admission) deletes another still-waiting train's record. The auto-train still yields while any record exists, so no starvation regression, but the second waiter loses its visibility and its yield. Consider per-PR-set records or doing the write/remove under lock_serial.
