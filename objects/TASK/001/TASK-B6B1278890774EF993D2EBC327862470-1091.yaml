  content: 'Product grooming: there is a third cap the acceptance does not name. aida-cli-lib/src/land.rs:28 has MAX_CONTENT_ROUNDS = 3, and land.rs:440 sends a change to an advisor ruling after 3 content rounds of requested changes. With the watcher at 4, aida land would block a PR at round 3, before the watcher''s cap is reached. Recommend widening AC1 so land.rs reads the same [review] max_rounds key (no separate literal), and adding a land test: with max_rounds=4, round 3 still dispatches rework and round 4 routes to the advisor. Whether land should keep a separate content-round count is the advisor''s call; the default must stay the old behaviour either way.'
