title: Review-round cap is a project setting (default 2); this project sets 4
description: |
  Operator instruction 2026-11-15 23:36 MST: the review-round cap for this project is 4, not 2.

  The cap is hardcoded today: `aida-cli-lib/src/review_watch.rs:84` `RETAINED_ROUNDS = 2`, and `history.blocking() >= 2` at review_watch.rs ~964, ~989, ~1726, ~1826 and review_watch_notice.rs:38. Notice/wake prose says "two-round" (review_watch_notice.rs:244, :253, :266, :293, :303) and fire-mode / throughput discipline docs say two rounds.

  Per the process-policy-as-knob rule, ship it as per-project config with the old behaviour as default.

  ## Acceptance
  1. A config key (e.g. `[review] max_rounds`, integer >= 1, default 2) is read by every cap check in the review watcher, reviewer pickup and round-cap wake; no literal 2 remains for the cap.
  2. Rounds retained (`RETAINED_ROUNDS`) is at least the configured cap, so round N of M notices are correct.
  3. Notice and wake text show the configured number ("round 3 of 4", "4-round review cap reached"), not "two-round".
  4. This repository's `.aida/config.toml` sets the cap to 4.
  5. Tests: the existing task1993 two-round-cap test keeps passing at default; a new test with max_rounds=4 dispatches rounds 3 and 4 and skips round 5.
  6. Discipline docs (template masters under aida-core/templates, then make sync-templates) describe the cap as configurable and name this project's value.
