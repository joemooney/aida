    ## Implementer self-review
    Reviewed HEAD: 2edf9a4130ad93f63f9d7b6c1f3f757f66df3ac1. The merge-base diff was empty. Reviewed the native working diff and checked for untracked additions.

    - AC1: [evidence: behavioral-test] Watcher selection, preflight and pickup use the same positive project setting. See aida-cli-lib/src/review_watch.rs:1094, :1780, :1880 and :2728. The round-cap regression exercises selection and the pickup round calculation. The existing two-round test exercises default refusal.
    - AC2: [evidence: behavioral-test] The preflight persists four blocking rounds before parking a fifth head. The regression removes live verdict files and verifies a reopened watcher still parks it. See aida-cli-lib/src/tests/task_1945_review_watch_notice_tests.rs:187.
    - AC3: [evidence: behavioral-test] The same test checks round notices through 4 of 4, one 4-round advisor wake and re-arming after a recorded default-cap wake. See aida-cli-lib/src/review_watch_notice.rs:38 and :78.
    - AC4: [evidence: configuration-validation] Parsed .aida/config.toml:532 as integer 4 and verified the worktree policy inventory at scripts/config-trust.toml:622 with the config-trust test.
    - AC5: [evidence: behavioral-test] The final lane round_cap run passed six tests, including the existing TASK-1993 two-round case at aida-cli-lib/src/tests/task_1993_review_watch_tests.rs:271 and the new four-round and invalid-config cases. The config-trust run passed one test.
    - AC6: [evidence: documentation-inspection] Fire-mode discipline, skill and command masters and CLI docs describe the configurable policy and project value. Compared tracked discipline mirrors byte for byte and checked Claude links. The native read-only .agents mount blocked in-place portable-pack sync. A scratch pack sync and check passed.

    Deep pass covered format and multiplicity with inline TOML comments, zero, negative, string and float values, the one-round minimum, the absent-key default and successive blocking heads. Fixed the service Store constructor found by the initial compile, the old wake suppressing a wake at a higher cap, and the capped preflight skipping retention. A config or history read error refuses automatic admission. The knob selects a threshold and grants no review or merge authority. No tests were weakened. Local evidence used the native lane launcher. CodeGraph was unavailable at the operator-supplied path. The separate aida land content-round policy remains a separate decision.
