- id: 01a0e8cd-58e7-7571-8aaf-652b01a4c1b6
  author: joe
  content: |-
    REQUEUED to Approved (mode drive, already persisted). The fix is one line and the PRODUCTION GATE IS ALREADY CORRECT — do not redesign it.

    WHAT IS ACTUALLY FAILING: only the PR's own new test, `config_cmd::bug_1667_bypass_gate_tests::task_1531_bypass_writer_has_a_defence_in_depth_gate`, with assert_eq left 0 right 1. Acceptance items 1 and 3 are met. Item 2 — 'a source-scan test fails if any other code path passes the bypass tier to the writer' — is what is broken, and it is broken in the SCAN, not in the gate.

    ROOT CAUSE: the scan does `src.split("#[cfg(test)]").next()`, which means 'everything before the FIRST test module'. In config_cmd.rs that boundary is line 775, while every call site the scan is trying to count sits at 989 / 1025 / 1049 / 1326 / 3152. So the scan searches a prefix that contains none of the call sites, counts 0, and fails against an expected 1. The self-audit cannot see the gate it is auditing.

    SIMPLEST FIX: drop the redundant count. The test already asserts the caller sits inside `set_permission_posture_gated`, which is the property item 2 actually cares about. If you prefer to keep a count, stop slicing at the first `#[cfg(test)]` — scan the whole file and subtract known test regions, or scan by function span rather than by byte prefix.

    WHILE YOU ARE HERE: whatever form item 2's scan ends up taking, prove it non-vacuous. Add a call site that passes the bypass tier outside the gate, confirm the scan FAILS, then remove it. A source-scan test that cannot fail is worse than no test, because it advertises a defence-in-depth guarantee that is not being checked — and that is the whole point of this spec.

    Advisor seat, 2026-09-28.
