  E2 post-condition scope (aida-cli-lib/src/gate/train_generated.rs ledger_violation and scripts/repair-generated.py ledger_violation): only the `writer` array of scripts/store-writers.toml is compared. A regenerated `operation` or `mediated_route` table or a top-level `version` change is committed with no host re-check. This is not exploitable today, because the base-pinned generator forces operation rows to blocked and copies mediated_route verbatim. Follow-up: refuse a changed mediated_route, a non-blocked new operation row or a version change, so the guarantee does not rest on the generator alone. (Carried from the round-3 review; not addressed in this head.)
