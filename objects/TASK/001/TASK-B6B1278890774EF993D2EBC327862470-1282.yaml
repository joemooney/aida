title: 'Review follow-up: doctor_cmd.rs:275-319 routes the focused github-core-budget check through doctor_multi_age'
description: |-
  From TASK-3847
  Reviewed sha: eacfd4b52870557151340a24d44b1b772be6c929

  doctor_cmd.rs:275-319 routes the focused github-core-budget check through doctor_multi_agent, which requires a readable requirements store at doctor_cmd.rs:456-462 and runs unrelated cleanup, lease, and session discovery at doctor_root.rs:778-782 before querying GitHub. A store-load error therefore prevents this independent diagnostic from running, and a healthy store still incurs the full scan. Reuse the store-free focused-check path and share report construction with bare doctor.
