title: 'Session hygiene: stash- and other-branch-specific reap refusal guidance (split from BUG-2742)'
description: |
  Follow-up split from BUG-2742 / #4487 (advisor-122 ruling 2026-11-23 22:03, finding 3; filed by product-15). When session hygiene refuses to reap because of stashes or unique commits on another local branch, its guidance must be specific and correct.

  ## Acceptance
  - AC1: The refusal names WHICH stash entries or WHICH other branches (with their unique commit counts) hold the work, and gives a correct command to inspect or publish each one.
  - AC2: Tests: a stash-only clone and an other-branch-only clone each produce the specific guidance.
