  detail: 'On fa7e9a9c255 the production dispatch script reports ahead=0 and empty status for both a stash-only clone and a clone with one unique commit on side. Hygiene emits no salvage advice for either. The separate reap scan can skip these leases, but hygiene omits scan-skipped rows in both dry and applied runs. Should TASK-3858 expose those existing reap-scan refusals in hygiene output, or wait for a dispatch classification change? The cited #4487 finding concerns classification explicitly reverted in its r2 scope.'
