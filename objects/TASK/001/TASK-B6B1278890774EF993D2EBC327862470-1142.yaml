title: 'Review follow-up: [P2] Preserve completion-event emission when resolving the attention item. In aida-cli-lib'
description: |-
  From STORY-2897
  Reviewed sha: 4578245cc962948b515060262c736c792fda87ad

  [P2] Preserve completion-event emission when resolving the attention item. In aida-cli-lib/src/main_watch.rs:1699, transition_to_completed receives a literal None project root. completion.rs:81-84 therefore skips emit_spec_completed on every successful attention-item completion, including its SpecCompleted event and timeline publication. The new call fixes the direct-write ratchet and stamps completed_at, but consumers of the completion stream still never see this terminal transition. Thread the actual project root from Live through human_resolve and pass it to the seam; extend the real-storage attention-item test to assert one event on completion and no duplicate on retry.
