description: |-
  From BUG-2703
  Reviewed sha: 1fb82107b586e3d1239b32d9505e3070faeb6ed8

  admission_drain.rs:226: A drain issued just before a backward host-clock adjustment remains active for the entire rollback plus its requested duration. The journal validates the issue-to-expiry interval only. An otherwise valid 24-hour drain can suppress both workers and supervisor respawn for longer than the documented maximum. Bound remaining lifetime against the observer clock as for admission intents and cover rollback.
