title: 'CI fan-out: lib lane leaves ~39s headroom on the 12-min target; cache saved only from gates'
description: |
  On PR-2762 run 39366328696, CI (lib) took 11m11s of an 11m21s wall time. rust-cache save-if is gates-only (ci.yml), and the gates lane never compiles the test lanes' test binaries or aida-cli dev-deps, so the test lanes restore a cache that lacks those. Split the aida-cli-lib unit tests (as the advisor noted) and/or let a test lane save the cache.

  Raised in review of PR-2762: https://github.com/joemooney/aida/pull/2762
