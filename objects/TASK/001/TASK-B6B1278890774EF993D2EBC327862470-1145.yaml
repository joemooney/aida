title: 'Review follow-up: admission_owner.rs:692–698 adds the maximum wait to an on-disk Chrono timestamp using pani'
description: |-
  From BUG-2703
  Reviewed sha: cde727e3029eacca1b94548e8025ead322f8ef5b

  admission_owner.rs:692–698 adds the maximum wait to an on-disk Chrono timestamp using panicking arithmetic. A parseable registered_at near the maximum date can panic every admission and status scan. A future registration with a short relative duration also passes validation and can keep workers yielded well past the configured maximum after a clock rollback. Validate against observation time using checked arithmetic and cover both timestamp cases.
