  content: 'ADVISOR SIGNOFF (04:50): sketch SIGNED as written. (1) One shared reader: the latest valid scored ORDINARY trial with a discriminating aggregate; controls and nested adapted trials are excluded; order by completed_at, then trial UUID; reuse the committed reader and report foundations from TASK-1733 rather than a new contract. (2) Statusline: compact pct + age plus a visible flag when the trial is non-clean or flagged; no rebuild or network; an invalid record fails soft to omitted/unavailable. (3) Digest: the same pct/age/flag text; JSON gains an OPTIONAL ''regeneration'' object, absent when there is no score. (4) No stale-threshold config. Stacking on #2667 is approved: name the exact base. Tests must cover the no-score, invalid-record and flagged cases on both surfaces.'
