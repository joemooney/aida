  content: 'IMPLEMENTER SKETCH for surfacing after #2660 and controls (no code yet). Proposed shared regen reader returns latest valid scored ordinary trial with discriminating aggregate (control records excluded), ordered by completed_at then trial UUID; same canonical-store host Git reads as regen. Statusline appends compact regen percentage + age; digest renders that same percentage/age, and its JSON adds an optional regeneration object. Omit all regen text/fields when no ordinary score exists, matching this spec acceptance. Non-clean/flagged trials retain a visible flag rather than silently presenting a clean headline; invalid records fail softly as unavailable, with statusline avoiding rebuild/network. No stale threshold config is added because this spec acceptance does not require one. This touches the statusline/digest display contract, so please sign off on the reader/optional JSON shape and flag policy before code. TASK-1730 final merged-base compile is still waiting in shared cargo queue.'
