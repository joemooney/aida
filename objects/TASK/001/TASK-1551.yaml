  content: |-
    PROXY DECISION (orchestrator for Joe, 2026-09-27 08:12): approved, and blocked-by TASK-1537 so the baseline is measured before the change is evaluated. NOT queued yet — both this and TASK-1537 need a quiet machine, because a build timing taken while a dozen agents compete for a 2-slot gate measures queue wait, not compile cost.

    What I DID apply immediately instead, since it needed no repo change and no rebuild:
    - ~/.local/bin/cargo default CARGO_BUILD_JOBS 3 -> 2. On 6 cores with 2 slots that is 4 compile jobs, leaving 2 cores for agent overhead and the orchestrator's own latency-sensitive aida calls. Joe suggested 1; I did not use 1 because 2 slots x 1 job would leave 4 of 6 cores idle and make each build roughly three times slower, cutting throughput to buy responsiveness that nice already buys more cheaply.
    - The wrapper now execs cargo under 'nice -n 10', so builds are throughput work that yields to interactive work.
    - Reniced the 57 already-running cargo/rustc/sccache processes, since the wrapper change only affects new invocations. Measured effect: CPU went from 68% user / 0% nice / 20% idle to 19% user / 40% nice / 12% idle, so the build load is now explicitly yielding.
    - Backup of the original wrapper at ~/.local/bin/cargo.bak-20260927.

    The largest remaining lever is not a compiler flag, it is my own brief template: I had been telling every implementer to run 'cargo test --workspace' AND 'cargo clippy --workspace'. On 6 cores that is a dozen full workspace builds plus a dozen full suites, and clippy after test is close to an extra full build because it recompiles with different flags. Evidence it was actively harmful: a strict reviewer had to cancel its own queued test run because it sat behind other agents' full-suite builds, and my own 'aida doctor check performance' was killed at a 100 s timeout. Implementers now run build-fast plus TARGETED tests plus fmt, and the full workspace suite runs once at integration, where it actually gates the merge and where CI repeats it anyway.
