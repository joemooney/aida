  content: |-
    MEASUREMENT CORRECTION (orchestrator, 2026-09-27 09:05): the binding constraint on this host has MOVED, and it changes what this spec should optimise.

    At 08:05, with ~12 agents active: CPU 68% user, iowait 1.3%, load 6.7 on 6 cores. CPU-bound. That is what the jobs=3→2 and nice -n 10 changes addressed, and they worked — my own commands stopped timing out and nice time rose to 46%.
    At 09:00, same fleet: CPU 12.2% user, **iowait 57.2%**, idle 23.9%, and 38 cargo processes queued behind 2 slots. DISK-bound. So compiler flags and CPU scheduling are now the wrong lever, and raising AIDA_CARGO_SLOTS would make it worse rather than better. I considered raising it to 3 and rejected that on this evidence.

    I applied the one cheap I/O remedy: the wrapper now also wraps cargo in 'ionice -c 2 -n 7' (nice governs CPU only and does nothing for I/O scheduling), and I reioniced the 57 running processes. That protects interactive latency but does NOT raise throughput.

    MEASURED ROOT CAUSE of the I/O saturation, and it is not the compiler: each worktree carries its OWN cargo target directory and does its own COLD full build. /home/joe/ai/wt-story-1478 alone is already 18G. Thirteen concurrent worktrees at that size is on the order of 230 GB of writes for what is largely the same compilation, which also explains why the sccache hit rate sits at only 41%.

    So the largest remaining throughput lever is a SHARED target directory (CARGO_TARGET_DIR) across agent worktrees, not opt-level. The trade to evaluate: cargo locks a target directory, so concurrent builds would serialise to roughly one at a time, but each would be WARM and incremental (single-digit minutes) instead of cold (11m33s measured today). Serialised-and-warm plausibly beats parallel-and-cold, and it would remove hundreds of gigabytes of duplicate writes. It needs measuring, not assuming.

    Same timing rule as the rest of this spec: do NOT change it mid-wave. Switching CARGO_TARGET_DIR now would force every in-flight agent to rebuild from scratch in the new location. Sequence it with TASK-1537's baseline on a quiet machine, and measure cold-parallel against warm-serialised with the concurrency recorded beside each number.
