title: docs/plans/ is created on first use, not at init
description: |-
  Part of shrinking init's main-branch footprint: init pre-creates docs/plans/ + _TEMPLATE.md in every project, which is noise for projects that never write a plan. Create the directory (and drop the template into it) lazily — on the first aida ultraplan, plan verify --fix output, /aida-import-plan landing, or any AIDA surface that writes a plan file. Init stops creating it; ensure_plan_template_scaffold moves behind the first-use call sites. aida init --refresh on a project that already has docs/plans/ leaves it exactly as is.

  Acceptance: fresh init has no docs/ directory at all (unless another artifact needs it); first plan-writing command creates docs/plans/ + _TEMPLATE.md exactly as init used to; existing projects unchanged.
