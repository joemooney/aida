title: 'Drive tick: run_spec must force-gate a relay ticket the store does not know'
description: |
  aida-cli-lib/src/mandate_drive.rs:277 run_spec returns the first PREFIX-N token in relay.status ticket=/spec= without checking it is a store spec (unlike R3-1's resolving_action). A ticket such as PR-12 becomes spec "PR-12"; spec_always_human finds no ledger entry and no requirement, so the Redispatch/FixSetup lane routes to the advisor ungated instead of taking the RUN_SPEC_UNKNOWN forced gate. Fix: filter to store-known ids (or resolve PR-N to its specs) and fail closed otherwise; add a test.

  Raised in review of PR-2725: https://github.com/joemooney/aida/pull/2725#issuecomment-6260881377
