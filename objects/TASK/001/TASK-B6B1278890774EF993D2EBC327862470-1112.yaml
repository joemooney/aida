description: |
  From BUG-2619
  Reviewed sha: 6f529cc258955fc4e30d8a6ff622dfbbfa7dc4b2

  [P2 test-gap] agent_launch.rs:1829-1834: the private-clone validation boundary (host_recorded_clone) is not exercised. Deferred; noted on BUG-2619.

  ## Acceptance
  1. Exercise Claude transcript fallback in an isolated fixture where the expected transcript is missing and the only matching transcript belongs to a private clone in the seat inventory.
  2. With valid host registration, recover that clone's canonical cwd. With missing host registration and otherwise identical evidence, refuse recovery before launching Claude. Assert both results through the same recovery entry point.
