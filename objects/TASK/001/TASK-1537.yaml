    PROXY DECISION (orchestrator for Joe, 2026-09-27 07:48): queued and blessed, but DELIBERATELY NOT DISPATCHED YET, and the reason is methodological rather than a capacity limit.

    TASK-1537 measures baseline build timings for aida-cli-lib, and that measurement is the gate that justifies or kills the whole STORY-1488 crate split (T2-T5 are blocked behind it). Right now there are roughly a dozen agents building concurrently on this machine behind a 2-slot cargo flock gate, so a build timed today would mostly be measuring queue wait for a build slot, not compile cost. That number would then be used to decide an architecture change. Taking it now would produce a confidently wrong baseline.

    Dispatch condition: run it when the fleet is quiet, ideally with AIDA_CARGO_SLOTS effectively uncontended, and have the implementer record the concurrent-build conditions alongside every timing so the number is interpretable later. A baseline without its load conditions recorded is not reusable evidence.
