title: pre-commit guard warns when a scoped session's commit touches paths outside its worktree (detect-not-prevent)
description: 'Quizdom #8: an agent in a scoped session landed edits in the shared main checkout (wrong cwd/abs path) instead of its worktree. AIDA cannot PREVENT file writes (harness/git-worktree concern), but it can DETECT: a pre-commit guard (git hook, scaffolded) that, when a scoped session (AIDA_SESSION_ID set, worktree lease present) commits, warns if the commit touches paths resolving OUTSIDE the session worktree. Warn-only (does not block); does not attempt harness-level enforcement. Recurrence of the isolation-discipline family. Acceptance: a scoped-session commit touching out-of-worktree paths emits a clear warning naming the stray paths; an in-worktree commit is silent; non-scoped sessions unaffected; the guard is scaffolded by aida init hooks; unit/integration test the path-scoping check. Mode drive.'
