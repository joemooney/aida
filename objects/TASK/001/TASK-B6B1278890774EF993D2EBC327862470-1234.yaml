  doctor_cmd.rs:490 and :2038–2041. An unfiltered doctor holds the permanent journal lock while iterating every reservation and can launch several salvage probes per surviving tree, each with a 120-second default timeout. This can delay unrelated doctor diagnostics and make ordinary repair writers exhaust their 10-second lock wait. Keep general diagnostics bounded and keep informational tree probes out of the shared lock's critical section.
