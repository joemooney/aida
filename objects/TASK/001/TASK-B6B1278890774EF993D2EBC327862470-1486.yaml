title: 'Review follow-up: ResourceWatch measures its deadline from script start, not from job start (scripts/ci-test'
description: |-
  From BUG-2768
  Reviewed sha: e430c0baf88df0c260070b7093e640e9838d6a29

  ResourceWatch measures its deadline from script start, not from job start (scripts/ci-test-shards.py ResourceWatch.__init__; ci.yml AIDA_CI_TEST_DEADLINE_SECS=1980). On the first cold-cache run under the new ci-dev-profile-lib-lines key, setup plus 'Build aida binary for lib unit tests' can take more than 7 minutes. The 40-minute job timeout then fires before the 33-minute deadline, and the lane still ends in a silent cancel. Consider deriving the budget from the job start, for example a timestamp written in an early step.
