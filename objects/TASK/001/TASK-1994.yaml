title: walk_source_for_traces .git skip also excludes git submodules from doctor trace checks
description: |
  trace.rs:67 (PR-2747) skips any directory containing `.git`, so git submodules are skipped too, not only the nested linked worktrees (`.claude/worktrees`) it targets. walk_source_for_traces is shared with the doctor trace checks (doctor_cmd.rs:12916, 13728), so doctor orphan/coverage results change for projects with submodules. Nothing tests or documents that. Narrow the skip to linked worktrees (a `.git` file whose gitdir points into <repo>/.git/worktrees/), or document and test the submodule exclusion.

  Raised in review of PR-2747: https://github.com/joemooney/aida/pull/2747#issuecomment-6286331573
