description: |-
  From TASK-3952
  Reviewed sha: 2c764ec06581bdf3bc0bc1f9cbad815646a0f5f0

  Onboarding regression for agent-run inits (non-TTY, the path docs/getting-started.md has an agent take). The default now leaves the scaffolding uncommitted and also stops seeding the human_only 'Commit AIDA scaffolding' task (init_cmd.rs:2454 `!scaffolding_committed && commit_requested`). The only reminder is one stdout hint. BUG-445 (init_cmd.rs:2478-2486) records why that matters: an `aida queue work` worktree branched from main lacks .gitignore, .claude and .aida/config.toml, so lane work there runs without hooks or skills, and a bare `git add .` can commit cache or session symlinks. Follow-up: keep a durable reminder that does not take the user's first ID (a doctor/status check or first_run hint), or have queue work warn when the primary holds uncommitted AIDA scaffolding.
