  aida-cli-lib/src/queue_cmd/rework_bindings.rs:543 — The legacy byte budget is debited only when checked_legacy_record returns a parsed verdict. Malformed or invalid-UTF-8 legacy files can each consume the full remaining allowance and recovery continues to other keys with that allowance intact. Charge bytes as consumed, including failed parses, or stop the pass on a read whose consumption cannot be accounted for.
