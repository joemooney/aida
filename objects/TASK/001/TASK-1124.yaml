  content: |-
    Design (2026-07-11, autonomous loop) — captured rather than rush-implemented, because the naive version is a trap I just hit in BUG-917.

    CATEGORY: new aida doctor category "rule-delivery" (sibling of the completed-without-commit / remote-drift scans in doctor_multi_agent).

    MACHINERY TO REUSE:
    - EMBEDDED_TEMPLATES + get_embedded_templates() (aida-core/templates.rs) — the binary source-of-truth.
    - The Scaffolder preview (aida-core scaffolding) — generates the DEPLOYED form (frontmatter + substitution).
    - handle_memories_check (main.rs:12406, STORY-410) — the deployed-vs-embedded discovery + reporting pattern to mirror.
    - The codex-prompt writer (main.rs:25729) — the transform that produces ~/.codex/prompts from skill templates.

    THE TRAP (critical, learned from BUG-917): do NOT hash deployed files against the RAW template. Deployed .claude/.codex/.antigravity skills carry generated frontmatter/substitution, and ~/.codex/prompts is a TRANSFORM of the skill template — so raw-template comparison false-positives on every file. Compare deployed vs the GENERATED/TRANSFORMED form (scaffolder preview for skills; the codex-prompt transform for prompts).

    DEPLOYED LOCATIONS: project .codex/skills + .antigravity/skills (project .claude/ is already covered by aida scaffold status, BUG-917 — reuse that logic), and the HIGH-VALUE one: home ~/.codex/prompts (the exact TASK-1123 incident: stale prompts lacked the BUG-713 open-PR-only workflow). ~/.codex is READ-ONLY here (operator real home — never write).

    FLAG: per template, if deployed content != generated form → drift finding pointing at the re-scaffold command (aida init --force for project skills; the codex-prompt-write command for ~/.codex/prompts). Detection only, not a gate (gate belongs on merge per BUG-716).

    TEST: a fixture with a deliberately-stale deployed prompt (assert flagged) + a fresh one (assert clean). Do NOT test against the real ~/.codex.

    Status: staying Approved. Ready to implement; deferred from the autonomous loop because a drift-DETECTOR that false-positives is worse than none, and the generated-vs-deployed comparison + per-vendor transforms warrant focused implementation.
