title: 'Review follow-up: Patch-ids are computed from `git log -p` without --binary/--full-index, so a binary-only c'
description: |-
  From BUG-2733
  Reviewed sha: bc5438855b63b22bf94baf3687a0ee3b4d1ca1c6

  Patch-ids are computed from `git log -p` without --binary/--full-index, so a binary-only change hashes as a `Binary files a/X and b/X differ` stanza. Two commits that change the same binary path to different contents (with identical text hunks) share a patch-id, so a genuinely new branch commit is reported as already on base and its specs are dropped from train/ship resolution. textconv-lossy diffs collide the same way. review_carryover::patch_id uses --binary --full-index to avoid this. Add those flags and a collision test.
