title: 'Review follow-up: Telemetry privacy in other repos: the .gitignore line only affects AIDA''s own repo, which '
description: |-
  From STORY-3120
  Reviewed sha: 46c45d8538e1bbecd7b695f1f8c764a7dbb4c300

  Telemetry privacy in other repos: the .gitignore line only affects AIDA's own repo, which already ignores .aida/*. persist_review_telemetry_and_sarif (aida-cli-lib/src/review_prepare.rs) writes .aida/review-telemetry/sarif/<id>.sarif.json, holding finding messages that can quote code, with default 0644 permissions. It also adds no self-ignoring .gitignore inside .aida/review-telemetry/, so in a community repo `git add .` commits the archive. Write a .gitignore ('*') into the directory, create the files 0600, and add a test.
