title: 'Guard-route polish: doctor finding for a disabled (invalid) route, safe bind suggestion, quiet ticks for user-disabled routes'
description: 'Follow-up from the BUG-1655 strict review. Acceptance: 1. aida doctor reports an enabled route disabled for an unknown bound job (next to the unbound-route finding), so a renamed guard doesn''t silently lose its alert. 2. The unbound-route fix text suggests CronJobFailed:<name minus -route> only when that job exists in the registry; otherwise says to bind it to the job it guards. 3. A route the user already disabled (enabled = false) with a bad binding does not log a ''skipped'' line every tick. 4. The exit-124 label distinguishes ''could not be spawned'' from ''timed out'' where the runner knows. 5. Fix the stray '')'' in docs/cli/03-work-autonomy.md. Tests for 1-3.'
