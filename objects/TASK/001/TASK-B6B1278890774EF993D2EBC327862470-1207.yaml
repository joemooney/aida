  ci/gdma/run-upstream.py SELF_HOSTED_ONLY_VARIABLES now also exempts GITHUB_WORKSPACE for a step whose condition is exactly `runner.environment == 'self-hosted'`, but tests/test_gdma_ci.py has no fixture for the refusal side: a hosted step, or a step whose condition is `runner.environment == 'self-hosted' || ...`, that names GITHUB_WORKSPACE or GITHUB_ENV must raise 'Unsupported runner variables'. No test asserts that message at all; the gap predates this change, which widens the exemption. Add both negative cases.
