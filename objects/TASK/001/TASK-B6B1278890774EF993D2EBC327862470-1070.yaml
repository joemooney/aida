title: 'aida pr train: prefix train progress lines with a local HH:MM:SS timestamp'
description: 'Operator request 2026-11-12 11:51: train progress lines (''  train PR #N CI waiting: ...'', ''opened'', ''is green'', ''is red'', ejections) carry no timestamp, so a deputy transcript cannot show when CI moved or how long a train waited. Acceptance: (1) every progress println in aida-cli-lib/src/pr_train.rs that starts with ''  train PR #'' (7 sites incl. lines ~866, 868, 2533, 2770, 3466, 3533, 3539) is prefixed with the local wall-clock time, e.g. ''  11:51:07 train PR #3891 CI waiting: ...'', via one shared helper; (2) existing tests asserting these strings are updated (match the time with a pattern, not a fixed value); (3) no other output format changes. FASTTRACK tier: one targeted cargo test (pr_train / story_1690_train_tests filter) + make check-ci-fast.'
