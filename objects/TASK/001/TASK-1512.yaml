  content: |-
    Review (fresh Opus reviewer): APPROVE WITH NITS on origin/claude/task-1512 @ 0aad875125.

    Acceptance: all 10 criteria met. The union for --opened with --to/--from is one of the two options the spec explicitly allows, and it is documented in --help, docs/cli/08-reporting.md and the MCP schema. --comments with --to also giving a union goes beyond the spec, but it is consistent and documented. --shipped behavior is unchanged; the new conflicts with --to/--opened only restrict the new flags.

    Verified:
    - Regressions green: cargo test -p aida-cli-lib --lib (history, task_1507, task_1508, bug_1635, task_1512) gave 160 passed, 0 failed. bug_1502_format_json_audit gave 8 passed. cargo fmt --check is clean.
    - Parity mutations: (a) --to/--from narrowed to kind 'added' instead of 'status_change' made both task_1512 and bug_1635 index-parity tests fail. (b) Dropping 'added' when --opened is combined with --to made both fail as well.
    - No version bump needed: 'kind' is an existing column with an existing index (events_kind), filled by kind_name(). The stored rows and the HISTORY_SCHEMA/DECODER versions are untouched. The narrowing is a superset, re-checked in Rust by event_passes_filters.
    - End-to-end on a temp store (binary built from the branch):
      - --from draft skips a spec filed straight at Approved; --opened includes it.
      - An edit and revert inside one commit produces no event.
      - An In Progress -> InProgress respelling appears under --status-changes but is excluded from --to/--from.
      - --to completed matches --shipped exactly.
      - --id/positional SPEC-ID with --opened/--created works.
      - --since and --until set exactly at a commit timestamp are both inclusive, identically with AIDA_HISTORY_CACHE=1 and 0.
      - --to bogus errors with the valid set.
      - --shipped --to is refused by clap.
    - MCP over stdio: to/from spellings work, an unknown status gives invalid_arg, shipped+from is allowed.
    - The new --to/--from/--opened/--shipped help text contains no spec IDs.

    Findings:
    1. (Low-Medium) aida-cli-lib/src/mcp.rs, the new shipped+to/opened refusal in tool_history (~l.2559): McpErrorCode::classify (mcp.rs:445) maps the message "`shipped` is the same as ..." to code 'internal' with recoverable:false, so an agent is told it hit a server fault rather than a bad argument. Verified over mcp-serve. Fix: start the message with 'invalid ' (e.g. "invalid combination: `shipped` is `to: completed`; ...") and assert structuredError.code == invalid_arg in task_1512_mcp_history_transition_and_opened_filters.
    2. (Low, test gap) aida-cli-lib/src/history.rs transition_matches: the from_key == to_key guard (respelling is not a transition) is untested. Replacing it with a no-op left every task_1512, bug_1635 and bug_1636 test green. Fix: add an 'In Progress' -> 'InProgress' respelling commit to the task_1512 fixture and assert that --to in-progress / --from in-progress exclude it while --status-changes still lists it.
    3. (Nit) aida-cli-lib/src/git_backend_cmd.rs (~l.7801): --kind returns before --to/--from are validated, so 'aida history --kind gate-held --to bogus' silently ignores both (confirmed). Fix: conflicts_with_all = ["to","from","opened"] on kind, or validate before the early return. --shipped has the same gap, which predates this change.
    4. (Nit) --from X --to X (same status) silently returns nothing, because a transition must change the status. Consider refusing it with a clear message or mentioning it in help.
    5. (Out of scope, predates this change) The history --id long help still names BUG-588 (plus an example BUG-1474). This is worth a separate docs bug because the repo rule keeps spec IDs out of user CLI prose.

    None of these block the merge. #1 is worth fixing before merge because it is a two-line change.
