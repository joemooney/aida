title: Reconcile descendant_ids vs graph --tree subtree membership (43 vs 44 on EPIC-54)
description: |-
  Split out from BUG-678. Two subtree-closure implementations disagree on membership: backend.descendant_ids() (used by the aida focus rollup) returns a 43-item EPIC-54 subtree, while aida graph --tree returns 44 (3 rejected vs 2). One rejected node reachable in the graph traversal is absent from the descendant_ids closure.

  INVESTIGATE: why the two closures differ (likely a relationship-edge type or direction one follows and the other does not), decide which is correct, and make focus and graph agree on what is in an epic subtree.

  REPRODUCE: aida focus epic-54 (rollup total) vs aida graph epic-54 --tree row count. Note: the rollup total is also distorted by BUG-678 (rejected-counted-as-open); this task is specifically the MEMBERSHIP/closure discrepancy, not the bucketing.

  Lower priority than BUG-678 part 1 (the bucketing fix) — this is a correctness-of-closure investigation, not a visible miscount.
