title: 'doctor skips the seat-sidecar inventory when RecipientDirectory::load fails (deferred F3 from #4463)'
description: |
  Deferred F3 from the independent review of #4463 (TASK-3846), advisor-122 ruling 2026-11-23 ~16:26; filed by product-15. `aida doctor` skips the seat-sidecar inventory entirely when RecipientDirectory::load fails (mail_backlog.rs:330), so hidden or unverified seat messages go unreported exactly when the registry is broken.

  ## Acceptance
  - AC1: When RecipientDirectory::load fails, doctor still runs the seat-sidecar inventory (or reports "seat-sidecar inventory SKIPPED: registry load failed: <error>"), never silence.
  - AC2: Test with a failing registry load.
