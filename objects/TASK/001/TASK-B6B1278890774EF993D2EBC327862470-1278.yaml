    # TASK-3851 / PR #4480 r2, FINAL round (advisor-122 ruling 2026-11-23 20:55: CR UPHELD at e94099b5; product-15). Lane: CODEX. Base: INTEGRATION (existing branch int30-task-3851). SMALL.

    F1 is a REAL REGRESSION. Promoting every retained-lookup OverBudget (one oversized sidecar, or probe-slot exhaustion) to a receipt-ANCHOR error strips ACK eligibility from UNRELATED records, and can mark relay snapshots receipts_unknown, which suppresses ALL end notices.
    FIX F1: keep PER-ID isolation, so only the affected ID goes UNEXAMINED/UNVERIFIED. Carry retained-discovery incompleteness as the INVENTORY-INCOMPLETE flag, NEVER as anchor.error. TEST: one oversized retained sidecar leaves an UNRELATED record ACK-eligible, AND the relay end notice still emits.
    F2: add ONE deterministic final-probe deadline-expiry test through inspect_seat_sidecars that asserts UNEXAMINED + complete=false.
    NOTHING ELSE in scope. This is the FINAL round (cap): if it's still blocked, REVERT the OverBudget promotion and ship the remainder.
    One targeted cargo run, then `make check-ci-fast`, then push on the existing branch (#4480). COMMIT your work. Reviewer scope: F1 + F2 plus the diff.
