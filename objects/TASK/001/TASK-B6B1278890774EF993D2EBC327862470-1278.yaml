  content: 'INTEGRATION PRE-CHECK r3 (integration-30, 23:10): PR-4480 @ ec99bae57b PASSES the 21:53 micro-round ruling. The rework commit ec99bae57bc adds LogicalSnapshot.retained_open_error (set only when RetainedDeliveries::open fails, before any per-ID lookup). ack_eligible() now also requires retained_open_error.is_none(), so ACK is REFUSED when the retained store can''t be opened, while per-ID lookup failures stay isolated (NotOwned/UNVERIFIED) as the ruling required, with a regression in mailbox_logical_tests.rs. mailbox_view''s partial-coverage codes list retained_open_error, or OverBudget when the inventory is incomplete without an open error, so a partial view always names its reason. The other files in the delta come from its integration merge (b664d79afa9). Merges CLEAN.'
