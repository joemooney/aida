title: 'Scaffold refresh footprint follow-ups: gate the minimal footprint, flag already-flooded lane projects, detect pre-footprint lanes by AGENTS.md heading'
description: 'Follow-up from BUG-1662. Acceptance: 1. scaffold refresh on a minimal-footprint project installs only what minimal init installs (no discipline pack). 2. aida doctor flags a memory-lane project whose AGENTS.md carries the full conventions block or a discipline pack (flooded by an older refresh) and gives manual restore steps. 3. A lane created before saved footprints, with no skills, is recognised as a lane when AGENTS.md has the memory-lane block heading. Fixture tests for each.'
