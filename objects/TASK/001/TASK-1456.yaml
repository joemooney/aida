title: A Done spec with an outstanding refusal at its tip is invisible in aida list's open lens, and an all-refused wave idles
description: |-
  Split from BUG-1515 (2026-09-23). BUG-1515 made queue list/next/work say 'rework needed' (not 'awaiting merge') for a Done spec whose refusal is at the branch tip. Two criteria remain: (1) aida list's default open lens drops Done specs, so these rework-needed specs vanish from the main work list; (2) a drain wave whose every candidate is rework-needed idles (zero-eligible) without saying why.

  ## Acceptance
  1. aida list (default lens) shows a Done spec with an outstanding tip refusal, labelled rework-needed.
  2. A zero-eligible wave caused by rework-needed specs names them and the rework command.
  3. Tests for both.
