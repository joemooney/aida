title: 'Review follow-up: The returned error on push failure (remote_create.rs:3016) says only ''the union is committ'
description: |-
  From BUG-2759
  Reviewed sha: 2b87920bb9e1b2aa9ddfe671bf8a9c765f9de551

  The returned error on push failure (remote_create.rs:3016) says only 'the union is committed locally but N hub(s) did not receive it — re-run ... once they are reachable'. It names no hub and no cause, and for a race that 'once they are reachable' wording is misleading. Per-hub causes reach only stderr or the JSON push_failures. Folding push_failures (joined with ' | ') into the bail message would keep the cause in the agent-mode error block too. Follow-up acceptable.
