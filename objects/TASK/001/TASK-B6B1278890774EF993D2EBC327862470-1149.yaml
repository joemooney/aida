title: 'Review follow-up: [P2] Distinguish an unrelated green commit from a landed fix when closing an episode. main'
description: |-
  From STORY-2897
  Reviewed sha: 81cbe3ada1c6b53f5e155c698a2a61d90c062cca

  [P2] Distinguish an unrelated green commit from a landed fix when closing an episode. main_watch.rs:1101-1107 labels every confirmed episode followed by a different green SHA as fixed, without consulting FixState.completed or checking that the fix spec landed in the closing range. For example, after a persistent load flake creates a fix BUG, an unrelated docs commit whose CI succeeds is recorded as a successful fix even while that BUG remains Approved. The signed S3 sketch distinguishes cleared from fix_landed using the completed fix and its closing-range evidence. Preserve that distinction and add an unrelated-green/incomplete-fix case alongside the actual-fix case.
