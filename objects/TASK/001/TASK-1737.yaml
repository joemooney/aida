title: Record the authorizing seat and grant on advisor-gated status advances (commit trailers)
description: 'Split from BUG-1983 (sketch item D4, approved by the advisor 2026-10-12 with conditions) so the refusal-wording and review-record fix could ship without waiting on it. An advisor-gated status advance should append git trailers to the store commit: Aida-Authority: grant|orchestrator, Aida-Seat, Aida-Grant (an 8-character prefix only, per BUG-1983 condition C2). Today the commit is a bare ''Update <ID>''. Advisor conditions: (1) emit the trailers from the single store-commit path for EVERY advisor-gated status advance, not only aida edit; (2) the history parser must tolerate both missing trailers and unknown trailer keys; (3) confirm the store''s commit-msg and provenance hooks accept them. aida history events then shows the authority on status_change rows that carry the trailers. Build on seat_authority::grant_check (from BUG-1983).'
