    F-B [minor] BLOCKING (the override is broken and the message misleads): --over-wip is dropped on the --auto-complete path (wip_limit.rs:867-877 hardcodes over_wip=false; work.rs ~9137 dispatches to run_auto_complete first). Thread over_wip through run_auto_complete into ensure_queued_for_implementer / prepare_registered_auto_complete_phase1, with a test.
    F-C [minor] ACCEPTED as non-blocking: the exemption lookups run before the count, twice per run. Fold it in only if it is small (read the count first, short-circuit under the limit, admit once per run). Otherwise leave it and say so on the spec; no follow-up PR.
