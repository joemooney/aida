title: Mandate-attested release of dead-lane repair reservations (project knob, default off)
description: |
  Joe approved this 2026-11-24 21:23 (advisor-122 filed it). Today, every conflict-repair lane that punts leaves a repair-journal reservation that only an operator can release (`aida doctor heal repair-reservations --attest`, which is terminal-bound). That costs Joe one manual step per lane; there were 4 on 2026-11-24. This is an interim fix until BUG-2761 (resume a retained seat) removes most cases, and it stays afterwards as a fallback.

  ## Acceptance criteria

  AC1: Add a project config knob, e.g. `[repair_journal] mandate_attested_release`, defaulting to false.
  - Knob off: behaviour is unchanged, and the terminal attest is still required.
  - Knob on, with a live operator mandate that carries the release scope: `aida doctor heal repair-reservations --id X --attest-by-mandate` releases the reservation non-interactively.
    - It records the mandate id, grant and liveness evidence in the journal.
    - It keeps the tree in place and deletes nothing.
  - It refuses (fails closed) if:
    - the lane has any live process, matched by lease id or tree path;
    - the liveness probe errors or is incomplete;
    - the lease owner is live or unverified;
    - there is no mandate, or the mandate lacks the scope.

  AC2: Tests:
  - knob off → the terminal is still required;
  - knob on + live lane → refuse;
  - knob on + probe error → refuse;
  - knob on + no mandate → refuse;
  - knob on + dead lane + mandate → released, with an audit record.

  Tier: STRICT (authority/grants + repair journal). Size: ≤300 lines, one slice.
