title: Rejection tests build secret-shaped dummy values at runtime (no full secret literals in source)
description: |
  Some rejection tests embed complete secret-shaped dummy literals (e.g. aida-cli-lib origin_prompt.rs, task_3096_intake_transport.rs), which trip secret scanners on CI hosts that run them and in history scans. Build the dummy values at runtime from fragments so no full secret-shaped literal exists in source, keeping the refusal assertions unchanged. Source: the operator's work-side AIDA CI branch fixed this on 2026-11 (report reviewed by product-15, 2026-11-22). That branch is not reachable from this clone, so reproduce on main first; if main already behaves correctly, close with evidence.

  ## Acceptance
  - AC1: Those files contain no complete secret-shaped literals; a gitleaks run over the tree reports none from them.
  - AC2: The rejection assertions are unchanged and still pass.
