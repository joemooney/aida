title: 'aida drain tail: subcommand forwarding to aida tail drain (drain namespace completeness)'
description: |-
  ## Why
  Operator (2026-09-11): alias aida tail drain as aida drain tail. aida tail is a general log verb over sessions/specs/drains, so the drain target cannot leave it; but aida drain is a noun namespace (status, and clear from STORY-1028) and a reader who just ran aida drain status naturally looks for aida drain <verb> next. Adding tail there completes the namespace and reads better in the TASK-1208 next-command hint.

  ## Acceptance
  1. aida drain tail [--json] [-n N] [--since D] [--no-follow] [--no-timestamp] is a subcommand of aida drain that forwards to the exact aida tail drain code path (resolves the single running-drain log and follows it). Same flags, same output, same exit behaviour (clean exit 0 when there is no drain log).
  2. aida tail drain keeps working unchanged — this is an addition, not a move. Both invoke one shared handler; no duplicated logic.
  3. aida drain --help lists tail alongside status (and clear once STORY-1028 lands).
  4. TASK-1208's drain-status hint uses the aida drain tail spelling.
  5. aida commands (STORY-1027) lists aida drain tail with its own about text.
  6. Test: aida drain tail and aida tail drain produce identical argv into the shared handler.

  ## Related
  aida tail (TASK-1167/1173), STORY-1028 (aida drain clear — same namespace), TASK-1208 (uses this spelling in the hint), STORY-1027 (catalog).
