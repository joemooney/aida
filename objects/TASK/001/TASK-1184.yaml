title: 'aida agent gc: prune dead-PID registry entries (registry grows without bound)'
description: |-
  Nothing ever prunes `.aida/agents/*.toml` — only `aida agent stop` removes an entry (`agent_registry::remove_agent`). Every MCP-serving process (drain phases, subagents, reviewers, source=mcp) leaves a tombstone, so `aida agent ls` showed 108 rows of which 103 were dead PIDs (2026-08-29 audit; 103 source=mcp, 5 source=agent-launcher).

  Acceptance:
  - `aida agent gc [--dry-run] [--older-than D]` removes entries whose PID is not alive (same liveness check `ls` uses to print `stale`). Prints count + what it removed.
  - Entries carrying a resumable native session id (see the sibling `agent resume` story) are RETAINED unless `--older-than` says otherwise — gc must not destroy the thing resume needs.
  - `aida agent ls` runs the same prune opportunistically (substrate-as-bouncer: the list should never show a dead process by default; `--all`/`--stale` to see tombstones).
  - `aida session reap` and the orchestrator's end-of-drain path call it so the registry self-heals.
  - Never touches the `.aida/agents/context/` snapshots.
