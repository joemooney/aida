- id: 01a220dd-7ae6-7373-86ce-7ef0265cd63c
  author: dirtlab
  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (fixture):** new shared helper `tests/fixture_teardown.py::temp_project(prefix)` -- a TemporaryDirectory replacement that, before removal, waits for every live process whose cwd or argv path is inside the fixture (the detached `cache refresh --worker` runs with cwd = project root and `--store/--cache` under it). Logic moved from `test_show_latency.py` (BUG-1990), not duplicated. Stop-before-rmtree is used rather than AIDA_CACHE_NO_DETACH because test_cache_refresh_outputs.py deliberately exercises the detached worker (TASK-3853) -- the race came from that section. Adopted by the contract-step tests that create temp AIDA projects.
    - **AC2 (fixture, looped):** `tests/test_fixture_teardown.py` spawns a simulated worker (worker argv shape, cwd in project) that keeps creating files under `.aida/cache-db`, exits `temp_project` while it is mid-write, asserts the teardown waited and the tree is gone; 25 iterations. Wired into CI contracts step.
    - **AC3 (manual-inspection):** diff touches only tests/ and the CI step list.

    ### Expected files
    - tests/fixture_teardown.py (new), tests/test_fixture_teardown.py (new)
    - tests/test_cache_refresh_outputs.py, tests/test_show_latency.py, other contracts-step tests using TemporaryDirectory
    - .github/workflows/ci.yml (one line)

    ### Ambiguities / conflicts as questions
    - None
