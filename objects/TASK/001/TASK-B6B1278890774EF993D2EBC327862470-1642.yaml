  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 6d94a86892 (git diff origin/main...HEAD).

    Acceptance evidence:
    - AC1 [fixture]: tests/fixture_teardown.py::temp_project waits for every /proc process with cwd or argv path inside the fixture, then removes the tree (in a finally, so it also runs when the body raised). Adopted by test_cache_refresh_outputs (the failing one), test_gitlab_review_handoff, test_pr_ship_preflight, test_seat_takeover_lifecycle, test_skill_discovery, test_status_cold_cache. test_show_latency and test_origin_prompt now import the shared wait (moved, not copied). Chose wait-before-rmtree over AIDA_CACHE_NO_DETACH because test_cache_refresh_outputs deliberately exercises the detached worker (TASK-3853).
    - AC2 [behavioral]: tests/test_fixture_teardown.py runs 25 teardowns with a stand-in worker that is still writing to .aida/cache-db, plus a case where the body raised. Both pass in about 13s. Negative control done by hand: the same writer under a plain TemporaryDirectory failed 20/20 with OSError 39 Directory not empty. Wired into the CI contracts step.
    - AC3 [manual-inspection]: the diff touches only tests/ and one CI step. No product code.

    Run locally against the live binary, all exit 0: test_cache_refresh_outputs, test_skill_discovery, test_origin_prompt, test_status_cold_cache, test_gitlab_review_handoff, test_show_latency, test_seat_takeover_lifecycle, test_pr_ship_preflight, test_fixture_teardown.

    Probes: 0/1/N processes handled by the polling loop. Symlinked tmp roots are covered by realpath plus abspath. A zombie or unreadable /proc entry is skipped. Without /proc (non-Linux) the wait is a no-op, the same as before.

    Residual risks: the wait times out after 60s, so a hung worker surfaces as an AssertionError naming the pid instead of ENOTEMPTY. The diff is 160 insertions and 55 deletions (about 105 net, the deletions are the moved helper), slightly over the 120-line guide in gross terms.
