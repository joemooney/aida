  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: TASK-3962 (completing). AC1 partial: tests/fixture_teardown.py adds one shared temp_project/wait_for_fixture_processes helper, and seven CLI contract tests use it (cache_refresh_outputs, gitlab_review_handoff, pr_ship_preflight, seat_takeover_lifecycle, skill_discovery, status_cold_cache, plus show_latency and origin_prompt through the moved wait helper). But tests/test_work_ci_relay.py, a contracts-shard CLI contract test, still creates temp AIDA projects (`aida init` plus `awaiting`/`ci process` reads) and removes them with a plain TemporaryDirectory.cleanup() at line 104, which does not wait. AC2 verified: tests/test_fixture_teardown.py has a 25-iteration loop where a worker shaped like the real one is still writing under .aida/cache-db at teardown, plus a check that the wait still runs when the body raised. scripts/discover-python-tests.py picks it up and runs it in the gates shard, which passed at this head. AC3 verified: the diff only touches tests/. CI at the head: contracts, gates, lib-0/1, cli-1 and rest are green. cli-0 failed only its ''Test time budget'' step, on Rust test timings that this Python-only diff cannot affect. The ''Build (ubuntu-latest)'' failure is the ''Require every CI lane'' aggregate reacting to cli-0. The base is 3 commits ahead of the head; the finding holds on the landed tree, where test_work_ci_relay.py is unchanged.. No triage reason was given.'
