title: 'Contract-test teardown races the background cache-refresh worker (Directory not empty: .aida/cache-db)'
description: |-
  Advisor aida-d3 2026-11-27 23:32 (filed by product-15). Train #4800 (p56 #4790) went red in CI (contracts), run 46114706713 job 140885816826: shutil.rmtree of the test's temp project failed with 'OSError: [Errno 39] Directory not empty: /tmp/aida-cache-labels-.../project/.aida/cache-db', because the deferred background cache-refresh worker was still writing. A flake that can eject innocent train members.

  ## Acceptance
  - AC1: the Python contract tests that create temp AIDA projects either set the env that disables the deferred cache refresh, or stop/wait for the worker before removing the project (one shared fixture helper).
  - AC2: a test-only repro: a project whose cache worker is mid-write is torn down cleanly (no ENOTEMPTY), run in a loop.
  - AC3: test-only; no product behaviour change.
status: Done
priority: Medium
