- id: 01a22113-dee2-7552-9895-32affe14dc24
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-3962):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4861910ccace
    Recorded: 2026-11-28T07:32:46.327031052+00:00
    Findings:
    1. TASK-3962 AC1 is not fully met. tests/test_work_ci_relay.py is a CLI contract test that CI runs in the contracts shard ('Run restricted work CI relay contract'). It creates temp AIDA projects (`aida init --footprint minimal` at around line 518, then `awaiting` and `ci process` reads that can detach a cache-refresh worker) inside the fixture's tempfile.TemporaryDirectory. Its close() calls self.temp.cleanup() at line 104 without wait_for_fixture_processes, so the ENOTEMPTY teardown race this spec fixes is still present there. Fix: wait for fixture processes in that fixture's close() before cleanup (for example, call fixture_teardown.wait_for_fixture_processes(self.temp.name) first), or set the env that disables the deferred refresh.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
