description: |-
  From BUG-2777
  Reviewed sha: 7f1fa7dfed0edf8dc9313469364795b5f3f05194

  Residual coverage on the BUG-2777 train path (aida-cli-lib/src/pr_train.rs). The handler call site in pr_train_handler_with_dispatch_ctx that builds LiveDriftRouter and calls route_drift_ejections has no test, and neither does LiveDriftRouter::authority's mapping of a failing ports.dispatch_check() (taking ports.dispatch_abort and caching it in abort). Dropping the call would bring the BUG-2777 loop back without any test failing. It would not open an authority hole, because with no call the forge is never touched. The fail-open mutations of authority() are killed by bug2777_live_router_holds_without_dispatch_authority, and the advisor's r2 ruling bound only the abort-already-set test. Follow-up: a handler-level test (or extracting the post-drive block) plus a revoking DispatchExecutionContext case.
