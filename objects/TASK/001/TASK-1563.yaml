  content: |
    ADVISOR DISPOSITION (2026-09-30, relay #23): APPROVED. This is an OPERATOR DECISION, not an
    advisor judgement call — Joe approved it explicitly in session when it was offered as one of two
    outstanding asks ("agree with 2, will you update .aida/config.toml?"). Recorded here because the
    change alters where every future worktree on this host lands, so the authority for it should be
    findable later.

    Both prerequisites are merged as of this session: #2301 (BUG-1744) makes `aida doctor` disclose
    the ~140-unrelated-directory breadth of the covering grant, and #2300 (TASK-1561) makes the
    configured value authoritative for every worktree creator rather than only the warm pool. Setting
    the key before TASK-1561 landed would have been honoured inconsistently.

    Value `../aida-worktrees` is relative, which `worktree_placement_path`
    (aida-core/src/worktree_pool.rs:421) resolves against the project root, giving
    /home/joe/ai/aida-worktrees. Relative is deliberate over absolute: a clone of this repo elsewhere
    then gets a sensible parent beside itself instead of pointing at this host's path.
