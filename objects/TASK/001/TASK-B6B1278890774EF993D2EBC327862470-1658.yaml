    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit + code):** new `probe_version`/`version_probe_available` in `bounded_process.rs` built on `command_output_with_timeout_io` (5s `VERSION_PROBE_TIMEOUT`, stdin=/dev/null, process-group kill on timeout, stderr note "`<bin>` did not answer --version within 5s"). init_cmd agent_cli_detected + codex MCP probe, scaffold installed_codex_version, compete binary_on_path, remote_create is_on_path routed through it.
    - **AC2 (unit):** sleep-forever fake binary tests: helper returns TimedOut within bound; init `agent_cli_detected`, `installed_codex_version_of`, compete `binary_on_path`, remote_create `is_on_path` all return false within bound.
    - **AC3 (unit ratchet):** test scanning aida-cli-lib/src production sources counting `.arg("--version")` per file against a fixed reviewed ledger; any new file/raised count fails and points at the helper.

    ### Expected files
    - aida-cli-lib/src/bounded_process.rs, lib.rs, init_cmd.rs, scaffold_cmd.rs, compete_cmd.rs, remote_create.rs, new tests file under aida-cli-lib/src/tests/

    ### Ambiguities / conflicts as questions
    - None (vendor-literal ledger counts kept identical).
