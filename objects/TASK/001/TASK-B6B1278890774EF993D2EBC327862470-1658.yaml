    ## Implementer self-review
    Reviewed HEAD: 65f5c03712 (git diff origin/main...HEAD, 10 files, +262/-42).

    Acceptance evidence:
    - AC1 [behavioral-test]: one helper, aida-cli-lib/src/bounded_process.rs probe_version/probe_version_within/version_probe_available over command_output_with_timeout_io: 5s VERSION_PROBE_TIMEOUT, stdin=/dev/null, process-group SIGKILL at the bound, stderr note "`<bin>` did not answer --version within 5s; treating it as unavailable." Missing (spawn failure) is a separate variant. Routed: init_cmd agent_cli_detected + Codex MCP gate, scaffold_cmd installed_codex_version, compete_cmd binary_on_path, remote_create is_on_path.
    - AC2 [behavioral-test]: tests/task_3965_version_probe_tests.rs — a sleep-600 fake CLI: probe_kills_a_cli_that_never_answers_and_reports_a_timeout, init_agent_detection_returns_within_the_bound, codex_version_probe_returns_within_the_bound (installed_codex_version_of + the init MCP gate probe); probe_reads_the_banner_with_stdin_closed proves stdin is closed. 6/6 pass via lane job.
    - AC3 [behavioral-test]: task_3965_no_unreviewed_version_spawn_bypasses_the_bounded_probe — workspace scan of production sources for .arg("--version")/.args(["--version" against a per-file reviewed ledger (exact counts; raises and new files fail). Registered in scripts/ratchet-set.json; behavioral tests disposed in ci-structural-exclusions.json.

    Probes: (1) cross-ref: both ledgers (2539 vendor literals unchanged counts; 2326 launch ledger lowered, CEILING 136->131). (2) n/a. (3) multiplicity: init detection worst case is 4 probes x 5s = 20s serial, vs a 45-min hang. (4) adversarial: a CLI that spawns grandchildren holding pipes is covered by the process-group kill; a scoped forge deadline can shorten the bound but the note still says 5s (cosmetic).
    Fixes during review: shared executable fixture writer (executable-fixture ratchet), launch ledger update.
    Residual risks: init's follow-on `codex mcp list`/`codex mcp add` and the non-agent probes (dev_cmd, cast_recording, show_negative, upgrade_*, mcp.rs) remain unbounded — ledgered, out of AC scope. compete/remote_create entry points are covered by the shared helper tests + source ratchet rather than per-entry sleep tests (their fns are private thin wrappers). Diff is ~300 changed lines vs the 200 budget; ~95 are production.
    Validation: cargo test -p aida-cli-lib --lib task_3965 6/6, story_2539 4/4, -p aida-ci-guards --lib 51/51, make check-ci-fast exit 0 at 65f5c03712.
