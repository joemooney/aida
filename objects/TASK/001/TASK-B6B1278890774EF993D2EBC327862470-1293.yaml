title: Unshipped-work alerts also skip deferred specs reached via legacy deferred:<date> tags, private-clone rows and alternate-ID aliases (follow-up to BUG-2741)
description: |
  Follow-up to BUG-2741 / #4483 (advisor-122 ruling 2026-11-23 21:35, overridden to APPROVE; relayed by integration-30; filed by product-15). #4483 makes unshipped-work alerts skip status/flag-deferred specs (covers BUG-2688). Three remaining ways a deferred spec is reached are still alerted.

  ## Acceptance
  - AC1: Unshipped-work alerts also skip deferred specs reached through (a) legacy `deferred:<date>` TAGS and (b) private-clone rows.
  - AC2: ...and (c) alternate-ID aliases (agreed_id vs spec_id vs origin ID). Each of (a), (b), (c) gets its own regression case.
