title: 'Review follow-up: Removing the pre-add prune in aida-core/src/git_ops.rs:3989 drops the BUG-39 recovery for '
description: |-
  From BUG-2749
  Reviewed sha: d25b5af04f87df8c3b029616494669bf94562d0b

  Removing the pre-add prune in aida-core/src/git_ops.rs:3989 drops the BUG-39 recovery for a manually deleted .aida-store checkout even when its registered index is provably clean. create_store_worktree now calls git worktree add directly, which refuses a path that is still registered. Restore guarded, path-specific retirement before reattaching a clean store checkout, while retaining staged and unreadable indexes.
