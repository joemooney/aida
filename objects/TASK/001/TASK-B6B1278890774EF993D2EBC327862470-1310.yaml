title: 'Review follow-up: WIP continuation exemptions regress. queue_cmd/work.rs:6790 captures Pickup::New once, and'
description: |-
  From STORY-3080
  Reviewed sha: c6130afcb2f0cea0886b0b2aa773e1e311cd8739

  WIP continuation exemptions regress. queue_cmd/work.rs:6790 captures Pickup::New once, and standalone_implementer.rs:1776 reapplies it on automatic and FAST-fix resumes of the same lane. Once the project reaches the cap, that can block the continuation of an already-started lane. Also, wip_limit.rs:185–201 propagates a count lookup failure for Pickup::Branch before reaching the existing-branch exemption, so an unavailable forge can block an explicitly exempt branch pickup. Preserve the original classification for the first spawn and use continuation semantics for resumes. Keep count evidence for branch auditing without making it a prerequisite to the exemption.
