title: 'Review follow-up: The repair-reservations doctor finding still advertises only the attested path. RepairGuar'
description: |-
  From TASK-3891
  Reviewed sha: 595589fc567535ce3403eca32af7ed18828f7180

  The repair-reservations doctor finding still advertises only the attested path. RepairGuard::repair_findings (aida-cli-lib/src/repair_journal.rs:345-346) sets action to `aida doctor heal repair-reservations --id <id> --attest '<reason>'` for every held entry, so an operator looking at `aida doctor check repair-reservations` is never pointed at the new bare sweep. That sweep is the toil reduction TASK-3891 exists for. Suggest a summary or hint line naming the bare sweep for CLOSED/MERGED dead lanes.
