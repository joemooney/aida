  content: 'Repair round 1 (advisor 02:50): head fafb6b2 failed check-ci-fast on one item only, the prose-classification ratchet at aida-cli-lib/src/worktree_gc.rs:675 (stderr.contains("Could not access")). That check is the git diff --no-index external-tool contract F1 asked for, so the fix is to mark it ''// external-prose-classifier: <site>'' per scripts/check-portability.sh and scripts/external-prose-classifiers.py, and to update whatever classifier list/doc that checker compares against. No behaviour change. The 4 seat-clone destroy test failures (sandbox mail-writer verification) are environmental and NOT in scope. Gate: make check-ci-fast green, plus cargo test -p aida-cli-lib worktree_gc. Push to story-2768-s3a-housekeeping. Tool rules: allowed_domains only on sandboxed calls; never retry a classifier-denied kill; never sleep in a foreground Bash call.'
