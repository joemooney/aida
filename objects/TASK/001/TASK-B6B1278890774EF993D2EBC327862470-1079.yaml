- id: 01a1defc-87e0-7222-94bb-97d6bf761e45
  author: joe
  content: 'Advisor ruling 2026-11-15 04:40 on PR-4058 CR @ 19b04fd (round 7). Three new P1/P2 data-loss findings: F1 staged-only content lost by the HEAD-to-worktree diff (worktree_gc.rs:801-811); F2 a lease adopted between the death sample and release_lease_files is deleted and its grant revoked (land_run.rs:773-790); F3 unlocked shared refs/aida/keep fetch can mix snapshots and allow a wrong orphan reset (land_housekeeping.rs:512-527). All three are real and data-loss class. But each round since round 1 has found new loss paths in UNATTENDED release/reset, so the design is not converging by patching. SCOPE RULING: S3a lands with automatic lease release and spec reset behind a project config knob, default OFF (old behaviour: nothing released or reset). With the knob off, housekeeping salvages, records the breadcrumb and REPORTS only. Release/reset code stays but is unreachable unless the knob is on, and a test proves that with the knob off no lease file is removed, no grant is revoked and no spec is reset or requeued, even for a fully salvageable dead lane. F1-F3 are then preconditions for enabling the knob, not merge blockers: file them as one Draft (child of STORY-2768) titled ''enable land housekeeping auto-release: F1 staged-only capture, F2 release TOCTOU under ownership lock, F3 private immutable ref pins'', with this ruling as context. One cheap fix still belongs in this PR: F1''s capture must not report a salvage patch as complete when the index diverges from both HEAD and the worktree (refuse or capture the index separately), because the report and breadcrumb must not claim completeness falsely. Rework: Claude Opus lane on dell1, --track integration, branch story-2768-s3a-housekeeping. Gate: lane pre-push gate plus cargo test -p aida-cli-lib worktree_gc and cargo test -p aida-cli-lib housekeeping.'
