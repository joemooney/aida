title: mandate_ship_cover runs the carry-over proof even where it is ignored
description: |
  pr_cmd.rs mandate_ship_cover always calls mandate_carry_over, which runs git ls-remote origin HEAD plus a fetch of the base and of any missing shas. rework_release_decision ignores ShipCheck.carry_over, so the proof is wasted there. A mandate ship also computes the cover twice (mandate_cover_now at the start and again at the re-check). Consider computing the carry-over only for ship_decision.

