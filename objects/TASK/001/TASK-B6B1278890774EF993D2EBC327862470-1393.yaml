title: 'Review follow-up: aida-cli-lib/src/codex_bg_receipt.rs:740,824. The scope-less corrupt-receipt admission che'
description: |-
  From BUG-2747
  Reviewed sha: 490b4f038373cee57d13037518da1b43d6c6da40

  aida-cli-lib/src/codex_bg_receipt.rs:740,824. The scope-less corrupt-receipt admission check now also requires the environment to be readable for every potentially relevant same-UID process. For a malformed receipt with no usable start tick or log, an unrelated process with readable stat and argv but inaccessible environ makes the proof Unknown, blocking admission for every scope and preventing retirement despite no other matching evidence. This expands a recovery-ancestry fix into an admission availability regression. Preserve the existing admission behavior for unrelated processes while retaining fail-closed handling for plausible holders, and cover the no-birth-bound corrupt-receipt case. Linux implements separate access checks for environ in https://linux.googlesource.com/linux/kernel/git/torvalds/linux/+/e96493229a6399e902062213c6381162464cdd50/fs/proc/base.c#1005.
