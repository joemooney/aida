description: |-
  From BUG-2740
  Reviewed sha: 833284c12f44606b5f680b675adc6d851eceb167

  aida-cli-lib/src/queue_cmd/work.rs:5035 and :5153. The WIP limit is checked before the newly introduced potentially unbounded wait, and the pickup never checks it again before entering setup. A new pickup that saw room can sit in the cold-start queue while another lane fills the limit, then start anyway. Revalidate the new-work WIP decision after a cold-start wait and before pickup mutation, preserving the existing rework and explicit override behavior.
