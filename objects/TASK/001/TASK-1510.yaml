agreed_id: TASK-1510
title: Run each unattended drain wave in its own systemd-run --user transient unit
description: |
  Follow-up from TASK-1491's A12 amendment. Under the systemd driver, the tick currently relies on KillMode=process so the detached drain wave survives when the tick exits. Instead, launch each wave via systemd-run --user as its own transient unit, for isolation, per-wave journal and clean stop. Acceptance: when the systemd driver is active, a wave runs in its own transient unit, visible in systemctl --user list-units. The cron driver is unchanged. The tests use the DriverHost seam and never call the real systemctl.

  ## Groomed acceptance (proxy, 2026-09-25)
  - SKETCH FIRST: before code, post a sketch on this spec (unit naming, how the tick learns the wave's unit name, stop/cleanup path, what happens if systemd-run is unavailable or fails) and get advisor signoff. It changes how unattended waves are launched, so no implementation before signoff.
  - With the systemd driver, each wave runs in its own transient unit visible in systemctl --user list-units, with a per-wave journal; stopping the unit stops the wave cleanly.
  - If systemd-run fails, the tick falls back to the current KillMode=process launch and logs why (no silent loss of the wave).
  - The cron driver is unchanged. Tests use the DriverHost seam and never call the real systemctl or systemd-run.
  - No change to what a wave is allowed to do (same authority, same caps).
