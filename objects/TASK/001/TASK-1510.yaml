title: Run each unattended drain wave in its own systemd-run --user transient unit
description: 'Follow-up from TASK-1491''s A12 amendment. Under the systemd driver, the tick currently relies on KillMode=process so the detached drain wave survives when the tick exits. Instead, launch each wave via systemd-run --user as its own transient unit, for isolation, per-wave journal and clean stop. Acceptance: when the systemd driver is active, a wave runs in its own transient unit, visible in systemctl --user list-units. The cron driver is unchanged. The tests use the DriverHost seam and never call the real systemctl.'
