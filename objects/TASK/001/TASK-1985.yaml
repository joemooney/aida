title: 'Local compile speed: enable incremental compilation in [profile.agent]'
description: 'Operator-directed 2026-10-19 21:24 (STORY-1853 local leg). profile.agent inherits release, where incremental is off, so every local rebuild after a merge or an edit recompiles aida-cli-lib from scratch: 20-22 min for workspace --no-run and 8-12 min for a single targeted test binary (slot log, 2026-10-19). Set incremental = true in [profile.agent]. CI is unaffected because it exports CARGO_INCREMENTAL=0. Accepted trade-off: larger per-worktree caches. Measure: the same rebuild-after-small-edit, before and after, median of 3. Follow-up candidates: mold for local links via the cargo wrapper; splitting aida-cli-lib into crates (needs a sketch).'
