  .github/workflows/ci.yml comment above 'Verify self-hosted cargo-nextest location', the 'Local cache only' bullet in docs/internal/testing/dell1-runner.md and the fixture comment 'cargo runs the CARGO_HOME/bin copy before it searches PATH' in tests/test_self_hosted_runner.py say cargo always prefers CARGO_HOME/bin. Current cargo does so only when CARGO_HOME/bin is not on PATH; when it is on PATH, PATH order decides. The check refuses in that case too, so it is stricter than cargo and safe. Correct the wording so a later reader does not relax the check on a wrong premise.
