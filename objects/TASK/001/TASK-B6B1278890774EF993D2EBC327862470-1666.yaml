title: 'Review follow-up: scripts/ci-live-test-watchdog.py kill(): after SIGTERM it returns as soon as the group lea'
description: |-
  From BUG-2788
  Reviewed sha: c69eb5939c5b2b4ac8074fd3b609b915466f66c5

  scripts/ci-live-test-watchdog.py kill(): after SIGTERM it returns as soon as the group leader exits, so a descendant in the same process group that ignores SIGTERM is never sent SIGKILL. Tests that exit normally never have their process group swept either. A lingering sandbox descendant could outlive its test. The step result is unaffected because output goes to a file, not a pipe. Follow-up: always killpg(SIGKILL) after the SIGTERM grace period, and sweep the group after a normal exit.
