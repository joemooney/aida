title: Codex sessions attached to the shared app-server daemon still inherit the daemon's AIDA_SESSION_ROLE and grant for CLI authority
description: 'Follow-up from the #2637 (BUG-2007) review. The hooks now display role: unresolved under the daemon, but authority is unchanged: aida commands and aida-advisor-code-guard.sh run inside a daemon-attached session still act with the daemon''s role and grant. Related to BUG-1934. Also: codex runs the gitignored per-machine .codex/hooks/ copies, which are stale (Sep 21), so the hook half of BUG-2007 reaches codex only after re-scaffolding. Decide whether the CLI should refuse role-scoped mutations when it detects the shared daemon in its ancestry, and how to refresh the .codex/hooks copies.'
