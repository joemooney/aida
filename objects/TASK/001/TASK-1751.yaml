title: 'Arch: replace AIDA_TEST_* production seams and test PATH/HOME mutation with an injected tool/env context'
description: |-
  ## Problem
  Tests steer production code through ambient environment variables, and many tests mutate process-global PATH/HOME. The result is flaky suites, races under parallel tests, and the risk of test-only bypasses in production code.

  ## Evidence
  - 25 distinct AIDA_TEST_* names read in production code, e.g. status_prs.rs:3117 AIDA_TEST_GH_BINARY, lib_part3.rs:513 AIDA_TEST_GLAB_BINARY, session_end.rs:1952-1953 pause hooks, status_awaiting.rs:1131/1147 deadline/budget overrides, init_cmd.rs:713-729, doctor_cmd.rs:10452-10453, aida-core/src/git_ops.rs:2912 AIDA_TEST_HOME.
  - 18 test sites that set PATH or HOME, or prepend to PATH.
  - Today's rejections: #2594 (an AIDA_TEST_AUTO_CLOSE fail-open bypass), #2599 r1 (a PATH-mutating test flaked the suite), #2597 (PATH isolation, follow-up TASK-1748 on HOME).

  ## Proposed improvement
  A `Tools`/`HostEnv` context (binary paths, home, clock/deadlines) passed in explicitly, with production built from the real environment once at the entry point. Tests construct it directly. Retire each AIDA_TEST_* name as its module converts. Add a guard test: no new AIDA_TEST_ reads outside test_env.rs, and no set_var(PATH|HOME) in tests.

  ## Risk
  A broad but mechanical change; do it per module.

  ## Effort
  Medium-large, in many small slices (drain-friendly once the context type exists).
