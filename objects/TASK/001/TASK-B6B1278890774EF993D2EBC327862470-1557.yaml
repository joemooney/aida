title: 'Review follow-up: Waiter identity is (exact PR list, parent-process identity) (admission_owner.rs queued_tra'
description: |-
  From TASK-3924
  Reviewed sha: a4f7da7206450b57610db4aa4bdd76a78aa0cad3

  Waiter identity is (exact PR list, parent-process identity) (admission_owner.rs queued_train_admission `mine`, retrier()). A retry of the same train from a different parent (another terminal, a deputy-submitted script, or the same PRs in a different order) is treated as a new waiter and is refused 'queued behind' its own earlier waiter until that parent exits or the 15-min TTL ends. When the parent is short-lived (a deputy job's bash, a `bash -c` wrapper), the waiter is released the moment the train exits, so the BUG-2771 yield never takes effect. Recording the retrier instead of the train process is a reasonable reading of AC1, because the train exits when it gives up. These consequences are neither handled nor tested. Suggested follow-up: normalise (sort/dedup) the PR list and match a refresh on PRs alone, or document that retries must come from the same long-lived parent.
