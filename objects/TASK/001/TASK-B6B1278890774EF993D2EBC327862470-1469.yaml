description: |-
  From TASK-3882
  Reviewed sha: a8592b5a3072acda740c69bd9ace9ceb35884674

  STORY-3120 S3a (aida-cli-lib/src/launch/review_runner.rs RunnerCall::run): the deadline and the output caps are enforced only while the runner's process group holds the pipes. After the poll loop and kill(-group), `child.wait()` is followed by unbounded `writer.join()`, `out.join()` and `err.join()`. A runner descendant that leaves the group (setsid/setpgid, e.g. a daemonised helper or a vendor-spawned sandbox) and inherits stdout/stderr/stdin survives the SIGKILL and keeps the pipe ends open. read_to_end then never sees EOF, and a never-reading holder blocks write_all, so `run` hangs past its deadline. Follow-up before S3a-2 wires `--run-review`: bound the joins (close our read ends or use non-blocking reads at the deadline), and add a test whose runner forks a `setsid sleep` holding stdout.
