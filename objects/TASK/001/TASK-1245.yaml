  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #1896):
    Verdict: CHANGES REQUESTED
    Findings:
    1. TASK-1245 regression: advisor_awaiting_line builds a UserStatusContext with role=advisor, but collect_awaiting_report ignores ctx.role for mail and instead reads AIDA_SESSION_ROLE. If advisor watch is launched from a plain/operator/reviewer environment, unread mail addressed to the advisor shared inbox is not part of compact_line(), so a mail-arrived condition may not wake the heartbeat as required. Use the supplied context role or otherwise ensure the advisor inbox is included in the awaiting surface.
