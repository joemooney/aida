title: Substrate/event-driven advisor heartbeat (wake only when aida awaiting is non-empty)
description: 'Follow-up to TASK-160. The drain-safe slice (a quiet-tick output contract in the aida-read-mail skill) shipped; this is the larger, non-drain-safe candidate: make the advisor heartbeat substrate/event-driven rather than a continuous agent-driven poll. Wake the advisor only when aida awaiting is non-empty (mail arrived, PR mergeable, drain event, findings non-empty), instead of a /loop that fires the agent every N minutes to narrate mostly-empty ticks. Pairs with the presence-is-not-the-clock and substrate-first mandates. Keyboard/keystone-adjacent (changes the loop/heartbeat invocation layer), so NOT drain-safe: implement supervised.'
