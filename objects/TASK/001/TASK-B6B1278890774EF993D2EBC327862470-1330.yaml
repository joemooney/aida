  content: |-
    ## Implementer self-review
    Reviewed HEAD: 3e0fa1c4351e787679dad9e7249a13c5eb27dc8d plus the native working-tree edit in docs/showcase/code-review.html. HEAD matches origin/integration. No untracked additions.
    AC1: [evidence: behavioral-test] Firefox reproduced 594px document width in a 500px viewport and a dock extending left of the viewport. After the fix (lines 256–271, 548–556, 868–895), four viewport probes from 316 to 764 CSS px fit. Verified reciprocal tab/panel IDs, one selected tab stop, Left/Right wrap, Home/End focus, all six click targets and no deck shortcut interference.
    AC2: [evidence: behavioral-test] Printed to PDF with deck mode active and the last facet selected. Extracted text included content from all six slides and six panels and omitted dock and tab button labels (lines 272–282). Deep pass corrected print table wrapping and suppressed the tab instruction. Showcase build check and diff whitespace check passed. Browser probes were temporary to honor the one-file scope. Assistive technology speech output was not exercised.
