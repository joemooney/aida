- id: 01a20d19-6ceb-7fc1-ae99-2c6e781046bb
  author: joe
  content: 'INTEGRATION PRE-CHECK (integration-30, 03:31): PR-4509 @ 13e7a41760c PASSES. Only docs/showcase/code-review.html (+69/-23), Joe-authored commit, merges CLEAN. AC1: the facet tabs follow the WAI-ARIA tabs pattern: role=tablist (aria-label), role=tab with id, aria-controls and aria-selected, role=tabpanel with aria-labelledby and tabindex=0. A roving tabindex (active 0, others -1) and a keydown handler (ArrowLeft/Right wrap, Home/End) move focus, and the active state syncs aria-selected and panel visibility. Mobile: overflow-wrap:anywhere at <=1080px, plus the <=680px grid rules. AC2: @media print hides the topbar, pres-dock, tab strip and facet instructions, and shows ALL slide sections (including deck mode) and ALL facet panels, with pre and tables wrapping (table-layout fixed, overflow visible) so nothing clips. Docs-only showcase polish; no product code.'
