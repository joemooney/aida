title: 'Seat messages hidden for a missing delivery sidecar are never silent: aida mailbox and a doctor check count and name them'
description: |
  Follow-up condition from advisor-122's 14:47 ruling on #4460 (STORY-2767 slice 1: fail-closed ACCEPTED). With slice 1, a seat message whose delivery sidecar is missing is HIDDEN from the reader (fail closed). Hidden messages must never be silent.

  ## Acceptance
  - AC1: `aida mailbox` (and an `aida doctor` check) counts and names hidden messages: "N seat messages hidden: delivery sidecar missing", with the message ids and an inspection command.
  - AC2: Test: a seat message without a sidecar is hidden from the reader AND reported by count plus id.

  Pre-screen (integration-30): touches mailbox_logical.rs / mailbox_cmd and doctor; no ADR-76 strict paths.
