  content: 'INTEGRATION PRE-CHECK (integration-30, 16:08): PR-4463 @ 213633ea4fc PASSES. Base integration (built on 77e36a0 with #4460 slice 1); one commit, traces present; +100/-19 in 5 files, standard tier (mailbox visibility diagnostics only; no ACK, binding or identity change). It meets the advisor''s 14:47 condition. delivery_gates now reports CONFIRMED missing seat sidecars only: a complete search (not unsighted), seat-addressed, not already unknown from a retained-lookup failure, and not deleted. The message stays gated NotOwned as before. Two surfaces: `aida mailbox inbox` prints ''N seat messages hidden: delivery sidecar missing (<ids>) — inspect with aida mailbox inbox --all'' on stderr for the reader''s own view, and doctor (mail_backlog::scan_and_route) adds a ''<CATEGORY>:missing-seat-sidecars'' finding from a diagnostic policy (inspect_all_seat_sidecars) that inventories every seat message without projecting records or granting ACK. The story2767 regression now asserts the exact note with the missing id and that the doctor scan carries the same summary. Notes, not blocking: (1) inspection_sources_complete now runs with the widened diagnostic policy, so its sidecar search covers all seat mail; on a very large retained set that could make the no-readers completeness check go partial sooner. (2) `aida mailbox read <id>` would be a more precise inspection hint than `inbox --all` (the operator-wide list).'
