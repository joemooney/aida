title: 'Review follow-up: [P2] Preserve the existing authorization result when relabeling approval actionability. re'
description: |-
  From STORY-2893
  Reviewed sha: 6edcb21547e083271200f1c4c6ca611d99576ced

  [P2] Preserve the existing authorization result when relabeling approval actionability. review_verdict_show_body deliberately returns needs-review when independent_approval_authorized rejects an unattested, self-authored, revoked or otherwise invalid approval. The new postprocessing at review_commands.rs:4337-4340 and 4390 checks only the parsed approval word and matching SHA, then unconditionally overwrites that result with current-head-approved. An unattested APPROVED file at local HEAD is enough to trigger this even without a PR lookup; the real merge gates may still correctly demand a reviewer. Keep the authority validation in the display path and cover the full handler/postprocessing with the existing invalid-authority fixtures, rather than testing only the preexisting body function or a fabricated renderer input.
