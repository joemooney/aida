  aida-cli-lib/src/gate/review_authority.rs, HumanReceiptSettlement::receipt_id — When removing a previous crashed attempt’s unreferenced receipt fails, the function warns and returns a new ID. issue then overwrites the slot reservation, losing the recovery pointer to the old receipt. A transient unlink failure followed by a successful reservation write leaves an orphan permanently. Preserve the reservation and propagate the cleanup error so a retry can finish it.
