description: |-
  From BUG-2765
  Reviewed sha: 5f2421b51c8220f2ba2035bb3bf7140b1e493b03

  aida-cli-lib/src/review_watch.rs admit_change: besides forge reads, the forge WRITES that precede PassClaim::decide now run without the admission claim: stale_follow_up -> update::forge_update (`gh pr update-branch`), review_launch::route_rework, and the readiness report(). Before this PR the whole pass ran under the shared claim, so a land/ship holding Exclusive admission excluded them. pr-head.protect=true (pr_head_guard::check) still refuses approved or train-pinned heads, so the ship case is mitigated, but it is check-then-act, and after decide() yields mid-pass the remaining changes still get update-branch/rework routing while the land runs. The PassClaim doc comment ('Forge reads ... run without it') understates this. Follow-up: short-circuit the rest of the pass once decide() reports a yield, or take the claim around forge mutations.
