title: 'Review follow-up: P2: aida-cli-lib/src/tests/task_1544_light_doctor_tests.rs:175-177 interpolates clone_key,'
description: |-
  From BUG-2672
  Reviewed sha: 12ad00b70c6d4d90c8abe07b5c6482b329947d39

  P2: aida-cli-lib/src/tests/task_1544_light_doctor_tests.rs:175-177 interpolates clone_key, a filesystem path, directly into a quoted TOML table key. A temporary-root path containing a quote or backslash produces malformed or differently interpreted local-layer configuration, so the enabled-bridge fixture fails instead of testing grace. Exact-head CI fast-gates job 135409421737 rejects this new line in Check Rust test portability ratchet, causing the required Build aggregate to fail. Serialize the table key/local-layer document through TOML escaping rather than raw path interpolation. This is a test-fixture/source-guard defect, independent of the protected-base changes; it does not establish a production acceptance or authority defect.
