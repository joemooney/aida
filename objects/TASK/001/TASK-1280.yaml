comments:
- id: 01a0b69c-c907-78c2-9ece-a1adbb4f2802
  author: joe
  content: '[advisor] Premise narrowed at the #1946 review: the reviewer verified that a store commit touching only schedule/*.yaml does NOT force a cache rebuild (cached_git_backend changed_object_files diffs -- objects, so try_incremental_update sees zero changes and re-stamps HEAD). So this task is NOT a cache-churn fix. What remains real: N ledger commits per tick inflate the aida-store history (store gc pressure, noisier aida history events, N pushes per tick when online). Scope is now: one store commit per tick for all ledger updates the tick produced (the per-job 60 s debounce stays as the inner bound), and one push. Drop the cache fast-path bullet. Acceptance: a tick firing N=3 fake jobs produces exactly one aida-store commit and at most one push; aida history events shows one ledger event batch per tick.'
