  content: |
    Advisor scope at S3a #4389 964a98c30ed. The watch command and land metrics now resolve the same main checkout on the invoking host. That covers linked worktrees on one host. The files still live under that checkout's .aida/land directory and the periodic job has no host restriction. Distinct primary clones can therefore retain separate episode histories under failover. A follow-up sketch should pick one scheduler/state owner across eligible hosts (including failover semantics) or define one authoritative shared history. Verify from two independent primary clones and from a linked worktree. Require a single episode identity, stable original observation time across a handoff, and an explicit unavailable result where a metrics reader cannot consult the authoritative history. Duplicate fix-spec or attention filing, reruns and smoke spool delivery belong to the separately gated S3b effects design.
