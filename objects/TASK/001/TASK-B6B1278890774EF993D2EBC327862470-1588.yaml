  content: |-
    ## Implementer finding: already satisfied on main (duplicate of TASK-3922)

    Reviewed HEAD 82c120dd1c. TASK-3922 (Completed, #4702, commit 3f8b6015cb, an ancestor of main) shipped the same three criteria from BUG-2778 comment 3:
    - AC1: aida-cli-lib/src/seat_clone.rs:3279-3284 reuses an identical salvage (same body/head and same bundle refs) on a retried teardown. Test: tests/task_3922_admission_followup_tests.rs `the_newest_identical_salvage_is_reused`.
    - AC2: aida-core/src/mailbox_lifecycle/retire.rs:170-190. The WriterAdmissionUnknown Display no longer says the writers 'should exit on their own'. Each named writer carries its own `stop it with `kill <pid>`, then start/rerun ...` command. Tests are in bug_2778_admission_retry_tests.rs, including credential redaction.
    - AC3: bug_2778_admission_retry_tests.rs `retire_with_maps_a_transient_admission_refusal` (guard.rs mapping), plus task_3922 tests `lane_reuse_retries_only_a_transient_refusal` (dispatch.rs `reuse_refusal_is_transient`) and `rework_reclaim_retries_only_a_clone_kept_for_a_transient_refusal` (work.rs `kept_for_transient_admission`).

    No code change and no PR. Fail-closed behaviour is unchanged.
