title: 'Writer-admission retry: idempotent salvage per clone+head, the refusal names the exact stop/restart command, and wiring tests (BUG-2778 follow-up)'
description: |-
  Advisor aida-d3 2026-11-27 16:20 (filed by product-15), from the #4693 approval deferrals (BUG-2778 comment 3).

  ## Acceptance
  - AC1: reclaim_exited_branch_clone (queue_cmd/work.rs ~4251) retries do not write duplicate salvage: seat_clone salvage is idempotent per clone + head (skip when an identical salvage already exists).
  - AC2: when retries are spent on writers running a deleted/stale binary, the WriterAdmissionUnknown refusal names the exact stop/restart command for each pid instead of saying they 'should exit on their own'.
  - AC3: wiring tests: retire_with maps WriterAdmissionUnknown{transient:true} to RetentionRefusal.transient_admission (aida-core mailbox_lifecycle/guard.rs ~214-224), and the two call-site predicates (dispatch.rs lane reuse, queue_cmd/work.rs rework reclaim) retry on it.
