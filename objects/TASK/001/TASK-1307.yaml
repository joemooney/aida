title: 'Sweep the store for specs already stranded by a refusal: refused at current head, still Done, unheld, unqueued'
description: |
  BUG-1452 stops new refusals from stranding a spec. It does nothing for the ones already stranded, and those are the instances that prompted the spec. This is that half, split out of BUG-1452 acceptance criterion 6 on 2026-09-20 so the prevention can ship without the cleanup blocking it.

  THE STATE TO FIND. A spec whose PR carries a refusing verdict at the PR's current head, while the spec sits at Done, the PR is open with no merge hold (neither the `.aida/merge-holds/PR-N` marker nor the `aida:merge-hold` label), and no queue entry exists to re-drive it. Refused, reading as finished, mergeable by anything that asks, and unreachable by any drive.

  KNOWN INSTANCES, all 2026-09-20, all found by hand:
      TASK-1298   PR #2014
      BUG-1310    PR #2016
      STORY-1350  PR #1974
      BUG-1429    PR #2021
  A later count put it at eight, seven drain-issued and one hand-recorded (BUG-1485 / PR #2030). The total before 2026-09-20 has never been measured, which is the point of the sweep - the four were found by an advisor opening `aida awaiting` and reading verdict files one at a time, so the discovery method cannot establish a count.

  Acceptance:
  1. A command reports every spec currently in the stranded state, reading the verdict files and the PR state rather than inferring from spec status alone. It states, per row, which of the four conditions hold: status not moved, hold absent, queue entry absent, verdict refusing at the current head.
  2. The report distinguishes a refusal at the PR's CURRENT head from a refusal at a superseded head. A verdict against an old head is not evidence the current PR is refused, and treating it as such would strand work that was already reworked.
  3. The sweep is read-only by default. Remediation - applying holds, moving status, requeueing - is a separate explicit action, because bulk-mutating spec status off an inferred condition is exactly the kind of pass that should not run on a default invocation.
  4. Remediation, when invoked, is idempotent and reports what it changed. Running it twice changes nothing the second time.
  5. The count is recorded somewhere durable once measured, since the pre-2026-09-20 number is currently unknown and will stop being recoverable as PRs are merged or closed.
  6. A test constructs the stranded state in a fixture and asserts the sweep finds it, and asserts it does NOT flag a spec whose refusal is against a superseded head.

  NOT IN SCOPE: preventing new instances. That is BUG-1452, and this task assumes it lands.
