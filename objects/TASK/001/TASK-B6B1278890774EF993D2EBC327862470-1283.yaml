description: |-
  From TASK-3852
  Reviewed sha: a2f048d7d0cdfb74977229c352068cb6c35339d8

  aida-cli-lib/src/forge.rs:1903 — The five-second reporting deadline starts after main_root and Repository::load. Those calls perform up to three Git subprocesses with independent 30-second ceilings through review_watch_forge.rs:64. A stalled worktree or origin lookup can now hold up doctor and the initial land status report for 30 seconds before the gh budget begins. Start the scoped deadline before repository discovery so the existing bounded runner applies the same budget to Git and gh.
