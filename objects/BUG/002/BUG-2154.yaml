title: Contained launch continues when the contained-store marker write fails (eprintln only), leaving old-git store protection to config alone
description: |-
  From the #2670 STRICT review: session.rs:~2531 prints the marker write error and continues; the behavior predates TASK-1775. On git < 2.40, host store git then relies only on contained config.
  ## Acceptance
  - If the marker write fails, the launch grants NO store write paths (or refuses the contained launch).
  - A test injects a marker write failure and asserts no store write paths.
  - Also guard the raw rev-parse at aida-core/src/db/yaml_backend.rs:102 or mark it raw-git-ok with a reason.
