title: 'Policy B check-then-recurse window: a live contained process can swap a submodule .git pointer between refuse_untrusted_gitlinks and the recursing status'
description: |-
  Follow-up from the #2731 review (BUG-1985, finding 3). refuse_untrusted_gitlinks reads each submodule .git pointer file, which lives in the session-writable tree. The safety checks then run git status --ignore-submodules=none, which recurses: worktree_is_dirty, worktree_status_porcelain, submodules_with_uncommitted_edits and status_sections::worktree_dirty_entries. A sandboxed process still running in the tree can replace sub/.git with a directory carrying a hostile config between the check and the recursing status.

  ## Acceptance
  - The recursing status cannot run a config swapped in after the check. Options: verify worktree_holders shows no live process in the tree before recursing, re-verify the pointers afterwards and discard the result on change, or document no live contained process in the tree as a precondition enforced by callers.
  - A test swaps the pointer between the check and the status and asserts no planted driver runs.
