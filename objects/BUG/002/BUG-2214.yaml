title: A mandate cannot land a held PR that is behind main, or a supervised PR whose hold a human already cleared
description: |
  ## Problem
  Overnight under an active `ship-held --include-supervised` mandate, approved PRs could not land without a human, in three ways (2026-10-23):
  1. A held PR that is BEHIND main: `aida pr ship` refuses "behind main" before it reaches the mandate hold release, and `aida pr train` never releases a hold. So nothing can land it (#2838, #2867).
  2. A supervised PR whose hold a human already cleared: there is no typed merge-hold marker left for the mandate to release, so ship and train refuse with "a human must ship it" (#2864, #2869). Clearing the hold by hand leaves the PR harder to land than before.
  3. After `gh pr update-branch`, ship's mandate-evidence read fails ("git merge-base: Not a valid commit name <new head>") because the new head is not fetched locally.
  ## Acceptance
  - Under a covering mandate, `aida pr train` releases a member's merge hold exactly when `aida pr ship` would (same cover check, same ledger record, same PR comment), then lands it on the tested train.
  - A supervised PR whose hold was human-cleared, with an approval at head, is covered by a mandate that includes supervised specs.
  - Ship/train fetch the PR head before reading mandate evidence.
  - Fail closed: operator-only (STORY-1129-class) specs, protected gate paths and missing approvals still refuse. Tests cover each refusal.
