title: 'pr ship: the slow mandate scan uses up the --wait budget, then the CI wait times out without polling and reports ''checks have not registered'''
description: 'Observed 2026-10-18 on PR-2749, twice. ''aida pr ship 2749 --wait 900'' spends more than 15 min in step 1 (the mandate trace scan, BUG-2179). At step 2 (ci_gate.rs wait_for_ship_ci) the timeout check at the top of the loop fires before the first forge.checks_registered call: the log has no ''CI pending for'' lines. It returns ''CI wait timed out for PR-2749 — still pending: checks have not registered'', the initial placeholder string. Meanwhile gh pr checks 2749 shows every check passed (Build pass, merge-hold-gate pass). Two defects: (1) the CI-wait budget is shared with, or eaten by, pre-CI steps, so --wait has to cover the mandate scan; (2) on a zero or exhausted budget the wait should poll at least once before declaring a timeout, and should never report the unpolled placeholder as the pending reason. Fix: give the CI wait its own deadline starting at step 2, poll at least once, and make the timeout message say ''never polled'' when it wasn''t. Workaround: --wait 3600. Related: BUG-2179.'
