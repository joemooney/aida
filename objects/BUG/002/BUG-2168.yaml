title: aida agent new --bg --cwd <worktree> without --spec dispatches into the primary checkout instead of the given cwd
description: 'Seen 2026-10-16 01:18 twice: ''aida agent new claude --bg --role implementer --cwd /home/joe/ai/aida-story-1699 --name fix-story-1699 --prompt-file F'' (also when run with that dir as the shell cwd) prints ''dispatching claude ... in /home/joe/ai/aida''. The Claude sandbox then makes the intended worktree and .git read-only, so the seat cannot commit there (first attempt blocked for that reason). With --spec the pool worktree is used. Expected: an explicit --cwd is honoured (or refused with a reason). Related: with --spec X --force --cwd D, dispatch refuses ''already owned by session <lease> (worktree: D)'' even though D is the very worktree requested; adopting the dormant lease for that worktree would be the useful behaviour.'
