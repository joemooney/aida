title: aida agent ls reports 'No active agents' inside a PID-namespaced sandbox while sessions are live
description: '2026-10-23 09:47: from the advisor''s sandboxed Bash (bubblewrap gives each command its own PID namespace, so it sees only its own pid 1-3), ''aida agent ls'' printed ''No active agents found.'' At the same moment Claude Code''s ListAgents showed 10 live sessions (bg lanes impl-task-2238, take-2845, take-2830 and others). pgrep is blind there too, so process-based liveness checks (agent ls, reviewer-already-running guards, possibly aida ps) give false answers under the sandbox. Expected: agent ls uses a liveness source that works across PID namespaces (heartbeat or lease timestamps, the session registry) or says that process liveness is unavailable instead of reporting none.'
