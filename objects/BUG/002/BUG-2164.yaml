title: aida pr ship with no PR number on the default branch pushes main and tries 'gh pr create main->main' instead of refusing
description: |-
  Seen 2026-10-15 17:47: the operator ran 'aida pr ship' (omitting the number) in ~/ai/aida-host on main. It pushed main to origin ('Everything up-to-date'), ran the protocol check ('could not evaluate: on the default branch'), then failed with 'gh pr create failed: No commits between main and main'. No harm was done, but the message is confusing.
  Acceptance: on the default branch with no PR argument, refuse BEFORE any push with 'aida pr ship: on the default branch; pass a PR number (e.g. aida pr ship 8)'. If there are open approved PRs, list them as suggestions. Add a test.
