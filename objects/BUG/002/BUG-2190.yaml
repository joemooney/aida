title: 'aida list (open lens) reports ''count: 0 of 0 open'' while ~470 specs are Draft/Approved/NeedsAttention/InProgress; --status filters also return 0'
description: |-
  Repro on main 6d590ed914 (live binary), 2026-10-19:
  - `aida list` prints 'count: 0 of 0 open' plus 'note: 3435 closed hidden'.
  - `aida list --status approved` (and draft, needs-attention, in-progress) prints 'count: 0 of 0 matched'.
  - `aida list --all --format json` returns 5346 specs: 238 Draft, 203 Approved, 20 NeedsAttention, 12 InProgress.
  - `aida show STORY-1853` reports in-progress.
  The open lens and the status filter are therefore dropping every open spec. Because agents cannot see the backlog through the primary listing surface, burndown planning breaks. Look at status-name normalization ('Approved' vs 'approved' vs 'NeedsAttention') and the lens predicate. The fix needs a regression test that lists a fixture with one spec of each open status.
