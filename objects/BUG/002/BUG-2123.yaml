title: Auto-release of composed Rework holds can drop an unanswered refusal on another spec
description: |
  From the strict review of PR #2614 (STORY-1687) at 4f757e049c, non-blocking item 3: "covered specs" for auto-release leaves out specs named only in absorbed holds or in the PR title. Composing Rework holds replaces the older verdict reference (`merge_hold.rs:553`), so an approval on spec B can release a hold whose refusal on spec A was never answered.

  Expected: composing Rework holds keeps every refused (spec, sha) reference. Auto-release requires an approval covering each refused spec.
  Acceptance: a test with holds composed from refusals on A and B where only B is approved: the hold is NOT released.
  This is authority code (ADR-75 strict tier).
