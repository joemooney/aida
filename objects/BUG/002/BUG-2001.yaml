title: OS wrapper binds headless_worktree_root() read-write, which falls back to cwd/$HOME outside git
description: 'Found during BUG-1971. claude_program_and_args / os_wrapped_program_and_args (STORY-612) bind headless_worktree_root() rw. That helper falls back to cwd (then ''.'') when no git root resolves, so a contained headless launch outside a git repo gets an OS-level rw bind of cwd, possibly $HOME. BUG-1971 made the settings-level write boundary fail closed in this case; the OS wrapper should match (refuse or bind nothing rw). Expected: no git root => contained launch refuses or binds no rw worktree.'
