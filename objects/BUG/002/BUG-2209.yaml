title: A test run as the hermetic test user rewrote the real store roster (registry/team.toml), wiping the operator's seats
description: 'At 2026-10-23 00:50:37 -0700 the store auto-sync commit da5ab2b581 (''chore: sync pending changes'') pushed registry/team.toml reduced to: [members] bug-1618-hermetic-test-user = ["implementer"]. joe and joe.mooney were deleted. Every advisor grant then failed check_roster (RosterDenied), and all reviewer launches refused with ''no valid parent seat grant is active''. Earlier leaks of the same user: 200d821b93 and 7abcf479db on 2026-10-20 added bug-1618-hermetic-test-user (once with advisor) to the real roster. Root cause to find: a test running under test_env''s AIDA_USER=HERMETIC_TEST_USER resolved the PRIMARY store (AIDA_STORE / AIDA_DEV_REPO / cwd fallback) instead of its tempdir and wrote the roster with a whole-file replace; the auto-sync then committed it. Acceptance: (1) identify the test(s) and make them hermetic; (2) a guard: any roster write from a process whose AIDA_USER is HERMETIC_TEST_USER, or whose store is not under a tempdir while cfg(test), panics; (3) roster writes merge members rather than replace the file (CAS on the member being changed), so one user''s set-role can never delete another member; (4) the auto-sync refuses to commit a team.toml change that removes a member who holds advisor, or flags it loudly; (5) a regression test for each.'
