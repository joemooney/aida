  content: 'FACTORY PLAN (codex): In docs/cli/verify-manual.py help_all_commands(), skip rows whose description begins with the external marker emitted by help-all. Add fixture-based unittest coverage in tests/test_verify_manual.py proving external gui/host-bench rows are excluded, ordinary built-ins and meta-command filtering are preserved, and main() still fails completeness for an undocumented built-in. No PATH or environment mutation; mock subprocess output. Acceptance is checked through parser and actual completeness exit/output assertions. Risk: overbroad filtering; retain built-in descriptions containing the word external. Run the Python test target and make check-ci-fast before push.'
