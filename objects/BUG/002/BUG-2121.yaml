title: verify-manual.py completeness counts PATH extensions (aida-<name> executables) as commands, so every local drain publication is auto-closed on a machine with aida-* plugins
description: 'help_all_commands() in docs/cli/verify-manual.py matches every 2-space-indented line of `aida help-all`, including the external-extension section (`gui  external ~/.cargo/bin/aida-gui`, `host-bench  external ~/.local/bin/aida-host-bench`). On the operator''s machine, the publication guard ''CLI-manual drift-guard'' therefore fails for every drain PR, and the PR is auto-closed before review: BUG-1953''s PR #2615 was closed 2026-10-13 19:36. CI passes because its PATH has no plugins. Fix: exclude external-extension rows from the completeness universe (the script''s own comment at ~line 399 already says aida <name> may be a PATH extension). Acceptance: a test or fixture where help-all includes external rows and completeness ignores them, while a built-in undocumented command still fails.'
status: InProgress
