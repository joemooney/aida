title: 'Contained parent: widening passthrough flags (--add-dir, --allowedTools, --tools, --plugin-dir/url, --mcp-config, --agents) reach a contained claude child'
description: |-
  Found in the BUG-2151 #2672 round-2 e2e case 11: '--extra-flag=--add-dir=/ --extra-flag=--allowedTools=Edit(//**)' passed through to the contained child alongside AIDA_CONTAINED=1. The claude strip list (agent_launch.rs:1501-1509) is a denylist missing these flags. The contained write boundary is itself expressed as Edit/Write allow rules, so these flags widen it.
  Acceptance: under a contained parent, any extra or default flag NOT on an explicit allowlist is refused with a clear message (allowlist, not denylist). Tests cover each named flag and an unknown flag. Tier STRICT.
