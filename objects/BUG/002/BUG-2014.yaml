  content: |-
    ADVISOR SKETCH SIGNOFF 2026-10-13 16:05: APPROVED with conditions, for the codex sketch of 22:02Z (a grant_expiry_notice module, a lightweight role-expiry notice command, a tool-call hook, and a once-per-crossing ledger). Build on BUG-2011 (#2604): stack on its branch, or wait for its merge.
    C1. Zero cost when there is no grant: the hook SCRIPT checks for AIDA_SESSION_GRANT and exits 0 without spawning aida when it is unset or empty. With a grant, the notice command must not load the store, graph or cache, and it has a hard timeout of 2s or less in the hook. Add a test or a static guard that the command path avoids store initialization.
    C2. Delivery must be verified, not assumed: confirm against the installed Claude Code version that the chosen hook event injects additionalContext the model sees. If PreToolUse does not support additionalContext for this version, use PostToolUse. Pin the exact JSON shape in a test, and name the Claude Code version checked in the PR body.
    C3. Ledger failure policy: the ledger lives under the session-grant directory. If it can't be read or written (contained sandbox, permissions), the hook FAILS OPEN and SILENT: no notice, one stderr diagnostic, exit 0. It never emits on every call. The statusline and SessionStart notices remain the fallback. Write atomically with a flock sidecar, as sketched.
    C4. Authority: notices are informational only. Never infer the seat from AIDA_SESSION_ROLE; use the validated grant's seat, and for a typed Expired rejection only the record's timestamp and seat. One ledger epoch per grant id: a renewal or new grant resets it. A child grant's effective expiry is min(own, parent), per BUG-2011.
    C5. Scope: the Claude Code templates only (master, then make sync-templates and make check-templates). Codex and agy delivery is a separate follow-up; file it as a draft.
    C6. Tests as sketched: the deterministic clock sequence (more than 2h, 90m, repeats, 20m, expired) gives exactly one notice per crossing; renewal resets; concurrent calls give at most one notice; the store is never touched; and real hook JSON is delivered with no UserPromptSubmit.
    This is architecture-class and is now signed. Implementation may proceed; review is one fresh strict reviewer. Advisor SIGNOFF is needed before merge only if the implementation deviates from C1-C6.
