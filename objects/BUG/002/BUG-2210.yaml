title: dev activate auto in a worktree picks main's fresher build instead of the worktree's own build
description: 'In ~/ai/aida-worktrees/take-2830, `aida dev build` printed ''try this build in your shell'' via `aida dev activate auto`, but activate auto selected the primary checkout''s newer build (c6bb0dc4f1) instead of the worktree''s target/agent build. The operator ran the BUG-1934 C4 probe against the wrong binary until PATH was set to the worktree''s target/agent by hand. Expected: run from a worktree, activate auto prefers that worktree''s build, or it names the build it picked and why.'
