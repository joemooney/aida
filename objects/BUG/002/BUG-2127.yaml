title: 'Flake: cached_git_backend reader_ancestor_check_timeout_is_counted_and_never_writes fails on CI'
description: 'CI run 38590162114 (PR #2600, head bdd646e004, 2026-10-14 15:45 UTC) failed at aida-core/src/db/cached_git_backend.rs:4874 in tests::reader_ancestor_check_timeout_is_counted_and_never_writes (1398 passed, 1 failed). The PR touches only story_1656_multi_forge_init_tests.rs, so this is unrelated and looks timing-dependent (a timeout-counting assertion under CI load). Acceptance: the test''s outcome does not depend on wall-clock load, e.g. it injects the timeout via a seam rather than racing a real subprocess; 50 consecutive runs at full parallelism pass. Related: BUG-1809.'
