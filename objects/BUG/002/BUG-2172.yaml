title: 'Containment: nine more agent launch sites pass a literal contained=false; enforce at the spawn choke point'
description: 'From the #2696 review (BUG-2171/2170 follow-up). These sites pass a literal contained=false to spawn helpers, which never consult the parent''s environment, so a contained parent can launch an uncontained child: questions.rs:1277 (research dispatch), questions.rs:1753 (remedy), plan_intent.rs:237 and :793, advisor_watch.rs:241 and :276, reconstitute.rs:935, harvest.rs:1225, phase_driver_trait.rs:3233. compete_cmd.rs:829 (judge) and :1011 (arms) hard-code containment_applied(_, false). Fix at the choke point: spawn_vendor_headless_with_seat_granted / compose_headless_command treat contained as contained || aida_contained_env()?, and the same for compete. Add a test that drives one real call site under AIDA_CONTAINED=1. Also from that review: refuse_uncontained_child_of_contained_parent is called with a hand-built config that always passes (burndown_run ~276, autopilot_intake ~784, questions ~1537); pass the real argv or remove the call. Factor the 4 duplicate refusal messages and the two identical resolve_*_posture fns into one session:: helper. burndown_run.rs:546 still prints ''BYPASSED permissions'' under a contained parent.'
