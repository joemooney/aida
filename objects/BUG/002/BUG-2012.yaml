title: Contained write roots must refuse a main-checkout root (.git inside the granted root lets hooks escape the sandbox); close the BUG-1971 surviving mutations
description: |
  Follow-up from the round-2 advisor review of PR #2581 (BUG-1971), APPROVE at cd4d60fa5f.

  `contained_resume_write_roots` keeps the git root when it equals the canonical cwd. If that root were a MAIN checkout, its `.git` directory sits inside the granted root, so the `Edit(//<root>/**)` rule would cover `.git/hooks` and `.git/config`. Git hooks run outside the sandbox the next time the operator uses git, which makes that a sandbox escape. It isn't reachable today: every contained resume caller passes a lease worktree, which `session_start` always creates as a linked worktree (`.git` is a file and the hooks live outside the root). But nothing enforces that.

  ## Acceptance
  - Contained write roots (resume, and ideally fresh launch too) are granted only for a linked worktree (`.git` is a file), or the boundary adds explicit `Edit`/`Write` deny rules for `//<root>/.git/**`. Pick one in a short sketch.
  - A test proves a main checkout root gets no write roots (or gets the .git denies).
  - Close the two surviving mutations from the review: (1) shrink the production tail of `contained_session_git_root` (session.rs ~1296-1297) to a one-line call to `contained_session_write_roots_from(&current_dir)`, so a reintroduced cwd fallback fails a test; (2) cover the resume call site `contained.then_some(cwd)` (session.rs ~3204).
