title: 'Hook refresh follow-ups from the BUG-1977 review: custom-hook refusal hides the stale list; core.hooksPath followed silently'
description: |-
  From the strict review of #2580 (BUG-1977), approved at aaf1a5e593.
  (1) git_ops.rs ~3813-3821: the refusal for a custom hook that calls aida still returns at the first such hook, so a stale pre-commit next to a custom post-commit is reported only on a second attempt. Collect custom-hook problems too and report everything together.
  (2) hooks_dir ~3872: the refresh follows core.hooksPath without saying so. A shared global hooks directory gets changed for every repo that uses it, and a tracked in-repo hooks directory gets untracked backup files. Print a note, or require confirmation, when the hooks directory is outside the repo's git directory.
  Nits: the header checksum is unused; no fsync before the rename; the output ignores --format json/toon; --only handling is duplicated in lib_part1.rs and scaffold_cmd.rs.
