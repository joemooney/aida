title: aida worktree add <SPEC> prints a blank/stale path after aida claim, so fixers fall back to raw git worktree add
description: 'Fire mode 2026-10-14: two independent fixers (BUG-2141, TASK-1750) ran ''aida claim <SPEC>'' then ''aida worktree add <SPEC>''; the command reported an empty (or stale empty) path instead of creating/printing a sibling worktree, and both fell back to ''git worktree add'' by hand (/home/joe/ai/aida-bug-2141, /home/joe/ai/aida-task1750-reader). Suspect: claim records a lease with worktree_path="" (seen in .aida/sessions/*.toml for the BUG-2130 claim: worktree_path = ""), and worktree add returns the lease''s recorded path instead of creating one. Acceptance: claim then worktree add creates the worktree off origin/main and prints its absolute path; an empty recorded path is never printed as success.'
