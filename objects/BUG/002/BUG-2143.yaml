  author: joe
  content: 'Advisor 2026-10-14 23:20, more impact: the leases left by claim + failed worktree add record branch = "main" (and often worktree_path = ""). aida session reap then classifies them ''protected checkout/branch — never reaped'', so dead leases for MERGED specs (TASK-1763, BUG-2003/2009, BUG-2136, ...) pile up in aida ps forever; I ended 7 by hand with session end --yes. Acceptance addition: a lease created by claim records the worktree branch (or none), never the primary checkout''s main; reap treats a dead-pid lease on a merged spec as reapable regardless.'
