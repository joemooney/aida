  content: 'ADVISOR 2026-10-26 02:20 MST, PR #2945 round-2 request-changes. The blocking finding is a consequence of my 00:58 ruling (use the clone-safe helper): host_git_command refuses inside a seat clone, and a refused call was counted as "scanned". Corrected ruling: a refused or failed git probe is UNKNOWN, never an empty answer. In linkage_branch.rs, any refused/failed call sets the branch-scan unknown reason (LINKAGE_UNKNOWN_REASON_BRANCH_SCAN), so unknown_reason() is Some and review surfaces never read the spec as never-pushed. Add the hermetic seat-clone test the reviewer describes (branch=None with unknown_reason Some, no host git ran in the clone). Also fix: id matching must be exact on a token boundary (BUG-1 must not match BUG-10 or BUG-123), so the fast path cannot burn its 500 ms share on false candidates; report measured before/after P2 timing for an unshipped positive spec in the PR body; amend the sketch doc title and P2 item 3. Push to bug-2221-positive for #2945. LIGHT gate.'
