  content: |
    SKETCH v1 (BUG-2221) — AWAITING ADVISOR SIGNOFF
    Author: codex2, independent reviewer/investigator; no implementation authorization or completion claim.
    Source: main3cbb90b0c94e0e748bbfc4eb1f75d7f9c2125c68. Derived from trace.rs::collect_git_linkage_inner817–1010 and collect_source_files124/scan_trace_graph_bounded173. Retain original acceptance1000ms/10%/5000ms, lineage, canonical reads, BUG1801 behavior and formats. No new server, poller, grant or authority setting.

    Problem / bounded choice
    Measured default1541/2079ms vs no-git611/800ms; actual all-ref log child~885ms inside905ms linkage. About400ms remains outside named phases. Merely subtracting store ancestry saved225ms and is neither equivalent nor sufficient. Choose ONE local, disposable negative-history proof cache plus resumable bounded Git batches; keep the existing positive-log/order/render path. No blanket store exclusion, date cutoff, speculative negative, new authority source or background warming.

    Actual negative algorithm
    1. Capture Git context S and effective root snapshot R below. Query IDs are the exact byte strings passed to existing -F --grep arguments, including agreed/origin aliases; key their sorted/deduplicated set AND the existing three message-parser/schema versions. Do not replace Git's prefilter with a case-insensitive substring approximation.
    2. The cache stores, per query/context, parsed-negative commit OIDs, their parent OIDs, pending work and CLOSED-negative OIDs. CLOSED means this commit failed the existing Git-prefilter-plus-parser test AND every parent is already CLOSED; parentless commits close first, then closure propagates back to children. Never infer an entire ancestry is negative just because its tip is negative. Persist only successful, completely framed batch evidence. No positive/authority/lifecycle state lives here.
    3. Start from every R root not already CLOSED. A cached negative-but-open commit contributes its unresolved parents. Deduplicate the pending OID worklist. Use bounded batches (initial maximum1024 OIDs, stdin rather than shell/argv interpolation):
       A. `git log --no-walk=unsorted --format=<OID,parent-OIDs framing> --stdin` obtains EVERY requested commit and its parents; require an exact accounting of requested distinct commit OIDs.
       B. On the SAME immutable OIDs, run the existing fixed-string --grep arguments and full-message format, with --no-walk=unsorted, then the same extract_spec_ids_from_commit/extract_referenced_spec_ids_from_commit/extract_trace_line_spec_ids predicates. This preserves Git's own grep/encoding behavior. Failed, truncated, missing, malformed or oversized output certifies nothing.
       When no parsed hit exists, mark this batch's nodes negative and enqueue their unclosed parents. Advance closure only from proved closed parents. Stop and use the existing positive path if a parsed hit exists; do not synthesize date-order from batch order.
    4. All current roots CLOSED is an exact negative proof: return complete empty commits; shipped=false is justified. A root addition/update follows only its not-yet-proved parents; rewind/removal can reuse the content-addressed negative cones. Ordinary new store commits therefore do not invalidate all prior negative work. An interrupted batch leaves the prior proof intact, never publishes a false complete bit. Cache absence/corruption or a nonblocking cache-lock miss permits bounded foreground work/incomplete output, never a required store lock/wait.
    5. If a hit is found, retain the current complete `git log --all -F --date-order ...` collector for exact ordering, branch/shipped/forge and drift behavior. Under deadline, inability to finish yields existing incomplete/unknown labels, not a cached invented positive ordering. This sketch repairs the measured negative shape; positive-path performance must still be measured and cannot silently be declared satisfied.

    Cold/warm and deadline behavior
    Warm fully covered roots require the bounded snapshot check and a closed-root lookup, without an ancestry log. A truly cold/partially built cache runs only bounded batches and can return incomplete linkage until later ordinary shows finish the proof. Progress happens only during requested shows, without children surviving the command or a poller. This explicit cold incomplete behavior needs advisor signoff; the sketch does NOT promise cold complete linkage below1000ms.
    Use a foreground work deadline derived from the unchanged1000ms show objective, counting from command entry and reserving measured canonical/render work, clipped by the existing outer linkage/per-call caps. Do not change the configured budget/tolerance/ceiling or enlarge any existing cap. The reserve must be chosen from measured non-linkage phases in slice1, not assume885ms removal is sufficient. Deadline expiry/unsupported context/error means commits_scan_incomplete=true and shipped=null; files use their independent truthful completeness bit. Do not launch a full positive fallback after time is exhausted. A deadline is cooperative around filesystem steps; do not claim it preempts arbitrary kernel/network filesystem stalls.

    Validity / concurrent changes
    S binds effective Git common-dir AND per-worktree gitdir identity (using the same inherited Git context as the existing command), object hash format, Git executable/version, parser/schema version, effective Git configuration digest and semantic Git environment digest. Keep only digests, never raw credentials/config/env. Include object-directory/alternates identity, namespace, config overrides and locale/encoding context. Object packing alone does not change an immutable commit's proved message/parents. An uncached missing/corrupt object cannot be certified; root discovery failure is unknown. This is ordinary content-addressed Git behavior, not protection against forged same-UID cache state or arbitrary object tampering.
    R includes the effective `--all` root commit OIDs, ref names/OIDs/symbolic targets, and effective HEADs including detached linked-worktree HEADs. Obtain roots via Git's own `log --all --no-walk=unsorted --format=%H`, with bounded companion ref/HEAD evidence; do NOT substitute `rev-parse --all`. The isolated Git2.43 experiment /tmp/codex2-bug2221-gitshape.json proved log--all includes current AND other linked detached HEADs while rev-parse--all omits both. Tags are peeled by Git; include pseudo/worktree roots that Git actually admits, not only heads/remotes/tags guessed from names.
    V1 disables this fast path in shallow repositories, with nonempty effective graft files, active replacement refs/custom replace base or replacement-control overrides, and unsupported revision/config modes. Preserve them through the original Git query under the deadline; incomplete/unknown on expiry, never silently reinterpret history. Include the effective shallow/graft/replace state in S even for this refusal, so an ordinary proof is never reused after one appears/disappears. Tests must prove fallback uses inherited semantics, not --no-replace-objects. Existing positive log ordering/branch logic remains Git-owned.
    Take before/after snapshots with the same bounded capture routine; if S or R differs, do not emit a complete negative tied to the former snapshot. Retain individually proved immutable negatives only when S is unchanged; enqueue new roots on the next call. At most one retry if time remains, otherwise unknown. No unbounded retry under a moving fleet. Revalidate once after dependent linkage/drift work before rendering complete linkage; a moving snapshot labels linkage incomplete rather than mixing current branch facts with an older negative. Later changes after that final observation are the usual point-in-time read limit, not a transactional forge guarantee.
    Cache storage: one versioned local derived namespace under common-Git-dir/aida-cache/show-negative-v1, never aida-store or tracked .aida/config.toml. Bounded owned regular-file reads, no-follow, strict schema/query/context identity and size limits; atomic replace under a nonblocking local cache lock. Contention skips cache publication. No store writer/dispenser/policy locks and no maintenance service; corrupt/over-limit state degrades to bounded uncached work. Losing it changes speed/completeness, never canonical spec content.

    Enumeration repair
    Add a deadline-aware visitor used by scan_trace_graph_bounded; keep the existing unbounded collect_source_files wrapper for unrelated callers. Avoid first collecting an unbounded Vec. Check the SAME deadline before opening a directory, between entries, before descending/opening a file and between bounded read/parse chunks. Compile regexes once per process. Track canonical directory/device+inode ancestry so symlink cycles stop. Preserve in-root symlink aliases and their displayed relative paths; a cycle/external or unresolved link/read refusal makes completeness false, rather than claiming a complete empty file set. Preserve hidden/target/node_modules/vendor exclusions. Deduplicate final file/symbol pairs as today. Do not silently widen scanning into another repo. Return partial hits and false on any unfinished traversal.

    The~400ms remainder / exact files
    lib_part1.rs::run/main_entry, external_cmd.rs::maybe_dispatch/shadowed_names, command_registry.rs::built_command/try_parse_from: build the pristine clap tree once per invocation, derive builtin names once, and pass the SAME names/tree through alias/extension guarding and parsing (clone pristine tree only for the existing capability reparse). Today maybe_dispatch unconditionally builds a tree for names and parsing builds it again; human alias expansion can build another. Preserve real-command precedence and agent/human alias rules. This is a concrete redundant-work removal, not a measured claim that all400ms is clap.
    Add narrow existing phase observations for argv/tree/dispatch/discovery, backend open, notice/identity, relationships/render, and parallel linkage.log/enumeration/content; retain aggregate phase meanings, with overlap explicitly documented. Inspect repeated CachedGitBackend::current_head_sha/tolerant-read and report_cmd::maybe_print_upstream_recheck_notice calls using those measurements. Do not memoize store HEAD across concurrent writes or skip freshness/security checks. If one-tree plus negative proof plus bounded traversal still misses1000ms, stop with the measured remaining mechanism; no acceptance waiver.
    Likely source files: trace.rs plus a narrowly scoped negative-proof helper module; requirements_cli.rs; command_registry.rs/user_alias.rs/external_cmd.rs/lib_part1.rs; phase helper use in usage.rs only if needed. No transport/store writer or authority code. Document cold/incomplete behavior in existing show docs.

    Named decisive tests / slices
    1. `show_builds_one_pristine_tree_and_preserves_dispatch` (builtin/alias/extension shadowing + capability reparse); `show_phase_accounting_preserves_aggregate_semantics`. First slice pins stages and removes duplicate trees, no standalone completion claim.
    2. `negative_proof_requires_every_parent_closed`; `cold_batches_resume_without_false_complete`; `warm_negative_skips_all_ref_history`; `new_ref_and_detached_other_worktree_head_break_coverage`; `rewind_and_deleted_ref_reuse_only_negative_cones`; `positive_hit_uses_original_date_order`; `bare_mention_and_case_filter_match_existing_git`; `moving_refs_retry_once_then_unknown`; `shallow_graft_replace_and_config_change_disable_reuse`; `missing_object_or_truncated_batch_never_certifies`; `cache_lock_corruption_and_size_limit_degrade`. Use actual temporary Git DAGs, including code commits reachable from both store/code roots, annotated tags, merges, detached HEADs and multiple aliases. Structural Git shim counts/adversarial barriers prove avoided work and races; child watchdog bounds failures. No tight unexplained timing assertion. Slice2 adds the negative algorithm and these tests; compare cold unknown vs warm complete explicitly.
    3. `trace_deadline_expires_during_enumeration`; `trace_symlink_cycle_and_alias_preserve_truth`; `trace_partial_read_is_incomplete`, with injected iterator/clock and actual child-cycle fixture. Preserve existing bug_1993_show_deadline_tests, bug_1993_show_phase_timings and bug_1674_show_bounded_under_writer coverage. Slice3 integrates traversal, all show formats, documentation and measured whole-command acceptance. One targeted regression run plus check-ci-fast per scope; touched/compile only per signed acceptance, no broad Cargo.

    Before signoff / completion limits
    Advisor must rule on cold resumable unknown behavior and the proposed local derived cache namespace, and on use of the existing1000ms objective for foreground scheduling (no guard configuration change). Positive fallback and unsupported-history cases remain truthful but are not a promise of complete linkage in1000ms. Implementation must demonstrate the reproduced default live shape under1000ms after the fix on pinned matching artifacts, report cold/warm and load separately, and gather fresh unchanged-lineage guard evidence; old24h samples stay intact. These are acceptance gates, not findings waived by this sketch. No implementation, claim, telemetry/grant modification or live operation performed. Newly routed PR2919 review has priority.
