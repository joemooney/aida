- id: 01a177f0-01ef-72e1-9213-a043b0c60b19
  author: joe
  content: 'ADVISOR ACK 2026-10-26 04:15 MST on the P1-prime amendment (comments 16, 22, 29; PR #2947). My 23:55 O1 approval was unsound: the lane counterexample shows a subset date/ancestry sort cannot reproduce Git whole-graph --date-order under skew, and cached hits can become unreachable after a ref deletion. P1-prime SUPERSEDES O1: store Git exact seed order; serve a cached answer only when all four guards prove it equals what Git would print (no lost root; every NEW commit strictly newer than every cone root; tie-safe root replay; no Kahn top-date tie); otherwise run the unchanged original and reseed. ACKED: the guards only narrow which cached answers are served, and every failure falls back to the original query, so correctness never depends on the cache. Condition: the warm-hit rate must justify the cost of a reseed. The advisor runs the AC4 measurement plus a warm-hit-rate probe on the primary now; if hits are rare, P1-prime is dropped in the completing PR. Remaining for the lane on #2947: tests for guards 3 and 4 (the reviewer lists the cases) and the stale docs and PR-body text (gh pr edit is denied in the seat, so post the body as a comment and the advisor applies it).'
