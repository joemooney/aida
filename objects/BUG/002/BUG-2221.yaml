  author: joe
  content: |-
    ADVISOR RULING 2026-10-26 04:38 MST (BUG-2221 positive path, round 3). Evidence on PR #2947: positive shows at ~1.0-1.7 s with and without P1/P2 at load 12-25, and the P1-prime warm-hit rate is ~0 under fleet ref churn (no positive key ever seeded across 5 consecutive shows). P1-prime is DROPPED (#2947 closed; WIP on bug-2221-p1-wip-salvage). P2 (#2945) stays neutral; it is removed in the completing PR unless the final measurement shows benefit.
    NEXT LANE = DIAGNOSE + SKETCH v3, no code:
    1. Consumers of order: find every consumer of the positive linkage commit order (show JSON/human renderers, review surfaces, ship/completion logic, MCP). If nothing beyond human display depends on exact git --date-order, say so with file:line evidence; O2 (committer-date order with a documented tie-break) then becomes acceptable and the 23:55 O2 rejection is withdrawn.
    2. Design: an incremental, append-only spec-id -> commit index in the git common dir, updated by walking only commits not yet indexed (new tips since the last indexed set), so ref churn does not invalidate it. Per-hit reachability via merge-base --is-ancestor against current refs, or a single rev-list --no-walk check. Fail closed to the original query on any doubt, as today.
    3. Estimate the cost per show (index update when N new commits arrived, plus K hits checked) against the 1000 ms budget at load ~10, using real numbers from this host (run timings on the primary or in a full clone; a seat clone refuses host git).
    Post SKETCH v3 on BUG-2221, mail advisor, and stop for signoff.
