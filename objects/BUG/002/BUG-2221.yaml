- id: 01a17708-bd35-72f3-9f73-90f13028db0b
  author: joe
  content: |-
    P2 implemented: PR #2945 (bad99b1026, Refs BUG-2221). The in-flight branch search moves unchanged into linkage_branch.rs, with a name-matched merge-base --is-ancestor fast path in front of it. A hit equals the --contains scan; a miss falls through to the scan within the same 2 s budget. Equivalence tests: branch-crossing, stacked sibling, local+remote same tip, orphan store, commit cap. NOT run locally: this seat's sandbox cannot write the cargo slot lock dir (/run/user/1000/cargo-slots-1000), so cargo queues forever, and I did not use the slot bypass. CI is the first compile.
    P1 HELD, needs a ruling. (1) O1 is not exact. --date-order is Kahn's algorithm over the WHOLE --all graph, and grep filters its output, so a skewed non-hit child reorders unrelated hits. Counterexample: base(100)-A(1000,hit)-C(10,non-hit,tip x) and base-B(500,hit,tip y). Git outputs B,A; the O1 subset sort gives A,B. (2) A cached hit can stop being reachable when a ref is deleted (merged branches, pruned origin/*). The CLOSED set keeps no internal edges, so the warm walk cannot tell. A P1' amendment is in docs/plans/2026-10-25-bug-2221-positive-path-sketch.md: store Git's exact seed order; answer only when no old root was lost and every new commit has ct > max old-root ct, with tie checks; otherwise run the original and reseed. Risk: the ref churn here may make the warm-hit rate too low. I propose measuring that first.
