title: A merged PR whose trailer names a needs-attention spec does not complete it, so the spec stays needs-attention after its work ships
description: 'Observed 2026-10-14: BUG-1994 stayed needs-attention after #2597 and #2618 (both with the BUG-1994 trailer) merged. The advisor had to go needs-attention -> in-progress -> done by hand. The refusal text says ''a merged PR referencing this spec completes it via aida pull'', but that did not happen. Either completion should apply to needs-attention specs, or pull should surface ''merged work for a needs-attention spec'' for triage.'
