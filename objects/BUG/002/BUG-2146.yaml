title: A malformed agents.toml silently disables containment (load_agents_contained(..).unwrap_or(false))
description: 'From the #2655 review: drain_contained and queue work use load_agents_contained(..).unwrap_or(false), so a parse error in agents.toml turns containment OFF silently — fail-open. Fix: a parse error is a hard error (refuse to launch) naming the file; test with a malformed file.'
