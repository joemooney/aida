- id: 01a158c4-3e7c-78c3-b43b-2fc0c6c2db46
  author: joe
  content: |-
    SKETCH (implementer, per the advisor brief 02:58): add aida_core::git_ops::remote_credentials as the one credential gate.
    - configure_remote_credentials(cmd, dir, remote): for each stored remote.<r>.url/pushurl carrying userinfo, add a per-invocation url.<clean>.insteadOf=<credentialed> override through GIT_CONFIG_* env, never argv. The embedded token feeds a host-scoped env-backed credential.helper. Stored config is never modified.
    - configure_remote_credentials_with(..., url_hint, fallback): the same, plus the URL-hint and fallback hooks.
    - host_remote_git_command(dir, remote) = host_git_command + configure.
    The GitLab glab/env token fallback depends on cli-lib forge code, so it stays in cli-lib: gitlab_project_create::configure_git_remote_credentials becomes a thin wrapper passing that fallback closure. Its behaviour is unchanged.
    Every host network call (fetch/pull/push/ls-remote against a named remote) applies the core helper to the builder it already uses. That keeps seat-clone refusal and hardening semantics as they are, adds no GitLab fallback to sites that never had one, and adds one 'git config --get-regexp' spawn per remote call. The PR body lists the sites, each marked routed or out of scope.
