title: Remote calls outside the mirror path still put an operator-embedded HTTP token in git-remote-http argv
description: 'Follow-up from the PR #2736 round-2 review (BUG-2119). BUG-2119 routes the mirror/hub remote calls in remote_create.rs and gitlab_project_create.rs through configure_git_remote_credentials. Other host remote calls still hand git-remote-http the stored origin URL, so an operator-embedded oauth2:<token>@ on origin still shows up in ps / /proc/<pid>/cmdline. Sites: store_push_pull.rs:79/93/593/1485/2529 (fetch, ls-remote, push origin), store_sync.rs:1157 (git_ops::remote_branch_head_sha origin), plus the ls-remote calls in doctor_cmd.rs, pr_cmd.rs, pr_lookup.rs, session_start.rs and phase_driver.rs. Fix: route these through configure_git_remote_credentials, or move the helper into aida_core::git_ops so every host remote call gets it.'
