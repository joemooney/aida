title: 'Refs-only slice PRs cannot get a reviewer: auto-queue-review skips them and the BUG-2150 fallback bails ambiguous'
description: 'PR-2826 (TASK-1955 slice 7, commits ''(Refs TASK-1955)''): ''aida pr auto-queue-review'' files nothing (review_gates.rs:1076-1099 counts delivered IDs only, BUG-85/BUG-776). ''aida queue work PR-N --role reviewer'' then relies on the BUG-2150 fallback resolve_pr_to_spec, which sees referenced TASK-1955 plus BUG-2130 (a commit headline mentions a spec already superseded into TASK-1955) and bails ambiguous, silently. So no CLI path queues a review for a multi-PR sweep''s intermediate slice. Fix: (1) auto-queue-review files a review story for Refs-only PRs that covers the referenced spec (never completing it). (2) reduce_to_most_specific_specs drops a referenced spec superseded by another candidate. (3) The BUG-2150 fallback surfaces its resolve error instead of the generic ''no queued review story''. Workaround used: a hand-filed ''Review PR-2826:'' story with covers -> TASK-1955 (STORY-1891).'
