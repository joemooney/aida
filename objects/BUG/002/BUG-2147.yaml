  content: 'ADVISOR RULING (05:05): CLOSED as a race, not a defect. Per the fixer''s evidence on #2656, the hold was cleared at 06:24:41Z and the approval was recorded at 06:24:43Z, so ''NOT met'' was correct when it printed. The existing test refusal_hold_releases_only_on_a_fresh_verdict_at_the_current_head covers this. Process fix: record the approval BEFORE asking for the clear.'
