  author: joe
  content: 'Fixer investigation (fixer-bug-2147): premise not reproduced — the substrate timeline shows the clear ran BEFORE the approval existed, so ''NOT met'' was correct at that instant. Evidence: .aida/merge-hold-clearances/PR-2656.json cleared_at 06:24:39.79Z; events.jsonl MergeHoldChanged placed=false 06:24:41.40Z; ReviewVerdictRecorded APPROVED at cdc443a02b 06:24:43.17Z; archive .aida/review-verdicts/PR-2656/cdc443a0...json recorded_at 06:24:43.15Z. The clear path (merge_hold_cmd.rs -> pr_cmd::ship_refusal_release -> merge_hold::refusal_release) reads the live verdict file and its per-sha archive under keys [verdict_ref.key, PR-N]; no cache or store ledger is involved. Record-then-release at the head is already covered by merge_hold.rs test refusal_hold_releases_only_on_a_fresh_verdict_at_the_current_head. No code change made. Fork for advisor: (a) reject/close as not-a-bug (operator/advisor race), or (b) re-scope to a UX change, e.g. the override warning printing the verdict file''s recorded_at and suggesting re-running clear after the review is recorded. Gate semantics unchanged either way.'
