title: aida agent stop and session end's leaked-process kill signal by pid-alive only, with no start-time identity check (pid-reuse kill risk)
description: 'From the #2653 (TASK-1750/TASK-1768) rework: aida agent stop and session end''s terminate_pids_with_grace check only that the pid is alive before signalling, never the recorded start-time identity. After the original process exits, a reused pid belonging to an unrelated process can be SIGTERM''d/SIGKILL''d. Pre-existing (not introduced by #2653). Fix: record identity where these pids are captured (if not already) and gate the signal on liveness::process_identity_matches_strict (from #2653); Unknown => do not signal, report. Tests with a reused/mismatched identity.'
