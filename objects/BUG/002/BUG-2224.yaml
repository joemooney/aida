title: 'session end / review-watch: seat clone''s copied local tags count as ''work origin does not have'', so every finished lane blocks its own reviewer launch'
description: |-
  2026-10-25: aida review watch could not launch reviewers for PR-2927 (TASK-2348) and PR-2928 (BUG-2221): queue work tried to end the finished implementer's dead lease and got 'seat clone ... holds work origin does not have:' followed by an EMPTY list. Investigation: the seat clone carried 55 local tags (slice-*-r*, gl-v-check-*, wip/*) copied from the primary checkout; none are on origin, all are present in the primary, the worktree was clean and the branch fully pushed. session end --force then 'salvaged' a patch.
  Impact: every finished lane blocks its own automatic review until someone force-ends it by hand.
  Acceptance: the unpushed-work probe ignores refs that are also present in the primary repository (or that were inherited at clone time), and the refusal message lists the refs it counts. A clean, fully pushed seat ends without --force.
