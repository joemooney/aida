title: cargo ps --capacity reports 'slots busy' when CPU pressure is the real denial reason
description: |
  `cargo ps --capacity` (~/ai/aida-host/bin/cargo-log, capacity()) admits a workload only if `busy < slots and cpu < cpu_max`. When the slot condition holds but CPU PSI is >= cpu_max (40), it falls through to the else branch and reports `admit 0: slots busy`. On 2026-10-13 at 21:58 this read `admit 0: slots busy   slots 1/2 busy ... cpu 73%`. relay.sh surfaced it as "waiting on: host busy: slots busy", which sent the operator looking at slots when CPU pressure was the real gate.

  Expected: separate reasons. "cpu pressure" when busy < slots but cpu >= cpu_max; "slots busy" only when busy >= slots. The JSON output carries the same reason.
  Acceptance: a test with the PSI seam (AIDA_CARGO_PSI_DIR) at cpu 73 and 1/2 slots prints "cpu pressure"; at 2/2 slots and low cpu it prints "slots busy".
