title: 'Flaky: story_1661 history-indexer fixture git commit races auto-maintenance (unable to create temporary file)'
description: |
  CI run 39537482996 (PR #2735, lib-0 shard) failed history_views::tests::index_answers_the_whole_window_past_the_walk_cap. The panic was at aida-cli-lib/src/tests/story_1661_history_indexer_tests.rs:50, the Fixture::git assert: `git ["-c","commit.gpgsign=false","commit","-q","-m","fixture update"]: error: unable to create temporary file: No such file or directory / fatal: failed to write commit object`.

  This is the BUG-2191 mechanism: since git 2.54, detached auto-maintenance runs `repack -d` and prunes loose-object fanout dirs while a fixture commit is writing. The story_1661 Fixture::git spawns /usr/bin/git without `-c maintenance.auto=false -c gc.auto=0`. BUG-2191 / PR #2779 left this file to drain through the ratchet; it is in scripts/git-maintenance-baseline.txt as `1 aida-cli-lib/src/tests/story_1661_history_indexer_tests.rs`. It has now flaked, which by the BUG-2191 signoff (rule 3) makes it a must-migrate file.

  The failure is not caused by PR #2735: that PR does not touch history code or this file, and the file is byte-identical on origin/main. Local evidence: `cargo test --profile agent -p aida-cli-lib --lib index_answers_the_whole_window_past_the_walk_cap` passed 3/3 on the PR head (8095b03e6c-based merge) and 3/3 on an origin/main 88430e08c6 snapshot. So it is a load-dependent flake that shows up only under CI parallelism.

  Acceptance: route Fixture::git in story_1661_history_indexer_tests.rs through the crate's test_git helper (or add the -c pair); drop the file's baseline entry to 0; the ratchet passes.
