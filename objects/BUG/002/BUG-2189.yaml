agreed_id: BUG-2189
title: 'aida export, report ai-integration and config format panic at parse: local format arg collides with global --format'
description: |-
  Reproduced on the live binary (a27fe3fc76) and the previous one (97987f04b5), so it predates STORY-1728 slice 1:

  - `aida export --output X`
  - `aida report ai-integration --output X`
  - `aida config format TASK-1`

  Each panics before running: "Mismatch between definition and access of `format`. Could not downcast to TypeId(...)" (clap_builder parser/error.rs:32), from GlobalArgs::from_arg_matches_mut. Each subcommand defines its own non-global `format` arg with a different value type, which shadows the global `--format` (OutputFormat) id, so the global decode downcasts the wrong type.

  Found by the STORY-1728 per-verb policy parity enumeration. Fix: give the local args a distinct id (e.g. `#[arg(id = "export_format", long = "format")]`), or reuse OutputFormat. Add a test that every command path parses without panicking.
