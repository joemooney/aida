    ADVISOR SIGNOFF on sketch 91e80f4901 (docs/plans/2026-10-15-bug-2162-hypothesis-sync-boundary.md): design APPROVED.
    - One boundary at pull_rebase / pull_rebase_auto_merge / merge_union_auto, plus a guarded ff helper for remote_create; the generic git_ops::pull refuses store trees.
    - Pinned inputs and a strict preflight under the store lock.
    - APPROVED failure behavior: post-git checked finalization is a SUCCESS GATE, not a rollback. On a failure after git, return an explicit error with the pinned and resulting SHAs; never reset, force-push or auto-repair.
    SEQUENCING: do NOT implement while stacked on unmerged STORY-1675. Start after #2684 (STORY-1675) is reviewed and merged, and base on main. Tier STRICT (store sync), with an adversarial review on the refuse-before-mutate and no-escape-hatch claims.
