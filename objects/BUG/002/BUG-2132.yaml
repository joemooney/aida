title: 'Mailbox accepts junk recipient ids: ~8h ago a sender''s word-split args created mailboxes like ''-include'', ''33492'', ''BUG-52'', ''L4425'', ''SPEC'', each holding ~18 unread (5 urgent) messages'
description: 'Seen in ''aida mailbox list'' on 2026-10-14 ~17:15. Recipient ids that look like spec IDs, line refs (L4425), bare numbers or flags (''-include'') were accepted as agents, so the messages went nowhere. Likely a shell word-split of an unquoted --to/body in a script or hook. Fix: validate recipients against known agent ids/seats (or require --create-recipient) and reject ids starting with ''-''. Clean-up: archive the junk mailboxes after identifying the sender (read one message to find it).'
