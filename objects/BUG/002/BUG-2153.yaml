  content: 'ADVISOR VERDICT: CHANGES REQUESTED, aida-relay PR #93 round 1 at b6587fd788. The scrub is complete on all 3 launch sites and the tests fail without the fix. BLOCKING (incomplete-fix): in bin/relay.sh ~L3329-3343 the advisor-handoff guard keys on the LAUNCHING shell''s role. After the scrub, sessions are not advisor, so a no-role or implementer session can overwrite and archive the advisor''s next-session handoff (BUG-77 regression). Key the guard on SESSION_ROLE==advisor (requires --force-seat), update unattended-runs.md, add a test. Non-blocking: scrub the relay_usage.rs:356 probe env, and document the dual meaning of --force-seat. A fixer is dispatched. (Recorded as a comment: aida review record cannot bind a cross-repo PR.)'
