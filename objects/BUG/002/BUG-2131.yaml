title: 'Store host-git: refuse store writes on git < 2.40, where GIT_ATTR_SOURCE is ignored and store .gitattributes can select host filter/textconv drivers'
description: 'From the STRICT review of #2541 (BUG-1929). store_hooks.rs:183 neutralises the store''s .gitattributes via GIT_ATTR_SOURCE=<empty tree>, which needs git >= 2.40. On older git, a contained session can plant .gitattributes that selects a filter/textconv driver from the host''s git config, and that driver runs on the host during store git operations. Fix: detect the git version once and refuse (or fall back to read-only) store writes below 2.40, with a clear message. Acceptance: a unit test of the version gate; a doc note in the contained-session docs.'
status: Completed
priority: Medium
owner: ''
feature: Uncategorized
