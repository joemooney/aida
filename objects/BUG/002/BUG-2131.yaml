comments:
- id: 01a13e93-458e-70b1-8e01-b0d99a0710b2
  author: joe
  content: 'ADVISOR RULING (2026-10-15 01:00) on #2663''s choice: refusing reads as well as writes is right, but refusing for EVERYONE on git<2.40 locks Debian bookworm/Ubuntu 22.04 users out of AIDA, which is disproportionate. The threat requires an untrusted (contained) writer of the store. Scope: the <2.40 refusal applies when contained sessions are enabled for the project ([agents] contained = true, AIDA_CONTAINED, or any contained session lease/marker present). Otherwise, on old git, emit a one-time warning that contained mode will be unavailable until git>=2.40. Enabling contained mode or launching a contained session on git<2.40 must itself refuse, fail closed, with the upgrade message. Unparseable version => treat as old. Tests: old git + uncontained project = works with a warning; old git + contained enabled = refuses; contained launch on old git = refuses.'
