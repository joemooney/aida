  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: Acceptance asks for a working in-place relaunch into the orphaned seat, but no such path exists today, so fixing the messages alone cannot satisfy it. Evidence: (1) queue_cmd.rs conflict loop (~L12107-12325) bails on EVERY existing same-scope lease even with --resume: the DormantDirty+--resume branch says ''re-run with --resume <uuid>'', which bails the same way, and the Live/StaleDirty hints claim ''--resume re-attaches in place'', which no code does. (2) The only re-entry path is session_start.rs reuse_existing_worktree_path (~L1822), which needs --path + --force-claim + a REGISTERED git worktree. The orphaned seats (aida-worktrees/aida-seat-aida-*) are contained private CLONES (TASK-2053), and session_start.rs ~L2135 explicitly refuses ''contained seat ... cannot re-enter an existing --path yet''. (3) resolve_queue_work_launch (session_misc.rs ~L1786) runs before the conflict loop and knows nothing about the lease. Choices: (A) adopt the orphaned lease in place: in the conflict loop, when --resume is passed and the lease is dormant/stale with its tree present, keep the lease+tree+branch, rewrite its pids, skip session_start, and launch there, cold with a freshly minted id when no claude session is recorded. Note session_start''s status bump, claim ledger, and BUG-2169 contained-seat setup would need to be re-run or factored out. (B) teach session_start to re-enter an existing contained clone (lift the L2135 refusal, extend reuse_existing_worktree_path to clones and their pins/cleanup guards), then have --resume release only the orphaned lease FILE and call session_start with path=orphan tree and branch=orphan branch. (C) messages only: stop the two errors pointing at each other and name the manual workaround. Cheap, but fails the ''working in-place relaunch'' acceptance. A or B changes the lease/containment lifecycle (architecture, which needs a sketch + advisor signoff per CLAUDE.md).. No triage reason was given.'
