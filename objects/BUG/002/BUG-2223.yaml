  author: joe
  content: |-
    ADVISOR RULING 2026-10-25 14:10 MST — design fork: OPTION B SIGNED (sketch signoff).
    session start gains the ability to re-enter an EXISTING seat clone at an orphaned lease's recorded path (the case session_start.rs:2135 refuses today), and queue work --resume with no recorded claude session cold-starts a new session in that clone on its existing branch. Bindings:
    1. Only for a lease that is genuinely orphaned (dead process, same scope); a live lease still refuses. The clone must be the one the lease records (path + branch match), else refuse.
    2. Never reset, re-clone over, or discard the clone's commits/uncommitted work; re-entry is adopt-in-place. Reuse the existing status/claim/registration steps so the re-entered session is indistinguishable from a fresh one in aida ps.
    3. The no-recorded-session check must know about the orphaned lease, so the two errors never point at each other; every hint names a command that works.
    4. Include the codex containment message fix in the same PR: when the default headless vendor cannot run contained, name AIDA_HEADLESS_VENDOR/--vendor claude in the first line (message only, no default change).
    5. Tests: orphaned clone with uncommitted work -> --resume relaunches in place, work intact; live lease -> refused; mismatched path -> refused.
    Gate LIGHT (targeted cargo + check-ci-fast; check-ci-compile if >10 files). trace:BUG-2223.
