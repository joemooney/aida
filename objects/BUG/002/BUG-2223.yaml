title: 'queue work: orphaned-lease recovery loops between --resume and --fresh when the dead worker left no recorded claude session'
description: |-
  Repro (2026-10-25, scopes TASK-2346 and BUG-2221; dead headless workers with orphaned leases 01a173be / 01a173f6, worktrees under aida-worktrees/aida-seat-aida-*):
  1. `aida queue work TASK-2346 --role implementer --no-human` -> error: lease looks orphaned ... resume into this worktree: `aida queue work TASK-2346 --resume`.
  2. `aida queue work TASK-2346 --resume ...` -> error: no recorded claude session for scope to resume — drop --resume (or pass --fresh).
  3. `--fresh --dry-run` plans a NEW worktree aida-worktrees/aida-task-2346 on branch task-2346-2, abandoning the orphaned worktree and the open PR's branch.
  No path re-launches a worker in the existing orphaned worktree. Workaround: trust the worktree and run `claude --bg` inside it.
  Also: with the advisor seat left at a codex default, every headless launch failed with the containment-vendor error ('codex vendor cannot run a contained session'); consider defaulting contained headless launches to a vendor that supports containment or naming AIDA_HEADLESS_VENDOR in the first line.
  Acceptance: when the lease is orphaned and no claude session is recorded, the hint offers a working in-place relaunch (e.g. --resume falls back to a cold launch in the orphaned worktree on its existing branch), and the two error messages never point at each other.
