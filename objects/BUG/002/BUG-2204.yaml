title: Relay seat misses advisor mail sent to its role inbox and halts claiming a PR is approved without checking the verdict
description: 'Seen 2026-10-21 on relay 20261020-063739-codex-task-1981. The codex relay reads only the ''joe'' mailbox identity. The advisor''s 06:05 change request for PR-2796 was sent ''--to implementer'' (thread d7b5f068) and was never seen. The relay then halted at 07:02 with BLOCKED_ON_HUMAN ''PR #2796 is green and approved-ready'', but .aida/review-verdicts/PR-2796.json said request-changes. Acceptance: (1) a relay seat receives mail addressed to its role (implementer) as well as its user identity, or ''aida mailbox send'' warns when the recipient has no reader; (2) a relay never reports a PR approved without reading the recorded verdict for the current head.'
