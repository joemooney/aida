title: Two concurrent merge trains can carry the same PR
description: 'Found reading pr_train.rs (2026-10-23): the merge lease serializes landings, but nothing stops a second aida pr train from building a train PR that includes a PR already riding another live train. That wastes CI and can confuse who landed a PR. ACCEPTANCE: a PR in a live train (an open train PR or a held train lease) is refused by a second train with a message naming the other train; a stale entry (train PR closed or lease expired) does not block. Tests.'
