title: Attested reviewer cannot record a verdict in a non-AIDA-repo project (aida-relay)
description: '''aida queue work PR-96 --role reviewer --no-human --vendor claude'', run in /home/joe/ai/aida-relay on 2026-10-16 17:09, ran for 17 min and exited 30 with no verdict file. Inside the session, Write to .aida/review-verdicts/PR-96.json was refused, the aida CLI (review claim/record) was refused, and GitHub access was blocked; the run logged 12 permission denials. The same command works in the aida repo, so the reviewer''s tool and permission grant (settings/sandbox profile) is probably not installed or synced for other projects. Acceptance: the attested reviewer records a verdict in an aida-init''d project other than aida itself, or refuses up front with a named fix instead of spending a full review run.'
