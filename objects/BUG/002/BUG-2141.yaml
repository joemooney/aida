title: ensure_aida_runtime_excluded writes an unanchored '.aida/' into the shared info/exclude, silently ignoring tracked .aida/discipline and template masters in every worktree
description: 'Found in the #2648 (STORY-1692) review. ensure_aida_runtime_excluded (aida-core/src/git_ops.rs ~91-102) appends ''.aida/'' to the path from ''git rev-parse --git-path info/exclude''. Its doc comment calls that file worktree-local, but it is the ONE file shared by every worktree. The pattern has no leading slash, so it matches every directory named .aida, including aida-core/templates/.aida/, and it shadows .gitignore''s !.aida/discipline/** and !.aida/config.toml. Effect: ''git add'' silently skips new template masters (aida-core/templates/.aida/discipline/fire-mode.md was left out of #2648), and the pre-commit ignored-file check (check-ignore --no-index) refuses tracked discipline files, pushing implementers to AIDA_ALLOW_INTERMEDIATE=1, which skips every later hook gate. Fix: write an anchored, narrow pattern (/.aida/* plus the re-includes, or only the runtime subpaths), migrate existing unanchored entries in place, and fix the doc comment. Tests: a new file under aida-core/templates/.aida/ and under .aida/discipline is addable; runtime .aida files stay ignored. Likely a regression of BUG-914.'
