title: 'Contained implementer seats cannot run git in their own worktree: write roots omit the worktree''s gitdir and the common dir, so commit/fetch/merge fail with Read-only file system'
description: 'Seen 2026-10-16 00:49-01:17 with every ''aida agent new claude --bg --role implementer'' seat launched from a contained advisor relay (AIDA_CONTAINED). contained_boundary::contained_write_roots(worktree) returns only the worktree path. A linked worktree''s gitdir (/home/joe/ai/aida/.git/worktrees/<name>: index.lock, HEAD, ORIG_HEAD) and the common dir (objects, refs, FETCH_HEAD, packed-refs) are outside it, so ''git commit'', ''git fetch'', ''git checkout <branch>'' and ''git merge'' all fail with ''Read-only file system''. dangerouslyDisableSandbox is disabled in these seats. Workarounds observed: one seat cloned into $TMPDIR with --reference and pushed from there, which the classifier allowed once and denied once. That means a full cold cargo build per clone. Effect: the contained implementer lane cannot do its basic job (commit, push, merge-up). Fix: add the worktree''s resolved gitdir plus the common dir''s objects/, refs/, logs/, FETCH_HEAD, packed-refs and the worktree''s own config to the contained write roots, or run git through an uncontained AIDA helper verb (''aida git commit/push/merge-up'' executed by the host). Keep config/hooks of the common dir read-only, since that is the containment boundary that matters. Test: a contained seat in a pool worktree can commit, fetch, merge origin/main and push, and cannot write .git/hooks or .git/config.'
