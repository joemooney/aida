  author: joe
  content: |-
    Cross-ref from aida-host TASK-3 (TASK-JM-001, closed in favor of this upstream bug):

    Root cause: .git/hooks/pre-push invokes `aida remote mirror-push` during git's pre-push phase — *before* git transmits objects/refs to `origin`. When `aida remote mirror-push` checks whether the branch is confirmed on `origin` (or when pushing a new branch / new commit), `origin` has not received the push yet, so it prints:
      [aida mirror] <branch> not confirmed on origin — skipped

    Suggested fixes:
    1. Read the pre-push stdin lines (`<local ref> <local sha> <remote ref> <remote sha>`) or pass the ref/oid being pushed so mirror-push knows what is in flight, OR
    2. Spawn a detached background helper that waits briefly for `git push` to finish confirming on `origin` before pushing to the mirror remote, OR
    3. Only mirror refs already at `refs/remotes/origin/*` without warning on the in-flight branch.
