title: mirror-push reports 'branch not confirmed on origin — skipped' immediately after a successful push
description: 'Observed 2026-10-14 by the BUG-1953 fixer: after pushing bug-1953 and opening #2643, the mirror push skipped with ''not confirmed on origin'', although the PR existed on GitHub. This is likely a race or a stale remote-ref check. The mirror may drift until the next sync.'
