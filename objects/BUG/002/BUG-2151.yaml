title: aida agent new ignores a contained parent (AIDA_CONTAINED) and treats --bg as an explicit posture, launching children uncontained
description: 'From the #2665 final STRICT review (pre-existing; not introduced by #2665): (1) lib_part2.rs:713 checks only the [agents] contained knob, never aida_contained_env(); with AIDA_CONTAINED=1 and the knob off, agent new launches codex, agy and claude uncontained (claude without its sandbox --settings), and agent_launch.rs:4403 strips AIDA_CONTAINED from the child; AIDA_CONTAINED=ture also launches, so the new hard error is bypassed on this path. (2) agent_launch.rs:1940 treats --bg as an explicit posture, so ''agent new claude --bg'' with contained=true launches with bypassPermissions. RULING (BUG-2133, monotonic): a contained parent''s env ALWAYS wins and no flag can override it; parse AIDA_CONTAINED with the same strict parser here; only real posture flags typed by an operator (--bypass-sandbox, --permission-mode) may override the CONFIG knob, never the env; --bg is not a posture flag. STRICT + functional.'
