title: 'Store-commit hook hardening follow-ups: skip commit-config sourcing for any store toplevel; prepare-commit-msg can forge an Aida-Store trailer'
description: |-
  Residuals from the round-6 advisor review of PR #2541 (BUG-1929), c448e8e5e7. Both MINOR.

  (i) aida-commit-msg skips sourcing .aida/commit-config only when AIDA_STORE_WRITE_GUARD is set or the branch is aida-store. A hand git commit on a detached store HEAD still sources the sandbox-writable file. The allowlist does not run on that path. Skip the source whenever the hook's toplevel is a store tree (the .aida-store root, or the git dir differs from the common dir and the toplevel is the store worktree).

  (ii) prepare-commit-msg (aida-store-pair) can pick a planted nested .aida-store/.git inside the store and run git -C <planted> rev-parse HEAD. That executes nothing, but it lets the sandbox forge an Aida-Store: trailer on a store commit. Resolve the store only from host-owned data.

  ## Acceptance
  - A hand commit on a detached store HEAD with a planted commit-config does not source it (test).
  - A planted nested .aida-store/.git does not influence the Aida-Store trailer (test).
