- id: 01a16f04-7118-73e2-b202-f695dcdfafe9
  author: codex
  content: |
    SKETCH v2 (BUG-2017)

    Problem and revised scope
    This replaces SKETCH v1's signed-grant proposal, following the advisor's CHANGES REQUESTED comment. The actual topology is one WORK clone, an operator-controlled GitLab hub, and one authoritative HOME clone whose store can reach public GitHub. Reuse existing <TYPE>-<node>-<n> IDs and home-side canonical renumbering, as in TASK-1-488 becoming TASK-1856. Work must never create or dispense bare global IDs. Signatures, key enrollment, offline grant envelopes, second-authority coordination, and rollback-threat handling are out of v1.

    Design
    1. One explicit local authority flag. Keep a small versioned allocation setting in the clone's common Git directory, shared by its linked worktrees: authoritative=true only on HOME. Missing means non-authoritative; malformed settings refuse allocation. Inspect/show reports the effective mode and source in human/JSON output. Read this local setting directly, never a requirement object, shared node registry claim, projected project policy, forge URL, user-global preference, or environment override. Ordinary Git clones do not inherit the flag. Enabling the transport profile does not confer authority. The operator explicitly marks the existing home clone once; this is a single-home operating model, not a new authority service.
    2. Work allocation uses the existing distributed dispenser and node-aware ID format. On WORK, force the effective allocation policy to node-aware-only regardless of tracked blocks-then-fallback configuration or cached global blocks. Disable implicit global block claims, and refuse explicit block/global-ID requests before advancing any counter, writing an object, or contacting a forge. A blocks-only request gets a clear refusal, not a bare-ID fallback. Existing imported canonical IDs can still be read and updated: updating an existing UUID is not permission to allocate a new global ID. New caller-supplied global spec_id/agreed_id values, bulk imports, and repair/regeneration paths receive the same admission check. Missing node binding or dispenser errors must refuse rather than fall back to internal global counters.
    3. Pseudonymous node binding. Use a fresh random UUID as the clone's binding; a parser-compatible opaque node token can use its 32-character simple UUID representation. Preserve that binding and the existing local per-type counters across linked worktrees. A newly initialized clone gets a fresh binding. Serialize only opaque identity/counter information needed for deduplication; no host, user, user_id, email, friendly host-derived name, or local path. Adapt the existing node representation so those legacy identifying fields are absent for pseudonymous bindings; do not fill them from USER, hostname(), git email, preferences, default_node_name, or automatic team/node registration. Any optional local human mapping stays local. Node/registry serialization and identifying provenance are covered by STORY-1742's refusal scanner, with no identity-field exemption. That guard remains the owner of outbound content sanitization; this bug does not introduce another policy engine.
    4. HOME owns global blocks and canonical numbering. Only the locally authoritative clone may claim/dispense global ranges or run the existing git_ops::merge_gate that assigns canonical agreed IDs. Apply the authority check in that core entry point as well as explicit and automatic callers. Work-to-hub transport remains ref-only and performs no renumbering. On HOME, preflight the incoming store, perform the existing serialized canonical promotion, and preserve each requirement UUID and its node-local/origin aliases so relationships, comments, traces, and old lookups continue to resolve. Repeat home sync is idempotent. An existing block merely present in an imported store does not authorize WORK to spend it.
    5. Reconciliation preflight. Before rebase/fast-forward/structural union can accept incoming allocation state, compare both candidates against their common baseline. Collect every conflicting global range/claim, node-token-to-UUID binding, duplicate binding, and display-ID-to-requirement-UUID assignment. Independently introduced duplicate block claims must refuse even when their serialized block keys happen to match; do not hide them by taking max(next). Repeated copies of the same established baseline/canonical registration are idempotent, not a new claim. Extend the existing union_block_registries/union_node_registries checks into a preflight shared by every reconcile/pull entry, not only Git's textual-conflict handler. Report all conflicts using opaque IDs, safe object locations and categories; never echo legacy host/user/email fields. Refuse before union or merged/local-store ref advancement, never pick a winner, auto-renumber a conflicting global claim, or rewrite published history. Read-only audit emits the same conflict set and a manual repair plan.

    Allocator inventory and enforcement seams
    - CLI ordinary add: aida-cli-lib/src/requirements_cli.rs currently has its own agreed-block dispense path and calls ensure_block_capacity. Gate both allocation choices, explicit IDs/prefix overrides, and the eventual backend write.
    - Node/bootstrap/manual blocks: node_cmd.rs, init_cmd.rs and db_block.rs, including handle_block_command, auto_allocate_initial_blocks[_with_scope], ensure_block_capacity, auto_allocate_block_inner and preclaim helpers. Doctor block/counter migrations in doctor_cmd.rs also write allocation state and must not mint global claims on WORK.
    - MCP: mcp.rs::tool_add_requirement uses RequirementsStore::add_requirement_with_id. Include finding/punt/review/schedule-derived filing helpers and all MCP tools that create specs, not just the tool named add_requirement.
    - Core/backend: models.rs ID generators, get_next_counter_for_prefix/get_next_global_number, prefix-change/duplicate-repair/legacy ID helpers, dispenser.rs and node.rs::BlockRegistry claim/dispense. In particular, existing model fallback-on-dispenser-error must not become a global-allocation bypass. Cover GitBackend::add_requirement, BulkWriter::add/finish collision reassignment, full save/update_atomically/import paths, CachedGitBackend delegation, Storage helper writers, and dispenser loading in rel_cards.rs. Enforce at both allocation and persistence boundaries so a bare backend/model caller without CLI setup cannot bypass the rule.
    - Other creation/import surfaces: doc/findings/report/schedule/regen/review/init scaffolding writers, core export/meta creation, and server REST/gRPC/skill-runner adapters reach these model/storage APIs. Verify each reaches the shared check; an unsupported writer must refuse rather than silently assume home authority. Independent centralized databases are outside this git-clone policy, but cannot be used to bypass it when saving into this distributed store.
    - Canonical assignment: core git_ops::merge_gate and explicit db merge-gate plus automatic post-pull callers in db_cmd.rs/store_push_pull.rs. Audit retirement/regeneration/repair writers too. Inventory is a call-site checklist to complete before implementation approval, not a claim that changing a CLI flag covers the backend.

    Files touched (proposed only)
    aida-core/src/node.rs, dispenser.rs, models.rs, db/git_backend.rs, db/cached_git_backend.rs, storage.rs, git_ops.rs; a small common-git-dir allocation-mode resolver; the CLI/MCP/bootstrap/block/doctor/merge-gate adapters listed above; focused tests and docs/cli/10-storage.md. Change server adapters only where they otherwise bypass shared enforcement. Reuse current store-writer then dispense-lock ordering. No code or project documentation files are changed by this sketch.

    Failure modes and tests
    Use isolated WORK/HUB/HOME stores with synthetic identities. The required end-to-end case: WORK files a generic defect through CLI and MCP, receives only BUG-<node>-<n>, exports through STORY-1742, and HOME alone canonically renumbers it; UUID and old-ID lookups survive a second sync. Test offline local allocation and concurrent linked-worktree writers; no global counters/blocks change on WORK. Test attempts through explicit global IDs, blocks-only policy, stale cached blocks, auto-claim, direct backend add, bulk collision retry, missing/failing dispenser, model fallback, and repair/import helpers. Assert refusal leaves counters/objects/refs unchanged. A shared store claiming authority, a forged shared setting, or an ordinary fresh clone of HOME must not set the local flag. Pseudonymous binding fixtures contain no host/user/email fields; STORY-1742 refuses synthetic identifying metadata without echoing it. Preflight fixtures contain multiple block/node/global-ID conflicts at once, including independently introduced equal block keys; report the full set without union/ref advancement. Established identical baseline records and repeated home promotion remain idempotent. Audit is read-only. No claim of protection against malicious raw Git or copied/rolled-back entire clone state; those are outside this v1 operating model.

    PR slicing
    1. Local allocation-mode setting, complete writer inventory, shared allocation/persistence admission checks, and CLI/MCP/backend refusal tests. Default non-authoritative mode produces existing node-local IDs; do not ship a flag that leaves global fallback paths open.
    2. UUID pseudonymous node binding, bootstrap/auto-claim/repair integration, core home-only canonical promotion, and WORK-to-HOME renumbering/alias fixtures.
    3. Shared reconciliation preflight and read-only audit, all-conflict fixtures, STORY-1742 scanner integration tests, and docs. First slices use (Refs BUG-2017); only the final acceptance-complete slice uses (BUG-2017).

    Open questions / spec alignment
    The current Draft description still requires signed grants and offline grant import. Advisor sign-off on v2 should replace those acceptance clauses with this single-home/node-local contract before implementation; this comment does not silently claim they are satisfied. Confirm the operator's home clone for explicit local enrollment and the existing node/alias schema representation to preserve. No further authority/key infrastructure is proposed. BUG-2017 remains Draft, unclaimed, and unimplemented.
