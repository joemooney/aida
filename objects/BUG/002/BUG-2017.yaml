id: 01a16ad2-fa8b-7961-ae04-837e24cec35d
spec_id: BUG-2017
agreed_id: BUG-2017
title: Prevent uncoordinated ID-block allocation in partitioned stores
description: |
  ## Problem
  Partitioned clones can independently acquire numeric blocks and issue bare global display IDs without a common allocation authority. Local reservations must not be mistaken for globally coordinated identities.

  ## Acceptance (signed SKETCH v2, advisor signoff 2026-10-24)
  1. Allocation authority is a local, versioned setting in the clone common Git directory. Missing means non-authoritative; malformed refuses allocation. Store objects, forge URLs, user preferences and environment variables never confer authority.
  2. A non-authoritative clone allocates only existing node-local <TYPE>-<node>-<n> IDs through every writer (CLI, MCP, backend, bulk, import and repair). Global-ID or block requests refuse before counter, object or ref changes; no internal-global-counter fallback remains.
  3. Node binding is a pseudonymous UUID without host/user/email/path fields. STORY-1742 scans node and registry serialization without exemptions. Preserve the existing node and alias schema; add fields rather than repurposing them.
  4. Only the authoritative clone may claim or dispense global blocks and run canonical promotion. The operator explicitly enrolls the primary HOME clone in slice 2; implementation never enrolls real HOME. UUIDs and old-ID aliases survive renumbering and repeated sync is idempotent.
  5. Shared reconciliation preflight reports every conflict in global ranges, node bindings and display-ID-to-UUID assignments using opaque identities, before union or ref advancement. Audit is read-only and emits a manual repair plan.

  ## Slices
  1. Common-Git allocation-mode setting, complete writer checklist in PR, shared allocation/persistence guards, CLI/MCP/backend refusal fixtures. Default WORK cannot dispense global IDs; unsupported writers refuse.
  2. Pseudonymous UUID bootstrap, auto-claim/repair integration, home-only promotion and WORK-to-HOME alias-preservation fixtures.
  3. Shared all-conflict reconciliation preflight/audit, STORY-1742 scanner integration and final documentation.
  Slices 1 and 2 use (Refs BUG-2017); only final acceptance-complete work uses (BUG-2017).

  ## Constraints
  No transport/scanner-file overlap before STORY-1742 scanner is in review. No global authority enrollment on real HOME during implementation. Preserve store-writer then dispense-lock ordering. Outbound work identifiers are sanitized by STORY-1742, not by a duplicate policy engine.

  ## Non-goals
  Signatures, key enrollment, offline grant envelopes, a second authority service, automatic full-store trust-boundary merge, malicious raw Git, or copied/rolled-back entire-clone state. This signed single-HOME/node-local contract supersedes the original description signed-grant/offline-import clauses; full SKETCH v2 and signoff remain in comments.
