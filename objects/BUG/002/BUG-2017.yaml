    1. Keep legacy identity a real legacy schema; do not default damage into a person. node.rs::NodeConfig (232), NodeRegistryEntry (290), deserialize_node_id (64), load/save and NodeRegistry::load/save require legacy user_id/hostname, accept numeric IDs as decimal strings, and preserve registered_at versus registered meanings. NodeRegistryEntry::owner/display_name (414) derive owner/name from user/email/user_id/hostname; register_specific_full_named (556) manufactures a host/owner label. Consequently merely making user_id default 0/hostname empty makes an incomplete legacy row appear valid and owner() returns “0”; merely assigning a UUID to node_id still serializes identifying fields. Use the approved additive opaque binding representation without redefining legacy fields or sending pseudonymous records through legacy human-name helpers. Preserve valid numeric/string legacy input and optional name/user absence. Existing node tests: test_back_compat_numeric_id_deserializes, test_node_config_persistence, old_nodes_toml_without_name_user_parses, old_entry_backfills_name_and_owner_via_helpers, entry_name_and_user_round_trip_through_serde. Missing decisive cases: explicit opaque-only serialization allowlist/roundtrip; incomplete legacy user_id/hostname, corrupt/version-invalid binding, and mixed/contradictory representations refuse allocation/migration with unchanged bytes. Read-only team::load_roster best-effort presentation is not writer admission; git_ops::register_node_full_identity currently unwrap_or_defaults a failed registry read (5175), so bootstrap/migration must not reuse that writer to overwrite corruption. New WORK must never invoke that legacy registration, preferences, hostname/user/email capture or block CAS path.

    2. Bind the actual allocator before seed, not just a file before save. init_cmd::handle_init_distributed_worktree (4295) builds a fresh RequirementsStore then seed_meta_requirements/backend.save (4576-77), while legacy registration is later (4783); handle_init_distributed_sibling (5400) similarly seeds at5635; handle_init_post_clone (5098) has legacy acquire/preferences at5270-5322. meta::seed_meta_requirements (386) calls model add_requirement_with_id and also seeds missing protocols on the existing-meta path. RequirementsStore::new has no provider; GitBackend::assemble_store (1005) attaches allocation_authority::dispenser, but a separately constructed seed store does not inherit it. CloneDispenser::inner/dispenser (337/434) capture root+optional provider: a handle created before temporary HOME enrollment has inner=None and cannot become a configured HOME dispenser merely because the flag changes later. rel_cards::load_dispenser (50) is the other effective-provider seam. Missing case: ordinary no-flag WORK init and post-clone/sibling bootstrap -> first CLI and MCP defect -> restart/next defect, including missing type-protocol reseeding; assert opaque node-local META and defects, no initial global IDs, no legacy registration/global claims. Test the real project/store/common-Git topology, including a genuinely separate store repository; project enrollment/binding cannot silently authorize that independent Git identity. Preserve missing_binding_and_dispenser_failure_never_use_global_fallback and wrong-provider refusal tests; supported bootstrap must establish state, not weaken unsupported-state refusals.

    3. Migration preserves consumed counters, not just visible objects. dispenser::DispenserState.sequences (57), FileDispenser::open/load_state/next (195/232/246) store LAST consumed per-prefix values; node::AgreedIdBlock.next (743) means NEXT unconsumed global value. SQLiteDispenser::state (472) returns persisted consumed next_val values despite the column name. Do not copy block.next as a local counter or reset/reseed on every load. Reserved but unsaved IDs mean object maxima alone do not reconstruct consumption. Existing test_file_dispenser covers reopen; concurrent_file_dispensers_allocate_unique_ids, bug_2017_concurrent_work_writers_reserve_distinct_local_sequences and bug_2017_first_model_allocation_initializes_under_permanent_dispense_lock cover same-path consumption/first initialization, not common-dir migration across actual linked worktrees. Missing decisive fixture: populated legacy per-type counters (including reserved-but-unsaved high water), migrate twice/restart, then two linked worktrees concurrently initialize/allocate; one stable UUID, preserved per-type floors, no duplicates/reset. Include interrupted/partial migration and malformed/mismatched counter mode; either finish from validated retained evidence or refuse unchanged, never invent new binding/counters. Keep store-writer -> dispenser ordering, permanent sidecar, checked exhaustion and existing stale_stored_mode_refuses_without_rewriting_counter_state/exhausted_sequence_refuses_without_reset_or_global_fallback regressions.

    4. UUID spelling and alias meaning remain distinct. validate_node_id permits at most32 characters; signed new binding is a simple32-character UUID, not a36-character hyphenated UUID or a hostname-derived token. allocation_authority::node/local_id plus object_store::canonical_spec_id and display lookup must agree on case. Existing bug_2017_opaque_binding_survives_case_insensitive_display_lookup_and_update proves opaque token lookup but constructs a legacy NodeConfig with its other fields intact: it does NOT prove private-field-free serialization or bootstrap. Add a true opaque-only fresh/reloaded binding test. Migration must retain existing requirement UUID/spec_id/agreed_id/relationship target UUIDs and old lookup aliases rather than rewriting old IDs to hide an identifying legacy node token. STORY1742 remains responsible for refusing identifying outgoing serialization/history; retaining readable legacy evidence is no exemption or publication permission.

    5. HOME transition must preserve object identity, not merely issue numbers. git_ops::merge_gate (6635) checks local authority before store lock; merge_gate_locked assigns agreed_id while retaining spec_id/UUID and stamps provenance (6790). Existing merge_gate_skips_existing_short_id_collisions and merge_gate_counter_writes_commit_through_and_noop_runs_stay_clean establish collision/no-op pieces; bug_2017_core_canonical_promotion_refuses_before_registry_creation and cached_global_blocks_and_explicit_blocks_only_are_not_authority preserve WORK negatives. Missing complete positive fixture: owned synthetic WORK/HUB/HOME, explicit local-only HOME enrollment before provider capture, generic defect plus linked relationship/comment, promotion and second sync; assert same UUIDs and relationship targets, both old node-local and new agreed lookup, comments unchanged, no second assignment/counter/ref churn. Add existing-HOME provider/block transition rather than treating test authority as live rollout proof. No real HOME enrollment is authorized here.

