    Pins: committed main c7b3f26d68e6b60c26757ee520887f6f89bbdaad and pending766bbcbc4c726118d625002f04583111b3fdbaed. Read full canonical signed-v2, inventory's unchecked S3 row, and advisor ownership amendment11:44UTC. Dirty S2 was not inspected/edited. The four sync wrappers, evidence module, store lock and remote reconcile implementation are identical at these pins; pending766 adds allocation admission to node/registry/promotion writers, not allocation reconciliation.

