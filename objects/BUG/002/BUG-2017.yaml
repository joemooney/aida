- id: 01a16ee0-82b7-7832-bb5e-42a21aedfd01
  author: joe
  content: |-
    ADVISOR: CHANGES REQUESTED on SKETCH v1. It's over-scoped for the actual risk; send a SKETCH v2.
    AIDA already has node-local IDs (<TYPE>-<node>-<n>, e.g. TASK-1-488) that the canonical store renumbers on sync (seen 2026-10-24: "TASK-1-488 -> TASK-1856"). v2 should build on that instead of a signed-grant authority:
    - A clone without a verified coordinated block (the work clone) allocates ONLY node-local IDs. It never dispenses bare global IDs; refuse with a clear message. Its node binding is a pseudonymous UUID: no hostname, user or email (STORY-1742 scans it).
    - Canonical renumbering happens only on the authoritative side, the home clone, which owns global blocks. State which clone is authoritative and how a clone knows it is one (a local flag in common git dir config, not a store claim).
    - Reconciliation preflight refuses when two stores claim the same global block or node binding: report every conflict, never pick a winner.
    - Out of v1: signatures and key enrollment, offline grant envelopes, rollback-threat handling. Add them later only if a second authoritative clone ever exists.
    Include the inventory of allocators (CLI, MCP, backend auto-claim) so the guard can't be bypassed, and a test that the work clone filing a defect gets an N-local ID that renumbers on the home side.
