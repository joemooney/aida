    Block/node provenance limitation grounded in schema: AgreedIdBlock(node.rs743) has node token,type,range,next,allocated_at and human owner/hostname, but no unique issuance UUID. union_block_registries1128 currently deduplicates equal (node,type,start,end) and takes max(next); overlapping_ranges1187 excludes same-key pairs and compares equal type prefixes only. This does not prove common issuance and is insufficient for '*' versus per-type competing ranges. NodeRegistryEntry290 has legacy id+human fields, no separate opaque clone-binding UUID; union_node_registries1242 builds a by-id HashMap and returns the first differing-registration error (which prints hostnames). Neither helper is the complete/opaque S3 collector. Compare against all pinned baseline evidence: independently introduced equal keys on both sides, absent an established common claim, MUST refuse even if payloads/timestamps match; baseline-established repetitions/monotonic consumption are the distinct positive case. FF where one side is the actual baseline is not two independent introductions. Multiple bases or absent ancestry cannot be silently collapsed to a guessed empty/first baseline. Report ambiguity, don't fabricate issuance proof. If history proves an established claim, retain that evidence in the check; malicious raw Git/whole-clone copying/rollback remain outside signed threat scope, not an invented cryptographic demand. S2 common-Git binding is local, not automatically a tracked node-registration claim: S3 must explicitly handle the finalized additive opaque claim representation/provenance; neither legacy hostname equality nor requirement UUID alone establishes clone ownership.

