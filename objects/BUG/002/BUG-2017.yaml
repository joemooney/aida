    Acceptance contract for v1 (supersedes the description's signed-grant/offline-grant-import clauses):
    1. Allocation authority is a local, versioned setting in the clone's common git dir. Missing means non-authoritative; malformed refuses. It is never read from the store, a forge URL, user prefs or env.
    2. A non-authoritative clone allocates only node-local <TYPE>-<node>-<n> IDs through every writer (CLI, MCP, backend, bulk, import, repair). Global-ID or block requests refuse before any counter, object or ref changes; there is no fallback to global counters.
    3. Node binding is a pseudonymous UUID with no host/user/email/path fields; STORY-1742's scanner covers node and registry serialization with no exemption.
    4. Only the authoritative clone claims or dispenses global blocks and runs canonical promotion. UUIDs and old-ID aliases survive renumbering, and repeat sync is idempotent.
    5. Reconciliation preflight reports the full conflict set (global ranges, node bindings, display-ID to UUID) with opaque IDs, and refuses before union or ref advancement.
    Rulings: the home clone is the operator's primary checkout /home/joe/ai/aida (the operator enrolls it explicitly in slice 2). Preserve the existing node/alias schema; add fields, never repurpose them. The writer inventory is a slice-1 deliverable, as a checklist in the PR body.
    Sequencing: start after STORY-1742 slice 3 (the scanner) is in review; slice 1 may proceed earlier only if it doesn't touch STORY-1742's files. Slicing (1)-(3) as proposed; the final slice carries (BUG-2017).
    Operator action: approve the spec, and either edit the description to this contract or let the implementer's first PR update it.
