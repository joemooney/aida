    Refusal propagation is a separate required adapter task: hypothesis::is_evidence_refusal256 is typed chain matching. New allocation refusal must get equivalent context-stable classification (compose a common sync-refusal check, preserve evidence classification). remote_create catches evidence refusal2715 and evidence_stop2955 avoids rollback; generic errors go to rollback_to_preimage2975 (reset --hard). Allocation preflight refusal must not enter that generic reset branch. Best-effort claim/refresh callers must stop before later writes/pushes: db_block::pull_unless_refused221, coordination::pull_claim_refresh, store_sync allocation retry1196/1203, init_cmd::publish_initial_store_snapshot5861/5875; also core node registration CAS retry callers. Do not relabel an allocation conflict as a transport retry or let ignored Err publish. Ordinary store_push_pull::pull_store_leg_locked2379 already returns error before promotion/publication; its post-pull collision scan is too late to satisfy preflight.

