- id: 01a1a449-5e77-7713-ad3f-b651182c910a
  author: joe
  content: |-
    ## Implementer approach

    Scope note: coordination `acquire_claim` (~840/848 in the audit) already propagates via `drop_unpushed_claim_commit` (TASK-2069/BUG-2188); left as reviewed. Remaining discarded Results: db_block claim + auto_allocate_block_inner, schedule_ledger write_cas_opts + write_batch_cas_opts, coordination acquire_lock_claim (rejected + push-error paths).

    Policy: on a rejected push, a rollback error is propagated (with caller context) and the retry loop stops. schedule_ledger push-*error* offline policy (keep local commit, Ok) is unchanged: no rollback runs there. acquire_lock_claim push-error: Unavailable (proceed local-only) is returned only when the rollback succeeded; a failed rollback returns Err so the drain/solo lock is not treated as cleanly unavailable.

    ### Acceptance criteria as tests
    - **Unit (caller-level):** new `aida-cli-lib/src/tests/bug_2194_rollback_caller_tests.rs` — for each of the 5 callers, a bare origin with a rejecting pre-receive plus a local pre-push that commits a peer and dirties a tracked file; assert the caller returns the `failed without conflict` error, HEAD == peer, dirty bytes survive, origin unchanged, pre-push reached exactly once (stopped after first failure), no rebase state.
    - **Unit:** acquire_lock_claim push-error variant (pre-push exits 1 after peer+dirty) returns Err, not Unavailable.
    - Offline-policy preservation is covered by existing schedule ledger tests (unchanged code path).

    ### Expected files
    - `aida-cli-lib/src/db_block.rs`
    - `aida-cli-lib/src/schedule_ledger.rs`
    - `aida-cli-lib/src/coordination.rs`
    - `aida-cli-lib/src/tests/bug_2194_rollback_caller_tests.rs`

    ### Ambiguities / conflicts as questions
    - None blocking; acquire_claim intentionally left on its reviewed warn-and-Unavailable policy.
