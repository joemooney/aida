  content: 'Advisor 2026-10-18: PR #2742 PASS. Non-blocking follow-up: if with_store_write_lock fails before its closure runs (lock timeout, or ensure_store_write_safe refusing a mid-rebase or detached store), the timing record is not written at all. Write it outside the lock as a fallback (left for the next store commit to sweep, as before), so a lock failure degrades to the old behaviour instead of losing the record.'
