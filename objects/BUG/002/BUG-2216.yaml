title: A passing re-review does not release the earlier CHANGES REQUESTED merge-hold
description: 'Observed 2026-10-24: #2885, #2886 and #2868 passed round-2 review at new heads, yet still carried the round-1 reviewer-refusal hold. The train refused them and the operator had to clear each by hand. ACCEPTANCE: when the reviewer records APPROVED at the current head for every spec the hold names, the reviewer-refusal hold is released through the existing release path (marker, label, ledger clearance and event), exactly once. A hold of any other kind (recusal, operator, legacy, label-only) is never released this way. An approval at a non-current head releases nothing. Tests for each case.'
