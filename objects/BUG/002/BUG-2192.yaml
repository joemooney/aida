    PR-2786 timings (mitigation only, per the advisor's ruling; it is not the root-cause fix). Piped `aida show BUG-1993 | cat`, agent profile, interleaved against the primary checkout's store, byte-identical output.
    - main: live 6657ffff6d (one pr-ship-only commit behind origin/main 4632c55b7d)
    - PR: 5f4d5bbeaf

    | run | 1-min load | main | PR |
    |---|---|---|---|
    | median of first 3 | 12.5 | 959 ms | 672 ms |
    | median of 5 | 12.5 -> 11.4 | 857 ms | 672 ms |
    | median of 10, wall | 10.8 | 1045 ms | 815 ms |
    | median of 10, CPU (user+sys) | 10.8 | 890 ms | 690 ms |

    The load never fell below 8 on this box while measuring, so these are equal-load interleaved runs. Both wall and CPU time drop about 22%, but CPU is still about 2x the ~350 ms of the 95f15a20d4 binaries. AC1 (bisect) comes next.
