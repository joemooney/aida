- id: 01a15b78-1e34-72b2-b764-f4ebea8774db
  author: joe
  content: |
    AC1 bisect of 95f15a20d4..main (257 first-parent commits) for piped `aida show BUG-1993 | cat`.

    Method: agent-profile builds, each command run once per round, interleaved and with alternating order. There was 1 warm-up round, then 9 measured rounds. 1-min load was 6.4-8.0. CPU is user+sys from rusage. The open/lookup/context/linkage phase medians are what each build recorded in usage.jsonl (95f15a20d4 predates phase telemetry).

    | pos | build | wall | CPU | open | lookup | context | linkage |
    |---|---|---|---|---|---|---|---|
    | 0 | 95f15a20d4 (ref) | 298 | 472 | - | - | - | - |
    | 148 | b13bf7d3eb | 345 | 479 | 6 | 16 | 61 | 221 |
    | 149 | **266d8f5ef3** | 456 | 591 | 23 | 42 | 116 | 222 |
    | 200 | d96f18d4d5 | 480 | 592 | 23 | 44 | 117 | 224 |
    | 201 | **2177eaad8f** | 602 | 738 | 36 | 72 | 173 | 221 |
    | 224 | a27fe3fc76 | 582 | 740 | 37 | 73 | 173 | 203 |
    | 225 | **6d590ed914** | 667 | 793 | 43 | 86 | 203 | 222 |
    | 245 | a4fb8e6c07 | 758 | 805 | 44 | 88 | 209 | 198 |
    | 256 | main (6657ffff6d) | 637 | 795 | 44 | 86 | 201 | 198 |
    | - | PR-2786 (5f4d5bbeaf) | 510 | 626 | 27 | 51 | 137 | 238 |

    Regressing commits. Each costs CPU in the phases that run store git through host_git_command (open, lookup, context); linkage is flat throughout:
    1. **266d8f5ef3** fix(contained): let contained sessions write the main checkout's store and cache (BUG-1929): +112 ms CPU. It adds the store-hooks hardening to every store host git call: resolve_store_hooks_dir (a `git rev-parse --git-common-dir` spawn plus hook verification), resolved twice per call. Git execs per show go from 15 to 32.
    2. **2177eaad8f** feat(contained): private clone per contained seat, slice 1: +146 ms CPU. It adds seat_clone_detect to every host git call; clone_lease_roots reads and TOML-parses every `.aida/sessions/*.toml` (about 400 on the primary checkout, none of them clone leases).
    3. **6d590ed914** fix(contained): keep host git out of planted submodules (BUG-1985): +53 ms CPU. Every store host_git_command now probes .gitmodules. The store has no .gitmodules file, so it falls back to `git config --blob :.gitmodules`, then `HEAD:.gitmodules`.

    Positions 226-256 are flat (793-805 ms). TASK-1985's incremental agent profile made no difference: a non-incremental a4fb8e6c07 build and the incremental 419579e7c4 build both measured 812 ms CPU. Together, the three steps account for about 311 of the 323 ms CPU growth. PR-2786 (the mitigation) takes back 169 ms: hooks are resolved once per call, and the lease scan skips files that cannot be leases.

    Next-fix candidates (separate PR): cache resolve_store_hooks_dir and clone_lease_roots per process, keyed by path and invalidated on mtime; cache the .gitmodules probe per store HEAD, or skip it when neither the index nor HEAD has .gitmodules; and stop the per-call `git rev-parse --git-common-dir` spawn by reading .git/commondir directly.
