title: aida show piped/TOON about 2x slower on main than on 95f15a20d4 (bisect 95f15a20d4..main)
description: |
  Follow-up from BUG-1993 AC1. The bisect of 97453570d6..95f15a20d4 found no regression on the default piped/TOON `aida show` path. Both endpoints were built with --profile agent and timed interleaved against the same store at 1-min load 6.5-7.7:
  - 97453570d6: median 335 ms (5 runs), 431.5 ms (10 runs)
  - 95f15a20d4: median 355 ms (5 runs), 450.5 ms (10 runs), +4-6%, within noise
  - main 419579e7c4: median 744 ms (5 runs), 928 ms (10 runs), about 2.1x slower
  All three printed byte-identical TOON output and nothing on stderr.

  The slowdown sits in 95f15a20d4..419579e7c4, 242 first-parent commits. Main's per-phase medians (piped, 17 runs): open 56, lookup 114, context 255, linkage 308 ms. The older binaries record no phases, so which phase grew is unknown. Binaries: ~/.claude/jobs/bdc37ec9/tmp/bins/ (job-scoped, may be deleted).

  ## Acceptance
  - Bisect 95f15a20d4..main on piped `aida show <ID>`, timed interleaved under equal load, and name the commit or commits that doubled the cost.
  - Fix the commit(s) found, or show piped show within its 1000 ms budget at load < 8, with the measurements posted.
