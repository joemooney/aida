- id: 01a15c32-957c-72f2-a113-cc9c421f2341
  author: joe
  content: |-
    Root-cause fix: PR-2788 (2f2d54bd57, stacked on #2786). Each of the three regressing commits' per-call lookups is now memoised per process, keyed on stamps (inode, size, times) of the files the lookup reads:
    - 266d8f5ef3: the `rev-parse --git-common-dir` answer.
    - 6d590ed914: the index/HEAD `.gitmodules` probe.
    - 2177eaad8f: each parsed session lease.

    Nothing is memoised over a file changed in the last 2 s or under GIT_DIR-style environment. A failure is never memoised, so every refusal is recomputed in the same order as before.

    Git spawns per `aida show BUG-1993 | cat`: main 40, #2786 32, PR-2788 18, 95f15a20d4 15. Output is byte-identical.

    AC2: interleaved runs with alternating order, after 1 warm-up round. CPU is user+sys. main is live 6657ffff6d.

    | run | 1-min load | 95f15a20d4 wall / CPU | main wall / CPU | PR-2788 wall / CPU |
    |---|---|---|---|---|
    | median of 5 | 2.5-2.6 | 330 / 508 ms | 758 / 909 ms | 357 / 511 ms |
    | median of 10 | 2.5-2.7 | 327 / 508 ms | 694 / 846 ms | 358 / 511 ms |

    CPU is back to the reference, and wall is well within 1000 ms. PR-2788 phases: open 27, lookup 21, context 72 ms (main: 44 / 87 / 205).

    Side finding, not changed: on git 2.43, `config --blob` of a missing blob exits 1, not 128. So the HEAD:.gitmodules fallback is never tried, and a .gitmodules that is only in HEAD gets no override. This predates the PR.
