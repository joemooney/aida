title: aida dev release pushes the release commit straight to main, which branch protection now refuses
description: '2026-10-20 06:25: release.sh commit + tag + push failed with GH006 (required checks merge-hold-gate, Build). v0.15.0 predates the protection. Acceptance: when the default branch requires status checks, release.sh pushes the release commit to release/vX.Y.Z, opens a PR, waits for its checks, and tags the merged commit only after merge (never tagging a commit main won''t contain); it never leaves a local tag on an unpushed commit. Also: release.sh must refuse to start, or take the main merge-lease, while an aida pr ship is in progress (a concurrent ship fast-forwarded the primary checkout during cargo check on the same morning).'
