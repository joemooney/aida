title: Contained launch paths other than queue work never export AIDA_CONTAINED=1, so contained-aware checks treat those sessions as uncontained
description: |
  Found by the merge-seat reviewer of PR #2586 (BUG-1984), review at a1260f94bc. Most contained launch paths never export `AIDA_CONTAINED=1`. Only `aida queue work` sets it (`queue_cmd.rs` ~11084-11097). `aida launch --sandbox` (`agent_launch.rs` ~1924) and the `[agents] contained = true` setting (`lib_part2.rs` ~697-700) launch a sandboxed agent without it. So `Cache::open`, `aida doctor`, and any other contained-aware code treat those sessions as uncontained.

  ## Acceptance
  - Every launch path that runs an agent contained exports `AIDA_CONTAINED=1` to it, and none that runs it uncontained does.
  - A test per launch path asserts the variable in the child's environment.
  - Line numbers are from the review; re-verify at main.
