title: 'Flaky regen tests under load: guards unexpected_fifo_eof... asserts <1s; exit_policy_distinguishes... intermittent ''git cat-file blob failed'' with empty stderr'
description: |-
  Seen during the 2026-10-15 regen restack (stack top 55bca00b11; 3 of 10 runs had one failure each).
  - regen::score::guards::tests::unexpected_fifo_eof_is_recorded_and_collection_never_waits_for_descendants asserts the run takes <1s; it fails under load and also fails 1/5 on bare origin/main. Make it measure 'did not wait for descendants' structurally (or use a generous bound tied to the descendant's sleep), not with a wall-clock <1s.
  - regen::score::tests::exit_policy_distinguishes_installer_failure_oracle_checks_and_scoring_errors failed once with 'git cat-file blob ... failed:' and empty stderr, right after a long compile. It passed 9/9 afterwards. Investigate oracle.rs cat-file error capture (stderr is empty, so the real cause is lost) and any race with a concurrent git object write.
