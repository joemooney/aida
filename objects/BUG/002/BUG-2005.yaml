    FACTORY PLAN (antigravity):
    • Approach:
      1. aida-cli-lib/src/shell_eval.rs: Define ZSH_LOCALOPTS_CAP = "zsh-localopts" and helper marker_speaks_zsh_localopts.
      2. aida-cli-lib/src/dev_cmd.rs: Bump AIDA_SHELL_WRAPPER in SHELL_HELPERS to include zsh-localopts.
      3. aida-cli-lib/src/dev_cmd.rs: Update classify_wrapper to require ZSH_LOCALOPTS_CAP alongside EVAL_BLOCK_CAP for WrapperState::Current; classify pre-fix wrappers without it as WrapperState::Stale.
      4. aida-cli-lib/src/dev_cmd.rs: Make installed_helpers_are_current check for ZSH_LOCALOPTS_CAP and setopt localoptions, ensuring installed pre-fix helpers report stale and trigger the re-install hint.
      5. aida-cli-lib/src/tests/bug_2005_wrapper_staleness_tests.rs: Add tests verifying pre-fix leaking wrapper fixture is classified stale and prompts for re-install, and fresh install is current. Update task_1171_eval_channel_tests.rs.
      6. docs/environment-variables.md & docs/release-notes/2026-10-zsh-wrapper-leak.md: Document the zsh-localopts capability and provide release note instructing affected zsh users to re-run --install and rotate keys.
    • Files to change:
