title: Installed shell wrappers carrying the BUG-2000 zsh leak are never refreshed, and dev status reports them as current
description: 'Found in the strict review of #2584 (BUG-2000), approved at e82b401d56. #2584 fixes newly generated wrappers. But the capability marker AIDA_SHELL_WRAPPER (dev_cmd.rs:1404) is unchanged, and classify_wrapper / installed_helpers_are_current (dev_cmd.rs:1298-1314) only check for ''eval-block''. A zsh user who ran ''aida dev shell-init --install'' from a main build after #2463 (BUG-1811) keeps the leaking ~/.aida/shell-init.sh after upgrading: every wrapped aida call still prints all shell parameters, including API keys, and ''aida dev status'' says ''Shell wrapper: current''. Fix: add a capability token (e.g. zsh-localopts) to the marker and require it for Current, so the stale/re-install hint fires; consider auto-refreshing an installed wrapper on ''aida dev build'' or the next ''aida'' call. Done when: a fixture install of the pre-fix wrapper is classified stale with the re-install command, a fresh install is current, and the release note tells zsh users to re-run --install and rotate keys. Released binaries (v0.15.0) are not affected; only main/dev builds are.'
