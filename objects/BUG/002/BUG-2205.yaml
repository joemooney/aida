title: Reviewer launch refuses to end a dead lease when the worktree index only equals an already-pushed commit
description: 'Seen twice on 2026-10-21 (PR-2789 lease 01a15832c489, PR-2782 lease 01a15787fc7d). A dead codex lease held the PR branch in an old worktree whose staged index exactly matched a pushed commit (the branch moved under it via another worktree). ''aida queue work PR-N --role reviewer'' refused with ''could not end dead lease ... worktree has uncommitted changes'', so the advisor had to check ''git write-tree'' against the branch history by hand and run ''aida session end <id> --force''. Acceptance: when every staged and unstaged change is reproducible from a commit reachable from the remote branch (index tree equals some pushed commit tree, no unstaged or untracked files), treat the worktree as clean for dead-lease cleanup and say so; otherwise keep refusing.'
