    ADVISOR SKETCH SIGNOFF 2026-10-20 04:50 (mechanism):
    REJECTED: a workspace-wide GIT_CONFIG_COUNT/KEY/VALUE env. Production code appends its own GIT_CONFIG_* pairs (the BUG-2004 token path), and tonight's PR-2769 lib-0 failure was exactly a GIT_CONFIG_KEY_0 env race, so a global env would collide with it. Also rejected: GIT_CONFIG_GLOBAL/SYSTEM files, because many fixtures already override those for isolation.
    APPROVED:
    1 One test-support helper per crate family (reuse an existing fixture-git helper if there is one) that builds the git Command with '-c maintenance.auto=false -c gc.auto=0', mirroring production's transaction_git_config. Fixtures call it instead of Command::new("git") for commit/merge/commit-tree/am/rebase.
    2 A RATCHET guard test: count the test-source sites that spawn a write-class git subcommand outside the helper; the count may only go DOWN (baseline file checked in). New fixtures can't regress.
    3 Migrate in this PR every fixture in a file that has flaked (the history fixture, plus any in CI logs with 'unable to create temporary file'), plus as many others as stay mechanical. The rest drain through the ratchet.
    4 Keep the bug-2118 LD_PRELOAD reproduction working, and show it passing for a migrated fixture.
