title: 'aida ps reports Codex/agy factory lanes as ''stale lease — process dead'' while the agent is alive: lease records the transient worktree-add pid'
description: |
  2026-10-13 06:14: `aida ps` listed BUG-2005 and TASK-1724 under "Orphaned In-Progress specs" as "stale lease — process dead", and their sessions as "⚠ stalled". Both lanes were live: an interactive Antigravity agent (pid 1658735) had just pushed PR #2592 for BUG-2005, and a Codex agent (pid 2317829) held TASK-1724 parked on an advisor question.

  Both agents were launched with `aida agent new <codex|antigravity> --cwd ~/ai/aida` and ran `aida worktree add <ID>` themselves, then worked in the worktree. The lease records the pid of a short-lived process from that command, not the agent session, so liveness and attribution fail. An operator or monitor reading `aida ps` would conclude both factory lanes had died.

  ## Acceptance
  - A lease taken from inside an `aida agent new` session (AIDA_AGENT_NAME set) is attributed to that agent's process (the registered agent pid, or the nearest ancestor that is a registered agent), not the transient CLI pid.
  - `aida ps` shows such a lane as live while the agent process lives, for Codex and Antigravity as well as Claude.
  - "Orphaned In-Progress" excludes specs whose lease belongs to a live registered agent.
