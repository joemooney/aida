title: Uncontained launchers (phase_driver, burndown, autopilot intake, questions, compete) do not strip inherited AIDA_CONTAINED
description: |
  From the strict review of PR #2610 (BUG-2006) at 07a62df938, non-blocking: several launchers that start uncontained sessions still do not strip an inherited AIDA_CONTAINED=1 from their child's environment: phase_driver, burndown_run, autopilot_intake, questions and compete. A contained parent that runs one of them hands its children a false containment claim. Today that only makes queue work stricter, so it is not exploitable, but it is contract drift.

  Expected: every launch path routes through `containment_applied(vendor, contained)` (session.rs:1676), which sets or strips the variable. Acceptance: one production-builder test per launcher asserting that the uncontained child has no AIDA_CONTAINED.
  Also from that review: `is_contained_args` (agent_launch.rs:4366) infers containment from argv (`--settings x.json` from agents.toml reads as contained). Replace it with the launch's real containment decision.
