title: aida claim takes a lease but never moves an Approved spec to In Progress
description: 'Observed 2026-10-24: zero specs project-wide show in-progress while ~7 have live lanes or open PRs (BUG-2214 shows Approved with two open PRs). BUG-754 fixed only the burndown path. ACCEPTANCE: a successful aida claim (and aida queue work) moves Approved -> In Progress and records the claimant; aida unclaim with no open PR returns it to Approved; with an open PR it stays In Progress; merge-time completion is unchanged; a claim on a Draft spec never promotes it. Tests for each transition.'
