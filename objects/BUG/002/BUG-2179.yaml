  author: joe
  content: 'Measurement for PR #2776 (head 08e6fa3b05): PR #2773''s 108 traced specs (from collect_pr), live store (77,780 commits, 5,355 refs), 1,897 versions, exact replay of each version''s git commands, interleaved, 3 runs. Before (per-spec git log --all + git show): 321.1s (load 24.4), 291.3s (36.6), 238.7s (6.7), median 291.3s. After (one git log --all --name-only + one cat-file --batch): 72.9s (32.5), 48.2s (28.5), 47.4s (12.7), median 48.2s. About 6x. The <30s warm target is NOT met here: the batched walk is CPU-bound tree diffing over the store''s 67,627 commits (~38s); --no-renames and Bloom-filter commit-graphs don''t change that at git 2.43.'
