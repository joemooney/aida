  content: 'Advisor 07:38 ruling on PR-2776 round 1 (AC3, <30s warm ship step 1): going from 10–40 min to about 48 s is the bug''s real fix. AC3 is AMENDED to: aida pr ship step 1 finishes in under 60 s warm on this repo, timed on the real command (median of 3, load average noted, with the PR''s built binary), NOT a replay of its git commands. Getting below 30 s is a follow-up spec, which I''ll file. Everything else in the round-1 findings stays blocking: tests for both branches of the bounded re-collection (changes once and proceeds; changes every time and refuses), plus the CheckRegistration::NotYet case for BUG-2184.'
