  content: 'Advisor 2026-10-18 13:19: consequence observed. #2741''s mandate ship scanned for ~10 min, then refused with ''exclusion store has uncommitted evidence'': concurrent store writers (schedule ticks, new specs) dirtied the store during the scan. Besides speeding up the scan, take the store_snapshot under with_store_write_lock (or retry the snapshot a bounded number of times while concurrent writers commit), so a live multi-agent store doesn''t fail every mandate ship. Keep it fail-closed after the bounded retries.'
