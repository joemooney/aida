title: Standalone Bash-launched reviewer never receives the verdict-file path, so its approval lands only in the review worktree and pr ship succeeds only from there
description: 'From the STORY-1654 combined e2e (PR #2661 + #2485): the positive run''s reviewer approved, but the verdict file the orchestrator templates read (.aida/review-verdicts/PR-N.json in the orchestrator''s checkout) was never written; the reviewer process was not given the verdict path, so the approval landed in the review worktree and ''aida pr ship'' only succeeded from there. Fix: pass the canonical verdict path (or the project root) to the standalone reviewer and have review record write the canonical location; e2e: ship from the orchestrator checkout succeeds.'
