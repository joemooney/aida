title: 'Contained parent escape: ''aida queue work --plan-only --permission-mode bypassPermissions'' launches an uncontained bypass claude with no consent gate'
description: 'Found by the STRICT review of #2689 (BUG-2157/2158), out of its scope. Under AIDA_CONTAINED=1, queue_cmd.rs:11351 computes contained = !plan_only && ..., so --plan-only turns containment off; apply_queue_work_contained_env(false) then strips AIDA_CONTAINED, the explicit --permission-mode wins (phase_driver.rs:2864), and the consent gate is skipped because it requires !plan_only. Result: an uncontained claude in bypassPermissions mode with no consent prompt. Fix per the BUG-2151 ruling: a contained parent''s env always wins; plan-only must not disable containment, and --permission-mode must be refused under a contained parent. Add a test asserting the child''s argv/env.'
