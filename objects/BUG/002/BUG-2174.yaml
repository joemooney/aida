title: Every PR prepends a 'recent change' paragraph to AGENTS.md/OVERVIEW.md, so each merge re-conflicts every other open PR
description: 'Observed during the 2026-10-17 fire wave: #2704, #2706, #2710, #2712 and #2713 each needed one or more extra merge-up cycles (20-40 min each) solely because both sides added a paragraph at the top of AGENTS.md and/or OVERVIEW.md. The change log belongs in the substrate (aida digest, PR trail), not in shared hot docs. Fix options: (a) stop requiring per-change paragraphs in AGENTS.md/OVERVIEW.md (update the implementer discipline and any check that demands them); (b) move them to per-change fragment files (docs/changes/<SPEC>.md) assembled at release; (c) a union merge driver for those files via .gitattributes (merge=union) as a stopgap. Recommend (a)+(c).'
