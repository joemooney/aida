agreed_id: BUG-2174
title: Every PR prepends a 'recent change' paragraph to AGENTS.md/OVERVIEW.md, so each merge re-conflicts every other open PR
description: 'Observed during the 2026-10-17 fire wave: #2704, #2706, #2710, #2712 and #2713 each needed one or more extra merge-up cycles (20-40 min each) solely because both sides added a paragraph at the top of AGENTS.md and/or OVERVIEW.md. The change log belongs in the substrate (aida digest, PR trail), not in shared hot docs. Fix options: (a) stop requiring per-change paragraphs in AGENTS.md/OVERVIEW.md (update the implementer discipline and any check that demands them); (b) move them to per-change fragment files (docs/changes/<SPEC>.md) assembled at release; (c) a union merge driver for those files via .gitattributes (merge=union) as a stopgap. Recommend (a)+(c).'
status: InProgress
priority: Medium
owner: ''
feature: Uncategorized
created_at: 2026-10-18T07:54:28.323605219Z
modified_at: 2026-10-20T17:47:27.271786124Z
req_type: Bug
comments:
- id: 01a158e3-0630-7c72-9560-c406000ae999
  author: joe
  content: 'Implementer sketch (overnight lane, 2026-10-20 03:40; spec still Draft, so not started). Cause: the operator''s global ~/.codex/AGENTS.md tells Codex to keep ''recent major updates'' in the project AGENTS.md, so Codex prepends a change paragraph to AGENTS.md (52 trace-tagged blocks now) and OVERVIEW.md (57) on every PR. No in-repo gate or template requires them. Fix: (a) add a rule to the generated AIDA block (template master aida-core/src/scaffolding/codex_md.rs, mirrored via make sync-templates): ''Do not add per-change notes to AGENTS.md or OVERVIEW.md; record them in the PR body and an aida comment on the spec; edit these files only for a real architecture change''. The repo-level rule overrides the global habit for Codex here. (b) As a stopgap, a .gitattributes ''merge=union'' for AGENTS.md and OVERVIEW.md, so local merge-ups of prepended paragraphs stop conflicting (GitHub''s server-side merge ignores it; the agents'' local ''git merge origin/main'' honours it). (c) Optionally, a one-time PR that moves the existing per-change blocks into their specs'' comments. That conflicts once with open PRs, so it ships alone. No architecture change; (a)+(b) is one small PR. The operator may also want to edit ~/.codex/AGENTS.md, which is outside the repo and not mine to touch.'
  created_at: 2026-10-20T10:37:15.696442550Z
  modified_at: 2026-10-20T10:37:15.696442550Z
  session_id: 922261ed-530a-4e6c-afda-50941530bad0
- id: 01a1591b-5e92-7e73-8642-00d841511be5
  author: joe
  content: 'ADVISOR SIGNOFF 2026-10-20 04:40 on the 03:40 sketch: (a) APPROVED. Put the rule in the generated AIDA block (template master aida-core/src/scaffolding/codex_md.rs, then make sync-templates and check-templates), and mirror it in the Claude-side template so both vendors get it. (b) REJECTED: merge=union on markdown silently interleaves real concurrent edits, e.g. two architecture changes to the same section, with no conflict to flag it. A silent wrong merge is worse than a visible conflict. (c) DEFERRED: don''t move the historical blocks now; it would conflict with every open PR. Operator note: the root cause is ~/.codex/AGENTS.md''s ''recent major updates'' instruction; the operator should edit it (outside the repo).'
