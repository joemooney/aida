comments:
- id: 01a158e3-0630-7c72-9560-c406000ae999
  author: joe
  content: 'Implementer sketch (overnight lane, 2026-10-20 03:40; spec still Draft, so not started). Cause: the operator''s global ~/.codex/AGENTS.md tells Codex to keep ''recent major updates'' in the project AGENTS.md, so Codex prepends a change paragraph to AGENTS.md (52 trace-tagged blocks now) and OVERVIEW.md (57) on every PR. No in-repo gate or template requires them. Fix: (a) add a rule to the generated AIDA block (template master aida-core/src/scaffolding/codex_md.rs, mirrored via make sync-templates): ''Do not add per-change notes to AGENTS.md or OVERVIEW.md; record them in the PR body and an aida comment on the spec; edit these files only for a real architecture change''. The repo-level rule overrides the global habit for Codex here. (b) As a stopgap, a .gitattributes ''merge=union'' for AGENTS.md and OVERVIEW.md, so local merge-ups of prepended paragraphs stop conflicting (GitHub''s server-side merge ignores it; the agents'' local ''git merge origin/main'' honours it). (c) Optionally, a one-time PR that moves the existing per-change blocks into their specs'' comments. That conflicts once with open PRs, so it ships alone. No architecture change; (a)+(b) is one small PR. The operator may also want to edit ~/.codex/AGENTS.md, which is outside the repo and not mine to touch.'
