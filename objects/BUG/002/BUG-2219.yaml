title: A merge train dies on a transient network failure (DNS) with no retry
description: 'Observed 2026-10-23: train #2884 (2864+2869) failed on ''Could not resolve host: github.com'' and stopped, needing a manual re-run. ACCEPTANCE: train network steps (fetch, push, gh API) retry a transient failure (DNS, connection reset, 5xx) with bounded backoff, at most about 3 attempts. A non-transient failure (auth, 4xx, conflict) does not retry. When retries run out, the train reports which step failed and leaves a resumable state. Tests with an injected transient failure.'
