title: Contained drain launches its phase_driver CI-fix and advisor child sessions uncontained
description: 'Found in the #2640 (BUG-2124) review, and predates it. phase_driver CI-fix and advisor children call headless_vendor_args(.., false, ..), so under a contained drain they always run without the sandbox. Before #2640 they inherited AIDA_CONTAINED=1 (posture only); now they are honestly uncontained. Decide: should a contained drain contain every agent child it spawns? Likely yes for CI-fix (it writes code); the advisor child needs a ruling. Security review required.'
