agreed_id: BUG-2133
title: Contained drain launches its phase_driver CI-fix and advisor child sessions uncontained
description: 'Found in the #2640 (BUG-2124) review, and predates it. phase_driver CI-fix and advisor children call headless_vendor_args(.., false, ..), so under a contained drain they always run without the sandbox. Before #2640 they inherited AIDA_CONTAINED=1 (posture only); now they are honestly uncontained. Decide: should a contained drain contain every agent child it spawns? Likely yes for CI-fix (it writes code); the advisor child needs a ruling. Security review required.'
status: InProgress
priority: High
owner: ''
feature: Uncategorized
created_at: 2026-10-15T00:16:06.364684179Z
modified_at: 2026-10-15T05:33:32.496740268Z
req_type: Bug
comments:
- id: 01a13dba-6525-7d20-a0ec-2753909bb1aa
  author: joe
  content: 'ADVISOR RULING (fire mode, 2026-10-14): Containment is monotonic. A contained drain contains EVERY agent child it spawns: CI-fix AND advisor children. No child ever runs with more authority/less confinement than its parent. Rationale: CI-fix writes code (obvious); the advisor child reads untrusted PR content and runs commands, so it is the higher prompt-injection exposure, not the lower. Its legitimate writes (review verdicts, comments) go through the same host-commit/contained-write path as any contained child. Implementation: thread the parent''s contained flag into headless_vendor_args at the phase_driver call sites instead of hard-coded false; if containment is requested but unavailable (no bwrap), FAIL CLOSED (refuse to launch the child), never silently downgrade. Tier: STRICT + functional verification (a contained CI-fix child: an in-worktree write succeeds, a write outside is refused). Approved for implementation.'
