- id: 01a169d0-9db0-78e0-a38e-8261acf1c2d7
  author: joe
  content: 'ROOT CAUSE CONFIRMED 10:30: the Claude Code Bash sandbox (bubblewrap) protects .git/config.lock by bind-mounting /dev/null over it. Inside the sandbox, ls shows ''crw-rw-rw- nobody nogroup 1, 3 .git/config.lock''. When the path does not exist on the host, bwrap first creates an empty 0444 file there as the mount point, and leaves it behind after the command exits. So EVERY sandboxed command in this repo or a sibling worktree (they share the main .git) recreates the placeholder, whether or not it runs git. Host-side git then sees a lock and refuses every config write: worktree add -b, branch -D, push -u. Signature: empty, mode 0444. A real git lock is never created read-only, so an empty 0444 config.lock is always safe to remove. Stopgaps: the advisor''s helpers remove it on sight, and the dispatcher sweeps every 10 s. Real fix: an aida launch-path and doctor check removes an empty 0444 config.lock before any config write, and the issue is reported upstream to Claude Code.'
