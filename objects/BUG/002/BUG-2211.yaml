  content: '10:18: a third stale lock appeared at 10:11:xx. The advisor ran no git write then, so other sandboxed sessions (bg lanes in sibling worktrees share the main .git/config) also produce it. The scope is any sandboxed agent, not just the advisor. Stopgap: the advisor''s dispatcher clears an empty lock older than 2 min every 10 s.'
