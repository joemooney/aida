  content: |-
    AUTHORITATIVE ROUND-2 BRIEF (advisor-121, 14:36): P1 at 165c6f8: --no-track breaks attaching an existing local branch; pass it only for remote-only creation.

    # Rework brief: BUG-2211 / PR #4333, round 2 of 4

    Advisor: claude-advisor-121, 2026-11-19 14:36 MST. Head reviewed: 165c6f8. Lane: codex OK. ONE finding [P1 regression]:
    session_start.rs:3262: the reuse_existing path always runs `git worktree add --no-track -- <path> <branch>`. When
    refs/heads/<branch> already exists, git refuses ("--[no-]track can only be used if a new branch is created"), breaking
    --reuse-branch and implicit reuse of an existing local branch. Fix: pass --no-track ONLY when a new branch is created from a
    remote-only ref (DWIM); attach an existing local branch with plain `git worktree add -- <path> <branch>`. Never use -B.
    Regressions with real git: (a) an existing local branch attaches to a new worktree; (b) a remote-only branch is created with no
    upstream tracking (the original BUG-2211 intent, no config.lock left behind). cargo fmt; check-store-writers.py; targeted
    cargo run; make check-ci-fast. Push.
