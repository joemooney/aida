    ## Implementer self-review

    Reviewed HEAD: 4f2d07f88b8f89f20d72ac49e8fc155655e1d211. The origin/main merge-base diff is empty. Reviewed the native worktree diff and checked for untracked additions.

    AC1 [evidence: behavioral-test] The binding advisor criterion is to avoid the upstream write or safely recover the stale lock. Main already includes placeholder detection and healing (aida-core/src/git_ops/config_lock.rs:37, :107 and placeholder_is_removed_and_worktree_add_succeeds at :274). This patch takes the prevention route in session_start.rs:1452, :3262, :3394, worktree_gc.rs:1796, dispatch.rs:2554, :2577 and brief.rs:328, :350. The launcher ran setup_block_ with 3 passed. The enhanced worktree and repeated setup runs are in progress. A disposable Git probe reproduced failure with ordinary tracking against a zero-byte mode-0444 config.lock. Fresh, remote-only, pooled and reset forms with --no-track used the expected remote commit while preserving config bytes and the lock. An existing upstream survived -B, and a branch held in another worktree was refused.

    Deep pass covered flag spelling and order, the option terminator with a spaced path, fresh and existing branch cases, remote-only branch discovery, and an occupied branch refusal. The added option does not change the caller, ref, lease, retirement or host Git authority checks. No tests were removed or weakened. The store writer inventory passed. Independent hook/config writes can still contend and remain subject to existing recovery. No exact-head PR CI exists for these uncommitted lane edits.
