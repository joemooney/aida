- id: 01a169d0-9db0-78e0-a38e-8261acf1c2d7
  author: joe
  content: 'ROOT CAUSE CONFIRMED 10:30: the Claude Code Bash sandbox (bubblewrap) protects .git/config.lock by bind-mounting /dev/null over it. Inside the sandbox, ls shows ''crw-rw-rw- nobody nogroup 1, 3 .git/config.lock''. When the path does not exist on the host, bwrap first creates an empty 0444 file there as the mount point, and leaves it behind after the command exits. So EVERY sandboxed command in this repo or a sibling worktree (they share the main .git) recreates the placeholder, whether or not it runs git. Host-side git then sees a lock and refuses every config write: worktree add -b, branch -D, push -u. Signature: empty, mode 0444. A real git lock is never created read-only, so an empty 0444 config.lock is always safe to remove. Stopgaps: the advisor''s helpers remove it on sight, and the dispatcher sweeps every 10 s. Real fix: an aida launch-path and doctor check removes an empty 0444 config.lock before any config write, and the issue is reported upstream to Claude Code.'
  created_at: 2026-10-23T17:30:41.968965555Z
  modified_at: 2026-10-23T17:30:41.968965555Z
  session_id: 84f05e43-dcc5-4229-9fd9-24816e8c8bb4
- id: 01a1f41e-4413-7651-8988-ea465f3b8696
  author: joe
  content: 'Product 2026-11-19 07:03, field evidence (no new spec): the stale read-only 0-byte .git/config.lock recurred twice tonight in the primary checkout (04:23, 07:00:24). Both times it was created by `git worktree add -b <branch> <W> origin/main`, which writes upstream-tracking config and fails ''could not lock config file .git/config: File exists''. The lock''s mtime equals the command time and no process holds it afterwards, so it looks like a race with a concurrent config writer (likely a checkout hook), leaving a read-only lock that blocks every later worktree add or branch. Workaround that works: `git worktree add --detach <W> origin/main`, commit, then `git push origin HEAD:refs/heads/<branch>` (no tracking-config write). Removing the lock is safe once no process holds it.'
  created_at: 2026-11-19T14:02:52.361737676Z
  modified_at: 2026-11-19T14:02:52.361737676Z
