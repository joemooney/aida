  content: 'Advisor 07:08: REOPENED as a regression of the completed fix. A stale read-only .git/config.lock recurred twice on 11-19 (04:23, 07:00) in the primary checkout, from ''git worktree add -b <branch> origin/main'' racing a hook''s config write while setting upstream (evidence in the product seat''s comment above). Workaround in use: ''git worktree add --detach'' plus ''git push origin HEAD:refs/heads/<branch>''. A fix should either avoid the upstream config write in sandboxed seat/worktree creation or clean up a stale zero-byte lock that no git process holds.'
