title: GitLab credential embedded in remote URL appears in git-remote-http argv on every fetch/push/ls-remote
description: 'Found in the review of #2599 (BUG-2004). Even when aida passes a remote NAME, git starts ''git-remote-http <name> http://oauth2:<token>@...'' with the credential URL in argv. Any local user can read it with ps or /proc. Use a credential helper, or an http.extraHeader passed through GIT_CONFIG_* env, instead of embedding oauth2:<token>@ in the remote URL.'
