title: aida pr ship appends a bare (SPEC) trailer to a '(Refs SPEC)' subject, so a non-completing slice completes its spec
description: 'Seen 2026-10-21 02:51: PR-2787''s subject ended ''(Refs BUG-2169)''. The squash commit on main is b66e4d93b8 ''... slice 2 (Refs BUG-2169) (BUG-2169)'', and BUG-2169 went to completed with slices S3-S5 still open. Earlier tonight #2790 (Refs TASK-1952) got ''(Refs TASK-1952) (TASK-1952)'' too. This supersedes TASK-2035 (folded into the TASK-1951 sweep at 22:48, now promoted because it causes wrong completions). Acceptance: (1) a subject whose trailing group is (Refs X[, Y]) never gets a bare completion trailer appended, and the branch-name fallback does not add one either; (2) merge-time completion skips Refs IDs; (3) a regression test ships a Refs-subject PR and asserts the merge subject and that the spec status is unchanged; (4) aida pr ship prints which IDs it will complete before merging.'
