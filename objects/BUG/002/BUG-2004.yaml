title: GitLab release probe passes PRIVATE-TOKEN to curl on the command line (visible in ps)
description: 'Found in the strict review of #2582 (BUG-1972). This predates that PR, which now sends the glab host token down this path more often. remote_create.rs:1007-1008 runs curl with --header "PRIVATE-TOKEN: <token>". The token sits in argv, so any local user can read it with ps or /proc/<pid>/cmdline while the request is running. Fix: pass the header through stdin (curl -H @-) or a 0600 temp file that is removed afterwards. Done when: no token appears in any child process argv on this path, and a test runs a fake curl that records its argv and asserts the token is absent.'
