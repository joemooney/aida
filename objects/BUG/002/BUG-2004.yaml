- id: 01a135c1-4e3d-75d0-97c1-062d80b15241
  author: joe
  content: 'Scope addition from the round-2 advisor review of #2582 (APPROVE at e241935dc0). (a) Since #2582, when an env token is also set, the glab-stored host token now goes to curl''s PRIVATE-TOKEN argv where it was skipped before: same kind of exposure, different token. (b) NEW call site: the mirror re-run probe (remote_create.rs ~2107-2111 → ls_remote_probe, gitlab_project_create.rs ~342) passes the existing remote''s URL to ''git ls-remote''. If that URL embeds user:token@, ps can see it. Fix: pass the remote NAME to ls-remote, and use the URL only to detect the forge and target. Done-when for BUG-2004 now covers both: no token in any child argv on these paths.'
  created_at: 2026-10-13T14:53:43.357322132Z
