    Final implementation uses plain objects at the store-root cwd for BOTH status and ignore-independent ls-files --others. This replaces the initial magic-pathspec draft: GIT_LITERAL_PATHSPECS=1 disables :(...) magic and could otherwise hide dirty objects. Per-command environment regressions prove both queries retain evidence under default/literal/glob/noglob/icase modes. No process-global env mutation. Coordination/mail/timing and other non-evidence dirt permit a snapshot; modified/staged/untracked/deleted/renamed-out/replaced objects refuse. Home ledger trust/coverage remains independently fail-closed per operator clarification. HEAD/ref/worktree stability unchanged.

    Final targeted cargo test -p aida-cli-lib --lib --profile agent mandate_:251 passed/0 failed/1 ignored (existing local corpus replay), including all four BUG-2213 regressions and amended BUG-2178 timing test. An earlier completed run was250/1/1 because the older timing test expected timing-only dirt to refuse; its expectation now matches the approved scope while preserving object refusal. Final make check-ci-fast:34/34. Logs:/tmp/bug2213-targeted-pass.log and /tmp/bug2213-fast.log.

