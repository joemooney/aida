    Implementation on codex/bug-2213 uses the same root-literal objects pathspec for status and the ignore-independent ls-files --others check. Coordination/mail and other non-evidence dirt are ignored. HEAD/ref/worktree stability logic is unchanged. Regression tests cover staged new/renewed leases; modified/staged/untracked/deleted/renamed-out/replaced objects; and newly excluding or malformed home-ledger updates. One fresh-context author checker found no confirmed findings; targeted mandate_ run is currently building, so no test/fast-gate PASS or review approval claimed yet.
