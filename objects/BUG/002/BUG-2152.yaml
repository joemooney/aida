title: Relay capacity gate starves a queued relay indefinitely while any cargo build is queued
description: |-
  2026-10-15: the codex regen relay sat 'queued' from 05:04 to 06:15 (71 min) with reason 'host busy: builds queued'. 'cargo ps --capacity' denies admission whenever builds are queued, and with 4-5 fixers compiling in turn the queue never empties. The cargo wrapper already serializes builds through its slots, so the relay gate duplicates it and only delays the agent's non-build work (reading, conflict resolution, sketching). Workaround: AIDA_RELAY_CAPACITY_CMD=off.
  ## Acceptance
  - A relay queued for longer than a bound (default 15 min) is admitted even when builds are queued, provided memory and io pressure are fine; or the gate counts only CPU/mem/io, not the cargo queue.
  - The relay status shows the queued duration.
  - A test covers a persistently non-empty build queue that does not starve admission past the bound.
