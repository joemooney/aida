title: sccache server keeps a deleted per-invocation TMPDIR, so every build fails until it is restarted by hand
description: 'Observed 2026-10-14 by the advisor seat: the sccache server had been started inside a session whose TMPDIR was later deleted, so all builds failed until ''TMPDIR=/tmp sccache --start-server''. The cargo wrapper / aida dev build should start (or restart) the sccache server with a stable TMPDIR, and detect this failure mode with a clear hint.'
