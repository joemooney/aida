- id: 01a16ee9-078d-71c1-a000-e0b670d17daf
  author: ai:codex:joe
  content: 'PR-2898 round-1 rework pushed normally at 9d6d7141ebf88a2bf047a9a058342cf2747bdf45, folding superseded TASK-2326/2327/2328. Mailbox path/settings previews no longer create the mailbox; explicit runtime preparation creates it before sandbox startup. Contained Claude and OS-wrapper paths both refuse symlinked state/mailbox paths. Direct clarify, intake, burndown and headless launch seams prepare before issuing child grants. The Git-denial CI assertion had mistaken the mailbox grant for a store grant; it now distinguishes them and verifies effective Git metadata refusal across Git versions. Final checks passed: 41 bug_221 tests, 20 store-boundary tests, exact Git-denial/help/audit regressions, all 34 fast gates. No merge or self-verdict.'
