title: 'aida mailbox send fails from a sandboxed agent session: mailbox store not writable'
description: 'Observed 2026-10-24: an implementer in the Claude Code sandbox got ''error: writing message <id>'' from aida mailbox send, so lanes report to the advisor by other routes. ACCEPTANCE: a sandboxed agent can send mail. Either the mailbox write target is inside the sandbox-writable area or the send goes through a path the sandbox allows, without widening the sandbox to sensitive paths. When the send really cannot be written, the error names the path and the reason. Test with a read-only mailbox root.'
