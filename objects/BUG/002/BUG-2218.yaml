  content: 'Implemented in PR-2898 at eb9846b8f4: contained Claude and OS-wrapper launches create and grant only the shared .aida/mailbox directory, refusing symlinked mailbox or state directories without granting surrounding sensitive coordination state. Send errors name the target path and filesystem reason. Three new mailbox regressions and all 17 store-boundary tests passed; make check-ci-fast passed all 34 gates. Existing contained sessions need restart for the new binding. PR remains unmerged for independent review.'
