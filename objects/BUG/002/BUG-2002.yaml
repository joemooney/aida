title: 'agent new --spec: lease conflict is reported only after the interactive prompts, and session leases hides the blocking lease'
description: |-
  Seen 2026-10-12 while the operator dispatched rework implementers with 'aida agent new claude --bg --role implementer --spec <ID> --cwd <worktree> --prompt-file ...'.
  1. The command asks 'Continue with bypass? [y/N]', then shows the 'Resume a recent claude/implementer session?' picker, and only THEN fails with 'scope BUG-1929 is already owned by session 01a12c8dd130'. The lease check should run before any prompt.
  2. 'aida session leases' (no --all) did not list the 1-day-old BUG-1929 lease, but that lease still blocks 'agent new --spec'. The default listing and the dispatch guard disagree.
  3. There is no way to say 'continue under the existing lease' when re-dispatching the same seat into its own worktree, e.g. for a rework round. The only workarounds are dropping --spec, or 'session end', which deletes the worktree.
  4. The resume picker appears even when --prompt-file names fresh work; --no-resume exists but isn't suggested.
  Done when: the lease conflict surfaces before any prompt, with an actionable choice (adopt the lease for the same worktree, or abort); the default 'session leases' shows every lease that can block a dispatch; and the bg-dispatch help shows the non-interactive form.
