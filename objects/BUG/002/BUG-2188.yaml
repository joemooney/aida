- id: 01a157ef-5420-77e0-9adf-847fca364560
  author: joe
  content: |-
    ADVISOR RULING 2026-10-19 23:14 (on mail 1c72f6e2, transactional ownership). Choose transactional materialization + EXACT conditional rollback. Don't separate the shared-claim scope now; that's an architecture change, out of scope for a reliability bug.
    1. Pre-state receipt BEFORE each step: before git worktree add, record (under the existing setup receipt) whether path P and branch B were ABSENT. Only resources this invocation found absent are rollback-eligible. Pre-existing or adopted resources are never deleted, on any path.
    2. Failure means any nonzero exit, not just 'no tree': git worktree add can exit nonzero AFTER materializing (the post-checkout hook repro), so rollback must inspect the actual post-state, not trust the exit code.
    3. Rollback checks identity before removing anything: the tree only if P's .git file points to the gitdir this invocation created; the branch only if refs/heads/B still resolves to the start commit we created it at (git update-ref -d B <expected-sha>, compare-and-delete). Anything that doesn't match is left in place and reported with exact recovery commands.
    4. Claims: release only by compare-and-delete on the lease/claim id THIS invocation acquired. Never release a claim we adopted, or one whose id changed (a successor). No unconditional shared-claim release (you were right to remove it).
    5. Tests: the post-checkout-hook partial materialization is rolled back; a pre-existing path/branch survives a failed add; a successor claim survives our cleanup; and rollback of a resource whose identity changed is refused and reported.
    Proceed: no further sketch needed. One PR with BUG-2168, strict review.
