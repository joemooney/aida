title: A fresh headless queue-work child inherits the launcher's full grant (including delegable seats), so an advisor running implementer work headless does it with advisor authority
description: 'From the #2645 (BUG-1808) STRICT review. exec_vendor_headless (session.rs:3041) neither sets nor clears AIDA_SESSION_GRANT, so the fresh headless child runs under the launcher''s grant: same subject, same seat, same delegable_seats. AIDA_SESSION_ROLE shows the routed role but is display-only, and classify_role_display shows ''Ungranted''. This predates BUG-1808. Decide whether a fresh headless child should get a minted child grant scoped to the routed role (which would bring it under the delegation preflight) or run with a reduced grant. Security/authority review required.'
