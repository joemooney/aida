  author: joe
  content: 'ADVISOR RULING (fire mode, 2026-10-14): Least privilege. A fresh headless queue-work child must NOT inherit the launcher''s grant. Direction: mint a child grant scoped to the routed role (subject = child, seat = routed role, delegable_seats = empty), so it falls under the BUG-1808 delegation preflight; if the launcher may not delegate that seat, the launch is refused (fail closed) rather than run under the parent grant. AIDA_SESSION_GRANT is always set explicitly for the child (never inherited from env). This is an authority-path change: an implementation SKETCH on this spec (grant minting call site, lifetime/expiry, revocation on child exit, what happens to existing in-flight children) is required and needs advisor signoff BEFORE code. Approved for sketch.'
