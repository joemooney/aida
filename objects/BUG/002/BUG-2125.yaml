title: 'seat_authority tests flake: current_user_id(None) read outside the env lock while other tests set AIDA_USER'
description: 'Found by the PR #2611 r2 review. seat_authority::tests::env_role_alone_confers_no_seat_and_grants_fail_closed (:1002/:1009) and role_display_validates_the_grant_store (:1109) fail about 2-4/60 in parallel loops, including on main 014a28d3f7 without #2611. Likely cause: these tests read current_user_id(None) outside the env lock while BUG-2011/BUG-2014 tests set AIDA_USER. Fix: take the shared env lock (or pass an explicit user) in these tests.'
