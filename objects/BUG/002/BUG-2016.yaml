title: Contained launch derives the main checkout from the worktree's sandbox-writable .git pointer
description: |-
  Follow-up R1b from the round-5 advisor review of PR #2541 (BUG-1929), a1121bad7c.

  claude_contained_settings_json derives the main checkout from write_roots.first() through main_worktree_root_from (worktree_gc.rs:725), which trusts the worktree's .git pointer file. That file is inside the granted write root, so the sandbox can rewrite it. The reviewer confirmed that rewriting a pool worktree's .git to 'gitdir: <other>/.git' makes git worktree list report <other>. The next launch or resume in that worktree would then grant <other>/.aida-store and its cache files.

  This adds little on its own: a rewritten pointer already gives a host escape through other unhardened host git calls (the BUG-2012 class). But the main checkout used for write grants should come from host-owned data (the spec lease / session record), not from a file the sandbox controls.

  ## Acceptance
  - The contained launch and resume derive the main checkout from host-owned lease/session data, or verify the pointer against it and refuse on mismatch.
  - A test rewrites the worktree's .git pointer to another repo and asserts that no store or cache path of the other repo is granted (and that the launch refuses or falls back to the leased main).
  - Related: BUG-2012, BUG-1929, BUG-1971.
