    FACTORY PLAN (ANTIGRAVITY):
    1. In aida-cli-lib/src/markdown_render.rs, pass `glyphs_env: Option<&str>` into `render_for_terminal_with`. `render_markdown_for_terminal` reads `std::env::var("AIDA_GLYPHS").ok()` and passes `env.as_deref()`.
    2. In aida-cli-lib/src/tests/markdown_render_tests.rs:
       - Update existing calls to `render_for_terminal_with` to pass `None` for `glyphs_env`.
       - Add unit test `bug_2013_render_for_terminal_with_passes_computed_profile` verifying that passing `Some("ascii")` to `render_for_terminal_with` produces ASCII borders ('+-') and no Unicode box-drawing ('┌'), failing if the computed profile is ignored in favor of GlyphProfile::Unicode.
