title: 'Markdown terminal renderer: no test that the computed glyph profile reaches render'
description: |-
  Follow-up from the BUG-1979 round-4 review (PR #2566, merged ed5c5b7). A mutation that makes render_for_terminal_with ignore the profile computed by markdown_profile and always pass GlyphProfile::Unicode survives every test: 166 tests across the markdown_render, glyphs, status_display and show filters. The deleted env-mutating test was the only coverage of that step. Fix: either add a subprocess test of `aida show` that sets AIDA_GLYPHS=ascii only in the child's environment (race-free) and asserts ASCII table borders, or pass env into render_for_terminal_with so a unit test can reach it.

  ## Acceptance
  - The mutation 'render_for_terminal_with always passes GlyphProfile::Unicode' fails at least one test.
  - No test sets AIDA_GLYPHS process-wide without the shared env lock.
