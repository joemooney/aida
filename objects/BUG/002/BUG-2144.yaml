title: Contained codex/agy drain still runs its queue-work implementer and reviewer children uncontained (containment_applied silently false)
description: 'From the #2655 (BUG-2133) STRICT review, gap 1; violates the BUG-2133 ruling (containment is monotonic). Under a contained drain with vendor codex or agy, the queue-work implementer and reviewer children run uncontained: containment_applied (session.rs:1676) returns false and an existing test pins this behaviour. The implementer is the child that writes the most code. Fix: apply the BUG-2133 rule — contained requested + vendor cannot be contained => REFUSE the launch (fail closed) with a hint; update the pinning test to assert refusal. STRICT + functional verification.'
