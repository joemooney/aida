title: 'Flaky: generated_tool_help_timeout_kills_group_and_retains_reason gives zombie reaping only 1s'
description: 'aida-cli-lib/src/regen/score.rs:1058-1066 waits 1s for the killed descendant pid to stop being alive, but an orphaned zombie stays ''alive'' to pid_is_alive until init reaps it, which can take longer than 1s under CI load. It failed on the PR-2749 head 1df8b54d1d (CI 2026-10-18 22:04Z) while the PR touches no regen code. Fix: treat zombie state (/proc/<pid>/stat state Z) as dead for this assertion, or use a process-identity check, rather than lengthening the deadline.'
