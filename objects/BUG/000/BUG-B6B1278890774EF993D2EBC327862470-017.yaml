    ## Implementer finding (kind:bug-spotted, severity:minor) — could not file as draft TASK

    `aida add` failed in this contained seat: "requirement ID allocation failed: Read-only file system (os error 30)". Recording here for advisor triage.

    `aida ship <SPEC> --no-merge` refused at step 1 with a clean tree: "could not list staged files to check for sandbox stand-ins: refusing to run git in <seat>: it is a contained seat's private clone..." It also announced "committing uncommitted work" though `git status` was empty. /aida-pr names `aida ship --no-merge` as the publication path, so contained seats fall back to `git push` + `gh pr create` (used for PR #3095). `git push -u` also warned "unable to write upstream branch configuration" (push succeeded).

    Suggest: make aida ship work in contained seats, or document the fallback in /aida-pr.
