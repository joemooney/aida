  author: joe
  content: 'Implementation uses the acceptance fallback: the verified train gate drops unresolved branch-only hints only when title/commit metadata supplies a resolvable spec. Explicit unresolved and ambiguous IDs still refuse; an empty alias set now refuses too. Added production train-fixture regressions for suffixed rework branches using title/commit-trailer hints and for missing/unknown specs. Targeted tests are compiling; validation results will follow.'
