title: aida queue rework hangs until killed (180s) since ~11:12 MST 2026-11-12, so autoland reworks never queue
description: 'Autoland''s dispatch loop runs ''timeout 180 aida queue rework SPEC --for implementer'' from the operator deputy (with grant). Up to 11:12 MST it printed ''Queued SPEC''; since then 10 consecutive calls printed nothing and were killed at 180s (BUG-2525, BUG-2534, TASK-3428 x3, BUG-2538, STORY-2733, ...). The advisor''s own call for BUG-2525 also hung (killed at 120s). Each hang stalls the dispatch loop (heartbeat goes stale; reviews queue behind it). Suspect store-write lock or cache-refresh contention (''refreshing: worker_running'', ''stale: true'' seen on every command). Acceptance: (1) find the blocking wait (lock, network, prompt) and fix it; (2) queue rework fails fast with a clear message after a bounded wait instead of hanging; (3) regression test for the contended case.'
status: InProgress
priority: High
