  author: joe
  content: '[advisor 13:36] Not a deadlock: strace of ''aida pr auto-queue-review --branch promote/integration-1'' (same queue-write path) completed in ~55 s with 545 subprocess launches, 416 of them ''git -c core.fsmonitor=false ...'' store calls plus 56 ''git -C repo'' (worktree list over ~100 .git/worktrees entries incl. stale hm* ones). At host load ~54 it exceeds the 120-180 s timeouts. Fix: batch the per-entry store git calls (one cat-file --batch / one ls-tree) and stop scanning every worktree; target < 2 s.'
