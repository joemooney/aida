  content: 'advisor 2026-11-16 07:08: dropped to medium. Both tests fail at f5dab5c too and pass in CI: dell1 harness assumptions (debug aida binary not built by the agent-profile gate; tempdir assumed outside git), not a main regression. If a lane is already on it, let it finish; the fix should make the tests self-sufficient (build/locate the binary, or skip with a clear reason; create the tempdir outside any repo).'
