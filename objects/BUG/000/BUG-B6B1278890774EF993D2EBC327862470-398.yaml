  content: 'Implemented test-environment fixes in task_2712_codex_native_sandbox_tests.rs and task_1945_commit_ci_tests.rs. Resume fixture now uses /tmp rather than inherited TMPDIR and verifies it is outside Git. Relay resolves aida beside the running test profile, preserves explicit AIDA_TEST_BIN failures, and emits SKIP when an implicit CLI has not been built. Introductions: e44c9e595a (resume test), 87a182e1d5 / #3537 (relay test), before suspected recent main range. Validation via lane runner: cargo build --profile agent -p aida-cli passed; cargo test --profile agent -p aida-cli-lib --lib -- a_native_resume_uses_the_resumed_lanes_tree aida_sized_relay_native_statuses_reach_required_pr_and_train_gates executed 2 tests, both passed, 58.36s (job j20261116T140641804-2-0); relay did not skip. rustfmt --check on both files and git diff --check passed. Codegraph client at supplied absolute path is missing, confirmed by doctor; used source inspection. Native seat leaves edits uncommitted for host publication.'
