title: Two aida-cli-lib lib tests fail deterministically on main bade435 (codex native resume tree, commit-CI relay statuses)
description: 'Found by the integration seat while gating promotion 16 (p16c f73bf45). Both also fail solo at main bade435d638 (dell1, 1 of 1 runs each), so they are pre-existing on main, not promotion-16 regressions. (1) codex_native_sandbox::tests::a_native_resume_uses_the_resumed_lanes_tree panics at aida-cli-lib/src/tests/task_2712_codex_native_sandbox_tests.rs:176:5 (assertion left == right failed). (2) forge::commit_ci::tests::aida_sized_relay_native_statuses_reach_required_pr_and_train_gates panics at aida-cli-lib/src/tests/task_1945_commit_ci_tests.rs:620:5. Neither runs in the fast CI tier''s filter set, which is presumably why main stayed green. Next step: bisect on main (f5dab5c..bade435 first: train #4155 #4142/#4146/#4147/#4148, then #4126/#4133/#4134/#4141), find the introducing PR, and fix or revert. Repro: cargo test --profile agent -p aida-cli-lib --lib -- a_native_resume_uses_the_resumed_lanes_tree aida_sized_relay_native_statuses_reach_required_pr_and_train_gates. Two more that failed only under load and pass solo at both heads: lane_job a_job_that_prints_its_env_shows_only_allow_listed_keys and seat_clone task_2053_bwrap_an_empty_gitmodules_placeholder_does_not_block_salvage (load flakes, cf. BUG-...-387).'
