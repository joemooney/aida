title: aida queue move <id> reports ✓ Moved even when <id> is not in the queue (silent no-op)
description: |-
  `aida queue move <id> --after <anchor>` returns success and prints `✓ Moved <id> in queue` even when `<id>` is not in the queue — a silent no-op. The anchor-side is checked correctly; the target-side is not.

  ## Observed — 2026-05-19

  During a strategic queue reorder:

      $ aida queue move BUG-241 --after STORY-333
      ✓ Moved BUG-241 in queue                ← false success
      $ aida queue move BUG-245 --after BUG-241
      Error: BUG-241 is not in the queue      ← correctly errors

  BUG-241 was Completed (not queueable). The first move *should* have errored; instead it printed success, leaving the operator thinking BUG-241 was at position 2 when it was nowhere in the queue.

  ## Inconsistency

  - `aida queue move <not-in-queue> --after X` → **silent success** (bug)
  - `aida queue move Y --after <not-in-queue>` → correct error

  ## Fix

  Check the target is in the user's queue before reporting success. If it's Completed/Rejected, hint at `--force` (the same hint `aida queue add` uses). If it's just not queued, suggest `aida queue add` first.

  ## Acceptance

  - [ ] `aida queue move <not-in-queue>` errors instead of printing `✓ Moved`
  - [ ] Error message distinguishes "not in queue" vs "terminal status — pass --force or supersede"
  - [ ] Test: move on absent spec errors; move on Completed spec errors with the --force hint

  ## Origin

  2026-05-19 — observed during the keystone-reliability queue reorder.
