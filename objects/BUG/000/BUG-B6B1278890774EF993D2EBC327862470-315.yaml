title: Merge-time auto-bump runs twice for one merge; duplicate completions conflict on store pull and block every reviewer pickup
description: '2026-11-12 20:27 MST: #3775 merged as 2a62f92. Two auto-bump runs ~70s apart (03:28 origin, 03:29 local) each completed BUG-2517 and STORY-2712 and appended timings/*.json. The rebase conflicted on the timings JSON (non-mergeable path) and on the spec YAMLs. ''aida db sync --pull'' failed, and every ''aida queue work PR-N --role reviewer'' then refused at pre-pickup pull (review deputy stalled ~25 min). Fixed by hand: rebase, union-merge of timings publishes/events, keep upstream for the duplicate bump. Fix: make the auto-bump idempotent per (spec, completion_sha), so the second run no-ops when the spec is already Completed at that sha; make timings/*.json union-mergeable (merge driver or per-event files). Related: review-watch mailed ''PR-3907 ready to ship'' while the train refused it because its approval was bound to 109b770 (another PR''s head).'
