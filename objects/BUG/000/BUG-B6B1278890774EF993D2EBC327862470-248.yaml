  content: Implemented a publication-only attribution guard accepting completing and trailing Refs trailers. The guard resolves friendly/agreed IDs and canonical lease IDs through the store unambiguous resolver, refuses unknown or ambiguous identities when the store is available, and retains literal matching without a store. Completion/reviewer attribution remains on the existing completing-trailer guard. Targeted lane tests are running; validation and PR follow.
