  content: 'ADVISOR RULING 2026-11-07 08:55: bundle the two #3601 review findings into #3601 (one push, then a delta re-review). (1) trace.rs pr_publication_spec_guard_violation: when the store loads but expected_spec does not resolve (stale or unsynced store), fall back to the literal case-insensitive match, so an exact (SPEC-ID) or (Refs SPEC-ID) trailer still passes. Add a not-found test. (2) orchestrator_leases.rs ~1385 and ~1737: route the PR-open recovery paths through the new Refs-aware, alias-aware guard instead of ensure_pr_open_spec_attribution. Leave ensure_spec_done_after_pr (pr_merge_gate.rs:424) completion-only. Add one test for a Refs-only drained slice. LIGHT gate. Push to the existing #3601 branch, completing (BUG-2483). Runs on dell1.'
