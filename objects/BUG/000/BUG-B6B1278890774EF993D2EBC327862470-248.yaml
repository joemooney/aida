title: 'aida ship PR-open guard refuses Refs-only slices: (Refs ID) trailers are not counted as attribution'
description: 'run_pr_open_spec_guard (aida-cli-lib/src/trace.rs) refuses to open a PR unless a commit carries a completing (SPEC-ID) trailer. extract_spec_ids_from_commit does not count ''(Refs SPEC-ID)'', so every Refs slice (the normal multi-PR pattern) is refused with ''no commit on this branch carries a (SPEC-ID) trailer at all''. Repro 2026-11-07: branch story-2325-prc, commit 7408ec769f ''[AI:codex] refactor(ownership): cut over train and review readers (Refs STORY-2325)''. The dell1 codex lane punted on it and ''aida ship STORY-2325 --no-merge'' on the home host refused the same way; the advisor opened the PR with gh. Also check: the comparison is a literal case-insensitive string match, so a node-local friendly label (STORY-2325) never matches a canonical lease scope (STORY-b6b...-323) on another node. Acceptance: a Refs trailer naming the leased spec, by friendly label or canonical id, passes the guard; a trailer naming a different spec still refuses; tests for both.'
status: Approved
priority: High
