    (3) AC2: the bounded 5s writer-timeout branch reports the holder PID + command when they're visible, with a test.
    DEFERRED (do NOT implement; product files a follow-up): holder diagnostics across PID namespaces, and a fallback for unreadable cmdline. Printing "holder unavailable" there is fine.
    Fallback if still blocked after this round: the smallest fix (don't hold the lock across the wait) + test (2).
    One targeted cargo run, then `make check-ci-fast`, then push on the existing branch (#4481). COMMIT your work.
