title: A lane launch waiting for a cold-start slot holds the store write lock for the whole wait, deadlocking every other store writer on the host
description: |
  Found 2026-11-23 19:18 MST on dell1 (product-15). A lane parent `aida queue work BUG-2738 …` held an EXCLUSIVE flock on ~/ai/aida/.aida-store/.aida/store-write.lock (/proc/locks: FLOCK WRITE 825645) for over an hour, while it was only WAITING to launch ("lane launch queued: host cold-start limit reached (lanes.max_concurrent_cold_starts = 2)"). Every other store writer on the host blocked behind it:
  - other lanes' pre-pickup pulls failed ("pre-pickup pull failed … resolve the store sync failure"): BUG-2734, TASK-3852;
  - BUG-2736's lane timed out after 120s on the store write lock;
  - BUG-2737's finished lane could not persist its exit evidence ("lane recovery … needs retry: failed to persist captured lane exit evidence … Timed out after 120s waiting for the store write lock").
  That is a DEADLOCK: the waiting launch holds the lock the finishing lane needs, and the finishing lane holds a cold-start slot until it finishes. No codex agent was running on the host. Resolved by SIGTERM to the waiting parent (it had no agent and no work).

  ## Acceptance
  - AC1: Lane admission waits (cold-start limit, memory/disk headroom, any queue wait) do NOT hold the store write lock. The lock is taken only around the actual store mutation and released before waiting. Test: a launch blocked on the cold-start limit doesn't hold store-write.lock, and a concurrent store write succeeds.
  - AC2: A store-lock timeout error names the HOLDER (pid plus command line) so this is diagnosable without /proc/locks. Test.
