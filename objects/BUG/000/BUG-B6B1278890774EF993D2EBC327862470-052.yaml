  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (AC1):** grant seat=product delegating {advisor,implementer}, requested=product → refusal contains `role enter product`, not `role enter advisor`, exactly one `role enter`. No grant → says no grant is active and names `aida role enter advisor --delegate-seat <seat>` (keeps standing order 8 in sync).
    - **Unit (AC2):** same fixture → command carries `--delegate-seat advisor --delegate-seat implementer --delegate-seat product`. Pure helper `widen_delegation_command(parent_seat, delegable, requested)`.
    - **Unit (AC3):** picker rows: a new `not_delegated` annotation renders `(not delegated: <cmd>)`; resolve_child_role refuses a marked selection immediately after the picker, before any session/resume prompt.
    - **Existing (AC4):** bug_2002_launch_lease_tests / bug_1808 stay green; preflight still runs before lease/setup.

    ### Expected files
    - `aida-cli-lib/src/gate/seat_authority.rs` (shared command helper, inner hint)
    - `aida-cli-lib/src/agent_launch.rs` (preflight message)
    - `aida-cli-lib/src/role.rs` (picker annotation + selection refusal)
    - `aida-cli-lib/src/tests/bug_2002_launch_lease_tests.rs` (tests)

    ### Ambiguities / conflicts as questions
    - None. Roster refusals (grant delegates the seat but roster denies it) get no re-entry command, since re-entering cannot fix them.
