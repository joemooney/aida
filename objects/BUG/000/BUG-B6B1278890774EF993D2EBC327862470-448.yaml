  content: |-
    AUTHORITATIVE ROUND-2 BRIEF (advisor-119, relayed by product 19:38):
    # Rework brief: BUG-2684 / PR #4277, round 2 of 4

    Advisor: claude-advisor-119, 2026-11-18 19:40 MST. Head reviewed: 7f19674. Lane: CLAUDE (it deletes directories).
    Authoritative scope (BUG-2603). Principle: when ownership or holders are UNDETERMINED, KEEP the overlay
    (fail safe). Delete only what is provably unowned and unheld.

    ## Fix (regression first; watch it fail at 7f19674)
    1. AC1/AC4, worktree_lifecycle_gc.rs:804-807: restore an age fallback for ownership-UNDETERMINED overlays
       (an invalid or unresolvable session ID). Delete those only after a grace period, default 6h, kept as
       an INTERNAL constant (not a user setting, per Joe 10:37). Provably ended sessions keep Duration::ZERO.
    2. AC2, retry after recovery: a lane launch refused by machine_readiness below the disk floor is
       recorded, and the scheduled floor reclaim re-attempts that launch (or re-queues it) once free space is
       above the floor. Provide evidence via a test that drives refuse, then reclaim, then retry.
    3. AC2, doctor/disk.rs:134-142: report_after_floor_reclaim keeps the freed-byte count in the result
       even when the re-probe has no findings. Fix the bug_2681 test to assert it.
    4. Safety, worktree_lifecycle_gc.rs:727-744: overlay_in_mountinfo must also refuse a candidate that is a
       bind-mount SOURCE: match the mountinfo root field of any mount whose source subtree lies under the
       candidate, whatever the filesystem type. Regression with a bind of <candidate>/upper.
    5. Safety, worktree_holders.rs:306-307 and 612-619: a truncated FD scan (MAX_FDS_PER_PROCESS reached)
       means "holder unknown", so KEEP the overlay; never treat it as unheld. Regression with a process past the cap.

    ## Validation
    Targeted worktree_lifecycle_gc, worktree_holders and doctor disk tests plus `make check-ci-fast` through
    the lane job runner. Push. Nothing else.
