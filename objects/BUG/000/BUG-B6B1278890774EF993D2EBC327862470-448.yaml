    ## Implementer self-review
    Reviewed HEAD: 9f2f93cc432277dadb7781e7ddefe397bdc65b81, plus the uncommitted native-seat diff. The merge-base diff was empty and there were no untracked additions.

    - AC1: [evidence: behavioral-test] `worktree_lifecycle_gc.rs::bug_2684_floor_reclaims_ended_overlays_by_ownership` proves fresh ended overlays are reclaimed and overlays with a lease, a cwd holder or an open fd are retained. The existing dirty-worktree and live-lease revalidation tests passed.
    - AC2: [evidence: behavioral-test] `bug_2681_scheduled_floor_breach_reclaims_lane_overlay` proves the existing bounded overlay-only scheduled guard reclaims a fresh overlay and re-probes free space. A still-low finding carries its freed-byte estimate. Recovery telemetry for successful guard runs and automatically retrying an already-refused launch remain open. The broader scheduled lifecycle apply path is a separate STORY-2711 authority decision.
    - AC3: [evidence: behavioral-test] `bug_2651_orphan_overlays_reclaim_but_seat_targets_remain_report_only` exercises removal of the kernel-style mode-zero scratch directory through the existing pinned-handle remover.
    - AC4: [evidence: behavioral-test] The ownership regression covers fresh, held, leased and invalid-ID directories. `bug_2684_mount_inventory_retains_direct_and_private_overlay_mounts` covers escaped mount paths, host and private inventories, and component-prefix siblings. Invalid-ID directories are retained by identity under the binding advisor brief.

    Adversarial pass covered exact lease IDs, byte-oriented procfs escapes, empty and multiple inventories, prefix siblings, root symlinks, raced lease creation and caller-held descriptors. Early runs over-retained fresh overlays. The corrected scan handles the kernel's EINVAL when opening mountinfo for a task without a mount namespace. Unreadable process details still limit what the host can observe. The general GC apply authority checks were reviewed and exercised by the existing authority test.

    Lane job j20261119T014424123-2-0 ran 30 tests, all passed. All seven structural checks, cargo fmt --all -- --check and git diff --check passed. The configured CodeGraph client was missing. Source navigation used rg. Exact publication-head CI is pending host publication.
