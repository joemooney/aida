title: worktree gc keeps ended lane overlays younger than 6 h, so a busy lane host breaches the disk floor within ~90 min (82 GiB unreclaimable on dell1, 2026-11-18 08:46)
description: |
  Follow-up to BUG-2681 (landed e207f1f, live on dell1). On 2026-11-18 08:46 MST dell1 dropped to 37 GiB free (floor 60) with 7 lanes running, so lane launches were refused. `aida worktree gc` (dry run) retained all 11 large lane overlays (82 GiB) as "created or changed in the last 360 minutes; retained", although every one belongs to an ENDED session: no session lease, no overlay mount, no process cwd inside (verified by product). Lanes now start, end, salvage and relaunch within an hour, so a fixed 6 h age guard keeps nearly all reclaimable cache exactly when the disk floor is breached. The operator had to approve manual deletion twice in 4 h (04:41, 08:46).

  ## Acceptance
  1. For lane-overlay candidates, gc's eligibility is ownership-based, not age-based: the owning session has ended (no lease file), the overlay is not mounted, and no process has its cwd or open fds inside. Then the overlay is eligible regardless of age. The age guard (configurable, default 6 h) still applies to overlays whose ownership can't be determined.
  2. The disk guard (STORY-2711) runs `worktree gc --apply` for these when the host is below the floor, logs freed bytes, and the lane launch it refused is retried automatically.
  3. bwrap overlay `work/work` dirs (mode 700) are made removable (chmod u+rwx) before removal; no sudo needed.
  4. Tests: an ended young overlay is reclaimed; a mounted or cwd-occupied young overlay is kept; an unknown-owner young overlay is kept by the age guard.
