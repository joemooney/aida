    Findings:
    1. [P1] Preserve uncollected review drafts before automatic teardown (aida-cli-lib/src/queue_cmd/work.rs:7236-7240). The new reap_without_verdict path treats every failed collection like a missing verdict. A reviewer may have written a complete draft, but parent recording can fail after its bounded retries (for example a transient store/grant failure), or validation can reject the draft. LaunchDraft stores the only draft under worktree/.aida/review-verdicts/draft-UUID/draft.json (review_draft.rs:61-81), which .gitignore excludes. Thus the clean-tree and published-commit checks pass, and reap_finished_review force-removes the checkout, deleting the draft and all its findings. run_standalone_reviewer explicitly promises to retain a terminally failed validated draft and later reports that the rejected draft is retained at that now-deleted path (work.rs:7906 and 8065). Retain the checkout when an unconsumed handoff exists, or durably preserve the draft and recovery binding outside the disposable checkout before removal. Ensure next-head pickup also cannot discard that retained handoff. Add a real-launch regression with a present draft and failed parent collection proving that its full contents remain recoverable; keep a separate genuinely-missing-draft cleanup case. This finding does not depend on scripts/store-writers.toml or code changed by the four newer base commits.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
