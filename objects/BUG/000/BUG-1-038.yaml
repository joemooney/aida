spec_id: BUG-1-038
title: aida history default mode was per-event chronology, slow and noisy
description: |-
  **Reported by user:** the chronological per-event view (one line per status change / comment / etc.) was the wrong default. Took 6+ seconds, scattered each requirement's activity across many lines, and didn't answer the actual user need: 'when I return to work on the project, get a sense of what I was up to previously'.

  **Fix:** Added a fast digest mode (default) that gives one row per recently-touched requirement, sorted by last-touch time, with current status + title. Original per-event view moved behind --events flag for users who want full chronological detail.

  Speed: 118ms (digest, 250 commits scanned in one git call) vs ~3.5s (--events --oneline, 5 events) — 50x improvement on the default. The digest does a single 'git log --name-status' pass + one filesystem read per surfaced requirement, vs --events which still shells out to 'git show' per file per commit.

  Output now matches what 'aida status's Recent activity section looks like, but with more rows and column-aligned.
