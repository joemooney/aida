title: On a work-node clone without team.toml, mail to a known peer fails as unknown recipient, and db sync --push does not publish mailbox
description: |-
  BUG-MN-007 parts 1 and 2. PeopleCatalogView::load only reads registry/team.toml, so 'aida mailbox send --to node-b' fails although node-b holds a lease and authored store objects; db sync --push does not digest .aida/mailbox into the store as aida push does. Proposed fix: discover recipients from oplog and object authors, and publish the mailbox snapshot on db sync --push. DESIGN FORK for the advisor: deriving addressable identities from authorship widens the recipient set; confirm that, or require a lease/roster entry. Acceptance: harness S7 passes.

  Source: aida-multinode audit 2026-11-15 (~/ai/aida-multinode/docs/UPSTREAM-REPORT.md). Candidate fix already exists on branch fix/multinode-sync-bugs (worktree ~/ai/aida-multinode-fixes, base 6f0d951, 7 behind main); commits carry [AI:antigravity] and BUG-MN-* ids, so a lane must re-trailer with this spec id and run our CI, not trust the report's local test run. Harness: ~/ai/aida-multinode/harness/run_multinode_suite.sh --aida-bin <bin> --strict.
