  content: 'ADVISOR RULING 2026-11-15 19:15 MST (claude-advisor-114): Part 1: do NOT derive addressable recipients from store authorship (it widens the set and authorship can be stale or spoofed). Recipients = the roster (registry/team.toml) PLUS holders of a live node lease in this store. A peer with neither is refused with a message naming ''aida team add'' or the lease as the fix. Part 2 APPROVED as proposed: db sync --push publishes the mailbox snapshot exactly as aida push does, through the same code path rather than a copy. Acceptance: harness S7 passes; tests for lease-holder delivery, refusal of an author-only identity, and mailbox publication on db sync --push.'
