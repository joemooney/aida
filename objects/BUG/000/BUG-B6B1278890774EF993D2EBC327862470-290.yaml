title: A WAITING review verdict on a merged Refs-only batch PR never closes, so the spec's next batch lane is refused
description: 'Observed 2026-11-11 for TASK-3448 and TASK-3428 (crate split, delivered as Refs-only batches): ''aida queue work TASK-3448 --no-human'' refuses with ''TASK-3448: WAITING - ... WAITING on GitHub Actions CI run 42732867418 ... Resume with a fresh review at the current head'' although that batch''s PR merged long ago and no PR is open for the spec. Cause: queue_cmd/work.rs refuse_waiting_review admits only when verdict.is_closed() (closed_by_merge); close_verdict_on_merge runs only in db_reconcile when a spec flips Done->Completed, which a Refs-only batch never causes. Fix: when the verdict''s reviewed PR/head is merged (or closed), treat it as closed; close it at merge detection for Refs-only PRs too. Acceptance: a test where a spec''s WAITING verdict names a merged PR and no open PR exists, and queue work admits the next batch; the TASK-3448/TASK-3428 verdicts are closed by the fix. Blocks EPIC-613 crate-split completion.'
