    Implemented via PR-N (commit 9587cbd2):

    - GitBackend::save() now mirrors the load-side skip-and-warn policy: parses each file before deleting it from the orphan-sweep set. Unparseable files are preserved and listed in a single warning line.
    - Two regression tests in aida-core/src/db/git_backend.rs: test_save_preserves_unparseable_object_files (bare case) and test_save_preserves_unparseable_alongside_new_add (the 2026-05-13 incident shape: `aida add` adjacent to unparseable files).
    - docs/git-workflow.md gained a "Safety guarantee (BUG-96 fixed)" subsection inside the STORY-86 recovery story.

    Test status: 25/25 db tests green; `cargo fmt --all -- --check` clean
