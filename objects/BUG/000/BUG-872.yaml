title: pacing last-output age resolves the previous attempt's log — current session id must win
description: 'Observed 2026-09-06 05:38: drain status showed phase 3 spec 12s but ''last output 14m ago / quiet 14m'' while the reviewer session was demonstrably alive — the last-output probe picked .aida/headless-logs/bug-862-2-<old-session>.jsonl from the PREVIOUS attempt (mtime 05:07) because it resolves newest-file-matching-spec instead of the CURRENT session id from drain-state. A retried spec always has older sibling logs, so every retry shows a false quiet warning until the new session writes. Fix: resolve the stream log by the active session id recorded in drain-state (the tail-drain resolver should take the same rule); fall back to phase-entry time, never an older session''s mtime. Acceptance: synthesized state with an old attempt log + a newer active session id shows last-output from the active session''s log or the phase-entry fallback; unit test on the resolver choice.'
