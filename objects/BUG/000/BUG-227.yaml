    Discovered out-of-scope finding for dialog triage: ~60 *bare* SPEC-IDs (no 'trace:' prefix) are still woven into help-text prose — e.g. 'Bypass the TASK-45 guard', '(EPIC-26)', 'pre-TASK-111 behavior', 'STORY-86's pull-time auto-bump'. These ALSO violate TASK-268 but can't be fixed by /// -> // demotion (the ID is mid-sentence — needs rewording). Worth a separate TASK: 'Audit bare SPEC-IDs out of aida --help prose'.
