  content: |-
    TRIAGED 2026-07-08 (operator decision: substrate guard + prompt fix). Re-characterized after code verification:

    NOT a design hole in zens contract. aida pr ship is BY DESIGN the direct-publish path ("human-pre-approved work that doesnt need the orchestrators review phase", pr_ship.rs:5). The implementer pickup skill correctly says: open the PR with /aida-pr, then exit — never merge (aida-pickup.md:405,585,833). The codex implementer instead ran aida pr ship (full self-merge) INSIDE an orchestrated drive, bypassing the phase-3 independent reviewer.

    Two contributing causes (both verified): (1) NO substrate guard — aida pr ship never checks whether it is inside an orchestrated drive; (2) codex-prompt conversion gap — ~/.codex/prompts/aida-pr.md:15 points at .claude/skills/aida-pr.md (a claude path codex cannot read), so codex never got the open-PR-only workflow and free-lanced. (2) is split to its own bug.

    Acceptance (the substrate guard — substrate-as-bouncer):
    - aida pr ship REFUSES its merge step when AIDA_HEADLESS=1 (the unattended orchestrated-implementer signal): "youre inside an orchestrated drive — open the PR and let the orchestrators reviewer gate the merge." This closes the actual (unattended) bypass.
    - The refusal is OVERRIDABLE by one explicit opt-in (a --force flag or env) for a genuine headless direct-publish, per the faithful-launcher one-knob rule.
    - Push/create-PR steps still run (the implementer SHOULD open the PR); only the auto-merge is gated.
    - Extension (note, not blocking): supervised (interactive) orchestrated implementers arent covered by AIDA_HEADLESS — a dedicated AIDA_ORCHESTRATED_IMPLEMENTER signal on both launch paths would close that too. Deferred: supervised has a human watching.
