  summary: 'BUG-2778 approved; CI was still pending at review time. AC1 verified: the lane-reuse (dispatch.rs:2547) and rework-reclaim (queue_cmd/work.rs:4251) pre-start sites wrap the retention gate in retry_transient_admission. That is 3 tries with 100s/150s waits jittered by up to 20% (about 3-5 min), and each try re-runs the full fresh scan. Only a refusal whose every unverified writer is on a deleted or stale binary retries. A live other-build writer, an unreadable exe, an incomplete scan or a missing self identity gives transient=false and fails closed at once. The final outcome is always the scan''s own verdict, so nothing can fail open. AC2 verified by a_deleted_binary_writer_is_named_and_transient and a_live_unknown_writer_is_named_and_never_transient: each writer is named by pid, comm, exe path or ''(deleted)'', short sha, and deleted/stale/live kind. AC3 verified at helper level by transient_then_verified_on_retry_lets_the_launch_proceed, persistently_transient_refuses_after_three_bounded_tries and a_live_unknown_writer_fails_closed_without_retry. Serde compatibility holds: the enum is internally tagged (''kind'') and the new fields are #[serde(default)], so old journal entries still parse. Retry is safe: a refused retirement reopens the source, destroy re-probes holders, and the lane-reuse path rechecks occupancy before checkout. Bug protocol: met, the PR touches test files (new bug_2778_admission_retry_tests.rs, plus edited message_state_tests.rs and story_1843_c2_refusal_tests.rs). Stale base: main''s work.rs change (BUG-2776 reclaim_retained_review_tree) does not overlap the touched hunk, and the landed tree is clean. Non-blocking follow-ups: wiring test gap (p3, not authority code), duplicate salvage on retry, final-message wording.'
