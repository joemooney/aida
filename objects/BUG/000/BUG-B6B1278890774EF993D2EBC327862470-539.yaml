  content: |-
    ## Implementer self-review
    Reviewed HEAD: 70b9880abb (git diff origin/main...HEAD).
    Acceptance: AC1 retry at the pre-start retention sites (lane reuse in dispatch.rs, rework reclaim in queue_cmd/work.rs) via guard::retry_transient_admission: 3 tries, waits 100s/150s +/-20% jitter (about 4-5 min). AC2 RefusalReason::WriterAdmissionUnknown now names each unverified writer (pid, comm, exe path or '(deleted)', short sha) and whether it is on a deleted/stale binary. AC3 tests in aida-core mailbox_lifecycle::bug_2778_admission_retry_tests (6, pass; 196/196 mailbox_lifecycle tests pass); make check-ci-fast exit 0.
    Probes: fail-closed preserved, since the retry only delays and the final outcome is still the refusal. A live writer on a present other-build binary, an unreadable exe, an incomplete scan or no self identity all set transient=false and are never retried. The new serde fields are #[serde(default)], so old journal reasons still deserialize. The stale check reads the exe path's current inode, so an exe path that has vanished counts as stale (transient).
    Residual risks: only the two pre-start sites retry, and the incident's exact path isn't confirmed; other pre-start retention callers (seat_clone failed-clone cleanup) still refuse once. The retry blocks the launching thread for up to ~5 min.
