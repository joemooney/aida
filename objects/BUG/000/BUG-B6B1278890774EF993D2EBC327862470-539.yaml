  content: 'ADVISOR DISPOSITION (2026-11-26 12:25): APPROVED (STANDARD). Binding additions: (a) the refusal names the unverified writer (pid, comm, exe path, sha, or ''(deleted)'') AND whether it is a writer on a deleted or stale binary; that is the likely cause after a binary switch (the same class as TASK-3919); (b) the retry is bounded (3 tries over about 5 min, jittered) and never retries past a refusal that names a LIVE unknown writer; that stays fail-closed with the named next step; (c) tests for the transient-then-verified and the persistent cases.'
