    - Duplicate salvage on retry: in reclaim_exited_branch_clone (aida-cli-lib/src/queue_cmd/work.rs:4251) each retry re-runs seat_clone::destroy. For a clone whose only unpublished state is checkpoint refs (not unshipped), destroy_inner salvages before it reaches the retention gate (seat_clone.rs, 'facts.unshipped() || checkpoints' branch), so a transient refusal that retries writes
    - Wording: when the retries are spent on writers that run a deleted binary, the final error still says they 'should exit on their own' (retire.rs WriterAdmissionUnknown Display). Its only next step is the dry run. A long-lived old-binary MCP or server process does not exit by itself, so the final refusal should say how to stop or restart the named pid.
