title: Fresh clone silently reads legacy requirements.yaml instead of the git-canonical store (shows stale pre-migration data)
description: 'FOUND via empirical clone dogfood 2026-05-31 (operator: ''test with a new clone''). A freshly-cloned distributed AIDA project has .aida/config.toml (mode=distributed) + origin/aida-store but no local .aida-store/ worktree (gitignored, created only by aida init). detect_distributed_store() requires the worktree to EXIST, so it returns None, and dispatch falls through to determine_requirements_path() → finds the legacy requirements.yaml committed on main → ''aida list/status/findings/queue'' silently show STALE pre-migration specs (FR-0001 era) in the old format, with zero signal anything is wrong. Worst failure mode: plausible wrong data. FIX: when distributed mode is declared but the worktree is unresolvable, refuse the legacy fallback and bail with a clear ''run aida init'' message (aida init''s handle_init_post_clone bootstraps the worktree from the aida-store branch). Verified: post-init the clone sees the real backlog + findings + queue.'
