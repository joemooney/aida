    ## Implementer self-review
    Reviewed HEAD: 6146f23bada818708f8ae4e642f4e14bb1cf64e0; git diff origin/main...HEAD is empty in this native lane. Reviewed git diff HEAD and the untracked aida-cli-lib/src/vendors/headless_bash_probe.rs together.
    AC1: [evidence: behavioral-test] aida-core/src/vendors/headless_posture.rs:71 adds Bash only with mandatory sandbox settings and an existing absolute Edit grant. Both headless_bash unit tests passed through the lane runner; missing/false sandbox settings, empty grants, deny preservation and idempotence are covered. Actual Claude command execution remains unverified because of the authentication blocker below.
    AC2: [evidence: behavioral-test] aida-cli-lib/src/session.rs:7464 gates the work child on the probe, after resolving inherited containment. vendors/headless_bash_probe.rs:18 uses the existing launch adapter and attested wrapper route when selected, with no work grant, a fresh session, bounded time/output, reservation cleanup and session end recording. bash_probe routing and correlated-result refusal tests passed; final diagnostic-order change is being rechecked.
    AC3: [evidence: behavioral-test] aida-core/src/vendors/headless_posture.rs:199 adds opt-in headless_bash_git_status_conformance. Executed it twice via the lane runner. It fails before any Bash tool call: Claude 2.1.319 reports HTTP 401 authentication_failed, OAuth access token expired. Host credential refresh and a successful rerun are required; this is missing acceptance evidence, not a claimed pass.
    AC4: [evidence: documentation-inspection] The preceding cause comment identifies the inline settings and dontAsk flag, the October 21 BUG-2201 commit documenting reliance on sandbox auto-allow, and the November 17 observed onset. Exact harness-version onset is unknown; original primary-host logs were not available here.
    Adversarial probes, each touched file: checked string/path normalization; JSON and missing/wrong-type settings; 0/1/N grants, tool calls and results; empty/malformed/duplicate/mismatched/error/denied event streams. Fixed inherited-containment probe bypass, unbound probe reservation cleanup and diagnostic ordering so permission denials are inspected even on nonzero child exits. Authority paths: the Bash allow requires the existing mandatory sandbox; explicit denies remain intact. The probe gets an empty grant and wrapper receipts are required. Existing tests were not weakened or disabled. Vendor-routing ratchet: three targeted tests passed. Portability lint in the new fixture was fixed and its check passed. Fast gate and final targeted rerun are finishing.
    Residual risks: live Claude conformance and integrated wrapper probe execution are unverified; the exact historical Claude transition is unknown. No reviewer verdict recorded. Leave this item incomplete and publish only with Refs until the live acceptance gap is closed.
