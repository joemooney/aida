title: CI 'Install Linux dependencies' step times out (5 min) and fails the lane before tests run; the train ejects on it as if it were a red test (twice on 2026-11-17)
description: |
  Observed 2026-11-17 twice within an hour. The CI step 'Install Linux dependencies' hit its 5-minute timeout, the lane's tests never ran, and 'Test time budget' then failed with FileNotFoundError target/test-run.log. Once in PR #4229's full run 44203192230 (CI lib-0, 23:55Z) and once in train PR #4240, run 44208975588 (CI rest, 00:35Z), which ejected #4229 from the train. The 11-11 incident (BUG-2526: apt-get update hung to the 40-min timeout) is the same class.

  Impact: each occurrence costs a full CI rerun (~20 min) and, inside a train, an ejection and a retrain.

  Acceptance: (1) The dependency install step retries with a bounded per-attempt timeout (and/or uses a cached apt archive or a preinstalled runner image) so a slow mirror doesn't fail the lane. (2) A failed install step is reported as an infrastructure failure, distinct from a test failure, so the train retries the CI run once instead of ejecting. (3) 'Test time budget' doesn't raise FileNotFoundError when tests never ran; it reports 'tests did not run' instead.
