- id: 01a1ec22-10b1-70c0-a5c9-3bac18d9c33c
  author: joe
  content: 'Advisor diagnosis 2026-11-17 17:55 (third hit, train #4241 CI gates, job 134485828974): the step does NOT hang. The us-east-2 ec2 Ubuntu mirror is slow (single packages take 2-20 s) and the install pulls 100+ packages (libgtk-3-dev''s tree), so it simply runs past timeout-minutes: 5. Ruling for the fix, fasttrack, one PR: (a) add --no-install-recommends to the install, (b) cache /var/cache/apt/archives with actions/cache keyed on the package list, (c) raise timeout-minutes to 12 while keeping BUG-2526''s Acquire timeouts so a real outage still fails fast. Keep CI''s step bodies in sync with the Makefile targets that run them (make check-ci-list). Mode: drain (CI plumbing; the mandate now covers protected paths).'
