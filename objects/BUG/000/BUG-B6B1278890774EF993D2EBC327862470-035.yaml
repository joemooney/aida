    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (git fixture):** `git_log_messages` with a head branch that exists only on origin (bare remote, no local branch) resolves to `origin/<base>..origin/<head>` (fetching the head ref when the remote-tracking ref is also missing) and returns the trailered messages — covers AC1 and AC3.
    - **Unit (git fixture):** an unresolvable head returns an Err whose message names the range — covers AC2 at the helper layer.
    - **Code path (AC2, auto-queue):** review_gates.rs stops `unwrap_or_default()`-ing the git log error; it returns `skipped_needs_attention` naming the range instead of the "no trailers" skip.

    ### Expected files
    - `aida-cli-lib/src/lib_part5.rs` (git_log_messages ref resolution)
    - `aida-cli-lib/src/review_gates.rs` (error surfaced, not swallowed)
    - new test module under `aida-cli-lib/src/tests/`

    ### Ambiguities / conflicts as questions
    - None — fixing inside `git_log_messages` covers all three callers (auto-queue, review prompt, criteria cite).
