  Reported by the integration seat 2026-11-15 16:25 while gating promotion 15: the aida-cli-lib doctor test for bug_home_036 (bare_id) FAILS at integration head efc9261 AND at base c51e6d2, whose tree is identical to main 103b230. So it is pre-existing on main, not caused by PR-4038.
