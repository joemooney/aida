  content: 'Integration seat, 2026-11-15 18:05 MST. Likely the same root cause as 5 aida-cli integration tests that fail deterministically on dell1 at BOTH efc9261 (with PR-4038) and base c51e6d2 (3/3 runs each): bug_2017_cli_local_and_global_refusals, bug_2017_audit_ids_cli_exits_2..., story_1742 explicit_store_overrides_cannot_bypass_a_profile_in_either_clone, task_1736 fresh_or_missing_grant_is_silent and near_expiry_grant_warns_and_refuses_a_launch. Panic at bug_2017_allocation_policy.rs:133: blocks.save().unwrap() -> ''global ID/block allocation requires an explicitly authoritative clone; this clone may allocate only node-local IDs''. So the tests are not hermetic: they read some ambient node or clone authority state on dell1. There are no AIDA_* env vars and no ~/.config/aida on dell1. They passed at c51e6d2 earlier today, so the ambient state changed. Not a PR-4038 regression.'
