  author: dirtlab
  content: 'Fixed show_note_names_the_local_twin_of_an_agreed_bare_id fixture setup. Production write_object performs allocation admission when any ancestor has .git; this host has /tmp/.git. Read-only signpost fixtures now serialize already allocated objects directly and create their own .git marker so clean CI reproduces the trigger. Red/green verified through lane jobs: original writer plus marker failed (2 passed, 1 failed; missing node binding), fixed fixture passed all 3 tests (job j20261116T170419028-2-0). All 26 tests.test_ci_test_shards tests passed; rustfmt --check and git diff --check passed. CI dynamically partitions all listed library tests, including doctor_cmd, so no shard-list change needed. Edits remain uncommitted for native host publication. Reviewed codegraph client was absent at the supplied absolute path; doctor confirms missing, source navigation used rg.'
