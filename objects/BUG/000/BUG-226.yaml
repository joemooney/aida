title: Headless reviewer skipped verdict-file write for PR-65; orchestrator exited silent
description: "The headless reviewer (\\`claude -p\\` running \\`/aida-review --pr 65\\`) completed a full review of PR-65 — posted a substantive consolidated comment with verdict PASS, evidence per acceptance area, recommendation \\\"merge\\\" — but **did NOT write \\`.aida/review-verdicts/PR-65.json\\`**. The orchestrator (phase 3) read no verdict file and exited silently without surfacing why.\n\n## Symptoms\n\n1. **Verdict file missing**: \\`.aida/review-verdicts/PR-65.json\\` absent. Every other recent PR has one (PR-66, 67, 68 from same morning all have verdict files).\n2. **Reviewer's \\`result\\` text**: *\"I'll pause here for your decision — the review is complete and PR-65 is ready, but I won't merge without your go-ahead.\"* — the reviewer-as-claude decided to defer the merge step itself rather than write the verdict and let the orchestrator advance.\n3. **Orchestrator silent exit**: returned to shell prompt with no pass/fail indication, no \"verdict missing — manual review required\" message. User had to inspect the JSONL by hand to learn what happened.\n4. **JSONL shows successful completion**: \\`is_error: false, num_turns: 25, total_cost_usd: $1.45, stop_reason: end_turn\\`. So from the orchestrator's surface view, the headless session \"succeeded\" — but the contract (verdict file) wasn't fulfilled.\n5. **PR-65 stayed OPEN**: \\`state: OPEN, mergedAt: null, mergeStateStatus: CLEAN\\` — phase 4 (merge) never ran.\n\n## Two distinct issues\n\n### Issue A: Reviewer skipped verdict-file write under specific conditions\n\nPR-65 had **7 commits**, all subject STORY-278, large diff (+809 lines). The reviewer ran 25 turns. Other PRs reviewed today (PR-66/67/68) were smaller — 1-2 commits, narrow scope.\n\nPossible causes:\n- \\`/aida-review\\` skill prompt didn't make verdict-writing mandatory before declaring \"done\"\n- Long-context reviewer ran out of energy on the verdict-write step\n- Reviewer interpreted \"PASS, but ask user before merging\" as a NeedsAttention case and chose to pause rather than write Approved\n- Skill template wording allows \"pause for user decision\" as a valid termination — that's incompatible with autonomous-drain mode\n\nInvestigation needed: read \\`/aida-review\\` skill template (\\`aida-core/templates/skills/aida-review.md\\`) to find the exit path; check whether verdict-file write is guaranteed before completion or only on Approve/NeedsChanges/Reject paths (and not on a soft \"pause\").\n\n### Issue B: Orchestrator silent exit on missing verdict file\n\nWhen phase 3 completes (headless reviewer exits with \\`is_error: false\\`) but the verdict file is missing, the orchestrator should surface this loudly:\n\n\\`\\`\\`\n✗ phase 3 headless reviewer exited cleanly (cost $1.45, 25 turns) but produced\n  NO verdict file at .aida/review-verdicts/PR-65.json\n  \n  The reviewer may have paused for human decision instead of writing the verdict.\n  Check the posted PR comment and the JSONL log:\n    https://github.com/joemooney/aida/pull/65#issuecomment-...\n    /home/joe/ai/aida/.aida/headless-logs/pr-65-019e369e-....jsonl\n  \n  Verdict-file-missing → orchestrator bailing. Decide manually:\n    gh pr merge 65 --squash --delete-branch    # if you trust the posted comment\n    aida queue work PR-65 --role reviewer       # to retry the review\n\\`\\`\\`\n\nThis converts a silent failure into an actionable next step. Composes naturally with TASK-307 (tee high-signal events).\n\n## Acceptance\n\n### Reviewer side (Issue A)\n\n- [ ] \\`/aida-review\\` skill template guarantees a verdict-file write before any termination path — including soft-pause / \"ask user before merging\" outcomes. If the reviewer wants to pause, the verdict should still be written with \\`verdict: NeedsAttention\\` (or similar) + a \\`reason: \"Reviewer-deferred merge decision\"\\` so the orchestrator can route correctly.\n- [ ] Or: under \\`AIDA_HEADLESS=1\\`, the skill template removes the \"pause for user decision\" outcome entirely; either write Approved/NeedsChanges/Rejected verdict + post the comment, or fail with explicit \\`is_error: true\\` and a reason.\n- [ ] Round-trip test: simulated long review (25-turn budget, large diff) reliably writes a verdict file before exit.\n\n### Orchestrator side (Issue B)\n\n- [ ] Post-phase-3 check: if headless reviewer exit code is 0 AND verdict file is missing, print a structured warning (per the example above) instead of silent-exit\n- [ ] If verdict file present: read it, route accordingly (Approved → phase 4 merge; NeedsChanges/Rejected → halt with appropriate message)\n- [ ] If verdict file missing: orchestrator exits with non-zero AND prints the recovery options\n- [ ] Update \\`docs/autonomous-drain.md\\` with the verdict-file-missing recovery path\n\n## Composes with\n\n- **STORY-263** (the headless reviewer + verdict-file pattern this BUG names a regression in)\n- **TASK-307** (tee high-signal events — would have surfaced the reviewer's \"I'll pause here\" message to the terminal in real-time, making this less surprising)\n- **STORY-281** (orchestrator pre-flight rebase — sibling reliability work)\n- **TASK-298** (stream-json watchdog — sister parser for the JSONL; \\`is_error: false\\` without verdict-file is another \\\"clean exit, broken contract\\\" pattern it could catch)\n- \\`feedback_self_test_via_dogfood_merge.md\\` — STORY-278's review surfaced its own headless-reviewer regression; the system tested itself and found a real issue\n\n## Data point for SPIKE-8\n\nPR-65 (web /ultraplan condition C output): \\`total_cost_usd: $1.45\\` for one headless review, 25 turns, 4m38s wall-clock. By comparison, PR-66 verdict file was 189 bytes — implying a shorter review session. Cost-per-review correlates with diff size and commit count. Worth capturing in SPIKE-8's metric set.\n\n## Origin\n\n2026-05-17 morning: user kicked off \\`aida queue work PR-65 --role reviewer --no-human\\` after rebasing PR-65. Headless reviewer ran for 4m38s, posted a real consolidated review comment on PR-65 with PASS verdict + merge recommendation, then exited. Orchestrator returned to prompt silently. User inspected JSONL by hand to learn the outcome.\n\nUser feedback: *\"command finished albeit with no indication of pass/fail or what happened in that headless /aida-review session.\"*"
