title: aida agent pause does not pause the process — verb misleads (only sets a dispatch marker; stop is what terminates)
description: 'aida agent pause only sets a status marker for dispatch logic (budget-exhausted/rate-limited); the process keeps running. aida agent stop terminates. The verb pause strongly implies process control. Real UX trap. Fix: rename (agent mark-busy / agent flag) or, at minimum, lead the --help with the caveat. From the CLI-manual audit (EPIC-40).'
