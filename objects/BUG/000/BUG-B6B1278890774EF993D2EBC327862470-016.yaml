title: Reviewer preflight reads a symlinked .claude/settings.json as link text and refuses every review
description: |
  ## Problem
  The contained-reviewer preflight added by BUG-B6B1278890774EF993D2EBC327862470-014 (c27ce641, aida-cli-lib/src/reviewer_preflight.rs) reads `.claude/settings.json` from the PR branch with `git show <rev>:.claude/settings.json`. In repositories where that path is a committed SYMLINK (this repo: `.claude/settings.json -> ../aida-core/templates/settings.json`, the template-mirror layout), `git show` returns the link text, so the preflight finds no `permissions.allow` entries and refuses: "refusing to launch a contained reviewer for PR-3090: the PR branch lacks the reviewer allow entries `Bash(aida)`, `Bash(aida *)`". Both entries are present in the symlink target on main and on the PR branch. Every reviewer launch from a binary built after c27ce641 fails in this repo; only the older live binary works.

  ## Acceptance
  - When the blob at SETTINGS_PATH (and `.aida/config.toml`) is a symlink (tree mode 120000), the preflight resolves the link relative to the file's directory within the same `rev` (bounded hop count, refusing links that escape the tree) and checks the target's content.
  - A link that escapes the repository or dangles is a clear preflight error naming the link and target, not "lacks the allow entries".
  - Tests: symlinked settings with the entries passes; symlinked settings without them refuses; dangling/escaping link refuses with the specific message.

  ## Test tier
  LIGHT: `cargo test -p aida-cli-lib --lib reviewer_preflight` plus `make check-ci-fast`.
