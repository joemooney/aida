title: 'aida review watch admits train PRs (train/* branches): each attempt fails with ''no queued review story'', burns a reviewer slot and leaves a stuck attempt'
description: |-
  Seen 2026-11-06: PR-3521, PR-3528 and PR-3534 are '[train] land #...' PRs on train/<stamp> branches. Review watch admitted each for review. The reviewer exited with 'no queued review story for PR-N ... help: aida pr auto-queue-review --branch <branch>', the slot was held until exit, and the attempt was recorded as 'exited without completing'. Following the help text files a bogus review story for the train (the advisor did this once: STORY-2586, rejected). Train members are already reviewed at their own heads, and the train PR exists only to land them.

  Acceptance:
  1. Review watch skips any PR whose head branch is a train branch (the prefix pr_train creates), logging it once as 'train PR: not reviewed'.
  2. auto-queue-review refuses a train branch.
  3. A test covers both.
