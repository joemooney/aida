spec_id: BUG-1-036
title: scaffolder hooks.rs Rust strings have drifted from templates/hooks/ files
description: |-
  **Symptom**

  Even after BUG-1-034's fix (extract wraps with AIDA header), round-tripping a hook via 'scaffold extract → cp → scaffold status' still reports drift. Line counts now match but bytes differ — checksums computed from the two raw_content sources don't agree.

  **Root cause**

  The hook content is duplicated:
  - 'aida-core/templates/hooks/aida-validate-commit.sh' (embedded into the binary via build.rs, used by extract)
  - 'aida-core/src/scaffolding/hooks.rs:166 generate_validate_commit_hook()' returns the content as a Rust string literal (used by apply)

  These are hand-maintained in parallel and have drifted. Same problem for generate_commit_msg_hook, generate_pre_commit_hook, generate_track_commits_hook.

  **Fix**

  The Rust generator functions in hooks.rs should read from EMBEDDED_TEMPLATES (or use TemplateLoader) instead of carrying the content as inline string literals. One source of truth: the file under templates/hooks/. Once that's done, the four hand-written Rust strings become dead code and can be removed.

  This is precisely the manifest-driven model proposed in SPIKE-1-029 (docs/plans/2026-05-04-scaffold-categorization.md) — applying it to hooks specifically fixes this drift class without doing the whole scaffolder reroute.

  **Discovered while implementing**

  BUG-1-034 fix on 2026-05-04. After my fix, 'aida scaffold extract → cp validate-commit.sh' rounds-trips fine for skills (which apply DOES load via TemplateLoader) but still drifts for hooks (which apply generates from Rust strings).
