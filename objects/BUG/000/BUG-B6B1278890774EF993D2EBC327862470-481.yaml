- id: 01a20df4-46d7-7f62-a0b5-83e718e752c5
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2720):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 2fcffa998759
    Recorded: 2026-11-23T06:53:04.915143562+00:00
    Findings:
    1. AC1: pickup_retry at review_watch.rs:1620 rechecks ownership only for held_tree. For a lock-busy exit it returns ready as soon as the deadline passes, and select_with_coverage charges a retry even when the same lock is still held. With a lock held across all three retries, releasing it later cannot recover the head because the cap check always wins. Persist enough blocker identity to recheck lock availability without spending pickup attempts while it is held. Add a lock-contention regression spanning all retry deadlines and then release the lock and assert same-head dispatch.
    2. pickup_retry invokes preflight_queue_work_branch inside Store::transaction while holding the global admission lock and the train-member lock. This waits for git worktree list, and on an occupied checkout also checks Git cleanliness and process liveness. A slow or stalled Git subprocess for one occupied worktree can prevent all other reviews and train admissions. Probe outside the lock and verify the token, head and deadline again when committing the selection.
    3. apply_pr_state_snapshot reads only no_verdict_retry_at and no_verdict_blocker. Pickup retries use pickup_retry_at instead, so a permanently capped pickup with no verdict continues to project retry_backoff=true, retry_exhausted=false. PR state tells the reconciler to reobserve indefinitely when an operator is required. Project the pickup deadline and exhausted state into the PR facts and cover a capped pickup.
    4. Attempt denies unknown fields and the state remains version 1. pickup_retries is serialized even at zero, so after any ordinary reservation write the previous watcher binary can no longer load the shared state during rollback or mixed-version use. Omit the zero value for unaffected receipts and define a safe compatibility or migration path for receipts with active pickup retry metadata.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-24T14:27:22.455686814Z
  modified_at: 2026-11-24T14:27:22.455686814Z
