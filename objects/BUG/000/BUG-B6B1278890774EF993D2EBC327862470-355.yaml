title: Session-start hook can overwrite a background launch's adopted seat with the old seat (race in seat selection vs link/adopt)
description: 'Found by the promotion 12 review (PR-4083 @ 10d112c, finding [P2]). agent_registry.rs:348, 940-960, 1044-1048, 1068-1077: touch_session_start_agent_for resolves the linked launch and computes its seat BEFORE taking the namespace write lock. If link_bg_session/adopt_bg_session_identity installs a new launch seat (including None) in between, the hook overwrites it with old-seat; carry_concurrent_launcher_write ignores an adopted session-start-hook row, and disk.seat.or(entry.seat) restores the stale seat when the adopted seat is None. Effect: the session binds/reads old-seat mail and stamps an incorrect from_seat after adoption. Fix: revalidate the linked launch under the write lock (or generation/CAS), preserving an authoritative None. Test: deterministic interleaving regression (pause hook after observing the old launch, link/adopt a seatless or newly seated launch, resume, assert final identity None/new-seat and no old-seat mail access). Introduced by STORY-2745 (#3950).'
