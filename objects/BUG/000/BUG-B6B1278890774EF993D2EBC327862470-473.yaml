  content: 'AC6 (advisor-122 ruling 2026-11-22 13:36 MST; recorded by product-15): `aida review mode mass-change on` (or whatever verb sets the mode) must write the setting where the fleet reads it, as a committed config change or in the store, or at minimum warn that a local-only edit to .aida/config.toml is invisible to reviewers and lanes, which resolve config from their own checkout. The mode status output must report the scope (local-only vs fleet-visible). Evidence: the mode was on only as an uncommitted primary-checkout edit from 19:10Z, and every reviewer and lane read it OFF. Interim fix: a config PR commits the four lines.'
