  author: joe
  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 19:29):
    # BUG-2712 / PR #4396: CONFLICT REPAIR with a CLASSIFICATION RULING (advisor-122 2026-11-22 19:35 MST; relayed by product-15). Lane: CODEX.

    The previous lane punted correctly on aida-cli-lib/src/gate/kernel_deps.rs and aida-cli-lib/src/review_draft.rs. RULING: a finding whose CLASS is unmet-claimed-ac and whose blocking_tier is ABSENT IS classified (the class says what it is), so it is NOT "Unclassified". Keep the PR's rule plus the ADR-76 floor, in this order:
    1. Mass-change OFF: it BLOCKS (today's behaviour).
    2. Mass-change ON: it DEFERS, EXCEPT where the ADR-76 sensitive-path floor applies (strict-tier paths keep incomplete-fix/unmet-AC blocking, per amended AC5) or the same finding also carries data-loss, p1 or security-authority-bypass.
    3. A finding with NO class at all stays Unclassified and is REFUSED at draft submission (AC2), never silently blocking or deferring.
    Put this table in a code comment at the decision point and test all four cells: off; on with a standard path; on with a sensitive path; no class.
    Merge origin/main into the existing branch (no rebase, no force-push), resolve kernel_deps.rs and review_draft.rs per the table, and keep both sides' other behaviour.
    Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
    cargo fmt; one targeted cargo run of the touched tests; `make check-ci-fast`; push. COMMIT your work.
