    # BUG-2712: P1 throughput fix (advisor-122 ruling 2026-11-22 12:22/12:26 MST; relayed by product-15). Lane: CODEX. New branch, new PR.

    Mass-change mode is ON (operator, until 2026-11-25 19:10 UTC) but defers nothing. Read `aida show BUG-2712` for the ACs. Locate the mode config and the reviewer prompt/draft path with rg (e.g. `rg -n "mass.change|mass_change" aida-core aida-cli-lib`).
    1. While the mode is active, the composed reviewer prompt states its expiry and the rule: unmet-claimed-ac findings are recorded with disposition deferred unless the same defect is also data-loss, p1 or security-authority-bypass.
    2. Recorder defense in depth (the verdict-record path): while the mode is active, demote a blocking unmet-claimed-ac finding that is not also p1/data-loss/security to deferred, and note the demotion in the record.
    3. ALSO (advisor 12:26): at all times, demote to deferred any finding marked blocking whose class is NOT in the configured blocking-tier list (e.g. mutation-kill, untested-path), and note why. Such findings currently block despite project policy (PR #4387 at aa380d29).
    4. Mode off: prompt and recorder unchanged except point 3. Tests cover mode on, mode off, and an out-of-tier class.
