title: Two bwrap seat-clone tests fail deterministically on dell1 but pass in hosted CI (task_2712 codex live seat commit; bug_2415 explicit-refspec session end)
description: |
  On dell1, two bwrap seat-clone tests fail deterministically (5/5 full filtered batch runs, 2026-11-17, at #4171 head 9c4c5c4) but pass in GitHub hosted CI:
  - seat_clone::bwrap_tests::linux::task_2712_codex_sandbox_live_seat_commit_and_denials (bug_2169_contained_clone_bwrap_tests.rs:2198 'a cache write must land'; the log shows 'seat cargo target: agent: not seeded')
  - seat_clone::lifecycle_tests::bug_2415_bwrap_session_end_ends_a_clone_pushed_by_explicit_refspec (task_2053_seat_clone_lifecycle_tests.rs:2235 'assertion failed: !clone.exists()')

  Likely a dell1 environment difference (AppArmor or bwrap profile, CARGO_TARGET_DIR shared with the primary checkout, or a non-seeded seat cargo target).

  Acceptance: both pass on dell1 with the documented lane-host setup (docs/advanced/lane-host-checklist.md); or the tests detect the unsupported environment and skip with a named reason, and the checklist is updated.
