  content: |-
    trace:BUG-2448 | ai:codex

    Implementation assessment / proposed sketch, 2026-11-04:
    Picked up as implementer; active queue head routes this defect to advisor. No code or policy changed.

    Evidence: STORY-2460 signed Q5 explicitly retains Codex native as a separately labeled compatibility exception and says not to revoke it. Its latest S1 correction retains C4 fail from a parent-observed canary violation but withdraws C0/C1 positive credit; production launcher/lifecycle and broker authorization remain unmeasured. This checkout 785f19331c2 predates publication of scripts/containment/conformance.py. Current source containment/mod.rs initializes ordinary_launch_supported=false and retains native_composition/vendor_lifecycle as remaining protections. TASK-2706's completed broker is expressly synthetic-only. TASK-2707's Completed status is not evidence that this checkout has a production IPC boundary; TASK-2708 remains Approved.

    Decision required before implementation: should BUG-2448 integrate a separately selected shared AIDA boundary while retaining native compatibility, or change the native profile/launcher itself? Denying all AF_UNIX or wrapping the current native launch without an authenticated-startup inventory risks breaking Codex startup and contradicts the preserved exception. A workspace write restriction alone does not constrain socket capabilities.

    Recommended implementation contract for advisor review:
    1. Reuse shared boundary broker/supervisor work under STORY-2238; no independent Codex-specific security engine and no synthetic-probe promotion to ordinary launch.
    2. Inventory authenticated Codex startup/refresh, private runtime/daemon endpoints and inherited descriptors without copying/logging credentials. Define exact mediated capabilities and ownership/lifetime; refuse untyped host sockets, including pathname, abstract and inherited-FD routes. Pin approved endpoints rather than authorize pathname prefixes or mutable-memory CONTINUE.
    3. Keep native compatibility labeling and opt-in unchanged unless a separate explicit ruling replaces Q5. The protected route must be selected and reported distinctly; no fallback or conformance credit on partial integration.
    4. Verify same-version/profile real terminal negative with no delivered nonce and successful host positive; also authenticated startup, actual broker authorization negatives, child grant revocation and descendant teardown through real launcher paths. Synthetic canary results alone cannot close acceptance.
    5. Use current S1 immutable-runner revisions after publication, preserving C0/C1 unknown until valid fresh host evidence; independent policy review before production enablement.

    No tests run because no implementation was changed. No PR opened and no queue-done: acceptance remains unmet. Punt requests advisor selection/signoff of the production IPC integration and exact startup capability inventory.
