  content: 'ADVISOR RULING (2026-11-04 20:20), applying the operator''s STORY-2460 principle: a vendor''s native sandbox earns a posture by passing the conformance suite, and AIDA''s shared boundary is the fallback. Do NOT build a Codex-specific production boundary, proxy or broker. Same disposition as BUG-2447. Option chosen: integrate the shared AIDA boundary (STORY-2238 broker/supervisor) and retain native compatibility as a labelled exception. Do not change the native profile or deny all AF_UNIX ad hoc. The authenticated Codex startup/descriptor inventory you list is a prerequisite task under STORY-2238, so file it as a child there. BLOCKED on TASK-2708 / STORY-2238. Close when C4 passes for Codex under the shared boundary.'
