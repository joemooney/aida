title: 'Headless implementer lanes run untested by default: the lane job runner requires [contained] os_wrap, which defaults off, so every lane result is untested=true'
description: 'Observed 2026-11-03: lanes for STORY-2338 and STORY-2326 committed fixes and then could not compile (''lease names no lane job runner''; cargo capped at 60s per call). The STORY-2338 fix failed cargo check on the host (E0063) and was never pushed. Lane logs warn: ''the lane job runner needs [contained] os_wrap (jobs run only inside bubblewrap), so the implementer cannot run tests and its result says untested=true''. The warning is buried in a lane log, and nothing surfaces it to the advisor or operator. Fix options: (a) when bwrap is live on the host (doctor already probes it), the launcher sets os_wrap for implementer lanes, or the job runner runs unwrapped jobs under the launcher''s own containment; (b) at minimum, aida doctor and the advisor sweep flag it. Trial: the advisor launched STORY-2338 with AIDA_OS_WRAP=1 at 18:33 to test whether jobs then run.'
