  content: 'ADVISOR REWORK BRIEF (2026-11-03 23:16 MST, PR #3347 head 31ed7ef6). Review requested changes. (1) BLOCKING: the new process-global AIDA_OS_WRAP=1 default turns 11 tests red in lib-0/cli-0 (main is green at the base) and leaks past the implementer lane. Scope the default to the implementer lane''s own launch (set it on that child''s env or LaunchContext, never process-global), and leave tests and other roles unchanged. (2) Add the advisor-visible untested signal the spec comment asks for: a lane result line or lease field that marks a lane which ran without os_wrap. Rule each non-blocking finding in this push: fix it or say why not, in one line on this spec. Gate (LIGHT): one targeted cargo test filter covering the changed module, plus make check-ci-fast, then push to the same PR branch. The advisor re-reviews only the delta.'
