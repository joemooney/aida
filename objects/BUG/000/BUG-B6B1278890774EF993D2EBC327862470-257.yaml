- id: 01a1b95f-05c7-7ca0-b590-36e2eaa10d2c
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2492):
    Verdict: CHANGES REQUESTED
    Reviewed commit: f81f2ac9639a
    Recorded: 2026-11-08T03:28:52.161931166+00:00
    Findings:
    1. BLOCKER bootstrap: this PR's head f81f2ac has zero commit statuses and no merge-hold-gate check run. The PR's workflow only declares pull_request_target (which runs main's copy, which only declares pull_request), so neither version runs. merge-hold-gate is a required check (app_id 15368) with enforce_admins=true, so the PR cannot merge without changing branch protection. Add a transition plan, either in the PR body or as a one-time operator step (for example, keep a pull_request trigger for one release, or post the status by hand), and say who runs it.
    2. Transition fail-open risk: open PRs already carry legacy merge-hold-gate CHECK RUNS (job name, GitHub Actions app) at their head SHAs. After merge, a label-only event (aida applies aida:merge-hold, no push) publishes only a commit STATUS named merge-hold-gate. A stale successful legacy check run on the same SHA may still satisfy the app-pinned required check, so a newly held PR could merge. Document and verify how GitHub resolves a check run and a status with the same name, or re-run / invalidate the legacy runs during the cutover.
    3. AC1 unverified: no evidence that a commit status written with GITHUB_TOKEN satisfies a required check pinned to app_id 15368 (GitHub Actions), or that state=pending blocks raw gh pr merge or the web UI under that pin. Add evidence from a live held PR after cutover (gh api .../commits/<sha>/status plus a refused merge), or a documented operator verification step.
    4. Test gap (minor): train-mode cases (expect_train) go through github_gate without WANT_STATE, so a held train member (should be pending: no failure mail) and malformed train evidence (should be failure) both collapse to exit 1. Set WANT_STATE per train case so the pending-vs-failure split is asserted for train mode too (AC3/AC4/AC5 in train mode).
    5. AC2 partially verified: fixtures show that cleared label pairs publish success, and labeled/unlabeled stay in the triggers. No test or evidence shows that a label-only event reruns the pull_request_target publisher and flips an existing pending status to success on the same SHA. Cover this in the cutover verification above.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
