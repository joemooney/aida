- id: 01a1b980-8a1e-7123-929e-98f847020db2
  author: joe
  content: 'Round 2 approach: address bootstrap with a temporary same-repository pull_request publisher alongside trusted pull_request_target, with explicit operator removal steps. Document GitHub same-name check/status conjunction and an operator cutover procedure verifying app_id 15368 with enforce_admins retained: legacy successful check plus pending status blocks raw merge and UI; label-only clearance succeeds on unchanged SHA; fresh SHA passes without a legacy check. Assert explicit success/pending/failure states in every train fixture and shared parser case. Expected files: .github/workflows/merge-hold-gate.yml, tests/test_merge_hold_gate.sh, docs/cli/08-reporting.md and a focused cutover runbook. Live GitHub verification is operator work after publication; local fixtures cannot establish app-pinned server behavior. Native seat will leave edits uncommitted for host publication.'
