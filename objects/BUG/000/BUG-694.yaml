title: aida session end leaves orphaned mcp-claim.<spec>.toml behind — no reaper
description: 'When aida session end tears down a session lease, the sibling mcp-claim.<spec>.toml file (the MCP work-claim) is NOT deleted. Observed: TASK-702 (Completed, worktree removed) still had .aida/sessions/mcp-claim.task-702.toml 24 days later, which kept surfacing the spec as stale running work. session end should also remove the mcp-claim file for the same spec/session, and/or a `aida session gc`/`queue gc` pass should reap mcp-claim files whose spec is Completed/archived or whose worktree is gone. Discovered alongside BUG-693.'
