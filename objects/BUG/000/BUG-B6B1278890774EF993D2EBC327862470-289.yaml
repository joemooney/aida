title: 'Advisor seat cannot see the operator''s mandate: AIDA_USER=<seat handle> makes current_user_id differ from the mandate principal'
description: 'Observed 2026-11-11 05:15 MST: operator ran ''aida mandate renew'' (principal joe). In the advisor seat (AIDA_USER=claude-advisor-112), ''aida mandate status'' prints ''No mandate has been started'' and warns ''ignoring mandate record ...: principal joe is not the current user'' for every record; ''aida dispatch request take'' fails ''no active mandate''. With AIDA_USER unset, the same mandate shows ACTIVE. Cause: gate/mandate.rs record_problem compares m.principal to crate::current_user_id(None) (dispatch.rs:290, :809), which resolves the AIDA_USER seat handle. The mandate exists to authorize the advisor seat, so it must be resolved against the operator principal (the OS/git user, or the seat''s grant), not the seat handle. Acceptance: inside a seat with AIDA_USER set, an operator-minted mandate is visible and authorizes dispatch; a test pins it.'
