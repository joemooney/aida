title: Train refuses a drain PR when its trailer names superseded bundled specs whose execution mode is unset (treated as supervised)
description: 'Observed on #3239 (TASK-2733), #3240 (TASK-2731/2737) and #3250 (TASK-HOME-692/693): each carrier was drain, but bundled specs superseded into it kept mode unset and the train refused ''X is marked unset (supervised): its merge needs a human''. Workaround: aida edit <each> --mode drain. Expected: a spec superseded-by the carrier inherits the carrier''s mode for gating (or is ignored by the gate), and an unset mode on a superseded spec never forces supervision.'
