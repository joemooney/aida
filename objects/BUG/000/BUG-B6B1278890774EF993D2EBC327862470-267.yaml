    1. aida-cli-lib/src/queue_cmd.rs:8034 rework_is_review_shelf accepts only kind "verdict:request-changes", so a repeated identical Rejected review no longer trips the BUG-1213 loop guard. rework_findings_comment renders Rejected verdicts too (blocks_done covers RequestChanges | Rejected; review_verdict_display.rs:38), and before this PR any NeedsAttention recurrence parked. Now two identical Rejected shelves return the spec to Approved and requeue it with no escalation. Accept the reviewer rejection kinds as well; both spellings are written today: "verdict:rejected" (lib_part5.rs:3426, aida review record) and "verdict:reject" (auto_complete.rs:678, drain cause_slug). Add a predicate case for each.
