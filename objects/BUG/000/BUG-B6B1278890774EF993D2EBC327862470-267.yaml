    2. aida-cli-lib/src/tests/queue_rework_tests.rs:2095 bug_2502_loop_guard_requires_a_reviewer_request_changes_shelf only tests the predicate; no test proves handle_queue_rework still parks a genuine repeat review. Replacing the call at queue_cmd.rs:8552 with false would pass every BUG-2502 test, silently disabling the BUG-1213 guard. Add a handler-level case: reviewer shelf (phase reviewer, kind verdict:request-changes, no attention_reason) plus an already-imported identical findings block, asserting the spec ends NeedsAttention and is not queued. The park happens before the findings/brief subprocesses, so tolerate or stub their failure.
