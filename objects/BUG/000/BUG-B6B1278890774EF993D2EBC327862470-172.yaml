title: Native Codex tool shells lose the delegated AIDA seat when shell_environment_policy inherits only core
description: |
  Observed in the first live TASK-2631 native headless lane, BUG-2397 (lease01a195fb1400, native codex PID2792783, main53c8970). The model host process has AIDA_SESSION_GRANT, AIDA_SESSION_ROLE=implementer and AIDA_CONTAINMENT_POSTURE=native, with AIDA_CONTAINED absent. Its actual tool call reports no active role. The user's ~/.codex/config.toml intentionally sets [shell_environment_policy] inherit="core", with explicit timeout variables only; no AIDA variables are passed into tool shells. Model authentication works (ChatGPT) and code work proceeds; the grant is lost at the host-to-tool boundary rather than absent at launch.

  Evidence: .aida/headless-logs/codex/bug-2397-mail-wake-01a195fa-5336-78f2-9e9b-5b51d5ca5f40.jsonl includes the role-current result and model account of it. Host inspection verified only presence booleans, never secret values. No existing shell_environment_policy spec found.

  Acceptance:
  1. Managed native Codex tool calls present only their own delegated child grant/seat under restrictive shell environment policy, via the existing sanctioned grant/keyring contract. Never copy the parent advisor grant or broaden/mint authority in the tool shell.
  2. Preserve the user's restrictive global policy and credentials exclusions; do not change inherit to all globally or pass arbitrary parent environment/secrets. Scope any launch-time metadata transport to exact AIDA-owned child context, validated with existing authority boundaries. No grant secrets in argv/logs/config or project-writable context.
  3. Under temporary inherit=core configuration, a real Codex fixture restores only its own delegated subject, seat and context; own-scope operation succeeds and wrong-seat/advisor operations refuse. A granted reviewer records a verdict that validates as authorized independent review. A named ungranted agent may retain a nonauthoritative record artifact under the existing recorder compatibility contract; that actual artifact must not satisfy standalone collection without the launched reviewer grant, authoritative reviewed/resolved classification, dispatch review-success/skip-review decisions (including --no-ship), ship, or automatic hold release. Presented invalid grants refuse recording. Assert the adapter never forwards a parent grant; do not claim deliberate same-uid parent-selector/key replay resistance beyond ADR-66. Correct the identified weak positive-approval consumers using existing durable authority validation, retaining refusal/protection artifact behavior and other compatibility rules.
  4. Add truthful diagnostic/refusal for an unusable requested seat before model work when possible. Document any native keyring limitation rather than silently granting a fallback.

  Sketch and independent advisor signoff before code; strict review for authority plumbing. This finding is separate from the native cache path writable-root refusal, which is recorded on STORY-2238. User's global Codex config must remain unchanged. Codex implementer lane after signoff; LIGHT targeted grant/launch test plus make check-ci-fast, CI is the full gate.

  Scope amendment: the initial adapter-only sketch expands only to the weak positive-approval consumers identified in codex-advisor08 ruling: gate/dispatch_authority::verdict_at_head + dispatch_flow, human reviewed classification and gate/review_verdict::review_actionability consumers. Preserve named ungranted record artifacts as nonauthoritative; do not change roster, issuance, grants, direct-human receipts or protected merge policy. Independent design signoff on this amendment and strict implementation review are required before completion.
