  content: |-
    ## Implementer findings (could not file as draft TASKs: `aida add` cannot allocate an ID from the sandbox, and the MCP file_finding tool is denied)

    Commit d12af68f664 on bug-b6b1278890774ef993d2ebc327862470-157.

    1. **design-choice, major:** the lane job runner runs seat-authored build.rs and test code as the operator on the host. With `[contained] os_wrap` on, it uses the seat's bwrap profile. With os_wrap off (the default), a contained seat gets an unsandboxed host run of code it wrote. CI runs off-host, so this is not the same trust level. Consider always wrapping jobs in a minimal bwrap, or refusing jobs from contained lanes when os_wrap is off.
    2. **followup, minor:** only the standalone implementer launch starts the runner. The `--auto-complete` drain's phase-1 implementer gets no runner, env or prompt contract yet.
    3. **deviation, minor:** nothing was compiled or run locally. aida-cli-lib cannot be checked within one 60s tool call, and a killed check keeps no progress. The help golden snapshot was hand-written, so CI may show a wrap or whitespace diff; regenerate it with AIDA_UPDATE_SNAPSHOTS=1. The seed hardlinks only deps artifacts, copies .d, .fingerprint and build, and skips incremental, rather than `cp -al` everything. The host wrapper warns that whole-tree hardlinks corrupt main's cache.
    4. **followup, minor:** `make check-ci-fast` opens with a cargo check (aida-cli without default features), so a headless lane can never run it. Either allow it as a lane job or move that check out of the fast tier.
