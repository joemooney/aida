- id: 01a19c5a-64a6-7442-8a4c-7d472cf16c36
  author: joe
  content: |
    DESIGN FORK (fixer, 2026-11-02 06:40 MST), BUG-2383 PR #3192 head 7c29857 + portability fix. STOP clause: two host facts break the 04:58 signed sketch, so I stopped before code on both. Probes ran on this host, outside the agent sandbox.

    FORK 1, part 1 step 2d (runner pid liveness). Both seat tool shells run in a private PID namespace:
    - `codex sandbox -P :workspace`: `$$`=2, 4 pids visible, and `/proc/<host pid>/stat` is missing.
    - Claude Bash sandbox: 5 pids visible.
    So `runner_alive` can never pass from a sandboxed seat, and every lane reports untested=true. Fixture (c) would only prove that.
    Options:
    (A, recommended) The runner rewrites a heartbeat in its results dir every 5s, which is host-written and seat-readable. The seat treats the record as live while the heartbeat is under 30s old. Drop the pid check on the seat side and keep it for host-side reap.
    (B) No seat liveness check. A stale record just times out to untested.

    FORK 2, part 2 mount. Ubuntu bwrap 0.9.0 has no `--overlay-src`/`--overlay` (upstream added them in 0.10.0; the sketch said 0.8.0).
    Options:
    (A, recommended) `unshare -Urm` mounts kernel overlayfs (lower = generation snapshot, upper/work per lane), then runs the unchanged lane-job bwrap inside. Verified here: a seat append copied up to a new inode and the lower stayed byte- and inode-unchanged.
    (B) Require bwrap >= 0.10 and fall back to `seed: cold` until then. That means a cold seed on this host.
    (C) fuse-overlayfs. It is not installed.

    Done this round: the CI gates fix (portability ratchet, bug_2383_lane_job_tests.rs:1338). Awaiting rulings on 1 and 2 before (c) and part 2.
