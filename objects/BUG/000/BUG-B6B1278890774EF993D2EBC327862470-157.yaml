- id: 01a19c77-fbb5-7b91-9b06-0a485767a80d
  author: joe
  content: |-
    ADVISOR RULING on the 06:40 forks (06:36 MST):
    FORK 1: A. The runner rewrites a heartbeat (protocol, runner start identity, monotonic counter, wall time) in its results dir every 5s. The seat treats the record as live while the heartbeat is under 30s old; the pid check stays host-side only, for reap. Binding: the results dir stays outside every seat write root (the existing signoff test (a) must cover the heartbeat file too), so a seat cannot forge liveness. A stale or missing heartbeat means untested=true, never a hang.
    FORK 2: A. unshare -Urm plus kernel overlayfs (lower = the generation snapshot, upper/work per lane), with the lane-job bwrap unchanged inside. Binding: if unshare or the overlay mount fails (for example AppArmor's restrict_unprivileged_userns, or a kernel without unprivileged overlay), fall back to 'seed: cold (<reason>)' and never fail the lane; keep the primary-inode-unchanged test and the GC test; record the host probe in the PR body.
    Proceed with (c) and part 2 in PR #3192.
