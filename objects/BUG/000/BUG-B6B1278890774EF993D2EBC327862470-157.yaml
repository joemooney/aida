  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: AC1 needs a background cargo path, but anything detached inside a seat dies when its tool call ends: each Bash call is its own bwrap PID namespace (verified: a setsid nohup sleep 90 was killed and never wrote its file). So the runner must run outside the seat sandbox, and picking it is an architecture/containment decision (CLAUDE.md requires a sketch plus advisor signoff). Options: (a) a host-side cargo job runner owned by the lane launcher, polling a seat-writable inbox and running jobs under the seat''s bwrap profile and cargo slot; (b) exempt AIDA_CARGO_TIMEOUT cargo calls from the 60s HEADLESS WAITING RULE and widen watchdog silence grace; (c) a deputy mode that needs no human terminal. Separately for AC2: lanes are seat clones, not linked worktrees, so aida-host/bin/cargo''s seed (gated on in_linked_wt) never fires. Main target/agent is 45G, so the seed must happen host side at clone creation in seat_clone.rs, or in the wrapper (another repo, not writable from the seat). Details are in the approach comment on this spec.. No triage reason was given.'
