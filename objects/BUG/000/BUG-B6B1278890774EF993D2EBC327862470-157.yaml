- id: 01a19527-5322-7eb2-86be-d863edb90b76
  author: joe
  content: |-
    ## Implementer approach

    ### Findings from inside a headless sandboxed seat (2026-10-31, lane 01a195258405)
    - **Detached cargo cannot work from inside the seat.** Each Bash tool call runs in its own bubblewrap PID namespace. `(setsid nohup sh -c 'sleep 90' &)` was gone by the next tool call. A seat-side `aida cargo run-bg` would die the same way, so the runner has to live **outside** the per-command sandbox (host side).
    - **Why the target dir is cold:** lanes are seat **clones** (`aida-seat-*`, own `.git`), not linked worktrees. The host wrapper `~/ai/aida-host/bin/cargo` seeds `<main>/target/worktrees/<name>/agent` only when `in_linked_wt=1` (git-dir != common-dir), so a clone never seeds. Main `target/agent` is 45G, so seeding from inside the sandbox would also exceed the 60s cap.
    - Even with a warm target, aida-cli-lib workspace crates recompile (fresh mtimes), so a foreground targeted test does not finish within 60s.

    ### Acceptance criteria as tests
    - AC1 **drain-level**: a headless seat submits `cargo test --profile agent -p <crate> --lib -- <filter>` through the sanctioned path, polls it in <=60s steps, and gets the exit code and log back. It holds a cargo slot (the slot log records it).
    - AC2 **unit/fixture**: creating a seat clone seeds `<main>/target/worktrees/<clone>/agent` from `<main>/target/agent`, host side, honouring the wrapper's min-free guard. Or teach the wrapper to treat a host-recorded clone like a linked worktree.
    - AC3 **unit**: a golden check on `headless_waiting_rule_suffix` / the standalone prompt names the path, and the result line carries `untested=true` when the path is unavailable.
    - AC4 **fixture**: a headless lane fixture runs one filtered test through the path and reports pass/fail.

    ### Expected files
    - `aida-cli-lib/src/seat_clone.rs` (seed at clone creation), `aida-cli-lib/src/standalone_implementer.rs` + `queue_cmd.rs` (prompt), a new host-side job runner module, plus tests. The cross-repo option touches `aida-host/bin/cargo`, which this seat cannot write.

    ### Ambiguities / conflicts as questions
    - **Which background mechanism?** (a) A host-side cargo job runner owned by the lane launcher. It watches a seat-writable inbox (like `.aida/deputy/incoming`) and runs the job in the seat root under the seat's own bwrap profile and cargo slot, writing a log the seat polls. (b) Exempt `AIDA_CARGO_TIMEOUT=… cargo` calls from the 60s HEADLESS WAITING RULE and widen the watchdog's silence grace for them, so one foreground call can run 15 min. (c) Extend `aida deputy` to run without a human terminal. Each option changes the containment/watchdog design, so it needs an architecture sketch and advisor signoff before implementation.
    - Is seeding a 45G target per seat acceptable on disk, or should seats share a read-only dependency layer?
