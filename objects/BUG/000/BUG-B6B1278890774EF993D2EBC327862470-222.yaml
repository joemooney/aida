- id: 01a1adf0-960c-7993-8972-d594abfd7dee
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2456):
    Verdict: CHANGES REQUESTED
    Reviewed commit: e9b9aa1a5bf7
    Recorded: 2026-11-05T22:55:45.410879394+00:00
    Findings:
    1. seat_clone.rs prepare_rework_merge_with (~L2727-2733): publication is gated on 'tip != pr_head', and the earlier ancestry check only requires pr_head to be an ancestor of HEAD. A clean --resume seat whose branch already carries unpublished local lane commits (e.g. a Claude clone lane that committed then punted or held) has them pushed host-side before relaunch. That push skips the ship --from-seat trailer guard (seat_trailer_check) and the punt/hold publication veto in publish_queue_exit_with. The same happens when merge reports 'Already up to date'. Fix: record HEAD before finish_rework_merge and publish only when pre-merge HEAD == pr_head and the new tip is the host-created merge (first parent pr_head, second parent base). Otherwise skip the pre-launch push and leave that work to the gated post-exit path. Add a regression test where HEAD = pr_head + 1 local commit and assert publish is never called.
    2. seat_clone.rs publish_rework_merge: the quarantine import ref from import_seat_branch is deleted only after a successful push. On a push failure or timeout (the non-fast-forward refusal the docs describe) the ref stays in the host repo. Delete it on every exit path, e.g. with a drop guard or by running cleanup before the bail.
    3. Evidence gap: the clone-seat arm (bug_2456_clone_rework_publishes_through_host_and_never_runs_seat_hooks) silently returns when bwrap is unavailable unless AIDA_REQUIRE_BWRAP_LIVE is set, and non-fast-forward refusal is covered only by an injected 'push rejected' closure. Add one real-git test where origin/<branch> moves after the fetch, so the actual push is rejected and no vendor launches.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-05T22:59:47.852018771Z
  modified_at: 2026-11-05T22:59:47.852018771Z
  session_id: 688fbe55-f92b-4b09-a8d1-2ca064cb7e25
