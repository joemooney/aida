  author: joe
  content: 'Implementation prepared: the existing host merge/conflict route now publishes a clean prepared head before launch, using the host origin and sandboxed bundle import for clone seats. Added regression coverage for routing, publication refusal and current heads, plus a live clone/hook-isolation test. Targeted Rust tests are compiling. This native lane has read-only .git; host post-exit publication must commit/push/open the PR.'
