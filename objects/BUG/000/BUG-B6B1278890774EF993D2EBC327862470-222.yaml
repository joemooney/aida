title: 'BUG-057 merge-first rework cannot run in Codex lanes: their .git is read-only, so a rework on a PR behind main always punts'
description: '2026-11-05: STORY-2492 Codex lane punted at its first command ''error: cannot open .git/FETCH_HEAD: Read-only file system''. Since BUG-057, a rework PR that conflicts with (or is behind) main makes the merge the lane''s first task, but Codex native lanes mount .git read-only, so every such rework punts and burns a slot. Acceptance: the host launcher performs the main merge (or update-branch) BEFORE launching a non-Claude rework lane; a clean merge is pushed host-side and the lane starts on the updated branch; a conflicting merge routes to a Claude lane (STORY-2475 routing) without launching Codex; regression test for both arms.'
