title: Closeout-audit comments are read by lanes as stop orders (KEEP OPEN ... No implementation)
description: |
  Found 2026-11-23 (product-15; ruled by advisor-122 08:01). On 2026-11-23 the codex lanes for TASK-3149 and TASK-3151 each produced nothing ("no-work-produced"). Each read the advisor's 2026-11-20 closeout-audit comment ("KEEP OPEN ... No implementation or status change") as a binding stop order and ignored the current lane brief. Their final message: "I followed the binding advisor brief's instruction to keep the task open without implementation or status changes." The audit sentence described the audit itself, not the task. A sweep found 3 more open specs with the same text (TASK-3154, TASK-3155, TASK-3157).

  ## Acceptance
  - AC1: The closeout-audit wording/template writes "AUDIT VERDICT (not a lane instruction): keep open; implementation still wanted" instead of a bare "No implementation or status change". A test or doc check pins the template text.
  - AC2: The lane brief generator explicitly ranks the CURRENT brief above older spec comments: generated briefs include a line saying older spec comments are context, not instructions, when they conflict with this brief. A test asserts the line is present in a generated brief.
