title: CI startup monitoring can skip items when a paginated forge collection shrinks
description: Follow-up from BUG-2694 self-review. GitHub page numbers index a live collection. If an item on a previously read page is closed or deleted before the next page is fetched, an unseen boundary item can shift onto the already-read page. PR-number deduplication handles overlap but cannot detect such a gap. The same issue can skip a started run in historical job mapping after a run deletion. Evaluate stable cursor-based or bounded overlap discovery and add a regression that removes an item between budget-limited passes.
