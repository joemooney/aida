attention_reason:
  category: design-fork
  detail: 'Unverified-clone recovery crosses mail fencing and sandbox admission: a mail-only lease fallback still leaves probe/salvage refused, while broadening host_recorded_clone changes launch authority. Need an explicit host-only recovery contract deciding binding repair versus preserved quarantine, including ambiguous writer anchors and live-use refusal. Investigation and required regressions: docs/internal/testing/bug-2541-unverified-clone-recovery.md. No production changes or affected clone mutations.'
  lean: Prefer a separate host-only binding-repair operation using exact host lease evidence, preserving original metadata and mail, then ordinary fenced teardown; do not weaken host_recorded_clone or --force.
