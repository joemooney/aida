title: session end cannot retire a contained seat clone whose host binding is unverified (mail retention refuses even with --force)
description: 'dell1 2026-11-12: seat clone aida-seat-aida-bug-...-304 (lease 01a1d1150582, branch bug-overlay-fingerprint-flake). Its 202 tracked files were deleted (interrupted teardown?). After restoring them, ''aida session end --branch B --yes|--force'' refuses: ''mail retention refused ... the seat clone has no verified host binding to its main checkout, so its mail cannot be fenced and retained; the tree was kept''. Running it from inside the clone refuses too: ''marker, alternates and lease do not agree on a main checkout''. Every pickup on the branch stays blocked (''held by a contained seat private clone''). Expected: an operator path that salvages the mail (or confirms it is empty) and ends the lease.'
