- id: 01a21717-2f0f-7053-aeaa-a7432a3bdf43
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 062a56e941 (diff origin/main...HEAD: advisor_loop_train.rs, pr_train.rs, task_1993_review_watch_tests.rs).

    Acceptance evidence:
    - AC1 [behavioral]: run_passes now calls an unclaimed pre-scan (train_wanted: pending journal recovery, or any discovered change passing the automatic eligible() gate; Unavailable counts as wanted). Claim taken only for a wanted pass, dropped via admission.take() when the pass returns, before idle. Test bug2769_idle_auto_train_holds_no_admission_and_admits_a_manual_train asserts no claim over 3+ idle polls, and none after a wanted pass. PASS (lane job, exit 0).
    - AC2 [behavioral]: same test: manual_train_admission succeeds in <1s against the idle loop (poll interval 1s).
    - AC3: the test above; existing bug2703_real_worker_loops_yield_to_the_real_ship_handler and story2905_admission_tests stay green (adapted: probe param, 'resume claims' now waits for a later pass to run under the claim).
    - AC4 [behavioral]: long_hold_line, test bug2769_a_long_hold_names_the_holder_and_phase; emitted on release when a hold exceeds 30s.

    Probes: (1) purpose strings reuse ADMISSION_PURPOSE; (3) 0 changes -> no claim; N -> first eligible short-circuits; (5) pre-scan grants nothing; skipping is fail-closed; discovery error -> recorded pass failure, no claim; all gates still re-run under the claim inside the pass. No test weakened.
    Residual risks: discover() excludes drafts (assumed never auto-trainable); pass housekeeping (store_refresh pre_pass, abandoned-train closure) now runs only when something is eligible or recovery pends; when a PR is eligible the forge reads happen twice; AC4 line is logged on release, not mid-pass (holder still visible via 'aida advisor loops status' claims).
