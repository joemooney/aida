- id: 01a2172c-fd85-7f83-a308-fad8ea4d8ef9
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2769):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 0f9abd22eab1
    Recorded: 2026-11-26T09:24:30.930031141+00:00
    Findings:
    1. AC4 not met: 'a log/status line names the holder and the phase whenever the auto-train holds admission for more than N seconds'. long_hold_line is only printed after admission.take() once the pass has returned (advisor_loop_train.rs, end of run_passes). A hold still in progress produces no line, so an operator looking at a hold that has run for minutes (the incident shape in the spec: 10-11 minute holds, one ended by killing the pid) sees nothing; a killed or hung holder never logs at all. The phase is also always the literal "train pass", so it never distinguishes recovery, assembly and a running train. The loop's emission is untested; only the pure formatter is (bug2769_a_long_hold_names_the_holder_and_phase). Fix: report while the hold is live past N seconds, for example a watchdog/heartbeat line or a status field on the admission claim that `aida` status surfaces, with the real phase, and add a test that drives run_passes with a pass that outlives HOLD_WARN (a short test threshold) and asserts that the line or status appears while the claim is still held.
    2. Efficiency follow-up: on a wanted poll, train_wanted repeats the forge reads (discover plus per-change CI, required checks and head reads up to the first eligible change) that the pass then makes again under the claim. All seats share one gh rate budget. Consider passing the pre-scan's discovery or eligible set into the pass, or keeping the pre-scan to local evidence first. This is not a correctness defect: idle polls make the same reads as before, without the claim.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-26T09:25:54.181237364Z
  modified_at: 2026-11-26T09:25:54.181237364Z
