- id: 01a21700-a829-7832-99d6-48032fe7992f
  author: dirtlab
  content: |-
    ## Implementer approach

    Root cause: `advisor_loop_train::run_passes` takes the shared `legacy auto-train` claim before every pass and keeps it across the 180s idle; the pass itself (`pr_train_handler --all-ready`) gates every open PR with forge reads under that claim, and only yields between passes. With nothing to train that is a multi-minute hold per poll.

    ### Acceptance criteria and evidence
    - AC1 (unit/loop): a read-only pre-scan (`train_wanted`: journal recovery needed, or any discovered change passing the automatic `eligible` gate; unavailable evidence counts as wanted so the full pass reports it as before) runs WITHOUT admission; the claim is taken only when a pass will assemble/run a train and is dropped right after the pass, so idle holds nothing.
    - AC2/AC3 (loop-level test in advisor_loop_train.rs): run the real `run_passes` loop with an idle probe; assert no `legacy auto-train` claim is observed across polls and a contending `manual_train_admission` succeeds within one poll interval.
    - AC4: on release, a hold over 30s logs `auto-train: held admission <N>s (pid <pid>, phase <phase>)`; unit-tested via the pure line formatter.
    - Existing `bug2703_real_worker_loops_yield_to_the_real_ship_handler` adapted to the probe parameter (claim now retaken per pass, not held idle).

    ### Expected files
    - `aida-cli-lib/src/advisor_loop_train.rs`
    - `aida-cli-lib/src/pr_train.rs` (pub(crate) recovery-needed accessor)
    - `aida-cli-lib/src/tests/task_1993_review_watch_tests.rs`

    ### Ambiguities / conflicts as questions
    - None
