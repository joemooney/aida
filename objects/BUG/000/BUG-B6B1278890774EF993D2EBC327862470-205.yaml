title: Finished headless implementer lanes keep their lease after pr-opened + queue done, so the review watcher refuses their PR until an advisor ends the lease by hand
description: 'Observed 2026-11-03 20:30-20:40 MST, five times in one evening. PR-3324 (BUG-2433), PR-3326 (TASK-2802), PR-3327 (TASK-2805) and PR-3330 (BUG-2194) each logged ''review of this head exited without completing (queue work exited 1: help: aida session end <lease> --force)'' or ''the author''s session ... is live and owns the merge'', after the lane had already logged ''queue done succeeded ... My turn is over'' and ''implementer: pr-opened pr=N''. Every lease was clean and pushed, and end-finished.sh deleted each one without loss. The reviews then waited about 1.5h until the advisor noticed. BUG-2224 fixed one cause (copied tags); this is the general case. Fix: the headless launcher ends the implementer lease once the lane exits after pr-opened, with the tree clean and HEAD on origin. Or the watcher treats a lease whose process is gone and whose tree is clean and pushed as finished, and proceeds. Relates to STORY-2351 (hygiene job) and STORY-2325 (ownership).'
