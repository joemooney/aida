title: aida queue list shows ARCHIVED specs (SPIKE-53 lingers in the queue after archive) — archive should prune queue entries / queue view should hide archived
description: 'Operator confusion (2026-06-12): SPIKE-53 is ARCHIVED (appears in ''aida list --archived'', excluded from ''aida list open'' + ''aida why'') yet STILL shows in ''aida queue list'' (Blocked section, human-only). An archived spec lingering in the queue looks like actionable pending work when it has been deliberately shelved — a core legibility failure feeding the operator''s ''I don''t understand what''s in my queue'' confusion. Either: (a) ''aida archive <id>'' should also remove the spec''s queue entries, OR (b) ''aida queue list'' should filter out archived specs by default (with --include-archived to show). Recommend BOTH: archive prunes queue membership AND the queue view filters archived as a backstop. Verify: archive a queued spec -> it leaves ''aida queue list''. Relates to the queue-legibility work (STORY-565 footer, aida queue advance).'
