title: aida ship --from-seat refuses a seat branch whose commits carry only (Refs SPEC-ID) trailers, so a partial slice of a spec cannot be published from a contained seat
description: '2026-11-03: publishing the TASK-2708 step-1 seat commit (subject ends ''(Refs TASK-2708)'') was refused with ''no seat commit carries a (SPEC-ID) trailer''. seat_trailer_check (ship_from_seat.rs:386) uses extract_spec_ids_from_commit, which skips Refs references. Refs-only slices are the normal shape for multi-PR specs (STORY-2325 PR-B and STORY-2326 PR-A use them). Expected: accept Refs trailers for attribution and the explicit-spec check, and open the PR without marking the spec for completion.'
