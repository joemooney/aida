title: aida-git-guardrails.sh allows force-push to main via --force-with-lease — should block ANY force-push to protected branches
description: 'Incident (2026-06-14): a session ran ''git push --force-with-lease origin main'' (off a failed cd that left git-ops on main) and REWROTE main''s history (clobbered #868''s commit message; recovered manually). The guardrail hook BLOCKS bare ''git push --force'' (line 56) but explicitly EXEMPTS ''--force-with-lease'' (line 57) — so the breach slipped straight through. --force-with-lease is the safe form for FEATURE branches but is NEVER acceptable for main (it still rewrites shared history; the lease only guards against a stale remote, not against the act of rewriting main). Fix (substrate-as-bouncer): add a PROTECTED-BRANCH rule — block ANY force-push (--force AND --force-with-lease) when the target is a protected branch (main/master, configurable). Target detection: explicit ''origin main'' in the cmd OR the current branch is main when no refspec is given. Keep allowing --force-with-lease to non-protected (feature) branches. This hook would have prevented the incident outright. trace:relates:BUG-538 trace:from-friction'
