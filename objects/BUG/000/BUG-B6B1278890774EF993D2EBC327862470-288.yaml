title: Lane brief selection follows the latest comment labelled 'ADVISOR BRIEF' even when a later advisor ruling supersedes it
description: 'Observed 2026-11-11 02:47 MST: STORY-2688 had a 2026-11-10 ''ADVISOR BRIEF: sketch-only lane'' comment, then a 2026-11-11 02:45 ''ADVISOR SIGNOFF ... S1 now'' comment. The implementer lane''s prompt carried only the old sketch-only brief, so the lane punted in under a minute as a design fork (''this dispatch explicitly prohibits implementation''). A relaunch after posting a new comment labelled ''ADVISOR BRIEF'' worked. Expected: the pickup brief is the latest binding advisor instruction (BRIEF, RULING, SIGNOFF or AMENDMENT), or an advisor brief has an explicit supersedes field; a stale brief that a later ruling contradicts is never the sole instruction. Acceptance: (1) a spec whose newest advisor ruling post-dates its newest BRIEF puts that ruling in the lane prompt; (2) regression test with the STORY-2688 comment shape.'
