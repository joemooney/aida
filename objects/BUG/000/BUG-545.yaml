title: aida edit --tags REPLACES all tags instead of adding — silent clobber (no --add-tag/--remove-tag)
description: 'Advisor hit (2026-06-13): ran ''aida edit BUG-530 --tags supervised'' to add one tag; it REPLACED the entire tag set (BUG-530''s 6 tags → just ''supervised''), silently clobbering provenance/routing tags. CLAUDE.md''s ''aida edit <id> --tags batch:NAME'' reads like an add, but it''s a full replace. Footgun: any single-tag edit wipes the rest. Fix: add ''--add-tag <t>'' / ''--remove-tag <t>'' (additive/subtractive) and/or make ''--tags'' WARN that it replaces (or require ''--replace-tags'' for the destructive form). At minimum, document the replace semantics loudly. trace:from-friction'
