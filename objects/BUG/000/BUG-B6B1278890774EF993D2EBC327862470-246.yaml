    Findings:
    1. tests/test_status_cold_cache.py is not wired into .github/workflows/ci.yml (or any Makefile target). The spec's acceptance asks for a timed regression; an unexecuted script does not guard against the O(epics x store) rebuild returning. Add a CI step alongside 'Run single-spec show latency regression' (contracts shard, ci.yml ~L471-474) — e.g. run it against target/debug/aida with a --cold-budget/--warm-budget override sized for debug (the pre-fix debug binary exceeded 50s, so a ~30s debug cold budget still discriminates), keeping the 15s/5s defaults for optimized runs.
    2. Acceptance bullets 1-2 (cold <15s optimized, warm <5s) are evidenced only by spec comments (cold 6.50s / warm 1.62s, baseline timeout at 15s). Once wired, cite the CI step's printed timings in the PR body so the reviewer can verify from CI evidence.
