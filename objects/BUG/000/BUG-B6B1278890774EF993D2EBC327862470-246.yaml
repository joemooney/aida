title: 'Full aida status with no derived cache exceeds 50s on a ~7k-row store: the first-use cache rebuild is unbounded'
description: 'Split from BUG-2479 (advisor 2026-11-06 23:50). With the derived cache warm, full status on 7,247 rows takes about 5s (debug build). With the derived cache empty (a fresh clone, a cache-version bump, or a CI job with no warm-up step), the same command exceeded a 50s watchdog while the cache stayed at zero rows. That means it never populated the cache during the run, or rebuilt it serially per record. Acceptance: on a ~7k-row store snapshot with no derived cache, the first full status populates the cache and finishes within 15s on an optimized build, and the second run takes under 5s. Add a timed regression on a generated 7k-row fixture, not the real store.'
status: Approved
