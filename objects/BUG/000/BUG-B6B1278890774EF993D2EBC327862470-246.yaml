  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: Batched epic rollup is semantically equivalent to derive_epic_status (terminal skip, shared closure, first-match index) and unit-tested, but the new 7k-row timed regression is never executed by CI, so the performance acceptance is guarded only by implementer self-report.. No triage reason was given.'
