title: 'Full-tier retry never recovers a held PR: retry_candidate treats the pending merge-hold-gate status as running CI'
description: 'Found by the #4112 integration review (codex, 2026-11-15 18:35) in code from TASK-3105 (#4113, on main). aida-cli-lib/src/full_tier.rs:249-258: retry_candidate rejects every PENDING/EXPECTED commit status, including merge-hold-gate, which stays pending by design while a PR is held. An approved held PR with one completed/cancelled full run and no running CI never reaches cancellation verification or the ci:full retry; pr_train::typed_gate_member_with calls full_tier_gate before mandate-backed hold release, so it cannot recover by itself. Fix: exclude the known hold status context from the active-CI guard, keep refusing for genuine running checks, and still verify the completed/cancelled run. Regression: cancelled full marker + context=merge-hold-gate,state=PENDING asserts run verification and label retry.'
