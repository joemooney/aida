title: Orchestrator-spawned child can't verify its parentage — misidentifies legit orchestrator context (no env leak; BUG-233 was misdiagnosed)
description: |-
  \`AIDA_AUTO_COMPLETE=1\` is meant to live ONLY on orchestrator-spawned child processes (set via \`.env(\"AIDA_AUTO_COMPLETE\", \"1\")\` on the subprocess \`Command\` in \`RealPhaseDriver::run_implementer\` / \`run_reviewer\`). It is NOT meant to be exported into the user's interactive shell. But on 2026-05-17 the var was found set in the user's interactive shell — and while it's set, **every** \`aida queue work\` launched from that shell inherits it and misfires into \"orchestrator mode\" despite no orchestrator existing.

  ## Symptom (2026-05-18, surfaced during BUG-228 work)

  The BUG-228 implementer reported: *\"your shell has AIDA_AUTO_COMPLETE=1 exported. That var is meant to live only on an orchestrator-spawned child — a stray export in an interactive shell makes /aida-pickup's Step 6 misfire into 'orchestrator mode.'\"*

  Confirmed: the var is absent from a clean advisor shell, present in the user's drain shell. Contained to that one shell — not a system-wide leak — but corrosive while it persists.

  ## Blast radius — this likely caused BUG-232

  BUG-232 (\"plain --zen without --auto-complete stalls at 'say the word'\") was diagnosed as a --zen design gap. The real trigger is probably THIS leak: \`aida queue work TASK-264 --zen\` inherited the stale \`AIDA_AUTO_COMPLETE=1\`, so the session *believed* it was orchestrator-driven — suppressed the end-of-session menu and tried to \"exit for the orchestrator\" — but there was no orchestrator process. The limbo wasn't \"--zen without --auto-complete\"; it was \"--zen with a LYING AIDA_AUTO_COMPLETE.\" BUG-232's fix (gate menu-suppression on AIDA_AUTO_COMPLETE) is still valid, but it trusts a var that this BUG shows can lie.

  ## Two problems

  ### Problem A: where does it leak from?

  The orchestrator sets the var on child \`Command\`s only — that shouldn't escape to the parent. Candidate leak sources to investigate:
  - A shell helper / \`aida dev\` eval path that \`export\`s it
  - A killed/crashed orchestrator (Ctrl-C mid-drain) leaving a nested shell with the export
  - \`eval \"\$(aida ...)\"\` somewhere echoing an \`export AIDA_AUTO_COMPLETE=1\`
  - The user's shell rc sourced it accidentally

  ### Problem B: a process can't trust the var

  Even once the leak source is fixed, \`AIDA_AUTO_COMPLETE=1\` with no actual orchestrator parent should be *detectable*. A real orchestrator child has a parent \`aida\` process running the \`orchestrate()\` loop. A leaked var has no such parent.

  \`aida queue work\` should sanity-check: if \`AIDA_AUTO_COMPLETE=1\` but the parent process isn't an \`aida\` orchestrator (check \`PPID\`'s command, or have the orchestrator pass a corroborating signal like a per-run token the child verifies), warn loudly:

  \`\`\`
  ⚠ AIDA_AUTO_COMPLETE=1 is set but this process has no orchestrator parent.
    Likely a stale export leaked into your shell. Run: unset AIDA_AUTO_COMPLETE
    Proceeding in interactive mode (ignoring the stale var).
  \`\`\`

  ## Acceptance

  - [ ] Identify and fix the leak source (Problem A) — instrument or audit every path that could \`export\` the var vs set it on a child \`Command\`
  - [ ] Corroborating signal (Problem B): orchestrator passes a per-run token (e.g. \`AIDA_AUTO_COMPLETE_TOKEN=<uuid>\` matching the orchestrator's run) — child verifies the token names a live orchestrator before trusting orchestrator-mode; bare \`AIDA_AUTO_COMPLETE=1\` with no valid token → warn + treat as interactive
  - [ ] \`aida queue work\` prints the stale-var warning + \`unset\` hint when the var is set without a valid orchestrator parent
  - [ ] Tests: leaked var (no token) → interactive mode + warning; valid token → orchestrator mode; no var → interactive
  - [ ] Document the orchestrator env contract in \`docs/autonomous-drain.md\`

  ## Composes with

  - **BUG-232** (plain --zen limbo — this BUG is likely its true root cause; BUG-232's menu-suppression-gating fix should key off the *corroborated* signal, not the bare var)
  - **STORY-287** (--zen — AIDA_ZEN propagation is the same env-inheritance pattern; audit whether AIDA_ZEN can leak the same way)
  - **STORY-263 / STORY-276** (headless phases set env on children — same contract)
  - \`feedback_precise_lifecycle_vocabulary.md\` (an env var that *claims* orchestrator-mode but isn't — precision about actual vs claimed state)

  ## Origin

  2026-05-18: BUG-228 implementer flagged \`AIDA_AUTO_COMPLETE=1\` stuck in the user's interactive shell, misfiring \`/aida-pickup\` Step 6. Likely leaked from the 15:40 \`--auto-complete\` drain (the same incident that produced BUG-228's torn-write corruption). The var has been silently making interactive \`aida queue work\` invocations believe they're orchestrated for an unknown stretch of the day — a strong candidate root cause for BUG-232 and possibly other \"--zen behaved oddly\" reports.
