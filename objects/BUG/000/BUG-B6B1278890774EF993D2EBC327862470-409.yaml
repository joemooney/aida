  content: |-
    ## Implementer self-review
    Reviewed HEAD: 16ab4be32810bc381b3daa707cb1a47075e5e243 and the pending native-lane diff. Inspected the origin/main merge-base diff and checked for untracked additions.

    AC1: [evidence: behavioral-test] The existing launch test verifies selection of a promoted image. Both fixed-service fallback regressions use the service launcher with no live directory, verify the current executable is selected, and exercise controller admission (advisor_loop_service.rs:1464).
    AC2: [evidence: behavioral-test] Existing supervisor and worker-first handoff tests cover confirmed inode changes, heartbeat withdrawal, same-tick replacement, and retention of reviewer ancestry. The Round 4 condition retires only on a successful comparison reporting a different image (advisor_loop_service.rs:377).
