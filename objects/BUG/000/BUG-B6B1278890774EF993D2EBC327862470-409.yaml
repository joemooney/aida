title: Deputy shell supervisor spawns advisor-loop workers from /proc/self/exe, so review-watch and auto-train keep running a deleted pre-promotion binary after every dev build
description: |-
  Observed 2026-11-16 21:15: the operator's script deputy, pid 4023454 ('/proc/self/exe deputy shell run', started 2026-11-15 23:22), has exe -> target/agent/aida (deleted). The review-watch worker it respawned after BUG-2644 was promoted (pid 2023550) also has exe -> target/agent/aida (deleted), so it still runs the hardcoded max_concurrent=2 even though live is 3b63448 and config says 8. Every advisor-loop fix (BUG-2640, BUG-2644, TASK-3809, BUG-2621) only takes effect after the operator restarts the deputy by hand.
  Acceptance:
  1. The supervisor launches workers from the live binary path (~/.local/bin/aida, or the promoted live pair), never /proc/self/exe.
  2. After aida dev build promotes, the loops pick up the new binary within one supervision cycle: either the supervisor restarts workers when the live SHA changes, or dev build signals it.
  3. aida advisor loops status shows each worker's binary SHA and flags it when it differs from live.
