title: STORY-684 advisor-code-gate false-blocks worktree implementer agents — AIDA_SESSION_ROLE=advisor leaks from parent session into agent env
description: 'The STORY-684 advisor-no-code-write commit gate refuses a commit when the effective role resolves to advisor. But a worktree implementer agent fanned from an advisor session INHERITS AIDA_SESSION_ROLE=advisor in its env (same leak class as the role-gated-test issue), so the gate FALSE-BLOCKS legitimate implementer commits. Observed: the TASK-895 agent had to commit under AIDA_SESSION_ROLE=implementer / --no-verify. This is friction on every fanned agent + a footgun (--no-verify bypasses ALL hooks). Fix options: (a) the agent-launch path resets/unsets AIDA_SESSION_ROLE for implementer agents; (b) the gate distinguishes an agent-worktree context from the human advisor seat; (c) document the requirement that fanned agents commit with AIDA_SESSION_ROLE=implementer. Pick the robust substrate fix, not just docs.'
