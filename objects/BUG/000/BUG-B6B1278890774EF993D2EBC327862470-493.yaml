    Findings:
    1. aida-cli-lib/src/admission_owner.rs:1277–1293 (PR head), BUG-2732.AC1 and AC2: the failing manual admission call prunes both stale receipts while a live auto-train remains. The only successful admission is after the stale receipts are already gone and the live claim is dropped. A regression that deletes a stale receipt but returns AdmissionBusy for that attempt would pass this test while refusing a stale-only admission at wait_secs = 0. Exercise a fresh stale-only fixture and assert success on the first call, retain a separate live-holder refusal, and add criterion-level traces for both ACs.
