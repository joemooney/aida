    - `classify_in_flight_specs` now prefers a non-review-session branch over `pr-N` reviewer-worktree snapshots — `git branch --contains` lists both `pr-71` (snapshot) and `task-282` (real PR-source); the old alphabetical `.next()` picked `pr-71`, so `gh pr list --head pr-71` found nothing and the row rendered "no PR opened yet". Falls back to the `pr-N` branch only when it is the sole candidate.
    - New `classify_open_pr_display` pure helper maps the three drain-pipeline signals (gh reviewDecision, local review state, CI probe) onto an `InFlightPrDisplay` stage — adds the previously-missing "CI running" state so the orchestrator's CI-wait window no longer mis-reads as "start review". Render wording aligned to the spec's matrix vocabulary.

