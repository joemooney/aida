  content: 'Implemented WAITING re-admission using a persisted 20-minute backoff and the existing three-attempt per-head budget. Early probe, reservation selection, queue-work round validation and retry-status reporting distinguish WAITING from conclusive verdicts. Capacity and live/ambiguous descendant checks remain enforced. Distributed stopped owners emit explicit Inconclusive retry evidence; old ordinary terminal hub receipts retain operator recovery. Validation: 66 review_watch::tests passed, signed admission-chain regression passed (1 test), touched-file rustfmt checks and git diff --check passed. Edits remain uncommitted for native host publication.'
