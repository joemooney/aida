title: review-watch never re-reviews a head whose verdict was WAITING; the PR stalls until someone runs --release
description: 'Observed 2026-11-10: PR-3801 (and earlier #3809, #3803, #3797, #3777) got a WAITING verdict while CI was pending. review-watch then records the head as ''already reserved (Completed)'' and never re-admits it after CI turns green, so the PR sits with no approval until the advisor runs ''aida review watch --release PR-N''. #3801 waited about 6 hours. STORY-2697 now tells reviewers to approve defect-free heads while CI is pending, so new WAITING verdicts should be rarer, but a reviewer can still return WAITING for independent evidence or a named test. Expected: a WAITING attempt does not consume the head. Re-admit the same head once the condition it waited on changes (CI settled, or a bounded backoff such as 20 min), capped like BUG-2518''s no-verdict retries. Acceptance: (1) a head with a WAITING verdict is re-admitted after its CI settles with no manual release; (2) re-admission is capped and respects max_concurrent; (3) APPROVED and CHANGES REQUESTED heads are never re-admitted at the same head; (4) regression test.'
