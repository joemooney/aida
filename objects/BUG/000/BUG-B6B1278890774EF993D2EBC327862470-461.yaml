    ## Implementer self-review
    Reviewed HEAD: 116e03e175 + uncommitted rework (round 2 of PR #4344, advisor-121 findings 1-3), left for host publication.

    Fixes:
    1. [AC3] session_start.rs Unavailable arm: with no launch rollback, the receipt that acquire_claim_bound returns after a push error now goes into UnleasedClaimRelease, so a later pre-lease failure compare-and-deletes that exact claim.
    2. [ADR-76] New end-to-end regression bug_2697_a_memory_floor_refusal_at_the_drain_launcher_releases_the_shared_claim: a distributed store, session_start_with_receipt owning the guard, run_pickup_launch -> run_vendor_headless_to_exit refused at the memory floor (TEST_HOST). Asserts lease, tree and shared claim are gone locally and on origin.
    3. [CI] coordination.rs test fixture builds TOML values with aida_core::toml_quote::toml_string. scripts/check-portability.sh: rc 0.

    Finding 1 regression: bug_2697_an_errored_claim_push_is_released_when_an_unrolled_start_fails. A one-shot receivepack wrapper lets origin accept the claim, then fails the transport. rollback_failed_setup=false plus the before-lease failpoint; asserts the claim reached origin and is released there.

    Evidence: lane job: cargo test -p aida-cli-lib --lib pickup_launch_rollback_tests, 13 passed. Mutation check: with the Unavailable else-arm reverted and headless.rs's map_err(refused_before_spawn) removed, both new tests FAIL at their claim/rollback assertions (job j20261120T091559998-31-0); restored afterwards. cargo fmt --check OK; check-store-writers.py OK.

    Probes: no fail-open. A release that cannot reach the store only warns, and the claim stays healable by doctor. If the remote never got the claim, release finds no match and does nothing. A successful start clears the guard after the lease is written. Residual risk: the full make check-ci-fast (~90s) was not run because of this lane's 60s tool cap; the host fast-gate covers it. AC1/2/4/5/6 are unchanged by this round (Refs-only slice).
