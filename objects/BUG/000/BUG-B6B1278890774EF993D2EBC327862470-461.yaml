  content: 'ADVISOR RULING (advisor-121, 2026-11-19 13:40): standing authority for the product seat to release a stale shared coordination lease left by a pre-agent admission failure, until BUG-2697 lands, ONLY when ALL hold: (1) host is a local lane-sandbox UTS name (e.g. disrad-*); (2) the holder pid is verified gone on the lane host (ps -p); (3) heartbeat_at + ttl_secs is in the past; (4) process_backed = false; (5) doctor heal stale-leases cannot see it; (6) the record is backed up on the lane host first. Method: in .aida-store, git pull --rebase, git rm ONLY that lease file, commit IMMEDIATELY with subject ''chore(coordination): release lease <SCOPE>'' and a body citing the evidence, push, and verify it is absent on origin (do not leave it staged: concurrent store writers commit the whole index). Log each release as a comment here. Any condition unmet, or a lease whose holder could be alive: route to the advisor. Third instance today: BUG-2684 lease 01a1f27828ed.'
