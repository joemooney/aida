  harness_version: 2.1.328 (Claude Code)
- id: 01a1f58b-a611-78d2-bc22-e1a6a9ea3441
  author: joe
  content: 'Product 13:42: BUG-2684 lease 01a1f27828ed (claim 35395cf7, host disrad-dvp98b3puw, pid 3920097 gone, heartbeat 06:22Z): ''aida doctor heal stale-leases --id shared-35395cf7-... --yes'' HEALED it on dell1, unlike 01a1f4f93790 and 01a1f5182ee1, so no manual release was used. Process error on my side: I chained the manual git rm path into the same command instead of gating it on the heal result. It failed harmlessly (index.lock held by a concurrent store writer, no rm staged), and aida db sync --push left the store clean and in sync. From now on: run doctor heal first, then the manual path only on a ''no eligible finding'' result, in a separate step.'
