- id: 01a1f696-f5fb-70d0-88a1-0ea3a275594a
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: c32c84ad3e (branch bug-b6b1278890774ef993d2ebc327862470-461).
    AC3 [behavioral-test]: drain-launch admission refusals after the launch mark (memory floor, cold-start cap, disk, fast-gate) are marked RefusedBeforeSpawn (session/headless.rs run_vendor_headless_to_exit; lane_admission.rs), and launch_refused_before_agent honors the marker (queue_cmd/work.rs), so the pickup rollback releases lease, tree and claim. Test: pickup_launch_rollback_tests::bug_2697_an_admission_refusal_after_the_mark_rolls_back. A session start without the armed rollback releases its own claim if it fails before the lease write (session_start.rs UnleasedClaimRelease). Test: coordination::tests::bug2697_failed_start_without_rollback_releases_only_its_own_claim (also covers disarm and claim_id mismatch, and checks origin). The standalone launch already marked its agent only at spawn.
    AC4 [behavioral-test]: exited_holder_is_dead also accepts a claim with no exact lease and no lane record (lane_liveness::claim_worker_never_recorded); salvage is skipped for it. Tests: bug2697_doctor_reports_and_heals_a_claim_whose_admission_never_spawned (the 01a1f4f93790 shape, collect_doctor_findings_at + heal_exited_claim), bug2697_force_claim_replaces_..., bug2697_never_spawned_heal_refuses_without_complete_evidence (refuses on: fresh heartbeat, live creator, foreign PID namespace, other host, process_backed, review, unbound, absent clone, lane record present, lease present).
    Probe findings: the authority widening (heal/--force-claim deleting a shared claim) needs a confirmed NotFound on both the exact lease and the lane record. Every read error refuses, and the existing BUG-2655 refusal tests pass unchanged.
    Validation: cargo check --tests clean; 38 targeted tests pass (bug2697, bug2655, bug_2684, bug_2428, pickup_launch_rollback); check-store-writers OK; rustfmt clean. make check-ci-fast could not finish inside the lane's 60s tool cap: GitLab smoke, classifier inventory and test-touched planner passed, and it was killed in containment conformance (waiting for operator role entry). CI is the evidence.
    Residual risks: a heal run from a seat in a different PID namespace than the creator still cannot see the claim (by design: run it from the lane host). AC1/AC2/AC5 are not implemented; see the finding comment.
