    ## Implementer finding (claude lane, 2026-11-20): AC1/AC2/AC5 premise
    On dell1, disrad-dvp98b3puw is the machine's own kernel hostname, not a sandbox UTS name. Evidence from this lane: /proc/self/ns/uts = uts:[4026531838] (the INITIAL UTS namespace, so nothing re-names the host), /etc/hostname = disrad-dvp98b3puw, all 58 local leases in .aida/sessions record it, and all 79 shared claims carrying it record pid_namespace = 4026531836 (the initial PID namespace, i.e. host-side launchers, not sandboxed seats). 'dell1' is an operator label; no node registry entry names it (this clone's WORK node is 73022632d356..., alias HOME = b6b12788...).
    So the two unhealable claims were not unhealable because of a host mismatch: 01a1f4f93790 and 01a1f5182ee1 have NO session lease and NO .aida/lanes/headless-<lease>.json (their admission never spawned a worker), and the BUG-2655 heal required an exited-worker record. The healable 01a1f27828ed has a record with exited_at.
    This PR fixes that root cause (AC3 + AC4) and ships as Refs. AC1/AC2/AC5 as written (record node identity instead of a sandbox hostname, plus a sandbox_hostname field and a legacy note) have no distinct sandbox name to act on here. Advisor: decide whether to close them as not reproducible or restate them as 'show the node label (HOME/dell1) beside the host in lease output'. AC6 (drop the stopgap note from the lane-host checklist) is a product-seat step once this merges; that checklist is not in the repo.
