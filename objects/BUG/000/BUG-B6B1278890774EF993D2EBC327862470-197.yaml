title: A reviewer or implementer launch that fails before the agent starts leaves its worktree (aida-pr-N) or an orphaned lease, so every later attempt on that PR or spec refuses with 'branch pr-N is held by
description: '2026-11-03 09:20-09:40: review watch (launched from a Claude Bash) failed 5 reviews on ''grant key could not be put in a session keyring (errno 40)''. Each failure left /home/joe/ai/aida-worktrees/aida-pr-N clean, with no lease and no merge-hold marker. Every retry, including from a terminal that could mint the keyring, then refused with ''branch pr-N is held by worktree ... before pickup setup''. Implementer launches for BUG-2426 and BUG-2427 likewise left orphaned leases that needed --force-claim. Expected: a launch that fails before the agent process starts rolls back what it created (worktree, lease), or the next attempt adopts a clean, lease-less worktree for the same branch instead of refusing. Also, the keyring failure should be detected before the worktree is created.'
