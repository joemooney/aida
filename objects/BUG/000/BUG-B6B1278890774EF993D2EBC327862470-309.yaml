  content: 'advisor 19:15 lead for the lane (from integration agent, untested): the 17:52 failure was a backgrounded launch outliving its deputy job, but 18:03 (job 01a1d26e, shell alive until 18:09:49) still failed PR-3896 at 18:06:30 while PR-3902 succeeded. Suspects: check_roster reads the team roster from the store on each grant check, so a sibling launch''s store pull/checkout rewriting it mid-validation would surface as the bare message (RosterDenied/unreachable); and keyring possession for the runner grant across sibling launches. Integration agent has a diagnostics-only ''Refs BUG-2544'' PR (validate_child_delegation prints the real rejection) the lane can build on. trace:STORY-2737'
