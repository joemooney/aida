title: Second concurrent 'aida queue work PR-N --role reviewer' from the same deputy shell fails 'no valid parent seat grant is active'
description: 'Observed 2026-11-12 17:52 and 18:03: a deputy script launched reviewers for PR-3902 and PR-3896 in parallel from the operator''s default deputy (same AIDA_SESSION_GRANT). Both times the first launch proceeded (PR-3902 reviewed, verdict at 453348f) and the second failed with: error: "no valid parent seat grant is active" (exit 1, setup rolled back). Sequential launches from the same shell work (PR-3904 at 17:12). Expected: a parent grant can delegate several concurrent reviewer children, or the error names the real cause (grant consumed or swapped by the sibling delegation) and suggests launching them sequentially. Logs: .aida/tmp/lanes/review-3896.log.'
