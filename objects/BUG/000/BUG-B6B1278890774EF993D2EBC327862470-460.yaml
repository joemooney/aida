    Findings:
    1. [P1; severity=p1; blocking_tier=unmet-claimed-ac; file=aida-cli-lib/src/ship_from_seat.rs; lines=2386-2390,2466-2474] Carry the host's partial-completion veto through publication and landing, rather than only refusing Done. A seat can already contain a commit such as `feat: slice one (STORY-1)` while STORY-1 has an outstanding Parent child. run_from_with_reconciliation pushes that tip; mark_done_after_push_with correctly returns false because of the child, but its result is discarded by mark_done_after_confirmed_push. finish_published/ aligned_title then uses subject_completes alone, so it preserves or even upgrades the PR title to `(STORY-1)` despite the host's partial decision. When that PR lands, auto_bump_scan's bare-trailer candidates accept Approved/InProgress and apply_auto_bump_flip completes the parent without consulting its outstanding children. The same escape exists after a native declaration initially passes but the child graph changes before the locked Done write: refusing Done does not remove the completing commit/title evidence. This violates advisor AC6 and D1-D2/A2. The added bug_2696_sliced_spec_first_slice_landing_stays_open masks this path by explicitly fabricating a `(Refs STORY-9105)` landing after testing a bare completing subject. Preserve a verified partial/completing result across all publication paths and ensure stale/partial evidence cannot subsequently authorize landing completion, including completion trailers retained in squash bodies. Add an end-to-end committed-seat/outstanding-child regression and a lock-time graph-change -> publication -> landing regression asserting the parent remains open. Present in original head and pinned landed tree; independent of newer base changes.
    2. [P2; severity=p2; blocking_tier=unmet-claimed-ac; file=aida-cli-lib/src/db_reconcile.rs; lines=2138-2156,2497] Retain retry state when writing the required Refs-landing triage note fails. note_refs_landings_on_open_specs returns unit and only prints a warning for an update_spec_atomically error. For an Approved spec, reference recovery does no write and returns success; after a transient note-write failure (for example writer-lock contention), a clean store owes no push, so auto_bump_done_to_completed_with can still return scanned=true. run_deferred_code_reconcile then records the successful reconcile and clears its pending scan base. A retry with unchanged inputs is coalesced away, and subsequent narrow scans can exclude the landing permanently. The spec stays open with no durable triage note, violating ac a46268 / AC3. Propagate note-write failures into the scan's incomplete result (or persist the individual landing for retry), while retaining successful independent work. Add a regression that refuses the note write, verifies no successful checkpoint, then restores the writer and verifies exactly one durable note on retry. Existing replay tests cover successful writes only. Present in original head and pinned landed tree; independent of newer base changes.
