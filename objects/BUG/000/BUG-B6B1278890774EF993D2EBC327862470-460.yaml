    - AC2 (Done completes on (SPEC) and (Refs SPEC)): [behavioral-test] auto_bump_done_tests::bug_2696_done_spec_completes_on_completing_and_refs_landings.
    - AC3 (Refs on non-Done stays open + note): [behavioral-test] bug_2696_refs_landing_on_open_spec_stays_open_with_one_note (one note across a replayed scan).
    - AC4 (punt never sets Done): [behavioral-test] seat_publish_tests::bug_2696_punted_publication_never_sets_done.
    - AC5 (pushed to shared store): [manual-inspection] auto_bump_done_to_completed_with compares store HEAD before/after the scan and calls auto_push_store_best_effort when it moved; mark_done_after_push_in pushes after its write. No remote in unit fixtures, so the push itself is not exercised by a test.
    - AC6 (sliced spec first slice stays open): [behavioral-test] bug_2696_sliced_spec_first_slice_landing_stays_open; publication_completion::tests::bug_2696_outstanding_slice_plan_withholds_completion.

    Probe findings / fixes:
    - The orchestrator's ensure_spec_done_after_pr set Done after any PR open; with D4 that would let a partial slice's Refs landing complete the spec. Fixed: it now skips Refs tips and outstanding slice plans.
    - An existing TASK-1765 assertion (Refs squash on a Done spec stays Done) contradicted D4/AC2; updated. The aida: no-complete body marker and [k/N] slice subjects still withhold.
    - The host re-checks the slice plan when it reads a declaration, so a seat that edits completes_spec=true cannot complete a sliced spec.

    Residual risks:
    - 'Slice plan' means non-terminal child specs (outgoing Parent edges). A plan written only in comment prose is not detected; lanes still declare --partial-slice.
    - A hand-written (Refs ID) still means partial (fail-closed), with a note pointing at --partial-slice, so codex Refs drift now shows up as an AC3 note instead of a silently open spec.
    - task_2902_launch_paths_preserve_signals_on_refused_spawn fails locally because of the lane-launch disk-headroom floor (31 GiB free < 60 GiB). Environmental, and it fails the same way without this change.
    - make check-ci-fast takes longer than the 60s tool cap here. Ran instead: rustfmt --check, store-writer ratchet (regenerated), glyph lint, structural guards, check-templates, help golden regenerated.
