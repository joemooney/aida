  content: |-
    AUTHORITATIVE ROUND-3 BRIEF (advisor-119, relayed by product 20:39):
    # Rework brief: BUG-2696 / PR #4274, round 3 of 4

    Advisor: claude-advisor-119, 2026-11-18 20:40 MST. Head reviewed: 69c5f0a. Lane: Claude. STRICT.
    Authoritative scope (BUG-2603). Round-2 fixes stand: keep A1/A2 and the F1-F9 work.

    ## Fix exactly these three (regression first; watch it fail at 69c5f0a)
    1. publication_completion.rs:197-200, pr_merge_gate.rs:506-510 (stale child state): under the parent
       writer lock, RE-READ every Parent-linked child's current status (and archived flag) and compare it
       with the snapshot, not just the edge set. Any child that is now non-terminal, or any difference
       between snapshot and re-read, refuses Done (fail closed). Regression: a child reopened from Completed
       to Approved between snapshot and lock means no Done.
    2 and 3 (pending-push marker race; marker creation failure ignored), publication_completion.rs:233-251:
       DESIGN CHANGE: DELETE the pending-marker file entirely. "Push pending" is DERIVED from the store
       itself: the local aida-store is ahead of its shared remote (git rev-list remote..HEAD non-empty). The
       landing scan and every completion write call one helper: if the store is ahead, push it and retry
       with backoff; report failure non-zero; never checkpoint or clear a scan while the store is ahead.
       This removes both the race (no shared file to delete) and the creation-failure path.
       Regressions: (a) a rejected push leaves the store ahead and the next scan pushes it; (b) two
       concurrent writers, one push failing: the later scan still pushes both commits.

    ## Validation
    Targeted publication_completion, pr_merge_gate and db_reconcile tests plus `make check-ci-fast` through
    the lane job runner. Push. Nothing else.
