- id: 01a1f18d-1302-7652-92e6-8d9d60313f1c
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2696):
    Verdict: CHANGES REQUESTED
    Reviewed commit: ee4106336f0b
    Recorded: 2026-11-19T02:03:57.519871128+00:00
    Findings:
    1. 1. [P1; blocking_tier=p1] aida-cli-lib/src/pr_cmd.rs:1941: The added Command::new("git") increases this lease-reader file's raw-Git count from 47 to 48. Both exact-head FAST CI jobs fail the TASK-2143 clone-safety ratchet for this precise call, and the aggregate Build fails. Use aida_core::git_ops::host_git_command(&project_root) for the new read rather than increasing the allowlist. This review identifies the source regression; it is not merely reporting a red CI badge.
    2. 2. [P1; blocking_tier=acceptance] aida-cli-lib/src/ship_from_seat.rs:2227 (also 2140 and 2335): A completing native declaration loses its meaning when host publication reconciles a diverged remote PR head. The reconciliation creates a new tip with the unconditional subject '[host] chore(seat): merge remote PR head (Refs SPEC)'. The new Done write and aligned_title both inspect only that synthetic tip, so a successful completes_spec=true rework push leaves the spec Approved/In Progress and can retitle its PR to Refs. The existing task_2879_run_at_reconciles_moved_origin_and_refuses_unsafe_merges fixture demonstrates that exact tip transformation, but only with partial inputs. Carry the verified publication completeness across reconciliation and add a completing-declaration reconciliation regression that checks Done and the PR title.
    3. 3. [P1; blocking_tier=security; class=authority-bypass] aida-cli-lib/src/native_publication.rs:323-328: The host's slice-plan veto is conditional on the seat-controlled completes_spec field being present. Removing that optional field (or setting it null) selects the legacy arm and preserves a bare completing trailer despite outstanding children. The seat already owns this JSON file and can preserve its valid binding. mark_done_after_push_in refusing Done does not protect landing: the existing bare-trailer auto-bump completes Approved/In Progress specs. Apply the host slice-plan veto to legacy declarations too, and refuse unknown/unreadable completeness evidence rather than treating it as true (publication_completion.rs:35-40). Add missing-field/null-field and unavailable-store negative tests with an outstanding slice.
    4. 4. [P1; blocking_tier=security; class=authority-bypass] aida-cli-lib/src/publication_completion.rs:129-137 and aida-cli-lib/src/pr_merge_gate.rs:476-496: Slice-plan authorization is checked on an unlocked snapshot, while the atomic writer rechecks only status. If an advisor adds an outstanding child after that snapshot but before the writer lock, the closure receives the fresh parent including the new relationship and still marks it Done. A later Refs landing then completes work the new plan intentionally left open. Revalidate the relevant graph at the locked mutation boundary, or compare/refuse changed graph evidence. Cover the race in both publication and PR-open Done writers; pr_merge_gate already exposes status_write_race_seam immediately after the stale check.
    5. 5. [P1; blocking_tier=acceptance] aida-cli-lib/src/db_reconcile.rs:2377-2381 and 2489: AC3 notes use refs_landed, which deliberately excludes numbered non-final slice subjects, plan commits and messages carrying the explicit non-completing marker. For example an Approved spec receiving '[1/3] fix: slice (Refs BUG-1)' stays open but gets no new triage note. The older lane recovery path only notes eligible InProgress specs without a retaining lease/claim/open PR, so it does not cover the Approved example. Use the full reference-landing set for notification, independently of completion eligibility, and test open specs with numbered slices and explicit no-complete markers.
    6. 6. [P1; blocking_tier=acceptance] aida-cli-lib/src/db_reconcile.rs:2205-2208: Shared-store propagation is attempted only when this invocation changes store HEAD, and auto_push_store_best_effort returns no success indication. An ordinary rejected/divergent or temporarily unreachable remote leaves Completed only locally, yet the scan reports success and run_deferred_code_reconcile can checkpoint/clear its pending scan. A later scan sees Completed and unchanged HEAD, so this new path never retries that failed push. The same one-shot behavior exists after a Done write in publication_completion.rs:138. Persist pending propagation and retry until an exact store push succeeds, or retain a failed reconciliation result that guarantees retry. Add a remote-store test covering rejection/failure followed by recovery and confirm the other host receives completion; documentation asserting immediate push is not evidence that this works.
    7. 7. [P1; blocking_tier=acceptance] aida-cli-lib/src/tests/bug_home_038_seat_publish_tests.rs:2508: AC4 explicitly requires refused-before-start as well as punt coverage. The new regression asserts status only for a punt after committing; the modified declaration loop covers nonzero child exit, which is also a different case. The existing task_2902_launch_paths_preserve_signals_on_refused_spawn checks refusal receipts, signals and stale declarations but never reloads the spec to assert it did not become Done. Add that required status assertion through a real refused-before-start launch path with a completing declaration/retained publication evidence.
    8. 8. [P1; blocking_tier=acceptance] aida-cli-lib/src/publication_completion.rs:21-26: The accepted advisor rule says an advisor-recorded slice plan with later slices outstanding forces partial publication. This implementation recognizes only outgoing Parent edges to existing child specs. An approved plan recorded in a spec comment or linked plan document, with later slices but no decomposed child objects, is silently treated as no plan: default declaration becomes completing, the push sets Done and its first landing completes the entire spec. The implementer self-review explicitly acknowledges this unsupported case, but the accepted sketch does not exempt it. Establish and enforce a durable authoritative representation for recorded slice plans (including migration/refusal for existing plans), rather than relying on the lane to remember --partial-slice, and add the corresponding first-slice regression.
    9. 9. [P1; blocking_tier=security; class=authority-bypass] aida-cli-lib/src/pr_merge_gate.rs:461-475: Failure to read the tip subject is converted to an empty string, which passes the new partial-publication veto and permits the PR-open writer to set Done. Attribution is checked earlier over branch commit evidence, so it does not establish that this separate tip read succeeded or that the latest tip declares completion. A failed Git read on a branch carrying earlier valid attribution and a partial tip must retain the spec, not authorize Done. Require a successful, positively completing tip observation through the guarded Git API and add a regression where this read fails after attribution succeeds.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
