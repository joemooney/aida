  content: 'Implemented in the native implementer worktree; edits intentionally uncommitted for host publication. Default PR/MR reviewer pickup now reclaims one exact dead reviewer lease and its clean unused unlocked default worktree only when the recorded head is an ancestor of a freshly fetched forge head and actual checkout commits are covered. Holds and mail retention remain guarded; lease release follows successful tree removal. Session-end and takeover coverage share reviewer-only forge-head evidence; claims, implementers and private clones keep ordinary remote coverage. Fetch uses an invocation-private ref without changing FETCH_HEAD or the occupied branch. Changed: aida-cli-lib/src/pr_lease_takeover.rs, queue_cmd.rs, seat_clone.rs, session_end.rs, tests/bug_2457_review_repickup_tests.rs; docs/cli/06-roles-sessions.md. Validation: cargo test -p aida-cli-lib --lib review_repickup_tests (2 passed); cargo test -p aida-cli-lib --lib story_2315_pr_lease_takeover_tests (32 passed); cargo fmt --all -- --check and git diff --check passed. Regression exercises dead old-head to new-head pickup plus refusal for live/unknown owners, dirt, locks, holders, rewritten/missing refs, absent recorded metadata, local commits, claims and duplicate leases; confirms merge-hold preservation and FETCH_HEAD stability. No known blockers. No commit, push, PR, ship, review record or queue completion run from this seat.'
