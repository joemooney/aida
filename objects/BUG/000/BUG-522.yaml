title: 'session namespace collides two unrelated concepts: leases (active scoped work) vs list (historical Claude conversations)'
description: |
  aida session list/resume/new/prune/forget operate on historical Claude Code .jsonl conversations; aida session start/end/leases/show/manifest operate on scoped work LEASES. The help text repeatedly has to disclaim this. A newcomer typing aida session list to find what is running gets the wrong substrate. Fix options: split the conversation verbs into aida convo/aida cc, OR have session list print a one-line pointer to session leases. From CLI-manual audit (EPIC-40).

  ## Acceptance

  - Resolved (2026-06-13, operator decision via `aida questions answer`): Rename session list to session conversations (or history) — the historical view gets a self-describing name; leases stays
