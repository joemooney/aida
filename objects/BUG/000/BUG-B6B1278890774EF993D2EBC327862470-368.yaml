title: Integration-track lane self-publishes its PR against main
description: |
  Observed 2026-11-15 15:2x on dell1: a lane launched with `~/lane-start.sh --track integration BUG-2588 codex` (AIDA_TRACK=integration) self-published its work as PR #4120 with base MAIN, and removed the seat worktree. The integration seat had to retarget #4120 to `integration` by hand. Earlier rule (#4038, BUG-2583): never open an integration-based branch against main. Here the publisher ignored the track entirely.
  Related: BUG-2603 (rework pickup merges main into integration PRs). Same root theme: the lane launcher does not carry AIDA_TRACK into base selection.

  Acceptance:
  - A lane with AIDA_TRACK=integration either publishes with base `integration` or skips publication (PUBLISH SKIPPED, the documented behaviour), never base main.
  - Regression test covering the publish-base choice for both tracks.
