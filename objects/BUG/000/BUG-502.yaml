  author: joe
  content: 'Second accuracy gap found in the same dogfood (2026-06-11): ''aida human unblock'' also does NOT exclude specs already in the burndown ready set — BUG-499/500/501/502 are queued + ready, yet the prompt lists them under ''CLARIFY FIRST (missing acceptance)''. Two fixes belong together: (1) skip specs already queued/in-the-ready-set (they''re groomed — no action); (2) reconcile the ''under-specified'' check with the pickability gate (the gate doesn''t require a ## Acceptance section, so a queued-ready spec shouldn''t be flagged ''missing acceptance → clarify''). Net: aida human unblock should only surface OPEN specs NOT yet groomed, and its buckets should agree with ''aida burndown plan''.'
