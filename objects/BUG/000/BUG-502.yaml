title: aida human unblock misclassifies review:draft-only specs as QUEUE/CLARIFY instead of a REVIEW bucket
description: 'Dogfood 2026-06-11: ''aida human unblock'' put STORY-543 in QUEUE and TASK-715 in CLARIFY-FIRST, but BOTH are ''review:draft-only'' — built work awaiting human REVIEW, not re-implementation. Queueing/clarifying them would re-build done work. The unblock prompt-assembler doesn''t recognize review:draft-only as held-for-review (the exclusion BUG-495 added to ''questions sweep'' isn''t applied here). Fix: aida human unblock must classify review:draft-only specs into a distinct REVIEW bucket (''built — review it via aida review / reopen the draft PR''), never QUEUE or CLARIFY. Reuse the held-or-built predicate from BUG-495. Also: it labels build-supervised needs-human specs as ''awaiting a human decision'' — that''s the needs-human conflation TASK-744 fixes; once TASK-744 lands, unblock should say ''build-supervised: aida queue work --zen'' vs ''decision: answer''.'
