  content: |-
    Implemented via commit 3eb446c0 (PR to follow):

    - `aida push` now checks `gh pr list --head <branch> --state open` first; on empty, it queries `--state merged`. A merged-PR hit triggers an explicit warning naming the merged PR, two concrete fix paths (`gh pr create --base main --head <branch>` or cherry-pick onto a fresh branch off `origin/main`), and a prompt before continuing.
    - Skipped on `--no-rebase-check`, pushing main/master, or when `gh` is missing/failing (silent rather than crying wolf).
    - Extracted `parse_gh_pr_line` shared between open- and merged-PR detection; unit-tested for well-formed, empty, malformed, and multi-line inputs.
    - Agent skills updated: `aida-pr.md` step 6 now says "never claim a push extends a PR without verifying state"; `aida-review.md` Edge cases gains a BUG-88 row for the mid-review-after-merge case.

    Test status: 289/289 aida-cli tests green (4 new BUG-88 cases); `cargo fmt --all -- --check` clean.
