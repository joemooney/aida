title: conflict.rs truncate() panics on non-ASCII descriptions (byte-slice after byte-length check)
description: 'VERIFIED (advisor read conflict.rs:176-182, found by quality-sweep reviewer). fn truncate checks ''s.len() <= max'' (BYTE length) then slices ''&s[..max]'' (BYTE index). If s is >max bytes and a multi-byte UTF-8 char straddles byte index max, ''&s[..max]'' panics (''byte index N is not a char boundary''). truncate is called on local/remote.description in detect_conflict, so a conflict between two specs whose descriptions contain emoji/accents/CJK near offset 100 crashes conflict detection. The user explicitly likes emoji in content, so this is a live trigger. Repro: truncate(&("a".repeat(99) + "é"), 100). Fix: use chars().take(max) or a char_boundary-aware slice.'
