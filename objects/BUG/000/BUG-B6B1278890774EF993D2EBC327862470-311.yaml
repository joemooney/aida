title: Reviewer lane keeps running (incl. cargo builds) after its verdict is bound, holding the deputy job
description: '2026-11-12 18:24-18:36: the PR-3906 reviewer (''aida queue work PR-3906 --role reviewer --no-human --vendor codex'', pid 2950282) recorded APPROVED at 01:24:45Z but kept running for 10+ more minutes, compiling aida_cli_lib (rustc --crate-name aida_cli_lib) in its worktree. Reviewers run no cargo by default (standing order 7). Its deputy job stayed ''running'', so the queued promotion ship waited behind it. Want: (1) the reviewer lane exits promptly once its verdict is bound; (2) reviewer prompts/policy deny unrequested cargo builds (or the reviewer sandbox has no cargo slot); (3) the lane result line records post-verdict runtime.'
