  content: |
    Implemented BUG-2546 in the native lane; edits remain uncommitted for host publication.

    Changed files: aida-cli-lib/src/reviewer_completion.rs (new scoped completion watcher and regression tests), headless_linger.rs (stop independent of final result/background holds), review_watch.rs and session.rs (fresh/resumed and contained wait integration), queue_cmd/work.rs (all standalone reviewer policy, scope and credited-spec lookup), lib.rs (module registration).

    Standalone headless reviewers stop after a fresh terminal verdict matching their child grant and attested SHA, with a two-second exit grace and existing process-tree termination. Existing collector remains responsible for verdict acceptance. All standalone reviewer prompts forbid local cargo/test/build work unless explicitly requested and require immediate exit after recording. Result output reports post_verdict_runtime_ms from the recorded timestamp; missing evidence reports unknown. Interactive sessions retain human-controlled process lifetime.

    Validation: launcher cargo test --profile agent -p aida-cli-lib --lib -- headless_linger::tests: 7 passed. Launcher cargo test --profile agent -p aida-cli-lib --lib -- bug2546: 2 passed (latest build; repeated queued run also passed). git diff --check passed. untested=false.

