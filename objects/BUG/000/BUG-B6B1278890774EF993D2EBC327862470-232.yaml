    3. CI RED: CI (contracts) fails at b1b9b5b6 in step 'CLI-manual drift-guard (every command documented)' (docs/cli/verify-manual.py); main's base 049e5206 passes that job. The likely cause is the new paragraph in docs/cli/02-specs.md:235-247. It sits under the '### aida trace' section, so the bare flag citations --full, --verbose, --json and --no-git resolve against the trace subtree (flag_accuracy_misses) and fail. Move the show-behaviour paragraph under the 'aida show' entry, or cite flags as full 'aida show <ID> --full' commands, then confirm with make check-ci-fast or the verifier.
