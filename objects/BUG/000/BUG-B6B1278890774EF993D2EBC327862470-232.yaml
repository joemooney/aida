    Native implementer handoff: implementation is uncommitted; no commit, push, PR, queue completion, pr ship, or review record was performed. Native publication declaration recorded: [AI:codex] fix(show): avoid allocation and refresh hint lock waits (Refs BUG-2466).

    Changed files:
    - aida-cli-lib/src/git_backend_cmd.rs: skip ID dispenser for show, including fallback; open.backend/open.location/open.cache timing sub-spans.
    - aida-core/src/db/refresh_request.rs: nonblocking advisory request locks; watchdog-protected contention test plus ordinary update recovery.
    - aida-cli-lib/src/trace.rs: shared show linkage deadline 1.2 seconds; existing partial/unknown evidence retained.
    - aida-cli-lib/src/tests/bug_1993_show_deadline_tests.rs: existing slow-probe test uses production show deadline.
    - aida-cli/tests/bug_1993_show_phase_timings.rs: asserts new sub-spans preserve aggregate timing semantics.
    - tests/test_show_latency.py: request/dispenser lock regressions, fixture-worker synchronization, slow Git subprocess check.
    - docs/cli/02-specs.md: bounded read behavior and timing diagnostics.

    Validation PASS:
    - cargo build --offline --profile agent -p aida-cli -j 2.
    - python3 tests/test_show_latency.py against the newly built binary: refresh-flock/request-lock cases approximately 0.15-0.37 seconds, dispenser-lock case successful, SQLite-writer fallback 0.33 seconds, delayed 3-second Git log returns in 1.40 seconds with incomplete linkage and shipped unknown; strict refresh recovery works.
    - cargo test --offline --profile agent -p aida-core --lib db::refresh_request::tests:: -j 2: 8 passed.
    - cargo test --offline --profile agent -p aida-cli --test bug_1993_show_phase_timings -j 2: 6 passed.
    - cargo fmt --all -- --check; git diff --check; Python syntax check.
    Baseline: each new request/dispenser lock regression independently times out after 6 seconds against the host binary. Live modified-binary smoke probes: 3.70, 0.52, 0.47 seconds, all exit 0; the first reports open.cache=1590ms and linkage=1375ms, then warm open.cache=37-43ms.

    Remaining acceptance/blocker: acceptance 3 requires observing the 24-hour post-deployment performance window at unchanged 2000ms / 10% / 5000ms thresholds. That future result cannot be established in this seat. Keep the spec In Progress and preserve Refs publication until the production guard passes. The changed library unit deadline test was not separately compiled/run; the binary slow-Git test exercises the production deadline directly. No design fork or punt/hold was introduced.
