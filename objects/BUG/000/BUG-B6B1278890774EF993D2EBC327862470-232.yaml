  content: |
    Investigation: the 2026-11-05T18:49:07 usage event attributes 13,067 ms of its 15,876 ms total to backend open. Other ceiling breaches spend about 4 seconds in linkage. Reproduced two independent unbounded open waits in isolated fixtures against the current host binary: a held cache refresh-request.lock and a held legacy .aida/dispenser.lock each leave show blocked until a 6-second watchdog kills it. Existing refresh-flock fixtures still return in roughly 0.1-0.3 seconds.

    Implementation in progress: show skips opening the ID allocator; advisory hint operations use nonblocking flock in fast-fail mode and serve Deferred on contention; optional show linkage uses a shared 1.2-second deadline with existing partial/unknown labels; open.backend/open.location/open.cache sub-spans retain aggregate timing semantics. Added held-lock regression coverage and documentation. Build and targeted validation pending. Acceptance 3 requires the post-deployment 24-hour performance window at the unchanged 2000 ms / 10% / 5000 ms thresholds; this seat cannot attest that future window.
