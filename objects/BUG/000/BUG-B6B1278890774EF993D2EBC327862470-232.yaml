- id: 01a1b868-fc3d-7712-b1e8-70e55f14c5d0
  author: joe
  content: 'ADVISOR RULING 2026-11-07 17:35 MST: the 21:23Z performance-guard trip is a REAL regression, not window contamination. Post-fix samples only (~/.aida/usage.jsonl, cmd=show, ts >= 2026-11-07T00:10Z, the #3524 go-live): n=604, 93 over 2000ms = 15.4% (tolerance 10%), p50 916ms, p90 2395ms, max 7578ms (ceiling 5000ms breached). #3524 cut the worst case (13.9s -> 7.6s) but not the over-budget rate. Slowest phase in the over-budget calls: linkage 38, open.cache 30, residual 13, notice 5. 81 of 93 are implementer-role calls (lanes under build load). Budget stays (ADR-53). NEXT SLICE: (1) linkage: do not compute shipped linkage on the default show path. Compute it only for --full/--format json callers that need it, or serve it from a cached per-spec value keyed by store head and main SHA; (2) open.cache: find the lock or refresh wait in the 30 slow open.cache calls and make show read-only against a stale-OK cache; (3) add a test that asserts default show runs no git log walk. Acceptance unchanged: 24h of guard passes after go-live. LIGHT gate.'
