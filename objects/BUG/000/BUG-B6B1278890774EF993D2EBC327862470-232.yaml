    PR #3658 rework for reviewed head 88d7cbb5d966 (BUG-2466). Uncommitted native-seat edits; host publication required.

    Changed files:
    - aida-core/src/db/cached_git_backend.rs: unreadable snapshot freshness evidence is treated as stale, preserving bounded agreed-ID fallback; snapshot relationship readers share one bounded fallback index. Added regressions for unreadable generation evidence and exhausted relationship budgets, with cached-target and unbounded positive controls.
    - aida-core/src/object_store.rs: optional deadline checks during read-only directory enumeration, so enumeration and parsing share the relationship fallback deadline.
    - aida-cli-lib/src/requirements_cli.rs: correct --no-git and --card help; unresolved blockers display unknown rather than claiming missing after a partial scan.
    - aida-cli-lib/src/tests/golden/cli_help_snapshot.txt: corresponding help contract.
    - aida-core/templates/skills/aida-{clarify,guided-implement,learn,pickup}.md: explicitly request --full where Git linkage is required.
    - aida-cli/tests/bug_1993_show_phase_timings.rs and tests/test_show_latency.py: explicit private mode for synthetic allocation evidence under umask 0002; Rust failure diagnostics now preserve process status and stdout.
    - docs/cli/{01-getting-started,08-reporting,09-integrations}.md: correct expanded linkage semantics and document bounded relationship fallback.

    Validation already passed: 6 show_snapshot tests; 2 targeted_reader tests; static manual check; live manual checks for all 3 edited chapters; make check-templates; rustfmt for changed core sources; git diff --check.

    Template sync limitation: make sync-templates reached portable agent_skill_pack sync, then failed with read-only filesystem for protected .agents. Template masters are updated, generated .claude links are valid, and make check-templates passes (.agents absent clean no-op). Host must finish sync if it requires portable-pack installation.

    Remote CI at existing PR head was still pending for contracts, lib-0/lib-1, cli-0/cli-1 and gates; rest passed. merge-hold-gate failed for the existing supervised hold; advisor/human clearance remains necessary. No green CI claim for the future uncommitted rework head. Acceptance remains the unchanged 2000ms / 10% / 5000ms production guard passing for 24 hours after deployment. Keep In Progress and Refs publication credit. No new punt/hold introduced.

    Standalone lane cargo build passed (j20261108T073104096-2-0). Python latency suite passed against the newly built overlay binary with umask 022: held locks 23-37ms, slow Git 1369ms. Initial Rust timing run failed 6/6 during init fixture setup because allocation evidence inherited group-writable permissions; fixture modes corrected; full six-test rerun passed (j20261108T074014261-2-0), as did the isolated one-test diagnostic (j20261108T073902676-2-0). Initial help snapshot test failed on card wording; golden corrected and executed-test rerun passed (j20261108T073518682-2-0).

    Final Python rerun with the lane default umask 0002 passed after fixture fix: refresh lock 79-230ms, request lock 118-254ms, SQLite-writer case 80ms, slow Git 1352ms. The default show no-log/no-merge-base/no-diff assertions and explicit linkage positive controls passed. No commit, push, PR creation, queue completion, pr ship or review record performed.
