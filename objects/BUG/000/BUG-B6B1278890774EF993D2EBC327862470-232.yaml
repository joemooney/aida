    Findings:
    1. MAJOR correctness: with_inner_stale_snapshot (aida-core/src/db/cache.rs open_stale_snapshot) falls back to an EMPTY in-memory index for a missing/corrupt/structurally-drifted cache, and never refreshes a stale one. resolve_unambiguous_exact (cached_git_backend.rs:283-330) then finds no candidates and calls inner.get_requirement_by_object_file(id), which only reads the file named by the id (git_backend.rs:557-600) and does no agreed-id scan. Agreed IDs are not file names here (BUG-2466 lives in objects/BUG/000/BUG-B6B1278890774EF993D2EBC327862470-232.yaml), so on a fresh clone, after deleting the cache, after a schema-drifting binary upgrade, or for any spec whose agreed id was assigned after the last cache stamp, 'aida show BUG-2466' returns 'Requirement not found'. Previously show built or refreshed the cache first. Fix: when snapshot_only and the cache misses (or the index is the empty fallback), resolve via the bounded agreed-id scan (resolve_by_bounded_scan or equivalent) before declaring not-found.
    2. TEST GAP for the above: show_snapshot_missing_or_corrupt_cache_preserves_disk_and_reads_objects and show_reads_canonical_when_a_writer_blocks_the_first_schema_write only show specs whose id equals the object file name (FR-1-001 / the fixture spec). Add a regression that shows a spec by an agreed_id that differs from its origin/file id, against (a) a missing cache, (b) a corrupt cache and (c) a stale cache stamped before the agreed id was assigned.
    3. CI RED: CI (contracts) fails at b1b9b5b6 in step 'CLI-manual drift-guard (every command documented)' (docs/cli/verify-manual.py); main's base 049e5206 passes that job. The likely cause is the new paragraph in docs/cli/02-specs.md:235-247. It sits under the '### aida trace' section, so the bare flag citations --full, --verbose, --json and --no-git resolve against the trace subtree (flag_accuracy_misses) and fail. Move the show-behaviour paragraph under the 'aida show' entry, or cite flags as full 'aida show <ID> --full' commands, then confirm with make check-ci-fast or the verifier.
    4. DOC ACCURACY: docs/cli/02-specs.md:239-240 says missing/incompatible/unreadable caches still return the requested spec from canonical YAML. That is false for agreed IDs (finding 1). Correct the docs together with the fix.
    5. MINOR test fragility: tests/test_show_latency.py new default-show loop calls calls.read_text() after calls.unlink(). If a future show invokes no git subprocess at all (the goal of this change), the shim never creates the file and the test fails with FileNotFoundError instead of passing. Use calls.read_text() if calls.exists() else ''.
