title: 'aida show tail latency: 15% of calls over budget and 15.9s worst under contention; calls block on a lock or I/O, not CPU'
description: |
  The performance-guard has tripped on `aida show` continuously since 2026-10-30, and the trips have continued after BUG-2402 was marked done.

  Trend (guard trips, 24h window, 2000 ms budget, 10% tolerance, 5000 ms ceiling):
  - 2026-11-04: 13-15 of 184-250 calls over budget, worst 5226 ms
  - 2026-11-05 14:22Z: 46 of 328, worst 8655 ms
  - 2026-11-06 14:41Z: 105 of 677 (15.5%), worst 15876 ms; the ceiling is breached

  Probe at 2026-11-06 10:05 MST, host load average 36 on 6 cores: three `aida show BUG-2386` runs took 0.9 to 1.1 s wall and 0.61 to 0.65 s user CPU. The median call is therefore inside budget even under heavy contention. The tail, a 15.9 s wall time on about 0.65 s of CPU, means calls are WAITING, probably on a cache or store lock or on blocking I/O, rather than computing.

  Acceptance:
  1. Find where slow `show` calls wait: lock acquisition, cache refresh, or git/store I/O. Instrument the phases if the usage log cannot already attribute them.
  2. A read-only `show` must not block behind a writer or a cache rebuild for longer than the ceiling. Serve the last consistent snapshot, or time out to it.
  3. Over the 24h window after the fix lands, the performance-guard passes at the unchanged budget (2000 ms, 10%, 5000 ms ceiling). Do not loosen the budget (ADR-53).
