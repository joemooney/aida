- id: 01a1ba5a-8f13-7261-9fa2-7b7a8c0005e8
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3658):
    Verdict: CHANGES REQUESTED
    Reviewed commit: bbd79dd2bdd4
    Recorded: 2026-11-08T08:40:24.830581135+00:00
    Findings:
    1. BLOCKING CI (cli-0, run 42459871093): aida-cli/tests/bug_1956_reader_fallbacks_bounded_under_writer.rs:281 fails in reads_are_bounded_when_spawning_is_suppressed, show_is_bounded_with_no_detach and show_is_bounded_when_the_schema_stamp_is_missing. Caused by this PR: read_bounded_and_labelled requires 'the cache write lock was busy', but snapshot-only show never contends for the lock and labels Deferred. Migrate the show cases to the new contract (bounded, serves the spec, stale label, no refresh); keep list on the writer-busy assertion. show_refreshes (:289) also asserts show refreshes once the writer is gone, which the PR deliberately removed.
    2. BLOCKING CI (cli-1): aida-cli/tests/task_1527_refresh_worker.rs:398-422 reader_spawned_worker_completes_the_refresh uses 'aida show' to spawn the detached worker; show no longer spawns one, so it times out at :420. Drive BUG-1947's regression through a read that still spawns (for example list). The same cli-1 job's 'Test time budget' step also failed, most likely from this 60s wait; job logs were not reachable from the reviewer sandbox, so confirm it clears.
    3. BLOCKING CI (gates, step 'Store writer inventory ratchet', scripts/check-store-writers.py): Cache::open_stale_snapshot (aida-core/src/db/cache.rs:1582) adds production execute_batch sites (BEGIN DEFERRED, SCHEMA_SQL) with no row in scripts/store-writers.toml (no open_stale_snapshot entry; scripts/ untouched by this PR). Regenerate and review the inventory row(s), including any wrapper rows. The 'lane_fixture_fails' line in the launcher digest is not the failing step. Build (ubuntu-latest) fails only via 'Require every CI lane'.
    4. MAJOR AC2 multiplicity: aida show <ID> --tree is not bounded on a cold, corrupt, drifted or behind snapshot. render_tree_node (aida-cli-lib/src/rel_cards.rs ~:1505) calls backend.get_requirement per child, which reaches get_requirement_targeted (cached_git_backend.rs:498), building a NEW requirement_reader each call: each child that misses the index gets its own store parse with its own fresh budget of up to 4s, so N uncached children cost up to N x 4s. The comment says 'One budget ... never a new scan per relationship', but that holds only for run_show's shared read_target. Before this PR show built the cache first, so this path did not miss. Share one reader and one deadline across the walk; add a test counting one scan for a multi-child tree on an empty index.
    5. MINOR AC2 ceiling: fallback budgets stack past 5000ms. resolve_unambiguous (cached_git_backend.rs ~:289) and requirement_reader (~:517) each take read_fallback_scan_budget independently, and that function subtracts only ladder_waited(), not time already scanned, so a stale or empty snapshot can spend 4s + 4s, plus up to 1.2s linkage with --full. The budget doc comment describes an invocation-wide cap. Share one invocation deadline or charge scan time against it. Plausible from code, not reproduced.
    6. MINOR output semantics: requirements_cli.rs (:6895, :7167, :7492, :7590) maps every None target to 'unknown', including when the relationship scan completed and the target is genuinely dangling or the snapshot is fresh, so a real broken edge is no longer distinguishable and the JSON status value silently changes. Report unknown only when the fallback was incomplete; keep missing otherwise, and cover both.
    7. COSMETIC stale linkage claims not covered by this PR: docs/internal/agents/aida-repository-guide.md:116-117 ('aida show <ID>' shows git linkage; --no-git skips it) and scripts/aida-demo.sh:712-720, :733, :742, where the demo tells the viewer to find Git linkage in plain 'aida show $HELLO_SPEC'. Use --full. aida-core/templates/skills/aida-pickup.md:350 now uses --card --full, which by docs also removes card truncation; confirm that is intended for session-start output, and update the prose at :357.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
