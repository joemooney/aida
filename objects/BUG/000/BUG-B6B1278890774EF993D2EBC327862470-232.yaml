  content: 'Next-slice investigation (advisor 2026-11-07 17:35/17:45 MST ruling): paired live-binary show --no-git probes from this lane and the primary checkout recorded total/open.cache 397/52 ms and 348/53 ms respectively. This seat resolves .aida-store and .aida/cache-db to the shared primary paths, so a cold per-seat cache was not reproduced here. Code inspection found a concrete unbounded refresh wait: freshen_for_read passes show’s zero read budget to git_ops::is_ancestor_with_timeout, whose zero case waits indefinitely; an elected reader can then run try_incremental_update (Git diff plus changed-object reads) inline. In-progress edits bypass that entire protocol using a pinned read-only projection, defer stale context without refresh hints/workers, and omit default human/TOON/card linkage while retaining explicit full/verbose/JSON linkage. Added regressions assert default show invokes no git log, merge-base or diff and does not advance the cache stamp, with explicit-linkage positive controls; snapshot/cold-cache and held-writer tests cover stale/canonical behavior. Lane-runner validation is still running; acceptance 3 remains the unchanged 24-hour post-go-live guard window.'
