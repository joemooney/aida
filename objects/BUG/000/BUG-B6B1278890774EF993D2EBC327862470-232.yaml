    - 19 exec-context guard tests; final exact-site checker reports 1241 sites, zero additions. Touched-file rustfmt check, Python syntax check and git diff --check passed.

    Remaining acceptance: observe 24 hours of guard passes after this slice goes live, at unchanged 2000 ms / 10 percent / 5000 ms thresholds. This seat does not attest that future window. Publish with Refs, not completion credit. No design fork or new punt/hold was introduced.
