    - aida-cli-lib/src/requirements_cli.rs: default human/TOON/card output skips linkage; full/verbose/JSON retain explicit linkage and no-git suppresses it.
    - aida-core/src/db/cache.rs: bounded read-only snapshot open; missing, corrupt or structurally incompatible projections use an empty in-memory index without disk repair/migration.
    - aida-core/src/db/cached_git_backend.rs: snapshot-only reads retain pinned rows/metadata, label stale/redo-generation mismatch Deferred, and bypass refresh elections, hints, worker spawns and schema-rebuild retry; two snapshot regressions.
