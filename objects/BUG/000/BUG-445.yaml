    Recommended path (root-cause): implement TASK-631 (init commits its own scaffolding — auto when non-interactive, prompt default-Y on TTY, scoped to init's own paths). That dissolves BUG-445: no uncommitted scaffolding, no seeded 'commit scaffolding' task, and a worktree branched off the init commit already has the files. The two band-aids — (b) flag the onboarding task primary-worktree-only / don't seed it as a for:implementer queue item, and (c) never emit a bare 'git add .' without .gitignore — are weaker and partly redundant once TASK-631 lands.

