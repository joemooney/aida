    Q1: How should the onboarding "commit scaffolding" footgun be closed — the worktree-isolation path makes the seeded first-task uncompletable and dangerous (git add . embeds gitlinks/symlinks)?
      a) Fix only via root cause: land TASK-631 (init commits its own scaffolding), which dissolves the "commit scaffolding" task entirely — close BUG-445 as covered.
      b) Also (regardless of TASK-631) flag setup/scaffolding-commit tasks as primary-worktree-only so they never route through queue-work worktree isolation.
      c) Keep the seeded task but never emit a bare "git add ." — scope the staged paths and guard on .gitignore presence.
      REC: a+b — TASK-631 removes the task in the common path; b is the durable guardrail for any future primary-worktree-only task. (a alone leaves the class of bug; b alone leaves the dead task seeded.)
