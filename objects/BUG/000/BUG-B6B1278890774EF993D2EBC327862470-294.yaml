title: Script deputy died around 13:20 on 2026-11-11 and took review-watch with it; nothing reviewed or merged until the operator restarted it
description: |-
  Observed 2026-11-11: deputy job 01a1cc28 hit its --timeout 10m (rc 124); shortly after, 'aida deputy shell list' reported 'runner: NOT running' and the runner pid 3475439 was gone. review-watch runs as the deputy's child, so reviews also stopped. The deputy is serial, so 2h train jobs also block lane launches behind them. Unconfirmed whether the timeout killed the runner or the operator terminal closed.

  ## Acceptance
  - A job timeout never terminates the deputy runner (regression test).
  - review-watch survives a deputy exit (separate supervisor) or the deputy restarts itself; 'aida awaiting' surfaces a dead deputy as an operator item.
  - Train waits do not block unrelated short jobs (separate queue or async train).
