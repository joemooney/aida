  content: 'DECISION (operator, 2026-05-31): no-progress watchdog + wall-clock ceiling backstop. While a headless phase runs, poll the worktree; if NO new git commit AND no working-tree file change for N minutes (default ~10), abort + shelve (NeedsAttention + FailureReason ''phase made no progress for Nm — likely degenerate''). PLUS a generous hard wall-clock cap (~45m) as a backstop. Shelve routes through EPIC-28 so the drain continues. Both thresholds config/flag-overridable. — master/advisor'
