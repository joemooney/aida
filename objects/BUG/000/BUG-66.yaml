    PR-4 reviewer noted 2026-05-10: failure mode is broader than originally captured. CI is red on ALL 3 platforms for at least two distinct reasons:
    - Linux/macOS: missing protoc (protobuf compiler) on runner
    - Windows: postgres/reqwest/r2d2 feature-flag/native-deps breakage

    Fix scope expanded — needs both runner-side protoc install (linux + macos) AND feature-gating (windows). PR-5 + PR-4 both merged through this red CI as the precedent (unrelated infra ≠ block merges). BUG-66's eventual fix should turn that around so CI green-on-main is meaningful signal again.
