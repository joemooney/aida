- id: 01a1a1d6-839c-7112-b475-14091d1d6799
  author: mcp
  content: 'Implementing namespace-aware session liveness: stamp the PID observer namespace on new leases and process-backed child updates; foreign stamped leases display unknown (foreign pidns), stay out of stale/orphan results, and refuse reap/recovery. Registry GC already protects foreign namespaces. Review-watch identities and supersede signal paths receive the same guard. Targeted regressions cover nonexistent foreign PIDs and local PID collisions. CLI status mutation was blocked by the shared cache symlink''s sandbox write boundary; spec was already In Progress.'
  created_at: 2026-11-03T14:35:52.604312368Z
  modified_at: 2026-11-03T14:35:52.604312368Z
- id: 01a1a20c-a160-72a2-8efe-8a09bd72eb6c
  author: joe
  content: 'Advisor ruling: PR #3298 round 2. Advisor ruling on the design fork: a foreign pidns is not evidence of death (the spec), but heartbeat/TTL expiry IS independent evidence and keeps working for foreign-ns records. Restore the TTL/heartbeat backstop in claim_staleness, decide_claim, Identity::alive, auto_release_decision_for_lease, reap_one and reap_one_clone; only the pid probe is skipped. Fix all 5 findings: (1) gate the /proc/self/ns/pid literals in aida-core tests behind cfg(target_os=linux) or a non-test helper, and do not grow the allowlist; (2) the backstop above, plus a test that a foreign-ns claim with an expired heartbeat IS reclaimed; (3) delete pid_namespace_observable and use agent_registry::PidObserver::can_observe (with the BUG-2212 is_isolated check) as the one judge everywhere; (4) worktree-GC test for a foreign-ns lease; (5) skip_serializing_if = Option::is_none on review_watch::Identity.pid_namespace. LIGHT gate: ONE targeted cargo test -p <crate> <filter> plus make check-ci-fast; never cargo test --workspace, make check or make check-ci. Push to the existing PR branch, then stop.'
