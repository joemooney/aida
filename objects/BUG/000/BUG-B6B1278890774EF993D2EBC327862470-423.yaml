title: 'story_1662 punt test flakes: asserts the lease stamp before the launcher writes it (timing race under CI load)'
description: |
  `standalone_implementer::story_1662_standalone_implementer_tests::stub_vendor_that_punts_exits_32_as_a_live_implementer_lane_with_no_grant_leaked` failed once in CI (lib-1) on promotion 18 (#4218, run 44084123074, head e34091b):

      assertion `left == right` failed: the child is stamped on its lease
        left: None
        right: Some(326768)
      (aida-cli-lib/src/tests/story_1662_standalone_implementer_tests.rs:1012)

  The test passed 20/20 solo on dell1 at the same head, and main CI was green on it for 14 consecutive runs. The p18 changes do not touch lease stamping. This points to a timing race: the `live_checks` closure reads the lease while the stub child is alive, but the launcher may not have stamped `active_pid` yet, and under CI load the read can land before the stamp.

  ## Acceptance
  - The live-lane check waits, with a bounded deadline, for the lease stamp (or for an explicit "stamped" signal from the launcher) instead of asserting on the first read.
  - The test passes 50/50 on dell1 under parallel load (for example, the full `standalone_implementer::` filter run concurrently with other cargo work).
