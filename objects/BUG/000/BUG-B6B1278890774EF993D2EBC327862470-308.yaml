  content: 'Advisor ruling 03:53 on the PR-3932 round-2 CR at ed8cc0f: round 3 authorized as an exception to the 2-round cap. All four findings are real correctness defects in a gate-ledger read path, not polish. Fix all four in one push: (1) P1 pin the event corpus, so listing reads come from discovery''s own ledger reads and never from live files; (2) P1 ls-tree -z for quoted names; (3) P2 invalidate the memo when our own append exceeds a checked-reader limit; (4) P2 load the Snapshot at the pinned tip. No follow-up BUG split: that would knowingly ship an inconsistent listing and a new spec, contrary to the 2026-10-28 one-ruling rule. Round 3 gets a delta review; if it requests changes again, escalate to me before any round 4.'
