- id: 01a1d441-335e-7db1-809a-ce5d9f82875f
  author: joe
  content: 'Round-2 (PR #3932 @ ed8cc0f3): all four round-1 findings are FIXED, none deferred. P1: per-key revalidation of indexed ledger lengths (test bug_2543_listing_sees_witness_written_after_discovery). P2 git O(1): listing-wide CHANGES tree read plus memoized repository/roster (test bug_2543_listing_publication_git_is_constant_in_keys, real store). P2 aggregate cap: 16 MiB aggregate with per-directory fallback (test bug_2543_oversized_aggregate_falls_back_per_directory). BUG-2551: own appends fold into the index (tests bug_2551_reconciling_many_waits_discovers_once, bug_2551_own_appends_fold_and_foreign_growth_rediscovers). Residual: receipt-bearing keys still read their own publication blobs (proportional to publications, not keys).'
