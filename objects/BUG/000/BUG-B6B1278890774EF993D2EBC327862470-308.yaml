  content: 'integration seat claimed 22:45 MST. Profile (aida review list, 60 s): ~0.75 s/key, of which ~0.6 s is a full gate-ledger discovery per key (filter_miskeyed_or_fail_closed -> discover) and ~0.15 s is 3 git spawns (store_view rev-parse, spec-index ls-tree, git-common-dir). Plan: a scoped listing snapshot memoizes discovery owners, publication store view/tip, spec-index listing and canonical Snapshot once per listing; single-key gate reads unchanged.'
