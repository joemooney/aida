title: 'aida review list (and lane-liveness verdict shas) resolve every verdict key through git subprocesses: 300 s+ with ~2,800 keys'
description: 'list_active_verdicts calls current_verdict for every key; each spawns git rev-parse/ls-tree (review_publication store_view/select) in a polling run_bounded. With ~2,800 keys in the primary checkout, ''aida review list'' did not finish in 300 s (2026-11-12). lane_liveness::recorded_verdict_shas uses the same path. BUG-2540 fixed the rework caller by resolving only bound keys; full listings still need it. Acceptance: resolve the publication store head/tree once per listing (snapshot), not per key; review list over 2,800 keys finishes in seconds; test asserts git is invoked O(1) per listing, not O(keys).'
