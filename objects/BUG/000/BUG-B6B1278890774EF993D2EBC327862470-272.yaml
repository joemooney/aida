title: Rework cannot import review findings when a gate-ledger line exceeds the reader's size limit
description: '2026-11-08: aida queue rework BUG-2501 warned ''no review findings imported ... refusing gate-ledger entry PR-3708.jsonl line 2: the line is oversized''. A rework lane then starts without the reviewer''s findings, wasting a round. AC1: findings are imported when a ledger entry is large, either by bounding what writers record or by raising the limit with a test; a truly unreadable entry remains refused with a named reason. AC2: rework output states clearly when findings could not be imported so the operator or lane can read the review comment.'
