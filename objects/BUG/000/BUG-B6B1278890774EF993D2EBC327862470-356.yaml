title: 'Cache incremental refresh: an ancestry-check timeout inside the transaction falls through to a full rebuild'
description: 'From the PR-4085 re-review [P2] @ d135568: aida-core/src/db/cache.rs:639-640. If store HEAD advances after try_incremental_update checks its target but before apply_incremental calls refresh_head_reached, the new 2 s ancestry check can time out. The error reaches ensure_cache_fresh (cached_git_backend.rs:744-746), whose generic arm breaks into full_rebuild(true) at :762, so the whole store is reloaded under the same disk contention. Fix: distinguish ancestry-timeout errors and propagate them without a rebuild. Regression test: HEAD advances before the transaction, the ancestry check times out, and no full rebuild happens. Judge priority with the TASK-3798 timing evidence.'
