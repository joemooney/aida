title: 'aida land run follow-ups from #3981 review: inherited-child timeouts, --once wait list, limits as knobs'
description: 'Accepted non-blocking findings from the #3981 round-1 review (advisor 19:57 on STORY-2768): (F4) after land run restarts, children from the previous process are supervised for the full timeout and each timeout counts against the head, so restarts can derive BLOCKED without fault; stop inherited children without counting, or do not count their timeouts. (F6) the --once wait loop supervises against the pre-wait change list, so a reviewer whose head moved is not stopped, and settle notes are discarded instead of printed. (F7) max_reviews/max_lanes/review_timeout_secs are read raw from .aida/config.toml; register them as KnobSpecs and warn on out-of-range values.'
