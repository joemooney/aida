- id: 01a218e3-8a59-7602-aae2-bcf2f45ac39d
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 76c2bcff3c (git diff origin/main...HEAD, 5 files).

    **Acceptance evidence**
    - AC1 [behavioral-test]: review_prepare.rs runner_failure builds one line, '<vendor|AIDA_REVIEW_RUNNER_CMD> <pass> pass, <review|challenge> batch N: <chain {:#}>', at both the finder and challenger sites. It is one line because agent mode keeps only the first line, which is the root cause of the bare 'review batch 1'. Test bug2775_runner_errors_name_runner_pass_batch_and_cause uses stub runners for: deadline (2s), output cap (64 bytes), exit code + one-line stderr tail, unparsable output, a refused relative runner command, and a custom runner exiting 4.
    - AC2 [behavioral-test]: the note fires only when runner_cmd_set() (bug2775_runner_cmd_note_only_when_the_variable_is_set). Without --agent, run_review_agent resolves [agents] vendor, else DEFAULT_REVIEW_VENDOR (claude), and prints 'run review: using <vendor> from <source>' (bug2775_run_review_agent_resolves_and_states_the_default).
    - AC3 [behavioral-test]: root cause reproduced on this seat. The hardened claude argv in a cleared env hangs; even bare 'claude --print' with env -i is killed at 45s. With only HTTPS_PROXY/HTTP_PROXY/NO_PROXY (+ lowercase) added, the same argv answers OK in seconds. env_clear() dropped the proxy route, so claude retried until 900s. Fix: PROXY_ENV allowlist (8 names). s3a_runner_spawn_contract now asserts that proxy vars pass and that GH_TOKEN, the seat grant and the other vendor's key stay stripped. Empty cwd, no project settings and the vendor argv are unchanged.

    **Validation:** lane job cargo test -p aida-cli-lib --lib (bug2775 s3a s4): 46 passed, 0 failed. aida-ci-guards story_2539 vendor ratchet passed. make check-ci-fast exit 0.

    **Probe findings / fixes:** the vendor-literal ratchet refused a 'claude' literal and LaunchVendor::Claude in review_prepare, so the default moved into vendors/review_runner.rs. The ratchet-set needed the three new tests listed. Consistency: an empty AIDA_REVIEW_RUNNER_CMD counts as unset in both run_review_agent and RunnerCall::var.

    **Residual risks:** (1) A proxy URL can embed proxy credentials. They now reach the vendor binary; this is the operator's own network route, not a vendor or forge secret. (2) No live 15-min reproduction on product-15's host. The cause is inferred from this seat's identical hang; a host with direct network would have hit a different cause, which AC1 now surfaces. (3) A genuinely slow claude batch can still hit the 900s deadline, and it is now reported as such.
