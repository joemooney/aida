    ## Implementer self-review
    Reviewed HEAD: e376fe91da (git diff origin/main...HEAD, 5 files; port of #4672 + AC3 addendum).

    **Acceptance evidence**
    - AC1 [behavioral-test]: runner_failure (review_prepare.rs) produces one line, <vendor|AIDA_REVIEW_RUNNER_CMD> <pass> pass, <review|challenge> batch N: <chain>. Test bug2775_runner_errors_name_runner_pass_batch_and_cause covers deadline, cap, exit+stderr tail, parse, a refused relative runner, and a custom exit 4.
    - AC2 [behavioral-test]: bug2775_runner_cmd_note_only_when_the_variable_is_set and bug2775_run_review_agent_resolves_and_states_the_default. An unsupported [agents] vendor now carries "[agents] vendor" context.
    - AC3 [behavioral-test]: proxy allowlist (case-insensitive HTTPS/HTTP/NO/ALL_PROXY), asserted in s3a_runner_spawn_contract with credentials still stripped. Root cause re-checked on this host: claude --print in env -i was still hanging when killed at 25s; with only the proxy vars added it answered OK in 4s.
    - AC3 addendum [behavioral-test]: bug2775_runner_gets_stdin_eof_and_a_prompting_cli_fails_fast. A stub that reads stdin to EOF and then reads an answer gets EOF at once. A /dev/tty prompt fails fast with the exit status and a tty-naming stderr tail. The runner now uses setsid in pre_exec, so there is no controlling terminal and a prompt cannot SIGTTIN-stop until the deadline.

    **Validation:** lane job cargo test -p aida-cli-lib --lib (bug2775 s3a s4 s5): 56 passed, 0 failed (the first run caught a stub bug: dash continues after a failed builtin redirect; fixed with || exit 5). make check-ci-fast via lane job: exit 0 at e376fe91da.

    **Probe findings:** P1: an empty AIDA_REVIEW_RUNNER_CMD counts as unset in both run_review_agent and RunnerCall::var. P5: the allowlist widened only by the proxy route; the refusal-path test still asserts GH_TOKEN, the seat grant and the other vendor key are stripped. setsid only increases isolation, and the group kill is unchanged (pgid == pid).

    **Residual risks:** (1) No after-reproduction with the new binary: lane jobs refuse cargo run and the built binary stays on the lane overlay. The PR body lists the commands to re-run after promote. (2) Proxy URLs can carry proxy credentials to the vendor. (3) A truly slow batch still hits 900s, and is now reported by name.
