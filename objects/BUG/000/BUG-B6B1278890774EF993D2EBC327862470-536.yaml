title: review prepare --run-review hides the runner failure (only "review batch 1"); the default-agent path claims AIDA_REVIEW_RUNNER_CMD when unset; a claude batch hits the 15-min deadline
description: |
  Found 2026-11-26 08:56-09:15 by product-15 during the adversarial review trial Joe asked for (live binary 6192912152a == main, with S3a/S3b/S4). `aida review prepare --pr N --run-review --adversarial` fails on every PR tried:
  (1) WITHOUT --agent: it prints "adversarial review: AIDA_REVIEW_RUNNER_CMD runs both passes (AIDA_REVIEW_PASS=challenger)" although AIDA_REVIEW_RUNNER_CMD is NOT set in the environment, then error: "review batch 1" after about 3s (PRs #4666, #4663, #4661, #4658).
  (2) WITH --agent claude: batch 1 runs 903s (the 15-min default deadline), then error: "review batch 1".
  In both cases the CLI prints ONLY the outer anyhow context ("review batch {i}", review_prepare.rs ~:694); the underlying cause (deadline? spawn refusal? env allowlist? auth? parse?) is dropped, so an operator cannot act.

  ## Acceptance
  - AC1: `--run-review` errors print the FULL cause chain (e.g. {:#} / chain()), naming the vendor, pass (finder/challenger), batch, and the concrete cause (deadline exceeded after Ns, output cap, spawn refused: <why>, exit code + stderr tail, parse error).
  - AC2: the "AIDA_REVIEW_RUNNER_CMD runs both passes" note appears ONLY when that variable is actually set; with no --agent, the default vendor resolution is stated ("using <vendor> from [agents] / seat config").
  - AC3: find and fix why a claude runner batch on a ~560-line PR hits the 15-min deadline (e.g. the claude CLI waiting on a prompt or auth in the cleared env, or a missing non-interactive flag); a test with a stub runner for each of the AC1 causes.
