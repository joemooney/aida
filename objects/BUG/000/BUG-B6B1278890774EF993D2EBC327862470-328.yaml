title: verify-manual.py checks flags against the live aida on PATH, so a branch adding a command fails its own manual check
description: 'Observed 2026-11-13 on #3935: docs/cli/verify-manual.py shells out to plain ''aida'' (live binary). A branch that adds a subcommand (aida integration tags) fails ''flags'' (--dry-run cited under aida integration) until the binary is promoted; running with PATH pointing at the branch build passes. Want: the checker uses the worktree''s built binary (or AIDA_BIN override) and says which binary it checked.'
