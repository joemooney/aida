title: aida pr ship refuses a mandate ship when the store changes during exclusion collection (3 attempts) instead of retrying under the store lock
description: 'Observed 2026-10-31 13:16 (advisor, serial-ship of PR-3171 under the ship-held mandate, ~5 concurrent lanes/reviewers writing the store): ''PR-3171 left OPEN — the merge-hold stays. the fire-fighting mandate does not cover this ship: the PR''s mandate exclusion evidence could not be read (the store changed while collecting exclusions (3 attempts); retry).'' A manual retry 1 minute later merged. Evidence: /tmp/aida_runme2.log. Expected: exclusion evidence is read from one consistent snapshot (a store ref pinned at start, or under the store read lock) so concurrent unrelated writes cannot fail the read; at minimum bounded backoff retries long enough to outlast normal fleet write bursts. Acceptance: (1) the read uses a pinned store commit; (2) a test with a concurrent writer committing during collection still yields the evidence; (3) a genuine change to an excluded spec during the ship still refuses.'
