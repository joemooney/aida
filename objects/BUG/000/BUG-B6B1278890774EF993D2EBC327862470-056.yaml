  content: |-
    ## Implementer approach

    Root cause: `store_snapshot_stable` treats ANY store HEAD move (and any new `objects/` commit) during collection as a change, so with ~5 fleet writers committing unrelated specs every attempt is discarded and the 3-attempt bound refuses.

    Fix: pin the evidence to the `before` snapshot (HEAD + every ref/worktree tip) and judge stability by the *evidence scope* of what was collected: the delta between the pinned tips and the after-snapshot (new/changed tips, forced-move dropped commits, and HEAD's symmetric difference) must contain no commit touching any read spec's object path (id + aliases) and no commit adding/removing a `spec_id:`/`agreed_id:` line naming any read id (`-G`). Unrelated concurrent writes are now stable; a write to an excluded spec is still a change -> re-collect -> refuse after the bound. A store that fails to load mid-collection is retried rather than read as "no current record". Attempts raised to 5 with linear backoff (0.5s, 1s, ...).

    ### Acceptance criteria as tests
    - **Unit (git fixture):** a concurrent writer committing an unrelated spec on HEAD between the snapshots is stable under the pinned scope (bug_2195 tests).
    - **Unit (git fixture):** commit touching the excluded spec's object path, or a new object whose agreed_id names it, is unstable (criterion 3).
    - **Unit:** `collect_on_stable_store` recollects/refuses with the scope-aware `stable` (bug_2179 tests updated).
    - (1) pinned commit: the snapshot's tips are the pin; delta measured from them.

    ### Expected files
    - `aida-cli-lib/src/gate/mandate_traces.rs`
    - `aida-cli-lib/src/gate/mandate_ship.rs`
    - `aida-cli-lib/src/gate/tests/bug_2195_store_snapshot_tests.rs`, `bug_2179_mandate_recollect_tests.rs`

    ### Ambiguities / conflicts as questions
    - Full rewrite of the readers to read at the pinned commit (instead of working tree / `--all`) is not done; the scoped-delta check proves the read equals the pinned read for the evidence paths. Acceptable?
