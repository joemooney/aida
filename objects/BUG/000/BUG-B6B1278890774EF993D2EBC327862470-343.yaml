title: 'Any label change on a PR cancels and restarts its CI run: merge-hold label toggles restart a 24-minute full run'
description: |-
  ci.yml triggers pull_request on types [opened, synchronize, reopened, labeled, unlabeled] for every label, and the workflow concurrency group cancels in-progress runs per PR. So setting or clearing aida:merge-hold (or any other label) cancels the PR's running CI and starts a new one. With the ci:full label now applied at approval, a hold-label toggle restarts a ~24 minute full-matrix run; 32 PR CI runs were cancelled in the 24h to 2026-11-14 13:00Z.

  Fix: label events should start or cancel a CI run only when the label is ci:full (the only label that changes the tier). Options: gate the jobs with an if on github.event.action / github.event.label.name so other label events finish in seconds without joining the cancelling concurrency group, or give non-ci:full label events their own concurrency group. A hold-label change must not cancel an in-progress run on the same head.

  Acceptance: (1) adding or removing aida:merge-hold* on a PR with a CI run in progress leaves that run running; (2) adding ci:full starts a full run; removing it starts a fast run; (3) push to the PR still cancels the superseded run; (4) train PR behaviour unchanged.
