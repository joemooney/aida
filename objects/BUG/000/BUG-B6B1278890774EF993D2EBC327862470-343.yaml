- id: 01a1dab3-77b7-7b40-80ad-7906dbb5b2ff
  author: dirtlab
  content: |-
    ## Implementer rework finding: literal Build name conflicts with skipping the job (no edits made)

    The directive is to keep `name: Build (ubuntu-latest)` literal and gate label events with a job-level `if` or a tiny separate job. I did not implement it, because every literal-name variant I can construct regresses a reader, and I cannot test GitHub behaviour from the lane.

    **Why a literal name plus job-level `if` is unsafe.** A job skipped by `if` still registers a check run under its name. A hold-label toggle would then put a newer *skipped* `Build (ubuntu-latest)` on the head:
    - `require_full_ship_ci` (`aida-cli-lib/src/ci_gate.rs:246-270`) needs Build `bucket == "pass"` plus a `ci-tier: full` marker on Build's run id. `gh pr checks` returns the newest row per name, so after clearing a hold the row is `skipping` and `aida pr ship` refuses a head whose FULL CI passed. Clearing the hold is the step before shipping.
    - GitHub branch protection counts a skipped required check as passing, and uses the newest check run per name, so a hold toggle on a red head would turn the required check green.

    **Why a Build job that runs and mirrors the real result is unsafe.** The real Build registers only after every lane finishes (`pr_train.rs` BUG-2401 comment), so with a toggle during a run the rollup can pair the real Build (older run id) with the label run's newer marker, or the mirror Build with no marker; `require_full_ship_ci` refuses either way.

    **Why a separate workflow does not work.** GitHub has no label-name trigger filter. A label workflow can start ci.yml only via `workflow_dispatch` (head ref instead of merge ref, no PR concurrency group, always FULL) or `gh run rerun` (replays the old event payload, so the tier cannot change). `workflow_call` prefixes check names.

    **So the choice is:**
    - **A (current PR-4028 shape, my lean):** keep the name expression, whose non-label branch is the literal `Build (ubuntu-latest)`, and change `aggregator_const_matches_the_ci_workflow` to accept exactly that expression shape. Every run that does CI still reports `Build (ubuntu-latest)`; only the no-op label run reports `label event (...)`. The train-27 red is that one test pinning a literal.
    - **B:** literal name with a skipped Build, accepting the two regressions above (or changing `require_full_ship_ci` and living with the branch-protection hole).
    - **C:** drop the job gating; non-`ci:full` label events only get their own concurrency group. Nothing is cancelled, but each hold toggle starts a duplicate full run and a new pending Build.
    - **D:** redesign tier selection around `workflow_dispatch` with PR inputs; an architecture change needing a sketch.

    **`tests::lane_fixture_fails` (42 vs 41) is not this PR.** It is the deliberate failing fixture test in `aida-cli-lib/src/tests/bug_2383_seat_target_overlay_tests.rs:1271` (`assert_eq!(answer(), 41)` with `answer() == 42`); its panic text is printed by a passing test. PR-4028 touches only `ci.yml`, two Python tests and a doc.
