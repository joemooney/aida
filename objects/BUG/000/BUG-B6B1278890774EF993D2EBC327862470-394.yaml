title: 'Regression from #4126 (BUG-2606): seat-clone retention keeps a clean clone pushed by explicit refspec; bug_2415 lifecycle test fails on main'
description: |-
  Found by the integration seat on 2026-11-16, while gating p16b on dell1. seat_clone::lifecycle_tests::bug_2415_bwrap_session_end_ends_a_clone_pushed_by_explicit_refspec fails deterministically: the assertion '!clone.exists()' at aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs:2235 does not hold. Solo bisect on dell1: passes at 925c815 and fails at 5d58626 (#4126, BUG-2606) and at main f5dab5c, 3 of 3. Likely cause: the dirty-seat retention added by BUG-2606 also retains a clean clone whose branch was pushed by explicit refspec, so the clone is never treated as pushed. Details are in a comment on BUG-2606.

  ## Acceptance
  1. Session end removes a clean seat clone pushed by explicit refspec (bug_2415 passes again). A dirty clone is still retained with its notice (BUG-2606 tests still pass).
  2. The retention decision checks for a dirty tree or unpushed commits against the refspec actually pushed, not only the upstream tracking ref.
  3. Run the bug_2415 test and the BUG-2606 tests by name on dell1; both pass at the fix head.
