  content: 'Read-only diagnosis now narrows the operational mismatch: two named historical messages 84b36522 and128fbf1f have immutable fixed-cohort delivery sidecars bound to a different recipient UUID than current advisor05 reservation. The guard evaluate/scan_and_route in mail_backlog.rs195/282 reads raw local+canonical Message.to role names and read_by(role), whereas supported own inbox uses logical delivery_gates and recipientUUID receipt keys. Same current supported wake-snapshot is complete, pending0, messages[]. Full source/evidence/candidate bounded sketch /tmp/aida-BUG2405-source-diagnosis.md. This proves the two inspected ownership mismatches; not a claim all28 messages share identical cause. Preserve original delivery ownership, ACK authority and unknown/partial reporting; no migration/suppression or receipt edits. Independent sketch assessment required before implementation; BUG remains Draft.'
