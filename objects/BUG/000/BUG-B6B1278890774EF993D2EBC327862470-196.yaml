title: pr ship/train demand a terminal on stdout while merge-hold clear does not, so the script deputy can clear holds but cannot merge
description: |-
  2026-11-03: through aida-deputy-shell run 2, 'aida merge-hold clear 3289' succeeded, but 'aida pr train 3280' was refused three times with 'its merge needs a human at a terminal'. The cause is two different human checks. merge-hold clear uses role_authority::has_integrity_floor_authority() (stdin is a terminal AND deputy_job_floor_authorized). pr ship/train use pr_cmd::ship_interactive_tty() (stdin AND stdout are terminals, pr_cmd.rs:2108). The script deputy tees each job's stdout into its audited transcript, so stdout is never a terminal. Workaround in use: the job script sends that one command's stdout to /dev/tty, which loses the transcript.

  Acceptance: (1) pr ship and pr train decide 'human at a terminal' with the same function as merge-hold clear, so stdout plays no part. (2) A test: stdin is a terminal and stdout a pipe, with the deputy floor authorized; train treats the named PR as human-consented. (3) A test: with stdin not a terminal, it still refuses.
