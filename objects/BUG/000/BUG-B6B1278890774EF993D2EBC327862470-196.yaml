- id: 01a1a241-67b2-74f3-be5b-f6b98c996fc3
  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (1):** `ship_interactive_tty()` (used by `pr ship` and by the train's `interactive_tty`) now delegates to `role_authority::has_integrity_floor_authority()` — the exact function `merge-hold clear` uses — so stdout plays no part. A test pins that the body calls it.
    - **Unit (2):** with the test ambient pinning stdin=terminal, stdout=pipe, and the deputy floor authorized (no job env, then a live bound marker), `tty_consents(ship_interactive_tty(), named=true)` is true.
    - **Unit (3):** with stdin not a terminal (stdout a terminal), it is false.

    ### Expected files
    - `aida-cli-lib/src/pr_cmd.rs`
    - `aida-cli-lib/src/deputy/tests.rs` (reuses its spool/marker helpers)

    ### Ambiguities / conflicts as questions
    - None. Note: a deputy job on a terminal WITHOUT a live marker is now refused by ship/train too (parity tightening, same as merge-hold clear).
