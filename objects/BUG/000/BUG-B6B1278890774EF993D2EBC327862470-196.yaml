  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2427):
    Verdict: CHANGES REQUESTED
    Reviewed commit: a2b504db255e
    Recorded: 2026-11-03T18:42:21.283849105+00:00
    Findings:
    1. CI regression from this PR: ship_interactive_tty() (pr_cmd.rs:2115) sits between ship_preflight_gates() (pr_cmd.rs:1986) and pr_ship_handler() (pr_cmd.rs:2120). The new body calls crate::gate::role_authority::has_integrity_floor_authority(), so the source slice that gate/tests/story_1698_mandate_tests.rs:594-601 takes as 'the preflight' now contains 'has_integrity_floor_authority()', and the assertion 'the preflight takes the hold authority the handler decided' fails (CI lib-1, job 126086391652). The Build (ubuntu-latest) failure is the aggregator reporting that. Fix: move ship_interactive_tty() out of the region between ship_preflight_gates and pr_ship_handler (for example, after pr_ship_handler or into gate::role_authority), or end the test's preflight slice at the preflight fn's own closing brace. Do not weaken the assertion.
    2. AC (1) wiring is not pinned by a test. The implementer's plan said 'a test pins that the body calls it', but the new test only checks ship_interactive_tty() == has_integrity_floor_authority() under two ambient states, and it checks the train only through tty_consents(ship_interactive_tty(), ...), not through the train's real interactive_tty() (pr_train.rs:1286). Add a source-pin (or an equivalent check) that pr_train's interactive_tty and pr_ship_handler's interactive_tty both go through the shared function, so a later reintroduction of a stdout check fails a test.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
