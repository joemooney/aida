title: 'Relay hold ignores mandate-renewed parent grants: successors_in excludes every grant with an origin, so the TASK-3119 replacement never ends a BUG-2585 hold'
description: |
  Found by the advisor on 2026-11-17 while gating promotion 18 (#4218 at 46e967b), which merges BUG-2585 (the relay holds its seat when the parent grant expires) with TASK-3119 (the mandate-backed relay parent handoff).

  relay_grant::hold() decides whether to hold by calling renewed() -> successors_in(). successors_in() filters on `g.origin.is_none()`. The replacement grant that gate/relay_parent.rs writes for TASK-3119 always sets `new.origin = Some(ORIGIN + receipt.id)`, so hold() never recognizes a mandate-renewed parent as a successor.

  Effect: suppose a relay misses the TASK-3119 handoff (it does not adopt the new grant before its own expires). It then holds the seat and mails a manual renewal command, even though a valid, mandate-renewed grant exists. This fails safe (the seat holds; it does not die), so it was not a merge blocker.

  Acceptance: (1) hold()/renewed() accept a TASK-3119 replacement whose receipt supersedes the relay's grant chain root, and adopt it when adopt=true. Grants with any other origin stay excluded. (2) Regression test: an expired direct grant plus a mandate-issued replacement for the same seat makes hold() return None. An unrelated origin-bearing grant still makes it hold.
