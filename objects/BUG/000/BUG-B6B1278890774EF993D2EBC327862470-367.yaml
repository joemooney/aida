title: Rework pickup merges main into an integration-track PR branch (and the lane prompt omits the newest advisor comment)
description: |
  Observed 2026-11-15 on dell1. A rework lane for an integration-track PR (PR-4038, base `integration`) was launched with `AIDA_TRACK=integration` and `aida queue work BUG-2531 --role implementer --branch <pr branch>`. Before the agent ran, the pickup merged the CURRENT MAIN TIP into the PR branch and pushed it: 7df0e7d "Merge commit 'c7bfea1' into bug-...-296", the second time after 651ae12. This drags ~277 main commits into the integration PR's diff, and it never brings in origin/integration, so the PR stays CONFLICTING against its real base.
  Separately, the lane prompt included the 14:12 ruling comment but not the 14:48 correction comment on the same spec (the agent found it only by running `aida show`).

  Expected:
  - Rework pickup brings the branch up to date with the PR's ACTUAL base (gh baseRefName, or the AIDA_TRACK base), never main for an integration PR.
  - The lane prompt carries the latest advisor comments on the spec.

  Acceptance:
  - A regression test: rework pickup of a PR whose base is `integration` merges origin/integration (or nothing), never origin/main.
  - The lane brief includes the most recent ADVISOR comments.
