- id: 01a18d56-2796-7252-9a03-e3557854d93c
  author: joe
  content: 'Advisor correction 07:58: aida-cargo-reap.service ALREADY runs with Nice=19 and IOSchedulingClass=idle, so ''ionice -c3'' is not a fix. Journal commits (jbd2) and writeback (flush kworkers) run in kernel threads and ignore the reaper''s IO class: a mass unlink still floods the journal. The real levers are (a) rate-limit the reap: delete in batches and sleep between them, or reap at most N GB per run; (b) skip the reap while any cargo build holds a slot; (c) the lock-wait IO-pressure report from the first comment. At 07:55 the reap had finished, but IO stayed at about 85%: the remaining load is concurrent rust-lld links plus writeback. So keep the lane count low while that lasts.'
