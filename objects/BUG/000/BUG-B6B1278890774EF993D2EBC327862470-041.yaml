- id: 01a18d58-274d-7453-8a5c-e07aabaa9e14
  author: joe
  content: 'Advisor measurement 08:02. The saturated device is sda, and sda is a SPINNING HDD (APPLE HDD ST1000, rotational=1). It holds /, $HOME, the repo, every worktree under ../aida-worktrees, .aida/cache.db, the store worktree and /tmp. sdb (the SSD, /mnt/build) holds only cargo target dirs and is idle. cargo-reap reaps target dirs on /mnt/build, so the reap cannot be what saturates sda now. sda is doing about 85 write IOPS with tiny throughput (a few MB/s): small fsync-heavy random writes from git, sqlite and mail across about 10 concurrent agents, at the seek limit of an HDD. Every lock ''stall'' is that seek queue. Structural fix (operator decision): move ../aida-worktrees, the .aida cache and the store worktree, ideally the whole repo, onto the SSD. Short of that: fewer concurrent agents, and the IO-pressure report on lock waits. The ''pid 19 held 10h'' question still needs its own check.'
