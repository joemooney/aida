  content: 'Follow-up 07:45 local: no ''cache refresh'' process exists on the host (ps across all namespaces from an unsandboxed shell), so the lock-info holder (pid 19, pid_ns 4026535667) is dead. The sidecar is stale; commands appear to wait on a holder whose liveness they cannot check from another PID namespace. Other seats kept writing the store in the meantime, so the SQLite lock itself may be free. Remedy candidates: verify via pid_start_identity plus /proc across namespaces, or treat a never-advanced heartbeat past N x expected as dead.'
