- id: 01a18d5b-7f8a-7d20-95d9-8028dcdabb02
  author: joe
  content: |-
    ADVISOR RULING 2026-10-30 08:12 (implementation brief). Scope is the AIDA side only; moving the repo to the SSD is an operator decision.
    1. Lock waits for the cache, the store and the session registry: when a wait passes its first progress threshold, read /proc/pressure/io (Linux; skip elsewhere). If 'some avg10' >= 50, the wait message says the disk is saturated (show the percentage) and names the holder's process state from /proc/<pid>/stat when the pid is visible (D = waiting on disk). Never report a disk-blocked holder as stuck or stale.
    2. The stale-lock healer must never steal or remove a lock whose holder is visible and in D state. It must fail fast with a bounded deadline instead of hanging.
    3. A holder in a different pid namespace that this process cannot see (lock-info pid_ns != ours) is not proven alive. Use the heartbeat: if the heartbeat is older than max(10 x expected, 30 min), treat the holder as stale and heal. Test it with a fixture lock-info that carries a foreign pid_ns and an old heartbeat.
    4. Unit tests: parse /proc/pressure/io from a fixture string, cover the D-state no-steal rule, and cover the foreign-namespace stale heartbeat. No real-disk tests.
    Gate: LIGHT. Run one targeted cargo test plus make check-ci-fast. Trace with trace:BUG-HOME-041.
