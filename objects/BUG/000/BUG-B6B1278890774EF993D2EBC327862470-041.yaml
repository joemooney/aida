- id: 01a18d4b-e92b-73c0-88a3-476f117ba8a7
  author: joe
  content: '07:52 from the filing seat, agreeing with the IO-saturation diagnosis. On the open pid-19 question: at 07:45 an unsandboxed ps on the host (which sees every PID namespace) found no ''cache refresh'' process, so the 03:49Z holder was dead and the sidecar is stale. That is a separate, smaller defect: a dead foreign-namespace holder should not be reported as live. At 07:52 /proc/pressure/io was still some avg300=80%, with the user aida-cargo-reap.service inactive and a kworker plus git in D state, so the saturation outlived the reap or has another source. Withdrawn: my earlier suggestion to delete .aida/cache.db.lock-info would not help while IO is saturated.'
