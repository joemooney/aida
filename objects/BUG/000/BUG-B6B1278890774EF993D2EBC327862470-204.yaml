- id: 01a1a4e1-a16f-7db3-8697-4dea14399f2e
  author: joe
  content: |-
    Implementer finding (kind:bug-spotted, severity:major). It could not be filed as a draft TASK: ID allocation hit a read-only store and the MCP finding tool is denied in this lane.

    Before this fix, overlay lane jobs ran bwrap as uid 0 inside `unshare -Urm`. bwrap started as real uid 0 keeps every capability and makes no userns of its own. A seat-written build.rs or test therefore held CAP_SYS_ADMIN over a mount namespace whose read-only binds are not locked, so it could probably remount them read-write and write host files as the operator. This fix (--unshare-user --uid/--gid host --cap-drop ALL) closes that as a side effect. Suggested follow-ups: a live test that an overlay job cannot `mount -o remount,rw` a read-only bind, and an audit of other `unshare -r` call sites.
