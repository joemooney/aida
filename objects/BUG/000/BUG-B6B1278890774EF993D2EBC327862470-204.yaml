title: 'os_wrap lanes bypass the cargo slot limiter: bwrap gives each lane a private /run/user, so every lane takes its own slot and host cargo ps shows them as QUEUED'
description: 'Observed 2026-11-03 19:15 MST. Four AIDA_OS_WRAP=1 lanes each ran rustc on aida-cli-lib at once (5 rustc processes, load 10 on 6 cores), while host ''cargo ps'' showed ''slots 0/2 busy, 4 queued'' and earlier jobs as LOST. The queued wrapper (bash ~/.local/bin/cargo, pid 1901021) runs in mount namespace 4026533095, not the host''s 4026531832. It already has a cargo child, with its acquisition marker under /tmp/cargo-slots-0/acq.<pid>, so the slot lock it took is private to the bwrap. The jobs ledger (~/.local/state/cargo-slots/builds.jsonl) is shared, so the host sees an entry that never takes a host slot. Fix: the os_wrap profile binds the host slot directory (/run/user/<uid>/cargo-slots-<uid>) read-write, as BUG-2383''s lane job runner intends, or lane jobs acquire the slot on the host side before entering bwrap. Add a test that a wrapped job''s acquisition shows as busy in host cargo ps.'
