comments:
- id: 01a1a4df-7239-7891-b706-8f42a8bfbecf
  author: joe
  content: |-
    Root cause: lane jobs on the target overlay run as `unshare -Urm ... bwrap ...`. `-r` maps the user to uid 0, and bwrap started as uid 0 creates no user namespace of its own, so the job sees `id -u` = 0. The host cargo wrapper computes `$XDG_RUNTIME_DIR/cargo-slots-$(id -u)` = `cargo-slots-0`. The sandbox binds `cargo-slots-1000`, so the wrapper finds that path read-only, falls back to `$TMPDIR/cargo-slots-0` on the job's private /tmp tmpfs, and takes its slot there (the /tmp/cargo-slots-0/acq.<pid> in the report). The slot directory was already bound read-write (BUG-2383); only the uid was wrong.

    Fix: `seat_target_overlay::wrap_lane_job` prefixes the lane-job bwrap with `--unshare-user --uid <host uid> --gid <host gid> --cap-drop ALL`, so the job runs as the host ids in a nested userns with no capabilities. `lane_job::overlay_wrapped` now uses it. Jobs without an overlay were already correct.

    Tests: unit `bug_2435_the_overlay_job_bwrap_runs_as_the_host_ids_without_caps`; live `bug_2435_bwrap_overlay_job_takes_its_slot_in_the_host_slot_dir` (the job reports the host uid and its acq marker lands in the host slot dir). The existing overlay live tests now go through the production wrapper. The live tests skip where userns/overlay is unavailable unless AIDA_REQUIRE_BWRAP_LIVE is set.
  created_at: 2026-11-04T04:44:29.625478376Z
  modified_at: 2026-11-04T04:44:29.625478376Z
