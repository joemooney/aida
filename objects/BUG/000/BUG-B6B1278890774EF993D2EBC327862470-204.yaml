- id: 01a1a545-62eb-7bc2-ab68-a41f1cae1b61
  author: joe
  content: 'ADVISOR REWORK BRIEF (2026-11-03 23:38 MST, PR #3340 head ffaed881). Review: the fix is correct and CI is green. Required (bundled per the 2026-10-28 rule): the only test proving the lane job lands in the host cargo slot dir sits outside the forced-live bwrap CI gate, so CI can skip it silently. Register it with the live bwrap gate (the expected-count list the gates job checks: ''only N of M live bwrap tests ran ok'') so a skip fails CI. Nothing else changes. Gate (LIGHT): one targeted cargo test filter covering the changed module, plus make check-ci-fast, then push to the same PR branch. The advisor re-reviews only the delta.'
