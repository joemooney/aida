    ## Implementer self-review
    Reviewed HEAD: e5a81ace48239fa02828c3ed2b61d956de0f2e22. Reviewed the empty origin/main merge-base diff and all five native worktree edits against HEAD. No untracked additions or PR-head CI.

    AC1/AC2: The spec allows age-based expiry where the ended lease has lost the clone binding. worktree_lifecycle_gc.rs:638 and :695 apply a six-hour default to each valid overlay ID after checking persisted lease records and the exact lease path. docs/cli/06-roles-sessions.md:200 documents the setting and startup minimum. scripts/config-trust.toml:773 classifies it as policy.
    AC3: worktree_lifecycle_gc.rs:2086 exercises two expired overlays, an unrelated unleased clone with uncommitted data, a live lease, a longer configured grace, young and future timestamps, and an unexpected directory name.
    AC4: doctor/disk.rs:55 uses the guarded removal on scheduled floor breaches. tests/bug_1675_disk_headroom_light_tests.rs:391 simulates a breach, invokes the production floor reclaim, and re-probes. The existing manual-check test proves the scheduled-only refusal.

    Probe findings: The preview and removal use the same case-sensitive lease ID checks and guarded path. TOML inline comments, missing config, 0/1/N candidates and reruns, young/future times, and invalid overlay names were checked. Updated the old late-lease regression to bypass only the time check so it still detects a lost revalidation. Unreadable lease inventory and symlinked cleanup roots retain regression coverage at worktree_lifecycle_gc.rs:1358 and :1377. The guard can only remove an overlay directly below the host lane-overlay root after an absence, age, holder, and identity recheck. Updated the disk finding to report combined cache reclaim. Automatic cleanup can cost an unleased salvage clone a rebuild. The guard budget is checked between removals, and dell1 itself was not exercised.

    Validation at review: changed-file rustfmt, both Git diff whitespace checks, and TOML policy inventory parsing passed. The first launcher job timed out while compiling. The combined retry is running and a longer-timeout retry is queued.
