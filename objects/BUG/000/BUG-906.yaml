title: phase retry collides with its own dead predecessor's lease — retry must reap a lease whose process exited
description: 'Observed on BUG-901''s pipeline (2026-09-08 22:02): the phase-3 reviewer attempt 1 took the PR-scoped lease and died; the STORY-975 retry relaunched and REFUSED on that same lease (scope PR-1700 is owned by lease 01a08482, worktree CLEAN) — attempt 2/2 burned on the predecessor''s leftovers and the spec shelved despite green CI and a finished implementation. A retrying phase must treat a lease whose backing process has exited as reapable: release it (worktree clean = safe; dirty = park with a typed cause naming the dirty worktree) before relaunching. Acceptance: simulated dead-lease + clean worktree lets the retry proceed; dirty worktree parks with the typed cause; regression test beside the retry gate tests.'
