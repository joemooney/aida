title: 'Flaky CI: bug_1683 two_hour_live_lock_blocks_all_launch_entry_points depends on the runner''s real free disk (machine-readiness FAIL before the holder gate)'
description: 'PR-3133 run 41107995099 (cli-1): aida-cli/tests/bug_1683_live_drain_lock.rs:278 panicked ''missed holder gate'' because burndown run''s machine-readiness check failed first (disk:/ 7.5 GiB free vs 17.0 GiB required on the shared runner). The test means to assert the live-drain lock gate, so it must not depend on host disk. Fix: in the test env, stub or skip machine readiness (an existing env override or config such as AIDA_SKIP_MACHINE_READINESS / [doctor.disk_headroom] in the fixture repo), or order the holder gate before readiness if that is the intended product behaviour (a held lock should refuse before any resource probe). Add an assertion that the refusal names the lock holder. FASTTRACK-sized.'
