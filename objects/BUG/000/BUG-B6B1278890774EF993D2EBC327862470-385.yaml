    18. Holder-aware alert assertions in both shared service inclusions: unverified.
    19. Fix inherited-descriptor cause first and describe in PR if demonstrated: not-applicable-because investigation has not established that cause.

    Administrative review story STORY-2452 (not implementation coverage): structured prompt generated, but helper labeled BUG-2621 missing; recovered full spec with aida show --full --comments and completed manual sweep. Decision by spec id follows in review record. Completion after merge: not-applicable-because PR is not merged.

