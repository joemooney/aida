title: 'Auto-train supervisor prints ''refused: review-watch lock busy: admission.lock'' when another tick already holds the lock'
description: 'Operator report 2026-11-15 21:48 MST: terminals show ''auto-train supervisor refused: review-watch lock busy: admission.lock: Resource temporarily unavailable (os error 11)''. It is harmless: review_watch.rs lock() retries for about 1 s, then returns WouldBlock because another supervisor tick holds admission.lock, so this tick has nothing to do. But it reads as a failure and trains the operator to ignore refusals. Acceptance: when admission.lock is held by a live holder, the supervisor exits 0 with one quiet line (''auto-train: another supervisor (pid N) is running; skipping this tick''), or nothing unless --verbose; a real refusal (stale holder, permission error) still prints as a refusal with its cause; a test covers both.'
