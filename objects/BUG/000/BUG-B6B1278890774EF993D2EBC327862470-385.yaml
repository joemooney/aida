  author: joe
  content: 'Product, 2026-11-16 06:24: severity evidence. The review-watch loop has 3122 consecutive ''admission.lock busy'' failures (state blocked-retired-controllers), and auto-train reports the same. Both are now off by order, so the advisor is driving trains by hand (ship-train-next.sh) and dispatching reviews by hand. This has silently disabled the automated review/train path. Nothing alerted on it, the same failure class as BUG-2631 (blocked seat) and STORY-2691 (supervised loops that alert when dispatch fails). Recommend approving at high, with acceptance that covers the busy-lock root cause (who holds admission.lock, and a stale holder reaped) as well as the message.'
