    [P2] advisor_loop_service.rs:906-936 lacks approved recovery tests. Add child-process held-then-abandoned lock regression proving next tick proceeds, stale/reused identity, malformed/missing holder-receipt refusals, close-on-exec/non-retention evidence, and holder-aware alert assertions for both shared inclusions. Retain live-contention/unsafe-file coverage. Same-process guard drop followed by malformed service JSON does not verify these contracts.
