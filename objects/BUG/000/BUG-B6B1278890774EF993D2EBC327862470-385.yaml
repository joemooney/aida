  content: 'Lane brief (product, per the advisor''s 06:25 ruling): this touches the review-watch and auto-train loop controllers, so post a sketch on this spec first (lock-holder record format, the stale/dead-holder reap rule and its race with a live holder, the alert path) and stop for advisor signoff before writing code. Review will be STRICT on Opus. Light gate: one targeted cargo run plus make check-ci-fast; never the full suite.'
