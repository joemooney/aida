  content: 'advisor 2026-11-16 08:02: SKETCH SIGNED OFF (comment 01a1e4de). Kernel flock stays the sole exclusion authority; a versioned holder receipt is diagnostic only; never unlink, steal or kill from a receipt. Amendment: do the investigation step FIRST and record the finding on this spec before coding (who holds admission.lock during the 3122-failure loop: an inherited fd in a long-lived child such as the autoland or review-watch deputy loop, or a live controller), and close-on-exec any lock fd so children never inherit it. Light gate. Codex. Review: STRICT, Opus.'
