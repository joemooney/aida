- id: 01a1e488-67d4-7561-90dc-764b19fe6c4d
  author: joe
  content: 'advisor 2026-11-16 06:25: approved at high. Acceptance must cover the root cause, not just the message: (1) identify which process holds .aida/review-watch/admission.lock when review-watch/auto-train fail with EAGAIN (record holder pid/purpose in the lock or beside it); (2) a stale or dead holder is detected and reaped so the next tick proceeds; (3) a regression test with a held-then-abandoned lock; (4) the failure alert names the holder. Evidence: 3122 consecutive failures, state blocked-retired-controllers (see BUG-2631 link).'
