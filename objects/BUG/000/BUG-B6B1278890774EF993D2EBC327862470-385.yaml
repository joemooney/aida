- id: 01a1e4de-6192-7743-b5dd-78b45efb739b
  author: dirtlab
  content: 'Proposed sketch for advisor signoff: retain the permanent admission.lock inode and kernel flock as the sole exclusion authority. After acquiring flock, write a bounded versioned holder receipt containing PID, process start identity, and a fixed purpose (service supervisor/controller/review admission). On contention read the receipt through the existing pinned-directory safe-file boundary and report holder identity/purpose; only a verified live matching identity permits a quiet supervisor tick skip. Missing, invalid, dead or mismatched holder evidence remains a refusal naming the observation, never permission to unlink or steal a kernel-held lock. A dead process releases flock automatically; after acquiring that same lock, replace stale receipt evidence while holding it. Investigate inherited lock descriptions/descendant retention and lock-held work before changing reaping: never kill a PID or unlink a held lock from a stale receipt. Regression coverage: live contention, held-then-abandoned child process, stale/reused identity, malformed receipt, unsafe files, and alert holder diagnostics. Shared format and recovery semantics require the requested advisor approval before implementation. Narrow message-only draft removed after reading the lane brief; no implementation remains.'
  created_at: 2026-11-16T14:59:01.650162625Z
  modified_at: 2026-11-16T14:59:01.650162625Z
