  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2621):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 38a54c5b98b7
    Recorded: 2026-11-16T17:22:01.540352805+00:00
    Findings:
    1. [P1] aida-cli-lib/src/advisor_loop_service.rs:491-498 silently accepts every admission-lock WouldBlock without identifying its holder. Implement the signed-off bounded versioned PID/start-identity/purpose receipt through the pinned safe-file boundary; skip only verified live matching holders, refuse missing/invalid/dead/mismatched evidence with holder diagnostics, refresh stale receipts only after acquiring the same kernel lock, and include holder evidence in failure alerts. Keep flock authoritative; never unlink, steal or kill based on receipts. Otherwise persistent unexplained contention is hidden rather than diagnosed.
    2. [P1] BUG-2621 advisor signoff comments 4-5 require investigation before implementation: identify and record the actual admission.lock holder/purpose during the reported 3122-failure loop, distinguishing a live controller from an inherited child descriptor. No investigation result is present in the spec or PR; record that evidence and address the demonstrated cause, preserving close-on-exec lock descriptors.
    3. [P2] aida-cli-lib/src/advisor_loop_service.rs:906-936 does not cover the approved recovery contract: it drops a same-process lock and then expects malformed service state to fail. Add a child-process held-then-abandoned lock regression proving the next tick proceeds, stale/reused identity and malformed/missing holder-receipt refusal cases, and holder-aware alert assertions for both shared service inclusions. Retain live-contention and unsafe-file tests.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
