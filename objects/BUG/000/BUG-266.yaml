    Implemented via commit 9fbbeb53 (PR pending):

    - Extended `ImplementerOutcome::Inconclusive` with `retry_hint: Option<String>` so BUG-266's Anthropic-API leg composes with BUG-257's GH-API path
    - New pure helper `claude_log_indicates_api_outage` classifies the headless `claude -p` JSONL log against four transient-outage families: `API Error: 5\d\d`, `Overloaded`, `upstream connect error`, `stream timeout`/`stream disconnected`
    - `RealPhaseDriver::run_implementer` + `resume_implementer` classify non-zero exits via the new helpers; on match → `Ok(Inconclusive { reason, retry_hint: Some("aida queue work <spec> --resume <session-uuid>") })` instead of `PhaseFailure`
    - `finish_inconclusive` now takes `retry_hint: Option<&str>`; the 3 existing BUG-257 GH sites pass `None` to preserve their wording

