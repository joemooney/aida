    REVIEW FINDINGS TO ADDRESS (PR #1637, reviewer verdict: CHANGES REQUESTED — full detail: https://github.com/joemooney/aida/pull/1637#issuecomment-5520342933):

    BLOCKING:
    1. aida-core/templates/skills/aida-pickup.md — the '## Review findings' sed start-pattern is '/Review findings to address:/' but the manifest renderer emits 'Review findings to address (PR #N):' when a PR is known, so the section renders EMPTY in exactly the common rework case. Fix: match without the trailing colon (e.g. '/Review findings to address/'). Add/adjust a test that pins BOTH heading forms through the extraction.

    ALSO FIX IN THIS PASS (advisor triage of the reviewer's non-blocking findings — same code, same class):
    2. The comment-scrape fallback matches only FAIL/RequestChanges lines and misses PARTIAL rows — the most common RequestChanges driver. Include PARTIAL.
    3. rework_review_findings_for fires a gh network call on every aida queue work before any cheap local probe — probe the local verdict file first, network only on miss.

    LEAVE AS-IS THIS PASS (nit, filed in the PR comment): the third separate update_atomically write in the rework handler.

    Contract reminder (this spec's own acceptance): this rework must produce at least one commit or an explicit punt naming which finding it disputes.
