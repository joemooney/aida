title: 'GitLab landing-health: bound the optional job-trace read and keep failed-job evidence independent of it (follow-up from #4139 round 4)'
description: 'Follow-up from PR #4139 (STORY-2849) round-4 review at 620f347, deferred under the operator''s 09:18 blocking-tier ruling and the 4-round cap. In GitLabForge::landing_steps (forge.rs:3263), the adapter waits for glab_api_get(jobs/{id}/trace) before it keeps the Step, and that read has no scoped timeout from landing_health::scan, so a stalled trace holds the whole report until the 120 s child kill. Fix: keep the step from the job listing (failed check, script step, completion time), read the trace under a bounded timeout, and drop it on timeout, as the GitHub adapter does. Add a regression with a stalled trace.'
