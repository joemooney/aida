title: 'Project/store env vars fall back silently: AIDA_STORE set-but-unusable is ignored with no notice; AIDA_PROJECT_ROOT is outbound-only yet reads like a read-side hint'
description: |-
  Sibling of BUG-566 from the same field report (2026-06-15): operator was unsure whether an AIDA_* project env var was set when `aida queue list` misbehaved on a network share. Verification surfaced two silent-fallback behaviors worth tracking on their own.

  ## Finding 1 (primary): AIDA_STORE set-but-unusable falls through SILENTLY
  aida_store_override (aida-cli/src/main.rs:10633, trace SPIKE-48) is intentionally "strict-but-quiet": if AIDA_STORE points at a path that is not a dir, lacks an objects/ subdir, or is unreadable (e.g. a network share that dropped), it returns None and resolution falls through to the normal store with NO notice. Reproduced (case E analog): a bogus store path is silently ignored. The opt-in/never-break-a-forgotten-export-shell intent (SPIKE-48) is sound, but the cost is: a user who DID intend that store gets wrong-context or empty output and no signal that their override was discarded.

  ## Finding 2 (secondary): AIDA_PROJECT_ROOT is outbound-only but reads like a resolution hint
  find_project_root (main.rs:38703) resolves reads purely by walking up for .git; it never consults AIDA_PROJECT_ROOT. That var is only WRITTEN by aida when spawning a child agent (main.rs:34689/35699; docs/environment-variables.md row = "Project root handed to a spawned agent subprocess"). So a user who exports AIDA_PROJECT_ROOT=/path expecting aida to read from there gets a silent no-op. Misleading name vs behavior.

  ## Design tension to respect
  SPIKE-48 deliberately made AIDA_STORE quiet so a stale exported var never BREAKS a shell. The fix must therefore INFORM, not ERROR — preserve the fall-through, just stop it being invisible.

  ## Acceptance
  - When AIDA_STORE is set but unusable, emit ONE stderr notice naming the path + the reason (not a directory / missing objects/ / unreadable: <io kind>) and what it fell back to. Still falls through (no error, no behavior change) — informational only. Suppressible (e.g. AIDA_QUIET or a --quiet) so scripts can mute it.
  - AIDA_PROJECT_ROOT: either (a) honor it as a read-side project-root hint when set+valid, OR (b) leave behavior as-is but document the outbound-only role clearly in docs/environment-variables.md and, if set in a non-spawned interactive shell where it does nothing, optionally note it. Pick one; do not leave the name/behavior mismatch undocumented.
  - Tests pin: AIDA_STORE valid (used), set-but-invalid (notice + fall-through), unset (silent normal resolution).

  Verify against aida_store_override / aida_store_override_from / find_project_root before coding.
