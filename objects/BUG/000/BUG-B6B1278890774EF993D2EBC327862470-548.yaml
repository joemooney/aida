title: Lane-host autobuild skips silently for hours when the primary checkout is dirty, leaving a stale live binary
description: |
  Observed 2026-11-27 (product-15): dell1's aida-autobuild.sh skipped every 30 min from ~00:00 to 11:30 ("skip: primary checkout must be on main with no visible tracked changes") because the dell1 primary held stray staged hunks (a lane leftover). The live binary went 11h / 12 changes stale and lane-run then refused every launch (TASK-3927 at 10:55), which no seat noticed for an hour.

  ## Acceptance
  - AC1: `aida doctor --lane-host` (and the lane-run STALE refusal) report "live binary N hours / M changes behind main; autobuild skipping since <time>: <reason from the autobuild log>" with the one command that clears it.
  - AC2: a test with a fake autobuild log showing consecutive skips and a stale live sha.
