- id: 01a21ec3-c57b-7110-8423-2384130a092d
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2787):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c8a4fbf642a1
    Recorded: 2026-11-27T20:45:34.549132128+00:00
    Findings:
    1. [p1, blocking] aida-cli-lib/src/dev_fresh.rs:157 adds a production read of the string literal "AIDA_AUTOBUILD_LOG", but the key is not classified in aida_core::launch_policy (OWNED_KEYS / AMBIENT_AIDA_KEYS / DROPPED_AIDA_KEYS). The ratchet-set test story_2326_launch_ratchet_tests::story_2326_ambient_aida_inputs_have_a_disposition scans every production "AIDA_*" literal and asserts 'unclassified production input AIDA_AUTOBUILD_LOG in aida-cli-lib/src/dev_fresh.rs'. That is consistent with the red 'CI (fast compile)' job failing at the 'Ratchet set' step (job 140726229181). Fix: add AIDA_AUTOBUILD_LOG to AMBIENT_AIDA_KEYS (it is an operator-set path, not a secret or a grant) in aida-core/src/launch_policy.
    2. [p1, blocking] 'CI (fast gates)' failed at the make check-ci-source step (job 140726229202) at this head. Fast gates passed on neighbouring PRs (#4753/#4755/#4756/#4757) and on main 8e06142, so this PR probably caused it. The sandbox could not fetch the job log (the blob host was denied), so I could not name the failing gate. Run `make check-ci-fast` locally after the fix above and clear whatever source gate the new code trips (candidates: env-var registry/doc gates for the new AIDA_AUTOBUILD_LOG input).
    3. [test-gap, follow-up] lane_host.rs autobuild_check/inspect wiring (the `aida doctor --lane-host` half of AC1) has no test. Only the dev_fresh helpers are exercised. A test that drives inspect() or autobuild_check() with a behind built sha and a fake AIDA_AUTOBUILD_LOG would pin the advisory row's detail and hint.
    4. [p3, follow-up] AC1 asks for 'the one command that clears it'. The dirty-primary hint is a multi-step instruction ('inspect git -C <primary> status; stash or commit stray changes, then rerun the autobuild'), and the generic hint ('fix the skip reason above') names no command. Consider naming a concrete command, such as the autobuild script invocation with its path.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-27T20:47:56.283792031Z
  modified_at: 2026-11-27T20:47:56.283792031Z
