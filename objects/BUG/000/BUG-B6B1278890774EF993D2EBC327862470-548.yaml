  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: BUG-2787 at c8a4fbf642a1 (1 commit behind main; findings do not depend on base changes). AC1: implemented. dev_fresh run_check_fresh prints ''live binary Nh / M change(s) behind main; autobuild skipping since <t> (last <t>): <reason>'' plus ''Clear it: <hint>'' on the STALE refusal that scripts/lane-run.sh calls. lane_host adds an advisory ''autobuild'' row when a same-project dev binary is behind. The log format matches scripts/aida-autobuild.sh (''%F %T skip:/FAILED:/promoted and verified''). AC2: verified by dev_fresh::tests::stale_binary_names_the_autobuild_skip_streak_and_its_clearing_hint (fake log with consecutive skips, a stale built sha, streak reset by FAILED/promoted, missing log reported). Bug protocol ''touches at least one test file'': met via the inline #[cfg(test)] module in dev_fresh.rs. The blocker: the new AIDA_AUTOBUILD_LOG literal is unclassified in launch_policy, which fails the story_2326 ambient-input ratchet, matching the red fast-compile ''Ratchet set'' step. The fast-gates job is also red, and its gate could not be identified from the sandbox. Two non-blocking follow-ups: lane_host has no test, and the AC1 ''one command'' hint wording.. No triage reason was given.'
