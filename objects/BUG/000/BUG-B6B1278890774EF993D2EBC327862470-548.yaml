  author: dirtlab
  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit, dev_fresh):** new `dev_fresh::autobuild_note` reads the tail of the autobuild log (`AIDA_AUTOBUILD_LOG`, else `~/.aida/autobuild.log`, the script default), finds the trailing run of `skip:` lines (broken by `promoted and verified` / `FAILED:`), and yields "autobuild skipping since <first skip> (last <last skip>): <reason>" plus one clearing hint (dirty-primary reason -> `git -C <primary> status`; stash or commit stray changes, then rerun the autobuild). The STALE refusal of `aida dev check-fresh` (what lane-run.sh shows) and a new advisory `autobuild` row in `aida doctor --lane-host` print "live binary Nh / M change(s) behind main; <note>". Missing/unreadable log is reported in the text, never a failure.
    - **AC2 (unit):** test builds a temp repo with a stale built sha plus a fake log (success then several skips) and asserts since-time, reason and hint; a log ending in success yields no skip line; missing log is reported.

    ### Expected files
    - `aida-cli-lib/src/dev_fresh.rs`
    - `aida-cli-lib/src/lane_host.rs`

    ### Ambiguities / conflicts as questions
    - None (report only; primary checkout is never touched).
