description: 'Operator hit (2026-06-13): picked ''Open the diff myself'' in ''aida review STORY-605''; it printed ''→ gh pr diff 862'' but executed it with a -C working-dir flag → ''unknown shorthand flag: C in -C''. gh (unlike git) has NO global -C flag. Fix: drop ''-C <dir>''; set the working dir via Command::current_dir(repo) (gh respects cwd) or cd into the repo first. The displayed command (''gh pr diff 862'') is correct — only the actual invocation injects the bad -C. trace:relates:STORY-553 trace:from-friction'
