- id: 01a2192f-e9c5-72b3-bfcd-5117cbe17164
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #4464):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 7d711a7296e7
    Recorded: 2026-11-26T18:43:33.272745581+00:00
    Findings:
    1. Deferred follow-up. aida-cli-lib/src/pr_train.rs:5347 and :5381. When the automatic train backs off (all_ready under the advisor loop, budget below 20%), `requested` becomes None, so journal recovery resumes every retained non-Done journal. Normally a retained journal resumes only when its member set equals the requested PRs (BUG-2547), and under --all-ready that rarely holds, so the automatic pass normally skips retained trains. A low budget therefore widens recovery to stale journals: it reintroduces the BUG-2547 failure, where a stale journal such as one left by a failed Open errors every tick (for example 'already has open change'), and it spends test/land forge calls at the moment the budget is lowest. land() still re-takes the lease and live gates, so this does not bypass authority. Keep the BUG-2547 set-matching rule, or limit low-budget recovery to journals for trains this loop owns that are still in flight, and add a low-budget auto-train test covering a retained journal whose member set does not match.
    2. Deferred follow-up. aida-cli-lib/src/forge.rs:2463-2470. The watcher_repo comment says `gh browse` resolves the repository 'without an API request'. With several remotes and no default set, gh's smart base-repo resolution can issue a GraphQL repo-network query. That query does not count against the core budget, but the comment overstates the guarantee. `gh browse --no-browser` would print the URL directly, without overriding GH_BROWSER with /bin/echo.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
