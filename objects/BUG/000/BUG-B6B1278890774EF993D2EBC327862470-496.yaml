title: Seat-side GitHub pollers share one 5000/h core budget with the auto-train; add a budget check and back off below 20% remaining
description: |
  Found 2026-11-23 15:06 MST (advisor-122; filed by product-15). The shared GitHub account hit its CORE REST rate limit (0/5000, reset 15:06). The auto-train and train dry-runs then FAIL CLOSED ("could not read full-tier CI … rate limit exceeded"), so nothing lands until the reset. Cause: seat-side GitHub pollers share the 5000/h core budget with the auto-train. Examples: product's one-shot PR watcher polled `gh pr list` every 30s (~120 calls/h), a ci:full labeler scanned every open PR every 3 min, per-PR waiters polled every 60s, plus the integration seat's 1-min watcher. Nothing budgets or backs off.

  ## Acceptance
  - AC1: AIDA's own forge pollers (review-watch, auto-train, main-watch, and any seat watcher AIDA ships) check the remaining core budget (`gh api rate_limit` or the response headers) and BACK OFF when below 20% remaining. Landing-critical calls (train CI reads) get priority over watchers. The back-off is reported, not silent.
  - AC2: `aida doctor` (or `aida land status`) shows the remaining core budget and which pollers consumed it, so a seat can see when its own polling is starving the train. Test with a fake rate_limit response below the threshold.
