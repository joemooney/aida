    Reviewed HEAD: 5966f4233c (round 4 rework on #4464).
    Fixes: (1) a low-budget back-off (all_ready under the advisor loop) now skips journal recovery entirely via recovery_request() (pr_train.rs). Every recovery pass that runs passes Some(candidates), so the BUG-2547 member-set match always applies and a stale retained journal never resumes when the budget is low. (2) watcher_repo uses `gh browse --no-browser` instead of the GH_BROWSER=/bin/echo override. Its comment now says gh's base-repo resolution can issue a GraphQL repo-network query, which does not draw on the core budget.
    Evidence: bug2735_low_budget_backoff_never_resumes_a_stale_retained_journal (new), bug2547_*, and bug2735_watchers_yield_core_budget_to_train_ci (fake gh updated to match 'browse --no-browser') pass in a lane job: 5 passed, 0 failed. make check-ci-fast exit 0 after fixing a trace-header stranding I introduced. The story_2905 source-order test (claim_all before resume_for) still holds.
    Probes: with recovery skipped under back-off, report_automatic_idle sees empty candidates and an empty outcome and returns idle, so no forge call is made. Not backed off and an empty candidate set: Entry::matches(&[]) is false, so nothing resumes.
    Residual risk: the new test covers the predicate and resume_for with a stale journal, not the full handler end to end (that would need forge and budget fakes).
