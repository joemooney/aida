- id: 01a20de5-9d86-7950-a16a-66b1644bda25
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2735):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9b167d9eee8c
    Recorded: 2026-11-23T23:26:38.198815878+00:00
    Findings:
    1. BUG-2735.AC1. The auto-train's startup monitor checks the budget, but advisor_loop_train.rs:150-173 still invokes the automatic train pass after it reports a low budget. That pass uses --all-ready, inventories open PRs on every tick (pr_train.rs:5017-5025), and proceeds into candidate evaluation. Separate background discovery from active train recovery and exact-head CI, so the automatic poller reports a skip below 20% while already selected trains can still read CI.
    2. BUG-2735.AC1. The drain's per-PR CI watcher only consults the budget after CI is observed running. Fresh PRs with no checks instead enter the registration loop at phase_driver_trait.rs:1581-1607, issuing gh pr checks every 10 seconds even below 20% (ci_gate.rs:445-468). The same seat's red-refinement path at phase_driver_trait.rs:1687 also polls check rows without the budget gate (ci_gate.rs:491-531). Gate the seat's repeating reads at those entry points and keep landing-critical callers eligible.
    3. BUG-2735.AC1. The unpinned rate-limit check uses the CLI's default API host (forge.rs:2329-2335). The interactive gh run list/watch commands infer a repository (or take GH_REPO), so a GHES checkout can be measured against github.com's budget or vice versa. A high reading or auth failure on the default host then lets polling continue while the watched host is below 20%. Use the same resolved host and routing for the budget request and the watched operation, and add a two-host regression. https://github.com/cli/cli/blob/v2.105.0/pkg/cmd/api/api.go#L383-L400
    4. BUG-2735.AC1. watcher_backoff only spawns a bare gh from PATH (forge.rs:2329-2343). The main watch, startup monitor, and interactive CI watcher can run the real probe through the resolver's absolute-path fallbacks (kernel.rs:418-452). With gh installed in /usr/bin or ~/.local/bin but omitted from a seat's PATH, the budget check silently falls through while these pollers continue to issue requests. Use the actual watcher's executable through bounded resolution. The new fixture places one fake gh in both resolution paths and cannot catch this.
    5. BUG-2735.AC1. The streaming loop checks the budget only while gh run watch is alive, then unconditionally starts another forge probe once the child exits (ci_watch.rs:60-86). If the child completes or errors after polling past the threshold and before the next budget check, this final request bypasses back-off. Route the completion probe through the same budget gate, and exercise a budget drop while the child is running.
    6. ci_watch.rs:64-70 kills the interactive gh child with SIGKILL after printing the budget message. On terminals where gh enabled the alternate screen, that bypasses its screen restoration and leaves subsequent AIDA output on the alternate screen. Use bounded graceful cancellation that restores the terminal before printing the back-off. GitHub CLI handles SIGINT for that purpose. https://github.com/cli/cli/blob/v2.105.0/pkg/iostreams/iostreams.go#L361-L388
    7. ci_probe.rs:661-670 counts the intentional budget pause toward the no-progress timer and returns NoSignal on idle expiry. A running check that normally re-arms that timer can complete during the pause and still cause phase 2 to stop with CiUnavailable (phase_driver_trait.rs:1776-1783) before the next budget reset. Keep the absolute deadline and distinguish throttled time from observed CI inactivity so the waiter can resume after the budget recovers.
    8. At the retired-grant cap, recover_closed_reviews forwards the expected low-budget condition as a recovery error (advisor_loop_service.rs:1177-1186). settle records it as a service failure (lines 821-829), and the third occurrence can send a repeated-service-failure alert (lines 1426-1446). Make the expected throttle a reported skip without counting it as a service failure. Keep actual discovery errors on the existing failure path.
    9. The fake budget fixture at lines 5660-5725 covers the repository discovery helper, a main-watch pass, and a direct commit_checks call. It does not run the review-watch worker, auto-train discovery or startup monitor, the seat CI waits, or supervisor recovery. The direct commit reader also does not prove that an active train still reaches that reader under low budget. Add low-budget entry-point coverage which checks the reported skip, absence of watcher requests, and continued CI reads for an active train.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
