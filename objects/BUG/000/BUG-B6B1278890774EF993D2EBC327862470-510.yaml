    MUST:
    (F1) Session end of the OWNING session for a MISSING linked checkout runs the same staged-index retention check BEFORE removing worktree metadata. An absent checkout gives NO "clean" evidence: staged entries or an unverifiable index means RETAIN. Test.
    (F2) EVERY git gc / gc --auto / gc_aggressive invocation (store compact, opportunistic store GC) passes `-c gc.worktreePruneExpire=never`, so gc never prunes worktrees implicitly. Test: a missing checkout with staged changes survives `aida store compact`.
    (F3) Restore BUG-39's pre-add recovery for a manually deleted .aida-store checkout, but PER-WORKTREE and ONLY when its registered index passes the retention check (provably clean); otherwise refuse with guidance. Test both.
    Ratchet ledgers: lowering a count to match removed sites is allowed; never raise or add. One targeted cargo run, then make check-ci-fast, then push to #4537. COMMIT your work.
    TITLE TRAILER: keep the existing PR title unchanged.
