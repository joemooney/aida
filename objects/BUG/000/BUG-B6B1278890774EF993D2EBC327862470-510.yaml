    REVIEW FINDINGS TO ADDRESS (BUG-2749):
    Verdict: CHANGES REQUESTED
    Reviewed commit: d25b5af04f87
    Recorded: 2026-11-25T01:49:09.610208159+00:00
    Findings:
    1. BUG-2749 AC1: Ending the session that owns a missing linked checkout can still delete its staged index. At aida-cli-lib/src/session_end.rs:1583, worktree_dirty_entries returns an empty list for an absent checkout. At :1701 the commit-coverage check intentionally skips that path, but :2039 still calls the forced linked-worktree removal before the new guarded prune at :2296. Git accepts an absent checkout and deletes its registration without a cleanliness check, even without --force. Session GC can reach the same removal path at aida-cli-lib/src/worktree_gc.rs:391 if a checkout disappears with a newly staged change after the scan or during confirmation. Enforce the staged-index check at the deletion boundary or retain the registration, and cover normal session end with a staged-only missing checkout plus disappearance after the GC scan. Git removal source: https://github.com/git/git/blob/v2.43.0/builtin/worktree.c#L1258-L1273
    2. BUG-2749 AC1: Store maintenance still invokes repository-wide worktree prune indirectly. aida store compact calls gc_aggressive (aida-cli-lib/src/store_cmd.rs:119 and aida-core/src/git_ops.rs:5657). Opportunistic store GC also invokes git gc --auto at aida-core/src/git_ops.rs:5534. With the linked .aida-store layout, these commands share the project's Git common directory. When GC runs, Git invokes worktree prune with its configured expiration, so an unlocked missing sibling with an old staged-only index can lose its registration even after AIDA's new check retained it. Disable the worktree-prune phase for these maintenance invocations and cover compaction with an expired staged-only sibling. Git GC source: https://github.com/git/git/blob/v2.43.0/builtin/gc.c#L691-L697
    3. Removing the pre-add prune in aida-core/src/git_ops.rs:3989 drops the BUG-39 recovery for a manually deleted .aida-store checkout even when its registered index is provably clean. create_store_worktree now calls git worktree add directly, which refuses a path that is still registered. Restore guarded, path-specific retirement before reattaching a clean store checkout, while retaining staged and unreadable indexes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
