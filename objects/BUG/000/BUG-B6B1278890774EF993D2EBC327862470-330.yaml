- id: 01a1d972-2375-7ba1-ae40-daae97c24f56
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2565):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 0ef99b3c5301
    Recorded: 2026-11-14T08:59:51.973011227+00:00
    Findings:
    1. Coalescing reuses a pull that started before the waiter was invoked (store_pull_coalesce.rs:393-402). If an in-flight `aida pull` or `db sync --pull` fetched origin before a new upstream commit landed (for example, a train merges a PR and then runs its post-merge `aida pull` while an older pull is still running), the waiter gets Turn::Reused and prints "pull already completed" even though its local main or store never received that commit. Downstream steps (auto-bump of the merged specs, dev build promotion, a reviewer reading a just-pushed spec state) then run on stale state. Fix: in the reusable() veto, confirm freshness cheaply before reusing (store: store_already_has_remote_head; for aida pull, also check the code repo origin/<default> head with ls-remote is contained in local HEAD), or reuse only a pull that started after the waiter arrived (generation recorded at start). Add a test where the remote moves while the first pull is in flight and the waiter must not reuse.
    2. AC3 and AC1 lack test evidence. noop_pull_skips_reconcile_with_large_gate_ledger creates 1200 dirs under <root>/.aida/gate-ledger, but the second run_deferred_code_reconcile call returns via the watermark gate before anything reads them, so the <10 s bound times a no-op function, not pull work. No test drives `aida pull` (handle_pull_command_coalesced) or `db sync --pull` (db_sync_local_window) on a no-op remote to show that the fast path is taken (the conflict scan and collision scan are skipped) and the call finishes within the bound. Add a test that runs db_sync_local_window or the pull store leg against a bare origin with nothing new and 1000+ ledger dirs, and asserts that the fast path is taken and the call finishes under 10 s.
    3. The db sync fast path makes two ls-remote round-trips per pull: probe_remote_branch and then remote_branch_head_sha (git_backend_cmd.rs:1365-1372). One query can answer both whether the branch exists and its head SHA.
    4. pre_sha is captured after the pending-change commit (store_push_pull.rs pull_store_leg_locked), and the db sync fast path skips find_spec_id_collisions entirely. So a no-op pull no longer re-scans locally committed pending changes for spec-ID collisions, which the old path did on every pull.
    5. The implementer comment on BUG-2565 documents the AIDA_PULL_COALESCE=0, AIDA_PULL_COALESCE_WAIT_SECS and AIDA_RECONCILE_WATERMARK_TTL_SECS knobs, but the code removed them (as the PR body says). The spec comment is stale, and there is no operator kill switch if coalescing misbehaves.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
