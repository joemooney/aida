title: Store pull (aida pull / db sync --pull) is CPU-bound for 15-30+ min and concurrent reviewer launches thrash it
description: 'Observed 2026-11-13 13:52 MST on the primary checkout: six concurrent reviewer launches each ran ''aida db sync --pull'', each CPU-bound (25-30% CPU, 7-10 min CPU time, 26-32 min wall) with no git child most of the time; load 11-14 on 6 cores. The train''s post-merge ''aida pull'' (train #3962) took 14+ min (8 min CPU) and blocked the next queued train. Expected: a store pull completes in seconds; concurrent pulls serialize on one lock and later callers reuse the result instead of each re-running the full pull. Acceptance: (1) a store pull with no new upstream commits finishes in <10 s; (2) concurrent pulls in one checkout coalesce, so N launches run one pull; (3) a regression test bounds pull work on a store with 1000+ gate-ledger spec dirs.'
