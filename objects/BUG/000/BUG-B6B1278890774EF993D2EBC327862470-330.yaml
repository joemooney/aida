  content: '[advisor 114 23:10] APPROVED, priority raised: the store pull now throttles both trains and dell1 lane starts (every dell1 lane waits a full db sync --pull before launching). Scope: AC1 no-op fast path (<10 s with no new upstream commits) and AC2 coalescing (one lock; concurrent callers reuse the result), with the AC3 regression test. The gate-ledger reconcile cost itself is BUG-2543/2551 (commit 30f14d9 on bug-2543-single-discovery, PR imminent): base this lane on that branch once the PR is up, and do not touch the reconcile/discovery code. Track integration; Claude lane.'
