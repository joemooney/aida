title: A fast-tier run cancelled by a ci:full relabel leaves 'Build (ubuntu-latest)' red; land status reports CI-FAILED and landing-health trips on it
description: 'Observed all day 2026-11-18 (#4137, #4207, #4254, #4258, #4259, #4264, #4226). Adding ci:full cancels the in-flight fast-tier run. Its ''Require every CI lane'' Build aggregate and the ci-tier: fast / CI (matrix) rows report fail. They stay on the PR''s checks while the full tier runs, and even after it passes, until the full run''s own Build reports. aida land status shows CI-FAILED (dispatch rework), and landing-health-guard trips with ''probable infrastructure or base cause'' on several PRs at once. Fix: when a newer run for the same head supersedes a cancelled one, readiness and landing-health ignore the superseded run''s results (or the workflow uses a concurrency group so the cancelled run''s aggregate isn''t published as failure). Regression: a head whose fast run was cancelled and whose full run passes is READY, and landing-health is clean.'
