    - **Finding 3:** conflict-forecast fetch runs through `command_output_with_timeout` (20s bound); existing `detect_main_conflict_forecasts_through_fetch_and_merge_tree` still covers the path. No automated stall test (would need a hanging remote).
    - **Finding 4:** `is_ruling_comment` reuses `rework_direction::lead_line`; existing ruling tests cover it.
    - **Finding 2 (flaky CI rest):** the new push re-runs CI; test not touched.

