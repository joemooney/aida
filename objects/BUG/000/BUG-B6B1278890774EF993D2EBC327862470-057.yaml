title: Headless rework lane ignores the newest advisor brief comment when an older review verdict prescribes different work (merge-only brief skipped twice)
description: 'Observed 2026-10-31 (advisor): BUG-HOME-051 lanes launched 12:31 and 13:16 with a spec comment ''ADVISOR BRIEF 13:10 (merge-only, retry): PR-3169 CONFLICTS with main ... git merge origin/main, resolve, push''. Both lanes instead re-ran the earlier review''s bwrap test instructions, reported they could not run cargo in the sandbox, and exited at the old head f976c90 with no merge (logs /tmp/aida_lane_bug-051-merge2.log, /tmp/aida_lane_bug-051-merge4.log). The advisor resolved the conflict by hand. BUG-HOME-021 (lanes read only the description) is completed, so comments are now read, but the brief is not ranked above the stale verdict. Expected: the lane prompt puts the newest advisor brief (ADVISOR BRIEF / REWORK BRIEF comments newer than the last verdict) first and labels older verdict findings as superseded context. Also: a PR with merge conflicts against main should be surfaced to the lane as the first task. Acceptance: (1) prompt-assembly test: a spec with a verdict then a newer brief yields a prompt whose first task is the brief; (2) a conflicting PR adds a ''resolve conflicts with main first'' item; (3) BUG-021''s tests still pass.'
