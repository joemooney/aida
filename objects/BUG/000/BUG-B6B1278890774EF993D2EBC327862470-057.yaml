  content: |
    ADVISOR REWORK BRIEF round 5 (19:35), PR-3177 at 78ed8a6. One CI failure; main is green.
    CI (lib): `gitlab_project_create::bug_2181_host_remote_credentials_tests::task_2001_every_host_remote_call_routes_its_credentials` (bug_2181_host_remote_credentials_tests.rs:565) flags aida-cli-lib/src/rework_direction.rs:168. The conflict-forecast `git fetch --quiet origin -- <base> <head>` contacts the remote without credential routing.
    Fix: route it with `.remote_credentials(project_root, "origin")` (or `configure_remote_credentials`), the same as other host fetches. Keep `GIT_TERMINAL_PROMPT=0`. Do NOT justify it with remote-creds-ok: it really is a network fetch, and on the work clone (GitLab) it would fail without the routed credentials.
    Local gate (LIGHT): `AIDA_CARGO_TIMEOUT=900 cargo test --profile agent -p aida-cli-lib --lib -- bug_2181_host_remote_credentials rework_direction` in the background, then `make check-ci-fast`, then push. If cargo is denied, CI is the gate. Read CI logs with `gh api repos/joemooney/aida/actions/jobs/<id>/logs` (BUG-2380).
