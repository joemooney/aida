    1. Placement: a brief OLDER than the last verdict renders BELOW the authoritative findings, as background context (today it renders above them). The assembly test for case (c) brief→verdict must assert the order (findings index < brief index).
    2. Case (d) no verdict time: add the end-to-end assembly test through the extracted pure function (brief leads, findings stay authoritative), failing if the brief_supersedes filter is removed.
