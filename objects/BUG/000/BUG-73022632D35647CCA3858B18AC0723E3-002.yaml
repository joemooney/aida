- id: 01a20de5-1225-78b1-877a-d377771e08c7
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2701):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 9e251dbc1f5e
    Recorded: 2026-11-23T21:05:37.815175982+00:00
    Findings:
    1. BUG-2701: The required-live regression calls missing_bwrap_capability directly with true and a prebuilt message. It still passes if bwrap_live ignores AIDA_REQUIRE_BWRAP_LIVE, passes false, or returns false before calling the helper. Exercise bwrap_live through its real environment and result handling with a controlled missing executable or a recognized namespace denial. Assert a named skip when optional and a failure when required. Cover unexpected probe failures at the same entry point.
    2. BUG-2701: The new SKIP (BUG-2169 live bubblewrap: ...) marker no longer matches the independent rejection in the Live bwrap OS-wrap confinement gate, which checks only SKIP (bwrap unavailable). If required-live enforcement stops reaching the assertion, libtest counts the early return as ok and the workflow's success-count check also accepts it. Preserve the machine-matched sentinel while adding the reason, or update the workflow to reject both markers.
    3. BUG-2701: The probe can turn execution failures into optional capability skips. On Linux a bwrap entry can exist on PATH and still return ENOENT when its script interpreter or ELF loader is missing. The NotFound arm reports that case as an absent executable. The stderr arms likewise accept an allowlisted phrase anywhere in the output without first requiring a normal error exit and a Bubblewrap diagnostic. Distinguish an absent PATH entry from a failure to execute a present entry, and match the known namespace diagnostic as such, so broken probes fail visibly.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-24T14:10:45.925408690Z
  modified_at: 2026-11-24T14:10:45.925408690Z
