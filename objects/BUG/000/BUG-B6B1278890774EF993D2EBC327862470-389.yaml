title: Resumed (non-relaunched) advisor session is live in the registry but holds no seat; deputy job meta stays 'running' after a crash
description: |
  Observed 2026-11-15 23:26 MST. After a desktop crash, the operator resumed the advisor directly with `claude --resume`, not through `aida agent new`. `aida agent list` showed claude-advisor-115 live (pid 4011367, role advisor), but `aida mailbox send --to seat:advisor` was refused with "seat 'advisor' has no live holder". The resumed process's registry row carries no seat binding, so the seat looks empty, and peers must use --queue-for-role or a handle.

  Expected: either the SessionStart(resume) hook re-binds the seat for a live registered advisor, or the hook warns loudly ("this session does not hold seat:advisor; relaunch with `aida agent new claude --role advisor`").

  Also seen: deputy-shell job meta.json stays "running" forever after the runner is killed (deputy 2 job 20261115T205449-810af4, deputy 3 job 20261115T210901-a9fd3a), so a crashed review looks in flight.


  ## Acceptance
  1. A Claude session resumed with plain `claude --resume` whose registry row is a live seat holder either re-binds that seat at SessionStart(resume), or prints a warning naming the unheld seat and the exact relaunch command (`aida agent new claude --role <role>`). A regression test covers the chosen behaviour.
  2. After a resume that re-binds, `aida mailbox send --to seat:<role>` delivers to the resumed session; after a resume that only warns, `aida agent list` shows the row as not holding the seat, so the registry no longer reports it as the holder.
  3. When a deputy-shell runner dies, its in-flight job's meta.json no longer reads `running` indefinitely: the next runner start or `aida deputy` status read marks it terminal (for example `abandoned`, with the dead runner pid), and `aida awaiting` stops reporting it as in flight. A test kills a runner mid-job and asserts this.
