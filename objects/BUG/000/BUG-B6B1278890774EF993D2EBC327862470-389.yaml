    ## Implementer self-review
    Reviewed HEAD: cfbc140e9ee323c5889f1c8fb93c93ba43fecbb0. The merge-base diff was empty. Reviewed the native lane's complete uncommitted diff and verified there were no untracked additions.

    - AC1: [evidence: behavioral-test] PASS. The SessionStart resume regression in aida-cli-lib/src/status_awaiting.rs:4258 checks the advisor warning, both relaunch forms, a startup event and an unrelated session ID. The existing launcher requires --seat to restore seat-addressed mail.
    - AC2: [evidence: behavioral-test] PASS. The same regression checks that the registry view serializes an explicit null seat on the resumed row. aida-cli-lib/src/agent_registry_root.rs:197 renders that state as seat:(none).
    - AC3: [evidence: behavioral-test] PARTIAL. aida-cli-lib/src/deputy_shell/tests.rs:1572 kills a native runner while a script is running, checks terminal orphaned state and runner PID, verifies the failed-job feed used by awaiting, and checks that a second status read is idempotent. The next-start recovery regression also passes. The operator's external Bash deputies 2 and 3 are documented in docs/internal/agents/advisor-script-inventory.md:69, but neither their script nor a legacy meta.json fixture exists in this lane. Their exact recovery remains open.

    Deep-pass probes covered role and seat normalization, exact session ID and resume-source matching, missing/ambiguous history, JSON null and terminal state format, repeated reads, and a live runner racing status. The warning never binds a seat. Status writes native job state only in a private queue while holding its existing runner lock, and the crash test proves a live runner's job remains running. No tests were weakened. The earlier test attempts exposed a subprocess isolation-argument error; the fixture now reuses the required launch arguments.

    Final lane job j20261119T074309731-2-0 executed three tests and passed all three. Formatting, whitespace, trace headers, ExecContext, the writer inventory, and 60 Python hook/inventory tests passed. Exact published-head CI is unavailable. The configured CodeGraph client was missing; call sites were checked with rg.
