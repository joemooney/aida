title: aida pull auto-bump catches only ONE (SPEC-ID) trailer when a commit references multiple — BUG-503 stayed Approved after a (BUG-503) (BUG-504) merge
description: 'Observed 2026-06-12: PR #794 squash-merged with subject ''... (BUG-503) (BUG-504) (#794)''. aida pull auto-bumped BUG-504 -> Completed but left BUG-503 Approved; ''aida db reconcile-status --spec BUG-503'' also reported ''no commit references it'' — so BOTH the auto-bump and the reconcile matcher only recognize ONE (SPEC-ID) per commit (likely the last paren group before (#NNN), or a single-trailer assumption). Two specs legitimately shipping in one PR (a common cluster case) leaves all-but-one stuck at Approved/Done. Fix: the (SPEC-ID) extractor in the auto-bump + reconcile scan must collect ALL (SPEC-ID) groups in the commit message (not just one) and graduate each. Verify: a commit ''(BUG-1) (BUG-2)'' bumps both on pull. Relates to the existing extract_spec_ids_from_commit helper.'
