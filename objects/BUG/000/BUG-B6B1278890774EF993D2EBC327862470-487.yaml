title: 'Rework pickup pushes a merge-only head before the fix: remove the pickup publication (BUG-2714 AC1 slice only)'
description: 'Minimal slice. Rework pickup publishes the local base merge to the PR before the implementer''s fix, so review-watch reviews a merge-only head while the lane runs (dozens of wasted reviews on 2026-11-22: #4382, #4373, #4387, #4391, #4385). The broader fixes are parked: BUG-2706 (#4382, review-time deferral) and BUG-2714 (#4395, a ship-time merge-only guard), and neither converged. #4395 r1 and r2 reviewers VERIFIED this slice: ''AC1 — verified by the removal of the production pickup publication callback and the queue pickup assertion that origin still names the original PR head after local preparation.'' AC1: rework pickup prepares the base merge LOCALLY only, and origin still names the original PR head after pickup; take the AC1 diff from #4395 (branch kept). AC2: the existing ship path publishes merge plus fix together (unchanged behaviour). AC3: a regression test that origin is unchanged after pickup. OUT OF SCOPE: every merge-only, NoChange, ancestry or tree-equality guard (parked BUG-2714). Target <=100 changed lines.'
