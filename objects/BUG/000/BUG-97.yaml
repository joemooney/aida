    Implemented via epic-23-5 (commit 556802b9):

    - Fixed swallowed-error bug in `git_backend::get_requirement_by_spec_id`: pre-checks `object_exists`; when the file is present, read_object's error propagates with full anyhow chain. When file is missing, falls through to agreed_id scan as before.
    - `aida show` call site wraps the propagated error with "Parse failed: <id>" header + recovery hint.
    - Smoke-tested: deliberately corrupted a YAML file's UUID — before: "Requirement not found"; after: "Parse failed: STORY-100 / Detail: <serde error> / Likely cause: binary version mismatch / Recovery: ..."
    - Genuine not-found (`aida show STORY-999999`) still surfaces the original "Requirement not found" message — no regression on missing-file path.

    Test status: shipped together with TASK-223 (shared formatter). 332/332 cargo tests green.
