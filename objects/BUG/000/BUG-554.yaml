title: Sequential-chain agents stack branches on the prior unmerged commit (reused worktree, no reset-to-main) → semantic rebase conflicts + spec↔branch mis-attribution
description: "When multiple specs are worked sequentially THROUGH ONE AGENT in ONE worktree (e.g. \"do TASK-A then TASK-B\"), the agent creates spec B's branch off its CURRENT HEAD — spec A's unmerged commit — instead of off origin/main. Two failure modes result:\n\n1. SPEC<->BRANCH MIS-ATTRIBUTION (BUG-553): A's commit is now reachable from both branches; aida human's reviews bucket AND aida queue list's in-flight linkage attribute A to B's branch / group both specs under one PR.\n\n2. SEMANTIC REBASE CONFLICT: if A and B edited overlapping files, once A merges (squash), B's required rebase onto main is no longer mechanical — it's a hand-merge of two specs' changes to the same code. Observed 2026-06-14: #893 (TASK-805 in-flight marking) stacked on TASK-806 (#891 burndown status); both edited main.rs burndown-display + docs/cli/03-work-autonomy.md; after #891 squash-merged, `aida pr rebase 893` predicts a conflict in those 2 files.\n\nROOT: one-worktree sequential chaining branches off the prior unmerged commit. The drain's `--concurrency 1` (a SEPARATE worktree-isolated implementer per spec, each off main, merged before the next) does NOT stack — it's the correct serialization. \n\nFIX OPTIONS (pick at grooming):\n  (a) Agent-launcher / pickup-skill: when reusing a worktree for a NEXT spec, `git reset --hard origin/main` (or branch a fresh worktree off main) first — make stacking impossible.\n  (b) Routing convention: never chain specs through one worktree; serialize via separate per-spec worktrees off main (the --concurrency 1 model).\n  (c) Both: (b) as the convention, (a) as the substrate guard.\nRelates BUG-553 (the display half). trace:from-friction"
