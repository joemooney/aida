  content: 'Resolution (advisor, keyboard burn-down): BUG-554 is closed across three mechanisms — (1) SUBSTRATE: aida session start forks new branches from origin/main + warns when cwd is on a feature branch (BUG-76, main.rs detect_default_branch_ref ~39918); (2) DRAIN: serialize-groups fan ≤1 per serialize:<group> per wave (TASK-814, Completed); (3) GUIDANCE: the burndown skill now spells out the reset-to-origin/main rule for raw-git agents reusing one worktree sequentially (the #893 case) — PR #928. The original stacking bug is prevented at the substrate; the residual raw-git discipline is now documented. trace:BUG-554'
