- id: 01a1fb43-cb13-7f50-b1bb-3160c993e71c
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2662):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 0ab2fa424e20
    Recorded: 2026-11-20T23:18:40.340328492+00:00
    Findings:
    1. aida-cli-lib/src/gate/ledger/store.rs:1157 — settle returns Appended after sync_data fails if it can read the approval back. That read can be served from the page cache. The caller then publishes the approval and clears the review claim, and an identical retry returns Unchanged without syncing. A crash can therefore lose an approval already reported as durable. Keep the receipt for recovery, propagate the sync error, and require a successful sync before acknowledging or publishing the act. The Unsynced fixture currently expects the premature success.
    2. aida-cli-lib/src/review_commands.rs:3519 — Announcement deduplication checks mark.exists() after releasing the ledger locks and writes the mark after emitting. A second identical recorder can see the event already standing and the mark still absent, so both announce it. A crash between emit and mark gives the same duplicate on retry. The simultaneous-approval fixture finishes the inner command before the outer append and misses this interval. Deduplicate by the appended act identity at the announcement sink.
    3. aida-cli-lib/src/review_commands.rs:3524 — emit_review_verdict_recorded uses events::emit, which discards append failures, but mark_review_announced still marks the announcement complete. A transient events.jsonl write failure therefore suppresses the announcement even after recovery and retry. Mark completion only on confirmed delivery.
