- id: 01a18c42-cc5c-7203-a7cc-9a9a096e0432
  author: joe
  content: |-
    ## Implementer findings (couldn't file as draft TASKs: this seat's sandbox blocks ID allocation, and the MCP file_finding tool was denied)

    1. **kind:followup-suggestion, severity:minor.** Alias input with an unpadded number, such as `BUG-HOME-36`, is still not found. `NodeAliasMap::expand` keeps the sequence exactly as typed, but the allocator writes `{seq:03}`. Fix: parse the sequence and format it `{n:03}` in expand.
    2. **kind:design-choice, severity:minor.** I shipped signposts rather than a resolver change, because A and C already held: node-local ids are stored as TYPE-<node>-NNN and rendered through display_spec_id. The change adds three things:
       - a not-found alias suggestion
       - a stderr note on `aida show` when a local twin exists
       - the `aida doctor ambiguous-ids` lint

       The stored prose rewrite (allowed surgery) was not done. Run the lint first to see how much there is.
