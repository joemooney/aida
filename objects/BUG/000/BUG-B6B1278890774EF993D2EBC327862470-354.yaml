- id: 01a1dee0-a19f-7083-9053-d0034ed857da
  author: joe
  content: 'BUG-2589 evidence (advisor 2026-11-15 03:30-03:50 MST, primary host): while the root-run self-hosted CI shards of #4058''s full run (43704925800) executed, /proc/pressure/io stayed at some 65-87% / full ~52%. `aida pull --store-only` hit rc 124 at 600 s with only ''Pulling store aida-store <- origin'' printed; three `aida comment add` calls timed out at 100-180 s with no output. The pull''s child git `merge-base --is-ancestor <store_head> <cache_head>` sat in D state for 2-9 min; three such gits stacked up (one parented to systemd --user, i.e. the cache refresh worker) and `git rev-list --count <store_head>` used 1.7 s CPU in a 60 s wall. So under disk contention the pull and cache refresh ancestry walks are IO-bound and unbounded, and concurrent ones pile up. Ask: bound/skip the is-ancestor walk (commit-graph, or compare against a recorded store head), single-flight the cache worker''s walk, and print a phase line before each git step.'
