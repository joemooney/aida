title: 'aida pull is slow even when idle: 60 s with no new commits, 278 s after a promotion, on the build with both pull fixes'
description: |
  Measured by the advisor on the primary, live build 15d4cd0 (includes BUG-2551 spin fix #4040 and BUG-2565 pull coalescing b562c42), 2026-11-15 ~01:25 MST:
  - first pull after a promotion, fetching new commits and completing one spec: 278 s, rc 0;
  - idle pull with no new commits: 60 s, rc 0.
  Earlier on the unfixed code: 351 s with three reviewer launches alongside (2026-11-14). Every post-train pull today was cut off by the product seat's 75 s watchdog (.aida/tmp/train-pull-watchdog.log).
  The CPU spin (BUG-2551) and lock contention (BUG-2565) are both fixed, so the remaining time is the pull's own work. Every lane pickup, reviewer launch, rework start and post-train step pays it.

  Wanted: a profile of where an idle pull and a post-train pull spend their time (phase timings printed by the command, like the BUG-2584 final-gate lines), then the fix for the largest phase.
  Acceptance:
  - `aida pull` with no new commits completes in under 10 s on the primary.
  - A post-train pull that fetches one landing and completes its specs completes in under 60 s, three runs in a row.
  - `aida pull` prints one timed line per phase (fetch, scan, cache refresh, completion, push) so the next regression is visible without a profiler.
