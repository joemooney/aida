  content: 'Verified resolved 2026-05-30: `aida del` already accepts `-y, --yes` (clap def in cli.rs) and `aida del --help` documents it (''-y, --yes  Skip confirmation prompt''). The original 2026-05-09 failure was `--force` specifically, but `--yes` is the established convention (matching `aida session end --yes` etc.) and is in place. No code change needed.'
