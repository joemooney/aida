title: An exited implementer lane's seat clone keeps holding the PR branch, so the next rework pickup (--force-claim --branch) refuses
description: 'Hit 4 times on 2026-11-05 (TASK-2832, STORY-2492, STORY-2475, TASK-2995 worktree). After a headless Codex lane exits, its lease and seat clone survive; ''aida queue work SPEC --role implementer --force-claim --branch <PR branch>'' then fails ''branch ... is held by a contained seat''s private clone ... before pickup setup''. The advisor must hand-verify the clone, publish any pending edits, and ''session end --force'' it. Sibling of BUG-2450 (reviewer side). Acceptance: (1) --force-claim on a branch held by an exited (dead-pid) lane''s clean, pushed clone retires that clone and lease automatically; (2) a dirty clone is published (commit-pending to the PR branch) or refused with the exact path and diff stat; (3) regression test covers both.'
