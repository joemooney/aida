  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: Logic is sound and fail-closed (dead+clean+pushed only, KeepUnshipped re-probe, release_lease_files), but the four bwrap-dependent regression tests are outside CI''s forced-live bwrap gate, so acceptance (3) has no CI proof; plus minor message/coverage nits. CI still pending at review time.. Triage reason: Address the latest review on #3421 (see its last ''## Review'' comment and the spec''s review verdict) and any red CI at the current head; push to branch bug-b6b1278890774ef993d2ebc327862470-221 (no new branch). LIGHT gate.'
