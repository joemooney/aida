  author: joe
  content: 'Implemented explicit force-claim recovery at private-clone branch occupancy: only proven-exited, clean, fully pushed clones retire automatically using conservative teardown and lease cleanup. Dirty/unpushed/live/unknown/ambiguous holders remain protected; refusals include exact clone path, pending work and tracked diff stat. Resume adoption remains in place. Added four git/bwrap-backed regression tests, all passing, plus CLI docs; cargo fmt and git diff --check pass.'
