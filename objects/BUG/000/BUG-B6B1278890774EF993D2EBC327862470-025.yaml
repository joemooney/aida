title: node alias set reports Error when only the GitHub push fails, though the label was committed
description: '2026-10-29: operator ran `aida node alias set ASTER --node a65b...` where github.com did not resolve; it printed ''Error: git push failed ... Could not resolve host: github.com'' yet the label was committed (a re-run said ''already labelled ASTER'' and mirror-sync published it). Acceptance: registry writes push to every reachable hub (respecting a clone''s configured push hubs, see STORY-HOME-097), report a partial publish as a warning naming the unreached hub and the retry command, and exit 0 when the label is committed locally and on at least one hub.'
