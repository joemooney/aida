title: 'aida land mode: a failed outcome-audit append must return a nonzero partial-success error, not success (follow-up from #4254 round 2)'
description: 'Deferred from PR #4254 (STORY-2897 S2) round 2 at 1efadfb under the 09:18 blocking tier. land_mode.rs:517-535: after the forge/config change, a failed outcome append (ENOSPC/IO) is only printed to stderr; apply_change returns Ok and the command reports success, leaving landing-audit.jsonl without the before/after, read-back and outcome. Return a nonzero partial-success error that keeps the recovery details. Regression: inject an append failure after the PATCH.'
