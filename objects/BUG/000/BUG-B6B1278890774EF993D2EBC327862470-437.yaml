    - AC2: [evidence: behavioral-test] The deleted-origin regression in aida-cli-lib/src/tests/bug_2169_seat_clone_tests.rs:1321 runs the deferred queue lookup with a cached ref, checks the base and Git error, and checks that no pin or lease survived.
