title: 'review watch: changing max_concurrent refuses every admission until all running reviews drain (''another watcher uses a different concurrency limit'')'
description: 'Observed 2026-11-08 05:45-05:58 after TASK-3472 landed and the repo set [review_watch] max_concurrent = 4: the restarted watcher refused every PR with ''another watcher uses a different concurrency limit; use --max-concurrent 2'' because .aida/review-watch/state.json kept max_concurrent=2 while two reviews started under the old limit were active (review_watch.rs ~1328-1330 only adopts the new limit when the active-attempt count is 0). Throughput dropped to zero new admissions for ~13 min. Expected: a raised limit applies immediately (active attempts simply count against it), and a lowered limit stops new admissions without refusing with a misleading ''another watcher'' message. Acceptance: unit test where state has max 2 with 2 active attempts and a watcher with max 4 admits a third review; lowering 4->2 with 3 active admits none and reports the cap, not another watcher.'
