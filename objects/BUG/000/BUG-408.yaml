title: 'aida agent new --show-context is not dry: it starts the session (worktree + lease + status→InProgress) before printing context'
description: |-
  Observed 2026-05-31: ran 'aida agent new codex --role implementer --spec SPIKE-44 --show-context' expecting a DRY preview of the launch-context snapshot (per CLAUDE.md: '--show-context # Print the generated launch-context snapshot'). Instead it created the worktree (/home/joe/ai/aida-spike-44), started a session/lease (019e7ca5), flipped SPIKE-44 Approved→InProgress, AND printed the context — i.e. --show-context still runs the full session-start + (attempted) launch, just also prints the snapshot. Required manual session-end + status revert to clean up.

  Expected: --show-context should be a PURE PREVIEW — render the launch-context snapshot for the given role/spec WITHOUT starting a session, creating a worktree, flipping spec status, or launching the agent. (Or rename the dry flag, e.g. --print-context, and document that --show-context launches.) Surfaced while the operator mandated autonomous fleet control — a dry preview is exactly what you want before committing to a real launch.
