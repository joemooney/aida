- id: 01a1d903-8c18-7540-967b-cd8370f5e050
  author: dirtlab
  content: 'Rework addressed in aida-core/src/allocation_authority.rs and aida-cli-lib/src/test_env.rs. Both fixtures require an explicit root-local .git identity before authority discovery; explicit linked worktrees may use a temporary shared common directory, while directory-backed fixtures remain confined to their repository. Added CLI ancestor-isolation and core linked-worktree regressions. Lane tests: core bug_2560 4 passed; cli-lib bug_2560 1 passed. make check-ci-fast: all 48 gates passed. rustfmt and git diff --check passed. Existing bug_2140 run: 1 passed, 1 failed at require_global because its existing allocation setting has shared-write permissions; the original inside-root refusal is resolved. Production permissions unchanged. Host codegraph client missing at configured absolute path; doctor confirms missing. Edits uncommitted for host publication.'
