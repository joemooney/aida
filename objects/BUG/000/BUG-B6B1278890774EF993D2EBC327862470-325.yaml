title: Test fixture writes /tmp/.git/aida-allocation.toml and breaks tempdir mailbox tests on that host
description: 'Seen twice on dell1 2026-11-13 (23:54, 05:04): /tmp/.git holding only aida-allocation.toml with version=1 authoritative=true (test-only fixture content, e.g. allocation_authority.rs home_fixture_backend ~1605). Every test tempdir under /tmp then resolves /tmp as its git root; mailbox tests fail (NotAGitCheckout, empty inbox). Fix: fixtures write authority strictly under their own tempdir; common_dir refuses a nonexistent gitdir target. Workaround: mv /tmp/.git aside (copies at dell1:/tmp/stray-dotgit-20261113*).'
