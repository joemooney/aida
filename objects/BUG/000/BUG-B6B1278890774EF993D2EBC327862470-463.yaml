title: 'Codex lanes ignore pending agent briefs: a brief file in .aida/agent-briefs/codex/ never reaches the codex lane''s launch context (BUG-2688 r2 redid the wrong scope)'
description: 'Evidence 2026-11-18: the BUG-2688 r2 brief was placed at dell1 ~/ai/aida/.aida/agent-briefs/codex/BUG-2688-r2-2026-11-19T023229Z.md at 19:32, before the 19:37 launch, and was also posted as a spec comment with a pointer. The codex lane log has zero references to the brief or to agent-briefs. It implemented a different change, and the round-2 review repeated all three round-1 findings. Every Claude lane given an agent-briefs/claude file today followed it (TASK-3814 R4, STORY-2912 R2, STORY-2913 R2/R3). Sibling of BUG-2603 (lane prompt omits the newest advisor comment). Fix: the codex launch path loads pending agent briefs for the spec into the lane prompt exactly as the Claude path does, and marks them consumed. Add an explicit ''queue work --brief FILE''. Regression: a codex lane launched with a pending brief has the brief text in its prompt. Interim advisor rule: brief-scoped reworks go to Claude lanes.'
