title: Train ejects members on CI infrastructure failures (dependency-install timeout) instead of retrying once; Test time budget crashes when tests never ran
description: |
  Split from BUG-2668 by advisor ruling, 2026-11-17. #4246 lands only AC1 (the install step survives a slow mirror).

  AC2: when a CI lane fails in its dependency-install step (or another infrastructure step) before any tests run, report it as an infrastructure failure, distinct from a test failure. The train then retries that CI run once instead of ejecting the member.

  AC3: the 'Test time budget' step doesn't raise FileNotFoundError on target/test-run.log when tests never ran; it reports 'tests did not run'.

  Evidence: train #4240 and train #4241 both ejected #4229 on the apt-step timeout on 2026-11-17.
