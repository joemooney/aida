spec_id: BUG-285
agreed_id: BUG-285
title: BUG-269 gate has a hole — 'aida queue done --yes' succeeds with no open PR (tonight's TASK-413/TASK-416 evidence)
description: |-
  ## Symptom

  2026-05-21 overnight drain, both TASK-413 and TASK-416 (phase-1 implementer sessions) exited cleanly without opening a PR. Both followed the exact same path:

  1. Implementer made the work, committed locally on its branch.
  2. Implementer ran \`aida queue done <SPEC> --yes\` — and the command **succeeded**, flipping spec status to Done.
  3. Implementer wrote a clean closing-summary recommending \`/aida-pr\`.
  4. Implementer exited without running \`/aida-pr\`.
  5. Orchestrator: \`✗ phase 1 (implementer session) failed: the implementer session exited cleanly but opened no PR\`.

  **This is the pattern BUG-269 was filed to prevent.** BUG-269's acceptance: *\"\`aida queue done <spec>\` adds a pre-check that runs before status promotion ... if \`commits_ahead > 0\` AND no open PR → refuse.\"* But tonight, \`aida queue done\` ran with commits ahead AND no open PR, and it succeeded.

  ## Likely causes (one or more)

  1. **\`--yes\` bypasses the gate.** The implementer used \`--yes\` to skip a confirmation prompt; if BUG-269's gate is implemented as a prompt rather than a hard refusal, \`--yes\` would auto-confirm \"proceed anyway\" and bypass it.
  2. **The gate fires on a different code path than what \`aida queue done\` actually runs.** E.g., it fires on \`aida edit --status done\` but not on \`aida queue done\`.
  3. **The gate's PR detection is wrong** — it might be checking for open PRs on a branch name that doesn't match (e.g., looking for \`origin/<spec-id>\` instead of \`origin/<branch>\`).
  4. **BUG-269 shipped a noop** — the spec merged (#136) but the gate code path was incomplete or never wired in.

  ## Acceptance

  - Reproduce the failure on a fresh clone: create a branch with one commit, run \`aida queue done <SPEC>\` (with and without \`--yes\`), assert the gate refuses.
  - Root-cause one of the four hypotheses above; fix the actual hole.
  - The gate MUST be a hard refusal (non-zero exit), not a prompt. \`--yes\` does NOT bypass — it's for unrelated confirmations within the command.
  - Add an opt-in bypass for the legitimate case where queue-done is right despite no PR (spec implemented on a different already-merged branch, etc.): \`aida queue done --skip-pr-check\` with an explicit message logged when used.
  - Update the regression test to cover the \`--yes\` case explicitly — assert the gate fires regardless of \`--yes\`.
  - Verify the fix by re-running TASK-413 / TASK-416 drains and confirming queue-done refuses → implementer routes through /aida-pr first.

  ## Bigger picture — and why this matters

  This is the **second iteration of the same dogfood discovery**:
  - Day 1 (TASK-389, BUG-249): commit-and-exit-without-PR. Filed TASK-401 (skill template) + BUG-269 (programmatic gate).
  - Day 2 (TASK-413, TASK-416): same pattern recurs even though BOTH fixes shipped through their own dogfood-merges. The fixes ship; the bug persists.

  Memory \`feedback_self_test_via_dogfood_merge\` predicts this: the dogfood-merge surfaces remaining gaps. Tonight's gaps are (a) BUG-269's gate has a hole, and (b) skill-template instructions remain advisory regardless of how emphatically they're written. The substrate fix is to make the programmatic gate actually work; the model can read \"do X\" and not do X, but it cannot run \`aida queue done\` and get past a refusal.

  ## Composes with

  - **BUG-269** — the gate this BUG fixes.
  - **TASK-401** — the skill-template enforcement that's complementary but not sufficient.
  - **TASK-422** (shipped tonight) — fixed /aida-pr's status check; not relevant to this failure mode (queue-done succeeded; the implementer just didn't run /aida-pr afterward).
  - Memory \`feedback_self_test_via_dogfood_merge\` — pattern at work; tonight's failures are tomorrow's substrate.
