title: aida search leaks seeded META AI-prompt specs; aida list hides them — inconsistent
description: 'Round 8 of the novice-first loop. ''aida list'' hides the seeded META requirements (the AI-prompt templates META-002..006) by default (BUG-27: retain non-meta unless --include-meta). But ''aida search'' has the same --include-meta flag yet never applies it — so a novice''s search surfaces ''Generate Children'' / ''Suggest Relationships'' / etc., internal machinery they don''t recognize. Fix: search applies the same META filter as list (hide meta unless --include-meta). Found running a novice''s multi-task session.'
