comments:
- id: 019ec345-397b-7f12-890f-b5ca42c5754c
  author: joe
  content: 'CORRECTION (operator, 2026-06-13): the ''Approve'' option is PRINT-ONLY (''print the merge command'') — it does NOT auto-merge, so picking it on already-merged work is harmless (you just don''t run the printed command). The actual footgun is ''Request changes → aida queue rework'', which WOULD run rework on a Completed spec. So the bug is narrower than first stated: not ''offers to re-merge'' (Approve is inert) but (a) it runs a full review + presents the action menu at all on already-Completed/merged work — confusing — and (b) the Request-changes path is live and could disrupt Completed work. Fix still stands: short-circuit on terminal/merged state before offering the menu.'
