    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 02:53):
    # BUG-2727 / PR #4419 r2 = SCOPE CUT (advisor-122 ruling 2026-11-23 02:54 MST; relayed by product-15). Lane: CODEX. Target <=120 changed lines.

    CR at 1adec850 (r1, +294/-74, 8 findings). The new pinned-tree store reader (mandate_traces.rs buffers the whole tree and every object, and requires an origin ref) caused most findings and breaks existing fixtures. RULING: DELETE the pinned-tree reader. Instead, when the mandate's spec resolution misses:
    1. fetch origin/aida-store into the local store (the same bounded path `aida pull` uses), then
    2. resolve the PR's trailer labels with the store's EXISTING unambiguous resolver (the one trailer coverage already uses; agreed_id labels and padding handled) for BOTH the coverage and current-record checks, so they never disagree (finding 2);
    3. on a remaining miss, the refusal NAMES the unresolved labels (AC2).
    Keep ship_gate_known_ids as is.
    Tests: the #4414 shape (labels on origin but not local), a padded agreed id, and an existing fixture without refs/remotes/origin/aida-store that keeps working.
    The reviewer scope is the scope cut plus the diff.
    Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
    One targeted cargo run, then `make check-ci-fast`, then push on the existing branch. COMMIT your work.
