title: Advisor writes emit "agent target antigravity is ambiguous" warning when 2+ antigravity agents are registered
description: 'Observed repeatedly during advisor edit/comment commands (aida edit --status, aida comment add) this session: stderr "warning: agent target antigravity is ambiguous — matches multiple active agents: antigravity#NNNN, antigravity#MMMM". Some notification/routing path resolves a bare agent name "antigravity" against the agent registry and warns when 2+ active agents share that name. Harmless (the command succeeds) but noisy. Find the bare-name agent-target resolution (likely a post-write notification/mailbox hook) and either disambiguate (route to all matching, or skip) or suppress the warning when the target is a name-class not a specific id. Verify cause before fixing.'
