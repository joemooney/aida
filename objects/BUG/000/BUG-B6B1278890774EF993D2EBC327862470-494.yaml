  summary: 'BUG-2733 (completing). AC1 [behavioral-test]: verified by bug_2733_promotion_branch_resolves_only_the_new_commits_spec (train squash-body path: identity_gate::branch_commit_identities -> member_spec_ids resolves only BUG-3) and bug_2733_ship_gate_reads_only_the_new_commits_spec (ship path: pr_service::ship_gate_spec_records). AC2 [behavioral-test]: verified by bug_2733_train_refusal_names_only_the_new_commits_spec, which checks that the supervised refusal starts with the unchanged wording and names only BUG-3. Round-2 findings are addressed. F1/F2: every git call goes through host_git_command with --no-ext-diff, --no-textconv and --no-show-signature, tested by bug_2733_patch_id_read_never_runs_a_textconv_driver with a live probe. F3: --binary --full-index, tested by bug_2733_distinct_binary_changes_do_not_collide. F6: a change reverted on base is kept, tested by bug_2733_a_change_reverted_on_base_is_not_already_on_base. The scoped train deadline applies because run_bounded takes min(timeout, forge_lookup_deadline). Every failure path (rev-list, log -p, patch-id, cap, timeout, no fork point) keeps every commit, so the supervised gate still sees each spec and the failures fail safe. The linear-promotion boundary is verified by bug_2733_linear_promotion_establishes_its_review_boundary, including the refusal for a commit without (#N). It only changes review-story coverage and matches the non-promotion path''s all-commits coverage minus landed copies. Squash bodies stay explicit in train and ship, so dropping landed commits from squash_coauthor_body_override cannot fall back to a forge default body that leaks a non-allowlisted email. Measured on this repo: against the real origin/integration (321 non-merge commits) the base window is 194-308 commits, and log -p takes about 4.6s, inside the per-call limits. Stale base (3 commits behind): the only base change to a touched dependency is git_ops porcelain quoting, which does not affect these findings. CI pending at review time (fast gates pass; fast compile pending; merge-hold-gate awaits clearance, which this approval does not grant). All findings are non-blocking p3/style follow-ups.'
