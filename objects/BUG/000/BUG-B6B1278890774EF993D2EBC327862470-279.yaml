title: Generated 'Start review' hint drops --vendor and --no-human, taking a launch path that containment refuses
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. A contained advisor session printed a shortened review hint; running it launched with --permission-mode dontAsk and was refused under containment, and setup rolled back. The full working command was 'aida queue work MR-2 --role reviewer --vendor codex --no-human --strict'. Generated next-step hints must preserve the vendor and execution mode the project needs. Regression test for the hint text in a contained Codex project.
