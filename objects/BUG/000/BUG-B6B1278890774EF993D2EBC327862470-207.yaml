  content: 'AC3 is satisfied by STORY-2324 PR-B (#3331, merged as e51705844b6), so it is skipped here as the acceptance allows. The review-watch collector, collect_standalone_verdict (aida-cli-lib/src/gate/review_verdict.rs:2477), resolves each credited label once through GateSpec::resolve (review_verdict.rs:2603) and calls ledger::record_collected_verdict at review_verdict.rs:2609. That function (gate/ledger/mod.rs:243) writes each per-spec body via event::verdict_event(..., Some(spec)), which stamps spec_key. The PR-keyed aggregate event is still written with None, the same as before. Rework for the train ejection: merged origin/main and changed the bug2438_ledger fixture to pass GateSpec::with_key(..) (ab7108bd906). No logic change.'
