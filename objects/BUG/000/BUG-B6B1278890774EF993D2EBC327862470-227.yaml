title: 'Native lane host post-exit commit uses a generic ''chore(seat): work native Codex lane ... left uncommitted'' subject for completing PRs'
description: 'Observed 2026-11-06: every native Codex lane PR opens titled ''[AI:codex] chore(seat): work native Codex lane <lane> left uncommitted (<SPEC>)'' (#3482 #3483 #3485 #3486 #3487 #3488 #3491 #3492). This is true even on live 2aeb7cc, which includes TASK-2902 (#3492''s lane launched 02:38, after the 02:29 promote), because TASK-2902 preserves only a DECLARED subject, and aida-pickup asks only partial slices to declare one. The advisor retitled each PR by hand, since the squash subject becomes the main commit and the spec record. Fix: (1) post_exit_message (aida-cli-lib/src/ship_from_seat.rs ~:272) builds a clean exit''s fallback subject from the owning spec the way TASK-2891 (#3456) derives seat PR titles: ''[AI:codex] <type>: <spec title> (<display ID>)'', still a completing trailer only on a clean exit, still Refs on failure; it uses the display ID, not the origin ID (#3492 shows TASK-b6b...-872); (2) aida-pickup (template master aida-core/templates/skills/aida-pickup.md:34) tells EVERY native lane to declare its subject with aida ship -m before exit, completing or Refs. Acceptance: a clean-exit lane with no declaration opens a PR whose title is derived from the spec; a declared subject still wins; failed exits keep Refs; tests in the ship_from_seat test module; make sync-templates and make check-templates. LIGHT gate.'
