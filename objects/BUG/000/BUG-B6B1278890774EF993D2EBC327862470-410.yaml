title: 'Rework admission recovery: unverified approvals and closed terminal waits mis-handled when ownership discovery fails'
description: 'Follow-up from PR-4158 round-4 review (BUG-2629). When binding discovery fails, the raw recovery in queue_cmd/work.rs (~3030-3039) (1) lets an ownership-unverified miskeyed approval suppress a real WAITING refusal, and (2) revives a terminally closed ledger-only wait because newest_review_of strips terminal_wait_source annotations. Both fall back to the pre-BUG-2629 behaviour (Unavailable, ignored), so neither is a regression vs main. Fix: ignore ownership-unverified non-waiting rounds as clearance; apply terminal_wait_overlay_body before is_closed. Regressions for both shapes are given in the PR-4158 review comment of 2026-11-16 21:26 on BUG-2629.'
