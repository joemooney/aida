title: Deputy sandbox exemption docs give exact-match excludedCommands entries that never match a real submit
description: 'docs/advanced/deputies.md ''Letting a sandboxed advisor submit'' (line ~249), and the matching refusal text from ''aida deputy shell submit'', tell the operator to add "aida deputy shell submit" and "aida deputy shell cancel" to sandbox.excludedCommands. Claude Code matches those entries like Bash(...) permission rules, so an entry without a wildcard matches only the bare command with no arguments (code.claude.com/docs/en/sandboxing). A real call such as ''aida deputy shell submit --name product --file F --wait'' therefore stays sandboxed and fails with ''sandbox blocks unix sockets'' (observed 2026-11-15 on the product seat). Acceptance: the doc and the refusal help text give "aida deputy shell submit *" and "aida deputy shell cancel *", say the call must run bare (no cd, &&, redirect, or $(...)), and say to restart the session after editing the settings.'
