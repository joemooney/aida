  author: joe
  content: 'Confirmed 2026-11-15 21:35: the exemption works only for the bare call. ''aida deputy shell submit ... --wait 2>&1 | tail -1'' stays sandboxed and gets the unix-socket refusal; the identical bare call succeeds. Add to acceptance: the refusal text says ''if this call was piped, redirected or chained, run it bare'', and the doc lists pipes alongside cd, &&, redirects and $(...).'
