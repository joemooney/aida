title: 'Reviewer pickup: rollback leaks its lease, conflict checks run after the store pull, and the two-round cap stops reviews silently'
description: '2026-11-12 evening, review relaunches failed repeatedly: (1) ''no agent was launched: rolled back the PR-3896 pickup setup (worktree, lease, claim...)'' yet lease 01a1d2701cdf survived and blocked the next pickup (''ownership reclaim could not end lease ... holder records no witness''). (2) ''aida queue work PR-N --role reviewer'' pulls the orphan store (~1 min) BEFORE refusing on ''branch pr-N is held by worktree'' / existing lease, so each refusal costs a pull; stale reviewer worktrees (#3775, #3887, #3896, #3902) each blocked one launch. (3) The review-watch two-round cap only sends a mailbox request; the PR then sits with an unreviewed head indefinitely. Acceptance: AC1 rollback removes every artifact it reports rolling back (lease file included), with a regression test; AC2 pickup checks branch/worktree/lease conflicts before any store pull or setup, and auto-reclaims a reviewer worktree+lease whose holder process is dead and whose worktree is clean (merge-hold markers copied first, per BUG-2176); AC3 hitting the cap queues one manual-review request and records it on the PR''s gate ledger, so autoland/advisor tooling can see it.'
