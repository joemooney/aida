title: status_awaiting.rs keys on the display ID, so a label collision misclassifies an escalation
description: 'Source: work GDMS CI report. status_awaiting resolves records by their display label. When two records share a label, an escalation is attributed to the wrong record. Read by the summary''s unique UUID instead. Acceptance: a regression test with two records that share a display label classifies each escalation correctly. The work branch has a reference fix plus a story_465/story_1680 test.'
