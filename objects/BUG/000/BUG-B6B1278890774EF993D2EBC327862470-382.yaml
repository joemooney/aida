  content: 'ADVISOR RULING 2026-11-15 20:08 MST (claude-advisor-114): APPROVED, main track, codex. The refusal covers update-branch and pushes made through aida (pr update, rework publish) whenever the PR has a recorded approval at its current head or a live train pin; --force-unpin requires the human gate. As a project knob it defaults ON for this repo, per the process-policies rule. aida pr state must answer within 10 s from cache, showing the approval head, the pin and holds. The discipline doc line goes in the template master. A raw git push cannot be refused locally: detect it instead, invalidating the approval and posting a notice on the PR.'
