    Changed files:
    - aida-cli-lib/src/docs_sweep.rs: guard the push boundary for both existing
      sweep PRs and branches whose earlier PR lookup found no PR.
    - aida-cli-lib/src/seat_clone.rs: guard publish_rework_merge inside its
      cleanup scope; add a real publication-boundary refusal regression.
    - aida-cli-lib/src/pr_head_guard.rs: GitHub branch publication uses a unique
      open-head query and refuses ambiguous ownership before choosing a PR.
    - aida-cli-lib/src/pr_lookup.rs: bounded two-result open-head query; tests
      for ambiguous ownership, query arguments, unavailable observations.
    - aida-cli-lib/src/ship_from_seat.rs: guard refusal now uses the same
      compare-delete quarantine cleanup as adjacent gates.
    - aida-cli-lib/src/tests/bug_home_038_seat_publish_tests.rs: real handler
      refusal regression verifies no remote publication, removes the import,
      and retains a sibling quarantine ref and its object.
    - aida-cli-lib/src/tests/story_2220_docs_sweep_tests.rs: existing sweep PR
      extension refuses before moving its remote head when policy is refused.

    Review finding status:
    1 OPEN: cached <=10s state/list, current-open-set evidence, independent
      approval-head, train-owner and holds displays are not implemented here.
    2 PARTIAL: the two reported missing push guards are added. Wider audit found
      queue_cmd/recover.rs::recover_push_branch and integration_cmd.rs's push to
      integration also need review. pr_train.rs::open pushes train branches.
      intent_intake.rs and store/coordination push paths are separate data/store
      transports; determine scope rather than blindly applying product PR guards.
      Existing guards are present in drain_batch, review_watch_update and forge.
    3 PARTIAL: GitHub check_branch refuses multiple open PRs rather than borrowing
      the first PR's permission. Explicit per-PR mutation paths still need a
      complete affected-head review as part of finding 5's boundary.
    4 OPEN: strict ledger/publication selection is not implemented. The current
      checked_current_verdict still has lossy canonical evidence projection.
    5 OPEN: no shared approval/reservation/publication coordination boundary or
      interleaving regression. Another pre-push read would not repair this.
    6 OPEN: no durable raw-head invalidation or deduplicated PR notice reconciler.
    7 ADDRESSED: guard refusal uses exact-tip compare-delete quarantine cleanup.
      Boundary regression uses a refused policy to avoid live network dependency.

