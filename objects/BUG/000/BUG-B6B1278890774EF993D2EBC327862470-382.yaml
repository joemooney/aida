    4. [P1] forge.rs::update_change_branch and the empty-commit mutation call check for only the specified PR; pr_cmd.rs::pr_rebase_handler likewise calls check directly. These paths bypass check_branch and gh_pr_unique_head. If one branch backs an unprotected PR and a second approved or train-pinned PR, updating/rebasing the first moves the protected second head. Resolve all affected branch PRs or refuse ambiguity at every mutation boundary, with a protected-second-PR regression. This persists in landed tree b82057fe despite base changes to forge.rs.
    5. [P2] BUG-2618 advisor ruling requires detection of raw head moves, durable approval invalidation and a PR notice. This diff only adds preventive checks and discipline prose; no reconciler/watcher implementation supplies that behavior. Existing SHA matching and clean-merge carry-over do not fulfill the detection/notice contract. Implement durable invalidation and a deduplicated notice for out-of-band git/forge updates.
