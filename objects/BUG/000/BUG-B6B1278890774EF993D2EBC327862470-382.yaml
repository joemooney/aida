    Recorded: 2026-11-17T01:09:02.240863058+00:00
    Findings:
    1. [P1] BUG-2618 AC1/advisor ruling remains unimplemented. pr_list.rs::PrListEntry has no approval-head or train-pin fields; pr_state.rs::collect still uses live forge probes without the required cache, and its human renderer omits independent approval-head, train-owner and hold facts. Implement cached <=10s state/list reporting with these facts visible together and current-open-set evidence. The new pr_head_guard.rs does not satisfy this requirement.
    2. [P1] pr_head_guard.rs:28-38 treats unavailable canonical approval evidence as permission to mutate. checked_current_verdict reaches newest_review_event/verdict_events/store::read_file, whose unreadable-ledger case becomes an empty event list. With no legacy JSON, a ledger-only approval can disappear and protection allows publication. Signed-publication verification errors also project request-changes, which this guard treats as unprotected. Use strict error-preserving evidence selection and refusal regressions with no legacy JSON.
