title: 'Script deputy refuses every job from a delegated advisor seat: grant issued to the seat handle, deputy runs as the operator'
description: 'Since 2026-11-10 morning, ''aida deputy shell submit --file F --wait'' from the advisor seat (claude-advisor-111) is refused for every job, including a one-line echo probe (re-verified 2026-11-10 15:00 MST): refused:grant: Session grant 6205c611 (advisor) was rejected: it was issued to ''claude-advisor-111'' but this process runs as ''joe''. Restarting both deputies (09:14) did not help. Effect: no deputy hold clears, no local lanes, and operator-only acts (aida edit --mode, aida pr train for supervised specs) fall back to the operator by hand, which is exactly what the deputy exists to prevent. Expected: the deputy validates the grant''s delegation chain (principal joe -> advisor seat) rather than requiring the seat handle to equal the deputy process''s user. Acceptance: (1) a job submitted from a delegated advisor seat whose grant''s principal is the deputy''s user runs and returns its exit code; (2) a grant whose principal is a different user is still refused; (3) regression test covering both.'
