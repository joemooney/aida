  content: 'Advisor ruling 2026-11-16 10:20 (advisor-117) on the #4166 round-1 CR at 8a6e4a6 (codex, STRICT). All three findings are BLOCKING because they are correctness defects in the alert path this spec exists to fix. (1) seat_health.rs:114-126: a successful agents response that omits the session row or its status must not erase waits or emit a recovery. Clear only on positive non-waiting evidence or confirmed termination, with missing-row and missing-status regressions. (2) seat_health.rs:164: keep the episode identity and backoff per live session until actual recovery, not keyed on the selected since-timestamp; test ack-of-oldest-hello and source transitions. (3) notify.rs:251: a seat_health::check error must not suppress ordinary notifications. Run both checks and aggregate errors; add coverage for a failed health transport with a due ordinary alert. Before pushing, run cargo test -p aida-cli-lib seat_health plus the lane pre-push gate. ci:full is removed and the hold stays. Rework runs codex. The reviewer''s ''residual partial-slice scope'' notes (.aida/review-audit-pr-4166.md) are non-blocking and stay out of this round.'
