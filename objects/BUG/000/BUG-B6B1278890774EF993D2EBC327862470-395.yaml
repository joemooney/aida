  content: 'Product addendum 2026-11-16 05:48: (a) The root cause of the 00:42–05:40 block was the advisor asking Joe a blocking question (an interactive prompt) while Joe was away. A seat under an active mandate should rule and act on its recommendation, not block on a question, and the alert has to cover that case. (b) The advisor-handshake check has been listing hellos unanswered for 8h and 22h, which taught seats to ignore it. Acceptance addition: stale hellos from dead sessions are pruned or aged out, so ''advisor unreachable'' only fires for a live problem.'
