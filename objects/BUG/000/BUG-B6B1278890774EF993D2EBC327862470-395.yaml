- id: 01a1e575-d5cd-7170-9967-48b85188f768
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2631):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 8a6e4a6abc2a
    Recorded: 2026-11-16T17:15:53.999203924+00:00
    Findings:
    1. [P2] seat_health.rs:114-126: Preserve prior waits when a successful Claude agents response omits the live session or its optional status. Only whole-query None currently retains evidence; missing rows/status erase waits and emit false recovery, restarting the threshold when the row returns. Clear only on positive nonwaiting evidence or confirmed termination; add missing-row and missing-status regressions.
    2. [P2] seat_health.rs:164: Do not key continuous block episodes by the selected since timestamp. Acknowledging the oldest of several unanswered advisor hellos changes failed_since while another failure remains; reconcile sends a false clear and resets backoff with an immediate replacement alert. Marker/wait/handshake source transitions also change the key. Preserve episode identity/backoff per live session until actual recovery and test these transitions.
    3. [P2] notify.rs:251: Isolate health-check errors from ordinary notifications. The new seat_health::check(project_root)? returns before existing notification rules run. A failed extra push channel or corrupt health ledger repeatedly suppresses ordinary shelve/escalation/idle alerts even when notify.command works. Execute both checks and aggregate errors after preserving successful state; add coverage for a failed health transport alongside a due ordinary alert.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
