title: aida pr train ejects every member when gh pr merge returns a transient error though GitHub merged the train PR
description: 'Observed 2026-11-03 23:32Z, train #3322 (10 members). gh pr merge for the train PR returned ''GraphQL: Something went wrong while executing your query'' but GitHub had rebase-merged it: origin/main''s tree equals the train head and all 10 member commits are on main. The train reported ''0 landed, 10 ejected'', exited 1, and left all 10 member PRs open with merge-hold-cleared labels; BUG-2425/BUG-2426 stayed in-progress. Fix: after any merge-call error, re-read the train PR state (and/or compare origin/main to the pinned head) before deciding; if MERGED, proceed with the landed path (close members with commit pointers, complete specs). The advisor closed the members by hand.'
