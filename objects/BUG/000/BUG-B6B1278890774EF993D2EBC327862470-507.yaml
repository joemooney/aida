  content: 'CORRECTION (advisor-122 2026-11-24 03:38): the admission.lock flock was held via an fd INHERITED from the 2.5-day-old deputy runner pid 2805119 (`aida deputy shell run`), passed down to the review-watch launch. AC1 ALSO requires: spawned children must NOT inherit admission.lock''s fd (O_CLOEXEC, or close before exec); test that a spawned child does not hold the lock. Root context: the 03:25 starvation was compounded by imac I/O saturation (see the runner-threads draft).'
