    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 05:10):
    # BUG-2746 / PR #4514 r2 (advisor-122 ruling 2026-11-24 05:10 at 372c046e; strict, MAIN; product-15). Lane: CODEX. Existing branch. <=80 lines.
    AC1 (brief lock hold + no fd inheritance) is NOT challenged: keep it as is. Fix the AC2 diagnostics:
    (F3, MUST, regression) Recording diagnostics must NEVER gate admission. If writing the activity record fails (ENOSPC etc.), KEEP the acquired guard and treat the record as unknown. Test with an INJECTED write failure.
    (F1) A stale record must not be reported: truncate/clear the activity record BEFORE unlock, and stamp it with the holder PID + START TIME. The busy reader reports activity/age ONLY if that pid+start is the LIVE flock holder; otherwise it reports "unknown". Test a stale record left by a released lock.
    (F2) ONE regression on the REAL train path: train admission via select_train_members contends with a review-watch reservation on .aida/review-watch/admission.lock, and the recorded failure carries the holder's activity and age.
    If still blocked only on diagnostics, the advisor scope-cuts AC2 to "unknown" and ships AC1: say clearly in your exit summary what's done.
    One targeted cargo run, then `make check-ci-fast`, then push to #4514. COMMIT your work.
