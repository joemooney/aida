title: Review-watch holds the shared admission.lock for a whole reviewer launch (fd inherited by spawned children), starving the auto-train
description: |
  Found 2026-11-24 03:25 MST (advisor-122; filed by product-15). The auto-train failed 6 times in a row with "admission.lock busy; holder legacy review-watch". The holder is the advisor loops worker (pid 427625, running 15m+), whose child runs `aida review watch --launch-reservation PR-4502:...`. Review-watch holds the SHARED admission.lock for the whole reviewer launch, starving the auto-train: p33 #4508 was green and dry-run clean but couldn't board.

  ## Acceptance
  - AC1: A reviewer-launch reservation holds admission.lock ONLY for the reservation write, not across the launch. Test: while a reviewer launch is blocked or slow, train admission still succeeds.
  - AC2: The auto-train's "admission.lock busy" alert names the holder's ACTIVITY (e.g. "review-watch launching reviewer for PR-4502") and its AGE. Test.
