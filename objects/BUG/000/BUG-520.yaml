title: help-all omits real commands (rules, doctor, defer) — they exist with full --help but appear in no group
description: 'Surfaced writing the CLI manual (EPIC-40). rules, doctor, and defer have full --help but appear in NO aida help-all group, so they are invisible in the topic inventory AND uncatchable by the manual drift-guard (which treats help-all as the authoritative command set). remote/release sit under Git-and-lifecycle though they are setup/maintainer verbs. Fix: every real top-level command must belong to exactly one help-all group; add rules/doctor/defer; reconsider remote/release placement. This is an integrity gap — help-all is supposed to be the complete inventory.'
