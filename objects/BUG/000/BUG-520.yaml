comments:
- id: 019ec1c6-80ad-7251-8a3c-068a95c0a756
  author: joe
  content: 'Per ADR-5 (decision 1): reframed from gate-integrity to DISCOVERABILITY. The drift-guard''s authority becomes the clap command tree (complete by construction), so help-all omitting rules/doctor/defer no longer lets a command escape the guard. This bug is now ''help-all should list every real command for human discoverability'' — still worth fixing, but no longer blocks the CI gate (STORY-597).'
