    Implemented via commit b6e6c204:

    - handle_pull_command now tracks per-leg failures and returns Err on any non-zero `git pull --ff-only` exit or store-leg pull_rebase failure (instead of swallowing the warning).
    - Code-leg failure now prints an explicit recovery hint covering both the untracked-file conflict and the diverged-branch case, plus an explicit "auto-bump skipped" note.
    - Orchestrator phase 5 (`fn pull`) inherits the new behavior via its existing status.success() check; its failure message now points at the subprocess output's per-leg detail.
    - Regression test `pull_code_leg_failure_returns_err` reproduces the BUG-254 scenario (remote adds conflict.txt, local has it as an untracked file) and asserts Err + no auto-bump.

    Test status: 790/790 tests green in `cargo test -p aida-cli --bin aida`
    Fmt: clean (`cargo fmt --all -- --check`)
    Follow-up filed: TASK-397 (design-choice — the fix also propagates store-leg failures, which the spec only explicitly called out for code-leg).
