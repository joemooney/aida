title: aida pr train --status fails 'unsafe or unreadable train receipt' when a running train's journal exceeds 64 KiB
description: 'Seen 2026-11-15 10:20 on d210d2e, both inside and outside the sandbox, during train #4097 (land #4086, promotion 13). The journal .aida/train/<id>-1.json is 90,939 bytes. pr_train_journal.rs peek_snapshot (~line 536) reads each journal with aida_core::seat_clone_detect::read_regular_file_result, which refuses any file over MAX_READ = 64 KiB (seat_clone_detect.rs:22) with InvalidData ''unsafe or oversized regular file''. The error is then wrapped as ''unsafe or unreadable train receipt''. The train itself is unaffected; only --status (STORY-2823) breaks, exactly while a train is running, when operators need it. Acceptance: (1) --status reads a journal of realistic size: use a journal-specific cap sized for the largest legitimate journal (measure, e.g. 16 MiB like the evidence cap), keeping the O_NOFOLLOW/regular-file/FIFO safety checks; (2) a regression test with a >64 KiB journal; (3) an oversized or unsafe file still refuses, with a message naming the file and the cap; (4) the 64 KiB cap for other seat_clone_detect callers is unchanged.'
