title: Headless lane wrapper holds an implementer slot after the agent's final result (claude -p lingers with its aida mcp-serve child)
description: '2026-10-29 17:58: the STORY-080 round-2 lane logged ''✓ result 765914ms'' and its PR was approved, yet 31 minutes later `aida queue work` (pid 1276045, in do_wait) still waited on `claude -p` (1279725), whose child `aida mcp-serve` (1279800) kept it alive. The lane still counted toward standalone_implementer_cap=3, so the STORY-096 launch was refused. Killing the three processes freed the slot. Acceptance: after the vendor emits its final result event, the wrapper gives the process a bounded grace period (e.g. 30 s), then terminates the vendor process group including MCP children, records exited_at in .aida/lanes/*.json, and releases the cap slot. The cap count ignores lanes whose final result was logged.'
