- id: 019e7baf-9d6a-7c61-a997-d79ed3259f9b
  author: joe
  content: |-
    Verified real (2026-05-30): on-disk format is the derived serde externally-tagged form — 'rel_type: Parent' (unit variant NAME, not Display lowercase) and 'rel_type: !Custom sprint_assignment' (YAML-tagged newtype). RelationshipType uses plain #[derive(Deserialize)], so an unknown unit variant (e.g. a future 'BlockedBy' on a binary that predates it) hits serde's hard 'unknown variant' error — from_str's Custom fallback is NOT on the serde path. No deny_unknown_fields anywhere in aida-core, so unknown FIELDS are already silently ignored (that half of the bug is a no-op + a guard test).

    Fix constraint for whoever implements: a custom Deserialize for RelationshipType must PRESERVE the existing on-disk format (read 'Parent' and '!Custom x' unchanged) while routing unknown bare-string variants to Custom(name) — switching to a plain Display-string format would change the bytes ('Parent'→'parent', drop the !Custom tag) and break every existing file. The 'round-trip preservation of unknown FIELDS' acceptance is the risky part (derived serde drops unknown fields on rewrite → an older binary editing a spec would ERASE a newer machine's fields); a true fix needs a per-type unknown-field bucket, which is a much larger change. Recommend scoping a first PR to the enum-variant forward-compat (the actually-failing part) and treating field round-trip-preservation as a separate, larger spec.
