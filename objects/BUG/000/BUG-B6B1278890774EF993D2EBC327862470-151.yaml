  author: joe
  content: 'Root-cause confidence (review round 2, finding 3): AC1 names SessionStart registry-write lock contention (the 250ms lock_namespace budget, fail-open) as the cause of the 9b4a9d0a advisor having no registry row. That is the MOST LIKELY cause, not a confirmed one: the test reproduces the mechanism, but no log or artifact ties it to that incident. With per-prompt heartbeats (re-registration) and launcher-recorded headless ends now in place, a recurrence of a live seat reported as having no registered advisor must be re-triaged as a NEW cause, not closed as this bug.'
