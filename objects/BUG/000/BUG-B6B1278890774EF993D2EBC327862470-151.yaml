    ## Implementer findings (not filed as draft TASKs: `aida add` cannot allocate IDs from the sandbox, and the MCP file_finding tool was denied)

    1. **bug-spotted · minor:** `agent_registry::tests::recycled_pid_session_start_does_not_inherit_the_earlier_name` and `same_process_new_session_keeps_its_launcher_entry` fail on base 0506fa2 when `AIDA_HANDLE` is set (any agent session): `touch_session_start_agent` reads `HANDLE_ENV` from the real env. They need test_env isolation.
    2. **deviation · minor (AC5, partial for headless):** the heartbeat runs per UserPromptSubmit. A `claude -p` lane has one prompt, so a lane whose hook row is not the launcher's `claude-<child_pid>` row still gets ended_at about equal to its first prompt. Follow-up: heartbeat from Stop/PostToolUse too, or have the launcher end every row with the child's session id.
    3. **design-choice · cosmetic:** `aida doctor check advisor-handshake` now always emits informational rows (registered advisors, grants, hello states), so `--fail-on-findings` on that check always exits non-zero. Full `aida doctor` is unchanged (problem rows only).

