- id: 019f5ef6-ace3-78c0-8535-d4c3849c874d
  author: joe
  content: 'UPGRADE (2026-07-13): this is NOT just wording. When the answer is a DISPOSITION (Defer/Reject/Close) but the resolution isn''t a recognized verb, answering un-parks the spec and QUEUES it — the OPPOSITE of the operator''s intent. Observed live: operator chose ''Defer'' on TASK-911 and it became burndown-ready. Two fixes: (1) ''defer'' must be a recognized resolution verb that sets the deferred flag (and reject/close must set Rejected) so the pick auto-applies; (2) the default un-park-on-answer must NOT queue a spec whose chosen resolution is defer/reject/keep-parked. Until fixed, the advisor must sweep answered questions and reconcile every defer/reject that got mis-queued. Priority bumped to HIGH.'
