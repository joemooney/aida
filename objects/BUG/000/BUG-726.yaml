title: 'aida questions answer: a freeform (non-verb) resolution reads as an error (''unrecognized resolution X — recorded only'') when it''s a valid recorded directive'
description: |-
  2026-07-13: operator answered a design-fork question (TASK-958, hard-block vs warn vs context-aware) and saw 'unrecognized resolution context-gated — recorded only', which reads like a failure. It is not — the decision was recorded correctly and the spec un-parked. The resolution field only AUTO-EXECUTES a small verb set (reject / keep-parked / status:X / tag:+X/-X / queue|approve); anything else is captured as free-text guidance. For a DESIGN question there is often no executable verb (there is no verb for 'implement it context-aware'), so recorded-only is the CORRECT outcome, not an error.

  Fix the wording so an intentional non-verb resolution reads as a neutral success ('decision recorded' / 'recorded as guidance for the implementer') rather than 'unrecognized ... recorded only', which reads as a malformed input. Reserve 'unrecognized' for genuinely malformed verbs (e.g. status:bogus). Optionally: when the advisor files a design-fork question, allow marking choices as 'directive' so no verb is expected. Related: the /aida-questions filing convention; consider documenting the resolution verb vocabulary in aida questions ask --help.
