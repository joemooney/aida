  content: 'GROUND-TRUTH CORRECTION (2026-06-05): the ''parent FIELD vs Parent EDGE'' hypothesis was wrong about mechanism. There is no parent field in play — BOTH paths store an OUTGOING edge on the epic, differing only in TYPE: add --parent → Child edge; rel add --type parent → Parent edge (inverted, duplicated, no reciprocal on child). Fixed by unioning Child+Parent outgoing in --tree (PR forthcoming). Data-model normalization split to follow-up.'
