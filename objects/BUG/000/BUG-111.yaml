  content: |-
    Implemented via PR (commit 09319bb6):

    - New scripts/workspace-deps.sh: discovers every intra-workspace path-dep pin generically from [workspace.members] (ws_discover_members / ws_list_intra_pins / ws_bump_intra_pins / ws_verify_intra_pins) — no hardcoded crate list.
    - release.sh bumps all discovered pins; diff preview, git add, and recovery hints now stage every member Cargo.toml. New verification step before commit: pin self-check (names a stale crate) + cargo check --workspace.
    - Verified against the real repo: discovery catches aida-cli -> aida-tui, the exact pin the old hardcoded script missed.

    Test status: tests/test_release_dep_discovery.sh 5/5 green
