- id: 019e38c4-112f-7f92-83db-8831cbb8c7d9
  author: joe
  content: 'Diagnosis correction 2026-05-18: my earlier revision blaming a stale AIDA_AUTO_COMPLETE leak is ALSO wrong — there is no leak (user verified `env | grep AIDA` clean; see BUG-233''s corrected diagnosis). TASK-264 was a legitimate orchestrator child of the batch:session-hygiene drain — AIDA_AUTO_COMPLETE=1 was correct in its env. The ''say the word'' limbo''s real root cause is BUG-230 (--zen auto-resolves the Exit menu but can''t synthesize EOF to close the REPL) — the implementer suppressed the menu, leaving the bare ''say the word'' wait, and the orchestrator stayed blocked on the un-exited child. BUG-232 may be a duplicate of BUG-230; recommend the implementer evaluate merging them. The valid residual in BUG-232: skill behavior should key off BUG-233''s corroborated orchestrator signal, not a bare env var or argv-shape guess.'
