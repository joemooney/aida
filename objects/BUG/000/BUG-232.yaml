- id: 019e3bbb-b840-7751-82c7-ad36662311fd
  author: joe
  content: |-
    Issue A resolved 2026-05-18 (implementer design-checkpoint → advisor call): under plain --zen (no --auto-complete, no orchestrator), the end-of-session behavior is **auto-open the PR, then ask 'grab next vs stop'**. The fork in the original acceptance ('OR (if option 2 chosen)') is CLOSED — implement this, not the show-full-menu alternative.

    Binding acceptance for Issue A (supersedes the forked wording):
    - Under plain --zen, the 'open PR for what shipped' confirmation AUTO-RESOLVES (runs /aida-pr) — it's kind:confirmation, the obvious next step; --zen honors it.
    - The 'grab next item vs stop here' choice STILL pauses for the user — with no orchestrator to auto-continue to, that's a genuine decision, not mechanical.
    - Net: the PR is always opened — BUG-232's limbo symptom is eliminated by construction.

    Rationale: this applies STORY-287's taxonomy correctly by separating the mechanical prompt (open PR → auto-resolve) from the genuine fork (grab-next-vs-stop → pause). My original filing recommended the show-full-menu alternative; that conflated the two and suppressed --zen entirely at end-of-session. The implementer separated them — better answer. Also consistent with --zen + --auto-complete, which already auto-opens PRs. Issue B (aida queue done warns on commits-ahead-no-PR) was unambiguous — no fork, proceed as filed.
  created_at: 2026-05-18T15:36:58.688077839Z
  modified_at: 2026-05-18T15:36:58.688077839Z
- id: 019e3bc9-184b-7922-9f5a-66692a24b1b8
  author: joe
  content: |-
    Implemented via PR (commit ab3a0c4b):

    - Issue A: plain `--zen` end-of-session no longer stalls. `/aida-pickup`
      Step 6 zen handling splits three ways (orchestrated / plain-zen /
      default); plain `--zen` auto-opens the PR (never auto-loops the queue),
      `/aida-pr` gains a plain-zen template that pauses on the grab-next/stop
      fork. The `aida queue work` pre-flight `autonomy:` line corroborates the
      orchestrator (zen + auto-complete vs zen-no-orchestrator).
    - Issue B: `aida queue done` is PR-aware. Queue-drain with commits ahead
      of main + no open PR sharpens the workflow hint into a pointed "no PR
      open — run /aida-pr" warning; an open PR redirects to "merge it".

    Test status: 16/16 workflow_hints + 14/14 orchestrator tests green; cargo fmt --check clean
