title: 'Fix: resolve docs/ and .claude/ relative to database path for Docker'
description: Server endpoints for docs, plans, and skills resolved paths relative to CWD, which fails in Docker where CWD (/app) differs from the project root (/repo). Extracted a shared project_root() helper that derives the project directory from the database file's parent path. Fixes docs_dir() and claude_dir() to work in both local dev and Docker environments.
