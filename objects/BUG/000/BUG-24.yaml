title: 'commit-msg validator: REQ_ID_PATTERN rejects multi-id parens like (TASK-20, TASK-27)'
description: REQ_ID_PATTERN matches a single REQ-ID at end of line. When a commit references multiple reqs in a single parens group (`(TASK-20, TASK-27)`), the validator falsely warns 'feat/fix commits should include requirement ID'. Should accept comma-separated IDs in one parens group.
