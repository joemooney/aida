title: Headless implementer asks 'want me to push + open a PR?' instead of acting — strands committed work with no PR in --no-human drains
description: 'Empirical 2026-06-05 (burndown-2, TASK-304): the headless implementer did excellent work — implemented + committed + even flagged a SPIKE-8-gated default decision — then ENDED with a plain-text question ''the commit is local-only... Want me to push task-304 and open a PR?'' In --no-human=both there is no one to answer, so the session exits cleanly with the work COMMITTED but NO PR opened. The orchestrator then reports ''exited cleanly but opened no PR'' and the punt-attempt fails (''TASK-304 is Done — only In Progress can be punted''). Work is salvageable (committed on the branch) but the drain shelves it. BUG-354/BUG-374 family (headless asks-instead-of-acts). FIX: the /aida-pickup (implementer) skill must, in headless mode (AIDA_NO_HUMAN), auto-proceed through push + aida pr instead of asking — a confirmation prompt nobody can answer should resolve to the act, not the stall. Salvaged via PR-549.'
