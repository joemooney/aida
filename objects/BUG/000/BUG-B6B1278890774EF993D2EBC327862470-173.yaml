- id: 01a1998e-47d9-7301-92c1-72dbab200cad
  author: joe
  content: 'Round 4 fix pushed as d27abc68113 on PR #3208 (base 3d06aedb2d4e). F1/F2: one batched GraphQL read (headRefOid + commits(last:100){totalCount oid message}) decides unmatched candidates. A PR is decided only when its total fits the page, SHAs are valid/distinct and the last oid is the head from the same response; anything else falls back to the exact REST probe for that PR alone, so the typed-unknown policy is unchanged. Deadline went from 10s to 20s. F3: a continuation extends the ID only with >=3 digits that are not a YYYY-MM-DD date, so -N and dated session branches match again. F4: the single lookup short-circuits on the first exact match. F5: new tests for the latency fixture with 14 unrelated PRs, batch-evidence shapes and session-branch positives. Local: cargo check --tests PASS, make check-ci-fast PASS (36 gates), diff --check clean. Filtered cargo test NOT completed: 3 attempts killed at the 10-minute tool ceiling compiling the aida-cli-lib test binary (cold target, load ~7 on 6 cores). That is a compile limit, not a test failure. The GraphQL shape is not measured live (network denied in the sandbox). Exact-head CI is the test gate. The /tmp result file could not be written (outside the sandbox).'
