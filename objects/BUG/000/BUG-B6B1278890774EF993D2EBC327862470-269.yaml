- id: 01a1bfd0-9d1f-7a90-96cd-5d51a65f9e5b
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #3715):
    Verdict: CHANGES REQUESTED
    Reviewed commit: cab8e94f709d
    Recorded: 2026-11-09T10:00:23.899113446+00:00
    Review comment: https://github.com/joemooney/aida/pull/3715#issuecomment-6737244010
    Findings:
    1. MINOR (blocking, new refusal has no working recovery on linked worktrees): aida-cli-lib/src/seat_clone.rs:3054-3058 and :3070-3074 always tell the operator to use aida ship --from-seat --commit-pending and not to run host Git in the seat. prepare_rework_merge also serves ordinary linked worktrees (clone = None, seat_clone.rs:2838-2849), and every non-contained launch gets TreeKind::Worktree (tree_kind_for_launch, :109-112). ship --from-seat goes through recorded_seat (ship_from_seat.rs:58-69), which refuses anything but a recorded clone with 'not a seat clone this checkout recorded'. Scenario: a non-contained dirty --resume on a worktree seat that is behind the PR head or conflicts with main is refused, the operator follows the message, ship refuses, and the message has forbidden the only remaining route. Before this PR that resume was admitted. Fix: branch on host_recorded_clone: keep the sandboxed recovery for clones and give concrete linked-worktree recovery otherwise; mirror it in docs/cli/06-roles-sessions.md:822-832; add a test that drives prepare_rework_merge on a linked worktree and pins the wording (bug_2504_dirty_resume_checks_fetched_heads_without_touching_edits calls only prepare_rework_merge_with, so neither tree kind's guidance selection is covered).
    2. COSMETIC: session_start.rs:1647-1650 decides whether the on-disk orphan is 'identical' by comparing raw bytes with a re-serialization of the parsed lease. A record written by an older binary (different fields) that survived a failed removal parses the same but compares unequal, so Drop keeps the successor and skips claim, branch and receipt release. The orphan_still_present test writes with the same serializer, so it cannot catch this. Compare parsed SessionLease values, or the lease id and tree.
    3. COSMETIC: seat_clone.rs:3070-3074 ends with 'to resolve conflicts' for every merge-tree failure, including sandbox errors and timeouts where no conflict exists, and a fresh Claude lane is not the remedy. Separately, docs/cli/06-roles-sessions.md:833 'A native child cannot write Git metadata.' is left with no connection to the surrounding text.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-09T10:18:02.399924471Z
  modified_at: 2026-11-09T10:18:02.399924471Z
