    Implementation slice: found dirty-resume admission in prepare_rework_merge_with returned an empty conflict list before fetching or checking either remote head. It now fetches and validates the PR head, then admits pending-edit resumes only when fetched main is already an ancestor of seated HEAD. Otherwise it refuses before vendor launch with host recovery guidance, preserving edits. Fresh clean conflict routing to Claude is unchanged. Added real-Git regression coverage and updated CLI docs. Publication declared with Refs BUG-2504: original PR #3641/#3643 incidents and the reported check-ci-fast/sccache issue have not been reproduced or established as this cause. Targeted lane test job j20261109T050219155-2-0 is running; validation result will follow. No commit/push/queue completion from this native seat. Codegraph fixed executable is absent; doctor confirms missing tool.
