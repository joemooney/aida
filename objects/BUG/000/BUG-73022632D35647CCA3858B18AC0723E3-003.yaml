  content: |-
    Product 21:27: Claude fresh-start lane queued on dell1 (top priority), brief:
    # Brief: BUG-2700 (fresh start; advisor-121 21:26: APPROVED, drain, HIGH, Claude, STRICT; TOP priority, blocks every promotion)

    Root cause found by integration: the mandate's ship-cover resolver parses the head branch `promote/integration-23` as spec id INTEGRATION-23, which is unresolved, so cover becomes SpecsUnresolved and refuses. Every promotion PR hits this (seen: #4324 refused 3 times on 2026-11-19).
    Fix, per the spec description:
    (1) Extract branch-derived spec IDs only from AIDA spec-type conventions (the registered spec type prefixes), so `integration-23` never yields a spec ID.
    (2) An unresolved branch-derived ID must not count as a named spec. The title or commit trailer IDs remain authoritative.
    Regression through the PRODUCTION path (the mandate ship-cover entry point used by `aida pr ship`): a promotion PR with head `promote/integration-N` and title "(Refs STORY-A STORY-B)" resolves to those specs and is covered. Add a control proving a genuinely unresolved trailer ID still refuses.
    Fail closed everywhere else. Trailer (BUG-2700) if complete, otherwise (Refs BUG-2700).
    Before pushing, run `make check-ci-fast` and `python3 scripts/check-store-writers.py`.
