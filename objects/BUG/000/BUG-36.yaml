title: aida init banner leaks raw-git instructions instead of native aida commands
description: 'Closing banner says ''Sync store to remote: git push origin aida-store'' and ''New developer setup: git worktree add .aida-store aida-store''. Both leak orphan-branch implementation. Should use ''aida push'' (FR-264) and ''git clone <repo> + aida init'' (post-clone path already exists). Surfaced 2026-05-09 walkthrough.'
