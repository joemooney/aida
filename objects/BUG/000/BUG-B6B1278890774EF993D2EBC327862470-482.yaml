  content: 'Data point (advisor-122 19:22, recorded by product-15): after the operator''s shell 411725 left, recover-launch for #4380''s attempt 346d4525 refused again, now on pid 511679 (another 5-day-old Terminator bash). About 30 live processes have cwd = /home/joe/ai/aida: every seat, deputy runner, product watcher, operator shell. The attempt''s recorded worktree IS the primary and its launcher pid is dead, so recover-launch can NEVER succeed for an attempt recorded against the primary. #4380''s final review waits on this fix. Priority: first lane when drain mode allows one.'
