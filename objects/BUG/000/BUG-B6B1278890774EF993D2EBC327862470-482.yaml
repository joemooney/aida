    Findings:
    1. [p1, security-authority-bypass] aida-cli-lib/src/agent_codex_background.rs:2234 — Known-receipt recovery can release a scope while a worker descendant is still in the recorded worker group or supervisor session. A helper launched with a clean environment carries neither UUID nor grant. If the supervisor dies while the helper is running and the worker exits, the old group/session checks would have retained the reservation. The new probe checks neither, treats the helper as unrelated, then revokes the grant and admits another driver. Preserve corroborating group/session evidence or equivalent durable descendant tracking while keeping cwd alone out of recovery. Cover a surviving helper with a clean environment.
    2. [p1, security-authority-bypass] aida-cli-lib/src/codex_bg_receipt.rs:854 — For a pre-token launch with a partially readable receipt, loss of grant_id silently disables the only legacy descendant check. Even when that receipt still identifies the dead worker and its group, a living ordinary child in that group only carries the old grant, so --retire-unknown can archive the receipt and free the scope. Retain usable legacy group/session evidence or return Unknown when required legacy attribution is missing. Exercise a partial pre-token receipt with a surviving grant-only child.
    3. [p1, security-authority-bypass] aida-cli-lib/src/agent_codex_background.rs:2146 — Normal supervisor exit never enables the new environment-token check. A surviving child that starts a new session and changes directory outside the worktree can retain the production worker UUID in its environment and still be invisible to exit_occupancy. The supervisor can mark the attempt Exited, after which recover-launch returns before checking the token. Include the attempt-bound environment evidence in the exit decision and cover that lifecycle path with an environment-only holder.
