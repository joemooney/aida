    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 19:25):
    # BUG-2721: small fix (advisor-122 ruling 2026-11-22 19:22/19:30 MST; relayed by product-15). Lane: CODEX. Drain-mode priority: it unblocks #4380's final review. New branch, new PR.

    Read `aida show BUG-2721` (ACs plus the 30-process data point). `aida agent recover-launch` treats ANY process whose cwd is the attempt's recorded worktree as proof the attempt is alive. When that worktree is the primary checkout (~30 seats, deputies and shells live there), recovery can never succeed, even though the launcher pid is dead.
    Fix: judge liveness only from evidence bound to the attempt (its recorded launcher/worker pid plus start identity, or a process carrying the attempt token in its cmdline/env). Never use cwd alone, and never cwd when the path is the primary checkout. The refusal names the PID, command and reason. Regression test: a dead launcher's attempt recorded against the primary, with an unrelated live process in the primary, is recoverable.
    ADR-76 strict tier (lease/claim safety), so expect a STRICT review. Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
    Add `// trace:BUG-2721 | ai:codex`. Commit `[AI:codex] fix(agent): ... (BUG-2721)`. One targeted cargo run, then `make check-ci-fast`, then ship a new PR. COMMIT your work.
