- id: 01a20738-0fe8-76d3-97a4-0b7834c35f45
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2721):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 707d29be1157
    Recorded: 2026-11-23T06:57:14.002095124+00:00
    Findings:
    1. aida-cli-lib/src/codex_bg_receipt.rs:218 — The invocation ancestry exemption suppresses every liveness check. If recovery is invoked from a surviving descendant after the recorded worker and supervisor are gone, the scan skips that ancestor before reading its environment, group, session, or cwd. Both ordinary recovery and unknown-receipt retirement can therefore release the reservation while that process still holds the exact attempt token or another independent identity signal. Limit the ancestry exemption to token appearances in recovery-invocation argv and keep checking independent holder signals. Add a regression where an invocation ancestor carries the worker token and the reservation stays held.
    2. aida-cli-lib/src/codex_bg_receipt.rs:841 — Unknown-receipt retirement treats missing worker, supervisor, and worktree fields as absent checks. With a surviving pre-token helper whose environment is clean but whose process group is still the worker's, a partial receipt that kept only grant_id cannot detect the holder. The nonempty grant satisfies the final guard, so retirement archives the receipt or the scopeless admission check passes. Require usable group and session evidence, or affirmative evidence that the launch never executed, before treating this partial receipt as clear. The grant-only success fixture in story_2254_codex_bg_receipt_tests.rs:161 currently codifies the unsafe default.
    3. The round-three brief asks for the accepted attribution limit in the PR body. The implementer self-review records it, but the PR body only contains the publication notice and FAST marker. Add the accepted limitation for a descendant that changes session, clears its environment, and runs outside the worktree.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
