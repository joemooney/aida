- id: 01a20670-c50e-7c30-97c4-4cdd76007247
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2721):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 81a84bab0748
    Recorded: 2026-11-23T03:19:22.983205194+00:00
    Findings:
    1. aida-cli-lib/src/agent_codex_background.rs:2231 — Recovery no longer detects ordinary surviving worker descendants. build_worker_exec clears the environment and receives the grant ID, but never receives the attempt UUID. Once the recorded worker and supervisor exit, a child inheriting the real worker environment can therefore be invisible to recovery even when supervisor exit retained the scope for that child. Recovery then revokes the grant and releases the scope for a second driver. Supply durable, attempt-bound evidence to production workers and account for already-issued receipts. Exercise recovery with a surviving child of the production worker environment. The modified group regression kills the child before calling recovery, and the new holder test injects its own TEST_ATTEMPT.
    2. aida-cli-lib/src/codex_bg_receipt.rs:818 — BUG-2721.AC1 and AC2 remain unfulfilled on recover-launch --retire-unknown. A partially readable receipt retaining worktree=primary still uses cwd alone in unknown_attempt_is_dead. Conversely, an environment-only holder outside the recorded tree and group is missed because recovery_token is None. The boolean result drops the PID, command and reason before retire_unknown reports the refusal. Evaluate attempt-bound evidence on this entry point, preserve Unknown when proof is insufficient, and propagate the specific holder diagnostic. Cover both cases with partially readable receipts.
    3. aida-cli-lib/src/agent_codex_background.rs:2237 — BUG-2721.AC1: only the current PID is excluded. When recovery is run under an ordinary waiting wrapper such as timeout, the wrapper also has the attempt UUID as a standalone argument and is reported as the holder on every invocation, even for a dead Prepared attempt. Distinguish recovery invocation ancestry from independent holder evidence and add a wrapped-command regression.
    4. aida-cli-lib/src/tests/story_2254_codex_bg_supervisor_tests.rs:793 — The regression retains the old STORY criterion trace and adds only a bug-level trace inside the body. The supplied untraced list and aida criteria BUG-2721 still show no linked tests for AC1, AC2 or AC3. Add criterion-specific test traces to the corresponding assertions or tests so future reviewers can find this coverage.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
