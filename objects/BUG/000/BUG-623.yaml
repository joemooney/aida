title: aida why / session leases report a long-idle in-flight lease as 'being worked now' — a hung/abandoned session reads as active
description: 'A lease whose holder process is ALIVE but IDLE (no spec movement for hours) is reported by aida why as "in-flight — a live session lease is working this now" and shown as active in aida session leases. Observed: TASK-894 held by pid 1062421 in /home/joe/ai/aida-task-894 for ~26h with ZERO spec movement, no TASK-894 commits, nothing uncommitted — a hung/abandoned session. The operator twice could not tell stuck-from-working. A liveness check (process exists) is necessary but not sufficient. Add stalled-in-flight detection: when an in-flight lease is older than a threshold (e.g. lease age / last-spec-modified > Nh) with no progress, surface "in-flight but STALLED — lease Nh old, no progress; aida session end <id> to release" instead of "being worked now". This is the core legibility ask (why isnt it moving / is it really being worked). trace:BUG-623 candidate.'
