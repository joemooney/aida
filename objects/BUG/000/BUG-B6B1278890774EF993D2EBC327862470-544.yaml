  content: |-
    ## Implementer self-review
    Reviewed HEAD: 5d1434c3e3 (PR #4751, git diff origin/main...HEAD, 6 files).

    Round-2 findings from #4731: both were already fixed on main by #4744 (the docs refusal sentence; --anchor-findings counts as an unverified producer). This PR updates that docs paragraph for the confinement.

    Acceptance evidence (Refs slice 2):
    - AC1 [behavioral-test]: codex and agy spawn through bwrap (launch/review_runner.rs RunnerCall::confined). The view is: tmpfs HOME; empty /review cwd; --unshare-all --share-net; ro-bind-try of /usr, /bin, /lib*, /etc/{ssl,ca-certificates,resolv.conf,hosts,nsswitch.conf} only; the vendor auth files (ConfinedAuth table) read-only; the vendor binary. s3a_runner_spawn_contract pins the exact wrapper argv (no /etc, no /, no --bind; claude unwrapped). bug2783_confined_runner_fails_closed_without_bwrap covers a missing bwrap and an empty, / or relative HOME (the runner never runs).
    - AC2 report half [behavioral-test]: bug2783_unconfined_runner_review_is_never_posted runs a fake codex through the real bwrap. It asserts the canary is absent from the report and the SARIF, the report is 0600, and posting is refused. It skips with a printed reason where bwrap cannot run, which most likely applies in this lane (nested user namespaces are denied).
    - AC3: posting gates on may_post = no_read && post_allowed (claude only).
    Tests: 56 targeted tests pass; make check-ci-fast exit 0.

    Probes: (2) a relative CODEX_HOME source resolves inside the empty cwd, so it is skipped, not opened up. (5) every refusal returns before spawn; a bwrap that cannot create namespaces fails the run with its stderr; no test was weakened (claude/custom-runner assertions unchanged; the agy and codex tests got HOME and a bwrap stand-in).
    Residual risks: the vendor's own token stays readable by its runner (accepted 12:06; posting refused, reports 0600). --share-net exposes abstract AF_UNIX sockets. Only the vendor binary is bound, so a script-launcher install fails closed. The up-front --post-comment refusal (comment 15) is deferred. The agy auth probe stays unconfined because it sends no prompt.
