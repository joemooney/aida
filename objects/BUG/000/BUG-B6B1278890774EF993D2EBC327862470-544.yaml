  content: |-
    ## Implementer approach

    Slice: AC3 + AC2 (the brief's fallback), shipped as Refs BUG-2783. AC1 (bwrap/empty-HOME confinement for codex) needs a live vendor probe of what codex must read (auth, CODEX_HOME, config) and is left for a follow-up slice.

    ### Acceptance criteria and evidence
    - **AC3 (unit + command-level):** new `no_read` flag on each `ReviewVendor` (claude=true via `--tools ""`, codex=false; a custom `AIDA_REVIEW_RUNNER_CMD` is never verified). `review prepare` collects every unconfined finder/challenger label and `post_review_comment` refuses before any forge call, after the local report and SARIF are written. Test: `bug2783_post_comment_refuses_unconfined_runner_and_canary_never_posts`.
    - **AC2 (fixture):** same test plants a canary at a fake `$HOME/.ssh/id_test`, a prompt instructing the reviewer to read and quote it, and a fake codex that reads it through the real hardened spawn path. Asserts the canary never reaches the recording forge or the refusal message. The "never in the local report" half needs AC1 and is deferred.

    ### Expected files
    - `aida-cli-lib/src/vendors/review_runner.rs`
    - `aida-cli-lib/src/launch/review_runner.rs`
    - `aida-cli-lib/src/review_prepare.rs`

    ### Ambiguities / conflicts as questions
    - Is claude's `--tools ""` acceptable as "verified" no-read? I treat it as verified (no Read tool exists in the session); a live probe would harden that.
    - agy has no review runner today, so nothing to flag for it.
