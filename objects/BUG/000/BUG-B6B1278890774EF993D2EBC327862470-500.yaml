  author: joe
  content: 'CORRECTION 19:40 MST: Joe''s timed run of the targeted heal (--id shared-207c3564-…) on imac FINISHED in 1m22s (real; user 30s, sys 14s), returning ''no eligible stale lease finding''. It does still run the full ref/PR scan, but on this pass it finished in ~80s, not ~80 min. The global run''s long tail was the per-branch merged-PR loop plus the 41 applies. AC0 still holds: --id should skip the global scan, and an 80s refusal is too slow. Lower severity than first stated.'
