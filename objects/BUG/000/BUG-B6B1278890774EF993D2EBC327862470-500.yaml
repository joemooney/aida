  author: joe
  content: 'Repro (product-15): after the global imac heal finished, the expired shared claim for TASK-3851 (task-...-1278-3acc2856dc7c47e2.toml, shared-207c3564-6f8b-424c-beba-2fef6d8adaa4, lease 01a20b0d78d6) is still present; doctor check leases lists it as eligible, yet both the targeted heal (dell1, rc=124 at 120s, no output) and the global heal left it. TASK-3851 stays parked.'
  created_at: 2026-11-24T02:27:33.801612334Z
  modified_at: 2026-11-24T02:27:33.801612334Z
- id: 01a20b61-60c8-7ce2-9fc5-db2035f38de5
  author: joe
  content: 'Note (product-15 19:32, per advisor): the dell1 TARGETED heal timeout (rc=124 at 120s) is most likely BUG-2740 (a lane parent held store-write.lock during a cold-start wait), not this bug''s serial per-branch gh calls (imac global heal).'
  created_at: 2026-11-24T02:27:40.871962872Z
  modified_at: 2026-11-24T02:27:40.871962872Z
- id: 01a20b67-da96-79f1-95f2-c284fae0e46d
  author: joe
  content: 'CONFIRMED 19:35 MST (live process on imac): --id does NOT narrow the scan. `aida doctor heal stale-leases --id shared-207c3564-…` runs for-each-ref over all refs/heads, then a serial `gh pr view N --json state` for each open PR, then the same per-branch `gh pr list --head <branch> --state merged` loop as the global run. So the targeted heal also takes ~80 min before acting. AC0 (highest value): with --id, resolve only that lease or claim and query only its own branch/PR. It''s also why TASK-3851''s stale shared claim can''t practically be healed.'
