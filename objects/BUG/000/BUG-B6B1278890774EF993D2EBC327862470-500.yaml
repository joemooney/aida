title: doctor heal stale-leases and session hygiene hang silently (rc=124, no output)
description: '2026-11-23 ~18:15-18:30 MST: on dell1, `aida doctor heal stale-leases --id shared-207c3564-6f8b-424c-beba-2fef6d8adaa4 --yes` hung to a 120s timeout with zero output; the eligible expired shared claim (task-...-1278-3acc2856dc7c47e2.toml, lease 01a20b0d78d6, dead creator) stayed, so TASK-3851 relaunch was refused twice. Same window on imac: the hourly session-hygiene cron failed exit 1 with empty output, and `aida session hygiene --dry-run` ran >240s with no output. throughput-guard also timed out at 300s twice today. Suspects: a store mutation lock wait or an unbounded forge call under GitHub rate pressure. AC1: each command emits progress/diagnostic naming what it waits on within 10s and fails with a named cause before its deadline instead of hanging silently. AC2: repro test with a held store lock.'
