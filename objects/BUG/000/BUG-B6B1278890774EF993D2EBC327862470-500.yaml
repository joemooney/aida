  content: 'CORRECTION (product-15 19:33): the TASK-3851 ''repro'' above is NOT this bug. After the BUG-2740 store-lock deadlock was cleared on dell1 (19:20), the same targeted heal (aida doctor heal stale-leases --id shared-207c3564-6f8b-424c-beba-2fef6d8adaa4 --yes) completed instantly with status healed. Its earlier rc=124 hang was the dell1 store write lock held by a lane parent waiting for a cold-start slot (BUG-2740).'
