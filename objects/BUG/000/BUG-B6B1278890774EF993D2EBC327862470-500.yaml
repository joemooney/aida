  author: joe
  content: 'Draft to Approved + drive: advisor-122 disposition 2026-11-23 18:38 (small, standard tier); set by product-15 before grant expiry. Evidence: heal stale-leases on dell1 rc=124 at 120s with zero output (shared-207c3564..., TASK-3851 claim).'
  created_at: 2026-11-24T01:38:01.644005624Z
  modified_at: 2026-11-24T01:38:01.644005624Z
- id: 01a20b3a-3824-7703-a92a-5dc1f2611d9c
  author: joe
  content: 'ROOT CAUSE (observed 18:45 MST, live process on imac): not a lock hang. `aida doctor heal stale-leases` scans every local branch (2005 in refs/heads) and runs one serial `gh pr list --head <branch> --state merged --limit 1` per branch, about 2.5s each, before printing anything. That''s ~80 min and ~2000 GraphQL points per run, and it happens even with --id (product''s --id run hit the same 120s timeout). Fix: with --id, query only that lease''s branch; otherwise batch (one `gh pr list --state merged --limit N` or GraphQL search), skip branches with no lease or claim, print progress, and bound by a deadline.'
  created_at: 2026-11-24T01:44:40.665384314Z
  modified_at: 2026-11-24T01:44:40.665384314Z
  session_id: 01a20440-982d-7872-93de-fff272d8657c
  harness_version: 2.1.329 (Claude Code)
- id: 01a20b61-4529-79c0-822d-ff6583e24c6f
  author: joe
  content: 'Repro (product-15): after the global imac heal finished, the expired shared claim for TASK-3851 (task-...-1278-3acc2856dc7c47e2.toml, shared-207c3564-6f8b-424c-beba-2fef6d8adaa4, lease 01a20b0d78d6) is still present; doctor check leases lists it as eligible, yet both the targeted heal (dell1, rc=124 at 120s, no output) and the global heal left it. TASK-3851 stays parked.'
  created_at: 2026-11-24T02:27:33.801612334Z
  modified_at: 2026-11-24T02:27:33.801612334Z
- id: 01a20b61-60c8-7ce2-9fc5-db2035f38de5
  author: joe
  content: 'Note (product-15 19:32, per advisor): the dell1 TARGETED heal timeout (rc=124 at 120s) is most likely BUG-2740 (a lane parent held store-write.lock during a cold-start wait), not this bug''s serial per-branch gh calls (imac global heal).'
  created_at: 2026-11-24T02:27:40.871962872Z
  modified_at: 2026-11-24T02:27:40.871962872Z
- id: 01a20b67-da96-79f1-95f2-c284fae0e46d
  author: joe
  content: 'CONFIRMED 19:35 MST (live process on imac): --id does NOT narrow the scan. `aida doctor heal stale-leases --id shared-207c3564-…` runs for-each-ref over all refs/heads, then a serial `gh pr view N --json state` for each open PR, then the same per-branch `gh pr list --head <branch> --state merged` loop as the global run. So the targeted heal also takes ~80 min before acting. AC0 (highest value): with --id, resolve only that lease or claim and query only its own branch/PR. It''s also why TASK-3851''s stale shared claim can''t practically be healed.'
  created_at: 2026-11-24T02:34:32.638555397Z
  modified_at: 2026-11-24T02:34:32.638555397Z
  session_id: 01a20440-982d-7872-93de-fff272d8657c
  harness_version: 2.1.329 (Claude Code)
- id: 01a20b68-df8c-7c00-9015-01d690516862
  author: joe
  content: 'CORRECTION 19:40 MST: Joe''s timed run of the targeted heal (--id shared-207c3564-…) on imac FINISHED in 1m22s (real; user 30s, sys 14s), returning ''no eligible stale lease finding''. It does still run the full ref/PR scan, but on this pass it finished in ~80s, not ~80 min. The global run''s long tail was the per-branch merged-PR loop plus the 41 applies. AC0 still holds: --id should skip the global scan, and an 80s refusal is too slow. Lower severity than first stated.'
  created_at: 2026-11-24T02:35:39.615231564Z
  modified_at: 2026-11-24T02:35:39.615231564Z
