- id: 01a20b3a-3824-7703-a92a-5dc1f2611d9c
  author: joe
  content: 'ROOT CAUSE (observed 18:45 MST, live process on imac): not a lock hang. `aida doctor heal stale-leases` scans every local branch (2005 in refs/heads) and runs one serial `gh pr list --head <branch> --state merged --limit 1` per branch, about 2.5s each, before printing anything. That''s ~80 min and ~2000 GraphQL points per run, and it happens even with --id (product''s --id run hit the same 120s timeout). Fix: with --id, query only that lease''s branch; otherwise batch (one `gh pr list --state merged --limit N` or GraphQL search), skip branches with no lease or claim, print progress, and bound by a deadline.'
  created_at: 2026-11-24T01:44:40.665384314Z
  modified_at: 2026-11-24T01:44:40.665384314Z
