title: Ownership reader treats malformed or invalid holder evidence as death and can reclaim a live holder
description: |
  The ownership reader (aida-cli-lib/src/ownership/reader.rs) treats malformed or invalid holder evidence as positive death evidence, so the work it guards can be reclaimed from a holder that may be alive. It should consult the original holder evidence first and classify unreadable or invalid records as Unknown, which is never reclaimable. Source: the operator's work-side AIDA CI branch fixed this on 2026-11 (report reviewed by product-15, 2026-11-22). That branch is not reachable from this clone, so reproduce on main first; if main already behaves correctly, close with evidence.

  ## Acceptance
  - AC1: A malformed or invalid holder record is classified Unknown, never Dead, and is never reclaimed. A unit test covers truncated TOML, a wrong-type pid and a missing start identity.
  - AC2: A valid record whose holder is provably dead is still classified Dead (positive control).
  - AC3: The refusal for an Unknown holder names the record path and the read-only command that inspects it.
