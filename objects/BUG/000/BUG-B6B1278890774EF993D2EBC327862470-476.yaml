- id: 01a205be-32fb-7261-9f84-218d09a8506c
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2715):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 5171459f65b6
    Recorded: 2026-11-22T23:16:17.648291178+00:00
    Findings:
    1. The explicit-refusal branch at reader.rs:122 skips the lease start binding. With a genuine refusal, a missing active_pid_start_time and an absent PID, observe_legacy_registry returns Absent before inspecting the stamp, and force_claim_clone_owner returns Dead. Require a valid recorded start stamp before this fallback and test the missing stamp with a refusal as well as with an admission.
    2. At reader.rs:147 a Dead verdict from the persisted ownership record returns before the reader establishes that its witness identifies the worker currently recorded in the lease. The caller checks the session ID only. Across a same-session worker handoff, valid lease evidence for a running successor can therefore be overridden by a dead predecessor. Bind the selected witness to the original lease generation and process before accepting Dead, and cover divergent lease and ownership snapshots.
    3. At reader.rs:125 the refusal envelope check reserializes the deserialized record. A missing node_id becomes the empty string via serde(default), so removing the node_id field from a version-1 refusal still passes validation and can authorize Dead. Validate required envelope fields against the original input and cover an incomplete refusal.
    4. The truncated TOML case at reader.rs:815 places TOML-looking text inside the lease's JSON holder_record field. It exercises a JSON parse error only. Actual truncated session TOML is discarded by list_leases before check_exited_branch_clone checks its matching leases. A lone corrupt lease yields a generic no-matching-lease refusal without its file path or inspection command, and a second readable match can mask the corrupt entry. Use fallible discovery at this reclaim boundary, report the corrupt path and a read-only command that can inspect it, and test a truncated on-disk TOML lease.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-23T00:11:20.699411518Z
  modified_at: 2026-11-23T00:11:20.699411518Z
