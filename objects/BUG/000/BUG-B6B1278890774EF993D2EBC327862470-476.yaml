    # BUG-2715 / PR #4397 r2 (advisor-122 ruling 2026-11-22 17:16 MST; relayed by product-15). Lane: CODEX. ADR-76 strict tier (lease ownership).

    CR at 5171459f. All four findings block. Fix all four. The reviewer scope is the four plus the r2 diff.
    1. ownership/reader.rs:122: the explicit-refusal branch must require a VALID recorded start stamp before the Absent→Dead fallback. Test a missing stamp with a refusal AND with an admission.
    2. reader.rs:147: a Dead verdict from the persisted ownership record must be bound to the lease's CURRENT generation/worker (pid + start stamp), not just the session ID, so a dead predecessor can't override a running same-session successor. Add a handoff test.
    3. reader.rs:125: validate the required envelope fields (node_id etc.) against the ORIGINAL input, not the serde(default) round-trip. Add an incomplete-refusal test.
    4. reader.rs:815: test REAL truncated session TOML through list_leases / check_exited_branch_clone. A corrupt lease must refuse with its file path and an inspection command, and must NOT be masked by a second readable match.
    CONSTRAINT (already on the spec): any size-bounded or unreadable claim/holder record FAILS CLOSED. It's a refusal error, never absence and never Dead. Keep or add a test that an oversized valid record is never classified Dead or absent. (PR #4381 was closed for exactly that defect.)
