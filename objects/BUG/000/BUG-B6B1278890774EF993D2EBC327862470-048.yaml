title: 'Merge-time completion trusts PR-title trailers blindly: a bare legacy ID completed an unrelated spec (PR-3159 completed legacy TASK-139 instead of TASK-HOME-138)'
description: |-
  2026-10-31: PR-3159 implemented TASK-HOME-138 (with 139/140 superseded into it), but its title trailer was '(TASK-138 TASK-139 TASK-140)'. Bare TASK-139 resolves to the legacy spec TASK-1-114 (a Draft, 'aida-doctor ~ aida-recover consolidation candidate'). serial-ship's per-trailer approval re-record moved it Draft -> Done (02:10, advisor grant) and the merge completed it (02:26). Meanwhile TASK-HOME-138 stayed in-progress. The advisor reverted it with --force and completed TASK-HOME-138 by hand.

  Acceptance:
  1. Before recording an approval or completing on merge, every trailer ID must resolve to a spec that this PR's branch or lease actually covers (the claimed spec, the specs bundled into it by a recorded ruling or supersede, or the PR's queued review-story coverage). A trailer that resolves outside that set is refused with a clear message naming both IDs; nothing is recorded or completed for it.
  2. A trailer that names a Draft/Approved spec never jumps it to Done/Completed unless that spec is in the covered set.
  3. Regression test: a PR claimed for TASK-<node>-138 whose title says (TASK-139), where legacy TASK-139 exists, refuses the record and completes nothing wrong.
  4. Implementers' PR-title guidance (pr create / aida commit) uses the full canonical or display ID the lane claimed, never a bare short form that can resolve elsewhere.
  Relates to BUG-HOME-046 (numeric ID identity), but is independent: this is coverage checking, not ID parsing.
