title: 'queue-add advisor-authority gate is too broad: ''aida queue add --for advisor'' shouldn''t need advisor authority'
description: 'Operator insight (2026-06-26, walkthrough): the TASK-647 gate (''queuing work for execution needs advisor authority'') applies to ALL aida queue add, but it should NOT apply to --for advisor. Routing a draft TO the advisor is a REQUEST FOR REVIEW (request-approval / triage), which any role should be able to do — it does not dispatch work for execution and does not bypass approval (the advisor still decides). The gate conflates two opposite things: (1) REQUEST routing (--for advisor, --for human) = open to any role; (2) DISPATCH-for-execution routing (--for implementer / execution roles) = legitimately advisor-gated (you''re committing the team to do work). FIX: scope the advisor-authority requirement to execution-dispatch targets only; exempt --for advisor (and --for human). This is the ROOT fix for the TUI request-approval failure (BUG-630) — with the gate fixed, request-approval works from any role with no role-env hack. (The TUI queue verb, which dispatches --for implementer, legitimately still needs advisor authority.)'
