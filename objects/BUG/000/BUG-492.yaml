  content: 'Provenance correction (from the session that ran the sweep): the 06:40 archive loop was NOT a rogue agent — it was the operator''s deliberate Session-63 backlog reset (''clear the backlog and queue… archive the rest''). The telemetry (role:advisor loop of individual ''aida archive <ID>'' calls) is correct; the ''accidental over-sweep'' intent label is not. The real, keep-worthy defects this exposed, independent of intent: (1) ''aida archive'' doesn''t reconcile queue membership — it archives a QUEUED spec and leaves it queued, producing the contradictory archived+queued state; (2) ''aida list'' hides archived rows but ''aida queue list'' ignores the flag, so the two surfaces disagree; (3) ''aida show'' doesn''t surface the archived flag at all (shows ''Approved'' with no hint). Immediate contradiction resolved: TASK-715 + STORY-543 unarchived (operator-confirmed) — they were the 2 live archived+queued items. The broader 126 stay archived (the clean slate the operator wanted).'
