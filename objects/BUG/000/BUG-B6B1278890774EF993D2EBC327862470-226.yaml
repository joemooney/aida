title: Shared-boundary conformance harness hangs in fixture aida init when stdin is a terminal
description: 'Observed 2026-11-06 00:09 and 00:23 MST: python3 scripts/containment/conformance.py --vendor codex --boundary aida, run from the operator''s script deputy (a TTY), reported fixture-init-unavailable twice. The fixture ''aida init --footprint minimal ...'' hit the harness''s 30s timeout. Root cause: fixture_command() (scripts/containment/conformance.py ~:491) calls subprocess.run(capture_output=True) without stdin, so the child inherits the terminal and blocks. With stdin detached the same harness completes init in about 3s and reaches role enter (verified 00:31 MST). Fix: pass stdin=subprocess.DEVNULL to every fixture setup command except the step that deliberately needs the operator''s terminal (role enter), and add an offline test that runs fixture init with a pty on stdin. Acceptance: (1) fixture setup never blocks on an inherited TTY; (2) the regression test fails before the fix; (3) docs/internal/testing/containment-conformance.md notes the stdin contract. LIGHT gate.'
