  content: 'Implemented native-seat handoff: fixture_command now supplies subprocess.DEVNULL stdin for all shared-boundary setup commands; the separate role-enter terminal flow is unchanged. The binary-dependent offline fixture now runs with an idle PTY on stdin. Red verification before the fix: failed in 30.379s with fixture-init-unavailable, reproducing the reported hang. Green verification after the fix: python3 -m unittest tests.test_containment_conformance tests.test_containment_conformance_aida passed all 27 tests in 13.173s. Updated docs/internal/testing/containment-conformance.md with the stdin contract. Edits remain uncommitted for host publication; no queue completion or live vendor measurement performed.'
