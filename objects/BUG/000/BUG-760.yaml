title: first 'aida dev activate' in a fresh shell executes the INSTALLED aida (PATH not yet prepended) — old pin semantics can select debug; needs repo-binary self-resolution
description: 'Observed 2026-07-19 in the operator''s .bashrc: with the shell-init aida() wrapper sourced, the first ''aida dev activate'' of a fresh shell resolves ''aida'' from the ORIGINAL PATH — the system-installed binary (possibly months old) — because the dev target dir is only prepended BY that activation. Consequences seen live: the old binary''s activate ran old auto/freshest-wins pin semantics (could pick a stale debug), printed the old message format, and a second activate (now the dev binary) silently corrected to release-default — making duplicated activate lines look load-bearing and producing a transient truthful-but-confusing ⇄ staleness marker. Fix: dev activate (or the shell-init wrapper for the activate verb) should locate the repo''s own freshest dev binary (walk up from cwd for target/{release,debug}/aida, or honor a recorded repo path in ~/.aida) and re-exec ITS activate so the semantics are always the in-repo binary''s, regardless of which binary the first PATH hit found. Acceptance: in a shell whose PATH has only the installed aida, a single ''aida dev activate'' inside the repo yields the dev binary''s pin semantics and message; no second activate needed; test on the re-exec resolution. Mode: drive.'
