  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2500):
    Verdict: REJECTED
    Reviewed commit: 59a72ef9ca79
    Recorded: 2026-11-08T20:39:21.873845084+00:00
    Findings:
    1. No fix is implemented. The only change is docs/plans/2026-11-08-bug-2500-review-wait-verdict.md. VerdictKind still has no wait outcome (aida-cli-lib/src/gate/review_verdict.rs:54), so a CI-wait or host-only review can still only be recorded as request-changes; rework selection (queue_cmd.rs:11049) and the repeat-findings guard (queue_cmd.rs:8570) are unchanged. Required: implement plan items 1-5 after sign-off.
    2. Merging would falsely complete BUG-2500. The commit subject is 'fix: ... (BUG-2500)' with a completing trailer, and pull-side auto-bump flips a NeedsAttention spec with a merged commit (aida-cli-lib/src/tests/auto_bump_done_tests.rs:989-1040). Required: real implementation under the trailer, or if a plan-only PR is wanted, a docs: subject with (Refs BUG-2500) and a PR body saying it is plan-only.
    3. Sketch-first gate not satisfied. The plan's own status is 'master sign-off required before publication/implementation', and its Decision needed section leaves single waiting vs waiting-ci/host-action-required open. BUG-2500 has only the advisor triage comment and the sketch comment, and the triage comment grants lane work, not this design. AGENTS.md:803 requires sign-off before opening a PR for lifecycle-vocabulary or orchestrator-semantics changes. Required: record the design decision on BUG-2500 before implementing.
    4. No regression test. The plan's bug_2500 test (waiting under spec and PR aliases, canonical round-trip, merge/completion refusal, repeated rework with no queue entry, recurrence finding, status mutation or Rework hold, later approval clearing, advanced head) is absent. Required: add it and cite the executed-test result.
    5. Reviewer guidance is unchanged. Plan item 6 requires generated reviewer prompts, role guidance, review skill templates and CLI docs to teach the wait verdict; none are touched, so reviewers would keep recording CI waits as request-changes even once the verdict exists. Required: edit the aida-core/templates masters, run make sync-templates, update CLI docs.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
