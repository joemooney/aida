  content: "VERIFIED RESOLVED 2026-07-08 (verify-before-fix pass). BUG-650 no longer reproduces for the drain: aida queue work --auto-complete / aida zen acquire the implementer worktree as an ISOLATED SIBLING (main.rs:53087 derives worktree_path from project_root.parent(), never project_root) — a warm-pool tree when pooling is on (default since TASK-985/STORY-714), OR a fresh git worktree add on --no-pool / pool-acquire-fail. Neither runs the implementer in the host checkout, so the host harness-worktree lease (the advisor session) is never contended.\n\nLive proof: the TASK-1118 and TASK-1119 codex drives THIS session ran from THIS shared checkout while the advisor held lease abf9f7f0 (harness-worktree, /home/joe/ai/aida) and completed cleanly.\n\nThe genuine residual host-contention path was aida integrate (it drives merges from cwd, not an isolated worktree) — fixed separately by TASK-1050 (ensure_integrator_checkout + guard_not_shared_checkout, with tests). \n\nRoot of the original 2026-06-29 report: the warm-pool / isolated-worktree work (STORY-714/TASK-985) landed AFTER the bug was filed and designed out the contention; the integrate residual was closed by TASK-1050. No new code needed. Optional durable lock-in (small follow-up, touches session_start): extract the worktree_path derivation into a pure helper and assert it is never project_root."
