  content: "FOLDED REVIEW FINDINGS (backlog cleanup 2026-11-25 14:10, product-15 under Joe's full authorization; advisor-122 pre-read 14:02; findings are not requirements, STORY-3118). These 5 stand-alone finding-specs are recorded here and rejected:\n\n- TASK-3405: Review follow-up: task_1993_review_watch_tests.rs:3289 and :3605. The existing backoff tests use previous-bo\n  From BUG-2763 Reviewed sha: 14a5d0f2168490d925f2cf18dc924ac3a987b637 task_1993_review_watch_tests.rs:3289 and :3605. The existing backoff tests use previous-boot as a synthetic boot ID. ProcIdentity::from_record rejects it as malformed, so the Exited iterations reach EXIT_UNKNOWN at the final new-head dispatch assertions (lines 3326 and 3647). Give those fixtures real death evidence and retain both assertions. Affected commands are cargo test -p aida-cli-lib bug2518_no_verdict_backoff_cap_and_new_head and cargo test -p aida-cli-lib bug2521_waiting_backoff_cap_and_new_head.\n\n- TASK-3407: Review follow-up: review_watch.rs:928 and :1690. The doctor finding reads a cached display string without ch\n  From BUG-2763 Reviewed sha: 14a5d0f2168490d925f2cf18dc924ac3a987b637 review_watch.rs:928 and :1690. The doctor finding reads a cached display string without checking whether its hold survives. In particular, --release clears attempts and leaves skipped intact, so a released hold continues to emit a stalled-reviews finding and can fail the scheduled check until a later watcher pass. Tie the diagnostic to the current held receipt and its head, and cover clearing after release.\n\n- TASK-3409: Review follow-up: review_watch.rs:1654. The moved-head predicate includes retryable fetch failures whenever \n  From BUG-2763 Reviewed sha: 14a5d0f2168490d925f2cf18dc924ac3a987b637 review_watch.rs:1654. The moved-head predicate includes retryable fetch failures whenever they inherited setup_retry, even though the existing setup-hold branch excludes retryable_fetch and retry accounting is per head. The fast path through execute_reservation in story_2401_review_exhausted_fetch_is_capped_per_head records the still-running test process as dispatcher, so its expected new-head dispatch at task_1993_review_watch_tests.rs:2986 now statically resolves to EXIT_ALIVE. Keep the fetch cap scoped to the old head and retain the coverage in cargo test -p aida-cli-lib story_2401_review_exhausted_fetch_is_capped_per_he\n\n- TASK-3412: Review follow-up: review_watch.rs:1654 and :3628. A dispatcher that the watcher reaps before it claims its i\n  From BUG-2763 Reviewed sha: 14a5d0f2168490d925f2cf18dc924ac3a987b637 review_watch.rs:1654 and :3628. A dispatcher that the watcher reaps before it claims its inherited setup retry is marked Failed with setup_retry and a diagnostic. The immediate reaping branch never saves its identity or PGID. moved_exit_hold reclassifies that proven pre-claim exit as ambiguous and strands the next head indefinitely. Differentiate confirmed pre-claim exits from failed setup receipts that may have launched work.\n\n- TASK-3427: Review follow-up: aida-cli-lib/src/review_watch.rs:930 and :3899: Release clears the saved skip under the st\n  From BUG-2763 Reviewed sha: 2753e3c99e8b00ce74a377dd77550baa87c92efd aida-cli-lib/src/review_watch.rs:930 and :3899: Release clears the saved skip under the state lock, but the watcher computes its skip and saves it in separate transactions. If release runs after selection returns the exited-hold reason and before record_skip saves it, that stale result recreates the skip with no held attempt. Tie publishing the exited-hold skip to the current attempt or serialize the relevant selection and skip write with release. The sequential release test does not exercise this interleaving."
