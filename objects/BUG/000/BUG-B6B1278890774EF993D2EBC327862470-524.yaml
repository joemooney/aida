title: 'review-watch holds PRs forever on exited attempts: new pushed heads are never reviewed'
description: |
  Seen 2026-11-25 (filed by product-15 per advisor-122 01:42). review-watch's last pass skipped 9 open PRs under "held by exited attempts" (PR-4560, 4538, 4533, 4482, 4475, 4464, 4458, 4457, 4397): a prior review attempt exited without clearing, so each PR's NEWER pushed rework head was never reviewed. Most of the night's reworks stalled silently this way. Recovery today needs an operator `aida review watch --release PR-N` per PR (reviewer authority).

  ## Acceptance
  - AC1: When EVERY recorded attempt process for a change is verified DEAD and the PR head has MOVED past the attempt's head, review-watch auto-releases the hold and dispatches the new head. If liveness is UNKNOWN, it keeps holding and surfaces a doctor finding (stalled-reviews / review-watch).
  - AC2: Tests: dead + moved → released and dispatched; alive → held; unknown liveness → held + doctor finding.
