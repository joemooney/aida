spec_id: BUG-b6b1278890774ef993d2ebc327862470-524
agreed_id: BUG-2763
title: 'review-watch holds PRs forever on exited attempts: new pushed heads are never reviewed'
description: |
  Seen 2026-11-25 (filed by product-15 per advisor-122 01:42). review-watch's last pass skipped 9 open PRs under "held by exited attempts" (PR-4560, 4538, 4533, 4482, 4475, 4464, 4458, 4457, 4397): a prior review attempt exited without clearing, so each PR's NEWER pushed rework head was never reviewed. Most of the night's reworks stalled silently this way. Recovery today needs an operator `aida review watch --release PR-N` per PR (reviewer authority).

  AMENDED 2026-11-25 04:50 (advisor-122): redesign by removal. No liveness proof is needed (the r1 review showed it can't be made reliable). The doctor finding is out of scope.

  ## Acceptance
  - AC1: An exited-attempt hold is keyed by (PR, head SHA). When the PR head differs from the held attempt's head, review-watch dispatches the new head with no liveness probe. This includes the hub/claim path: an old head's claim, Running or not, never blocks a different head. Verdicts stay head-pinned, so a late verdict from the old attempt never counts for the new head. A same-head hold stays held until an operator runs `--release`. `--release` also clears the saved skip entry.
  - AC2: Tests: a hold on head A plus a new head B → B is dispatched with no probe; the same head A → still held; a late verdict from the A attempt does not count for B; a hub-enabled case where A's claim is left Running → B is still dispatched.
