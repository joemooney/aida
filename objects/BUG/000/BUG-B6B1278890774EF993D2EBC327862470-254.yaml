  content: 'Implementation in native lane: pickup prompts compare newest brief/ruling created_at, render only the newest as binding, and retain older advisor direction as explicitly superseded background. Existing brief-versus-verdict standing and agent-gate/conflict behavior are preserved. Added both ordering regressions including nested replies, plus the pre-verdict-brief/older-ruling boundary; updated the prior BUG-057 precedence assertion that required an older brief to lead a newer ruling. Targeted lane tests are running; final validation will follow. Codegraph doctor reports the shared index unreachable, so callers were confirmed with rg. Edits remain uncommitted for host publication.'
