title: 'Plan Followups filed twice: SPIKE-70 followups re-filed as TASK-1038..1044, duplicating already-merged TASK-1003/1005'
description: |-
  The SPIKE-70 plan (docs/plans/2026-06-29-spike-70-coupled-sequential-drain.md) Followups section was filed as implementation TASKs TWICE:

    Round 1 (coarse, IMPLEMENTED + MERGED): TASK-1003 (single-branch engine+flag+cluster-PR+checkpoint, PR #1218) and TASK-1005 (--sequential + burndown docs, PR #1220). Both Completed.

    Round 2 (fine-grained, DUPLICATES): TASK-1038 (cli), 1039 (engine), 1040 (cluster PR), 1041 (checkpoint), 1042 (sequential), 1043 (docs), 1044 (relationships) — one task per plan Followup bullet. These landed as Approved/open and made EPIC-54 read ~8 items open when the feature was already shipped. All 7 have now been rejected (1044 as an artifact, 1038-1043 as duplicates of TASK-1003/1005).

  ROOT CAUSE (hypothesis): the Done/Completed followup-filing path (the [aida:followups] marker described in CLAUDE.md, AIDA_AUTO_FOLLOWUPS) or a manual re-decompose re-filed the same plan Followups without deduping against already-Completed tasks tracing the same plan.

  IMPACT: phantom duplicate specs inflate an epics open count and burn operator/advisor triage time (this incident: a worktree was cut to implement already-merged code before a code-vs-spec check caught it). Also surfaced BUG-678 (focus rollup counted these as open).

  FIX DIRECTION: when auto-filing followups from a plan, dedupe against existing specs that reference the same plan / same Followup text and are already Done/Completed; skip or link instead of re-filing. At minimum, tag auto-filed followups with the plan path so a later filing can detect the prior round.
