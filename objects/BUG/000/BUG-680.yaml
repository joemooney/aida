title: 'Plan Followups filed twice: SPIKE-70 followups re-filed as TASK-1038..1044, duplicating already-merged TASK-1003/1005'
description: |-
  The SPIKE-70 plan Followups were filed as implementation TASKs TWICE: coarse (TASK-1003/1005, implemented+merged) and fine-grained (TASK-1038..1044, duplicates that read as open). The auto-followup-filing path (the [aida:followups] marker / AIDA_AUTO_FOLLOWUPS) did not dedupe against already-Completed tasks tracing the same plan.

  ## Acceptance
  - WHEN the followup-filing path files a followup derived from a plan file, THE system SHALL record the source plan path on the created spec.
  - WHEN the followup-filing path would file a followup, IF an existing spec references the same source plan path and carries matching followup text and is in a terminal status (Completed or Rejected), THEN THE system SHALL skip creating a duplicate and SHALL link to the existing spec instead.
  - WHEN a plan followup is re-filed after its prior round already shipped, THE system SHALL NOT create a second open spec for the same followup.
  - A unit test SHALL assert that filing the same plan followup twice yields one spec on the second run, not two.
