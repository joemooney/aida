title: 'dell1 CI runner: launcher parent dir mode 0711 makes the Actions runner exit at start, and rearm.sh re-registers in a tight loop'
description: 'Found running the STORY-2672 runbook on dell1 2026-11-08. scripts/runner/one-job.sh line 24 creates /var/lib/aida-ci-jobs with mode 0711. The .NET Actions runner needs read on each parent of its work dir and exits: ''Permission to read the directory contents is required for /var/lib/aida-ci-jobs/current and each directory up the hierarchy''. It exits zero-looking, so scripts/runner/rearm.sh immediately generates a new JIT config: 25 launches and 18+ orphan offline registrations in about 25 seconds before the advisor stopped it and deleted them. AC1: one-job.sh creates the root-owned parent 0755 while current stays 0700 owned by aida-ci, with a test asserting both modes. AC2: rearm.sh stops (or backs off) when a runner exits within a few seconds of start, so an instantly failing runner cannot loop registrations, with a test. AC3: docs/internal/testing/dell1-runner.md states the parent mode and rationale. Do not change the event/repo routing gate. Reference STORY-2672 security floor.'
