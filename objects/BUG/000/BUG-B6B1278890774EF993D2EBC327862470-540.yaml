- id: 01a21a1a-78c5-72e2-b32b-b363e2384a63
  author: dirtlab
  content: '## Implementer approach


    ### Acceptance criteria and evidence

    - **AC1 unit:** `review_challenger::tests::bug2779_untrusted_challenger_output_fails_closed` — table of "} sorry {", "done} {", "}", "{", "", fenced block + trailing prose, braces inside strings, two verdict objects. `apply_verdicts` now scans each `{` candidate with serde_json''s stream deserializer (no slicing), returns a typed error when none parses and refuses two objects; the caller already turns that error into a refused review (fail closed). Audit of other first-{/last-} extractions: aida-core ai/responses.rs, schema.rs, intent.rs already guard end > start; compete.rs balances braces; parse_runner_findings_json does not slice.

    - **AC2 unit:** `review_prepare::tests::bug2779_top_level_error_keeps_its_cause` — --sarif outside the repo; the error Display carries "write SARIF ...: --write outside repository". `handle_review_prepare` flattens the chain with `{:#}`.


    ### Expected files

    - aida-cli-lib/src/launch/review_challenger.rs

    - aida-cli-lib/src/review_prepare.rs


    ### Ambiguities / conflicts as questions

    - None'
