title: Unshipped-work watcher flags a DEFERRED spec's parked branch (e.g. bug-2688-journal-loop) as unshipped work
description: |
  Found 2026-11-23 20:23 (advisor-122; filed by product-15). The unshipped-work watcher flagged BUG-2688's branch bug-2688-journal-loop (first seen 03:22Z) as "unshipped work detected". The branch belongs to the CLOSED PR #4388, parked on purpose when BUG-2688 was DEFERRED to 2026-12-15. Every deferred spec's parked branch shows up as a false alarm.

  ## Acceptance
  - AC1: unshipped-work detection skips branches whose spec is DEFERRED (or reports them in a separate "parked: deferred until …" line, not as an alert). Test with a deferred spec plus a parked branch.
