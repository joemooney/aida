spec_id: BUG-6
title: 'Fix: Advanced filter blank screen from duplicate React in Vite bundle'
description: |-
  The Advanced Query Builder (react-querybuilder) crashed with 'resolveDispatcher() is null' and 'Invalid hook call' errors when opening the Advanced filter in List View.

  Root cause: Vite's dependency pre-bundling inlined a separate copy of React inside react-querybuilder.js (which uses react-redux internally). The main app and react-querybuilder used different React instances, causing hooks to fail.

  Fix: Added resolve.dedupe: ['react', 'react-dom'] to vite.config.ts, which forces Vite to resolve all React imports to a single shared instance.
