    ## Implementer handoff, round 2 (seat rotated at context ceiling, 2026-10-31 04:50)

    ALL round-2 work is UNCOMMITTED in worktree aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-046. The ruling wants ONE new commit (no force-push) covering every finding.

    ### Done (uncommitted)
    - Tool is now `aida doctor --fix id-collisions [--dry-run] [--mapping FILE] [--tree-only] [--yes]` (doctor_cmd.rs DoctorArgs). The old renumber-id-collisions subcommand is removed. doctor_renumber.rs is rewritten: exact-case token match (lowercase links stay), comment-line rewrite in source files (trace lines, lines starting //, #, *, and trailing //), mapping TSV (render, parse, mapping_problems), tree-only mode, and an apply-from-mapping that refuses if a target is taken. Tests are in aida-cli-lib/src/tests/bug_046_doctor_renumber_tests.rs, including an end-to-end fixture. NOT YET COMPILED OR RUN.
    - GitBackend: id_holder is now pub and scans agreed_id. New peek_spec_id predicts node-local IDs from the store max plus headroom 100, with no lock (the sandbox refuses the dispenser lock). New tests: bug_046_id_holder_considers_agreed_ids, git_ops bug_046_merge_gate_skips_padded_twins, models bug_046_seq_width_flip_on_mixed_padding_store. The aida-core targeted run passed 104 tests, but that run was before the peek change.
