  content: 'OPERATOR SIGN-OFF (2026-06-01): #1 (scope queue-work sessions to the STORY, not the parent epic/cluster) is APPROVED to implement. This is the architectural root — it removes the same-epic scope contention at the source, so siblings stop fighting over one epic-scoped lease/worktree/branch. With this approved, all three of BUG-431''s compounding fixes are now in scope: #1 story-scoping (root), #2 reviewer picks most-specific spec (epic→child), #3 release/park the lease on ANY phase failure (kill the cascade-block). Tracked under EPIC-33 (orchestrator correctness floor) invariants 1+2. Implementation is loop-eligible (supervised advisor work, with tests + a SUPERVISED --zen --auto-complete validation drain, not unsupervised --no-human). Suggested order: #2 (most bounded) → #3 → #1 (the scoping change has the widest blast radius; do it last with the most care + the validation drain). trace:BUG-431'
