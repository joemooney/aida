- id: 019e8379-0d94-7f30-83fc-981a46f8e7b2
  author: joe
  content: '#3 scoping (advisor, 2026-06-01): NOT a clean auto-fix — flagging a design fork for the operator. The drain''s failure path deliberately does NOT auto-end the lease (auto_complete.rs ~947 emits ''commit or discard in the worktree, then end it'' + a --steal hint) because the failed worktree may hold uncommitted work a human must triage; auto-removing it would destroy that. Also: the sibling-CASCADE that #3 describes is mostly a CONSEQUENCE of #1 (epic-scoping) — once sessions are story-scoped (#1), a failed story''s held lease only blocks re-attempts of THAT story, not its siblings. So the residual #3 work is: on a shelvable failure, RELEASE the lease (free the scope) WHILE PRESERVING the worktree (don''t delete it) — i.e. decouple lease-ownership from worktree-existence. That''s a real lifecycle design change with a preserve-for-triage tension → operator/keyboard call, and best done AFTER #1 (which moots the urgent cascade). Recommend: do #1 first (signed off), re-evaluate whether #3''s residual is even needed, then design the lease/worktree decoupling deliberately if so. trace:BUG-431'
  created_at: 2026-06-01T13:56:49.172937558Z
