  content: 'Motivating real-world case + resolution provenance (advisor, 2026-06-01): quizdom is the origin report — its agent ran ''aida queue work next 11 --no-human=both'' on EPIC-11''s children, hit this exact cascade (epic-scope contention → multi-spec PR breaks reviewer → stuck leases), and had to FALL BACK to the Claude Code Workflow tool (the harness''s native orchestrator) to ship the 7 stories — explicitly stepping outside the AIDA fleet + flagging the lost dogfooding value. That bypass is the strongest possible signal this bug mattered: a real drain became unusable and a user reached for a competitor mechanism. NOW FIXED on aida main (invariant-1: #1 story-scoping + #2 resolver + #3 mooted + TASK-133 + BUG-250, EPIC-33). The on-mission path (aida queue work --no-human for a multi-story-epic batch) is restored — BUT the fix is merged-not-released, so quizdom benefits only after the next aida release (or pointing quizdom at a fixed dev build). Strategic note: the harness Workflow tool can ORCHESTRATE this fine; AIDA''s differentiation is substrate-NATIVE orchestration (the drain reads/writes the spec graph + lifecycle + leases + traces as it ships), which the bypass lost. Don''t compete on orchestration mechanics; compete on substrate integration. trace:BUG-431'
