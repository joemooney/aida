- id: 01a20de5-742c-7453-80cc-d1d2737347fd
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2710):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 8bb20de23efc
    Recorded: 2026-11-23T21:37:59.982342589+00:00
    Findings:
    1. BUG-2710: A single stalled session still reproduces the scheduled exit 124 indefinitely. At session_reap.rs:2619–2641 and :2656–2667, a session admitted just before expiry runs classification and teardown synchronously, including timeout-free git status for ordinary worktrees (session_reap.rs:649–661) and potentially a synchronous pre_destroy hook (aida-core/src/worktree_hooks.rs:40–50). The next deadline check cannot run and shift never saves or reports a cursor if the child is killed. Bound or defer slow session work at safe boundaries and make a stalled session yield with its ID available to the next tick. Preserve the requirement to finish an in-flight mutation. Add a regression exercising the slow session through the scheduler deadline path.
    2. BUG-2710: Shared reap work bypasses the deadline even when no lease remains to visit. session_reap.rs:2612–2615 runs registry GC and reads every lease before the first check, and :2643–2644 starts an unrestricted orphan-pin sweep after the last session even if it exhausted the budget. Each orphan removal can relist all leases (seat_clone.rs:6322–6346). The last completed lease can therefore consume the budget and the pin sweep can still cause exit 124 before shift receives the result. Bound or defer shared maintenance at safe boundaries, including the empty-list and final-lease-overrun cases.
    3. BUG-2710: Scheduled night-shift outcomes drop the partial reap report. shift.rs:3473–3477 prints the count and next session to stdout. maintenance_schedule.rs:3981–3989 captures stdout, but the success log at :4295–4323 writes only stderr, and the shift-specific handling at :4019–4026 keeps only timing on success. A scheduled yield therefore has no diagnostic with the stopped-at session and count, and the cursor in shift state can be overwritten by subsequent ticks. Carry the partial reap fields into the scheduled outcome log and cover that path.
    4. BUG-2710: The required decision-equivalence regression at bug_home_024_finished_lease_tests.rs:541–562 gives both leases deleted worktrees. Its only successful reap goes through gone_tree_releaser, so it would still pass if the budgeted lease_scanner-to-reap_one path never reaped an eligible existing worktree or seat clone. Compare the actual reap and keep decisions of the budgeted and unbounded paths on present trees, including an eligible finished tree and a tree protected by the existing safety decisions.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-24T14:11:11.020316174Z
  modified_at: 2026-11-24T14:11:11.020316174Z
