    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 12:59):
    # BUG-2710: night-shift reap killed at the 120s budget every tick (advisor-122 ruling 2026-11-23 12:56; product-15). Lane: CODEX. Track: MAIN. STRICT review (session_reap). New branch, new PR.

    The 12:43 bundle lane correctly punted: the scheduler calls synchronous reap_quiet (final count only), so a scheduler-only timeout can't identify the active session or safely yield. This fix goes INSIDE session_reap.
    DESIGN (advisor): a cooperative per-session deadline INSIDE session_reap, checked ONLY BETWEEN sessions (never mid-mutation). The scheduler passes its remaining budget. On deadline, return a PARTIAL result naming the next unvisited session and the count done. Reap DECISIONS are unchanged. The next tick resumes where it stopped (or simply restarts, if ordering is stable).
    TESTS: (1) a slow fake session makes the deadline fire BETWEEN sessions with NO partial mutation; (2) decision-equivalence: the same sessions are reaped with and without a budget when time allows.
    SMALL-PR RULE: <=300 changed lines. Add `// trace:BUG-2710 | ai:codex`. Commit `[AI:codex] fix(...): ... (BUG-2710)`. One targeted test run, then `make check-ci-fast`, then ship a new PR (base MAIN). COMMIT your work.
