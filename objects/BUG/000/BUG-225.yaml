title: no-launch headless hint omits --session-id and reorders prompt vs real launch
description: |-
  The \`--no-launch\` printed command (the one a user can copy-paste to invoke claude headless manually) doesn't match the actual launch path that \`exec_claude_headless\` invokes:

  - Missing \`--session-id\` in the hint
  - Prompt position reordered vs the real launch

  Cosmetic but a footgun for anyone copying the hint command to reproduce a headless invocation.

  ## Acceptance

  - [ ] \`--no-launch\` printed command exactly matches what \`exec_claude_headless\` would invoke
  - [ ] Round-trip test: copy the hint, paste it, behavior matches the real launch

  ## Origin

  Reviewer finding 3 on PR-64.
