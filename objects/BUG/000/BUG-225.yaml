  content: |-
    Implemented on branch bug-225 (commit c585708b):

    - The `--no-launch --no-human` hint is now rendered from `session::claude_headless_args` — the exact argv `exec_claude_headless` feeds to `claude` — so it can't drift again. Fixes the missing `--session-id` and the prompt being placed mid-argv instead of last.
    - New helpers: `headless_launch_hint` (claude + argv) and `shell_join_display` (quotes only the elements that need it).
    - `--no-launch --no-human` now mints a session id when the caller didn't pass `--session-id`, so the hint is a complete, round-trippable command and the manifest records the id.

    Test status: 540/540 aida-cli tests green; added a round-trip test asserting the printed hint shell-splits back to `claude` + `claude_headless_args(...)`.
