title: 'Implementer ceiling: ''aida session start --owns SPEC'' creates lease but doesn''t bump spec status from Approved to In Progress'
description: |-
  ## Symptom

  When an agent runs 'aida session start --owns <SPEC-ID>' (the standard implementer entry point), the lease is created but the SPEC's status remains 'Approved' instead of transitioning to 'In Progress'.

  Doctor's 'spec-status-drift' category catches this AFTER the fact ('SPEC-X is Approved but lease YYYY is active [safe] → bump spec to In Progress'). But the substrate should bump it at the source, not require doctor sweep.

  ## Reproduced twice in one session 2026-05-24

  1. TASK-542 — Antigravity-1 ran 'aida session start --owns TASK-542'; spec stayed Approved; lease active for hours; doctor flagged the drift.
  2. STORY-463 — Codex ran 'aida session start --owns STORY-463' as part of pickup; spec stayed Approved; doctor flagged the drift after Codex began work.

  This is a sibling ceiling-pattern to BUG-376 (post-ship linger) and BUG-378 (scratchpad drift). All three are 'agent discipline ceremony that should be substrate-enforced':

  - BUG-376 — agent lingers post-ship → substrate banner says EXIT
  - BUG-378 — agent ignores brief queue → substrate banner says PENDING BRIEF
  - This bug — agent forgets to bump status on session start → substrate should auto-bump

  ## Proposed fix

  'aida session start --owns <SPEC-ID>' transitions the spec from Approved → In Progress as part of the session creation. Atomic — lease + status transition together. Idempotent — if already In Progress, no-op.

  Edge cases:
  - Spec is already In Progress (by another lease): warn + ask --force-claim
  - Spec is Done / Completed: refuse (work already shipped)
  - Spec is Draft / Rejected: refuse (not ready)
  - Spec is NeedsAttention: warn + ask --force-claim (punted; needs advisor first)

  ## Acceptance

  - [ ] 'aida session start --owns SPEC' bumps spec status Approved → In Progress
  - [ ] Idempotent: spec already In Progress is no-op
  - [ ] Refuses Done/Completed/Rejected/Draft (with clear error)
  - [ ] Warns + requires --force-claim for already-In-Progress (different lease) or NeedsAttention
  - [ ] Doctor's 'spec-status-drift' category no longer fires for newly-created sessions (only catches historical drift)
  - [ ] Test: session start on Approved spec → status In Progress; on Done spec → refused; on already-In-Progress spec with --force-claim → claimed

  ## Composes with

  - BUG-376 / BUG-378 (sibling ceiling-pattern fixes)
  - STORY-462 (doctor's spec-status-drift category — this BUG addresses the source)
  - TASK-359 (implementer finish-checkpoint — that's the END of work; this is the START)
  - feedback_substrate_as_bouncer_not_rules

  ## Origin

  2026-05-24 master observed this twice within 4 hours during heavy multi-agent dispatch. doctor (STORY-462) catches it; substrate enforcement at session start would prevent it.

