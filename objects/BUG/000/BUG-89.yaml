- id: 019e1ee8-450a-7cb0-b26b-e6e1ac6de1e1
  author: joe
  content: |-
    ## Final diagnosis 2026-05-12 — confirmed via queue.yaml inspection

    Inspected /home/joe/ai/aida/.aida-store/registry/queues/joe.yaml. All 13 entries have:
    - user_id: joe ✓
    - for_role: implementer ✓
    - for_scope: EPIC-20 | EPIC-23 | EPIC-1 | EPIC-21 (one of these)
    - **for_session: not set (no field)**

    So my earlier 'for_session' hypothesis was wrong. It's purely the for_scope filter.

    ## The actual bug

    `aida queue list` (default) interprets 'no active scope' as 'filter to items with for_scope=None.' But all 13 items have for_scope set to some EPIC (because STORY-57's queue-add auto-filled it from the lease scope at add time).

    When you run `aida queue list` from a context with no active session/scope (e.g., main project root, not inside a session worktree), the filter excludes all scoped items — leaving zero visible.

    ## What it should do

    Two semantically valid options:

    ### Option A: 'No active scope' → show everything (no for_scope filter)

    ```
    if active_scope.is_none() {
        # don't filter by for_scope — show all items
    } else {
        # filter: for_scope IS NULL OR for_scope == active_scope
    }
    ```

    This is the most intuitive — outside a scoped session, the queue is global. Inside a scoped session, you see scoped + unscoped items relevant to your focus.

    ### Option B: Always include unscoped + matching scoped

    ```
    # Always show: for_scope IS NULL OR for_scope == active_scope
    # When active_scope is None, the second condition is never true,
    # so only unscoped items show.
    ```

    This is current behavior. Useful if 'show me unscoped TODOs' is the dominant use case, but punishes users who scope their items aggressively.

    ## Recommendation

    Option A — more permissive default. STORY-57's value is the OPT-IN to scope-filter when inside a session; the default-when-outside should be permissive.

    If the user wants strict scope filtering from outside, they can use `--scope EPIC-X` explicitly.

    ## Verification of the fix

    After fix:
    ```
    $ aida queue list             # from ~/ai/aida (no active session)
    My Queue (13 items)           ← shows all 13, regardless of for_scope
    ```

    ```
    $ cd /home/joe/ai/aida-epic-23 && aida queue list   # inside EPIC-23 worktree
    My Queue (5 items)            ← filters to EPIC-23-scoped + unscoped items
    ```

    ## Composes with

    - STORY-57 (parent — scope/session filtering design) — this corrects its over-aggressive default
    - TASK-52 (--scope filter) — user can explicitly scope; this fix changes the IMPLICIT default
    - BUG-87 (--all/--for filter interaction) — different bug, but same family of 'implicit filters too aggressive'

    ## Severity unchanged

    Still High. Users default invocation of `aida queue list` shows zero items in the most common context (main project root, no active session). The implicit-filter behavior fights the user's mental model.
