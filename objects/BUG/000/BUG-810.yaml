title: epic rollup counts an ACCEPTED ADR child as remaining — epic never closes
description: |-
  EPIC-61 stays In Progress although every child is resolved: TASK-1183 / STORY-783 / STORY-784 are Completed and ADR-25 is an ACCEPTED decision (status approved). BUG-781 made an accepted ADR terminal for the open lens and the status tally, but the epic rollup was never taught the same rule: aida-core/src/graph_walk.rs status_rollup() maps Draft|Approved|Planned to remaining for every type, so a decision-type child in Approved (= Accepted) counts as open work and the parent epic can never roll up to Done/Completed.

  Fix: in status_rollup(), treat a child with requirement_type Decision + status Approved as resolved (count it with completed, or a dedicated accepted bucket that the epic-status derivation treats as resolved, mirroring how rejected/superseded children are resolved). Verify both derivation sites agree (graph_walk.rs status_rollup + the cache-side epic_status_override_from_cache in aida-core/src/db/cache.rs) and add a rollup test: epic with children [Completed, Completed, Decision+Approved] derives Completed. Acceptance: EPIC-61 rolls up to Completed with no child edits.
