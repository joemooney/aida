title: 'Windows build broken: libc::ETXTBSY un-gated in command_output_retrying_etxtbsy (BUG-463 regression)'
description: 'BUG-463 (#599) added command_output_retrying_etxtbsy() in aida-cli/src/main.rs which references libc::ETXTBSY unconditionally. libc is a [target.''cfg(unix)''.dependencies] dep, so on windows-latest ''Build all packages'' fails with E0433 ''cannot find module or crate libc''. ETXTBSY is a Unix-only errno (text-file-busy on exec); Windows can''t produce it. This broke the nightly cross-platform build (2026-06-07), blocking the v0.12.0 release gate (separate from BUG-466''s test failure). Fix: cfg-gated is_etxtbsy() helper — real check on unix, compile-time false on non-unix. All pre-existing libc usages (daemon/signals/getuid) were already cfg-gated.'
