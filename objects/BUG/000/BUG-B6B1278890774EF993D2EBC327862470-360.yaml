- id: 01a1e076-3d40-7b21-acfb-03669445e8be
  author: dirtlab
  content: 'Root cause traced to host auto-publication of native Codex seat work: lane_fast_gate::native_rounds writes native_ready=true even for a final fail; native_inner returns publishable=true; publication_ready and check_import validate readiness/head but never reject marker=fail. Thus publish_queue_exit can push and open the PR after the failed one-fix round. Explicit host from-seat publication also bypasses check_import when automatic=false. Fix will fence known-red evidence at publication and preserve gate diagnostics on NeedsAttention.'
