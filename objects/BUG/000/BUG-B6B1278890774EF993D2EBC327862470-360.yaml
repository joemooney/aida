- id: 01a1e06c-946a-7f33-bda4-85cb216ddab1
  author: joe
  content: 'Advisor lane brief 11:20 (codex, MAIN track, product seat aida-d0 pick). Scope: acceptance 1-3 as written. Start from the STORY-2640 host gate (lane pre-push check-ci-fast + one seat-fix round) and trace each publish route for a codex seat: lane-run/host publish of uncommitted seat edits, `aida ship`/`aida pr` from the seat, and the post-lane auto-publish. #4094''s first head 57008df (09:00, E0425 canonical_resume_branch) is the incident; the lane log is on dell1 under ~/lanes/lane-TASK-3799.0911.start.log. Record the route on the spec before fixing. Fix: a failed gate after the fix round leaves the spec needs-attention with the gate output attached, and no push/PR happens on ANY route. Regression test drives that route with a failing gate and asserts no push and no PR. Off-limits: pr_train.rs. Overlap: queue_cmd/work.rs, land.rs, land_run.rs are under open #4094; seat_clone.rs, session.rs, land*.rs under #4058; if the fix must touch one, keep the hunk minimal and name it in the PR body. Gate (LIGHT): one targeted cargo test -p aida-cli-lib <your test filter> plus the lane pre-push gate; do not push while red. Trailer (BUG-2596). Session rules: allowed_domains only on sandboxed Bash calls, never with dangerouslyDisableSandbox. A classifier-denied kill or destructive step is reported, never retried another way. Never sleep in a foreground Bash call.'
