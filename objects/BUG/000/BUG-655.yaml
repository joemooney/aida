title: Auto-followups duplicates when a plan with a Followups section is committed by multiple agents/PRs
description: 'STORY-712 shipped via 4 slice PRs; the plan docs/plans/2026-06-29-story-712-zero-token-supervision.md (with a ## Followups section) was copied + committed into more than one slice worktree. Each commit that carried the plan + reached Done tripped the auto-followups filing, so the 5 followup bullets were filed TWICE (TASK-993-997 + exact dups TASK-998-1002). The [aida:followups] idempotency marker is evidently per-triggering-commit, not global to the plan/spec, so two independent commits both fire. FIX: dedupe auto-followups by (plan-path + bullet-text) or a spec-level marker that survives across commits/agents, not a per-commit marker. Rejected the 5 dups manually (998-1002).'
