  content: 'ADVISOR RULING (11:38 MST) on the 09:22 fork: B+C. The QC1 retention gate stays strict; A (content-equivalence excuse) is REJECTED, because it would admit an unadmitted other-build writer. C: when ''aida dev build'' promotes, it re-records the mail-retention activation automatically, but only when the fresh /proc scan passes (no other-build writers); otherwise it prints the operator command. Implement C in PR #3268 with a test (scan passes -> re-recorded; scan finds an other-build writer -> not re-recorded, command printed). B (operator re-record) remains the documented fallback.'
