title: aida session end --force is refused on a finished reviewer worktree whose mailbox holds delivered mail when retention activation was recorded by a different build, blocking every --steal relaunch
description: 'Observed 2026-11-02 00:10 (claude-advisor-21): aida-pr-3206 reviewer worktree held one delivered request (f7b5b90b) plus its .deliveries receipt. aida session end 01a19adc6810 --force --yes refused: ''mail retention activation was recorded by a different build (0.16.0+7ee1fa1789a; this is 0.16.0+6a3f67671a9)''. Re-recording needs an operator TTY, and the dry-run reported unknown mail writers. Every queued review of PR-3206 then failed (--steal could not end the lease; without --steal the scope stayed owned). Workaround: copy the message and its .deliveries receipt into the primary .aida/mailbox, then end. Expected: delivered mail already present canonically (or read) should not block ending a dead reviewer lease, and a dev rebuild should not invalidate activation. Related: BUG-2327.'
