  author: dirtlab
  content: 'Implemented explicit default-no native Codex opt-in during interactive full init for selected Codex profiles; existing vendor policy is preserved, noninteractive/no-agent-config paths do not opt in. Permission reports now expose per-vendor configured-containment readiness and fixes in text/JSON, distinct from consistency. Validation: 30 config/permission tests, 3 vendor-ratchet tests, 1 trusted-native readiness regression passed through lane runner; rustfmt, git diff --check and execution-context guard passed. Initial filter matched zero tests and was replaced with the executed targeted suite. Host codegraph client was unavailable; used source searches. Edits remain uncommitted for host publication.'
