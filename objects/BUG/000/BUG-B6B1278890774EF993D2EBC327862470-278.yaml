title: aida init does not configure [contained.vendors] codex = native, and the permissions check's green tick reads as 'ready'
description: 'Reported from operator''s work machine (Codex, GitLab project hello-work-0x), 2026-11-09. After ''aida init'' a Codex project lacks [contained.vendors] codex = "native" in .aida/config.toml, so Codex launches are refused under containment. Init should offer it when Codex is a chosen vendor (explicit consent, stating that native sandboxing is weaker than AIDA containment). Separately, ''aida config permissions show'' ends with a green ''no dangerous permission-posture inconsistencies detected'' while Codex cannot launch; print a clear per-vendor launch readiness line (ready / refused: reason / fix command) distinct from the consistency check.'
status: InProgress
priority: Medium
