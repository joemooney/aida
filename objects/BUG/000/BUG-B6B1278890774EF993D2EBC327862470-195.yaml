  content: |-
    ADVISOR RULING (2026-11-03 12:15, round 2, PR #3305 at 681992b0): fix all four findings.
    CI red: GitLab iteration of task1993_live_discovery fails (fixture lacks source_branch, so unknown-branch path parks without routing); AC2 also unmet for unknown-branch changes. AC1/AC3/AC4 unit-covered.
    1. BLOCKER (CI, lib-1): review_watch::tests::task1993_live_discovery_probes_both_forges_and_refuses_moving_or_unknown_heads fails at aida-cli-lib/src/tests/task_1993_review_watch_tests.rs:851 (messages.len() == 2) on the gitlab=true iteration. The GitLab fixture row (line ~618) has no "source_branch", so parse_change sets head_branch=None, update::author_live returns None, and follow_up (review_watch_update.rs, the 'branch is unknown' arm) return
    2. AC2 gap (major): when the forge omits the source branch (head_branch None), follow_up parks the change forever with reason 'branch is unknown ... does not update it': no update-branch and no advisor routing. This repeats the BUG-2426 failure mode (parked, nobody acting) and contradicts AC2 'when it cannot update, it routes the PR to the advisor'. Route once to the advisor (same idempotent route_message path) when liveness cannot be judged, and
    3. AC2 robustness (minor): forge_update maps every non-success (60s timeout, network or gh auth flake) to a permanent BranchUpdate.refused for that head; it is routed once and never retried. Retry transient failures, e.g. once on a later pass before routing, or say in the advisor mail that the cause may be transient.
    4. Follow-up (minor, implementer-flagged): when gh accepts update-branch but discovery never reports a new head, the change stays parked as STALE_UPDATED forever with no timeout and no routing. Route it to the advisor after a bounded wait (compare BranchUpdate.at).
    RULINGS: (2) when liveness cannot be judged (head_branch None), route once to the advisor through the same idempotent route_message path. (3) Retry a transient update failure once on a later pass before routing, and the advisor mail says the cause may be transient. (4) After a bounded wait (30 min from BranchUpdate.at) with no new head, route to the advisor. LIGHT gate: one targeted cargo test -p <crate> <filter> plus make check-ci-fast (with umask 022, BUG-2432). Push to the existing PR branch, then stop.
