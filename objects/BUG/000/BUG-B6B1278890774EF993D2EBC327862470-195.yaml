title: review watch parks a PR whose head is behind and overlaps main ('stale overlapping head already notified') with nobody acting on it
description: |-
  2026-11-03 08:06: five open PRs (#3192 #3273 #3288 #3291 #3297) showed only 'stale overlapping head already notified' in aida review watch. The watcher sends a one-time notice to the PR author and then skips the PR (review_watch.rs:1134). The authors are headless lanes that have exited, so nobody updates the branch and nothing is reviewed. Releasing with --release does not help. The advisor saw it only by reading the watcher log; aida awaiting does not list it.

  Acceptance: (1) when the author is not a live session (no live lease or mail-reachable seat), the watcher runs 'gh pr update-branch' itself for a branch that merges cleanly, and reviews the new head on the next tick. (2) On conflicts, or when it cannot update, it routes the PR to the advisor as an awaiting item: 'PR-N behind main with overlap; update-branch conflicts'. (3) aida awaiting lists every PR the watcher is skipping, with the reason. (4) A test with a fake forge: an overlapping stale head and a dead author lead to update-branch being invoked and the PR reviewed on the next tick.
