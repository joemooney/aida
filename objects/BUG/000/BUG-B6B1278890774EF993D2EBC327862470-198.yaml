title: 'aida review watch and aida queue work cannot launch contained workers from a Claude Code Bash (sandbox on or off): grant key keyring fails with errno 40'
description: '2026-11-03: from the advisor''s Claude Code Bash (dangerouslyDisableSandbox), ''aida queue work <SPEC> --role implementer --no-human'' and every review launched by ''aida review watch'' fail: ''its grant key could not be put in a session keyring (cannot hold the previous session keyring (errno 40))''. The same command run from aida-deputy-shell (operator terminal) works. The previous advisor session''s watcher worked, so it depends on how the launching process''s session keyring was set up. Workaround in the standing orders: launch lanes and the watcher through aida-deputy-shell run 3 with setsid nohup. Expected: the launcher joins or creates a fresh session keyring (keyctl join_session_keyring with a new anonymous keyring) instead of failing on ELOOP, or the error names the real cause.'
