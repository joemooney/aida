- id: 01a1b217-26c1-7852-9a88-c5a6fb567f4d
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2463):
    Verdict: CHANGES REQUESTED
    Reviewed commit: d28796e94811
    Recorded: 2026-11-06T17:21:26.146662250+00:00
    Findings:
    1. MAJOR forge_confirmation.rs:198-201 rebase_landed: after fetching the pinned head, landing is confirmed only when head^{tree} == base_tip^{tree}. That holds only when the PR was already up to date with base AND nothing has landed since. Any rebase merge of a branch behind base with real changes, or any later confirmation after base moved (db_reconcile.rs:1955 stranded review-PR sweep, queue_cmd.rs:1107 review_pr_is_merged_or_closed run after other merges), still returns Known(false), so metadata_for stays Pending forever: the exact BUG-2463 failure. The doc paragraph (docs/cli/04-git-lifecycle.md:323-329) admits later base changes 'require another landing receipt', but none exists. Now that the original head object is available, use a base-independent rebase receipt, e.g. patch-id equivalence (git cherry <tip> <head> / git log --cherry-pick --right-only <tip>...<head> showing every PR commit has an equivalent on base). Keep the current retain-on-uncertainty contract: conflict-resolved rebases with changed patch-ids stay unconfirmed.
    2. MINOR story_2401_forge_observed_tests.rs:744 bug_2463 regression: base advances only with an --allow-empty commit, so the rebased tip tree equals the original head tree by construction. The regression never exercises a rebase over a real content change on base, or a later unrelated commit landing after the rebase merge (both realistic). Add both cases, asserting Known(Merged) once the receipt above lands, plus a negative case (a head whose patch is not on base stays Pending).
    3. COSMETIC forge.rs:1150-1160: when the pinned head is already present locally and on_base returned false, rebase_landed repeats on_base's cat-file and tree comparison. Harmless, but the patch-id receipt would make this second path meaningful instead of a duplicate.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-06T18:20:24.129698126Z
  modified_at: 2026-11-06T18:20:24.129698126Z
  session_id: 3dd100c3-f8c0-44d9-ac4c-f9ff0eb32a27
- id: 01a1b23b-e39a-7152-a4d7-97032b8ea081
  author: mcp
  content: 'Round 2 addresses findings 1–3: replaced the rebase fallback''s full-tree comparison with a nonempty git-cherry receipt requiring every original PR commit to have an equivalent patch on the independently fetched base. Common ancestry is required; merge commits in the original range and changed/missing patches remain unconfirmed. Extended real-Git regressions cover a two-commit PR rebased over real base content, confirmation after later unrelated content lands, original head absent and already local, partially landed patches, actual conflict resolution changing the patch-id, unavailable heads and unchanged checkout/FETCH_HEAD/tracking refs. The moving-base fixture also exposed opportunistic tracking-ref updates; private fetches now use --refmap= to prevent them. Validation: cargo test -p aida-cli-lib --lib forge_observed::forge_observed_tests: 18 passed; cargo fmt --all -- --check and git diff --check passed. Four files changed, including lifecycle docs and caller comment. Native-seat edits remain uncommitted for host publication. Existing PR merge-hold clearance remains outside this implementation.'
  created_at: 2026-11-06T19:00:31.770607877Z
  modified_at: 2026-11-06T19:00:31.770607877Z
