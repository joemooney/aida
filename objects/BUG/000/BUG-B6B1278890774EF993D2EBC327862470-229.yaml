  content: 'Implemented standalone native-seat fix: forge-reported Merged observations without existing landing evidence may recover the exact pinned original head through a private origin fetch bounded by the existing 30-second Git runner. Full-tree equality with the independently fetched base is required; unavailable heads and conflicting trees remain unconfirmed, with no completion/cleanup authority. Open/Closed checks retain their existing behavior. Added a real rebase/fresh-clone regression covering absent original objects, conflicting/unavailable heads, non-actionable reads, temporary-ref cleanup and unchanged FETCH_HEAD/tracking/checkout; documented conservative later-base-change limit. Validation: cargo fmt --all -- --check and git diff --check passed; manual real-Git rebase/private-fetch fixture passed. untested=true: targeted cargo test --profile agent -p aida-cli-lib --lib story_2401_forge_observed_tests refused because this native session has no lane job runner. make check-ci-fast stopped while its first Cargo check waited for a shared build slot (exit 130). Host must run targeted Rust tests and fast gate. Four files left uncommitted; no commit, push, PR, queue completion, ship merge, or review record performed.'
