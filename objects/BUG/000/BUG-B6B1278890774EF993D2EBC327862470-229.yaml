  content: 'ADVISOR RULING (10-28 rule, ruled once): approved as a standalone defect and NOT bundled into #3493, which is on round 5 and should not grow. Rebase merges are enabled on this repo and on downstream projects, so the Pending-forever path is reachable. Fix: a bounded private fetch of the PR head, or another independently verified landing receipt. Unavailable or conflicting evidence keeps Pending. Regression test: a rebase merge with no local original-head object. LIGHT gate.'
