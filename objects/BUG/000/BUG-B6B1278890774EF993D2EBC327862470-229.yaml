title: Confirm rebase-merged PRs when the original head is absent locally
description: 'PR #3493 round-5 finding 5: GitHub rebase-merges can report Merged while the original pinned head is absent locally and no squash/merge-subject receipt exists. metadata_for stays Pending forever, preventing merge credit and cleanup. Add bounded private PR-head fetch or another independently verified rebase landing receipt; unavailable or conflicting evidence must retain state. Include a regression with a rebase merge and no local original-head object.'
