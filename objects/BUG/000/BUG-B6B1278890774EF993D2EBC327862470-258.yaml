  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2493):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 873f6fa5ad4f
    Recorded: 2026-11-08T07:07:06.398644950+00:00
    Findings:
    1. AC4 (acc3c05a) partial: aida-cli-lib/src/standalone_implementer.rs:106-114 NATIVE_STOP_CONTRACT, appended to every standalone native Codex lane and stated to override the ordinary pickup shipping unit, still describes aida ship -m with no mention of --commit-body-file, and no test asserts any prompt names the surface (the criterion is listed untraced). Add the surface to the contract and assert it in story_1662_standalone_implementer_tests.rs alongside the pickup templates.
    2. aida-core/templates/skills/aida-pickup.md:38-40 and commands/aida-pickup.md:29-30 tell a lane to write a body file without saying where. The host stages with git add -A -- . (aida-cli-lib/src/seat_clone.rs commit_pending), so a body file in the seat tree is committed into the PR. Direct lanes to an ignored or temp path (or delete it after declaring), and say so in the prompt.
    3. AC2 (ac581f10) partial: --from-seat --commit-pending --commit-body-file is only clap-parsed (bug_home_038_seat_publish_tests.rs, task_2902_native_ship_message_records_only_and_dry_run_does_not_write, assert on ShipArgs.commit_body_file). Nothing proves the pr_cmd.rs run_ship with_body join reaches FromSeatOptions.commit_pending, nor the refusals for --from-seat without --commit-pending and for non-native -m. Add a test driving that path, or extract the message assembly and test it.
    4. docs/cli/04-git-lifecycle.md:149 ('Only the subject supplies completion IDs') and skills/aida-pickup.md ('completion IDs still come from the subject') are inaccurate: db_reconcile.rs:2270-2277 and trailer_coverage.rs commit_completion_ids harvest trailing (SPEC-ID) groups from squash-body lines on (#N) commits, and ship only neutralizes uncovered IDs. A body line ending in a covered (OTHER-ID) completes that spec. Correct the text and warn against trailing (ID) groups in bodies, or strip them at declaration.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
