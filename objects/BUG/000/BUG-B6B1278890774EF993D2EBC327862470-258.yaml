title: 'Native lane publication declaration is subject-only, so a lane can never add a required commit-body trailer (Help-Golden: unchanged); PR-3635 lost three review rounds to it'
description: |
  PR-3635 (TASK-3425) spent rounds 1-3 blocked on one missing commit-body line, `Help-Golden: unchanged`, which scripts/check-help-golden-cochange.sh requires when a *_args.rs / command_registry.rs change leaves --help unchanged. The native Codex lane cannot author commits (its .git is read-only); it declares a publication message, and the host commits it (`aida ship --from-seat ... --commit-pending "<msg>"`, and the advisor's auto-publish). The declaration API accepts only a subject line, so no lane can ever satisfy a guard that reads a commit-body trailer. The lane wrote "the host must add a commit with this exact message" into its evidence doc, and the advisor added it by hand (0f0c2bc07ff).

  Acceptance:
  1. The lane publication declaration carries an optional body (or a list of trailers); the host commit writes it verbatim after the subject.
  2. `aida ship --commit-pending` accepts a body (e.g. --commit-body-file or repeated --trailer) and keeps today's single-subject call unchanged.
  3. A native-lane fixture whose declaration includes `Help-Golden: unchanged` produces a host commit on which check-help-golden-cochange.sh exits 0.
  4. The lane pickup prompt names this surface where it lists commit-message trailers.
