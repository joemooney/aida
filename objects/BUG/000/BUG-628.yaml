title: 'BUG-626 epic-rollup edge cases: archived-completed children excluded from rollup; rel-add guard reads stored status while display reads derived'
description: 'Found during epic decomposition. Two inconsistencies in the BUG-626 epic-status rollup: (1) EPIC-46/47/30 are substantially shipped (children Completed but ARCHIVED) plus a few open follow-ups, and derive to Draft instead of Completed/InProgress — archived completed children appear to be excluded from child_status_rollup, so an epic whose done children are archived reads as un-started. The rollup should count archived-completed children toward done. (2) aida rel add reports "parent EPIC-46 is Completed" (the STORED status) while aida show/cache report Draft (the DERIVED rollup) — the completed-parent guard and the display use different status sources; unify them on the derived value. Neither blocks decomposition but both confuse epic-status legibility.'
