- id: 01a21acc-9f51-7040-96f2-e74eb956e152
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2759):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 2b87920bb9e1
    Recorded: 2026-11-27T02:17:55.388830998+00:00
    Findings:
    1. AC1 unmet: the spec requires 'a test asserts the reason text for at least the push-race and merge-refusal paths'. No test asserts the push-race reason text. bug_2759_reconcile_retries_once_after_a_concurrent_push covers only the successful retry. Neither the race-exhausted failure line (remote_create.rs:2974, 'rejected — a concurrent push moved it again after 2 reconcile attempts') nor the retry warning (:2650) is checked. Fix: add a test whose push closure races origin on every call. Assert that reconcile_with_push errs after exactly RECONCILE_ATTEMPTS passes, that the reported failure names origin and the concurrent-push cause, and that the push seam was called twice for origin. The same test also covers AC2's bound.
    2. The returned error on push failure (remote_create.rs:3016) says only 'the union is committed locally but N hub(s) did not receive it — re-run ... once they are reachable'. It names no hub and no cause, and for a race that 'once they are reachable' wording is misleading. Per-hub causes reach only stderr or the JSON push_failures. Folding push_failures (joined with ' | ') into the bail message would keep the cause in the agent-mode error block too. Follow-up acceptable.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
