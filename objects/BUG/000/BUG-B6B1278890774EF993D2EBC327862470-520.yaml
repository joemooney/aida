title: remote reconcile refusal prints no reason, and has no retry on a concurrent-push race (aida-store hubs diverged all day)
description: |
  Seen 2026-11-24 (filed by product-15 per advisor-122 18:04). The hourly `aida remote reconcile --execute` cron job (home hub) failed every run since ~00:47Z, so aida-store DIVERGED between gitlab and origin (hub-drift-guard red). Early runs: "union committed locally … pushed → gitlab; ⚠ origin: rejected (raced by a concurrent push — re-run reconcile)". Then 13+ runs (incl. a manual run with RUST_LOG=debug) print ONLY: "reconcile refused; nothing was pushed; the local store is back at <sha>", with no cause. The dry-run plan itself is clean (union-merge 2 diverged tips, push to gitlab + origin).

  ## Acceptance
  - AC1: Every reconcile refusal NAMES its cause (which check refused, which hub/ref, and the underlying git/merge error). A test asserts the reason text for at least the push-race and merge-refusal paths.
  - AC2: A BOUNDED retry (e.g. up to 2 attempts with re-fetch + re-union) when a push rejection is a fast-forward race from a concurrent writer. Test with a simulated race.
status: InProgress
priority: High
