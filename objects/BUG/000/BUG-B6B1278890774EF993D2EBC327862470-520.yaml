- id: 01a21ac1-9140-7fc0-9d0b-443f68cb592f
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 42d1cc55e8 (git diff origin/main...HEAD: remote_create.rs, scripts/store-writers.toml).

    Acceptance evidence (behavioral-test, executed via lane job, 3/3 pass; the full remote_create::tests module also ran at 70/71 before a test-fixture fix):
    - Consent gate (comment 7): bug_2759_consent_gate_skips_emails_every_hub_already_has. An email already on every hub passes and is pushed to both. A genuinely new email is still refused, the message names the email and the hubs it is new to, and the text 'one hub only' is gone. The absent-hub refusal path is unchanged (reconcile_refusal_displays_merge_validation_cause still passes).
    - AC2 bounded retry: bug_2759_reconcile_retries_once_after_a_concurrent_push. Through an injected push seam, a second clone really pushes to origin just before reconcile's push. Attempt 2 re-fetches and re-unions, and both writes land on origin and mirror. RECONCILE_ATTEMPTS=2. Only PushFailure::NonFastForward retries; a declined, protected or unreachable push reports git's stderr instead of the old misleading 'raced' text.
    - AC1 / comment 4 (agent output mode): bug_2759_agent_error_block_keeps_every_cause. The reconcile error, including a multi-line git cause, is flattened to one ' | '-joined line, and agent_error_block (the path used when stdout is redirected) keeps every cause.

    Probe findings / fixes:
    - P2: a registry diff line that opens with an email tokenized as '+addr' and never matched the hub's copy, which would have refused a known email (fail-closed, but a false positive). Fixed by stripping the diff marker. The test now uses that line shape.
    - P5: the gate fails closed. If git grep cannot read a hub's registry, that hub counts as having no emails. Hub tips whose objects cannot be listed were already refused earlier ('cannot list the objects'). No test was weakened.
    - The store-writer inventory rows moved: handle_remote_reconcile now goes through push_exact_outcome, and the lock moved into reconcile_pass. Only those 3 rows were changed.

    Residual risks: the gate still counts emails new to a hub that is read but not one of this clone's push hubs (pre-existing). Email comparison is case-sensitive, so a mixed-case copy is refused (fail-closed). After a raced attempt 1, the local store keeps union 1 and attempt 2 builds on it. The diff is about 280 lines (about 130 of them tests), slightly over the 250 budget. make check-ci-fast passed (exit 0) at this HEAD.
