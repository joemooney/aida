title: Guided Codex launch in zen_drive_root sets AIDA_SESSION_ROLE without codex_tool_env::prepare_launch or a grant decision
description: 'Found in the PR #3256 review (BUG-2395). zen_drive_root.rs launches a guided Codex session that sets AIDA_SESSION_ROLE but bypasses codex_tool_env::prepare_launch and makes no grant decision, so it is listed as a KnownGap in ROLE_LAUNCH_SITES. Expected: the launch goes through prepare_launch with an explicit grant decision (delegate or refuse), like every other Codex launch site, and the KnownGap entry is removed so the ratchet enforces it. Acceptance: ROLE_LAUNCH_SITES has no zen_drive_root KnownGap, and a test asserts that the guided Codex argv and env come from prepare_launch.'
