title: Train coverage proof embeds every rider review record twice and exceeds the 16 MiB evidence cap, so green trains fail to merge
description: 'Observed 2026-11-12 11:24 MST: train PR #3888 (riders #3830, #3846) went green, then failed at merge with ''could not invoke gh pr merge: invalid train evidence file''. .aida/gate-ledger/PR-3888.jsonl is 23 MB: its single train-coverage event''s proof.sources[0].originals holds 215 entries (107 BUG-2522 + 108 PR-3830), each carrying the full review record (40 rounds) both as .record and as .ledger_reference.record. pr_train_verified.rs validate_ledger refuses any evidence file over 16 MiB (or nlink!=1), so any rider with a long review history (PR-3830''s own ledger is 4.4 MB, 183 lines) makes the train unmergeable after a full CI run. Acceptance: (1) the train-coverage proof references rider evidence by digest/seq (or embeds only the latest record per key, once), so its size is bounded independent of review-round count; (2) the train computes and checks evidence size BEFORE opening the train PR and running CI, ejecting or shipping-alone any rider that would exceed the cap, rather than failing after CI; (3) regression test: a rider with 40+ review rounds and 100+ ledger lines lands in a train.'
