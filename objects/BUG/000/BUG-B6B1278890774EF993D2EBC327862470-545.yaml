    # BUG-2784: a union merge driver for scripts/ratchet-set.json (advisor-122 approved, MEDIUM; product-15). Lane: CLAUDE. MAIN, NEW branch bug-2784-ratchet-union-merge. <=150 lines. Completing (BUG-2784) trailer.
    READ: `aida show BUG-2784`. Context: today TASK-3869 needed THREE fresh slices because every base merge conflicted only in scripts/ratchet-set.json, where parallel PRs append test names to the same lists, and conflict repair is codex-only. Make that file merge cleanly: a .gitattributes merge driver (custom, e.g. a small JSON-aware union script registered by the repo setup/doctor), or restructure the file so parallel additions don't touch the same lines (e.g. one entry per line, sorted, or per-group fragment files). Prefer the approach that also works on GitHub's server-side merges and in the train (a custom driver only works locally, so consider the restructure). Keep check-ratchets.py's reading semantics identical, and keep the expected_tests counts correct.
    TESTS: two branches adding different tests to the same group merge without conflict, and the result contains both.
    One targeted test run, make check-ci-source, then publish a NEW PR to main. COMMIT and PUSH before the final gate.
