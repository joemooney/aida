  author: joe
  content: |-
    INTEGRATION NOTE for the BUG-2784 lane (design caution): git's built-in  driver is line-based and unsafe for JSON. When two sides each append a string after the same last element of a list, union keeps both lines verbatim. One of them then lacks the separating comma, or a trailing comma lands before ']', so the result is invalid JSON or silently wrong. In ratchet-set.json the conflicting entries are usually the last element of a "tests" array.
    Options:
    - (a) A custom merge driver (a small script) that parses ours, theirs and the base, unions the arrays per source entry, and re-serializes deterministically. It must exit non-zero on anything it cannot parse.
    - (b) Change the file format so union is safe: one entry per line, with no separators to reconcile.
    - Either way, add a test that merges two disjoint appends to the same array and asserts the result is valid JSON containing both entries.
    Also confirm the driver config travels to lanes and CI. A .gitattributes merge= line needs a [merge "name"] driver entry in each clone's git config. Built-in union needs none, but it is unsafe here.
