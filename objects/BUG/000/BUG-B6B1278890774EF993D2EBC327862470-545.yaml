  author: dirtlab
  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (fixture):** `tests/test_json_union_merge.py` builds a temp git repo with the .gitattributes entry and the driver configured, merges two branches that each add a different test to the same ratchet group (and one adds a new group), and asserts a clean merge, valid JSON, both entries present. Rework prep configures the driver per git invocation (host `-c` and sandbox GIT_CONFIG_*), pointing at the primary checkout's trusted copy of the script, never the lane's copy.
    - **AC2 (fixture):** same test file: both branches change the same scalar differently -> driver exits non-zero, git reports a conflict.

    ### Expected files
    - `scripts/json-union-merge.py` (new driver)
    - `.gitattributes` (allowlist: scripts/ratchet-set.json)
    - `aida-cli-lib/src/seat_clone.rs` (register driver in rework-prep git)
    - `tests/test_json_union_merge.py`

    ### Ambiguities / conflicts as questions
    - GitHub server-side merges ignore custom drivers; the brief prefers a restructure but the acceptance names the driver. Following acceptance; a missing/unconfigured driver falls back to the ordinary text merge (today's behavior), so it fails closed.
