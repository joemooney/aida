    ## Implementer self-review
    Reviewed HEAD: 9afeaa251d

    Acceptance evidence
    - AC1 [behavioral-test]: tests/test_json_union_merge.py::test_disjoint_additions_to_one_group_merge_cleanly (two branches add different tests to one group plus a new group/shared module; git merge and merge-tree succeed, result is valid JSON with both). Rust: seat_clone::rework_merge_tests::bug_2784_rework_git_unions_disjoint_json_list_additions proves json_union_merge_config (the env rework prep applies to every rework Git call, host and sandboxed) makes merge-tree clean. Both pass.
