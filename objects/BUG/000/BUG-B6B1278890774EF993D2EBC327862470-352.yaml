  author: dirtlab
  content: 'Rework for the 14:42 ruling pushed as af161ee1d7 on PR-4062. (1) gc now protects by identity before any branch/HEAD/remote evidence: primary checkout, store worktree (attached .aida-store, configured store_path, or store layout), and any non-linked repository; inventory skips the store too; new test bug_2587_detached_store_and_primary_trees_are_never_eligible keeps a detached store whose HEAD is on the remote. (2) Criterion traces now use the spec''s own id; aida criteria reports no untested criteria. Gate: worktree_lifecycle_gc run 24 passed / 1 failed (task_1222_ended_clone_requires_origin_coverage_and_closed_pr: mail retention writer-admission scan refused in the lane sandbox, after the new guard; not confirmed against the previous head). make check-ci-fast cannot complete in this seat (sandbox read-only /tmp at the containment conformance tests); relevant gates run individually and pass, aida-ci-guards ratchets not run. Open question: no config key names protected worktrees today, so ''config-named'' covers the configured store path only; no new key added. Details in the PR comment.'
