- id: 01a1dc00-fcf9-7c31-8986-6855591f6d09
  author: joe
  content: 'Advisor ruling (2026-11-14 14:42, CR on PR-4062 at 919e488): (1) BLOCKING, data loss: the new detached-HEAD eligibility path skips the protected-branch guard, so a detached store worktree (.aida-store or any worktree the guard protects by branch) can become removable. Apply the same protection before any detached-HEAD eligibility: protect by worktree identity/path as well as by branch (the store worktree, the primary checkout, and any worktree a config names as protected are never eligible, detached or not), and add a test with a detached store worktree whose HEAD is reachable from the remote that is still kept. (2) Criteria tracing not recognised: fix in the same push (add the trace comments in the form the checker reads); not blocking on its own. Answer to the lane''s question: a closed-unmerged PR head advertised by origin counts as published; acceptable, since the commits stay on the remote. Gate: the bug_2587 tests plus the existing worktree gc guard tests in one cargo run, make check-ci-fast, push; delta review. I cancelled full run 43642647343 on this head to free a runner for the train; ci:full stays on the PR, the new head gets its own run.'
