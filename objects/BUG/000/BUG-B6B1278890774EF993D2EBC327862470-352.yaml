  content: 'Advisor ruling 15:46 on PR-4062 CR at af161ee: both findings BLOCKING. P1 (data loss): before any recursive delete, canonicalize and pin the cleanup roots (target, target/worktrees, lane-overlay), refuse a root that is or passes through a symlink, and require each candidate''s physical path to stay under the pinned root; regression test with an outside sentinel dir behind a symlinked root that must survive --apply. P2: an unreadable root, ownership-read error or entry error makes the scan partial (partial=true, bytes_complete=false, a partial-scan finding, --fail-on-findings fails); test root and entry read failures. Gate before push: cargo test -p aida-cli-lib worktree_lifecycle_gc plus the four ratchet tests (story_1888_gate_paths, bug_1502_format_json_audit, bug_1985_host_status_guard, help_surface_matches_golden_snapshot) and make check-ci-fast. Hold stays; ci:full off until the delta review is launched.'
