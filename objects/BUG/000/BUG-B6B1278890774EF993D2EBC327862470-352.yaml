  content: 'Advisor triage (2026-11-14 13:55): Approved as written, main track, LIGHT gate (one targeted cargo test run of the worktree gc tests plus make check-ci-fast). Rulings: a detached-HEAD worktree is eligible only when its HEAD is reachable from the default branch or a remote PR head AND the tree is clean AND no live lease names it; anything else is kept with the plain reason. Target-dir reclamation removes only directories whose session/worktree no longer exists, never one a live lease or running process uses; print what would be removed and its size before --apply removes it. Not an architecture change.'
