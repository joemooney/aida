  content: 'Advisor ruling 2026-11-16 11:14 (advisor-117): #4174 head 9b3eba2 is RED on full CI (run 43921617057) because of its own completion-range changes (trace.rs, review_git_evidence.rs). (1) CI gates, trace gate step: ''./target/debug/aida trace gate --range origin/main..HEAD'' fails with ''cannot resolve completion range ancestry'' on a normal PR checkout, where origin/main is fetched as FETCH_HEAD plus a new branch ref. (2) CI lib-0: seat_clone::seat_publish_tests::bug_2431_from_seat_accepts_refs_only_trailer (bug_home_038_seat_publish_tests.rs:1425) and bug_home_038_from_seat_trailer_check_runs_before_push (:1375) panic with ''cannot inspect completion range HEAD..<sha>: refusing to run git in <tmp>/aida-seat-...: it is a contained seat''s private clone''. The new range inspection runs git inside the seat clone, which the BUG-2431 boundary forbids. Do the inspection host-side through the existing safe path, or skip it for from-seat publication. Rework brief: fix both; the squash-landed constituent exclusion stays. Before pushing, run cargo test -p aida-cli-lib seat_publish_tests, then cargo build -p aida-cli && ./target/debug/aida trace gate --range origin/main..HEAD in a fresh clone, plus the lane pre-push gate. ci:full is removed and a hold is placed. Rework runs codex. (The gates log line ''tests::lane_fixture_fails FAILED'' is an intentional fixture, not this failure.)'
