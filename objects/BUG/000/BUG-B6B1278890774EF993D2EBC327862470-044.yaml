title: Headless implementer lanes end their turn while their own background test runs are still going, so the lane exits with no push and needs a manual --resume
description: '2026-10-30: BUG-041 (lane 041c, result ''Waiting on the aida-core test build.''), BUG-038 (lane 038d, result ''Both runs are in the background; I''ll pick up results when they finish.'') and BUG-040 each needed a manual --resume; 041c had 12 modified files uncommitted at exit. The HEADLESS WAITING RULE in the prompt does not prevent it. Fix in the launcher, not the prompt: when the vendor returns a final result while the seat still has live child processes (cargo/rustc/test binaries started by the session) or the result text matches a waiting-on-background pattern, auto-resume the same session (bounded, e.g. 3 times) with a ''your background run finished; continue'' message once those children exit, instead of reporting no-pr. Also: when no-pr is reported and the seat has uncommitted changes, say so in the implementer: line. Tests with a mock vendor.'
