  content: |-
    ## Implementer approach

    (Resumed session: implementation was already drafted before this comment.)

    ### Acceptance criteria as tests
    - **Unit:** `resume_reason_needs_a_final_result_a_resumable_vendor_and_budget`, `the_reported_parking_results_read_as_waiting_and_a_finish_does_not` — live child build work or a waiting-on-background result text triggers a resume, bounded by MAX_AUTO_RESUMES=3.
    - **Unit (linux):** `a_held_vendor_is_reaped_only_once_the_hold_lifts`, `a_vendor_that_resumes_after_its_held_work_is_not_reaped` — the linger reaper does not kill the vendor tree while its own build runs.
    - **Command-level, mock vendor:** `a_run_parked_on_its_own_build_is_waited_for_and_resumed` (waits for the child build, then `--resume <same session>` with the continue message), `a_run_that_keeps_parking_is_resumed_a_bounded_number_of_times` (3 resumes then no-pr), `a_run_that_did_not_park_is_not_resumed`.
    - **Unit + command-level:** `a_no_pr_report_names_the_uncommitted_paths` — `implementer: no-pr uncommitted=<n>`.

    ### Expected files
    - `aida-cli-lib/src/headless_background.rs` (new), `headless_linger.rs`, `session.rs`, `standalone_implementer.rs`, `lib.rs`
    - `aida-cli-lib/src/tests/bug_044_headless_background_tests.rs`, `story_1662_standalone_implementer_tests.rs`
    - `docs/cli/03-work-autonomy.md`

    ### Ambiguities / conflicts as questions
    - Scope is the standalone implementer launcher (`aida implement`-style lanes); the --auto-complete drain path is not changed here. Is that the intended surface? (Lanes 038d/041c were standalone launches.)
