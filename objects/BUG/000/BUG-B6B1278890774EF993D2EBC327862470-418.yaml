  content: 'Implemented service-specific live-binary selection for deputy review/train controllers and deputy-loop runner restarts, including AIDA_BIN projection; ordinary same-seat controls retain /proc/self/exe. Added read-only stale-image warnings to promotion, bindings heal, and fenced-ledger doctor scans. Stale findings use a separate report-only heal group so they cannot block the safe bindings bootstrap. Added recovery/coverage notes in docs/internal/testing/bug-2654-stale-service-binaries.md. Validation via lane runner: final bug_2654 filter 2 passed; launch::control::tests 2 passed (plus its replacement child test). Changed Rust formatting and git diff --check pass. Existing supervisors need one restart after active jobs finish; stale relays and already-running old workers require operator rotation. No fence changes, process termination, lost-review replay, commits, or publication performed in this native seat.'
