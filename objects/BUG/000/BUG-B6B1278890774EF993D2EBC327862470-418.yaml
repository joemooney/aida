title: 'Gate-ledger appends fail with ENOENT on live 6bb1cf1 (promotion 17 bindings): train #4210 not merged, PR-4057 approval lost'
description: 'Since live binary 6bb1cf1 (promotion 17, BUG-2531 gate-ledger bindings) was promoted at 02:02 MST 2026-11-17 and ''aida doctor --heal --category gate-ledger-bindings'' ran at 02:07 (330 ledgers, 291 bindings): (1) auto-train #4210 (member #4188 at fd26973) stopped unmerged: ''persisting train coverage audit: could not append to the gate ledger /home/joe/ai/aida/.aida/gate-ledger/PR-4210.jsonl: No such file or directory (os error 2)''. (2) Reviewer for PR-4057 (Opus, integration track, 02:22) produced APPROVED at 695c545 but queue work''s verdict collection failed: ''could not record the verdict on the PR-4057 gate ledger: could not append to the gate ledger .../PR-4057.jsonl: No such file or directory'' although that file exists. (3) PR-4135''s verdict at 02:32 recorded fine on the same binary. Same mount namespace for all (not a sandbox view). store.rs named() labels ANY append error with the ledger path, so the ENOENT may come from bindings::bind/certify_empty/ensure_dir/fsync_dir rather than open_append. A rollback is not possible: format-2 sentinel stops older binaries writing. Landing impact: every train''s coverage audit appends to a new PR-<train>.jsonl.'
status: NeedsAttention
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
