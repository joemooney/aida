title: aida init should push the orphan branch automatically when origin exists
description: |
  After `aida init`, the user must manually run `git -C .aida-store push -u origin aida-store` before `aida node acquire` will succeed. The acquire path's CAS push loop needs origin to have the branch.

  Fix: `aida init` auto-pushes the orphan branch when an origin remote is configured. Skip silently when no origin exists (single-machine projects work the same).

  Surfaces in 2026-05-09 polished walkthrough — only remaining manual git command in the bootstrap flow.
