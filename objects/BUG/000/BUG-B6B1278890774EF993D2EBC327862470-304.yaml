title: 'CI gates flake: bug_2383_bwrap_overlay_first_job_sees_a_prebuilt_dependency_as_fresh fails with ''target/agent has no fingerprints'', red-lighting trains'
description: 'Since ~18:20Z 2026-11-12 the ''Live bwrap OS-wrap confinement gate'' step (CI gates shard) fails intermittently on unrelated heads: train #3889 (job 131397770897), PR #3890 (job 131398695557), PR #3832. Main at 0d6c60e passed it at 17:22Z; PRs #3884/#3887/#3824 passed it. Failure: ''the lane could not use the overlay or bwrap: seed: cold (overlay: .../target/agent has no fingerprints)''. Test: aida-cli-lib/src/tests/bug_2383_seat_target_overlay_tests.rs:1044. A red gates shard makes trains bisect (train #3889 -> #3891), costing a CI cycle per flake. Acceptance: (1) root-cause the cold-seed/no-fingerprints race; (2) the test passes deterministically (repeat-run evidence), no retry-as-fix.'
status: InProgress
priority: High
