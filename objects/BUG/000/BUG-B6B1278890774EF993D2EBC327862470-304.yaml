- id: 01a1d199-80a5-7ab1-8cc6-f9eedae463fe
  author: joe
  content: '[advisor 14:15] Scope widened. PR #3902 (overlay fingerprint fix) is green on gates but red on lib-0/lib-1 under rustc 1.100: Cargo 1.100''s new build-dir layout puts test binaries under target/<profile>/build/<pkg>/<hash>/out/ instead of target/<profile>/deps/. Failing: bug_1745_error_channel_tests.rs:32 (expects .../deps), bug_1749_doctor_toon_tests.rs:61, codex_tool_env bug_2398 (test_env.rs:109/test_exec.rs:75), session spawn_and_resume_children_carry_their_own_vendor_harness_version. Rework #3902: make every test-runner/binary path lookup layout-agnostic (deps OR build/*/out), keep the overlay fix, and in the same PR remove the 1.99.1 pin from ci.yml so CI proves 1.100. Jobs: 131483598899, 131483598941.'
