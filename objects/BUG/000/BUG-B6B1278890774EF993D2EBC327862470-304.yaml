comments:
- id: 01a1d119-6810-7f81-95b6-65589a91a298
  author: dirtlab
  content: 'Root cause: failing GitHub job 131398695557 upgraded stable from rustc 1.99.1 to 1.100.0 on 2026-11-12. Its verbose cargo output puts dependencies under agent/build/fixture-dep/<hash>/out, with unit fingerprints under build/<package>/<hash>/fingerprint, while generation_id only recognized agent/.fingerprint. This is a toolchain rollout/layout incompatibility, not a cold-seed race. Implementing recognition of both layouts and copied new-layout build state; lane-runner validation pending (host currently 1.99.1).'
  created_at: 2026-11-12T18:51:05.616030767Z
  modified_at: 2026-11-12T18:51:05.616030767Z
