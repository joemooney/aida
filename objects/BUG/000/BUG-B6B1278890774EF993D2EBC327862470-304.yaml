  author: joe
  content: 'Integration session: PR #3902 merged into integration and CI unpinned to @stable (14f69472d84). #3902''s own CI ran on the 1.99.1 pin, so verified locally on rustc/cargo 1.100.0 (dev profile, fresh target dir, confirmed new build/<pkg>/<hash>/out layout with no deps/): AIDA_REQUIRE_BWRAP_LIVE=1 cargo +1.100.0 test -p aida-cli-lib --lib over bug_2383/bug_1745/bug_1749/bug_2398/spawn_and_resume_children/test_exec/bug026/task_1471: 34 passed, 0 failed, incl. the live bug_2383_bwrap_overlay_first_job_sees_a_prebuilt_dependency_as_fresh. check-ci-fast green. First full 1.100 CI proof comes with the next promotion to main.'
