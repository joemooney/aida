title: Contained-seat deny rules emit Write/MultiEdit/NotebookEdit path patterns that Claude Code warns never match
description: '2026-10-29 18:33: every `aida agent new claude` contained launch prints ~30 warnings: ''Deny rule MultiEdit(//…/.git) matches no tool'' and ''Deny rule Write(//…) never matches · use Edit(//…)'', for .git, .aida-store/.git and .aida/sessions in the primary checkout and the seat clone. Current Claude Code applies path deny rules through Edit(...) (which covers all file-writing tools); MultiEdit no longer exists. Acceptance: the generated settings emit one Edit(<path>) and Edit(<path>/**) deny per protected path (plus Read where intended), no Write/MultiEdit/NotebookEdit duplicates; a launch prints zero deny-rule warnings; a test pins the emitted rule set.'
