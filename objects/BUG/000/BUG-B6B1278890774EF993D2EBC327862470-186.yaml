title: 'merge_lock holder liveness ignores PID namespaces: a sandboxed train''s merge lease reads as dead, so the BUG-2412 live-lease guard can close a live train PR'
description: 'From the STORY-2325 signoff (A5). merge_lock::Holder records no pid_ns or boot; stale_reason checks only the host before calling the lenient holder_alive, so a holder in a foreign PID namespace (every sandboxed Bash call) reads as absent, which reads as dead. live_trains filters merge leases through merge_lock::live_status, so the BUG-2412 ''a live merge lease protects this train PR'' guard rests on a namespace-blind check. Expected: record pid_ns and boot on Holder (reuse the cache_lock helpers); a foreign or unrecorded holder is TTL-only (never judged dead by pid). Regression test: a holder from a foreign pidns is not judged dead before its TTL.'
