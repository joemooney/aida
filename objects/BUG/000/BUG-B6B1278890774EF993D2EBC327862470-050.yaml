    ## Implementer findings (not filed as draft TASKs: `aida add` hit a read-only filesystem in the seat sandbox, and the MCP file_finding tool is denied in dontAsk mode)

    1. **followup-suggestion (minor):** the resume safety net for a parked lane (`headless_background::resume_reason`) is wired only into the standalone implementer launcher. The `--auto-complete` drain's own phase-1 implementer has no equivalent backstop. The argv change in this bug lowers how often a lane parks on every path.
    2. **design-choice (minor):** background tasks are turned off through `CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1` in the headless `--settings` env. The process env was not used: there are 5 headless spawn sites but only 2 argv builders. Uncontained lanes now get a `--settings` document holding only that env. I confirmed the variable exists in the Claude Code 2.1.316 binary, but did not confirm with a live run that the settings env reaches the background-task check. If it does not, also set it on the child Command next to `AIDA_HEADLESS=1`.
    3. **design-choice (minor):** a PR still on its launch head, on a clean seat, stays `pr-opened`, because that round had nothing to change. With uncommitted paths it reports `no-pr reason=uncommitted-work`.
