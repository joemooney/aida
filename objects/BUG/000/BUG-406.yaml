title: aida --help does not indent wrapped command descriptions
description: aida --help emitted long command descriptions as single physical lines. The terminal wrapped them visually, but continuation lines started at column 0 instead of under the description column, making the command list hard to scan. Other CLI tools detect terminal width and wrap/indent descriptions themselves. Fix the clap help configuration so command and option descriptions wrap at terminal width with continuation indentation.
