title: 'Headless lanes run in untrusted seat worktrees: Claude Code ignores the project allow-list and denies lane Bash calls'
description: |
  Every headless `aida queue work --no-human` lane starts with "Ignoring 8 permissions.allow entries from .claude/settings.json: this workspace has not been trusted". The seat worktree (aida-worktrees/aida-seat-aida-<spec>) is created fresh at launch and has no ~/.claude.json trust entry, so Claude Code drops the project allow-list and the lane's Bash calls are denied. Seen 2026-10-31: the BUG-046 rework lane took 12 denials and rotated with about 1,160 lines uncommitted. The BUG-048 and STORY-099 lanes also logged denials. The operator authorized trusting aida-worktrees/* seats on 2026-10-25. Today an agent can only add the entry by hand, after the seat exists, which is always too late.

  Acceptance:
  1. Before it spawns claude in a seat worktree, the headless launcher (and `aida worktree add` for claude --bg) writes projects["<seat>"].hasTrustDialogAccepted = true plus enabledMcpjsonServers ["aida"], atomically and with a lock-safe read-modify-write. Only for paths under the configured worktrees root and only for vendor claude, so other entries are not touched.
  2. The write is opt-in per host via a config key (default on for this repo), and doctor's worktree-trust check reports it.
  3. Seat dismissal removes the entry, so ~/.claude.json does not grow without bound.
  4. Test: a fixture HOME, launch a seat, and the entry exists before the spawn; dismiss, and it is gone. A path outside the worktrees root is refused.
