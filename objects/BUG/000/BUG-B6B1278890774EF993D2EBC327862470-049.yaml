  content: "## Implementer approach\n\n### Acceptance criteria as tests\n- **Unit (fixture HOME):** `claude_trust` tests — launching a seat (ensure_seat_trusted_in) writes projects[<seat>].hasTrustDialogAccepted=true + enabledMcpjsonServers [\"aida\"], preserves every other entry/top-level key, is idempotent, and leaves no temp/lock litter (AC1).\n- **Unit:** a path outside the configured worktrees root (main checkout, sibling dir, nested path) is refused and ~/.claude.json is untouched (AC1, AC4).\n- **Unit:** opt-in key `[worktree_pool] trust_seat_worktrees` (default off; on in this repo's config) with `AIDA_TRUST_SEAT_WORKTREES` host override; disabled = no write (AC2).\n- **Unit:** remove_seat_trust_in deletes only that seat entry (AC3); doctor reports stale seat-trust entries / mentions the key (AC2).\n- **Command-level wiring:** headless compose (vendor claude only) and `agent new claude --bg` call ensure before spawn; seat_clone destroy + worktree dismiss call removal.\n\n### Expected files\n- `aida-cli-lib/src/claude_trust.rs` (new) + `lib.rs` mod\n- `aida-cli-lib/src/session.rs` (compose_headless_command)\n- `aida-cli-lib/src/agent_launch.rs` (bg dispatch)\n- `aida-cli-lib/src/seat_clone.rs`, `worktree_dismiss.rs` (removal)\n- `aida-cli-lib/src/doctor_cmd.rs`, `doctor_root.rs` comment\n- `.aida/config.toml` (enable for this repo)\n\n### Ambiguities / conflicts as questions\n- \"Per host\" opt-in: resolved as repo config key + env override (host-local). \n- Lock: mkdir `~/.claude.json.lock` (the proper-lockfile convention) with stale-break, then atomic rename; serde_json has no preserve_order so key order of ~/.claude.json may be re-sorted (values untouched)."
