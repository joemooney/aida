  content: 'ADVISOR RULING (2026-11-03 11:35) on the integration-seam fork: one PR covering all ACs. For a Codex lane, dispatch does NOT pre-create the worktree. It delegates to the STORY-2254 lifecycle by adding ''--branch <name>'' and ''--base <ref>'' to ''aida agent new codex --bg''; session_start then creates the lane''s own lease and worktree on that branch (take: base origin/<pr-branch>, existing branch; impl: new named branch from the default branch). Claude lanes keep the current dispatch-prepared tree. The dispatch token and permit checks run before the agent new call, unchanged. Outcome = the ''accepted:'' spawn line, never the model result. Include the occupancy fix (dispatch.rs:1878). Tests as in your approach comment, plus one for --branch/--base in agent new. LIGHT gate: one targeted cargo test -p aida-cli-lib dispatch plus make check-ci-fast.'
