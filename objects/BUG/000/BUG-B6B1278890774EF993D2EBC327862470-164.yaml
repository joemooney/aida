  content: |-
    ## Implementer approach (2026-11-03, blocker STORY-2254 now Completed)

    ### Acceptance criteria as tests
    - **Unit (AC1/AC3):** take/impl with no `--vendor` resolve `[agents] vendor` (via `resolve_headless_vendor`) in `render_lane_prompt` and `run_take_verb`/`run_impl_verb`; explicit `--vendor` still overrides. Fixture: agents.toml vendor=codex makes the rendered prompt show `codex`.
    - **Unit (AC2/AC3):** the Codex lane runs the STORY-2254 lifecycle (`aida agent new codex --bg ... --prompt-file <frozen .prompt.md>`). Outcome = spawn acceptance (`accepted:` line), never the terminal model result. A fake aida bin that sleeps after printing acceptance proves there is no synchronous model wait.
    - **Unit:** occupancy diagnostics also name live Codex lanes (dispatch.rs:1878).

    ### Expected files
    - `aida-cli-lib/src/dispatch.rs` plus its tests
    - possibly `agent_codex_background.rs` / `session_start.rs` (see the question below)

    ### Ambiguities / conflicts as questions
    - **Integration seam (blocking):** dispatch prepares the lane worktree itself: the PR branch `origin/<branch>` for `take`, a named `--branch` from the default branch for `impl`. `aida agent new codex --bg` creates its OWN lease and worktree through `session_start` with branch=None. With an existing explicit `--cwd` that is not an orphan re-entry, it tries to create a new worktree there and fails. It has no `--branch` and cannot adopt a dispatch-prepared tree. How should the two meet? See the punt.
