    IMPLEMENTER STOP — sequencing fork (BUG-2390), 2026-11-02.

    I claimed BUG-2390 (session 01a19c55). I have not changed any code. Blocker STORY-2254 is still In Progress and has not shipped. `git grep` on origin/main finds no detached Codex lifecycle. AC2 (detached Codex launch from dispatch) must reuse that lifecycle. The 2026-11-01 proxy decision says "never bolt on an unscoped process" and "sequence implementation after STORY2254". `aida show` also refuses pickup until the blocker is Completed. So I cannot ship the full acceptance now.

    Fork for the advisor:
    (A) Wait. Re-dispatch BUG-2390 after STORY-2254 merges. (Recommended: one PR covering all acceptance, with no interim Codex path.)
    (B) Split. Ship AC1 now: when --vendor is omitted, take/impl use the configured [agents] vendor, plus the AC3 tests for it. A child spec carries AC2 behind STORY-2254. Risk: until then, a Codex-configured project would route take/impl to the still-blocking synchronous `codex exec` path, which makes the blocking problem more visible.

    I'm releasing my claim so whoever is dispatched next is not blocked.
