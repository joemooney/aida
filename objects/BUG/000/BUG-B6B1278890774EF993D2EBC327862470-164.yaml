- id: 01a1a2c7-3132-7543-a0e4-b0b31770628e
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was punted on: design-fork: STORY-2254 has shipped, but its detached Codex lifecycle cannot take over a lane that dispatch has already prepared. Dispatch take/impl build the lane worktree themselves (prepare_lane_worktree): take checks out the PR branch, impl creates the requested --branch. ''aida agent new codex --bg'' (agent_codex_background.rs:651 -> prepare_agent_launch_attempt -> session_start_with_receipt, branch=None) always creates its own lease and worktree. An existing --cwd tree is re-entered only as an orphan adoption (session_start.rs:1997-2032), and there is no --branch. Proxy decision: reuse the STORY-2254 lifecycle and never bolt on an unscoped process. Options: (A) extend the STORY-2254 path so it can adopt a dispatch-prepared worktree/branch (e.g. a --branch plus a dispatch-owned lease handed to agent new). This changes the signed lease/worktree lifecycle, so it needs an architecture sketch and advisor signoff. (B) For Codex, dispatch skips its own worktree prep and delegates entirely to ''agent new codex --bg --spec''. This drops impl''s requested branch name and breaks take, which must work on the existing PR branch. (C) Split: ship AC1 + tests now (configured-vendor default; explicit override; Codex occupancy diagnostic). Codex take/impl from dispatch refuse fast with a pointer to ''aida agent new codex --bg'' instead of blocking on codex exec. A child spec carries the detached integration via (A).. No triage reason was given.'
