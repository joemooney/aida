- id: 01a213ee-ff27-7e50-a707-1ff8c3036d22
  author: dirtlab
  content: |-
    ## Implementer approach

    ### Root cause (found)
    1. `review --promote-approved-heads` reads only the `PR-<n>` verdict key. `aida review record <SPEC> --verdict approved` with no `--pr` and no reviewer lease records under the spec key (`review_record_change` returns None, so key = spec). The job then finds no verdict and skips silently.
    2. Empty stderr on status=1: scheduled children are non-TTY, so `cli_entry` agent-output mode prints the error block to STDOUT, while `schedule.log` records only stderr.

    ### Acceptance criteria and evidence
    - AC1/AC2 **unit (command-level fixture with gh stub)**: new `bug2764_*` test in review_watch.rs. A spec-keyed approval at the exact PR head is promoted (a) when recorded after FAST completes: next tick adds ci:full; (b) when recorded while FAST is in progress: no edit, then the first tick after FAST completes adds ci:full. The existing PR-keyed test `test_apply_recorded_full_ci` still covers the reviewer-draft path.
    - AC3 **unit**: the promotion returns one line per approved PR (promoted / skipped + reason), which the test asserts. The command prints them to stdout and writes every failure to stderr before exiting non-zero.

    ### Expected files
    - aida-cli-lib/src/review_watch.rs

    ### Ambiguities
    - Fallback scope: a spec-keyed approval is applied only when its reviewed_sha equals the PR head exactly, and only when the PR has no verdict of its own at that head. Recording an approval does not call the forge inline; the 2-minute job promotes within one tick.
