  content: 'CORRECTION: cache rebuild did NOT resolve it (initial description was wrong). Single object uuid 3999e6a2, no agreed_id collision. After delete+rebuild AND explicit ''aida cache rebuild'', requirements_cache still holds status=Draft while the worktree YAML + the add --parent gate both read Rejected. So the cache REBUILD SOURCE disagrees with the targeted-lookup source for the same object — either the rebuild reads a different git ref than the worktree (branch tip vs worktree checkout divergence) or the projection has a stale-row that survives rebuild. Elevated: this is a store-vs-cache divergence a rebuild cannot fix, the worst variant. Repro: aida show EPIC-7 (Draft) vs grep .aida-store/objects/EPIC/000/EPIC-7.yaml (Rejected).'
