  content: 'FINAL diagnosis (superseding both earlier comments — I asserted twice before verifying, wrong both times): git is Rejected EVERYWHERE — HEAD:objects/EPIC/000/EPIC-7.yaml = Rejected, worktree file = Rejected, worktree clean, and the clobber 90d6b6f90 never touched its status (no ±status in that commit). The add --parent gate (git backend) reads Rejected correctly. But requirements_cache.status = Draft even immediately after ''aida cache rebuild'' reports ''2948 projected from git store''. So the CACHE PROJECTION reads a Rejected YAML and writes Draft for this record, and rebuild does not correct it — a deterministic projection bug isolated to (at least) EPIC-7, NOT staleness, NOT the clobber, NOT worktree divergence. Repro: git -C .aida-store show HEAD:objects/EPIC/000/EPIC-7.yaml | grep status → Rejected; sqlite3 .aida/cache.db ''select status from requirements_cache where spec_id="EPIC-7"'' → Draft. Next step for the implementer: instrument the projection for this uuid (3999e6a2) during rebuild — suspect a status-enum parse fallback-to-Draft for some field ordering/format in this specific record. AUDIT RIDER: sweep the cache for other spec_id where cache.status != git HEAD status — there may be more mis-projected records this one exposed.'
