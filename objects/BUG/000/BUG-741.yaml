  author: joe
  content: 'Third occurrence, 2026-07-18 12:18: aida queue list printed ''BUG-739 in progress, but no live session lease — stalled; pick it back up or park it'' while an INTERACTIVE codex implementer (codex /aida-pickup BUG-739, pids 2317723/2317949 — not codex exec) was actively working it in the operator''s terminal and had already committed the fix (c0d1527ac) in aida-pool-aida-0. Two implications for the fix: (1) the false-negative is not limited to the headless codex exec spawn path — the interactive vendor-codex launch also records no usable pid on the lease; (2) a third surface repeats the broken diagnosis (aida ps, aida status <spec>, now queue list''s in-flight hint) — fix the shared liveness probe once, and make every surface''s hint flow from it. Danger remains: following queue list''s hint (''aida queue work BUG-739'' re-pickup) would have double-dispatched a spec mid-flight.'
