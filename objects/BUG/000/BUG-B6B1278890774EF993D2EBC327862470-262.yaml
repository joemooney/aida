title: Conformance harness fixture omits chatgpt.com, so a ChatGPT-auth Codex run fails before any check and reports C0-C4 unknown
description: 'scripts/containment/conformance.py fixture_policy (line 656) sets contained.allowed_hosts to api.openai.com and allow.fixture.test only. The production template (aida-core/templates/contained.toml) also allows chatgpt.com. Operator run 2026-11-08 (~/.aida/conformance-codex-aida-1794150336): contained Codex ChatGPT grant issued, turn.failed ''workspace routing discovery failed'' after 10 reconnects, launch exit 1, all checks unknown, verdict null. Fix: add chatgpt.com to the fixture list and nothing else; the auth hosts stay excluded per the STORY-2593 credential boundary, and deny.fixture.test must stay denied so C3 remains meaningful. Also make the harness report a vendor that never completed a turn as an explicit invalid-run result rather than rc=0 with unknown checks. Acceptance: with the fix a ChatGPT-auth run completes a turn and C0-C4 report real results. Critical path for STORY-2593, STORY-2238, TASK-2688/2689/2690, BUG-2446/2447/2448.'
