title: 'Integration canary PR blocks single-PR trains: ''already has open change'' for every spec merged into integration'
description: '2026-11-12 18:11: ''aida pr train 3902'' (BUG-2539, approved at head, green) stopped early: ''BUG-2539 already has open change #3905 on integration; refusing a second change''. #3905 is the never-merged draft canary (integration->main) that runs full CI on every integration push (STORY-2737 throughput rule 2). Because the canary carries every integration commit, any spec merged into integration can no longer land as a single PR via train, which contradicts throughput rule 4 (approved green single PR ships straight to main). ''aida pr ship'' does not apply the guard (promotion #3904 shipped with #3905 open). Want: the one-open-change-per-spec guard ignores draft canary PRs (e.g. a canary label or base/head integration->main draft), or treats a change already on integration as compatible with landing the original PR.'
