    (a) damaged/unreadable-gitdir-backlink prune, which git does BEFORE checking expiry: never call `git worktree prune` on a store/linked repo; run gc.auto=0 / maintenance.auto=false on ALL our fetches, not only in-transaction ones.
    (b) docs_sweep.rs:1738's fetch runs outside the transaction with auto-maintenance on.
    (c) docs_sweep.rs:1844's direct `git worktree remove --force` must route through guarded removal.
    (d) the live-removal sample→git race (the original AC1/AC2).
    (e) p2: worktree.useRelativePaths backlinks are resolved relative to the admin dir.
    (f) p2: GC dry-run REPORTS the registration cleanup it would do.
    Sketch direction: ONE guarded-removal choke point + a ratchet that bans raw `worktree remove` / `worktree prune` elsewhere.
