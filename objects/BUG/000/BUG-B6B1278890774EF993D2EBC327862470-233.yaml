title: aida agent new --role advisor mints a child grant with no delegable seats and has no --delegate-seat, so a launched advisor cannot dispatch reviewers or implementers
description: |-
  Operator (2026-11-06 10:13): ran 'aida role enter advisor --delegate-seat advisor --delegate-seat implementer --delegate-seat reviewer --delegate-seat integrator', then 'aida agent new claude --role advisor --permission-mode auto'. The launched advisor reported 'advisor grant does not delegate reviewer' (review watch) and 'needs dispatch authority' (queue work), and 'aida agent new' rejects --delegate-seat ('unexpected argument'). The operator fell back to 'claude --dangerously-skip-permissions' from the role shell. That works because the session then holds the shell grant itself, which carries all four delegable seats.

  Root cause: gate/seat_authority.rs issue_child_from() always writes delegable_seats: Vec::new(). That is correct for implementer/reviewer children. For a delegator seat (advisor, integrator), it strips the authority the seat exists to use. The rotate relay inherits the same defect, so every advisor that 'aida agent new claude --role advisor' launches (the documented advisor launch, and the default rotate path) is dispatch-dead.

  Acceptance:
  1. 'aida agent new <vendor> --role advisor' (and --role integrator) from a shell whose grant delegates seats S gives the child grant delegable_seats = S minus nothing the parent lacks. It never widens past the parent. Implementer and reviewer children keep an empty set.
  2. 'aida agent new' accepts --delegate-seat to narrow the set explicitly. Asking for a seat the parent does not delegate is refused with the existing one-line recovery.
  3. The rotate relay's relaunch carries the same set.
  4. A test asserts that an advisor child launched via agent new can mint a reviewer grandchild (review watch admits one) and an implementer grandchild.
  5. The standing orders and handoff launch line ('aida agent new claude --role advisor --permission-mode auto') then work as written, with no bypass needed (feeds STORY-2571).
