  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2777):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4cbdf727160d
    Recorded: 2026-11-26T22:16:12.617217580+00:00
    Findings:
    1. [aida-cli-lib/src/pr_train.rs LiveDriftRouter::authority and its call site in pr_train_handler_with_dispatch_ctx] Untested authority refusal path in the live adapter. route_drift_ejections is tested only through FakeRouter, so nothing exercises (a) the short-circuit when dispatch_abort is already set (drive lost authority, so the branch update must not run); (b) mapping a ports.dispatch_check() failure to Err and caching it in abort, so that later PRs in the same loop are refused without another check; or (c) the handler wiring that builds LiveDriftRouter with &mut dispatch_abort and calls route_drift_ejections. A mutation that makes authority() return Ok(()) unconditionally lets update_change_branch run after the train's dispatch authority is gone, and a mutation that drops the route_drift_ejections call returns the train to the BUG-2777 loop. Both pass every test in this PR. Round 1 named these (items b and d), and the implementer's self-review lists the abort caching as inspection-only. Fix: in story_1690_train_tests.rs (a child module of pr_train), build LiveDriftRouter over a LiveTrainForge (dispatch_ctx None, a fake or GitHub forge as the existing tests at about line 3370 do) with abort = Some("lease expired"). Call route_drift_ejections with a drift ejection and assert that no branch update was attempted, that the warning names the abort reason, and that the hold reads 'not routed: lease expired'. If practical, also cover a failing dispatch_check.
