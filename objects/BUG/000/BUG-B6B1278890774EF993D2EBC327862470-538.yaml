  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit + command-level helper):** extend the BUG-2767 culprit record (`.aida/train-culprits.json`) with a typed `kind: stacked-diff-drift` row plus the routed next step. After `drive`, every member ejected with the stacked-diff reason is recorded at its ejected head and routed: `Forge::update_change_branch` pinned to that head, then `try_auto_queue_pr_review` on its branch (the new head carries no verdict, so it is reviewed independently); on refusal (conflict) an advisor mailbox request names conflict repair / a fresh slice. Test: `bug2777_*` in `pr_train_culprit.rs` (record/hold/route) and a routing test with a fake forge.
    - **AC2 (unit):** the drift hold refuses the same head even when the PR is named on `aida pr train N` (naming clears only a red-culprit hold), worded with the routed next step; a new head rides. Test in `pr_train_culprit.rs` + `culprit_admission`.
    - **AC3 (unit):** `landing_drought::Ready` gains the drift row; a PR held for stacked-diff drift > 30 min is its own cause with the route as the fix. Test in `story_3131_landing_drought_tests.rs`.
    - **AC4:** the tests above.

    ### Expected files
    - `aida-cli-lib/src/pr_train_culprit.rs`
    - `aida-cli-lib/src/pr_train.rs` (reason const, post-drive routing, admission)
    - `aida-cli-lib/src/landing_drought.rs` + its tests

    ### Ambiguities / conflicts as questions
    - TASK-1960 carry-over is gate policy and untouched: after update-branch the drifted diff no longer matches the approved patch-id, so the approval does not carry; for drift caused by an earlier train member (not main) carry-over could still apply. Is a gate-side refusal for that case wanted as a follow-up?
