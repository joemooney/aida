  summary: 'BUG-2777 round 3 at 7f1fa7df. Both round-2 binding items from the advisor are resolved. (1) bug2777_live_router_holds_without_dispatch_authority builds the real LiveDriftRouter over a LiveTrainForge, with a gh shim that records any call (resolve_gh_binary honours AIDA_TEST_GH_BINARY) and abort=Some(''lease expired''). Two drift ejections whose heads are behind main reach the authority check. The test asserts that gh is never called, that each PR gets a warning naming the reason, and that each hold reads ''not routed: lease expired''. A mutation making authority() return Ok unconditionally, or dropping the abort short-circuit (dispatch_check with dispatch_ctx None), would call update_change_branch through the shim and fail this test. (2) Member-induced drift is classified by member_induced_drift: main is an ancestor of the head, so the result is patch-id(main, head), which is exactly add_car''s `want` with fork=main. route_drift_ejections then skips the branch update, re-review, authority check, hold and escalation, as bug2777_member_induced_drift_requeues_without_update_review_or_hold shows against a real repo; a moved main returns None. Only a real update-branch refusal escalates. The ACs still hold from earlier rounds. AC1: a typed row, same-pass routing, and update-then-requeue or conflict-repair escalation (bug2777_train_routes_and_records..., bug2777_drift_routes_to_update_and_review_or_conflict_repair). AC2: a named head is refused with its route (bug2777_a_drifted_head_is_refused_even_when_named). AC3: drift older than 30 minutes is its own cause, read from the main worktree (bug2777_stacked_diff_drift_over_30m_is_its_own_cause, bug2777_scan_reads_train_state_from_the_main_worktree). AC4: tests. The TASK-1960 gate is untouched and the route text is accurate. The base moved 3 commits (review_watch, pr_train_verified, queue work, advisor loop); none touch the drift path, so no finding depends on them. CI was pending at review time: fast gates pass, fast compile pending, merge-hold-gate awaiting clearance. Two non-blocking follow-ups are recorded.'
  punted:
  - 'punted: BUG-2777 adds a typed stacked-diff-drift row to the train-culprit sidecar, routes a drift ejection in the same pass (update-branch pinned to the ejected head plus a review queue, or an advisor conflict-repair request), refuses the drifted head even when the PR is named, and reports drift older than 30 minutes as its own landing-drought cause. The unit pieces are sound and tested: AC1 is verified by bug2777_drift_routes_to_update_and_review_or_conflict_repair, bug2777_drift_row_is_typed_and_naming_does_not_clear_it and the STACKED_DRIFT prefix assertion in build_drops_...; AC2 by bug2777_a_drifted_head_is_refused_even_when_named; AC3 by bug2777_stacked_diff_drift_over_30m_is_its_own_cause. AC4 is only partly met, because nothing tests the train-handler wiring that ties these together. That wiring is new code on the strict train/landing path: the post-drive loop in pr_train_handler_with_dispatch_ctx filters on the prefix, dedupes per PR, re-checks dispatch authority before the forge branch mutation, and calls record_drift. Under ADR-76 an untested refusal path in authority code blocks. Bug protocol: the PR touches at least one test file (met). CI was pending at review time: fast gates green, fast compile pending. The other findings are p3 follow-ups.'
  - 'punted: BUG-2777 round 2 at 4cbdf727. Most of round 1 is resolved. Advisor binding (2): the drift hold is written even when authority is lost, tested in bug2777_train_routes_and_records_a_drift_ejection_only_under_authority. Binding (3): the route text is accurate, and the TASK-1960 gate is untouched. Binding (4): landing_drought::scan reads train state from the main worktree via main_worktree_root_from, tested from a git-worktree seat in bug2777_scan_reads_train_state_from_the_main_worktree. Binding (5): a drift row and a red row at the same head have an explicit, tested precedence. AC2 is met by bug2777_a_drifted_head_is_refused_even_when_named: the head is refused even when named and the route is printed. AC3 is met by bug2777_stacked_diff_drift_over_30m_is_its_own_cause. AC1 is met at the extracted-loop level: route_drift_ejections, fed by a real build() drift ejection through a fake DriftRouter, checks routing, the typed row, per-PR dedupe and that a red ejection is not routed. One blocking gap remains on the strict train/authority path, which ADR-76 treats as blocking. The live authority adapter LiveDriftRouter::authority has no test: neither its dispatch_abort short-circuit nor its mapping of a dispatch_check failure. Neither does the handler call site that feeds it. A mutation that makes authority() always return Ok, or that drops the route_drift_ejections call, passes every test in this PR, and round 1 named this gap (items b and d). The implementer''s self-review says the abort caching is covered by inspection only. The tests module is a child of pr_train, and existing tests build LiveTrainForge with dispatch_ctx None and a fake forge, so the missing test is cheap to write. The base moved by one commit (BUG-2775, review vendor table); it touches none of these files, so no finding depends on it. CI was pending at review time: fast gates pass, fast compile pending, and merge-hold-gate is awaiting clearance.'
