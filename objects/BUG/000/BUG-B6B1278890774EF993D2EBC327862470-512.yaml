title: 'Merge holds are not transported by the store: decide transport vs documented local-only; if local-only, train admission also checks the primary checkout gate-ledger hold'
description: |
  Strict follow-up from BUG-2750 (advisor-122 ruling 2026-11-24 09:00; filed by product-15). The production merge-hold writer appends to the PRIMARY checkout's .aida/gate-ledger, OUTSIDE the AIDA store, and signed review publications don't transport holds. So a store-only (fetched-ref) train admission check can't see a hold placed in another checkout.

  ## Acceptance
  - AC1: Decide and record: either TRANSPORT merge holds through the store (signed, with clearance records), OR document holds as LOCAL-ONLY state by design.
  - AC2: If local-only: every train admission path also checks the primary checkout's gate-ledger hold, with a test that a hold present only in the primary checkout blocks the train. If transported: a test that a hold placed in one checkout blocks admission in another.
