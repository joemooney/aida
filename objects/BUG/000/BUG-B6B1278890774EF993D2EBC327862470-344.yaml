title: 'Seat rotation strands queued deputy jobs: the successor of the same handle cannot cancel or inspect its predecessor''s jobs'
description: |
  Observed 2026-11-14 04:55-06:30 MST. The advisor seat rotated (same handle claude-advisor-114, same lease, new grant 866dea4f -> 9f10f35a). Four script-deputy jobs the outgoing session had queued on deputy "default" (trains 18-21) stayed queued. The new session could not cancel them: `aida deputy shell cancel` refused with "submitted by 01a1d8f3..., not this session; cancel it from that session or at the operator's terminal". It could not tell in advance whether they would run or be refused as not-live (earlier job 01a1d7d6 was refused:not-live; these ran). The advisor resubmitted duplicates, and one uncancellable single-PR train (#4002) had to run ahead of a higher-priority head (#3987).

  Acceptance criteria:
  1. A job submitted by a seat stays owned by that seat's handle (and lease) across rotation: the rotated session of the same handle can cancel, status and wait on it.
  2. `aida deputy shell list` shows, for each queued job, whether its submitter is still live or would be refused at claim, so a rotated seat knows what will run.
  3. The rotation handoff lists the outgoing session's queued deputy jobs with their ids, so the successor can keep or cancel them.
  4. Tests: a rotated session cancels a predecessor's queued job; a different handle still cannot.
