title: 'Stale-claim heal fails open: git errors read as a clean worktree, and legacy claims skip the lane-record check (BUG-2773 follow-up)'
description: |
  Found by the 2026-11-26 adversarial-review trial (finder pass on #4666, BUG-2773, now on main). Advisor-confirmed as worth fixing; not verified by a run.

  1. `worktree_is_dirty_shallow` returns a bool that maps git errors to "clean". If git fails (lock, corrupt index, missing worktree metadata), a stale-claim release can proceed over unsalvaged work. That breaks BUG-2773's condition 4 ("clone absent or clean, salvage first; uncertain → not eligible").
  2. Legacy claims with no `claim_id` skip the lane-record check, which widens the release path beyond the four-condition rule.

  ## Acceptance criteria
  1. A dirty-state probe returns tri-state (clean / dirty / unknown). Unknown (any git error) → NOT eligible, and the hint names the cause. A test injects a git failure.
  2. Legacy claims without `claim_id` go through the same lane-record / session-registry check (or are ineligible, with a hint to salvage by hand). A test.
