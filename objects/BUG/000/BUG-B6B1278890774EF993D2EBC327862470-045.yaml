- id: 01a18f25-30ed-73c2-b1db-be1713af5011
  author: joe
  content: |
    ROOT CAUSE (advisor 2026-10-30 16:30): all three reviewers launched from inside a Claude Code advisor session (PR-3142, 3143, 3122) lost their verdicts the same way. Launched there, the launcher warns 'the child reviewer grant is bound to this launcher's process only: cannot hold the previous session keyring (errno 40). A worker whose tool calls run in a sandbox cannot present it'. The headless reviewer's Bash calls run in Claude's bwrap sandbox, so 'aida review record' is refused. From the operator's terminal loop the keyring is held and verdicts record. Stripping CLAUDE*/CLAUDECODE env did not help. Extra acceptance: when the child grant cannot be held by a keyring, refuse to start a reviewer (fail before spending a review) instead of warning and running a review whose verdict cannot be recorded.
  created_at: 2026-10-30T23:29:01.677074962Z
  modified_at: 2026-10-30T23:29:01.677074962Z
