title: 'Headless reviewer launcher prints a stale ''verdict: PASS'' summary when no verdict was collected, and a contained reviewer''s ''aida review record'' is refused'
description: |-
  Seen 2026-10-30 16:10 on PR-3142 (reviewer session 01a18f11, log /tmp/aida_review_3142.log, jsonl .aida/headless-logs/pr-3142-01a18f10-262b-78c1-b20b-9c7a504f8283.jsonl).

  1. The reviewer (AIDA_CONTAINED=1) ran 'cd /home/joe/ai/aida && aida review record ... --verdict request-changes'. It was refused: 'Session grant 90099ddf (reviewer) was rejected: this command runs in a sandboxed process namespace and does not hold the grant's session key (it is bound to process 2430167)'. Its sandbox also cannot write the primary checkout's .aida/review-verdicts/. So a complete request-changes verdict with 6 findings was lost and the advisor had to transcribe it from the log.
  2. The launcher then printed '✓ review complete ... verdict: PASS — Base-only update from main (gh update-branch 5a24edaf -> c0cd3764); reviewed content unchanged, prior approval carried; serial ship after main fix #2646' and 'Pickup setup exists; manual continuation: aida worktree enter STORY-...-131', none of which belongs to PR-3142, and only then errored 'exited without recording a verifiable verdict ... Treat this as no approval'. A PASS line attached to an unreviewed PR is a dangerous misread for any automated ship watcher or human scanning the tail.

  Acceptance:
  - A contained reviewer can record its verdict from its own review worktree with its own grant (or the launcher collects a verdict file the reviewer writes in its tree); a regression test covers the contained path.
  - When no verdict is collected, the launcher prints no verdict summary from any other PR or session; a test asserts the no-verdict output contains no 'PASS'/'approve' line.
  - The reviewer brief names the exact cwd for 'aida review record' so it does not cd to the primary checkout.
