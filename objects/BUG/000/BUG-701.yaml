title: aida add is ~8.5s (edit is 1.6s) — the ~7s delta is spec-id allocation, not the git commit or store bloat
description: 'Surfaced by the now-trustworthy telemetry (BUG-699). Recent (2026-07-02) aida add events: n=20, min=6769ms, p50=8799ms, max=14941ms — EVERY recent add is 7-15s, uniform (not bimodal), so it is systemic, not contention. aida add is a core write verb (2567 uses/30d) and sits on the magic-first getting-started screen (Capture a new spec) — a first-user waits ~9s to file their first spec, undermining the 60-second on-ramp. This contradicts CLAUDE.md BUG-634 which claims single-spec writes are sub-second (was ~13-20s) via targeted single-YAML read/modify/write. Either a regression, or BUG-634 only fixed the cache-read path while the write path (orphan-store worktree targeted git commit + cache write-through) is still slow. Also observed slow: pull 5-13s (two-leg git sync, network — plausibly expected), doctor 17s (full scan — plausibly expected), edit 5s (same write path as add). NEXT: profile where the ~9s in add goes (git commit on the orphan worktree? full-store load? cache rebuild?) — verify against a timed run before fixing. NOT yet root-caused; do not assume the cause.'
