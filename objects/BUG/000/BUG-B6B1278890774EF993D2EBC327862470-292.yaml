title: review record --verdict approved silently records CHANGES REQUESTED when prior findings carry over
description: |-
  Observed 2026-11-11: operator ran 'aida review record SPIKE-714 --pr 3833 --verdict approved --summary ...' and STORY-2688/#3843 likewise; both printed '✓ recorded CHANGES REQUESTED' with no explanation. Cause: STORY-2698 carry-over (gate/review_verdict.rs build_verdict_object) keeps the previous round's findings when --finding is omitted, and a verdict with findings is coerced to request-changes. Only an undocumented --finding "" clears them. Cost: ~1h of the 5.5h no-merge stall on 2026-11-11.

  ## Acceptance
  - An explicit --verdict approved never records a different verdict silently: either refuse with the reason and the exact fix (--finding "" or a disposition flag), or record approved with the carried findings marked accepted.
  - --help for --finding documents how to clear carried findings.
  - Regression test: approved over a prior request-changes with findings and no --finding produces the refusal/explicit outcome, not a silent request-changes.
