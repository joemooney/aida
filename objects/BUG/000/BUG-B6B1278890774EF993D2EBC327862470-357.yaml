  content: |
    AMENDMENT 12:04 diagnosis gate: blocked on primary-host measurements; no fix code written.

    This native seat reports hostname disrad-dvp98b3puw and /proc/1/comm=codex. Its visible process namespace contains no live aida pull, schedule tick, session hygiene, or cache refresh worker. The operator-provided /home/joe/ai/aida primary checkout/codegraph executable does not exist here; aida doctor check codegraph reports missing. The available checkout is a lane with read-only Git metadata. Running pull here would not measure dell1 and cannot supply the required primary-host control.

    (a) Per-step timing: NOT MEASURED in this seat. Historical advisor 09:20 timings on build 030d185 were completion store load/cache refresh 1.1 s, eligibility/forge 7.1 s, completion scan 195.8 s (relayed historical evidence, not a new run). Latest 11:58 evidence is >85-120 s without completion. Existing timers leave important gaps: run_deferred_code_reconcile drains pending followups BEFORE checking the watermark; auto_bump_done_to_completed_with calls review_waiting::reconcile_waiting_verdicts, walks git log, and invokes lane_recovery::reconcile_reference_in for each Refs trailer BEFORE the store-load timer. The watermark itself reads and hashes effective store files before auto-bump entry. These steps need separate timing in the primary reproduction; current phase logs cannot locate the delay.

    (b) Lock ownership: UNKNOWN. cache.rs::with_cache_retry_until sleeps only after SQLite lock errors and has owner-sidecar observations, so it is a plausible sleep source. hrtimer_nanosleep plus read locks alone does not identify this loop or the writer. Need synchronized blocked PID syscall/stack evidence, cache lock-info/refresh-lock holder evidence, and host process/lock snapshots to distinguish tick, hygiene, and refresh worker. Do not infer ownership just because schedule tick overlaps.

    (c) Control with tick and hygiene held off: NOT RUN. Host must hold off admission and ensure existing children have finished, then run the same measured idle pull with identical cache/store state, recording the control conditions and timings. Do not terminate existing jobs or alter host scheduling from this lane.

    BUG-2599 overlap: source ensure_cache_fresh calls is_ancestor_with_timeout with a two-second budget and propagates errors; BUG-2599 addresses that branch after a rebase. Completion/recovery operations can reach cache refresh, but a common root cause is NOT ESTABLISHED by source reachability or the current logs. Do not edit aida-core/src/db/cached_git_backend.rs or db/cache.rs in this lane. If the host measurements establish concurrent-writer contention or BUG-2599 overlap, stop for advisor/coordination rather than patch pull.

    Required next step: host-side measured run and held-off control, then advisor ruling on owning component. Publication veto requested through aida punt. No source edits, commit, push, PR, review verdict, queue completion, or publication declaration. untested=true: no Cargo run requested because no fix was authorized past the measurement gate.
