  author: joe
  content: 'Advisor lane brief 12:00 (codex, MAIN track, round 2 after #4095 landed as Refs). Problem: see the 11:58 evidence comment. On an idle primary, ''aida pull'' hangs in ''[pull] completion scan'' for over 85 s, sleeping with no children and only read locks on cache.db, while ''aida schedule tick'' / ''aida session hygiene'' and a train run alongside. Step 1, diagnose: reproduce on dell1 with AIDA_PULL_TIMING=1. Then find what the completion scan waits on (a busy-retry or sleep loop on the SQLite write lock, an advisory refresh lock, or an unbounded poll) and record the cause on BUG-2593 before fixing. Step 2, fix: the completion scan on an idle pull (no new store commits) does no waiting at all, and when it must wait it is bounded (a few seconds), then hands off or skips with a one-line note; it never blocks the pull. Acceptance: (1) a test where another process holds the cache write lock: an idle pull''s completion scan returns within its bound; (2) the idle pull finishes in under 10 s on dell1 (put the timing in the PR body); (3) #4095''s tests still pass. Do not raise any timeout as the fix. Files: aida-cli-lib/src/store_pull_coalesce.rs, store_push_pull.rs and the completion-scan module. The BUG-2599 lane (running) edits aida-core/src/db/cached_git_backend.rs and db/cache.rs; stay out of those. Gate: STRICT store path, so run the targeted cargo tests plus ''cargo test -p aida-cli'' on dell1 before pushing, plus the lane pre-push gate; do not push while red. Trailer (BUG-2593). Session rules: allowed_domains only on sandboxed Bash calls, never with dangerouslyDisableSandbox. A classifier-denied kill or destructive step is reported, never retried another way. Never sleep in a foreground Bash call.'
