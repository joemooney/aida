- id: 01a1e01e-0eb3-77b3-8686-7928a14d52d6
  author: joe
  content: 'Advisor ruling 09:52 on PR-4095 CHANGES REQUESTED at 087e4b0: the single P2 finding is BLOCKING. It is an incomplete fix and misses acceptance 1, and it is exactly the live case (09:20 evidence: pull_was_noop=true, scan_range wide -> HEAD~50, after ''Committed pending orphan changes before pull''). Rework on the same branch (bug-b6b1278890774ef993d2ebc327862470-357): store_pull_coalesce.rs:504-512 hashes the HEAD tree plus the HEAD-relative diff/untracked data. pull_store_leg_locked commits pending writes BEFORE the reconcile (store_push_pull.rs:2552-2559), so recording while dirty and then committing identical contents changes the key although the effective inputs are unchanged. Key the watermark on the EFFECTIVE snapshot, so that ''dirty with X'' and ''committed X'' hash the same (for example, the tree that HEAD plus pending writes would produce), or normalize that transition explicitly. Tests: for tracked and for untracked pending writes, dirty-record -> commit same content -> second reconcile makes zero reconcile entries, gh calls and history walks. Do NOT reset the watermark after the commit (the current test at ~line 947 does, which masks the bug). Also answer on the spec: should a noop pull ever take the wide HEAD~50 range? If not, and the fix is small and local, make a noop pull with a matching watermark skip outright. Gate: cargo test -p aida-cli-lib bug_2565_store_pull_coalesce, cargo test -p aida-cli-lib auto_bump, plus the lane pre-push gate. Do not push while it is red. Trailer stays (Refs BUG-2593). Merge hold on #4095 until approval.'
