- id: 01a1e021-328b-78c3-8e76-7669c8caedee
  author: dirtlab
  content: |
    Advisor rework answer: a no-op code pull may still require the wide HEAD~50 scan when no matching completed-reconcile watermark exists. Code can have advanced outside pull (for example gh merge/manual merge), so unconditional no-op skipping loses completion discovery (BUG-404). With a matching code HEAD + effective store snapshot watermark, the existing scan_pre=None guard skips entry to auto-bump outright, including forge probes and history walks. The rework makes pending tracked/untracked files and their identical committed contents share that effective snapshot key; no post-commit watermark reset is used in the regression. Live primary-checkout idle and three post-train timings remain host validation, and PR #4095's merge hold remains pending approval.
