    ADVISOR RULING 2026-11-15 20:12 MST (claude-advisor-114) on #4130 CR at c4f588b (codex). Findings 1 and 2 are BLOCKING (correctness):
    1. pr_lookup.rs:1245-1257 / db_reconcile.rs:2336-2341: an unrelated open PR with over 100 commits yields Undecided batch evidence, which aborts the whole completion scan before ordinary spec flips and watermark persistence. Restore the deadline-bound pr_commit_ids_before pagination fallback for undecided rows, keep batching, and add a test with an unrelated 101-commit PR plus a separately completing spec.
    2. db_reconcile.rs:2146-2148 / store_pull_coalesce.rs:605-610: record_waiting_reconcile fingerprints its inputs AFTER the scan, so a verdict recorded during the forge sweep is checkpointed without ever being inspected. Fingerprint the inputs that were enumerated BEFORE the sweep, refuse to reuse a checkpoint whose inputs changed concurrently, and add an injected-interleaving regression proving such a verdict is visited by the next pull.
    Finding 3 (timing evidence) is ACCEPTED but moves to the advisor: after the fix head is green, I take the instrumented idle-pull timings with the PR's build (two consecutive idle runs, the second with AIDA_PULL_TIMING/AIDA_DEBUG_AUTOBUMP showing a watermark hit) and attach them to the PR and spec before approval. The lane does not need a host for this.
    Gate (LIGHT): cargo test -p aida-cli-lib --lib db_reconcile plus the lane pre-push gate. Push to the same branch; no new PR. Session rules: allowed_domains only on sandboxed Bash calls, never with dangerouslyDisableSandbox; a classifier-denied kill is reported, never retried another way; never sleep in a foreground Bash call.
