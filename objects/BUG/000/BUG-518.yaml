title: 'statusline: cache:? is noise in a store-less worktree — show cache:n/a (or omit) when no .aida-store is attached'
description: In a harness/general-purpose worktree with no attached .aida-store, the statusline shows 'cache:?' (CacheFreshness::Unknown, main.rs:63452). Distinguish no-store (show 'cache:n/a' or omit the segment) from transient-unknown (keep '?'). Needs the freshness computation to signal no-store, so it is NOT a pure cosmetic one-liner — normal flow, not fasttrack. trace:STORY-78
