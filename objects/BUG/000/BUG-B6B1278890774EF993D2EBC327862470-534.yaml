  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 08:40):
    # BUG-2773 r1 on #4666 (advisor-122 ruling 2026-11-26 08:38 at d169b254: a LEGIT p1 in strict lease code, no override; product-15). Lane: CLAUDE. STRICT. MAIN, existing branch bug-2773-unbound-claim-heal / PR #4666. Keep the title "(BUG-2773)".
    RULING: a dead creator pid is NOT death evidence for an unbound claim (build_claim records the short-lived command's own pid, so it is always dead). Release an unbound claim ONLY when ALL of these hold:
     (1) no lease or launcher binds it;
     (2) heartbeat older than a long floor (>=24h, or 3x the claim TTL if that's larger);
     (3) no live AIDA session or seat references the claim id or its clone path, checked through the SESSION REGISTRY, not /proc;
     (4) the clone path is ABSENT, or present with no lease marker and NO uncommitted work. When present, salvage first; never release over unsalvaged work.
    Anything uncertain → NOT eligible, and the refusal hint says WHY. The pid is a supportive signal only.
    TESTS: an alive-session negative; a fresh-heartbeat negative; the 11-day shape (unbound lease + launcher, old heartbeat) POSITIVE; the other-host hint (the reviewer's p3).
    One targeted cargo test run on this host, make check-ci-fast, then push to #4666. COMMIT your work.
