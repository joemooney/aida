- id: 01a21881-9d3f-71b0-b790-6ccd1be6736c
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2773):
    Verdict: CHANGES REQUESTED
    Reviewed commit: d169b25498d0
    Recorded: 2026-11-26T15:34:50.388896284+00:00
    Findings:
    1. Blocking (strict-tier lease/admission code). aida-cli-lib/src/coordination.rs:711-717 (the new `let Some(id) = holder.lease_id ... else { return clone/.aida is_dir }` branch of exited_holder_is_dead) treats a dead creator plus an expired heartbeat as positive death evidence for an unbound claim. For a non-process-backed claim, build_claim (coordination.rs:1003-1008) records pid = std::process::id(), the short-lived `aida session start` process, and heartbeat_at is never refreshed. The module doc (coordination.rs:50-66, BUG-1765) and the build_claim comment both say this pid must NOT drive same-host reclaim, and that TTL age alone never expires a verified-live or dormant session. So every same-host, non-review, unbound claim becomes eligible about 30 minutes after it is written, whether or not the holder clone still runs a session on that scope. Failure scenario: a legacy unbound claim whose clone still holds a Live or Dormant local session lease for the scope (worktree present, Claude alive or paused). `aida doctor check leases` lists it as safe_heal. `aida doctor heal stale-leases --id shared-<id> --yes` releases it, and salvage_exited_claim now returns Ok(()) without saving anything. An implementer `--force-claim` admission (coordination.rs:1159/1166) also replaces it. A second clone or lane can then start the same spec over the paused session's work, which is the duplicate-work race this registry exists to prevent. Fix: in the unbound branch, also require !probe_session_liveness(holder, &hostname()) (the holder clone's own `.aida/sessions` table for the scope; Live or Dormant retains). Add a refusal test: an unbound, expired claim with a dead creator plus a live or dormant local session lease for its scope in the present clone is not listed, not healed and not force-reclaimed. The dell1 shape (no live session) stays eligible, so AC1 is unaffected.
    2. aida-cli-lib/src/coordination.rs:879-882: the new other-host branch of implementer_refusal ('on host X, heal the holder only if `aida doctor check leases` lists it') has no test; only the same-host ineligible and eligible branches are asserted. It is hint text only and decides no admission, so it is not a gate decision. Add one assertion with holder.host set to another host.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-26T15:37:57.311900597Z
  modified_at: 2026-11-26T15:37:57.311900597Z
