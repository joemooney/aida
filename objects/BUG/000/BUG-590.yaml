title: MCP triage_finding dismiss returns malformed 'dismissd' (missing 'e') in agent-facing success text
description: |-
  Dogfooding the MCP server: triage_finding with action=dismiss returns the success string "Finding SPEC-011 dismissd" (note: "dismissd", missing the e). Source: aida-cli/src/mcp.rs:2744 builds the message as format!("Finding {} {}d", id, action.to_ascii_lowercase()), blindly appending "d" to the raw action verb. That happens to read OK for "promote"->"promoted" but yields "dismiss"->"dismissd" for the other (and only non-gated) action. Since promote is advisor-gated and refused via MCP, dismiss is the one action that actually reaches this success line for an MCP client - so the malformed form is what agents see in practice. Low severity (cosmetic agent-facing text), trivial fix: emit a proper past tense per action ("dismissed"/"promoted") instead of suffixing "d".

  Repro (MCP stdio): tools/call triage_finding {"id":"SPEC-011","action":"dismiss","reason":"x"} -> content text "Finding SPEC-011 dismissd". Verified-by-me on this dogfood run (debug build sha fdb0a69fc).
