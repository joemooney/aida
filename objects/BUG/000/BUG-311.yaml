title: aida queue work --steal silently fails to end dormant lease — orchestrator re-emits 'pass --steal' error despite the flag being passed
description: |-
  ## Symptom

  2026-05-22 ~04:00 — TASK-437 had a dormant implementer lease (019e4dec, worktree clean with 1 committed change on the branch, no uncommitted work). User ran:

  \`\`\`
  aida queue work TASK-437 --auto-complete --no-human=both --steal
  \`\`\`

  Orchestrator output:

  \`\`\`
  Error: scope \`TASK-437\` is owned by lease 019e4dec (implementer, worktree: /home/joe/ai/aida-task-437)
    — pass --steal to end that session first and take over, or \`aida session end 019e4dec\` manually.
  ✗ phase 1 (implementer session) failed: the implementer session exited 1 — it was aborted or errored
  \`\`\`

  **The \`--steal\` flag was passed but the error message tells the user to pass \`--steal\`.** Either:

  - (A) Argument parsing isn't honoring \`--steal\` in this position (after \`--auto-complete\` / \`--no-human=both\`), OR
  - (B) The flag is parsed but the steal logic short-circuits without surfacing the underlying error, OR
  - (C) The internal \`aida session end\` call that \`--steal\` makes failed for some reason and the orchestrator falls back to emitting the canned ownership-block message.

  Worktree was clean (no uncommitted changes); commit was on the branch but unpublished — neither should block a session-end per existing semantics (\`aida session end\` retains the branch and removes only the worktree when clean).

  ## Acceptance

  - Reproduce on a fresh clone: create a dormant lease via punt-then-die, set a commit on its branch, run \`aida queue work <spec> --auto-complete --no-human=both --steal\`. The command MUST end the dormant lease and proceed to phase 1.
  - Root-cause one of (A)/(B)/(C) above; fix.
  - If \`--steal\`'s internal \`aida session end\` does fail (e.g., dormant-lease-ending has its own validation path that refuses), surface the SPECIFIC error: *\"--steal could not end lease 019e4dec: <actual reason>\"* — not the generic *\"pass --steal\"* loop.
  - Add a regression test: synthetic fixture where queue-work hits a dormant lease + \`--steal\` + the underlying session-end is forced to fail; assert the orchestrator surfaces the actual error, not the misleading message.
  - Compose with BUG-307 (auto-detect dormant): if BUG-307 ships first, \`--steal\` becomes unnecessary for the dormant case — the orchestrator auto-releases dormant leases. \`--steal\` then remains only for the genuinely-active-lease takeover case.

  ## Why this is high priority

  \`--steal\` is the documented escape hatch for the dormant-lease friction class. If it silently fails, the recovery flow is broken for every spec in this state. Tonight three drain runs (TASK-440, TASK-439, TASK-437) hit the dormant-lease pattern; if BUG-307 takes a few days to ship, \`--steal\` is the workaround — but only if it works.

  ## Related

  - **BUG-307** — auto-detect + auto-clean dormant leases. Solves the same friction class proactively; this BUG is the reactive escape hatch that's currently broken.
  - **TASK-389 / BUG-249 / TASK-413 / TASK-416 / TASK-437** — all hit the commit-and-exit-without-PR pattern that leaves dormant leases. Each manual recovery exercises the broken \`--steal\`.

  ## Origin

  User report 2026-05-22 ~04:00 — third dormant-lease conflict tonight; \`--steal\` flag didn't take effect despite being passed. Pasted output unambiguously shows the flag in the command and the same canned error in response.
