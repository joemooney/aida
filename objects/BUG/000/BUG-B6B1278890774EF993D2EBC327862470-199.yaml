title: Rework briefs omit the review findings when the verdict is keyed PR-N instead of the spec ID, so rework lanes work from stale rulings
description: '2026-11-03 10:30: PR-3291 (STORY-2325 PR-B) and PR-3288 (STORY-2326 PR-A) got CHANGES REQUESTED verdicts that were recorded under the key PR-N (gate-ledger PR-3291.jsonl#2, 7 findings; PR-3288, 10 findings). ''aida review verdict STORY-2325'' reports none. ''aida queue work STORY-2325 --role implementer --no-human --force-claim'' then built a brief holding only an older ADVISOR RULING comment, with no ''ITEMS STILL OPEN'' block, and the lanes started work on round-1 instructions. STORY-2338 (verdict keyed by the spec) got its findings. Expected: the brief resolves the latest verdict through the gate ledger for the spec''s open PR (PR-N key or spec key, whichever is newer at the PR head), and refuses to launch a rework when a request-changes verdict exists but cannot be read. Workaround: post the findings as an ADVISOR RULING comment before relaunching.'
