- id: 01a21f6b-5d09-74f3-8ea3-43b850d23689
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (PR #4752):
    Verdict: CHANGES REQUESTED
    Reviewed commit: dc0f8cf4e00f
    Recorded: 2026-11-27T23:49:52.961450656+00:00
    Findings:
    1. Security/authority bypass: an expired barrier can finalize a REJECTED verdict as APPROVED. record_collected_verdict (gate/ledger/mod.rs needs_delivery/pending, ~L440-480) runs under tier policy, which is active in this project. It barriers every record in the batch, including a non-approving record that has at least one deferred finding, and it overwrites the verdict word with "request-changes". The original "rejected" is lost. complete_approval (gate/ledger/abandoned_sweep.rs:84-95) then forces verdict="approved" and re-decides only the findings. disposition_verdict keeps Rejected as Rejected only while the word is present, so the forced word removes that protection. Failure scenario: a contained reviewer records rejected with one p2 finding, which the policy marks deferred. The launcher's collection writes the barrier batch and dies during findings delivery. 20 minutes later the reviewer session has no lease, and the watcher's expire_reported calls finalize_via_writer with an approved record. The PR becomes approved. The PR description's guard against request-changes siblings, the non-empty all-deferred findings check, does not cover rejected. A request-changes verdict with all findings deferred already normalizes to approved, so only rejected is exposed. Fix: carry the pre-barrier verdict word on the barrier (for example a barrier_of/original_verdict field set in both barrier writers) and finalize only when it was approved. Otherwise abandon the barrier. Add a test that a rejected-with-deferred-findings barrier is abandoned and never finalized. That test is required under ADR-76 because this is gate code.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-27T23:50:59.593652261Z
  modified_at: 2026-11-27T23:50:59.593652261Z
- id: 01a21f7c-c503-7962-a922-a3b5fe9d5916
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: f37d0cb960 (round 3, #4752 CR @dc0f8cf4 authority bypass).
    Fix: both barrier writers (ledger/mod.rs record_verdict_at and record_collected_verdict) record the pre-barrier verdict as barrier_of. The collected writer reads it before setting sweep_pending, because disposition_verdict reads every barrier as request-changes. A first test run caught exactly that ordering bug. complete_approval finalizes only when barrier_of == approved and the re-decided findings still approve. rejected, request-changes, waiting or a missing barrier_of abandons the barrier (fail closed). barrier_of is stripped from the delivered approval, the finalized approval, a fresh reviewer act and same_pending_delivery's comparison.
    Evidence: abandoned_sweep tests a_non_approval_barrier_is_abandoned_never_finalized (rejected / request-changes / None / waiting) and a_collected_rejection_barrier_records_its_verdict_and_is_never_approved (real collected writer under tier policy, delivery failure, then expiry abandons). The approved path is still finalized (exited_reviewer_with_complete_draft_is_finalized, bug_2786_..._finalized_by_the_expiry_pass, which now asserts barrier_of=approved). 11/11 pass. Mutation check: with the barrier_of guard disabled, both new tests FAIL ('must not finalize').
    Residual risk: barriers written before this change carry no barrier_of. Expiry now abandons them (needs re-review) rather than finalizing them, which is the intended fail-closed behavior.
