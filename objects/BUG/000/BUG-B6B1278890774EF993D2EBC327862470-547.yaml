title: 'Review sweeps stall: provisional CRs never finalize, and released reviews are re-held by the exited reviewer''s checkout'
description: |
  Observed 2026-11-26/27: reviewer verdicts recorded as provisional `request-changes` with `sweep_pending: true` are often never finalized by the reviewer's own sweep. Seen on #4695 and #4727 (stalled ~45 min, advisor recorded the final verdict by hand), and on #4717, #4638, #4680 and #4464 (still pending hours later; live=0). Other seats then misread provisional records (the #4678 case: a provisional CR was finalized as approved while seats ruled rework on the provisional one). A second problem: after `aida review watch --release PR-N`, the watcher re-holds the PR with "checkout is at the current head", because the exited reviewer's checkout still exists (#4741, #4652, #4717, #4638). It needs a manual session end / worktree cleanup before a relaunch.

  ## Acceptance criteria
  1. A sweep-pending verdict whose reviewer process has exited (verified by session registry, not /proc) is finalized or expired within N minutes. Finalize from the draft when it is complete, else mark it `sweep_abandoned`. The ledger, review-watch and doctor all treat an abandoned sweep as "needs review", never as a CR.
  2. `review watch --release PR-N` (or the watcher itself) also ends the exited reviewer session and removes its clean checkout, preserving any unrecorded draft by moving it aside under .aida/, so the next pass can dispatch.
  3. `aida doctor` lists stuck sweeps and retained checkouts with the one command that clears them.
  4. Tests for each.
