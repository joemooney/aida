  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: Writers fixed and legacy readers normalized, but the default ''aida mailbox inbox'' own-audience path reads via mailbox_logical::read_source, which still deserializes Message raw: seconds-scale notices still render 1970-01-21 and a missing timestamp still fails the source. No triage reason was given.'
