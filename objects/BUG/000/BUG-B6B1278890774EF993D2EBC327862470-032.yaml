title: Mailbox messages with no created_at render as 1970-01-21 and sort as oldest
description: '2026-10-29: `aida mailbox inbox --unread` shows 39 messages dated 1970-01-21 (review-watch notices, and a seat-clone message whose JSON has created_at null). Acceptance: a missing timestamp is filled at send (writers always stamp created_at); readers fall back to the file mtime or show ''unknown time'' rather than the epoch; a test covers a message without created_at.'
