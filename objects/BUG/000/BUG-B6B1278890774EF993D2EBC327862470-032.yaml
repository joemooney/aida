spec_id: BUG-b6b1278890774ef993d2ebc327862470-032
title: Mailbox messages with no created_at render as 1970-01-21 and sort as oldest
description: |
  2026-10-29: `aida mailbox inbox --unread` shows 39 messages dated 1970-01-21 (review-watch notices, and a seat-clone message whose JSON has created_at null). Acceptance: a missing timestamp is filled at send (writers always stamp created_at); readers fall back to the file mtime or show 'unknown time' rather than the epoch; a test covers a message without created_at.

  ADVISOR RULING 2026-10-30 06:42 (PR-3135 round 1). ONE rework push on PR-3135; BUNDLE:
  1. (major) mailbox_logical::read_source (aida-core/src/mailbox_logical.rs ~1739) still deserializes Message raw. That is the DEFAULT `aida mailbox inbox [--unread]` and MCP read_inbox path, so route it through parse_message_file (or the shared normalizer).
  2. The acceptance test goes through the own-audience view (logical_snapshot / read_own_mail_binding): a message with a missing created_at and one with a seconds-scale created_at render correctly there.
  3. mailbox_migration.rs ~149 also uses parse_message_file.
  4. For canonical-store files with no timestamp, persist the fallback once (stamp on first read or sync) instead of using a git-checkout mtime that changes on every pull.
  Gate: LIGHT. Run `cargo test -p aida-core mailbox` plus `cargo test -p aida-cli-lib --lib bug_032` and make check-ci-fast.
