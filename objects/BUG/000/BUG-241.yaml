    Items **4 and 5** (reviewer writes a verdict file on escalation; orchestrator 'escalated-to-human' first-class outcome) are **STRUCK from BUG-241 and MOVED to STORY-306**. Rationale: they are the escalation HANDSHAKE — STORY-306's (advisor escalation tier) mechanism — and STORY-306 now carries a coherent escalation design (A/B/C calibration, punt channel, v1/v2 advisor). A partial handshake built in BUG-241 would risk pre-empting/contradicting that. They are also belt-and-suspenders: instance A's actual trigger (uncertain AIDA_ZEN) is already fixed by BUG-237 (merged), so the reconcile step is the durable fix.

    BUG-241's acceptance is hereby items 1,2,3,6,7. The reviewer reviews BUG-241's PR against those five. This amendment is binding for the in-flight implementation (synchronous design-checkpoint resolution — the implementer asked, this is the answer).
