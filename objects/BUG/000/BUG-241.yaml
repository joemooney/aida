- id: 019e3e73-e8df-76f2-b570-836ce8177799
  author: joe
  content: |-
    Implemented via branch `bug-241` (commit 860b20da):

    - orchestrate() now routes every phase failure through the new PhaseDriver::reconcile_failure hook before declaring a failure. RealPhaseDriver checks ground truth — a merged PR (gh pr view) and the spec's status in the git store — and reports ShippedOutOfBand when reality shows the spec shipped despite a missing artifact; finish_reconciled then returns a success so the batch advances instead of crashing with a false "shipped 0".
    - Fixes both verified instances: A (phase-3 out-of-band merge) and B (phase-1 no-work spec). Reconcile is gated to phases 1 & 3; phases 2/4/5/6 fail genuinely (red CI, failed merge, divergent pull, broken build), so reconciling them would mask a real failure.

    Test status: 679/679 aida-cli tests green; cargo fmt --check clean
    Follow-up: items 4-5 (escalation handshake) folded into STORY-306's acceptance criteria, not a standalone TASK
