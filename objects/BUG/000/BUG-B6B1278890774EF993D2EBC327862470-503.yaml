    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 20:31):
    # BUG-2742: SMALL backlog fix (advisor-122 throughput plan 2026-11-22 20:40: fill dell1 with small Approved specs; relayed by product-15). Lane: CODEX. New branch, new PR.

    Read `aida show BUG-2742` and implement its acceptance criteria and nothing more. Reproduce first. If main already behaves correctly, add the regression test and say so in the PR body.
    SMALL-PR RULE: target <=300 changed lines and 1-2 ACs. If it can't fit, implement AC1 only plus its test, and list the rest in the PR body for product to split.
    Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
    Add `// trace:BUG-2742 | ai:codex` (`# trace:` for Python or shell). Commit `[AI:codex] fix(...): ... (BUG-2742)`. One targeted test run, then `make check-ci-fast`, then ship a new PR. COMMIT your work.

    PRODUCT QUESTIONS: lanes cannot reach product by mail (mailbox over budget). If you need a product answer (a follow-up spec ID, a scope call), PUNT with the exact question in your exit summary; product reads lane exits and relaunches with the answer.

    ROUTING (advisor-122 disposition 20:33): MAIN, STRICT review, mode drive. This narrows what hygiene counts as dirty before it REAPS, so a mistake loses work.
    AC1 (as written): git-IGNORED paths (including AIDA's own ignored .aida/* state) are not counted as uncommitted work.
    AC2 (advisor): untracked NON-ignored files, ANY unique commit on ANY local branch, and stashes STILL count as dirty, each with its OWN test.
    Keep "never force-reap a dirty tree" intact. ONLY gitignored paths are excluded. <=300 lines.
