- id: 01a20bea-4ce3-7ce1-865e-b9719840762c
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2742):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1dc839b00db4
    Recorded: 2026-11-24T04:54:42.776088935+00:00
    Findings:
    1. BUG-2742 AC1 / AC2 — aida-cli-lib/src/dispatch_health_ps.rs:642–647. Dispatch passes an empty shipped-head set to probe_until. After a squash merge and remote-tracking ref prune, a clean clone can still look uniquely unpublished to dispatch because the source SHA is absent from main, while session_reap.rs:1408–1421 explicitly credits that same SHA from the merged PR. The same disagreement can occur after publishing through an explicit refspec that neither checkout tracks. Share bounded publication evidence or surface unresolved publication as unknown instead of reporting uncommitted work. Add a regression with a clean squash-merged clone and pruned tracking ref.
    2. BUG-2742 incident regression — aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs:3173–3190. The fresh fixture proves ignored .aida state and a tracked edit, but does not reproduce session 01a1abbf as the advisor requested. The restored clone has branch task-2708-ac1, and its local HEAD is covered by the recorded tracking tip. The forge lists PR #3449 as closed without merge and returned no merged PR for that source branch, so session_reap.rs:1352 still refuses it regardless of the dirty probe. Capture the original dirty classification and add a faithful non-destructive regression. Reconcile the incident’s publication and reap eligibility with the advisor while preserving the merged-PR gate.
    3. aida-cli-lib/src/dispatch_health_ps.rs:642–647 and :1114–1141. A stash or a commit on a different local branch now puts a clean current checkout into Salvageable and produces the existing git add/commit recipe. For either newly tested state the recipe has no changes to commit and does not recover the stash or other branch. Carry the reason for dirty state through the classifier and give stash- or ref-specific guidance.
    4. aida-cli-lib/src/seat_clone.rs:1595. Dispatch now requests submodule worktree inspection before checking for any submodule evidence, including when the snapshot is used only to resolve the branch for a legacy reap lease. This drops the previous non-recursive status setting. probe_until checks submodule evidence before invoking this status mode. Keep the dispatch probe non-recursive or run the existing refusal check first, and cover dispatch on a clone with submodule evidence.
    5. aida-cli-lib/src/seat_clone.rs:1618–1626. The extra status/stash probe starts through probe_run, which falls back to the 120-second PROBE_TIMEOUT. Ship cleanup caps the surrounding clone probe at ten seconds, but a clean result starts this new subprocess outside that shared deadline. Pass the same absolute deadline through publication checking and the final status/stash probe.
    6. aida-cli-lib/src/seat_clone.rs:1623 and aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs:2637–2645. An existing clean Claude seat whose only extra file is its empty sandbox-created .gitmodules now becomes dirty if its originating checkout did not add an ignore rule. The previous dispatch and reap paths explicitly recognized that placeholder. The old end-to-end regression now adds /.gitmodules to the parent excludes, a rule absent from the project’s tracked .gitignore and optional for existing seats. Preserve recognition of the known generated stand-in or reliably install the intended ignore policy for existing seats while retaining user-created .gitmodules content. Cover the original fixture conditions.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-24T04:57:14.211100610Z
  modified_at: 2026-11-24T04:57:14.211100610Z
