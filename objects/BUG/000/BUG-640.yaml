title: 'Patch-id force-push guard: refuse force-push unless remote commits are incorporated'
description: 'no-mistakes routes every force-push through a patch-id incorporation check (git rev-list --cherry-pick --right-only HEAD...current ^baseSHA) and refuses unless every live-remote commit is already incorporated. AIDAs pr_rebase.rs uses --force-with-lease which our own incident memory says does NOT protect an already-fetched commit (dropped a merged PR on main). Convert the CLAUDE.md rule into a programmatic bouncer. Fail closed if ls-remote fails. Files: aida-cli/src/pr_rebase.rs, the aida push/pull force paths.'
