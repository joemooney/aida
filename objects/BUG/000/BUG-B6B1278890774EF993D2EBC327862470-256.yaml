  content: Added a live-sandbox regression for lightweight and annotated slice checkpoint tags on published branch history, with a stale clone tracking ref and clone HEAD behind origin. It also checks that an unpublished tag-only side history retains the clone, then removal of that tag permits guarded teardown. The first targeted lane test passed; final-source rerun is pending. Current shared reachability and force-claim retirement code appear to already cover the reported condition; no production behavior has been changed. A retained failing clone or exact ref/commit graph is needed if the refusal persists.
