  content: 'Advisor clarification 2026-11-07: the slice-* tags may point at checkpoint commits that are NOT reachable from origin (pre-squash lane checkpoints), so acceptance (1) is: slice-* checkpoint tags never count as unpushed work when the branch head itself is pushed and the tree is clean; the salvage patch that session end already writes (.aida/salvage/<seat>/<ts>.patch) preserves them. Non-slice refs keep the current rule.'
