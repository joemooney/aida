- id: 01a1b991-0154-7df3-9d00-335dffe6843d
  author: dirtlab
  content: 'Rework addresses the advisor clarification and all review findings: clean clones with a published HEAD exempt refs/tags/slice-* from unpushed counts even for unreachable pre-squash checkpoints. Unpublished HEADs, dirty trees and non-slice refs retain protection. Teardown salvages checkpoint refs with the existing all-ref bundle path before removal and keeps the clone on salvage failure. Added force-claim regression proving retained lease retirement plus lightweight/annotated checkpoint bundle preservation; updated probe regression with unpublished HEAD, dirty-tree and non-slice negative cases. Final-source lane jobs: j20261108T050616813-2-0 (bug_2491: 2 passed) and j20261108T050722539-2-0 (bug_2455: 7 passed); git diff --check passed. Earlier intermediate run failed the missing-salvage assertion before that fix; final rerun passed. Three files changed: aida-cli-lib/src/seat_clone.rs, aida-cli-lib/src/tests/bug_2455_force_claim_clone_tests.rs, aida-cli-lib/src/tests/task_2053_seat_clone_lifecycle_tests.rs. Edits left uncommitted for native host publication; no queue completion, commit, push, PR or review command issued. No implementation blockers remain.'
