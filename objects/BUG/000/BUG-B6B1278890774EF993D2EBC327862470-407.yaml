title: A lane that pushed its work ends as a punt when exit-time mail retention refuses (writer-admission scan), sending finished work to needs-attention
description: |-
  ## What happened
  2026-11-16 18:49 MST: the STORY-2856 rework lane on dell1 pushed a correct new head ea51bba to #4180 (check-ci-source 48/48; CI running). Its outcome line still read 'implementer: punted ... reason=explicit-punt pr=4180 fast_gate=fail', and the spec went to needs-attention. The lane log ends with: error: "mail retention refused for /home/dirtlab/ai/aida-worktrees/aida-seat-aida-story-...-779: the fresh writer-admission scan could not verify every mail writer; run `aida mailbox retention activate --dry-run` to inspect writer admission; the tree was kept". The advisor (17:58) confirmed that the punt came from the exit step, not the code.

  ## Why it matters
  A housekeeping failure after publication rewrites a successful lane into a punt. Product and advisor then spend time on a non-problem, and the spec drops out of review until someone moves it back by hand. Related: BUG-2541 (session end cannot retire a seat clone when retention refuses).

  ## Acceptance
  1. When the head is published, a retention or cleanup refusal at lane exit is reported as a warning and leaves the outcome as pushed. The spec status follows the push, not the cleanup.
  2. The kept tree is recorded for later gc, with the refusal reason.
  3. The outcome line distinguishes a punt by the implementer from a cleanup failure.
  4. A regression test runs a lane that publishes and then has retention refuse, and asserts outcome=pushed with a cleanup warning.
