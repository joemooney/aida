title: Merging a GitLab MR and running aida pull does not complete the spec named in the commit trailer
description: 'Reported from operator''s work machine (Codex, GitLab project hello-work-0x), 2026-11-09. After ''glab mr merge 2 --squash'' and ''aida pull'', the spec stayed InProgress. Merge-time completion appears GitHub-specific (merged-PR lookup or squash-subject handling). Make completion forge-neutral: detect the merged MR through the forge abstraction and apply the trailer rules to the squash commit on the default branch. Test with a fake GitLab forge.'
status: NeedsAttention
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
