  content: 'ADVISOR RULING (2026-11-10 09:44 UTC) — binding for PR #3774 rework at head 3dd89327d4. Fix exactly one finding: [P2] reconcile_evidence.rs:143-146 treats any GitLab search hit as an open deliverable for the spec (glab_lookup_from_list_output returns the first MR). Match GitHub''s row_credits_spec / branch_names_spec semantics on GitLab title, description and source_branch; scan the whole result set, not the first hit; keep ''unknown'' when pagination is incomplete. Fake-glab regressions: a prose-only mention (''follow-up from BUG-2516'' crediting another spec) does not count; nonmatching hits before a genuine matching MR still find it. LIGHT gate.'
