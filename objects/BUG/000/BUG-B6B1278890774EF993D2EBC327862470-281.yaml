- id: 01a1c4e6-0895-7a91-a1fd-16eb07531b14
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2516):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 3dd89327d484
    Recorded: 2026-11-10T09:35:58.420151792+00:00
    Findings:
    1. [P2] aida-cli-lib/src/reconcile_evidence.rs:143-146: Do not treat every GitLab search hit as an open deliverable for the candidate. change_for_spec searches title/description and glab_lookup_from_list_output returns the first MR without checking spec credit. An unrelated open MR whose description says "follow-up from BUG-2516" but credits TASK-9000 causes BUG-2516 to remain InProgress/Done after its completing squash lands, indefinitely. Match GitHub row_credits_spec/branch_names_spec semantics using GitLab title, description and source_branch; inspect the result set rather than accepting the first hit, and preserve unknown on incomplete pagination. Add fake-glab regression cases for prose-only mentions and nonmatching hits before a genuine matching MR.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
