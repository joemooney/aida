id: b173e02c-5fae-4894-a01b-767f5a29c202
spec_id: BUG-14
title: Concurrent Edit Protection
description: |-
  Prevent data loss when GUI and CLI (or server) modify the same requirements.yaml simultaneously.

  **Problem:**
  When the GUI and CLI/server are both editing requirements.yaml, changes can be overwritten because there's no file locking or version checking between them.

  **Solution Options:**
  1. **File locking** - Use flock/advisory locks to prevent concurrent writes
  2. **Optimistic locking** - Track modified_at timestamps, reject stale writes
  3. **Merge on save** - Detect conflicts and merge non-conflicting changes
  4. **Watch for changes** - GUI reloads when file changes externally

  **Acceptance Criteria:**
  - [ ] GUI detects when file has been modified externally
  - [ ] Warning shown before overwriting external changes
  - [ ] Option to reload, merge, or overwrite
  - [x] GUI detects when file has been modified externally (via store_version)
  - [x] Warning shown before overwriting external changes (VersionConflict)
  - [x] Option to reload, merge, or overwrite (SQLite optimistic locking)
  - [x] Server mode uses proper locking for concurrent clients (WAL mode)
