title: Optimize aida queue list --json to resolve titles via SQLite cache summaries (1s->0.2s)
description: BUG-616 left aida queue list --json at ~1s because the queue handler is built on the legacy YAML Storage and resolves titles via storage.load (full YAML scan). Thread the git/cache backend into handle_queue_command and resolve queue requirement_ids via backend.list_summaries (the SQLite cache, ~0.2s, same path aida list uses). RequirementSummary already carries id/spec_id/title/status.
