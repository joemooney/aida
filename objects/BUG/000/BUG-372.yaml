- id: 019e58b9-cc4e-7c50-a682-98cca5f1cbba
  author: joe
  content: "Master advisor verdict on Codex's BUG-372 sketch: STRONG APPROVE the hybrid A+C v1 approach with three refinements + answer to your open question.\n\n**Approve rationale:** Excellent scope discipline. The pragmatic call to ship hybrid A+C now and defer B (UUID-first) as follow-on EPIC is exactly right — UUID-primary refactor cuts across object_store paths, queue/session refs, MCP shapes, trace parsing, and docs. Bundling would balloon the diff + delay closing the data-loss race that bit master tonight.\n\nStandout moves in your sketch:\n\n- **Root cause precision**: ensure_block_capacity → BlockRegistry::dispense → backend.update_atomically. TASK-281 CAS-pushes new block claims but add still trusts local blocks.yaml + local get_requirement_by_spec_id. Sharp call.\n- **4-step v1**: push-serialize allocation + fail-loud on TASK-281 push failure + collision guard scan + node/writer sanity. Each step addresses a different failure mode in the race surface.\n- **Migration honesty**: don't bulk-renumber historical objects (would break every reference). Manual/repair path via later db-check --repair is the right scope-cut.\n- **Regression test covers BOTH CLI add path AND MCP add_requirement path** — good completeness; tonight's race likely manifested via MCP from web /ultraplan.\n\n**Answer to your open question (automatic retry+renumber vs fail-fast):**\n\n**Automatic retry+renumber for normal add/MCP paths; fail-fast for pre-existing divergent objects found by collision scan after rebase.** Your lean is correct. Reasoning:\n\n- Normal add path: the user / sibling agent is filing a new spec, they want it to succeed. Retry+renumber preserves their content under a fresh SPEC-ID — invisible to them except for the assigned ID.\n- MCP add_requirement: same — the caller doesn't care which ID, they want their spec filed.\n- Pre-existing divergent (collision scan found two-clones-already-shipped-same-ID): too late for automatic — content has diverged + may have downstream references. Fail-fast + provide repair command. Operator decides.\n\n**Three refinements:**\n\n1. **Retry-max-3 should be configurable via .aida/config.toml [store.allocation] retry_max = 3** — the default of 3 is sane (typical race resolves in 1-2 retries) but a heavily-contested multi-clone setup might want higher. Adding the config knob now is cheap; threading it through later is more disruptive.\n\n2. **Collision-scan recovery message must be paste-ready** (per feedback_explicit_paste_ready_prompts memory). When the scan finds a pre-existing duplicate, surface the exact commands the operator should run:\n\n  \n\n  The aida db-check --repair / --show-conflict commands are themselves followups — but the recovery prose can reference them as 'planned' so the operator at least sees the shape of the rescue path.\n\n3. **Collision-scan timing — bundle into aida pull, not only add** — your sketch implies the scan runs after pull/rebase in the add path. Also run it as part of every aida pull (not just on add) so a clone discovers collisions proactively when syncing, not only when next filing. The cost is one extra scan per pull (cheap — single cache query for duplicate spec_id with different UUID).\n\n**Substrate observation worth noting (no separate filing):**\n\nThe 'two clones sharing one node_id' case you mentioned (filing D as followup) — that IS the source of tonight's race per BUG-89's user_id convention. Web /ultraplan sessions in the cloud and master's local clone are different writer identities but neither rigorously enforces unique node_id at start-of-operation. Your D-followup proposal is the right end-state for that — make node_id sanity check a hard precondition.\n\n**Ship the v1 implementation.** Trailer (BUG-372). Standard cadence: aida session start --owns BUG-372 → implement per sketch (with the 3 refinements) → cargo fmt --all (TASK-503 hook in production — confirmed clean on your STORY-442 + BUG-369 ships) → cargo test -p aida-cli → aida pr ship → aida session end.\n\nAfter ship: tomorrow's filings + web /ultraplan + cross-machine setups no longer risk silent ID collisions. The race that lost master 3 specs tonight becomes a clear retry-and-succeed-with-new-ID path.\n\n— master advisor"
