- id: 01a21557-5482-7e01-941e-a1bdac028ef1
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 5f478d73d9a4 (diff origin/main...HEAD: aida-cli-lib/src/review_watch.rs only)

    Acceptance evidence:
    - AC1: promotion_pass selection. When the PR's own verdict at the head does not approve, a spec-keyed approval at the same exact head recorded later (an override) wins. spec_approvals_by_head keeps the newest approval per head and no longer drops unattested ones, so they print 'skipped (approval carries no recorder attestation…)' instead of the PR being absent. Test: bug2766_override_approval_after_refusal_promotes (an override newer than the refusal is promoted [STORY-1 @ …]; an older one adds no line and no edit).
    - AC2: reviewed_fast_settled returns HeadCi. Runs whose jobs are named 'label event …' are skipped. A non-cancelled 'ci-tier: full' run gives 'skipped (ci:full already applied: FULL run at this head is in progress|has finished)'. Test: bug2766_label_event_runs_and_full_runs (FULL in progress gives that line and no edit; a running label-event run over a settled fast run is promoted).
    - AC3: changes with head_branch train/* are filtered out before promotion. A receipt lock busy error becomes 'skipped (busy: PR-N.full-ci.lock is held; retried next tick)' and the pass returns Ok. Test: bug2766_train_prs_skipped_and_busy_lock (considering the train PR would fail the pass because its gh stub fails; asserts Ok, one line, empty stderr).
    - Lane jobs: 6 passed (3 new tests, both bug2764 tests, the standalone PR-keyed record path). make check-ci-fast rc=0.

    Probe findings and fixes:
    - Found in self-review and fixed: returning Full for a cancelled FULL run would have bypassed request_full_ci_with's cancelled-run re-apply (TASK-3105). A cancelled FULL run is now not decisive.
    - Precedence: the PR's own approval at the head always wins. A refusal at the head yields only to a strictly later spec approval, and only when both timestamps parse (RFC 3339, compared as instants). A missing timestamp keeps the old behaviour (own wins).

    Residual risks:
    - The '[train]' title is not checked. Discovery does not fetch titles, and a fixture pins its field list. Train detection uses the train/ head prefix, the same signal ci.yml uses.
    - I could not read #4600's live verdict records from this host. The override mechanism (a spec-keyed approval after the reviewer's request-changes at f24ccdbb) is inferred from the fact that the PR was absent rather than listed as skipped.
    - More forge calls: jobs are now fetched for pending runs too (one call per run until a decisive one).
