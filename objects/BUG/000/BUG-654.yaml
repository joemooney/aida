title: aida worktree enter silently no-ops the cd when the installed shell wrapper is stale (no hint)
description: 'aida worktree enter <epic> prints cd <path> but if the installed ~/.aida/shell-init.sh wrapper predates STORY-716 (no worktree-enter in its auto-eval case), the cd is never applied -- the shell stays put, aida focus then shows "No focus set", and there is NO hint why. Operator ran enter twice + was confused 2026-06-29. FIX: detect a stale/missing wrapper (e.g. an AIDA_SHELL_WRAPPER version marker) and, when worktree enter emits a cd that likely will not be evaled, print a one-line stderr hint: "shell wrapper looks stale -- run aida dev shell-init --install to enable auto-cd, or eval the output." Sibling of BUG-642 (wrapper doc-drift).'
