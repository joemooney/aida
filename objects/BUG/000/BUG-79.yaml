  content: |-
    Updated diagnostic 2026-05-11:

    Confirmed via user shell:
    - ls -la /usr/bin/gh — exists, executable, 54MB, owned by root
    - gh --version — works, returns 'gh version 2.81.0 (2025-10-01)'
    - ldd /usr/bin/gh — 'not a dynamic executable' (statically linked, no .so deps)
    - file /usr/bin/gh — ELF 64-bit LSB executable, statically linked, stripped

    So:
    - Hypothesis (1) 'gh uninstalled but bash-cached' — RULED OUT (file exists)
    - Hypothesis (3) 'PATH walk caching' — RULED OUT (file is statically linked, can't be loader issue)
    - Hypothesis (2) 'is_executable false-positive' — STILL POSSIBLE but unlikely given file metadata is healthy

    New leading hypothesis: BUG-74's PATH walk returns a slightly-mangled path string (trailing whitespace, double slash like '/usr/bin//gh', wrong encoding) that passes is_executable's syntactic check but fails execve's exact-path check. Need to log the exact path string being passed to spawn.

    To confirm: user should run AIDA_DEBUG_GH=1 aida pr auto-queue-review --branch <any> and compare the printed 'found gh at <path>' string byte-for-byte to '/usr/bin/gh'. Trailing newline, hex 00, or duplicated slash would be the smoking gun.

    Fix: in BUG-79's implementation, after is_executable returns true, do  as a smoke test. If smoke test fails, fall back to next candidate. AND log the exact path bytes when failing, not just the unicode string.
