title: review_title_matches vs format_review_story_display case-sensitivity divergence
description: 'review_title_matches (main.rs:10703) is case-insensitive; format_review_story_display (main.rs:10031) is case-sensitive. Both consume titles from format!("Review PR-{}: {}"), so synthetic auto-queue is consistent. A hand-typed story "review pr-15: foo" would route via aida queue work PR-15 but render as plain STORY-NNN. Surfaced by /aida-review deep-pass (Probe 1) on PR-19. Either normalize both to case-insensitive or add a comment locking the synthetic path as the only supported producer.'
