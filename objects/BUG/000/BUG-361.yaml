  content: 'Codex implementation sketch before code: inject the visibility check in session_end after the target lease is resolved and before confirmation/cleanup, while the worktree and lease still exist. Detection will reuse the existing BUG-360 primitives: branch_commits_ahead_main(project_root, target.branch) > 0 plus detect_open_pr_for_branch(project_root, target.branch) == NoOpenPr; unknown gh states do not assert missing PR. Warning shape follows BUG-360: yellow warning: prefix, names lease/spec, branch, commit count, and missing PR, and remains non-blocking for both normal and --force session end. Recording will append a best-effort STORY-325 punt-ledger entry with category other, raised_by session-end, detail describing the unshipped local commit/no-PR state, and resolution_path punted so the morning sweep has a durable signal. Tests: pure classifier/formatter tests for commit/no-PR vs open-PR/no-commit/unknown-PR cases, plus ledger append coverage if the helper is separated cleanly. Limitation: this closes explicit aida session end/orchestrator cleanup paths; a raw process exit still needs a future shell/harness exit hook if no AIDA command runs at all.'
