title: drain exit summary double-counts retried specs and exits 0 despite shelves
description: 'Observed live (2026-09-05, drain of 12): STORY-830 bounced in phase 3, was retried in-drain, and shipped — but the exit summary listed it BOTH in "already shipped (5)" AND in "3 specs shelved on phase failure", printed "next 12 (mismatched)", and the drain exited 0 even though the summary claimed shelves (EPIC-28 contract: exit 2 when anything shelved/skipped). A spec''s FINAL disposition should appear exactly once: retried-then-shipped is shipped, not shelved; the shelved list must contain only specs still parked at exit; the exit code must reflect the final shelf set (truly-empty = 0). Also fix the "(mismatched)" annotation to say what actually mismatched or drop it. Acceptance: integration test driving a shelve-retry-ship sequence asserts single-listing, correct exit code, and a coherent summary line.'
