title: aida human / burndown explain still list structurally-deferred specs (aida defer flag); collect_open_facts skips archived but not the deferred view-flag
description: 'aida defer <ID> (STORY-584) sets the structural deferred view-flag (req.deferred + deferred_until), which means hidden from default views. But collect_open_facts (the source for aida human and burndown explain) only skips req.archived and terminal statuses, not req.deferred. So a deferred spec still appears on the human worklist as ungroomed/umbrella. Observed 2026-06-14: deferred STORY-597, STORY-601, EPIC-40 still showed on aida human. explain_open recognizes the LEGACY deferred: tag (OpenBucket::Deferred) but not the structural flag. Fix: skip req.deferred in collect_open_facts, parallel to req.archived (deferred = hidden from default views, same treatment).'
