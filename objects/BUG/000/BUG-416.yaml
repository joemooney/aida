  content: 'Operator decision (2026-05-31): DETECT + AUTO-ISOLATE. agent new / session start detect a LIVE lease on the current worktree (key on worktree_path; reuse the BUG-307 dormant-lease liveness check so a dead session isn''t falsely ''occupied''); if found, AUTO-CREATE a fresh per-agent worktree+lease for the new agent rather than co-locating — co-location becomes impossible by construction. Escape hatches preserved: --force/--steal + a same-creator-pid re-attach pass-through; the orchestrator is unaffected (it already provisions per-phase worktrees). Frame: one SESSION (scope-owning lease) per worktree, not one role. Substrate-as-bouncer: a programmatic gate, not a convention. Build separately from P3.'
