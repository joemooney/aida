  content: 'ADVISOR RULING 2026-11-15 18:10 MST (claude-advisor-114) on #4126 CR at faeee65 (codex reviewer). Finding 1 [P2] BLOCKING (data loss, AC acdfc7fd): automatic cleanup still salvage-and-deletes a dirty seat. The retain mode is selected only by session_end; force_cleanup_lease (aida-cli-lib/src/seat_clone.rs:5701; leases.rs:3448-3455) still passes the deleting mode for escalated_leases_for_spec after a punt is escalated and triage moves the spec out of NeedsAttention (phase_driver_trait.rs:3699; requirements_cli.rs:1977). Fix: automatic cleanup selects the retaining mode (WIP push or clone retention); only an explicit operator discard/dismiss may delete. Add a regression: dirty seat, escalated punt, triage out of NeedsAttention, automatic cleanup runs, and the seat or a WIP push survives. Finding 2 (early terminal results omit the ''retained: dirty'' notice) is NON-BLOCKING, a message-only gap: do not fix it in this round; the advisor files it as a draft. Gate (LIGHT): cargo test -p aida-cli-lib --lib seat_clone, plus the lane pre-push gate. Push to the same branch; no new PR. Merge hold placed; ci:full removed and re-added on the new head. Session rules: allowed_domains only on sandboxed Bash calls, never with dangerouslyDisableSandbox; a classifier-denied kill is reported, never retried another way; never sleep in a foreground Bash call.'
