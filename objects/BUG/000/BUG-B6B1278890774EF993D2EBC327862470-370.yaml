title: A punted lane's uncommitted work is deleted with its seat clone (lost twice on 2026-11-15)
description: |
  Twice on 2026-11-15, a dell1 lane that PUNTED with uncommitted edits had its seat clone removed, and the work was lost:
  - 15:5x BUG-2586 rework: 30 lines of coordination.rs (described in the punt comment).
  - 16:3x TASK-3787 slice B: the full session.rs split into session/{mod,list,interactive,headless,containment,lease_lock,inline_tests}.rs plus the agent_registry test lift and seven repointed source-inspection tests (hours of codex work; the punt comment says "draft remains uncommitted").
  In both cases the lane-run log ends "nothing to publish ... seat clone removed and its base pin released / lease deleted".
  The expected protection (dirty/unpublished-work retention) did not apply to a punted headless implementer.

  Acceptance:
  - A seat with uncommitted or unpushed changes is NEVER removed at lane end: either the work is committed to the lane branch and pushed as a WIP commit (not a PR), or the seat clone is retained with a clear "retained: dirty" line in the lane result.
  - Regression test: a headless implementer that punts with a dirty tree leaves its changes recoverable.
