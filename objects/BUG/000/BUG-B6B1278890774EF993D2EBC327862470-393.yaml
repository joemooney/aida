title: aida queue rework spins at 100% CPU for 9+ minutes on BUG-2593 (gate-ledger/by-spec open); earlier reworks took minutes each
description: |-
  Observed 2026-11-16 00:41-01:14 MST by the product seat. 'aida queue rework BUG-2593 --for implementer' (pid 403888) ran in state R at 100% CPU for 9+ minutes with no output. Its open fds were cache.db (+wal/shm), .aida/gate-ledger and .aida/gate-ledger/by-spec (658 entries, 1254 by-spec files, 46M). The three reworks before it in the same loop (BUG-2598, BUG-2614, STORY-2844) took about 23 minutes between them, although two of them only refused on track. ptrace is blocked on this host, so there is no stack.

  ## Acceptance
  1. aida queue rework finishes in under 10s on this repo's current gate ledger (658 PR ledgers), or prints progress and names the slow phase.
  2. A track refusal (other-track) is decided before any gate-ledger scan.
  3. A regression test or bench with a ledger of more than 1000 entries bounds the scan (no quadratic per-spec rescans).
