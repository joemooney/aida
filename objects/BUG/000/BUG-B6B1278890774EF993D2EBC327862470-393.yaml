    Complete actionable findings:
    1. [P1] aida-cli-lib/src/queue_cmd/work.rs:3030-3039: raw recovery lets an unverified approval suppress a real WAITING refusal. Reproduce with an indexed PR ledger containing a fingerprintable active WAITING round followed by an ordinary miskeyed approved copy, a phase-3 ownership witness for that approved copy on another PR (as in miskeyed_fixture), and an unrelated malformed ledger. Complete discovery removes the foreign approval and exposes WAITING. With failed discovery, current_verdict withholds the fingerprintable rounds, but newest_review_of on the unfiltered recovery events selects the foreign approval, so recovery returns Unavailable, admission ignores it, and otherwise-pickable work can be mutated/queued. Do not use ownership-unverified non-waiting rounds as clearance of a waiting candidate. Add a regression asserting WAITING refusal and unchanged status/comments/queues for this case. This does not depend on the two intervening base commits.
