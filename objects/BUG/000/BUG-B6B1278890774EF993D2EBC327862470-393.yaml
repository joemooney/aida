  content: 'Advisor ruling 2026-11-16 10:12 (advisor-117) on the #4158 round-1 CR at a2602f5 (codex, STRICT). BOTH findings are BLOCKING. P1 (fail-open, queue_cmd/work.rs:2984): bound_review_keys errors return Unavailable before known WAITING verdicts are inspected, so a malformed unrelated ledger lets rework mutate waiting work. Fix: preserve the known wait, or refuse admission when discovery is unavailable. Extend bug_2500_repeated_waiting_rework_leaves_status_comments_and_queue_unchanged with an unrelated invalid ledger and assert refusal with no mutations. P2 (acceptance .ac56b111 untested): add a rework-entry regression with representative ledger data that asserts completion within a bound, or progress output naming the slow phase. It must fail if the phase message is removed. Before pushing, run cargo test -p aida-cli-lib queue_rework plus the lane pre-push gate. ci:full is removed and the hold stays; it is re-added when the new head is pushed. Rework runs codex.'
