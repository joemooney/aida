    Acceptance status:
    - BUG-b6b1278890774ef993d2ebc327862470-393.ac56b111: verified by source phase message and bug_2629_rework_entry_reports_review_phase_within_ten_seconds, which runs the representative 1001-ledger rework fixture, asserts progress and enforces a ten-second watchdog. Existing implementer validation reports the bug_2629 filter passing; reviewer did not execute tests.
    - BUG-b6b1278890774ef993d2ebc327862470-393.aca2b718: verified by track_refusal preceding forge/ledger lookup in handle_queue_rework and bug_2629_other_track_rework_refuses_before_review_discovery.
