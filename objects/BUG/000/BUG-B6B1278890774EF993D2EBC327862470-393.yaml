  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2629):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 367c23a7723a
    Recorded: 2026-11-21T00:50:56.160552086+00:00
    Findings:
    1. aida-cli-lib/src/queue_cmd/work.rs:3328 — BUG-2629 AC3 still fails for N fingerprinted changes bound to one spec. reconcile_waiting_verdicts calls current_verdict for each review key. Each local change projection opens another discovery, and Inventory::current lists all N bindings and stats all N folded ledgers on each open. active_verdicts_for repeats this when no open change answers. The outer DiscoveryScope saves payload reads but leaves quadratic filesystem work. The scaling test bounds whole.bytes and whole.opened while checking directory entries only for the initial binding pass. Reuse a checked batch projection through reconciliation and selection, refreshing after a write, and bound whole-resolution directory entries and stat work.
    2. aida-cli-lib/src/queue_cmd/rework_bindings.rs:926 — When queue work supplies a selected change, discover skips the spec inventory. If ownership filtering that selected change fails, recover builds the spec-label view from the selected ledger and the unbound file alone. A newer WAITING review recorded for the spec on a sibling change is invisible. For example, give the selected change an older fingerprinted approval, a sibling a newer phase-3 wait, and another bound sibling a malformed ledger. Recovery can return Unavailable, which refuse_waiting_pickup admits. Recover the full label view, or refuse pickup when its completeness cannot be established. Cover this through selected-change pickup.
    3. aida-cli-lib/src/queue_cmd/rework_bindings.rs:770 — Ownership::events uses store::read_file, which returns an empty vector for unreadable or non-UTF-8 input and drops malformed lines. With no surviving fingerprint, needs_witnesses is false and the method reports success. For a certified, indexed change whose only WAITING round is in a ledger with invalid UTF-8, no recovery or named refusal is triggered. The ordinary projection also loses the wait, and implementer admission proceeds. Use an error-preserving, bounded read for inventoried ledgers before the witness fast path, and cover a sole unreadable bound change without another ledger to trigger recovery.
    4. aida-cli-lib/src/queue_cmd/rework_bindings.rs:454 — Recovery also has quadratic per-spec rescans. For N distinct reviews present in both a change ledger and the unbound ledger, each unbound event scans the bound vector with any and potentially retain, comparing full JSON records. All input can fit the byte and parse budgets while those comparisons grow as N squared. Index the duplicate records once, preserving the ownership-free preference and event order, and add a scaling assertion for this mirrored-history case.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
