    Deep pass, in order:
    1. Cross-references: numeric ship, mandate selection and train use covered spec IDs. The gate uses the existing execution-mode rule. Cover, approval and merge pin must name the same head.
    2. Format edges: invalid forge label entries and unreadable change-ledger evidence cannot establish an unheld PR. Legacy marker and clearance existence checks include dangling symlinks. The regression exercises a wrong head, recorded label, symlink and malformed clearance.
    3. Multiplicity: the current named specs establish mode supervision. Historical and trace-only subjects add restrictions. The test with a drain-mode named spec and a supervised trace-only spec refuses.
    4. Adversarial inputs: fixed the separation of supervision cover from hold-release authority in the ship call sites and strengthened both existing wiring assertions. Direct ship reconfirms an open, unheld pinned head. Train refresh requires the same live mandate ID and approved head before the forge call.
    5. Authority: cover still requires the mandate principal's validated advisor grant, ship-held scope, supervised opt-in, independent approval and protected-path/human gates. An unheld cover fails the hold-release predicate and the train's hold-release branch. Rework-release decisions still require a typed rework marker. The test for a non-advisor seat and the protected-path, missing-mandate, stale-approval and late-hold refusals exercise the denials.

