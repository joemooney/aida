title: Mandate with --include-supervised refuses an unheld, approved, green PR that is supervised only by an unset mode ('no typed merge-hold marker'), while a held one ships
description: |
  ## Problem
  The active mandate (6d50e592, `--ship-held --scope dispatch --include-supervised`) refuses to ship an approved, green PR whose specs are supervised only because their execution_mode is unset, when the PR carries no merge-hold marker. Refusal: "the PR has no typed merge-hold marker for a mandate to release; a human must ship it" (MandateRefusal::NoHoldMarker, aida-cli-lib/src/gate/mandate.rs:1614). Observed for #4223 (15:15 and 16:40 UTC, 2026-11-17) and #4220.

  The result is inverted: a PR the operator held can ship under the mandate, but an unheld PR with less recorded risk cannot. The mandate's `--include-supervised` flag reads as if it covers supervised specs, but the unset-mode supervision gate isn't a hold the mandate can release, so the operator is paged for exactly the PRs the mandate was minted to clear.

  ## Acceptance
  1. Under an active mandate with `ship-held` that covers the spec class (`--include-supervised` where required), an approved, green PR with no merge-hold marker, whose only blocker is supervised-by-mode (unset or non-drain), ships through the mandate path. It gets the same independent-approval, pinned-CI, protected-path and always-human checks as a held PR.
  2. Operator-only specs, always-human classes and protected gate paths (`aida-cli-lib/src/gate/`, unless `--include-gate-paths`) are still refused.
  3. The mandate audit ledger records these ships with a distinct reason (`supervised-by-mode`, not `hold-release`).
  4. Regression: an unheld, supervised-by-mode PR ships under a covering mandate and is refused without one. A held PR's behaviour is unchanged.
  5. If the advisor rules the inversion intended, record the ruling here and change the refusal text to name the actual remedy (set mode drain, or a human ships), instead of pointing at a missing hold marker.
