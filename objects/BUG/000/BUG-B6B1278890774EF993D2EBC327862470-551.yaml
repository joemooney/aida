  content: |-
    ## Implementer approach

    Root cause: `acquire` calls `migrate_legacy_deadline`, which arms `deadline_boottime = floor(CLOCK_BOOTTIME) + min(ttl, 600)`; `stale_at` then expires on `floor(now) >= deadline`. The test holder has ttl_secs=1, so when the second ticks between migration and the stale check (microseconds apart) the unknown holder reads Expired and is stolen. Real in production: whole-second truncation lets a deadline fire up to 1s early (release.sh truncates /proc/uptime the same way).

    ### Acceptance criteria and evidence
    - AC1 (unit): `stale_at` expires only on `now > deadline` (strict), which proves elapsed > ttl despite truncation; `boot_deadline_expires_unknown_and_refused_but_never_alive` updated so deadline==now retains.
    - AC2 (unit): test sets ttl_secs=LEASE_SECS and runs acquire 100x on its own tempdir; no env used.
    - AC3 (unit, injected clock): new `truncated_boot_deadline_never_expires_early` drives `stale_at` with deadline armed at (b,N)+1 and clock (b,N+1) -> retained, (b,N+2) -> Expired.

    ### Expected files
    - `aida-cli-lib/src/merge_lock.rs`
    - `docs/cli/04-git-lifecycle.md` (one sentence)

    ### Ambiguities / conflicts as questions
    - None
