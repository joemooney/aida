title: 'merge_lock: an unknown-process holder sometimes does not block acquire (flaky train_observation_preserves_unknown_and_refusal, possible real race)'
description: |-
  Found 2026-11-28 05:15 MST by advisor aida-d3 (filed by product-15). Train #4816 (#4784 alone) went red on ONE test: merge_lock::tests::train_observation_preserves_unknown_and_refusal (aida-cli-lib/src/merge_lock.rs:1032): `acquire(..., Duration::ZERO).unwrap_err()` got Ok, i.e. a holder whose process is None (unknown) did NOT block acquire. Main CI was green at the train base 6f4bd7e2 and #4784 touches only repair_journal/doctor/docs, so it is intermittent. In lease code an intermittent pass can mean a real acquire race (two holders).

  Suspects: acquire's staleness check reading file mtime or record age vs a wall clock (sub-second / clock-granularity edge); a zero-duration wait racing the holder write; parallel tests sharing a lock dir or env.

  ## Acceptance
  - AC1: root-cause it; an unknown-process holder ALWAYS blocks acquire until it is positively proven stale (fail closed); no wall-clock/mtime edge can make it look absent.
  - AC2: the test uses an isolated lock dir and no shared env; a loop-100 regression (the test repeated 100x in one run) passes.
  - AC3: if the race is real in production code, say so in the PR and add a test that reproduces it deterministically (injected clock).
