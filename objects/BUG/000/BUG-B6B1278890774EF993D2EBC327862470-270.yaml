  content: 'Investigation: the reported exact tag from:2026-11-08-review-closeout, together with area:orchestration, succeeds through the installed CLI using an isolated --file YAML store and persists both tags. No tag-specific rejection found in the canonical add parser (parse_tag_list permits colons/digits/hyphens). Added a canonical Git-store CLI regression covering the exact tag alone, combined tags, and area-only control; lane job j20261109T045922335-2-0 is compiling. Original six failing commands, exit codes and unfiltered stderr are absent, so root cause is not yet established. No production behavior change is justified by current evidence.'
