title: Commit trailer parser rejects hash-form TASK/STORY IDs (41+ chars), so reviewer auto-queue and merge-time completion miss them
description: 'pr_lookup::looks_like_spec_id (aida-cli-lib/src/pr_lookup.rs:1563) rejects any token longer than 40 chars. A hash-form ID such as TASK-b6b1278890774ef993d2ebc327862470-003 is 41 chars (BUG-<32hex>-NNN is exactly 40, so BUG IDs pass by luck; TASK/STORY/EPIC hash IDs never do). Observed on PR #2955: commit subject ends ''(TASK-b6b1278890774ef993d2ebc327862470-003, ... -006)'' and ''aida pr auto-queue-review'' reports ''carries no (REQ-ID) trailers'' and files no reviewer story. The same parser feeds merge-time completion, so those tasks will also not auto-complete on merge. Fix: raise the length bound to cover <PREFIX>-<32 hex>-<seq> (or drop it in favor of the shape check) and add a test for a hash-form TASK id.'
