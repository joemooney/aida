title: Fix type prefix fallback for built-in types not in database
description: When creating requirements with types like Task, Bug, Story that aren't in the database's type definitions (because the database was created before these types were added to defaults), the CLI would fall back to REQ prefix instead of the type's correct prefix (TASK, BUG, STORY, etc.). Fixed by adding hardcoded fallback prefixes in get_type_prefix function.
