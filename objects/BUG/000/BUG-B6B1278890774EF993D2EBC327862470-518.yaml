title: Review-watch occupied-worktree recheck runs git probes while holding the global admission and train-member locks (admission starvation)
description: |
  Raised from #4413 BUG-2720 deferred F2 (advisor-122 2026-11-24 12:55; filed by product-15). MEDIUM. This is the admission-starvation class seen 2026-11-24 (trains blocked by long lock holders).

  ## Acceptance
  - AC1: The occupied-worktree recheck in review_watch.rs (~:1699, :1836) runs its git probes OUTSIDE the global admission and train-member locks, then REVALIDATES the probed state cheaply inside the lock (refuse/retry if it changed). Test: a slow probe does not hold the admission lock (another admission proceeds meanwhile).
  - AC2: Test: a worktree state that changes between probe and revalidation is detected and not admitted on stale evidence.
