  content: 'ADVISOR (04:36): raised to HIGH. Evidence 2026-11-25 00:01-04:36: no landings for 4.5h. The review-watch worker (pid 1673606) held admission.lock while its reviewer child ran a slow  (>5 min). The auto-train failed 3 times on admission.lock busy, and the operator manual train waited and timed out. Fix direction: the review-watch must NOT hold admission across reviewer launches or store pulls; take admission only for the dispatch decision.'
