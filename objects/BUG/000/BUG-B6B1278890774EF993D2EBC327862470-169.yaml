- id: 01a19c19-8d5b-7470-9860-4c41e8ba879e
  author: joe
  content: 'IMPLEMENTER FINDING (bug-spotted, minor), to file as a separate spec. Neither CLI `aida add` (read-only store ID allocation) nor the MCP finding tool was available in this sandbox. `aida-cli-lib/src/zen_drive_root.rs` (~line 388, guided arm) spawns `launch.program`, which is `codex` for a Codex guided launch (session.rs GuidedLaunch). It sets `AIDA_SESSION_ROLE=implementer` in the spec worktree but never finalizes through `codex_tool_env::prepare_launch` and makes no explicit grant decision. Codex tool shells therefore lose the lane role, and the operator''s inherited grant reaches the lane. The BUG-2398 LAUNCH_INVENTORY did not catch it because it keys on grant selectors. The new BUG-2395 ROLE_LAUNCH_SITES ratchet records it as RoleRoute::KnownGap. Fix: set an empty-baseline grant decision and call prepare_launch before spawn on the Codex arm, then move the entry to LaunchInventory.'
