title: Reviewer records WAITING on a supervised merge hold that only an APPROVED verdict can release, deadlocking the PR
description: 'Observed 2026-11-09 on PRs 3715, 3670, 3627, 3687 after PR 3698 (BUG-2500) added WAITING verdicts. The merge hold''s release condition is a fresh APPROVED verdict at the current head, but the reviewer found no defects and recorded WAITING on merge-hold-gate and human/advisor clearance, so neither side can move. Requirement: a red merge-hold-gate whose release condition is this review''s own APPROVED verdict must not produce WAITING; the reviewer records APPROVED when it finds no actionable defects. WAITING remains for genuine external evidence such as operator canaries. Acceptance: fixture with a held PR, green required CI and no findings yields APPROVED; a held PR with outstanding operator-only evidence still yields WAITING; test covers both.'
