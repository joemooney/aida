title: aida-mail-notice.sh JSON escaping under mawk (Ubuntu's default awk) turns backslashes into control characters
description: 'Source: work GDMS CI report. aida-core/templates/hooks/aida-mail-notice.sh:161 escapes with gsub(/\\/, "\\\\"). mawk reads the replacement string differently from gawk, so backslashes in a notice decode into control characters and the hook emits corrupt JSON. Fix it in the template master, then make sync-templates. Acceptance: a test runs the hook under mawk and under gawk with input containing backslashes, quotes and tabs, and the output parses as valid JSON with the original text.'
status: InProgress
priority: High
