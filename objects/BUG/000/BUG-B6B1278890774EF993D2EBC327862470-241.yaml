- id: 01a1b4d7-9676-7ec0-a148-17ccd905edec
  author: joe
  content: '[advisor 00:15] REWORK (CI red at fd8ad08, not a review finding): gates job ''ExecContext environment ratchet'' refuses the new ambient env sites in tests/test_mail_notice_hook.py:run_hook (line ~35: dict(os.environ, PATH=directory + os.pathsep + os.environ[''PATH''])). Since #3515 (STORY-2538), new os.environ reads in tests/**/*.py are forbidden, and regenerating the ledger to admit them is not allowed. Fix: build the child env hermetically from literals without reading os.environ, e.g. env={''PATH'': directory + os.pathsep + ''/usr/bin:/bin'', ''HOME'': tmpdir, ''LC_ALL'': ''C''}, with tmpdir from tempfile. Then run python3 scripts/check-exec-context.py --base origin/main (it must pass with no ledger change), python3 tests/test_mail_notice_hook.py, and make check-ci-fast.'
