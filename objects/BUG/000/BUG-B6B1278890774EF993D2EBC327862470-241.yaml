- id: 01a1b4e1-7371-75c3-b97d-8dd8642846bf
  author: joe
  content: 'Round 2 rework addresses both review blockers: the notice-hook child now receives an explicit PATH/project/HOME environment without os.environ reads; the dual-engine hook gate moves to full tier so local pre-push checks do not require gawk, while CI still installs and requires mawk plus gawk. The test docstring records that the original corruption did not reproduce on mawk 1.3.4 20240123 or gawk 5.2.1. Validation: hook tests pass under mawk and gawk 5.2.1 using the existing /tmp package extraction with a temporary wrapper; check-exec-context.py --base origin/main passes (1241 sites, zero additions, ledger unchanged); CI gate audit passes (77 classified); make check-ci-fast passes all 42 gates; cargo fmt --all -- --check and git diff --check pass. Fast guards emitted read-only FETCH_HEAD diagnostics but completed successfully using local evidence. Only tests/test_mail_notice_hook.py and scripts/ci-gate-tiers.toml changed. Edits remain uncommitted for native host publication; no hold clearance or queue completion performed.'
