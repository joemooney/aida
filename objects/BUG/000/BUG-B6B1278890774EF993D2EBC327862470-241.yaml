  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was shelved on: reviewer/verdict:request-changes: Hook fix is correct and meets acceptance, but the new Python test adds forbidden ambient-env sites (ExecContext ratchet red in CI gates) and the fast-tier gate hard-fails on hosts without gawk. No triage reason was given.'
