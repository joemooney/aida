title: Review-watch launches a fresh full review on a clean update-branch head, ignoring the carried approval and the final-round scope
description: |
  Found 2026-11-22 (advisor-122 ruling 15:24; filed by product-15). PR #4382 (BUG-2706) was APPROVED at 20d746c9 in its r3 FINAL (cap) round, scoped to findings 2-4. The advisor then ran a clean `gh pr update-branch` (merge-only commits of main 30da58d4 and 6be38166 → head e07f437c). Review-watch launched a FRESH FULL reviewer on that merge-only head (reviewer bafa16c1), which ignored the carried approval and the final-round scope. It recorded Changes Requested with 5 findings, 3 of them already deferred and 1 a re-raise of a deferred class. Throughput cost: a full reviewer run, plus manual triage and an advisor ruling.

  ## Acceptance
  - AC1: When a PR's new head differs from an approved head only by a clean merge of the protected base (no conflict resolution, no non-merge commits), review-watch does not launch a fresh full review. The approval carries, per the project's carry-over policy.
  - AC2: If policy requires a review of such a head, its scope is limited to the merge itself (conflict-resolution hunks and base-induced CI failures), and the prior round's scope and cap state are passed to the reviewer.
  - AC3: A regression test approves head A, update-branches to merge-only head B, and asserts no full review dispatch (or a merge-scoped one).
