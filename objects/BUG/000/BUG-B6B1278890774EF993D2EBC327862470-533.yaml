title: A seat pin ref outlives its clone and blocks a fresh clone at that path (reference already exists)
description: |
  advisor-122 2026-11-26 07:20 (filed by product-15). At 07:10 a BUG-2738 lane launch failed: "cannot create the private clone this contained seat needs at /home/dirtlab/ai/aida-worktrees/aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-499: git could not pin refs/aida/seats/aida-seat-aida-bug-...-499 in the main checkout: ... reference already exists". The clone directory did not exist; the pin ref did, pointing at ac22ab7f (2026-11-23), which was already on origin/main. So the pin had outlived its clone and blocked a fresh clone at the same path. The product seat removed it by hand (ancestor-checked first) and the relaunch then proceeded.

  ## Acceptance
  - AC1: clone creation treats an existing seat pin whose commit is already reachable from the origin base (or any remote branch) as STALE and replaces it, with a log line; a pin protecting a commit that is on NO remote is never replaced (refuse with the salvage hint instead).
  - AC2: session end / seat salvage removes the seat pin together with the clone, so a pin cannot outlive its clone.
  - AC3: tests for the stale-pin replace, the unique-commit refusal, and pin removal on session end.
