- id: 01a21919-8c95-7332-b5e8-bc30bee1f85a
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: ac47b96cb6 (git diff origin/main...HEAD: seat_clone.rs +38, lifecycle tests +59).
    Acceptance evidence (per the authoritative brief): stale pin with no clone and no lease is released and re-pinned — bug_2772_a_stale_pin_with_no_clone_or_lease_is_replaced; lease-held pin and live-clone pin refuse, pin untouched — bug_2772_a_pin_held_by_a_lease_or_a_live_clone_refuses. AC2 (session end/destroy releases the pin) was already in place (destroy -> release_pin) and covered by task_2053_bwrap_destroy_salvages_then_removes_clone_target_and_pin. Targeted run: cargo test -p aida-cli-lib --lib -- seat_clone: 404 passed, 0 failed. make check-ci-fast: exit 0.
    Probes: (1) pin name vs lease match both use the clone dir name, same as orphan_pins. (3) N leases: any() — one naming the clone refuses. (4) dangling symlink at dest: symlink_metadata sees it -> refuses (safe). Concurrent launches at one path: compare-and-delete on the read oid, then create_dir claims; the loser refuses. (5) only refs/aida/seats/<dest> is touched; removal re-checks dir absent + no clone lease right before update-ref -d <pin> <oid>.
    Residual risks: AC1's 'commit on no remote -> refuse' rule is not implemented — the brief keys staleness on no clone + no lease instead (the pin only protects a base commit main already holds). An unparseable lease file is skipped by list_leases, so it would not block release; the clone dir is absent in that case anyway.
