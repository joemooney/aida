title: 'dispatch impl/take refuse every launch: occupancy scan parses .activity.toml/.manifest.toml companions as session leases'
description: |
  Every `aida dispatch request impl|take` launch is refused on this repo. dispatch.rs (~line 1900, the worktree occupancy check) reads EVERY `*.toml` in `.aida/sessions/` as a SessionLease and returns "unknown occupant: malformed session lease" when parsing fails. The `<id>.activity.toml` and `<id>.manifest.toml` companions (158 activity sidecars here) never parse as leases. Evidence: STORY-1917 demo step 7, request 15d8853b (impl demo-lane), executed by the scheduler tick and refused with "cannot launch impl lane `demo-lane` (STORY-1917): unknown occupant: malformed session lease /home/joe/ai/aida/.aida/sessions/01a12b1c7882.activity.toml". leases.rs already has the correct rule: `is_session_lease_file` (STORY-1429/BUG-114). Acceptance: the dispatch occupancy scan filters with `leases::is_session_lease_file`, so companions and staging files are skipped. A real lease that is unreadable or malformed still fails closed. Regression test: a sessions dir holding an activity.toml and a manifest.toml next to a valid lease admits, and a corrupt `<id>.toml` refuses. Grep for any other `.aida/sessions` scanner with the same `extension() == "toml"` pattern and fix it the same way.
