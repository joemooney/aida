title: 'Launching 8 lanes at once on dell1 made the host unresponsive (ssh banner timeout): lane admission has no per-host cold-start or memory-headroom limit'
description: |
  Observed 2026-11-18 ~05:15 MST: the advisor launched 8 lanes on dell1 at once (4 Claude conflict reworks, 4 codex) right after its disk was freed to 171G. Within minutes dell1 stopped answering ssh (timeout during the banner exchange) while still answering ping: user space was starved, consistent with memory/CPU exhaustion from 8 concurrent cold cargo builds (each lane overlay starts with a cold target). Every lane on the host stalls, and recovery may need physical access.

  The cargo wrapper's build slots gate `cargo build/test` invocations, but lane LAUNCH admission (`--over-wip`, fill-slots) has no per-host limit on concurrent cold starts and no memory-headroom check.

  ## Acceptance
  1. Lane launch admission enforces a per-host setting `lanes.max_concurrent_cold_starts` (default 2; dell1 config 4). A launch beyond it queues and starts when an earlier lane's first build finishes (or after a timeout), instead of starting at once.
  2. Launch admission also checks host memory headroom (available RAM + swap, a configurable floor) and refuses or queues with a named reason below it.
  3. `--over-wip` bypasses the WIP cap but NOT the cold-start or memory limits (a separate explicit override, logged).
  4. A test covers queueing on the cold-start cap, refusal below the memory floor, and --over-wip not bypassing either.
