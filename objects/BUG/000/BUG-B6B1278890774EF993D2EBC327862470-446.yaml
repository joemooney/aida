    Verdict: CHANGES REQUESTED
    Reviewed commit: fb320f60f338
    Recorded: 2026-11-19T12:18:22.521297766+00:00
    Findings:
    1. BUG-2682 AC3: actually remove AIDA_OVER_HOST_LIMIT from vendor children. aida-core/src/launch_env_keys.rs:159-161 classifies it as dropped and says a vendor must never inherit it, but this list does not remove ambient values from inheriting Commands. VendorProfile::clears_environment() in aida-cli-lib/src/vendors/profile.rs:144-150 is false for Codex and Antigravity; launch/spawn.rs:48-63 therefore retains their parent environment, and neither launcher nor the Codex finalizer removes this new key. Launching a native Codex lane with AIDA_OVER_HOST_LIMIT="recovery" consequently carries that override into the vendor and its inherited tool environment. A subsequent managed launch from that environment bypasses the host checks using the earlier reason without a separate explicit override decision for that launch. Remove the key at the vendor process boundary (while preserving it across host AIDA control processes that still need to perform admission), and add regression coverage for native Codex and Antigravity as well as Claude. Present in original head fb320f60f33854ac965940f787935c7343aed4f3 and pinned landed tree db23e8ccbb15b3f3d543550d6dcc7e507051290a; independent of base-only standalone_implementer.rs changes.
