title: aida tui will not launch standalone — errors on the fd-3 intent channel, requires the aida-tui shell wrapper (not installed without a shell reload)
description: 'Operator hit this 2026-06-25 trying to test the EPIC-51 pause feature: `aida tui` -> "Error: the launchers intent fd 3 is the same kernel object as stdout/stderr. Run via the aida-tui shell wrapper... or pass --intent-fd". Then `aida dev shell-init --install` installed helpers but `aida-tui` -> command not found (the shell function needs `source ~/.bashrc`). So the out-of-box flow is broken: aida tui fails standalone + the wrapper isnt available without a shell reload. Root: aida-tui/src/intent.rs rejects when fd 3 == stdout/stderr (it expects a bash wrapper to wire the intent pipe + dispatch). FIX (= EPIC-52 Slice 1): move dispatch IN-PROCESS so aida tui Just Works from any shell, no fd-3/wrapper. Keyboard-verify the launch.'
