  content: 'Another hygiene repro (product-15, 2026-11-22 18:46; advisor-122 asked for it): a ''rebased claim twin plus stale published claim'' shape blocked the BUG-2712 conflict lane with ''the unpushed claim commit 9a1f1dd0c9 ... was not dropped (a rebase rewrote it ...); the claim is still in the local store''. On dell1 .aida-store, 9a1f1dd0c9 (16:59:01) was an ORPHAN, not on HEAD or any remote; its rebased twin 3c0ef64b79 (16:59:06, the identical lease file) was already on origin. So the refusal reported a non-problem. The REAL blocker was the published claim itself (lease 01a205b2cbe3, pid 3127711 DEAD, no session file), healed with `aida doctor heal stale-leases --id shared-ea54d12e-f8f0-47ac-8341-97de23f1b832 --yes`. Wanted: recognise a rebased twin by content and not refuse; when the published claim''s holder is dead, name the prescribed heal.'
