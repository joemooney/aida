  content: 'ROOT-CAUSE EVIDENCE (advisor-122, 2026-11-22 ~13:09 MST; recorded by product-15). With Joe''s delegated OK the advisor ran `aida session end 01a1abbf6456 --yes --force`. The lease is gone, but the tree was KEPT: ''mail retention refused for ...-658: the checkout is not in a Git repository this host can verify, so its mail cannot be fenced and retained''. So the empty ''has uncommitted changes:'' refusal was really a HOST VERIFICATION failure of the seat clone being reported as dirt. AC1 therefore needs: when the clone''s Git repository can''t be verified, say that (with the reason) instead of reporting uncommitted changes. Evidence: .aida/salvage/session-01a1abbf6456-evidence.txt (clean status, 0 commits not on origin, lease toml). The leftover clone -658 is deliberately kept as the reproduction fixture; don''t remove it until the fix is verified against it.'
