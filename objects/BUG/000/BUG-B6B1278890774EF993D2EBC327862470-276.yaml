title: Process-occupancy scan reports uncertainty when a process cwd is unreadable, blocking the supervisor's post-exit commit
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. The occupancy scan (aida-cli-lib/src/codex_bg_receipt.rs:268) returns 'uncertain' when any potentially relevant process's working directory cannot be read (for example another user's process), which prevents the supervisor's post-exit commit and recovery. Decide occupancy from evidence that can be read (process owner, the seat's own process group, lease records) and treat an unreadable cwd of a process owned by another uid as not occupying the seat; keep fail-closed for same-uid unreadable cases. Regression test with an unreadable foreign cwd.
status: Completed
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-10T03:06:34.990229981Z
modified_at: 2026-11-10T18:46:37.591025033Z
req_type: Bug
comments:
- id: 01a1c3a1-af27-7c23-98db-241b05183b77
  author: joe
  content: 'ADVISOR TRIAGE (2026-11-10 04:05 UTC): main already skips unreadable stat/cmdline/cwd of a process owned by another uid (codex_bg_receipt.rs, the ''ours'' = uid check from STORY-2254); fail-closed applies only to this user''s processes. The work-machine report likely ran an older binary, or hit a same-uid process whose /proc cwd is unreadable (non-dumpable process, EACCES). Needs a repro on aida >= 838f14c with the failing pid''s owner and dumpable state before implementation. Kept Draft.'
  created_at: 2026-11-10T04:05:15.687139237Z
  modified_at: 2026-11-10T04:05:15.687139237Z
  session_id: 01a1c39a-801a-7bd1-8da9-c955a6707f0b
  harness_version: 2.1.321 (Claude Code)
- id: 01a1c5dd-4472-7683-b634-19aed8bc0239
  author: joe
  content: 'ADVISOR: approved without a separate repro. An unreadable process cwd is the normal case on Linux for any other user''s or root''s process (/proc/<pid>/cwd gives EACCES), so the uncertain result is reproducible on any host.'
  created_at: 2026-11-10T14:29:34.962351221Z
  modified_at: 2026-11-10T14:29:34.962351221Z
  session_id: 01a1c530-c917-7f13-ab81-f6b5e1d1cd30
  harness_version: 2.1.322 (Claude Code)
- id: 01a1c672-aa48-7de0-bf1a-89659cb1490a
  author: dirtlab
  content: Current source already skips unreadable foreign-UID stat/cmdline/cwd while retaining same-UID uncertainty. Added an ownership-injection seam (production still compares proc directory UID to geteuid) and a deterministic unreadable-cwd regression with simulated ownership, plus positive group/session/attempt/cwd controls. Both bug_2511_occupancy_unreadable_foreign_cwd and story_2254_bg_occupancy_scan_unreadable_is_unknown executed and passed through the lane runner; rustfmt checks and git diff --check passed. No production behavior change was needed. Operator should verify the work-machine binary is current; this lane did not reproduce that host report. Reviewed codegraph client path is absent; doctor reports codegraph missing, so navigation used rg. Edits left uncommitted for host publication.
