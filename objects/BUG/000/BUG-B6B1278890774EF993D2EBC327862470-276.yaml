title: Process-occupancy scan reports uncertainty when a process cwd is unreadable, blocking the supervisor's post-exit commit
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. The occupancy scan (aida-cli-lib/src/codex_bg_receipt.rs:268) returns 'uncertain' when any potentially relevant process's working directory cannot be read (for example another user's process), which prevents the supervisor's post-exit commit and recovery. Decide occupancy from evidence that can be read (process owner, the seat's own process group, lease records) and treat an unreadable cwd of a process owned by another uid as not occupying the seat; keep fail-closed for same-uid unreadable cases. Regression test with an unreadable foreign cwd.
