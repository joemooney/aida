title: Two hosts auto-bump the same merged spec and both publish its timings record; the non-mergeable timings conflict then blocks every store pull on the second host
description: '2026-11-13: after #3936 and after train #3945, the primary and dell1 each auto-bumped BUG-2553 / BUG-2548 (plus STORY-2539 and others) to Completed and each committed ''timing: publish <ID> record (auto-bump)''. The second host''s ''aida pull'' then failed: ''rebase conflict in non-mergeable path timings/BUG/002/BUG-2548.json''. That stopped dell1 lane pickups (''pre-pickup pull failed'') and the review launches on primary. Manual fix both times: drop or reset the duplicate local commits (origin already had equivalent records). Want: the timings publish is idempotent across hosts (on a rebase conflict for a timings record whose spec is already Completed upstream, keep upstream and drop the local publish), or only the host that merged publishes.'
