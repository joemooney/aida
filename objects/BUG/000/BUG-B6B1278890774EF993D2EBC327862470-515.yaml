title: 'Lane jobs cannot run make check-ci-fast: the lane-only cargo rule rejects cargo metadata, so lanes punt or skip the pre-push gate'
description: |
  Lane jobs can't run `make check-ci-fast`: the lane-only cargo rule rejects `cargo metadata` (used by the shard tooling), so lanes either punt or skip the pre-push gate. Seen 2026-11-24: BUG-2735's conflict-repair lane (#4464) finished its merge (97 module tests passed) but punted before publishing: "Required make check-ci-fast cannot finish under the lane-only Cargo rule: its shard tooling invokes cargo metadata, which the launcher rejects." Advisor-122 ruling 11:52; filed by product-15.

  ## Acceptance
  - AC1: The lane runner allows the read-only `cargo metadata` invocation (or check-ci-fast uses a lane-safe path that doesn't need it), without widening the lane cargo rule to builds/tests. A test shows a lane-run `make check-ci-fast` completes.
