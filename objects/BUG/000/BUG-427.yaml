title: 'aida role enter: ''Resumed role'' echo doesn''t shell-escape the purpose — apostrophes/parens in a role purpose break the eval'
description: |-
  REPRO: aida role add <name> --purpose with an apostrophe or paren in the text, then 'aida role enter <name>' (via the auto-eval aida-role shell fn) → 'bash: syntax error near unexpected token )'.

  ROOT CAUSE: aida role enter emits two sites that embed the purpose. The 'export AIDA_SESSION_PURPOSE=...' line IS properly shell-escaped (uses '\'' for apostrophes). The human-facing 'echo "✓ Resumed role: <name> — <purpose>"' line (and the analogous role-list/role-show echoes) dumps the purpose RAW inside single quotes, so an apostrophe closes the quote and any following () hits bare bash. Free-text purposes routinely contain apostrophes/parens (this was hit on a real 'product' persona).

  FIX: route every echo of the purpose/description through the same single-quote-escaping helper the export line uses (replace ' with '\''), or switch the echo to printf '%s' with a pre-escaped arg. Audit role enter / role end / role show / role list for any other raw-interpolation echo sites.

  IMPACT: blocks entering a role whose purpose has shell-special chars — silent until the operator tries to enter it. Connects to user-likes-special-chars + statusline-posix discipline (emitted shell must survive arbitrary free text).
