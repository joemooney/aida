title: A killed aida pr train leaves its train PR open, and the next train refuses the member as 'already riding live train PR' with no liveness check
description: 'Observed 2026-11-02 02:05: an advisor-side timeout killed ''aida pr train 3214 3240'' mid-bisect. Train PR #3248 (land #3240) stayed open with no owning process. The next train refused #3240: ''it is already riding live train PR #3248; a PR rides one train at a time''. Manual fix: gh pr close 3248. Expected: a train records its owner pid or lease; a later train treats a train PR whose owner is dead as abandoned (close or adopt it) instead of blocking. Related: BUG-2220.'
