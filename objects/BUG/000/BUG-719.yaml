title: Stale binary resurrects deliberately-deleted scaffold templates (no tombstone)
description: 'aida-recover skill was intentionally removed by TASK-584 (consolidated into aida-doctor). The released 0.9.1 binary (built 2026-05-25) still embeds the old aida-recover template, so aida scaffold upgrade/apply from that binary RE-CREATES the deleted skill (.claude/skills/aida-recover.md). There is no tombstone/removal mechanism for embedded templates — any older-than-a-removal binary re-adds deleted scaffold files, and the resurrected aida-recover also carried 4 hardcoded /home/joe/ai/aida paths and referenced two nonexistent commands (aida db set-status, aida queue prune). Consider: a removed-templates manifest the scaffolder honors, or a build-embedded template-set version the upgrade checks against on-disk state.'
