title: 'aida add fails in sandboxed sessions (read-only ID allocation): no host-commit fallback like comments have'
description: |
  In a sandboxed (contained) session, `aida add` fails at ID allocation with "Read-only file system (os error 30)" and writes nothing. Comments, edits and status changes survive because AIDA queues them for the host to commit, but minting a new spec has no such fallback. Seen 2026-10-31: an operator-launched product seat (`aida agent new`) could not file a bug. All day, headless implementer and reviewer lanes could not file their findings or follow-up drafts (they fell back to PR comments, e.g. PR-3168 and PR-3165), and `aida pr auto-queue-review` could not file review stories from inside a lane.

  Acceptance:
  1. In a contained session, `aida add` succeeds by queuing the new spec for the host to commit, through the same host-commit queue that comments use. The spec gets an ID at queue time from a pre-reserved per-seat block (STORY-HOME-105's delegated blocks), or a provisional ID that the host commit finalizes. It must never collide.
  2. The command prints the ID (or the provisional ID, clearly marked) and says the spec is queued, and `aida show <id>` works in the same session before the host commit.
  3. The host commit is drained by the same mechanism that drains queued comments, and a doctor check reports queued specs older than N minutes.
  4. Tests: a contained-seat fixture adds a spec, then the host drain makes it visible in the primary store under the same ID; two contained seats adding concurrently never get the same ID.
