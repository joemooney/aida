- id: 01a2072e-ef65-76f2-af40-a4db427532ab
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2725):
    Verdict: CHANGES REQUESTED
    Reviewed commit: b56b658167b6
    Recorded: 2026-11-23T06:52:51.352164718+00:00
    Findings:
    1. BUG-2725 AC1, land_ci_base.rs:157–172 and land.rs:543–552. A pending merge-hold-gate status makes the rollup Ci::Pending even after the project FULL run succeeds. The clean-merge verifier changes that to NeedsFull, and derive returns Wait before checking whether the approval satisfies the hold. This strands a releasable Rework hold in land run and reports the wrong dependency. Keep same-run FULL proof separate from the overall rollup and let the existing hold-release decision run with passing FULL plus a pending hold status.
    2. BUG-2725 AC1, land.rs:543–550. An approved clean-behind head with only FAST CI returns a passive Wait. The standalone approval recorder in review_commands.rs:2810 calls the inner recording path, while the FULL request runs only in the outer interactive recorder at :2572. land_run.rs:579 ignores Wait, so this path skips both the request on approval and land run's train-admission fallback. The same loss of fallback applies when the initial best-effort request fails. Route an approved head missing FULL to a guarded request and retry path and test the standalone approval-to-FULL transition.
    3. BUG-2725 AC1, land_ci_base.rs:157–183. Landing treats the display name CI and a repository-bound URL as project FULL authority. An independent workflow in the same repository can share that display name, and the checkout-parent check only attests the PR head and tested base. Such rows can make the clean-merge exception return Green without a successful run of the project's actual CI workflow. Resolve the canonical workflow ID, verify the candidate run against it and the exact head, and reject another workflow with the same display name.
    4. BUG-2725 AC1 and AC2, review_watch_ready.rs:147 and :230–233. Clean-merge ignores landing.mode. With review-gated and clean-merge enabled, the watcher advises the train while land_run.rs:675 routes the same Ready/Train decision to direct ship. Review-gated ship still refuses a behind head with overlapping paths even when merge-tree is clean (gate/landing_merge.rs:187–210). Preserve the mode's existing behavior or explicitly restrict the train exception to CI-gated mode on both surfaces. Cover the combined settings with a clean overlapping head.
    5. BUG-2725 AC2, review_watch_ready.rs:187–211. The FULL predicate uses stored Passed outcomes without checking run_in_progress. The pinned base a16f3592f01 adds that field and sets it for an active rerun or when a row predates the current attempt (forge_commit_ci.rs:366–384). judge_commit_checks also reads only outcomes, so a check listing with the previous attempt's successful marker and aggregate can produce ReadyForTrain after run metadata has reported a new attempt in progress. Require settled attempt evidence and add a regression with prior success rows and a live rerun. This finding depends on the run-attempt evidence added by the protected base.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
