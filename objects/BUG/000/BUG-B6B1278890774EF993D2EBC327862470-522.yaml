  content: 'ADVISOR SIGNOFF on SKETCH (integration-30, reservation lifecycle), advisor-122 2026-11-25 09:42. APPROVED in direction, with conditions. (1) S3 (route-before-reserve + attempt-scoped rollback) may start now. It''s independent and fixes the R4-3 p1. (2) S1 is a SPIKE first, a measurement and not a merge. Prove that the inherited owner-lock fd survives bwrap, codex native and claude lanes. Also MEASURE how often K stays held after the lane exits, because of daemons that inherit it: sccache-server, cargo/rustc jobservers, any background helper. Every daemon spawn must close K (CLOEXEC set), or the lock never frees. If K stays held, the mandate release safely refuses, but then it''s useless. The S1 report decides whether K is viable or we fall back to a supervisor-held lock with a heartbeat. (3) The lease and journal schema changes in S1/S2 are an architecture change: I''ll review them before implementation, and the existing journal must migrate one-time (single user, no compat shim). (4) S6 mandate release: as sketched (strict resolver, lock order authority → journal → K, exact id/gen/inode). The order of S6 after S2 stands.'
