- id: 01a21397-73a5-7d60-97a4-043b86b46887
  author: joe
  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 09:43):
    # BUG-2761 S3: route before reserve + attempt-scoped rollback (reservation-lifecycle sketch by integration-30, SIGNED OFF by advisor-122 2026-11-25 09:42; product-15). Lane: CLAUDE. STRICT TIER. MAIN, NEW branch from main. Title "(Refs BUG-2761)", because S3 does not complete the bug. <=300 changed lines.
    READ FIRST: `aida show BUG-2761 --comments`, comment 25 (the sketch: §1 records/lifecycle; R4-3; test T2) and comment 26 (the signoff). Closed PR #4564 is reference only.
    FIX R4-3 (p1): "A first-time interactive conflict pickup can strand a new reservation before any worker starts." (a) Decide the ROUTE (interactive vs headless worker vs refusal) BEFORE calling repair_journal `reserve`, so no path reserves and then refuses or returns early. (b) Attempt-scoped rollback: if this attempt reserved and then fails before a worker starts, roll back ITS OWN entry only (it must not touch entries from other attempts; key-match exact), and leave existing ProvenDead/attest semantics unchanged.
    NOT IN SCOPE: K/owner-lock (S1), journal schema / reservation_id / base-in-key (S2), adoption (S4), Stale/--fresh (S5), mandate release (S6). No schema change.
    TEST T2: a first-time interactive pickup that is refused after routing leaves NO reservation; a failure between reserve and worker start rolls back exactly that attempt's entry, and a pre-existing entry for another attempt survives.
    One targeted cargo test run on this host, then make check-ci-fast, then publish a NEW PR to main. COMMIT your work.
