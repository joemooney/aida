  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 23:59):
    # BUG-2761 / PR #4564 r2 (advisor-122 ruling 2026-11-24 23:54 at 2a9f9059; STRICT; HIGH; product-15). Lane: CODEX. MAIN, existing branch. <=150 lines. ONE round.
    (F1, MUST) The queue-rework ADOPTION path routes to the SAME host-repair completion as the original conflict lane: pass the repair routing (no_human / host-repair mode) consistently. A resumed repair that adopts but cannot finish is worse than none.
    (F2, MUST) BASE ADVANCED since the punt: if origin's base moved past MERGE_HEAD, do NOT reject. Abort the stale staged merge CLEANLY (capture its patch to the journal/salvage FIRST), then restart the merge on the NEW base under the SAME lease, offering the old resolution as reference. Test: an unrelated commit on main between the punt and the resume → the resume COMPLETES.
    (F3, p2) Only REAL launch modes may adopt a retained repair; --no-launch / --plan-only / --guided must NOT transfer the journal or remove the predecessor; they only report "retained repair available". Test.
    (F4, MUST test-gap) ONE end-to-end test through `queue rework` dispatch → session start → host repair → merge completes, with REAL refs (no synthetic fetch injection).
    One targeted cargo run, then make check-ci-fast, then push to #4564. COMMIT your work. TITLE TRAILER: keep the existing PR title unchanged.
