title: A retained conflict-repair seat cannot be resumed by any dispatch (force-claim and rework both refuse; every punted repair costs an operator attestation)
description: |
  Filed by product-15 per advisor-122 ruling 2026-11-24 20:20. HIGH, STRICT, drive. Every punted conflict-repair lane today left a retained seat (host-staged merge + repair-journal reservation + lease), and NO dispatch could resume it: a fresh launch with --force-claim refuses ("retained lease … and private clone"); a rework-resume dispatch refuses ("branch … is held by a contained seat's private clone"). The only route was a Joe-attested journal release + salvage + a fresh lane, which happened 4x today (#4533, #4376, #4401, #4525). Each punted conflict repair costs Joe an attestation, which does not scale.

  ## Acceptance
  - AC1: `aida queue rework` / a lane-run resume ADOPTS an existing retained clone + journal entry for the SAME spec/PR (no force-claim, no salvage, no attestation) and continues from its staged merge, verifying the tree matches the journal (original_head, conflict paths) before adopting; any mismatch → refuse with guidance.
  - AC2: A test where a punted conflict lane (staged merge + journal entry + retained lease) is resumed by the next dispatch, which finishes the merge in the same seat.
