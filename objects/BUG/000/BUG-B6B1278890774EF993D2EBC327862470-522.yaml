- id: 01a21208-503d-7712-82cd-1f0139eb6fa8
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2761):
    Verdict: CHANGES REQUESTED
    Reviewed commit: a0ecc2ae63c3
    Recorded: 2026-11-25T09:26:54.967798481+00:00
    Findings:
    1. BUG-2761.AC1 / r3 F2 and addendum (b): Persist the refresh intent before aborting the retained merge. At aida-cli-lib/src/seat_clone.rs:4060-4078 both patches are written, then Git clears MERGE_HEAD before the journal records the old and new state at lines 4153-4158 or 4186-4192. A process exit immediately after a successful abort, or an error in the intervening status or merge-tree probe, leaves an active reservation for the old base with no MERGE_HEAD and no journal link to either saved patch. The next pickup rejects at verified_retained_repair / verify_retained_index, so the repair is stranded again. Durably save both patch paths and the old/new merge identities in a refreshing record before abort, reconcile it on retry, and cover interruption after abort and before journal replacement.
    2. BUG-2761.AC2 / r3 addendum (a) and (c): Stage a real resolution in the first lane of the dispatch regression. At aida-cli/tests/story_1662_queue_work_wiring.rs:494-497 the first vendor writes conflict and punts without staging it. The abort-refusal variant edits base-only at line 569, so its stage-zero entry comes from Git auto-merging an unrelated file. The test can therefore pass while refresh loses the staged version of a resolved conflict or fails to re-enter after the path moves to resolve-undo. Stage the conflict resolution before the first punt, then use a distinct working-tree edit on that same path in the refusal case and assert that the index, working tree and both saved patches keep their respective versions.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
