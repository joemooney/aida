title: lifecycle:no-ci-wait silently ignored — orchestrator always blocks on CI
description: 'Found by the 2026-05-31 orchestrator-drain review (verified). LifecycleSkip parses ''lifecycle:no-ci-wait'' (and lifecycle:trivial) into no_ci_wait=true and the kickoff banner shows it, but orchestrate_with_lifecycle_skip (auto_complete.rs) NEVER checked the flag — Phase 2 (CI wait) ran unconditionally. So the documented STORY-442 feature (skip the blocking CI-wait; CI still runs remotely) was silently dead; lifecycle:trivial users still blocked on CI. The existing trivial test even encoded the bug (asserted Phase::Ci ran). Fix: wrap Phase 2 in ''if lifecycle_skip.no_ci_wait { skip } else { wait }'', mirroring the no_review/no_build skips; merge+pull (integrity) still never skip. Tests: updated the trivial test + added orchestrate_no_ci_wait_skips_ci_keeps_rest. Also added a latent-defect guard: a last_phase()<=3 stop-check (no current variant returns 3, defensive). 29 orchestrate tests green.'
