    Implemented via PR (commit ef8cb81c):

    - `aida findings promote` flipped status to Approved and printed "joins the work queue" but never called `queue add` — silent half-success. New `queue_promoted_finding` helper actually queues the finding (default `implementer`, overridable with `--for <role>`).
    - Queue-add now runs BEFORE the status flip, so a queue failure exits non-zero with the finding still draft (cleanly retryable) — no Approved-but-unqueued half-state.
    - Success message names the route: "queued for <role>".

    Test status: 3/3 BUG-231 tests green (default route, --for override, queue-add failure injection); 11/11 findings-module tests green. Verified end-to-end via `aida findings promote` on a temp project.
