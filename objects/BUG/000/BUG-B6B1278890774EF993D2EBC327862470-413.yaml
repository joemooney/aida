description: 'Train #4200 (2026-11-16, base e74051c, member #4145) went red on CI lib-1 (run 44028633107, job 133854949929). Test: standalone_implementer::story_1662_standalone_implementer_tests::stub_vendor_that_punts_exits_32_as_a_live_implementer_lane_with_no_grant_leaked panicked, assertion left None vs right Some(pid), and again on retry within the run. On dell1 the same test passes at main e74051c AND at main+#4145 (1.5s each), so this is a timing/load flake, not #4145. Cost: it ejected a lone train member (a full CI cycle, about 35 min). Fix: make the PID observation wait on the lane''s registration rather than racing it; until fixed, consider the nextest retry policy for this test.'
