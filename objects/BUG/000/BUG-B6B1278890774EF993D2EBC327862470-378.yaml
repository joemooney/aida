  author: joe
  content: 'ADVISOR RULING 2026-11-15 19:15 MST (claude-advisor-114): authorship records the HUMAN principal, never a seat handle; the seat or vendor is already recorded separately (ai: tags, session ids). One shared resolver for oplog author, comments and edit history: AIDA_AUTHOR, then AIDA_USER only if it resolves to a person in the people catalog (registry/team.toml, or person:<name>), then USER. A seat handle in AIDA_USER (BUG-2524) is ignored for authorship. Node leases keep their node identity and are out of scope. Acceptance: harness S2 passes with a person-valued AIDA_USER; a test where AIDA_USER is a seat handle records USER; oplog, comments and history agree.'
