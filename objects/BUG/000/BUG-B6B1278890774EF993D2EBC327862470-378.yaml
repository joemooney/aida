title: Comments and edit history ignore AIDA_USER and record the OS user
description: |-
  BUG-MN-006. aida_core::provenance::default_author checks AIDA_AUTHOR then USER, while the oplog and node leases honour AIDA_USER. Proposed fix: insert AIDA_USER after AIDA_AUTHOR. DESIGN FORK for the advisor: on this machine AIDA_USER is often a seat handle (see BUG-2524), so authorship would switch from joe to seat handles; decide whether default_author should use AIDA_USER, the mandate principal, or stay as is. Acceptance: harness S2 passes, or the ruling's chosen identity is recorded consistently across oplog, comments and history.

  Source: aida-multinode audit 2026-11-15 (~/ai/aida-multinode/docs/UPSTREAM-REPORT.md). Candidate fix already exists on branch fix/multinode-sync-bugs (worktree ~/ai/aida-multinode-fixes, base 6f0d951, 7 behind main); commits carry [AI:antigravity] and BUG-MN-* ids, so a lane must re-trailer with this spec id and run our CI, not trust the report's local test run. Harness: ~/ai/aida-multinode/harness/run_multinode_suite.sh --aida-bin <bin> --strict.
