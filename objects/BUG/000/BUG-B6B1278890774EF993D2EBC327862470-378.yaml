- id: 01a1e35d-f676-7240-85bb-aef631677217
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2614):
    Verdict: CHANGES REQUESTED
    Reviewed commit: b3314654ce60
    Recorded: 2026-11-16T07:04:35.284902692+00:00
    Findings:
    1. P2: aida-core/src/provenance.rs:436-437 discovers the author catalog from cwd/AIDA_STORE, while git_backend.rs:880 uses self.root. With AIDA_AUTHOR and AIDA_STORE unset, run aida --file /path/to/store-B edit TASK-1 --title changed from outside B, with AIDA_USER=alice cataloged only in B and USER=os-human: edit history resolves os-human but the oplog resolves alice. Comments similarly use the ambient resolver. Bind all author resolution to the selected storage context, including explicit --file and library-backed writes; add a regression where cwd and target catalogs differ. Present in the original head and pinned landed tree; independent of newer base changes.
    2. P2: aida-core/src/db/git_backend.rs:880 calls default_author_in, which ignores provenance::current_actor. A GitBackend update inside with_write_actor("remote-human", context, ...) records its fallback history through write_event as remote-human, but the oplog records the server process AIDA_AUTHOR/AIDA_USER/USER instead. Server save_store uses this override for aida-rest, so these writes can now be attributed to the launching operator in the oplog. Make operation attribution honor the same active write actor as history while retaining the target-store default when no override exists; cover a scoped actor update with differing environment author. Present in the original head and pinned landed tree; independent of newer base changes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
