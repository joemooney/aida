    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit + code path):** `run_with_program` releases the shared review-watch claim after pass setup (probe-ref sweep), so hub sync, `gh pr list` discovery and every per-PR forge read in `admit_change` (supersede head re-read, base probe, readiness report) run unclaimed. A new `PassClaim` retakes it only right before `select_with_coverage` + reservation/spawn, rechecks under the claim that the forge snapshot is younger than a bound, and if stale releases, re-reads the change outside the claim and retries (head/base moved -> skip, retry next pass). The claim is released after each decision. Test: `bug2765_stale_snapshot_is_reread_outside_the_claim` (unit).
    - **AC2 (unit, real admission_owner):** `bug2765_ship_and_manual_train_admitted_during_a_slow_forge_scan` drives the production `watch_pass` with a stub forge that sleeps per PR; a ship (exclusive) and a manual train are admitted while the scan is in flight.
    - **AC3 (unit):** `PassClaim::release` logs `review-watch: admission held Ns during <phase>` when a hold exceeds the bound; test asserts the warning names the phase.

    ### Expected files
    - `aida-cli-lib/src/review_watch.rs`
    - `aida-cli-lib/src/tests/task_1993_review_watch_tests.rs`

    ### Ambiguities / conflicts as questions
    - A cooperative manual train already shares the mode with the watcher; the starved party during a long scan is an exclusive ship/land (and the train via intents). AC2 asserts both a ship and a manual train get in mid-scan. Idle between passes still holds the claim (it yields within 1s to any intent, as before).
