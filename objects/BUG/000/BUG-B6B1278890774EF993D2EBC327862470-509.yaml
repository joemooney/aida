- id: 01a210b8-ca2a-7581-88f1-7a7c6744401f
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2748):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c5f7b33e0117
    Recorded: 2026-11-25T03:17:00.157669565+00:00
    Findings:
    1. BUG-2748 AC1 and round-two F2 — aida-cli-lib/src/codex_bg_receipt.rs:781–798 still uses the worker/supervisor start tick as a lower bound when the recorded owner is Supervisor. The transfer at aida-cli-lib/src/agent_codex_background.rs:989–994 replaces the Dispatcher owner, so this receipt has no evidence of the earlier dispatcher start. The scanner can suppress unreadable cwd or command-line evidence for a same-user process that predates the supervisor even though it could belong to dispatcher setup. A Clear result can then unblock an unscoped receipt or allow retirement. Use an unbounded scan when dispatcher start evidence is unavailable and cover that case with an earlier same-user process whose relevant details are unreadable.
    2. aida-cli-lib/src/codex_bg_receipt.rs:615–632 reopens valid terminal reservations after upgrade. The protected-base recovery writer could reconcile a Prepared attempt as Exited with Owner::Released and no supervisor or worker. The new reader classifies that persisted receipt as Unknown. The named scope blocks again, and pruning, ordinary recovery and unknown retirement all refuse it. The revised writer only fixes receipts created after the upgrade. Preserve a verified compatibility path for already reconciled Prepared receipts and exercise it with a receipt in the old writer's format.
    3. docs/cli/06-roles-sessions.md:477 still tells operators that a dead unknown attempt can be recovered or retired once its processes have exited. With this PR a dead attempt with incomplete attribution stays reserved and both commands can refuse. Document the prerequisite for retirement and the inspection and evidence-restoration path.
