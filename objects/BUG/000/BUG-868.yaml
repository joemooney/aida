title: from-pr reviewer session reviews nothing when the spec is already Done — does queue cleanup instead of reviewing the PR
description: 'Observed twice (2026-09-06, TASK-1193 retries): aida queue work <spec> --from-pr --auto-complete --no-human=both skips the implementer phase and spawns a phase-3 reviewer session — but that session, seeing the spec already marked Done, concluded its job was queue hygiene, ran aida queue done <spec>, wrote NO verdict file, and exited (9.5k tokens, ~2 min). The orchestrator then failed the phase with ''reviewer session produced no verdict file''. The reviewer prompt for the from-pr path must lead with the concrete review contract — review PR #N at head <sha>, write the verdict file at <path> — and state that the spec being Done is EXPECTED (implementation shipped outside the orchestrator), so the session cannot reinterpret the task as cleanup. Acceptance: from-pr pipeline on a Done spec with an open PR produces a verdict file on the first attempt (integration test may stub the vendor session and assert the prompt contains the PR number, head SHA, verdict path, and the Done-is-expected line).'
