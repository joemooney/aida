  content: |-
    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit, aida-core):** `leftovers::scan_scoped_at` takes a `Scope { min_age, owner: &dyn Fn(&Owner) -> OwnerLiveness }`; each candidate (tomb, staging, id temp, era marker / aside) is attributed to its owning checkout (`<checkout>/.aida` parent; era marker -> seat-clone root / main checkout / linked worktree via `<admin_dir>/gitdir`, else the bare admin name). Test `a_live_owner_keeps_its_leftovers` proves nothing is removed and it is reported Live.
    - **AC2 (unit):** `min_age` gates every candidate incl. era markers; `aida agent gc --older-than N` passes N days. Test `older_than_scopes_mailbox_leftovers`.
    - **AC3 (unit):** each candidate is reported with Live/Dead/Unknown; only Dead is reaped; Unknown (no attributable owner, unreadable leases, Unknown lease state) is kept. Tests `an_unknown_owner_is_kept` + CLI `gc_leftover_lines` marks each line.
    - **AC4:** the tests above, run via one targeted `cargo test -p aida-core --lib leftovers`.
    - CLI classifier (aida-cli-lib `agent_registry_root.rs`): leases from `aida_core::liveness::read_session_leases` + `lease_state_for` against probed live agent sessions; Live/Dormant -> Live, Unknown -> Unknown, Stale/none -> Dead; a live agent process cwd inside the checkout -> Live.

    ### Expected files
    - `aida-core/src/mailbox_lifecycle/leftovers.rs`, `leftovers_tests.rs`
    - `aida-cli-lib/src/agent_registry_root.rs`

    ### Ambiguities / conflicts as questions
    - Anchor-level id temps have no attributable owner: under the fail-safe rule they are now Unknown and kept by gc. Acceptable? (Taking yes, per AC3.)
