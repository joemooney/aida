title: aida agent gc cannot scope mailbox leftovers by age or by live session (would remove nonce files touched minutes ago while lanes run)
description: |
  advisor-122 2026-11-26 01:53 (filed by product-15). `aida agent gc --dry-run` on dell1 lists 460 mail-lifecycle/nonce-era "leftovers" for removal, including files modified minutes earlier, while lanes were running (12 touched within 30 min to 6h, e.g. 01:34, 01:37, 01:39). There is no way to prove they do not belong to live sessions. `--older-than` scopes only agent-registry entries, not mailbox files, so it cannot make the gc safe while lanes run. Meanwhile mail retention refuses at lane exit ("the fresh writer-admission scan could not verify every mail writer"), leaving trees and retained leases behind.

  ## Acceptance
  - AC1: mailbox leftovers whose owning session/lease is LIVE are never removed.
  - AC2: `--older-than` also applies to mailbox leftover files.
  - AC3: the dry run marks each candidate live/dead/unknown, and UNKNOWN is skipped (fail-safe).
  - AC4: tests for live-skip, age-scoping and unknown-skip.
