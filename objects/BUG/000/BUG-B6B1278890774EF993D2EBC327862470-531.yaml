- id: 01a21769-db7e-7a11-b314-ba86a3a2c2db
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 355e184e18 (git diff origin/main...HEAD, 4 files).

    Acceptance evidence:
    - AC1 [behavioral-test]: leftovers_tests::a_live_owner_keeps_its_leftovers (aida-core/src/mailbox_lifecycle/leftovers_tests.rs) — the live owner's tomb and era marker stay and are reported Live; only the dead owner's marker is reaped. CLI: story_1843_c2_refusal_tests::agent_gc_judges_leftover_owners_fail_safe — a Live/Dormant lease or a live agent process under the checkout gives Live.
    - AC2 [behavioral-test]: leftovers_tests::older_than_scopes_mailbox_leftovers — with min_age = 1 day, a dead owner's tomb and era marker are not candidates; once older, both go. agent_gc passes --older-than DAYS as min_age (agent_registry_root.rs agent_gc).
    - AC3 [behavioral-test]: leftovers_tests::an_unknown_owner_is_kept + the CLI judge test (Unknown lease, Unattributed owner, incomplete view all give Unknown and are kept); gc_leftover_lines prints '(owner dead)' / '(owner live: ...)' / '(owner unknown: ...)' for each candidate.
    - AC4: tests above. aida-core leftovers: 18 passed; aida-cli-lib 'leftover': 13 passed; make check-ci-fast exit 0.

    Probe findings / fixes:
    - Gate caught the ownership-liveness ratchet (direct lease_state_for). Fixed: leases now come from leases::list_leases_strict_all (any unreadable lease means the view is incomplete, so Unknown) and are judged through ownership::reader::doctor_lease_liveness.
    - Fail-open check: an unreadable lease dir or lease, or a sandboxed PID observer, leaves complete=false, so nothing without a live holder is reaped. Unattributed is always Unknown.
    - Lease matching is exact on the canonical worktree root, so a lane under target/worktrees does not make the main checkout's leftovers Live through its lease. Process cwds use a prefix match, which can only make a candidate Live (fail-safe).

    Residual risks:
    - Anchor-level write_source_id temps have no attributable owner, so gc now keeps them (Unknown) instead of reaping them. The fail-safe rule chose that.
    - A pruned linked worktree's marker is matched to leases by the admin name equal to the worktree basename. Git's collision suffix (name1) would not match and would judge it Dead; git has already pruned that admin entry.
    - --older-than help text unchanged (still accurate); golden untouched.
