title: Train releases a held PR's merge hold before asking the mandate, so the mandate refuses ('no typed merge-hold marker') a PR its own dry-run said it covers
description: |
  Observed 2026-11-17 15:05 MST. `aida pr train 4224 4212` (advisor, ship-held mandate active). Beforehand, `aida pr train 4212 --dry-run` reported "✓ #4212 ready", meaning the mandate covered it.

  During the real run the train released #4212's merge hold, then asked the mandate whether it covered the merge of train PR #4236. The mandate refused: "the fire-fighting mandate does not cover this ship: the PR has no typed merge-hold marker for a mandate to release". Train output: "warning: the merge failed after the hold release. The merge-hold is re-armed." Nothing landed.

  So the dry run (hold present) and the live run (hold already released) disagree. A held, mandate-covered PR can never land through the train.

  Related: BUG-2663 (an unheld PR with an unset mode is refused while a held one ships).

  Acceptance: (1) the mandate's coverage decision for a held PR is taken, and recorded as evidence, BEFORE the train releases the hold, and the live merge honours that decision. (2) A dry run and a live run return the same answer for the same PR state. (3) Regression test: a held, mandate-covered, approved and green PR lands through `aida pr train N`.
