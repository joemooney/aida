title: aida status leaks raw gh GitHub-auth error on a GitLab remote (PR row); should degrade cleanly for non-GitHub forges
description: 'Found 2026-06-14 during GitLab first-user smoke test (product seat). On a GitLab remote, aida status PR row shells to gh, which fails and the raw error is surfaced verbatim: ''(gh failed: none of the git remotes configured for this repository point to a known GitHub host. To tell gh about a new GitHub host, please use gh auth login)''. A corporate GitLab first-user runs aida status on day one and is told to auth a GitHub CLI they do not use — a functional papercut, not just wording. Site: aida-cli/src/main.rs ~84753 (println gh failed) via state_snapshot.rs PrRow::GhFailed. Fix (Tier-1, week-one): detect a non-GitHub remote (forge detection) and either skip the PR row or show a clean ''PR: (GitLab — forge integration pending)'' instead of the raw gh GitHub-host error. Companion to BUG-559 — both are first-run substrate cleanliness, bug-class, GitLab-store-now track. NOT the deep forge wiring (STORY-621).'
