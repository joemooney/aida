title: bug2188_refused_launch_restores_approved_status_and_retry_succeeds flakes in CI lib-1 (status stays InProgress)
description: 'agent_launch::bug_2002_launch_lease_tests::bug2188_refused_launch_restores_approved_status_and_retry_succeeds failed in CI (lib-1) on 2026-11-12: PR #3867 run 43186737131 and train PR #3873 run 43193488190 (main 298639c + #3866, an import-only change). Assertion: left InProgress, right Approved: after a refused launch the spec is not restored to Approved. Main at 298639c passed the same shard, and neither PR touches launch code, so this is nondeterministic (timing or ambient state). It ejected #3866 from a merge train. Fix the race or make restoration synchronous before the launch returns its error.'
