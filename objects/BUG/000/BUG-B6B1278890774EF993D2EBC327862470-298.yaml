- id: 01a1d091-ea79-7de2-b201-e73fb944b6a6
  author: mcp
  content: 'Root cause confirmed from CI run 43193488190 logs: assertion at line 1639 is after drop(receipt) on the retry, not after launch returns Err. Immediately preceding log: `launch cleanup kept ...: mail retention refused ... the fresh writer-admission scan could not verify every mail writer`. SessionStartCleanup::drop synchronously calls release_tree before reverting the claim; retention refusal intentionally keeps tree/lease/claim. The test depended on machine-wide /proc writer inventory, which varies with parallel CI processes. Fix uses existing thread-scoped test_writer_scan(true) inside the PATH-isolated child, covering refused foreground/background launches and retry receipt drop. Also assert intended spawn/exit-73 errors. No production guard weakened and no retries/sleeps added. Validation in progress.'
  created_at: 2026-11-12T16:23:06.105861006Z
  modified_at: 2026-11-12T16:23:06.105861006Z
- id: 01a1d0a4-02f2-7502-a213-70459c355fd8
  author: mcp
  content: 'First executed module run: 34 passed, 7 failed; the named BUG-2533 regression passed. All 7 sibling failures have the same unmocked writer-admission dependency (six rollback refusals plus a pool-return cleanup refusal after the live-holder assertion passed). Applied existing test_writer_scan(true) to those seven fixtures as well, retaining their assertions. Final module stability loop is rebuilding. make check-ci-fast reached mail-wake fixtures but failed because the lane''s shared-write umask made synthetic directories group-writable; rerunning under umask 077. No production changes.'
  created_at: 2026-11-12T16:42:52.018083549Z
  modified_at: 2026-11-12T16:42:52.018083549Z
- id: 01a1d0b7-0779-7981-bfb7-4a328154d63e
  author: mcp
  content: 'Validation complete on final source: 20 consecutive launcher-run `cargo test --profile agent -p aida-cli-lib --lib -- bug_2002_launch_lease_tests` iterations passed, 41 executed tests each (820 passes, zero failures). `umask 077; PATH=/tmp/bug2533-bin:$PATH make check-ci-fast` exited 0: all 47 fast gates passed; temporary Cargo shim delegates build/check/test to aida lane job runner, with non-compiling cargo commands passed through. rustfmt --check and git diff --check passed. Only changed file: aida-cli-lib/src/tests/bug_2002_launch_lease_tests.rs. No production changes, retries, or sleeps. Root cause is ambient fresh mail-writer scan refusing synchronous receipt cleanup, confirmed at final retry drop in CI logs. Eight rollback fixtures now declare explicit writer admission using the existing scoped test seam. Edits left uncommitted for native host publication.'
