- id: 01a21922-8f01-7e81-8eba-86dc1fc7c21a
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 128178c722 (git diff origin/main...HEAD)

    Acceptance evidence:
    - AC1 [behavioral-test]: bug_2776_review_watch_reclaims_only_a_clean_exited_leftover_on_a_moved_head (real queue-pickup reviewer lease + default review worktree, PR moved; PR-2457 legacy marker collected onto the ledger before end, end called with that lease, tree gone). bug2776_reclaimed_leftover_dispatches_the_moved_head_in_the_same_pass (Exited held-tree attempt; reclaim then probe then Dispatch of the new head in one select, pickup_retries=1).
    - AC2 [behavioral-test]: same reclaim test keeps on live owner (ending-retained but live), at-current-head, dirty, live pid N, lock, merge-hold (residual PR-9999 marker left in place); review-watch test asserts Skip + Admission::Held{why:dirty,retained:true}; pass line now renders 'held by exited attempts (PR-N: why, ...)' for every exited-attempt hold.
    - AC3 [behavioral-test]: bug2776_retained_checkout_block_surfaces_after_thirty_minutes (since carried across passes by key; <30 min silent; >=30 min degradation line + landing-drought DoctorFinding with fix 'aida session end --branch pr-N --yes' then 'aida review watch --release PR-N'; cleared when no longer held).
    Validation: targeted lane cargo test 8/8 + 11/11 (incl. bug_2457/bug_2469/bug2757/bug2720 regressions); make check-ci-fast exit 0.

    Probe findings / fixes:
    - Probe 5: an ending-retained lease with a live owner passed the lease check while the in-tree holder scan misses a process whose cwd left the tree. Fixed: Live always keeps; tested.
    - Probe 3: classification only ran on due retries, so the 30-min clock reset on backoff and never started after the 3-retry cap. Fixed: classify (and reclaim) on every pass for an Exited held-tree attempt.
    - Unreadable checkout HEAD now fails closed. Every error path returns Kept, never Free.
    - Store-writer inventory: added the one row for the new preserve_review_worktree_holds call site (regenerate also emitted unrelated main drift, left out).

    Residual risks:
    - The end path is a subprocess of 'aida session end <lease> --yes --skip-ci' (no in-process API takes an explicit root); a refusal is reported as the kept reason each pass, so a persistently refusing end respawns every pass for that PR.
    - Once a kept checkout becomes reclaimable after the pickup retry cap, the tree is ended but dispatch still needs 'aida review watch --release PR-N' (pre-existing cap semantics).
    - The AC3 surfacing lives in the landing-drought doctor check (aida doctor check landing-drought, scheduled watchdog) and the watcher's degraded status, not the bare 'aida doctor' run.
    - Production diff is ~300 lines, above the 250 guideline.
