- id: 01a1e36e-5d04-7173-9fe3-8d9ef647e472
  author: dirtlab
  content: 'Implemented updated product-seat acceptance: all three scripts/containment/conformance.py killpg sites share strict plain-int/range/own-group guards; foreground handoff rejects unsafe targets before touching the terminal. The synthetic continuation child now has explicit pid=12345, and mock-child tests patch both terminal handoff and killpg. Added regression coverage for <=1, own group, bool, overflow and MagicMock targets, both TERM/KILL cleanup stages, bounded-launch cleanup, valid signal forwarding and disappeared groups. Audit of tests/**/*.py Popen mocks and direct os.kill/os.killpg: gdma mocks either wrap real children or assert no spawn; dell1 rearm mock invokes mocked child methods only, with poll=0; remaining conformance direct signals use actual subprocess/PTY groups; repair-generated tests launch real children. No other mock-to-real-signal path found. Root-cause mechanism follows product-seat evidence; no destructive desktop reproduction attempted. This implements the narrowed acceptance in the latest spec comment, not a repository-wide tracked spawn table/stale-PGID redesign. Codegraph client absent at supplied /home/joe path; doctor confirms missing. Validation pending final suite run.'
