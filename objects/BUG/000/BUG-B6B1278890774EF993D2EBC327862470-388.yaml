title: 'Desktop session killed twice (21:14 and 23:15 MST, 2026-11-15) within milliseconds of an aida cron tick ending: suspect an over-broad kill'
description: 'Evidence (journalctl on imac): no OOM (memory ~91% free), no reboot, no GPU reset at the crash times. At 23:15:01 cron started three aida schedule ticks (repos aida-relay, aida-proxy, test_multinode1). At 23:15:04.852907 cron session 3999672 closed, and at 23:15:04.853803 the user''s systemd manager activated exit.target; gnome-shell logged ''X connection to :1 broken (explicit kill or server shutdown)''. Every user process (all agent seats, deputies, terminals) was SIGKILLed. The first crash at 21:14:13 shows the same exit.target pattern; no cron tick lines up exactly with it (the systemd aida-tick timer had finished at 21:10:41). Hypothesis: some path signals kill(-1, ...) or killpg with pid 0/1 or a stale pgid (candidates: agent_codex_background.rs killpg on worker pids, bounded_process.rs, notify.rs, merge_hold.rs, regen score), which reaches Xorg/gnome-session. Acceptance: reproduce or rule out with an audit of every kill/killpg call for pid <= 1 and stale-pgid reuse; add a guard that refuses to signal pid/pgid <= 1 or any group not created by aida (tracked spawn table); test for each call site. Mitigation until fixed: disable the test_multinode1 cron tick.'
