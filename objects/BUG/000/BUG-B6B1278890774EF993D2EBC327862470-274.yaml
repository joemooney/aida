title: Remote lanes treat a stale advisor brief as binding because they cannot see the gate-ledger review findings
description: 'On 2026-11-09 the TASK-3777 rework lane on dell1 received a 16:42 UTC advisor brief marked ''binding'' although a CHANGES REQUESTED verdict was recorded at 22:00 UTC; it punted as ambiguous-spec and the rework cycle was lost. rework_direction.rs resolve_direction (around line 143) returns BriefStanding::Binding whenever review_findings is None, and a dell1 lane has no access to the primary host''s .aida/gate-ledger, so the findings are None even though a ''REVIEW FINDINGS TO ADDRESS'' comment with the verdict time is on the spec. Fix: derive the verdict time from that comment, or from the latest verdict in the store, when the ledger is unavailable, so a brief that predates it is classed PredatesVerdict; add a regression for a lane with no ledger.'
status: InProgress
priority: High
