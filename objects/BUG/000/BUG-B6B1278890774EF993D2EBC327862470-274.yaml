comments:
- id: 01a1c4ae-da06-7200-aca3-d82b81889341
  author: joe
  content: 'Related evidence 2026-11-10 (advisor): the STORY-2704 lane loaded the older 03:56 UTC ''ADVISOR BRIEF'' comment as binding and ignored the newer 04:13 UTC ''ADVISOR SKETCH SIGNOFF WITH CHANGES'' comment, so it produced a second sketch PR (#3772) instead of slice 1. The brief loader appears to key on the header text (''ADVISOR BRIEF'' / ''ADVISOR RULING''). Fix scope candidate: the newest advisor-authored ruling-class comment wins regardless of header wording, or advisor commands write a typed brief record instead of free-text headers.'
