title: burndown plan Supervised section lists non-actionable statuses (Done/Completed) — supervised check runs before the status filter
description: 'Defect in STORY-610 slice 1b (TASK-801, #878): in resolve_burndown_sets the supervised-tag check runs BEFORE the status filter, so the ''Supervised — work these at the keyboard'' section collects supervised-tagged specs of ANY status. Observed: BUG-530 (Completed) and BUG-549 (Done, open PR) both appear in the keyboard section though neither is actionable-at-keyboard (Completed=shipped; Done=awaiting review/merge, already in the reviews bucket). Fix: collect supervised specs AFTER the status/tag/batch filters so only actionable (matching-selector, Approved by default) supervised work surfaces; keep the unconditional continue so they stay out of ready/awaiting/parked. trace:STORY-610'
