title: aida human reviews-awaiting flags Completed/merged-PR specs (stale local branch false-positive)
description: 'Operator caught it: aida human listed BUG-581 under reviews-awaiting [PR-1048] when PR-1048 was already MERGED and BUG-581 already Completed. Cause: the reviews-awaiting detection keyed off a lingering local branch/PR surface for the spec without checking that the PR is MERGED / the spec is already Completed. Stale Agent-tool worktrees (worktree-agent-*) accumulate and leave such branches around (98 had piled up), so this false-positive recurs. FIX (robust invariant): a spec whose status is Completed (or Done with a merged PR) must NEVER appear in the reviews-awaiting bucket - exclude it in the reviews-awaiting computation (filter on spec status + PR merge state), so a lingering local branch can''t resurrect a finished spec onto the operator''s seat. Add a regression test: a Completed spec with a lingering local branch is NOT in reviews-awaiting. Companion to BUG-579 (the earlier count==render fix) - same surface, different stale-data leak.'
