  content: |-
    ## Implementer approach

    Root cause: `handle_mailbox_command` (and the MCP mail tools) derive the project root from the store path's parent. In a seat clone that is the clone itself (its `.aida-store` is a symlink to the primary's store), so `send` writes `<clone>/.aida/mailbox`. The primary's logical inbox enumerates only `git worktree list` worktrees plus the canonical store; a seat clone is a separate repo, so the message is invisible. The contained sandbox already grants the seat write access to the primary's `.aida/mailbox` (`contained_boundary::contained_mailbox_write_paths`), so the fix is to route a *verified* seat clone's mailbox ops to its primary checkout (`seat_clone::main_for`).

    ### Acceptance criteria as tests
    - **Unit (cli-lib):** `mailbox_home` resolves a verified seat clone to its primary, a plain checkout to itself, and an unverified clone to itself flagged local-only.
    - **Command-level:** send from a verified seat clone to role advisor via `handle_mailbox_command` with the clone's store path; read the primary's local mailbox / logical inbox and see it (AC1 + AC3).
    - **Command-level / unit:** an unverified clone's send keeps the message local and the output says so and names `aida mailbox sync` (AC2) - tested on the notice helper.

    ### Expected files
    - `aida-cli-lib/src/mailbox_store.rs` (resolver)
    - `aida-cli-lib/src/mailbox_cmd.rs` (use it; truthful send output)
    - `aida-cli-lib/src/mcp.rs` (send/inbox parity)
    - `aida-cli-lib/src/tests/` new regression test file + mod registration

    ### Ambiguities / conflicts as questions
    - None: the sandbox grant already shows the primary mailbox is the intended write target.
