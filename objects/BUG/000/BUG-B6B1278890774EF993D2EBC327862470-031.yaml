title: Mail sent from a contained seat's private clone never reaches the advisor inbox in the primary checkout
description: |-
  2026-10-29 20:28: claude-implementer-229 (contained seat clone /home/joe/ai/aida-worktrees/aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-021) sent 'BUG-021 PR-3113 ready for review' to {kind:agent, agent:advisor}. It was written only to that clone's .aida/mailbox/0f11319f-...json. The advisor's `aida mailbox inbox` and `--all` in /home/joe/ai/aida never showed it; the operator had to relay it by hand. The sender was told it 'went to the durable inbox'.

  Acceptance:
  1. A message sent from a seat clone is visible in the recipient's inbox in the primary checkout within one inbox read (pushed to the canonical store on send, or the primary's inbox reads registered seat-clone mailboxes).
  2. The send output tells the truth: if the message is only local, say so and name the sync command.
  3. Regression test: send from a seat clone to role advisor, then read the inbox from the primary and see it.
