title: Lane pickup refusal 'canonical branch X still has a lease' names neither the lease id nor its file, so the blocker can't be found or ended
description: |-
  Observed 2026-11-18 19:49 and 20:00 on dell1: TASK-3219 pickup refused with "canonical branch task-...-878 still has a lease; inspect or resume that lease explicitly". The check (aida-cli-lib/src/queue_cmd/work.rs:935-938) reads list_leases_strict_all over <launcher project_root>/.aida/sessions/*.toml, including mcp-claim.<id>.toml (leases.rs:306), but the message gives no id or path. Product ended the only matching lease file, the refusal recurred, and at the next check no matching file existed in any sessions dir, so the blocker couldn't be identified.

  Acceptance criteria:
  1. The refusal names every blocking lease: id, file path, kind (session vs mcp-claim), hostname and started_at. Test: a fixture with one plain and one mcp-claim lease on the branch prints both.
  2. The refusal prints the exact next command for each (e.g. aida session end <id>, or the claim-release command).
  3. Unit test that the message includes the path for both lease kinds.
