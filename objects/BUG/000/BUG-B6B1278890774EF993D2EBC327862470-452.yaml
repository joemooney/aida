title: Conflict rework preparation refuses with 'retained conflicts require their host journal evidence' when the seat is gone, blocking a one-file merge (BUG-2657/#4226)
description: |
  Observed 2026-11-18 ~09:52-10:30 MST on dell1. A conflict-only Claude rework lane for BUG-2657 (#4226; branch bug-b6b1278890774ef993d2ebc327862470-421; seat /home/dirtlab/ai/aida-worktrees/aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-421) failed BEFORE the agent started:
    error: "rework preparation for seat … on branch …; inspect its scope with `aida session leases --all` before recovery. If a probe failed without reporting conflicts, diagnose that failure before retrying; retained conflicts require their host journal evidence before a resume"
  The seat directory no longer existed afterwards. The actual conflict was a single test file (bug_home_038_seat_publish_tests.rs; keep both sides).

  Context: conflict reworks have failed on tooling repeatedly in the last 24 h. Codex lanes refuse retained conflicts; Claude lanes had no Bash until BUG-2652; resolved-but-uncommitted merges (BUG-2679); stale seat registrations and claims needed hand release; now rework preparation fails on missing "host journal evidence". The 8 PRs needing conflict reworks overnight lost hours each.

  ## Acceptance
  1. Rework preparation for a conflicting PR branch either (a) creates the seat, merges current main and hands the agent a clean "resolve these files" state, or (b) refuses with a message naming the exact missing evidence and the ONE command that provides or clears it. "Diagnose that failure" without naming it is not acceptable.
  2. A retained conflict with no host journal (seat gone, journal missing) is treated as "no retained conflict" after verifying the remote branch head, so a fresh start can proceed, not as a hard refusal.
  3. `--fresh` always starts from the remote branch head and ignores retained-conflict state (after logging it).
  4. Tests: conflict rework from a clean remote branch; seat gone + journal missing → fresh start; a genuinely retained conflict with a journal → resume.
