    AC2: [evidence: behavioral-test] run_pickup_launch releases the launch's own reservation after a verified rollback (repair_journal::release_unspawned_lane). Tests: bug_2688_pre_spawn_failure_releases_the_launch_own_reservation (real session_start receipt and rollback; retry reserves; a started worker's reservation is kept), bug_2688_unspawned_release_is_limited_to_the_lane_and_a_gone_seat.
    AC3: [evidence: behavioral-test] doctor category repair-journal; heal re-reads proof under the journal lock and writes .aida/repair-journal.backup-<ts>.json first. Tests: bug_2688_heal_releases_only_a_provably_gone_lane_and_backs_up_the_journal (lease on lane, lease on seat, unparseable lease, seat present, live lane run, torn lane record all keep it), repair_journal_category_routes_from_alias_to_heal, and the loop test's step 2.

    Probes: (1) category string is one const plus the alias row; (2) lane id is validated as a lease id before it names a file; (3) journal keys are unique at load, heal matches the full pr+head id; (4/5) every release path fails closed: unreadable leases, lane record or seat state keep the reservation; no existing test weakened; apply_rework_conflict_route still re-checks the route after preparation.

    Validation: 36 targeted tests pass via lane job (bug_2688, repair_journal, story_2710, task_3804, doctor routing). Wider filter run: 244 passed, 1 failed: bug_044 story_2475_all_codex_lane_exits_publish_after_child_exit, refused by the host disk floor (31.2 GiB free < 60 GiB), unrelated to this diff. cargo fmt, check-store-writers, crate-glob, exec-context, trace-header, glyph, doc-link and doc-intent gates pass. make check-ci-fast could NOT be run to completion: this lane caps a tool call at 60 s and the gate has no resume; it was cut off inside 'Containment conformance evidence tests' after the first four gates passed. check-ratchets (cargo) was not run.

    Residual risks: a reservation left by a lane that ran and exited while its seat directory is retained is not healable until the seat is ended (by design: tree gone is required). Nothing writes spawn=started; the heal treats started and unknown alike.
