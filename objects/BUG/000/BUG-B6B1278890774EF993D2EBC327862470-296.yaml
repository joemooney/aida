- id: 01a1cf5e-746d-7611-b1f3-26615d11c4a4
  author: joe
  content: 'Round 2: both review findings are accepted. Added an interim scan-wide 128 MiB/200000 parse-attempt ceiling (including unrelated files and torn retries), pre-read remaining-budget checks, and a regression counting actual read bytes/deserialization attempts. This mitigates the 64 GiB per-file-reset regression but is NOT relevant-only discovery or completion. Proposed the missing binding completeness and archive/revival contract in docs/plans/2026-11-12-bug-2531-discovery-retention-sketch.md. Approval is required by AGENTS.md Sketch-First Protocol for new file formats/lifecycle semantics; TASK-3098 remains Draft and is not an approved scope split. Finding 2 automatic rotation is not implemented. Test job j20261112T104457008-2-0 running; results to follow. No completion credit is claimed.'
