agreed_id: BUG-2531
title: Gate-ledger discovery reads every change ledger against a 64 MiB budget
description: 'discover() in aida-cli-lib/src/gate/ledger/checked.rs reads every PR-*.jsonl in .aida/gate-ledger into one Budget (MAX_SELECTION_BYTES 64 MiB). When the ledger passed 64 MiB (82 MB, 2683 files, 2026-11-12) every verdict selection failed (''aggregate gate-ledger read budget is exhausted''). Effects: verdicts unreadable, review watch relaunched reviewers on approved heads whose claims blocked trains (BUG-2530), review record failed, the train ejected approved PR-3860. Workaround applied: archived 668 closed-PR ledgers >24h old to .aida/gate-ledger-archive, pruned 431 by-spec indexes (backup .aida/gate-ledger.bak-20261112T013508); now 17 MB. Fix: bound discovery to the changes the selection needs; rotate closed/merged change ledgers to the archive automatically; doctor warns at 50% of budget; regression test with an oversized unrelated closed ledger.'
status: Approved
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-12T08:35:37.046532324Z
modified_at: 2026-11-12T10:04:02.542130143Z
req_type: Bug
comments:
- id: 01a1cf00-20ea-7c51-bbf5-a9927b13b042
  author: mcp
  content: 'Native-lane partial handoff: implemented a strict spec-to-change inventory that discards unrelated review payloads, then reads/caches only selected change ledgers against the unchanged aggregate selection budget. Missing/stale indexes still cannot hide refusals; per-file, line, directory, change-count and inventory limits remain. Added doctor review-verdicts capacity warning at 32 MiB and regressions for >64 MiB unrelated closed history, selected-history exhaustion, shared-ledger exact budget, and threshold boundaries. Changed checked.rs, review_alias.rs, doctor/store_repair.rs, gate/tests/bug_2403_alias_selection_tests.rs, tests/doctor_cmd_bug_1505_review_verdict_doctor_tests.rs, and docs/internal/testing/bug-2531-ledger-selection-budget.md. Formatting/diff checks passed. untested=true: lane job j20261112T084821116-2700781-0 timed out after 900s (exit 124) during slot wait/compilation, with no tests executed; alias-suite job j20261112T085138412-2729924-0 is pending a Cargo slot. Automatic archival is NOT implemented; discovery I/O still scales with all active files. Design-fork punt and finding SPEC-b6b1278890774ef993d2ebc327862470-026 record the missing archive-aware retention/read/revival contract. Refs declaration recorded; punt veto remains. Edits left uncommitted; no push, PR, queue completion or review/merge action.'
  created_at: 2026-11-12T09:04:14.570744238Z
  modified_at: 2026-11-12T09:04:14.570744238Z
- id: 01a1cf36-e06e-7382-8f7a-9a5032fc6626
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: No actionable defects in the explicitly partial Refs remediation; payload budget scoping and capacity warning reviewed. Full discovery I/O and automatic archival remain deferred; BUG-2531 is not complete. CI pending at review time.. It was punted on: design-fork: Budget-scoping and doctor-warning slice is implemented, but automatic closed/merged archival needs an archive-aware retention contract: strict selection refuses missing by-spec targets, and direct change/audit/carry-over/import/append readers assume active paths. Moving ledgers and pruning indexes can erase refusal evidence. Discovery still inspects all active files. See finding SPEC-b6b1278890774ef993d2ebc327862470-026 and docs/internal/testing/bug-2531-ledger-selection-budget.md. Targeted tests submitted to lane runner; results pending Cargo slot availability.. No triage reason was given.'
