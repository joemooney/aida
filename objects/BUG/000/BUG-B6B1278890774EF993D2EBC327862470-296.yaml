    ## Complete actionable findings

    F1 [P2] BUG-2531, aida-cli-lib/src/gate/ledger/bindings.rs:480-482. Bootstrap prunes only when the change ledger is gone, rather than checking the actual (spec, change) pair in scan.bound. Start with an existing PR-1 ledger for BUG-1; an append for a new BUG-2 can persist bindings/BUG-2/PR-1 and fail or stop before the event/hint is written. Bootstrap retains that binding because PR-1 exists, removes/does not create BUG-2's hint because scan.bound has no BUG-2, and retains its nonempty directory. Every later BUG-2 selection consequently satisfies binding_lost(None, Some(...)) and scans ALL change ledgers. The documented repair cannot remove this condition, and audit reports the resulting tree as healthy. Unrelated unsafe history can then refuse that spec, even after repair. Prune against scan.bound's per-spec set (or rebuild hints consistently for deliberately retained extras), and cover a failed append to an existing ledger followed by bootstrap and a counted bound-only selection with unsafe unrelated history.

    F2 [P2] BUG-2531, aida-cli-lib/src/gate/ledger/bindings.rs:177-182 and certify_empty:232-235. Empty-ledger certification is called under the shared ledger lock and a per-change lock. Two threads appending their first events to DIFFERENT changes can both pass the absent-marker/empty-ledger checks and enter publish_marker. Both use bindings-complete.tmp.<same PID> with File::create. They can truncate/write the same temporary inode; once one renames it, the other's rename fails ENOENT and rejects a valid append. Writes through the second handle can also occur after the inode becomes the published marker, breaking atomic marker publication. Serialize initialization or use distinct create-new temporary files with a safe publication protocol. Add a synchronized two-change first-append regression; the existing concurrent append test uses one change and therefore serializes before this path.

    Both findings are introduced by this landed diff, present identically at the original PR head and landed tree, and do not depend on the five newer base commits. No semantic defect found in BUG-2635 or in the BUG-2626 code outside its BUG-2531 dependency. Minor nonblocking observation: diff --check reports the literal historical fixture's final blank line; no source edits made.

