  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2531):
    Verdict: CHANGES REQUESTED
    Reviewed commit: baaa8e07e72b
    Recorded: 2026-11-12T10:03:53.849419845+00:00
    Findings:
    1. [P2] aida-cli-lib/src/gate/ledger/checked.rs:348: Discovery resets Budget for every file and still reads/deserializes every unrelated payload before selection. With the allowed 4096 ledgers at 16 MiB each, a single verdict lookup can now read/parse 64 GiB instead of refusing after the former 64 MiB operation budget; inventory_budget charges only unique bindings and does not bound this work. Implement bounded discovery of relevant changes without trusting incomplete by-spec hints or hiding refusals, and add a regression that bounds unrelated payload I/O/parse work, rather than only proving that selection no longer exhausts its budget.
    2. [P2] docs/internal/testing/bug-2531-ledger-selection-budget.md:31-36: The automatic closed/merged-ledger archival required by BUG-2531 is not implemented. Closed history therefore continues accumulating in the active directory until discover refuses globally at 4097 files, blocking even an unrelated small selection. Draft TASK-3098 documents the design fork but does not change the covered requirement. Implement archive-aware rotation with preserved indexed refusal evidence and reopened-change/direct-reader support, or obtain an explicit approved scope split before treating this PR as satisfying BUG-2531; add retention/rotation regressions.
