    ADVISOR RULING 2026-11-12 22:55 MST on docs/plans/2026-11-12-bug-2531-discovery-retention-sketch.md (design fork). Decision: APPROVE THE SPLIT, with the completeness mechanism approved and simplified for a single-user install (operator standing rule: prefer breaking fixes and one-time rewrites, no compat shims).

    1. BUG-2531 = discovery completeness. Approved: write-ahead binding records persisted under the existing writer locks before any verdict append; a failed binding write blocks the append; selection reads only the requested labels' bindings plus their change ledgers; by-spec indexes stay hints. Writer compatibility: NO runtime version fence. Bump the gate-ledger format version so older binaries refuse to write (one live binary, `aida dev build` promotes atomically). Bootstrap is ONE explicit maintenance command (an `aida doctor` fix) that scans all active ledgers under the exclusive lock, writes bindings, and publishes the completeness marker. Missing or unsupported marker = fail closed (refuse, name the fix). Tamper/link-attack hardening is limited to refusing on missing/inconsistent bindings; no extra threat model. BUG-2531 completes on this slice. The existing safety-cap Refs commits get no completion credit (already true).
    2. TASK-3098 = retention/archival, SEQUENCED AFTER slice 1 lands. Approved as written in the sketch: one archive path per change; every reader resolves active-then-archive; conflicting copies refuse; rotation only on observed forge closed/merged under the exclusive lock; revival restores to active before append (sequences stay monotonic). The integration seat proposes the reader-visibility protocol (shared read lock vs recoverable move) in its PR description; no new sketch round.
    3. The "keep full scans permanently" alternative is REJECTED: full scans are tonight's availability problem (BUG-2543, BUG-2551).
    Validation: the sketch's list, scoped to the slice under review; no 4096-change or crash-interleave suite for slice 1 beyond bootstrap interruption and the binding/append boundary.
