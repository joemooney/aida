title: 'Fix: Activity page shows no events when userId is default'
description: 'The Activity page filtered timeline events by author === ''default'', but no requirement has an author literally named ''default''. The queue API treats ''default'' as a special key for the current user''s queue, but timeline events have real author names. Fix: skip the author filter when userId is ''default'' to show all activity in the default view.'
