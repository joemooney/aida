    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 18:04):
    # BUG-2584 SLICE 2: the train MEMBER GATE phase (S1 #4691 landed 52825e81d1c: evidence 226→1 policy calls; product-15 2026-11-26 18:05). Lane: CLAUDE. STRICT (train path). MAIN, NEW branch bug-2584-s2-member-gate. <=300 lines. Completing (BUG-2584) trailer only if the AC is met; otherwise (Refs BUG-2584).
    LIVE PHASE DATA from the primary's auto-train log (.aida/auto-train/service.log, 2026-11-25 19:2x/19:5x; implementer seats can't read it, so here it is):
      final gate: re-gate member #4475 took 75.9s (12 store reads, 17.4s)
      final gate: proof: member #4475 gate took 75.4s (12 store reads, 19.0s)
      final gate: recheck: member #4475 gate took 74.0s (12 store reads, 18.8s)
      final gate: proof/recheck: member #4475 evidence took 11.5s / 11.7s   <- what S1 fixed
      final gate: verify and merge took 207.4s; 285.5s from the merge lease to the end of the merge call
    So the MEMBER GATE is ~75s × 3 passes per member, and only ~17-19s of it is store reads: ~55s is CPU elsewhere.
    Primary-scale facts for a fixture: the member's OWN ledger is small (PR-4475.jsonl 72 KB / 6 lines; PR-4600 40 KB). BUT .aida/gate-ledger/ holds 1,836 files / 90 MB (the largest are PR-3870 6.2 MB with 2 lines, PR-3830 4.3 MB with 185 lines, PR-3846 2.3 MB); .aida/review-verdicts/ is 22 MB; .aida/sessions has 295 entries (1.3 MB).
    LEAD: the member gate's cost does NOT scale with the member's own ledger, so it likely scans or parses the WHOLE gate-ledger dir (or review-verdicts / sessions / the spec store) per member per pass. That matches S1's note that `read_file` runs 17× per gate.
    DO: (1) build a fixture at that scale (many large sibling ledgers, a small member ledger) and time the member gate; name the hot loop in the PR body. (2) Fix it with the S1 pattern (compute once per pass, or index or cache by path + mtime within ONE pass, never persisted across passes), keeping every gate check identical: a refused verdict can never become admitted, and keys include the reviewed_sha. (3) A test: the member gate does O(1) parses of sibling ledgers per member, and its results equal the uncached gate across the fixture.
    AC (from the spec): a 3-member train goes from green to the merge call in <30s on the primary. If you can't verify that from the seat, use (Refs BUG-2584) and state the fixture numbers before and after.
    One targeted cargo test run on this host, make check-ci-fast, then publish a NEW PR to main. COMMIT your work.
