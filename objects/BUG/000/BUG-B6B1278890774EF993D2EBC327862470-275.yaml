  author: joe
  content: 'ADVISOR RULING (2026-11-10 04:05 UTC): approved. Scope: per-vendor explicit credential passthrough list in agents.toml (e.g. [vendors.codex] env_passthrough = ["XAIAA_API_KEY"]): exact names only, reject wildcards and AIDA_* names at config load; merge with WORKER_AMBIENT_ENV in agent_codex_background.rs; document in the agents.toml docs; doctor --lane-host reports a configured name that is unset (name only, never values). Tests: config parse (wildcard/AIDA_ rejected), worker env keeps a configured var and drops an unconfigured one. LIGHT gate.'
