title: Detached Codex workers drop custom credential environment variables (only OPENAI_API_KEY is allowlisted)
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. The detached-worker environment allowlist (aida-cli-lib/src/agent_codex_background.rs:45) passes OPENAI_API_KEY but not a deployment's custom credential variable (for example XAIAA_API_KEY), so the worker fails authentication. Make the passthrough configurable per vendor in agents.toml (explicit names only, no wildcards), document it, and have doctor --lane-host report a configured credential variable that is unset. Never log values.
status: InProgress
priority: High
