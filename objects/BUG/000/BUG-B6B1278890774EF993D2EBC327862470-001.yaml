comments:
- id: 01a17c23-d430-77d0-8a4d-b496d129aa9e
  author: joe
  content: 'Item (a) root cause (fix/allocation-error-surfacing): nothing rewrote the mode at 14:17. The primary''s .aida/dispenser.toml has recorded node 2 since 2026-05-05: merge ca80edbd7e (''integrate -2- shard reqs from work machine'') brought in the work machine''s then-tracked dispenser.toml (node_id = 2, GLOBAL 52), and 02bbb02d1c only untracked it, leaving node 2 on disk. FileDispenser::next loads, bumps and saves the state with the FILE''s mode, while FileDispenser::state()/format_id use the opener''s mode (node 1), so IDs rendered TASK-1-NNN and the mismatch stayed invisible through GLOBAL 52->499. The 14:17 write was the routine allocation of TASK-1-499 (store reflog 073de075d3, 14:17:02). It only surfaced once the lazy WORK migration ran merge_legacy_state, which compares modes. Fix in this branch: FileDispenser::next refuses a stored mode that differs from the opener''s (it never advances or writes back a foreign-node counter), and aida doctor allocation reports the legacy mismatch on authoritative clones too. Follow-up for the operator: TASK-1-053..499 were counted on node 2''s counter; worth checking them for collisions with the work machine''s -2- range. Item (d) not addressed; NodeConfig::save uses std::fs::write, so a 0002 umask yields a 0664 node.toml, which is how fault 1 arose.'
  created_at: 2026-10-27T06:54:45.296673365Z
  modified_at: 2026-10-27T06:54:45.296673365Z
  session_id: c8ae1509-fd35-41b9-8f6e-b1350b49cfcc
- id: 01a17c24-0275-7cb3-94dc-659a219a26a2
  author: joe
  content: 'Correction to the follow-up above: IDs from that counter were formatted as node 1 (TASK-1-NNN), so they cannot collide with the work machine''s -2- range. The real exposure: if the primary''s node-1 counter was above 52 before the 2026-05-05 merge replaced the file with the work machine''s GLOBAL 52, node-1 IDs from 53 up to that old high-water could have been dispensed twice. aida doctor id-collisions covers this; the advisor noted 499 equals node 1''s highest object ID, which suggests no reuse.'
  created_at: 2026-10-27T06:54:57.141938834Z
  modified_at: 2026-10-27T06:54:57.141938834Z
  session_id: c8ae1509-fd35-41b9-8f6e-b1350b49cfcc
- id: 01a17c7b-0a79-7b32-8be0-d0b5730cbe79
  author: joe
  content: 'Rework r1 (PR #2969, bb5bc83): spec item (d) is fixed in this PR. NodeConfig::save now clears group/other write after writing, so a 0002 umask can no longer leave node.toml 0664 and make every allocation refuse. Test: node::tests::node_config_save_clears_group_and_other_write.'
