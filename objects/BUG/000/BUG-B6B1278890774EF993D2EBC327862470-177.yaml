  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (parser):** `parse_spec_id_from_add_output` strict exact-ID parsing — `Added: AGREED (LOCAL) - title` returns the stored local spec_id (canonical); no-alias `Added: ID - title`; canonical node-local `STORY-<32hex>-N`; legacy `ID: X`; ANSI; title containing ` - ` and ID-like tokens; diagnostics lines containing ID-like text are ignored; malformed (`Added: Some title`, `Added: A (B C)`), conflicting (two Added lines naming different IDs / Added vs ID: disagree), and empty output all return None.
    - **Fixture (autoqueue end-to-end, fake gh + recording fake aida, temp HOME/store):** child `aida add` prints `Added: STORY-2272 (STORY-<node>-288) - Review PR-42: ...` → exactly one `add` call, `rel add <canonical> TASK-77 --type implements`, `queue add <canonical> --for reviewer`; outcome Filed with that canonical id. The child add is invoked with `--canonical-ids` (existing contract).
    - **Fixture:** queue add fails → outcome SkippedNeedsAttention naming the filed canonical story (durable retry, not claimed queued), exactly one add.
    - **Fixture:** ambiguous/malformed add output → SkippedNeedsAttention, no rel/queue calls with garbage IDs, no second add.
    - Existing-review-story retry and GitHub/GitLab behavior: unchanged code paths, covered by existing tests (bug_2208, bug_1609, BUG-HOME-041 tests).

    ### Expected files
    - `aida-cli-lib/src/pr_lookup.rs` (parser + `--canonical-ids` on child add + error distinction)
    - `aida-cli-lib/src/review_gates.rs` (caller message; test module registration)
    - `aida-cli-lib/src/tests/bug_2404_add_output_identity_tests.rs` (new)
    - `aida-cli-lib/src/tests/statusline_tests.rs` (existing parser test kept green)

    ### Ambiguities / conflicts as questions
    - Which of agreed vs local to queue: choosing the stored `spec_id` (local, canonical node form) — the spec text names that as the canonical identity; both resolve to the same row.
