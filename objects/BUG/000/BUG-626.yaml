spec_id: BUG-626
agreed_id: BUG-626
title: An epic should not be In-Progress with no children — derive epic status from child rollup, or warn/block the manual set
description: 'Operator found EPIC-49/EPIC-50 at status In-Progress with ZERO children — a false ''actively being worked'' signal that pollutes aida list --status in-progress (the live what-is-being-worked view). aida why already says ''decompose — an epic with no children yet''. An epics status should reflect its children (rollup), not be set independently: an epic with no in-progress children cannot itself be In-Progress. FIX OPTIONS (implementer picks): (a) aida edit <epic> --status in-progress warns or blocks when the epic has no children; (b) epic status auto-derives from child rollup so it cannot drift; (c) an aida doctor / lint check flags In-Progress childless epics. Prefer a programmatic guard (substrate-as-bouncer) over a rule, since this is exactly the kind of hygiene drift a confident setter will reintroduce.'
