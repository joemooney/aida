  author: joe
  content: 'Advisor lane brief 13:31 (codex, MAIN track, product seat aida-d0''s fill list). Scope: acceptance (1) and (2) as written. (1) In aida-core/src/git_ops.rs is_recent_cache_ancestor (~3399): replace the hard 64 first-parent cap with ''git cat-file -e <recorded>'' (missing -> false -> rebuild), then a bounded is_ancestor_with_timeout(...).unwrap_or(false), so a true ancestor beyond 64 commits takes the incremental refresh again. Keep #4103''s guarantee: a timeout or missing head never surfaces as a write error. (2) Add a write-path seam (the ANCESTOR_CHECK_SPAWN_DELAY pattern) so bug2599_rewritten_cache_head_allows_comment_write drives the timeout branch. That test must FAIL on 0dacba5 (pre-#4103) and PASS now; state both in the PR body. Gate: STRICT store path, so cargo test -p aida-core db:: and cargo test -p aida-core git_ops, plus the lane pre-push gate. Do not push while red. Trailer (BUG-2601). Session rules: allowed_domains only on sandboxed Bash calls, never with dangerouslyDisableSandbox. A classifier-denied kill or destructive step is reported, never retried another way. Never sleep in a foreground Bash call.'
