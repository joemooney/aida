  content: 'Implemented time-bounded merge-base ancestry in place of the 64 first-parent commit cutoff. Timeout accounting now starts before spawn; the thread-local delay seam drives a stale-cache load/comment/save through the actual two-second timeout and asserts one fallback rebuild plus persisted comment. The 143-empty-commit idle-gap fixture plus one object change measured 1 incremental refresh and 0 full rebuilds (the previous 64-count code necessarily rebuilds this case); this is fixture evidence, not a production rebuild-rate sample. Lane tests: bug2601 3 passed; is_ancestor_with_timeout_honours 1 passed; bug2599 1 passed. rustfmt and git diff --check passed. Changed aida-core/src/git_ops.rs and aida-core/src/db/cached_git_backend.rs; edits left uncommitted for host publication. Host codegraph path missing; doctor confirms missing client, rg used instead.'
