title: 'BUG-2599 follow-up: 64-commit ancestry cap forces 43 s rebuilds after ~27 min idle; write-path timeout branch untested'
description: 'From #4103''s STRICT review. (1) is_recent_cache_ancestor (aida-core/src/git_ops.rs:3399) caps proof at 64 first-parent commits. The store makes about 143 first-parent commits an hour, so a cache idle for about 27 minutes pays a full rebuild (~43 s on the primary) on its next write, where merge-base used to allow an incremental refresh (already bounded by INCREMENTAL_MAX_FILES=500). Use cat-file -e plus a bounded is_ancestor_with_timeout(...).unwrap_or(false), or a larger cap. Measure the rebuild rate. (2) bug2599_rewritten_cache_head_allows_comment_write passes on the pre-fix code, because merge-base is fast in a tiny repo. Add a write-path seam (the ANCESTOR_CHECK_SPAWN_DELAY pattern) so a write test drives the timeout branch and fails on 0dacba5. Acceptance: both, with a test for each.'
