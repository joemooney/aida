spec_id: BUG-b6b1278890774ef993d2ebc327862470-033
title: aida pr ship post-merge worktree cleanup runs git status on every worktree serially (26 min for 240 worktrees, 0 reclaimed)
description: |-
  2026-10-29: `aida pr ship 3108` merged at 03:06Z but the process ran about 26 more minutes in the merged-agent-worktrees cleanup, calling `git status --porcelain` on each of 240 registered worktrees (114G under ../aida-worktrees), and reported '0 reclaimable'. That blocks serial-ship, so every other approved PR waits behind it.

  Acceptance:
  1. Cleanup only examines worktrees whose branch is merged (cheap ref check first); it never runs git status on unmerged ones.
  2. Bounded total time (for example 60s), then defer the rest to `aida doctor --category merged-agent-worktrees`, saying so.
  3. The ship's merge result prints before cleanup starts, and cleanup can run detached or be skipped with a flag.
  4. Test with many worktrees showing that unmerged trees are not status-scanned.
