    Implementer findings (draft TASKs could not be filed: ID allocation is read-only in this seat). PR #3123.

    1. kind:bug-spotted: in a contained seat clone, `aida ship --no-merge` refuses at step 1 (host-git guard) even with a clean tree, and `aida pr auto-queue-review` / `aida add` fail with "Read-only file system". The branch was pushed with plain git and the PR opened with `gh`. Review was NOT auto-queued for PR-3123.
    2. kind:design-choice: `--no-cleanup` now also skips step 6 (session reap + merged-worktree GC) instead of adding a new flag. The merged-only + 60s limits apply only to the quiet post-ship GC; the full `aida doctor` scan is unchanged.
