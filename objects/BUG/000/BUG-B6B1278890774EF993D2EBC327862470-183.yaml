  content: |-
    ADVISOR REWORK BRIEF (06:46 MST), PR #3259 round 1 at f036535. Final round.
    1. BLOCKING: in scripts/test-timings.py check(), an untouched row within limit x untouched_factor hits 'continue' before found.append, so stalled() never sees it. Repro: touched A at 10.5s and untouched B at 11.0s with overlapping JUnit spans. Base reports both as runner-stall notes and exits 0; this PR makes A a violation and exits 1. Fixed means every over-limit row, tolerated ones included, goes to stalled() first, and only then is each classified as stall, tolerated or violation. Add exactly that repro as a regression test.
    2. BUNDLE: make the CI 'Test time budget' step print the changed-file count (or the explicit 'no parent commit' fallback), and state in the PR which branch run 41450856620 took.
    Gate: FASTTRACK plus the timing-script Python tests and make check-ci-fast; no cargo. Push to the PR branch.
