title: aida node list prints only the current node's summary instead of every registered node with its label
description: '2026-10-29: operator ran `aida node list`; it printed only ''WORK node b6b1278890774ef993d2ebc327862470 (node-local allocation; no global blocks).'' Its help says it lists ALL nodes in the shared registry and marks the current one with `*`. The registry holds legacy numeric entries (registry/nodes.toml, ids 1..N with hostname/clone_path) and UUID nodes, plus labels in registry/node_aliases.toml (HOME -> b6b1..., ASTER -> a65b...). Acceptance: node list shows one row per known node (UUID node ids from node_aliases.toml, nodes.toml, id-block/pool records and spec-ID namespaces seen in the store), with label (current + retired), hostname/clone path when known, role, and a `*` on this clone; the ''WORK node'' role wording follows STORY-HOME-098''s rewording.'
