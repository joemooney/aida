    Worker clones returned from `node list` after printing only their own summary, hiding the rest of the store. Listing now combines node and label registries, current and retired labels, allocation blocks/pools, the recorded root, and stored filename/native/agreed spec-ID namespaces into one row per identity.

    The table marks this clone from its opaque binding or legacy config and shows recorded hostname/clone paths. Local allocation configuration supplies `worker` or `root`; the shared designation is labeled `recorded root`, while other clones' private configuration remains unknown. These observations do not grant authority. Listing does not acquire, repair or enroll identity. Malformed evidence fails explicitly rather than producing an apparently complete view.

