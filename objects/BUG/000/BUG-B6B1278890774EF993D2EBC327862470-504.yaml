title: 'Flaky story_2775_operator_signals_stop_supervisor: reads child.pid before the PID is written (ParseIntError Empty) and reds trains'
description: |
  Found 2026-11-23 22:40 (integration-30): train #4488 (carrying promotion 29 / PR #4485) closed RED on CI (lib-1) because of a flaky test unrelated to its diff: `deputy_shell::supervisor::tests::story_2775_operator_signals_stop_supervisor` panicked at aida-cli-lib/src/deputy_shell/supervisor.rs:281 with `ParseIntError { kind: Empty }` (run 45332748370, job 138237557644). Main CI at aaeb386bf5 was green, and #4485 was green at its own head.

  Cause: the test waits only until `child.pid` EXISTS (`q.root.join("child.pid").exists()`), then `read_to_string(..).trim().parse().unwrap()`. The supervisor child can create the file before writing the PID, so the read sees an empty string. A red train is bisected and ejected rather than rerun, so one flake costs a whole promotion cycle.

  ## Acceptance
  - AC1: The test waits for `child.pid` to hold a parseable PID (bounded retry), OR the child writes the pid file atomically (temp + rename). A regression test simulates an empty-then-filled pid file.
