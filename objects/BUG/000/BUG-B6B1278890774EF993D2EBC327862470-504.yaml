  content: 'Advisor disposition 22:45: APPROVED, standard tier (test-only), drain, integration filler, priority high. Confirmed at aida-cli-lib/src/deputy_shell/supervisor.rs:272-281: the test waits for child.pid to exist, then parses it, which races the writer (empty file → ParseIntError). Fix: poll until the content parses as a u32, within the existing deadline. If production writes child.pid non-atomically, write temp+rename there too. ≤40 lines. This flake cost train #4488 (promotion 29).'
