title: Contained Codex pin (0.166.0) contradicts the launcher's -P permission-profile flag (codex 0.167+); re-pin to 0.167.0
description: 'launch/contained.rs:1397 adds ''-P aida'' (permission profile), which codex-cli only accepts from 0.167.0. launch/codex_auth.rs pins the contained binary to codex-cli 0.166.0 (SHA b8a11fed...), which rejects it: ''error: unexpected argument -P found''. So no binary can pass both the pin and the launch. Repro 2026-11-07 16:52Z, operator''s live conformance run (out=~/.aida/conformance-codex-aida-1794070266): the containment receipt was issued, then codex exited 2 on -P, and C0-C4 were all unknown. dell1 has codex 0.167.0 with -P. Acceptance: (1) the pin moves to codex-cli 0.167.0 with its probed SHA-256 for the npm vendored musl binary (re-probe per STORY-2593: version, no in-lane refresh, empty refresh_token behavior). (2) The launcher checks before launch that the pinned version supports every flag it passes, and fails closed naming the flag. (3) A test pairs the pin with the argv builder, so a future flag or pin change can''t drift apart again. (4) Docs name the supported codex version and the upgrade step (npm i -g @openai/codex@0.167.0).'
