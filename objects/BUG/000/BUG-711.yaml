    Validated 2026-07-08 (TASK-1119 dogfood drive): the lease + pool-worktree teardown now fires on the AlreadyMerged path — "✓ lease deleted", "✓ worktree returned to the warm-pool", and correctly "no open PR — reviewer queue not filed". aida session leases shows NO lingering lease afterward (vs TASK-1118 pre-fix which leaked one). Core gap CLOSED.

    Residual (separate, low-priority, self-healing): the drain.lock is still left with a dead pid on clean drive exit — the DrainGuard RAII Drop is likely skipped because the drive exits via std::process::exit(). Next drive reclaims a dead-pid lock via the pid-liveness check, so it is not a hard blocker, just untidy. Split to its own follow-up rather than reopening this.
