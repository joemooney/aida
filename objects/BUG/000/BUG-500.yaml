title: 'aida queue work --zen: the ''stop'' path should run ''aida session end'' (clean up worktree+lease), not just pause'
description: 'Operator-surfaced 2026-06-11: after a --zen implementer finishes (PR auto-opened, spec marked Done), the session PAUSES at grab-next/stop but never cleans up — it leaves the worktree (~/ai/aida-<spec>) + the session lease dangling, which the operator must ''aida session end <id>'' by hand every time. --zen = no orchestrator, and the orchestrator (--auto-complete) is exactly what drives session-end — so the cleanup that path gives for free is missing in --zen. Operator''s words: ''ideally it would have done that itself.'' Fix: the ''stop'' choice at the --zen finish checkpoint (PR opened + spec Done) should run ''aida session end'' (remove worktree, clear lease) — only ''grab-next'' keeps the session alive. Bonus: ending before the PR merges also sidesteps the TASK-721 merged-worktree-can''t-delete papercut. Keep the finish-checkpoint''s other info (state / recommendation / decoupled decisions) intact; just wire ''stop'' to clean up.'
