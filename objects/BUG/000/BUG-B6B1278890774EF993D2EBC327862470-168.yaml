    2. **kind:followup-suggestion, minor** — `[agents] mcp` is now enforced for Codex only on `aida agent new codex` (mirroring where Claude applies `claude_mcp_flags`). Queue-work interactive Codex (`exec_codex_session`), headless `codex exec`, and codex exec fork still load every config MCP server; Claude queue-work/headless never gets `--strict-mcp-config` either. Plugin-provided Codex MCP servers (e.g. cua_repl) reject `-c mcp_servers.<n>.enabled=false` on codex-cli 0.166.0 (`invalid transport`); only `--disable plugins` removes them, which also drops plugin skills.
