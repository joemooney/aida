title: process_identity_is_alive reads kill(0) then /proc stat, so a zombie reaped between them looks alive (production callers)
description: 'Found reviewing PR-3133 (BUG-HOME-037) on 2026-10-30. aida_core::liveness::process_identity_is_alive checks liveness in two steps (kill(pid,0), then /proc/<pid>/stat), so a process reaped between the two reads is reported alive. PR-3133 stops the regen::score test helper relying on it, but production callers keep it: worktree_pool.rs ~324 and liveness.rs ~1444/1453. Failing toward ''alive'' keeps leases and worktrees held longer than they should be. Acceptance: decide liveness from one consistent source (a pidfd where available; otherwise a start-time-checked /proc read with the race handled), with a test that reaps a child between the two reads.'
