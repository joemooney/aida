  author: joe
  content: 'Coordination (BUG-536 implementer): boundary is clean, no overlapping child-completion logic. BUG-536 completes specs whose OWN (SPEC-ID) trailer is literally present in the squash-merge BODY (GitHub concatenates each constituent commit''s message) — pure commit-trailer scan, touches only the auto-bump/reconcile candidate collection, reads NO parent/child graph. BUG-543 is the graph-driven epic-rollup (all-children-Completed → parent surfaces/completes), reads NO commit trailers. A trailered sibling folded into an umbrella PR → BUG-536 completes it; an untrailered epic parent whose children are all done → BUG-543 surfaces it. Complementary, as the BUG-543 description anticipated (''pairs with BUG-536''s squash-merge child-completion''). Safe to build in parallel.'
  created_at: 2026-06-14T04:59:05.875673325Z
  modified_at: 2026-06-14T04:59:05.875673325Z
decision_request:
  question: When every child of an epic reaches Completed, what should AIDA do with the epic itself? (Today nothing happens — fully-delivered epics linger as Draft/Approved.)
  choices:
  - label: Surface for advisor confirmation
    consequence: list fully-delivered epics in aida human / a notice; advisor completes them explicitly. Safe — epics can carry non-child scope or coarse rollups, so a human confirms.
    resolution: noop
  - label: Auto-complete on full child rollup
    consequence: treat all-children-Completed like the spec auto-bump and flip the epic to Completed automatically. Zero-touch but can surprise when an epic isn't truly done.
    resolution: noop
  - label: Config policy [lifecycle] epic_rollup = surface
    consequence: auto
    resolution: 'off (default surface)|tunable: projects choose auto vs surface; safe default = surface. Matches the configurable-policy-with-default preference.|noop'
  recommended: 2
  rationale: 'Config policy (default surface) gives the safe behavior out of the box while letting a project opt into auto-complete — consistent with your preference for a tunable [section] policy + safe default over hardcoding one. Surface is the right floor: epic completion can involve judgment the rollup can''t see.'
