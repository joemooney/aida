title: scaffold status reports permanent false drift in the AIDA source repo (symlinked templates)
description: |-
  aida scaffold status always reports drift (~122 modified, 48 missing, 5 extra) when run in the AIDA source repo itself, even on a freshly-built binary matching HEAD.

  Root cause: check_scaffold_status (aida-core/src/report.rs:400) compares files on disk against scaffolder.preview() — the generated/substituted artifact content. In this repo, .claude/commands/*.md and .claude/skills/* are per-file symlinks to the raw master templates (aida-core/templates/) by design (dogfooding). The raw template != the generated artifact (frontmatter/substitution wrapping adds ~3 lines), so every symlinked file reports as modified. CLAUDE.md also reports 18-expected-vs-351-found because this repo's is hand-maintained.

  This makes scaffold status produce permanent, unactionable noise in the source repo. make sync-templates does not (and cannot) resolve it.

  Proposed fix: when a scaffold target resolves through a symlink into aida-core/templates/, treat it as matching (or skip it). Optionally special-case a hand-maintained CLAUDE.md.

  Found: v0.14.0 (sha 112a86354), debug build. Filed with GitLab issue on gitlab.joemooney.com (first remote issue).
