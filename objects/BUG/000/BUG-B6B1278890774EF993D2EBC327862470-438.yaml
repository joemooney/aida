    REVIEW FINDINGS TO ADDRESS (BUG-2674):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 64a68c24a618
    Recorded: 2026-11-19T08:02:08.048529057+00:00
    Findings:
    1. [P2] Implement eligible-work idle detection rather than equating fresh passes with progress. aida-cli-lib/src/advisor_loop_service.rs:2573-2586 only inspects report.errors and report.at; report.changes and report.dispatched never affect health. Repeated passes can find open eligible work, dispatch zero reviews and still remain running forever: for example watch_changes treats admission WouldBlock as a printed message without adding it to refused, then publishes a fresh empty-error report every pass. This misses BUG-2674 AC4 and the original healthy-but-no-reviews failure mode. Persist enough eligibility/progress evidence and elapsed idle time to degrade sustained inability to admit eligible reviews, distinguish legitimate idle/capacity waits, and add regression coverage for repeated fresh zero-dispatch passes with eligible work.
    2. [P2] Bound the no-report grace period and surface unreadable report evidence. aida-cli-lib/src/advisor_loop_service.rs:2563-2575 converts missing files, read errors and malformed JSON to None, and None produces no degraded reasons regardless of worker age. On a fresh deployment a worker repeatedly failing sync/discovery before its first completed pass, hanging in its first pass, or unable to write last-pass.json can stay running indefinitely; all these bypass controller_pass_report while the worker PID remains live. This contradicts the claimed 15-minute no-pass detection and leaves BUG-2674 health acceptance incomplete. Track a worker start/report deadline, preserve read-error diagnostics, and test an old live worker with no valid report as well as a fresh worker grace period.
    3. [P2] Emit the required timestamped dispatch-count log record for every pass. aida-cli-lib/src/advisor_loop_service.rs:2545-2558 suppresses each zero-dispatch/error-free pass until the 300-second heartbeat deadline. BUG-2674 AC3 explicitly requires service.log to record each pass, and quiet passes with open work are precisely the evidence needed to investigate this incident. last-pass.json overwrites the previous snapshot and does not preserve those missing pass records. Log one bounded summary per pass (or obtain an explicit acceptance change) and cover consecutive quiet passes in a logging regression.
    4. [P3] Preserve the total refusal count separately from capped diagnostic samples. aida-cli-lib/src/advisor_loop_service.rs:2539-2543 retains at most 16 error strings, but print_status_with_pass at line 331 reports pass.errors.len() as the number refused. A pass refusing 20 changes logs 20 yet status reports 16, with no truncation indication or total in last_pass. Keep the bounded sample while persisting/displaying the actual total and indicating omitted messages; add a greater-than-16 case.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
