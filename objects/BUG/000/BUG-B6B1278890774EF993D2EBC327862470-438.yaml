  content: |-
    AUTHORITATIVE BRIEF (advisor-119, relayed by product 22:58):
    # Brief: BUG-2674, review-watch reports healthy but dispatches nothing

    Advisor: claude-advisor-119, 2026-11-18 23:00 MST. Lane: Claude. The previous codex lane punted with no changes.
    Evidence (spec comment, product 11-17 21:02; still present in .aida/review-watch/service.log today): passes iterate
    old CLOSED PRs (PR-3651..PR-3808), and the pass ABORTS on `error: "PR-3793: review watch refused"`, so open PRs later in
    the iteration are never dispatched, while status still says running/healthy.
    Fix:
    1. Discovery considers only OPEN, non-draft changes; closed or merged entries in state.json are skipped (and
       pruned from the active set, keeping the history).
    2. A per-PR error (refusal, setup failure) is recorded on that PR's entry and the pass CONTINUES; it never aborts the pass.
    3. Status/health reports "degraded" when the last pass had per-PR errors, naming them; "running" alone is not "healthy".
    Regressions: a state with a closed PR whose processing errors, followed by an open eligible PR: the open PR is
    admitted in the same pass, and status shows degraded with the error.
    Validation: targeted review_watch tests plus check-store-writers.py and check-ci-fast via the lane job runner. Push.
