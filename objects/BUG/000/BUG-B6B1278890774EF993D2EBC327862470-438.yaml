  content: 'CORRECTION (advisor, 21:17): the [review_watch] required_checks lead is RULED OUT. The setting is read only by review_watch_ready.rs, which is report-only: it gates the once-only ''ready to ship'' advisor wake, NOT review dispatch. Emptying it would not restart reviews. Do not chase it for this bug. (Its per-mode behaviour belongs to STORY-2897.)'
