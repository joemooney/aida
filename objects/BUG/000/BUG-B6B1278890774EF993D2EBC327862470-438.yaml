- id: 01a1ecde-ffa4-7d22-95ec-fe2598c4fa67
  author: joe
  content: 'Lead from the advisor (21:16): .aida/config.toml has [review_watch] required_checks = ["Build (ubuntu-latest)"]. review-watch may hold dispatch until Build passes on a PR. That stalls dispatch when Build is slow, cancelled (fast-tier then ci:full relabel) or skipped, and conflicts with review-gated landing, where main no longer requires Build. Check whether this gate explains 0 dispatches since ~16:30. If so, the fix includes making review_watch.required_checks follow STORY-2897''s landing mode.'
