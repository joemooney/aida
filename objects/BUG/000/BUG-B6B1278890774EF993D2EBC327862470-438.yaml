    ## Implementer self-review
    Reviewed HEAD: 64a68c24a6 (PR #4286). Diff: review_watch.rs, advisor_loop_service.rs, docs/cli/06-roles-sessions.md.

    Root cause found in code: 'PR-N: review watch refused' was the context added to a whole-watcher stop (a GlobalState-tagged error: unusable state, or controller authority ended or superseded via check_controller_locked). It named whichever PR the pass was on, so it was not a refusal of that PR. Discovery already admits only open, non-draft changes (parse_change), and per-change refusals already continued the pass (BUG-2471). Brief items 1 and 2 already held; this PR does not change them.

    Fixes: the stop is now labelled 'review-watch pass stopped while processing PR-N'. watch_changes returns its refusals. Each controller pass writes .aida/review-watch/last-pass.json and logs a timestamped pass line (always when it dispatches or refuses, otherwise every 5 min). loops status reports a live worker as 'degraded' when the last pass refused or stopped, or no pass completed for 15 min, and adds last_pass and degraded_reasons. A failed report write is non-fatal.

    Evidence: [behavioral-test] bug2674_refused_change_never_blocks_the_next_and_degrades_status, bug2674_stalled_passes_degrade_a_running_worker, bug2674_watcher_stop_is_not_reported_as_one_change_refusal. Lane job filter bug2674|bug2471|story2691|story2571: 61 passed, 0 failed. check-store-writers.py passed.

    Probes: multiplicity of 0, 1 and N refusals is covered; errors are capped at 16 and bounded. A stale report from a previous worker can briefly show degraded until the new worker's first pass; this is accepted.

    Residual: check-ci-fast was not completed (60 s per-call cap in this seat). The host's live worker and log were not observed. 'Idle with eligible work' is approximated by refusals or a stalled pass, not an eligibility count.
