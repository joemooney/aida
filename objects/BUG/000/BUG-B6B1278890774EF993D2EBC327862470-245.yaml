- id: 01a1b476-d53b-7f11-b88e-f5ebc390373b
  author: joe
  content: 'Implemented the host run-loop fix: check listener POLLHUP/POLLERR before entering seccomp notification receive, removing hung-up listeners from the watch set. Added a subprocess-watchdog regression using the production loop, real socket readiness/hang-up, and a child lane process; covers hang-up, normal notifications, and cancelled notifications. The regression reproduces the original failure against HEAD. Validation: all 22 tests in tests.test_store_mutation passed (including live fixtures); the final synchronized shutdown regression passed; cargo fmt --all -- --check and git diff --check passed. Native-seat handoff: changes remain uncommitted in contained_host.py and tests/test_store_mutation.py; host publication and queue completion remain pending. No implementation blockers.'
