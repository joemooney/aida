title: 'contained_host.py: shutdown can block because the notification listener is read before its hang-up is checked'
description: 'Source: work GDMS CI report. In the run loop (aida-cli-lib/src/containment/contained_host.py about line 744), broker_connect_contained() runs on the notification socket before _hung_up() is checked, so a hung-up listener can block the shutdown. The work fix checks for listener hang-up before receiving. Acceptance: a test closes the notification peer during a lane run, and the host exits within the normal shutdown deadline.'
