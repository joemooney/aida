title: Review verdict for one PR is recorded in another PR's gate ledger when both PRs reference the same spec
description: 'Observed 2026-11-10: a reviewer of canary PR #3764 (title ''(Refs BUG-2492)'', head f9184b7) recorded its WAITING verdict as PR-3651 ledger seq 53 (change PR-3651, head f9184b7376, spec BUG-2492), and ''aida review verdict PR-3651'' then reported that verdict against a head PR #3651 never had. The reviewer''s change identity was resolved through the spec, which picks one PR when two open PRs name the same spec. Effects: the real PR''s latest verdict is replaced by another PR''s; head-pinned gates still refuse it (head mismatch), but status, waiting-release and auto-train read the wrong verdict. Fix: the verdict''s change key comes from the reviewer''s leased change (PR-N), never from a spec lookup; refuse a record whose head is not the named PR''s head. Test: two open PRs naming one spec, verdict for the second lands only in its own ledger. Evidence: .aida/gate-ledger/PR-3651.jsonl seq 53; PR-3764.jsonl.'
