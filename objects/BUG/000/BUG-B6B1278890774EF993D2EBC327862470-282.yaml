    REVIEW FINDINGS TO ADDRESS (BUG-2517):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 544b8b9dbc27
    Recorded: 2026-11-11T05:57:28.013526843+00:00
    Findings:
    1. [P1] Honor change_binding=unbound in every consumer (aida-cli-lib/src/gate/ledger/mod.rs:293-296). The marker only prevents immediate spec->PR routing. store::bind_unbound (store.rs:411-449), called when a change is opened, recorded or collected, still copies these records into an arbitrary change for that spec; effective::load_view (effective.rs:675-707) also consumes them as member evidence before any copy. Thus a local spec-only waiting/approval at a matching SHA can change a PR's gate without ever checking that PR's head. Distinguish deliberately spec-only records from legacy pre-change records in binding and gate projection, and add regressions that record locally, then open/record/collect another PR sharing the spec.
    2. [P2] Do not clear change claims after an unbound spec-only review (aida-cli-lib/src/lib_part5.rs:3484-3488). With no matching review lease or explicit change, pr is None but clear_review_markers_for_verdict removes every live PR marker naming the spec (helper at 2757-2770). A local spec-only waiting/approval can therefore clear both PRs' under-review protection despite settling neither change. Clear only the resolved ChangeKey's claim; leave all change claims intact for an unbound record. Add a two-PR marker regression.
    3. [P2] Reuse one bounded ledger discovery per gate operation (aida-cli-lib/src/gate/ledger/checked.rs:450,472-473). Every read_change_events now scans all change ledgers and charges the same shared Budget again. effective::load_view calls it for the requested change and each other indexed change, so two PRs sharing a spec scan the entire corpus twice. The current shared ledger has 672 files totaling 58,946,197 bytes: two complete passes exceed MAX_SELECTION_BYTES=64 MiB even though the relevant PR ledgers are small, causing a spurious Unsafe refusal. Pass/cache a single pinned discovery through load_view and filter all requested changes from it; cover multiple related changes with a budget that fits one corpus pass.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
