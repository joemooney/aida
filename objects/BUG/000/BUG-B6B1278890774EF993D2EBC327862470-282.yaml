- id: 01a1cfac-ed28-73e0-8df1-59b192ceb729
  author: joe
  content: 'Round 4 (4a220acd084): merged origin/main (resolved lib_part5.rs: kept change-keyed review_record_kind plus main''s BUG-2527 explicit-approval guard). F1: when ownership discovery is incomplete, the readers now drop only review copies a foreign PR could own (fingerprinted, not phase-3); holds, carry-over proofs, phase-3 and unfingerprinted records stay. Before this, the round-3 unwrap_or_default dropped every event, holds included. Regression test extended: an unrelated malformed ledger, checked through both the PR-keyed and spec-indexed readers. F2: the single ownership index per discovery from 11ed2b2 is kept, with its one-pass coverage test. untested=true: the lane runner timed out at 900s twice while compiling.'
