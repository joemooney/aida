  content: 'Round 4 implementation: on incomplete ownership discovery, the legacy PR/spec readers now omit all change-bound evidence rather than restoring raw historical foreign copies; explicit unbound spec evidence remains readable. Discovery builds one fingerprint-to-owner index from the complete corpus and reuses it across every bound/change bucket and filter_miskeyed. Regression extends the existing two-PR foreign-copy fixture with an unrelated malformed ledger and byte-for-byte history checks; a multi-bucket counter regression requires one ownership-index build and one witness pass, including filter_miskeyed. Targeted lane-runner validation is in progress. Native seat edits remain uncommitted for host publication.'
