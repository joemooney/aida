  author: joe
  content: 'ADVISOR RULING (2026-11-10 08:59 UTC): approved. Fix exactly as described: the verdict''s change key comes from the reviewer''s leased change (PR-N/MR-N), never from a spec->PR lookup; refuse to record a verdict whose head is not the named change''s current head. Regression: two open PRs naming one spec; a verdict for the second lands only in its own ledger and ''aida review verdict'' for the first is unchanged. Also tolerate the existing mis-keyed record (PR-3651 seq 53): reading a ledger ignores a verdict whose head was never that PR''s head, without rewriting history. LIGHT gate.'
