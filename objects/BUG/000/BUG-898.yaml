title: queue work launches the disabled claude vendor instead of the enabled codex — after already creating the worktree
description: 'Field report from a codex-only project (2026-09-07; filed as BUG-018 in that project''s own store): with Claude DISABLED and Codex ENABLED in the persisted agent profile, bare aida queue work SPEC created the worktree and lease, then attempted to launch claude — failing after state was already mutated. Expected: vendor selection resolves BEFORE any state mutation — pick the single enabled vendor automatically when unambiguous; if the default vendor is disabled and none can be resolved, refuse up front (no worktree, no lease) with a recovery line naming --no-launch and the explicit --vendor codex form. The enabled-agents allow-list (STORY-807 persisted profile) must gate every launch surface, not just init scaffolding. Acceptance: codex-only profile + bare queue work launches codex; all-disabled refuses with zero state created; unit test on the launcher vendor resolution against the profile.'
