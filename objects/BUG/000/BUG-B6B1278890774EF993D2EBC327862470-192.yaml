comments:
- id: 01a1a1a7-d47b-72a3-bd8a-a629803e21d3
  author: joe
  content: 'Second defect in the same run: the train gate printed ''✓ ready'' for #3284 and #3283 although both still carried an active aida:merge-hold (label present; ''aida merge-hold list'' shows the hold armed, with its release condition met but not yet cleared). CI''s merge-hold-gate on train PR #3290 then failed with ''Train member #3284 has an active aida:merge-hold''. The local gate must apply the same hold rule as CI: a met-but-uncleared hold is not ready.'
  created_at: 2026-11-03T13:44:53.115121812Z
  modified_at: 2026-11-03T13:44:53.115121812Z
  session_id: f5eddefe-032d-4760-94ba-3a318cf3d1d1
- id: 01a1a1af-2de4-78c0-bc4d-a124cc2beeb4
  author: joe
  content: 'Third train gap (operator run, 13:50Z): ''aida pr train 3280'' run by the operator at a terminal refused #3280 with ''under a merge hold ... the mandate does not cover this ship ... a human must merge it''. A human WAS merging. ''aida pr ship N'' releases a met-condition hold for a human at a terminal who names the PR; the train should do the same for an explicitly named PR, and must not blame the mandate when a human is the actor.'
  created_at: 2026-11-03T13:52:54.756107204Z
  modified_at: 2026-11-03T13:52:54.756107204Z
  session_id: f5eddefe-032d-4760-94ba-3a318cf3d1d1
- id: 01a1a1b5-1182-7463-9e96-17a5aa92062c
  author: joe
  content: 'Implementation in progress: no-checks registration now waits up to 180s, failed row reads retry on the same train, and CI-unavailable stops retain the train PR and do not eject members. Follow-up hold comments require a policy ruling: BUG-2214 signed Q2 and wait-CI behavior explicitly admit mandate-covered armed holds until lease-protected release, whereas BUG-2423 comment 1 requests armed holds never be ready. Human named-PR release parity also extends the mandate-only train release path. Keeping these authority changes separate from the registration fix pending a recorded decision.'
  created_at: 2026-11-03T13:59:20.706499131Z
  modified_at: 2026-11-03T13:59:20.706499131Z
  session_id: 01a1a1add7ce
