  content: 'Second defect in the same run: the train gate printed ''✓ ready'' for #3284 and #3283 although both still carried an active aida:merge-hold (label present; ''aida merge-hold list'' shows the hold armed, with its release condition met but not yet cleared). CI''s merge-hold-gate on train PR #3290 then failed with ''Train member #3284 has an active aida:merge-hold''. The local gate must apply the same hold rule as CI: a met-but-uncleared hold is not ready.'
