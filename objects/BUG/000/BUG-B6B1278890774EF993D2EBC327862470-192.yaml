title: aida pr train ejects every member when it reads the train PR's checks before GitHub has registered them
description: |-
  Observed 2026-11-03 13:43Z: 'aida pr train 3284 3283' opened train PR #3290, then immediately ran 'gh pr checks 3290 --json'. It got 'no checks reported on the train/20261103-134333-1 branch', treated that as unreadable CI, ejected both members and closed #3290 (0 CI runs). Seconds later the checks were registered and pending.

  Expected: a train PR with no checks yet is 'pending', not an error. Poll with a grace window (e.g. up to 3 minutes for the first check to appear) before ejecting. Only a genuine gh/API failure after retries should stop the train, and that should retry the same train rather than eject members.

  Acceptance: (1) a unit test where the checks reader returns 'no checks reported' for the first N polls and then pending, then success: the train lands. (2) No checks after the grace window: the train stops with a clear 'CI never started' reason and leaves the train PR open for inspection.
