- id: 01a1a1ed-31b5-70a1-815e-c8bcb9753989
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2423):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 85c7014d279d
    Recorded: 2026-11-03T14:40:18.047796859+00:00
    Findings:
    1. aida-cli-lib/src/pr_train.rs:2511-2517 (ForgeRails wait_ci error arm): every error from wait_ci except a dispatch abort is wrapped as TrainCiUnavailable. That includes TrainCiReadiness::Refused ('required checks were skipped'), which is deterministic: a rerun of the same members skips the same check. It also includes 'train PR head/base/state changed during CI readiness' (the train PR was closed or force-pushed), and the 600s Missing-required-check timeout. Before this PR those ejected members with a clear reason. Now they are suspended with the message 'CI could not be read ... retry the same members', and suspend() comments 'left open for inspection' even on a train PR that is already closed. The spec limits the pause/retry path to 'a genuine gh/API failure after retries'. Fix: classify only TrainCiReadError exhaustion and the 'CI never started' timeout as TrainCiUnavailable; let Refused and head/state-changed keep the abort-and-eject path with their real reason.
    2. No test covers the refusal paths at drive level after the change. Add a drive/ForgeRails test where wait_train_ci yields Refused (skipped required check), asserting the members are ejected (or deliberately handled) with the refusal reason and the message does not say 'could not be read'. Add one for a head/state-changed error too.
    3. aida-cli-lib/src/forge.rs:3963-3972: gh_pr_checks_json adds a new ad-hoc classifier over gh stderr prose: a case-sensitive starts_with("no checks reported on "). The centralized classifier already exists: pr_ship::gh_pr_checks_output_is_unregistered over aida_core::external_tool_output::GH_NO_REGISTERED_CHECKS (case-insensitive, covers 'no checks found', 'no check runs', 'no checks have been reported'). The new site has no '// external-prose-classifier:' marker and no row in docs/architecture/external-tool-output-classifiers.md (TASK-1300 says review must require the marker). Reuse gh_pr_checks_output_is_unregistered (on a non-JSON stdout) and mark the site, so the two gh-no-checks detectors cannot drift.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
