  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (vendor_hints):** one shared `vendor_hints` module resolves `[agents] vendor` (claude default) and renders skill refs (`/aida-x` for Claude, `$aida-x` for Codex when the skill ships in `.agents/skills`, a truthful `aida skill render aida-x` fallback otherwise), interactive launch lines (single-quoted `codex '$aida-pickup ID'`), and `aida agent new <vendor>` (`--bg` only for claude). Tests: claude, codex, agy, codex+claude-only skill.
    - **Unit per surface (AC1):** worktree next block, queue-work manual continuation, `aida ps` spec-less hint, supervise no-advisor line, mandate advisor mail, session reap hint, workflow_hints drained/precheck lines — each builder takes the vendor; tests assert Codex output (`$aida-pr`, `codex`, no `--bg`) and unchanged Claude output.
    - **Unit (AC2 compete):** `--judge-vendor` loses its hardcoded default; explicit flag > `[agents] vendor` > claude (fixture test with config.toml). Codex judge argv becomes `codex exec --sandbox read-only` (read-only enforced; no bypass flag). `ask_ai_argv` already has a Codex arm (asserted).
    - **Unit/fixture (AC2 status):** new `─── Codex ───` status section from `~/.codex/sessions` rollouts (AIDA_CODEX_SESSIONS_DIR), attributed by first-line `session_meta` cwd (shared with runaway-seats), linked to leases by cwd; fixture test with in-project, worktree and foreign rollouts. Claude section kept as-is (deliberate vendor-specific). Inbox hint uses the vendor skill ref. Doctor diagnostics prints both sections; no failure-semantics change.

    ### Expected files
    - `aida-cli-lib/src/vendor_hints.rs` (new), `lib.rs`
    - `worktree_gc.rs`, `queue_cmd.rs`, `dispatch_health_ps.rs`, `supervise_cmd.rs`, `gate/mandate_drive.rs`, `session_reap.rs`, `workflow_hints.rs`
    - `compete.rs`, `compete_cmd.rs`, `status_cmd.rs`, `status_sections.rs`, `doctor_cmd.rs`, `runaway_seats.rs`, help golden snapshot

    ### Ambiguities / conflicts as questions
    - `phase_driver_trait.rs` `/aida-pr` in the advisor resume prompt goes to `spawn_claude_headless_resume` (Claude-only) and `@claude review once` triggers the Claude GitHub app: treated as deliberate vendor-specific, left unchanged. OK?
