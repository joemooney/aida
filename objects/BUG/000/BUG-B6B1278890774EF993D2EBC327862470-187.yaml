title: Lane sandbox binds CARGO_HOME read-write, so a lane can modify registry sources the host later compiles
description: 'From the STORY-2326 signoff (amendment 7, C2 precedent). The existing lane bwrap profile binds CARGO_HOME read-write. Registry sources under CARGO_HOME are compiled by the host later, so a contained lane could plant code that runs host-side. Expected: CARGO_HOME read-only in lanes (or a per-lane CARGO_HOME overlay), with a test that a lane write to the registry sources is refused.'
