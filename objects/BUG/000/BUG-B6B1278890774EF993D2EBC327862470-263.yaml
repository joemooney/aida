  content: 'Implemented review-only cleanup for explicitly closed ownership records, alongside existing dead-owner handling. General reclaim still requires death proof; missing or ambiguous ownership remains refused. Extended consecutive-head pickup coverage for completed leases, dirty/live/unpublished protection and merge-hold preservation; covered successful and bounded watcher setup retry. Lane runner validation: seat_clone::review_repickup_tests (2 passed), bug2498_review_worktree_release_allows_one_watch_setup_retry (1 passed), bug2450_observed_setup_refusals_retry_without_consuming_a_review (1 passed). Corrected local fixture allocation-file permissions and enabled the test-only ownership adapter for simulated release. rustfmt and git diff --check pass. Native seat: edits left uncommitted; host publication and queue completion remain pending.'
