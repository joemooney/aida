    REVIEW FINDINGS TO ADDRESS (BUG-2498):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 6a331f42b461
    Recorded: 2026-11-08T20:59:34.594544961+00:00
    Findings:
    1. Blocking regression, aida-cli-lib/src/review_watch.rs:1650 with 1716-1727: advance() runs finish_confirmed_review(...)? inside the transaction after confirm() has already proved every process gone. Before this PR that branch always set Phase::Superseded. Now any Err from reader::review_finished (reader.rs:179-215: 'review ownership missing', 'ownership store unavailable', holder/phase mismatch, 'review lease changed before completion receipt', or an unparseable snapshot) rolls back and leaves the attempt Superseding, which still counts as active (review_watch.rs:1337, 1591), so the new head is held every pass and only logged as 'refused' (2337-2342). Dual ownership writes are best-effort, so a lease with no record is a legal input. That is the BUG-2498 symptom: a head parked until an advisor intervenes. Traced from source, not reproduced (review policy forbids cargo). Fix: treat receipt failure as missing evidence: log it, set Superseded and free the slot; the next-head pickup then stays refused by review_lease_ended, which is the intended fail-closed point. Replace the assert!(advance(...).is_err()) at tests/task_1993_review_watch_tests.rs:1327 with assertions that the attempt reaches Superseded and review_lease_ended stays false for the changed lease.
    2. Minor, OVERVIEW.md:1837-1845: adds a per-change paragraph for this bug fix, plus a stray extra blank line. CLAUDE.md says per-change notes go in the PR body and an aida comment on the spec, and OVERVIEW.md is edited only for a real architecture change. Remove the paragraph.
    3. Cosmetic, aida-cli-lib/src/queue_cmd.rs:14425-14430: the end_finished_review doc comment still says a review with no collected verdict is kept for recovery. It now also records a completion receipt that lets next-head pickup retire that tree when it is clean and published. Update the comment.
