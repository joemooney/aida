    Verdict: CHANGES REQUESTED
    Reviewed commit: ab3735a1290d
    Recorded: 2026-11-22T19:51:25.193105612+00:00
    Findings:
    1. aida-cli-lib/src/forge.rs, landing_ci_args: gh 2.105.0 lists --allow-escape-sequences[=true|false] in its FLAGS section. No whitespace-delimited word equals FLAG, so OnceLock caches false and every CI read drops the supported option, losing the explicit request to preserve escapes. Recognize the declared option with its optional-value suffix as well as the bare spelling.
    2. aida-cli-lib/src/tests/bug_2690_land_update_branch_tests.rs, bug_2711_installed_gh_supports_composed_argv: the expected-value check requires a space immediately after the flag. On gh 2.105.0 it therefore expects the flag to be omitted and passes with the broken production probe. Correct the independent expectation and add a positive fixture advertising --allow-escape-sequences[=true|false] that requires the flag on the API request, so this regression is detected on hosts with either gh version.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
