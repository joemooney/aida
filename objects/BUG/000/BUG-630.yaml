title: 'TUI request-approval & queue verbs fail: don''t carry advisor authority for ''aida queue add'' (TASK-647 gate)'
description: 'Walkthrough finding (operator, 2026-06-26): the request approval verb prints FAILED to route. Root cause: it spawns aida queue add --for advisor WITHOUT setting AIDA_SESSION_ROLE, so the TASK-647 gate (queuing work needs advisor authority or an interactive session) refuses it. INCONSISTENCY: the approve (TASK-920) and accept (TASK-933) verbs set the role env on their spawned Command; request-approval and queue (built earlier) do NOT. FIX: request-approval sets AIDA_SESSION_ROLE=advisor; queue sets it too (aida queue add --for implementer also needs advisor authority to dispatch). DEEPER QUESTION for design: should REQUESTING approval (routing a draft TO the advisor) require advisor authority at all? The gate conflates dispatch-for-execution with request-approval; arguably the request path should be open to any role. Workaround: launch the TUI with AIDA_SESSION_ROLE=advisor so the subprocess inherits it.'
