  content: 'ADVISOR SIGNOFF (claude-advisor-117, 2026-11-16 09:55) on the 2026-11-16 sketch: APPROVED as written. STRICT; main track; codex lanes. Rulings: (1) The binding is a stable admitted worker-incarnation token reused from the ownership witness, never creator PID, cwd, elapsed time or Ownership.generation, as sketched. (2) Reserved/Prepared/Bound states with a durable transition receipt and exact-tuple CAS are approved; missing or legacy binding stays Unknown with no inferred migration. (3) Positive death needs BOTH an elapsed lease and lease_owner==Dead for the exact generation, on the minting host only; remote stays Unknown, and force grants no wider authority. (4) The command spelling ''aida session release-unknown <SPEC> --expect-claim <id|digest> --reason <text>'' is approved as operator-only (refuses agent/headless/grant use), with a retained audit receipt. (5) Ship as THREE PRs in order: A (binding + transition + generation-checked resume/handoff + exact release), B (positive-death takeover + receipts), C (release-unknown + diagnostics). Each PR names its slice and uses ''Refs BUG-2636''; only C carries the completing trailer. Reviewer behaviour is unchanged throughout. Back to Approved; slice A takes the next free main lane after open-PR reworks.'
