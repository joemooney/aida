title: 'Claim admission hardening deferred from BUG-2586: generation-checked resume, positive-death takeover, audited Unknown release'
description: |
  Follow-up to BUG-2586, whose admission slice landed in #4117 (925c815, a partial slice by design). The squash body lists what it left as later work:

  - exact lease/worker generation binding for resume and handoff (generation-checked resume and handoff)
  - positive-death takeover of a bound implementer claim
  - audited release of an Unknown claim
  - refresh / local-only (offline) launch policy for shared claims

  The full design is in the BUG-2586 sketch and the advisor signoff of 2026-11-15 14:14 MST on BUG-2586.

  Separately, a known failure (also on origin/main db03d9d714) belongs with the mail-retention work, not here: pr_lease_takeover prc_safe_end_retires_dead_pushed_seat_without_force and queue_work_reclaims_dead_clean_lane_without_an_origin_branch fail with a mail-retention writer-admission refusal.

  ## Acceptance
  1. A resumed or handed-off implementer claim is accepted only when its lease id and generation match the claim; a stale generation is refused with a named reason.
  2. A bound claim whose holder is positively dead (lease expired and process gone on its host) can be taken over without --force-claim, and the takeover is recorded.
  3. Releasing an Unknown-liveness claim is an explicit, audited act (actor, reason, prior holder recorded).
  4. Tests cover each of 1-3.
