  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2490):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 4e6248977f5b
    Recorded: 2026-11-08T10:02:45.935649109+00:00
    Findings:
    1. [major][scope][advisor-action] Operator scope on BUG-2490 (comment 2026-11-08T03:05Z) is narrowed but still neither finished nor split. Done at this head: 'aida db sync --pull' uses pull_rebase_auto_merge (git_backend_cmd.rs:1362) and queue pickup stops on a failed pull (queue_cmd.rs:12509). Open: (a) maybe_sync_pull still uses plain pull_rebase (store_sync.rs:1719), so a same-spec two-node conflict still fails on --sync and burndown; (b) maybe_sync_pull prints 'Falling back to local view' (store_sync.rs:1768) and burndown ignores the result (burndown_run.rs:367, 748) and goes on to compute and drain on the stale view, the dell1 failure mode; (c) resolve_spec_conflict bails on delete/modify (git_ops.rs:2618), which the dell1 stopgap handles by keeping upstream, and that case now makes pickup exit; so the stopgap cannot be removed yet. Reading of the policy dispute: the operator's comment asks for a semantic merge so concurrent edits do not conflict, and describes upstream-scalars as what the hand fix did, so the existing LWW resolver appears to satisfy it, but that is the advisor's call. Action: the advisor records that ruling on BUG-2490 and either requires (a)-(c) here or files a linked follow-up for them, then re-requests review. Another implementer round cannot clear this alone.
    2. [minor][correctness] The fatal pre-pickup pull at queue_cmd.rs:12509 now runs before the delegation and keyring preflights at queue_cmd.rs:12532-12590 (BUG-1808, BUG-2428), which exist so that a refused launch leaves nothing behind. 'aida db sync --pull' commits all pending store edits ('chore: sync pending changes', git_backend_cmd.rs:1329-1332) and rebases, so a seat without delegation now mutates the store before being refused, and when offline it sees a pull error instead of the delegation refusal. Move the pull after those read-only preflights and before the first write (retire_idle_review_worktree, standalone slot, queue row), keeping bug_2490_failed_pull_stops_pickup_before_session_and_spec_writes green.
    3. [minor][ux] db_sync_local_window discards StorePullOutcome::AutoMerged notes (git_backend_cmd.rs:1362 matches only Err), while 'aida pull' prints each one (store_push_pull.rs:2491-2495). A resolver run that picks one side's scalars by LWW during pickup is therefore silent. Print the notes as store_push_pull.rs does.
    4. [minor][perf] Carried, non-blocking: a full 'aida doctor' run parses every store object twice, in the tolerant Storage::load and again in scan_store_objects (doctor_cmd.rs:835). Take the bad-object list from the loader if practical.
