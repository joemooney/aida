  author: joe
  content: 'Same root cause seen on dell1 2026-11-07 20:01: dell1''s store had 8 unpushed commits (lane comments/status on STORY-2642, TASK-3048, TASK-3428, STORY-2571, FAQ-151) and was 246 behind; every ''aida db sync --pull'' failed with ''could not apply eccd89bb1d'' (status/modified_at/history hunks), and lanes printed ''proceeding with local view'', so dell1 lanes worked from a stale store for ~2.5h and their store writes never reached origin. The advisor resolved it by hand with a semantic 3-way merge of each conflicted object (scalars: upstream; comments/history: union by id, sorted by timestamp; script at dell1:~/store-resolve.py), then pushed. Fix scope for this bug should include: a semantic merge for store objects (git merge driver or in-process merge on pull) so concurrent edits to one spec from two nodes never conflict, and a pull failure must stop store writes instead of proceeding on a local view.'
