- id: 01a1b95e-e1e6-7491-979a-988abc81ccd3
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2490):
    Verdict: CHANGES REQUESTED
    Reviewed commit: c284061569e0
    Recorded: 2026-11-08T03:21:49.682951599+00:00
    Findings:
    1. [major][perf] aida-core/src/git_ops.rs:1551 commit_with_lock_recovery now runs validate_store_objects on every store commit, which reads and serde_yaml-parses EVERY object in the worktree (7365 objects / 52 MB in the live store). That puts a full-store scan back on every targeted write (git_backend auto_commit_paths -> git_ops::commit), which TASK-1626 deliberately removed (see git_backend.rs comment near line 968). commit_pending_store_changes_on_host (git_ops.rs:2418) runs it twice (directly, then again inside commit). Side effect: one unrelated corrupt or untracked object anywhere in the tree blocks every targeted write. Fix: validate only the paths being committed, i.e. the staged blobs (validate_store_index already does this), the worktree copies of explicit commit_paths pathspecs, and dirty/untracked object paths from git status --porcelain -z for the add_all/pending path. Keep the full scan for doctor only.
    2. [major][acceptance-4] aida-cli-lib/src/doctor_cmd.rs:793 calls validate_store_objects(&store_path)? before Storage::load, so a single markered object makes the whole doctor run (every category, --fix heals, the post-ship quiet GC run) fail with an error instead of flagging it. Before this change the tolerant loader warned and doctor continued. Acceptance (4) says doctor *flags* a markered object. Emit it as a doctor finding (category, file path, remediation) and continue, or at least keep the other categories running. No test covers acceptance (4): add one that plants a conflict-markered object and asserts doctor reports it with the file name.
    3. [major][scope] Operator comment on BUG-2490 (2026-11-08T03:05Z) adds required scope that this PR does not touch: (a) a semantic merge for store objects (git merge driver or in-process merge on pull: scalars from upstream, comments/history unioned by id) so concurrent edits to one spec from two nodes do not conflict; (b) a failed store pull must stop store writes instead of printing 'proceeding with local view'. Either implement both, or have the advisor split them into a linked follow-up spec and record that on BUG-2490 before this ships as the full fix.
    4. [minor][perf] aida-core/src/git_ops.rs validate_store_index spawns one git show :<path> per staged object. A bulk commit (migration, agreed-id assignment over thousands of objects) forks thousands of git processes. Read all staged blobs in one git cat-file --batch call (or ls-files -s plus cat-file --batch) instead.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
