spec_id: BUG-0445
title: Shell wrapper hides init prompts and forces piped output
description: |-
  The generated `aida()` shell wrapper captures stdout for `aida init` so it can consume the marker-delimited `init-cd` payload. Because the child sees stdout as a pipe, it auto-selects TOON output; when human output is explicitly pinned, prompts and progress are buffered invisibly in `_aida_out`, leaving the command apparently hung while it waits on terminal stdin.

  ## Acceptance
  - An interactive wrapped `aida init` preserves interactive human rendering unless the caller explicitly selects another format/agent mode.
  - Init prompts and progress are visible while the command is running; the wrapper must not deadlock on an invisible prompt.
  - Successful `init <DIR>` still consumes the marker-delimited `cd` payload and changes the calling shell directory.
  - Explicit `--format` / `AIDA_OUTPUT_FORMAT` / `AIDA_AGENT_OUTPUT` choices remain authoritative.
  - Piped or captured wrapper output retains non-interactive format selection.
  - Real-shell regression coverage exercises Bash and Zsh where available.
