title: Containment tests inherit the live sibling-worktree main and refuse hermetic fixtures
description: 'Observed while validating TASK-2631 in /home/joe/ai/aida-worktrees/aida-seat-aida-task-2631: cargo test -p aida-cli-lib --lib contain completed 220 passes and 27 failures. Two refusal-message expectations were implementation regressions and are being fixed in TASK-2631. Most other failures arise in unchanged containment-boundary code: ambient Claude argv builders reject the real linked worktree as an unrecorded seat clone, and some fixture roots incorrectly resolve the live main /home/joe/ai/aida, including a store-write-lock attempt there. Example: tool_contained_flags_for_claude_keep_interactive_prompts fails before assertion with a .git identity refusal; bug_2169 fixture session_start tries the real shared store lock. Investigate process-global host-main discovery/test isolation; tests should use only hermetic fixture roots and never discover or write the operator live store. Separate sandbox restriction: oracle containment test creates /var/tmp and gets ReadOnlyFilesystem. No production containment weakening or test assertion changes are proposed in TASK-2631.'
