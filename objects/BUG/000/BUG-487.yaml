title: 'Commit hook nags a hand-coding novice to add [AI:tool] for a plain trace: comment (no ai: marker)'
description: 'Round 4 surfaced this: a novice building BY HAND added ''# trace:TASK-1'' (no ''| ai:'' marker) and committed — the commit hook warned ''Commit includes AI-traced files - consider adding [AI:tool] tag''. But no AI was involved. The [AI:tool] nag should fire only when a trace carries an actual ''ai:'' marker (AI authorship); a plain human ''trace:'' should not. Confusing for a solo hand-coder. Fix the hook''s detection to key on the ''ai:'' marker, not the bare ''trace:'' presence. Round-5 target.'
