  content: 'Codex root cause/fix: the repro target TASK-1135 is deferred, but `queue add` allowed parked specs while the default queue projection/enrichment excludes deferred/archived requirements. That created a real registry row that `queue list --json` and burndown views immediately dropped. Commit 1f579d908 adds a `queue add` guard that refuses deferred/archived specs with an undefer/unarchive hint, so the CLI no longer prints success for work that cannot appear in the next default queue read.'
