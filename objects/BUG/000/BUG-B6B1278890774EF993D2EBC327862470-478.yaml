    ## Implementer self-review
    Reviewed HEAD: 6be38166be85fb474a3c5ba8036c4b2eb853db5f (main and origin/main), including native working diff and untracked inventory. On unchanged production code, python3 -m unittest tests.test_store_mutation.ContainedHostPreflightTests failed only for hangup: AssertionError: entered receive on a hung-up listener.
