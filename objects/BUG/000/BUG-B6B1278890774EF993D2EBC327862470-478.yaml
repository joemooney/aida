    AC2: [evidence: behavioral-test] tests/test_store_mutation.py:773 exercises an open readable listener, notification reply and successful exec release.
    AC3: [evidence: behavioral-test] tests/test_store_mutation.py:782 checks the runtime refusal names the hangup. Both targeted preflight and shutdown tests passed (1.980 s).
    Deep pass: both loops use the same poll helper. No serialized format or authority grant changed. A ready shim receipt concurrent with listener hangup is covered, as is ordinary notification readiness. The guard runs before any broker receive or receipt handling at contained_host.py:733. Existing tests remain intact. The fixture uses kernel socket readiness with a synthetic receive and omits privileged setup. It covers hangup already observable at dispatch.
