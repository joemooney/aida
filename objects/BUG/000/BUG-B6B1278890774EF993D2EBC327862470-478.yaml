- id: 01a2068e-6e4c-7fa2-9fce-89cda45fdf69
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2717):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 557a8da6d331
    Recorded: 2026-11-22T23:42:36.725947020+00:00
    Findings:
    1. [unmet-claimed-ac, severity p1] BUG-2717.AC1, contained_host.py:733. The zero-time poll and the blocking seccomp RECV ioctl in broker_connect_contained are separate operations. If the last filtered task exits after the poll sees its pending notification and before RECV dequeues it, the notification can disappear and RECV can sleep with no future sender. The outer deadline cannot interrupt it. Bound or cancel the receive itself and exercise this ordering under the watchdog, checking that the shim receives no exec release.
    2. [unmet-claimed-ac, severity p2] BUG-2717.AC3, contained_host.py:725. When the filtered tasks and bwrap have already exited by the next iteration, process.poll() observes the exit before the listener check runs. The resulting diagnostic is 'contained requested-seat preflight did not complete' even though the listener is reporting HUP. Preserve the hangup diagnostic on this exit path and add a case with both wrapper exit and listener hangup observable. The current fixture fixes process.poll() at None.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-23T03:58:47.372614934Z
  modified_at: 2026-11-23T03:58:47.372614934Z
- id: 01a2068e-b23a-7e50-935e-9d73ef636330
  author: joe
  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 20:58):
    # BUG-2717 / PR #4398 r2 (advisor-122 ruling 2026-11-22 21:02 MST; relayed by product-15). Lane: CODEX. Containment, so ADR-76 strict. SMALL (<=300 lines).

    CR at 557a8da6 (r1, +79 lines, 2 files). Fix both findings. The reviewer scope is these two plus the diff.
    1. contained_host.py:733: the zero-time poll and the blocking seccomp RECV ioctl RACE, so a hangup between them strands preflight. Make the receive itself bounded: poll(POLLIN|POLLHUP|POLLERR) WITH a timeout on the listener fd immediately before EVERY recv, OR a non-blocking recv with ENOENT/EAGAIN handling, so no blocking ioctl ever runs without a fresh readiness check. Add a test that closes the last filtered task BETWEEN poll and recv (a stub listener is fine).
    2. contained_host.py:725: if bwrap and the tasks have already exited, report the LISTENER HANGUP cause, not the generic "requested-…" diagnostic. Check the listener before process.poll() decides the message.
    Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
    One targeted pytest run, then `make check-ci-fast`, then push on the existing branch. COMMIT your work.
