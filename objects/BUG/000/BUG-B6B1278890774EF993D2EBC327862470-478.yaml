title: Containment preflight blocks forever on a seccomp receive after the listener hangs up
description: |
  The containment launch preflight (contained_host.py, the preflight loop around line 721) can block indefinitely on a seccomp-notify receive after the listener has hung up, hanging the launch. A `_hung_up()` helper exists but the preflight loop doesn't consult it. Source: the operator's work-side AIDA CI branch fixed this on 2026-11 (report reviewed by product-15, 2026-11-22). That branch is not reachable from this clone, so reproduce on main first; if main already behaves correctly, close with evidence.

  ## Acceptance
  - AC1: When the preflight listener has hung up, preflight refuses within 10 s and the model process never starts. A test asserts the bound.
  - AC2: An open listener still completes preflight normally (positive control).
  - AC3: The refusal names the hangup as the reason.
