title: queue work reports 'no-new-published-head' after the implementer pushed and opened a PR
description: 'Twice on 2026-11-12, ''aida queue work TASK-3448 --no-human --vendor codex --branch task-3448-helpers[-b]'' ended with ''implementer: failed-after-start ... reason=no-new-published-head pr=unknown'' and an error that the implementer exited without publishing a new head. In both cases the lane HAD pushed and opened a PR (#3878 at 06:43 MST, #3881 around 08:05 MST). fast_gate was skipped(timeout) both times. The false failure caused an advisor relaunch that was then refused (spec InProgress with no lease) and leaves the spec in a stale InProgress state. Expected: the result line detects the pushed head and PR on the lane''s branch.'
