spec_id: BUG-1-017
title: Commit hooks reject node-aware spec IDs and run legacy SQLite migration
description: |-
  Two scaffolding-hook bugs surfaced while committing BUG-1-014 and TASK-1-015:

  1. The REQ-ID regex '\\([A-Z]+-[0-9]+\\)' in three hook templates (aida-validate-commit.sh, aida-track-commits.sh, aida-commit-msg) and the duplicate string-literal copies in aida-core/src/scaffolding/hooks.rs only matches legacy flat IDs like (BUG-014). Node-aware IDs from git-canonical mode (BUG-1-014, EPIC-1-001) silently fail the match, producing 'feat/fix commits should include requirement ID' warnings on perfectly valid commits.

  2. A legacy .git/hooks/pre-commit (predates the git-canonical migration) calls 'aida db migrate --from sqlite --to yaml --output requirements.yaml --force', which the git backend rejects with 'Command not yet supported for git backend'. The hook is local-only cruft, not part of the current scaffolding template.

  Fix:
  - Updated regex in all 4 hook templates and 3 string-literal copies in scaffolding/hooks.rs to '\\([A-Z]+(-[0-9]+){1,2}\\)' which matches both legacy and node-aware IDs.
  - Disabled the legacy pre-commit hook locally (renamed to .git/hooks/pre-commit.disabled). Not committed; reversible.

  Note: scaffolding/hooks.rs duplicates content that already lives in aida-core/templates/hooks/. The dual-copy is itself a code smell worth a separate task — flagged but not addressed here.
