  content: |-
    ## Implementer self-review
    Reviewed HEAD: 38a73dd1a2 (git diff origin/main...HEAD: ci.yml, scripts/ci-live-test-watchdog.py, tests/test_ci_live_test_watchdog.py, scripts/store-writers.toml).

    Acceptance evidence:
    - AC1 [configuration]: `timeout-minutes: 15` on the step (.github/workflows/ci.yml, the "Live bwrap OS-wrap confinement gate" step); WorkflowStepTest asserts it.
    - AC2 [behavioral]: the watchdog runs each listed test in its own process group with a 120s timeout; test_hanging_test_is_killed_and_named_within_its_timeout proves a sleeping-forever test is killed (grandchild too) and named `::error::test mod::hangs_forever exceeded its 2s timeout; killed`.
    - AC3 [behavioral]: same test asserts the running-tests list, the stalled test's own output tail and the live log tail print before the final summary; the overall-deadline test covers a stall of the whole selection.
    - AC4 [behavioral]: fixture test above, finishing in <15s. Also checked against a real rustc --test libtest binary: ok / failed / ignored handled, SKIP output kept in the log.

    Probe findings: (1) result lines keep libtest --logfile `ok <name>` form, so the downstream `^ok ` counts and the SKIP grep are unchanged; (3) zero-match selection fails (test_zero_match_filter_fails), ignored tests are excluded the way cargo test excludes them; (5) fail-closed: build/list errors raise, a run with exit 0 but no `test result: ok. 1 passed;` counts as failed, AIDA_REQUIRE_BWRAP_LIVE untouched and no checks removed.
    Fixes during review: ExecContext env ratchet (fixture used os.environ; now a path) and store-writer inventory rows.
    Residual risks: process-per-test replaces one libtest process (the in-process locks in these files guard env vars only, and nextest lanes already run them per-process); a sandbox child that calls setsid escapes killpg (bwrap --die-with-parent normally covers it); diff is ~310 lines vs the 200-line brief budget. Gate: make check-ci-fast exit 0 at 38a73dd; python3 -m unittest tests/test_ci_live_test_watchdog.py 5/5 OK. No cargo test run: no Rust changed.
