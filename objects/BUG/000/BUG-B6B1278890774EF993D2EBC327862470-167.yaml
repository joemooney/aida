- id: 01a19a1c-e958-7b93-8d1e-8b6f771046c0
  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (1):** every listed site resolves containment through `session::drain_contained(project_root)?` instead of literal `false` / `aida_contained_env()?`: `spawn_analysis_headless` (shared by questions research, dryrun --ai, intent), questions remedy + clarify, advisor_watch fork/cold-boot, reconstitute run_headless, burndown run, autopilot intake, compete preflight/arm/judge/dry-run, `session resume`. A source ratchet asserts no listed module keeps the ambient-only form.
    - **Unit (2):** with `AIDA_CONTAINED` unset and `[agents] contained = true` in the project agents.toml: advisor-watch cold boot and remedy/analysis spawns hand the fake vendor `AIDA_CONTAINED=1` + contained flags (Claude) and refuse Codex before spawn; burndown/intake dry-run refuse Codex and preview contained Claude; compete preflight refuses codex arms/judge, arm/judge command carries AIDA_CONTAINED=1; `session resume` of a codex target refuses. Plus explicit-parent (`AIDA_CONTAINED=1`) and malformed-config refusal cases.

    ### Expected files
    - `aida-cli-lib/src/{session,advisor_watch,questions,plan_intent,reconstitute,burndown_run,autopilot_intake,compete_cmd}.rs`
    - `aida-cli-lib/src/tests/agent_launcher_tests.rs` (compete arm signature) + a new `tests/bug_2393_*` test module

    ### Ambiguities / conflicts as questions
    - `lib_part2.rs`, `agent_launch.rs`, `queue_cmd.rs` also read `aida_contained_env()` only; they are outside the filed inventory, so I leave them and file a follow-up finding rather than widen scope.
