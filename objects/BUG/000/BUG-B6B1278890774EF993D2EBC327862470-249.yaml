  content: 'Implemented npm/nvm wrapper discovery without executing JS: resolve known nested/hoisted platform packages or bundled vendor layout, SHA-check the native ChatGPT executable, and reuse that exact resolved path for lane argv. API-key lanes share native discovery. Doctor vendor-binary diagnostics name the resolved path and pin result in human/JSON/TOON output. Fake npm fixtures cover resolution, changed/unpinned/non-executable/missing binaries, no host execution, and production preparation argv. Validation: BUG-2484 tests 2 passed; codex_auth_tests 12 passed, 1 watchdog child ignored in parent (child exercised separately); vendor literal ratchet 3 passed; cargo fmt --all -- --check and git diff --check passed. Installed-Codex exact live probe was opt-in skipped; no real ChatGPT conformance credit claimed. Native-seat handoff: six files edited, left uncommitted for host publication; spec remains In Progress. No implementation blockers.'
