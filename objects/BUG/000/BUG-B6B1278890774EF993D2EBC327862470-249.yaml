title: 'Contained Codex refuses the npm/nvm codex.js wrapper: resolve it to the pinned native vendor binary'
description: 'STORY-2593 pins the native codex binary by SHA-256 (codex-cli 0.166.0, b8a11fed...). With a standard npm/nvm install, the first codex on PATH is the JS wrapper (~/.nvm/.../bin/codex -> @openai/codex/bin/codex.js), so the launch refuses (''contained ChatGPT auth refused: re-probe this codex binary ... put the probed native codex binary first on PATH''). The wrapper''s own native binary, @openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex, matches the pin. Repro 2026-11-07: the operator ran conformance --vendor codex --boundary aida, report ~/.aida/conformance-codex-aida-1794069161. Acceptance: when the PATH codex is the npm wrapper, the launcher resolves it to the package''s vendored native binary, verifies the SHA pin against that, and executes it directly; an unpinned binary still refuses; aida doctor names the resolved binary; a test uses a fake wrapper layout.'
