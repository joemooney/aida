title: CLI 'aida edit' advisor gate misses NeedsAttention→Approved (only Draft source is gated)
description: 'Found by quality-sweep reviewer. The TASK-647 edit gate (main.rs:10343) is ''if matches!(req.status, Draft) && status_requires_advisor_authority(new) && !has_advisor_authority()'' — keyed on Draft as the ONLY gated source. forbidden_attention_transition (models.rs:224) explicitly allows NeedsAttention→Approved. So a non-advisor headless agent that punted a spec to NeedsAttention can self-flip it back to Approved without advisor authority, defeating the advisor-triage the punt was meant to invoke. Fix: gate any source whose transition to an approved+ status requires authority (NeedsAttention as well as Draft).'
