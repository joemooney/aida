title: 'pr train: member gate carries an approval across a clean main merge, then the merge-time check rejects the same head, so a green train merges nothing'
description: '2026-11-13 train 9 (#3974 = #3966 + #3971). At gating, the train logged ''approval carried over: PR-3966 approved at 2eb10a739b38 covers head f0ed9707062f, 1 clean merge of origin/main, patch-id unchanged (0c245b6f3356)'' (STORY-2694). Train CI went green after ~40 min. The merge step then refused: ''PR-3966''s recorded review verdicts do not approve its current head f0ed9707062f; a head move alone does not lift a recorded refusal, and an approval at an older commit is not evidence this head was reviewed''. Both members ejected: 0 landed. PR-3966''s ledger has CHANGES REQUESTED at bb40b8b, then APPROVED at 2eb10a7, then a clean update to f0ed970. Likely cause: the merge-time verdict check doesn''t use the STORY-2694 carry-over proof the member gate uses, or it reads the older refusal. Same family as the earlier pr ship rc=20/23 mismatch. Cost: one 40-min train CI run plus #3971''s landing. Acceptance: the gate and the merge step make one shared decision; a test where carry-over admits a member and the train merges it.'
