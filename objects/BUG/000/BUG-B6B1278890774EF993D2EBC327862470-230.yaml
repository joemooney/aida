title: Standalone implementer reports no-pr reason=unpushed-commits for a clean seat that only fast-forwarded to newer main
description: 'Observed 3 times on 2026-11-06 (TASK-3222 at 06:50 and 07:46, BUG-2463 at 08:09): the lane punted with no edits and no commits of its own, yet the result line said ''implementer: no-pr reason=unpushed-commits'' and the error said it was ''leaving commits it did not push''. Each time the advisor inspected the seat and found it clean, with no commits outside origin. Cause: headless_background.rs Snapshot::unshipped() treats any HEAD != launch_head (with origin not at HEAD) as UnpushedCommits, so a seat whose HEAD advanced only by fast-forwarding to a newer origin/main matches. Fix: UnpushedCommits only when HEAD has commits reachable from no remote ref (git rev-list HEAD --not --remotes is non-empty). Otherwise report the punt and its reason (or no-pr reason=no-changes). Regression test: a seat fast-forwarded to a newer origin/main with a clean tree reports no unpushed commits. trace site: aida-cli-lib/src/headless_background.rs:522-533; standalone_implementer.rs:270.'
