  content: |
    Round 1 rework addresses all three binding advisor findings at 40835c4.
    - Capped supervisors resume a validated retained controller grant after confirmed controller exit, instead of stopping unrelated PR admission or minting unbounded ancestry. Existing reviewer grants and keys remain protected.
    - Pruning and lost-dispatcher recovery require process-group exit proof; live/unknown group descendants retain reservations. Legacy terminal receipts without group evidence keep their existing pruning behavior.
    - Push attempts persist the ten-minute backoff before calling transport; a failed push does not skip advisor mailbox delivery.
    Named regressions: bug2640_ac230781_retired_cap_reuses_authority_and_admits_unrelated_change; bug2640_prune_requires_process_group_exit_proof; bug2640_failed_push_persists_backoff_and_delivers_mailbox_notice.
