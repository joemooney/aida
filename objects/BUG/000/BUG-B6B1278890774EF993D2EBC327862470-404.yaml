  author: joe
  content: 'Advisor-117 18:30, second defect in the same service: the review-watch worker (aida advisor loops worker, pid 698992) never reaped its finished reviewer children. Four <defunct> aida children (the #4184, #4183, #4137 and #4135 dispatchers) sat under it, and no new reviewer was admitted for ~70 min with 8 PRs waiting. A SIGTERM let the supervisor respawn the worker (pid 998538), which admitted #4182 and #4183 within ~5 min. Add AC: the worker reaps (waitpid) every child, and a zombie never counts as a live reviewer or holds capacity. Also noted: the pass reports ''global reviewer capacity (2)'' although [review_watch] max_concurrent = 4, and the CR notice says ''round 2 of 2'' although the operator set the cap at 4 on 2026-11-15. Both need reconciling to the configured values.'
