title: zen help promises "fire several in parallel" but the global drain.lock refuses concurrent solo drives
description: |-
  aida zen --help says "fire several for INDEPENDENT specs in parallel and walk away", but every drain acquires a GLOBAL per-repo lock (aida-cli/src/drain_lock.rs, BUG-538): a second aida zen --solo while another drive is live fails with "a drain is already running (pid ...)". The help text sets an expectation the substrate refuses. Observed 2026-06-30: STORY-744 drive held the lock; STORY-698 and TASK-841 solo drives both silently failed to start.

  ## Acceptance
  - THE aida zen help text SHALL NOT claim independent drives can run in parallel within one repo while the global drain lock serializes them.
  - THE aida zen help text SHALL state that drives are serialized per repo and SHALL point to the burndown fan-out as the mechanism for running multiple specs concurrently.
  - WHEN a drive is refused because another drain holds the lock, THE error message SHALL name the burndown fan-out (one orchestrator, worktree-isolated subagents) as the supported way to drive multiple specs at once.
