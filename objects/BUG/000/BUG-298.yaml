id: 019e4e41-c245-7563-a0c7-8d07c9687a0e
spec_id: BUG-298
agreed_id: BUG-298
title: 'aida scaffold apply: prune obsolete ''aida-'' prefixed skills/hooks/commands from previous AIDA versions'
description: |-
  ## Problem

  \`aida scaffold apply\` (and \`aida init\`) writes the current AIDA version's templates into \`.claude/skills/\`, \`.claude/commands/\`, \`.claude/hooks/\`, etc. When a template was scaffolded by a previous AIDA version but the current version no longer ships it (renamed, consolidated, retired), the old file is **left in the project**.

  Symptom from a user-initialized project: \`.claude/skills/aida-foo.md\` exists locally, was scaffolded by aida v0.6, no longer ships in the current templates. The file sits there forever, possibly confusing implementers or users who try to invoke obsolete skills.

  ## Approach

  \`aida scaffold apply\` (and \`aida init\` when re-run) should track AIDA's owned files via a manifest (or by the \`aida-\` prefix convention) and prune obsolete entries:

  1. Build a set of expected files: all current AIDA templates that ship in the binary.
  2. Walk \`.claude/skills/\`, \`.claude/commands/\`, \`.claude/hooks/\` for files matching the \`aida-\` prefix convention (the agreed naming).
  3. Any local \`aida-*\` file that does NOT have a matching template in the current binary is OBE — list it, ask before removing (or remove unconditionally if \`--prune\` flag is passed).

  ## Acceptance

  - \`aida scaffold apply\` reports any \`aida-\` prefixed files in \`.claude/skills|commands|hooks\` that don't correspond to a current template.
  - Default behavior: list the OBE files and recommend \`aida scaffold apply --prune\` to remove them. NOT auto-removed without explicit opt-in.
  - \`--prune\` flag removes them (with one-line per-file confirmation unless \`--yes\`).
  - A user-created file with non-\`aida-\` prefix (e.g., \`my-skill.md\`) is NEVER touched — only AIDA-owned files (which are recognizable by prefix or, ideally, by a manifest \`.aida/scaffold-manifest.toml\` tracking what AIDA wrote).
  - The CLAUDE.md template architecture section mentions per-file symlinks for the in-repo dogfood case; this BUG's pruning only applies to non-symlinked copies (i.e., end-user projects, not AIDA itself).

  ## Composes with

  - The scaffolding-pack discipline (\`feedback_propagate_generic_discipline_via_scaffolding\`) — pack files SHOULD be safe to prune-and-rewrite; user-modified scaffolding-pack files can use the body-checksum mechanism from \`aida init --with-memories --refresh\`.
  - TASK-359-era skill template work — when skills are renamed/retired, this BUG ensures users on older versions get clean upgrades.

  ## Origin

  User question 2026-05-22 after creating a new project: *"does aida scaffold apply remove skills or hooks that are prefixed with 'aida-' that are old/obsolete and should it?"* Today: no, it doesn't. Worth fixing — onboarding gap.
