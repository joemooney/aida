title: A request-changes verdict shelves a spec that is already Completed or whose PR is merged (BUG-2728 root cause; leases::shelve_spec_on_failure)
description: |
  Root cause of BUG-2728's silent Done -> NeedsAttention flip (found by the BUG-2736 lane 2026-11-23; advisor-122 ruling 18:08; filed by product-15). A request-changes verdict runs review_commands.rs -> leases::shelve_spec_on_failure -> shelve_status_flip (aida-cli-lib/src/leases.rs), which shelves the spec EVEN WHEN it is already Completed or its PR is merged/closed (event 930883d1, BUG-2728 at 21:15Z). A stale CR reopened a landed spec. STRICT (leases.rs).

  ## Acceptance
  - AC1: A CR verdict on a spec that is already COMPLETED, or whose PR is MERGED or CLOSED, does NOT flip its status. The verdict is still recorded in the gate ledger and a spec comment names the writer and the verdict. Test: a CR on a Completed spec leaves it Completed, with a ledger entry plus a comment.
  - AC2: A live In Progress spec still shelves exactly as today. Test.
