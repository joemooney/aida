  content: |-
    ## Implementer self-review
    Reviewed HEAD: f970be07c5 (git diff origin/main...HEAD, 5 files, +253/-6)

    Acceptance evidence:
    - AC1 [behavioral-test]: tests/bug_2738_landed_refusal_tests.rs — request_changes_on_completed_spec_records_comment_without_shelving (Completed stays Completed, no failure_reason, comment authored by and naming the writer + 'CHANGES REQUESTED'); request_changes_on_done_spec_with_merged_pr_is_not_shelved (BUG-2728 shape: Done + MERGED stays Done); landed_refusal_covers_completed_and_merged_or_closed_prs_only (CLOSED too, case/whitespace tolerant). Gate-ledger entry: the verdict file and phase-3 handshake are written earlier in handle_review_record_context_with_policy_at, before any hold or spec side effect (review_commands.rs, 'Both verdict artifacts are durable before hold or spec-state side effects'); the guard sits after that, so the ledger record is unchanged. No command-level test drives the full aida review record path.
    - AC2 [behavioral-test]: request_changes_on_live_in_progress_spec_still_shelves: In Progress + OPEN PR is not landed and leaves no comment; shelve_spec_on_failure then flips it to NeedsAttention with the existing shelve comment.
    - Targeted run: cargo test -p aida-cli-lib --lib bug_2738 gives 4 passed; condition_cmd (STORY-2402 merged-probe adapter, refactored to share the state read) gives 5 passed. make check-ci-fast exit 0.

    Probe findings:
    - P1 consistency: PR state compared uppercase after trim; the merged probe keeps its exact-match semantics.
    - P3 multiplicity: one spec and one PR per verdict; no loops.
    - P5 fail-open: if gh is missing or fails, or the state is unknown, the guard returns None and the shelve runs as before (conservative). The merge hold is still placed before the guard, so an OPEN PR stays protected whatever the guard decides.
    - Previously a CR on a Completed spec set failure_reason, appended to the punts ledger, and printed 'parked in Needs Attention' even though the status never moved. That false message is gone now.

    Fixes during self-review: removed a cfg(test) env read (ExecContext ratchet); shared one gh Command site in forge.rs (launch ratchet); regenerated scripts/store-writers.toml (it also re-sorted 3 pre-existing rows).

    Residual risks: only the aida review record path is guarded. The stranded sweep (review stranded --fix) and the orchestrator RealPhaseDriver::shelve_on_failure still shelve without a PR-state check; both act on live drains/holds. A merged PR is detected only when gh answers.
