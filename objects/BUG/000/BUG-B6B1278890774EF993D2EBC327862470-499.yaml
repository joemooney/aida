- id: 01a21881-6067-75a3-b67c-39da269c30ac
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2738):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 5a1122ae5b23
    Recorded: 2026-11-26T15:22:14.302314055+00:00
    Findings:
    1. AC1/AC2 test as specified is missing and the review-record wiring is untested (review_commands.rs:3609-3626). AC1 requires 'a CR on a Completed spec leaves it Completed, with a ledger entry plus a comment'; the new tests call leases::record_refusal_on_landed_spec directly and never assert a gate-ledger entry, and the AC2 test calls record_refusal_on_landed_spec then shelve_spec_on_failure by hand. Nothing drives handle_review_record_context_with_policy_at with a request-changes verdict on a Completed (or merged-PR) spec, so deleting the guard call or its early `return Ok(())` in review_commands.rs passes every test. Add a test through the existing review-record harness (e.g. the bug_013_review_record_sha_tests / bug_2517_review_change_tests drivers) asserting: verdict in the ledger, spec still Completed, no failure_reason, comment naming writer + verdict; and the In Progress/OPEN case still parks in NeedsAttention.
    2. Merged/closed detection is GitHub-only and degrades silently: review_commands.rs:3609 calls forge::github_pr_state (raw `gh pr view`) rather than the forge abstraction (forge::forge_for(root).change_metadata, used by the stranded sweep). On a GitLab-forge clone, or in a contained reviewer seat where gh/network is unavailable, pr_state is None and a Done spec whose PR already merged is still shelved to NeedsAttention -- exactly the BUG-2728 shape. Fail-closed to today's behaviour, so not a regression; follow up by routing through forge_for and/or noting the degraded case in output.
    3. The new tests carry only a module-level `trace:BUG-2738`; they lack `trace:BUG-2738.AC1` / `trace:BUG-2738.AC2` markers (repo convention, e.g. task_1993_review_watch_tests.rs:5967), which is why `aida criteria` reports both criteria untraced.
    4. leases.rs record_refusal_on_landed_spec evaluates landed_refusal on the pre-read copy and does not recheck inside the update_spec_atomically closure, so under a concurrent status change the comment's 'status left <X>' can misstate the written status. Harmless to status (closure does not touch it, and the fallthrough shelve keeps the STORY-332 guard), but the check belongs inside the atomic read for consistency with shelve_spec_on_failure.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-26T15:37:41.735751793Z
  modified_at: 2026-11-26T15:37:41.735751793Z
