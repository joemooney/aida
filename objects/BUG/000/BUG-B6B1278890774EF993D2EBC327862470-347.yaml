title: aida-core git_ops bug034 tests flake on dell1, and ~21 git_ops/node-registry tests fail under umask 0002
description: |
  Reported by the integration seat 2026-11-14 07:13 MST. On dell1 at plain integration (tree of aefac4a5428), aida-core git_ops::commit_failure bug034 tests fail intermittently: 3 of 5 runs failed, a different test each time (permission_denied_lock_is_not_retried, other_failures_are_not_retried, lock_contention_retries_are_bounded). Separately, under dell1's default umask 0002 about 21 git_ops merge-gate and node-registry tests fail; they pass under umask 022.

  Acceptance criteria:
  1. The bug034 group passes 20 of 20 consecutive runs on dell1 (cargo test --profile agent -p aida-core git_ops::commit_failure), with the cause of the flake named (timing, shared temp path, or lock-file race).
  2. The umask-sensitive tests either pin umask in their fixture or assert mode-independent facts; they pass under umask 0002 and 022.
