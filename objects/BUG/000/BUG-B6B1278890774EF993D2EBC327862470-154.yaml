- id: 01a1951b-1bd5-7840-9652-e978c30ab93b
  author: joe
  content: 'ADVISOR RULING on PR-3187 non-blocking findings (10-28 rule, ruled once): ACCEPTED. (1) The rework section fires only when a review-findings block exists: every red-CI rework round today had one, and advisor briefs cover the rest. (2) The prompt wiring has no direct test: the extraction and stubbed-gh path are tested, and the wiring is a single call site. (3) The gh calls have no timeout: gh fails fast on connection errors (today''s 20:13 GitHub outage returned ''error connecting'' at once, with no hang), and the call runs once per pickup. Shipping now: this fix ends the blind red-CI rounds.'
