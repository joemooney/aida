title: Contained lanes and reviewers cannot read CI failure logs, so red-CI rework rounds run blind
description: 'Observed 2026-10-31 on PR-3176, PR-3182 and PR-3185: reviewers report ''CI lib-0/cli-1 Run tests failed'' without the test names, and implementer lanes say ''someone with log access needs to run gh run view --log-failed'' (the contained sandbox blocks the log download). Rework rounds then guess, or the advisor fetches logs by hand. Expected: the rework pickup and the reviewer prompt include the failing test names and panic lines for the PR head''s failed CI jobs, fetched host-side by the launcher (gh run view --job <id> --log, filtered to FAILED/panicked lines, capped) and written into the lane''s brief file. Acceptance: (1) a lane picking up a PR with red CI gets a ''CI failures at <sha>'' section listing each failing test and its panic line; (2) a reviewer''s prompt gets the same; (3) test with a stubbed gh producing a failed job log; (4) when logs are unavailable (run in progress, expired), the section says so explicitly.'
