title: Headless conflict-rework lanes end with a resolved-but-uncommitted merge; the publisher reports 'empty-rework' and requeues, discarding the merge work
description: |
  Observed 2026-11-18 00:10-00:25 on dell1 (binary 485219c). Three headless Claude (claude-opus-5-5) conflict-rework lanes started on CONFLICTING PRs whose rework preparation staged a merge with origin/main (MERGE_HEAD present):
  - BUG-2629 (#4158) and STORY-2849 (#4139): each lane ran Bash merge inspection (git log MERGE_HEAD, git diff MERGE_HEAD, git show), then exited as 'implementer: empty-rework ... action=requeued', with no new head published.
  - BUG-2618 (#4137): the self-review comment says 'merge with origin/main 485219c300 staged in the working tree, not yet committed', and the lane punted (design-fork).

  By contrast, the BUG-2645 lane (#4204) resolved its conflicts, committed and shipped.

  So the lane can end its turn with a resolved-but-uncommitted merge, and the publisher sees no new head (empty rework); the work is lost unless the seat is salvaged.

  Acceptance: (1) after rework preparation stages a merge, the lane contract requires committing the merge resolution (or an explicit punt naming unresolved files) before the turn ends; (2) the publisher detects a staged-but-uncommitted merge in the seat and commits it (when no conflict markers remain) or reports it as retained work, never as an empty rework; (3) regression test for both.
