    Reviewed HEAD: 485219c300c2896e6822365148df2abf665f85f7. The merge-base diff against origin/main was empty. Reviewed the native seat's six-file HEAD diff and checked for untracked additions. CI evidence for the pending patch is unavailable before host publication.

    AC1: [evidence: behavioral-test] PASS. The host-staged prompt at aida-cli-lib/src/rework_direction.rs:254 requires self-publishing lanes to commit the existing merge before exit, preserves the host commit handoff for native seats, and requires a punt naming unresolved files and the blocker when necessary. Verified by bug_2679_host_conflict_contract_distinguishes_git_ownership and the real queue-preparation test.

    AC2: [evidence: behavioral-test] PASS. The launcher at aida-cli-lib/src/standalone_implementer.rs:1635 records retained work before either publication or empty-rework routing can proceed. bug_2679_retains_pending_merge_even_when_staged_resolution_matches_head exercises unresolved, staged, committed and vetoed states in a linked worktree. The staged index matches HEAD, and the test verifies both HEAD and MERGE_HEAD remain intact on retention.

    AC3: [evidence: behavioral-test] PASS. Launcher job j20261118T090021782-2-0 executed all three targeted tests successfully. rustfmt --check on the six files and git diff --check passed.

    Deep pass: Cross-reference review verified that prompt routing and the existing host commit handoff use the same Codex containment condition. The Git probe reads the pseudoref path, and the regression verifies an ordinary branch named MERGE_HEAD does not count. Checked no file, one pending merge tied to Git's worktree metadata, and a prompt with multiple conflict paths. Checked a seat path containing a space, a staged resolution identical to HEAD, and punt/hold priority. The new path is read-only, probes private clones through the existing sandbox, retains on probe failure, and grants no commit or push authority. No existing test was weakened. The live forge publication and private-clone retention branches were inspected rather than exercised end to end.
