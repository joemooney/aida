- id: 01a1e70e-5ceb-7c50-8719-6cd686599cf1
  author: joe
  content: 'Follow-up 2026-11-16 18:15 MST: once the mailbox was under budget, the advisor''s inbox read fully (9 messages) and cleared implementer-1062''s hello, but 4 hellos stay unacked: product-07, implementer-1063, product-08, implementer-1064#2. Addressing is NOT the difference. Every hello message (ids 23162ea5, 15089288, 70eb38fe, 42865487, and the cleared one dfce23a8) is in .aida/mailbox addressed to {kind: agent, agent: advisor}, not archived, and none has a file under .aida/mailbox/.read-receipts/*/. The .handshake/<handle>.json records all show ack_reported=false. So the inbox read shows and acks only some of the hellos for the same recipient. Hypothesis: the inbox view caps or filters the messages it marks seen (it showed 9), or acks are tracked in .git/aida/mail-lifecycle rather than the read receipts. Acceptance addition: every hello addressed to the advisor role is acked by one full inbox read, and doctor advisor-handshake agrees.'
