- id: 01a1e7c8-d015-7553-9b56-3239eb391a23
  author: dirtlab
  content: 'Investigation/sketch (native implementer): read_source in aida-core/src/mailbox_logical.rs charges every top-level JSON to one shared Budget and returns Err on exhaustion, discarding all messages accumulated for that source. AckPlan in mailbox_lifecycle/ack.rs intentionally refuses partial snapshots; existing regression story1843_b2c_partial_view_plans_nothing protects this invariant. archive_mailbox_older_than in mailbox_cmd.rs only writes archived=true markers, so neither archive nor gc shrinks scanned storage. Inbox code selects displayed rows before ACK, flushes stdout before committing, and calls advisor_handshake::ack_hellos only after a successful plan commit; preserve these delivery guarantees. Proposed implementation for review: (1) add lifecycle-locked compaction that preserves full archived payloads outside active discovery and retains compact authoritative disposition evidence across local/canonical replicas, preventing sync resurrection; preserve --archived audit lookup, and explicitly define multi-recipient eligibility and dead-handle grace rather than treating process absence as permission to discard unread mail; (2) separate bounded history discovery from recipient unread discovery with per-record completeness evidence, validating every replica/binding/receipt for displayed records before allowing ACK despite unrelated history exhaustion; retain fail-closed behavior for unknown conflicting replicas and corrupt receipts, plus per-file/entry/deadline safeguards; (3) name the actual compaction command in OverBudget output only once it exists; (4) regress over-32-MiB history plus unread read/ACK, sync non-resurrection, interrupted compaction, other-recipient unread preservation, and all advisor hellos with doctor agreement. Decision required: approve the record-scoped ACK completeness model and archive/replication retention policy before replacing the current global-completeness lifecycle contract. No source edits or tests performed. codegraph doctor reports missing; configured absolute client path is absent.'
