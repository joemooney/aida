- id: 01a1e7f6-1cc8-78f3-ae4e-36ae9e5dbd4d
  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: Required retention and over-budget ACK behavior changes the mailbox lifecycle contract: current ACKs explicitly refuse partial snapshots, while gc only writes archive flags. Safe reclamation needs a sync-stable archive/disposition policy and multi-recipient/dead-handle retention semantics. Repository Sketch-First Protocol requires sign-off for lifecycle changes; concrete implementation sketch and regression matrix recorded on BUG-2641.. No triage reason was given.'
