- id: 01a196be-e31e-7d73-a6a1-3d346cbae11c
  author: joe
  content: |
    SKETCH (awaiting advisor signoff) — BUG-2403
    Canonical: BUG-b6b1278890774ef993d2ebc327862470-176
    Author: codex-advisor-11, advisor companion. This is a proposal, not design approval, implementation approval, or permission to clear a hold.

    Scope and dependency

    Owner: a subsequent implementer owns the supported reader/writer correction; a different independent advisor signs this sketch, and a fresh independent reviewer gates implementation. Code MUST serialize after BUG-2398, including its review_verdict/approval consumer changes. No implementation, queue mutation, dispatch, merge, hold clearance, or manual ledger repair was performed for this sketch. Root checkout inspected at 471540a8c47, clean. Read AGENTS.md, two-seat protocol, rework-brief craft and recovery playbooks; BUG-2403 full/latest comments, BUG-2398 full/latest comments, STORY-2120 contract/rulings and BUG-2332.

    Read-only production diagnosis

    1. Literal alias partitions select obsolete evidence. gate/ledger/project.rs::spec_key uppercases text; changes_for_spec reads only that literal index; verdict_events filters e.spec == spec. newest_verdict_event simply pops that partition. gate/review_verdict.rs::read_recorded_verdict and choose_current inherit the partition. read_recorded_verdict_any is first-hit, not a comparison across proved identities. queue_cmd.rs::rework_findings_block_for_spec first tries display_id and returns immediately, before spec_id; its fallback uses verdict_mentions_spec substring matching and lexical path order. The queue rework handler around line 8480 then feeds that stale block into findings_recur_consecutively, creating false recurrence. This is selection failure, not evidence that the original findings recurred.

    Read-only inspection of .aida/gate-ledger/PR-3185.jsonl confirms #19 friendly STORY-2204 at f3132074, then #20 normal native ...-164 at e0b7d028 with release_grant, #21 handshake without it. PR-3194 confirms #7 friendly STORY-2220 at 1a9bb9a, #12 normal native ...-262 at 6b1fd1a and #13 handshake at that new head. BUG-2403 reports obsolete portability/cap findings imported instead of the current empty-local-YAML blocker. No rework command was run here.

    2. Duplicate handshake loses release receipt. lib_part5.rs::handle_review_record_at constructs the normal object, calls gate/rework_hold_release.rs::stamp_record_grant, inserts recorder_attestation, and writes it. Later the --pr block rebuilds a second object via gate/review_verdict.rs::build_verdict_object. That builder intentionally removes release_grant for a new act of review; the handshake block restores attestation/time and adds mode=orchestrator-phase-3, but never restores the normal release receipt. write_verdict_object_for_spec appends that as a later verdict for the same spec/change. project::newest_verdict_event chooses it. Production #22 normal friendly approval at e0b7d028 has the receipt, #23 duplicate handshake does not. rework_hold_release::auto_release_with requires release_grant before eligible; its refusal is correct. Merely synchronizing aliases therefore cannot fix this second defect. The first immediate auto_release attempt occurs before the handshake write; a subsequent attempt sees the receipt-less projection.

    Contract and BUG-2398 boundary

    STORY-2120 AC2: change is the primary key, spec is only an index; spec-of-PR and PR recording are the same record. AC3/history and amended contained-launcher collection remain binding. BUG-2332's spec_arg::spec_id / node_alias::resolve_literal_first fixes argument expansion; it neither reunifies old friendly/native indexes nor proves identity of all retained event labels.

    I inspected the actual BUG-2398 publication checkout /tmp/bug2398-publish-s0ly9nqa/repo at 8f88a717218 (clean), including dca9d8f7ce7 and its patch. gate/approval.rs::independent_approval_authorized reuses durable authority/independence/time checks; dispatch_authority::verdict_at_head adds corpus reconciliation plus that check; review_verdict::review_actionability and human classification require positive authority. Preserve these changes, absent-grant nonauthoritative recording compatibility, protective refusals, and invalid-presented-grant recording refusal. BUG-2403 must not replace them with mere ledger membership, a mode label, matching SHA, or structural attestation. No grant adapter/issuance/global environment change belongs here.

    Proposed narrow correction

    A. One local, fallible resolved-spec selection context at the existing gate reader/writer boundary, not another global alias registry. Load a consistent canonical store snapshot and resolve each requested/historical label with RequirementsStore::get_requirement_unambiguous / resolve_unambiguous_index (models.rs), using node_alias::resolve_literal_first for native labels. Identity equality means the SAME requirement.id UUID after successful full resolution. Numeric ID padding/case follows id_identity; never use a UUID prefix, node-UUID prefix, sequence alone, substring in findings, or approximate UUID matching. Literal-first collisions remain literal; ambiguous/missing labels cannot bridge records. Remapped origin/native/agreed labels are admitted only when the current store explicitly resolves them to that UUID. Unrelated specs sharing a PR are not equivalent.

    Gather the proved identity's current/native/agreed/historical label indexes, unbound events and safe legacy inputs; inspect each candidate event's own spec binding before including it. An index is a hint, never proof that every event in the referenced change belongs to this spec. Reuse recorded_keys to discover retained labels if necessary, once per operation, with no global cache. Canonical new writes use the resolved native store identity and bind/index through the existing ledger path; do not rewrite or migrate old events. PR/MR callers keep their explicit ChangeKey, and spec callers do not select an arbitrary change when multiple current changes are plausible. An unlabelled change event needs existing trusted binding/collection evidence before it supplies spec authority; prose mentioning an ID cannot supply that binding.

    Select once and pass the selected body plus source/change/seq through review display, rework, history and hold lookup. Remove the display-first authority decision in read_recorded_verdict_any and rework_findings_block_for_spec, and replace its substring fallback with proved binding or an explicit unavailable/ambiguous result. Compare the combined candidate set using existing ledger_order_time/ledger_supersedes/newer_of semantics (primary append time bounds reviewer timestamp, late collection cannot look fresh), and seq only within its change. Preserve refusal precedence/corpus reconciliation and existing carry-over proofs; no new patch/SHA carry-over rule. Latest applicable approval means no rework findings, not fallback to an obsolete blocking alias. Recurrence operates on that selected current finding block; do not change the recurrence policy to mask the selection bug.

    B. Recommended writer: phase3 carries the SAME already-validated origin record, including release_grant, attestation, exact full SHA, recorder, recorded_at, findings/classes and retained history, adding only the coordination overlay. Reuse the in-memory normal verdict_obj from this handler after its verified write; do not stamp_record_grant again under later ambient authority, copy from an arbitrary prior PR body, or relax build_verdict_object's new-review receipt clearing. Preserve any displaced PR history through the existing shared history/writer boundary. Expose a narrow same-record overlay operation if needed. Keep the existing contained fallback and child-grant collection checks. pr_merge_gate.rs::stamp_pr_review_verdict is a related provenance overlay audit surface: it must not gain authority by filling missing reviewer receipts; extend only if it demonstrably erases this same trusted-origin receipt.

    C. Existing #20/#21 and #22/#23 need supported read-through, not edits. Prefer a matching ordinary origin over its duplicate phase3 overlay ONLY after proving same resolved spec, same change, full reviewed head, exact recording time/identity/attestation, verdict and findings/classes. Preserve all events in verdict_records/history and archives. Compare semantic review fields, not mere same-head or mode; ambiguous or disagreeing pairs are not collapsed. An unmatched handshake retains existing protective behavior and must independently pass existing positive authority gates. Never silently discard a later request-changes handshake in favor of an older approval, or search backwards for any valid approval after an invalid later review. Missing authority stays missing; normal legacy/unattested records receive NO positive authority from this preference. This is logical duplicate projection, not reconstructed grant provenance.

    Recommendation on the fork: use trusted same-origin receipt propagation for future supported writes plus narrowly proved ordinary-origin preference for retained duplicates. Blanket exclusion of phase3 whenever any ordinary record exists is rejected: it can hide a real later refusal/different-head review. A new durable origin-reference schema is unnecessary for this slice unless the implementer cannot prove the historical duplicate relationship using existing fields; that case stays unavailable and returns for independent design judgment rather than adding authority.

    Safety, races, fail closed

    Keep TASK-1801 anchored bounded non-symlink regular-file reads and archive pinning. Do not add path read_to_string fallback to escape a refused candidate. Inspect every admitted alias's evidence; linked/unreadable/malformed relevant evidence cannot become a clean absence that exposes an older approval. Current ledger store::read_file currently uses read_to_string and skips malformed lines, and changes_for_spec uses std::fs::read; these are actual existing limitations, not assurances of safe handles. Any new alias/index/history read in this correction must be bounded and non-symlink, and propagate refusal to the authority-bearing selector. Do not expand this into a repository-wide IO rewrite; if the selector cannot uphold this on the touched ledger path, include the narrow checked reader there and seek signoff for the added scope.

    Identity proof is pinned to store HEAD plus canonical object cleanliness. Dirty canonical evidence, changed mappings, missing/colliding identity, unverified seat root, or a moving store invalidates positive selection; coordination/mail dirt alone is not a reason to reject the canonical snapshot. Revalidate identity and selected event generation when writing bindings and at existing release-time checks. Existing append flock and index sidecar locks remain; no broad global lock. Recheck for a newer refusal/head/hold between selection and release under existing hold lock; stale snapshot retries are bounded or refuse. New writes visible after a read, index lag, torn/oversize ledger lines and concurrent remap must not permit fallback to stale positive evidence. Preserve arming refusal history, all composed hold references, grant/receipt time validation, author independence, sensitivity/mandate limits and final pinned-head validation.

    Implementation surfaces and tests

    Expected production surfaces: gate/ledger/{project,mod,store}.rs for identity-scoped lookup/binding and checked reads if required; gate/review_verdict.rs for central current/history/any selection; lib_part5.rs::handle_review_record_at for same-origin handshake; queue_cmd.rs::rework_findings_block_for_spec; gate/rework_hold_release.rs::RetainedHistory::projected only to consume the same proved selection. phase_gates.rs handshake readers and pr_merge_gate.rs stamp are audit/compatibility surfaces, not permission to rewrite orchestration or authority. Tests belong in existing gate/ledger/tests.rs, gate/tests/review_verdict_tests.rs, story_1687_rework_release_tests.rs, story_1697_attested_release_tests.rs, queue_work_tests.rs and aida-cli/tests/story_078_node_aliases.rs as appropriate; avoid needless file spread.

    Named proposed regression cases (production APIs/recorder, temporary hermetic store/forge fixtures, no hand-forged positive proof):
    - bug_2403_friendly_native_remap_select_same_review: old friendly refusal at A, normal native + phase3 at B; friendly/native/bound label/UUID query agree on body and origin; also approval at A to refusal at B, and refusal to approval. Preserve all history.
    - bug_2403_record_pr_handshake_keeps_origin_release_receipt: actual supported granted record --pr emits matching same-origin proof; lawful nonsensitive Rework auto-release passes all existing gates. Repeat with GitLab MR routing; PR-N and MR-N of same number remain distinct. Pin the test's handshake root.
    - bug_2403_rework_uses_current_canonical_findings: reproduce 1a9/6b1 sequence, capture only current blocker, no false recurrence; genuine immediately repeated current findings still triggers existing guard, A-B-A does not.
    - bug_2403_historical_phase3_duplicate_prefers_proved_origin: retained 22/23 shape selects ordinary receipt without modifying bytes; handshake-only/unattested origin never gets positive authority; different reviewer/time/verdict/findings/head or unresolved identity cannot collapse. A later refusal remains blocking.
    - bug_2403_alias_cannot_borrow_authority: colliding friendly labels, literal-first alias collision, unrelated same-node different sequence/spec, UUID prefixes, unknown/rebound label, two changes and shared-PR specs cannot import approval. Wrong full head, forged/mismatched/expired-or-revoked-at-the-required-boundary grants, self-author review and invalid receipts refuse. Respect record-time versus collection-time validation; do not require every historical grant to remain live today.
    - bug_2403_selection_race_and_unsafe_evidence_refuses: dirty/moving canonical snapshot, index lag/new refusal during release, torn/malformed/oversize relevant ledger, linked current/archive/index/file and FIFO watchdog preserve fail-closed behavior. Existing BUG-2398 actual ungranted artifact matrix must remain green.

    Local gate for eventual implementer: LIGHT, one focused bug_2403 module/filter run with AIDA_CARGO_TIMEOUT=20m cargo test --profile agent -p aida-cli-lib bug_2403, then make check-ci-fast. Run long Cargo in background through normal slots; after timeout/KILLED inspect cargo ps before retrying. If >10 files or shared test infrastructure changes, also make test-touched and make check-ci-compile once. CI owns full suites. No Cargo run by this sketch author.

    Out of scope: manual JSON/ledger/archive rewrites, new attestation/grant authority, changing BUG-2398's consumer policy, keyring/roster/global aliases/environment, hold bypass or human clearance, queue/dispatch/merge actions, historical evidence deletion, broad ledger/schema/security refactoring, or replacement of patch-identity carry-over.

    Open forks for separate independent signoff: endorse the combined same-origin writer plus historical duplicate projection recommendation; confirm narrow checked-read scope where current ledger primitives cannot preserve fail-closed alias selection. If multiple change bindings remain equally applicable or retained pairing is not provable, refuse with exact ambiguity rather than electing one by filename, UUID prefix, or optimism. Code starts only after BUG-2398 and this sketch's independent signoff.
