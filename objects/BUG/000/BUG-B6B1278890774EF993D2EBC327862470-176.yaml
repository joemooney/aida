- id: 01a196cd-79c9-7d22-8d41-ec25d3a6243c
  author: joe
  content: |
    ADVISOR SIGNOFF APPROVED — BUG-2403, with binding amendments

    Independent review of codex-advisor-11's sketch in /tmp/aida-2403-sketch-result.md. I did not author the candidate sketch or implementation. This is design signoff only, not implementation approval, merge permission, hold clearance, or permission to weaken authority. Implementation MUST serialize after BUG-2398, incorporating its final independently reviewed consumer changes. No Cargo was run; no code, queue, dispatch, merge, hold, or manual ledger mutation was performed by this review.

    Evidence audited

    Root is clean main at 471540a8c477a50a81170f338d81532cb5dbd329. Its origin/main is that commit. The locally fetched origin/story-b6b1278890774ef993d2ebc327862470-164 and live GitHub PR-3185 metadata both identify e0b7d02846577c9fd8406f07cbc796af9551b18e, ordinary branch targeting main, OPEN. Do not carry forward an obsolete metadata/fetch diagnosis. PR-3185 ledger #19 is an older APPROVAL at f3132074, not evidence that its findings recurred. #20/#21 and #22/#23 have the reported normal/phase-3 receipt asymmetry. #22/#23 differ in record fields only by mode and release_grant; #20/#21 also differ in rounds. PR-3194 #7 has the obsolete portability/cap findings; #12/#13 concern the new head and have the same receipt asymmetry. PR-3185 now also has #24, an ordinary approval at the current head: temporary recovery does not supersede this code fix or establish permission to release anything.

    Verified source causes: gate/ledger/project.rs:12,116,160,193 partitions by uppercased literal key and chooses the partition's final event; review_verdict.rs:940,1161,1204 reads through that projection and first-hits across supplied aliases; queue_cmd.rs:10835,10855 selects display first and then substring/filename fallback, feeding recurrence at 8470–8480. lib_part5.rs:3284–3310 stamps the normal receipt, while 3439–3478 rebuilds the handshake. review_verdict.rs:1563 removes release_grant. These are independent defects; alias synchronization alone is insufficient.

    BUG-2398 publication checkout was inspected at f05e1b9e6a22c508f60c614a6848423367165465 (clean), newer than the sketch's 8f88a717218. The positive-authority kernel has moved to gate/review_approval.rs::independent_approval_authorized/human_approval_authorized, used by gate/dispatch_authority.rs::verdict_at_head, gate/review_verdict.rs::review_actionability and human.rs. Preserve the behavior of that final implementation, not the sketch's now-stale symbol location in approval.rs. I read BUG-2403 and its latest comments, BUG-2398 and latest rulings, and STORY-2120's contract and amendments, including origin-authenticated launcher collection and immutable retained evidence.

    Binding amendments

    1. Identity proof must be operation-local and snapshot-bound. Resolve literal first, then only explicit native/retired/node-label mappings, requiring the same full Requirement.id UUID. aida-core/src/models.rs::get_requirement_unambiguous is an appropriate semantic model, but its resolve_literal_first calls aida-core/src/node_alias.rs::expand_spec_id through a process-global installed map. Merely loading RequirementsStore and calling this helper does NOT prove that map belongs to the pinned commit. Use mappings from the same committed canonical snapshot, including registry/node_aliases.toml and registry/retired_ids.toml, or explicitly verify equivalent snapshot-bound resolution without installing a new global registry. Dirty/unreadable canonical objects OR relevant mapping files, ambiguity, missing identity, changed HEAD/mappings, or unverified shared root invalidate cross-alias positive selection. Coordination/mail dirt alone does not. A stale SQLite cache, best-effort alias-map load, UUID prefix, common node, sequence, prose mention or filename cannot prove equality. Current stored mappings must actually resolve retained labels; do not invent historical equivalence.

    2. Keep STORY-2120's one ledger per ChangeKey. Spec aliases are indexes only. Check every event's own change/spec/head/actor/body binding against its source, not just index membership. PR-N and MR-N remain distinct. Shared-PR unrelated specs cannot borrow each other's approval. An unlabelled event needs the existing trusted binding/launcher proof, never prose inference. For a spec with multiple equally applicable changes, return ambiguity rather than sorting to a winner. Preserve the established contained collection route, launched PR and child-grant validation at collection time; no mailbox or direct contained ledger route.

    3. Select once with provenance and use that selection for display, rework, history and hold lookup. The new internal result must distinguish absent, selected, ambiguous and unsafe; authority consumers must not turn unsafe/ambiguous into an ordinary missing verdict and then proceed or fall back elsewhere. Existing Option APIs may be retained only where callers demonstrably preserve refusal. Preserve ledger_order_time's primary-side and record-time bounds; seq orders only within one change. Compare the candidate set, not its first literal partition. Do not let future timestamps, late collections, invalid timestamps or lexical tie breaks manufacture freshness. Keep same-head refusal/corpus reconciliation and existing carry-over proofs. A later distinct invalid/unattested approval supplies no positive credit and must not trigger a backward search for a usable approval. An authoritative current approval gives no rework findings; no obsolete-refusal fallback. Retain the recurrence policy itself.

    4. APPROVED fork: future phase-3 publication carries the SAME verified origin object and its existing receipt, attestation, full head, original recorder/time and semantic review fields. Reuse the exact handler object from its successful write, accounting for normalization at the shared writer, rather than rereading an arbitrary current record that a concurrent reviewer could replace. Add only the narrowly owned coordination metadata and preserve displaced PR history through the shared writer/history boundary. No second stamp_record_grant, ambient reauthorization, old-PR receipt copying or relaxation of build_verdict_object's receipt clearing for a new review.

    The related overlay is not merely hypothetical: pr_merge_gate.rs:186–222::stamp_pr_review_verdict calls build_verdict_object with verdict=None; that builder still unconditionally removes release_grant at 1563 and sets recorded_by/recorded_at at 1594–1603. Include this exact provenance-only path in the narrow overlay correction and regression coverage. Preserve a receipt only from its already selected, trusted same-origin review; never fill a missing receipt. A changed reviewed head cannot be blessed by retaining the old receipt; it still requires existing carry-over/current-head authority checks. This does not authorize a general orchestration rewrite.

    5. APPROVED fork: narrowly proved retained ordinary-origin preference, not blanket phase-3 exclusion. An origin must precede its overlay on the SAME change and resolve to the SAME spec UUID, with exact full reviewed head, recorder, original recorded_at, attestation/identity, verdict, findings/classes and other review-semantic fields. Validate envelope change/head/actor agreement too. Missing values are not equal proof. The allowable differences are the coordination mode, the historical missing receipt, and retained-history representation that remains fully available and reconciled. Unknown semantic differences, multiple indistinguishable origins, conflicting history, an intervening distinct review/refusal or any unproved pairing cannot collapse. Reject a mismatched PRESENT receipt; do not replace it from the origin. Use the origin's review ordering time, not the later overlay append time, so the duplicate cannot leapfrog a real refusal. Expose the actual selected ordinary source and paired overlay provenance; never manufacture a receipt-bearing synthetic historical act.

    #20/#21 demonstrate why byte-identical whole-object comparison is too strict (rounds differ), while comparing only mode/head is unsafe. Preserve the union of retained history and archive evidence without copying current authority out of old rounds. If proof is unavailable, keep the unmatched handshake's protective behavior and require its own existing positive authority. Keep every event and archive byte intact. Ordinary origin preference itself grants nothing: original grant/receipt/independence/time validation must still succeed. Exact provenance cloning is not authority validation. Historical record-time validity and collection-time child validity remain distinct; do not require all old grants to be live today. No arbitrary valid-approval fallback.

    6. APPROVED necessary checked-reader scope: the ledger/index/unbound/discovery paths actually feeding this selector and its supported append/bind/overlay operations. gate/ledger/store.rs:66–73 and 216–223 currently use unbounded path read_to_string and skip malformed lines; project.rs:41–70 swallows directory errors and 116–131 treats bad index reads as absence. These are existing limitations, not safe-read assurances. The new cross-alias positive path MUST NOT build on those lossy semantics. Add a small fallible checked reader at this boundary: pinned non-symlink directory handles, no-follow/nonblocking opens, singly linked regular-file validation by descriptor, bounded bytes/line/event/entry counts, strict parse/schema/change/sequence checks, and named errors. Torn/malformed/unsupported relevant evidence refuses selection; never skip a potential newer refusal. Retain TASK-1801's existing current/archive handle guarantees unchanged, including refused current evidence dominating readable older ledger evidence.

    Indexes are fallible discovery hints and can lag because store.rs::write_events appends before index_spec and only warns on index failure. Positive selection therefore requires completeness beyond index success: bounded checked discovery of relevant change ledgers, or an existing trustworthy completeness proof. Do not infer no newer event from a missing/stale index. Any discovery/entry error or budget exhaustion that prevents proving completeness refuses positive selection. Read each admitted file once per operation where possible; do not reintroduce all-graph/per-alias subprocess loops. If append/bind uses the touched inputs, strict failure must propagate there too, rather than continuing past malformed sequence state. This approves a narrow checked reader and required caller propagation, not a repository-wide ledger/hold IO redesign.

    7. Keep the bounded-read contract in aggregate as well as per file. Establish documented finite operation budgets for canonical snapshot loading/identity-map construction, candidate discovery, file bytes, parsed events and retries; use batch committed reads where useful. Do not add unrestricted load-all graph work or unbounded subprocess waits on every view/hold check. The existing mandate snapshot module is evidence of object-only cleanliness separation, NOT a ready-made bounded approval reader: its snapshot_git waits with wait_with_output and its trust purpose is exclusions only. Reuse mechanics only with the appropriate bounds and identity purpose. If complete proof cannot be acquired within the budget, return a named unavailable/refusal and do no positive action. Do not weaken the existing bounded file cap to accommodate new fan-out.

    Revalidate pinned identity, selected file/event generation and discovery completeness at binding and existing release rechecks. Under the existing per-hold lock, a new refusal, head, covered-spec metadata or composed hold must invalidate the earlier release selection. Keep bounded retries or refuse. Preserve append/index sidecar locks; no new global lock or policy. A trustworthy snapshot conveys identity only, never reviewer authority.

    8. Preserve BUG-2398's full positive floor and compatibility negatives: the actual absent-grant named-agent recorder artifact remains recordable but cannot satisfy launched standalone collection, dispatch review-success/skip-review (including --no-ship), human reviewed classification, resolved actionability, shipping or auto-release. Invalid presented grants still refuse recording; ungranted refusal artifacts remain protective. Durable receipt/grant validation, author independence, recording/commit time checks and all human/sensitivity/mandate/composed-hold constraints remain binding. No new authority, grant, roster, human-hold policy or global identity registry.

    Required evidence before implementation approval

    Use the sketch's six named bug_2403 regression groups through production recorder/selector consumers in gate/ledger/tests.rs, gate/tests/review_verdict_tests.rs, story_1687_rework_release_tests.rs, story_1697_attested_release_tests.rs and queue_work_tests.rs; node-alias integration tests only where needed. Add explicit production overlay coverage for stamp_pr_review_verdict, concurrent origin replacement, #20/#21 history differences, an intervening later refusal, equal-time ambiguity, PRESENT mismatched receipts, stale/missing index after append, and snapshot mapping changes despite clean objects. Exercise friendly/native/UUID queries and explicit PR/MR keys, approval→refusal and refusal→approval, unrelated shared-PR specs, genuine consecutive recurrence and A-B-A. Use hermetic temporary committed stores and supported granted recorder output; do not use hand-forged positive authority.

