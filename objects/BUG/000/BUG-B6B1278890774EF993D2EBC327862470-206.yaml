title: 'Every dev promote deactivates mail retention for hours: writers running a replaced binary count as ''not known to take a write permit'' even when that build already took permits'
description: 'Observed 2026-11-03 21:40 MST. After promoting b5577764ec0, ''aida mailbox retention activate'' refused: ''not every mail writer is known to take a write permit''. The listed writers were running lanes, a reviewer, a lane job and the operator''s command deputy, all running 0f1624a8b38. That build had itself recorded the previous activation, so it does take permits. Their /proc exe reads ''(deleted)'', so the check cannot identify their build and treats them as unknown. Until every lane turns over and the operator restarts the deputy, retention stays off and ''session end'' refuses for any session whose mailbox holds mail. That breaks lease cleanup between promotes. Fix: each writer records its build id at startup (for example in a pid-keyed runtime file, or the lease), and activation accepts any writer whose recorded build is at or after the permit-capable build. Alternatively, promote keeps the activation when the new build''s permit protocol is unchanged.'
