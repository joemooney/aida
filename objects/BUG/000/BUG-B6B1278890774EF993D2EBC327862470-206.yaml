  content: 'ADVISOR REWORK BRIEF (2026-11-03 23:38 MST, PR #3349 head 3024c245). Review: design sound, refusal paths tested. BLOCKING (CI gates): the new test adds an unallowlisted /proc literal that trips the portability ratchet. Build the path through the existing proc helper used elsewhere in tests, or put the test behind cfg(target_os = "linux") with the ratchet''s sanctioned guard. Do not add an allowlist entry unless no helper fits, and give the reason if you do. Nothing else changes. Gate (LIGHT): one targeted cargo test filter covering the changed module, plus make check-ci-fast, then push to the same PR branch. The advisor re-reviews only the delta.'
