  author: joe
  content: 'Implementer note (PR #3349): I did not add a pid-keyed runtime file. Instead, every binary that links admission embeds a write-permit protocol marker. The activation scan reads it through /proc/<pid>/exe, which also works for replaced binaries. Transition: builds from before this fix (such as 0f1624a8b38) do not carry the marker, so the first promote after merge still refuses until they turn over. Change the marker''s protocol version whenever older admitting builds no longer meet what retirement relies on.'
