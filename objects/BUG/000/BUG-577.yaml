title: rel list rejects --spec/--id (clap exit 2) though --spec is valid elsewhere — likely bulk of the 50% rel-list error rate
description: 'Telemetry (30d): rel list = 8103 calls, 4057 non-zero exits (~50%). Live repro: rel list --spec EPIC-48 -> clap "unexpected argument --spec", exit 2. rel list only accepts the positional ID, --source, --target. But --spec is a real flag on other commands (db reconcile-status --spec, etc.), so agents carry it over and fail. Failed-flag-attempt = UX signal. Fix: accept --spec and --id as aliases of the positional source on rel list (align with the dominant ID-flag convention), and/or make the unknown-arg error hint at the positional form. Low-risk; should sharply cut the error rate. Verify post-fix that the telemetry error rate drops.'
