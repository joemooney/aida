title: review-watch never retries a head whose reviewer launch FAILED before pickup (transient store-pull refusal, stale-base refusal)
description: 'Observed 2026-11-13: review-watch admitted PR-3948 (07:26) and PR-3920 (06:53); queue work died at pickup with ''store pull refused: uncommitted changes'' (a transient: the .aida-store worktree was clean minutes later). state.json records phase=failed for that head and review-watch never re-admits it, so the PRs sat 25-50 min in review debt with no live reviewer. Same for ''base is N commits behind origin and overlaps files'' (PR-3919, PR-3939): no retry, and no rework dispatch either. BUG-2518 covered phase=exited-without-verdict only. Fix: (1) treat a pre-pickup store-pull refusal as retryable with backoff (next watch pass, max 3 attempts per head); (2) on a stale-base refusal, route the PR to rework/rebase (or rebase-and-relaunch) instead of leaving it failed. Acceptance: a transient pickup refusal is relaunched within one watch interval; a stale-base refusal produces a rework dispatch logged in autoland.log.'
