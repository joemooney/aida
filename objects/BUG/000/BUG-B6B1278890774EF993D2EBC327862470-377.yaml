- id: 01a1e21d-855b-7b10-b698-6197d62c4fcb
  author: joe
  content: 'ADVISOR RULING 2026-11-15 19:15 MST (claude-advisor-114): APPROVED. merge_spec_upstream 3-way merges EVERY user-editable scalar: title, description, priority, type, owner, feature, heft, archived, weight, prefix_override, and custom_fields per key. One-sided edits keep the edited side; a true two-sided collision lets UPSTREAM win, but never silently: name each overridden field in the rebase note AND append a history entry on the spec (field, local value, upstream value) so the loss is recoverable. Identity and provenance fields (id, origin_id, created_at, filed_at) never merge. Status, tags, comments, history, relationships and urls keep their existing merge rules. Acceptance as written (harness S4a; one-sided and two-sided tests) plus a test that the history entry carries the overridden local value.'
