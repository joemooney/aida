title: 'role enter --bind-pid rejects Claude Code: the versioned binary runs as comm 2.1.310, so the harness check calls it neither harness nor shell'
description: 'Operator ran: aida role enter advisor --bind-pid 1862682 (the Claude Code session process, /home/joe/.local/share/claude/versions/2.1.310 --session-id ...). Refused: "--bind-pid 1862682: `2.1.310` is neither an agent harness (claude, codex, agy, ...) nor a shell". Its parent bg-pty-host also has comm 2.1.310. Claude Code installs as ~/.local/share/claude/versions/<version>, so /proc/<pid>/comm is the version string. aida role status in the session also reports no stable harness pid. Detection should also look at /proc/<pid>/exe or cmdline (a path under .../claude/versions/) before refusing. Workaround used 2026-10-25: a long-lived bash runner bound with --bind-pid, but commands it backgrounds lose the grant once their parent shell exits (reparenting), so a nohup launch must keep its parent alive until the headless child is minted.'
