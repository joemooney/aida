- id: 01a1e800-989d-7483-a02f-4e343bbfad4f
  author: dirtlab
  content: 'Implemented scoped uncommitted mandate evidence snapshots. Both snapshots retain full tracked diffs (working tree and index, including unchanged alias lines) and ignored/untracked contents, then evaluate dirt against the collected IDs/aliases. Unrelated object dirt permits selection; relevant dirt, unknown scope, unreadable/non-text/non-regular files, replaced objects root, or classification evidence above 16 MiB remains fail closed. Conservative substring matching may still retry when another dirty object mentions a scoped ID. Changed mandate_traces.rs, mandate_ship.rs, and bug_2195_store_snapshot_tests.rs. Validation: final lane job j20261117T053258067-2-0 executed 36 snapshot/recollection/trace-resolution tests, all passed; rustfmt checks and git diff --check passed. Edits left uncommitted for native host publication. Navigation limitation: configured reviewed codegraph client was absent; doctor confirmed missing tooling, so navigation used rg.'
