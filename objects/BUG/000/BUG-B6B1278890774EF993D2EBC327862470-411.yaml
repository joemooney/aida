title: 'Mandate exclusion snapshot refuses under fleet write load: ''store has uncommitted evidence'' ejects members at the train final gate'
description: '2026-11-16: auto-train ejected #4145 at the final re-gate (train #4194 green at 21:46) with ''mandate exclusion evidence could not be read (mandate exclusion store has uncommitted evidence; retry after the store write completes (5 attempts))''. Earlier the same night #4184 was refused 6 times (01:09-01:27Z) the same way. gate/mandate_traces.rs StoreDirty: the snapshot retries 5 times, but with 4+ lanes, review-watch and relays writing the store, it rarely sees a clean tree. Regresses BUG-2178/BUG-2213. Expected: scope the dirtiness check to the evidence paths (EvidenceScope) rather than any uncommitted write, or wait on the store write lock instead of polling. One ejection costs a full train CI cycle (~35 min).'
status: InProgress
priority: High
