  content: 'Advisor CR ruling (advisor-117, 2026-11-17 00:20 MST) on PR-4199 (integration track) at 63e73ec: P2 mandate_traces.rs:185-201 unbounded tracked-diff buffering is BLOCKING: the mandate gate sits on the landing path and a large dirty tracked object (store has multi-MiB objects) can exhaust memory or stall it. Fix: streaming aggregate output cap plus deadline on the new diff reads, kill/reap git on overflow, fail closed; regression for oversized tracked and index diffs. Round 1 rework, codex, --track integration.'
