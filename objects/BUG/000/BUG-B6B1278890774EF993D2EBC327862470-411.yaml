  content: 'Fast-gate fix round: added the missing scripts/store-writers.toml inventory row for mandate_traces::snapshot_dirt OpenOptions::new. Reviewed as read_only: read(true), no write/create/truncate, O_NOFOLLOW/O_NONBLOCK, regular-file validation and bounded contents; no runtime mutation authority. Validation: exact CI command python3 scripts/check-store-writers.py passed (3641 sites, 297 operation mappings); 55 test_store_writer_inventory.py tests passed; git diff --check passed. This round changes only the inventory row and leaves it uncommitted for host publication.'
