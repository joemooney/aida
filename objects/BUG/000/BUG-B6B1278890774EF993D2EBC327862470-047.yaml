  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Fixture (bwrap-gated, seat_clone probe):** AC1+AC2 — a clean, pushed leased seat clone with a 0-byte, read-only, untracked `.gitmodules` probes as `Known` with nothing unshipped, and `salvage_worktree_patch` returns `Ok(None)` (dismissable, lease releasable). A second case: an untracked `.gitmodules` that parses but defines no `submodule.*` section is not submodule evidence either.
    - **Fixture (existing):** AC3 — `task_2053_bwrap_a_submodule_clone_fails_reentry_and_salvage_closed` (a `.gitmodules` defining `submodule.sm`) and the s4b gate test (an unparseable `.gitmodules`) stay as they are and still refuse.

    ### Expected files
    - `aida-cli-lib/src/seat_clone.rs` (`SUBMODULE_EVIDENCE_SCRIPT`: a worktree `.gitmodules` is evidence only when it is a symlink/non-regular file, is tracked in the index, cannot be parsed, or defines at least one submodule; an empty regular file is skipped. The probe drops the `? .gitmodules` untracked line for that empty placeholder so it does not read as dirty.)
    - `aida-cli-lib/src/tests/task_2053_s4_host_git_tests.rs` (regression test)

    ### Ambiguities / conflicts as questions
    - None. Kept conservative: `.gitmodules` at HEAD, gitlinks in HEAD/index, and `.git/modules` contents still count as evidence.
