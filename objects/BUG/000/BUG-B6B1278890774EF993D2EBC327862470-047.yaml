spec_id: BUG-b6b1278890774ef993d2ebc327862470-047
title: Seat salvage refuses to end a dead lease because of an empty .gitmodules placeholder the Claude sandbox creates, so reviewers for that branch are blocked
description: |-
  2026-10-30 22:20: reviewers for PR-3154 and PR-3155 were refused ('could not end dead lease ... holding task-...-133'). Both 'aida session end <lease>' and 'aida worktree dismiss' refused: 'the clone has submodules (.gitmodules in the worktree); automatic salvage does not cover them'. The seat's .gitmodules was a 0-byte, read-only, untracked file (the Claude Code sandbox creates such placeholders for protected paths; the main checkout has one dated Oct 24), and the index held no gitlink (mode 160000) entries. The advisor had to verify each seat (clean, nothing unpushed, no open handles) and rm -rf it by hand.

  Acceptance:
  1. Salvage/dismiss treats a clone as having submodules only if the index has gitlink entries or .gitmodules defines at least one submodule; an empty or untracked .gitmodules does not block salvage.
  2. A regression test: a clean, pushed seat with a 0-byte read-only untracked .gitmodules is dismissed and its lease released.
  3. A real submodule is still refused as today (existing test kept).
