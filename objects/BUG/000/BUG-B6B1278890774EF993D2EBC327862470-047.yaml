    ADVISOR RULING 2026-10-31 01:32 on PR-3158 round 1 (2026-10-28 rule: ruled once). ONE new commit: the AC1/AC2 regression test must actually run in CI. Either place it under the CI live-bwrap gate (the bwrap-confinement job) so it fails loudly when bwrap is unavailable there, or make it independent of live bwrap (a fixture clone with an empty read-only untracked .gitmodules; salvage and dismiss only inspect files and the index). A silent skip under green CI is not evidence. Gate: LIGHT.
