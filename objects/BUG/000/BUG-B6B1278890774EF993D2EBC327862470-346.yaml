agreed_id: BUG-2581
title: 'Every merge train runs the full CI matrix twice: once for the push to train/** and once for the train PR'
description: |-
  ci.yml triggers on push to branches [main, 'train/**'] and on pull_request to main. A train branch is pushed and then opened as a PR, so each train gets two full-matrix runs of the same tree (27 push + 33 pull_request train runs in the 24h to 2026-11-14 13:00Z).

  Cost: (1) 7 extra jobs per train against a hosted-runner limit of about 20 concurrent jobs; train #4026's pull_request shards waited up to 8 minutes for a runner (created 13:16Z, last shard started 13:24Z). (2) The train waits for both runs: #4026's push run finished 13:41Z, the pull_request run 13:47Z, land at 13:49Z. (3) Double Actions minutes on every train and every bisect half.

  Why the push run is not needed: the train verdict reads 'gh pr checks' rows by name only and has no notion of event (forge.rs:4632-4638, pr_train.rs:717-742, 800-810); the pull_request run alone supplies 'Build (ubuntu-latest)' and every shard; the PR run of a train is already full tier via startsWith(github.head_ref, 'train/') (ci.yml:33,41); the PR-only gates (ci.yml:766,795,816,994,1013) run only in the pull_request run, so the push run is the weaker of the two; scripts/runner/select-job.py:25 classifies TRAIN jobs only from pull_request runs. Branch protection on main requires 'merge-hold-gate' and 'Build (ubuntu-latest)', both produced by the pull_request run (checked 2026-11-14).

  Change: remove 'train/**' from the push trigger in .github/workflows/ci.yml. Update tests/test_ci_tiers.py:43 (asserts push branches == ['main', 'train/**']), docs/internal/testing/ci-test-shards.md:19 and the prose at scripts/check-ci-gates.py:682.

  Acceptance: (1) a new train PR shows exactly one CI run and one row per job; (2) the train lands on that run alone; (3) push to main still runs full CI; (4) test_ci_tiers passes.
