title: aida doctor --heal hangs forever on an interactive y/N prompt (blocks on stdin / unix_stream_read_generic)
description: |-
  aida doctor --heal hangs indefinitely. Root cause: a heal action (the stale-lease fix) invokes 'aida session end' which prints 'Continue? [y/N]' and reads stdin. Under --heal there is no one to answer, so the process blocks forever on the read (ps WCHAN = unix_stream_read_generic; 7.5min elapsed, 2s CPU, zero progress, no destructive ops performed). The non-heal 'aida doctor' diagnosis path works fine; only --heal hangs.

  Reproduced TWICE: a live hang 2026-05-30 (pid 1960851) AND a stale hung --heal process from 2026-05-25 (pid 3515199) still alive on the box — so this is a standing, recurring hang, not a one-off.

  Fix: every confirm-gated command --heal invokes must run non-interactively — pass -y/--yes (and --force where the heal finding is classified [safe] and a patch is saved first) to 'aida session end' and any other prompting heal action. Mirrors the session-communication discipline: a headless gate must never emit a prompt nobody can answer. Consider a global guard: --heal sets a non-interactive mode that turns any y/N confirmation into its safe default (or hard-errors fast instead of blocking).

  Workaround until fixed: do NOT use 'aida doctor --heal'. Apply the safe fixes manually — 'aida brief ack <path>', 'aida queue prune --orphaned', 'aida session end <lease-id> --yes [--force]', 'git worktree remove --force <dir>'. (Done this way 2026-05-30; doctor now clean.)
