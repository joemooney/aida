title: Interactive Codex launches (queue work, review, derisk, human review --guided) pass raw /aida-* slash commands without prompt expansion
description: |-
  Why
  ───
  Discovered by SPIKE-710 audit. On Codex CLI 0.142+, `/aida-*` custom prompt slash commands are not expanded (skills use `$aida-*` or inline prompt expansion; see BUG-799 / BUG-1095 / BUG-1118). While headless Codex (`compose_headless_command`, `aida-cli-lib/src/session.rs:1499-1504`) expands `/aida-*` via `codex_inline_prompt(prompt)`, interactive Codex launch paths pass raw `/aida-*` strings directly to `codex [PROMPT]`:

  • `aida-cli-lib/src/session.rs:1903-1913, 3380-3411` (`codex_session_args`) & `aida-cli-lib/src/queue_cmd.rs:10586-10657, 10987-10992, 13528-13541` (`exec_codex_session`, `deferred_interactive_launch_hint`): passes raw `/aida-pickup <ID>`, `/aida-guided-implement <ID>`, or `/aida-plan <ID>` to interactive `codex`.
  • `aida-cli-lib/src/session.rs:2020, 3608` (`interactive_reviewer_launch_plan`): passes raw `/aida-review --pr <N>` to interactive `codex`.
  • `aida-cli-lib/src/lib_part5.rs:2181-2193, 2249-2265, 2280-2322` (`handle_derisk_command` & `handle_guided_human_review`): passes `/aida-derisk <SPEC>` to `agent_new_codex`.

  Acceptance
  ──────────
  1. Interactive Codex launches (`codex_session_args` / `exec_codex_session`, interactive reviewer, `aida derisk`, `aida human review --guided`) expand `/aida-*` prompts via `codex_inline_prompt` (or `$aida-*` skill syntax) instead of passing unexpanded `/aida-*` slash literals.
  2. `--no-launch` / `--dry-run` hints (`queue_cmd.rs:10987-10992`) render vendor-appropriate skill syntax for Codex.
  3. Unit tests cover interactive Codex argv construction for pickup, review, and derisk.
