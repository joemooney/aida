title: 'Windows: add_pending_brief stores OS-native path separators → cross-platform CI red'
description: 'task_492_brief_tests::pending_brief_sentinel_add_clear_lifecycle fails on windows-latest: add_pending_brief() used Path::display().to_string() which emits backslashes on Windows, so the project-relative key was ''.aida\\agent-briefs\\...'' and the assertion entries.iter().all(|e| e.starts_with(".aida/agent-briefs/")) failed. This reddened the nightly cross-platform workflow 3 consecutive runs (2026-06-04/05/06), blocking the v0.12.0 release gate. Fix: normalize the relative key to forward slashes via path components join. macOS + Linux unaffected (native separator is already /).'
