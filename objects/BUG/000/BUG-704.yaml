title: Project-level [agents] vendor knob is invisible to drain phases — .aida/agents.toml is gitignored so pool/agent worktrees silently fall back to claude
description: |-
  Found by the codex-only lifecycle validation (2026-07-07, claude-less throwaway project): with the project .aida/agents.toml set to vendor codex, aida queue work --auto-complete --no-human=both still spawned claude -p for the implementer phase and died with failed to spawn claude. Mechanism (verified): headless phases spawn from a pool/agent WORKTREE; .aida/agents.toml is gitignored by the scaffolded deny-by-default block (.aida/* with only config.toml allow-listed), so the fresh worktree has no agents.toml, resolve_headless_vendor finds no knob, and the claude default applies — a SILENT vendor flip, fatal on a claude-less machine. The GLOBAL ~/.aida/agents.toml knob is unaffected (home dir is machine-wide) and the tracked per-surface [orchestrator] headless_vendor in config.toml also works from worktrees.

  Fix direction: also accept [agents] vendor in the project .aida/config.toml (tracked, worktree-inherited) as the team-shared project knob; precedence project agents.toml (per-clone personal) > project config.toml (team) > global agents.toml (machine). Do NOT auto-track agents.toml itself — it carries permission-posture keys (bypass/contained) that are deliberately per-clone. Add a wiring test that resolves from a worktree missing agents.toml, and consider a doctor/vendor-binary hint when a project agents.toml sets a vendor that worktrees will not see.
