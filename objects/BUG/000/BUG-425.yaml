  content: |-
    Implementation findings (advisor burn-down, 2026-05-31) — remaining scope is JUST the batching (progress output shipped via TASK-616). archive_sweep (main.rs ~3192) loops backend.update_requirement(&req) per spec; each is a write-through git commit → 679 commits.

    CLEAN FIX (not a 5-min hack — substrate, do with focus): add GitBackend::bulk_update(reqs, commit_subject) that writes each via object_store::write_object_if_changed, records OpKind::Update (NOT Create) per req, stages the changed YAMLs + oplog, commits once. Expose on CachedGitBackend write-through: run the git bulk_update, then let cache stale-detection rebuild (HEAD-SHA mismatch) on next read — or invalidate explicitly. Wire archive_sweep to collect the mutated reqs and call bulk_update once.

    DO NOT reuse the existing BulkWriter for this: its add() is built for NEW reqs (assigns spec_ids) and its finish() records OpKind::Create for every staged req — using it for archive UPDATES would log false Create ops in the oplog and bump metadata counters needlessly. The batch-commit mechanism (write_object_if_changed loop + single stage+commit) is the part to mirror, with Update-op bookkeeping. Tests: bulk_update writes N, commits once (count git log on the orphan branch before/after), records Update ops, cache reflects archived=true after rebuild. trace:BUG-425
