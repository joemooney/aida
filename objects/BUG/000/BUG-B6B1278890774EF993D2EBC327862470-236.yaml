title: Conformance harness appends a second [contained] table to the fixture config.toml (init already writes one), so spec-add and queue-add fail to parse and C0-C4 report unknown
description: |-
  Seen 2026-11-06 11:49 MST: the first C3/C4 re-run after BUG-2465 (#3520) landed. Run: python3 scripts/containment/conformance.py --vendor codex --boundary aida --output ~/.aida/conformance-aida-1793990948 --timeout 120. role enter now passes. Then spec-add and queue-add fail with 'TOML parse error at line 539: duplicate key contained in document root', every check is unknown (fixture-production-launch-not-accepted), and whole_lane_pass is false.

  Cause: scripts/containment/conformance.py:626-630 opens .aida/config.toml in append mode and writes [agents], [contained] and [contained.vendors] tables. The aida init template has written its own [contained] allowed_hosts table since BUG-2392, so the result has two [contained] tables.

  Fix: merge the fixture policy into the existing tables instead of appending. Either parse with tomllib and rewrite, or append keys under the existing headers: allowed_hosts must be exactly the fixture list, replacing init's list, because C3 tests that a non-listed host is denied. Also set [agents] contained/vendor and [contained.vendors] codex. Add a harness unit test that runs setup against a freshly init'd fixture and parses the config with tomllib. Afterwards the advisor re-runs C3/C4 for BUG-2447/BUG-2448.

  Gate: python unit tests for scripts/containment plus make check-ci-fast; no cargo needed.
