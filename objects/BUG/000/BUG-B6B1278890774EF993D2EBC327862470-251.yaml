  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: Token cap, parent preservation, doctor lifetime and refusal guidance work, but the 30-min floor also applies when the grant (not the token) is short. A launch with an ample token and a parent grant under 30 min left now refuses with misleading ''codex login'' guidance, which breaks the ''refuses only when the capped TTL is below the floor'' criterion. CI was still pending at review time.. No triage reason was given.'
