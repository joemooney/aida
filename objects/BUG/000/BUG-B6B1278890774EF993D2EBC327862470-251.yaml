title: Contained Codex launch refuses when the ChatGPT token expires before the grant; cap the child grant at the token's life instead
description: 'STORY-2593 delivers pinned, non-renewing ChatGPT credentials and requires the access token to stay valid for the grant TTL plus 300s. Role grants default to 24h, so any token with less than 24h05m left refuses: ''contained ChatGPT authentication unavailable or expired; reauthenticate on the host, then relaunch (grant plus 300s margin required)''. Repro 2026-11-07 16:47Z: the operator''s token had 10.8h left; conformance out=~/.aida/conformance-codex-aida-1794070028. Acceptance: the contained Codex launch caps the delegated child grant at (token exp - 300s) and records the cap in launch diagnostics. It refuses only when the capped TTL falls below a configured floor (default 30 min), naming the token expiry and ''codex login'' as the fix. aida doctor shows the token''s remaining life. Tests for capped, floor-refused and unchanged-when-ample cases.'
status: InProgress
