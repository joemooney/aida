  content: 'Implemented in the native worktree; left uncommitted for host publication. Contained ChatGPT launches cap only the delegated child grant at access-token expiry minus 300s using the existing locked grant updater; ample tokens preserve grant bytes and parent grants/revocations are retained. Trusted contained.codex_min_grant_secs sets the positive minimum (default 1800s). Launch diagnostics show requested/effective TTL and expiry; floor refusals name expiry and host codex login. Doctor reports remaining token life in human/JSON/TOON output using the bounded credential reader. Validation: 3 BUG-2486 tests; credential suite 12 passed with one watchdog-only ignored test and the installed-Codex probe opt-in skipped; 10 config-trust tests; 3 vendor ratchet tests; 41 store-writer fixture tests; 19 exec-context fixture tests; store-writer and exec-context inventory guards; cargo fmt and git diff whitespace checks. Live synthetic credential/OAuth/deadline wrapper tests passed. No implementation blockers. Host must commit/publish and complete the queue item after publication.'
