title: aida scaffold upgrade/apply corrupts master templates when run in the AIDA dev repo (writes through .claude symlinks)
description: 'In the AIDA dev repo, .claude/skills/*, .claude/commands/*, .claude/hooks/* are per-file symlinks into aida-core/templates/ (the dogfood master copies). aida scaffold upgrade (and apply --force) classify those paths as template category = overwrite-on-drift, follow the symlink, and write the embedded template THROUGH the symlink into the source master — silently corrupting aida-core/templates. Observed 2026-07-11: an errant upgrade gutted aida-pre-commit.sh 275->68 lines, deleted 476 lines of docs/agents, regenerated every command/skill master to output-format, and created .claude/AIDA.md + .codex/. Reverted via git checkout. Fix: before overwriting a template-category target, resolve realpath; if it is a symlink pointing into aida-core/templates (or generally outside .claude/), refuse or warn instead of writing. Repro: run aida scaffold upgrade in the dev repo.'
