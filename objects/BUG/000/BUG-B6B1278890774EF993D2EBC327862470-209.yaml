title: 'Codex implementer lanes under AIDA_OS_WRAP fail at launch: the OS wrapper emits no ''--'' before the program, but codex_tool_env requires one'
description: 'Observed 2026-11-04 05:51-06:00 MST on live be275c31: every ''aida queue work SPEC --role implementer --no-human --vendor codex'' lane with AIDA_OS_WRAP=1 (BUG-2434 also defaults the wrapper ON for headless implementer lanes) exited at once with: Codex bwrap launch has no command separator. The lanes were BUG-2439, SPEC-447, STORY-2343 and TASK-2032. Cause: session.rs os_wrapped_program_and_args pushes program then args with no ''--'' (around line 5559), while codex_tool_env.rs codex_argv_start requires ''--'' after bwrap (line 155). Acceptance: (1) a wrapped Codex launch succeeds: either the wrapper emits ''--'' before the program for every vendor (bwrap accepts it), or the Codex native posture skips the AIDA outer wrapper by design; the sketch must say which, consistent with the STORY-2460 ruling. (2) A regression test builds the wrapped Codex argv and runs codex_tool_env::prepare_launch over it. (3) The default-on lane wrapper (BUG-2434) does not break Codex. Interim workaround in use: AIDA_OS_WRAP=0 for Codex lanes (posture native = Codex''s own sandbox, per .aida/config.toml [contained.vendors]).'
