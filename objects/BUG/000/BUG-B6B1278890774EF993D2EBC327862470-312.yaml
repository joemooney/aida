title: aida pr train resumes a stale retained journal for a different PR set instead of training the requested PRs
description: '2026-11-12 19:21: ''aida pr train 3887'' (deputy TTY) resumed .aida/train/79b6cd69-...-1.json, a journal retained from the failed 18:11 ''aida pr train 3902'' (step Open, change_id none, 0 members). It failed again with ''BUG-2539 already has open change #3905'' and never gated #3887. There is no flag to abandon a journal; the advisor had to move the file aside by hand. Want: a journal resumes only when the requested PR set matches its members (otherwise it says so and starts fresh), plus ''aida pr train --abandon <journal>''.'
