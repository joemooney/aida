title: 'PR FAST tier misses the task_1750 proc_identity liveness ratchet: #3989 passed PR CI, broke train 15'
description: 'Train 15 (#4004) went red on CI (rest): aida-ci-guards task_1750_liveness_primitive_guard_tests::proc_identity_legacy_decisions_do_not_expand (new raw liveness decision in aida-cli-lib/src/ownership/reader.rs from #3989/BUG-2552). #3989''s PR CI was green because the FAST tier does not run this ratchet, though the 2026-11-13 18:07 operator ruling (TASK-3791, #3979) put cheap structural ratchets on PRs. Acceptance: the FAST tier runs the aida-ci-guards ratchet tests (at least task_1750); a PR adding a raw process_provably_dead decision fails PR CI.'
