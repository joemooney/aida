title: Train opening fails for every train when any open PR has over 250 commits (incomplete commit page)
description: |
  Observed 2026-11-14 08:06 and 08:20 MST. Train 27's bisect and train 30 (#4028 alone, unrelated to #4038) both stopped at opening: "the train stopped early: train opening result is unconfirmed for `train/...`: cannot establish open changes for BUG-2578: CliFailed("invalid or incomplete commit page for PR 4038"); journal retained for retry". PR #4038 had 254 commits against main (an integration-based branch opened against main). The GitHub PR-commits API pages stop at 250, so the open-changes scan could not complete, and every train refused to open while #4038 stayed open. Retargeting #4038 to integration (7 commits) cleared it.

  Acceptance criteria:
  1. The open-changes scan that train opening runs does not fail on a PR with more than 250 commits: page through correctly, or use a bounded query that needs no full commit list (for example, the PR title and head ref for spec IDs).
  2. An unreadable unrelated PR does not stop a train: it is reported and skipped, and the train refuses only when the unreadable PR could name one of the train's own specs.
  3. Test: a fixture forge returns an incomplete commit page for an unrelated PR, and the train opens.
