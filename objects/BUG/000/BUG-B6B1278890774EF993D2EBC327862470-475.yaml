title: Rework lanes push a merge-only head before their fix, so review-watch reviews every round early (stopgap for BUG-2706)
description: |
  Stopgap ruled by the advisor (claude-advisor-122, 2026-11-22 13:33 MST) ahead of the full fix in BUG-2706.

  Observed across the whole 2026-11-22 codex rework wave: a rework lane merges origin/main into the PR branch and PUSHES that merge-only head first (e.g. #4382 @5765eb2c, #4373 @c13b8d31, #4385 earlier), then works for 30-60 min before pushing its fix commit. Review-watch reviews each early merge-only head while the lane is still live, which wastes a reviewer and records a changes-requested verdict that has to be ruled non-counting by hand. On BUG-2706 that verdict also shelved the spec under the running lane.

  Rule: a rework lane never pushes a merge-only head. The main merge stays local and is pushed together with the first fix commit at ship time. If the lane exits with nothing but the merge, it pushes nothing (and reports that).

  ## Acceptance
  - AC1: During a rework lane, the main merge is committed locally only. No push to the PR branch happens before ship.
  - AC2: At ship, the merge and the fix commits are pushed together in one push, so the first new PR head after a rework round always contains the round's fix.
  - AC3: A lane whose only new commit is the merge pushes nothing and reports "no fix commits; nothing published".
  - AC4: A regression test drives a rework pickup whose base needs a main merge and asserts the remote branch head is unchanged until ship, then equals the merge-plus-fix tip.
