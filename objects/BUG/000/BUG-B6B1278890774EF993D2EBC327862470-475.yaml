- id: 01a205ab-fd91-76e0-9659-9373ff1126f2
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2714):
    Verdict: CHANGES REQUESTED
    Reviewed commit: f4749143d1a4
    Recorded: 2026-11-22T23:49:10.809733979+00:00
    Findings:
    1. [unmet-claimed-ac, P1] BUG-2714 AC2, aida-cli-lib/src/seat_clone.rs:3918 and aida-cli-lib/src/ship_from_seat.rs:2574. A dirty clone resume with an advanced, cleanly mergeable base records the new base after a merge-tree probe and returns without merging it. Once the pending edits are committed, require_fix_after_preparation checks ancestry of the recorded PR head only. A fix directly on that head passes, and clone publication reconciles only the remote PR branch, so the first push can omit the recorded base entirely. Integrate the recorded base before clone publication or refuse until it is present. Cover dirty resume with a base-only change and assert both the base and the fix are ancestors of the published tip.
    2. [unmet-claimed-ac, P1] BUG-2714 AC3, aida-cli-lib/src/ship_from_seat.rs:2578. The rev-list query traverses every parent. If a linked lane synchronizes its branch with a newer base after pickup, the new upstream non-merge commits are outside both recorded exclusions and count as a lane fix. With only local synchronization merges, integrate_and_push can therefore publish a merge-only round. Distinguish work on the lane from commits brought in on a merge parent. Cover a second local base merge without a lane fix and require the no-fix diagnostic and an unchanged remote.
    3. [p3] aida-cli-lib/src/seat_clone.rs:3470. Every clean rework pickup creates a lease-specific .rework file under .aida/sessions. Lease retirement removes its TOML and known sidecars but leaves this record behind. Retire the matching round record with the lease so terminated rounds do not accumulate in the directory scanned on each ship.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
