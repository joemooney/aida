  content: '22:45: related failure. The PR-3922 promotion reviewer pickup failed with ''store pull refused: uncommitted changes'' (a concurrent store writer left the tree dirty for a moment), and the follow-up ''aida pull'' in the job hung again (killed after ~20 min). The pre-pickup pull should wait on the store lock or retry, not fail on a transient dirty tree.'
