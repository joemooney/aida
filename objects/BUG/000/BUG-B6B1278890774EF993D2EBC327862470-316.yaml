  content: 'Advisor 2026-11-14 11:58: live binary rebuilt at e14d6c9 (9b on main). ''aida pull'' on it no longer spins at ~45% CPU but still takes ~100-150 s for a no-op pull (state S, 9-17% CPU, fds on cache.db and gate-ledger/by-spec). The train''s own post-train pull was last TERMed by the watchdog at 18:35:45Z (old binary). Keep the watchdog until one train ends with no TERM line; if pulls stay >75 s the watchdog will keep killing them and merge-time completion then depends on a later manual pull (specs did complete after one).'
