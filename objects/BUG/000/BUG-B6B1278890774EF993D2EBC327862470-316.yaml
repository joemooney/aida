- id: 01a1d37c-9f79-7123-8a55-4f90bd3f9011
  author: joe
  content: 'integration seat 23:15: root cause found. Every aida pull auto-bump calls reconcile_waiting_verdicts(root, None) (db_reconcile.rs) which resolves current_verdict for every one of ~2,800 verdict keys; each read does a full gate-ledger discovery (~0.6 s) plus publication git spawns. Fix rides on BUG-2543''s ListingScope (branch bug-2543-listing-snapshot, commit 960dd9f): the reconcile loop shares one discovery; ledger writes inside a scope drop the memoized ownership index. The cache.db reads in the report are not addressed separately; re-measure pull after this lands.'
