  content: 'Product 13:48: Claude (Fable) fresh-start lane queued on dell1, brief:

    # Brief: BUG-2706 (fresh start; advisor-121 13:47: approved, drain, high; Claude+Fable)


    Review-watch reviewed MERGE-ONLY heads while a rework lane on a FOREIGN lane host (dell1) was live and still working on that PR: twice this hour (#4364 at 778dc38, #4363 at cde727e). Each produced a premature CHANGES REQUESTED that isn''t a spent round. Cause: STORY-2705''s "defer review while a rework lane is live" check only sees lanes on the local host, not foreign lane hosts.

    Implement the spec''s ACs: review-watch defers a review while a live rework lane exists for the PR''s spec on ANY registered lane host (use the existing lane/lease visibility for foreign hosts; don''t add an ad-hoc ssh probe in review-watch). Regression: a foreign-host live lane defers the review; after the lane exits, the new head is reviewed.

    Trailer (BUG-2706) if every AC is met; otherwise (Refs BUG-2706).

    Before pushing, run `make check-ci-fast` and `python3 scripts/check-store-writers.py`.'
