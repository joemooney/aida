title: 'Force-claim refuses a dead lane''s clean, fully pushed seat clone with holder refused: IdentityChanged / EvidenceUnavailable, so every autoland rework relaunch fails until the lease is ended by hand'
description: 'Observed on dell1 2026-11-13 00:50-01:30 (advisor). Five rework relaunches (BUG-2501, TASK-3779, STORY-2660, TASK-3099, BUG-2549) were refused-before-start: ''cannot force-claim branch <b>: retained lease <id> and private clone <path>: holder refused: IdentityChanged'' (one: EvidenceUnavailable). In every case the clone had no tracked changes and HEAD equalled origin/<branch>. ''aida session end <id> --force'' cleared each one and the relaunch then started. Continues BUG-2455, BUG-2491 and BUG-2532 (completed): a new holder-refusal reason now blocks the same path. Acceptance: (1) force-claim takes over a retained lane lease whose holder process is dead and whose clone is clean and fully pushed, whatever the holder-identity check reports (IdentityChanged / EvidenceUnavailable), and salvages as session end does; (2) it still refuses when the clone has unpushed commits or tracked changes, or when the holder is alive; (3) a fixture covers the IdentityChanged and EvidenceUnavailable cases. Workaround meanwhile: verify the clone is clean and pushed, then run aida session end <lease> --force on that host.'
