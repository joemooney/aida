    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 13:55):
    # BUG-2756 / PR #4533 r2 (advisor-122 ruling 2026-11-24 13:57 at 8bf4bbc5; product-15). Lane: CODEX. MAIN, existing branch. <=120 lines. ONE round.
    MUST (otherwise the fix doesn't actually unstrand merges):
    (F1) Writing the spec comment is BEST-EFFORT: a store conflict or transient failure logs and continues to commit + push, NEVER aborts.
    (F2) When regeneration fell back, the mandatory host `cargo check --workspace --tests` must NOT block publication: downgrade it to ADVISORY for this path (record its result) and let CI verify, as the warning promises.
    (F3) An OSError launching the snapshot command takes the SAME fallback as a nonzero exit, when the golden is intact and nothing was written.
    (F5) The journal records regeneration as "snapshot deferred to CI", NOT regeneration_success=true.
    (F6) ONE host-boundary test: a fully resolved repair with a FAILING snapshot command ends committed + pushed, with the warning on the spec.
    DEFERRED (do NOT do): F4 (full diagnostic capture), F7 (helper-level fixture fidelity).
    One targeted cargo run, then make check-ci-fast, then push to #4533. COMMIT your work.
    TITLE TRAILER: keep the existing PR title unchanged.
