title: A conflict-repair lane host post-exit snapshot regeneration failure strands a fully resolved merge
description: |
  Seen 2026-11-24 on dell1 (filed by product-15 per advisor-122 ruling 12:35): the conflict-repair lanes for #4416 BUG-2713 and #4413 BUG-2720 fully resolved their merges (0 unmerged, 0 markers, all staged), then the HOST post-exit step failed: "host post-exit commit failed: pending repair merge retained with its staged index; … repair regeneration refused: Compiling proc-macro2…". The snapshot regeneration (`AIDA_UPDATE_SNAPSHOTS=1 cargo test --profile agent -p aida-cli-lib --lib -- --exact command_registry::story_1728_command_registry_tests::help_…`) errored, and the resolved merge was stranded uncommitted until product committed it by hand. Separate code path from BUG-2754.

  ## Acceptance
  - AC1: When the merge is fully resolved and snapshot regeneration fails, the host STILL commits and pushes the resolved merge, and reports "snapshot regeneration failed: <cause>; CI will verify", instead of refusing.
  - AC2: The regeneration error is recorded on the spec (comment). A test with a failing regeneration command.
