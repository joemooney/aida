title: zen auto-resolves Exit action but cannot synthesize Ctrl-D to close Claude Code REPL in interactive mode
description: |-
  \`--zen\` auto-resolves \`kind:confirmation\` prompts in skill flows correctly — it prints the auto-resolve annotation and skips rendering the 3-option menu. **But the Claude Code REPL stays open** waiting for the user. The annotation says \"Exit\"; the session doesn't actually exit. The user still has to hit Ctrl-D for the orchestrator to advance.

  ## Root cause

  Inner Claude (running in Claude Code) can't synthesize EOF on its own stdin to close the REPL it's running inside of. In interactive mode, only a human Ctrl-D or the headless invocation (\`claude -p\` self-terminates after prompt completion — STORY-276) can close the session. The skill-template auto-resolve fires at the \"which option to render\" layer; the action behind \"Exit\" (literally sending EOF) is out of reach in interactive mode.

  ## Symptom (TASK-318 drain, 2026-05-17)

  End-of-drain annotation:

  \`\`\`
  ↳ zen: auto-resolved \"next step\" → ⇒ Exit — let the orchestrator continue
  \`\`\`

  Claude Code REPL then stayed open at \`❯\`. Orchestrator subprocess was blocked on \`.status()\`. User had to manually Ctrl-D.

  ## Two valid fixes

  ### A. Honest annotation (interim)

  Change Exit-class kind:confirmation auto-resolves to print:

  \`\`\`
  ↳ zen: auto-resolved \"next step\" → ⇒ Exit — send EOF (Ctrl-D) when ready
  \`\`\`

  Documentation: --zen reduces babysitting **clicks** (menu reading + arrow-keying + selection), not **keystrokes** (the final EOF stays human in interactive mode).

  ### B. Structural (STORY-276 dependency)

  Under headless \`claude -p\`, no REPL = no EOF needed. --zen's Exit auto-resolve becomes a true no-op because the process self-terminates after the prompt task completes.

  ## Acceptance

  - [ ] Fix A: Exit-class auto-resolve annotations say \"send EOF when ready\" not \"continue\" (honest about what user must still do)
  - [ ] Fix A: \`docs/aida-discipline/skill-prompt-kinds.md\` clarifies --zen reduces clicks not keystrokes in interactive mode
  - [ ] Fix A: \`docs/autonomous-drain.md\` 3-mode table --zen row says \"Friction after\: very low; one Ctrl-D per spec exit remains in interactive mode\"
  - [ ] This BUG closes when Fix A lands; Fix B is tracked under STORY-276
  - [ ] Test: simulated --zen drain → Exit annotation reads \"send EOF\" not \"continue\"

  ## Composes with

  - **STORY-287** (--zen mode shipped — this BUG is its first real-world friction-mapping)
  - **STORY-276** (headless implementer — structural fix B)
  - **TASK-306** (mode-flag clarity — documentation companion; honest --zen claims)
  - **TASK-326** (JSONL auto-resolve logging — should log \"action requires EOF\" so observability captures the residual click)
  - \`feedback_precise_lifecycle_vocabulary.md\` (don't conflate \"decided to exit\" with \"exited\")

  ## Origin

  2026-05-17 first --zen drain (TASK-318). 3 of 3 menu prompts auto-resolved cleanly. Final \"Exit\" auto-resolve left REPL open. User: *\"but it did not exit the session and move on to the PR.\"* Friction reduction is substantial (~80% in interactive mode) but the claim that --zen eliminates all phase-1 babysitting was over-stated. Honest framing: --zen reduces clicks; --no-human=both (STORY-276) eliminates the EOF too.
