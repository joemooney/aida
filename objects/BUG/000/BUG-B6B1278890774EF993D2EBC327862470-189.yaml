title: The final ID of a delegated block fails object-save admission after it was dispensed (next advances, nothing is saved)
description: 'From SPIKE-708 Q1/Q3 (research on the spike, 2026-11-03). Probe: a size-one block, and the final ID of a size-two block, are dispensed (block ''next'' advances), and then the object save is refused by admission because the block is no longer spendable. The ID is burned and the object is not saved; the next add falls back to a node-local ID. Expected: admission recognizes an already-dispensed final ID independently of future block spendability. Acceptance: (1) size-one and final-of-size-two adds both persist under the delegated ID; (2) wrong-node, wrong-home and absent-hub-claim refusals still refuse; (3) a failed save never leaves ''next'' advanced without an object (no silent loss): roll back or retry the same ID. Source pointers: db_block.rs ~L302-317 (claim refusal).'
