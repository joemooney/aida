title: git-guardrails also false-blocks feature-branch deletion (analogous to BUG-661 force-push)
description: 'BUG-661 fixed the force-push false-positive (check the push TARGET, not CWD HEAD). The SAME hook still blanket-blocks git branch -D / git branch -d, so deleting a feature branch (git branch -D task-NNN-foo) is refused — leaving stale local branches after every agent worktree (observed repeatedly: agents report harmless-but-undeleted task-NNN branches). FIX: same pattern as BUG-661 — allow deletion of NON-protected branches, block only deletion of protected branches (main, the dynamic default, aida-store, master/develop). Fail-closed on ambiguity. Reuse the is_protected_branch + target-parsing helpers BUG-661 added.'
