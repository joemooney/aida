title: aida pr auto-queue-review ignores node-local spec IDs (TASK-<node>-NNN) in commit trailers, so no review story is filed
description: 'PR #2955 commit subject ends (TASK-b6b1278890774ef993d2ebc327862470-003, ...-004, ...-005, ...-006), yet auto-queue-review says: carries no (REQ-ID) trailers in its commit range. Since the 2026-10-25 WORK migration every new spec gets a long node-local ID, so every PR for a new spec silently gets no review story (the watcher then cannot review it). The completion trailer path may have the same gap (check that merge-time auto-complete recognises these IDs; it did complete BUG-b6b1...-002 and -004, so verify which parser differs). Fix the auto-queue trailer regex to accept node-local IDs, with a test.'
