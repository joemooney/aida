  content: |-
    ## SKETCH (proposed, awaiting advisor signoff): retained-draft recovery after launcher exit
    Full text: docs/plans/2026-11-20-bug-2669-retained-draft-recovery.md (commit 06d0850cdf on branch bug-b6b1278890774ef993d2ebc327862470-433).

    Shape: recovery is a NEW act by the recovering launcher under its own reviewer delegation, never a continuation of the dead launch. No key copy, no rebinding, no presenting the first launch's grant.
    1. Launch receipt: before spawn, the launcher writes ~/.aida/review-handoffs/<draft-uuid>.json (beside session-grants; not writable from a lane sandbox): PR, full head, worktree, draft dir dev+inode, routed reviewer session, launcher grant. No secret; not a capability.
    2. Seal: after the reviewer exits and the draft validates, the draft SHA-256 goes into the receipt before the first record attempt.
    3. Recovery (needs a live grant delegating reviewer): match receipt, dir identity, digest, current forge head, no newer verdict; mint a fresh reviewer child grant under the recovering launcher; record through the existing record_reviewer_draft path with the receipt's reviewer session as recorder identity (self-review and launcher-overlap checks unchanged); stamp reviewer_draft.recovered; mark consumed; revoke the recovery grant. A fresh grant is required anyway: the ship gate checks the attesting grant was authorized at recorded_at.
    4. Supersession: a new launch in the worktree first recovers or supersedes earlier drafts, so a later vendor session cannot edit an earlier unsealed draft into an approval.
    5. Triggers: reviewer launch (recover first, skip the vendor run), teardown/reap, and aida review draft list|recover|discard.

    Decisions needed:
    D1 unsealed drafts (launcher died while the reviewer ran): (a) recover any verdict automatically [recommended], (b) automatic for non-approvals, operator command for an unsealed approval, (c) never.
    D2 receipt location: user AIDA home [recommended] or project store (writable from lane sandboxes).
    D3 automatic recovery only within 24h of the receipt [recommended]; older needs the operator command.

    Slices after signoff: (1) receipt+seal+list, (2) recovery core+supersession+launch trigger (strict-tier review), (3) teardown trigger+commands+docs. Drafts written before slice 1 have no receipt and stay manual.
