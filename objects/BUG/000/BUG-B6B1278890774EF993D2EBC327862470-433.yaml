title: 'BUG-2564 follow-up: retained reviewer-draft replay can''t survive launcher exit (grant bound to the original launcher''s proc and keyring); it fails closed to a fresh review'
description: |
  Deferred from the #4239 (promotion 19, BUG-2564) review, 2026-11-17 01:27Z, P1, by advisor ruling at the 4-round cap.

  Retained reviewer-draft recovery can't survive the launcher process exiting (aida-cli-lib/src/review_draft.rs:637-651, revalidate:316-323). Child grants are bound to the original launcher's proc token, and to a secret in that process's private session keyring when available (seat_authority.rs:2962-3000; grant_keyring.rs). A later queue-work process has neither, so VerifiedReviewer::from_launch fails, the retained draft is discarded, and a fresh review runs.

  That fails closed (no lost or forged verdict), but the cross-launch replay path is effectively dead.

  Acceptance: either (a) a design (sketch plus advisor signoff) under which a later launcher can deliver a retained draft without impersonating the original launcher's grant, or (b) remove the cross-launch replay path and keep only the same-launch bounded retry, with docs and tests updated. Either way, a regression shows what happens to a retained draft after the launcher restarts.
