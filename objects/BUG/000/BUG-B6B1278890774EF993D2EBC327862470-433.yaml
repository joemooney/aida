    3. [behavioral-test] audit rows plus the review draft list probe in aida-cli/tests/bug_1502_format_json_audit.rs (run still building at comment time; see PR for the result).
    4. [behavioral-test] draft_files: only NotFound is absent; bug_2669_a_failed_draft_lookup_is_unreadable_and_never_swept.
    5. [behavioral-test] list resolves find_main_worktree_root; bug_2669_list_from_a_linked_checkout_shows_the_projects_receipts.
    6. [behavioral-test] legacy collection closes the receipt as unused (mark_unused), consumed only when recorded from the draft; unit test passes, the end-to-end test bug_2669_legacy_collection_without_a_draft_closes_the_receipt_as_unused needs the built CLI (pending).
