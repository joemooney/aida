- id: 019e5173-d01b-7252-8bdc-f09d24bbdfbd
  author: joe
  content: |-
    Resolution 2026-05-22 (BUG-220 PR): root cause is Hypothesis B (sync gap) per the 2026-05-18 confounder comment — confirmed by reading the code. Findings:

    (A) plausible if shells differ on joe; documented as the AIDA_USER override pattern.
    (B) the actual cause: orphan-store auto_push defaults to 'manual', so a writer that doesn't run 'aida db sync --push' leaves commits stranded locally. Documented + recommended 'auto_push = "session-end"' as the durable fix.
    (C) false: queue routing has no node-id (aida-core/src/db/git_backend.rs:579 — queue YAML keyed on user_id only).
    (D) N/A for queue: queue_list reads orphan-store YAML directly via the inner git backend; the SQLite cache is only used for 'aida list'/'aida search', and ensure_cache_fresh() (aida-core/src/db/cached_git_backend.rs:85) already auto-rebuilds silently on stale.

    Deliverable: docs/multi-node.md ships the diagnostic checklist, the two failure modes, the auto_push settings, and a one-machine two-clone reproduction recipe.

    Follow-up filed: aida queue list freshness nudge (warn when local orphan store is behind origin/aida-store using ~/.aida/cache/last-fetch.toml). Low priority — '--sync' already covers the opt-in case.
