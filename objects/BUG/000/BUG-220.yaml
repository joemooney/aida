  content: |-
    Diagnostic refinement 2026-05-19: user reported 'aida pull at work, queue empty.' Root-caused on the imac (the node that built the queue): its local aida-store branch was **9 commits ahead of origin** — the queue + recent spec state was stranded, never pushed. The work machine's aida pull faithfully pulled origin/aida-store, which was 9 commits stale → it could not see queue items that were never pushed.

    This is a CONFOUNDER for BUG-220's filed framing ('queue empty from a second node DESPITE same shell user joe'). That framing implied a genuine multi-node-identity bug. But this incident's empty queue is fully explained by unpushed store — a push-cadence issue (STORY-284's territory), NOT an identity bug.

    RE-TEST PLAN to determine if BUG-220 is real: the imac's store has now been pushed (origin/aida-store current). On the work machine, run `aida pull` then `aida queue list` with `USER=joe` (verify via `echo $USER $AIDA_USER`). If the queue now POPULATES → BUG-220 was misdiagnosed; it is really STORY-284 (lazy push) and should be re-scoped or closed as dup-of-STORY-284. If the queue is STILL empty with a verified `joe` identity and a current store → genuine multi-node-identity bug, BUG-220 stands and that diagnostic output is the evidence it needs. Per feedback_verify_before_filing.md: rule out the unpushed-store confounder before treating BUG-220 as a deep identity bug.
