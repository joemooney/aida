title: aida role status offers --bind-pid for a managed agent session, but the resulting grant is refused and cannot be issued to the agent's handle
description: 'Seen 2026-11-08. role status printed ''for aida role enter <seat> --bind-pid 2907980''. The operator ran it: the grant was issued to joe and rejected in the session (''issued to joe but this process runs as claude-advisor-106''). Issuing with AIDA_USER=claude-advisor-106 failed the team roster check for the advisor seat. So a running managed advisor has no way to renew an expiring grant short of a relaunch. Either make the bind usable for the session it names, or stop offering it and name the supported renewal.'
status: InProgress
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
