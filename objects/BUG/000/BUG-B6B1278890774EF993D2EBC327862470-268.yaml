  content: 'Implemented the supported-guidance option: role status reports the harness PID as informational and directs managed sessions to save a handoff, renew the parent role/delegation at the operator terminal, and relaunch through their launcher. --bind-pid help and role documentation now state that binding retains the invoking subject and cannot renew a managed child grant. No authority or grant issuance changes. Targeted regression and help-snapshot validation are running through the lane runner.'
