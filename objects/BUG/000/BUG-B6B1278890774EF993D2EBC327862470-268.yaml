- id: 01a1c63d-c8c3-7672-b60d-448c88bf997c
  author: joe
  content: 'Related evidence (advisor, 2026-11-10 09:16 MST), same identity mismatch in the other direction: ''aida deputy shell submit --file F --wait'' from a rotated advisor session (handle claude-advisor-111, grant ebe129d3 minted by ''aida agent new claude --role advisor'') is refused by the operator''s script deputy ''default'': ''refused:grant: Session grant ebe129d3… (advisor) was rejected: it was issued to claude-advisor-111 but this process runs as joe''. The deputy checks the submitter''s grant against ITS OWN process principal (joe), not against the attested submitter (SO_PEERCRED peer and handle). It reproduces after a deputy restart (operator restarted it at 09:14). Impact: rotated advisors cannot launch local lanes or clear merge holds through the deputy, so all lanes go to dell1. If the fix for this bug''s direction (issue the grant to the agent handle) is in the same resolver, cover the deputy path too; otherwise say so in the PR body and the advisor will split it.'
