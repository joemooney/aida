title: Tree output repeats parent rows under Unscoped
description: |-
  `aida list open --tree` currently lists epics/parents twice: once as parent group headers and again under the synthetic Unscoped bucket. Once a requirement is used as a real parent/group header in tree output, it should not also be emitted as an unscoped ordinary row.

  Observed symptom:
  - Epics/parent requirements appear at the parent level in `--tree`.
  - The same parent requirements are repeated under `Unscoped`.

  Expected behavior:
  - Parent-backed group rows appear exactly once, at the parent/group level.
  - `Unscoped` contains only open requirements that truly have no parent and are not already represented as a parent-backed tree group.
  - Child rows remain nested below their parent as today.
  - Add or update tree-renderer coverage so a parent/group row cannot regress into duplicate Unscoped output.

  Context: this is adjacent to TASK-0439, which fixed parent-backed group header rendering; this bug covers duplicate placement under Unscoped.
