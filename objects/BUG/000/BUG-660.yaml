title: 'Unattended-drain robustness: no sleep-prevention / exit-summary / backoff (gnhf gap)'
description: 'From the gnhf competitive analysis (2026-06-29): AIDAs overnight drain (zen --no-human / --auto-complete / integrate --watch) has NO protection against a laptop SLEEPING mid-drive — a real overnight-failure mode gnhf handles. Verified gaps in AIDA source: no caffeinate (macOS) / systemd-inhibit (Linux) sleep-prevention; no permanent exit summary; no exponential backoff on retryable agent errors; resets --hard on failure rather than commit-failure-preserve-for-repair. ADD: (1) system sleep-prevention wrapping a drive, (2) an exit summary at drive end, (3) exp backoff on retryable errors, (4) preserve work on recoverable commit-failure. Aligns with the stability-first phase (a reliability gap, not marketing).'
