- id: 019e81f3-4e96-7530-9158-bf4461678203
  author: joe
  content: |-
    Repro/diagnosis (advisor, 2026-05-31) — narrowed, not yet fixed. The test's OWN git path is properly isolated: resolve_phase3_stale_overlap → attempt_phase3_auto_rebase shells the (faked) 'aida pr rebase' with an EXPLICIT .current_dir(&self.project_root) (= the test's tmp), and should_auto_rebase_stale_base is a pure decision (no git). So clean_auto_rebase_proceeds_without_retrying_preflight does NOT rely on process CWD — it's a VICTIM, not the cause. The '/nonexistent-repo-path-xyz' in the CI panic is a RED HERRING: it's from a different test (classify_sha_unknown_when_git_unavailable, main.rs ~53587) that passes that bad path to git on purpose; its stderr interleaved in the shared cargo-test output.

    REAL CAUSE: process-global std::env::set_current_dir in PRODUCTION paths (main.rs sites ~20663/20680 session-start cd-and-restore, ~25155, ~26928, ~69479) exercised by sibling tests under parallel execution — between a test's set_current_dir(X) and its restore, other concurrent tests that DO rely on process CWD for a real git op (merge/checkout) operate on the wrong tree → 'untracked files overwritten by merge'. CI load widens that window, hence flaky-only-under-load + a docs-only PR tripping it.

    FIX OPTIONS (needs a focused repro session — un-reproducible locally without load): (a) eliminate process-CWD reliance — make the cd-and-restore paths pass an explicit cwd to git instead of set_current_dir (removes the landmine at the root; ~5 sites); (b) serialize CWD-mutating + real-git tests with the serial_test crate (#[serial]) so the race can't occur. (a) is the durable fix. Can't verify either is effective without reproducing the flake, so don't claim 'fixed' until a load-repro is green. trace:BUG-409
  created_at: 2026-06-01T06:51:06.774126289Z
  modified_at: 2026-06-01T06:51:06.774126289Z
- id: 019e936f-2468-7b23-bc5e-ecbf68513694
  author: joe
  content: 'Investigation (2026-06-04): the named test is hermetic — it fakes the aida exe and the production rebase (pr_rebase_handler) uses ''git -C <wt_path>'' isolation, and the git() test helper uses current_dir. Root suspicion: global-CWD contention under parallel test execution (several production handlers — session_start/session_end/handle_queue_work/prepare_agent_launch — call std::env::set_current_dir, which is process-global). The named test''s project_root tempdir was never git-init''d, so any git op reaching it had no repo. FIX shipped: git-init the fixture per the spec''s ''fresh temp repo per run'' remedy (30/30 deterministic locally). If CI flakes again, the next step is to confirm the parallel hypothesis (run the suite with --test-threads=1) and add serialization (#[serial]) to the set_current_dir-exercising tests — that is the deeper fix the global-CWD hazard implies.'
