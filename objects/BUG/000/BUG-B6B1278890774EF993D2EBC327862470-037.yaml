  author: joe
  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: other: work complete locally but unable to publish: aida ship refuses to run git in this contained seat''s private clone (git config/hooks writable by the seat). Commit 185421df638 is on branch bug-b6b1278890774ef993d2ebc327862470-037, not pushed. Also could not file an implementer finding: the store is read-only in the seat. The finding: (1) the fixture''s descendant.pid can be absent if the timeout fires before the shell records it, so the test panics at unwrap. Fix: write pid and start atomically, and re-run the scenario if no record was written. (2) ScoreEnv hard-codes /tmp and /var/tmp, so the two scenario tests could not run in the sandbox. The stress run used the new helper unit test: 200/200 under load.. No triage reason was given.'
