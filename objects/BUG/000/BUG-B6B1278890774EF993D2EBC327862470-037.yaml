- id: 01a18c88-5d94-7ee2-810d-50efb0e3c79a
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-b6b1278890774ef993d2ebc327862470-037):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 460a2bd4d73f
    Recorded: 2026-10-30T11:16:56.114700726+00:00
    Findings:
    1. BLOCKER (fail-open test): aida-cli-lib/src/regen/score.rs assert_group_member_exits — both fixtures write descendant.start via 'echo "linux-starttime:${22}"' (content ends in '\n'); callers pass read_to_string(...).ok() untrimmed (score.rs ~1093, completeness.rs ~667). process_start_identity_exact returns 'linux-starttime:N' with no newline, so 'live != start' is always true and the function returns immediately: generated_tool_help_timeout_kills_group_and_retains_reason and the completeness forking case no longer check that the descendant died. (The old code also never matched, which is why it always fell through to the probe.) Fix: trim the recorded start in the callers or in assert_group_member_exits, and treat an empty or partial record as None.
    2. Partial-write edge: if the timeout kills the shell mid-'echo' into descendant.start, the file exists but is empty or partial ('linux-starttime:'). That gives Some(""), the mismatch branch, and a vacuous return. After trimming, treat an empty or non-canonical record as None so the pidfd poll decides.
    3. Test gap: group_member_exit_check_accepts_zombie_and_reaped_child passes the identity from process_start_identity_exact directly, so it never exercises the file-sourced format the real callers use. Add a case that feeds a newline-terminated record (or route both callers through one helper that reads and normalises the start file) and assert the poll path actually runs, e.g. a live un-killed child with a matching record must fail (should_panic) rather than return early.
    4. Acceptance 'stress it locally (e.g. 200 iterations under load) with zero failures' is unverified for this PR: the PR body and spec comments give no stress result for this head. The earlier lane stressed only the helper unit test, and that run predates this redo. Re-run it after the trim fix (with the fixed check, which is now non-vacuous) and report the count.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
