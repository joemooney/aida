title: runtime counter/registry writes leave the orphan-store worktree perpetually dirty — every drain launch warns 'uncommitted changes; skipping pull'
description: 'Fourth occurrence 2026-07-19: aida burndown run''s --sync preflight warns ''orphan store has uncommitted changes; skipping pull'' at nearly every launch, because some writer (agreed_counters.toml / registry churn observed each time) modifies the .aida-store worktree WITHOUT committing, unlike every other store write which targeted-commits. The advisor has hand-committed the churn 3x this weekend. Fix: find the non-committing writer (counters/registry update path) and make it commit-through like requirement writes (targeted, small subject), OR have the sync preflight auto-commit known-runtime files (registry/agreed_counters.toml allowlist) before pulling. Acceptance: two consecutive drain launches with normal activity between them produce no uncommitted-store warning; the counter file''s history shows regular targeted commits; test on the counter write path. Mode: drive.'
