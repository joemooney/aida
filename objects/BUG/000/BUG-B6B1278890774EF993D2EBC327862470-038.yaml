  author: joe
  content: |
    ADVISOR RULING 2026-10-30 10:52 (PR-3143 round 1, BUG-HOME-038). ONE rework push to bug-b6b1278890774ef993d2ebc327862470-038 (merge origin/main; no rebase, no force). Bundle all six findings.
    1. (major) Ownership proof: allow the seat's own git only when BOTH hold: (a) containment is proven (the existing write probe), and (b) the clone root equals the clone path in THIS process's own session lease (resolve the lease from the process's session and compare canonical paths). Any other clone is refused. Add a test where a contained process with seat A's lease is refused in seat B's clone.
    2. Run the STORY-469 commit-trailer check in --from-seat against the imported commit before the push.
    3. --dry-run --from-seat performs no import: verify the bundle in a temp location only, print the plan, and leave no refs behind. Test it.
    4. Handler tests: push target equals the lease branch on origin; --from-seat run from inside a clone is refused; the PR body contains 'published from seat'. Use a mock forge.
    5. Delete refs/aida/seat-import/<branch> after a successful push.
    6. Cache the containment probe result once per process (OnceLock) instead of probing on every git call.
    Gate: LIGHT (cargo test -p aida-cli-lib --lib bug_home_038 plus make check-ci-fast). If the seat cannot open the PR, push and stop; the advisor handles it.
