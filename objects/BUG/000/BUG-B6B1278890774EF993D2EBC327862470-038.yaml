attention_reason:
  category: design-fork
  detail: 'Root cause differs from the spec''s premise, and both fixes change a security boundary with a recorded advisor ruling. FINDINGS: (a) No creation difference. Seats 021-041 and the parked 037 clone all have the same layout (real .git dir plus marker). Inside the seat, Claude''s sandbox already mounts .git/config, hooks/ and info/ read-only. (b) host_git_command (aida-core/src/git_ops.rs:136) refuses EVERY seat clone: seat_clone_detect::seat_clone_root matches by the aida-seat-* name, so the refusal text ''its git configuration and hooks are writable by the seat'' fires for any clone, host or seat. (c) In aida ship, ship::tracked_changes_pending (aida-cli-lib/src/ship.rs:185) treats that refusal as ''tracked changes pending''. So step 1 always runs, and its refuse_staged_sandbox_placeholders host-git call fails even on a clean tree. Reproduced in this seat: the tree is clean, yet ''aida ship <spec> --no-merge --dry-run'' plans ''1. commit uncommitted work''. Any seat clone that publishes through aida ship hits this; lanes that published presumably used raw git push and gh. FORK 1 (seat side): letting the ship prefix run git in its own clone means relaxing host_git_command''s BUG-2169 refusal (seat_clone.rs module doc: ''advisor signoff, condition 1''). The alternative leaves the refusal in place and only stops reporting it as dirty work, which still cannot commit. FORK 2 (host side): the spec asks that ''--from-seat fetches the commit''. seat_clone::salvage records the rule ''The host never fetches from the clone: that would run upload-pack in a repository the seat controls'' (TASK-2053). The publish path must either break that rule or go through a sandboxed bundle. The CLAUDE.md architecture rule requires a sketch plus advisor signoff before implementation.'
  lean: 'Seat side: in ship, stop reading a host-git refusal as dirty work (tracked_changes_pending should surface the refusal). Also allow the ship prefix''s git in a seat clone only when this process is proven contained by the filesystem: it cannot write <main>/.git, the same test as store_commit_deferred_to_host, never AIDA_CONTAINED. Run it through a seat_clone accessor, so the seat''s own config only ever runs inside its own sandbox. Host side: add ''aida ship --from-seat <clone>''. It verifies the clone (main_for / host_recorded_clone), runs the existing SALVAGE_BUNDLE_SCRIPT-style bundle of just the branch inside probe_sandbox_args, fetches the BUNDLE into main (never ''git fetch <clone>''), reports the clone''s config/hooks for audit, then pushes the branch from main and opens the PR. Tests: a unit test that a refusal is not ''pending''; a fixture seat clone with a planted hooks/pre-push and core.hooksPath, which --from-seat publishes without running the planted hook.'
