title: Some contained seat clones are flagged 'writable git config/hooks', so the lane can never publish (BUG-HOME-037 seats, twice)
description: '2026-10-30: two consecutive --fresh implementer seats for BUG-HOME-037 committed a fix, but `aida ship` refused to run git in the seat (''the seat can write to its git config and hooks''), and the host''s `aida ship` from the primary refused the same way. Other --fresh seats launched the same night (BUG-HOME-024, 034, 035, 036) published fine. The advisor inspected the clone''s .git/config (stock: core plus origin) and hooks (none), then published by fetching from the clone (PR-3133). Acceptance: (1) find why these seats were created with seat-writable git metadata (likely the clone''s .git is not made read-only for the seat, or a sandbox profile difference) and fix it at creation; (2) when the guard refuses, offer a host-side verified publish path: `aida ship --from-seat <clone>` inspects config and hooks and fetches the commit, and never runs the seat''s hooks; (3) test both.'
