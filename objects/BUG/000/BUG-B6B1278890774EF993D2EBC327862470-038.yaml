- id: 01a18de8-0623-7f83-bea7-4c762851a3f8
  author: joe
  content: 'Implemented per the 2026-10-30 ruling in commit d31debc0ce4, pushed to origin/bug-b6b1278890774ef993d2ebc327862470-038. The seat could not open the PR (gh pr create was denied in this seat), so the advisor needs to open it. Seat side: tracked_changes_pending returns a host-git refusal as its own error naming the clone. host_git_command allows git in a seat clone only when a write probe under the main checkout''s .git fails with EROFS/EACCES, and that git runs with hooks and fsmonitor off and no system or global config. Host side: aida ship --from-seat <clone> checks the lease, bundles inside the probe sandbox, verifies the bundle (exactly one ref, prerequisites present), fetches it into refs/aida/seat-import/<branch>, prints the diff stat and the config/hooks report, pushes and opens the PR. Gate LIGHT: cargo test bug_home_038 passes 6/6, including live bwrap end to end, and make check-ci-fast is green. Four s4_host_git_tests fail only inside the seat, because the path-isolated harness cannot create its HOME on a read-only filesystem (EROFS). That is environmental.'
