- id: 01a18d9a-34cb-7a72-b993-2d699c36fda6
  author: joe
  content: |
    ADVISOR RULING 2026-10-30 09:20 (BUG-HOME-038 design fork): SIGNED OFF, with these conditions. Implement both halves in ONE PR.

    Seat side:
    1. `tracked_changes_pending` must not count a host-git refusal as uncommitted work. Surface the refusal as its own error that names the clone.
    2. Allow git in the seat's own clone ONLY when containment is proven by capability: the process cannot open the primary checkout's `.git` for write (try an O_WRONLY|O_CREAT probe in a scratch path under it; EROFS/EACCES = contained). Never trust AIDA_CONTAINED or any other env var. Even then, run git with `-c core.hooksPath=/dev/null -c core.fsmonitor=false`, GIT_CONFIG_NOSYSTEM=1 and GIT_CONFIG_GLOBAL=/dev/null.

    Host side, `aida ship --from-seat <clone>`:
    3. Refuse unless the clone is a host-recorded seat (registry or lease), as you proposed.
    4. Create the bundle INSIDE the existing seat sandbox, with the same hardened git flags. Then the host runs `git bundle verify`. Accept the bundle only if it carries exactly ONE ref (the spec's branch) and its prerequisites already exist in the host repo.
    5. Fetch the bundle into a quarantine ref (refs/aida/seat-import/<branch>), never straight into refs/heads. Run `git diff --stat` against origin/main and print it, plus the clone's config/hooks report. Then push the quarantine commit to origin/<branch> and open the PR (title = the commit subject, body notes 'published from seat').
    6. The host never runs git with the clone as its repo or as a remote (TASK-2053 invariant stays).

    Tests: your two (a refusal is not pending work; a planted pre-push hook plus core.hooksPath that never runs), plus: a two-ref bundle is refused, and an unrecorded clone path is refused.
    Gate: LIGHT (one targeted cargo test plus make check-ci-fast). Trace: trace:BUG-HOME-038. If your own seat still cannot push, commit and stop; the advisor publishes.
