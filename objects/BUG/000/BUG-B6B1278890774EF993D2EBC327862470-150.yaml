title: 'aida deputy: a refused job''s result line names an .out file that is never written'
description: 'Observed 2026-10-31 ~15:10 (operator test of the deputy at main 584e95e): ''aida deputy submit --wait -- echo hello'' was correctly refused with exit 126 ''refused:exec-not-allowed (echo is not aida or an --allow-exec path)'', but the result line pointed at .aida/deputy/default/out/01a19404-2d99-....out and that file was never created. Expected: a refused job writes its refusal reason (policy rule, the argv, the remedy e.g. ''restart with aida deputy --allow-exec <path>'') to the .out file it names, so every result line''s path exists; the completion mail and ''aida awaiting'' failed-job entry (STORY-155) point at the same file. Acceptance: (1) a refused submit produces an .out file holding the refusal reason and remedy; (2) test: refused job, result line path exists and contains ''exec-not-allowed''; (3) an accepted job''s output file behaviour is unchanged. Related: STORY-HOME-099, STORY-HOME-155.'
