title: 'No supported re-review at the same head after the review contract changes: BUG-2530 refuses a duplicate review, so the advisor must push an empty commit (and pay a full CI run)'
description: '2026-11-13 04:50: promotion #3922 had CHANGES REQUESTED at c8bc6df only because review story STORY-2750 listed an inherited, already-completed TASK-3448 under Covers. After the advisor corrected the coverage, ''aida queue work PR-3922 --role reviewer --fresh'' refused (''already has a CHANGES REQUESTED verdict at this exact head; a duplicate review is unnecessary'', review_marker.rs refuse_conclusive_head). Workaround: an empty commit, which costs a full CI run. Want: an advisor-only ''--rereview <reason>'' that admits one fresh review at the same head when the review story changed after the verdict, recorded in the gate ledger. A related defect: auto-queue-review re-adds inherited, completed specs to a promotion''s Covers list.'
