- id: 01a1d739-477b-7e31-a26d-6af28fd943ac
  author: dirtlab
  content: |-
    ## Implementer notes (findings could not be filed: aida add refused — primary .git/aida-work-dispenser.toml is mode 0664)

    - **Shipped:** `aida queue work PR-N --role reviewer --rereview <reason>` (advisor seat only). Records a `rereview-admitted` gate-ledger event (head, reason, admitter, superseded verdict kind + recorded_at). The BUG-2530 duplicate-review refusal yields while that exact verdict is still the head's newest, so the next recorded verdict spends the admission. Grants no review/merge authority. Contained seats cannot write the ledger.
    - **Deviation:** the related defect (auto-queue-review re-adding inherited, completed specs to a promotion's Covers list) is NOT fixed here; needs its own spec.
    - **Design choice:** the "review story changed after the verdict" condition is not checked mechanically; the gate is advisor role + non-empty reason + a conclusive verdict carrying recorded_at.
    - **Compat:** binaries older than this change fail closed on the unknown ledger event kind (same posture as BUG-2548's manual-review-requested).
