id: 019df5d7-6215-7a00-aaa3-55baae9596f1
spec_id: BUG-1-040
title: Legacy Storage facade routes bulk ops through GitBackend::save() instead of update_requirement(), producing noisy chore commits and rewriting every YAML
description: |-
  **Symptom**

  Operations that logically affect a single requirement — `aida queue add/done`, `aida comment add`, `aida queue remove`, scaffolder operations — produce git commits that touch DOZENS of YAML files, with the subject 'chore: update requirements store'. Verified by running aida queue done and observing ~40 files modified in the resulting commit.

  **Root cause**

  The legacy Storage facade (aida-core/src/storage.rs) is what queue / comment / scaffold handlers use today. Its `update_atomically()` for git-canonical paths does:

    let backend = GitBackend::new(...);
    let mut store = backend.load()?;
    update_fn(&mut store);
    backend.save(&store)?;

  `backend.save(&store)` (aida-core/src/db/git_backend.rs:292) iterates every requirement in the store and writes every YAML, then auto-commits with 'chore: update requirements store'. The targeted path `backend.update_requirement(req)` (line 347) writes ONE YAML and commits with 'update SPEC-ID' — but the facade doesn't use it.

  **Consequences**

  1. Git history is dominated by chore commits — meaningful 'update FR-1-037' / 'add BUG-1-038' commits are buried.
  2. Every queue add / comment add does ~389 file writes + one git commit covering all of them. O(N) work for an O(1) operation, plus large cache rebuild surface.
  3. Serde re-serialization is non-deterministic in subtle ways (tag-set ordering, etc.) — bulk saves cause spurious 'modifications' that show up as drift in tools that compare bytes (e.g. BUG-0378's tags reordered from `[frontend, bugfix]` to `[bugfix, frontend]` in a chore commit even though no edit had been made).
  4. Surfaces this confused 'aida history' digest output — bulk-clustered timestamps that misled the user (worked around in BUG-1-039 by sorting on YAML modified_at, but the underlying churn is the real fix).

  **Affected handlers in aida-cli/src/main.rs**

  Anything that takes `storage: &Storage` and calls `storage.update_atomically(...)`:

  - handle_queue_command (queue add / remove / move / clear / done) — many sites
  - handle_comment_command (the legacy fallback path)
  - scaffold apply (writes settings.json + skill files via Storage)
  - conflict-detection paths in storage.rs (save_with_conflict_detection)

  **Fix options**

  1. **Plumb GitBackend through directly.** For each operation that touches one specific requirement, call `backend.update_requirement(req)` instead of `backend.save(&store)`. This is the EPIC-1-001 endgame — replace the Storage facade with direct GitBackend usage in the git-canonical path. Aligns with the `Phase 3 hard-cut` note on EPIC-1-001.
  2. **Targeted bulk-save.** If multiple requirements need updating in one operation, write only the affected files instead of all 389. `update_atomically`'s closure could expose which IDs were touched and `save()` could iterate only those.
  3. **Serde stability.** Independent of (1) and (2): make YAML serialization deterministic so spurious 'modifications' from bulk re-saves stop happening. Use a stable serializer config (BTreeSet for tags so ordering is fixed, etc.).

  Recommended: (3) is small and high-leverage (also helps BUG-1-036's hooks-rs / templates drift problem); then (1) progressively as part of EPIC-1-001 Phase 3.

  **Related**

  - BUG-1-036 (hooks.rs Rust strings drifted from templates/hooks/ — same class of "two paths to write the same thing")
  - BUG-1-039 (aida history digest workaround that surfaced this)
  - EPIC-1-001 (storage refactor; this is one of its endgame motivations)
