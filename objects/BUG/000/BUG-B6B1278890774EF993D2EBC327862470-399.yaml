title: 'Promotion squash auto-completes specs the PR does not claim: auto-bump reads every constituent commit trailer in the squash body (BUG-2531 completed by #4128, which claimed only TASK-3797)'
description: 'Train #4157 squash-merged #4128 (promotion 15) as b4c4b98. Its PR body was narrowed after review to claim TASK-3797 only (Refs BUG-2531), but the squash body lists ~70 constituent commit subjects, several ending in (BUG-2531) from earlier integration rounds (later reverted). aida auto-bump (multi-spec body scanning added by BUG-1590) completed BUG-2531 at b4c4b98. The advisor reopened it at 07:15 with --force; its round 2 is #4156 for promotion 17. Expected: a promotion or train squash completes only the specs its PR claims (PR-body claims or subject trailer); constituent body lines are references. Acceptance: (1) the squash body of a promotion/train carries no completing trailers for unclaimed specs, or auto-bump ignores constituent lines when the PR declares claims; (2) a regression test with a narrowed-claims promotion whose body mentions another spec; (3) a guard that flags any auto-complete of a spec with an open PR or In Progress round.'
