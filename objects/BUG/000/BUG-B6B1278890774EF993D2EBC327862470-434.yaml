title: 'BUG-2564 follow-up: retained review-handoff files are validated by path then reopened (TOCTOU: symlink, FIFO and hardlink swap); validate the opened fd instead'
description: |
  Deferred from the #4239 (promotion 19, BUG-2564) review, P2, by advisor ruling at the 4-round cap.

  read_private (aida-cli-lib/src/review_draft.rs:431-445) validates symlink_metadata(path), then calls a separate blocking File::open(path). If the path is replaced in between, it can follow a symlink, read a different inode with an unchecked uid, mode or link count, or block on a FIFO. Retained parent directories are followed the same way.

  Exploiting this requires write access to the user's own .aida/review-handoffs tree, so it's hardening, not an open privilege boundary.

  Acceptance: open with O_NOFOLLOW|O_NONBLOCK|O_CLOEXEC, validate uid, mode, nlink and file type via fstat on the opened fd, refuse non-regular files, and walk the parent dirs with openat/O_NOFOLLOW (or an equivalent dirfd walk). Regressions cover a symlink swap, a FIFO and a hardlink.
