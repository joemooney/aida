- id: 019eebcc-fa58-78f2-87c1-a9f595fc9c82
  author: joe
  content: 'REJECTED after verifying against code (not inference — the original filing was an inferred mechanism, which was wrong). The Done/InProgress->Completed auto-bump (auto_bump_done_to_completed, main.rs) scans the commit MESSAGE subject via push_paren_spec_ids_from_line — it NEVER reads the diff or trace: comments. Root cause: my squash-merge subject was the PR title "...rule-adherence study (SPIKE-67 slice 1) (#1078)". By BUG-546s DELIBERATE design, a paren group that LEADS with a spec-id is a completion trailer even with trailing prose (the canonical example in the BUG-546 comment is literally "(TASK-800 / STORY-610 slice 1a)"); the parser walks right-to-left, skips the (#1078) PR-number group, and harvests SPIKE-67 from (SPIKE-67 slice 1). So the system did exactly what AIDAs trailer convention says: that paren MEANS "this PR completes SPIKE-67." This is operator error (a known PR-title-paren vector already in CLAUDE.md discipline + advisor memory), not a code defect. No narrowing is defensible — it would regress BUG-546s multi-spec+prose trailers. Prevention: keep a non-completing umbrella id OUT of PR-title parens; if you must name the slice, write it as bare prose ("SPIKE-67 slice 1") or parenthesize only the completing child (TASK-890).'
