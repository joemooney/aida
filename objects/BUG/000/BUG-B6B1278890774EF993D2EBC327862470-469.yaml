title: 'Reviewers approve with non-blocking follow-ups, but the draft handoff refuses approval with findings: two full reviews recorded nothing today'
description: |
  Reviewers write an APPROVED draft that carries non-blocking follow-up findings (p2, p3, test-gap, style; "no finding is in an active blocking class ... follow-ups recorded"), but the draft handoff refuses it: "cannot record approved: unresolved review findings require request-changes". No verdict is recorded and the PR stalls until the advisor converts the draft into a rework brief by hand. Seen twice on 2026-11-20: #4364 r2 (5 findings) and #4377 r2 (5 findings), each a full Fable review with no recorded result.

  The reviewer guidance (the aida-review skill and blocking tiers) and the record gate disagree. Pick ONE contract and make both sides match:
  (a) the gate accepts APPROVED with non-blocking findings and files them as follow-ups (the deferred-finding path that already exists for mixed refusals), or
  (b) the skill tells reviewers that any finding means request-changes, and the draft validator rejects the contradiction BEFORE the reviewer exits (an in-session error that it can fix), not at launcher collection.

  Acceptance: AC1 one documented contract in the skill template plus the gate; AC2 a reviewer draft that violates it is refused while the reviewer is still running (validation at draft write), with a message telling it what to change; AC3 regression covering an approved draft with p3 and style findings, under the chosen contract.
