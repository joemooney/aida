  content: |-
    ## Implementer self-review
    Reviewed HEAD: acb62fdfa138cdb6c736d49d4b6ef3f8be4b4886

    Contract (advisor ruling, option b): any unresolved finding means request-changes; an approved draft may carry only findings the recorder files as deferred follow-ups. Recorder behaviour unchanged.

    Acceptance evidence
    - AC1 [evidence: documentation-inspection] aida-core/templates/skills/aida-review.md states the contract in 'Derive the verdict' and the standalone draft paragraph; the launch prompt (review_draft.rs LaunchDraft::prompt) and docs/cli/04-git-lifecycle.md say the same; the gate side is the existing recorder refusal, which the new check reuses (apply_policy + incoming_disposition).
    - AC2 [evidence: behavioral-test] new read-only 'aida review check-draft PATH [--pr N] [--sha SHA]' run by the reviewer after every draft write; bug_2707_approved_draft_with_unresolved_findings_is_refused_at_write asserts the refusal names the findings and both fixes; bug_2707_check_applies_the_schema_and_launch_binding covers the schema, launch binding and the prompt instruction.
    - AC3 [evidence: behavioral-test] bug_2707_check_and_recorder_agree_on_approved_with_findings: approved + plain p3/style findings is refused by the check and by the recorder (nothing recorded); the deferred approval passes the check and is recorded Approved. bug_2707_consistent_drafts_pass_the_check and bug_2707_unreadable_policy_refuses_even_a_deferred_approval cover the list-in-force and fail-closed policies.

    Validation: lane jobs passed: bug_2707 (5), review_draft:: + story_1728 + bug_015_spec_arg (47), aida-cli bug_1502_format_json_audit (14); help golden regenerated. Fast source gates run one at a time (60s tool cap): 45 of 48 pass; 'Containment conformance evidence tests', 'Store mutation channel tests' and 'Self-hosted routing security fixtures' fail in this seat sandbox with PermissionError / read-only /tmp in their own fixtures, in files this change does not touch. check-store-writers.py passes. The cargo ratchet half of check-ci-fast was not run as a whole.

    Probe findings / fixes: rustfmt drift fixed before push. Strict tier: the change adds a refusal-side check only; no path grants or relaxes authority, no existing test weakened; parse_draft keeps LaunchDraft::read's checks and messages.

    Residual risks
    - The check is enforced by instruction (prompt + skill), not mechanically: a reviewer that skips it still meets the recorder's refusal after exit, with the older message.
    - The check reads the blocking-class list from the reviewer checkout's local default-branch ref; if that lags the primary checkout, check and recorder can decide differently for a list changed in between.
    - The launcher still retries a deterministic approval refusal three times before giving up.
