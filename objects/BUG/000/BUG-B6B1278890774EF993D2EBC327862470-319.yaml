- id: 01a1d807-1c21-7e71-a2a2-5ec8e8163102
  author: joe
  content: 'PR-3952 rework (round 2), new head 86e744d807f1 (merged origin/integration first). (1) P1 incomplete start points: FIXED. Tips now come from ''git rev-list --all --no-walk'', the same start set as ''git log --all'' (other worktrees'' detached HEADs included); a rebuild walks exactly those listed tips. Test: bug_2554_a_detached_worktree_commit_refreshes_a_warm_index. (2) P1 swallowed HEAD errors: FIXED. The separate HEAD probe is gone; any failure listing start points propagates as an error and the gate refuses. Test: bug_2554_a_failing_start_point_probe_refuses_not_reuses. (3) P1 unbounded tip validation: FIXED. The anchor check is ''rev-list --no-walk --ignore-missing <anchors>'' on argv (no stdin), so it runs under AIDA_STORE_HISTORY_TIMEOUT_SECS. Test: bug_2554_a_stalled_anchor_check_times_out (also stalls any --batch-check). (4) P2 lost GC anchors: FIXED. tips are now anchors for every retained history; an incremental refresh keeps merge-base --independent(old anchors + new tips) plus the live tips; every read validates them, and a missing one rebuilds. INDEX_VERSION is now 2, so v1 indexes rebuild. Test: bug_2554_a_deleted_ref_collected_after_a_refresh_rebuilds. Extra hardening: an anchor that is not a 40- or 64-hex object name counts as a corrupt index and rebuilds (anchors go onto git argv). (5) P2 refresh lock: LISTED AS NON-BLOCKING, for the advisor to rule. Concurrent refreshes cost duplicate walks but give the same answer: each write is atomic and self-consistent, and a lost write just re-walks. A lock file would add a new store-writers.toml sink (inventory change), which this brief forbids. Suggest a follow-up. Tests (dell1): 118 passed, 0 failed (bug_2554, bug_2179, task_1951, task_2238, story_2326, resolve_aida_exe_tests, store_writer). make check-ci-fast: 47 gates passed.'
