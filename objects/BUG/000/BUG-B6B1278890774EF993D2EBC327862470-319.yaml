title: Train gate's store_history_alias_map runs git log --all -p -G over the whole store history and blocks the train for 10+ min under disk pressure
description: 'Observed 2026-11-13 03:57-04:10 (advisor). Train #3941 (#3917+#3928) went green at 03:57, then sat in journal step Gate for more than 10 minutes. Its child was ''git log --all --format= -p --unified=0 --find-renames -l0 --regexp-ignore-case -G^(spec_id|agreed_id): *[...](STORY-HOME-096|TASK-1-108)[...] -- objects/'' in the store repo, in D state, with host IO pressure some avg10 about 55%. Source: aida-cli-lib/src/mandate.rs store_history_alias_map (TASK-1800 / BUG-2179), which resolves legacy or agreed IDs by patch-walking every version of every object on every ref. Cost grows with store history, runs on every train gate, and competes with lanes and cargo for disk. Acceptance: (1) alias resolution answers from an index (the cache DB, or a persisted alias map keyed by spec_id/agreed_id updated on write or pull) and reaches git history only on an index miss for an ID that is genuinely absent; (2) a train gate whose members name no legacy or deleted IDs performs no history walk; (3) a bounded walk (by time or ref set) with a clear refusal remains the fallback; (4) a regression proving the gate on a store with long history finishes without a full -p walk. Keep BUG-2179''s correctness: a deleted spec named by its agreed_id is still found.'
