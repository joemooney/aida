- id: 01a1d4b0-8cea-7582-982a-75be8eddd92e
  author: joe
  content: 'ADVISOR SIGNOFF (2026-11-13 04:35): sketch approved as written. Conditions: (1) a corrupt, unparsable or version-skewed index, or any doubt, falls back to the full walk (fail closed, never ''no aliases''); (2) the index lives only in the git common dir (never tracked or pushed), and refresh plus rebuild stay under AIDA_STORE_HISTORY_TIMEOUT_SECS; (3) the AC4 equality test compares index answers with full-walk answers on the long-history fixture, including the BUG-2179 deleted-by-agreed_id case. Reason: both walks cost every train about 20 minutes tonight, and the index judges exactly what the walks judge. Route: integration track, after BUG-2556 (a one-line train-recovery consent fix).'
