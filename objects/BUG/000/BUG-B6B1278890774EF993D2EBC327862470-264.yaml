  content: 'Implementation: dev builds now supply full HEAD as a stable Cargo fingerprint input; the shared CLI/server stamp helper watches it while still reading the actual stamp from Git. Added a real-Cargo fixture covering fast-forward restamping with stale metadata mtimes, both ordinary and incremental-clean builds, plus warm unchanged-HEAD repeats. Updated docs/cli/11-dev.md. Validation: all 44 non-compile fast gates passed; feature-disabled CLI check and complete TUI seam guard passed using lane-runner agent-profile compile jobs. Two test-harness builds hit the seeded-target 900s timeout before test execution; targeted retry j20261108T205116308-2-0 is running with the permitted 3600s override. Edits remain uncommitted for the native host launcher. Codegraph database was unavailable in both lane and primary checkout; call sites verified with rg.'
