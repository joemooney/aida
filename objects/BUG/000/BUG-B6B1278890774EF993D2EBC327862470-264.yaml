title: aida dev build --clean keeps a stale AIDA_BUILD_GIT_SHA stamp, so promotion refuses until --clean=full
description: 'On dell1 2026-11-08, after a fast-forward to 48e3865999, aida dev build and aida dev build --clean both produced a binary stamped sha efdcfc64cf built 2026-11-07 16:42, and promotion refused it (''staged build does not match HEAD''). --clean=full fixed it. Expected: a ff merge or --clean re-stamps the binary.'
