title: Store sync wedges mid-rebase under GIT_EDITOR=false, fast-forward pull prints false conflicts, and db sync leaves the cache stale
description: |-
  Three defects in aida db sync on the git store (BUG-MN-001, -003, -005). (1) pull_rebase_auto_merge and rebase_onto_auto_merge in aida-core/src/git_ops.rs run 'git rebase --continue' without overriding the editor, so a caller with GIT_EDITOR=false leaves .aida-store mid-rebase. (2) db_sync_local_window runs detect_store_conflicts even on a Clean fast-forward pull, so normal incoming updates print 'Conflicts detected'; auto-merged notes print as 'auto-merged auto-merged'. (3) DbCommand::Sync never refreshes the cache after moving the store HEAD, so the next read is stale. Acceptance: the harness scenarios S3 and S6 pass under --strict; a regression test per defect (rebase continue with GIT_EDITOR=false completes; FF pull prints no conflict banner; cache source_head equals store HEAD after db sync).

  Source: aida-multinode audit 2026-11-15 (~/ai/aida-multinode/docs/UPSTREAM-REPORT.md). Candidate fix already exists on branch fix/multinode-sync-bugs (worktree ~/ai/aida-multinode-fixes, base 6f0d951, 7 behind main); commits carry [AI:antigravity] and BUG-MN-* ids, so a lane must re-trailer with this spec id and run our CI, not trust the report's local test run. Harness: ~/ai/aida-multinode/harness/run_multinode_suite.sh --aida-bin <bin> --strict.
