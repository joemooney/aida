spec_id: BUG-32
title: scaffold's statusLine command emits no color in Claude Code (missing --color=always)
description: |-
  **Reported in chat 2026-05-05:** ~/ai/paradox shows the new statusline format (project · role · @SPEC, q omitted, cache:fresh hidden) but no color. Cause: the scaffolder's statusLine.command was 'aida statusline 2>/dev/null || printf...', which uses the default --color=auto. Claude Code's statusLine consumer pipes via shell (no TTY), so auto-detect drops color. Result: plain text in the prompt even though Claude Code DOES render ANSI from statusLine output.

  **Fix:** scaffolder constant STATUSLINE_COMMAND now includes --color=always. Fresh inits get colored output automatically.

  **Existing projects:** need a manual edit to their .claude/settings.json (add --color=always to the statusLine.command). Or wait for the managed-merge slot-merge from FR-1-028 v2 (would patch the AIDA-owned slots in place without disturbing the user's other settings). Manual workaround documented in the chat.
