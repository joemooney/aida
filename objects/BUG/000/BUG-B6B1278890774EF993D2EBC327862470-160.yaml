  detail: 'The advisor disposition requires a sketch and independent advisor signoff before any code, and says to sequence this after BUG-2385/BUG-2387 (both still in progress). The sketch is posted as a comment. The unresolved fork: headless Codex ignores AIDA''s pre-minted --session-id and creates its own thread id, so resume needs that id bound to the AIDA session. The options are parsing thread.started from the headless stream, scanning ~/.codex/sessions rollouts, or both. A recommended choice also adds vendor_session_id to the lease/session record, which is a data-model change.'
  lean: 'Treat the stream-parsed thread id as canonical and fall back to a rollout scan by cwd and start time, refusing when the match is ambiguous. Store it as vendor_session_id on the lease record. Split into three PRs: shared resume contract + session resume + containment, then headless/punt/bg, then role offer/TUI.'
