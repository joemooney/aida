    Findings:
    1. [major] codex_resume.rs:162 unique_rollout_in / session.rs:5668 + phase_driver_trait.rs:3256(resolve_headless_resume_id(...,None)): every production caller passes since: None, so the advisor-ruled rollout fallback ('started in the tree since its launch') is never time-bounded. When a lane worktree path is reused (same spec re-claimed) and the lease stamp + headless log are missing, the ONE old rollout from the previous lane is resumed — the wrong thread. Thread the lease's started_at (or launch time) into ThreadLookup.since and add a test where only a pre-launch rollout exists and the lookup refuses.
    2. [major] codex_resume.rs:142 recorded_resume (used by queue_cmd.rs:11645/13512/13604/13986/14009 for every queue work --resume): skips the canonical lease stamp vendor_session_id and the rollout fallback, and treats any id it cannot place as a Claude session. An AIDA session id of a Codex lane whose headless log is gone/rotated (but whose lease is stamped) passes require_resume_vendor as Claude and runs claude --resume on a non-Claude id instead of resuming the thread or refusing with a named error (sketch/ruling: missing or ambiguous refuses). Resolve via the lease (resolve_thread_id) and refuse instead of defaulting to Claude when nothing matches.
    3. [major] tests: the refusal, routing and containment paths have no tests (strict tier, Probe 5). Missing: require_resume_vendor refusing a recorded vendor that [agents] enabled disables (session.rs:2921); recorded_resume classification (rollout id -> Codex, log-bound AIDA id -> Codex thread, unknown id); spawn_vendor_headless_resume_granted Codex arm (grant env, AIDA_SESSION_ROLE, AIDA_CONTAINED removed, native posture, agy refusal); punt-resume picking implementer_vendor over config (phase_driver_trait.rs:3253); exec_resume_command codex building/execing a Command rather than printing; a contained parent resuming an opted-in Codex session successfully with native sandbox flags and no bypass. The approved sketch listed most of these.
    4. [minor] session.rs:2320 build_codex_resume_command derives containment only from drain_contained (AIDA_CONTAINED / [agents] contained) and has no contained parameter, so containment asked for with queue work --sandbox is dropped: run_standalone_reviewer's Codex resume (queue_cmd.rs:14018) and the interactive implementer resume (queue_cmd.rs:13526) launch codex resume without --sandbox workspace-write when only the flag requested containment. Pass the caller's contained into the builder (OR it with drain_contained) and test it.
    5. [minor] role_cmd.rs:563 role_resume_shell_line emits a raw codex resume '<id>' eval line, which skips the posture/containment resolution and the contained-parent refusal in build_codex_resume_command; under a contained or bypass-configured seat the offered resume runs on Codex's default posture. The TUI and aida-tui wrapper were moved to aida session resume <id> for exactly this reason; the role-enter offer should emit aida session resume '<id>' too (or at least for codex).
    6. [cosmetic] session.rs:6556 codex_entries() (which session list/resume, queue work --list-sessions and role enter pickers enumerate) hard-codes ~/.codex/sessions, while recorded_resume/find_rollout/codex_resume_cwd use vendor_activity::codex_sessions_root() and honour AIDA_CODEX_SESSIONS_DIR. With the override set, the pickers list ids that classification cannot place (they fall through to Claude, see the recorded_resume finding). Use codex_sessions_root() in codex_entries.
