    Probe findings / residual risks:
    - Finding 3, partly disputed: the ship fixture does not carry an approved PR through to a forge merge. In pr_ship_with_method_and_dispatch_ctx, admission is acquired before any PR evidence is read, so approval cannot affect admission. The fixture stops the real handler at its next step (detached HEAD, no ship lease); no admission refusal can produce that error.
    - Settlement while yielded may still send the supersede protocol's TERM/KILL to an obsolete-head review, exactly as a normal pass would. It never launches.
    - Claim/intent cleanup removes its own file without the serializer after 500ms. Readers skip vanished files, and the flock remains the authority.
    - acquire() for loop controllers now refuses busy after 1s of serializer contention instead of blocking. Callers already treat busy as wait or yield.
