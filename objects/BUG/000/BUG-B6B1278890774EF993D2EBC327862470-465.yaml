  content: |-
    ## Implementer self-review
    Reviewed HEAD: 634d82e8e4 (round 2 of PR #4363, against origin/main...HEAD).

    Acceptance evidence (round-2 findings):
    1. Serializer inside the deadline: admission_owner.rs lock_serial/Deadline. Preflight (train_mode), acquire_mode, register_intent, IntentGuard/Claim drop and yield_reason all use bounded try-lock retries. At expiry the typed busy refusal names the holder (from /proc/locks) and the time waited. Test: admission_owner::tests::bug2703_stalled_serializer_holder_cannot_outlast_the_bound, where a separate process holds receipts.lock. With wait_secs=1 the ship refuses in [1s,3s) naming the holder PID; wait_secs=0 refuses within 1s plus slack; a stall after the intent is registered returns by about bound+0.5s and removes the intent.
    2. Settlement while yielded: review_watch.rs settle_while_yielded (prune over every recorded key, then advance every superseding attempt; no discovery and no launch).
    3. Production path: review_watch::tests::bug2703_real_worker_loops_yield_to_the_real_ship_handler runs the real run_with_program loop, train::run_passes (the loop behind train::run) around a controlled pass, and the real pr_ship_handler. In flight: a running review, a claimed superseding review and a train pass. Nothing is signalled or cut short (exit 0, pass completes). The ship crosses admission within its bound only because the yielded watcher settles the superseding attempt.
