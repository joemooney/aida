    ## Implementer self-review
    Reviewed HEAD: 36e1d02a7a (git diff origin/main...HEAD).

    Design (AC1 offered either option; implemented both, as one coherent mechanism — no fork): writer-preference intent files (*.intent) under .aida/admission-owner/ + loop workers hold the shared claim per pass and release at pass boundaries/idle when an intent or drain applies.

    Acceptance evidence:
    - AC1 [behavioral-test]: admission_owner::tests::bug2703_waiting_exclusive_gets_in_once_shared_holders_yield (new shared claims refused while an exclusive waits; holder sees yield reason; exclusive gets in once it yields). Workers: review_watch::hold_admission/idle_yielding, advisor_loop_train::hold_admission/idle.
    - AC2 [behavioral-test]: bug2703_bounded_wait_gives_up_naming_holders_and_wait (holders + 'gave up after waiting Ns (bound Ns)'); bug2703_wait_bound_config ([admission] wait_secs, default 180, 0..=3600).
    - AC3 [behavioral-test]: review_watch::tests::bug2703_ship_gets_admission_while_both_loop_workers_run (both workers' real claim/yield functions looping in threads; ship_admission — the exact call pr ship makes — acquires within bound; loops resume after). Control: bug2703_ship_wait_never_interrupts_a_review_or_train_in_progress (in-flight review attempt untouched, ship gives up 'not quiescent'; a train pass keeps its claim).
    - AC4 [behavioral-test]: admission_drain tests (audited actor/reason, bounded 24h, auto-expiry journaled, unreadable = drained); loop_tests::bug2703_drain_holds_the_supervisor_respawn (no launch while drained, unreadable journal refuses, launches after resume); bug2703_status_shows_claim_age_drain_and_waiters.
    - 21:47 AC (human ship/train while loops up) [behavioral-test]: bug2703_manual_train_waits_for_the_auto_train_only + ship test above.

    Probe findings fixed during review: drain journal first named drain.json would have been parsed as a claim receipt by every admission (renamed loops-drain.journal); holders() lock-free scan now skips a receipt removed mid-scan; review-watch no longer exits (and alerts) when it starts while drained — it starts yielded.

    Strict-tier: intents/drain only WITHHOLD shared claims, never grant; exclusive still needs flock + quiescence + no train/children. Fail-closed: unreadable/malformed/over-long intent refuses shared claims and tells holders to yield; unreadable drain refuses Legacy claims and blocks respawn (counted refusal); bad wait config refuses the ship. No existing test weakened; one fixture (story2857_cross_process_worker_blocks_land_and_manual) sets wait_secs=1 so the manual-train refusal stays fast.

    Residual risks: ship now waits (default 3 min) instead of refusing at once; a long in-flight review can still outlast the bound (reported with holders). Older loop binaries ignore intents until upgraded. A drained review-watch reports status 'degraded' with 'admission yielded: drained…' (intentional visibility). Local validation: targeted cargo tests (38 pass), fmt, store-writers, trace-header, glyph, crate-glob, exec-context, structural guards; full make check-ci-fast could not complete inside this lane's 60s tool cap — CI is the evidence.
