  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2703):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 634d82e8e4df
    Recorded: 2026-11-20T18:59:11.929663916+00:00
    Findings:
    1. [blocking_tier: untested-path | severity: minor | file: aida-cli-lib/src/admission_drain.rs] The new authority-gated controls `aida advisor loops drain` and `resume` (admission_drain.rs drain()/resume() -> review_watch_pause.rs control_actor) have no test of their refusal path. Every drain test either calls fixture_drain/change (which bypass control_actor) or runs resume as a seated advisor. No test in the crate asserts that control_actor refuses (the string 'requires an advisor grant or an unseated operator' is asserted nowhere, for pause or drain). A mutation that makes control_actor accept any seat, or that drops the call from drain()/resume(), survives the suite, so an implementer or reviewer seat could withhold both loops' claims and hold the supervisor's respawn for up to 24h undetected. Add a test that drain() and resume() refuse for (a) a valid non-advisor grant and (b) a seated session with no grant, and leave the journal unwritten. This also covers ac00712a's 'audited' claim for the refusal side.
    2. [blocking_tier: p2 | severity: minor | file: aida-cli-lib/src/admission_owner.rs register_intent/intents] A truncated or empty `.intent` file wedges all admission with no expiry and no recovery command. register_intent writes with std::fs::write (not atomic) and only builds the IntentGuard after the write succeeds, so an ENOSPC or a SIGKILL between create and write leaves a zero-length `<token>.intent` that nothing owns. intents() treats an unparsable intent as a hard, non-busy error for every mode, and it can never reach the expires_at/dead-requester cleanup because it does not parse. Result: every ship, land and manual train refuses at once with a non-busy error, and yield_reason reports 'admission evidence unreadable' so both loop workers stay yielded, until an operator deletes the file by hand. Write the intent via temp file + rename, remove the file when the write fails, and consider discarding an unparsable intent older than MAX_WAIT_SECS + slack by mtime.
    3. [blocking_tier: p2 | severity: minor | file: aida-cli-lib/src/admission_owner.rs acquire_mode / aida-cli-lib/src/review_watch.rs hold_admission] Review-watch loses its coexistence with a manual cooperative train (BUG-2650) once it has yielded. Before this change the watcher kept its claim for its lifetime; now any exclusive intent (an `aida pr ship` attempted during a manual train, which waits its bound and gives up) or a drain makes the watcher drop the claim, and its re-acquire then hits `!joining_train && admission_train_running(root)` in acquire_mode, because joining_train recognises only a live 'legacy auto-train' receipt, not 'cooperative manual train'. The watcher therefore records 'admission yielded' and launches no reviews until the manual train ends. This rests on admission_train_running being true for the whole of a manual train run, which I did not execute. Let a review-watch re-acquire join a live cooperative manual train as it joins the auto-train, and add a test: watcher holds, manual train runs, a ship intent comes and goes, watcher retakes its claim.
    4. [blocking_tier: p3 | severity: minor | file: aida-cli-lib/src/admission_owner.rs receipts/intents] `std::fs::remove_file(path)?` in receipts() and intents() turns a NotFound into a hard non-busy error. This change makes that race reachable: Claim::drop and IntentGuard::drop now remove their file without the serializer after CLEANUP_GRACE, so a reader that has already read the body, then observes the owner dead or the intent expired, can find the file gone. The error aborts a waiting ship/land at once instead of retrying, and stops a watcher's re-acquire. Ignore NotFound on both removals, as the read side already does.
    5. [blocking_tier: p3 | severity: minor | class: test-gap | file: aida-cli-lib/src/admission_owner.rs holders] holders() reads receipts and intents without the serializer, but both are written with non-atomic std::fs::write, so a read between create and write sees an empty file and the whole listing fails with a parse error. `aida advisor loops status` then shows every claim as 'unreadable' for that instant, and the tests' polling helper bug2703_loop_claims (task_1993_review_watch_tests.rs) calls holders().unwrap() every 50ms while worker threads take claims, which is a low-probability flake. The doc comment says an unparsable receipt 'is reported, not trusted', but the code fails the whole call. Skip or individually report an unparsable row, or write receipts atomically.
    6. [blocking_tier: p3 | severity: cosmetic | class: test-gap | file: aida-cli-lib/src/admission_owner.rs tests] bug2703_stalled_serializer_holder_cannot_outlast_the_bound asserts that the refusal names `PID <child>` taken from /proc/locks, which the code itself documents as best effort. Where the temp directory's st_dev differs from the device /proc/locks prints (btrfs subvolume, overlayfs lane overlay) serial_holder returns 'a process whose PID is unknown' and the test fails although the bounded-wait behaviour is correct. The same test and bug2703_bounded_wait_gives_up_naming_holders_and_wait also assert exact whole-second wait strings and sub-second upper bounds, which are sensitive to a loaded runner. Keep the PID assertion in the pure parser test (bug2703_flock_holders_parses_proc_locks) and assert only 'receipt serializer is held by' plus the bound here.
    7. [blocking_tier: p3 | severity: cosmetic | file: aida-cli-lib/src/advisor_loop_train.rs run_passes] A yielded auto-train pass is logged as 'auto-train: not running: the landing policy is unknown (admission is not held (admission yielded: ...))'. The yield is routed through the stand_down Err arm of auto_train_pass, whose wording is about an unreadable landing policy, so the service log misstates why the pass did not run during every drain or waiting ship. Give the yielded case its own line.
    8. [blocking_tier: p3 | severity: cosmetic | file: aida-cli-lib/src/review_watch.rs run_with_program] forge::sweep_probe_refs now runs only when the watcher holds its claim at startup. A watcher that starts while drained or while a ship waits skips the sweep and never runs it later, so leaked probe refs stay until the next worker restart. Run the sweep the first time the claim is taken.
    9. [blocking_tier: style | severity: cosmetic | file: aida-cli-lib/src/tests/task_1993_review_watch_tests.rs] The new tests carry only `trace:BUG-2703` comments, not the acceptance-criterion ids, so `aida criteria` still lists all four criteria (ac6ca3ea, ac336622, acc625bf, ac00712a) as untraced although each has a test. Add the criterion ids to the trace comments of the tests that prove them.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
