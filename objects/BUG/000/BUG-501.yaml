title: MCP 'setup issue' warning recurs in every AIDA worktree — pre-approve the aida server in scaffolded settings (extend BUG-484 to worktrees)
description: 'Operator-observed 2026-06-11: every ''--zen'' / ''aida session start'' worktree launches a Claude Code session that warns ''⚠ 1 setup issue: MCP · /doctor''. Cause: .mcp.json registers the ''aida'' server (aida mcp-serve), Claude Code approves MCP servers PER PROJECT PATH, and each fresh worktree is a NEW project path → the server is unapproved there. Non-blocking (sessions work fine via the CLI), but it''s persistent noise in the worktree-heavy supervised-build workflow. BUG-484 (Completed) fixed the fresh-''aida init'' version but NOT worktrees, which AIDA''s session machinery creates on every pickup. Fix: add ''"enabledMcpjsonServers": ["aida"]'' to the scaffolded .claude/settings.json (master: aida-core/templates/settings.json) — pre-approves ONLY the trusted aida server (not a blanket enableAllProjectMcpServers), and worktrees inherit it because they check out the same .claude/ dir. Verify the warning is gone in a fresh ''aida session start'' worktree. Reconcile with whatever BUG-484 did for init (avoid double-approval). If the scaffolded server name differs downstream, key the entry off the actual .mcp.json server name.'
