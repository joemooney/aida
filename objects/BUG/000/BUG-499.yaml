title: burndown plan 'awaiting sign-off' hint should clarify that 'aida queue add' IS the advisor sign-off (role-gated), not a generic human action
description: 'Operator-surfaced 2026-06-11: ''aida burndown plan'' prints ''Awaiting sign-off (pickable, not queued — aida queue add <id> to bless)''. Reading it, the operator wondered whether running ''aida queue add'' is the HUMAN bypassing the advisor, or whether the advisor has already weighed in. The model: ''pickable'' = mechanical gate passed (no advisor judgment); ''queued'' = advisor sign-off (STORY-546), and ''aida queue add'' is GATED on advisor authority (TASK-647). So queueing IS the advisor sign-off, not a bypass — but the hint doesn''t say so, making a role-gated, meaningful act read like a casual human one. Fix: word the hint to make clear queueing = the advisor sign-off and requires advisor authority, e.g. ''the advisor blesses these into the drain with aida queue add <id> (advisor authority required)''. Pairs with the BUG-498 seat-vs-work clarity work.'
