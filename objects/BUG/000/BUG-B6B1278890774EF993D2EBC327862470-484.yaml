- id: 01a206fa-626a-7821-aab0-e9da49edc072
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2723):
    Verdict: CHANGES REQUESTED
    Reviewed commit: d8e61bb30d20
    Recorded: 2026-11-23T05:50:31.002831006+00:00
    Findings:
    1. BUG-2723 AC1, pr_train.rs:846–867 and :3459–3471. The train still discovers candidates and their aggregates from `gh pr checks`, which can omit a run's Build while showing its tier marker. On incident PR #4391, the current rollup shows Build only from the rerun FAST 45098448471, while the Actions jobs API returns successful FULL Build job 137454500342 from 45099774496 at e324ae3ea40778e0bfb75b245756439a2f132c45. In the reported red-FAST state the selector cannot prove replacement from those rows and retains the ghost failure. The early return also misses same-tier runs when the rollup shows a single marker. Read the pinned SHA's Actions run list and use the selected attempts' jobs as evidence.
    2. BUG-2723 AC1 and the round-two selection rule, pr_train.rs:850–870. The selector orders by run ID and only lets completed successes supersede rows. With two failures of the same tier, a stale test failure can turn the newest infrastructure-only cancellation into a code-red bisection. A newer in-progress run also leaves that stale failure actionable. Reruns reuse run IDs, so this ordering cannot select attempt-specific evidence. Select by workflow path and tier using run number and attempt, and classify the selected run's pending or terminal jobs.
    3. BUG-2723 AC1, land.rs:1523–1557 and pr_train_verified.rs:825–843. The train's selector is wired into only one of the three required evaluators. Landing still uses the rollup and retires only cancelled FAST runs, leaving a superseded failed FAST-only job actionable. The exact-tip recheck still uses `latest_per_name`, so a higher-ID FAST run sharing the Build name can hide every job from the FULL run. Use the same pinned workflow-and-tier selector in both paths and cover both tier orders.
    4. BUG-2723 AC2 and the round-two diagnostic rule, pr_train.rs:981–995 and pr_train_verified.rs:843. The train always prints `supersession unproven`, including when available metadata establishes that the blocker is the selected run, and omits attempt, tier and the actual conclusion. The exact-tip refusal still reports only check names. Preserve run ID, attempt, tier, conclusion and the established supersession outcome through the refusals.
    5. BUG-2723 round-two error rule, pr_train.rs:3460–3471. `gh_stdout(...).ok()?` discards forge and journal errors and JSON parsing discards its cause too. With a stale failed aggregate, incomplete selection then emits a normal red verdict that can bisect or eject a train. Propagate checkpoint errors and surface unreadable forge evidence as `TrainCiReadError` so the wait can retry a read failure.
    6. BUG-2723 gate coverage, tests/story_1690_train_tests.rs:6493–6532. The wrong-head fixture uses `wrong-head`, which fails SHA syntax validation even with the pinned-head equality check removed. Both candidates always share workflow, repository and branch. The fixture also always supplies both aggregate rows and misses the #4391 rerun, same-tier failures and unreadable evidence. Add valid distinct SHAs, independent identity mismatches, a newer FAST that cannot hide FULL, and a case exercising the real evidence selection when the rollup omits FULL Build.
    7. BUG-2723 AC4 coverage, docs/internal/testing/ci-test-shards.md:39. The docs include the requested wait-before-retoggle instruction. The round-two brief additionally requests a focused assertion for that instruction, which is absent from the landed diff.
