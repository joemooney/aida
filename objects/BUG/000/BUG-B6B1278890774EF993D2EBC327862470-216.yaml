  content: |-
    Round 2 validation is complete. All 20 affected CLI cases pass: bug_1947_session_end_live_process (11), bug_1952_session_end_from_worktree (3, including actual teardown with an unrelated unpublished host branch), bug_2205_session_end_pushed_index (1), story_1843_c2_session_end_retention (1), task_1283_protocol_cli (4). All 12 BUG-2450 regressions, 32 takeover tests and 43 watcher tests pass. cargo check -p aida-cli --no-default-features passed; all 8 Git maintenance ratchet tests, cargo fmt --all -- --check and git diff --check passed. Sandbox fixture setup now uses the existing namespace-qualified grant token format and explicitly trusts its own test process namespace. The warm-pool fixtures publish their generated baseline commit so they reach holder/salvage guards without an unrelated unpushed-baseline refusal. Production safety policy remains unchanged by those fixture adaptations.

    All three findings are addressed; none is disputed. Native-seat handoff: .git is read-only (git add failed creating index.lock), so this round's changes remain uncommitted in /home/joe/ai/aida-worktrees/aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-216. The launcher must create and push a NEW commit after this process exits; the previous 41d2e72ae1b4 commit does not count. Suggested subject: [AI:codex] fix(sessions): scope worktree guards and bound review retries (BUG-2450). PR #3408 is already open. No pr ship, review record, merge-hold clearance, or queue completion was attempted. Leave the spec in progress until the new commit is published. Final test logs: /tmp/bug2450-tests-final.log, /tmp/bug2450-takeover-final.log, /tmp/bug2450-watcher-final.log, /tmp/bug2450-pool-verified.log, /tmp/bug2450-bug_2205_session_end_pushed_index-verified.log, /tmp/bug2450-story_1843_c2_session_end_retention-verified.log, /tmp/bug2450-task_1283_protocol_cli-verified.log, /tmp/bug2450-no-default-final.log, /tmp/bug2450-ratchet-verified.log.
