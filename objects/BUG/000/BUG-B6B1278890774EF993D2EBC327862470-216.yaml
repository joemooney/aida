title: An exited implementer's lease blocks the reviewer launch for its PR until someone runs session end --force
description: 'Observed 2026-11-04 21:35: review watcher attempts for PR-3392 and PR-3367 failed: ''lease 01a1a9927f73 (implementer, seat ...-784) holds branch ... and its session has exited, but it was not ended automatically'' → queue work exit 1 → ''review of this head exited without completing''. The watcher then marked the head attempted and stopped retrying. The seats were clean and fully pushed. Acceptance: (1) when the holder''s session has exited and its seat is clean and pushed, the reviewer launch ends the lease itself (or the lane does on exit) and proceeds; (2) a dirty or unpushed seat still refuses and mails the advisor naming the lease; (3) a launch failure from a reclaimable lease doesn''t consume the head''s review attempt; (4) regression test.'
status: InProgress
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-05T04:41:04.196617281Z
modified_at: 2026-11-05T05:32:50.053214245Z
req_type: Bug
comments:
- id: 01a1aa05-1068-7553-b16c-23edf47a2495
  author: joe
  content: 'Related advisor incident 21:40: `aida session end --force` removed a seat whose only copy of commit 331d3a5de5f sat on a local branch with no upstream (BUG-2439 rework), and the commit was lost. Acceptance addition: session end (even --force) refuses when any commit reachable from the seat''s local branches or HEAD isn''t on a remote (rev-list HEAD --branches --not --remotes), unless an explicit --discard-unpushed is given. Upstream tracking config alone is not the test.'
  created_at: 2026-11-05T04:43:41.032416811Z
  modified_at: 2026-11-05T04:43:41.032416811Z
  session_id: 5bf140f7-38b2-4a04-9e8c-ccf69b1258f8
- id: 01a1aa18-490f-78e0-8047-93885d9cc604
  author: joe
  content: 'Implementation is pending in the native Codex seat: remote-reachability guard for session end (including --force), explicit --discard-unpushed CLI override, safe exited-lease takeover for all-pushed work and pushed staged indexes, advisor notices for refused dead seats, and watcher retries before reviewer spawn. Default and --no-default-features CLI checks passed; focused regression test binary is still building. The seat .git is read-only, so the documented host post-exit commit/from-seat publication path is required. No ship or review-record action was run.'
  created_at: 2026-11-05T05:04:40.719964830Z
  modified_at: 2026-11-05T05:04:40.719964830Z
