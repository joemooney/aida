    Reviewed HEAD: 215313b8d3a8089240cc87b0210136d9d5831fb1 plus uncommitted queue_cmd/work.rs. The merge-base diff was empty and there were no untracked additions.
    AC1: [evidence: behavioral-test] Unimplemented. Moving a clone and ending its lease exposes uncovered pins to concurrent orphan reap (seat_clone.rs:6348). Strict-tier retention issue recorded in punt.
    AC2: [evidence: behavioral-test] work.rs:4196 adds a veto for an observed cwd occupant with its PID. The targeted live-child test at work.rs:4272 passed, including unchanged lease and directory. Negative proc observations grant no new authority. Existing unknown-owner refusals remain.
    AC3: [evidence: behavioral-test] Unimplemented. Existing orphan pin records contain only a basename and commit.
    AC4: [evidence: behavioral-test] Live nested process covered. Unmerged predecessor recovery and successor start remain outstanding.
    Deep pass: admission and reclaim share the same check, the underlying matcher uses path components, multiple occupants need only one witness for refusal, and unreadable processes are not positive proof of absence. No existing test was weakened. Punt vetoes publication.
