title: Shipping a stacked PR leaves its dependents targeting the merged branch; serial ship would merge them into a dead branch, and retargeting does not trigger CI
description: '2026-10-30 docs stack 3096-3103. After 3096 squash-merged, 3097 still had base task-...-106-work (the branch was not deleted, so GitHub did not auto-retarget). serial-ship then updated 3097 from that dead base and would have merged it there, not into main; the advisor stopped it. Retargeting 3103 to main with gh pr edit --base main also did not trigger ci.yml (pull_request on branches [main] only fires on synchronize/opened/reopened with base main at event time; even close/reopen did not fire). It needed an empty commit. Fix: (1) when aida pr ship merges a PR, retarget every open PR whose base is that PR''s head branch to the merged-into branch, then delete the merged branch; (2) aida pr ship / serial ship refuses to merge a PR whose base is not the default branch unless --allow-stacked-base; (3) after a retarget, re-trigger CI (an empty commit or an explicit run) and say so. Tests with a mock forge.'
