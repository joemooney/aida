title: Rework lane continuing an open PR launches the Claude standalone implementer despite --vendor codex and AIDA_HEADLESS_VENDOR=codex
description: 'Observed on dell1, 2026-11-12 20:35 to 2026-11-13 01:52 (advisor). Every ''aida queue work SPEC --role implementer --no-human --vendor codex --force-claim'' rework that prints ''rework: continuing open PR #N on its branch'' then prints ''preparing claude standalone implementer'' (BUG-2501 #3920, TASK-3779 #3919, STORY-2660 #3921; about 15 runs). Fresh pickups of the same specs and other reworks launched as codex (TASK-3099, STORY-2710, TASK-3428). dell1 has agents.toml vendor=codex and no socat, so each Claude lane dies at startup (''Sandbox required but unavailable: socat not installed''), leaving a retained lease (see BUG-2552). Setting AIDA_HEADLESS_VENDOR=codex on the launch (01:52 STORY-2660 relaunch) still chose claude, so the vendor comes from neither resolve_headless_vendor''s flag/env/config chain nor agents.toml; suspect a recorded vendor on the retained branch/lease/attempt, or the standalone_implementer Launch built from a default (the queue_cmd/work.rs ~4110 resume/launch-vendor block and standalone_implementer::Launch.vendor). Result: three main-track PRs got no rework for about 5h. Acceptance: (1) an explicit --vendor (or env/config) decides the standalone implementer vendor for an open-PR rework continuation; (2) when a recorded vendor intentionally wins (a resume), the launch line says why; (3) a fixture: rework continuation of an open PR with config vendor=codex launches codex.'
