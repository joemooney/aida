  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2549):
    Verdict: CHANGES REQUESTED
    Reviewed commit: f89f30a44097
    Recorded: 2026-11-13T21:55:48.165180596+00:00
    Findings:
    1. [P2] aida-cli-lib/src/queue_cmd/work.rs:677-684: Do not treat any historical merged PR as proof that the canonical branch has no unfinished work. If a Refs PR merged and the same branch later gained new PR-less commits, merged_change_for_branch still returns Found, so canonical_resume_branch returns None and queue work creates a dated branch from main. The retained commits are omitted from the resumed lane. Distinguish unchanged merged residue from a branch with work beyond the merged head; resume the latter, and add a regression covering post-merge unfinished commits (BUG-2549 AC1).
    2. [P2] aida-cli-lib/src/lane_recovery.rs:205-217: Capture the existing non-clone lease worktree HEAD before falling back to refs/heads/<branch>. The current implementation only reads the actual seat HEAD for Clone leases; a supported detached worktree (or one switched to another branch) records the old lease branch tip instead of the work that exited. Session end then removes/returns the tree with the wrong head recorded on the spec, defeating recovery of that lane. Use the appropriate hardened accessor for an existing worktree and keep the recorded-ref fallback for missing trees; add a detached-HEAD regression (BUG-2549 AC2).
    3. [P2] aida-cli-lib/src/lane_recovery.rs:48-57 (called after teardown by session_end.rs:2205): Persist captured exit branch/head facts independently of the forge lookup. When gh/glab fails or open-change evidence is unknown, reconcile_observed_in returns before update_atomically, and session end only prints a warning after removing/returning the tree and deleting its lease. A PR-less exit during a forge outage therefore leaves no branch/head comment and no durable retry record on the spec; a private or detached seat head may no longer be discoverable afterward. Preserve a generic exit-evidence comment (without asserting PR absence), or a durable retry containing the captured head, while still refusing the Approved transition until no-PR evidence is known. Add an unavailable-forge exit-evidence regression (BUG-2549 AC2).
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
