title: 'mailbox retention activate refuses identical builds at two paths: writer build identity compares exe path, not build SHA'
description: '2026-10-28 06:20 operator dry-runs: with the dev shell (AIDA_DEV_BIN=target/agent) and with ~/.local/share/aida/live/aida, each run flags the processes on the OTHER path as ''not known to take a write permit: it runs a different build than this one''. Both binaries report ''aida 0.16.0 (built 2026-10-28 05:43:26, sha a1fa3e7cbc9)''; live is the promoted copy of target/agent/aida (aida dev build). Writers: queue work, mcp-serve and dispatch serve run target/agent/aida; cron schedule tick and shift tick run ~/.local/bin/aida -> live. Activation can therefore never be recorded on a dev host while any agent or cron tick runs. Acceptance: writer build identity is decided by an embedded build identity (sha plus a build id or content hash), not exe path/inode; identical builds at different paths admit, and genuinely different builds still refuse. Regression test with two copies of one binary. Blocks the STORY-1843 operator-only retention activation.'
