  category: design-fork
  detail: Round 2 F1 requires the exemption only for --attempt TOKEN. The shipped recover-launch parser accepts only a positional UUID. Enforcing that literal requirement prevents documented plain recovery and retirement from releasing their own reservations. Should F1 use the existing positional operand or should the public CLI and help contract change?
  lean: Keep positional recovery and bind its exact operand to the running executable identity; the working tree implements this.
