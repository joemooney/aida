- id: 01a21073-26b6-78b0-aa62-4b3e184a3ee7
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2747):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 490b4f038373
    Recorded: 2026-11-25T01:59:44.025411577+00:00
    Findings:
    1. BUG-2747 AC1 — aida-cli-lib/src/codex_bg_receipt.rs:283. The exemption is armed by adjacent `agent` and `recover-launch` arguments anywhere in the argv of any PID in the caller's ancestry, then consumes a later exact attempt argument. It never ties the argument to the actual AIDA recovery command. A non-recovery ancestor with that sequence in its own arguments can have its sole attempt evidence discarded, so both normal recovery and unknown-receipt retirement can release a reservation with a live occupant. Bind the exemption to the actual recovery invocation and its parsed attempt argument. Add a regression with an independently occupied ancestor whose argv includes recovery-like words.
    2. BUG-2747 AC1 and AC2 — aida-cli-lib/src/tests/story_2254_codex_bg_supervisor_tests.rs:1386. The worksheet's two supplied untraced criteria remain without criterion-level test links. The new fake-proc fixture has a spec-level trace and toggles a single synthetic PID in a supplied set, so it does not exercise production ancestry discovery and cannot detect removing recovery mode from either release caller. Add criterion-linked regressions through known-receipt recovery and unknown-receipt retirement that assert the reservation remains held with an ancestor carrying independent evidence and that a plain invocation releases it.
    3. aida-cli-lib/src/codex_bg_receipt.rs:740,824. The scope-less corrupt-receipt admission check now also requires the environment to be readable for every potentially relevant same-UID process. For a malformed receipt with no usable start tick or log, an unrelated process with readable stat and argv but inaccessible environ makes the proof Unknown, blocking admission for every scope and preventing retirement despite no other matching evidence. This expands a recovery-ancestry fix into an admission availability regression. Preserve the existing admission behavior for unrelated processes while retaining fail-closed handling for plausible holders, and cover the no-birth-bound corrupt-receipt case. Linux implements separate access checks for environ in https://linux.googlesource.com/linux/kernel/git/torvalds/linux/+/e96493229a6399e902062213c6381162464cdd50/fs/proc/base.c#1005.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-25T02:05:11.734895473Z
  modified_at: 2026-11-25T02:05:11.734895473Z
