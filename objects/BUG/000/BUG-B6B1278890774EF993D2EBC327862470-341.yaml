title: 'PRs into integration run no CI: ci.yml triggers pull_request for main only'
description: |-
  ci.yml has pull_request: branches: [main], so a PR whose base is integration gets only the merge-hold checks. Nothing builds or gates its head before review.

  Seen 2026-11-14: #4007 (BUG-2565) was approved at 30e4a10ed702 with no CI on its head. Merged into integration it failed check-ci-fast (launch-input ratchet: AIDA_PULL_COALESCE unclassified). The integration seat found that only after merging locally; the PR went back for rework and a further review round.

  Fix: add integration to the pull_request branches. A PR then gets the fast tier (fast-gates and fast-compile on hosted runners) on every head, as a PR into main does. The workflow is read from the PR's merge ref, so the change takes effect for integration PRs once it is on integration.

  Acceptance: a PR opened against integration after the change shows the ci-tier, fast-gates and fast-compile checks on its head. Tags: track:integration.
