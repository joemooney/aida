title: aida agent new claude --resume looks for a worktree seat's transcript under the repo root's Claude project folder and fails
description: '2026-11-15 21:30 MST, after a desktop crash: ''aida agent new claude --role implementer --seat integration --resume latest'' picked the right session (01a1e1db-76c4-74f3-ae96-925ed3d38a81) but failed with ''transcript not found at ~/.claude/projects/-home-joe-ai-aida/<id>.jsonl''. The integration seat runs in ~/ai/aida-worktrees/integration, so Claude stored the transcript under ~/.claude/projects/-home-joe-ai-aida-worktrees-integration/. Acceptance: resume derives the Claude project folder from the cwd the session was launched in (recorded in the agent registry), or searches every project folder for the session id; the resumed session starts in that cwd; a test covers a seat launched in a worktree. Recovery after a crash is the main use, so the error should also print the folder where the transcript was actually found.'
