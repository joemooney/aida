    ## Implementer self-review
    Reviewed HEAD: edbcfef98e60b4863afdd698f495c295e85bb129. The origin/main merge-base diff was empty. Reviewed the native lane working-tree diff and checked for untracked additions.

    - Acceptance [evidence: behavioral-test] aida-cli-lib/src/agent_launch.rs:1622 and :1765 keep the recorded cwd on a direct match and recover a unique transcript-backed project worktree when the registry points at main. The regression at aida-cli-lib/src/tests/bug_2151_contained_parent_agent_new_tests.rs:276 exercises latest resume through a fake Claude process and checks the child cwd, session ID, missing-transcript error, and folder names for duplicate and unrelated results. Lane job j20261119T064030284-2-0 executed one test and passed.
    - Deep pass checked exact session ID and encoded path matching, invalid path-bearing IDs, zero/one/multiple matches, symlink handling on fallback, and authority. Linked worktree inventory or host-verified clone registration supplies the cwd. The fallback refuses contained rehoming. The test verifies that a resolvable transcript with no parent grant still refuses before the child starts. No existing tests were weakened.
    - Fixture fixes added a scratch delegated grant and wrote the fake process receipt beside its executable so it survives the launch environment filtering. Formatting and git diff --check passed. Recovery needs an extant worktree in the project inventory and uses the existing Claude directory encoding. Private-clone recovery was inspected and linked-worktree recovery was exercised. check_ci_fast=deferred(host).
