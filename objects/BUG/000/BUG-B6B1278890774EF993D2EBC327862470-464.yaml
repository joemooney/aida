    - `aida-cli-lib/src/pr_ship.rs`, `pr_service.rs`, `pr_train.rs`, `forge.rs`, `upgrade_release.rs`, `pr_service.rs` (title-bearing forge read), `gate/mandate_ship.rs`
    - tests: `gate/tests/story_1698_mandate_tests.rs` (or a new bug_2702 test module), pr_ship unit tests

    ### Ambiguities / conflicts as questions
    - Store-defined custom type prefixes are not consulted (built-in types only); acceptable?
