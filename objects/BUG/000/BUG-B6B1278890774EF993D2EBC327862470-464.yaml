    ## Implementer approach

    ### Acceptance criteria and evidence
    - **AC1 (unit):** new `pr_ship::extract_branch_spec_ids` keeps only ids whose leading segment is a built-in spec-type prefix (`RequirementType::ALL` default prefixes; node-local `BUG-<hex>-N` keeps its BUG head). Unit tests: `promote/integration-23`, `train/<uuid>-1` yield nothing; `bug-2702-x`, `bug-<node>-464`, `story-1-foo` keep their id. Gate-feeding branch sites switch to it: `pr_gate_subject`, `ship_gate_known_ids`, train member ids, forge merge chokepoint hints, release --after-pr.
    - **AC2 (unit + fixture):** in `collect_mandate_cover`, a NAMED spec with no current record whose id came only from the branch (not the forge PR title, not a commit trailer) is demoted to non-named, so it is judged like a trace-derived id (history/ledger still sticky; dangling passes). Forge unreadable -> no demotion (fail closed).
    - **AC3 (fixture, production path):** `mandate_ship_cover` driven end-to-end with a gh stub: head `promote/integration-23`, title `(Refs STORY-1 STORY-2)`, ids from `ship_gate_known_ids` -> named specs are exactly STORY-1/STORY-2, all resolve and pass exclusion judging. Control: title naming an unknown `STORY-999` still yields SpecsUnresolved.

    ### Expected files
    - `aida-cli-lib/src/pr_ship.rs`, `pr_service.rs`, `pr_train.rs`, `forge.rs`, `upgrade_release.rs`, `pr_service.rs` (title-bearing forge read), `gate/mandate_ship.rs`
    - tests: `gate/tests/story_1698_mandate_tests.rs` (or a new bug_2702 test module), pr_ship unit tests

    ### Ambiguities / conflicts as questions
    - Store-defined custom type prefixes are not consulted (built-in types only); acceptable?
