title: 'Mandate ship cover refuses every promote/integration-N PR: the head branch name is parsed as a spec ID (INTEGRATION-23 unresolved)'
description: |
  Mandate ship cover refuses every integration promotion PR: the head branch name is parsed as a spec ID.

  Root cause (integration-3a, 2026-11-19, reproduced read-only with production functions): pr_gate_subject passes the forge head ref
  `promote/integration-23` through extract_spec_ids_from_text, whose regex accepts any word-dash-number token, yielding INTEGRATION-23. It is
  kept among the NAMED ids (trailer coverage unknown), has no store record, so judge_exclusion_spec's `named && current.is_none()` returns
  SpecsUnresolved and the mandate refuses: "what the PR ships could not be resolved to specs in the store". On #4324: 49 named ids, exactly one
  unresolved (INTEGRATION-23); the other 48 resolve. Affects every promote/integration-N PR. See STORY-1698 comment.

  Acceptance:
  1. Branch-derived spec ids are extracted only from AIDA branch conventions (known spec-type prefixes such as BUG/TASK/STORY/EPIC/SPIKE/ADR/
     FAQ/VIS plus node-local forms), so `promote/integration-23`, `train/<uuid>-1` and similar yield no spec id.
  2. A branch-derived id that does not resolve is not counted as a NAMED unresolved spec (fail-closed behaviour for title/trailer/commit ids unchanged).
  3. Regression with the production gate path: a promotion PR on promote/integration-N with resolvable inherited ids is covered by an active
     mandate; a PR whose TITLE names an unknown spec still refuses as unresolved.
  Authority path (mandate cover): Claude lane, STRICT review.
