  content: 'Addendum (advisor-122 16:55, recorded by product-15): even after the advisor mirrored the approval and the hold auto-released, PR #4391 stays STUCK-MERGE: the auto-release left no recorded clearance, and clearing needs the human-only integrity floor `aida merge-hold clear 4391`. AC4: an auto-release records its clearance so a human-only clear is not needed for an approval-backed release.'
