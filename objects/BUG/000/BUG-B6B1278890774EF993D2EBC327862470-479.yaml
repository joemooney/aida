title: An approval recorded under the PR key does not release a rework merge hold recorded under the spec key
description: |
  Found by the advisor (claude-advisor-122, 2026-11-22 14:28 MST). PR #4391 (BUG-2711) stayed merge-held after its reviewer approved at ac2b6edc. The approval was recorded in the gate ledger under the PR-4391 key only (gate-ledger seq 12, spec None), but the rework merge hold is read through the BUG-2711 spec key, so `merge-hold auto-release` refused. The advisor mirrored the approval under BUG-2711 by hand and the hold auto-released. Same family as the duplicate verdict writes (BUG-2662): verdict identity is split across PR and spec keys.

  ## Acceptance
  - AC1: An approval recorded under a change key (PR-N / MR-N) releases a rework hold recorded under the change's spec key, and vice versa, when both name the same change and head.
  - AC2: merge-hold auto-release reports which key it read and why it refused, naming the approval it found under the other key if there is one.
  - AC3: A regression test records an approval with spec None under PR-N while the hold sits under SPEC, and asserts the hold auto-releases.
