  content: 'DEADLOCK (advisor-122 20:28, recorded by product-15): #4391 is still refused by the train: ''merge-hold marker missing without a recorded clearance (tampering suspected); a human must run aida merge-hold clear''. But the operator''s `aida merge-hold clear 4391` answered ''No merge-hold on PR #4391: no marker, and the forge carries no aida:merge-hold label'' and recorded NOTHING. So the mandate''s requirement can never be satisfied. AC5: `merge-hold clear` on a PR with no label and no marker, whose ledger shows a past hold, RECORDS a clearance. AC6: the train''s ''tampering suspected'' path names the exact command that records the missing clearance. Workaround: the operator runs `aida pr train 4391` at a terminal.'
