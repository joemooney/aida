title: Failed --resume-drain is misclassified as 'deliberately shelved' → cannot be re-resumed (BUG-438 defeated)
description: 'VERIFIED (advisor read drain_resume.rs:49-69 + main.rs:89748-89763, found by quality-sweep reviewer). BUG-438 keeps drain-state.json when a resume fails so the operator can fix the blocker and --resume-drain again. BUT the resume gate computes has_failure_reason = (member.state == drain_state::STATE_FAILED) at main.rs:89750 — NOT the requirement''s actual FailureReason field (despite drain_resume.rs docstrings claiming the latter). A failed resume stamps the member STATE_FAILED via set_member_outcome(completed = exit_code==0). So the NEXT --resume-drain sees has_failure_reason=true → classify_resumability returns Shelved → prints ''<spec> was deliberately shelved … don''t resume'' and exits 0, defeating BUG-438''s keep-checkpoint intent. Unit-testable: classify_resumability(false,true,false,true)==Shelved conflates failed-resume with deliberate-shelve. Fix: compute has_failure_reason from the requirement''s real FailureReason field, not the drain-state member-state string.'
