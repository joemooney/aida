title: Review watch reports 'three attempts without a verdict' when the reviewer recorded an approval in the gate ledger
description: '2026-11-12 03:10 MST: ''aida review watch --once'' blocked PR-3867 at f037d33 and PR-3866 at 340590c with ''three review attempts ended without a verdict (no diagnostic)''. The reviewer log (.aida/headless-logs/pr-3867-01a1cf33-*.jsonl) shows ''aida review record TASK-3448 --pr 3867 --sha f037d33 --verdict approved'' exiting 0 and the approval present in .aida/gate-ledger/PR-3867.jsonl. The record printed a phase-3 handshake path (aida-pr-3867/.aida/review-verdicts/PR-3867.json) that did not exist afterwards in either the review worktree or the primary. The watcher therefore burns reviewer capacity on repeat reviews and then blocks the head. Expected: the watcher reads the verdict from the gate ledger (the source of truth), or the record step writes the handshake reliably.'
