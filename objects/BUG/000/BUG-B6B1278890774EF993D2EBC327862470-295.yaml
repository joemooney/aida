    Verdict: CHANGES REQUESTED
    Reviewed commit: c5f2c12de386
    Recorded: 2026-11-12T09:28:21.223923147+00:00
    Findings:
    1. [P1] aida-cli-lib/src/gate/review_marker.rs:249: Preserve ordering before suppressing a live claim. Comparing floor(approval.recorded_at) <= marker.started_at treats a claim started at T+0.1s and an approval recorded at T+0.9s as redundant, although the review began before the approval. merge_gate then returns Clear and live_description hides the active review, allowing a train/ship to land before its potential refusal. The added nanos loop explicitly blesses this earlier-claim case. Persist sufficient start-time precision or another ordering witness for new markers; conservatively retain ambiguous legacy claims. Cover both within-second orderings and preserve UnderReview for the earlier claim.
    2. [P2] aida-cli-lib/src/queue_cmd/work.rs:4727: Move conclusive-head refusal to the pre-mutation pickup boundary after the required store pull. It currently runs after retire_idle_review_worktree (~4360), branch reclaim, implicit queue_add (~4378), and calibration/tag writes (~4403 onward). Picking up an already-concluded head can therefore retire its review checkout and mutate queue/spec/calibration state before returning the duplicate-review refusal. Add entry-point coverage proving these resources stay unchanged on refusal.
