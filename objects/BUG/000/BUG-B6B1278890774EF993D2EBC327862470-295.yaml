title: Second reviewer seat claims an already-approved head and its claim blocks the merge train
description: '2026-11-11 23:16 MST: PR-3862 (TASK-3223) was APPROVED at 03cfcce at 05:49Z with green CI. The train CI passed, but at merge the train refused: ''PR-3862 is under review — codex-reviewer started reviewing head 03cfcce 3m ago (claimed; expires in 27m)''. A reviewer must not be admitted on a head that already holds a conclusive verdict. And a review claim on an already-approved head must not block the train: it cost one full train cycle (~20 min). Fix: (1) review admission refuses when a conclusive verdict already exists at the exact head; (2) the train treats a claim opened after a conclusive verdict at the same head as non-blocking, or the merge-hold clear releases it.'
