  content: 'Rework implementation: admission now selects signed exact-head publications before local evidence and suppresses review only for approvals passing the shared independent approval-authority policy (substantive refusals remain conclusive). Claims use whole-second timestamp comparison to match marker precision. Found the recorder protection failure: the native reviewer grant covers .aida/gate-ledger, but ledger append opened the permanent sibling .aida/gate-ledger.lock for writing. Shared lock acquisition now opens an existing lock read-only, preserving the same inode and exclusive migration coordination; no grant is widened. Added read-only bubblewrap lock/hold/verdict regression, invalid-authority admission checks, synced-publication coverage and deterministic train claim cases. Standalone bubblewrap lock probe, rustfmt checks and git diff --check pass. Rust validation pending: integration job j20261112T075836092-2242512-0 timed out compiling at 900s; regression job j20261112T080036735-2264814-0 is now compiling. Spec remains Needs Attention because status promotion requires advisor authority.'
