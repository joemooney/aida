  author: dirtlab
  content: 'Implemented exact-head conclusive-verdict refusal for reviewer queue pickup, direct review launch and manual claims. Shared marker merge/readiness gates ignore a claim opened strictly after an attested approval at the same head, retaining the marker and ordinary approval/hold gates. Waiting/unknown verdicts remain reviewable. Changed gate/review_marker.rs, gate/tests/review_marker_tests.rs, lib_part5.rs and queue_cmd/work.rs. Validation: lane job j20261112T062542973-2-0 ran cargo test --profile agent -p aida-cli-lib --lib -- review_marker: 25 passed; rustfmt --check on all changed Rust files and git diff --check passed. Native seat leaves edits uncommitted for host publication. Supplied codegraph client is missing; doctor confirms missing tool, so navigation used rg.'
