  content: 'Root cause (advisor, 2026-11-12 00:35): reviewers post APPROVED/REQUEST CHANGES as PR comments, but ''aida review record'' fails with ''could not protect PR-N with a merge hold''. review watch counts that as ''exited without a verdict'', relaunches (the duplicate claim that blocks the train), and after 3 attempts blocks the head. Observed blocked: PR-3866, PR-3865, PR-3860, PR-3858 (three of them carry real APPROVED comments). Fix the record path (merge-hold protect failure) first; the duplicate claim is a symptom.'
