  author: joe
  content: 'Fixed by adding check_reload() to: (1) get_project_backend() — single-point fix for all multi-project v2 handlers, (2) 5 legacy write handlers (update, create, assign_sprint, remove_sprint, set_parent), (3) 6 legacy settings read handlers. All queue handlers already had it.'
