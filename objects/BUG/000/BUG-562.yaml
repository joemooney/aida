title: 'aida solo --watch: every cycle step fails to spawn (ENOENT) after the binary is rebuilt mid-run — current_exe() goes stale'
description: 'Found live 2026-06-15 during the first real aida solo --watch overnight run. solo_cycle (aida-cli/src/main.rs) spawns each step via std::env::current_exe(). When the aida binary is replaced while the loop runs (e.g. a cargo build --release swaps target/release/aida — which happened repeatedly this session after merges), the running process current_exe() returns the stale path (on Linux, the unlinked inode → "<path> (deleted)"), so every Command::new(exe).status() fails with "No such file or directory (os error 2)". The loop kept cycling but accomplished nothing (all 6 steps failed each cycle). Fix: resolve the aida binary robustly per run — use current_exe() ONLY if the path still exists; otherwise fall back to PATH `aida` (which re-resolves to the live binary, surviving rebuilds). The user invokes `aida solo --watch` via PATH, so PATH `aida` is the correct live binary. Parent STORY-625 (solo loop).'
