  author: joe
  content: 'DESIGN AGREED (operator 2026-06-27): the claim is a SPEC-SCOPED LEASE (reuse the session-lease registry .aida/sessions/, not a new store). On work-start, record a lease scoped to SPEC-N with {agent/session id, advisor, started-at, worktree}. AIDA-launched work (aida queue work / aida agent new) already spec-scopes its lease; the gap is advisor Agent-tool fan-outs which take generic harness-worktree leases — so the fan/work-start path writes the spec-claim. TWO check points (substrate-as-bouncer): (a) pre-pickup — dispatch refuses/skips a spec already claimed by a LIVE agent; (b) pre-edit — the advisor is warned/blocked before editing or rejecting a claimed spec (the EPIC-54-reject fix). LIVENESS: reuse STORY-694 aida status / pid_is_alive — a claim whose holder is DEAD is stale and auto-released (no deadlock on crash); the claim surfaces in aida ps / aida status <spec>. Drive as PR-for-operator-review (coordination-foundational).'
  created_at: 2026-06-27T15:25:59.837960801Z
