spec_id: BUG-1-058
title: aida search treats hyphenated terms as column-filter syntax
description: |-
  ## Symptom

  \`\`\`
  $ aida search "multi-repo"
  Error: no such column: repo
  $ aida search "cache-rebuild"
  Error: no such column: rebuild
  $ aida search "git-canonical"
  Error: no such column: canonical
  \`\`\`

  The query tokenizer is splitting on \`-\` and treating the trailing word as a column name (similar to how \`owner:joe\` works). Quoting the term works around it but isn't intuitive — \`aida search\` is supposed to be the loose grep equivalent.

  ## Expected

  \`aida search "multi-repo"\` should treat the literal string \`multi-repo\` as a search term, not as a \`multi:repo\` filter. Hyphens inside an unquoted bareword are common in this codebase (multi-repo, git-canonical, write-behind, agreed-id) and forcing users to quote them is friction.

  ## Fix sketch

  In the search-query tokenizer (likely in aida-cli/src/main.rs or aida-core/src/db/cache.rs around the FTS query builder), only treat \`<word>:<word>\` as a column filter when \`<word>\` matches a known column name AND the separator is \`:\`, never \`-\`. Hyphenated terms should pass through as literal search text.

  ## Repro

  \`\`\`
  aida search "git-canonical"
  \`\`\`

  Discovered while answering "what reqs are open for orphan-branch storage" — multiple keyword searches errored because of this.
