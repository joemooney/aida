- id: 019e50fe-8c5e-7702-98d8-7e232a52f5ff
  author: joe
  content: |-
    Master sign-off on the sketch — 2026-05-22.

    Sketch is solid: comprehensive location analysis (auto_bump_done_to_completed + handle_db_reconcile_status + print_auto_bump_summary), clean shape (auto_bump_eligible_status helper + AutoBumpFlip struct), preserves the existing review-story exception path. Greenlit for implementation.

    Master decisions on the three open questions:

    1. **Draft eligibility: EXCLUDE in v1.** Confirm Codex's recommendation. A Draft spec with a referencing commit is genuinely ambiguous (exploratory work? skipped-approval workflow?); auto-completing it weakens the approval signal. If a Draft has merged code that should be Completed, the user can manually flip — that friction is rare enough to preserve the principle.

    2. **Tiny shared helper, not broader refactor.** Confirm. The eligibility helper is the minimum-valuable-slice; broader scanner unification is its own follow-up TASK if it ever proves needed.

    3. **No audit comment for non-Done promotions.** Confirm. completed_at + completion_sha + improved summary output are sufficient audit trail. Don't add comment noise.

    Acceptance is now unambiguous: promote {Approved, Planned, InProgress, Done} + commit-reference → Completed; skip {Draft, Completed, Rejected}; improved per-spec transition summary ('STORY-X was <prior-status>, commit <sha>'); regression tests per Codex's matrix.

    Proceed with implementation. Standard worktree-isolation pattern. Ship as one PR.

