- id: 01a1c63b-ee32-7502-886f-4dbf64e2d225
  author: dirtlab
  content: |
    Investigation on the dirtlab lane host reproduced a Rust cache-key dependency on cwd with sccache 0.19.0, independently of Cargo and the primary host's slot wrapper. With absolute source, output, compiler, crate name and flags held constant, compilations in A/B/A yielded 3 executed Rust requests, 2 misses and 1 hit, with zero cache errors. A separate probe using SCCACHE_BASEDIRS for both source roots also yielded 2 misses and 1 hit. This identifies a plausible cross-seat miss mechanism, not a verified exclusive root cause on the unavailable primary host.

    Implemented an advisory lane-cache-reuse doctor check using the production sandbox, environment and private server lifecycle. It differentiates cross-cwd reuse, same-cwd-only reuse and no caching. Added fixture coverage, advisory-status coverage and docs/internal/testing/bug-2519-lane-cache-reuse.md. Rust validation is pending the lane runner; direct execution of the real probe and all three shell fixtures behaved as expected.

    Acceptance 2 remains unmet: this seat cannot run the two comparable primary-host lane dependency jobs or demonstrate >=50% second-job Rust hits. The reviewed host codegraph path /home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph is absent; aida doctor check codegraph reports missing.

    Design fork for advisor/host: a stable sandbox-visible workspace and target layout could remove differing absolute paths, but needs a reviewed mount-policy sketch covering Git metadata protection, Cargo discovery/config, build-script outputs, debug paths and seat isolation. Alternative: evaluate an upstream Rust path-key normalization change with artifact-path correctness evidence. Local SCCACHE_BASEDIRS alone did not resolve the reproduction. No mount-policy or admission change has been made, and this bug must remain open pending design review and primary-host measurements.
