title: Primary-host lane sccache hit rate is under 1% while dell1 reaches 86%
description: |-
  ## Problem
  Lane test jobs on the primary host barely hit the shared lane sccache. Warm sample (local lane TASK-3428, 2026-11-10, second job): 314 compile requests, 2 Rust hits, 218 Rust misses, cache /home/joe/.cache/aida/lane-sccache. The equivalent second job on dell1 (lane STORY-2661) got 56 hits out of 65 requests. Every primary seat still compiles its dependencies cold, which is what STORY-2641 set out to fix.

  ## Suspects
  - On the primary, cargo goes through the ~/.local/bin/cargo slot gate; dell1 does not.
  - The primary filesystem cannot reflink, so each seat target is cold, and per-seat absolute paths may change sccache keys.

  ## Acceptance
  1. Root cause identified and recorded on this bug.
  2. A second primary lane job building the same dependency set shows a Rust hit rate comparable to dell1 (at least 50%).
  3. A regression test or doctor check covers the cause.
