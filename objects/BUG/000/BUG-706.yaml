title: session end --force still prompts Continue? [y/N] on non-TTY — headless lease cleanup impossible without piping y
description: 'Found during the codex-only validation: ending a stale session lease from a non-interactive context aborts at the confirmation even WITH --force (--force should mean no prompt, or a --yes flag should exist). Blocks unattended recovery from a dead phase-1 lease; workaround is queue work --steal or piping y. Fix: --force (or a new --yes) skips the prompt in non-TTY contexts; keep the interactive confirmation for bare invocations.'
