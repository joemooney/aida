title: 'tests/test_session_role_grant.sh inherits the caller''s AIDA session env: ''no label: role addendum stays silent'' fails from an advisor shell'
description: 'Found 2026-11-07 00:45 during an advisor hand merge. Running bash tests/test_session_role_grant.sh from a rotated advisor shell fails ''no label: role addendum stays silent'' (expected [] but an addendum printed). It passes under env -i. Scrubbing only AIDA_SESSION_ROLE/GRANT/PURPOSE/PROJECT/PERMISSION_MODE isn''t enough, so some other ambient AIDA_* variable (AIDA_ROTATION_*, AIDA_ROLE_INSTANCE, AIDA_AGENT_TYPE, ...) reaches the code under test. make check-ci-fast therefore goes red locally for any agent with a seat. Fix: start the test with an explicit env -i allowlist (HOME, PATH, TMPDIR and the fixture''s own variables), matching the hermetic-fixture rule. Acceptance: the test passes when run with every AIDA_* variable from a live advisor session exported.'
