title: 'Train admission starves while review-watch has any review attempt in flight: ''admission busy: prior review attempts are not quiescent'''
description: |-
  ## What happened
  2026-11-16 23:59 to 00:22 MST: deputy train job 01a1e819 (members #4167, #4130, both approved at head, full green, holds cleared) ran `aida pr train` 40 times; every attempt failed in 0-2 s with "admission busy: prior review attempts are not quiescent; inspect review watch and release settled attempts" (twice "review-watch lock busy: admission.lock"). Review-watch had live attempts on PR-4204 and PR-4205 (codex reviewers, ~20 min each) plus a terminal blocked attempt on PR-4171 (three inconclusive reviews) that never clears without `aida review watch --release`.

  ## Why it matters
  Train admission requires every review attempt to be quiescent. Review-watch launches a new attempt every few minutes whenever a head is pushed, so with steady lane output there is no window for a train: approved green PRs wait behind unrelated reviews. A terminal blocked attempt starves trains indefinitely.

  ## Expected
  A train for already-approved members is not blocked by review attempts on other PRs (or admission is fair: a waiting train gets the next window and review-watch defers new launches while a train waits). A terminal/blocked attempt never counts as non-quiescent for train admission.

  ## Workaround in use
  Advisor released PR-4171 by hand and resubmitted train jobs with a 60-minute admission retry loop (5 s interval).
