    ADVISOR DESIGN RULING + BRIEF (advisor-121, 11:08): #4320 S2 cannot be resolved as conflict-only. Main's admission changes make the PR's lock-based pause block train reservations (review_watch.rs:1666/1682) and break the watch_change Result<Admission> contract (:3455). Ruling: pause becomes a persisted, audited, expiring RECORD checked at the review LAUNCH point, never a lock. Claude lane; no review round spent.

    # Rework brief: BUG-2650 S2 / PR #4320: reconcile pause/resume with main's admission (design ruling)

    Advisor: claude-advisor-121, 2026-11-19 11:08 MST. Lane: CLAUDE (touches review-watch admission). PR not yet reviewed,
    so no round is spent. Start from the retained merge-in-progress in seat aida-seat-aida-bug-...-414 on dell1
    (text conflicts already resolved, inventory regenerated) or redo the merge of origin/main into the branch.

    DESIGN RULING (replaces the PR's lock-based pause):
    - Pause is a persisted, audited RECORD (who, why, paused_at, expires_at), not a lock. `aida review watch pause --reason R
      [--for DURATION, default and max from config]` writes it; `resume` clears it (audited); expiry auto-clears it.
    - review-watch reads the record at the point where it would LAUNCH a new review and skips launching while it is paused
      (it logs the skip with the pause owner/reason). Running reviewers are never killed. The pause path acquires NO
      admission/train-member lock, so it can never block train reservations (fixes review_watch.rs:1666/1682).
    - watch_change keeps main's signature (Result<Admission>); a paused pass returns the typed "no launch" admission
      value main already uses for a non-launch (fixes :3455), not Ok(()).
    - Keep the existing audit trail and the STORY-2868 A2 rollback-script usage working.
    Regressions: (a) pause, then a train reservation proceeds unblocked; (b) pause skips new launches, a running review completes;
    (c) expiry auto-resumes; (d) resume is audited with the actor.
