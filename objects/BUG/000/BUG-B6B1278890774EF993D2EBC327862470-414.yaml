  content: 'Advisor 01:15 MST, pause attempt under the product ruling of 00:31 (A1 evidence for STORY-2868): auto-train #4206 landed #4144 (06bf94f) at about 01:10. The next train, p17c (#4187 alone, deputy job 01a1e86d), then looped on ''admission busy: prior review attempts are not quiescent'' (25+ attempts). Review blockers at 01:13: PR-4188, PR-4195, PR-4198, all Running (review-watch reviewing old heads of #4195 and #4198 again). NO PAUSE TAKEN: review-watch has no pause control. [review_watch] carries only max_concurrent and required_checks, and its worker is a supervised process. Killing it would not stop the three running reviewers that hold admission. Second finding for this bug: a supported ''review watch pause/resume'' (or train-priority admission) is needed. Fallback in use: p17c''s 60-min, 5 s retry, to win the gap when those reviews finish.'
