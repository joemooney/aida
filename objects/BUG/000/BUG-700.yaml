title: Employer-identifying content published in public aida-store branch — needs history-rewrite scrub
description: |-
  The public GitHub aida-store branch (and a few code-branch specs) contain employer-identifying content that predates 2026-07-02 and is already in committed history.

  LEDGER (locations, employer strings redacted here to avoid compounding the leak in this very spec):
  - registry/nodes.toml, registry/blocks.yaml, oplog.yaml: an employer email domain appears as node owner/email provenance (16+ occurrences).
  - objects/EPIC/000/EPIC-44.yaml: a comment describes the employer corporate network in detail — a firewallblock host, a named policy group, and a category-denied web-filter verdict. This reveals employer security posture and is the most sensitive item.
  - objects/TASK/000/TASK-845.yaml, TASK-951.yaml, objects/BUG/000/BUG-89.yaml: reference the employer alias plus corporate-network context.

  WHY IT MATTERS: joemooney/aida is a PUBLIC repo. Employer-confidential content in a public repo is a serious, hard-to-reverse exposure. Editing the tip does not remove it — the strings live in ancestor commits, so a real scrub requires history rewrite.

  SCOPE / APPROACH (proposed, not yet approved):
  1. Enumerate every blob+commit containing the employer strings across BOTH the aida-store orphan branch AND the code default branch.
  2. git filter-repo (preferred) to replace the employer email domain with the canonical non-employer stem (joe.mooney, per TASK-845 these aliases are one person) and to redact/replace the EPIC-44 corporate-network comment with a sanitized summary.
  3. Force-push the rewritten aida-store + main to public GitHub. This is a big hard-to-reverse op: every existing clone must re-sync (.aida-store hard reset; code branch rebase/reset). Coordinate first.
  4. Also apply the same scrub to gitlab.joemooney.com (personal, lower urgency) for consistency.

  RELATED / CONTEXT:
  - Discovered 2026-07-02 while reconciling node 6 (spock) store commits from gitlab into the local store. Node 6 s block entries carry the same employer email; per operator decision that reconcile was pushed to gitlab ONLY and HELD from GitHub precisely to avoid adding more copies to the public repo pending this scrub.
  - The node-6 reconcile currently lives only on gitlab aida-store (tip is a merge commit). After the scrub, the reconciled+scrubbed store should be brought to GitHub in one clean operation.

  ACCEPTANCE: no employer email domain, no employer corporate-network detail, no employer alias context remains in ANY commit reachable from the public GitHub aida-store or main branches; all active clones re-synced; gitlab scrubbed to match.
