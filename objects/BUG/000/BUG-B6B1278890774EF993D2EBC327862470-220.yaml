title: session end cannot end a lease whose seat clone state read times out (sandboxed sh over 120s), even with --force --discard-unpushed
description: 'Lease 01a1aa6e87e1 (TASK-2832) in clean, fully pushed seat clone aida-seat-aida-task-b6b1278890774ef993d2ebc327862470-779-2: ''aida session end --force --discard-unpushed'' refuses because ''the sandboxed sh did not finish within 120s''. The lease keeps holding the PR branch, so queue work --force-claim --branch refuses and the PR-3394 review fails. Acceptance: timed-out sandboxed read falls back to an unsandboxed read-only git check or names the hanging step; explicit discard ends the lease when state is unreadable; regression test with a stubbed hanging sandbox.'
