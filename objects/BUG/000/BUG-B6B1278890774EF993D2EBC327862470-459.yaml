title: 'No-new-failures promotion: accept the real zero-test nextest JUnit report from the rest shard (--bins --no-tests warn) when the invocation is proven complete (follow-up from #4265 round 2)'
description: 'Deferred from PR #4265 (STORY-2912) round 2 at f3e8978 under the 09:18 tier; it fails closed (wrongly refuses, never wrongly promotes). promotion_failures.rs:290-292, 595-600: parse_junit rejects documents without a <testsuite>, but rest always runs ''cargo nextest run -p aida-cli --bins --no-tests warn'', which legitimately emits a zero-test report (see base run 44408993587, artifact test-timings-rest). So promotion is refused whenever rest is red, even with equal failing sets. Accept an empty report when test-run.log proves that invocation completed. Regression from the real artifact shape.'
