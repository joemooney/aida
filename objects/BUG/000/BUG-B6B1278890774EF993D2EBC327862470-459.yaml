    ## Implementer self-review
    Reviewed HEAD: 6da63c980365a3d2035dda4ffd1afa687be6c6ec, including the native worktree diff and untracked-file check. The origin/main merge-base diff was empty.
    AC1: [evidence: behavioral-test] aida-cli-lib/src/promotion_failures.rs:629 and aida-cli-lib/src/tests/promotion_failures_tests.rs:395. An artifact-derived zero-test JUnit report and matching completed summary permit promotion with identical red rest-shard failures. The fixture matches GitHub Actions artifact 44408993587.
    Deep pass: the command matches the CI runner and ANSI is stripped before summary parsing. The empty XML path checks one root, unique attributes, and zero counters. Existing nonempty reports and multi-invocation evidence are exercised by the targeted suite. The new regression refuses missing, partial, or nonzero summaries, other commands, and malformed or contradictory XML. Only the existing promotion evidence reader can use this exception, and the shard must still name a failed test. No tests were weakened.
    Validation: 18 targeted tests passed (lane job j20261119T000250039-2-0). rustfmt, git diff --check, classifier inventory, and artifact fixture comparison passed. Baseline CI run 44416608741 passed. The worktree patch awaits host PR CI.
    Residual risk: a future change to the CI bin command or zero-test artifact format can cause a conservative refusal and require updating this check.
