title: 'aida deputy shell list reports ''runner: NOT running'' for a live ~/bin/aida-deputy-shell runner, and agents then report live deputies as down'
description: |-
  Both read the same store (~/.aida/deputy-shell/<name>/). The bash runner (~/bin/aida-deputy-shell run 2|3) writes only runner.pid. The Rust side (deputy_shell/mod.rs live_runner -> runner_info) reads runner.json and needs pid_start, so it returns None for every bash-run deputy. On 2026-11-06 at 10:12, deputies 2 (pid 2588943) and 3 (pid 2590854) were live and running train job 20261106T095908-460c95, yet an advisor told the operator 'both script deputies are down' and asked them to restart them. Separately, a sandboxed agent Bash runs in its own PID namespace, so pgrep and /proc liveness checks see nothing and report false negatives there.

  Acceptance:
  1. 'aida deputy shell list --name N' reports a live runner started by either implementation. Either the bash runner writes runner.json with pid and pid_start, or the Rust check falls back to runner.pid plus a cmdline match.
  2. When liveness cannot be determined (no /proc visibility, as in a sandboxed PID namespace), list says 'runner: UNKNOWN (cannot see host processes from this sandbox)' instead of 'NOT running'.
  3. A test covers a runner.pid-only store with a live pid.
