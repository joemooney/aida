title: Advisor inbox suddenly shows 683 historical messages as unread (Oct 25 onward); previously read mail resurfaced
description: 'Observed 2026-11-04 19:54. At 19:15 `aida mailbox inbox` for the advisor listed 6 unread. At 19:54 it listed 683: 172 from implementer, 162 from integrator, 33 from antigravity-implementer-1, 32 from codex2, and so on, dating back to 2026-10-25 (e.g. 7db9934a BUG-2221 PR #2928 rework, PR-2924 two-round review cap). Between those times only PR merges landed: #3384 SPEC-447, #3372 TASK-1954, #3336 TASK-2032 seat-clone anchor; #3373 is training. No mailbox changes were made by hand. Likely the inbox scope or receipt anchor changed (a different identity or worktree set is resolved, so the old read receipts no longer match), or receipts were lost. Impact: a real request is buried under hundreds of stale items, and the stall check''s mail signal becomes useless. Acceptance: find the cause (bisect the merges above), restore the prior read state without re-sending, and add a regression test that a receipt survives a seat-clone or worktree change.'
