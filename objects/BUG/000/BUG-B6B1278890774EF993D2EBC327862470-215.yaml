- id: 01a1ae68-c4a3-7b90-9093-0579a9f3198e
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2449):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 24e0e98c1b0b
    Recorded: 2026-11-05T19:53:22.256915781+00:00
    Findings:
    1. CI red: mailbox_wake::tests::story1843_w_partial_source_is_flagged (mailbox_wake.rs:281). aida-core/src/mailbox_logical.rs:2723-2728 read_evidence sets unknown for ANY SourceStatus::Error, including WorktreeMissing/WorktreePrunable/CommonGitMismatch. Those codes are explicitly carved out by ruling 97 (live_sources_observed, and the unsighted logic at ~:997-1008): a missing worktree's files are gone or retained, and ACKs live in the common-git anchor. Result: deleting any sibling worktree blanks the whole own inbox/wake. Exclude those codes in read_evidence (match the existing carve-out); do not change ruling test 3 without an advisor ruling.
    2. CI red: mail_backlog::focused_bug2405::local_unknown_global_partial_preserve_findings_and_nudge_state (mail_backlog_bug2405_tests.rs:388). A single corrupt message file (sib .aida/mailbox/broken.json) errors that source, and read_evidence now marks every un-ACKed message unknown, so the backlog finding for 'known' disappears and the own inbox goes empty. A source that failed on a message row can still have readable receipts: attempt key_evidence on its receipts (as read_source_deliveries salvages sidecars) and mark unknown only when the receipt read itself fails.
    3. Weakened existing assertion: story_1843_mailbox_view_tests.rs:156 story1843_awaiting_mail_channel_shares_the_view changed unread 1->0 and added urgent==0 to fit the over-broad behavior. The stall check's mail signal would go dark whenever any worktree is missing (routine in this fleet), the inverse of BUG-2449. Restore the original expectation once finding 1 is fixed.
    4. Untested path: mailbox_logical.rs:1118 marks every non-acknowledged record unknown on any inventory error other than NotAGitCheckout (InventoryFailed/InventoryOverBudget). No new test covers it, and docs/mailbox.md:196-200 promises that independently readable mail still appears. Add a test that new mail stays visible (with the partial warning) under an inventory failure, or narrow the rule.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
