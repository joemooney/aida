- id: 01a1a9a2-9799-79c3-8dc0-7fc0458a497a
  author: joe
  content: 'Update 19:56: a minute later the same command listed 5 again. So it''s intermittent: one read returned the historical set, possibly during a cache refresh or a partial receipt-anchor read. Treat it as a flaky inbox scope or receipt read, not lost state. Acceptance: a partial or failed receipt read must report the view as incomplete, never show everything as unread.'
