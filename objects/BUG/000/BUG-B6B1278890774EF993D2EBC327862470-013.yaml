title: Reviewer verdict stores a model-typed head SHA; a typo discards a complete review
description: |
  A headless reviewer's verdict was rejected at collection because the reviewer typed the head SHA wrong. On aida-relay PR #98 on 2026-10-28, the verdict file recorded reviewed_sha 'cfbd4bd2' while the head was cfbd4bdcbec8…, so 'aida queue work PR-98 --role reviewer' reported "it reviewed cfbd4bd2, but PR-98's head is now cfbd4bdc…" and discarded a complete review. The SHA is copied by the model, not resolved by the tool. Acceptance: `aida review record` (and any verdict-writing path) takes the reviewed SHA from git: default to the checked-out review worktree HEAD; if a SHA or prefix is given, resolve it with rev-parse and refuse unless it equals HEAD; always store the full 40-hex SHA. Collection keeps refusing a genuinely different head. Regression test: a prefix that resolves to HEAD records the full SHA; a mistyped SHA is refused at record time with a clear message, not silently written.
