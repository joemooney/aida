  content: 'Implementation uses get_requirement_unambiguous_for_read for idle candidates, preserving canonical-object validation while avoiding repeated agreed-ID YAML scans. Ported the scoped reference regression cases for canonical timestamps, ambiguous IDs, and missing IDs. CI decision: retain the unchanged 10-second cold-first-run budget; do not port the work-only prepare-status-fixture.sh warm-up. The exact work full-status timed test is absent from this checkout; preparing an isolated 7,246-object real-store snapshot for a local cold-cache measurement.'
