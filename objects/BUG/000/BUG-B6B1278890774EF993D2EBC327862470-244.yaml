- id: 01a1b46d-ce9c-70a0-bea5-9a6d32b8e739
  author: joe
  content: 'Validation: cargo test --offline -p aida-cli-lib --lib story_1680_idle_in_progress_tests -- --nocapture passed all 20 tests, including the three new cases; cargo fmt --all -- --check and git diff --check pass; cargo build --offline -p aida-cli --bin aida passed. Isolated committed real-store snapshot with normal [deployment] configuration: installed-binary prepared-cache baseline 14.159s for 7,247 rows, 2 idle and 17 orphaned; patched unoptimized debug binary 5.291s with the same row/channel counts. This is a diagnostic comparison across different builds, not a controlled before/after speedup claim. Stronger no-derived-cache run on a separate 7,246-row snapshot exceeded the 50s watchdog while cache rows remained zero. Cold-cache 10s acceptance is NOT established; original work timed test and CI fixture script are absent from this checkout. Keep requirement open; partial resolver fix should publish with Refs only. No CI warm-up was ported.'
