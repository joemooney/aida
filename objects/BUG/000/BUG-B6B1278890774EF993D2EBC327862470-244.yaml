  content: '[advisor ruling 23:50] Completed on evidence. The 10s budget is the warm-cache budget: the work CI that set it warms the store (prepare-status-fixture.sh) before timing, and with this resolver fix plus warming it passed under 10s unchanged (operator report, 2026-11-06). Local: 14.2s -> 5.3s on 7,247 rows, even on a debug build. The cold, no-derived-cache full status (>50s) is a separate one-time cache-rebuild cost, filed as its own bug.'
