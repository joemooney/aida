title: 'Full aida status on a 7,073-record store takes 36s against a 10s budget: idle_in_progress rescans YAML for every record'
description: 'Source: work GDMS CI report. The timed full-status test on the real store took 36.2s against its 10s budget. idle_in_progress.rs resolves canonical IDs by repeated YAML scans; use the cached, validated canonical-ID resolver. Acceptance: the existing timed status test passes at its unchanged 10s budget, with unchanged assertions, on a store of about 7k records, including a cold first run. Separately, decide whether CI should warm the store before the timed test (the work CI uses prepare-status-fixture.sh) or whether the budget must hold cold.'
