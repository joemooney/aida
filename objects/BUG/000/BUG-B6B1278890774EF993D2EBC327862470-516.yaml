- id: 01a210be-1e05-7a53-ac00-4daf8dc9ca61
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2755):
    Verdict: CHANGES REQUESTED
    Reviewed commit: a80ae09d4a08
    Recorded: 2026-11-25T03:24:06.942287354+00:00
    Findings:
    1. aida-cli-lib/src/doctor/worktrees.rs:1447 — BUG-2755 AC1: Verify that the procfs view actually exposes the relevant host processes. The reader’s initial PID namespace does not establish procfs visibility. A hidepid mount can omit another user’s processes entirely, so the loop can see only readable entries and release the lease while an omitted process’s namespace still has the recorded path mounted. Use a verified host-wide inventory or refuse when visibility is restricted. Exercise the production inventory decision with a restricted view.
    2. aida-cli-lib/src/doctor/worktrees.rs:1453 — BUG-2755 AC1: A real absent clone cannot be healed through this path on an ordinary multi-user host. It requires readlink on every visible /proc/<pid>/root, including privileged system processes for which an unprivileged healer gets EACCES and kernel tasks that have no usable filesystem root. One such task aborts every heal, even if the relevant mount inventory is otherwise available. Keep genuinely unknown namespaces fail-closed, distinguish verified tasks without mount namespaces, and establish an authorized host evidence path. The injected success fixture skips check_namespace_mounts entirely.
    3. aida-cli-lib/src/seat_clone.rs:2108 — BUG-2755 AC2: Successful Git status with empty stderr does not establish readability. An ignored directory containing unreadable data is pruned from the untracked traversal, so chmod 000 on an ignored subtree can produce neither a status entry nor the warning this patch depends on. With reachable refs and an empty mailbox, doctor can release that present clone’s lease. Verify readability separately for the release decision and add an otherwise clean ignored-subtree regression.
    4. aida-cli-lib/src/doctor/worktrees.rs:1506 — BUG-2755 AC3: The lease-only path treats failure to verify a binding as evidence that the clone has no binding. verified_clone_main collapses an absent marker, EACCES or EIO reading an existing marker or alternates file, and a binding to a different main into None. The Git status probe explicitly excludes the marker. An otherwise clean bound clone with an unreadable marker can therefore reach lease release. Distinguish a confirmed missing binding from unreadable or conflicting binding evidence and refuse the latter.
    5. aida-cli-lib/src/doctor/worktrees.rs:1535 — BUG-2755 AC3: An exclusive checkout-directory flock only fences writers that take the new shared lock. The existing mailbox activation code explicitly anticipates already-running older AIDA binaries. A writer without the new lock can begin after the holder scan and publish after the empty-mail check while doctor releases the lease. The new fixture holds the same flock helper and cannot detect this case. Reuse a mailbox fence that covers supported writer versions or require evidence that every possible writer participates before releasing ownership.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-25T03:27:04.709264417Z
  modified_at: 2026-11-25T03:27:04.709264417Z
- id: 01a210bf-f525-7a60-8c07-13eaf0edad1d
  author: joe
  content: |-
    AUTHORITATIVE BRIEF (advisor-122, relayed by product-15 20:28):
    # BUG-2755 / PR #4541 r3: REDESIGN BY REMOVAL (advisor-122 ruling 2026-11-24 20:30 at a80ae09d; STRICT; product-15). Lane: CODEX. MAIN, existing branch. <=150 NET lines; this round should SHRINK the PR.
    r2 drew 5 majors, all on "prove no process/holder/binding" (hidepid procfs, EACCES on /proc/*/root, unreadable ignored subtrees, binding-verify errors collapsed to absent, flock not fencing old binaries). Proof of absence is NOT achievable on a multi-user host, so STOP trying.
    NEW DESIGN: the heal path for a stale lease whose seat clone is absent or unbound:
     (a) REQUIRES an operator --attest (same pattern as `doctor heal repair-reservations`: require_direct_human + a TTY confirmation typing the id);
     (b) MOVES the clone (if present) to ~/salvage/reaped/<spec>-<lease>-<ts>/ via an ATOMIC same-filesystem rename (else REFUSE) instead of deleting it;
     (c) then ends the lease.
    Keep only cheap best-effort checks as WARNINGS printed before the confirmation, never as a gate that's treated as proof. Any verification error = "unknown" → refuse WITHOUT --attest. REMOVE the procfs/mount/binding proof machinery from r1/r2.
    Tests: no attest → refuse; attest → moved + lease ended; cross-fs target → refuse.
    One targeted cargo run, then make check-ci-fast, then push to #4541. COMMIT your work. TITLE TRAILER: keep the existing PR title unchanged.
