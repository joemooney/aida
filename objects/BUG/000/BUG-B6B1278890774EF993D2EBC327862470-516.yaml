    REVIEW FINDINGS TO ADDRESS (BUG-2755):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 696fd8422f05
    Recorded: 2026-11-25T22:33:34.978145431+00:00
    Findings:
    1. aida-cli-lib/src/doctor/worktrees.rs:1486 — BUG-2755 AC2 ("An unreadable-but-PRESENT tree (EACCES, EIO) still refuses. Test.") has no test in this diff. The earlier mode-000 Rust regression was removed in the r3 redesign, and repair_attestation.py only uses a readable tree. On the attested path, the only thing separating 'absent → release with no salvage' from 'present but inaccessible → refuse' is the ENOENT-only `continue` in pin(); every other error returns Err. A mutation that also continues on EACCES/EIO (or on all errors) would let an inaccessible but present checkout be reported as 'tree absent, nothing to salvage' and lose its lease, with no move, and every current test would still pass. Add a CLI regression in repair_attestation.py: put the clone under a parent directory set to mode 000 (skip when euid is 0), run the attested heal with the correct typed ID, and assert a nonzero exit, the lease bytes unchanged, no new *.attestation.json event, and the tree still in place once permissions are restored.
