title: 'Lease heal refuses when the seat clone is absent: end the lease when the tree is verifiably absent, still refuse when present but unreadable'
description: |
  Filed by product-15 per advisor-122 ruling 2026-11-24 12:16. LOW, STRICT (lease safety), drive. Seen on dell1: `aida doctor check leases` prescribes "save patch if dirty, then end lease 01a2078e7236" for TASK-1190 (worktree missing), but `aida doctor heal stale-leases --id 01a2078e7236` refuses: "could not read the seat clone …-1190". The spec is completed; the lease stays forever.

  ## Acceptance
  - AC1: When the recorded tree is verifiably ABSENT (ENOENT on the path AND no mount), the heal ends the lease and records "tree absent, nothing to salvage". Test.
  - AC2: An unreadable-but-PRESENT tree (EACCES, EIO) still refuses. Test.
