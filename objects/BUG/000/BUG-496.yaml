  content: 'Implementing option (a) — per-wave integrated-main verify in the /aida-burndown skill (HALT on red main). Options (b) GitHub branch-protection ''require branches up to date before merge'' (forces re-CI on base move) and (c) serialize+rebase-then-CI remain COMPLEMENTARY follow-ups: (b) is a repo-admin config (belt-and-suspenders, no code) worth enabling once there are external contributors; (c) trades parallel speed for safety, not needed if (a) holds. (a) is the structural fix that makes the runner itself never leave main broken.'
