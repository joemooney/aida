    Proposed v1 gate: only disallow `AskUserQuestion`. Do not broaden to Bash/Edit/etc.; headless still needs normal autonomous tool use, and this bug is specifically the interactive question surface.

    Phase coverage: apply to every `AIDA_HEADLESS=1` `claude -p` launch: implementer, reviewer, advisor cold boot, advisor fork resume, and resumed implementer. Interactive launches and non-headless reviewer resumes remain unchanged.

    Backward compat / `--zen`: no behavioral change for interactive or `--zen` operator flows. The gate is only on headless print-mode argv where no human can answer. Keep the `/aida-review` prose as defense-in-depth; instructions inform, argv gate enforces.

