title: Force-claim refuses a retained lane clone whose only change is the generated .claude/settings.local.json
description: 'Observed 2026-11-12 02:25 and 02:32 MST on dell1: ''aida queue work STORY-2695 --force-claim'' was refused (admission-refused) with: cannot force-claim branch story-2695-s3: retained lease 01a1cecf1566 and private clone ...: its tree has 1 uncommitted change(s): ? .claude/settings.local.json. That file (48 bytes, enabledMcpjsonServers=[aida]) is generated by the launcher/Claude, not lane work. Every autoland relaunch was refused until the advisor moved it aside by hand. Expected: the dirty-tree check ignores launcher-generated files (or the launcher writes them outside the tracked tree / adds them to info/exclude), so a dead lane''s clone can be reclaimed unattended.'
