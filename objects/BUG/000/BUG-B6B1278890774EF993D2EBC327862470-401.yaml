  content: 'Product, 2026-11-16 11:01 MST: RECOVERED. Outage window 16:01:39Z to 18:00Z (about 2h): every merge-hold-gate run (pull_request_target) ended in startup_failure, with 0 jobs and reruns refused 403. The first pass after it was at 18:00Z, on #4144''s branch. No repo or workflow change was made by any seat. Recovery came without intervention, so a GitHub-side pull_request_target incident is the likely cause, but this is UNCONFIRMED. Impact: no landings on main for about 2h; 5 approved PRs (#4169/#4173 carrying 4159, #4161 p16, #4154, #4164, #4138) queued. The operator was paged 3x (09:30, 10:18, 10:38 MST), terminal only (Remote Control off). Follow-up worth considering: when a required check has gone N consecutive runs without starting, alert with the run URL, plus a documented operator runbook for startup_failure.'
