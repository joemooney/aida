title: 'The integration seat its standing orders describe is not a configured seat: seat:integration mail is refused and its handoff lands under the implementer role'
description: 'Seen 2026-11-15 21:37 MST after a crash relaunch. aida-core/templates/.aida/discipline/standing-orders/integration.md says the seat is launched with ''aida agent new <vendor> --role implementer --seat integration'' and that ''the advisor reaches you with --to seat:integration''. In practice ''aida mailbox send --to seat:integration'' is refused (''seat integration has no live holder''), the integration session reports ''seat:integration isn''t claimable (not a configured seat)'', and its rotation handoff was written to .aida/handoff/implementer/latest.md, not the integration seat handoff that ''aida session handoff --seat integration --show'' prints. So seat mail from the advisor is lost after every relaunch, and the next generation may read the wrong handoff. Acceptance: integration is a configured seat in the default seat config (shipped by aida init, so it works for Codex too); a session launched with --seat integration holds it and receives seat:integration mail; its handoff is written and read under the integration seat; a test covers relaunch plus seat mail delivery.'
