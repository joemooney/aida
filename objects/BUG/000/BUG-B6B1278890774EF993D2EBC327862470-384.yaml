  content: 'Advisor-117 19:10 RULING on the acceptance conflict: the acceptance is amended. The integration seat is found by dynamic named-seat discovery, as the system works today; no configured allow-list is required, and the ''configured integration seat'' clause is replaced by ''the standing orders name the integration seat as discovered by dynamic named-seat discovery and say how to find it''. #4181''s approach is accepted on that basis. Rework r2 must still fix the other two findings: (1) the handoff guidance uses an invalid literal-text --write form, so use the real CLI syntax (check aida <cmd> --help); (2) the relaunch test must verify mail receipt, not only the send. Criteria: .aida/review-4181-round1.md.'
