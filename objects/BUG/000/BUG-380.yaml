- id: 019e5bab-9d59-7460-8730-69ca5a37f989
  author: joe
  content: |-
    Implemented via commit 9394eecd (PR link added after open):

    - Added `resolve_default_branch_ref(project_root)` — tries `origin/HEAD`, then `init.defaultBranch`, then `main`/`master` literals; verifies each ref exists before returning. Returns None when nothing usable is present so callers skip the ancestor check rather than guess.
    - Wired both callsites that needed it: `collect_git_linkage` (aida-cli/src/main.rs:40510 area) and `classify_in_flight_specs` (aida-cli/src/main.rs:39601 area).
    - Defense-in-depth: switched both `is_ancestor` closures from `.status()` (which inherited stderr → leaked `fatal:` lines) to `.output()` so an invalid ref can never reach the user's terminal again.

    Test status: 14/14 linkage+resolver tests green (cargo test -p aida-cli --bin aida -- linkage resolve_default); 67/67 classify tests green; cargo fmt --check clean.

    E2E smoke-tested on a real master-default repo via aida init: no stderr leak from aida show.
