spec_id: BUG-1-066
title: scaffold diff shows JSON-key-reorder noise on .claude/settings.json and .mcp.json
description: |-
  ## Problem

  ManagedMerge files (`.claude/settings.json`, `.mcp.json`) compare by JSON Pointer slot in scaffold status/upgrade — semantically correct, key reordering is a no-op. But `scaffold diff` does line-based text diff and shows ALL the key-reorder noise as if it were drift.

  User-observed on paradox 2026-05-06: settings.json reported a 32-line diff that was purely JSON object key reordering (PreToolUse/PostToolUse swap, matcher/hooks swap, command/timeout/type swap within hook entries). Same hooks, same statusline, same semantics — just different serialization order.

  ## Acceptance

  - Extend `aida_managed_diff_slice` (aida-core/src/scaffolding/mod.rs) to handle ManagedMerge files:
      1. Parse both expected and actual as JSON
      2. Look up `slots_for_file(path)` to get AIDA-owned JSON Pointer slots
      3. For each slot, compare the parsed sub-value
      4. If all slots match → DiffSlice::Match (don't show anything)
      5. If any slot differs → SliceDiff with pretty-printed slot values for the affected slots only
  - Settings.json + .mcp.json no longer surface in `scaffold diff` when only key ordering changed.
  - Real semantic drift (e.g., user edited a hook command) is still surfaced.
  - Falls back to FullDiff when JSON parsing fails on either side.
