    REVIEW FINDINGS TO ADDRESS (BUG-2656):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 05252f520429
    Recorded: 2026-11-17T18:52:14.369712204+00:00
    Findings:
    1. [P2] Preserve the explicitly selected PR throughout rework review lookup (aida-cli-lib/src/session_start.rs:476-482). The new branch filter selects one change, but queue_cmd/work.rs:2977 and 5148-5150 still call spec_open_change_key without that selection; reconcile_evidence::parse_open_change_rows returns the first matching PR. With two open PRs and --branch selecting the other head, pickup can refuse on the first PRs WAITING verdict or launch with its request-changes findings, ignoring the selected PRs review. Resolve the branch-selected change before the waiting gate and pass its forge-aware change key through both waiting and findings selection. Add a multi-change regression with distinct review verdicts proving that each advertised rework command uses its own PRs review. This violates AC ac629f4a and does not depend on newer-base changes.
    2. [P2] Add outcome-role regression coverage (aida-cli-lib/src/lane_result.rs:359-362). AC acb6131b was explicitly supplied as untraced, and the diff changes the output to role=implementer without any test asserting that field. The new bug2656 test only checks refusal guidance; the auto_branch test only checks branch selection. Add a traced test asserting role=implementer on the terminal outcome line and that a reviewer route cannot emit an implementer outcome. Required by the round-1 untraced-criteria contract; independent of newer-base changes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
