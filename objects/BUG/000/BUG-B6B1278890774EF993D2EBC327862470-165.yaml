    ## R1: bounded ownership after deletion — amended attribution contract

    Add injectable Codex source roots, project identity, current root inventory, historical reader and clock/I/O/budget adapters to Sources. Production shares vendor_activity's source-root resolution (`AIDA_CODEX_SESSIONS_DIR`, HOME fallback) and existing project/worktree/private-clone discovery. Do not import vendor_activity's filename/body substring attribution, session-list sibling heuristics, or machine-global usage.rs telemetry. Tests inject temporary roots. Discovery begins inside the shared bounded scan transaction, not with an unbounded preparatory walk.

    Build an ownership snapshot from three complementary evidence sets:

    1. Current proved project root, real Git worktrees, and leased seat clones from default_sources/list_worktree_paths/clone_seat_trees, including clones outside sibling naming conventions. Existing helpers provide candidates; their omission/error behavior alone is not proof the inventory was completely observed. Use fallible observations at the watchdog boundary for relevant discovery failures.
    2. Project-local structured agent session history, both active `.aida/agents` rows AND `retired` rows, containing native_session_id, worktree_path, started_at and ended_at/resume facts. Validate the project-local namespace/anchor and opened regular record; require exact native thread/session correspondence, not matching agent label/PID. The current load_entries includes retired history but flatten/skip-error load_entries_in cannot establish completeness. Add a small bounded fallible watchdog reader around these relevant files; no global registry-loader rewrite. Use the existing namespace's consistency boundary if required for a coherent read, with bounded acquisition, and never invert it with a registry mutation under the watchdog lock. A changed read snapshot is incomplete/retry, not a positive claim.
    3. Previously proved watchdog inventory persisted with the stable project identity, proved normalized root spelling and any resolved physical spelling/identity, exact thread/session binding, evidence origin, and observation/ownership intervals. This is retained proof, not a newly trusted basename. Retain it across root deletion while relevant trailing-day spend or attribution still depends on it. A prior root observation alone does not grant indefinite ownership of every future session at the same path.

    For each rollout, read a complete bounded structured session_meta. Current P has payload.id = producing thread ID and payload.session_id = root thread ID, plus timestamp/cwd. Repository legacy fallback to payload.session_id is accepted only where that older fixture actually uses it as the native session identity; do not substitute the root for a missing current thread ID. Retain parent/fork/history identities separately. Filename locates a candidate, never proves ownership. Do not inspect user/developer instructions, messages, tool outputs or quoted JSON to attribute cwd.

    Existing roots/cwd use component-aware normalized absolute paths and proved canonical aliases, with longest proved containing root. Deleted roots are **not canonicalized today**. Normalize their lexical absolute components against the recorded proved spelling/aliases and recorded root identity. A retired project-local record can prove a first-ever-watchdog-scan deleted worktree/private clone: its exact native identity, path and activity interval bind the rollout's session metadata and relevant events to this project. Pruned Git metadata and absence of previous watchdog state do not defeat surviving structured proof. Subdirectory cwd is matched beneath that proved historical root; strings sharing only a prefix or basename are not.

    Relevant time is the ownership interval of that native identity, not merely file mtime or current path existence. ended_at closes that holder's observation; it does not erase valid earlier spend. A resumed native thread can have several validated holder intervals. Do not reject legitimate earlier thread activity solely because the most recent holder started later: combine surviving earlier bindings/lineage; an uncovered relevant interval remains unknown. Previously observed root membership proves only its observation interval unless structured session history extends the proof. Persistent inventory must not invent a creation/deletion time it did not observe.

    Path reuse: index claims by project/root identity + native identity + interval. The same spelling reused by another session/project does not transfer ownership backward or forward. Disjoint validated bindings can coexist; same native identity with incompatible roots/times, overlapping contradictory claims, malformed/replaced history, or an event outside every proved interval is explicit attribution-incomplete for relevant evidence. Never resolve a conflict by live-PID rank or newest-row-wins. A file with conflicting session metadata also refuses.

    Three outcomes are distinct: owned (account exact recent spend), proved foreign (exclude without contaminating this project's coverage), unresolved recent candidate (refuse clean admission, name the missing identity/path/time proof). A foreign session's structured cwd outside all proved roots can establish exclusion when it does not conflict with surviving project history. A deleted same-name sibling is not ours by name; if outside proved project roots with coherent foreign metadata, exclude; if relevant binding conflicts or unavailable history prevents deciding, report unknown. No universal lost historical inventory is promised: report precisely when no proof survives rather than inventing one. Absence from the current live inventory is never sufficient reason to discard valid historical attribution.

    Seat/PID labels retain registry_attribution/attribute_entries live-holder precedence. They are separate from ownership and accounting; ended/dead/unregistered sessions with proved ownership count toward project spend until ordinary window aging. Known live project Codex holders without matching source evidence are incomplete. Open directory entries/files without symlink traversal or special-file blocking; bound reads through regular-file handles. Treat read_dir entry errors, invalid TOML, missing required identity, oversize and changed generations as fallible evidence. Charge all historical/current discovery, metadata and rereads against the existing byte/time budgets.

    ## R2: actual durable formats, minimum metric table, and capability refusal

    W retains session_meta, response_item, compacted, turn_context, token_usage_record and token_count/turn lifecycle in both modes. Legacy retains legacy user_message/agent_message/context_compacted; it does not retain ordinary ItemCompleted UserMessage/AgentMessage/ContextCompaction, although selected other ItemCompleted variants survive. Paginated retains ItemCompleted typed items instead of those legacy mirrors. The outer RolloutItemWire and EventMsg discriminants are snake_case: e.g. `type:event_msg`, `payload.type:item_completed`; inner `payload.item.type` is **PascalCase** `UserMessage`, `AgentMessage`, `HookPrompt`, `ContextCompaction`, etc. Typed text content uses `type:Text`. P serializes TurnStarted as `task_started` (accepting `turn_started`) and TurnComplete as `task_complete` (accepting `turn_complete`). Fixtures must serialize this actual nesting/casing, timestamps and ordinals, not hypothetical top-level `turn.completed`. The SDK exec stream is not a native source and cannot fill a native rollout gap without separate proved correlation.

    A capability is not “the field exists in a struct.” It is an actual producer + persistence mode + correlation path sufficient for one configured metric over a relevant interval. Record adapter/schema/persistence mode and effective policy signature per metric/vendor/interval. Distinguish complete measured zero, measured positive, unavailable-required, incomplete, and not-required. Positive effective wake/repeat/idle/compaction defaults are required; restart context alone is optional when restart_context_tokens == 0. Minimum admission is exact project-day spend plus complete measurements for every effective rule and applicable interval, freshness/verdict/budget conditions, with no uncovered override.

    | Configured metric | Actual durable source and necessary correlation | Identity / mirror / replay rule | Legacy and current-native capability | Missing-required refusal |
    | --- | --- | --- | --- | --- |
    | max_tokens_per_hour, daily_token_budget, budget_alert_pct and shift stop share | P TokenUsageRecord.usage from S record_response_token_usage; legacy event_msg token_count.info total/last checkpoints where a known segment/interval is proved. U demonstrates best-effort and a response with no record. | vendor + producing thread_id + response_id; root session/turn/thread totals are lineage/rollups. Reconcile checkpoints with constituents, never add both. | Both 0.166 modes persist stable records and token_count. Repository legacy accounting fixtures support bounded checkpoint/response parsing only, not complete policy. Required components/defaults must match producing schema. | Missing response usage for observable completed work, malformed components, unresolved interval/baseline or overlap, unknown accounting producer => that token interval incomplete. Token records alone never prove every call measured. |
