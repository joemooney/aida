    ## Selected transport: the already-running normal LOCAL queue daemon

    No new app-server process/listener, token, daemon owner, remote service, socket permission, auth refresh or global config is introduced. The host mail-wake invocation becomes an existing-client implementation of the installed queue's typed request. It MUST NOT invoke shell `codex queue` and interpret its output as a caller-ID receipt: that CLI generates its own UUIDv7 and prints a QUEUE submission ID, with no caller-ID option.

    1. Capture the existing host adapter's trusted Codex installation, exact normal CODEX_HOME spelling and exact native thread UUID binding at arm/target selection. Do not derive them from queue message text, model env, a request-provided socket or aliases selected by the child. In native production this is the existing host-owned mail-wake boundary, not authority delegated to the model. Source source-runtime paths are read as DATA only.
    2. Compute the existing rendezvous `<CODEX_HOME>/app-server-control/app-server-control.sock` using app_server_control_socket_path. On Linux it is intentionally a SYMLINK advertisement, NOT the authoritative socket. The actual path is shared_daemon_socket_directory()/lowercase_hex(SHA256(canonicalize(rendezvous.parent) + filename as Unix path bytes)); verified_local_daemon_socket checks precisely this link target and the shared directory's uid and mode 0700. Do not guess a socket basename, trust arbitrary symlinks or recursively follow the advertisement. Resolve the exact documented alias once, verify the computed physical target and connect to THAT target under the same normal daemon identity. `/tmp/codex-daemon-<uid>` is the observed standard shared directory, not a new configurable endpoint. No endpoint creation, startup-lock takeover, embedded fallback, auto-start, restart or directory repair in this producer.
    3. Host checks each ordinary path component with pinned dirfds, nofollow beneath resolution; the SINGLE explicitly recognized rendezvous link is checked by readlink bytes against the computed physical path. Shared directory is a nonsymlink owned directory exactly 0700; physical endpoint must be a socket owned by the invoking host uid with installed 0600 socket semantics. Capture dev/inode identity before connection and verify no replacement afterward. SO_PEERCRED on the connected Linux Unix socket must give the same trusted uid and a live pid/start identity; retain endpoint generation and peer identity for this attempt. This adds verification to the existing same-user local contract; it does not claim upstream's Linux client already performs that peer check or that uid possession defeats hostile same-uid HOST code. Native writable aliases must not reach the protected physical socket directory (the installed native mask stays unchanged). A mismatch/refusal is an unsupported/unsafe endpoint, never an invitation to relax the mask.
    4. This is WebSocket over that Unix connection, HTTP upgrade request URI `ws://localhost/rpc` (remote.rs:72,784+), normal RFC6455 client masking. Choose plain text frames, omit the optional zstd negotiation header so existing acceptor stays Plain. No TCP port or new endpoint. Initialize JSON-RPC with unique ID, `clientInfo:{name:"aida-mail-wake",version:<installed AIDA build>}`, capabilities `{experimentalApi:true, explicitGatewayOauth:false, requestAttestation:false, mcpServerOpenaiFormElicitation:false}` and supported omitted/default optional fields. Match the initialize response ID, then send `initialized`; source remote.rs::initialize_remote_connection records userAgent/server version, codexHome and platform metadata. Require reported 0.166.0/schema pin and expected local home/platform; missing/unrecognized version is unsupported, never guessed. No initialize capability invents approval or origin authority.
    5. Normal LOCAL control socket authentication is possession/access to the existing private same-uid Unix endpoint. It has NO bearer-token read or account-auth exchange: run_control_socket_acceptor upgrades it directly; RemoteAppServerEndpoint::UnixSocket has no auth_token. The WSS remote branch's Authorization Bearer and account-owned remote control are DIFFERENT contracts and are NOT selected. Producer never opens auth.json, keychain, model account, token env, login RPC or credential refresh. Unexpected account challenge/server auth request refuses (no model-assisted approval). Secret-read closure is EMPTY for this local producer. Do not describe a remote bearer as required for this local route.
    6. Before add, `thread/read` with exact UUID, includeTurns:false must return that same thread and expected cwd/local ownership metadata. Match its normalized project/root to the trusted target and independent structured launch/session binding. A server UUID alone is not ownership: inability to prove expected project/thread or a foreign home/peer refuses. Do not use session-name lookup or accept server-provided unrelated history paths for filesystem traversal. Requests address one already armed thread only; do not create/fork/start another. Preserve the current producer's no-resume behavior; a later explicit resume is not added implicitly. Existing remote/no-daemon/embedded variants without this exact ownership contract refuse this producer before intent/API; they are not silently made human by the watchdog.
    7. Send only `thread/queue/add` with `{threadId:<exact UUID>,input:[{type:"text",text:<exact UTF-8 body>,text_elements:[]}],clientUserMessageId:<journal logical ID>}` using the actual app-server-protocol v2/turn.rs UserInput serializer: enum rename_all camelCase renames variants; its Text field is `text_elements` (no rename_all_fields), not invented `textElements`. ThreadQueueAddParams itself serializes camelCase. No cross-layer enum substitution. Match request/response ID and exact queuedSubmission input/clientUserMessageId; record returned id separately. Queue list uses bounded pagination for reconciliation, never as delivery acknowledgment. No update/delete/start RPC issued by this adapter. Unexpected queue-edit evidence leaves original uncertain; it cannot rewrite the origin commitment.

