    # INDEPENDENT ADVISOR JUDGMENT: CHANGES REQUESTED — BUG-2391 amended sketch

    Reviewer: codex-advisor-17, own companion advisor context, 2026-11-01. I am independent of advisor15 (amended sketch), advisor14 (previous review), advisor13 (original sketch), and advisor16 (TASK-2712). This is architecture judgment only, not implementation review or permission to implement, dispatch, merge, change status/queues/configuration, or operate timers. Owning object BUG-b6b1278890774ef993d2ebc327862470-165 (BUG-2391). All three ACs and Joe's full proxy decision remain binding.

    I read the FULL 54KB amended sketch `/tmp/aida-BUG2391-amended-sketch-result.md`, FULL prior judgment `/tmp/aida-BUG2391-signoff-result.md`, full owning description and proxy, and the current source at 471540a8c477a50a81170f338d81532cb5dbd329. Installed CLI reports codex-cli 0.166.0; I independently ran its version and queue help only. Pinned upstream is 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856, with cached source plus independently fetched official thread.rs/turn.rs API definitions. No live transcripts, registry payloads, credentials, user configuration or watchdog state were inspected. No Cargo, model call, implementation, dispatch, status/queue mutation or timer action occurred.

    ## Disposition of the amended forks

    R1 / fork 1 is ACCEPTED WITH THE AMENDED CONDITIONS. Current proved roots plus bounded fallible project-local active/retired exact native-session/path/time bindings and previously proved root inventory address deleted/pruned worktrees and private clones, including a first scan. Normalize missing roots against recorded proved spelling/identity, preserve valid ended-holder spend, separate PID labels from accounting, and apply ownership intervals across resume history. Disjoint path reuse is separate ownership; conflicting native/root/time claims remain unknown. Proved foreign sessions are excluded; unresolved relevant candidates refuse. A generic current-root absence is neither foreign proof nor permission to drop historical spend. Inventory entry/read/parse/lock/generation/budget failures remain incomplete. This is a watchdog-local reader, not a registry rewrite.

    Forks 2, 3 and 5 remain ACCEPTED WITH ALL CONDITIONS; the amendment retains them substantively:
    - Per-vendor, per-effective-metric, per-interval capability/policy-bound completeness; measured zero, positive, unavailable-required, incomplete and not-required stay distinct. Findings and completeness are orthogonal. Old Claude-only state, unknown verdict/capability, stale/deleted evidence, partial-tripped, failed load/lock/save and complete-Claude/incomplete-Codex cannot admit Codex. Preserve all Claude comparisons and crossing IDs. The actual production budget_evidence_verdict must consume scan-derived evidence with empty overrides; no COVERED_VENDORS change before full real coverage.
    - Exact producing thread/response identity, no addition of checkpoints or parent/root/turn rollups to constituent amounts, cache/reasoning subsets, source-consistent cache-write treatment, baseline rather than arbitrary first-checkpoint spend, explicit reset/replay segments and real inherited-prefix lineage. Whole known intervals inside a queried window/day may be exact without invented minute timestamps; boundary-straddling deltas remain incomplete. Observable usage-free responses are unknown, not zero; best-effort TokenUsageRecord availability is not call completeness.
    - One permanent bounded watchdog transaction lock and invocation-private atomic state replacement; coherent offsets/generation/dedupe/contributions/inventory. Full relied-on prefix digest revalidation detects same-inode/same-length interior edits; budget exhaustion cannot refresh clean proof. Discovery, history dereferences, metadata, tails, oversized-line discard and rereads all consume existing bounds. Bounded retained identities cannot be silently evicted into replay double-counting. Failed persistence never creates fresh health.

    R2 / fork 4 is a useful source-backed closed metric table and an HONEST STOP, but is NOT implementable full-goal signoff yet. The native Legacy/Paginated nesting/casing, delivered-input versus turn/mirror distinction, terminal-message correlation, conditional context, real tool setup envelopes, missing-usage calls and compaction eligibility requirements are retained. The precise producer gap remains required, not optional.

    ## Source finding: a supported correlation route exists, but current mail wake does not use it

    The current local scripts/codex-mail-wake.py tick (~396) and partial_wake (~445) invoke `codex queue --thread ... --message ...`. Its ledger records message/mail acceptance facts, not native prompt delivery. Installed queue help has no origin or caller-selected client-message-ID flag; do not invent one. Pinned cli/src/queue_cmd.rs and tui/src/session_queue_commands.rs construct ordinary text input. app-server/src/request_processors/thread_queue_processor.rs::submission_into_turn_input (~315) carries it as UserInput with client_id. core/src/session/mod.rs (~3764) labels the parts User; history/src/heartbeat.rs recognizes only the actual scheduled-heartbeat trigger. Queue text is consequently User for both human and AIDA automation. A role, prefix, timestamp, free-form queue trigger or matching text cannot recover missing origin.

    However, the official **typed API** has an exact existing join that is stronger than the current CLI ledger:
    - app-server-protocol/src/protocol/v2/thread.rs:947 ThreadQueueAddParams serializes camelCase `threadId`, `input`, `clientUserMessageId`; the latter is caller supplied. ThreadQueueAddResponse returns queuedSubmission with separate queue id, input and clientUserMessageId. Queue list/update/delete/start are separate operations, not delivery acknowledgements.
    - thread_queue_processor.rs:88 and :315 preserve that client ID into TurnInput::UserInput. core/src/session/mod.rs::record_user_prompt_and_emit_turn_item (~5490-5552) records prepared raw history, then sets UserMessageItem.client_id and emits the logical completed input.
    - protocol/src/protocol.rs:2771 UserMessageEvent carries client_id. The upstream synthetic conversion test (~6296-6310) explicitly verifies the typed item client's ID survives as_legacy_event. rollout/src/policy.rs retains this legacy UserMessage in Legacy and typed ItemCompleted UserMessage in Paginated. Thus both supported durable modes can expose the ID of an actually recorded logical delivery, whereas raw ResponseItem ID and the typed item's generated ID need not match.

    These facts support an AIDA producer origin-to-native-delivery join without pretending Codex itself emits Harness provenance on this queue route. They do NOT show that an AIDA API adapter, authenticated endpoint binding or durable protected origin journal currently exists. Upstream references, all at the pinned commit: [typed queue API](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/app-server-protocol/src/protocol/v2/thread.rs), [producer](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/core/src/session/mod.rs), [legacy event and conversion test](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/protocol.rs), [persistence policy](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/rollout/src/policy.rs).

    ## Independent direction: A, preserving policy; precise prerequisite amendment required

    Choose A, specifically minimal AIDA-owned producer observability over the EXISTING typed queue API, rather than policy option B or a Codex patch. I accept that direction within the watchdog/native-parity goal, subject to the following bounded producer contract. Overall CHANGES REQUESTED remains because endpoint/authority deployment and complete delivery/compaction proof are not in the current authored sketch. This ruling does not create requirements or authorize implementation of the prerequisite.

    1. The existing mail-wake producer must allocate a unique logical delivery ID before submission, bind it to exact native thread + stable project/root/producer identity and exact UTF-8 body digest/length (and body bytes only if necessary for existing normalization), and durably record its nonhuman mail-wake origin. Use that ID as the API clientUserMessageId. Include ordinary batch, role-only and partial notice paths. Keep a separate queue submission ID and each attempt/result; never substitute mail IDs, acknowledgment, adapter exit 0 or queue-list disappearance for delivery.
    2. The origin record is trusted ONLY because it is produced by a specifically admitted AIDA-owned producer, under a pinned host-owned writer boundary with strict path/owner/mode/link/handle checks, coherent lock/atomic persistence, bounded schema/generation and explicit project/thread binding. A child-writable arbitrary sidecar, copied acceptance ledger or body prefix cannot grant provenance. The amended sketch must specify that writer boundary and how the watchdog verifies it. If this adds protection/runtime authority beyond the existing adapter, root must decide that scope before code.
    3. Actual delivery is the native logical user-delivery event with exact client ID, exact thread and exact body join against that trusted producer record, through the verified source-emission sequence. Native file ordinal/generation and logical item identity distinguish mirrors/recovery from new delivery. Matching a known automated delivery classifies THAT delivery only; absence of a producer record does not prove an unclassified user input human. Native/producer sequence gaps remain incomplete. Include steering, replay, restart and both history modes. A malicious/wrong-thread reused ID, same ID/different body, duplicated actual delivery or conflicting producer ownership must not collapse real wakes or launder provenance. Detect contradiction as incomplete while retaining proved lower bounds.
    4. Prepared, submitted, native-accepted and native-delivered are separate states. Persist intent before sending, then reconcile using exact API response and native delivery. Pending/dropped/cancelled/edited/uncertain/retried inputs must not count as delivered. After uncertain submission, do not blindly requeue or claim exactly-once API behavior (the caller-supplied ID alone does not promise server idempotence). Use bounded reconciliation under the existing invocation/schedule; no new timer or polling model. Crash after native delivery before producer acknowledgment must reconcile to one proved delivery, not lose or double-charge it. If the native source lacks required retained evidence, refuse that interval.
    5. This direction preserves all effective repeat/wake/idle/token/compaction/poll rules and all native producer scope. It must not silently support only AIDA mail while admitting other relevant automation as human. Enumerate every relevant automation route and its actual durable provenance or origin join. Unclassified legacy/other queue automation remains unavailable-required. Adoption can repair future intervals; it cannot retroactively manufacture old origin records. Ordinary window/day aging and exact historical token retention remain required.
    6. Compaction remains a separate required proof. Pinned CompactTask explicitly emits a Compact start; emit_turn_started provides turn_attribution only for Regular. Inline auto and manual share inner compaction machinery; compaction metadata passed toward Responses analytics is not by itself a durable rollout trigger. Demonstrate the exact regular/manual, pre/post-turn, remote/background and recovered transition sequences that actually establish eligibility. A bare compacted/ContextCompaction record does not suffice. If relevant auto/manual cases are durably indistinguishable after full correlation, report that producer/runtime prerequisite for root decision; do not count all compactions or mark the rule not-required.
    7. Use an existing supported app-server connection/initialization and existing endpoint authentication contract. The source API shape proves a join, not access to a production daemon. Root must decide any new service/client ownership, external runtime work, endpoint/credential handling or privileged producer writer. No auth token in argv/logs, no model/account credential redesign, no upstream runtime patch, no new grant policy, no daemon/socket permission relaxation and no global settings. Return a precise adapter/endpoint/ledger/correlation sketch for independent judgment. If that bounded route cannot be proved, stop with that exact blocker; only the operator may revise the acceptance/policy.

    ## Additional required proof for this direction

    Retain every named case from the amended sketch, reproduced below. Add source-faithful synthetic API-to-origin-to-native cases (proposed names):
    - bug2391_producer_api_client_id_legacy_and_paginated_delivered: exact typed request/response; both actual durable logical user forms; real client-ID conversion; full positive repeat/body/wake join and actual scan-to-production-guard success with empty overrides only after ALL effective metrics are complete.
    - bug2391_producer_acceptance_without_delivery_is_not_wake: accepted/pending/cancelled/deleted/list-disappeared/failed-resume/uncertain send cannot become delivered or complete zero; ordinary no-delivery interval completeness must be proved, not assumed from ledger silence.
    - bug2391_producer_delivery_before_ack_crash_reconciles_once: intent durable, native delivery precedes ledger response, restart/retry/steer/replay do not double-count; distinguish two real deliveries even when bodies match.
    - bug2391_producer_origin_id_thread_body_conflicts_refuse: wrong thread/project/producer, replayed or conflicting ID/body, queue-edited body and duplicate deliveries; no newest-wins or text-prefix authority.
    - bug2391_producer_journal_untrusted_or_gap_refuses: writable/symlink/hardlink/replaced/oversized/corrupt/missing journal or generation, lock/read/write failure, retention exhaustion, partial records and expired proof; deterministic I/O seams, bounded handles, no actual user state.
    - bug2391_other_queue_automation_not_silently_human: actual unmarked CLI route STILL refuses repeat completeness; a matched AIDA record cannot establish all other inputs human. Legacy pre-observability intervals age honestly.
    - bug2391_compaction_actual_manual_auto_remote_recovery_matrix: prove eligible transition correlation separately for relevant producers; indistinguishable cases refuse actual budget_evidence_verdict.

    All admission negatives use scan-derived snapshots and actual budget_evidence_verdict with no uncovered override. Token-only positives and heartbeat-only positives never discharge full production coverage. Keep one future focused runaway_seats local gate plus fast checks; no test/build is run in this judgment. Full suite stays CI's job.

    ## Retained named test inventory (binding, proposed; not executed)

    Use `runaway_seats::tests::bug2391_*` names, with all HOME/XDG/session/registry/worktree/clone/config/state trees under fresh tempdirs; inject Sources and use scoped env guards only where resolver coverage needs HOME. Never enumerate real HOME, transcripts or session files. No real timers, drains or vendor processes.

    * `bug2391_scopes_main_registered_worktree_and_seat_clone`: actual fake Git inventory and fake clone lease, cwd subdirectories, native IDs and registry label; `bug2391_excludes_foreign_prefix_and_cwd_prose`: unregistered same-prefix siblings, foreign JSON quoting cwd, tools/messages and malicious metadata conflicts.
    * `bug2391_native_envelopes_and_null_info`: session_meta id/session_id compatibility, whitespace, event_msg, response_item and stable token_usage_record; null info alone is not zero spend.
    * `bug2391_same_policy_window_and_token_thresholds`: configured equality/over-threshold boundaries, cache/reasoning subsets, daily budget and optional context; `bug2391_wakes_replies_compactions_are_not_mirrors`: duplicate surfaces count once, tool/analysis events do not become human wakes or final replies.
    * `bug2391_cumulative_is_not_per_message`: checkpoints 100,100,160 yield known increment 60 after baseline, not 360; full-origin history and exact last-usage evidence separately prove legitimate initial spend. `bug2391_equal_distinct_responses_both_count`; `bug2391_response_and_checkpoint_overlap_count_once`; `bug2391_gap_across_window_is_unknown`.
    * `bug2391_reset_fork_resume_and_replay`: explicit segments, unexplained decreases, file copies/reverts and state reload; `bug2391_parent_child_root_session_ids_do_not_collapse_threads`; `bug2391_parent_rollup_child_overlap_unknown_blocks_admission` and a provably disjoint child case whose daily sum is exact.
    * `bug2391_append_partial_tail_and_restart_no_double_count`: two scans/reload, finish trailing record, exact persisted offsets/baselines; `bug2391_rotation_and_same_size_replacement_invalidates`; `bug2391_concurrent_scan_lock_cannot_publish_lost_progress`.
    * `bug2391_missing_malformed_oversize_unreadable_are_not_clean`: traversal and entry failures via deterministic injected I/O errors, absent HOME/root, invalid/negative/overflow tokens, truncated metadata and unsupported usage; `bug2391_claude_ok_cannot_mask_codex_incomplete`; `bug2391_tripped_partial_retains_blindness_and_active_rules`.
    * `bug2391_byte_line_time_limits_resume`: tiny synthetic budgets for initial tails, metadata probes and global limits, deterministic injected clock, giant-line discard with bounded memory. No threshold/config changes.
    * `bug2391_silent_session_window_aging_and_dead_holder`: advance fake now, recent registered/unregistered activity, untimed mtime, future stamp, one-hour rate clearance vs 24h budget retention, poll setup expiry and last-write labels.
    * `bug2391_shift_requires_fresh_complete_measured_codex`: invoke actual guard with snapshots derived from synthetic scans; complete Codex succeeds with empty override; old Claude-only state, no proof, stale, missing, incomplete, unknown and partial-tripped states refuse. Use pure guard/recording mocks; never execute a live shift tick.

    Future local gate ONLY: one targeted watchdog filter, e.g. `AIDA_CARGO_TIMEOUT=10m cargo test --profile agent -p aida-cli-lib runaway_seats`, plus `make check-ci-fast`. Place admission regression cases under that same filter or a watchdog-named test submodule so the one run exercises the production shift guard too. Run potentially long Cargo in tool background mode; after timeout/KILLED inspect `cargo ps` before retry. Add `make test-touched` and `make check-ci-compile` only for >10 changed files or shared test infrastructure edits. No full suite, unfiltered --lib, outer timeout, or AIDA_CARGO_NO_SLOT bypass. None are run during this sketch.


    ## Required amendment cases, in addition to every retained test

    All Sources, HOME/XDG/session/registry/worktree/clone/config/state/queue producer trees are synthetic tempdirs. Use deterministic fallible I/O and clock seams, not permission bits that fail differently for root. No live user content, registry, vendor process, shift or timer.

    R1 names:

    * `bug2391_first_scan_deleted_pruned_worktree_retired_binding`: fake Git worktree removed AND pruned before first watchdog run, matching retired native/path/time record, recent usage retained exactly, normal day aging.
    * `bug2391_first_scan_deleted_private_clone_ended_binding`: deleted clone outside sibling conventions, exact ended/retired record proves ownership on first scan, ended holder never loses spend.
    * `bug2391_removed_previously_proved_root_retains_spend`: inventory first proved, root removed between scans, retained binding/interval exact; missing source later invalidates proof without erasing validated spend.
    * `bug2391_historical_path_reuse_conflict_refuses`: disjoint reuse stays separated; overlapping/conflicting native/time/root evidence unknown/refusal, never newest-wins. `bug2391_deleted_foreign_same_name_is_excluded`: coherent foreign/deleted same-name sibling excluded; unresolved candidate separately unknown.
    * `bug2391_historical_inventory_read_errors_are_incomplete`: active+retired enumeration/read/parse/limit/generation failures cannot produce first-scan clean; no global loader mutation.

    R2 names:

    * `bug2391_0166_legacy_durable_metric_paths` and `bug2391_0166_paginated_durable_metric_paths`: source-faithful mode-specific producer sequences with snake outer/envelope + PascalCase typed inner tags. Actual delivered input/mirrors, steers, observed usage, terminal reply, eligible correlated compaction; no requirement all representations coexist. These assert positive measurements, not a fictional all-policy guard success for queue automation.
    * `bug2391_acceptance_order_alone_is_not_a_wake`: synthetic context also receives order; event/acceptance/delivery correlation required. `bug2391_user_item_ids_need_actual_mirror_join`: raw ID and separately created typed user ID differ; same text across distinct deliveries counts twice; ambiguous ordering refuses.
    * `bug2391_unknown_provenance_is_not_zero_repeat`: omitted/Unknown/legacy harness_injected:false and malformed positional metadata; require failure for affected metric. `bug2391_mixed_content_static_context_and_hook_mirrors`: raw HookPrompt provenance, mixed human/harness/static instructions, metadata-skipped UI mirror, dedupe; no static context repetition counted as wakes.
    * `bug2391_scheduled_heartbeat_mark_is_actual_provenance`: source-emitted user.heartbeat proves its particular scheduler origin/body; copied wrapper text without producer mark does not. Do not call this the mail-wake producer.
    * `bug2391_actual_queue_mail_wake_loses_origin_refuses`: reproduce scripts/codex-mail-wake.py→Q→S plain queued input with turn_trigger queue, client_id, positional User and user.text as actually produced; no added Harness field. Human queue input is structurally indistinguishable for source attribution. Token/wake/reply positives cannot conceal repeat incomplete. Feed scan-derived snapshot to actual budget_evidence_verdict with empty overrides and assert refusal. This is the exact required blocker test.
    * `bug2391_missing_phase_terminal_correlation_succeeds` versus `bug2391_ambiguous_commentary_is_not_terminal`: successful task_complete + unique matched delivered message supports legacy None phase; commentary/partial/compaction_output/reasoning/tool/inherited copies excluded. Unmatched terminal text/finality unknown.
    * `bug2391_compaction_transition_snapshot_dedupe_and_eligibility`: regular foreground correlated auto versus standalone manual, copied compacted/replacement/legacy/typed mirrors; nested latest usage no spend; uncorrelated remote/background/legacy trigger is incomplete. Never fabricate auto on ContextCompactionItem or CompactedItem.
    * `bug2391_observed_response_without_usage_is_incomplete`: U's real no-usage producer sequence, unchanged/no usable token observation, correct partial output and refusal. Do not require ephemeral RawResponseCompleted to exist in durable JSONL.
    * `bug2391_context_disabled_absent_context_not_a_refusal`: default restart_context_tokens=0 yields not-required context; isolate other capabilities honestly, do not claim a full queue success. Enabled context lacking data refuses.
    * `bug2391_known_interval_inside_window_is_exact`: multiple-call cumulative delta wholly inside window/day contributes exact total without forced per-minute events; straddling boundary retains unknown/lower bounds.
    * `bug2391_same_inode_same_length_interior_rewrite_invalidates`: mutate an interior record with same inode/length and unchanged head/tail, digest validation detects it; tiny reread budget explicitly incomplete. `bug2391_two_writers_atomic_checkpoint_reload`, `bug2391_interrupted_save_cannot_refresh_proof`, and rotation/reset/reload assert coherent aggregates/checkpoints/offsets/inventory and no double charge.
    * `bug2391_retention_exhaustion_is_not_replay_amnesia`: bounded dedupe/root/lineage retention cannot silently forget old identities and recount copied history.

    Every missing-required capability case above must exercise actual budget_evidence_verdict with scan-derived snapshots and empty uncovered overrides, together with old-schema/Claude-only/partial-tripped/stale/unknown-verdict/failed-save cases. After an independent producer resolution, `bug2391_shift_requires_fresh_complete_measured_codex` must also supply a genuinely supported complete producer-to-native-durable-to-adapter-to-guard success. Until then success is an unresolved acceptance gate, not a fabricated test passed by mocks. Pure guard/recording mocks avoid running a live shift; they do not manufacture evidence completeness.


    ## Next action and authority

    Root should decide the bounded producer/API endpoint + protected origin-journal prerequisite above and obtain the amended complete source-backed sketch, including exact compaction eligibility, before any implementation. No policy reduction is selected. The architecture gate remains CHANGES REQUESTED; R1 and accepted forks 2/3/5 do not reopen, and all named tests remain. This comment is an independent judgment, not a status/hold/queue/merge action.

