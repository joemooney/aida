- id: 01a197c1-7ff6-76a0-bdd4-b3fcf1bf2ec4
  author: joe
  content: |
    # INDEPENDENT ADVISOR21: CHANGES REQUESTED — BUG-2391 boundary amendment

    Reviewer: codex-advisor-21, advisor/companion, 2026-11-01. Owner BUG-b6b1278890774ef993d2ebc327862470-165 (BUG-2391). Independent of author20, author18, implementer27, and signers19/17. I authored neither the proposed boundary amendment nor implementation. This is read/judgment only. Direction B is NOT CLOSED under the proposed deployment and current prohibitions; no implementation authorization follows.

    ## Decision

    I accept the purpose of a minimal SAME-BUG-2391 enforcement integration: the already-required protected origin must be enforced by the existing trusted HOST owner. I do not approve author20 H1-H8 as a closed mechanism. They specify desired properties but leave the essential execution-owner and transport integration unresolved. A registry receipt, command identity, journal mode, settings snapshot, post-send CAS or client-side wrapper cannot fill that gap.

    The actual fork is concrete: BUG-2391 selects the already-running normal-home LOCAL daemon endpoint, while the reusable signed STORY-2238 boundary deliberately excludes that host daemon and creates per-launch private vendor state/daemon lifetime. Today's native launch does not deploy the STORY-2238 boundary. Keeping the old endpoint while wrapping only a newly launched TUI leaves the old daemon's execution outside that wrapper. Forcing embedded removes the selected external local queue connection; no inspected source establishes that embedded automatically advertises an equivalent endpoint. Neither substitution is an implementation detail.

    There IS an upstream managed-denial mechanism. It must not be dismissed because guessed requirements filenames returned 404. I found and read its actual source. However, no supplied evidence establishes that a trusted existing deployment has installed an origin-specific mandatory denial in the normal daemon, its actual executors and every relevant host write entrypoint, or that it remains effective for existing/in-flight work. Thus this review does not approve an alternative managed-profile deployment by assumption either.

    This is missing capability/deployment closure, not an observed writable production journal, exploit, impossible native design or generic human-only difficulty. No live boundary was tested here. All three ACs remain mandatory and unfulfilled by this review.

    ## Evidence read and source pin

    Read FULL boundary amendment (24,983 bytes), implementation result (8,553), signed advisor19 result (13,437), author18 producer sketch (76,055), retained advisor17 conditions/tests (25,723). Large reads were split to recover output truncation. Read two-seat, rework and recovery discipline; canonical BUG-2391 description and current proxy/adoption direction; STORY-2238 architecture/signature C1-C12 and P1-P3 qualifications/counter-evidence; ADR-66. No new approval is inferred from historic Approved wording in artifacts. No queue/status command was issued.

    Inspected actual AIDA source in this checkout, including agent_launch, session, mail_wake and mailbox_wake_run. Upstream pin throughout is 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856. Read supplied pinned source caches and fetched the actual config requirements modules from that exact official repository commit. New source byte/hash manifest: /tmp/aida-advisor21-source/manifest.json. These are source reads, not deployment probes. No supplied reproduction script or code test was executed in this review.

    ## Grounded source findings

    1. **Current AIDA native posture is intentional.** agent_launch.rs::tool_contained_flags:1832 supplies workspace-write/never. wrapped_agent_program_and_args:5559 wraps only Claude. session.rs::vendor_containment_posture/containment_applied and OVERVIEW.md's Explicit vendor containment policy distinguish native from AIDA containment. Do not silently replace trusted codex="native" or label it AIDA-contained. mail_wake.rs::arm_pending:167 checks pending/target/service and transitions the row; it has no actual worker-policy barrier. mailbox_wake_run.rs::ThreadQueue/CodexQueue:218 currently invokes codex queue; Python tick/partial is the other producer family. Their acceptance/transaction locks do not enforce physical origin integrity.

    2. **Native worker selection differs from client launch.** tui/src/lib.rs::app_server_target_for_launch:1063 selects Embedded, LocalDaemon or Remote. Its explicit comment says a shared daemon cannot adopt this invocation's executor selection. LocalDaemon can have embedded fallback. tui/src/app_server_connection.rs::connect rejects Embedded as having no remote connection and connects LocalDaemon/Remote separately. A wrapper around the TUI does not envelop an already-existing daemon; endpoint identity does not establish executor identity. Remote execution requires the actual execution host's enforcement, not controller mount observations. Headless exec cannot be assumed to have the TUI's execution graph or external queue endpoint.

    3. **Real settings constraints exist; notifications are not the proposed host interlock.** ThreadReadResponse contains Thread/read_state, not effective mounts. Start/Resume/Fork snapshots do contain policy information. TurnStartParams and ThreadSettingsUpdateParams permit policy/runtime-root/environment changes. thread_settings::{prepare_update,apply_update,emit_applied} updates and emits real snapshots. session/mod.rs:5195 explicitly allows a step to predate an acknowledged update or use executor-owned permissions. The internal persistence lock is not an AIDA-origin all-executor admission barrier. Reading notifications cannot interpose before every write or bind a previously running process to a new origin generation.

    4. **Managed monotonic denial is a real candidate, not existing deployment proof.** config/src/config_requirements.rs::ConfigRequirements has constrained permission_profile and filesystem constraints. FilesystemRequirementsToml/FilesystemConstraints:650-705 expose deny_read; requirements_layers/permissions.rs::DenyReadMergeState merges denials additively across managed layers. core/config/mod.rs:4432 builds managed_deny_read_policy, preserves denials in effective permissions and installs DenyReadValidator. Config::set_permission_profile:544 preserves managed denials; permission_profile_catalog.rs::validate_permission_profile_for_deny_read:129 rejects DangerFullAccess/ExternalSandbox under required denial. session/session.rs::set_permission_profile_projection:574 preserves existing deny reads across the relevant projection. tools/sandboxing_tests.rs::deny_read_preserves_the_sandbox_for_explicit_escalation_and_blocks_policy_bypass describes the intended restriction through escalation. I read this test; I did not run it.

    These facts materially narrow the claim: it is false to say Codex has no managed restriction or that every settings change necessarily drops one. It is also false to infer an installed, origin-specific policy from the availability of these functions. Applying a new trusted managed requirement to the normal daemon is a deployment/policy action outside this review. CLI -c or child-selected config is not automatically a trusted requirement. Existing processes, other environments/executors, bypass-capable host tools, aliases and retained FDs still need actual applicable enforcement evidence. No real config was inspected and no blanket global managed policy is authorized here.

    5. **Native tools have their own filesystem/executor path.** core/tools/runtimes/apply_patch.rs::file_system_sandbox_context_for_attempt constructs FileSystemSandboxContext from the attempt and additional permissions; run uses the selected TurnEnvironment filesystem and apply_patch_with_options. uses_executor_managed_process_sandbox distinguishes remote. Shell/unified_exec use their execution environment and sandbox orchestration. Therefore protecting shell argv alone cannot certify native function tools or apply_patch; nor does wrapping a client establish what a remote/filesystem executor enforces. These are real supported sandbox contexts, not an assertion that apply_patch is inherently unconfined.

    6. **Common-Git protection needs its actual object and aliases.** permissions.rs::default_read_only_subpaths_for_writable_root:2360 resolves a linked .git pointer to gitdir, not Git commondir. Protecting main/.git/worktrees/seat does not prove protection of main/.git/aida/mail-origin-v1. The ordinary main .git directory may be protected in a particular native policy; this review has not disproved that. permissions/local_aliases.rs explicitly scopes matching to one operation/environment and does not establish remote aliases. An installed denial must protect the physical object and replacement authority through every permitted alias, not merely a spelling. No observed production write is claimed.

    7. **STORY-2238 cannot be borrowed half-way.** Its signed C2/C3/C5/C6/C8/C9/C12 select whole-harness namespaces, FD hygiene, IPC enforcement, private vendor state and in-boundary daemon lifetime, protected main common Git, typed host store writes and actual Claude migration. C6 specifically forbids host daemon reuse. Its host P1 proves synthetic nested composition, with a separate keyring-visibility qualification; it does not prove real model lifecycle/own-seat authorization. Host P2 selects the signed broker branch on the reported ABI8 host, not pathname-Unix Landlock by ABI-number inference. P3 and slice-C integration remain separate gates. The signed legacy proc-escape claim also has explicit host counter-evidence: no working current-path write escape was established. I do not repeat it as an exploit.

    Official pinned source anchors: https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/tui/src/lib.rs ; https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/config/src/config_requirements.rs ; https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/core/src/config/mod.rs ; https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/core/src/tools/runtimes/apply_patch.rs . Current general OpenAI documentation was consulted, but the verdict is grounded in these pinned implementation contracts and AIDA's signed deployment conditions, not current documentation as a substitute for the installed source pin.

    ## Smallest concrete choice to return to root

    Under the CURRENT prohibition set, retain P1 as NOT CLOSED. Do not send implementer27 back to invent an attestation or discover the same absent deployment contract. The exact product decision for the established reusable route is:

    **Authorize prospective BUG-2391 integration with the signed STORY-2238 whole-worker backend, including changing the producer's accepted endpoint binding from normal-home global daemon to the exact supervisor-owned private per-launch LOCAL endpoint, when that backend is actually ready.** Keep the native Codex sandbox inside it. This is an explicit deployment/endpoint amendment for selected new managed lanes, not a global native-workflow downgrade, forced daemon restart, secondary general containment stack or authority redesign. It is outside the narrow B proposal as currently constrained, and I do NOT authorize it in this verdict. Root/operator must expressly accept that endpoint/deployment change before a revised closed sketch can be signed. A private endpoint is not magically available from an embedded TUI; the actual supervised daemon/control socket and host client access must be selected and demonstrated under signed C5/C6. Do not implement a second service merely to preserve the old endpoint shape.

    If preserving the existing normal-home daemon endpoint is non-negotiable, the alternative is a specific **trusted managed-origin-denial deployment at the daemon/executor owner**, using the real managed-requirements mechanism above, with prospective controlled worker-generation admission. That requires an explicitly admitted policy/bootstrap owner for that daemon and its executors, and an evidence-backed way to handle already-running work. No such deployed owner/generation contract was supplied. New global requirements, adopting old workers or replacing/restarting a daemon are not authorized by the current proposal. I do not certify this alternative as ready, require it over an already-enforced native restriction, or claim that a mandatory deny_read spelling alone solves all aliases/FDs/host proxies. If the operator already has such a deployment, supplying its existing enforcement/bootstrap evidence is sufficient to reopen capability judgment; no redundant wrapper should be imposed.

    This is a genuine operator boundary only insofar as choosing the private endpoint/posture or normal-daemon managed policy changes the currently approved deployment. Producing read-only evidence of an ALREADY enforced native boundary is ordinary capability work, not intrinsically human-only. There is no third option of managed-mail-only coverage or weaker watchdog policy.

    ## What would close capability judgment, before implementation review

    For the selected concrete mechanism, provide one trace from trusted policy/bootstrap to actual worker/tool execution, with prospective admission and lifecycle invalidation. For a STORY-2238 integration it must show the real supervisor-owned private socket reachable by the existing HOST producer while every vendor worker/filesystem executor remains inside the signed boundary; no host daemon reuse/fallback. For an existing managed-native deployment it must show the pinned mandatory origin denial loaded by the actual daemon and every actual executor, protected from child override, including settings/profile/environment changes and additional grants. An ordinary launch snapshot alone is insufficient for either route.

    Controlled disposable proofs must exercise shell/unified exec, native filesystem/function tools, apply_patch, delegated and in-flight children, ancestor replacement, common-dir versus linked gitdir, scratch/symlink/hardlink/bind aliases, inherited FDs/proc access and model-reachable host writers. Protect relevant other actors sharing the same journal. Host producer authority must remain outside the model's write/proxy boundary: calling the installed producer cannot mint origin. Demonstrate lifetime continuity through Prepared/send/delivery/reconcile/scan/save; policy/anchor/worker or executor change must either remain dominated by the constructed invariant or refuse BEFORE exposure. A lost interval stays incomplete while relevant, with exact lower bounds retained. No retrospective origin creation.

    These are capability tests for an explicitly chosen real mechanism, not permission for a doer to choose an unavailable mechanism from H1-H8. No such proof is claimed here. Preserve ADR-66: trust the admitted same-uid HOST owner and disclose hostile same-uid HOST replay/state access as residual. Do not demand or advertise mutual distrust between arbitrary same-uid HOST processes. The claim needed is the actual model/native write boundary, including its admitted host proxies.

    ## Core design and every retained test remain binding

    Advisor19 B2391-1 is retained without reopening: explicit source-emitted positionally valid ordinary User plus actual raw/logical delivery can be non-injected WITHOUT Human=true. Known AIDA exact origin joins take precedence; all known AIDA automated continuations need actual supported classification or exact trusted join. Unknown/default/malformed/missing/short/misaligned/unsupported required provenance and conflicting joins remain incomplete. Journal silence, role:user, client name/UUID, DefaultOnError, heartbeat fallback and bare harness_injected:false are not explicit User. Legacy uses raw provenance plus actual user_message; Paginated uses raw plus actual typed delivery. Keep ordinary /loop poll semantics.

    Retain ALL six Python/Rust batch/role/partial producer paths, intent-before-send, distinct raw/logical/client/queue IDs, exact body/thread joins, actual delivery rather than acceptance/ack/list disappearance, no blind retry, duplicate real deliveries and contradiction lower bounds. Retain scheduled heartbeat/hooks/inter-agent/subagent/automatic follow-up/StartIfIdle/ContinueIfIdle/direct API/TUI/exec/remote/context/tool/recovery/inherited input inventory. Ordinary explicit User is not universally human-authenticated; known AIDA input cannot be laundered by this limit.

    Retain complete active/retired attribution, first-scan deleted/pruned worktrees/private clones, physical/lexical aliases, ownership/resume intervals, reuse/conflicts and bounded fallible discovery. Retain all per-vendor/per-policy/per-metric/per-interval completeness, exact response and lineage accounting, baseline/reset/fork/replay, no parent/child/checkpoint/rollup overlap, cache/reasoning subsets, unknown boundary-straddling deltas and observable usage-free work refusal. PID death never erases valid spend. Existing Claude thresholds/comparisons/windows/poll/dedupe/crossing IDs/defaults remain unchanged; context is not-required only when disabled.

    Retain the FULL BOTH-mode compaction matrix: Regular versus Compact caller, local pre/mid/post/fallback, remote V2, background response versus installation, manual adoption of background stays manual, Ok(false) completion is not installation, token-budget/new_context, recovery/window lineage. Missing eligible caller/install proof refuses while preserving exact usage.

    Retain permanent bounded watchdog/origin locks, no network under origin lock, coherent atomic/fsync state and retention, FULL relied-on-prefix digest revalidation including same-inode/same-length interior rewrites, bounded rereads/discovery and no silent dedupe eviction. Findings never replace completeness; old Claude-only/schema/stale/missing/deleted/corrupt/unknown/partial-tripped/failed-save proof refuses the actual budget_evidence_verdict.

    EVERY named test, synthetic-state rule, failure condition and future local gate in FULL author18 and FULL advisor17 remains required, modified ONLY by FULL advisor19 B2391-1. ALL author20 boundary cases remain required if that boundary integration is selected. None is waived by this reference. In particular retain actual_queue_mail_wake_loses_origin_refuses for known old AIDA mail; revise both other_queue_automation_not_silently_human and other_direct_api_user_origin_still_unknown per B2391-1; include explicit User positives in Legacy/Paginated and DefaultOnError/heartbeat-default/short-vector negatives. Retain every historical/token/mirror/compaction/fullguard case and child_cannot_mint_host_origin. Positive AND negative admission tests must consume genuine scan-derived snapshots through PRODUCTION budget_evidence_verdict with EMPTY allow_uncovered_vendors and every effective required metric complete for a positive. No token-only, heartbeat-only, partial COVERED_VENDORS admission or manufactured all-human fixture.

    The later local gate remains ONE targeted AIDA_CARGO_TIMEOUT=10m cargo test --profile agent -p aida-cli-lib runaway_seats plus make check-ci-fast; long Cargo background, inspect cargo ps after timeout/KILLED, no outer timeout/full suite/slot bypass. Actual shared test infrastructure or >10 files additionally requires make test-touched and make check-ci-compile. These are retained future instructions; no test was run now.

    ## Separate approvals and posting

    Core semantics: retain advisor19's architecture approval with all binding conditions. Boundary/deployment amendment B: CHANGES REQUESTED. Pre-code capability evidence: NOT CLOSED. Implementation: no patch reviewed, no completion/AC/CI/merge credit. No BUG-2398 launch/lifecycle overlap is authorized by this judgment. TASK-2712 remains conditional NOT READY and supplies no assumed channel. No worker restart, adoption, timer, user/config/auth probe or native write probe occurred.

    Only the supplied OWN /tmp/aida-BUG2391-boundary-signoff-own-context.sh may be sourced, in the same shell as role current --check immediately before the canonical signoff comment. Own name/companion markers were read without printing the script, selectors, env or keys. No borrowed MCP authority, parent/dead context or alternate-root retry is allowed. Posting receipt is separate below; successful local artifact creation is not canonical persistence or host store commit.
