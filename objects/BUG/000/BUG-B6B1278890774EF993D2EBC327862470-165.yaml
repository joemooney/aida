  content: |
    # ADVISOR SIGNOFF: CHANGES REQUESTED — BUG-2391

    Independent source-paper judgment by codex-advisor-14, separate from sketch author advisor13. Reviewed the FULL `/tmp/aida-BUG2391-sketch-result.md`, BUG-2391 (canonical BUG-b6b1278890774ef993d2ebc327862470-165), its three acceptance criteria and Joe's proxy ruling, against main `471540a8c477a50a81170f338d81532cb5dbd329`. The architecture is promising, but forks 1 and 4 need concrete sketch amendments before implementation signoff. This is not a code review, dispatch instruction, manual hold, deployment permission or status change. Approved status and High priority remain unchanged.

    ## Evidence boundary and pinned sources

    No live user transcript/session content was read. Inspection covered repository source, repository synthetic fixtures and upstream versioned protocol/persistence source only. `codex --version` reports `codex-cli 0.166.0`. Upstream tag `rust-v0.166.0` resolves through annotated tag 593389380740f7b4762771573c447ccfdc59742f to commit **6ff1e1ca3b30fc8b914720681fcf5fe62e95f856**. The sources below are pinned to that commit, rather than the sketch's moving main link:

    - [Protocol](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/protocol.rs): SessionMeta, TokenUsageRecord, TokenUsageInfo, TurnStartedEvent, AgentMessageEvent.
    - [Durable persistence policy](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/rollout/src/policy.rs) and [writer](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/rollout/src/recorder.rs).
    - [History wire envelopes](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/history/src/rollout_payload.rs), [history metadata/compaction snapshots](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/history/src/lib.rs), [content provenance](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/models/item_metadata.rs), [message phases](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/models.rs), [typed completed items](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/items.rs).
    - [Upstream synthetic usage/resume test](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/core/tests/suite/token_usage_rollout.rs) and [TypeScript exec SDK events](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/sdk/typescript/src/events.ts). SDK `turn.completed` is a distinct stream, not the native rollout envelope.

    Local evidence: runaway_seats.rs:81 policy, :214 live inventory, :264 registry labels, :400 state, :762 scan_file, :880 judge, :1087 scan, :1264 BudgetEvidence; shift.rs:100 and :1228; vendor_activity.rs:189-248; session.rs:6204 and :6328; token_ledger.rs:664-845 and its synthetic tests; seat_rotation.rs:66-85; usage.rs module contract; status_prs.rs:740-780; agent_registry.rs:83-145 and :1726-1786. Current doctor is Claude-only with explicit Codex not-read. It establishes no Codex all-healthy claim.

    ## Fork 1 — attribution: CHANGES REQUIRED (R1)

    Accept structured session_meta cwd plus real inventory and component-aware path matching. Reject prose matches and sibling-name inference. However, the sketch delegates production roots to `default_sources` and requires canonicalizable paths without defining recovery of deleted roots. `clone_seat_trees` explicitly excludes gone directories; git's current worktree inventory cannot recover a removed-and-pruned worktree. This loses recently completed seats from the trailing-day budget and AC1/proxy coverage.

    Amend the sketch with a bounded historical attribution path: combine current proved roots with project-local structured session history, including active AND retired registry records carrying native_session_id, worktree_path, started_at/ended_at, and previously proved watchdog inventory retained with its project/root identity and observation interval. `agent_registry::load_entries` already includes retired rows, but its flatten/skip-error loader is not itself a completeness proof. Specify fallible bounded reads for the relevant historical evidence, not a new global registry rewrite. Valid project-scoped historical native-session/path bindings may establish ownership after deletion; a path basename or a path's old existence alone may not. Keep seat/PID liveness ranking separate from ownership/accounting, so an ended holder does not erase its spend.

    Normalize absent paths against their recorded proved spelling/identity and the longest proved root; do not require present-day canonicalization of a deleted root. Bind historical claims to session identity and relevant time/lineage, and handle path reuse/conflicts explicitly. Structured metadata that cannot prove historical project membership stays unresolved and blocks clean admission when relevant; it must not be silently classified foreign or counted as zero. Conversely, actual foreign sessions are excluded without contaminating this project's coverage. No invented universal historical inventory is required where none survives: report the specific evidence gap and refuse admission. This refusal is not a substitute for accounting when historical proof DOES survive.

    Required synthetic additions: (a) scan after worktree removal and git pruning, with recent usage and a matching retired record, including a first watchdog scan; (b) deleted private clone outside sibling conventions, matching ended/retired native-session record; (c) previously proved root removed between scans; (d) reused historical path with conflicting session/time binding; (e) equally named foreign/deleted sibling without proof. Assert exact project budget retention and normal window aging for (a)-(c), explicit unknown/refusal for unresolved conflicts, and correct foreign exclusion. No live registry/session reads are needed for these tests.

    ## Fork 2 — per-vendor completeness and compatibility: ACCEPTED WITH CONDITIONS

    Old Claude-only v1 `ok` is never Codex proof. Persist per-vendor, per-required-metric/interval completeness with schema/adapter capability identity; bind the proof to the effective policy requirements it actually measured. Keep findings orthogonal to completeness: a lower-bound trip does not make a partial scan complete or reset blindness. Unknown verdicts refuse; missing/corrupt/truncated state cannot synthesize clean proof. An unchanged file may support a fresh checked snapshot if its relevant coverage is still valid, but mtime or an old offset alone cannot renew coverage. Deleted source evidence must invalidate completeness without erasing already validated recent spend.

    Add Codex to COVERED_VENDORS only with actual synthetic adapter-to-production-guard success, complete relevant measured evidence, ordinary existing freshness and budget checks, and empty uncovered overrides. Old state, complete Claude plus incomplete Codex, partial-but-tripped, failed save and unknown capability cases must refuse. Preserve existing Claude meaning, thresholds and once-per-crossing behavior. Do not solve this by bypassing an unresolved configured rule.

    ## Fork 3 — cumulative intervals, windows, parent overlap: ACCEPTED WITH CONDITIONS

    Response usage is identified by vendor + producing thread + response_id; root session_id is not thread identity. `usage` is the response amount; `turn_token_usage` and `thread_token_usage` are rollups. Copied snapshots and `compacted.latest_token_usage_record` restore state, not new spend. Parent/child lineage must use actual schema evidence: parent_thread_id, forked_from_id, forked_from_ordinal_exclusive, history_base and subagent_history_start_ordinal where applicable. Do not infer parent overlap merely because records share a root session; do not add root/turn/thread rollups to constituents.

    Accept validated cumulative differences only for their known interval. A delta entirely inside the queried window/day need not have every constituent minute reconstructed to prove that interval's total. If it straddles a boundary and cannot be allocated exactly, keep that metric/interval incomplete and use only proved lower bounds for findings. The first arbitrary checkpoint is a baseline, not spend; full-origin or exact timed response evidence may legitimately prove first spend. Resets, replay, forks and resumed files need explicit segment/identity rules, not equal-count dedupe. Unresolved real overlap refuses admission. Cached input and reasoning output remain subsets, never extra charges; do not use blended_total (which subtracts cache) for the existing total-token policy. Determine any nonzero cache-write treatment from its producing schema/conversion, not from the field's existence alone. Missing components are unknown rather than fabricated zero; a schema-defined default is distinguishable from a malformed omission.

    Upstream's synthetic usage test deliberately has a response with no usage and therefore no TokenUsageRecord. Stable response records are best-effort observations, not automatic proof every call was measured. The amended completeness contract must handle observable missing-usage calls and gaps without requiring proof of unobservable network internals.

    ## Fork 4 — minimum ACTUAL native capabilities: CHANGES REQUIRED (R2)

    The sketch lists possible events but defers schema pinning and leaves the minimum admission capability unresolved. Resolve this now in a small metric-to-durable-source table for installed 0.166.0 plus explicitly supported repository legacy fixtures. Do not require every event representation to coexist. Do not claim a complete configured-policy pass merely from token records, nor require unavailable optional fields unrelated to an enabled rule.

    Specific source-backed amendments:

    1. Include both actual history persistence modes. policy.rs retains legacy UserMessage/AgentMessage/ContextCompacted events only in Legacy mode; Paginated mode instead retains `event_msg` ItemCompleted with typed TurnItems. Their inner enum is `type: UserMessage`, `AgentMessage`, `ContextCompaction`, etc. (PascalCase), unlike snake_case RolloutItemWire. A parser/fixture set limited to legacy event_msg and response_item does not prove current-native coverage.
    2. Wakes require one actual delivered/accepted logical prompt, with mirrors, recovery and inherited history excluded. TurnStarted is durable but a turn can include steering; one turn-start cannot blindly stand for every delivered prompt. Define identity/correlation using the appropriate native item/acceptance metadata rather than counting every user-role/context fragment as a wake.
    3. Repeated-injected-prompt needs structured non-human delivery provenance and actual eligible prompt identity/text, not role, text similarity, `originator`, or a free-form turn_trigger alone. The pinned source has positional `internal_chat_message_metadata_passthrough.content_item_metadata[].provenance` (User, Harness with hook, Tool, Unknown, etc.). Legacy missing metadata and harness_injected:false decode Unknown. HookPrompt fragments omit their emission metadata on serialization; the attribution is persisted on the ResponseItem. Specify which durable representation proves a logical injected delivery and how mixed human/context parts and mirrors are handled. Do not count static AGENTS/skills/context repetition as repeated wakes.
    4. Idle/no-op replies require a deduplicated actual terminal delivery. MessagePhase includes commentary, partial_answer and final_answer, but is optional and explicitly inconsistent across providers. A documented terminal-turn/message correlation may supply legacy finality where it actually proves it; missing phase alone is not universal refusal, and arbitrary assistant text is not a final. Exclude compaction_output, reasoning, progress, tool output and inherited snapshots. Missing required finality/text must remain unknown.
    5. Compaction requires one durable logical compaction transition across compacted/context-compaction/legacy mirrors and resume copies. Pin whether the chosen evidence distinguishes the existing auto-compaction rule's relevant events; do not assume every summary, manual replay or snapshot is a fresh auto-compaction. The nested latest_token_usage_record is especially not a new response. Missing provenance required to distinguish eligible events remains unknown, not measured zero.
    6. Poll setup must map actual persisted tool envelopes/names/arguments to the existing CronCreate/ScheduleWakeup or user /loop mailbox semantics. Do not invent a rate threshold or broaden the rule to every wait/tool. Preserve BUG-2120 silence/dead-holder and recent-unregistered behavior.

    Minimum admission means measured project tokens/day plus complete evidence for the effective configured watchdog rules over their relevant intervals, with optional context required only when restart_context_tokens > 0. Wake, repeated prompt, idle and compaction rules have positive effective defaults here; calling their missing data 'optional' would weaken existing policy. No need to prove absence of every possible future capability or reconstruct all historical SDK versions. Separate not-required/disabled from unavailable-required and from measured-zero. If a supported native producer omits a REQUIRED capability, show that exact refusal; if resolving it needs an upstream change or policy decision outside this bug, return for judgment instead of self-disabling the rule or expanding into a usage-system rewrite. The sketch must identify a genuinely complete supported path, not fixtures that merely invent provenance to make a guard pass.

    Required synthetic additions: source-faithful Legacy and Paginated positive paths, mirrored records, absent/Unknown provenance, mixed content, missing-phase terminal correlation versus ambiguous commentary, compaction snapshot/transition dedupe, usage-free observed response, and an off-context case showing absent optional context does not itself block admission. Run actual budget_evidence_verdict on scan-derived snapshots for the complete path and every relevant missing-capability case. These are design acceptance cases, not tests run in this signoff.

    ## Fork 5 — scoped concurrency/generation/bounds: ACCEPTED WITH CONDITIONS

    Keep one permanent bounded watchdog lock for load/fold/save, invocation-private atomic replacement and coherent checkpoints/offsets/aggregates. Failed locking or persistence cannot refresh positive proof. Generation checks need actual bounded content/change evidence for same-inode, same-length rewrites; identity+length alone cannot detect that case. Append is normal; replacement/shrink/reset invalidates affected baselines and rebuilds without charging retained aggregates twice. Add deterministic two-writer, same-inode rewrite, rotation, interrupted-save and reload fixtures.

    Charge discovery, historical inventory, metadata probes, partial/oversized lines and rereads to existing scan bounds; do not allocate unbounded lines or walk the whole tree before starting the budget. State/dedupe retention must be bounded without silently forgetting identities that would recount copied history; retention exhaustion is explicit incomplete evidence. No new timer, rate finding, configuration knob or shared store-writer redesign. max_bytes_per_file/max_total_bytes/time_budget_ms and MAX_LINE_BYTES are scan bounds, not byte/line rate thresholds. Existing policy comparisons, shift budget stop percentage and one-hour freshness remain intact.

    ## Scope and next review gate

    Preserve all three ACs: real project/worktree/historical-clone attribution with the existing policy; measured Codex coverage before no-override admission; docs/autonomous-drain.md plus synthetic regression evidence. Existing usage.rs is CLI telemetry, vendor_activity substring matching is liveness, session sibling matching is display behavior, and token_ledger fixtures are accounting references: none alone proves native watchdog admission. Do not rewrite those systems.

    Return an amended sketch resolving R1 and R2 for independent signoff. No implementation, dispatch, queue/hold action or merge is requested by this ruling. A later implementation still requires a separate fresh implementation review. Future LIGHT local gates remain one targeted watchdog filter (including the production shift-guard cases), with `AIDA_CARGO_TIMEOUT=10m cargo test --profile agent -p aida-cli-lib runaway_seats` in tool background mode when long, plus `make check-ci-fast`; extra touched/compile gates only for the already stated >10-file/shared-test-infrastructure condition. No Cargo or gate commands were run here. No live shifts/timers, user configuration, thresholds, global policy or uncovered override changed.

    Authority: the HOST-prepared own context was read, then sourced in the same shell as this artifact write with successful `aida role current --check == advisor` and preserved `AIDA_ROLE_INSTANCE=companion`. The same checks must precede posting this exact ruling to the owning spec. Posting receipt is recorded after completion; no host commit is presumed.
