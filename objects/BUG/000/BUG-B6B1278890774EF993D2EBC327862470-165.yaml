    ## Bounded coherent persistence — accepted fork 5 retained

    Use one permanent bounded watchdog lock for load/ownership snapshot/fold/judge/save. Do not unlink its sidecar. Keep invocation-private atomic replacement; readers see complete old or new state. Commit offsets, file identities/generations, coverage, aggregates, interval deltas, root inventory, per-thread checkpoints/segments and dedupe lineage together. Failed persistence cannot mint fresh positive evidence; interrupted writes/reloads must not lose or double-fold progress. Preserve compatible Claude aggregates while Codex backfill remains incomplete until required intervals are proved.

