    ## Protected producer journal and state machine

    Authoritative proposed root: `<trusted main common Git dir>/aida/mail-origin-v1/<stable-project-UUID>/`, provisioned/owned by the EXISTING host adapter. This is a proposed namespace, not an installed directory. Pin the actual common-dir identity from trusted host project setup, not source `.git` prose or child config. For private clones use their trusted recorded main binding; never choose clone-local writable state. Root placement MUST be proven outside EVERY effective native writable path/mount/bind alias including scratch, symlinks, alternate root spellings and gitdir/common-dir aliases. Mode bits against a same-uid child are insufficient. If native policy does not protect that actual root, STOP before writing/submitting: no new writable/protected root or separate privileged journal owner is implicitly authorized. Python's current user-selected State directory and acceptance ledger do not pass this proof by definition.

    Open every ancestor and final directory by retained nofollow handles; reject unexpected symlink/bind/root-identity changes, wrong uid, group/other writable ancestors or unproved aliases. Root dirs exact 0700; locks/records exact 0600, host uid, singly linked REGULAR, O_NOFOLLOW|O_NONBLOCK and bounded fstat/read. No symlink directory trust; no following queue/native arbitrary paths. Pin mount/dev/inode and verify anchor before/after every transaction. Existing common Git protection, not an ad hoc chmod, is the isolation basis. Same-uid hostile host process remains ADR-66-style residual, never advertised as OS user separation.

    One permanent project origin lock (2 s acquisition) owns intent/result/generation transactions; never unlink it. Native watchdog takes its permanent watchdog lock, then origin reader snapshot lock briefly, releases origin lock before native scan; producer never takes watchdog lock. No origin lock held over network. Snapshot generation CAS on return rejects a conflicting state change. Use invocation-private O_EXCL same-directory temp regular file; bounded canonical serialization, fsync(file), renameat under pinned directory, fsync(directory). Persist next generation and expected predecessor hash together. Detect missing sequence, reset, malformed/unknown schema, duplicate fields, replacement, partial write, link or durability failure as origin-incomplete. Watchdog stores generation/prefix digest and validates relied-on origin bytes with the native coherent transaction. It cannot invent trust from a copied ledger.

    Schema v1 closed fields: stable project/root identity, fixed producer kind (`python-mail-batch`, `python-role-only`, `python-partial`, `rust-mail-batch`, `rust-role-only`, `rust-partial`), host writer build/boundary identity, endpoint generation/peer/version, exact native thread, UUIDv7 logical client ID, UTF-8 body SHA256 and byte length, prepared timestamp, per-attempt UUID/RPC ID/queue ID/result, native evidence references, mail acknowledgment separately, record sequence/generation/previous hash. Journal stores no mail body/credential; body hash/length are exact, not whitespace-normalized. After exact native join the watchdog applies EXISTING prompt normalization for repeat grouping; transport body identity is never that normalized hash.

    State edges:

    | State | Durable fact / next action | Accounting |
    | --- | --- | --- |
    | Prepared | fsynced intent BEFORE any request can reach socket; fresh logical ID unique in this project journal | not delivered |
    | Attempting | fsynced attempt UUID + exact endpoint/thread/RPC/body commitment before send | not delivered |
    | Accepted | exact RPC response and queue ID/input/client ID matched, fsynced | still not delivered |
    | Uncertain | timeout/disconnect/crash after possible send, conflicting edit or persistence failure | no automatic requeue; lower bounds only |
    | Pending | exact queue-list entry still matches, bounded read proof | not delivered |
    | Cancelled/Dropped | explicit observed state only; absence from list is NOT cancellation proof | not delivered; absence alone remains uncertain |
    | Delivered | exact native logical user delivery + source raw-history emission join matches thread/client ID/body | one actual wake and eligible automated prompt |
    | Acked | AIDA inbox ack observed separately; may precede/follow delivery | no delivery inference |
    | Reconciled | prior state and native/queue evidence references atomically recorded | same delivery counts, never a synthetic new event |

    No exactly-once promise: clientUserMessageId identifies a logical input but the queue API is not documented idempotent. Never reuse it for a new intentional notification. For lost responses, search only the exact thread/client/body in the bounded native/journal generation and queue pages; no blind resend when absent or uncertain. A crash after delivery before Accepted reconciles from Prepared+native event; two real deliveries carrying the same client ID count as two actual deliveries/lower-bound wakes AND mark contradiction/incomplete, rather than deduping away a runaway. A known safe NotCreated before any socket send can create a new attempt of the same intent; all other retries require exact state reconciliation. No new recurring reconciliation service: only existing invocation/watchdog reads.

    Retention limits: 65,536 intent records/project and 64 MiB journal/snapshot bytes, 16 attempts/intent, 1,024 armed thread bindings. Preserve all identities affecting the configured window, trailing 24 h tokens, outstanding queue intents, lineage and evidence freshness; retain closed-origin identities at least max(24 h, configured rate window) plus one existing one-hour proof-freshness horizon. No silent LRU eviction. Exhaustion stops new sends and refuses freshness with exact retained lower bounds; do not invent zero or compact away an uncertainty. Aging requires native event times/ownership intervals; journal write time is not spend time.

    ## Actual native delivery join, both persistence modes

    thread_queue_processor.rs::submission_into_turn_input preserves client_user_message_id as TurnInput::UserInput.client_id. core/session/mod.rs:5490-5552 first builds/persists prepared raw ResponseItem history (possibly assigning the admitted-response UUID), THEN makes a new UserMessageItem, sets client_id, emits Started/Completed, and materializes rollout. protocol.rs::UserMessageEvent preserves client_id in as_legacy_event; its conversion regression verifies this. rollout/policy retains legacy user_message in Legacy and ItemCompleted(UserMessage) in Paginated. Those are actual durable logical delivery surfaces; neither raw ID nor freshly generated typed item.id is presumed equal to the client ID or to each other.

    Reader first validates the full relevant native generation/ownership sequence, then pairs exact logical client ID/thread/body with the uniquely co-emitted raw item through this producer sequence, native ordinals and acceptance ordering. Paginated exact typed content/client_id + thread/turn fields and surrounding raw item must agree. Legacy user_message client_id/message/content and preceding raw input must agree; the native session metadata supplies producing thread when the legacy event lacks its own thread field. JSON wire details come from actual serializers (snake_case outer event; PascalCase inner TurnItem; legacy `client_id`), with no invented Harness tag. Missing raw/UI pair, ordering ambiguity, queue-edited body, wrong project/thread, client ID conflict or absent complete body refuses the affected metric.

    The join's key is `(project, producing native thread, source logical delivery generation/ordinal/item identity)` with journal logical client ID as correlation, not sole dedupe authority. Mirrors with the SAME proved source emission collapse; two source deliveries never collapse merely because ID/body/time match. Store exact per-delivery classification and conflicting IDs; avoid newest-wins. Steers within a running turn are separate deliveries. Resume/compaction snapshots/parent inherited prefixes are not new deliveries; use actual history lineage and generation. A replay with absent lineage is incomplete. A journal record never classifies an unrelated input human. Origin-derived provenance applies to exact joined body parts only; mixed static/human/automation contexts require actual positional mapping.

