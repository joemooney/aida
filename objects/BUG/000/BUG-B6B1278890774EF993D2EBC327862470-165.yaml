    ## Token accounting and interval contract — accepted fork 3 retained

    Stable TokenUsageRecord.usage is per response, identified by vendor + producing thread_id + response_id. Root session_id, root_turn_id, turn_id, thread_token_usage and turn_token_usage are correlation/rollups, not new amounts. Different responses with equal token numbers both count; same identity + same usage is replay, conflicting usage is incomplete. Never dedupe by counts or a root-session ID. Do not add stable response amounts, legacy checkpoint deltas and parent rollups for the same interval.

    Codex input includes cached input; output includes reasoning output. Base total is input + output, never blended_total (which subtracts cache). Validate nonnegative numbers, component subsets, checked arithmetic and schema-consistent total. U's Responses conversion maps cache_write_tokens into cache_write_input_tokens without establishing a separately additive charge: accept source-consistent input/output/total; do not add that field on top merely because it exists. Nonzero values incompatible with the producing total convention require explicit source-backed conversion or remain unknown. Distinguish schema-defined default cache_write zero from malformed missing required fields. Do not retrofit current defaults into unsupported older records. Retain Claude's existing input/cache-read/cache-write/output meaning.

    Legacy total_token_usage is a cumulative checkpoint. Persist thread/segment baseline and known interval; repeated checkpoint does not charge again. First arbitrary checkpoint after a tail is baseline, not spend. Full-origin evidence or exact timed per-response/last-usage evidence may establish genuine initial spend. Explicit reset/fork/revert gets a new validated segment; unexplained decreases are incomplete, never negative spend. Last usage cannot be repeatedly charged on telemetry-only updates.

    Whole-known-interval deltas entirely inside the queried rate/day window prove that interval's total without per-minute reconstruction. Retain an interval contribution alongside exact minute contributions so judge can count a wholly contained interval once. If a delta straddles a rate/day boundary and cannot be allocated exactly, that queried metric/interval is incomplete; retain only proved lower bounds for findings. Do not force the entire delta into the final minute. Required intervals are the judge's existing minute-aligned trailing window and 24-hour day; comparisons and thresholds remain identical.

    Use actual P parent_thread_id, forked_from_id, forked_from_ordinal_exclusive, history_base, subagent_history_start_ordinal, H inherited metadata and ordinal provenance to distinguish copied parent history from new child production. A shared root session does not imply overlapping spend. Resolve logical origin of inherited prefixes across their history references with bounded reads. Children keep producing thread identities; disjoint new responses count exactly once toward project day total. If parent cumulative totals may overlap children without known response/interval coverage, mark affected metric incomplete; do not take max, sum blindly or drop the child. Resumed/reverted files and snapshots restore baselines; nested compacted.latest_token_usage_record never creates new spend.

    Best-effort usage is explicitly not completeness by itself. S record_observed_response_completed emits RawResponseCompleted, but W does NOT retain that event; record_response_token_usage returns on missing usage. U deliberately exercises response-without-usage with assistant output and no TokenUsageRecord. The adapter must notice observable completed assistant/tool work and missing measured usage/unchanged legacy checkpoint where the native sequence makes the gap visible; mark incomplete, not zero. It need not prove absence of unobservable network internals. If the durable source cannot correlate response work to amounts sufficiently for its relevant interval, state that exact token gap instead of inventing a response_id/amount. Token-call completeness is separate from prompt/reply completeness.

