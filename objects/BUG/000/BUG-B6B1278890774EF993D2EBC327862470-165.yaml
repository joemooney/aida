    # SKETCH (awaiting NEW independent signoff): BUG-2391 — typed producer and watchdog replacement

    Fresh sketch author: codex-advisor-18, own companion advisor, 2026-11-01. This is a full replacement proposal, NOT advisor17's signoff and NOT implementation permission. Independent judgment is REQUIRED later. No production source/Cargo patch, runtime installation, dispatch, queue/status/hold mutation, merge, user/global configuration, credentials inspection, model call, timer or schedule action is authorized by this document. The only canonical mutation requested now is this SKETCH comment.

    Direction A is selected by Joe's canonical PROXY DESIGN DIRECTION recorded before this author started: preserve EVERY existing configured rule and full native parity; extend this SAME BUG-2391 with the minimal existing AIDA host mail-wake producers, typed queue client ID, protected origin journal, and watchdog reader needed for real automation coverage. No policy B, Codex patch, heuristic provenance, uncovered override, retrospective manufactured origin, or general usage/service rewrite.

    **Disposition for independent review:** the typed LOCAL daemon transport and AIDA producer-to-delivery protocol are concretely proposed below. Current full task/transition histories can distinguish the named compaction routes; gaps cannot. One residual source ambiguity remains explicit: Codex's ordinary/unclassified User input does not prove human origin for uninstrumented CLI/API/remote automation. This proposal refuses those affected repeat intervals, retains tokens, and does NOT claim blanket Codex admission or fabricate its required success fixture. The exact remaining fork is at the end. New producer adoption fixes future joined deliveries only.

    ## Owner and unchanged acceptance

    Owning canonical spec: BUG-b6b1278890774ef993d2ebc327862470-165, agreed BUG-2391. Status Approved, native priority High; leave both unchanged. All three ACs remain:

    1. Scan `~/.codex/sessions` filtered by project/worktree cwd, and evaluate the same configured window token/byte/line semantics for Codex.
    2. Include Codex in `shift::COVERED_VENDORS` only once runaway-seats actually covers it, so a Codex drain can pass without `allow_uncovered_vendors`.
    3. Update `docs/autonomous-drain.md:1613-1615` and add synthetic Codex JSONL regression evidence.

    Joe's exact PROXY DECISION: “source confirms shift COVERED_VENDORS only Claude and runaway_seats explicitly not-reads Codex. Approve Codex watchdog coverage using existing project/worktree session attribution, all configured byte/token/line/window thresholds and missing/corrupt evidence semantics, then covered-vendor admission. Synthetic session JSONL only; no live shift/timer enablement or user config edits. Cover real Codex event formats, out-of-project exclusion, subagent/parent duplication and historical silent-session aging. LIGHT targeted watchdog filter plus fast gates, no full suite.”

    The existing doctor `check runaway-seats --fail-on-findings` invocation and existing watchdog schedule are the only trigger. Doctor folds bounded disk evidence and emits findings/completeness. Existing shift status/tick admission consumes persisted budget evidence. No added poller/model call, enabled schedule, service installation, process termination or automatic healing. The AC's byte/line language maps to existing source-read budgets, not new byte/line rate findings; the proxy does not authorize inventing those rates.

