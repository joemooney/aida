    # INDEPENDENT ADVISOR SIGNOFF: APPROVED with binding amendments — BUG-2391

    Reviewer: codex-advisor-19, own unique child, advisor/companion, 2026-11-01. Independent of authors13/15/16/18 and signers14/17; I authored neither replacement sketch nor implementation. Owner BUG-b6b1278890774ef993d2ebc327862470-165 (BUG-2391). This is architecture approval only, not implementation review, dispatch, status/queue/hold change, runtime installation, test execution or merge permission.

    I read the FULL /tmp/aida-BUG2391-producer-sketch-result.md (76,055 bytes), FULL /tmp/aida-TASK2712-amended-sketch-result.md (78,830 bytes), FULL advisor17 judgments /tmp/aida-BUG2391-amended-signoff-result.md and /tmp/aida-TASK2712-signoff-result.md, current owning descriptions/relationships/proxy directions, BUG-2398 expanded AC3/B1-B4/expanded independent approval/latest rework, STORY-2238 signed conditions/probe qualifications, and TASK-2707. Actual clean checkout/main is 6a3f67671a974703590efde5ae2a323f3f7471fa, containing #3185 and #3193 after the authors' 471540a baseline. I inspected that delta and current relevant source: neither merge supplies the proposed channel or changes the watchdog predicate. BUG-2398 remains separate, In Progress/unmerged. Cached upstream producer/serializer/persistence/transport sources are pinned at Codex 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856; the official positional-provenance definition was independently checked online. No live transcripts, user credential/config contents, user watchdog state or runtime tests were read/run.

    ## Judgment on P2: the universal-human-authenticity floor is stronger than the existing rule

    Current aida-cli-lib/src/runaway_seats.rs:724-733 counts a delivered non-sidechain user wake, then defines injected as isMeta == Some(true) OR a present promptSource other than typed/queued. Absent, typed and queued are not repeated-prompt candidates unless isMeta is true. The /loop mailbox setup branch applies to non-injected text. That is a producer-classification predicate. It does not authenticate whether a person, script or remote client actually typed an ordinary input.

    The positive native mapping is supported by actual emitted data, not by a missing field: core/src/session/mod.rs:3748-3767 explicitly builds user.text/image/audio kinds AND a position-aligned vector of ContentItemMetadata::user(); record_user_prompt_and_emit_turn_item:5489-5558 persists prepared raw history before emitting the logical user delivery. protocol/src/models/item_metadata.rs defines User separately from Unknown; its deserializer maps absent provenance and bare harness_injected:false to Unknown. models.rs:1003-1013 additionally uses DefaultOnError, so tolerant decoding can erase malformed metadata into absence. history/heartbeat.rs's UserInputOrigin default/from_message fallback is NOT evidence of explicit User provenance. Its ordinary-or-unclassified wording describes a different origin/coalescing abstraction; it does not erase the explicitly emitted positional User category. [Pinned positional schema](https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/models/item_metadata.rs).

    Therefore a supported, explicitly serialized ordinary User classification, with complete actual delivery/raw join and no known contradictory producer evidence, may map to NON-INJECTED ordinary queued/typed eligibility. This makes no Human=true assertion. It preserves the unchanged predicate. I find no precise existing Claude counterexample that demands human-authenticity proof for typed/queued input; source explicitly does the opposite. Requiring that proof for every native User delivery makes a new policy floor and is not necessary for this proxy's semantic parity. External automation indistinguishable from ordinary input remains outside the existing repeated-prompt classifier's detection, as it is under the Claude typed/queued predicate. Wake/token/idle/poll and other applicable rules still observe it. This disclosed classification limit is not permission to drop known AIDA automation.

    ## Binding amendment B2391-1: replace P2 and its stronger test assertions

    Apply this finite precedence after proving a logical delivery, ownership, generation and full relevant body:

    1. Exact trusted AIDA origin + clientUserMessageId/thread/body/native delivery join classifies that delivery as automated/injected for the existing repeat rule, even though native raw provenance is User. All existing Python and Rust mail batch/role/partial routes must use it. Known relevant AIDA producer activity with a missing/conflicting join remains incomplete; journal absence cannot launder it into ordinary User. Historical known uninstrumented AIDA intervals cannot acquire retrospective fake origins. In-flight/cancelled/unknown queue activity is not delivery or a zero proof.
    2. Actual supported native eligible hook/heartbeat/other automated producer evidence is classified using its real positional/logical emission and existing semantics. Preserve static/context/tool exclusions and body/mirror joins. For every AIDA automated follow-up/continuation entrypoint in the closed inventory, require its actual source classification or trusted join; unsupported relevant automation refuses. Do not hide a known producer behind generic native User.
    3. Explicit source-emitted, positionally valid User on a supported ordinary input route, paired with the actual logical delivery and free of contradictory known-origin evidence, maps to non-injected ordinary input. It is still a wake, and its actual /loop mailbox text uses the existing non-injected poll-setup branch. Matching text, role:user, client UUID, heartbeat fallback, client name, a missing journal entry, omitted provenance or a serializer default alone is NOT this positive evidence.
    4. Unknown/missing/misaligned/unsupported/malformed required provenance or an ambiguous raw/logical pair remains unavailable-required/incomplete. In Legacy, obtain explicit classification from the persisted raw ResponseItem joined to the actual user_message; do not demand a provenance field on that legacy mirror or infer it from absence. Paginated uses the same raw classification plus the actual typed delivery. Do not fabricate Human/Harness fields in either mode.

    This amendment supersedes only the universal-remainder-authenticity assertions in advisor17 and author18. Retain ALL their test names and other conditions by reference. Specifically revise bug2391_other_queue_automation_not_silently_human and bug2391_other_direct_api_user_origin_still_unknown to test both explicit ordinary User -> non-injected without a human-authenticity claim, AND Unknown/missing/unsupported/known-AIDA-unjoined -> refusal. Keep bug2391_actual_queue_mail_wake_loses_origin_refuses as the KNOWN old AIDA producer regression; do not generalize its refusal to every ordinary queue input. Keep bug2391_unknown_provenance_is_not_zero_repeat unchanged in substance. Add explicit source-faithful User positives for both Legacy raw joins and Paginated, plus DefaultOnError/heartbeat-default/short-vector negatives. Full scan-to-budget_evidence_verdict success with empty overrides must now include ordinary User and exact AIDA automated joins together, with every other effective metric proved. No token-only success or manufactured all-human fixture.

    ## Transport, protected origin and delivery design: accepted

    The sketch now selects one concrete supported LOCAL route: existing rendezvous advertisement -> exact protected physical socket hash -> same-uid private Unix endpoint -> WebSocket ws://localhost/rpc -> initialize/initialized -> thread/read ownership check -> typed thread/queue/add with caller clientUserMessageId. The pinned transport's verified_local_daemon_socket/protected_socket_path and remote client's UnixSocket initialization support this contract. Unix local access, not remote bearer/account auth, is the selected authentication mechanism. The proposed endpoint owner/mode/peer/start/generation checks and deadlines tighten that route without changing permissions. No new server, timer, fallback daemon, WSS/token route, model account read or credential authority is approved. Unsupported endpoint/home/version/project/thread binding refuses.

    The proposed main-common-dir host journal is acceptable ONLY after its actual authoritative root is proved outside every effective native writable alias/mount/scratch path. Host origin trust comes from this protected boundary, not 0600 against the same uid or an asserted command name. Pin directory/file handles, owner/mode/nlink/schema/generation and coherent lock/atomic/fsync behavior as specified. A model invocation cannot write origin records by selecting the entrypoint. Retain the explicit host-boundary refusal and actual protected-root negative fixture; no implicit new root/protection grant follows from this signoff.

    The source join is real: thread_queue_processor::submission_into_turn_input retains client ID; session::record_user_prompt_and_emit_turn_item persists prepared raw input then emits a separately identified UserMessageItem with client_id; protocol UserMessageEvent/conversion preserves it; rollout policy keeps the appropriate Legacy or Paginated logical surface. Queue ID, raw item ID, typed item ID and client ID are distinct. The exact raw/logical sequence, producing thread and UTF-8 body commitment are required. Duplicate actual deliveries with reused ID must retain both wake lower bounds and mark contradiction, rather than dedupe them away. Pending/Accepted/Acked are not Delivered. Edit/cancel/list disappearance/uncertain crash/retry/steer/recovery/parent inheritance preserve the sketch's exact distinctions, finite reconciliation and no-blind-resend rule. No retrospective origin creation.

    ## Compaction and retained forks: accepted with actual evidence conditions

    The concrete matrix resolves the architecture question for the named producers. Current pinned CompactTask emits a separate start; emit_turn_started supplies Regular attribution only for Regular. Remote installation uses the current caller turn_context even for a prepared candidate. Thus a complete ordered caller/task/window/install chain distinguishes Regular auto from standalone Compact/manual, including manual adoption of a background-generated candidate. Background response usage is token work, not installation. ContextCompaction completion on Ok(false) cannot count without an installed transition. Retain both persistence modes, local pre/mid/post/fallback, remote/manual/background, token-budget/new_context and recovery cases exactly as author18 specifies. An isolated marker or lost caller lineage is still incomplete, not auto or zero. These are proof obligations, not tests passed here.

    R1 and accepted forks2/3/5 remain accepted without reopening: complete project/worktree/private-clone/active-retired attribution and deleted historical root intervals; exact producing response/segment/lineage accounting, no overlapping rollup additions, honest boundary-straddling unknowns and usage-free observed-work gaps; per-vendor/per-effective-policy/per-metric/per-interval completeness; permanent bounded watchdog transaction lock; full relied-on-prefix digest revalidation; coherent atomic persistence/retention; honest aging/dead-holder retention and failed-save refusal. Findings never replace completeness. Existing Claude rules, thresholds, comparisons/crossing IDs, poll counts/window/dedupe, optional disabled context and all persistence conditions remain unchanged.

    All three ACs, full proxy and native first-class end-to-end goal remain binding. No COVERED_VENDORS change before actual full adapter coverage and genuine scan-to-production-guard success. Endpoint/protected-root and lost-history conditions are hard capability/evidence gates, not permission to ship partial coverage or silently choose policy B.

    ## Test contract and authority

    Incorporate by explicit reference EVERY named test, synthetic-state restriction, failure condition and future local gate in advisor17's FULL /tmp/aida-BUG2391-amended-signoff-result.md and author18's FULL /tmp/aida-BUG2391-producer-sketch-result.md, with only the B2391-1 expectation corrections stated above. The additive producer/matrix tests remain required. All failures reach the actual budget_evidence_verdict from scan-derived snapshots, empty uncovered overrides. All real source intervals and effective configured rules must be complete; not-required remains distinct. No tests, Cargo or user-state probes were run here.

    Disposition is EXACTLY APPROVED with these binding amendments to the replacement architecture. No unresolved universal-human-authenticity core fork remains. A genuine new incompatible producer/compaction/endpoint fact must be reported precisely; no new policy choice is delegated to an implementer. This judgment neither authorizes production work in this session nor certifies implementation, deployment, merge readiness or AC completion. Full native end-to-end delivery followed by the requested open-zero/regroup remains the goal.

