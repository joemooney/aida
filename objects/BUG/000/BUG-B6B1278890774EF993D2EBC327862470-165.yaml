  content: |
    SKETCH awaiting NEW independent signoff

    BUG-2391 boundary amendment — codex-advisor-20, advisor/companion, 2026-11-01. Owner BUG-b6b1278890774ef993d2ebc327862470-165. Amends author18 with advisor19; NOT independent approval. Root chooses/proxies direction, then a DIFFERENT advisor reviews this NEW amendment. Earlier core approval does not approve this launch boundary.

    Decision-ready finding

    No existing inspected AIDA HOST mechanism binds the armed native thread's actual execution generation and effective writable aliases/mounts to the proposed common-Git journal, with race-free invalidation. The pinned Codex transport supplies identity and supported queue correlation, not that boundary. This is MISSING DEPLOYMENT PROOF. I did not observe a writable production journal, execute an exploit, or test a live native boundary. A mode-0600 same-uid journal, a successful local socket handshake, thread/read, and workspace-write argv cannot discharge P1.

    The precise fork is now enforcement ownership, not provenance semantics:

    A. Retain the current native deployment boundary and all prohibitions. Accept an EXISTING HOST boundary only if its operator supplies the concrete enforcement mechanism and generation-bound evidence described below. None was identified in the inspected code or supplied artifacts. Therefore implementation remains blocked at P1 under the present evidence. No implementer may synthesize a receipt from registry/argv/transcripts and proceed.

    B. Explicitly extend SAME BUG-2391 managed-launch/arm: the EXISTING AIDA host launch owner enforces origin protection around actual native execution workers before arming. This is an essential launch/enforcement policy expansion from today's deliberate native posture, not an available attestation or reader-only change. A TUI wrapper with unconfined shared-daemon workers fails. Existing workers must actually fall under host enforcement. No secondary service/timer, Codex patch, credential authority, privileged owner, forced restart or retrospective adoption is proposed. If worker control requires a forbidden change, B is also unavailable here.

    Root must explicitly choose B's focused enforcement-policy expansion for independent review or retain A's P1 block. Do not restart implementer27 to rediscover it. The contract below does not certify deployability or invent a settings/mount/worker attestation API. Full native first-class coverage remains binding; managed-mail-only or token-only coverage is not a third choice.

    Read and source evidence receipt

    Read FULL implementation-result (8,553 bytes), boundary manifest/source-audit/reproduce.py (911/1,128/2,204), latest final-signoff-result (13,437), producer-sketch-result (76,055), retained amended-signoff-result (25,723), and two-seat/rework/recovery discipline. Owning read-only AIDA response currently says In Progress and latest proxy adopts author18 with B2391-1; no status change here. Earlier Approved references remain historical.

    AIDA HEAD 6a3f67671a974703590efde5ae2a323f3f7471fa; official Codex pin 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856 throughout. Supplied reproduce.py reports source_assertions PASS, native_runtime_test false, production_boundary_proven false. This is source-only, not enforcement testing. Additional freshly fetched official sources and hashes: /tmp/aida-advisor20-source/manifest.json. Two guessed config/src/requirements*.rs URLs returned 404; that is NOT evidence managed requirements do not exist. core/config/requirements.rs uses ConfigRequirements. My absence finding concerns the inspected contracts, not every possible external host mechanism.

    Concrete source seams:

    1. AIDA agent_launch.rs::tool_contained_flags (1832+) emits workspace-write/never. wrapped_agent_program_and_args (5559+) calls os_wrapped_program_and_args only for Claude. session.rs::containment_applied/ContainmentPosture/vendor_containment_posture (2336-2384) explicitly distinguish Codex native from AIDA containment. This proves the deployment split, not native confinement failure.
    2. AgentRegistryEntry (agent_registry.rs:82-147) has PID/start/namespace/native thread/path/lifecycle/mail_wake, no effective-policy/mount attestation. mail_wake::arm_pending (167+) checks candidate/thread and ensure_service then transitions wake. mailbox_wake_run::ThreadQueue/CodexQueue (218+) and Python tick/partial_wake (396/445) launch codex queue. Their locks/acceptance ledgers do not isolate origin authority. B must enforce that isolation, not add a field/env assertion.
    3. Pinned v2/thread.rs::ThreadReadResponse (1736+) has thread/read_state; Thread has identity/cwd/history. Start/Resume/Fork responses DO contain sandbox/profile/runtime-roots: do not confuse them with thread/read. Even these are lifecycle snapshots, not all worker mounts or future settings. ThreadSettingsUpdateResponse (299) is empty. thread/read remains the accepted transport's ownership check.
    4. TurnStartParams (v2/turn.rs:235-254) supports cwd/runtimeWorkspaceRoots/sandboxPolicy/permissions and environments; ThreadSettingsUpdateParams (236-259) permits subsequent policy/profile/cwd changes. core/session/thread_settings.rs::{prepare_update,apply_update,emit_applied,applied_event} carries overrides and publishes ThreadSettingsApplied. protocol.rs::ThreadSettingsSnapshot (2440+) has PermissionProfile and optional active profile/runtime roots; that roots list explicitly excludes environment/profile roots. A real snapshot exists; saying no policy evidence exists would be false. session/mod.rs:5195 notes a step may predate an acknowledged update or use executor-owned permissions. rollout/policy.rs:140 retains settings events. These are not a HOST pre-execution interlock or all-mount attestation.
    5. permissions.rs::workspace_write (819-875) expands project/configured roots, /tmp/TMPDIR and metadata rules. default_read_only_subpaths_for_writable_root (2360-2407) resolves a .git pointer's gitdir, not commondir. main/.git/worktrees/seat protection does not prove sibling main/.git/aida/mail-origin-v1 protection. Explicit rules can change defaults. LocalPolicyContext/prepare_local_matching (permissions/local_aliases.rs) is operation-scoped, needs re-preparing after policy/environment changes, and cannot establish remote aliases using controller filesystem observations. This is source limitation, NOT an observed writable production root.
    6. tui/src/lib.rs::app_server_target_for_launch (1063+) selects Embedded/LocalDaemon/Remote; implicit local use may allow embedded fallback. Its comment explicitly says a shared daemon cannot adopt this invocation's executor selection. Wrapping only the client cannot protect existing daemon workers. Embedded binds the actual embedded worker generation; separate/remote executors need their execution host's proof. Local socket control does not prove local execution. No new executor or remote credential route is selected.
    7. AIDA session.rs::bwrap_confinement_args_inner/os_wrap_rw_paths/os_wrapped_program_and_args (4175/4246/4369+) provide real read-only-root/write-bind/fresh-scratch and fail-closed construction seams. They are NOT existing Codex deployment proof. Whole-worktree write binds may include .git; further binds/aliases can reopen protected paths. Reusing the Claude helper unchanged is insufficient and cannot silently copy its state/write assumptions to Codex.

    Official pinned sources: https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/app-server-protocol/src/protocol/v2/thread.rs ; turn.rs/thread_data.rs alongside it; https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/core/src/session/thread_settings.rs ; https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/protocol/src/permissions.rs ; https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/tui/src/lib.rs . Source citations/hashes do not prove deployment.

    Minimal managed-launch/arm contract, proposed ONLY for choice B

    Required of the existing host owner; no attestation API is asserted. The consumer cannot mint these facts. Any unenforced clause returns unsupported-boundary BEFORE origin write/send.

    H1 — authority and physical anchor. The existing trusted host launch owner pins the real main common-Git directory and project UUID independently of child-selected cwd/config. Proposed namespace remains <common-dir>/aida/mail-origin-v1/<project-UUID>/. Pin directory handles and dev/inode/mount identity, all ancestor replacement authority, and record schema/build/generation. The same-uid HOST process remains trusted; no root daemon, new uid, credential, signature key or privilege broker is introduced. Model-originated CLI/MCP invocation, context/env claims, a copied receipt and journal possession cannot become host-writer authority. The current source does not supply that separation automatically. If the existing producer cannot remain on the HOST side while denying identical native invocation, that is an essential missing authority boundary, not a packaging detail.

    H2 — actual execution scope. Before any armed target executes under the new generation, bind exact project, native thread, host launch instance, actual worker PID/start/namespace identity (or actual remote execution identity), effective permissions/environment and runtime roots, and boundary generation. Daemon PID/peer/start, thread identity and execution worker identity are distinct. Cover every native write-producing path used by this target: shell/unified exec, filesystem edits/apply_patch, native workers, delegated children, and any client/tool path able to write that journal. Trusted host tools capable of writing outside the native boundary must independently refuse arbitrary origin writes; merely wrapping shell commands leaves a hole. Bind any background/in-flight workers which outlive a turn. Other in-scope native actors able to reach the same shared root must also be protected; proving only one target while another child can modify its journal cannot establish journal integrity. Host-created records describe enforcement; model-provided records have no authority.

    H3 — enforce the invariant, not an unobservable list. The protected object, its directory entries, journal lock, receipt store and relevant ancestors cannot be modified/replaced/rebound by any covered native write surface. Include physical common-dir versus linked gitdir; writable workspace/main/sibling/private-clone roots; scratch /tmp/TMPDIR; symlink and bind-mount aliases; alternate mount namespaces; hardlinks; inherited writable file/dir descriptors and /proc FD access; and model-reachable host write/proxy entrypoints. Pinning a handle alone does not prevent writes through another handle/alias. No native child inherits host origin writable descriptors. A list from mountinfo or canonicalize alone is not an all-alias proof. The host must construct and verify a closed actual worker write boundary, or refuse an unknown alias/executor. An outer namespace must exclude bypass via native children, host service calls or remount authority; do not advertise that a bare ro-bind protects every same-uid path/FD/process escape. Any construction requiring new authority is returned for root decision before implementation.

    H4 — runtime changes and races. Prefer an independently enforced invariant that survives native turn/start, settings/profile/environment, cwd/runtime-root and permission-grant changes: native policy may become broader inside it, but cannot make the origin writable outside it. Then native setting changes alone do not require guessing a new journal generation; the host boundary still dominates them. A monitor-only design instead needs synchronous pre-execution interlocking of EVERY effective change and worker admission. No such interlock is established by thread/read, ThreadSettingsApplied, a TUI proxy or the current registry. It cannot be assumed available. Asynchronous notification after a write or a post-send recheck is too late to repair origin trust. An unconstrained existing shared daemon defeats a launcher-only invariant. Embedded/daemon fallback, worker migration, daemon recovery and remote environment changes require a new proven binding before use; no automatic restart/adoption is authorized here.

    H5 — trusted evidence and arm. The enforcing HOST alone publishes a protected versioned record: proof method/build, anchor identity, project/thread/launch/worker/endpoint identities, generation, execution scope and invalidation conditions. It is enforcement-backed data, not self-authenticating attestation. Watchdog checks pinned handles/coherent bounded reads/generation; child-writable registry fields do not qualify. arm_pending/manual arm and both producers require this binding before origin-authoritative sends. Legacy rows retain historical readability, no grandfathering. TASK-2712 remains conditional NOT READY.

    H6 — transaction and invalidation. Bind each Prepared/Attempting intent to that protected generation BEFORE any socket send. Retain author18's permanent origin lock, bounded acquisition, fsync/atomic/sequence rules and no network while holding the origin lock. The actual execution boundary must remain effective through send, delivery, reconciliation and evidence retention, including workers already running; a CAS after RPC is insufficient. Host boundary teardown/anchor or ancestor replacement, writable alias introduction, inherited write authority, loss of scope, worker/daemon identity change, unverified recovery, failed verification or protected-state write failure invalidates the binding BEFORE exposure. If continuity cannot be proved, mark the uncertain interval origin-incomplete and stop new sends. Preserve known lower-bound deliveries/spend, never convert the gap to ordinary User. Restore proof only prospectively; no retrospective origin manufacturing. Merely marking a bad receipt after a potentially corrupting write cannot restore old trusted contents.

    H7 — admission and persistence. The watchdog's permanent transaction lock still serializes load/inventory/fold/judge/save. It takes a short origin snapshot lock, releases before native scan, and revalidates the relied-on origin/boundary generations before atomically publishing positive proof. Bound all rereads/history/aliases/proof work under existing byte/time/state limits; exhaustion is incomplete. A new invalidation observed at consumption must refuse affected proof rather than accept an old fresh timestamp. This does not claim instantaneous arbitrary future evidence visibility or change the existing one-hour freshness rule. Native source and journal prefix digests, coherent ownership intervals, metric coverage, lower bounds and failed-save behavior remain mandatory. A boundary gap cannot be laundered by a newer clean snapshot while its relevant interval is still required.

    H8 — lifecycle and deployment limits. No livejournal/native-write probe is authorized now. A future implementation must demonstrate H1-H7 in a controlled fake project/worker environment under the REAL selected enforcement mechanism and actual configured syscall/tool paths; a mocked attestation or source-only test is insufficient deployment proof. Use disposable roots and no model/account/real transcripts. If its only working route is a new daemon/service, a remote owner, host credential, upstream patch, unmanaged policy reconfiguration, unsupported interception API or essential new authority, stop with that named conflict. Root must decide it separately; no implementer discretion to waive it. Existing terminal implementer27 remains terminal; no actor resurrection from stale leases. No BUG-2398 launch/lifecycle implementation overlap before new independent signature and explicit coordination.

    Bounded producer changes after the new gate

    The accepted typed local route remains: trusted normal-home rendezvous -> verified physical protected Unix socket -> peer/version/home identity -> initialize/initialized -> thread/read ownership -> thread/queue/add with caller clientUserMessageId. Same-user local endpoint access is the selected transport authentication; no bearer/auth.json/account read. Endpoint binding and host origin enforcement are separate gates. No embedded fallback, WSS, alternate daemon, service installation or socket repair. H1-H8 must not masquerade as a new API request.

    All Python tick batch/role-only/partial and Rust ThreadQueue/CodexQueue batch/role-only/partial routes share intent-before-send, protected origin and exact native-delivery join. Their old CLI route cannot remain as a bypass. Preserve their existing dedupe/ack meanings and distinct queue/client/raw/logical IDs. Acceptance/Pending/Acked/list disappearance do not prove delivery; uncertain sends do not auto-retry. Crash-before-ack reconciliation retains exact delivery. Two real deliveries reusing an ID retain two wakes/lower bounds plus contradiction, not id-based erasure.

    Also retain all known native scheduled-heartbeat/steering, synchronous/asynchronous hooks, inter-agent/subagent input, automatic follow-up/StartIfIdle/ContinueIfIdle, direct API/TUI/exec/remote text, recovery/context/tool and inherited-history paths in author18's inventory. Boundary proof does not supply missing producer classification or compaction eligibility. For any known AIDA continuation, use actual supported native classification or trusted exact join; missing/conflicting evidence is incomplete. A native route not using the journal still needs all applicable metric/delivery evidence; its existence alone is not a mandate to journal ordinary User input.

    Retained semantic contract; no P2 reopening

    Advisor19 B2391-1 has precedence over author18/advisor17 universal-human assertions. After exact ownership/generation/raw/logical/body proof: (1) exact trusted known AIDA origin join classifies that delivery automated; (2) actual supported eligible native automated provenance uses its real semantics; (3) explicit emitted positionally valid ordinary User plus actual delivery, without contradictory known origin, is non-injected ordinary eligibility WITHOUT Human=true; (4) Unknown/default/missing/misaligned/malformed/unsupported required provenance and ambiguous joins refuse. Keep /loop mailbox non-injected branch. A journal's silence, client name/UUID, role:user, heartbeat fallback, DefaultOnError absence and bare harness_injected:false are not explicit User. Legacy reads raw classification plus actual user_message; Paginated reads raw plus actual typed item. Do not demand fictitious provenance on Legacy mirrors. This deployment amendment does not restore universal human authenticity.

    Retain ALL historical attribution: active/retired exact native/path/time bindings; deleted/pruned worktrees and private clones on first scan; retained physical/lexical aliases; ownership/resume intervals; path reuse/conflict, foreign/unresolved separation; bounded fallible discovery. PID death never erases recent spend.

    Retain ALL accounting/rules: producing thread/response identity; no overlapping checkpoint/rollup/constituent additions; cache/reasoning/components, baselines/reset/fork/replay lineage; exact contained intervals and unknown boundary-straddling allocation; observed usage-free work incomplete; actual delivered wakes and terminal replies; structured poll or ordinary /loop; context not-required only when disabled. Every Claude threshold/comparison/crossing/window/poll/dedupe/default remains unchanged.

    Retain the FULL BOTH-mode compaction matrix: Regular versus Compact caller; local pre/mid/post/fallback, remote V2, background response versus install, manual adoption stays manual, Ok(false) completion without install, token-budget/new_context and recovery/window lineage. Missing caller/install proof refuses eligibility while retaining exact usage.

    Retain per-vendor/effective-policy/metric/interval completeness; findings never replace it. Keep permanent bounded locks, coherent atomic state/retention, FULL relied-on-prefix digest revalidation including same-inode/same-length interior rewrites, fallible bounded scans and no silent dedupe eviction. Old Claude-only/schema/stale/missing/deleted/corrupt/unknown/partial-tripped/failed-save evidence refuses actual budget_evidence_verdict. No COVERED_VENDORS addition before full native adapter and scan-derived complete success with EMPTY allow_uncovered_vendors. No token/heartbeat/managed-mail-only or invented all-human success. All three ACs remain unfulfilled and full native first-class scope remains binding.

    Tests retained and new deployment proof gates (all pending)

    Incorporate EVERY named test, failure condition, synthetic-state rule and local gate in FULL author18 /tmp/aida-BUG2391-producer-sketch-result.md and FULL advisor17 /tmp/aida-BUG2391-amended-signoff-result.md, corrected ONLY by FULL advisor19 /tmp/aida-BUG2391-final-signoff-result.md B2391-1. None is waived by reference. In particular preserve bug2391_actual_queue_mail_wake_loses_origin_refuses as the known old AIDA route, both revised other_queue_automation_not_silently_human and other_direct_api_user_origin_still_unknown, explicit ordinary User positives in Legacy/Paginated and DefaultOnError/heartbeat-default/short-vector negatives. Preserve all historical/token/mirror/compaction/fullguard tests and all six producer paths.

    Add proposed bug2391_boundary_* cases (all pending; disposable state only):
    - linked_gitdir_not_common_dir: actual disposable linked worktree, gitdir-only protection refuses common-dir trust; separate protected common-root positive and writable/unknown negatives.
    - effective_settings_and_all_worker_loci: turn roots/cwd/profile/environment/additional grants, old in-flight workers, embedded/shared-daemon/separate/remote executors. Client-only wrapper with unbound workers refuses; no fabricated remote proof.
    - protected_root_alias_mount_fd_negative: REAL selected enforcement rejects write/replacement via common dir/ancestor, secondary bind, scratch alias, symlink/hardlink, inherited FD and model-reachable producer/tool. Unknown scope refuses. Source assertions/mode bits do not prove runtime denial.
    - arm_send_invalidation_barriers: deterministic races at arm, Prepared, send, worker admission, delivery, snapshot/save; changed generation/anchor/worker cannot retain trusted origin/clean guard. Settings-change continuity needs the actual invariant.
    - child_cannot_mint_host_origin: installed command name, forged env/context/registry/receipt/endpoint cannot mint origin. Real host path works without fixture secret/key shortcuts.
    - boundary_loss_history_and_retention: gaps remain incomplete while relevant, exact spend/wake lower bounds and ordinary aging survive; no retrospective origin. Lock/sequence/save/retention failures refuse.
    - fullscan_native_guard_with_real_boundary_contract: protected producer -> actual Legacy AND Paginated delivery -> scan -> PRODUCTION budget_evidence_verdict, ordinary explicit User plus joined AIDA automation, EVERY effective metric complete, EMPTY overrides. Every negative feeds scan-derived affected evidence to that same guard. Mock boundary seams test flow, never certify deployment or manufacture completeness.

    Only source reproduction ran; no Cargo/native test. Future gate: ONE AIDA_CARGO_TIMEOUT=10m cargo test --profile agent -p aida-cli-lib runaway_seats plus make check-ci-fast, guard cases in that filter. Long jobs background; inspect cargo ps after timeout/KILLED. No outer timeout/full suite/slot bypass. Actual >10 files/shared test infrastructure additionally need make test-touched and make check-ci-compile. Full CI/fresh exact-head independent implementation review remain later.

    Authority and separate receipts

    Only supplied /tmp/aida-BUG2391-boundary-amendment-own-context.sh was inspected/sourced: exact codex-advisor-20/advisor/companion, referenced own context read without exposing selectors/keys, same-shell role current --check returned advisor. No parent/dead grant or root redirection. This is comment authority, not boundary proof; no independent registry PID/ancestry inspection is claimed.

    Canonical posting is reported separately after repeating ONLY own context plus role check immediately before the allowed BUG-2391 sketch comment. Native .git/cache refusal stands verbatim; no alternate-root/MCP mutation bypass. Accepted/persisted/host-committed are distinct. Implementer27's earlier readonly-cache post wrote nothing; no retroactive post on its authority.

    Actual source proof: supplied assertions PASS, symbols inspected. Missing deployment proof: no actual target effective-policy/all-alias/worker-generation HOST boundary or runtime protected-root positive/negative established. No production edit/commit/PR/push/Cargo/queue/dispatch/status/hold/merge/config/timer/credential/livejournal action. Root cannot claim full watchdog done. End after report; no poller.
