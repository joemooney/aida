title: aida list --tree EPIC group header shows raw stored status, not the BUG-626 rollup
description: 'Surfaced in the PR #1231 independent review. The new tree group header reads parent.status (raw YAML status from backend.load()), but an EPICs real status is a read-only rollup derived from its children (BUG-626; derive_epic_status / compute_epic_statuses in cache.rs). So an EPIC rendered as a tree HEADER can show its raw stored status while the same EPIC rendered as a ROW (or via aida show) shows the rollup-derived status — they can disagree. Pre-existing fidelity gap, not introduced by #1231. FIX: the tree header should use the rollup-derived status (the cache value) for EPICs, consistent with every other surface.'
