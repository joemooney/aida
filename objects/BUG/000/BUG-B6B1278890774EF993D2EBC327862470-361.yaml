title: 'completed_at is NULL on 19% of Completed specs: stamp it on every Completed transition, derive from history, backfill'
description: |
  Problem: 1,008 of the 5,360 Completed specs in the cache have completed_at NULL. The cache projects completed_at only from implementation_info.completed_at, and only the Done to Completed auto-bump on merge stamps that field. Specs completed through `aida edit --status completed`, `aida review record` (Review PR-N stories), or before STORY-86 never get the stamp. Callers then fall back to modified_at, which moves whenever a comment, tag or link is added later. So "what completed in the last 24 h" is wrong, and throughput numbers can't be trusted. Found by an agy cache/store audit on 2026-11-15; the 1,008 count was re-checked against cache.db.

  Acceptance:
  1. Every transition to Completed stamps implementation_info.completed_at: edit, review record, close, and auto-bump. A test covers each path.
  2. The projection falls back to the latest status-history entry whose new value is Completed when the stamp is absent. After this lands, a full cache rebuild leaves 0 Completed specs with completed_at NULL, or every remaining one is listed with its reason.
  3. Rejected and Superseded specs get a closed_at, projected from their terminal status-history entry.
  4. One-time backfill: write the derived completed_at into the store objects (single user, data rewrite OK). It must run idempotently.
