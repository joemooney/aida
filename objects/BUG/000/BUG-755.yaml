  content: 'v3 evidence (2026-07-18 23:0x): CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS=0 on the spawn is NOT sufficient. The drain again ended cleanly (''end_turn'', result: three PRs awaiting CI verdicts each with its own watcher — $50.29 total cost) leaving PR-1513/1514/1515 green-and-unmerged: the CI watchers were spawned inside the per-spec SUBAGENT contexts, which terminate with their agents, so the top-level session''s final turn had no live background tasks to wait on regardless of the ceiling. The fix must be in the /aida-burndown skill''s integration loop: the TOP session blocks on gh pr checks --watch in the FOREGROUND (or polls) until every wave PR is merged before its final report — never delegate terminal-phase watching to subagents or background tasks.'
