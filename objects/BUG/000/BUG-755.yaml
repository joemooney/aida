  content: 'Related symptom 2026-07-18 21:24: with the --verbose drain''s claude -p child alive and streaming (pid 2818172, tee 20260719T041604Z-019f7896.jsonl, four wave PRs open), ''aida drain status'' reports ''No drain in progress'' — the drain lock does not span the child''s actual lifetime (parent exited or lock released early). Same lifecycle seam: whatever owns the lock is not whatever does the work. The fix should make lock lifetime == the claude -p child''s lifetime, which also gives drain status an honest answer.'
