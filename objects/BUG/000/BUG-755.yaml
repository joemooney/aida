  content: 'ROOT CAUSE CONFIRMED 2026-07-18 21:36, from the --verbose stream: ''Background tasks still running after 600s; terminating. Set CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS=0 to wait indefinitely.'' Headless claude -p enforces a 600s background-task wait ceiling at turn end — the drain''s CI watches (9-10min CI) exceed it, get terminated, and the session exits with wave PRs unmerged. Reproduced on the 21:16 drain: session ended (result event, $6.28) leaving PR-1509/1510/1511/1512 green-and-unmerged and 6 specs unstarted. FIX: burndown run (and any headless drive that parents CI watches) must spawn claude -p with CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS=0 in the child env; additionally the skill should prefer blocking waits (gh pr checks --watch in foreground) over backgrounded watches at final-turn time. Interim operator workaround: CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS=0 aida burndown run --verbose.'
