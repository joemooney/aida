title: Review risk classifier tags integration-base PRs STRICT from integration's own diff vs main
description: 'Gate-ledger verdicts on #4463 and #4470 (base=integration) carry risk.tier=STRICT with reason ''sensitive path: scripts/ci-structural-exclusions.json''. Neither PR touches that file; it changed on integration. The classifier diffs base_tip=main..head instead of the PR''s actual base (integration). Result: reviewers apply ADR-76 strict blocking to standard-tier test/diagnostic PRs, forcing extra rework rounds. AC1: classifier uses the PR''s base ref (merge-base with the PR base) for integration-base PRs; regression with an integration branch carrying a sensitive-path change the PR does not touch.'
