  content: 'Confirmed 2026-09-11: installed codex-cli 0.151.0 already supports ''codex exec --json'' (Print events to stdout as JSONL) — this is a launch-flag omission in codex_headless_args (session.rs:1568), not a version gap. When wiring --json, verify the JSONL event shape against 0.151.0 specifically (event types: response_item / event_msg / item_completed / function_call / function_call_output, per the rollout files) so the final-message parser reads the streamed ''item_completed''/result event rather than expecting one trailing blob. The rollout-watch fallback in acceptance #1 needs no parser change and is the safe option if the --json parse proves fiddly.'
