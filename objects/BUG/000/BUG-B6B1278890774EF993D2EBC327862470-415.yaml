title: 'dell1 disk filled (ENOSPC) under 6 concurrent lanes and killed every lane: no disk guard on lane launch, no GC of target/lane-overlay'
description: '2026-11-17 00:50 MST: dell1 / hit 100% (468G, 8.3M free) with 6 codex lanes building. target/ was 245G: lane-overlay 117G (28 overlay dirs, several from 2026-11-14), worktrees 43G, agent 37G, debug 23G, advisor-merge 12G + advisor-merge-b 6.6G. All lanes died with os error 28 mid-gate; committed work survived in seat worktrees; one store object and one fast-gate record were left stale (fail, pending=true), which made later ''aida ship --from-seat'' refuse until the record was moved aside. Advisor freed 138G by deleting target/debug and target/advisor-merge{,-b}. Expected: lane launch refuses (or waits) below a free-space floor, overlays of ended lanes are reclaimed, and a fast-gate record written during ENOSPC is not treated as a real failure. TASK-3121 covered mode-zero overlays only.'
