- id: 01a1e930-f996-7f92-83b8-8fe1bbd10a38
  author: dirtlab
  content: 'Implemented disk-floor preflight for standalone and drain implementer launches using [doctor.disk_headroom] min_free_gib (default 60 GiB), probing project/target/temp filesystems. Ended lease cleanup reclaims overlays, including mode-zero work/work. Host worktree gc --apply rechecks owner/identity and reclaims orphan overlays after a ten-minute grace. Live leases and unleased retained clones preserve overlays; because ended leases lack an overlay-to-clone binding, any unleased seat clone conservatively retains orphan overlays/generations until dismissed. Explicit ENOSPC fast-gate diagnostics become skipped(disk-full), including legacy failure receipts; ordinary/unknown failures remain refusals. Validation through lane runner: 92 affected-module tests passed; four BUG-2651 regressions passed; workspace cargo test --no-run passed; rustfmt checks and git diff --check passed. Runner reported the primary rewrote its shared seed generation, but all jobs exited successfully. Reviewed codegraph client unavailable; doctor reported missing, navigation verified with rg. Native-seat edits remain uncommitted for host publication.'
