title: 'Reviews of Refs-only slice PRs request changes for deferred ACs: the review prompt has no slice scope, so every sliced PR costs an extra round (#4179)'
description: |
  Observed 2026-11-18 08:34 MST, PR #4179 (BUG-2633 slice 1, Refs-only trailer): the reviewer found NO implementation defect in the slice and all exact-head gates were green, but recorded CHANGES REQUESTED. The full-sweep review contract (queue_cmd/work.rs, around line 2560) requires every untested acceptance criterion of the WHOLE spec to be reported as a defect, and the advisor's slice decomposition (recorded as a ruling on the spec) was not carried into the prompt. The same PR family needed hand-written scope notes for #4251 (STORY-2897 S1) and #4137 (BUG-2618 S1). Each mismatch costs a review round (~30-60 min) plus advisor time.

  ## Acceptance
  1. A Refs-only PR (commit/PR title trailer `Refs SPEC`) can declare its slice scope in a machine-readable form, e.g. a `Slice-Scope:` block in the PR body listing the ACs it covers and the ones deferred, with the spec/slice they are deferred to. An advisor scope ruling recorded on the spec in a typed form also counts.
  2. The review prompt generator carries that scope automatically. Deferred ACs are pre-marked "not-applicable-because deferred to <slice>" and are NOT reported as defects; in-scope ACs are reviewed as today.
  3. A Refs-only PR with NO declared scope gets a clear prompt note ("slice scope undeclared: review the diff's own claims; list uncovered ACs as informational, not blocking") instead of failing on whole-spec acceptance.
  4. A completing trailer (`(SPEC)`) keeps today's whole-spec contract.
  5. Tests: a scoped Refs PR, an unscoped Refs PR, and a completing PR, each producing the expected prompt sections.
