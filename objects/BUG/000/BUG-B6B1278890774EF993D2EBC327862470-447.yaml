  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2683):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 1d6544576f5b
    Recorded: 2026-11-19T21:43:14.258224061+00:00
    Findings:
    1. [P2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/review_prompt.rs:211: Honor typed advisor scope records on the spec. append_spec_checklist calls parse_slice_scope only with the forge body. req.comments is passed only to append_implementer_approach, whose reader selects the implementer approach heading. There is no typed advisor scope input or reader anywhere in the change. A Refs PR whose scope is recorded by its advisor on the spec is therefore always rendered as undeclared, losing both the explicit covered obligations and destination-bearing N/A deferrals. This leaves the advisor alternative in ac2448c8 and automatic transport in ac2a9f9d unmet under the completing BUG-2683 trailer. Define/document and consume the typed advisor declaration (with clear precedence/conflict handling against PR declarations), and add a regression with scope present only on the spec. This finding also exists in the pinned landed tree and is independent of intervening base changes.
    2. [P2; blocking_tier=unmet-claimed-ac] aida-cli-lib/src/review_prompt.rs:60-65: Preserve unknown metadata instead of treating a failed read as an absent declaration. On change_title_and_body failure the generator substitutes empty title/body and still succeeds using commit coverage. With commits `First slice (Refs BUG-2683)` and title `Complete (BUG-2683)` (an explicitly supported test scenario), a transient metadata failure loses completion and emits the undeclared-slice instruction that uncovered criteria are informational. A scoped Refs PR likewise loses its covered obligations when the declared body cannot be fetched. A warning on stderr does not repair the weaker successful worksheet. Distinguish unavailable metadata from genuinely absent scope: refuse/retry generation or explicitly require metadata recovery before choosing the contract; add regressions for both cases. This violates ac2a9f9d/ac775474 and is unchanged by the intervening base commits.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
