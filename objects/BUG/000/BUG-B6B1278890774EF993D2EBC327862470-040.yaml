  content: 'Rework for advisor ruling 2026-10-30 (PR-3142 CI red): the notice path had not changed. BUG-032 (PR-3135) made stored message timestamps epoch millis (the writer scales seconds), but awaiting_you compared them with now in SECONDS, so ages went negative and the 2h-old [request] was never overdue (the missing ''1 overdue request''). Fix c27413928a5: one mail_age_secs helper (millis to seconds; unknown time is neither stale nor overdue) used by previews, stale-automated, and overdue; unit fixtures stamp millis. Test unchanged. Merged origin/main (2ed6a716905, no rebase or force). cargo test -p aida-cli-lib --lib story_465 awaiting_you: 99 passed; make check-ci-fast: 36 gates passed.'
