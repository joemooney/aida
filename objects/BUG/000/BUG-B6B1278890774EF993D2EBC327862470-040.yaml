  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit (awaiting_you.rs):** role-addressed mail lands in a new `MailChannel.role_unread` and the compact line says `N mail to advisor`, never `shared mail` (AC1). The operator-own `unread` number keeps its BUG-767 contract.
    - **Unit:** `mail_preview_lines()` names up to 3 newest unread items as `[kind] from <sender> · <age> ago · <subject>`, `[request]` first, then `[handoff]`, then newest (AC2). `aida awaiting --notice` prints them under the compact line.
    - **Unit:** unread mail from an automated sender (`review-watch`, `aida-*`, `*-watch`) older than 7 days drops out of every count and preview and is summarized as one `N old automated notices` line (AC3). Summarized, not archived: the notice path is read-only.
    - **Unit:** an unread `[request]` older than 30 minutes, addressed to the operator or the session role, becomes an `overdue request` item in `aida awaiting` (render + compact + JSON) (AC4).
    - **Command-level (story_465_awaiting_report_tests.rs):** a handoff from `codex-implementer-01` written to role `advisor` shows by sender and subject in the per-turn notice lines built from the collected report (AC5).

    ### Expected files
    - `aida-cli-lib/src/awaiting_you.rs`
    - `aida-cli-lib/src/status_awaiting.rs`
    - `aida-cli-lib/src/tests/story_465_awaiting_report_tests.rs` (+ any existing tests asserting role mail as `shared`)

    ### Ambiguities / conflicts as questions
    - AC3 allows archive or summarize: choosing summarize, because the per-turn notice must stay read-only (STORY-1397 contract). OK?
