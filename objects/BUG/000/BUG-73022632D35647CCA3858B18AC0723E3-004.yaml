title: Unattended numbered ship can lose spec supervision when the target is missing from the open-change list
description: Observed during STORY-3038 round 4 using the native ship fixture with an attested approval, green CI, an empty open-PR list and successful direct PR metadata. From main, the command reached the fake forge merge after a same-head size withdrawal. pr_cmd/mod.rs uses optional open_change_by_number output for the branch and title used in supervised admission. Investigate the missing or truncated list case, resolve the numbered target directly or refuse incomplete evidence, and retain the existing already-merged recovery behavior.
