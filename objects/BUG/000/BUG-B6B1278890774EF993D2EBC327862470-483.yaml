    Read `aida show BUG-2722`. Add an `aida doctor heal` action that releases ONE repair-journal (.aida/repair-journal.json) conflict reservation, and only when its lane's lease is ended AND its recorded tree is absent or salvaged. Otherwise it refuses with evidence: the lease state, tree state, and the inspection command. Keep the doctor finding plus heal shape consistent with the existing stale-leases category (dry-run and --yes, one id at a time).
    Regression test for the dell1 entry-48 shape: PR #4376 reserved at 660c0e87 for lane 01a2053df3e6 (lease ended), tree .../aida-seat-...-433 moved away (absent). The heal releases it, and a following conflict rework is no longer refused with "retained conflicts require their host journal evidence".
    Do NOT pull in BUG-2688's wider redesign. ADR-76 strict tier (lease/claim safety), so expect a STRICT review. Under mass-change mode, classify every finding; unmet-AC defers (except strict-tier fail-open, race and data-loss).
