title: Review watcher treats a stale lease as a live author and skips the PR indefinitely
description: 'Observed 2026-11-04: PRs #3372, #3367, #3336 and #3386 got no fresh review for hours. The watcher logged ''stale overlapping head already notified; the author''s session on <branch> is live and owns the merge'', while `aida session leases` showed those leases as ⚠ stale (the Codex lane had exited and the seats were clean and pushed). review_watch_update::author_live -> status_prs::live_owned_branches_strict counts a lease live when its active OR creator process is alive. The creator for advisor-launched lanes is a long-lived process (the deputy or advisor), so an exited lane stays ''live'' forever. Acceptance: (1) liveness for review gating uses the same verdict as the leases view''s stale marker (the lane''s own process, not the launcher); (2) a lease whose lane has exited with a clean, pushed seat is not live; (3) a regression test pins an alive creator plus a dead active process to ''not live''; (4) the watcher log names the lease id when it skips for a live author.'
