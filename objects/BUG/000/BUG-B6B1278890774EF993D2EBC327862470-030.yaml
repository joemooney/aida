title: aida agent new claude --role advisor crashes the claude session at launch (allocator lock message flashes)
description: |-
  Operator report 2026-10-29 ~20:05 MST: running `aida agent new claude --role advisor` in the operator terminal started claude, which crashed almost immediately. A message mentioning the allocator being locked flashed briefly before the crash. The operator fell back to a plain `claude` launch (session claude-advisor-08 now runs fine). Context: STORY-095 slice 1 (block delegation lineage records) merged at 9a86ae5 shortly before, and the lineage/allocation code is the likeliest source of a lock message.

  Acceptance:
  1. Reproduce: launch an advisor via `aida agent new claude --role advisor` from the primary checkout (and from a worktree), capturing stderr to a file so the flashing message is preserved.
  2. Root-cause the allocator/lock message and the crash. If the launcher fails, it must exit with a readable error that stays on screen, not a crashed child.
  3. Fix it, with a regression test in the launcher or allocation module.
  4. Any launcher preflight error stays visible (do not clear or exec over it).
status: Done
priority: High
