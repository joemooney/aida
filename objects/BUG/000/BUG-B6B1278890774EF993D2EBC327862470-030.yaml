  content: 'Reproduce criterion evidence (review round 2, finding 5): no stderr capture from the original operator launch survived; the agent UI painted over the message and the operator relaunched plain claude. The deterministic reproduction of the flashed ''handle allocation lock busy'' message is the test launcher_registration_waits_out_lock_held_past_sessionstart_budget (aida-cli-lib/src/tests/bug_030_launch_registry_lock_tests.rs), traced to .Reproduce: it holds the handle-namespace lock on another thread and shows the 250 ms SessionStart-budget acquire fails with exactly that message, which is the error register_spawned_agent returned via ''?'' before the fix. The lock path is independent of primary checkout vs worktree: both resolve the same common-root namespace lock (agent_handle::lock_namespace on the project root), so one reproduction covers both launch locations. The crash half is covered by launcher_waits_for_child_when_registration_lock_stays_busy (real sh child, lock held past the budget, launcher waits and the warning prints after the child exits).'
