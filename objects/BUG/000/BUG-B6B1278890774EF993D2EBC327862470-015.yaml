  author: joe
  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Command-level (aida-cli/tests/story_078_node_aliases.rs):** with a label bound, `queue add/rm/done` and `queue work --dry-run` with the alias give the same queue entry as the canonical form; `claim`/`unclaim` alias writes the canonical-scope lease; `worktree add` alias makes the canonical branch + lease; `session end --spec` alias finds the canonical lease; an unknown label stays a not-found that names it.
    - **Unit (spec_arg tests):** canonical/csv helpers keep non-alias input unchanged and expand bound labels literal-first.
    - **pr auto-queue-review:** it is branch-keyed; trailers already canonicalize via expand_or_keep, but `pr` is early-dispatch so the map was never installed. Covered by installing the map in the shared helper; no live-forge test (needs gh).
    - **Audit:** grep clap spec/id/scope args; list routed ones in the PR body.

    ### Expected files
    - new `aida-cli-lib/src/spec_arg.rs` (+ test file)
    - `queue_cmd.rs` (run_queue normalization), `claim.rs`, `worktree_gc.rs`, `agent_launch.rs`, `pr_cmd.rs`, other audited dispatchers
    - `aida-cli/tests/story_078_node_aliases.rs`
    - `aida add` confirmation output site (description tail)

    ### Ambiguities / conflicts as questions
    - None blocking. Approach: canonicalize at each command entry via `node_alias::expand_or_keep` (built on `resolve_literal_first`), installing the alias map for early-dispatch commands.
