    Findings:
    1. [P1] aida-cli-lib/src/review_watch.rs:1499-1524: Integrate missing-verdict retries with distributed admission. After an actual review exits without a verdict, finish_admission records State::Terminal. select now reserves a retry after backoff, but admission::update_with_observer (admission.rs:486-493) refuses every head with a prior Terminal transition; chain validation also rejects such readmission (admission.rs:240-247). reserve_dispatch consequently changes the new attempt to RemoteHeld, and probe_unneeded_with_coverage suppresses it indefinitely. Thus configured admission hubs never launch a second reviewer, never reach the three-attempt blocker, and local --release cannot undo the consumed hub head. Add a safe bounded retry mechanism at the authoritative admission boundary that preserves live-claim and durable-verdict gates, and an integration regression covering terminal-without-verdict -> backoff -> accepted second reservation -> exhaustion status.
