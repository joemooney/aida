title: review-watch never retries a head whose recorded review attempt produced no verdict, so PRs sit unreviewed for hours
description: 'Observed 2026-11-10: PR #3754 (5h), #3753 (7h at head 913476ba, last verdict against an older head) and #3651 each had one recorded review attempt at the current head and no verdict for that head; review-watch skipped them until the advisor ran ''aida review watch --release PR-N'' by hand, after which a reviewer launched within minutes and #3754 was approved and landed. Expected: an attempt that ends without recording a verdict (reviewer crash, timeout, lease loss) is retried automatically with backoff, bounded by a per-head attempt cap; when the cap is hit, review-watch status names the PR and the reason so the advisor sees it. Acceptance: (1) a failed attempt with no verdict is retried after a backoff; (2) a cap (e.g. 3 per head) then surfaces a blocker row in ''aida advisor loops status'' / review-watch status; (3) a new head resets the count; (4) tests for each.'
