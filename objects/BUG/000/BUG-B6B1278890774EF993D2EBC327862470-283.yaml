  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2518):
    Verdict: CHANGES REQUESTED
    Reviewed commit: ec98f4c644a5
    Recorded: 2026-11-11T03:52:30.772170727+00:00
    Findings:
    1. [P2] aida-cli-lib/src/review_watch.rs:1484-1501: Preserve the no-verdict attempt budget when a retry dispatcher exits before claiming its launch receipt. After one real review ends without a verdict, selection creates retry count 2. If that dispatcher exits before execute_reservation (for example a refused grant or claim timeout), mark_unclaimed_exit records Phase::Exited and cancels the hub Retry without starting work. This branch treats that cancellation as another completed review and increments to 3 after backoff; a second pre-claim exit then permanently reports three review attempts although the hub has only one Running transition. Unlike the covered spawn/preflight failures, these proven pre-spawn cancellations exhaust local retries and strand the head until manual release. Distinguish unclaimed cancellations from started reviews, preserve the inherited counter, and add an integration regression using mark_unclaimed_exit on repeated Retry claims followed by successful readmission and exhaustion after three actual started attempts.
