  summary: 'BUG-2745 AC1 verified by bug_2745_verdict_release_tests::a_reviewer_worktree_verdict_auto_release_counts_as_a_recorded_clearance: a rework hold that a reviewer worktree auto-releases is read from the shared primary ledger (hold::state resolves the store root) and now counts as a recorded clearance, so the PR is admitted as SupervisedByMode instead of being refused as MarkerMissing. Mandate and approval checks still apply. Type protocol checklist: BUG-2745 (bug protocol) ''the PR touches at least one test file'' is met (new aida-cli-lib/src/tests/bug_2745_verdict_release_tests.rs). Authority/gate deep pass (strict tier): the only widened path is unheld_supervised_facts. It admits only when the ledger itself released a non-legacy Rework hold (the fold now keeps the released record in HoldState.released, and the kind is judged from that record, not from the clearance''s claim), the clearance principal is auto-released:verdict with released_by_verdict present, no hold is open since, there is no missing-marker reason, and the forge labels show an open PR with no hold label and recorded==cleared. Every other recorded clearance, a legacy clearance file (on_ledger false), a release with no open ledger hold, a marker newer than the ledger (released reset), unreadable labels and a closed PR all fail closed. Refusal-path tests cover the wrong kind, the wrong principal, a missing verdict, a forged rework claim over a supervision hold, a live hold label, mismatched labels, a closed PR, a forge error and a missing-marker reason; the BUG-2663 never-held shapes are unchanged. No test was weakened. The only other change is making the PRINCIPAL const pub(crate). Observation, not a defect: the release''s verdict head is not compared with the current head, but the mandate''s approval-at-head check covers a moved head. CI pending at review time (fast gates pass, fast compile pending, merge-hold-gate pass). No findings.'
