title: Ownership dual-write records systemd --user (subreaper) as the holder pid, so the judge reads detached lanes as alive forever
description: |
  ## Problem
  `aida own show --compare` (2026-11-05 11:50 MST, main c02cb56) reports about 30 UNEXPLAINED rows whose ownership judge says "alive: pid 2013 is running". PID 2013 is `/usr/lib/systemd/systemd --user`. Lanes launched detached (setsid/nohup through aida-deputy-shell, or `claude --bg`) are reparented to the user systemd subreaper. The STORY-2325 dual-write records that parent, or some other non-owner pid, as the holder, so the judge treats every such record as permanently alive. Examples: 01a1a99108e6 (STORY-2343), 01a1aceb0a45 (STORY-1468) and 01a1abea0b97: today's lease reads stale or no lease, while the judge reads alive via pid 2013.

  ## Acceptance
  - The ownership record's holder identity is the owning process itself (pid plus start time, via the shared process-identity primitive, regroup R3), never a parent or subreaper, and never pid 1 or a `systemd --user` instance.
  - The judge refuses to treat a holder whose identity resolves to an init or subreaper process as alive; it reports "holder identity invalid" instead.
  - `aida own migrate` rewrites existing records with bad holders (single user, surgery OK; no compat shim).
  - Regression test: a detached (setsid, reparented) lane's record names the lane pid, and the judge reads it dead after the lane exits.
  - `aida own show --compare` shows zero UNEXPLAINED rows caused by holder pid on this host.
  Blocks STORY-2325 PR-C (cutover precondition: zero unexplained compare diffs).
