    Verdict: CHANGES REQUESTED
    Reviewed commit: 22c4fce90ead
    Recorded: 2026-11-05T20:54:38.381445205+00:00
    Findings:
    1. MAJOR (AC1/AC5): dual.rs starting_lease_snapshot (via lease_started, session_start.rs:3433) records std::process::id() — the 'aida session start' CLI process — as the holder witness whenever no worker is stamped. That process exits milliseconds later, so judge_owner returns Dead (judge.rs:164) while the legacy lease is Live; compare.rs:101 classifies (Live, Dead) as Unexplained. Every interactive/role-enter session start (no queue-work worker stamp) therefore creates a new UNEXPLAINED compare row, and after PR-C cutover a Dead verdict would let live interactive work be reclaimed. The AIDA invocation is not the owning process. Fix: record no witness (Unknown) until a worker is stamped, or capture the actual long-lived owner (e.g. the agent/seat process) — and replace session_start_snapshot_names_setup_itself_and_preserves_a_stamped_worker, which currently asserts the defect, with a test showing an unstamped session never judges Dead while its lease is Live.
    2. MINOR (consistency): the setup-pid witness is ephemeral and inconsistent across writers: any later lease_written with the on-disk lease (no active_pid) replaces it with zero witnesses, and migrate::repair_holders (lease found, no active_pid) also strips it. Whatever the fix for the finding above, make dual-write and migrate derive the same holder from the same lease so repair is idempotent with the writer.
    3. AC5 (ac1d6672) unverified: no host evidence that 'aida own migrate --execute' then 'aida own show --compare' leaves zero UNEXPLAINED holder-pid rows. Docs (06-roles-sessions.md:1144-1148) state repaired orphan rows deliberately stay UNEXPLAINED 'never released'. Either attach operator-run host output on the spec with the residual rows classified as non-holder-pid causes, or narrow AC5 by advisor ruling; the spec cannot complete with this criterion open.
