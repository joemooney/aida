title: 'Store-history index: refresh lock against concurrent walks; StoreHistoryBatch::read stdin has no timeout'
description: 'Follow-ups from the #3952 (BUG-2554) rework, accepted non-blocking 2026-11-13 20:09: (1) concurrent gates can each re-walk the store history and write the index; a refresh lock (new store-writers.toml sink, needs a reviewed inventory row) would dedupe the walks. (2) StoreHistoryBatch::read''s cat-file --batch path uses store_git''s stdin branch, which has no timeout; move it to the bounded runner like the anchor check.'
