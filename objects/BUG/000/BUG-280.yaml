    Recurrence observed 2026-05-22 14:15 during TASK-339 autonomous drain (PR-208 reviewer phase). Skill template's AskUserQuestion ban (lines 61-85, trace:BUG-280) was honored in template prose but ignored by the headless reviewer model. PR-208 was merged manually after master confirmed the verdict was unambiguous PASS.

    Filed BUG-NEW (see findings) as the structural follow-up: BUG-280's fix was skill-template description (paper enforcement); the systemic fix is a programmatic gate (permission-denial intercept under AIDA_HEADLESS=1, recommended Path A) per the BUG-269 ceiling pattern. Not reopening BUG-280 itself — its scope was the skill template doc; the new bug captures the programmatic-gate work.
