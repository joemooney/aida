    REVIEW FINDINGS TO ADDRESS (BUG-2750):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 3c497182b289
    Recorded: 2026-11-25T11:15:44.083053990+00:00
    Findings:
    1. BUG-2750.AC1 — aida-cli-lib/src/pr_train_store_refresh.rs:22 and aida-core/src/git_ops.rs:199–205. The fetch-specific builder skips hook profile installation, but it still runs ensure_attr_source synchronously. If the bounded Git version probe times out, its empty result takes the same fallback as Git older than 2.40. On a store without a containment marker, that fallback calls home_dir (aida-core/src/store_hooks.rs:607–626,645–652). With HOME and USERPROFILE unset or empty, Rust's Linux home lookup calls getpwuid_r on the train thread. A stalled NSS provider can still hang the pre-pass after the five-second deadline and prevent the timeout message and cached-store continuation. Treat an expired version probe as unavailable before entering the fallback and bound the fallback for older Git while retaining the containment refusal.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
