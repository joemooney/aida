    REVIEW FINDINGS TO ADDRESS (BUG-2750):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 41cf0a48d5e7
    Recorded: 2026-11-25T09:04:39.997695276+00:00
    Findings:
    1. BUG-2750.AC1 — aida-cli-lib/src/pr_train_store_refresh.rs:22,31 and aida-core/src/store_hooks.rs:264. The five-second deadline reaches Git subprocesses, but command construction still synchronously establishes the store hooks profile. establish() calls private_primary_gid(), which uses getpwuid_r/getgrgid_r and may enumerate the password database with getpwent (store_hooks.rs:108–181). On a host with a stalled network-backed NSS provider, this runs on the train thread before a timed subprocess can start. The train can exceed the refresh deadline indefinitely and never emit the timeout diagnostic or continue with the cached store. Put hook preparation within the same cancellable deadline, or use fetch-specific hardening that avoids this lookup while preserving Git and credential protections.
