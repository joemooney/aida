  content: 'DESIGN RULING (advisor-122 2026-11-24 08:15): evaluate admission against BOTH the local canonical store and the fetched ref; REFUSALS are the union and always win; PERMITS (approval/mandate evidence) are the union, but only when no refusal applies in either; a refusal lifted upstream but still local keeps blocking; on fetch timeout/failure use local only and log store refresh unavailable. Tests: (a) fetched-only approval admits; (b) fetched-only hold blocks; (c) local-only hold blocks; (d) timeout -> local only.'
