- id: 01a2108c-fae6-70d1-a76a-81c67764bb83
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2750):
    Verdict: CHANGES REQUESTED
    Reviewed commit: df33cd956016
    Recorded: 2026-11-25T02:00:15.011271118+00:00
    Findings:
    1. BUG-2750.AC1 — aida-cli-lib/src/pr_train_store_refresh.rs:10,19 and aida-cli-lib/src/pr_train.rs:5136 (landed tree). A cold production store can block the train before the timed subprocess starts. host_git_command synchronously calls resolve_store_hooks_dir, whose cache-miss git rev-parse uses unbounded Command::output (aida-core/src/git_ops.rs:158,573–604). Store Git version detection also uses unbounded output on a cold cache (aida-core/src/store_hooks.rs:450–468). with_config_read_deadline scopes the credential URL probe, so it does not bound this command construction. Store discovery itself can run an unbounded fallback rev-parse before refresh even starts (aida-core/src/store_locate.rs:234–243). A stalled preparatory probe therefore prevents both the timeout diagnostic and cached-store continuation. Apply one deadline to store resolution and all preparatory Git calls as well as fetch, while keeping store Git hardening and credential handling.
    2. BUG-2750.AC2 — aida-cli-lib/src/pr_train_store_refresh.rs:58–110. The added regression calls refresh directly with a generic temporary repository that is neither named .aida-store nor an override with objects/ and metadata.yaml. is_store_tree therefore skips production store command preparation. The test can also pass if train never calls refresh, holds the writer lock around it, or stops on timeout. Its two-second input with a five-second assertion also allows a substantial overshoot. Add a criterion-qualified trace and a regression through the actual train pre-pass with a recognized store. Verify deadline handling through preparation and a stalled fetch, lock availability during the refresh, and continuation with the cached store and required timeout diagnostic.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
  created_at: 2026-11-25T02:33:24.454133069Z
  modified_at: 2026-11-25T02:33:24.454133069Z
