title: aida list human / aida human omits human-only-marked specs (view layer feeds human_required a hardcoded false) — contradicts the queue's human-only bucket
description: |-
  SYMPTOM (observed 2026-06-15, fresh `aida init` in the tq repo): immediately after init enqueued TASK-007 ("Commit AIDA scaffolding", Approved / High / human-only), `aida list human` printed "Nothing needs you right now — everything open is in flight, deferred, or self-resolving." Meanwhile `aida list queue` showed the SAME task under "Blocked (1 item) — human-only". The two human views contradict each other, and the contradiction lands on a brand-new user's very first interaction.

  ROOT CAUSE (verified in code): handle_list_human (aida-cli/src/main.rs ~75376) classifies via burndown::explain_reasons and keeps specs the canonical burndown::human_required predicate selects — but feeds human_required its `human_only` argument as a hardcoded `false`. The inline comment says so: "The orthogonal `human_only` marker is not yet folded in at the view layer (a later SPIKE-57 phase enriches the facts with it), so the predicate is fed `false` here." So `aida list human` / `aida human` only surfaces specs whose BUCKET needs a human (held-for-review, build-supervised, decisions-awaiting) or that are explicitly `--for human` routed. A spec that is human-required PURELY via the `human-only` marker (the onboarding task; any human-only-tagged work) is invisible in the human view, even though the queue/blocked view reads that same marker and labels it human-only.

  This is the deferred SPIKE-57 phase that never got its own spec: TASK-746 (predicate + vector) and TASK-747 (--for human routing) shipped; folding the standalone `human_only` marker into the human VIEW facts did not.

  FIX: enrich burndown::OpenFacts (or the handle_list_human classification step) with each spec's `human_only` marker and pass it to human_required instead of `false`, so a human-only spec surfaces in `aida list human` exactly as it does in the queue's human-only bucket. Add a regression test: a human-only Approved spec with a non-human bucket must appear in the human view. The predicate human_required(f, human_only) = bucket.needs_human() || human_only already supports this; only the view's call site hardcodes false.

  IMPACT: highest at onboarding — `aida list human` is the "what should I do?" front door, and it tells a new user "nothing needs you" while the High-priority scaffolding-commit task sits stranded.
