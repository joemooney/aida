    REVIEW FINDINGS TO ADDRESS (BUG-2653):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 29991da0af7d
    Recorded: 2026-11-19T18:52:05.354929883+00:00
    Findings:
    1. F1 [severity=p2; blocking_tier=untested-path; class=test-gap; file=aida-cli-lib/src/gate/seat_authority.rs; line=2621] Add negative coverage for a typed child-grant refusal whose cause is not expiry. ChildGrantRefused::is_parent_expired is exercised only through the new supervisor test, and its negative case corrupts agents.toml, returning before child-grant issuance. Consequently neither a non-expiry LaunchParentRefused nor another non-expiry ChildGrantRefused reaches the new predicate in a test. Source-level mutation analysis: replacing the expiry predicate with ChildGrantRefused::is_in would preserve both new test outcomes, yet a revoked parent would repeatedly fail issuance and immediately pass the relaunch gate, causing an endless retry loop instead of returning the refusal. This mutation analysis was not executed, per the no-local-tests review policy. Extend the supervisor regression with a revoked parent (or another non-expiry typed refusal), assert that the original refusal returns without retry, and bound the scenario so a regression cannot hang the suite; direct predicate tests can additionally cover nested Parent expiry and non-expiry causes. This is an ADR-76 blocking test gap in authority code, not a claim that the current predicate itself accepts revocation. No dependency on base changes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
