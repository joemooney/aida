title: 'Relay retry arm: scope run_rotating_agent''s hold retry to the expiry refusal and add its regression (BUG-2585 follow-up)'
description: |
  Follow-up to BUG-2585 (PR #4057, round 3 at 695c545). The reviewer approved with two minor findings deferred:

  1. Retry arm scope in run_rotating_agent (aida-cli-lib/src/agent_launch.rs). When a generation after the first fails, the relay goes back to the hold whenever relay_grant_held() is true. That check does not confirm the failure was the child-grant issuance refusal. Some other launch error that happens while the relay grant is expired would be retried through the hold instead of surfacing. Narrow the arm to the expiry refusal (match the issuance error, or check that it carries the expired-grant cause) so unrelated launch errors still end the relay.

  2. Missing regression for that branch. No test drives run_rotating_agent's `Err(..) if generation > 1 && relay_grant_held(..)` arm. Add a supervisor-level test, with an injectable generation runner or seam, showing that an issuance refusal caused by grant expiry re-enters the hold and relaunches the same generation once a renewed grant is valid, and that a non-expiry error still returns Err.

  ## Acceptance
  - The retry arm in run_rotating_agent fires only for a child-grant refusal caused by an expired relay grant. Other generation-launch errors propagate unchanged.
  - A regression covers the arm both ways: an expiry refusal holds, then relaunches the same generation; an unrelated error ends the relay.
