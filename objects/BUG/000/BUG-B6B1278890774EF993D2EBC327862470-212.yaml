  content: 'ADVISOR RULING (2026-11-04 20:20), applying the operator''s STORY-2460 principle: a vendor''s native sandbox earns a posture by passing the conformance suite, and AIDA''s shared boundary is the fallback. Do NOT build a Codex-specific production boundary, proxy or broker. Unlike C3/C4, C2 is NOT Codex-specific. contained_store_write_paths grants the whole .aida-store and cache-db to every contained vendor, AIDA''s own wrapper included. The fix is the host-owned, synchronous, typed AIDA mutation service you sketch (in-session writes mediated; raw store and git object writes denied). That is a cross-vendor architecture keystone: re-scope this bug under STORY-2238. It needs a full sketch reviewed with the operator (execution_mode supervised/guided), not a drain lane. Keep current grants until the service exists.'
