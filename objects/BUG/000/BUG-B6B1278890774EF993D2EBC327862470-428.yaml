title: check-ci-fast ratchets refuse the cargo wrapper's diff skip, so a branch identical to main cannot pass
description: |
  `make check-ci-fast` fails on a branch whose tree is identical to origin/main. This is the normal state of integration right after a promotion lands and main is merged back in.

  Repro (2026-11-17 11:35 MST, integration b4428c446e7, tree == origin/main c5159c7): check-ratchets runs `cargo test --profile agent -p aida-ci-guards --lib`. The cargo wrapper skips it with "cargo: no compile inputs changed; CI covers it (no changes vs origin/main). Skipped; pass --force-build to run anyway." The ratchets runner then refuses with "ratchets: refusing a successful command with no executed tests", and make exits 2 (Makefile:570).

  The two guards contradict each other: the wrapper's diff skip says the tests are covered, and the ratchets runner says zero tests means failure. Workaround: `AIDA_CARGO_FORCE_BUILD=1 make check-ci-fast`.

  ## Acceptance
  1. When the wrapper reports the diff skip ("no compile inputs changed"), the ratchets runner records the step as skipped (named in the output) instead of failing. A run with zero tests that was NOT a wrapper skip still fails.
  2. A test covers both cases: wrapper skip → pass with a skip line; real zero-test run → refusal.
  3. `make check-ci-fast` exits 0 on a clean branch whose tree equals origin/main, with no env override.
