- id: 01a1d650-743c-7213-b2f2-b6efea1a1b4d
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (BUG-2535):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 2fa6c4d25bab
    Recorded: 2026-11-13T09:33:15.584216514+00:00
    Findings:
    1. [P2] aida-cli-lib/src/pr_cmd.rs:4774 — The timeout branch performs an unbounded child.wait() after SIGKILL. If the sweep is stuck in uninterruptible filesystem I/O, SIGKILL remains pending and this wait can block indefinitely, so attended ship still has no wall-clock ceiling. Bound the caller's termination wait and retain cleanup-lock ownership in a separate reaper until termination is confirmed; test the timeout/termination-wait path.
    2. [P2] aida-cli-lib/src/pr_cmd.rs:50-52 — The new callable `aida pr post-ship-sweep` entry invokes destructive reap/prune directly, without acquiring or validating ownership of post-ship-cleanup.lock and without the supervisor. Hiding a Clap command does not prevent invocation: it can run concurrently with an ordinary cleanup worker, bypassing the serialization invariant. Require a verified parent-held lock handoff or otherwise refuse unsupervised/direct entry, and add a concurrent/direct-entry regression.
    3. [P2] aida-cli-lib/src/pr_cmd_args.rs:22 — Adding PostShipSweep changes the hidden-inclusive command/help catalog, but src/tests/golden/cli_help_snapshot.txt was not regenerated. Exact-head CI fails help_surface_matches_golden_snapshot with `aida pr post-ship-sweep` at line 16295. Regenerate, inspect and commit the golden snapshot, then rerun `cargo test --profile agent -p aida-cli-lib help_surface_matches_golden_snapshot`.
    4. [P2] aida-cli-lib/src/pr_cmd_args.rs:22 — docs/internal/cli-format-json-audit.md omits `aida pr post-ship-sweep`. Exact-head CI's catalog set differs from the audit by exactly this command, failing both checked_in_audit_catalog_matches_without_store_setup and checked_in_audit_is_exhaustive_and_every_honoured_probe_parses. Add its actual JSON-contract classification and rerun `cargo test --profile agent -p aida-cli --test bug_1502_format_json_audit`.
    5. [P2] BUG-2535 (bug protocol): missing — The injected machine-checkable protocol requires the PR to touch at least one test file. The diff touches only pr_cmd.rs, pr_cmd_args.rs and the lifecycle manual; inline test additions do not meet that file-level requirement. Move/add the BUG-2535 regression coverage to a test file (for example src/tests/bug_2535_tests.rs) and include it from the module.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
