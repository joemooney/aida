title: aida pr ship hangs for 20+ minutes in step 6 'inspecting seat clone' after a successful merge
description: '2026-11-12 03:49-04:12 MST: ''aida pr ship 3860'' (deputy job 01a1cf5f) merged PR-3860 at 03:49, then sat in step 6 (prune verified merged agent worktrees, ''up to 60s'') on ''inspecting seat clone .../aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-213 (bounded scan)'' for over 20 minutes, holding the serial deputy queue so the next train could not start. Cancelled by the advisor. Expected: the 60s budget is enforced across the whole step, including each seat-clone scan.'
