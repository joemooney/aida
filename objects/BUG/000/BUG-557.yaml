title: aida mailbox send --in-reply-to is accepted but doesn't thread the reply (opens a new thread)
description: 'Found live (mailbox demo 2026-06-14): ''aida mailbox send --to joe --in-reply-to <orig-id> ...'' is ACCEPTED (no error) but the reply opens a NEW thread instead of attaching under <orig-id>. ''aida mailbox thread <orig-id>'' shows only the original message (count 1); the reply (f1173ad2) is in its own thread. Expected: --in-reply-to attaches the reply to the original''s thread so ''aida mailbox thread <id>'' shows the full exchange. Repro: send A→B msg M; B replies with --in-reply-to M; ''aida mailbox thread M'' should show 2 messages but shows 1. Distinct from BUG-555 (unread/seen/re-deliver) — this is threading specifically.'
