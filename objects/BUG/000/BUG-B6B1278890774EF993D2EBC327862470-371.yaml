title: 'Early lane terminal results omit the ''retained: dirty'' seat-retention notice'
description: |
  From the #4126 (BUG-2606) review at faeee65, finding 2, ruled non-blocking by the advisor 2026-11-15 18:10: early lane result paths (refused-before-start, empty-rework and similar terminal results) print no 'retained: dirty' notice when a dirty seat is kept, so the operator cannot tell that the seat holds work. Add the notice to every terminal result path that keeps a seat.

  ## Acceptance
  1. Every lane terminal-result path that keeps a dirty seat clone (including refused-before-start, empty-rework, and punt) prints the same `retained: dirty` notice, naming the retained seat path, that the normal completion path prints.
  2. Result paths that do not keep a seat, or keep a clean one, print no such notice.
  3. A test per early terminal path asserts the notice is present when the seat is dirty and absent when it is clean.
