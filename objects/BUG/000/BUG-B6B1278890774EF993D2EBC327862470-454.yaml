    REVIEW FINDINGS TO ADDRESS (BUG-2690):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 3cce16690025
    Recorded: 2026-11-19T10:05:44.098418237+00:00
    Findings:
    1. Add behavioral coverage through the real branch-update path before enabling this new remote head mutation. In aida-cli-lib/src/land_run.rs:1022-1051, Live::update_ci_base performs the origin-identity, live-lease and hold checks, then forge.rs:2307-2331 performs the live PR validation, head-protection check and PUT. The new story_2768_land_run_tests.rs test substitutes Fake::update_ci_base, and forge.rs:2361 tests only validate_landing_update_target. Thus removing the live-lease refusal, the repository-identity refusal, the call to pr_head_guard::check, or the expected_head_sha wiring would not fail the added tests. Existing isolated head-guard tests do not verify this new caller invokes that guard. Add a fake-forge/gh positive control exercising the actual update path and asserting the exact repository-bound PUT with expected_head_sha, plus negative controls proving no PUT for an occupied or unreadable lease set, changed repository, local/live hold, moved PR head/target, and an approved/train-protected head. Exercise the real boundary rather than replacing update_ci_base with an unconditional fake. This is an ADR-76 blocking test gap in authority/lease gate code. It is present in the reviewed head and landed tree and does not depend on newer base changes.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
