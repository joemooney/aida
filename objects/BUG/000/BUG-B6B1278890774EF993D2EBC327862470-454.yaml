title: 'Landing readiness trusts CI from a stale GitHub merge ref: after a revert, refs/pull/N/merge stayed on the reverted base (873caef), so full CI kept failing on code no longer on main'
description: 'Observed 2026-11-18 11:05 MST. After #4261 reverted #4260 (main 873caef -> d37c127), refs/pull/4259/merge and refs/pull/4137/merge stayed on 873caef. A close/reopen and mergeability queries did not refresh them, while newer PRs'' refs moved to d37c127. Every full-tier run on #4259 therefore reran the reverted #4260 failures (task_1915 / story_1917). Fix: land status and the lander compare the CI run''s merge-base parent with the current base tip; when they differ, report STALE-CI-BASE (not CI-FAILED) and remedy with update-branch, since an approval carries over a clean main merge. Regression: a PR whose merge-ref parent is not the base tip is never READY on that run''s result.'
