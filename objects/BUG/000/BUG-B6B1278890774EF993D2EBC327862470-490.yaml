title: Review-watch approvals do not request full-tier CI (no ci:full label), unlike manual review record
description: |
  Found 2026-11-23 (advisor-122; filed by product-15). Reviewer APPROVALS recorded by review-watch (e.g. #4417 TASK-3839, #4421 TASK-3228) leave the PR with NO ci:full label, though the train's refusal text says "approving the head … starts one". Manual `aida review record` approvals DO request full-tier CI. So review-watch approvals stall at "no full-tier CI run at <head>" until someone labels by hand.

  ## Acceptance
  - AC1: An approval recorded through review-watch requests full-tier CI exactly as a manual `aida review record` approval does: ci:full is applied, or the full workflow is triggered, after any in-flight FAST run finishes, so no FAST run is cancelled (avoiding the BUG-2723 ghost red).
  - AC2: A regression test: a review-watch approval of a head without ci:full results in a full-tier request.
