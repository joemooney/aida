- id: 019f405c-26ec-7240-9e5f-4a4c2cdae0d9
  author: joe
  content: 'Triaged 2026-07-08 during the stabilization sweep. Investigated: the MAIN drain paths already handle drop-before-process::exit correctly — the burndown / queue-work handler returns Ok(()) on success (guard drops on scope exit) and explicitly drop(_drain_guard) before std::process::exit on the non-zero path (main.rs ~94917); the integrate path likewise drop(_drain_guard) before process::exit(2) (~141496). The residual leak is a subtle edge: a guard held in an OUTER scope while a never-returning handler (e.g. handle_drain_resume, STORY-492) calls std::process::exit, which skips the outer Drop. Impact is near-zero and SELF-HEALING: acquire_drain_lock probes pid-liveness and reclaims a dead-pid lock on the next drive, so nothing is blocked. RECOMMENDATION: leave LOW/deferred — a proper fix threads the guard into the process::exit-ing handlers (or an atexit-style unlink) in the keystone lock machinery, which is disproportionate risk for a cosmetic, self-healing leftover. Revisit if a non-self-healing symptom ever appears (e.g. a stale lock a liveness check fails to reclaim).'
