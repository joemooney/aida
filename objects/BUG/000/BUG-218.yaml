spec_id: BUG-218
agreed_id: BUG-218
title: 'aida queue work --auto-complete: recovery hint says ''CI is red'' even when the failure was a spawn error (not CI)'
description: |-
  When \`aida queue work --auto-complete\` fails at phase 2 due to a spawn error (ENOENT, BUG-NEW for the actual bug), the recovery hint reads:

  \`\`\`
  ✗ phase 2 (end + wait for CI) failed: could not run \`aida session end\`: No such file or directory (os error 2)
    → CI is red — investigate with \`gh run list --branch task-267\`, then push fixups: \`aida queue work TASK-267 --branch task-267 --steal\`
  \`\`\`

  **\"CI is red\"** is wrong — CI was actually GREEN (visible in the same output: \`Run CI (25972330958) completed with 'success'\`). The failure was a spawn ENOENT in the orchestrator's invocation of \`aida session end\`, not a CI failure. The hint mis-routes the user toward investigating GitHub Actions when the actual problem is local subprocess plumbing.

  ## Acceptance

  - [ ] Each phase failure surfaces an accurate, context-specific recovery hint (not a one-size-fits-all message)
  - [ ] If the orchestrator's subprocess invocation fails with ENOENT/EACCES/etc., the hint says: *\"Subprocess spawn failed: <error>. Check that \`aida\` is on PATH; the orchestrator inherits the parent shell's PATH but may have lost it. Workaround: run \`aida session end <id> --wait-ci\` manually.\"*
  - [ ] If CI is actually red, the hint says: *\"CI failed on run <ID>. View: gh run view <ID>. Push fixups to the same branch.\"*
  - [ ] Test: each phase's failure modes produce its own specific hint, with at least 3 distinguishable patterns per phase

  ## Composes with

  - **BUG-NEW** (orchestrator phase-2 ENOENT) — sibling bug; both surface in same incident
  - **batch:workflow-hint-polish** — same family as TASK-268 (strip SPEC citations from hints), TASK-267 (hint completeness)
  - **TASK-266** (orchestrator failure telemetry) — failure patterns logged here help refine which hints are needed
  - **feedback_workflow-hint-polish memory** — surface signal-not-noise discipline

  ## Why this matters

  A wrong recovery hint is worse than no hint — it sends the user investigating the wrong layer. First-users seeing \"CI is red\" when CI was green will (a) waste time on GitHub Actions, (b) develop AIDA mistrust because the message contradicts evidence above it, (c) miss the actual bug to file.

  ## Origin

  User observed 2026-05-16 after \`--auto-complete\` failed at phase 2: the message claimed CI red, but the SAME output above it showed CI completed with 'success'. Caught the misleading hint immediately.
