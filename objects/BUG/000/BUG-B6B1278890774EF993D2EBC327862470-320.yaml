title: Work dispenser file is re-created group-writable under umask 002, then every ID allocation refuses as 'unsafe WORK allocation state'
description: 'Observed on dell1 2026-11-13 01:28 and 01:57 (advisor): .git/aida-work-dispenser.toml came back at mode 0664 after a chmod go-w, because the dell1 shells run with umask 0002. Each time, aida add and the auto-queue review story fail with ''requirement ID allocation failed: unsafe WORK allocation state ... group- or other-writable (mode 0664)''. Acceptance: (1) the writer creates and replaces the dispenser with an explicit 0600/0644 mode regardless of umask (write to a temp file, fchmod, then rename); (2) a regression under umask 0002 shows the file stays non-group-writable across allocations; (3) the existing refusal stays for a file someone else made writable.'
