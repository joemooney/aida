title: CI 'sudo apt-get update' can hang until the 40-minute job timeout, cancelling every PR's CI
description: 'Observed 2026-11-11 14:59-15:39 UTC: every CI shard on PRs #3824 and #3844 sat in ''sudo apt-get update'' for 40 minutes and was killed by timeout-minutes: 40 (.github/workflows/ci.yml:43), so flow and train saw red CI and nothing landed. Fix: bound the apt step (timeout 180, -o Acquire::Retries=3 -o Acquire::http::Timeout=30), retry once, and skip apt when the packages are already on the runner image. Acceptance: a stalled mirror fails or skips the step within 5 minutes instead of consuming the job timeout.'
status: NeedsAttention
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-11T15:56:46.138811998Z
modified_at: 2026-11-11T16:58:11.881275717Z
req_type: Bug
comments:
- id: 01a1cb77-3d00-7202-a118-8aee5a8beb52
  author: joe
  content: '2026-11-11 16:40Z advisor diagnosis: the hang is DNS on GitHub-hosted runners. Job logs show ''Temporary failure resolving azure.archive.ubuntu.com / archive.ubuntu.com / security.ubuntu.com''; each amd64v3 .deb takes ~60s (3 mirrors x 20s) before Err, so 105-package installs exceed timeout-minutes 40. packages.microsoft.com resolves fine. Still ongoing at 16:35Z (run 43042217891 jobs stuck in ''Install Linux dependencies'' since 16:01). Mitigations: (1) repo var AIDA_DELL1_CI=true routes lib/cli shards to the dell1 self-hosted runner, which skips apt (it is unset now); (2) the fix should bound apt (timeout + Acquire::*::Timeout=10, Retries=1) so a mirror outage fails in minutes, and route contracts/gates/rest to dell1 under the same var.'
