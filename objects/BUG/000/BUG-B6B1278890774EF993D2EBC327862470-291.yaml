title: CI 'sudo apt-get update' can hang until the 40-minute job timeout, cancelling every PR's CI
description: 'Observed 2026-11-11 14:59-15:39 UTC: every CI shard on PRs #3824 and #3844 sat in ''sudo apt-get update'' for 40 minutes and was killed by timeout-minutes: 40 (.github/workflows/ci.yml:43), so flow and train saw red CI and nothing landed. Fix: bound the apt step (timeout 180, -o Acquire::Retries=3 -o Acquire::http::Timeout=30), retry once, and skip apt when the packages are already on the runner image. Acceptance: a stalled mirror fails or skips the step within 5 minutes instead of consuming the job timeout.'
