- id: 01a1f074-a815-7812-8f84-60eb530a7e26
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: db7663a273

    Acceptance evidence (one regression per item; spec has no ## Acceptance section):
    1. push_commands: notify::tests::bug2689_alert_uses_push_commands_without_notify_command and bug2689_alert_fans_out_to_notify_and_push_channels_once. check() now gates on notify::alert_transport_configured and sends through notify::send_alert_all_channels.
    2. Rerun recovery: ci_startup_monitor::tests::bug2689_rerun_success_of_alerted_run_recovers. If the alerted run itself now succeeds, it is inside the recovery boundary. A run's status describes its latest attempt, so no separate attempt field is needed.
    3. Fresh-state job mapping: bug2689_maps_jobs_from_older_runs_when_first_page_never_started. Runs only on fresh state, reads at most pages 2..10, and keeps the cached mapping afterwards. The existing story2856_ac1_queued_and_mixed fixture gained a terminal empty page 2 (its assertion is unchanged).
    4. PR pagination: bug2689_paginates_open_prs_past_100. Reads up to 10 pages, deduplicates PRs that shift between pages, and still errors when truncated past 1000.
    Validation: targeted cargo test -p aida-cli-lib --lib ci_startup_monitor notify:: passed 35/35 through the lane runner. make check-ci-fast exit 0 through the lane runner.

    Probe findings / fixes: the structural-ratchet guard flagged the 'inventor' marker in a test name, so the test was renamed. Partial delivery returns Ok(true) and logs failures to notify.log, so a retry does not repeat on channels that already delivered. A push command identical to [notify].command runs once.

    Residual risks: (a) a workflow with no started run in 1000 runs and no cache re-reads up to 9 older pages each pass (bounded by the 40s budget). (b) A PR closing mid-pagination can be skipped by one pass; the count is advisory. (c) Push channels bypass quiet hours, matching seat-health alerts. (d) A malformed seat_health.push_commands now errors the monitor check, as it already errors seat-health.
