title: 'CI startup monitor (STORY-2856) follow-ups: honor seat_health.push_commands, rerun recovery, fresh-state job discovery, >100 open PRs'
description: 'Deferred from PR #4180 round 4 (12ff814) under the 4-round cap (advisor ruling 2026-11-18 11:00). Fail-safe today: the monitor stays silent, it never sends a wrong alert. (1) FIRST: check()/delivery only use notify.command; also honor seat_health.push_commands (notify.rs:346-397). This repo configures only push_commands, so it gets no startup alerts until this is fixed (ci_startup_monitor.rs:562-570,622-633). (2) Recovery when the alerted run is rerun successfully under the same run ID: track the attempt, not just the ID (199-212). (3) Map required contexts when no started run is in the 100-run window: fetch older runs, or the workflow definition (396-431). (4) Paginate the open-PR inventory instead of erroring at 100 (295-301). One regression per item.'
