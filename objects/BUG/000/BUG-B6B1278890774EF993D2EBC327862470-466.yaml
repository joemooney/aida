    # Brief: BUG-2704 (fresh start; advisor-121 01:16: APPROVED, drain, HIGH, Claude, STRICT)

    Mandate cover refuses promotion 23 (#4324) because a historical store version of STORY-2642 (store commit 7124c0f, 2026-11-07, a contained reviewer session) contains committed git conflict markers (<<<<<<< Updated upstream ... ======= ... >>>>>>> Stashed changes). The history reader can't parse it, so the spec is treated as excluded (fail-closed, correct as far as it goes).
    Implement the acceptance criteria in the spec description:
    (1) The store history reader recognizes a conflict-marked version and evaluates BOTH sides. The spec counts as excluded if EITHER side is excluded; it is never silently dropped and never silently included. It stays fail-closed for anything still unparseable.
    (2) A store-writer guard refuses to commit a spec file containing git conflict markers (pre-commit check in the store write path), with a clear error.
    Regressions: a fixture store whose history contains the 7124c0f-shaped conflict version, checked through the mandate ship-cover entry point (mandate_ship_cover_for_ship) with real fixture commits; plus the writer guard refusing a conflicted write.
