title: worktree .git file breaks git inside dev containers — gitdir points at a host path the container cannot see
description: 'Field report (2026-09-09): commands run through a project''s container wrapper from an AIDA worktree fail with fatal: not a git repository: .../.git/worktrees/<name> — the worktree''s .git FILE references the main checkout''s metadata path, which is not mounted at the same location in the container, so rev-parse, revision capture, hooks and repo discovery fail or silently omit metadata. Bounded slice: DETECT and WARN — at worktree creation (and in aida doctor), if the repo contains container tooling markers (Dockerfile, docker/, devcontainer.json, compose files), print a one-time note that git worktrees need the shared git dir mounted (naming the gitdir path that must be visible) and document the worktree-safe mount pattern in docs. Full fix (relative gitdir via git worktree repair or GIT_DIR env injection guidance) evaluated in the same change if cheap. Acceptance: worktree creation in a repo with container markers prints the portability note with the exact gitdir path; doctor reports it as a category; docs section added.'
