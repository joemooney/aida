title: 'CI startup monitor hardening (follow-up from #4266): keep per-channel recovery retries on partial delivery; checkpoint paginated discovery across the observation budget'
description: 'Deferred from PR #4266 (BUG-2689) round 1 at db7663a under the 09:18 blocking tier. Both are fail-safe (silent, never a false alert). (1) notify.rs:473-480 / Episode::deliver: send_alert_all_channels returns Ok(true) once ANY channel succeeds, and recovery then resets the episode, so retry state for a failed channel is lost. Track delivery per channel. (2) ci_startup_monitor.rs:315-343, 449-465: PR-inventory and older-run mapping pages live in local vectors; BudgetExhausted discards them and the next pass restarts at page 1, so very large repos can stay silent. Checkpoint the page cursors in monitor state. One regression each.'
