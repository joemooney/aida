title: /aida-pickup slash command + canonical role-enter form missing in skill body
description: |-
  Commit 835431b added the aida-pickup skill file and aida queue next/done CLI but missed the matching commands/aida-pickup.md, so fresh Claude sessions could not invoke /aida-pickup. Same skill body recommended the install-gated 'aida-role <name>' shell helper instead of the canonical 'aida role enter <name>' form, which only works after 'aida dev shell-init --install'.

  Fix:
  - Added aida-core/templates/commands/aida-pickup.md and symlinked into .claude/commands/
  - Rewrote 4 references in aida-core/templates/skills/aida-pickup.md to use 'aida role enter <name>' (or eval form) and added a 'Shell helper (for developers)' section explaining the nuance
  - Updated empty-queue hint in aida-cli/src/main.rs:9436 to use 'aida role enter dialog'

  trace:via skill+command files; no Rust trace comment needed.
