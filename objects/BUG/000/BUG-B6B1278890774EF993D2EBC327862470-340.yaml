- id: 01a1da60-1b7b-7721-97f1-98a78171f691
  author: dirtlab
  content: |-
    [implementer lane 01a1da5c577c, 07:00] No code change this round; cause still not named.

    This seat can only run cargo through the lane job runner (bubblewrap, own PID namespace), where the test passes (j20261114T131434893-4-0). It has no host shell and no ssh, so the advisor's next step (capture the refusal over ssh) cannot be done from here.

    Ruled out by reading at 34ea340670:
    - Host HOME state: test_home.rs redirects HOME to a per-process temp dir before main, clears AIDA_HOME, AIDA_TEST_HOME, XDG_{CONFIG,DATA,CACHE,STATE}_HOME and every AIDA_SESSION_* variable, and writes its own .gitconfig (gpgsign off). So ~/.aida, the real gitconfig and the operator session identity do not reach the test.
    - Project root and authority TTY: pinned to the temp dir by AmbientGuard (find_project_root, stdin/stdout/stderr terminal answers).
    - Seat authority: the PR-4021 asserts pass on dell1 (advisor run).
    - State keyed on the fixture id: nothing under ~/.aida, ~/.cache/aida or the primary checkout's .aida names BUG-9112 apart from this bug's own logs.

    What can still leak: AIDA_* variables other than AIDA_SESSION_* (the constructor leaves them), PATH-resolved gh/git, the host process table (/proc), cwd and TMPDIR.

    The loop hides the reason in two ways, and both end up in the test's captured stdout, which cargo prints for a failing test without --nocapture:
    - handle_queue_rework returned Err: a line starting `error:` (rework.rs:503).
    - the preview was not offerable, so `r` was not a key: a line `unknown key `r`` and no `[r] requeue` in the prompt (rework.rs:523).

    Needed from one dell1 ssh run of PR-4021 head: the full stdout block of the failing test, the output of `env | grep ^AIDA_` from the same ssh command, and whether rework_reason_is_recorded_once and triage_loop_d_decides pass in that run.
