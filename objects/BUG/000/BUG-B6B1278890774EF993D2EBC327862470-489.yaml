title: build_git_stamp marks a build +dirty on UNTRACKED files, which silently disables mail-retention re-recording (5 days on dell1 from one stray DU.txt)
description: |
  Found 2026-11-23 (product-15; advisor-122 asked for it). aida-cli-lib/build_git_stamp.rs:22-32 marks a build dirty when `git --no-optional-locks status --porcelain` prints anything, and porcelain INCLUDES untracked files. On dell1, one stray untracked DU.txt in the primary checkout (a du listing left by the 2026-11-18 disk-freeing session) made every dell1 build "+dirty" for 5 days. A dirty build silently skips mail-retention re-recording ("the new build names no exact source (it was built from uncommitted changes)"), so ending sessions whose mailbox held mail was refused all along. That was a likely root cause of many "mail must be retained" refusals and hand salvages.

  ## Acceptance
  - AC1: The build stamp's dirty flag reflects TRACKED modifications only (`git status --porcelain --untracked-files=no`), with a test: an untracked file alone yields a clean stamp, and a modified tracked file yields dirty.
  - AC2: When a build is dirty, `aida dev status` (or the promote output) names the dirty paths, so the cause is visible without hunting.
