description: 'Found completing the codex testbed validation (2026-09-06): aida queue work PR-3 --role reviewer --no-human refused with spec TASK-4 is Done — work already shipped, refusing to start a new session. A Done spec with an open PR is THE normal review state — the refusal is implementer-shaped preflight applied to a reviewer-scoped launch. Same disease the PR-1679 review found in the guided path (fixed there via specless launch); the generic PR/reviewer launch path needs the equivalent: role reviewer (or PR scope) skips the shipped-work preflight and takes a review-shaped lease that never flips spec status. Acceptance: queue work PR-N --role reviewer on a Done-backed open PR launches the reviewer; the spec status and implementer leases are untouched; regression test beside the guided-launch tests.'
