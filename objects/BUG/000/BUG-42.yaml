title: aida status flags seed-category files (CLAUDE.md, AGENTS.md) as STALE on every project
description: EPIC-15 categorizes CLAUDE.md and AGENTS.md as 'seed' — scaffolded once, then user-owned. Drift is *expected* and shouldn't show up in `aida status` as a problem. Currently every project after the first edit reports STALE because of seed files. Status should either (a) skip seed files entirely, or (b) report them in a separate 'customizations' bucket distinct from real drift. Surfaced 2026-05-09 walkthrough on a fresh tzconv project.
