title: A --no-launch implementer claim blocks headless review of its own PR (holder records no witness), and session end lists nothing it refuses for
description: |
  A `aida queue work SPEC --no-launch` claim blocks every review of that spec's PR, and nothing clears it automatically.

  Observed 2026-11-17 22:36 to 2026-11-18 00:14 MST, PR #4251 (STORY-2897):
  - The integration seat claimed STORY-2897 with `--no-launch --base integration --over-wip`, which made lease 01a1ec918925 on the seat branch. It then pushed the branch and opened #4251.
  - Two headless review launches (`queue work PR-4251 --role reviewer --no-human`) refused at checkout. Each printed "lease 01a1ec918925 ... blocks PR-4251's review and its session has exited — ending it", then failed with "ownership retained: the holder records no witness".
  - `aida session end 01a1ec918925 --yes` first refused with "seat clone holds work origin does not have:", followed by an EMPTY list. The only thing it could have meant was an untracked test-litter dir, aida-cli-lib/.aida/agents (written by tests run from aida-cli-lib/). The next attempt took more than 120s.
  - Only a third `session end --yes` with a 900s timeout cleared it.

  ## Acceptance
  1. A `--no-launch` claim records a witness, so a reviewer launch can end it once its branch is pushed and clean. Alternatively, the reviewer's checkout does not need the implementer's branch lease at all.
  2. The "holds work origin does not have" refusal always lists what it found. An untracked path that matches the test-litter rules is named as litter and does not block.
  3. A regression covers: a --no-launch claim, then the branch is pushed, then a headless review of the PR checks out without a manual `session end`.
