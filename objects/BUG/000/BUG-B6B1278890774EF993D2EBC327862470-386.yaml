title: Auto-train controller holds the train run.lock across idle/failed passes, blocking operator trains and --abandon
description: |
  Observed 2026-11-15 21:45-21:55 MST after the 21:15 machine crash.

  The supervised auto-train controller (`aida advisor loops train-worker`, pid 3742222, under the native `deputy shell run` default) holds `.aida/train/run.lock` (flock W, fd 3) continuously, across passes. Each of its passes fails: it cannot land supervised specs (#4133 TASK-3805, #4134 BUG-2616: "mandate does not cover ... no typed merge-hold marker") and it ends with `review-watch lock busy: admission.lock`. Meanwhile any operator or deputy `aida pr train 4133 4134`, and even `aida pr train --abandon <journal>`, is refused with "another train owns the train journal; retry when it exits", and the controller never exits. `aida deputy shell pause --name default` does not release the lock.

  Net effect: an auto-train that cannot land anything blocks the human-at-terminal train path, which is the only path supervised PRs have. Train #4140 (green CI) stayed stranded.

  Expected:
  1. The controller takes run.lock only for the duration of an actual train run, not across idle or failed gating passes.
  2. `--abandon` of a journal whose train PR is CLOSED works while an idle controller is alive.
  3. `aida pr train --status` names the holder ("held by the auto-train controller pid N") instead of "a live driver whose PID is not visible".
