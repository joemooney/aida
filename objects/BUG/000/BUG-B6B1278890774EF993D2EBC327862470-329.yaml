    Incident 1. Head e34091b, deputy 3 job 20261117T064413-3bd98a. Launched 06:51:42 MST, done 07:05:51 MST.
    - Completion error: "the reviewer for PR-4218 exited without recording a verifiable verdict (the reviewer wrote no verdict file after it started, and recorded none on the ledger); nothing was collected into .aida/review-verdicts/PR-4218.json. Treat this as no approval and re-run the review."
