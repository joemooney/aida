    - Re-run (deputy 3 job 20261117T071239-6e663d, 07:12-07:27 MST) recorded APPROVED at e34091b (ledger PR-4218.jsonl#7).

    Incident 2. Head 46e967b, deputy 2 job 20261117T093605-7f90ea. Launched 10:02:57 MST, done 10:17:29 MST.
    - The reviewer's final message said "I'm recording APPROVED at 46e967b122e7". It ran `aida review record BUG-2647 --pr 4218 --verdict approved --sha 46e967b122e7def16ea59dc7097df8119856aa9e --summary ...`.
