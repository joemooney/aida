title: Cache refresh hard-fails every aida write when the recorded store head was rebased away (2 s ancestry budget, BUG-2589 regression)
description: 'Problem: after #4085 (BUG-2589, 80fefce) the cache refresh in aida-core/src/db/cached_git_backend.rs (~line 717) and db/cache.rs (~line 639) runs is_ancestor_with_timeout with a 2 s budget and propagates a timeout as an error. When the cache''s recorded source_head_sha is a local store commit that a later ''aida pull --store-only'' rebased away (here 5fd8c66 ''chore: sync pending changes'', 4 minutes old), git must walk the whole orphan store history to prove non-ancestry: 3.9 s on the primary at load ~5. Every aida write (comment add, push) then fails at once with ''git merge-base --is-ancestor timed out'' until a manual ''aida cache rebuild'' (43 s). Observed 2026-11-15 11:18-11:24 MST on the primary at 0dacba5; the previous binary c330294 behaves the same. Acceptance: 1. A recorded head that is not reachable (or whose ancestry check times out) leads to a full rebuild or a bounded fallback, never a hard error on a write path. 2. A cheap pre-check (e.g. ''git cat-file -e'' plus a reflog or reachability shortcut, or a recorded-head validity check after a store rebase) avoids the full-history walk in the rebased case. 3. A regression test: rebase the recorded head away, then ''aida comment add'' succeeds without a manual rebuild.'
