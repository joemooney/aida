title: 'Train journal recovery drops human-at-TTY consent: recovery LiveTrainForge uses named:false, so a resumed deputy-TTY train ejects named supervised PRs'
description: 'Observed 2026-11-13 04:29 MST: deputy-TTY ''aida pr train 3917 3928'' resumed train #3941 after a SIGPIPE kill (first attempt had gated both PRs ready). CI went green 03:57; recovery''s final gate ejected both as ''needs a human at a terminal or an active mandate'' and fell through to the mandate, which refused (gate/ path; no merge-hold marker). Cause: pr_train.rs ~4147 builds the recovery LiveTrainForge with named:false, and tty_consents(interactive_tty, named) then denies consent even though the PRs were named on the command line (BUG-2547 already scopes recovery to requested PRs). Fix: named: prs_named_on_command_line(opts) for the recovery ports, plus a test that a recovered named member keeps TTY consent. Cost: a 30 min green train and ~35 min of merge wait.'
