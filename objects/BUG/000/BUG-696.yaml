- id: 019f214e-8e66-7671-91b8-cb7d73416c02
  author: joe
  content: 'CORRECTION after reading the healer: heal_doctor_orphan_worktree calls salvage_worktree_patch BEFORE teardown, and salvage captures tracked changes (git diff --binary HEAD + --cached). So safe_heal=true does NOT lose committed or tracked-uncommitted work — my original "could destroy uncommitted work" was overstated. The REAL, narrower bug: salvage_worktree_patch records untracked filenames only as # comments, NOT their content, so untracked files (new, un-git-added) in an orphan-worktree ARE lost when --heal removes it. Fix scope narrows to: make salvage_worktree_patch append untracked file CONTENT (git diff --no-index --binary /dev/null <file>) so the salvage patch fully reconstructs the worktree. Downgrading from data-loss-of-all-uncommitted to data-loss-of-untracked-only.'
