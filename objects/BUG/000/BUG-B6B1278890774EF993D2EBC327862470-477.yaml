title: 'Store mutation broker accepts a negative sender pidfd: refuse before dispatch, close only valid fds'
description: |
  The store mutation broker (store_mutation/service.py) accepts a negative sender pidfd from a request, can dispatch with it, and closes it without checking validity. A negative or invalid pidfd must be refused before dispatch, and only valid fds may be closed. This is a fail-open at an authority boundary. Source: the operator's work-side AIDA CI branch fixed this on 2026-11 (report reviewed by product-15, 2026-11-22). That branch is not reachable from this clone, so reproduce on main first; if main already behaves correctly, close with evidence.

  ## Acceptance
  - AC1: Requests carrying a negative sender pidfd (-1, -2 and INT_MIN-like values) are refused before any dispatch, with a clear error.
  - AC2: close() is called only on fds that were validly received. A test asserts no close on the refused values.
  - AC3: A valid pidfd request still dispatches (positive control).
