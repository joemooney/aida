title: /aida-onboard skill uses 'aida list --format summary' (doesn't exist) → falsely reports 'No AIDA database found'
description: 'Round 12 of the novice-first loop — the AI-assisted onboarding path. The /aida-onboard skill (a novice''s first AI session: ''onboard me'') runs ''aida list --format summary'' for its requirements overview — but that flag doesn''t exist, so it errors and the skill''s ''|| echo "No AIDA database found"'' fallback fires, FALSELY telling the user there''s no AIDA database when there is. It also sniffs for legacy ''requirements.db''/''requirements.yaml'' (deprecated centralized mode) instead of the distributed marker. Fix: use a real command (aida list) for the overview; detect distributed mode (.aida/config.toml + .aida-store). Verified: ''aida list --format summary'' → ''error: unexpected argument --format''.'
