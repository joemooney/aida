title: human review loses the spec's open PR once the lease is released — claims 'never pushed' despite trailered commit and open PR
description: 'Repro live (2026-09-06 18:17, STORY-818): with the implementing session''s lease HELD, aida human review STORY-818 correctly resolved ''Surface open PR-1679 on branch story-818''. After aida session end released the stale lease (branch kept, PR untouched), the same command resolved ''Surface built locally, never pushed (no commits reference this spec)'' — while origin/story-818 exists, commit a33d661e9 carries the (STORY-818) trailer in its subject, and PR #1679 is OPEN with green CI. The surface resolution is keying off the lease/worktree linkage; when it is gone the fallback commit/PR scan misses both the trailered branch commit and the open PR. Fix: resolution order forge-first — search open PRs whose head branch or commits reference the spec (gh pr list / branch-name convention), then local branch refs for the trailer, with the lease as an accelerator only; releasing a lease must never change the answer. Acceptance: fixture with a trailered commit on a pushed branch + open PR and NO lease resolves to the PR; lease-present and lease-absent runs produce identical surface lines; unit test on the resolution order.'
