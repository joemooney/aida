title: Promoting a new dev build leaves the aida-mail-wake systemd unit on the replaced binary, which blocks mail retention activation
description: |-
  Observed 2026-11-03: 'aida mailbox retention activate' refused because pid 3175634, '/home/joe/.local/share/aida/live/aida mailbox wake-run', was running a replaced binary. That process is the systemd user unit aida-mail-wake-<hash>.service; it was started at 23:15 and outlived the promote of 6c587ee595c. The operator could not tell from the dry-run output what the process was or how to restart it.

  Acceptance: (1) 'aida dev build' promote (and 'aida dev rollback') restarts every enabled aida-mail-wake-*.service user unit after swapping the live pair, and reports each restart. (2) When the retention dry run lists a mail writer running a replaced binary, it names the owning systemd unit if there is one and prints 'systemctl --user restart <unit>'.
