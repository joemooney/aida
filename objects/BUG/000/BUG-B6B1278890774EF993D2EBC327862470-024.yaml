    2026-10-29 23:40 evidence: reviewer launches for PR-3096, 3101, 3102 and 3103 each failed with 'could not end dead lease <id> holding <branch>'. The implementer worktrees (/home/joe/ai/aida-docs-round2-106, -111, -112, -113) had been deleted by hand, but their leases stayed. The launcher's auto-end then hit store index.lock contention (BUG-HOME-034) and aborted the whole review instead of retrying. Also: `aida session end <id>` with the truncated 9-char id that `aida session leases` prints is treated as a BRANCH name ('No lease found for branch 01a18a648'). Acceptance additions: (a) a lease whose worktree no longer exists is ended automatically, with no lock dependency on a dirty-tree check; (b) `session leases` prints ids that `session end` accepts.
