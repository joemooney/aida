title: Lane prompt and host pre-publish gate assume a Rust project with a Makefile
description: 'Reported from operator''s work machine (Codex, GitLab project hello-work-0x), 2026-11-09. On a four-file Python prototype the launch prompt still tells the seat to run cargo fmt, and the host''s pre-publish make check-ci-fast gate (#3627) assumes a Makefile target exists. Make both project-configured: the prompt names the project''s own format/test commands from config, and the host gate runs the configured fast-check command, or skips with a stated reason when none is configured. Test with a non-Rust fixture.'
