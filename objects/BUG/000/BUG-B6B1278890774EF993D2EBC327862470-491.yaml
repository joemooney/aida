      From BUG-2730 Reviewed sha: 08ee6da5263965a55c163aef2b8cb0a425781f6f Deferred follow-up (BUG-2730, test-gap): the discovery-cut regression bug_2730_discovery_deadline_keeps_listed_pages calls Repository::discover_with directly. No test drives a cut discovery through scan_with_budgets/observe, so nothing checks the 'changes past the discovery deadline unknown' partial line (land_stalls.rs observe), the metrics::record skip in land.rs live_pass_with (rows.len()==changes.len() && !discovery_cut), or that routing is deferred on a cut. The prior review asked for a regression through the guard. Add a GitLab guard fixture whose page 2 hangs.

    - TASK-3434: Review follow-up: Deferred follow-up (BUG-2730, p2): aida-cli-lib/src/land_stalls.rs scan_with_budgets (~:20
      From BUG-2730 Reviewed sha: 08ee6da5263965a55c163aef2b8cb0a425781f6f Deferred follow-up (BUG-2730, p2): aida-cli-lib/src/land_stalls.rs scan_with_budgets (~:2019-2039) still routes synchronously on a COMPLETE pass whenever more than 5s of the 220s run budget remain. route() -> raise_due -> schedule_ledger::write_local_bounded bounds only lock admission; write_cas_opts(push=false) then runs a git commit whose signer has no deadline, and mailbox_store::write_message is also a store write. The advisor's r4 F1 brief said the guard pass should not route at all. The margin before the 300s scheduler ceiling is at least 85s, and main already routed synchronously (and pushed), so this is pre-existing

    - TASK-3435: Review follow-up: Deferred follow-up (BUG-2730, p3): on GitHub, discover_rich -> forge::github_open_changes_
      From BUG-2730 Reviewed sha: 08ee6da5263965a55c163aef2b8cb0a425781f6f Deferred follow-up (BUG-2730, p3): on GitHub, discover_rich -> forge::github_open_changes_detailed uses remaining_call_budget and propagates its error with `?` from live_pass_with. If the listing itself outlives the scoped run deadline, the guard exits with an error. It does not report an empty PARTIAL inventory, which is the GitLab discover_with behaviour. This is unlikely, because discovery runs first under a 60s cap within the 220s budget. Fix: treat deadline exhaustion in the rich listing the same way as the GitLab path.
