  content: 'Returned from NeedsAttention to Approved via `aida edit --status`. It was punted on: design-fork: Integration p27 is standard-tier only. The guard starts its detail budget after live_pass_with finishes every PR. During that pass land.rs:1185 synchronously calls gate/approval.rs:295 (merge_approval_subject_observed -> pr_gate_subject) without a caller deadline. A timer between PRs or around red details cannot interrupt that forge lookup or preserve coverage before the scheduler kills the process. Passing deadlines through the existing approval evidence reader touches a strict gate path.. No triage reason was given.'
