    SCOPE (SMALL, <=300 lines): (1) AC2 FIRST: thread a caller deadline through that approval-evidence read (read-only lookup; NO change to any approval DECISION), so that at the deadline the guard reports PARTIAL results (PRs covered and PRs skipped) and exits normally instead of being killed. Add a slow-fake-forge test. (2) The per-PR budget if it fits. (3) AC1 per-phase timings: list in the PR body as a follow-up if it doesn't fit.
