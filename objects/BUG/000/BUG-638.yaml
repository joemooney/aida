title: 'TUI: verb palette must gate by ROLE — advisor-only verbs (approve) show + are selectable for an implementer'
description: 'Operator finding (2026-06-26): with the TUI role = implementer, the ''approve'' verb (whose own hint says ''advisor-only: draft -> approved'') still appears in the palette AND is selectable. The palette does not gate by role — an implementer should NOT be offered advisor-only verbs; they should request approval and let the advisor approve. This is the ''role as ambient context'' piece (Slice 3 of the redesign design doc): role should FILTER/GATE the verb palette (advisor sees approve/groom; implementer sees pickup/request-approval). Currently role is display-only. ADD A THIRD GREY-OUT AXIS: a verb is enabled iff status-applicable (TASK-947) AND (if UPDATE) has a selection (TASK-954) AND the active role is permitted to run it. Role-disallowed verbs render greyed + non-selectable with the hint ''requires the <role> role''. Note: the CLI/substrate still gates the transition (request approval is open to any role post-BUG-631; approve stays advisor-gated) — this is the TUI honoring that in the palette so the operator isn''t offered a verb that would be refused.'
