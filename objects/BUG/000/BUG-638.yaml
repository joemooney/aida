  content: 'DESIGN INTENT (operator, 2026-06-26): the human should NOT typically wear the advisor role — the advisor is a persistent AGENT that grooms/dispositions; the human is the OPERATOR (direction/keystone). So the TUI human-role default should be operator/implementer (NOT advisor), advisor-only verbs (approve/groom) are gated out of the human''s palette, and ''request approval'' always ROUTES to an advisor agent — the TUI never asks the human to approve. Aligns with the advisor-as-persistent-agent model.'
