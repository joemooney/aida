spec_id: BUG-5
title: 'Fix: Requirement edits revert in detail panel due to stale React Query cache'
description: 'Bug: When editing a requirement in the web UI detail panel, changes appeared to revert after saving. Root cause: useUpdateRequirement() only invalidated the [''requirements''] list cache, but DetailPanel reads from [''requirement'', id] (singular) which was never invalidated. After save, the stale individual cache overwrote the optimistic update. Fix: (1) Frontend - invalidate and optimistically update both [''requirements''] and [''requirement'', id] caches in useUpdateRequirement and useSetParent. (2) Server - added mark_saved() to update last_loaded_mtime after backend.save() calls, preventing unnecessary check_reload() reloads. Files: useRequirements.ts, service.rs, rest.rs.'
