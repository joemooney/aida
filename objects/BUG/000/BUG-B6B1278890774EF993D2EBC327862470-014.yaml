title: Adopted repos lack the contained egress allowlist and reviewer allow entries; contained reviews fail silently
description: |
  In a repo adopted with `aida init` other than aida itself (aida-relay), contained headless reviewers could not work. (1) .aida/config.toml had no [contained] allowed_hosts, so GitHub was unreachable and verdicts could not be recorded (fixed by hand in aida-relay #99). (2) .claude/settings.json had zero permissions.allow entries, so `aida show`, `git log` etc. were denied (fixed by hand with operator approval). Each failure made the reviewer exit with no verdict and only a terse "permission layer denied N calls" message; three review attempts were lost. Acceptance: `aida init` (and its template-refresh/upgrade path) scaffolds the same [contained] allowed_hosts and reviewer permissions.allow entries the aida repo uses, from the template master; and `aida queue work --role reviewer` preflights a contained launch: if the repo lacks the egress allowlist or the reviewer allow entries, it refuses BEFORE launching, naming the missing config and the command that fixes it. Tests: init scaffolds both; preflight refuses on a repo missing either. Do not widen permissions beyond what the aida repo has.
