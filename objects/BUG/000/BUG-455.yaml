title: Headless drain phase fails un-shelvably on 'database is locked' (SQLite cache lock contention with concurrent aida processes)
description: 'Empirical 2026-06-05: a headless drain''s phase-3 (reviewer) failed with ''database is locked — the batch drain will treat the failure as un-shelvable'' because a concurrent bulk operation (a 116-spec aida archive loop) was writing .aida/cache.db at the same time. Phases 1-2 (implementer+CI) completed fine; the contention hit phase 3. Two issues: (1) concurrent aida processes (drains + interactive shells + bulk ops) contend on the SQLite cache lock and a transient lock surfaces as a hard, UN-SHELVABLE phase failure; (2) the drain stops the whole batch on it. FIX: wrap cache access in a busy-timeout / retry-on-locked (SQLite PRAGMA busy_timeout or a bounded retry), and classify ''database is locked'' as a transient/shelvable failure (like a gh network blip) so the drain shelves+continues instead of hard-stopping. OPERATIONAL workaround until fixed: do not run bulk cache writes (archive sweeps, mass edits) while a drain is live. Discovered validating BUG-453.'
