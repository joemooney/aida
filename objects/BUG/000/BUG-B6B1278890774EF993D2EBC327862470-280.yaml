  content: 'Implemented configured-forge ship metadata reads through Forge::change_title_and_body (GitHub title/body; GitLab title/description REST read), updated shared callers, and detect .gitlab-ci.yml alongside GitHub workflows. Existing ship CI wait and merge already route through Forge; fake-glab regression exercises metadata, terminal red CI and merge refusal, with GitHub preservation and CI-file detection controls. LIGHT validation: aida lane job run -- cargo test --profile agent -p aida-cli-lib --lib -- bug_2515: 3 passed, 0 failed (job j20261110T041657311-2-0). Initial fixture failure corrected by supporting resolver --version probes. git diff --check passes. Merge-time completion logic unchanged (BUG-2516 out of scope). Native seat leaves edits uncommitted for host publication. Codegraph client at supplied /home/joe path was absent; used rg.'
