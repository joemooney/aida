title: aida pr ship on a GitLab-forge project calls gh directly and detects CI only from .github/workflows
description: Reported from operator's work machine (Codex, GitLab project hello-work-0x), 2026-11-09. With forge.provider = "gitlab", 'aida pr ship 2' calls 'gh pr view' (aida-cli-lib/src/pr_cmd.rs:6917) and fails with no GitHub host, and CI detection only checks .github/workflows (pr_cmd.rs:6986), so GitLab CI (.gitlab-ci.yml) is skipped. Route MR metadata, CI wait and merge through the forge abstraction (glab for GitLab), detect .gitlab-ci.yml, and add GitLab-forge tests with a fake glab.
status: NeedsAttention
priority: High
owner: joe.mooney@gmail.com
feature: Uncategorized
created_at: 2026-11-10T03:07:38.542859262Z
modified_at: 2026-11-10T14:45:18.274221374Z
req_type: Bug
