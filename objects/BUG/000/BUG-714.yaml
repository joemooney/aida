  content: |-
    Design (2026-07-11, autonomous loop) — scoped + ready to implement; the one thing gating autonomous implementation is that it PUSHES to multiple hubs (outward-facing, hard-to-reverse) on the load-bearing sync subsystem, which needs a test fixture + an operator design call before shipping.

    VERB: new "aida remote reconcile" (sibling of remote create/attach/status).
    STEPS: (1) fetch aida-store from every configured hub (origin + [store.sync] mirror_remotes). (2) classify divergence via the existing remote-status comparator. (3) if diverged, in the .aida-store worktree create a UNION merge of each diverged tip, resolving conflicts with the SAME CRDT machinery aida pull already applies on its store leg: conflict.rs merge_spec_three_way for objects/*.yaml, plus the registry union (blocks.yaml disjoint-range union + nodes.toml union). (4) verify the union (registry ranges disjoint, no lost specs). (5) push the union tip to every hub so all fast-forward.
    REUSE: conflict.rs union (already field-merges concurrent spec edits per docs/multi-hub-sync.md), the aida remote status classifier, git_ops.rs store worktree ops.

    DECISIONS I need from you before shipping:
    1. Default posture: dry-run-by-default (show the union plan, push nothing) + explicit --execute to push? Strongly recommend YES — never auto-push to multiple hubs without opt-in.
    2. Genuine conflict (same spec, incompatible edits the CRDT union cannot resolve): park-and-surface vs a merge driver? Recommend park-and-surface (do not guess-merge a shared branch).
    3. Scrub guard (acceptance): before pushing hub-only content, apply the BUG-715 redacted_identity to nodes.toml so a work-box node registration cannot leak raw corporate email/hostname into the public hub via the union. Wire redacted_identity into the union path.
    4. Test strategy: needs a multi-hub-divergence fixture (two throwaway remotes with disjoint registry-block commits) asserting the union preserves both. I can build this.

    Also (safe, do with the verb): remote status DIVERGED hint should point at "aida remote reconcile" instead of the generic reconcile-then-re-push text.

    Status: staying Approved (designed, not implemented). Ready to implement on your call re decision 1-3.
