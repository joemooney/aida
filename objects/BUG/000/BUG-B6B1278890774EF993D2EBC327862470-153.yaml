title: 'session start --owns on a contained seat creates a private clone but its Next: block suggests claude + aida worktree enter, which fails'
description: |-
  ## Repro (operator, 2026-10-31 18:21)
  `aida session start --owns TASK-2631` on a contained seat creates a PRIVATE CLONE (aida-seat-aida-task-2631). Its printed Next: block still suggests `claude  # then /aida-implement` and `aida worktree enter <ID>`. Following it fails: "held by session … not a linked worktree `aida worktree add` can re-enter".

  ## Acceptance
  1. When session start creates a private clone, Next: names the clone path and a command that works for a clone (cd into it); it never suggests `aida worktree enter`.
  2. The suggested launcher follows the project's default vendor (`[agents] vendor`); with vendor = codex it prints the codex launch line, not `claude`.
  3. For a linked worktree, today's output stays the same (regression test).
  4. Tests cover both branches (clone vs linked worktree) and both vendors (claude, codex).
