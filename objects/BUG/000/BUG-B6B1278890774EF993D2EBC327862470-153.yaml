  content: |-
    ## Implementer approach

    ### Acceptance criteria as tests
    - **Unit:** `session_next_lines` for a clone names `cd <clone>` and never contains `aida worktree enter` (AC1).
    - **Unit:** vendor = codex prints `codex    # then $aida-implement <ID>`; claude prints today's `claude    # then /aida-implement <ID>` (AC2), for both clone and worktree.
    - **Unit:** linked worktree + claude reproduces today's exact lines, with and without the warm-cache `aida worktree enter` line (AC3).
    - AC4 covered by the 2x2 matrix above.

    ### Expected files
    - `aida-cli-lib/src/session_start.rs` (pure line builder + call site + tests)

    ### Ambiguities / conflicts as questions
    - The 2026-11-01 comment asks for a new acceptance: re-running session start while the spec has an open PR should check out that PR's head branch. That changes branch selection (needs gh lookup), not the Next: block; I will leave it out of this fix and file it as a follow-up finding unless told otherwise.
