title: 'ship --from-seat: a retained repair merge consumes the seat''s clone lease, so the prescribed retry is refused'
description: |
  `aida ship BUG-2621 --from-seat <seat> --commit-pending MSG` on dell1 (2026-11-17 04:33 MST, live binary on dell1) failed with:
    error: "pending repair merge retained with its staged index; retry uses the same host-recorded original conflict paths"
  The error says to retry. The retry (04:45) was refused instead:
    "refusing to publish from <seat>: it is not a seat clone this checkout recorded (no `clone` session lease in ~/ai/aida names it)"
  So the first, failed attempt consumed or invalidated the seat's clone lease, and the retry it prescribes cannot run. The seat was left holding a resolved, uncommitted merge of main. Recovery required a manual commit plus a push by git, outside ship.

  Acceptance:
  1. A ship --from-seat that stops with a retained repair merge leaves the seat's clone lease intact, so the retry the error names succeeds.
  2. If the lease is gone anyway, the refusal names the recovery command (not a dead end).
  3. Regression test: a failed repair merge followed by a retry publishes the merge.
