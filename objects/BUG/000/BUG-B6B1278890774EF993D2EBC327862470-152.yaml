  content: 'Round 2 (cd5b0b05d5d, PR #3182). CI cli-0 failure was bug_2378_root_after_backfill.rs:292 (remote reconcile --execute): the backfill''s untracked registry/blocks.lock dirtied the store. Fix: aida doctor treats registry/*.lock as per-clone runtime (a tracked copy is flagged store-tracked-runtime and untracked; the pattern joins the runtime ignores doctor writes). aida-init stores already ignore it via *.lock. The fixture .gitignore now carries the same set; no assertions changed. db block verify skips retired nodes.toml rows (the fixture re-verifies under blocks-only). Retired-clone shape (home clone, read-only check): .aida/node.toml and .aida/dispenser.toml are both present and ignored, both naming node 1. A node.toml without dispenser.toml does not occur. After the backfill node.toml names the root node and dispenser.toml still names node 1. Bootstrap on a bound clone returns before reading the legacy pair; the new test bound_clone_bootstrap_ignores_the_backfill_repointed_legacy_pair covers it. Not verified locally: cargo was denied in this seat''s sandbox, so CI is the first run.'
