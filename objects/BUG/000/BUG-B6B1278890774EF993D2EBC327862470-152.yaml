  content: 'Round 2 (b49eed1, merged main at c1011f4). CI logs still unreadable from this sandbox and no local build was possible (cargo denied after the first bounded run), so these causes come from reading the code, not from logs. lib-0: bug_2378_lease_stamp_tests wrote node.toml without dispenser.toml, and work_binding::bootstrap refuses that (''incomplete legacy node/provider pair''), so its unwrap panicked. Fixed the fixture. cli-0: in bug_2378_root_after_backfill the first add''s pre-allocation sync (an origin remote exists) runs ''git add .'' and commits the store''s node.toml (the fixture had no .gitignore). The re-point then dirtied the store and ''remote reconcile --execute'' bails on uncommitted changes. Fixed: the fixture now has a real store''s .gitignore, and the backfill no longer re-points a tracked node.toml (new unit test bug_2378_repoint_skips_a_tracked_legacy_identity). Finding 2 was already handled in 0b18c5e. CI on this head is the real verification.'
