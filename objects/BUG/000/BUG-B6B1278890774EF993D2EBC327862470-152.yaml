    ADVISOR REWORK BRIEF round 4 (20:55), PR-3182 at c1011f4. Round 3 fixed the lease-stamp fixture, and lib-0/lib-1/cli-1 are green. ONE failure remains, in CI cli-0 (run 41268853682):
    `bug_2378_root_registered_by_label_verifies_identifies_and_syncs_after_backfill` panics at aida-cli/tests/bug_2378_root_after_backfill.rs:292 with: error "the store worktree at <tmp>/project/.aida-store has uncommitted changes — commit or clean them first".
    The commit at :135 now succeeds, but a later step (the reconcile or verify at :292) finds the store tree dirty. Something the repair or backfill writes is still left uncommitted, most likely `registry/blocks.lock` or a re-written `.aida/node.toml` / `dispenser.toml`. Fix:
    - The repair commits every tracked file it writes.
    - Runtime lock files are removed when released, or ignored by the store's .gitignore.
    - After `doctor --fix agreed-ids --yes`, `git -C .aida-store status --porcelain` is empty. Add that assertion to the fixture right after the repair, so the failure points at the leaking step.
    Do not make the reconcile/verify tolerate a dirty tree.
    Local gate: cargo can't run in the lane yet (BUG-2383). Run `make check-ci-fast` and push; CI is the gate.
