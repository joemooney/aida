title: 'Codex native-seat conflict reworks always punt: the host aborts the merge of main and the lane''s read-only Git cannot record one, so CONFLICTING PRs loop'
description: '2026-11-13 05:2x: dell1 Codex lanes for BUG-2501 (#3920), STORY-2325 (#3940) and STORY-2593 (#3938), all CONFLICTING with main, punted. The host attempts ''merge origin/main'', aborts on conflict, and hands the lane a clean tree with ''conflict resolution continues with codex''. The native seat''s Git is read-only, so the lane can only write a patch to /tmp and punt (''the host must merge main first''). Each relaunch burns a lane slot. Want: the host leaves the conflicted merge in place (MERGE_HEAD plus conflict markers) for the lane to resolve in the working tree; the host verifies no markers remain, records the merge commit, runs the fast gate and pushes. Or the host records a merge that keeps conflict markers on a scratch branch. Until then the advisor hand-merges small additive conflicts (done for #3920 at 4a191e3); large ones (#3940: 8 files including ratchet baselines) stay parked.'
status: InProgress
priority: High
