  content: |
    Implemented the direct native Codex clone rework path from the approved host-staged-merge ruling in docs/plans/2026-11-10-story-2710-conflict-lane.md. The host retains MERGE_HEAD, index conflicts and markers, and persists original paths in a versioned, locked main-root repair journal bound to the seat directory identity, branch and both merge parents. Native lane briefs request working-tree edits and a publication declaration only. Recorded repairs resume without overwriting resolutions. Host commit_pending loads the original paths, refuses residual markers even on staged retries, and completes the pending merge without attempting write-tree on an unmerged index. Failed merge commits retain staged resolutions and journal evidence for retry. Existing publication vetoes and exact-head fast gates remain in force; other vendor and linked-worktree workflows retain their prior behavior.

    The broader STORY-2710 automatic watcher dispatch/reservation and generated-output migration are outside this direct-rework fix. This lane leaves all code edits uncommitted for host publication. The configured reviewed codegraph executable was absent; doctor confirmed it missing, and navigation used rg.

    Validation on the final source, all via the lane job runner: bug_255 (7 passed, job j20261113T151359601-2-0); story_2710_marker_gate (1 passed, j20261113T151519078-2-0); story_2475 (10 passed, j20261113T151527460-2-0); bug_2504 (5 passed, j20261113T151541636-2-0). Total 23 passed, zero failures. The sandboxed clone fixture executed without a bwrap skip and verifies host merge retention, marker refusal, resume preservation, a two-parent resolution commit and trusted-origin push without seat hooks. Rustfmt checks and git diff --check pass. No live Codex vendor process was launched for validation. An earlier broader run exposed an obsolete aborted-merge notification assertion, which was corrected before the final passing run.

    Changed files: aida-cli-lib/src/seat_clone.rs; new aida-cli-lib/src/seat_clone/repair.rs; aida-cli-lib/src/queue_cmd/work.rs; aida-cli-lib/src/rework_direction.rs; aida-cli-lib/src/tests/bug_home_038_seat_publish_tests.rs; aida-cli-lib/src/tests/queue_work_tests.rs; docs/cli/04-git-lifecycle.md. No implementation blockers. Host should deploy the reviewed codegraph client at the supplied absolute path for future navigation.
