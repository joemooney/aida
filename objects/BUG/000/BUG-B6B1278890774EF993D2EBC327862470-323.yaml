  content: 'Advisor 07:05: dell1''s .git/aida-work-dispenser.toml went back to 0664 (mtime ~06:3x) even though both lanes launched under ''umask 022''. So the writer is not the lane''s umask; some other dell1 writer (autoland, cron, or a non-lane aida process) recreates it group-writable. Each time, the review-story auto-queue and punt comments fail silently on dell1.'
