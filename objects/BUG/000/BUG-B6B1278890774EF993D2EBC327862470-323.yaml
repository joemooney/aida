  author: joe
  content: 'Also blocks STORY-2593 (#3938: 45 hunks in containment/launch). Separately, dell1''s umask 0002 makes AIDA rewrite .git/aida-work-dispenser.toml as 0664, after which every ID allocation (auto-queue review stories, punt comments) refuses. Workaround: ''umask 022'' in the dell1 lane launches. The writer should set 0600 explicitly.'
