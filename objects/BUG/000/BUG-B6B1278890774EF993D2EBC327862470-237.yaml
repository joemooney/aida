  content: 'Returned from NeedsAttention to Approved via `aida queue rework`. It was shelved on: reviewer/verdict:request-changes: The per-PR isolation is right and both criteria have tests, but persisting the refusal reason tags any record_skip failure (including lock contention past the 5s deadline) as GlobalState, which adds a new way for one PR to stop the whole watch, contrary to AC1. CI was still queued at review time.. No triage reason was given.'
