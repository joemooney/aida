title: 'aida review watch exits the whole loop when one PR''s review is refused (''error: PR-N: review watch refused''), so every other PR stops getting reviews'
description: |-
  Seen 2026-11-06 11:09:50 MST. A PR-3508 pickup failed ('branch pr-3508 is held by worktree', see BUG-2469). Review watch logged 'error: "PR-3508: review watch refused"' and the process exited. Nothing reviewed any PR for about 28 minutes, until the advisor noticed and wrapped the watch in a respawn loop (advisor-scripts/review-watch-loop.sh).

  Acceptance:
  1. A per-PR refusal or setup failure is recorded against that PR (as 'exited without completing' already is) and the watch continues with the other PRs. Only a watch-level failure (grant invalid, state file unusable) exits nonzero.
  2. A test drives two PRs, one refusing at pickup, and asserts the other is admitted in the same tick and the watch keeps running.
