- id: 01a1771b-34cc-71f1-83bd-d41a737b5194
  author: joe
  content: |-
    ## Implementer findings (PR #2946); could not file as draft TASKs: `aida add` ID allocation failed in this seat

    1. **bug-spotted, major**: in a seat clone, `aida ship` step 1 always reads the tree as dirty, because `host_git_command` refuses there by design (BUG-2169) and `tracked_changes_pending` treats a failed status as pending work. `git commit` then fails with "nothing to commit", so `aida ship --no-merge` cannot publish from a seat clone. PR #2946 was pushed and opened by hand. The same refusal blinds `untracked_regular_files` and the new `staged_sandbox_placeholders` guard in seat clones; there, the new excludes are the defense. Fixing it needs a BUG-2169 condition-1 decision: route the probes through the seat_clone accessor, or use the raw git that step 1 add/commit already run.
    2. **followup-suggestion, minor**: no doctor check yet for a stale empty read-only `.git/config.lock`. It reproduced on this push ("unable to write upstream branch configuration").
