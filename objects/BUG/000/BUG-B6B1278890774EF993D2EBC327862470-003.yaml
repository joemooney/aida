title: Seat clones commit the Claude Code sandbox placeholder files (.gitmodules, .idea, .vscode, .claude/launch.json ...) because they lack the primary clone info/exclude
description: 'PR #2943 (BUG-b6b1...-002 lane, seat clone aida-seat-aida-bug-b6b1...-002) committed nine empty read-only files: .claude/agents, .claude/launch.json, .claude/loop.md, .claude/output-styles, .claude/routines, .claude/scheduled_tasks.json, .gitmodules, .idea, .vscode. These are the stand-ins the Claude Code bash sandbox creates for denied paths. The primary clone ignores them through .git/info/exclude (entries at lines ~27-33); seat clones are separate clones with their own minimal info/exclude, so a lane commit picks them up. The committed .gitmodules then made aida session end / aida worktree dismiss refuse salvage ("the clone has submodules"). The advisor removed them from #2943 by hand (9fa1d8b24d). Related: an empty read-only .git/config.lock keeps reappearing in the primary (sandbox placeholder for a protected path), which makes git config writes fail (worktree add -B, upstream config) until removed. Fix: seat-clone creation must carry the primary info/exclude sandbox entries (or ship them in a tracked ignore file), and ship/commit staging must refuse zero-byte read-only placeholders; add a test. Consider a doctor check for a stale read-only config.lock.'
