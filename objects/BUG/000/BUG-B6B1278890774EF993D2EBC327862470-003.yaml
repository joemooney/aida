- id: 01a177f8-3f9d-7953-9afc-91d81635d233
  author: joe
  content: 'Reviewer findings from PR-2946 round 3 (non-blocking, minor). Could not file them as draft TASKs because aida add ID allocation failed in this seat. (1) Seat clones created before this fix keep their old info/exclude; only create writes the inherited entries (seat_clone.rs:531-541). (2) The ship guard checks only staged additions; stand-ins already committed on the branch by hand still ship. Consider checking base..HEAD additions with the same predicate. Review comment: https://github.com/joemooney/aida/pull/2946#issuecomment-6414903016'
