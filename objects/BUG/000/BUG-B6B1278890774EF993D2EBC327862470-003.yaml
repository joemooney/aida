- id: 01a178c1-6175-7863-9d0b-65b717a20682
  author: joe
  content: 'Reviewer round 4 (PR-2946, head 871837d): REQUEST CHANGES. Blocking: ship.rs:328 raw Command::new("git") breaks the TASK-2143 ratchet (ship.rs allowlist 0, always scanned since TASK-2359 #2935). Use host_git_command, which fails closed in seat clones, and change ship_refuses_a_staged_stand_in_inside_a_seat_clone to expect the refusal. Non-blocking finding (could not file as a draft TASK: ID allocation failed in this seat): an_unrunnable_stand_in_probe_refuses assumes its tempdir is outside any git repo; consider GIT_CEILING_DIRECTORIES. Review: https://github.com/joemooney/aida/pull/2946#issuecomment-6419478901'
