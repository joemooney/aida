title: aida add --parent X --blocked-by Y silently drops the blocked-by edge
description: 'When aida add receives BOTH --parent and --blocked-by in one invocation, it prints both Blocked by: and Linked: parent of lines, but only the parent (Child) edge survives - the BlockedBy edge is lost. Root cause in aida-cli/src/main.rs: the --blocked-by loop runs first via add_blocked_by_edge (re-fetches fresh and writes the edge). The --parent block then runs let mut child = last.clone() on the pre-blocked-by snapshot captured at add_requirement time, pushes the Child edge, and calls backend.update_requirement(&child) - clobbering the just-written BlockedBy edge. --blocked-by alone works; --parent alone works; only the combination loses data. Repro: aida add --type story --title D --parent EPIC-1 --blocked-by STORY-2 --status approved; aida show D shows only is child of, no is blocked by. Fix: re-fetch fresh before adding the parent edge (mirror add_blocked_by_edge), or merge both edge-adds into one read-modify-write. Workaround: aida add --parent then a separate aida edit --blocked-by. Surfaced building the TASK-875 Spec-Kit composition-seam demo.'
