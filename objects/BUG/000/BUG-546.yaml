title: aida human reviews-bucket (+ PR linkage) resolves spec↔PR by BRANCH NAME — misses PRs whose branch is named for a different spec than the commit trailers
description: 'Operator hit (2026-06-13): BUG-530 (#865, branch bug-530-…) shows in ''aida human'' reviews-awaiting [PR-865], but TASK-800 (#869) does NOT — even though both are Done and both have open PRs. Cause: the reviews bucket matches open PRs to specs via the BRANCH NAME, and #869''s branch is ''story-610-supervised-marker'' (matches the PARENT STORY-610, which is Draft) while the COMMIT trailers the child TASK-800. So a Done spec with an open PR is invisible to review when the branch is named for a different spec. Fix: resolve spec↔PR via the authoritative COMMIT TRAILERS (''(SPEC-ID)'' + ''trace:SPEC-ID'' in the PR''s commits), not (only) the branch name — branch-name is a fragile heuristic. The ''aida review <SPEC>'' surface-detection should use the same trailer-based resolution. trace:relates:STORY-611 trace:relates:TASK-241 trace:from-friction'
