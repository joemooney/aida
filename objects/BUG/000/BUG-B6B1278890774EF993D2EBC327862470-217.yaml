  content: 'Implementation is in the native Codex seat branch bug-b6b1278890774ef993d2ebc327862470-217: status-independent open-change head selection for queue and direct starts, refusal of conflicting explicit branches/held heads/unknown forge state, explicit-only suffix allocation, and duplicate prevention at open_change_bound. Added queue-status, cluster, held-branch, no-seat, unknown-state and publication regressions; updated help and CLI docs. make check-ci-fast passed all 36 gates; formatting passed. Targeted Rust tests are recompiling after fixing a new test-helper visibility error. Native sandbox makes this seat .git read-only (git add failed creating index.lock), so host post-exit commit and aida ship --from-seat publication are required. Suggested subject: [AI:codex] fix(queue): retain existing PR branches during rework (BUG-2451).'
