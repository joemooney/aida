    Findings:
    1. [minor] session_start.rs:752-766 + queue_cmd.rs:13303: aida queue work hardcodes branch_style "auto" and has no --branch-style flag. A spec whose earlier PR merged with its branch kept (normal retention, --delete-branch=false) therefore refuses every queue-work/lane pickup with 'pass --branch explicitly or --branch-style date', and the second recovery is not a valid queue-work option. Either handle the confirmed-merged-retained case without operator action (e.g. allocate the dated name automatically only when merged_change_for_branch returns Found and no open PR exists), or add --branch-style to queue work, and make the message name only flags the invoking command accepts. Add a queue-work-level test for this case.
    2. [minor] queue_cmd.rs:8990-8993 doc comment (BUG-1763) still states a merged local branch 'is the normal residue of this repo's retention policy and must not block re-pickup', but the new auto policy now blocks exactly that at session start. Reconcile the contract: update the comment and BUG-1763-era tests, or restore the merged-branch path as above.
    3. [minor] pickup_pr_branch (session_start.rs:401-421) and open_change_bound_with_riders (gate/ledger/mod.rs:318-345) use change_for_spec, which on GitHub is SpecPrScope::First (pr_lookup.rs:1032-1036) and returns the first matching open PR. When a spec already has two open PRs (the duplicates this bug produced: #3397, #3401, #3407), pickup seats whichever gh lists first (usually the newer, incomplete duplicate), and publication from the original branch refuses against the duplicate. Detect more than one open change for the spec (all_open_prs_for_spec_via_forge) and refuse naming both PRs, in both pickup and publication; add a test with two Found rows.
    4. [cosmetic] queue_cmd.rs:11886-11890: rework_pr_head_branch_override now runs (and propagates forge errors with ?) before the list_sessions branch at queue_cmd.rs:12128, so 'aida queue work <spec> --list-sessions' fails closed when gh is missing or offline although it allocates nothing. Skip the lookup (or downgrade errors to a warning) for list-sessions.
    5. [process] PR CI at a5222c65864f had not run any job at review time (cli-0/1, contracts, gates, lib-0/1, rest all pending); the rework head needs a green CI run before approval.
