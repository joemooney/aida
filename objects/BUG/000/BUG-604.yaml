title: 'aida init git-init success line is a double-verb: "Created initialized a git repository here"'
description: 'In aida init on a fresh non-git dir, after accepting the "initialize one with git init?" prompt, the success line reads "  Created initialized a git repository here" — a double verb ("Created" + "initialized"). Source: aida-cli/src/main.rs, the git-init branch: println!("  {} initialized a git repository here", "Created".green()); — the green "Created" token is prepended to a string that already starts with "initialized". Fix: pick one verb. Either "  {} a git repository here" with "Created".green() (-> "Created a git repository here"), or drop the token and use "Initialized a git repository here" (matches git init semantics). First-run onboarding path, so it is the very first output a new user sees — worth the polish. Cosmetic only; init proceeds normally. (The "Invalid node name" error in the original report was an operator-keystroke false alarm, NOT filed.)'
