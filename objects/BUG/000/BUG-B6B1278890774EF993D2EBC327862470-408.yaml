title: Advisor loop service hardcodes review-watch max_concurrent=2, ignoring [review_watch] max_concurrent; raise the project setting to 8 (operator-approved)
description: |-
  advisor_loop_service.rs:377 builds ReviewWatchArgs with max_concurrent: Some(2), so the supervised review-watch always runs 2 reviewers. That overrides .aida/config.toml [review_watch] max_concurrent = 4 (resolve_max_concurrent, review_watch.rs:2635); state.json shows max_concurrent 2. The operator approved raising review concurrency to 8 on 2026-11-16 18:56 (via the product seat).
  Acceptance:
  1. The service passes max_concurrent: None (or the resolved config value), so the project setting governs, and an absent setting still defaults to 2.
  2. .aida/config.toml [review_watch] max_concurrent = 8.
  3. A regression test shows the supervised service honoring a configured value (for example 5) instead of 2.
  FASTTRACK: a one-line production change plus config and test. One light review.
