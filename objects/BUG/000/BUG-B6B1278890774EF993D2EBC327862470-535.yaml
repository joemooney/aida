- id: 01a21878-6686-7b80-9374-c7781a88afec
  author: dirtlab
  content: |-
    ## Implementer self-review
    Reviewed HEAD: 3bf2ccc98a (git diff origin/main...HEAD; partial slice, Refs).
    Acceptance evidence: AC2 [behavioral-test] review_watch::{service,train_service}::loop_tests::bug2774_a_deputy_on_a_stale_or_deleted_binary_is_reported (lane job, 2 passed): replaced image (other inode + other sha) and the '(deleted)' marker are reported with deputy, pid, path, age and the fix line; a live image and an identical copy are not. train-status/loops status JSON gains deputy_binary; doctor category deputy-binary (aliases stale-deputy) reuses the same probe. AC1: NOT implemented (design fork; punted). AC3: covered for AC2 only.
    Probes: P1 deleted marker matched on the readlink suffix the kernel writes; inode mismatch alone is not stale (sha must differ, so a copied build is quiet). P3 doctor dedups the two services' findings by deputy:pid. P4 unreadable live build / unreadable exe / dead host -> no report (fail quiet, matches BUG-2645). P5 report-only, no authority path touched.
    Fixes during review: age shown as XhYm instead of whole hours (after the test compile; untested formatting only).
    Residual risks: doctor finding builder has no fixture test (state receipt + live /proc needed); the sha probe executes the deputy image with --version only when inodes differ, like binary_status does for the worker. make check-ci-fast exit 0.
