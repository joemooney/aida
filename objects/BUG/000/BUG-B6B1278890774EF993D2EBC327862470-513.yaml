title: aida init with codex-only does not configure [contained.vendors] codex="native"; codex seat launch refuses and suggests claude
description: |
  Reported by Joe 2026-11-24 (filed by product-15) from a CODEX-ONLY environment (work, where Claude is not allowed). After `aida init` with ONLY codex selected, `aida agent new codex` → role advisor refuses:
  "Error: `codex` cannot run an AIDA-contained session; refusing to launch it. Supported [contained.vendors] settings: claude = "aida" (AIDA containment), codex = "native" (explicit opt-in in the trusted default-branch config; native sandbox, not AIDA-contained). Use --vendor claude or AIDA_HEADLESS_VENDOR=claude for AIDA containment."
  The remedy it suggests (use claude) is impossible there. Part of STORY-3099 (codex can hold the advisor seat).

  ## Acceptance
  - AC1: When `aida init` is run with codex as the only selected vendor, it writes `[contained.vendors] codex = "native"` into the committed default-branch config (the trusted location the check requires) and tells the user in one line what that means (codex's native sandbox, not AIDA containment). A test: init with codex-only → `aida agent new codex --role advisor` passes the containment check.
  - AC2: When a codex launch is refused for missing containment config in a project with NO claude vendor configured, the error names the exact one-line fix (`[contained.vendors] codex = "native"` in .aida/config.toml on the default branch) instead of suggesting claude. Test.
