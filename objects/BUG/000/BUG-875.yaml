title: reviewer-phase watchdog keys on commits/file-changes — kills every review longer than the window
description: 'Observed 2026-09-06 05:42 (BUG-862 round-2 review): the phase watchdog stopped a legitimately-working reviewer session with ''no commit or file-change for 10m — likely a degenerate session''. A reviewer phase by design makes NO commits and NO file changes until the single verdict-file write at the end — the no-progress heuristic is implementer-shaped. For reviewer (and any read-then-verdict) phases the watchdog must key on session OUTPUT activity (stream-log growth/mtime, the same signal the pacing last-output field uses) instead of file changes, with the same configurable window. Acceptance: a simulated reviewer session that streams output but writes no files survives past the window; one that goes silent is still killed; unit test on the progress-signal selection per phase.'
