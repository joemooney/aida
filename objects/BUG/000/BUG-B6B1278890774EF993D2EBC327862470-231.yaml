title: Shared-boundary conformance fixture setup runs as implementer, so approve and queue add are refused and C0-C4 report unknown
description: 'Operator run 2026-11-06 09:43 MST (output ~/.aida/conformance-aida-1793983381, after BUG-2462 landed): role enter now succeeds as implementer, but fixture setup step 11 files the probe spec with --status approved, which is downgraded to draft (''requested approved needs advisor authority''), and step 12 ''aida queue add'' fails with ''queuing work for execution needs dispatch authority''. Every check (C0-C4) is unknown with unsupported_reason=fixture-queue-add-refused, and the run ends aida-boundary-launch-refused. Fix: in the disposable fixture, do the spec approval and queue setup under a fixture advisor/dispatch seat in the fixture roster (never the operator''s real grants), then enter implementer only for the contained launch. Acceptance: on the operator''s host the run reaches the launch and reports real C0-C4 pass/fail; a regression test pins that setup authority and launch authority are separate seats. Blocks closing BUG-2447/BUG-2448.'
