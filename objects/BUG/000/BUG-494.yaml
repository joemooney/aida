title: aida burndown plan footer falsely claims 'There is no aida burndown run' — but the run subcommand exists (STORY-545)
description: 'The footer printed by ''aida burndown plan'' says: ''Next step: invoke /aida-burndown in Claude Code... There is no aida burndown run/start — the runner is the /aida-burndown skill, not a CLI subcommand.'' This is stale: STORY-545 shipped ''aida burndown run'' (kick-off-and-walk-away headless drain; full --status/--tag/--batch/--max/--concurrency/--permission-mode surface). The footer actively tells the operator a working command doesn''t exist — directly confusing (operator hit it 2026-06-10 asking ''what''s the drain command?''). Fix: update the footer to point at ''aida burndown run'' (and note /aida-burndown as the in-Claude alternative). Same misleading-output class as BUG-418/BUG-493.'
