title: Residual parallel-test flake after BUG-697 — bug670 still fails ~rarely in CI (read_queue_depth None + git untracked-files co-symptom)
description: 'Follow-up to BUG-697 (env-lock unification, merged #1342). That fix cut the flake from ~1/3 to rare: 8/8 then 3/3 clean full-suite runs locally post-fix, but bug670_agent_status_tests::actionable_matches_queue_list_on_a_padded_fixture still flaked ONCE in CI on unrelated PR #1346. New signature: read_queue_depth(root, Some("implementer")).unwrap() returns None (queue file for the resolved user not found) — still a user/path race — AND the git error "The following untracked working tree files would be overwritten by merge" co-occurs in the same Run tests step. Hypotheses: (a) a SECOND isolation issue — a test running git merge/checkout/stash in a shared/real tree leaving untracked files that corrupt sibling state; (b) a residual env/CWD mutation not on test_env::ENV_LOCK (bare std::env::set_var or set_current_dir). NOT locally reproducible post-fix → needs CI-side instrumentation or a --test-threads-scoped git-ops group; ships supervised. Low enough frequency that a single rerun clears an innocent PR. trace:BUG-697'
