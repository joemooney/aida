  content: 'Recurrence 2026-07-07 (CI, PR #1359): session::tests::advisor_tier_program_and_args_builds_correct_command_per_vendor flaked — advisor_tier_program_and_args reads AIDA_AGENT_CMD via resolve_agent_program but the test never took AgentCmdEnvGuard, so a guarded writer test flipped the env between its two evaluations. Fixed by acquiring the guard in the test (shipped on the story-762 branch). Pattern to sweep: any test calling env-reading helpers WITHOUT the corresponding guard is a latent flake — same class as the BUG-697 unification.'
