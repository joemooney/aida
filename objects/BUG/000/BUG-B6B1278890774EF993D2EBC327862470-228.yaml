title: 'Shared-boundary harness: fixture has no team roster, so role enter refuses, and the refusal is mislabelled as managed-agent'
description: 'Operator live run 2026-11-06 06:20 MST, from a plain terminal: python3 scripts/containment/conformance.py --vendor codex --boundary aida ... After fixture init (BUG-2460 fixed), ''aida role enter implementer --delegate-seat implementer'' failed: ''cannot check seat implementer for joe: the AIDA store at <fixture>/repository/.aida-store has no team roster (registry/team.toml is missing); an interactive human can create it with aida team allow-seat''. The harness then reported ''fixture-role-enter-refused: operator-context grant required; managed agents must not mint seat grants'', a hard-coded label (conformance.py ~:628) that hides the real cause. Fix: (1) after ''aida role scaffold'', provision the fixture roster through the production path: run ''aida team allow-seat <user> implementer'' on the operator TTY in the fixture repo, like role enter (stdin is the terminal; no hand-written team.toml); (2) derive the refusal reason from the role-enter diagnostic: missing roster -> fixture-roster-missing, managed-agent refusal -> fixture-role-enter-refused-managed, otherwise fixture-role-enter-refused with the diagnostic in report.json; (3) an offline test with the fake vendor covers the roster step and the reason mapping; (4) update docs/internal/testing/containment-conformance.md. Acceptance: an operator run from a plain terminal reaches seat-preflight. LIGHT gate: the harness python tests.'
