title: EARS lint conflicting-constraint heuristic false-positives on each/none co-occurrence, holding well-specified specs from the zen gate
description: |-
  The aida lint conflicting-constraint check flags a spec when the words "all"/"each" and "none" both appear across title+acceptance, reading them as contradictory even when they describe different clauses (e.g. "each glyph SHALL be registered" + "none appear as raw unicode"). Observed 2026-06-30 grooming TASK-1071: two lint-clean-intent rewrites were held until "none" was removed. Because the zen suitability gate (TASK-1037) runs this lint, a false-positive here blocks a legitimately-specified spec from a headless drive.

  ## Acceptance
  - WHEN acceptance clauses use "each"/"all" and "none" to describe DIFFERENT, non-overlapping constraints, THE conflicting-constraint check SHALL NOT flag them as contradictory.
  - THE conflicting-constraint check SHALL only fire when the same subject is constrained to both all and none.
  - A test SHALL assert that a spec with "each X SHALL be registered" plus "none of X appears raw" passes the lint.
