id: 019df6b4-a6c9-70b2-a3fb-74ff82e1f7f8
spec_id: BUG-1-050
title: REST POST /api/requirements ignores reqType in request body, always creates Functional
description: |-
  **Reproduced 2026-05-05** during BUG-1-049 click-through:

    curl -X POST /api/requirements -d '{"title":"smoke 2","reqType":"task",...}'
    → response: {"specId":"FR-0392", ..., "reqType":1}    # 1 = Functional

  The reqType field in the request body is being dropped — the server defaults to Functional regardless. Same prefix in the spec ID generation (FR-) and same path on disk (objects/FR/000/...).

  **Likely cause**: REST handler for create_requirement doesn't deserialize / forward reqType to the underlying add_requirement call. Probably an oversight in convert.rs or the rest.rs handler.

  **Impact**: web UI users can't create non-Functional requirements via REST today. CLI 'aida add --type task' works fine because it goes through a different path.

  **Fix**: thread reqType through the create_requirement handler. Likely a 5-line change once located.
