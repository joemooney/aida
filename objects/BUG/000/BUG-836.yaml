title: remote status labels a pure fast-forward lag as DIVERGED — should say BEHIND and suggest a plain push
description: |-
  Observed 2026-09-03: gitlab was 164 commits behind on main and 2875 behind on aida-store with ZERO unique commits of its own (git rev-list both directions confirmed strict fast-forward), yet `aida remote status` rendered both as "✗ DIVERGED" and the guidance block talked about merge/reconcile. A pure lag is the common mirror state and its remedy is one safe push; calling it DIVERGED sends the operator toward reconcile machinery they do not need.

  Fix: when one remote is strictly behind another (ahead>0, behind==0 in exactly one direction), render "⇡ BEHIND (<n> commits)" and suggest the exact fast-forward push (`git push <remote> <canon>/<branch>:<branch>` or the aida verb). Reserve DIVERGED (and the reconcile guidance) for genuinely two-sided history. Unit test: a behind-only fixture renders BEHIND with the push hint; a two-sided fixture still renders DIVERGED.
