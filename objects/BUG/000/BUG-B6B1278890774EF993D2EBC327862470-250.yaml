  content: 'Implemented in native seat; edits left uncommitted for host publication. Role entry now announces a five-minute operator prompt window, retaining existing delegation choices; outer continuation budget increased accordingly. Terminal attributes are saved/restored around role entry and continuation cleanup, including timeout, interruption, SIGTERM and forced child cleanup. Updated scripts/containment/conformance.py, tests/test_containment_conformance.py and docs/internal/testing/containment-conformance.md. Validation: both conformance suites passed (46 tests); final focused terminal/disconnection tests passed (3 tests); Python compilation, git diff --check and cargo fmt --all -- --check passed. No blockers. No live vendor conformance run performed.'
