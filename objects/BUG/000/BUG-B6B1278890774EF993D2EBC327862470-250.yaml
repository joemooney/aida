title: Conformance harness kills the interactive role-enter prompt after 30s
description: 'scripts/containment/conformance.py runs ''aida role enter advisor --no-resume --no-title'' with a 30s subprocess timeout. That command can stop at an interactive y/N prompt (''Include it in the TTY-issued delegation set?''). When the operator doesn''t answer within 30s, the harness reports rc=2 with ''timed out after 30 seconds'' and leaves the terminal in a broken mode (the staircase output). Repro 2026-11-07 16:44Z, out=~/.aida/conformance-codex-aida-1794069894. Acceptance: role-enter prompts run without a deadline (or with a long one, minutes, that says it is waiting for the operator), or the harness pre-answers the delegation-set question non-interactively when it is the expected answer. The terminal state is restored on every exit path.'
