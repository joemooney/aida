  content: 'Round 2 fixes all five review findings: terminal attribute restores now skip background groups; continuation supervisors lend controlling-terminal foreground ownership before releasing the private script and reclaim it with SIGTTOU blocked after nested cleanup. Added controlling-terminal (setsid/TIOCSCTTY) implementer and nested prompt coverage plus forced-cleanup restoration, a background restore skip regression, and main SIGTERM handler installation/diagnostic tests for both boundaries. Top-level termination now reports harness-terminated: SIGTERM. Corrected the setup-budget comment and updated conformance documentation. Targeted suite and formatting verification recorded in native-seat handoff; host publication required.'
