  content: 'Advisor lane brief 13:31 (codex, MAIN track, low, aida-d0''s fill list). Scope: make admit_phase1 (aida-cli-lib/src/wip_limit.rs:117) run once per fresh auto-complete member. Today both phase_gates.rs:96 ensure_queued_for_implementer and phase_gates.rs:153 prepare_registered_auto_complete_phase1 call it. Pass the first admission result through rather than recomputing it. Acceptance: one wip-limit-override gate event per --over-wip or canonical-branch pickup at the limit (test), and the forge and branch lookups happen once. Behaviour is otherwise unchanged; the #4094 tests (queue_work_tests, bug_2451_pickup_entry_tests, bug_2133_contained_drain_children_tests) still pass. Gate (LIGHT): cargo test -p aida-cli-lib wip_limit plus the lane pre-push gate. Trailer (BUG-2600). Session rules: allowed_domains only on sandboxed Bash calls, never with dangerouslyDisableSandbox. A classifier-denied kill or destructive step is reported, never retried another way. Never sleep in a foreground Bash call.'
