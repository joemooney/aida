title: Conformance harness loses the codex launcher refusal reason and hard-codes the agy OAuth token path
description: |
  Two defects in the vendor conformance harness lose the reason a run failed.

  1. Codex: when the codex launcher refuses, the refusal reason is not captured. Example output dir: ~/.aida/conformance-codex-aida-1794775961. The report says to inspect stdout.jsonl / stderr.txt, but neither file exists in that directory, so the operator has nothing to read.
  2. agy: conformance.py:1172 expects /mnt/fast/antigravity-cli/antigravity-oauth-token, which does not exist on this host. The check fails on a hard-coded path instead of reporting the missing credential or reading it from config.

  Acceptance:
  - A launcher refusal writes the refusal text (exit code + stderr) into the output dir, and the report points at files that exist.
  - The agy token location is configurable or discovered; a missing token produces a clear "credential not found at <path>" result rather than an unexplained failure.
