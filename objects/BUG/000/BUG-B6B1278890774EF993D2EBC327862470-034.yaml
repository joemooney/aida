  content: |
    Cause confirmed 2026-10-29 22:43: the 3117 reviewer launch failed with 'fatal: Unable to create /home/joe/ai/aida/.git/worktrees/-aida-store/index.lock: File exists' while other store writers ran. The lock was gone a minute later, so this is transient contention on the store worktree index. The fix needs a bounded retry on index.lock contention for store commits during launch.
