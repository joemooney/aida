comments:
- id: 01a18b56-5d9e-7b93-b722-b6d758582e71
  author: joe
  content: |
    Cause confirmed 2026-10-29 22:43: the 3117 reviewer launch failed with 'fatal: Unable to create /home/joe/ai/aida/.git/worktrees/-aida-store/index.lock: File exists' while other store writers ran. The lock was gone a minute later, so this is transient contention on the store worktree index. The fix needs a bounded retry on index.lock contention for store commits during launch.
  created_at: 2026-10-30T05:44:15.518907730Z
  modified_at: 2026-10-30T05:44:15.518907730Z
  session_id: 32b60b73-45e6-45d8-a58a-ced0ef53c40e
- id: 01a18b89-c01c-7242-9380-09c1a567f28e
  author: joe
  content: |
    2026-10-29 23:40: third hit tonight. `aida session end` failed with 'git add -A . failed: fatal: Unable to create .git/worktrees/-aida-store/index.lock: File exists' while about 8 reviewers and lanes ran. All store writers (session end, reviewer launch, review record) need one serialized writer or a bounded lock retry. Priority raised to high.
  created_at: 2026-10-30T06:40:23.068702233Z
  modified_at: 2026-10-30T06:40:23.068702233Z
  session_id: 32b60b73-45e6-45d8-a58a-ced0ef53c40e
- id: 01a18b9f-327a-7832-b97a-116d7244695e
  author: joe
  content: |
    2026-10-29 23:47: ROOT CAUSE found. index.lock in .git/worktrees/-aida-store was STALE from 23:38:28 to 23:47 (7+ min): no git process held it and lsof showed nothing, so a killed writer left it behind. Every store write failed until the advisor removed it by hand. Writers must detect a stale lock (no live holder, older than N seconds) and recover, or run under the store flock so a killed writer cannot leave index.lock behind.
  created_at: 2026-10-30T07:03:48.602810104Z
  modified_at: 2026-10-30T07:03:48.602810104Z
  session_id: 32b60b73-45e6-45d8-a58a-ced0ef53c40e
