  content: |
    2026-10-29 23:47: ROOT CAUSE found. index.lock in .git/worktrees/-aida-store was STALE from 23:38:28 to 23:47 (7+ min): no git process held it and lsof showed nothing, so a killed writer left it behind. Every store write failed until the advisor removed it by hand. Writers must detect a stale lock (no live holder, older than N seconds) and recover, or run under the store flock so a killed writer cannot leave index.lock behind.
