title: 'Two launchers can start a lane for one spec: autoland and a hand launch both pass --force-claim and nothing refuses the second'
description: '2026-11-14: autoland dispatched ''aida queue work STORY-2824 --vendor codex --fresh --force-claim'' locally at 12:43 while the advisor hand-launched a Claude lane for the same spec at 12:53; both ran. At 13:25 autoland dispatched a codex lane for TASK-3784 on dell1 one minute after the advisor''s hand launch, which was then refused only because the seat clone already held the branch. Nothing reports the duplicate until two heads appear on the PR branch. Wanted: one spec, one live lane. A second ''queue work <SPEC>'' (with or without --force-claim) is refused at claim time when a live process holds the spec''s claim on any host, and the refusal names the holder (host, pid, lease, launcher). --force-claim only takes over a claim whose holder is provably dead.'
