- id: 01a1e10b-7c9e-76f0-97d2-a42655b427fd
  author: joe
  content: |
    ADVISOR SIGNOFF (2026-11-15 14:14 MST) on the codex admission sketch. APPROVED with these rulings. STRICT; heft 7; main track.
    1. APPROVED: strict implementer admission at the existing shared CAS boundary, keyed by canonical spec identity (aliases and origin IDs collide). Reviewer coexistence is unchanged.
    2. APPROVED: reserve before creating the lease or tree; bind the reservation to the invocation, then to the exact successor lease and worker generation. Diagnostics name the host, worker PID, lease and launcher. An ephemeral CLI PID never authorizes takeover.
    3. APPROVED: Live and Unknown both refuse a second implementer launch, with or without --force-claim. Force-claim takes over only with positive death evidence for the exact holder (reuse ownership::reader::lease_owner; no PID or age heuristics). Existing dirty/unpublished-work protections stay.
    4. APPROVED: resume and phase handoff compare the exact prior generation. Compare-delete rollback; a losing launch never releases the winner's claim.
    5. RULED: a remote or legacy-unbound claim whose state is Unknown is retained (no automatic TTL reclaim). The refusal message prints the holder and the ONE explicit release command (the existing operator claim-release path; if none fits, add a narrow `--release-unknown <spec>` that writes an audited release receipt). Single user, so a breaking change is acceptable; no compat knob.
    6. RULED: when a shared origin is configured and the refresh fails, implementer admission refuses (fail closed) and names the failure. A repo with no shared origin keeps local-only admission.
    Validation: the list in the sketch, as targeted tests, plus the lane pre-push gate. No full suite. Slice it if it exceeds ~800 lines: slice 1 is 1+3 plus diagnostics, slice 2 is 2+4, slice 3 is 5+6, each its own PR under this spec.
