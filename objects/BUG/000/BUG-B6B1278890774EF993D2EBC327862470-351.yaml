- id: 01a1e108-04da-7241-873e-0d8a8d01f99b
  author: dirtlab
  content: |
    BUG-2586 investigation and admission sketch (ai:codex)

    Observed in this lane (source inspection, not a runtime reproduction):
    - session_start.rs calls coordination::acquire_claim_receipted with force_claim || orchestrated.
    - coordination.rs skips decide_claim entirely on force; decide_claim also unconditionally accepts a same-clone claimant and reclaims foreign claims on TTL expiry.
    - session_start.rs skips live_spec_claim_by_other when force_claim_effective is true.
    - Shared Claim.pid is explicitly the ephemeral session-start CLI PID, not the worker PID. Claim has no session lease ID or launcher identity. Its session liveness probe only adds local evidence and uses the legacy Claude-session matrix.
    - Shared acquisition currently proceeds locally on missing origin or failed refresh. That cannot establish the requested any-host exclusion guarantee.
    - ownership::reader::lease_owner already exposes positive death versus Unknown for a locally bound lease, and its process observer preserves remote identity as Unknown. This should be reused rather than inventing PID/age heuristics.

    Proposed design for signoff:
    1. Introduce strict implementer admission at the existing shared CAS boundary, keyed by the resolved canonical spec identity (aliases/origin IDs must collide). Preserve separate reviewer coexistence semantics.
    2. Reserve before creating a lease/tree; bind the reservation to an invocation and then to the exact successor lease/worker generation. Publish host, process identity, lease and launcher breadcrumbs so refusals identify the real holder. An ephemeral CLI PID must not authorize worker takeover.
    3. Live and Unknown both refuse a second launch, with or without force-claim. TTL, missing evidence, network failures, PID namespaces and same-clone identity confer no takeover authority. Force-claim permits takeover only with exact-holder positive death evidence; existing dirty/unpublished-work protections remain.
    4. Authorized resume/phase handoff must compare the exact prior generation, not bypass using orchestrator detection or clone equality. Keep compare-delete rollback and receipt retention through actual spawn. Do not let a losing launch release the winner's claim.
    5. For a remote unreachable/dead host, default to retained Unknown until a trusted holder-bound release/death receipt is available; no automatic TTL reclaim. This changes current outage/recovery behavior and needs an explicit operator decision. The alternative is a separately reviewed remote death-attestation mechanism, not an SSH probe or an invented heartbeat proof.
    6. Decide deployment behavior for absent/unreachable shared origin and legacy unbound claims: strict refusal plus explicit reconciliation is the safe default. Existing best-effort local-only fallback contradicts global exclusion.

    Validation required after approval:
    - two contenders against one shared remote, both with force, exactly one winner;
    - same-clone second invocation, different vendors/launchers, aliases of one spec;
    - remote live/unknown claim older than TTL still refuses;
    - force plus positive local death allows takeover, unknown never does;
    - in-flight pre-lease reservation cannot be stolen when the starter exits;
    - exact-generation resume and phase handoff work, unrelated launches do not;
    - failed prepare/spawn and rejected CAS preserve winner ownership;
    - missing/malformed evidence and unavailable store refuse strict admission;
    - diagnostics include host, worker PID, lease and launcher;
    - reviewer coexistence and existing unpublished-work recovery remain protected.

    Implementation not started: this changes the shared lease lifecycle and failure policy. Request master/advisor signoff on strict fail-closed admission and remote/legacy reconciliation before changing the protocol. No cargo test was run; untested=true. No repository files changed. The reviewed codegraph executable supplied in AGENTS.md (/home/joe/ai/aida/.codegraph/proxy-state/bin/codegraph) is absent; aida doctor check codegraph reports missing. Navigation used rg.
