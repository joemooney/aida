title: aida do <spec> refuses on the git-canonical backend — 'Command not yet supported for git backend' (wired only into legacy dispatch)
description: 'Observed 2026-07-18, first real-world invocation of the TASK-1155 verb: aida do TASK-1156 in this repo (git-canonical storage) exits 1 with ''Command not yet supported for git backend''. TASK-1155 wired Command::Do only into the legacy centralized dispatch (main.rs); handle_git_backend_command has no arm for it, so it falls into the catch-all refusal. Fix: mirror the Zen arm in git_backend_cmd.rs — construct Storage from store_path and delegate to run_do_drive. Acceptance: aida do <SPEC> on a git-canonical project launches the through-ci drive; regression coverage in the git-backend dispatch.'
