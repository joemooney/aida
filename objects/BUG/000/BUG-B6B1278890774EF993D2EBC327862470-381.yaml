title: Fast-tier Ratchet set step times out at 12 minutes and turns every PR red
description: 'Since 09b509f (STORY-2833, 2026-11-15 01:36) the fast compile job runs scripts/check-ratchets.py with timeout-minutes 12. Its cargo test batches now take 10-12 minutes, so docs/cli/verify-manual.py starts with about a minute left and is killed (''The action Ratchet set has timed out after 12 minutes'') after every ratchet test passed. Seen on #4126, #4116 and others; no PR eligible since 17:01 MST 2026-11-15. Acceptance: the step timeout is 25 minutes; a follow-up decides whether to split verify-manual into its own step or speed up the set.'
