title: write_typed_hold overwrites an existing hold, so a Recusal hold can be silently replaced by a Rework hold
description: |
  Found by the strict independent review of TASK-1529 (2026-09-27), non-blocking for that spec but it silently drops a gate.

  `write_typed_hold` at lib.rs:103106 overwrites any existing hold for that PR. A pre-existing Recusal hold carries recused principals and a target head sha; replacing it with a Rework hold discards that gate, and recusal exists precisely to stop the wrong party merging. Reachable once the PR is judged ours.

  Also noted at the same site: `typed_hold` is called with `spec: None` even though the record has a spec field and the detail string already embeds the spec ID.

  Acceptance:
  1. Placing a hold never discards a hold of a different kind. Either holds compose, or a conflicting write refuses and reports, but a Recusal hold must survive.
  2. A fixture test proves a Recusal hold is still in force after a Rework hold is attempted on the same PR.
  3. The hold record carries the spec in its spec field rather than only inside the detail text.
