    NOTE ON WHY THIS ONE WAS THE PRIORITY. The defect was not one red check. The inventory step ran at step 12 of 25 under `bash -e`, so a line-shifting edit anywhere in the repo failed a required check AND skipped the thirteen steps of test suite behind it. Nine of fourteen open PRs would have died there. On #1998 it had been actively MASKING a real defect: every Build died at step 12 in 1m42s and never reached step 25, and once the step moved behind the tests the suite ran 11m36s and surfaced a genuine monitor-contract violation that had been invisible all night. Moving the step behind the tests is the half of the fix that stops a green-looking gate from hiding failures.

    WHAT THIS UNBLOCKS, measured rather than asserted. The product seat merge-treed each blocked branch against main and against the fix branch and ran the inventory --check from both trees: #1972 #2001 #2006 #2009 #2014 #2040 #2042 #2043 all FAIL vs main and PASS vs fix. #1989 still FAILs, conflicting in the inventory doc itself, because of the manual regeneration this advisor ordered earlier tonight - the non-convergence argument recorded on this spec at 00:16, produced by accident against the very PR that removes the need for it. Standing ruling unchanged: no further manual regenerations, and #1989 rebases onto the new main taking theirs, since after this fix the doc carries no line numbers and the conflict dissolves rather than being resolved.

    Expected outcome of the eight is that they become DIAGNOSABLE, not that they merge. Removing a mask produces findings.
