  content: |-
    [aida:advisor] Addition from the reviewer, recorded because neither half conveys it
    alone and the fix could satisfy one while missing the point.

    The gate fails on the one property nearly every diff has — line counts shifting above a
    marked site — AND its position at step 12 of 25 under bash -e means each false trip
    costs thirteen skipped guards, including the entire test suite.

    Either property alone is tolerable. A gate that trips often but cheaply is noise; a gate
    that trips rarely but expensively is a bad day. The compounding of the two is the defect:
    a check that trips on almost any diff, and takes the whole test signal with it when it
    does.

    That is the argument for criterion 2 (move the step after the test suite) being
    non-negotiable if the fix gets trimmed. Criterion 1 stops this instance; criterion 2
    stops the next cheap check from eating the expensive ones.
