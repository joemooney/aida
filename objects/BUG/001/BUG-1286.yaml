id: 01a0bb7d-1b68-7741-a94c-ef572887bc65
spec_id: BUG-1286
agreed_id: BUG-1286
title: 'Terminality is positional in the event feed, so a consumer cannot tell a shipped spec from a stuck one: trailing phase events bury PrMerged, and specs closed outside a drain emit nothing at all'
description: |
  The event feed never records that a spec shipped. A spec emits RunStarted, PhaseEntered, CiTerminal, PhaseDonePr and SpecShelved, but nothing when it reaches Completed. The requirement record updates in the store and the cache; the feed does not.

  MEASURED 2026-09-19 against this repo's .aida/events.jsonl (514 closed specs that appear in the feed):

    last event for a CLOSED spec      count
    PhaseDonePr                         219
    UnshippedWorkDetected               205
    SpecShelved                          76
    PhaseEntered                         11
    AdvisorEscalated                      1
    PuntFiled                             1
    PrMerged                              1

  Exactly one closed spec in the entire history ends on a terminal event. Eighty-eight end on an event that asserts the spec is mid-flight or failed. Two worked examples: TASK-1285 is Completed and its last event is SpecShelved at 12:46 on 2026-09-19; BUG-1207 is Completed and its last event is SpecShelved at 07:39 on 2026-09-18.

  There is no SpecCompleted or SpecMerged event kind at all. The feed has twelve kinds and none of them is terminal for the spec.

  IMPACT, and it is not only cosmetic. Any consumer that reads the feed as the record of what happened concludes that shipped work is stuck: the aida-monitor project, built against this repo, reported TASK-1285 as stuck in round 1 for fifteen hours while it had merged hours earlier. Worse, any success rate, rounds-to-merge or drain-outcome metric computed from the feed is wrong in the same direction — it counts a shelve that was later recovered as the final outcome. That includes the measurements EPIC-62 is using to decide whether reliability is improving.

  The gap opens specifically where the closing transition happens OUTSIDE the drain: a batch or review PR merges several child specs, or `aida pull` auto-bumps Done to Completed when a trailered commit lands on main. The drain emits events; the auto-bump scanner does not.

  PROPOSED: emit a terminal event for every spec a merge closes, from the same code path that performs the Done-to-Completed bump, so it fires whether the close came from the drain, from `aida pull`, from `aida db reconcile-status`, or from a batch PR that named several specs in its trailer.

  CORRECTION 2026-09-19 (product seat, verified by the advisor; this replaces the acceptance below the line). The original diagnosis said the drain path emits no terminal event. It does. A full stream read of BUG-1234 shipping end to end shows PrMerged fires and is keyed to the spec:

    21:47:58  PhaseEntered idx=4 merge
    21:48:01  PrMerged pr=1975
    21:48:01  PhaseEntered idx=5 pull
    21:48:11  PhaseEntered idx=6 build
    21:50:41  PhaseDonePr pr=1975

  So the 219 PhaseDonePr endings and the 205 UnshippedWorkDetected endings are not missing emissions. They are successful merges whose terminal event was buried by a later spec-keyed event from the trailing phases. This is current behaviour on today's binary, not a dated artifact, which also settles the no-backfill guard favourably.

  That makes this TWO defects, and the original acceptance addressed only the second.

  ON THE ORDERING FORK, THE FRAME WAS WRONG AND BOTH OFFERED FIXES INHERIT THE FLAW. The fork was posed as: either the trailing phases stop emitting spec-keyed events after PrMerged, or a completion event is emitted once pull and build finish. Both assume the invariant "a terminal event must be the LAST event for that spec." That is a POSITIONAL invariant on an append-only log, and positional invariants there are fragile by construction: any crash, retry, re-drive, or future phase breaks it, and it breaks silently. The concrete counterexample is already filed as BUG-1291 — a run that dies between the merge and the end of the run emits no completion event, so under option 2 the last event is PhaseEntered build and the consumer is wrong again, in the same direction, for the same reason.

  The durable invariant is that TERMINALITY IS A PROPERTY OF THE EVENT KIND, NOT OF ITS POSITION. Mark the kinds that mean the spec reached an end state, and the consumer rule becomes "the last event whose kind is terminal" instead of "the last event". That still satisfies the success condition the product seat wrote — a consumer decides whether a spec is finished from the feed alone, with no join against the store — while surviving every case the positional rule does not. It costs one filter on a field the consumer already has.

  A run-completion event is still worth emitting, but for its own sake: it records that pull and build finished, which is real information and is what makes drain-duration measurable. It is NOT the fix for ordering, and it must not be relied on as one.

  ACCEPTANCE (revised 2026-09-19; supersedes the original five)

  1. A terminal event kind exists and is emitted for each spec transitioned to Completed, carrying the spec id, the merge commit and the PR number where known.
  2. Merging a PR whose trailer names three specs emits three terminal events, one per spec, not one for the PR.
  3. `aida pull` auto-bumping a spec emits the event, as does `aida db reconcile-status`.
  4. TERMINALITY IS QUERYABLE BY KIND. Event kinds carry a terminal predicate covering at minimum PrMerged and the new completed kind, and the failed/parked terminals where they genuinely end a run. A consumer can answer "is this spec finished" from the last event whose kind is terminal, with no join against the store. Trailing phase events are NOT suppressed: pull and build genuinely happen and their events are wanted.
  5. A test asserts the predicate directly: given a recorded stream in which PrMerged is followed by PhaseEntered pull, PhaseEntered build and PhaseDonePr, the terminal-kind query returns PrMerged. A second test asserts the crash case: given a stream that stops after PhaseEntered build with no completion event, the query still returns PrMerged.
  6. A run-completion event is emitted when a drain run finishes its trailing phases, recording that pull and build completed. This is additive and no correctness criterion depends on its position.
  7. Backfill is NOT required, but the docs state that events before this change have no terminal record, so consumers do not read the absence as "in flight".
  8. The consumer rule is documented where feed consumers will find it, because the aida-monitor project is being built against this feed right now and will otherwise re-derive the positional rule and inherit the bug.
