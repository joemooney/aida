title: aida agent type picker lists disabled vendors — the enabled-agents profile must gate the picker
description: 'Field report (2026-09-09, codex-only project where aida config show reports claude disabled): the interactive aida agent picker still offered Claude as a launchable agent type. The [agents] enabled profile (project agents.toml/config.toml over machine-global, the same effective resolution config show displays) must gate the agent-type picker: hide disabled vendors by default (or render them dimmed with a disabled marker and refuse selection with a hint naming where to enable), and when exactly one vendor is enabled skip the type question entirely. Same policy on the non-interactive aida agent new <type> path: launching a disabled type refuses with the config location hint. Completes the BUG-898/902/913 family — after this, no launch or display surface can present a disabled vendor as available. Acceptance: codex-only project — picker shows codex only (or claude dimmed-refusing) and skips the question when unambiguous; agent new claude refuses with the hint; regression test on picker option filtering against the resolved profile.'
