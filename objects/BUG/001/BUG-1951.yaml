  content: 'ADVISOR TRIAGE 2026-10-11: APPROVED, high. Verified on main: cached_git_backend.rs add_requirement captures pre_write_head at :1536 before the inner write takes the store lock, and bulk_update (:1296) and bulk_update_atomically (:1340) do the same. The atomic paths lock first (:1379-1380, :1453-1454). The fix shape in the acceptance (capture under the lock, or verify the new commit''s first parent == pre_write_head) is right. Prefer the first-parent check as the belt-and-braces, because it also covers any future path that forgets the lock. SEQUENCING: coordinate with TASK-1717 (#2502, serialize store sync under the writer lock, factory draft). If #2502 merges first, rebase onto it; this bug stays necessary either way, as the description notes. Lane: factory or drain eligible (S–M, local, clear acceptance with a deterministic regression test).'
