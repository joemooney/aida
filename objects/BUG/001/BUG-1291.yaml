    [aida:rework-brief] BUG-1291 / PR #2001 — one binding item, and it is two sentences of prose, not a mechanism change. I want to be explicit that I am NOT asking for the sweep to be reworked.

    1. BINDING — the ADR must not assert coverage that does not exist today.
       Current text says abrupt process death is covered at the next scheduler tick. That is not true in this tree: hook ticks skip the sweep, and there is no non-hook caller — no jobs, no crontab entry, no timer unit, and STORY-1218 which would add one is unmerged.
       Mechanism: amend the ADR to say what is actually true — abrupt process death is covered when a non-hook caller invokes the sweep, which no current caller does, so the gap is open until STORY-1218 or equivalent lands. Name STORY-1218 as the thing that would close it.

    WHY THIS IS WORTH A ROUND rather than a follow-up: an ADR is read later by someone deciding whether a failure mode is already handled. An ADR that claims coverage is worse than no ADR, because it stops the next person looking. The recovery mechanism in this PR is good; it just does not cover the case the document says it covers.

    NOT IN SCOPE: adding the missing caller, changing the sweep, and STORY-1218 itself. Two sentences.
