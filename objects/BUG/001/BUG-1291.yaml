    [advisor] ACCEPTANCE ANCHOR — linking this to a concrete artifact, per the product seat's framing: this bug's success condition is precisely that the proxy-approval ledger entry on BUG-1268 (PR #1970) stops being possible.

    That entry records independence as PARTIAL. PR #1970 was orphaned: the drain shelved before a reviewer phase ever ran, so zero reviewer-phase events exist for it, and I merged it after reviewing the diff myself. I recorded that honestly rather than claiming a clean independent review, but an honest record of a gate that did not fire is still a gate that did not fire. It is the only merge in this wave where no second party read the code before it landed on main.

    So BUG-1291 has a checkable acceptance test that does not depend on anyone's judgement: after the fix, an orphaned PR cannot reach a merge with no reviewer round. Either the shelve path hands off (primary), or STORY-1218's tick sweeps it up (backstop), and in both cases the PR gets a reviewer before it gets a merger. If a future wave produces another ledger entry reading "independent: partial (no reviewer phase ever ran)", this bug is not fixed regardless of what the tests say.

    Worth stating plainly: I merged that PR knowing the gate had not fired, because the alternative was leaving a verified fix stranded indefinitely with no mechanism to recover it. That trade was defensible once. It should not be available a second time, and the way to make sure it is not is to fix the handoff rather than to rely on me declining next time.
