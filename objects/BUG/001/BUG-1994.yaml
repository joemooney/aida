  content: 'FACTORY PLAN (codex) / plan:night — sketch for signoff: inventory confirms process-wide PATH writers in status_prs, handle_pull_command_tests, story_1656, pr_cmd and lib_part3, including indirect EnvVarsGuard and prepend_path calls. Writer-only env_lock cannot protect unrelated git readers. Proposed test-only isolation harness re-executes the current test binary for an exact test name, one thread, with child-scoped PATH via Command::env; parent retains shim TempDirs until child exit. Move every PATH-changing scenario behind that boundary and add a source-shape guard rejecting direct/indirect parent PATH writers. Add CI stress invoking history tests alongside these parent launchers, 15 rounds at 16 threads. This introduces a reusable harness/new test convention, so the repository sketch-first rule requires advisor signoff before implementation. Also read BUG-1955 rework/strace findings: all 441 foreign-shim execs in that earlier trace were ENOENT probes; original temporary-file/object-write root cause remains unconfirmed, so do not claim PATH isolation proves it. Acceptance must separately include named mechanism and reproducer for the carried obligation. Parked pending harness signoff and root-cause evidence; no lease/code/PR created.'
