  content: 'Reviewer of #2560 notes the two lib git shims (status_prs.rs:3588, handle_pull_command_tests.rs:675) exec the real git. The PATH leak therefore probably can''t cause git-internal errors; the exit-127 failures likely come from a shim whose directory was deleted mid-exec. The acceptance criteria still stand (process-wide PATH mutation is the hazard), but verify the mechanism before fixing.'
