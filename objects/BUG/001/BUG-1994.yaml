title: Tests that prepend a fake git to the process-wide PATH leak into concurrent tests (history.rs git calls get fake git / exit 127)
description: |-
  Found by the BUG-1955 implementer (PR #2560) via strace: several aida-cli-lib tests (e.g. status_prs, handle_pull_command_tests, story_1656) prepend a temp-dir fake `git` to the process-wide PATH. Concurrent tests then run that fake git — including against other tests' repos and in history.rs code under test. In a 15-round stress run at 16 threads, task_1507 history tests (max_commits_window_parity, rebuilds_on_*) failed 10 times with 'events differ' or 'git log exited with exit status: 127'. PR #2560 only fixes the fixture's own git calls.

  ## Acceptance
  - Tests needing a fake git inject the binary path (or a scoped env) instead of mutating the process-wide PATH, OR every PATH mutator and PATH-sensitive test serialises on the shared env lock.
  - A source-shape guard forbids new unguarded `set_var("PATH"` in tests.
  - 15 rounds x 16 threads of the history tests alongside the PATH mutators pass with zero failures.
