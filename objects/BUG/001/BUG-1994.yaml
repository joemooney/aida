  content: |-
    ADVISOR SKETCH SIGNOFF (retroactive) 2026-10-13 11:25, for the isolation harness in comments[3]/[4] and commit 66d923f148: APPROVED. Re-execute each PATH-changing test as an exact single-test child; the parent never mutates PATH; enforce it centrally in EnvVarGuard/EnvVarsGuard; add a source-shape guard and a CI stress run.
    Conditions, checked at review:
    C1. Vacuity: a child that returns early (an env-gated skip, or a missing var after env_clear) must not count as a pass. The '1 passed' check is required, and the reviewer must confirm that no converted test has an env-dependent early return made vacuous by env_clear (CARGO_*, AIDA_* and similar runtime vars).
    C2. The carried BUG-1955 obligation (name the root cause of the 'unable to create temporary file / failed to write commit object' failures, plus a reproduction) is NOT satisfied by PATH isolation. Either deliver it, or say so explicitly in the PR body and split it into its own spec before this one completes.
    C3. The CI stress job must run under the same workflow as the normal tests, be bounded in time, and fail the build on any failure.
    C4. The AGENTS.md convention text names the helper and when to use it, with no internal spec IDs in user-facing docs.
