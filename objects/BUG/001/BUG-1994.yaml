  content: 'FACTORY PLAN (codex): Proceeding under the operator/advisor continuation instruction with the posted isolation sketch. Inventory also found PATH mutations in session terminal-title tests, upgrade-release finish-CI tests, and real-phase-driver merge tests, beyond the original three modules. Re-execute every PATH-changing test as an exact one-test child; parent never changes PATH. Enforce that boundary centrally in every EnvVarGuard/EnvVarsGuard PATH mutation (including restoration snapshots and indirect prepend helpers), preserving original function assertions. Add a function-scoped source-shape guard for raw PATH setters and aliases, a live fake-git/real-parent-reader regression, and 15 mixed history/PATH-mutator rounds at 16 threads in CI. Validate child test count so re-exec cannot silently no-op. Risks: hidden indirect callers, inherited HOME/git identity, nested env locks; use child-local HOME/config and retain fixture lifetimes through wait. The earlier BUG-1955 trace retracted its foreign-shim claim; original object-write error remains unconfirmed and will be reported separately from proven PATH isolation. All Rust test/stress execution on GitHub CI; full make check-ci-fast before every push.'
