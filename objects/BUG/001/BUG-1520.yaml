spec_id: BUG-1520
agreed_id: BUG-1520
title: aida list --fields is silently ignored AND unvalidated under --format json, and the JSON projection spells the type key req_type while every other surface spells it type
description: |-
  Measured 2026-09-20 21:45 on the reviewer seat, against main at 0b474a66d1.

  aida list --fields behaves three different ways across the three output formats.
  Selection and validation both work on two of them and silently do nothing on the
  third, and the third is the one machine consumers use.

    format   --fields id,type              --fields id,zzz (bogus)
    human    applied                       rc=1, error names the valid set
    toon     applied: specs[30]{id,type}   rc=1, error names the valid set
    json     IGNORED: 145 rows, 8 keys     rc=0, no error, full rows returned

  Exit codes captured by redirecting to a file, not through a pipe.

  Second, smaller defect with the same cause: the JSON projection spells the type
  key req_type, while --fields, the human header and the TOON header all spell it
  type. So a consumer that asks for the documented field name and reads the
  documented key gets nothing back, twice over: --fields id,type is ignored, and
  reading the key "type" off each row yields null.

  That double miss is not hypothetical. Two seats independently concluded this
  evening that aida list --format json carries no type field at all. It does - it
  is req_type, populated on all 145 rows (Bug 75, Task 30, Story 36, Spike 2,
  Epic 2). The wrong conclusion was reached because the flag was ignored without
  complaint and the key was not where the other two projections put it. A fix that
  took that report at face value would have added a field that already exists.

  Why it matters beyond the papercut: STORY-1352 declared a versioned read-only
  monitor contract over the --json surfaces so an external dashboard cannot break
  silently. This is a live instance of one of those surfaces disagreeing with its
  siblings about both a flag and a key name, and doing so with exit code 0.

  Acceptance

  1. aida list --fields id,zzz --format json exits non-zero with the same
     unknown-field error the human and TOON paths emit. The validation runs before
     the format branch, so no format can skip it.
  2. --fields NARROWS the JSON projection exactly as it narrows TOON. Product
     disposition, resolving the fork this criterion left open: the flag exists so a
     consumer can ask for a smaller payload, and the JSON consumer benefits most --
     this surface returns roughly 60KB unnarrowed. Rejecting the flag would make the
     machine surface the only one unable to do the thing the flag is for. Narrowing
     does not breach the monitor contract, because it happens only on request.
  3. The JSON rows emit BOTH keys: req_type is RETAINED and type is added
     alongside it with the same value. Product disposition, narrowing this
     criterion: a straight rename is NOT acceptable. STORY-1352 declared this a
     versioned read-only monitor contract precisely so an external dashboard cannot
     break silently, and any consumer written against req_type today breaks on a
     rename -- the exact failure the contract exists to prevent. Verified that
     aida list --json and aida list --format json return an identical payload, so
     this surface is inside that contract. Retiring req_type later is a deprecation
     with a version bump, and is not this bug.
  4. A test covers all three formats for one bogus field and one valid narrowing,
     so a future format cannot be added that skips the check.

  Related: BUG-1289 (the json flag returning human text on aida status and TOON on
  aida ps) is the same family on different verbs - the format flag not meaning the
  same thing everywhere. STORY-1352 is the contract this violates.

  PRODUCT DISPOSITION 2026-09-20 (product seat). Re-measured independently before
  refining rather than taking the report as given: aida list --fields id,zzz gives
  rc=1 on human and toon and rc=0 with full rows on json, and the row keys are
  blocked, in_flight, queued, req_type, spec_id, status, tags, title. The
  reviewer's measurement holds in full. My own earlier claim that the JSON surface
  carried NO type field was wrong, which is why criterion 3 now forbids the rename
  rather than permitting it -- the same misreading would be handed to a consumer.

  NOT APPROVED BY ME: promoting Draft to Approved needs advisor authority, and the
  gate refused. Left in Draft for advisor triage. Criteria refined, disposition
  recorded, decision not taken.

  FIFTH INSTANCE FOUND WHILE DISPOSING THIS, same family, worth folding in or
  splitting out: aida show BUG-1520 --full --format json returns HUMAN TEXT with
  exit code 0, not JSON. So the format flag is unhonoured on aida show as well as
  being unvalidated on aida list. That is three verbs now -- aida status and
  aida ps in BUG-1289, aida list here, aida show newly.
