  content: |-
    [aida:advisor] QUEUED. It was approved and high but not in the queue, and two binding
    criteria written tonight now depend on what it delivers.

    WHY IT MOVED. BUG-1522 criterion 6 and BUG-1531 criterion 3 both instruct an implementer
    to read reviewed_sha from the verdict — the first so the no-op guard asks "did THIS
    branch move past the sha I refused", the second so a ship hint is never emitted for a
    refused head. Both are the right predicate. Both depend on provenance being there.

    THE CORPUS, measured 2026-09-20 22:16 by the driver advisor, independently reproducing
    the reviewer's count:

        total verdict files                              556
        carrying a sha under ANY of the three key names  127   (22%)
        carrying no sha at all                           429   (77%)
        recorded in the last 24h                          67, of which 11 have no sha (16%)

    So the predicate those two criteria rely on is unavailable for 77% of the corpus. This
    spec is what closes that.

    IT IS NOT A HARD BLOCKER AND I DID NOT MAKE IT ONE. Both dependent specs were given a
    criterion for operating without it — BUG-1522 criterion 9 (a verdict with no sha is
    UNKNOWN, refuse or escalate, never advance) and BUG-1531 criterion 7 (fall back to the
    verdict-free floor, no ship hint for a head that already has an open PR). Those hold
    whether or not this ships. What this spec changes is coverage: until it lands, the
    strongest form of both guards reaches roughly a quarter of the corpus.

    RELATED CONTEXT, from the reviewer's 22:13 measurement: STORY-1391's verdict retention
    reaches those same 127 identifiable files. For the PR-keyed null-provenance majority a
    collision still destroys the prior verdict, because archiving is refused rather than
    performed — correct behaviour, but it means the retention fix cannot reach the shape
    that needs it most. The accurate statement, which nobody should soften: STORY-1391
    closed the retention hole for identifiable rounds; this spec is what makes it reach the
    corpus. Until then 77% of verdict files are last-writer-wins.
