    [aida:advisor] ONE-LINE ADDITION, rehomed here because identity-of-verdict is this spec's subject. PR #2029 (now redundant, closing) carries one assertion main's equivalent test lacks:

        assert_eq!(verdict.reviewed_sha.as_deref(), Some("abc123"));

    main's pr_keyed_reviewer_verdict_arms_rework_guard asserts the returned verdict's KIND is RequestChanges; it does not assert WHICH verdict was returned. Given this spec is entirely about reviewed_sha being unchecked — the gate matches only on Approved and never compares the sha, and 452 of 481 PR-keyed handshakes carry no recorded_by at all — a test that pins the returned verdict's identity rather than only its kind is directly aligned with the fix.

    Add it to the existing test rather than creating a new one. It is one line and it makes the existing test assert the property this spec is about.
