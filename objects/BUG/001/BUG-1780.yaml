id: 01a0fe9b-ec4b-74d1-8ad5-edd6d343d120
spec_id: BUG-1780
agreed_id: BUG-1780
title: 'aida pull code leg races concurrent fetches on FETCH_HEAD and obeys user pull.rebase: ''Cannot rebase onto multiple branches'', auto-bump skipped, misleading recovery hints'
description: |
  ## Summary

  `aida pull`'s code leg runs `git pull --ff-only`, which (a) obeys the user's
  global `pull.rebase=true` and takes the rebase path, and (b) merges from
  FETCH_HEAD. FETCH_HEAD is a single shared file per checkout: when another
  process fetches concurrently (another agent session's `aida pull`/`git fetch`,
  the codegraph refresh timer), it can transiently hold multiple for-merge
  entries, and the pull dies with:

      fatal: Cannot rebase onto multiple branches.
      Error: aida pull: code leg failed (exit status: 128 on branch main)

  Observed 2026-10-02 ~14:45 on the operator's checkout: five back-to-back
  `gh pr merge && aida pull` steps; pulls 1-2 succeeded, pulls 3-5 failed with
  the above while a relay session was also fetching the same checkout. Config
  was verified clean (exactly one `branch.main.merge` = refs/heads/main, one
  fetch refspec), so the shipped recovery hints ("diverged branch",
  "untracked-file conflict") were both wrong for the actual cause, and the
  operator was sent chasing a config bug that did not exist.

  Consequence beyond the error: each failed code leg skips auto-bump, so merged
  specs sit In Progress until some later successful pull (they did fire later —
  the queued-bump note is honest — but the fleet reads stale status meanwhile).

  ## Acceptance sketch

  1. The code leg stops depending on FETCH_HEAD for-merge state and the user's
     pull.rebase: e.g. `git fetch origin <branch>` then
     `git merge --ff-only origin/<branch>` (remote-tracking ref, race-immune),
     or take the repo's single pull/drain lock around the leg.
  2. A concurrent-fetch test witnesses the failure against the shipped command
     shape and passes after (mutation-proven both directions).
  3. The recovery text names the concurrent-fetch cause with "re-run aida pull"
     as the first suggestion, ahead of the diverged/untracked cases.
