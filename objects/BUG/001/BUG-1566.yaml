  content: |-
    [aida:advisor] DETERMINED AS ADR-52: THE FLOOR'S SUBJECT IS ATTRIBUTABLE INDEPENDENT ASSENT, NOT A TTY — AND THAT CHANGES WHICH SURFACE IS THE DEFECT.

    This spec is framed as an asymmetry to be closed, with its own comment warning that a naive TTY check on ship would break the deliberate act BUG-1167 exists to support. That warning is right and it points at the answer: THE FIX IS NOT TO ADD A TTY CHECK TO SHIP, IT IS TO REMOVE THE TTY CHECK FROM CLEAR. `pr ship` is closer to correct in SUBJECT (explicit, attributable) and incomplete in ENFORCEMENT (no independence check, no recorded reason). `merge-hold clear` states the rule wrongly.

    THE EVIDENCE THAT SETTLED IT, and it arrived by the floor being obeyed rather than reasoned about. claude-reviewer-1 placed a hold on #1978 when refusing it, discharged its own finding, approved at 3c194f59c4, and could not clear its own hold. It then DECLINED the `pr ship` route it knew would work, in its own words: 'A known bypass is not authorization - if it were, the floor would mean nothing.' So the floor is enforced against the seat asking honestly and not against the seat taking the other route. A rule with that property is not a floor; it is a detour everyone takes.

    FOUR BYPASSES ON 2026-09-21 ALONE (#2033, #2042, #1999, #1978 pending), every one disclosed in the ledger, every one satisfying the floor's PURPOSE while evading its MECHANISM. That count is the argument: a mechanism bypassed four times in a day by the seats it governs, each time for a good reason, is mis-specified rather than under-enforced.

    THE FOUR PROPERTIES BOTH PATHS SHOULD GATE ON: explicit (not a side effect of a phase advancing), attributable (names the clearing seat), INDEPENDENT (the clearing seat is not the author of the held work), recorded (the act and reason survive the session). A TTY delivers only the first, and only by correlation; it excludes every non-interactive seat regardless of authority; and it fails open through ship.

    INDEPENDENCE IS THE PROPERTY MOST WORTH ADDING AND IS ABSENT FROM BOTH PATHS TODAY — nothing stops the author of held work from clearing the hold on it. That is a larger hole than the TTY asymmetry this spec was filed for.

    Raising to high: it is no longer a papercut about two inconsistent code paths, it is the governing rule for every merge-hold in the system and it is currently costing a disclosed bypass per merge.
