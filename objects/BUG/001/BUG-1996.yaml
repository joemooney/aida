  content: 'ADVISOR RULING 2026-10-13 (on merge-review item 4 for PR #2594): acceptance item 1''s ''aida queue done'' means the queue-done COMPLETION path, `aida queue advance` closing a parent through transition_to_completed(..., "queue-done", ...). It does not mean the plain `aida queue done` flip to Done, which runs before the merge and must stay silent. The bar is the #2594 round-1 findings: no warning on plain queue done (pinned by a test), and binary tests on the queue advance close path for a warning with nothing shipped, silence with doctor:no-code, and silence with a shipped commit.'
