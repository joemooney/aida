title: aida queue done does not print the completion linkage warning
description: |
  Follow-up from BUG-1958 (PR #2572). `aida queue done` (aida-cli-lib/src/queue_cmd.rs, the `crate::completion::transition_to_completed(..., "queue-done", ...)` call) completes a spec without calling `shipped_linkage::warn_if_completed_without_shipped_commit`. `aida edit --status completed` (STORY-1649) and `aida done` (BUG-1958) both print the warning.

  ## Acceptance

  1. When `aida queue done` moves a code spec into Completed, it calls `shipped_linkage::warn_if_completed_without_shipped_commit`. The warning goes to stderr and never refuses.
  2. A binary test shows the warning for a spec with no shipped commit, and no warning for a spec tagged `doctor:no-code` or one with a shipped commit.
