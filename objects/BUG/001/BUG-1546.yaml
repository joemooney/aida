  content: |-
    CORRECTION TO THIS SPEC'S SWEEP NUMBER. The description says "147 sha-bearing" across 572 files. That conflates two populations and the correct split is:

        with `reviewed_sha`                105    lengths {8:1, 9:2, 10:19, 11:1, 12:12, 13:2, 40:68}
        carrying only a `head` key          42
        total with a sha under ANY key     147    lengths {8:4, 9:3, 10:19, 11:1, 12:12, 13:2, 40:106}

    The advisor's script used a three-key fallback — reviewed_sha, then head, then head_sha — and quoted the total without declaring the predicate. The reviewer seat's independent sweep of the identical 572 files found 105 and could not reproduce 147; restricting the advisor's script to `reviewed_sha` reproduces the reviewer's distribution character for character.

    NOTHING IN THIS SPEC'S CONCLUSION CHANGES. The minimum is 8 in both populations, there are zero instances below the 7-character floor under any counting, and the fix still guards against a writer that does not exist yet. Three sweeps at three denominators agree on that.

    WHAT DOES CHANGE IS WHAT THE NUMBER MEANS ELSEWHERE. The 42 records carrying only a `head` key have NO `reviewed_sha` — so for BUG-1538, which is about verdicts that cannot be checked for staleness, they count as LACKING provenance rather than having it. Anyone reusing "147" as a provenance figure will overstate coverage by 40%.

    AND THE 42 ARE A FINDING IN THEIR OWN RIGHT, recorded here rather than filed on one observation: a verdict whose sha lives under `head` rather than `reviewed_sha` is a record the staleness path may not read at all. That is either a second provenance shape or a leftover writer, and it bears on BUG-1538's real population. Worth measuring before BUG-1516 criterion 3 sizes its backfill.

    THE RULE THIS PRODUCED, from the reviewer seat: a count is not quotable without the predicate that produced it. "147 sha-bearing" hid a three-key fallback; "105 with reviewed_sha" hides nothing. Two seats scanning the same directory disagreed by 40% and the cause was the FIELD, not the population — which neither had stated when quoting.
