title: 'Contained cache binds pin an inode: detect a deleted or replaced cache.db-wal/-shm under a running contained session'
description: |
  Follow-up D3 from the advisor review of PR #2541 (BUG-1929). Claude Code's Linux sandbox binds each allowWrite file as an inode, not a name. When the host deletes or replaces <main>/.aida/cache.db-wal or -shm while a contained session runs (remove_corrupt_cache_files, quarantine_cache_files in aida-core/src/db/cache.rs, or an older binary that does not persist the WAL), the session keeps writing to the deleted inode, or the two sides use a split WAL/shm.

  The cache is derived data, so this is not a data-loss bug, but the split is silent.

  ## Acceptance

  - When the cache is opened from a contained session, a check runs over the bound sidecars (`cache.db`, `cache.db-wal`, `cache.db-shm`): if any open/bound file has link count 0 (`st_nlink == 0`), or its `(dev, ino)` differs from a fresh `stat` of the path where both are visible, the open fails with an error naming the file and the recovery (restart the contained session).
  - `aida doctor` reports the same condition as a finding (category under cache health) when run in the affected session.
  - Unit test (Unix): open a cache, unlink and recreate `cache.db-wal` behind it, assert the check reports it; a second case unlinks `cache.db-shm` without recreating it (link count 0).
  - Uncontained sessions are unaffected (no new failure on the normal host path; existing cache tests pass unchanged).
