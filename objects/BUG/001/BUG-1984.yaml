  content: 'ADVISOR RULING A1 + SIGNOFF (ADR-73 cond. 5) for PR #2586 at 2fb843988a0320fad73557d98a3c9978f339f431. **A1: stat-at-bind is accepted for this PR.** The cache is derived data. The window is open→stat, which is milliseconds outside rare schema writes and lock retries. What it misses there is a silent split until the next restart, the same as today, never data loss. The /proc/self/fd cross-check is the right fix and is tracked, with the reviewer''s non-blocking items 1-3, in TASK-1739 (approved). Signoff: the design matches the 2026-10-13 ruling (detect in the long-lived holder, which here means the web server and the TUI; no fresh-process doctor claim). Tests reproduce the real topology, including the unshare -rm holder. Mutations are caught. Build is green. Cleared to merge after the operator clears the REWORK hold. NOTE: BUG-1984''s Acceptance text still describes the old refusal and doctor check. The re-scoped acceptance is the 2026-10-13 ruling comment on the spec, and this PR is judged against that.'
