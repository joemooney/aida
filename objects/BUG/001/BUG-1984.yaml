title: 'Contained cache binds pin an inode: detect a deleted or replaced cache.db-wal/-shm under a running contained session'
description: |-
  Follow-up D3 from the advisor review of PR #2541 (BUG-1929). Claude Code's Linux sandbox binds each allowWrite file as an inode, not a name. When the host deletes or replaces <main>/.aida/cache.db-wal or -shm while a contained session runs (remove_corrupt_cache_files, quarantine_cache_files in aida-core/src/db/cache.rs, or an older binary that does not persist the WAL), the session keeps writing to the deleted inode, or the two sides use a split WAL/shm.

  The cache is derived data, so this is not a data-loss bug, but the split is silent. Acceptance: a contained session's cache open fails loudly when a bound sidecar's link count is 0 or its inode no longer matches the path, and aida doctor reports the condition. A test covers both.
