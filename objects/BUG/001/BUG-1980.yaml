title: 'Flaky: auto_complete drain_caps_inactive_drains_normally returns MaxReached instead of Drained under load'
description: |
  aida-cli-lib/src/auto_complete.rs:11856: assertion left==right failed, left: MaxReached, right: Drained. Seen once during lib-split proof runs (two concurrent cargo test --workspace lanes, load ~8–11) at 1b6c3aecda. A full re-run at the same tree passed. The test likely has a time-based cap that a slow host hits before the drain completes. Log: /tmp/libsplit/fail2/test-doctor_root.log.

  ## Root cause (groom, 2026-10-11)
  Not a time cap: `DrainCaps::default()` has every cap `None`, so the cap check never runs. `drain_batch_with_caps` also returns `MaxReached` when `crate::drain_cmd::stop_requested_from_env()` is true, and that function reads the process-wide `AIDA_DRAIN_STOP_FILE` env var. The sibling test `drain_stop_request_stops_before_next_spec` sets that var (under `test_env::EnvVarsGuard`, which holds the env lock) and writes the stop file. `drain_caps_inactive_drains_normally` and the other `drain_batch*` tests read the var without taking the env lock, so a parallel run sees the sibling's stop request and stops with `MaxReached`. `drain_cmd::install_stop_request_env` also calls `std::env::set_var` on that var directly.

  ## Acceptance
  - Drain-loop tests cannot see another test's stop request: either the stop-file path is passed into the drain loop (or the driver) rather than read from the process env, or every test that runs the drain loop holds `test_env::env_lock()` with the var cleared.
  - No test leaves `AIDA_DRAIN_STOP_FILE` set after it finishes, and any test that calls `install_stop_request_env` restores the var.
  - A regression test runs a drain while a stop file is set for a different project root and asserts `Drained`.
  - `cargo test -p aida-cli-lib drain_ -- --test-threads=16` passes 50 consecutive runs.
