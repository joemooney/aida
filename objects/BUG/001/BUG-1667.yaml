title: 'An agent can switch every later agent launch to bypass: ''aida config permissions set bypass'' has no human-at-TTY check'
description: |-
  Found by the TASK-1500 architect sketch; orchestrator verified: handle_config_permissions_command (aida-cli-lib/src/config_cmd.rs) writes the bypass tier after only printing a WARNING, with no terminal / human check. The scaffolded .claude/settings.json allowlists Bash(aida *), so an agent under Claude's normal permission prompts can run it and escalate every subsequent launch without any prompt.

  Acceptance:
  1. 'aida config permissions set bypass' (both --user and --local) refuses without an interactive terminal on stdin/stdout, exits non-zero, writes nothing, and prints a plain explanation.
  2. At a terminal it requires an explicit [y/N] confirmation; N or EOF writes nothing.
  3. 'set native' and 'set contained' (which reduce access) are unchanged.
  4. The config menu / 'config edit' path to the same tier gets the same gate (no second door).
  5. MCP tools cannot reach the bypass write.
  6. Tests with a fake HOME and the injectable terminal check prove 1-5 and that nothing is written on refusal.
