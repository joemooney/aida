title: runaway-seats lists sessions that have ended or gone idle as still_active compaction findings
description: 'Seen 2026-10-11 01:10 local while clearing the watchdog-route seat job. ''aida doctor check runaway-seats'' reported runaway_seats_still_active = compactions:fe2e54bf, compactions:d28185fc and compactions:acdb011f, verdict tripped. fe2e54bf was the product relay''s session; it had finished (TASK_COMPLETE) and its claude process had exited at 00:33. d28185fc''s transcript was last written at 21:07, four hours earlier. Only acdb011f (the factory relay''s session 1, compacted once) was alive. A finding labelled still_active should mean the session is live now; including ended or idle sessions sends the watchdog-route seat on false alarms. Acceptance: still_active only includes sessions whose transcript advanced within the window AND whose process or harness is alive (or a lease or driver says live); ended sessions are reported separately as historical; a test with an ended session''s transcript asserts it is not still_active.'
