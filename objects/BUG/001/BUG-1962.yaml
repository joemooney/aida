  content: |-
    FACTORY PLAN (antigravity):
    - Approach: Per operator decision 2026-10-12 (Option A, wording only), rename still_active to still_tripped and add transcript last-write age to session findings.
    - Files & functions to change:
      1. aida-cli-lib/src/runaway_seats.rs:
         - Rename Coverage.still_active to Coverage.still_tripped.
         - Add last_written_at to SessionAgg (with serde default and fallback to latest minute in s.minutes).
         - Update fold_line and scan_file to record last_written_at from line timestamps or file mtime.
         - In judge(), format transcript last-write age relative to now (e.g., 'transcript last written 4h ago') and include it in each session finding's description.
         - In render_coverage(), reference c.still_tripped.
         - Update all unit tests referencing still_active to still_tripped.
      2. aida-cli-lib/src/doctor_cmd.rs:
         - Rename c.still_active to c.still_tripped and table name runaway_seats_still_active to runaway_seats_still_tripped.
    - Tests to add:
      - ended_or_idle_session_reports_transcript_last_write_age_and_still_tripped in runaway_seats.rs, verifying that an ended session from 4 hours ago includes 'transcript last written 4h ago' in findings and populates still_tripped.
    - Risks:
      - Backwards-compatibility of persisted state: SessionAgg.last_written_at uses serde default and falls back gracefully to s.minutes.
    - Acceptance mapping:
      - still_active renamed to still_tripped: verified by git grep and Coverage field rename.
      - Transcript last-write age included: verified in DoctorFinding summary.
      - Test verifying ended session behavior: covered by new unit test.
