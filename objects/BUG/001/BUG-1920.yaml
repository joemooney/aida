title: filed_at credits 'antigravity' for specs filed from a Claude Code session
description: |-
  Observed 2026-10-10: FAQ-1-232..240, BUG-1918 and BUG-1919 were filed from a Claude Code session (cb4777a7, advisor seat), but filed_at reads 'aida 0.15.0 (a6d9bc8) · antigravity session cb4777a7'. Suspected cause, not yet verified in code: tool detection is influenced by GEMINI_API_KEY in the environment, or by stale antigravity state. Separately, 'faq' works as a type (TASK-1614, alias 'aida faq add') but is missing from the 'aida add --type' help list.

  ## Acceptance
  - Tool attribution prefers the strongest live signal (CLAUDECODE / Claude session env) over API-key presence.
  - Regression test: Claude Code env + GEMINI_API_KEY set → attributed to claude.
  - 'faq' appears in the --type help enumeration.
