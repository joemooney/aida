- id: 01a12b1c-f6f6-7a93-979a-e5be168efd03
  author: joe
  content: 'FACTORY PLAN (night): Split detect_agent_type() in aida-cli-lib/src/agent_registry.rs into a thin env wrapper over a pure detect_agent_type_from_env(vars) so precedence is unit-testable without env mutation. Precedence: AIDA_AGENT_TYPE override > strong live-session markers (CODEX_*, ANTIGRAVITY_*, CLAUDECODE / CLAUDE_CODE_*) > weak vendor prefixes (GEMINI_*, CLAUDE*) > other. Variable names ending in _API_KEY (and _KEY/_TOKEN credentials) are excluded from the scan entirely, so an exported API key never decides attribution. Also add ''faq'' to the ''aida edit --type'' help enumeration (cli.rs). Tests (agent_registry tests module): detect_agent_type_prefers_live_session_over_api_key (CLAUDECODE=1 + GEMINI_API_KEY -> claude), detect_agent_type_api_key_never_decides (ANTIGRAVITY_SESSION_ID + ANTHROPIC_API_KEY -> antigravity; GEMINI_API_KEY alone -> other), detect_agent_type_explicit_override_wins, detect_agent_type_live_marker_beats_stale_weak_prefix (CLAUDE_CODE_ENTRYPOINT + GEMINI_MODEL -> claude). Risks: behaviour change for sessions whose only signal was a GEMINI_*_API_KEY (now ''other''); intended. Acceptance checked via CI running these unit tests.'
