  content: 'Review (strict, d4278e67fb): REQUEST_CHANGES — reproduced false positive: a .gitattributes merge=ours driver makes merge-tree report a no-op for an unshipped edit, so reap would delete the branch. PROXY DECISION: require per-path blob identity for every path the branch changed (merge-tree only as a pre-check); also fail closed on a rev-list error and keep sessions whose worktree HEAD is not on the lease branch. Sent back to the implementer; a new reviewer will re-review.'
