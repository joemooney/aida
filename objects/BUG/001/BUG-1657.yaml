title: aida session reap sees 'no merge signal' for specs landed through batched integration PRs, so finished sessions never reap
description: 'Observed 2026-09-26: aida session reap --dry-run keeps 59 sessions, nearly all ''no merge signal - operator decision'' for specs that are Completed via batched integration PRs (e.g. BUG-1613, BUG-1650: squash-merged inside ''chore(integrate): batch N'' PRs whose body trailers name the spec). The spec branch is neither an ancestor of main nor has its own merged PR, so reap never sees it as merged, and aida ps carries about 50 hidden stale sessions indefinitely. Fix: accept as a merge signal a Completed spec whose completion came from a merged PR trailer (the store records the completing PR/commit), plus zero branch commits whose patch-id is missing from main. Acceptance: (1) a fixture where a branch is squash-merged via a different integration branch with a (SPEC) trailer is reaped; (2) a branch with a commit not on main is still kept.'
