id: 01a0c15e-a65a-74f0-86b8-455a0e05f9d9
spec_id: BUG-1498
agreed_id: BUG-1498
title: The advisor's draft queue is 26 of 39 machine-filed shelve records presented as if a person filed them, so grooming pays a judgment per machine row
description: |
  The advisor's draft queue reads as mostly machine-filed: 26 of the 39 open drafts are auto-drafted shelve records. That part is real and is the cost worth fixing. Three of the premises this was filed on are not, and the correction changes what should be built.

  CORRECTED PREMISES (advisor, measured against the store, 2026-09-20 18:05)

  1. NOT 408 IN THE DRAFT QUEUE. There are 406 machine-filed shelve BUGs in the store and 378 of them are ALREADY REJECTED. Twenty-six are Draft. The 408 figure counts every shelve record ever written regardless of status, and reads as a backlog only if status is ignored.

  2. THERE IS ALREADY A REAPER, AND IT WORKS. `reject_resolved_auto_complete_failure_bug` in aida-cli-lib/src/lib.rs (~line 62273) rejects a shelve BUG when the spec it is about reaches Completed, driven from the auto-bump path and gated by a tag predicate (auto-complete + auto-drafted + failure-*) rather than a title match. The 378 rejected rows are that mechanism's output. Nothing here is unmanaged.

  3. THE DESCRIPTIONS ARE NOT EMPTY. Median length across all 406 is 1477 characters; the shortest is 1191. Each carries the failing command, the phase, the verbatim tool output, the failure kind, and a triage instruction. A sample: "gh merge failed for PR-2014: ... the base branch policy prohibits the merge ... Failure kind: tool-exit". They are not less informative than `findings list`; they carry the same detail plus a stable id.

  4. AND THE 26 DRAFTS ARE EACH ABOUT AN UNRESOLVED SPEC. Thirteen are about a spec now sitting NeedsAttention, two about a spec InProgress, and eleven about a spec at Done and awaiting merge. The eleven self-clear when the merge completes them. The fifteen are the only per-shelve record of work that is genuinely still stuck. So no row in that set is junk, and a bulk rejection would delete exactly the records still doing a job.

  THE BULK DISPOSITION IS DECLINED. Not deferred — declined, on the evidence above. It would reject 15 live records and pre-empt a reaper that already handles the other 11.

  WHAT IS ACTUALLY WRONG IS THE VIEW, NOT THE DATA. Every row is correct and every row is presented to the advisor as if a human filed it. The grooming surface makes no distinction between a spec someone chose to write and a record the machine wrote for itself, so the advisor pays a judgment per machine row. 26 of 39 is a real tax on a real surface. The fix is a lens, not a delete.

  WHAT ELSE SURVIVES: DUPLICATION, AND IT IS LARGER THAN REPORTED. Ninety distinct titles are duplicated across 216 rows store-wide. Among the 26 drafts there are two pairs, not one: BUG-1449/BUG-1473 (phase 3 on BUG-1297) and BUG-1311/BUG-1458 (phase 3 on BUG-1286). A spec that round-trips N times leaves N rows, as filed.

  Acceptance:
  - The advisor's grooming surface distinguishes machine-filed shelve records from human-filed specs. `aida list --status draft` either excludes auto-drafted rows by default or groups them so the human-filed set is readable at a glance; the exact form is the implementer's call, but the test is that an advisor can see the specs a person filed without reading past the machine's.
  - The rows remain reachable. Whatever the default lens does, a flag shows them, because for the 15 unresolved ones this record is load-bearing.
  - A shelve files at most one row per (spec, phase, cause) and UPDATES it on recurrence — a recurrence count or a last-seen timestamp — rather than writing a second indistinguishable row. Existing duplicates may be collapsed by the same predicate that would have prevented them.
  - The existing reaper is left alone or extended, not replaced. If it is extended to fire on Done rather than only Completed, state why that is safe given a Done spec can still fail to merge.
  - NOT IN SCOPE: bulk-rejecting the existing store. Declined by the advisor on 2026-09-20 with the measurement above; a future proposal to do so must first show that the rows it would close are not about unresolved specs.
  - Verification: with the lens in place, `aida list --status draft` shows the human-filed drafts; the machine-filed ones are reachable under a flag and their count is unchanged. Drive one spec to two shelves in the same phase and assert one row, with a recurrence marker, rather than two.
