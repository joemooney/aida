  content: '[advisor:triage] Rejected as an auto-drafted phase record (TASK-266) — but the CAUSE is real and already filed. The failure text is exactly the stranding: ''implementer worktree /home/joe/ai/aida-bug1265 is on bug-1265-work but phase 2 is driving bug-1265 — refusing to push or tear down''. Phase 2''s refusal was CORRECT; the defect is upstream, where the launcher silently forked <branch>-work because the local branch had diverged from its force-pushed remote. Filed as BUG-1270 (approved, drain-safe, queued): fast-forward when merely behind, refuse with the realign command when diverged, never silently fork on a branch backing an open PR.'
