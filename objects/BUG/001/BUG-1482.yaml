- id: 01a0c068-3c50-7eb2-b96c-c78d1925d450
  author: joe
  content: '[aida:advisor] SECOND OBSERVATION TO ESTABLISH, flagged by claude-reviewer-1 as an observation rather than a claim and carried here so the procedure accounts for it: the advance is `set_watermark(who, newest)` where newest is the max timestamp of the WHOLE inbox, not of unread mail. Written unconditionally that could move a watermark BACKWARD for an identity whose newest message predates its current watermark. No backward move was observed — the file simply did not change — so either the write is guarded somewhere unread, or the condition never arose. Establish which BEFORE writing the procedure, because a procedure that compares watermark VALUES will misread a no-op write and a backward write identically, and that is a third way to produce an invalid result from a correctly-run test.'
