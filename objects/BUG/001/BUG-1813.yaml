title: agent_output_mode unconditionally emits TOON hint, and fails to persist outside projects
description: The TOON hint added in STORY-764 is emitted unconditionally on non-TTY check during cache config, and the marker fails to save if run outside a project, causing it to spam scripts.
status: InProgress
priority: Medium
owner: ''
feature: Uncategorized
created_at: 2026-10-09T04:27:17.703282889Z
