title: Deprecation hint for 'aida usage --unused' tells users to run bare 'aida usage unused', which fails without a duration
description: 'Found in the advisor review of PR #2532 (BUG-1949). aida-cli-lib/src/lib_part1.rs ~997 (may have moved in the lib split; rg ''usage unused'') prints a hint to run ''aida usage unused'', but DURATION is required, so the suggested command errors. Fix: hint ''aida usage unused <DURATION>'' (e.g. 30d). Also extend the BUG-1949 docs drift check to flag citations missing a required positional argument, or record why it doesn''t. Acceptance: a test asserts the hint text includes a duration placeholder.'
