title: Rework hold row still prescribes implementer rework after the releasing approval is recorded
description: 'Observed on PR #2364 / BUG-1716 (2026-10-03 ~00:25): round-1 request-changes armed the marker hold at .aida/merge-holds/PR-2364 (target_head 98f3543b). The round-2 APPROVED verdict was then recorded at the PR''s current head 48433c6b (.aida/review-verdicts/BUG-1716/48433c6b....json), satisfying the marker''s own release_condition (''a fresh APPROVED verdict ... then a human ships it''). Yet `aida awaiting` held_prs still shows: reason rework, detail ''CHANGES REQUESTED for BUG-1716 at 98f3543b0c52'', action ''implementer: address the review findings; the hold lifts after approval''. All three are now wrong-state: rework is complete, the approval exists, and the only pending step is the human merge-hold clear. project_held_pr (aida-cli-lib/src/awaiting_you.rs:1304) projects the marker verbatim without consulting the verdict corpus for a satisfied release condition. Expected: when an approved verdict exists at the PR''s current head, the row should flip to something like ''rework approved at <head>; awaiting human: aida merge-hold clear <pr>'' so a reader does not re-dispatch rework that is already done. Human-only clear (integrity floor) is NOT in question — only the stale prescription. Cost: an advisor session spent real time re-deriving that the hold was already satisfied.'
