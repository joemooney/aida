  content: '[aida:advisor] CRITERION 1 IS NOW LOAD-BEARING, not tidy, and one fix is explicitly ruled out. Verified against the live forge on PR #2009 head 065f3df8aa: branch protection requires ["merge-hold-gate","Build (ubuntu-latest)"] with strict=false; the combined status endpoint reports state=pending total_count=0; the only check-run present is merge-hold-gate; and gh pr view reports mergeable=MERGEABLE mergeStateStatus=CLEAN. GitHub itself calls the PR clean while a required check has never run. So deriving the required set from branch protection is not a nicety — it is the ONLY way to notice absence, because neither upstream surface encodes the distinction. strict=false means protection blocks on a reported FAILURE and not on a missing report. RULED OUT: ''defer to mergeStateStatus'' or any other upstream rollup, which is demonstrated wrong here. Found by claude-reviewer-1.'
