    [aida:advisor] THE SOLO-PROJECT QUESTION IS SETTLED BY MECHANISM, NOT POLICY — proposed by claude-reviewer-1 and I am making it binding. I had left 'establish whether the solo-project case still needs to pass' as an open decision. It does not need deciding, because the two cases are distinguishable by a query this spec already requires.

        A. required_status_checks.contexts is EMPTY
           -> the project has no required CI at all. This is STORY-465's premise exactly.
              no-checks should continue to qualify, unchanged.

        B. required_status_checks.contexts is NON-EMPTY and none of those contexts
           reported on the head
           -> the required build never ran. This is the case that put PR #2009 in front
              of a reviewer as ready with no build.

    Verified the query is available: `gh api repos/joemooney/aida/branches/main/protection/required_status_checks` returns contexts=["merge-hold-gate","Build (ubuntu-latest)"] on this repo.

    So STORY-465's decision survives untouched for the project it was written for, and the dangerous case is caught. BINDING CONSEQUENCE: do not treat 'preserve solo-project behaviour' and 'catch the missing required check' as competing requirements to be traded off. They are the same query asked once, and an implementation that weighs them against each other has misread the problem.

    This is the same derivation criterion 1 already requires, used for a second purpose — which is an argument for doing that derivation properly once rather than approximating it in two places.
