- id: 01a0c3ea-ba99-7890-83d2-18f38766efc9
  author: joe
  content: 'PRIN-7 names this bug as one of its two enforcement paths. The principle is that merge-readiness is a CONJUNCTION of two independently-falsifiable predicates - every REQUIRED check passes, AND a recorded verdict names the CURRENT head - and that a surface must report them separately because neither implies the other. This spec is predicate 1: the required-check set derived from branch protection, with ABSENT treated as not-pass. BUG-1466 is predicate 2. Both were falsified separately on 2026-09-21 by different mechanisms - #1998 failed predicate 1 with predicate 2 holding (a classifier gate aborted before the tests, so the Build result said nothing about the code either way), #2048 failed predicate 2 with predicate 1 holding (every required check green against a head no reviewer had seen). Neither failure would have been caught by the other predicate''s check.'
