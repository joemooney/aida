  content: '[aida:advisor] CRITERION 5, partial answer from this seat''s own merges — audited before asking anyone else to. All four PRs I merged today carried Build (ubuntu-latest) on the merged head: PR-1976 f1c2b5e6, PR-1986 d941fadc, PR-2016 499bbc69, PR-2021 d5077ad6. None merged on an incomplete required set. The reason is not that the surface protected me: for each merge I ran `gh pr checks <n>` and read the ubuntu row directly, because `aida awaiting`''s ci column is a rollup and I wanted the named required check. So the practice that saved these four is exactly the workaround this bug forces, which is itself the argument for fixing it — a surface whose users have all independently learned not to trust it is not providing the service it appears to. The wider sweep across every PR merged today, by every seat, is still criterion 5 and still needed.'
