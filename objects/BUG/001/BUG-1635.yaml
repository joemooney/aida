spec_id: BUG-1635
agreed_id: BUG-1635
title: 'aida history silently falls back to the per-spec digest: --status-changes/--oneline without events, and single-spec progression under toon'
description: |
  Two related cases in `aida history` where an event-level request silently falls back to the per-spec digest (one row per spec, current status). No error or hint is shown, so the user reads the digest as the answer.

  1. **`--status-changes` / `--oneline` / `--comments` without `events`/`--full` on a multi-spec query stay in digest mode.** `aida history --status-changes --since 1d --oneline` returns the digest (`BUG-1632,Bug,InProgress,"16:49",add,…`). `aida history events --status-changes --since 1d --oneline` correctly returns both transitions for BUG-1632 (Draft→Approved 16:05, Approved→InProgress 16:49). `--shipped` already implies events mode; these flags do not. Observed 2026-09-25.
  2. **The single-spec status progression is dropped in toon output.** `aida history BUG-1632 --format human` shows the status-progression view with 2 transitions. The same command piped (default toon) returns a one-row digest instead. So agents, and anyone piping to grep, never see the progression. `--format json` is refused outright ("no JSON projection").

  ## Acceptance
  - `--status-changes` and `--comments` imply events mode, as `--shipped` does, in both human and toon output. `aida history --status-changes --since 1d` lists each transition as its own row.
  - `--oneline` without an event-selecting flag either implies events mode, or is rejected/hinted in digest mode. Choose one and document it in `--help`. It must not be silently ignored.
  - `aida history <SPEC-ID>` returns the status progression (one row per transition) in toon output, with the same content as the human view.
  - `aida history` gains a JSON projection for the events feed and the single-spec progression (per-event rows: id, ts, author, kind, from, to, summary), or the refusal message points at the format that does work.
  - Tests assert that human and toon output agree on event count for `--status-changes`, a single SPEC-ID, and `--comments`.


  ## Groomed decisions (proxy, 2026-09-25)
  - --oneline without an event-selecting flag IMPLIES events mode (consistent with --shipped); document it in --help.
  - A JSON projection is required (not the refusal alternative): per-event rows {id, ts, author, kind, from, to, summary} for the events feed and the single-spec progression.
