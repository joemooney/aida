- id: 01a0c1a2-39f5-7e92-8606-1425351a46dc
  author: joe
  content: '[aida:advisor] REFERENCE IMPLEMENTATION for criterion 5, found by the reviewer seat 2026-09-20 while reviewing PR #2001. Verdict::parse in that PR strips every non-alphanumeric character and lowercases before matching, so all seven canonical spellings resolve, AND both free-text values from the corpus survey normalise to no match and fall to None: ''APPROVED pending cross-platform green'' and ''CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE''. None means no verdict, which makes the PR sweep-eligible, which produces another review. So it fails toward MORE review rather than toward a false approval - which is exactly what criterion 5 requires of a consumer (approved / refused / cannot-determine, with cannot-determine treated as refusing). Whoever implements this spec should take that as the reference rather than writing the normaliser from scratch. Note the property that makes it safe is not the normalising - it is that the fallthrough is None rather than a permissive default.'
