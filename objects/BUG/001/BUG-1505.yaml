spec_id: BUG-1505
agreed_id: BUG-1505
title: 'The review verdict has no schema: 45 key shapes and 9 verdict spellings across 543 files, two of which contain APPROVED while meaning do-not-merge'
description: |-
  The review verdict is the artifact every merge gate is supposed to consult, and it has no schema. Across 543 verdict files under `.aida/review-verdicts/` there are 45 distinct key sets and 9 distinct spellings of the verdict value. Only two keys, `summary` and `verdict`, appear in every file.

  MEASURED 2026-09-20.

  THE VERDICT VALUE HAS NINE SPELLINGS:

      286  Approved
      169  APPROVED
       30  approved
       26  CHANGES REQUESTED
       21  RequestChanges
        7  request-changes
        2  Approve
        1  APPROVED pending cross-platform green
        1  CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE

  The last two are the dangerous ones and they are not typos. Both contain the string APPROVED and both mean the opposite of "merge it": one is conditional on a check that had not run, the other is an explicit refusal to merge on independence grounds. A gate matching on APPROVED merges both. A gate matching exactly on "Approved" misses 199 genuine approvals and fails closed, which is survivable; a gate matching loosely ships work a reviewer explicitly withheld, which is not.

  86 PERCENT CARRY NO HEAD SHA. 468 of the 543 files have no `reviewed_sha`, `head_sha`, `head` or `sha` field of any kind. So for those verdicts there is nothing to compare against the PR's current head, and the question "was this verdict recorded against the code that is about to merge" is unanswerable from the artifact. This is the mechanism STORY-1405 is built on and the protection BUG-1452 arms, and on 86 percent of the corpus the input does not exist.

  THE 45 SHAPES ARE NOT COSMETIC. Some carry `recorded_by`, most do not. Some carry `pr`, some `spec`, some `specs`, some neither. Some carry `findings`, some `findings_filed`, some `blocking_findings`. Two carry `unverifiable` with a reason. Any consumer must therefore try several keys for one fact and treat absence as unknown, and the field it wants most - who recorded this, against what code - is the one most often missing.

  HOW THIS SURFACED, which is the argument for fixing it rather than documenting it. An advisor sweep for refused-but-unheld PRs matched the verdict value case-sensitively and required a sha field. It found 5 refusals and reported them all held. The corrected sweep found 18 refusals and TWO UNHELD - PR #2040 at the current head with no hold, and PR #2009 with no sha and no hold - both of which were mergeable at that moment. The narrow sweep did not error; it returned a smaller number that looked like an answer. Any gate written against this corpus has the same exposure, and a gate is exactly what STORY-1405 proposes to write.

  Acceptance:
  1. A verdict value is drawn from a closed set with one canonical spelling per outcome, and recording rejects anything outside it. Free-text qualification moves to a separate field - a conditional or withheld approval is NOT an approval and must not be expressible as one.
  2. Every verdict records the head sha it was recorded against, and the recorder. A verdict that cannot name its sha records that it could not, explicitly, rather than omitting the field.
  3. A reader helper exists and is the only supported way to consume a verdict file, so a consumer does not hand-roll key fallbacks. Every gate uses it.
  4. The 543 existing files are migrated or classified: mapped onto the canonical set where the intent is unambiguous, and marked unreadable where it is not. The two free-text values are decided individually by a human, not pattern-matched.
  5. A gate consuming a verdict distinguishes approved, refused, and CANNOT DETERMINE, and treats the third as refusing. Absent evidence must not read as approval - that is the whole failure mode.
  6. A test asserts that a verdict whose value is not in the canonical set is rejected at record time, and that a gate fed a shaless legacy verdict reports cannot-determine rather than approving.

  NOT IN SCOPE: what the gate then does with a refusal, which is STORY-1405 and BUG-1452. This is about the artifact those depend on being well-formed enough to consult.


  7. EVERY VERDICT WRITE IS A BLIND FULL REPLACE, AND THAT IS WHY THE CORPUS DRIFTED. Added 2026-09-20 after a second reviewer overwrote a first reviewer's verdict on PR #2040 three minutes after it was written, with no warning and a clean success message naming both files. No write is ever reconciled against what it replaces, so nothing converges and 45 shapes coexist. A schema alone does not fix this - it would lose the same verdict in a tidier shape. Required: recording reads the existing verdict first, prints it, and requires an explicit supersede to replace it; or verdicts are appended as an array and the current one is derived rather than stored destructively.

  8. THE EXISTING SAFEGUARD IS INVERTED AND MUST BE FIXED WITH IT. `aida review record --help` promises that omitting findings preserves any existing findings[]. That preservation only applies when NO --finding is passed. So a substantive review - the one carrying findings - erases completely, and only an empty verdict is safe. The more a second reviewer has to say, the less of the first survives. Whatever replaces the current behaviour must not preserve that inversion.

  9. THE STORE IS GITIGNORED, SO IT HAS NO SAFETY NET. `.aida/` is not tracked, so an overwritten verdict has no git history to recover from and no dated sibling. State the retention answer explicitly: either the verdict store gains its own retention or append-only history, or verdicts are mirrored somewhere durable at write time. Recovery is currently possible only by accident - the PR #2040 verdict was reconstructed from a headless session log that happened to capture the full command line, which is not a mechanism anyone can rely on.

  10. A verdict that supersedes another records what it superseded. When the record is replaced, the prior verdict's summary, findings, recorder and sha survive somewhere queryable. Two reviewers disagreeing is precisely when the record is load-bearing and precisely when the second write currently erases the evidence of disagreement.

  11. SCOPE CORRECTION 2026-09-20 18:40 - THE SHALESS WRITES ARE NOT A LIVE SOURCE DEFECT. The 86-percent no-sha measurement describes the corpus accurately and must NOT be read as a claim about the current emitter. The handshake writer was fixed at 2026-09-20 17:00:35 by commit 066c4ceacb (BUG-1467, PR #2037), which added reviewed_sha, reviewed_branch, recorded_at and recorded_by to the --pr branch at aida-cli-lib/src/lib.rs:76312. Verdicts written shaless AFTER that time - PR-2038 at 17:35, PR-2039 at 18:11, PR-2040 at 18:31 - came from processes running a binary built at 15:02:31 (sha b09197ab72), including the live drain, whose lock records that sha and a 17:03 start, three minutes after the fix merged. So this spec is a MIGRATION plus a rebuild discipline, not a writer fix. Do not write acceptance against a source defect that no longer exists, and do not treat post-17:00 shaless files as evidence the fix failed.

  12. A CORPUS MEASUREMENT CANNOT DISTINGUISH A WRONG WRITER FROM A RIGHT WRITER THAT IS NOT RUNNING. The two have opposite remedies - change the code, versus rebuild and relaunch - and the artifacts are byte-identical. Establishing which required checking the running binary's sha against the commit that touched the writer; it was not derivable from the files. Any audit this spec produces must record the emitting binary's sha alongside the corpus counts, or its conclusion is unfalsifiable in exactly this way.

  13. THE CORPUS IS BIMODAL, NOT UNIFORMLY DRIFTED - MEASURED BY WRITER 2026-09-20 19:02. The 45-shapes / 9-spellings / 86-percent-shaless figures at the top of this spec describe the corpus as a whole and are misleading about the present. Split by recorded_by:

        writer                        files  shapes  no-sha  verdict spellings
        NONE (legacy, many producers)   473      35     427  6 spellings, INCLUDING both free-text values
        aida review record               38       3       0  approved / request-changes
        aida drain reviewer              32       4       0  CHANGES REQUESTED, RequestChanges, APPROVED, Approved
        advisor (proxy for operator)      2       1       0  CHANGES REQUESTED
        codex / codex review              2       2       0  Approved / approved

      EVERY file from a named writer carries a sha - 0 of 72 missing. All 427 shaless files are in the unattributed legacy bucket, which spans 35 key shapes and therefore many producers rather than one. BOTH dangerous free-text values - 'APPROVED pending cross-platform green' and 'CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE' - appear ONLY in that legacy bucket. So the loose-APPROVED hazard is a MIGRATION problem, not a live emission problem: nothing currently writing produces a value that would fool a loose matcher. (Correction to the reviewer's figure: 427 of the 473 legacy files lack a sha, not all 473 - 46 carry one.)

  14. THE ONE LIVE EMISSION DEFECT, AND IT IS THE HIGHEST-VOLUME AUTOMATED PRODUCER. `aida drain reviewer` emits FOUR spellings of TWO values across 32 files: CHANGES REQUESTED (10), RequestChanges (8), APPROVED (8), Approved (6). One writer, one code path, four spellings - it persists whatever the reviewer phase produced instead of canonicalising at write time. So a fix that addresses only the schema and the migration leaves the largest automated producer adding new spellings tomorrow.

      AND THE NAMED WRITERS DISAGREE WITH EACH OTHER, which is the half the per-writer view exposes. For the same two values, the current writers emit: approved / Approved / APPROVED, and request-changes / RequestChanges / CHANGES REQUESTED. Five spellings of two values across four live writers. Canonicalising inside the drain reviewer alone would leave `aida review record` at lowercase and the advisor proxy at uppercase-spaced.

      REQUIRED: every writer canonicalises to the closed set BEFORE persisting, and the canonical form is produced by one shared function rather than by each writer agreeing to be careful. Enumerate the writers in the fix - `aida drain reviewer`, `aida review record`, the advisor proxy path, and the codex paths - because naming the class without listing the instances ships a half-fix, and this spec has four known instances.

  15. CORRECTION TO CRITERION 11: the stale-binary diagnosis applies to the `aida review record --pr` HANDSHAKE writer specifically, which was sparse until 066c4ceacb at 17:00:35. It does NOT describe the corpus as a whole and the drain reviewer was never affected - its 32 files all carry a sha, written by the same stale binary. Two writers, different provenance behaviour, and criterion 11 should not be read as a claim about every shaless file.

  16. 409 OF 543 VERDICTS ARE PERMANENTLY UNPLACEABLE, AND THE MIGRATION CANNOT FIX THEM. Measured 2026-09-20 19:14: 409 PR-keyed verdict files carry NEITHER a sha field (reviewed_sha / head_sha / head / sha) NOR a timestamp field (recorded_at / reviewed_at / date). The obvious fallback for a missing sha - compare the verdict's recorded time against the head's commit date - is unavailable for them because the timestamp is missing too.

      So for those 409 there is no data on disk from which to decide whether the verdict describes the head it would be consulted about. Criterion 4's migration can normalise a spelling and impose a schema; it cannot invent a sha that was never written for a head that has since moved. This is the hard floor on what migration can achieve and the spec must not promise past it.

      REQUIRED, and it is the criterion that matters most for anything consuming a verdict: state what a gate does with a verdict that can NEVER be placed. Treating it as ABSENT is the PRIN-5 answer - it costs a re-review and cannot authorise anything. Treating it as CURRENT is the reassuring answer and is exactly the mechanism by which work merges behind a stale verdict. The default must be the first. If any surface wants the second, it argues for it in writing, for that surface only.

      SCOPE NOTE ON THE NUMBERS, because two different figures are both true and get confused: 409 of 543 is the corpus-wide count of permanently-unplaceable verdicts. SIX is the count among PRs currently open and therefore currently blocking a decision (1984, 1986, 1998, 2009, 2039, 2040). The first sizes the migration; the second sizes tonight's problem. Three of the six were written tonight on a pre-17:00 binary, so that population is still growing until the rebuild lands.
