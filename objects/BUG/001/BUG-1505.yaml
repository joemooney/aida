- id: 01a0c205-8335-7370-867b-8f3941e59a19
  author: joe
  content: |-
    [aida:advisor] STORY-1391's SEAM CARRIES CRITERION 10 AND NOT CRITERION 7. Established by the reviewer seat against PR #2045 and recorded here so whoever implements this spec does not assume the prerequisite closed both.

    CRITERION 10 - a superseding verdict records what it superseded: YES. The rounds array is append-only and each snapshot preserves the full prior object minus rounds. That is exactly what criterion 10 needs and it will be there once #2045 lands.

    CRITERION 7 - read-before-write protection against losing a prior verdict: NO, AND IT CANNOT BE CLOSED BY THAT SEAM AS BUILT. archive_current_round returns early when the existing sha equals the incoming sha, so a re-record AT THE SAME HEAD is not archived - the prior verdict is overwritten and its findings destroyed exactly as before.

    THAT IS THE COLLISION CRITERION 7 EXISTS FOR, AND IT IS SAME-HEAD BY CONSTRUCTION. Two parties reviewing one commit is the definition of the case. On PR #2040 the drain recorded CHANGES REQUESTED at a3049c50bf and the reviewer recorded at a3049c50bf minutes later, destroying four findings - two of them unique, one a live defect in the non-GitHub forge path, recovered only from a headless session log. Under #2045 as written that loss still happens.

    WHY THE EARLY RETURN IS NOT SIMPLY WRONG. It is correct for the case it names: one reviewer correcting its own summary before the head moves should not manufacture a round. What it cannot do is distinguish that from a DIFFERENT party overwriting at the same head. The object already carries recorded_by, which distinguishes them, and the early return does not consult it.

    CONSEQUENCE FOR THIS SPEC: criterion 7 needs its own mechanism keyed on recorded_by, not merely on STORY-1391 landing. Do not treat the BlockedBy on STORY-1391 as meaning criterion 7 is delivered when that spec completes. The dependency is real for criterion 10 and partial for criterion 7.
