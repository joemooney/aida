- id: 01a0c20d-fd86-7fd2-a18c-7d502b24a2d1
  author: joe
  content: |-
    Session: 01a0adee
    Session: 01a0adee
    [aida:advisor] WORKED EXAMPLE FOR CRITERION 1, and it should replace "nine spellings" as the motivating case because the spellings invite a fix that does not work.

    Three defensible readings of one corpus, measured 2026-09-20 20:44:

    strict - verdict normalises exactly to approved / approve / lgtm      490
    loose  - verdict contains the substring "approve"                     492
    divergent                                                               2

    PR-1977-advisor.json    "APPROVED pending cross-platform green"
    PR-1979-advisor.json    "CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE"

    Both contain APPROVED. Both mean DO NOT MERGE. One is conditional on a check that had not run; the other is an explicit refusal to merge on independence grounds.

    WHY THIS IS A BETTER MOTIVATING CASE THAN THE NINE SPELLINGS. The spellings are untidiness - Approved, APPROVED, approved, Approve and so on - and any normaliser fixes them. Reading "nine spellings" as the problem invites exactly that fix, and a normaliser that lowercases and strips punctuation STILL ADMITS BOTH OF THESE, because both normalise to something beginning with "approved".

    Here the normaliser's strictness DECIDES THE ANSWER, and both settings are arguable. Strict excludes a verdict whose author wrote APPROVED and meant a qualified approval. Loose admits two verdicts that forbid merging. There is no setting that is simply correct, which is the signature of a problem that cannot be fixed at the comparison site.

    A CLOSED SET DOES NOT TIDY THIS - IT MAKES THE QUESTION UNASKABLE. If the verdict value is drawn from a closed enum and the recorder is refused anything outside it, "APPROVED pending cross-platform green" cannot be written. The qualification moves to a separate field where it is data rather than prose, and no consumer has to decide how strictly to match. That is what criterion 1 is for, and it is the difference between a normaliser and a schema.

    THE CORPUS CANNOT BE COUNTED WITHOUT FIRST DECIDING A QUESTION THE DATA DOES NOT ANSWER. Five defensible predicates over the same 552 files produce five different totals, and every boundary between them is one of the two free-text verdicts:

      verdict equals "approved", case-insensitive        488
      normalised, starts with "approved"                 489
      strict closed set: approved / approve / lgtm       490
      normalised, starts with "approve"                  491
      contains "approve" anywhere                        492

    PR-1977's "APPROVED pending cross-platform green" is the file separating 490 from 491: excluded by the closed set, included by startswith-approve. PR-1979's "CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE" begins with "content", so it falls outside all but the loosest match and is the 491-to-492 boundary.

    Nobody is careless in any of those five. Each is a reasonable thing to write, none is obviously wrong, and which one is chosen decides whether a verdict that says DO NOT MERGE is counted as an approval. That is the argument for a closed set and it does not depend on anyone having been misled: normalising spellings does not remove the decision, and neither does care. Only making the value unrepresentable does.

    CORRECTED 2026-09-20 20:46. An earlier version of this comment claimed the 490-versus-491 spread was "the only counting disagreement of the night that was not a predicate difference" and offered that as the most persuasive point. It was false - 491 is the startswith-approve predicate, identified by the reviewer seat, and it is arguably the clearest predicate difference of the five. The claim is withdrawn and replaced above rather than kept alongside, because the misled-readers framing invites the response "then be more careful with your predicate", which the five-predicate framing forecloses.

    PROVENANCE: the two free-text values were first flagged by the advisor at 19:00 as the dangerous half of the nine-spelling measurement. The reviewer seat established at 20:40 that they are also the entire explanation for the spread between two seats counting APPROVED verdicts, and at 20:42 identified the advisor's figure as the startswith-approve predicate - which is what made the five-predicate table above derivable. So the same two files that would fool a gate are the boundary between every pair of reasonable counting rules anyone has written over this corpus.
