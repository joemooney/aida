- id: 01a0fcfb-ce18-7682-a3b5-536ea6ba022b
  author: joe
  content: |-
    DECISION: Implement the zombie check directly in `pid_is_alive` and route all helpers through it.

    ### Decision & Rationale

    1. **Does `creator_pid_start_time` cover this?** No. As the spec suspected, a zombie retains its original start time. Thus `process_identity_is_alive` will not detect that the process is dead. The zombie check must be performed inside `pid_is_alive`.
    2. **Where does the check belong?** Inside `aida-core/src/liveness.rs` `pid_is_alive_impl` for Linux, using a `/proc/<pid>/stat` check for the `Z` (zombie) state. This ensures that every liveness check in the workspace accurately considers zombies dead, while keeping the O(1) property (no process-table walk).
    3. **Consolidating helpers:** I have examined the other pid-liveness helpers (`vendor_activity.rs`, `merge_lock.rs`, and `test_home.rs`). All of them currently implement their own `libc::kill(pid, 0)` checks, which suffers from the exact same defect. None of them have a valid reason to consider a zombie "alive". The proposed fix is to delete these redundant local helpers and route all of them through `aida_core::liveness::pid_is_alive`.

    ### Acceptance Criteria Updates
    The ACs remain exactly as written. The implementation will consolidate all helpers.
  created_at: 2026-10-02T14:19:15.864155563Z
  modified_at: 2026-10-02T14:19:15.864155563Z
- id: 01a0fecc-8b59-7431-8346-fca7ff9971eb
  author: joe
  content: |
    RESOLUTION (PR #2356, branch bug-1741):

    AC6 confirmed in code, not assumed: `creator_pid_start_time` / `process_identity_is_alive` (TASK-1284) does NOT cover zombies. The test `zombie_keeps_start_identity_so_only_the_liveness_probe_rejects_it` witnesses that a defunct child still reports its original kernel start time via `process_start_identity`, so the recorded and live identities match and the pid-reuse guard passes it through. The zombie check therefore belongs inside `pid_is_alive` (where `process_identity_is_alive` inherits it), and that is where it was implemented: Linux reads `/proc/<pid>/stat`, parsing state after the LAST ')'; non-Linux unix degrades to today's behaviour (stated in code); Windows has no defunct state.

    AC7 helper disposition: vendor_activity.rs and merge_lock.rs local kill(pid,0) copies deleted and routed through the canonical predicate; test_home.rs keeps unknown-counts-as-alive (pid 0 / out-of-pid_t / non-unix) but delegates the probeable case — a zombie owner holds no open files, sweep is safe; worktree_pool.rs and db/cache_lock.rs already delegated.

    AC5 mutation proof: with the zombie check removed (bare kill(pid,0) predicate), `pid_is_alive_false_for_unreaped_zombie` fails (0 passed; 1 failed); restored, passes. The zombie was NOT reaped as the fix; the host's live corpse (pid 1907632) was left alone.
