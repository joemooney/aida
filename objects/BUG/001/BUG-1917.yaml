title: aida push --help swaps the --code-only and --store-only descriptions
description: |-
  Observed 2026-10-09 in ~/ai/aida (aida 0.15.0). `aida push --help` documents `--code-only` as "Skip the code push (only sync the orphan store)" and `--store-only` as "Skip the orphan-store sync (only `git push`)". The behaviour matches the flag NAMES, not the descriptions: `aida push --code-only` pushed the code branch (and mirrored it to gitlab) and left the store 5 commits ahead of origin. An agent that trusted the help text to push only the store pushed someone else's working branch instead.

  ## Acceptance
  1. Each flag's help text describes what it does (`--code-only` pushes only the code branch; `--store-only` only syncs the store).
  2. A test pins help text to behaviour, e.g. by asserting each flag's description names the leg it pushes.
