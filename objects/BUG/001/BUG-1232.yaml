  content: 'Reviewer round 3 on PR #1950: aida-cli-lib/src/forge.rs:2093-2099 builds the merge request without GitLab''s sha field. A commit pushed after the detailed_merge_status read can therefore be merged without being the reviewed caeffc4a head. Parse the MR sha and send it on PUT /merge, treating a 409 SHA mismatch as stale-head/re-review rather than retrying an unpinned merge. | aida-cli-lib/src/forge.rs:2605-2609 classifies GitLab''s documented approvals_syncing state as Blocked even though it is transient. Add it to the bounded wait-and-reread set and cover it in the status-classification test.  Concretely: parse the MR''s sha from the same detailed-status read and send it as the sha field on PUT /merge; map a 409 (SHA mismatch) to a stale-head outcome that shelves for re-review instead of retrying; add approvals_syncing to the Wait set and to gitlab_merge_gate_classifies_every_transient_status; fixture-test the sha field and the 409 path.'
