    ? AC (0.99) — Before merging a GitLab merge request, the drain reads GitLab's merge-request API and proceeds only when `detailed_merge_status` is `mergeable`; `ci_must_pass`, `ci_still_running`, `checking`, `preparing`, `unchecked`, and `approvals_syncing` are treated as temporary states, while every other or unknown status fails closed and is reported.
    ? AC (0.98) — The GitLab merge gate performs at most six status reads, waiting two seconds after a temporary status, a rebase-in-progress state, or a retryable merge rejection before rereading; exhaustion reports that the MR is still waiting or rebasing.
    ? AC (1.00) — A GitLab merge mutation is pinned to the reviewed MR head SHA; if GitLab reports that the SHA no longer matches the source-branch head, the drain stops and requires review of the new head instead of rereading the SHA and merging it.
    ? SEM (0.99) — GitLab merge operations use the REST API through `glab api` rather than `glab mr merge`; retryable 405/409 or cannot-be-merged responses cause a fresh gate read, and error output includes only GitLab's JSON `message`, never `glab mr merge` wrapper prose.
    ? AC (0.99) — GitLab rebase merges first request the asynchronous MR rebase endpoint, wait until rebasing finishes, then perform a non-squash merge pinned to the post-rebase head SHA; rebase mode is not silently degraded to an ordinary merge.
    ? AC (0.97) — GitLab merge API requests preserve the selected merge options: squash mode sets `squash=true`, merge and post-rebase modes set `squash=false`, source-branch deletion maps to `should_remove_source_branch`, and a supplied squash subject maps to `squash_commit_message`.
    ? AC (0.96) — If the GitLab MR is already in state `merged` when the gate reads it, the operation succeeds idempotently without issuing another merge mutation.
