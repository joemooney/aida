- id: 01a0b5dc-af30-73e3-a210-f9f6da82e6d8
  author: joe
  content: '[advisor:groom] Approved, medium, drive mode, NOT queued for the headless drain: reproduction needs the mirror''s runner + token, so this is keyboard work for whoever holds those (product seat). Cause hints to check first, cheapest to costliest: (1) GitLab returns ''not enough privileges''/405 on `mr merge` when the project''s merge checks are unmet even for admins — ''pipelines must succeed'' with the merge-hold-gate or a still-running job, or ''all threads resolved'' with the reviewer''s r1 discussion left open; glab wraps both as a privilege error. (2) A token with api scope still needs the user to be a project member at Maintainer+ on a protected target branch; instance-admin alone does not grant push-to-protected on a project it is not a member of. (3) `glab mr merge` without `--yes`/`-y` prompts at a TTY and fails non-interactively with a misleading message. Fix shape once the cause is known: the drain''s GitLab merge phase should surface the MR''s `merge_status`/`detailed_merge_status` and the unresolved-thread count in the failure line instead of the glab wrapper text, and retry once when the status is `ci_still_running`.'
  created_at: 2026-09-18T18:52:14.000807871Z
  modified_at: 2026-09-18T18:52:14.000807871Z
  session_id: 01a0adee-16e1-7982-ac9f-e15abb207b6c
- id: 01a0b61e-fd3a-7b01-8267-41926335dfde
  author: joe
  content: 'Cause confirmed 2026-09-18 13:04 on the TASK-1270 check (mirror MR !4): with the aida:merge-hold label and a failed gate, detailed_merge_status = ci_must_pass and PUT merge_requests/4/merge returns HTTP 405 Method Not Allowed. glab renders a 405 as ''you do not have enough privileges to merge this merge request'' — the message the drain printed on MR !2, whose head pipeline had only just flipped to success when the merge phase fired (''Pipelines must succeed'' still evaluating). So it is candidate (a): the merge phase must treat 405 / ci_must_pass / ci_still_running / checking as ''wait for the head pipeline and re-read detailed_merge_status'', not as a privileges failure; glab''s text should be discarded in favour of the API''s detailed_merge_status.'
  created_at: 2026-09-18T20:04:39.354268533Z
  modified_at: 2026-09-18T20:04:39.354268533Z
  session_id: 01a079fe-4ad8-7ee0-8086-16d6a1b7f0e5
- id: 01a0b62f-43b9-7b32-a986-70ea910cc49e
  author: joe
  content: '[advisor:groom] Re-groomed 13:22: cause confirmed on TASK-1270 (405 = ci_must_pass, glab renders it as a privilege error), so the fix no longer needs the mirror and is fixture-testable. Moved to DRAIN mode in wave followups-0918e. Fix contract: the GitLab merge phase reads detailed_merge_status from the API before and after the merge call; 405 or {ci_must_pass, ci_still_running, checking, preparing} → wait for the head pipeline (bounded by the existing CI idle window) and re-read; {not_approved, discussions_not_resolved, blocked_status, draft_status, conflict, need_rebase} → shelve with THAT status in the failure line; glab''s wrapper text is never surfaced as the reason. Tests: a fixture per detailed_merge_status class + the 405 path; GitHub merge phase untouched.'
