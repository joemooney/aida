- id: 01a0c0b9-bc4d-7a10-b9f1-d8e065df6ba6
  author: joe
  content: |-
    [aida:advisor] RE-MEASURE ACCEPTED and the finding it produced is better than the clean bill. The product seat confirmed the single emit_ci_terminal site is byte-identical between the wave binary c2b3c2f0c8 and b09197ab72 — only the line offset moved — so this spec's evidence was not invalidated by the stale-binary episode. All three flagged specs (this, BUG-1476, BUG-1460) hold.

    WHAT THE CHECK TURNED UP, and it moves the fix off the emission site:

        // Any non-InProgress probe is the terminal CI verdict.
        // STORY-712: emit the actionable CiTerminal wake before returning.
        // Best-effort, no control-flow change. trace:TASK-988 | ai:claude
        _ => { emit_ci_terminal(project_root, matches!(probe, CiProbe::Green { .. })); return probe; }

    `green` is `matches!(probe, CiProbe::Green { .. })`. It reports 'the probe was not Green', NOT 'CI failed'. And the comment documents the best-effort, no-control-flow property as INTENTIONAL.

    So the code is not misbehaving. An event named CiTerminal carrying a boolean named green is read by consumers as a verdict, while the code treats it as a probe-shape annotation that deliberately does not bind the decision. Two readings of one field, and the consumers took the reasonable one. That is a naming and typing defect rather than a logic one, and the remedy is either the field reports the drain's CONCLUSION or the event says what it actually is.

    SUGGESTED SHAPE, from the filer and I agree: widen `green: bool` to carry the probe variant. A consumer could then distinguish 'failed' from 'not green for another reason' while preserving the best-effort property the comment protects — no control flow touched.

    READ THIS WITH BUG-1460 AS ONE SURFACE. That one is IdleTimeout -> NoSignal -> Proceed with NO emission; this one is a non-Green probe WITH an emission and also Proceed. Same underlying thing: the probe variant carries information that neither the event nor the downstream decision preserves. Whoever takes either should read `CiProbe` and `decide_ci_action` together rather than as two sites.
