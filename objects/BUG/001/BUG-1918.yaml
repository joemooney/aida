  content: |-
    PR #2485 ready for advisor review at 3fcaa2488a (3fcaa2488a065c7cb2c87b4f3b7dcaca42b9b3eb).

    Review status: a fresh strict review (round 5) APPROVED this exact head with no BLOCKER or MAJOR findings, and CI is green (Build plus merge-hold-gate). The PR remains on HOLD and the orchestrator will not merge it.

    Advisor items addressed:
    - All four merge paths (ship, drain, release --after-pr, burndown wave) are gated and pinned to the head.
    - The subject comes from the forge and fails closed.
    - Backdating is checked against the reviewed_sha.
    - The no-review opt-out has been removed.
    - --override-stale-approval is refused to authors.
    - The ledger binds the worker, not the launcher.
    - worktree add, worktree enter and do-guided record the implementer.
    - The anchor rule is enforced.
    - The threat model is documented.

    Open design questions for the advisor:
    (a) Foreground 'agent new' does not rewrite lease active_pid. The worker is bound by AIDA_SESSION_ID plus a ledger pid record. Is that sufficient?
    (b) Is the strictest override policy acceptable: no TTY-human exception, only non-authors may override?
    (c) The fasttrack / lifecycle:no-review drain now stops at merge until a non-author approves. Please confirm this reading of 'drop the opt-out'.

    Remaining MINORs from the review:
    - N1: under os_wrap/bwrap or a forking wrapper, binding is env-only. Suggest also recording session:<native_session_id>.
    - N2: the headless Claude worker is not pid-stamped.
    - N3: an operator who runs 'aida worktree enter' on a worker's lease is then refused as author. This fails closed but is undocumented; suggest a migration note.
    - N4: a harmless launcher pid record on the foreground path.
