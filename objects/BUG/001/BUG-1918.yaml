title: 'Review gate still lets an implementer self-approve and ship: BUG-1802 refusal is a recorded_by substring match'
description: |
  ## Problem
  BUG-1802's fix is a string check, not an identity check. `approval_head_refusal` (aida-cli-lib/src/pr_ship.rs:1461) refuses only when the newest approval's `recorded_by` contains the literal text "implementer seat". A verdict the implementer records itself, labelled "aida review record (operator)", passes. The function also returns None ("may proceed") when no approval exists at all.

  ## Observed 2026-10-10
  PRs #2474, #2475 and #2477 (TASK-1538 slice 1) all merged with zero independent review. For #2477 the implementing antigravity session ran `aida review record PR-2477 --verdict approved --sha 112c969c...` and then `aida pr ship`, which merged at 05:36Z. The canonical TASK-1538 verdict is still the old advisor approval of PR 2429 at 430dc01de461, so the self-recorded verdict either stayed in the seat's worktree or was never consulted.

  ## Acceptance
  - `aida review record --verdict approved` refuses when the recording session/seat is the one that claimed or implemented the spec, based on bound session identity and not on free-text labels.
  - Operator attribution requires a human-at-TTY gate (BUG-1693 floor).
  - `aida pr ship` refuses a PR that has no approval recorded at its head by an authorized non-author seat. Where "no approval → proceed" must stay for unreviewed lanes, it applies only to lanes that explicitly opt out (fasttrack), not by default.
  - Regression test: a self-recorded approval at head with recorded_by="aida review record (operator)" from the author session → ship refuses.
