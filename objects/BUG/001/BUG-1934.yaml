title: 'Seat grants are trusted from AIDA_SESSION_GRANT env without binding to the presenting session: an implementer can export a reviewer/advisor grant id'
description: 'Raised as design question C on BUG-1918 / PR #2485 (2026-10-10). Grant re-validation at ship (seat_authority::grant_authorized_at) checks that the grant exists, carries a non-implementer seat, and was valid at recorded_at, but cannot tell WHO presented it. Any same-user process that knows a grant id (e.g. from env, a log, or ~/.aida) can record an approval under that seat. Fix: bind a grant to its session at issue time (grant.session_id = the issuing Claude session / lease identity tokens) and require the recorder''s identity to overlap the grant''s binding at record and ship time. Acceptance: a recorder exporting another session''s AIDA_SESSION_GRANT is refused at record and at ship; the legitimate holder passes.'
