    [rework round 2] PR #2009 — CHANGES REQUESTED. Two findings; BUG-1420's own change passed its focused tests. One finding is STALE and must not be actioned as written. Verify before you touch either.

    FINDING 1 IS STALE — DO NOT "FIX" THE TEST. REBASE.
    The verdict says `mcp::tests::queue_rework_flips_status_and_requeues` is red, reasoning that the test passes both `for=implementer` and `user=queue-rework-user` then asserts the entry stays on that user queue, while the new routing sends it to the role queue.

    I ran it on current origin/main before writing this:

      env -u AIDA_SESSION_ROLE cargo test -p aida-cli-lib queue_rework_flips_status
      test mcp::tests::queue_rework_flips_status_and_requeues ... ok
      test result: ok. 1 passed; 0 failed

    It passes. Your branch predates #1996 (BUG-1277's routing change) landing together with its companion test adjustment — so the branch carries the new routing WITHOUT the test update, and main carries both.

    The correct action is `git rebase origin/main`, then re-run. If it still fails after rebasing, that is a real finding and worth reporting; right now it is a branch-age artifact.

    DO NOT edit that test to match the reviewer's description. Changing an assertion to satisfy a stale finding is how a merged fix gets silently undone — the explicit-`--user` override is BUG-1277's acceptance and that test is what pins it.

    FINDING 2 IS REAL AND SHOULD BE FIXED HERE.

      git diff --check ... -> trailing whitespace at docs/spikes/2026-09-19-cost-observability.md:3-4

    Remove the trailing spaces. They are almost certainly Markdown hard-break spaces; use an alternative that passes the repository's whitespace check.

    Worth knowing rather than repeating: this is the SAME whitespace defect SPIKE-83 was briefed on earlier tonight, where its PR body claimed `git diff --check` had passed and it had not. It shipped anyway and is now failing a second PR's covered diff. That makes it the third occasion tonight a PR body asserted a verification that did not hold. Run the check and read its output before restating it — a claimed verification that fails is worse than an unclaimed one, because the next reader stops checking.

    AFTER REBASING, re-run the full suite rather than the focused tests alone. The round-1 sweep exists to catch exactly what focused tests miss, and the branch is now several merges behind a fast-moving main.

    Push fixups to the existing branch. Do not open a new PR.
