    [advisor:rework] SHELVED ON TWO FINDINGS THAT ARE BOTH STALE-BASE ARTIFACTS. Do not chase either one. REBASE FIRST — that is the whole of the fix.

    THE BRANCH IS SEVEN COMMITS BEHIND MAIN, and that is why its diff is +3819 lines for a shell-strictness change. The discipline-pack files in it are byte-identical to main's — I checked `git diff --quiet origin/main <branch>` on them — so they are diff-against-merge-base inflation from #1988 having landed, not content this PR adds.

    The reviewer then did a full sweep across that inflated diff, per TASK-1291, and found real-looking problems in other specs' already-merged content. Its own summary says the important part: "the pinned BUG-1420 shell-parity change itself passes its focused tests."

    FINDING 1 — the MCP queue-rework test — DOES NOT HOLD ON MAIN. I ran it rather than reasoning about it:

      cargo test -p aida-cli-lib queue_rework_flips_status_and_requeues
      test mcp::tests::queue_rework_flips_status_and_requeues ... ok

    BUG-1277 merged tonight with green CI and that test passes on current main. Do not "reconcile" it — changing it would break a test that is currently correct.

    FINDING 2 — the trailing whitespace in the SPIKE-83 report — is intentional markdown. Lines 3 and 4 end in two spaces, which is a markdown hard line break. `git diff --check` does not know markdown and flags them. Stripping them would break the rendering of a document that merged hours ago. If anything is wrong there it is a PR body claiming that check passed, which is a separate matter already raised on that spec.

    WHAT TO DO:
    1. Rebase onto current main. That removes 3800 lines of inflation and both findings with them.
    2. Re-run your focused tests. The shell-parity change itself was already reported passing.
    3. Expect the CLI-manual guard to fail for a reason that is not yours — TASK-1-152, three flags documented at a parent command while they live on subcommands. Recorded on this spec earlier. Diagnose and attribute it; do not loosen the guard or the shell change to make it green.

    WHY THIS MATTERS BEYOND THIS ROUND. A stale base makes a full sweep review other specs' merged work and report it as this spec's problem. The sweep is doing exactly what TASK-1291 asked for and the input is wrong. Worth noticing as a pattern: the more thorough the review, the more a stale base costs, because thoroughness is applied to content the author never wrote.
