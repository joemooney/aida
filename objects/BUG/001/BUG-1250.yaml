  content: 'Second shape of the same defect, 2026-09-19 00:15 on TASK-1285 / PR #1959: the drain shelved ''CI is red on PR-1959: merge-hold-gate'' while the marker for #1959 existed (aida merge-hold list shows it) and Build (ubuntu-latest) was still PENDING. The coarse red was the hold gate; refine_red must have returned Err (the per-check rows read via gh failed transiently), and finish_ci''s Err arm keeps the coarse verdict (''no per-check rows on this forge'') — a branch meant for forges without rows, not for a GitHub API blip. Fix scope for this bug therefore includes: in finish_ci, distinguish ''forge has no rows'' (keep coarse) from ''row read failed'' (retry with backoff, then shelve ci-unavailable), and never shelve ci-red on a hold-gate-only red while the marker exists.'
