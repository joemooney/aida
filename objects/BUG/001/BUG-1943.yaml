title: aida awaiting still reports 'cross-platform nightly red' after ADR-72 removed the nightly schedule, so the red line can never clear
description: |-
  As of main c6c0d9c3b2 (TASK-1723, ADR-72), .github/workflows/cross-platform.yml has no schedule and no pull_request trigger. aida awaiting still prints 'nightly_red: cross-platform nightly red since 2026-09-23 (run 37323717377, 13 nights)', judged from the last scheduled run. No new nightly will ever run, so the line stays red forever and trains seats to ignore the field.

  Expected: when the workflow has no schedule trigger (or once the project is Linux-only per ADR-72), the nightly_red signal reports nothing, or 'retired (ADR-72)', not red. Acceptance: on a repo whose cross-platform workflow has no schedule, awaiting has no nightly_red line, plus a test.
