- id: 01a0d9a5-71df-7162-9db1-017740ccb97a
  author: joe
  content: 'Strict security review: REQUEST CHANGES — reviewed 90f8325d89. HIGH (blocking): the session-env.sh filter re-quotes values but does not allowlist variable NAMES, so a file committed on a branch still gets code execution in the operator''s shell. session_env_eval_lines (aida-cli-lib/src/lib.rs:63296) passes every valid identifier through parse_session_env. I confirmed with a probe that these survive into the eval''d worktree-enter payload unchanged: export PROMPT_COMMAND=''touch pwned'' (runs at the next bash prompt), BASH_ENV, LD_PRELOAD=''./x.so'', export PATH=''.evil:/usr/bin'', and export AIDA_BIN=''.evil/aida'', which the filter itself turns into PATH=''.evil'':"$PATH", a relative directory the branch controls, at the front of PATH after the cd. Fix: allowlist exactly the names render_session_env_file writes (CARGO_TARGET_DIR, AIDA_AGENT_TYPE, AIDA_BIN). Do not derive the PATH prepend from the file''s AIDA_BIN; use the running binary, or at least require an absolute path outside the worktree that is an existing executable. Add a regression test for PROMPT_COMMAND, PATH and a relative AIDA_BIN. SAME ROOT CAUSE, MEDIUM: apply_session_env_to_process (lib.rs:36733, the session start --launch path) sets every parsed name, LD_PRELOAD and PATH included, in the process before exec claude. Apply the same allowlist there. LOW: dev activate still splices bin_dir unquoted into the eval''d echo ''... build at {}'' (aida-cli-lib/src/dev_cmd.rs:821-826), which contradicts ''repo and bin paths are now quoted''; wrap it in sh_single_quote. LOW, not blocking: the stderr hints at lib.rs:36802 and 63183 tell the operator to ''source .aida/session-env.sh'' verbatim, and that file is the untrusted one. VERIFIED OK: (1) Preflight: is_shell_safe_branch_name checks bytes, so newlines, unicode, {, *, ?, [, ~, quotes and $ are all rejected. A leading dash is rejected. check-ref-format runs as argv and rejects ''..'', ''.lock'' and ''@{''. + and @ are inert without ''(''. On failure the guard fails closed: Inconclusive, then Refuse, and AIDA_PREFLIGHT_DEFAULT_BRANCH is env_removed. Debug-escaping the name in the reason text also blocks terminal escapes. (2) The other 8 fixes hold. role/persona use sh_single_quote, and comment lines are flattened. init cd, the session id, the edit_buffer "$@" with $0=editor, the admin restart with setsid sh -c ''sleep 2 && exec "$@"'' sh bin args, and the resume shell_quote are all fine. No breakout via quotes, backslashes, $''..'' or newlines, because the parser is line-based and single-quoting is total. (3) I re-audited all sh/bash/cmd/setsid/tmux/asciinema/bwrap/systemd-inhibit sites independently and agree with the safe list; I found no other untrusted value. (4) The git_ops pull guards are correct and the comments are accurate. (5) Tests are meaningful: reverting the preflight guard fails the 2 preflight tests, and reverting the session-env filter fails the 2 eval tests. Tests use only tempdirs, with no /tmp literals and nothing touching ~/.aida. Passing: bug_1624 11/11, implementer_preflight 16, bug_1622 14, worktree 220, resume 85 (those two need RUST_MIN_STACK when the test binary runs directly), aida-core git_ops 54. aida-server has no admin tests, and it compiles. (6) graded_review is unchanged by this diff, so it is no worse than before.'
