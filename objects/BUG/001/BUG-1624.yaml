- id: 01a0d9cf-a7be-72d2-9e9a-c4db58729e5f
  author: joe
  content: 'Strict security re-review: APPROVE — reviewed 8013cbdb57 (delta 90f8325d89..8013cbdb57 plus the full diff against origin/main). The HIGH and MEDIUM findings are fixed. (1) trusted_session_env (aida-cli-lib/src/lib.rs:40492) keeps only CARGO_TARGET_DIR (absolute only), AIDA_AGENT_TYPE and AIDA_BIN; the first occurrence of each name wins. AIDA_BIN is never read from the file: it is replaced by current_exe when that is an absolute, existing file, and dropped otherwise. The PATH prepend in session_env_eval_lines (lib.rs:63341) comes from running_exe.parent(). Every value that is emitted goes through shell_single_quote, and every name is one of the three constants, so nothing from the file reaches the eval unquoted. I probed it with a throwaway test covering CARGO_TARGET_DIR=''/abs/$(touch pwned)'', a CRLF file, duplicate keys, an AIDA_AGENT_TYPE containing '' plus $() and backticks, export -f, declare -x, readonly, alias, a function definition, ''export  PATH'' with a double space, AIDA_BIN=$(..), a mismatched quote, a 200KB line and non-export lines. All came out quoted or dropped, and a real bash eval created no file. (2) apply_session_env_to_process (lib.rs:40464) uses the same allowlist, and it is the single function both session start --launch (lib.rs:36733) and queue work (queue_cmd.rs:11764) call. An attacker-chosen absolute CARGO_TARGET_DIR is acceptable: it is only a build output dir, and building a hostile branch already runs its build.rs. (3) session_env_unset_names (lib.rs:62939) filters to the allowlist, so a file can no longer make worktree exit unset PATH. (4) dev activate now sh_single_quotes bin_dir (dev_cmd.rs:824-825), and the two lib.rs hints (36799-36806, 63221-63230) no longer say to source the file. (5) The tests are meaningful. With the name allowlist reverted, 3 tests fail (PROMPT_COMMAND leaked; apply_session_env; the TASK-63 statusline test). Reverting only the exit filter fails the allowlist test at the unset assertion. Restoring the file-derived AIDA_BIN/PATH fails it with "''.evil leaked". The tests use only tempdirs, with no /tmp literals and nothing touching ~/.aida. Passing: bug_1624 12/12, session_env 15, statusline 287, worktree 220, implementer_preflight 16. (6) The flaky mcp_authority_gate_honors_advisor_role is PRE-EXISTING, not introduced here. With the role filter it failed 5 of 8 runs on the branch and 3 of 8 on origin/main 1df2e0445e. mcp.rs is untouched by this branch. The test reads the process-global AIDA_SESSION_ROLE while other role tests set_var it in parallel, an env race of the BUG-1618 family. No spec tracks it yet; suggest filing one. LOW, not blocking, suggested as follow-ups: (a) queue_cmd.rs:11703, the queue work --no-launch hint, still prints ''source .aida/session-env.sh''. (b) A NUL byte in an allowlisted value makes std::env::set_var panic in apply_session_env_to_process (lib.rs:40472). I confirmed it, and it only crashes session start --launch / queue work before exec, so it is a DoS; skip values containing NUL. (c) The file still controls AIDA_AGENT_TYPE. A non-empty value switches on the advisor_code_gate agent carve-out (advisor_code_gate.rs:224, which is documented as a guardrail and not a security wall) and adds a normalized type mailbox identity (lib.rs:21490). Consider taking it from the lease or restricting it to normalize_agent_type''s known set. (d) If the allowlist ever regressed, bug_1624_apply_session_env_to_process_ignores_non_allowlisted_names would leave PATH and LD_PRELOAD mutated for the rest of the test process, because it has no restore guard.'
