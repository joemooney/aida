title: 'Shell injection: forge default branch name interpolated into a shell command in implementer_preflight'
description: 'Found during the BUG-1622 audit. implementer_preflight.rs ~409 builds a shell command string that contains the forge''s default branch name. A crafted branch name (from a repo or forge the operator doesn''t control) could inject shell syntax. Fix: pass the value as an argv element, not through a shell, or quote it robustly and validate it against git''s ref-name rules. Grep for other shell strings (sh -c, bash -c, format! into Command::new("sh")) that interpolate store-, config- or forge-derived values. Acceptance: a regression test where a default branch name containing '';'', ''$()'' or backticks runs nothing, plus a documented audit of every sh -c site.'
