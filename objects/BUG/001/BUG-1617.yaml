title: aida history events silently truncates to its default commit window (--shipped -n 10 returned 4 ships, no notice)
description: |-
  Found by the TASK-1505 advisor review. The default events window is `(limit*5).max(50)` commits, and nothing is reported when it is exhausted before the limit is reached. `aida history events --shipped -n 10` returned 4 ships with no warning.

  ## Acceptance
  - When the default window runs out before reaching --limit, human output prints a one-line notice explaining how to widen it (--max-commits or a time bound).
  - JSON and MCP output carry a `window_exhausted` boolean.
  - Tests cover the notice and the flag, and verify no notice appears when the limit is met.
