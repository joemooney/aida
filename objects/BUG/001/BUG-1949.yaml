title: 'docs/cli cites invocations that fail: ''aida session forget'' (cut by TASK-850) and bare ''aida usage unused'' (DURATION is required)'
description: |
  Problem: two pages in docs/cli cite invocations that fail when run as written.

  1. docs/cli/06-roles-sessions.md:48 lists `forget` among the conversation verbs (`conversations` / `resume` / `new` / `prune` / `forget`) and :71 explains "`prune` vs `forget`". `aida session forget <id>` returns `error: unrecognized subcommand 'forget'`. The verb was cut by TASK-850 (completed) and no doc follow-up removed it. `aida session --help` lists: conversations resume focus send new start end leases show handoff manifest prune gc reap.
  2. docs/cli/08-reporting.md:263 and :270 cite bare `aida usage unused`. `<DURATION>` is a required positional; the bare form returns `error: the following required arguments were not provided: <DURATION>`. Line 25 of the same page already says it takes a time bound, so only the two cited forms are wrong.

  Evidence path: run the two commands above on main (verified 2026-10-11 00:21 -07:00 against the dev binary). The CLI-manual drift guard (`check-cli-manual`, tier full) does not catch these because it checks flags, not subcommand existence in prose, and not required positionals (see also BUG-1937 for the fast tier skipping it).

  Acceptance:
  - 06-roles-sessions.md no longer names `forget`; the :71 bullet covers `prune` (and points at `session gc`/`reap` for cleanup) without inventing a verb.
  - 08-reporting.md cites `aida usage unused 30d` (or states the positional is required) at :263 and :270.
  - A drift check (existing guard or a small test) fails if a docs/cli page cites `aida session <verb>` where `<verb>` is not in `aida session --help`.

  Found by the night-fable review sweep (docs-vs-CLI pass over docs/cli/01-12). Size S, docs only.
