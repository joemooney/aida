id: 01a0c1a6-767c-74f1-b8ef-177d7dd756b5
spec_id: BUG-1507
agreed_id: BUG-1507
title: 'Four gates treat unknown, absent and did-not-run as consent: the preflight publishes when guards never ran, and a test pins it'
description: |-
  Four gates in this codebase enumerate the values that mean STOP and let everything else fall through as GO. Unknown, absent and could-not-run all become consent. This is PRIN-5 expressed as a code pattern, and it is now frequent enough to be worth finding mechanically rather than one bug at a time.

  THE INSTANCES, all verified 2026-09-20. This list is the deliverable - a fix that addresses the shape without addressing each site leaves the others exactly as they are.

  1. THE PREFLIGHT GATE IS INERT FOR ANY PROJECT WITHOUT .github/workflows/ci.yml. PR #1972 / TASK-1289.
     CORRECTED ENUMERATION 2026-09-20 18:55 - the first version of this spec said seven conditions and
     cited lines 439/443/460/461, which are PATCH-relative offsets and do not exist in a 449-line file.
     The correct figure, measured at 6512f1312a in aida-cli-lib/src/implementer_preflight.rs:

       resolution   96   CI workflow missing         -> ResolvedGuard::Skipped
                   102   CI workflow unreadable      -> ResolvedGuard::Skipped
                   127   no matching CI guard        -> ResolvedGuard::Skipped
       execution   284   FUNNEL: ResolvedGuard::Skipped -> GuardResult::Skipped
                   288   worktree binary unavailable -> GuardResult::Skipped
                   305   timed out                   -> GuardResult::Skipped
                   306   could not start             -> GuardResult::Skipped

     SIX conditions across FOUR GuardResult::Skipped construction sites. 284 is the funnel through
     which 96, 102 and 127 arrive, so it is not a seventh condition.

     decide() collects only GuardResult::Failed, lets `_ => None` swallow everything else, and returns
     Open when that collection is empty. A test then pins the behaviour by asserting a timeout yields
     Skipped, so the suite locks the wrong decision in.

     THE SEVERITY IS NOT "fails open on an edge case". guards_from_ci maps EVERY named guard to Skipped
     when .github/workflows/ci.yml is missing or unparseable - the whole set, not one guard. They funnel
     through 284, decide() swallows them, failed.is_empty() is true, the decision is Open. So for any
     downstream project scaffolded by aida init with no ci.yml, the preflight gate was never on, and
     there is no output difference between "all guards passed" and "there were no guards". The gate
     reports success by producing no failures, having run nothing. That is the purest instance in this
     spec and the reason it is listed first: the other three degrade a working gate, this one means the
     gate does not exist for most downstream users.

  2. THE AWAITING GATE, BUG-1481, aida-cli-lib/src/awaiting_you.rs.
     `match pr.ci_rollup.as_deref() { Some("fail") | Some("pending") => return false, _ => {} }` -
     the wildcard swallows None, so a PR whose CI state is unknown reads as ready for you.

  3. THE VERDICT MATCH, BUG-1505.
     A gate matching loosely on APPROVED accepts "APPROVED pending cross-platform green" and
     "CONTENT APPROVED - MERGE WITHHELD FOR INDEPENDENCE", both of which mean do-not-merge.

  4. THE COUNTEREXAMPLE, and it is the reason this is about DEFAULTS rather than matching.
     Verdict::parse in PR #2001 normalises aggressively and falls through to None. None means no
     verdict, which makes the PR sweep-eligible, which produces another review. Same function shape
     as the three above, opposite default, and it fails toward more scrutiny instead of less.
     Whoever fixes 1-3 should read 4 first.

  WHY A SPEC RATHER THAN THREE BUGS. Each site is individually defensible to its author - enumerate what you know is bad, allow the rest - and the bug only appears when you ask what the unenumerated values are. Three independent authors wrote it in one codebase, and the one that got it right did so by choosing None as the fallthrough rather than by reasoning about the class. That is the signature of something a review cannot reliably catch and a lint can.

  Acceptance:
  1. Each of the three sites above refuses, or explicitly reports could-not-determine, when the value is unknown, absent, or the check did not run. Skipped is not passed. Unknown CI state is not ready. An unparseable verdict is not an approval.
  2. The preflight gate distinguishes all three outcomes - passed, failed, and did not run - rather than two. State what publication does on did-not-run; the defensible answer is refuse, and if it is not refuse, say why in the code.
  3. The test that pins the current preflight behaviour is corrected, not deleted, so it asserts the new decision. A test asserting a timeout yields Skipped is fine; a test asserting that Skipped permits Open is the defect.
  4. Establish whether this is mechanically findable: a clippy lint, a grep-able pattern, or a type change that makes the unknown case unrepresentable. The strongest form is the type change - a three-state enum with no default arm - and if that is impractical say what was tried.
  5. Each fix names PRIN-5 in a trace comment, so the next reader finds the principle rather than rediscovering the class.

  NOT IN SCOPE: the verdict schema itself, which is BUG-1505, and the boundary design decision on TASK-1289, which is with the operator. This spec covers the decision function's treatment of unknowns wherever it appears.


  6. THE TESTS HAVE THE SAME DEFECT AS THE CODE, AND FIXING ONLY THE CODE LEAVES THE MECHANISM THAT HID IT. Three tests found 2026-09-20, each asserting an INVARIANT by enumerating the instances that existed when it was written. All three PASS. All three read as proof the invariant is covered.

      (i) `lifecycle_skip_express_tier_forces_full_gate` in auto_complete.rs. Function name and
          assertion message both claim a universal - "express overrides any lifecycle:* short-circuit
          - full gate enforced". Body names three of five skip fields and the input tags omit
          lifecycle:no-preflight, so it cannot fail for the field left open. The universal instrument
          `skip.is_empty()` is used correctly TWENTY LINES ABOVE in the same function, in the easier
          case.
      (ii) The preflight test asserting a timeout yields Skipped. Accurate, and it pins the fail-open
          decision it should be refusing - a passing test locking in the defect.
      (iii) PR #2040's `open_pr_for_same_spec_defers_auto_bump` fake: returns 1979 for every
          invocation without inspecting which spec was searched, so it passes whether the lookup is
          spec-specific or a constant.

      REQUIRED: where a test asserts an invariant over a set, it must be unable to compile when the
      set grows - a destructuring bind over every field, an exhaustive match with no wildcard arm, or
      equivalent. Not a conjunction of the members that existed at authoring time. This is criterion 4
      applied to the tests, and it is the half that determines whether the fix survives the next field
      anyone adds. Every enumeration relied on during this investigation narrowed silently rather than
      failing - including the enumeration in the first version of THIS spec, which cited four line
      numbers of which two did not exist.

  7. THE MECHANISM BEHIND INSTANCE (i), CORRECTED 2026-09-20 19:22. An earlier note on this spec said the author knew the universal form, used it in the easy case, and enumerated in the hard one. That reading is wrong and the true mechanism argues harder for the compiler fix.

      THE PLAIN-EXPRESS CASE CARRIES BOTH FORMS - three field assertions AND `skip.is_empty()`. The conflicting case twenty lines below carries forward only the enumeration. And the is_empty() in the plain case is VACUOUS: from_tags([EXPRESS_TIER_TAG]) sets only `skip.express` (auto_complete.rs:142), no skip field, so is_empty() passes whether or not the `if skip.express` force-off block exists at all. Delete that block and the assertion still holds. So the file does not contain a working demonstration of the universal form testing express's clearing behaviour - it contains the helper used where it proves nothing.

      THE HARD CASE WAS WRITTEN BY ADAPTING THE EASY ONE. In a copy-adapt you carry forward the lines with case-specific content to edit - the field names - and drop the line with nothing to adapt. The universal assertion is precisely the one that looks generic, which makes it the one most likely to be lost in that operation. The failure is not a judgement error about which instrument to use.

      WHICH MAKES THE COMPILER FORM MANDATORY RATHER THAN PREFERRED. An assertion dropped BECAUSE IT HAS NO CASE-SPECIFIC CONTENT cannot be protected by asking authors to remember it: its forgettability is a property of its shape, not of their attention. A destructuring bind over every field is not droppable that way - it is load-bearing syntax the case cannot be written without. Adding `assert!(!skip.no_preflight)` to the conjunction buys exactly one field, and the field added after it will be lost the same way.

      AND A FOURTH SURFACE STATES THE INVARIANT UNIVERSALLY. The code comment above the force-off block reads "Express overrides any `lifecycle:*` short-circuit that would otherwise downgrade the gate, so an express spec can never silently ship under a reduced gate." So the comment, the test's function name, and the test's assertion message all claim a universal; the code and the assertion body both enumerate. Three statements of the invariant, two implementations of it, and the two that could enforce it are the ones that narrowed.

  8. A FIFTH SURFACE, AND IT IS THE ONLY USER-FACING ONE - IT TELLS THE OPERATOR THE OPPOSITE OF THE TRUTH. Found 2026-09-20 19:26 in auto_complete.rs banner_summary():

        if self.express {
            return Some("express tier - full gate (CI + reviewer + build)".to_string());
        }
        if self.is_empty() { return None; }
        let mut parts = Vec::new();
        if self.no_preflight { parts.push("implementer preflight"); }

      The express branch returns EARLY and UNCONDITIONALLY. So for a spec tagged batch:express plus lifecycle:no-preflight, the operator is shown "full gate (CI + reviewer + build)" while no_preflight is true and the gate is reduced. The line that names the skipped phase is UNREACHABLE for any express spec.

      AND TWO SURFACES OF THE SAME STRUCT CONTRADICT EACH OTHER. active_tokens() DOES include no_preflight and emits the token "no-preflight". So telemetry records the short-circuit as active while the human-readable banner says full gate - same spec, same run, same field, opposite claims. The machine-readable path is truthful; the operator-facing one is false.

      THIS OUTRANKS THE OTHER FOUR SURFACES. The code comment, the test function name and the assertion message are developer-facing - wrong only to someone reading the file. This is emitted at runtime to the person deciding whether a spec shipped under a full gate, and this project holds user-facing text to a higher bar than developer artifacts precisely for this reason.

      IT ALSO EXPLAINS WHY THE GAP NEVER SURFACED OPERATIONALLY. Had an express spec ever run with lifecycle:no-preflight, nothing the operator saw would have looked wrong - the banner said what they expected, and the only contradicting evidence was a token in a JSONL nobody reads per run. The gap was not merely unreviewed; it was UNOBSERVABLE FROM THE OPERATOR'S SEAT. That is the same property as BUG-1513, arriving at a different surface: twice in one night, the seat that would have noticed is the seat structurally prevented from seeing it.

      REQUIRED: the banner is DERIVED from the skip set rather than hardcoding a phase list, or the express branch falls through to the parts-building path so a residual skip is still named. A hardcoded summary string is the one form of this defect that cannot be wrong in a detectable way - there is no field for a compiler or a test to notice was omitted.
