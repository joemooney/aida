title: codex-vendor init does not scaffold .codex/skills/ — a codex project has NO working skill surface ($aida-* finds nothing; ~/.codex/prompts is undiscoverable on codex >=0.142)
description: 'Observed 2026-09-12: this repo is [agents] vendor=codex, codex-cli 0.154.0. `$aida-capture` (and all $aida-*) find nothing in codex. aida scaffold preview shows .codex/skills/aida-*/SKILL.md as MISSING — the codex skills pack was never installed at init. The only codex surface that WAS populated, ~/.codex/prompts/*.md, is not discovered by codex >=0.142 (confirmed by aida doctor --category scaffold-drift). Net: a codex-vendor project ends up with zero working AIDA skill surface — a first-user trap directly against the codex-parity goal. Acceptance: (1) aida init on a codex-vendor project scaffolds .codex/skills/ by default (the discoverable surface), not just ~/.codex/prompts; (2) doctor scaffold-drift flags a codex project missing .codex/skills/ with the exact fix; (3) fresh codex-vendor init → $aida-capture resolves.'
