  content: |
    NIGHT READY: PR #2544 green at 130118ef9c6e1c2f9a2f606a47648e5302679aba

    Round 4:
    - **Rebase:** onto main. The `lib_part2.rs` conflict was resolved by applying the live-process skip to the moved `session_gc` in `worktree_gc.rs`. The `session_end` refusal uses the main root that #2543 resolves at the top of the function.
    - **Blocker 1 (refresh worker):**
      - `cache refresh --worker --store --cache` is now dispatched before cwd-based discovery and opens only its explicit paths.
      - The worker's cwd is the main checkout (the canonical store root's parent), never a session worktree.
      - New tests in `task_1527_refresh_worker.rs`: one runs the real worker from a temp dir outside any project, and one goes through the real detached spawn.
      - **bug_1674:** 3 consecutive local runs passed, at 2.18 s, 2.18 s and 2.33 s; CI failed it at 25.6 s before. It is green in CI too.
    - **Blocker 2 (pid namespace):** the `AIDA_TRUST_PID_NAMESPACE=1` opt-out exists. Its hint appears only when the pid namespace is the cause, and once. An unreadable `/proc` or hidepid stays unverified. The pool-full error names why trees were skipped.
    - **Optional items:**
      - On acquire, a tree is skipped, never reset, on a git error, untracked files or a salvage failure.
      - `preserve_dirty_worktree` now fails on a git error instead of reading the tree as clean.
      - The holder scan runs after the cheap idle/expired and git-status checks.
    - **Not done:**
      - There is no `[worktree]` config key for the opt-out, because the holder check has no project context; it is the env var only.
      - `aida worktree pool return` still resets after a failed salvage, with only a warning. This is existing behaviour on an explicit operator command, and it is a possible follow-up.

    Review: a fresh reviewer APPROVED d4c53278 with 3 low findings, all fixed in 130118ef. The orchestrator verified that delta.

    Checks: Build is green at 130118ef, and `make check-ci-fast` passes. Also green: bug_1947 (4/4), task_1527 (7/7), aida-core worktree_ (94/94) and git_ops (65/65).
