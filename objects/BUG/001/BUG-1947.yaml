  content: |-
    **Parked by night relay (Session #4) after review round 3: CHANGES REQUESTED at c515fa4b.** The PR is left open, and the worktree `/home/joe/ai/aida-bug1947` and branch `bug-1947-work` are kept for whoever picks this up.

    Blockers:
    1. **HIGH: the cache refresh worker can no longer start** (`aida-core/src/db/refresh_worker.rs` ~150–165). The worker's cwd is now `/`, but store discovery runs before `cache refresh --worker --store/--cache` is parsed. So every worker exits non-zero, the reader suppresses respawns, and background cache refresh is dead for all users. The spawn code is `#[cfg(not(test))]`, so no test caught it.
       - Fix: run the worker from the canonicalized store root's parent (the main checkout).
       - Or better: handle `cache refresh --worker --store --cache` before discovery (amendment A8).
       - Add a test that spawns the real worker from a cwd outside any project.
    2. **MEDIUM-HIGH: in any non-host pid namespace, all automatic cleanup refuses** (`worktree_holders.rs` `separate_pid_namespace` ~398; `worktree_pool.rs` ~528). This covers Docker/Podman dev containers, Codespaces, CI `container:` jobs, LXD and probably WSL2. There, every scan is Unverified, so:
       - pool acquire never reuses a tree, and the pool ends in a misleading "pool is full";
       - gc, reap, doctor heals and stale-lease release never clean anything;
       - no message names an escape hatch.
       - Minimal fix: an opt-out (`AIDA_TRUST_PID_NAMESPACE=1` or a `[worktree]` config key), named in the reason text, plus a reworded pool-full error.
       - Better default (follow-up): trust the scan when `/proc/self/mountinfo` shows the tree on the container's own root overlay, and stay Unverified for bind, virtiofs, 9p, fuse or nfs mounts.

    Follow-ups:
    3. **MEDIUM: pool salvage-before-reset can be skipped, and the reset still runs.** This happens when salvage returns an error, when `worktree_is_dirty` returns false on a git error, or when the patch builder ignores git errors. Untracked files are recorded by name only before `git clean -fd`.
       - Fix: on any salvage error, or when untracked files exist, skip that tree and create a fresh one instead.
    4. **LOW:** the holder scan runs before the cheap idle/expired check, under the pool lock. Move it after that check.

    Verified correct: the `base_verdict` retry, the chain-session exemption, the drift-guard docs fix and the in-bounds slicing. On the host, `cargo test -p aida-core worktree_` passes (89 tests).
