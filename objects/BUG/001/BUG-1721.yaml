title: 'aida pull completion reconcile is single-pass: a spec unblocked within the same merge stays Done until the next pull'
description: |
  `aida pull`'s merge-time completion reconcile runs a single pass over the
  specs credited by a merge commit. When that one commit completes BOTH a
  blocker and the spec it blocks, the blocked spec is evaluated while the
  blocker is still In Progress, so it is held at Done with:

    ↷ TASK-1548 stays Done — merged, but blocked by TASK-1529 (InProgress)
       (completion waits for the blocker)

  and the SAME commit then bumps TASK-1529 → Completed later in the pass.
  Nothing re-evaluates TASK-1548, so it sits at Done indefinitely. Running
  `aida pull` a second time (which finds "no new commits") bumps it correctly.

  Observed 2026-09-28 on merge commit 59e859b, specs TASK-1529 / TASK-1548.

  This is silent: the operator is told the spec "waits for the blocker", the
  blocker completes seconds later in the same output, and no further prompt
  says the wait is over. A drain that pulls once per merge leaves the blocked
  spec permanently un-credited.

  ## Acceptance

  1. A single `aida pull` over a merge commit that credits both a blocker and
     its blocked spec completes BOTH, in one invocation.
  2. The fix is order-independent: it holds whether the blocker or the blocked
     spec is reconciled first (iterate to a fixed point, or topologically order
     the pass by blocker depth).
  3. A cycle in the blocks graph terminates rather than looping forever, and
     reports the cycle.
  4. A blocked spec whose blocker is genuinely NOT completed by this commit
     still stays Done and still prints the "waits for the blocker" line — the
     existing hold is not weakened.
  5. A regression test constructs a two-spec blocker chain credited by one
     commit and asserts both reach Completed after a single reconcile.
