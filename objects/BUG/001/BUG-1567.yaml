  content: '[aida:implementer] Root cause: the lifecycle/content regression injected a 500ms watchdog deadline, so under scheduler/filesystem contention the watchdog could exit 0 after printing only the timing line. BUG-1569 removed the full-store scan but did not make a finite wall-clock assertion deterministic. Fix: define the existing test-only deadline override value 0 as watchdog-disabled and use it only in the lease lifecycle test, so that test synchronizes on subprocess completion. The dedicated open-stdin test retains coverage of the production watchdog contract; production remains 750ms. Red-first: value 0 previously reproduced the missing protocol line deterministically. Verification: 20/20 separate targeted cargo-test invocations passed while four busy-loop workers saturated a 6-core host; full task_1283_protocol_cli suite 4/4; cargo fmt --check and git diff --check pass.'
