title: tests/test_distributed.sh writes to the real ~/.aida/roles
description: 'Found in BUG-1625''s review. tests/test_distributed.sh writes the operator''s real ~/.aida/roles; it only stays clean when run with a temporary HOME. Tests must never touch ~/.aida. Fix: export a temporary HOME (and AIDA_HOME if used) at the top of the script, and assert nothing under the real ~/.aida changes. Acceptance: running the script leaves the real ~/.aida unchanged (compare its listing and mtimes before and after).'
