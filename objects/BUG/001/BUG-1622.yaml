title: Git option injection via --since git-ref fallback in doctor and digest; doctor silently ignores an invalid --since
description: 'Found in TASK-1509''s re-review. (1) The git-ref fallbacks pass the raw user value to ''git log'' (lib.rs ~24976 in doctor, digest.rs ~135), so ''--since=--output=<path>'' makes git write a file. CLI only, not MCP. Fix: pass --end-of-options (or validate that the value isn''t an option) at every place a user value becomes a git rev argument; grep for others. (2) doctor --since with a garbage or out-of-range value silently applies no cutoff and exits 0. It should fail with a clear error like the other flags. (3) Nits: doctor''s help lists ''git ref/tag'' first; tail''s out-of-range message is generic. Acceptance: a regression test shows an option-like value is refused or treated as a ref name, never as a git option; doctor errors on an invalid --since.'
