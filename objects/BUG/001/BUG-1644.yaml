title: The cache lock-info sidecar is resolved per worktree, so readers in a worktree never see a live writer in the shared cache and stall ~52 s, then fail
description: |
  From SPIKE-90 (docs/research/spike-90-stale-cache-snapshot.md, case W).

  Sibling worktrees symlink `.aida/cache.db` (+ -shm/-wal) to the main checkout (aida-cli-lib/src/lib.rs, BUG-52 block), but `cache.db.lock-info` is not symlinked and `cache_lock_info_path()` derives the sidecar from the UNRESOLVED cache path. A writer in main records `main/.aida/cache.db.lock-info`; a reader in a worktree checks `wt/.aida/cache.db.lock-info`, sees nothing, so the BUG-664 guard (`foreign_writer_holds_lock`) never fires across worktrees.

  Measured on a copy: stale cache + live writer holding BEGIN IMMEDIATE + live sidecar in main `.aida/`. From main: `aida list` 0.04 s. From a symlinked worktree: 52.9 s then exit 1 (incremental exhausts the ladder, then full rebuild exhausts it again). The same mismatch affects `observe_cache_lock` error enrichment and `doctor heal stale-locks`.

  ## Acceptance
  - The lock-info sidecar path is derived from the canonicalized (symlink-resolved) cache path, so all worktrees sharing one cache.db read and write one sidecar.
  - A test with a symlinked cache path and a live foreign sidecar at the canonical location: the read returns the last committed snapshot in < 1 s without entering the write ladder.
  - `aida doctor heal stale-locks` and the lock-error enrichment look at the canonical sidecar; a stray per-worktree sidecar left by older binaries is reported/cleaned.
  - busy_timeout=0 and the retry ladder are unchanged.
