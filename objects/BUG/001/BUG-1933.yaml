  content: |
    [groom:night] APPROVE (supervised). Re-verified on main: `__aida_staged_rs_diffs` in aida-core/templates/hooks/aida-pre-commit.sh still runs each per-parent `git diff --cached` with `2>/dev/null` and an unconditional `return 0`, and the awk pipeline has no sentinel or PIPESTATUS check, so both failures still yield an empty offender list. The night-triage acceptance criteria in the previous comment are testable as written; no description edit. Marked supervised rather than drain-safe because it changes refusal semantics of the pre-commit hook every agent commits through: a wrong sentinel check blocks every commit fleet-wide.
