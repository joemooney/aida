title: Pre-commit provenance gate fails open when a per-parent git diff or the awk scan errors
description: 'Follow-up from the BUG-1925 review (PR #2482, approved at f2d41305e3). In aida-core/templates/hooks/aida-pre-commit.sh, merge mode runs git diff --cached <parent> per parent with 2>/dev/null and ignores the pipeline status. If one diff fails (for example a missing object in a shallow or partial clone), that parent contributes an empty diff and therefore zero offenders, so the gate allows the commit. A crashed awk likewise yields an empty offender list and an allowed commit. The pre-BUG-1925 hook refused in the awk-failure case. Fix: check each git diff exit status (refuse, or fall back to the full first-parent check); have awk emit a final sentinel and refuse if it is missing. Also from the review: add perf-test cases for an octopus merge (multi-line MERGE_HEAD), a file renamed on one side, and a resolution that duplicates an existing debt line; optionally print one ''scanning N files'' line before git diff starts. Acceptance: a simulated failing per-parent diff and a simulated awk failure both refuse the commit; existing tests/test_precommit_provenance_*.sh pass unchanged.'
