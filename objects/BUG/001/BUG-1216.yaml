  content: 'Second instance (advisor, 2026-09-18 02:35): harvesting BUG-1218 produced BUG-1218.AC557146 and .AC557147 although its description has NO line-start `## Acceptance` / `Acceptance:` section — so parse_acceptance_criteria is finding hash-labelled criteria from an inline "Acceptance:" mid-paragraph (or similar prose), and next_ac_label again turned a hash tail into a number. Two additions for the fix: (a) include this shape in the fixture (inline "Acceptance:" inside a paragraph, followed by bullets) and decide explicitly whether it should parse at all — if it does, the harvested line must land in that same span, not in a new heading; (b) repair BUG-1218''s two labels alongside BUG-1209''s (AC557146 → AC1, AC557147 → AC2); no tests trace them yet.'
