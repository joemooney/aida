title: Carried-forward finding sweep treats resolved request-changes findings on an APPROVED verdict as outstanding
description: |
  Observed 2026-10-04 on BUG-1794 / PR #2410: the rework-then-approve cycle produced phantom draft TASK-1-204.

  Mechanism: `aida review record --verdict approved` with no --finding flags preserves the previous round's findings[] in the verdict record (documented behavior). The carry-forward sweep then reads "APPROVED verdict with findings[]" and files each finding as a draft task "carried forward from an APPROVED review verdict" — but those findings were the BLOCKING findings of the request-changes round, and the approval exists precisely because the rework addressed them. Result: every request-changes → rework → approve cycle mints a duplicate task for work already shipped, and an advisor has to spot and reject it (TASK-1-204 was rejected with the evidence trail).

  Possible fixes (implementer/product to choose): (a) the sweep skips findings whose round predates the approving round; (b) `review record --verdict approved` requires an explicit per-finding disposition (resolved | carry-forward) when the prior round had findings; (c) approval clears findings[] by default with an opt-in --carry-findings. Option (a) is least intrusive; (b) is the most honest audit trail.

  Acceptance sketch: after a request-changes verdict with finding F at sha A, then an approved verdict at sha B with no --finding flags, the carry-forward sweep files nothing for F; a finding explicitly re-recorded at approval time still carries forward.
