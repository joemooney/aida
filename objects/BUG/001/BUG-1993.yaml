description: |-
  Routed by performance-guard-route (2026-10-12 ~16:36Z). Advisor ran `aida doctor check performance --fail-on-findings` at 09:45 local:
  - show: 24.5% of 831 calls over the 1000 ms budget in 24h (tolerated 10%), worst 30740 ms; CEILING (5000 ms) BREACHED.
  - Per binary: 97453570d6 (live, BUG-1944) 8.2% of 477 — within tolerance; 95f15a20d4 (target/agent build at STORY-1652 #2540, show markdown rendering) 46.7% of 351; 4cced67be8 1/2.
  Context: heavy machine load today (3 relays + subagents, load avg 15-60), and BUG-1956 (#2552, reader-side inline refresh bound under a busy writer) merged AFTER 95f15a20d4. The trip itself was not recorded in failure_trips (newest is 2026-10-03) — that is BUG-1961 (#2556, approved, awaiting operator merge).
  Advisor decision: NOT a budget change. Treat as a possible regression to triage: (1) re-measure show on current main (>= d57f76a277, includes BUG-1956) under comparable load; (2) if still >10%, bisect between 97453570d6 and 95f15a20d4 (candidate: STORY-1652 markdown rendering at a terminal, or cache refresh contention).
  ## Acceptance
  - A measurement on current main, with load noted, either shows show within budget (close as fixed by BUG-1956) or identifies the regressing commit with a fix.
