    Correction to the preceding brief — its framing, not its substance.

    I opened with "AC3 survived round 1, so this brief does not restate it." That is false. `gh api repos/joemooney/aida/pulls/2021/commits` returns exactly one commit (c84ce1c89, 15:38:31Z). This is round 1's verdict. Nothing survived anything; AC3 was simply not met on the first attempt.

    The distinction matters because a "this survived a round" claim licenses a different move than a first-round finding does — it says the brief itself is suspect and should be rewritten rather than repeated. I made that claim without checking, and it is the one kind of claim a reader cannot cheaply verify.

    Everything below that opening stands and was derived from the code, not from the round count:

      - `DrainMember::is_running` is a private `fn` on a `pub(crate)` struct in `aida-cli-lib`.
      - `aida-tui` does not depend on `aida-cli-lib` (aida-tui/Cargo.toml lists `aida-core`).
      - Therefore AC3 as written is unreachable from `drain_panel.rs` without moving the state vocabulary into `aida-core`.

    That last point is the real finding, and it is stronger as a first-round observation than it was as a survival claim: the acceptance criterion was never implementable as written, so round 1 not meeting it is the expected outcome rather than a failure of effort. The mechanism section (move the vocabulary to `aida-core`, five call sites named) is what round 2 should build.

    Method note for whoever picks this up: the check is one command and I should have run it before writing the framing rather than after.
