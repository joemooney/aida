  content: 'Bumped to completed by hand. The work landed in PR #2337 (merged 2026-10-02 14:16 UTC), but the squash subject on main is `wip: salvage claude/bug-1681 (#2337)` — no `[AI:tool] type(scope):` prefix and no `(BUG-1681)` trailer — so merge-time auto-completion had nothing to key on and left this spec at in-progress. Flagging the mechanism rather than just the symptom: a non-conforming squash subject silently strands its spec, and nothing reports it.'
