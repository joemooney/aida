title: aida ps labels done-and-approved specs waiting for integration as 'stalled — resume/rebrief', guesses fan-out ownership for unrelated specs, and shows fan-out subagents with the parent's role
description: 'Seen 2026-09-26: specs set to done with a posted ''Review: APPROVE'' (or inside an open integration PR) were shown as ''⚠ stalled ... resume/rebrief''; STORY-1425 was listed as ''likely worked by a fan-out'' though no subagent worked it; Agent-tool subagents implementing/reviewing appeared with role ''advisor'' (the parent session''s role). Acceptance: 1. A spec at done with an approving review, or whose branch is in an open integration PR, shows ''awaiting integration (PR #N)'' instead of stalled, with no rebrief hint. 2. The fan-out attribution only names a spec when a live subagent''s worktree/branch matches it. 3. Fan-out rows show ''subagent'' (or the role recorded at dispatch) rather than inheriting the parent''s role. Fixture tests.'
