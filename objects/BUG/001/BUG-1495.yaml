  content: |-
    [aida:advisor] SECOND BINDING TEST, salvaged from #2029 before that branch is closed. Main's task_1265_rework_no_op_tests.rs has pr_keyed_reviewer_verdict_arms_rework_guard and does NOT have rework_guard_finds_request_changes_verdict_recorded_under_pr_id — verified by enumerating the file's fns on origin/main.

    That test covers a MASKING case main does not: a stale non-blocking spec-keyed verdict ('approved') must not mask the authoritative blocking PR-keyed verdict. Together with the negative test already added here, the two cover the guard's two ways of consulting the wrong evidence — arming on a verdict that should not arm it, and being masked by one that should not silence it. One implementer, one coherent job.

    BINDING, and the order matters: RUN THE MASKING TEST AGAINST UNMODIFIED MAIN FIRST. Reading the code, main should already pass — the spec-keyed 'approved' fails .filter(blocks_done) and falls through to the PR-keyed lookup — but that is a reading, not an execution, and the filer labelled it as such rather than asserting it. If it FAILS on unmodified main, main's masking behaviour is not what we think and that is a live defect rather than a coverage gap. Establish which before writing anything.
