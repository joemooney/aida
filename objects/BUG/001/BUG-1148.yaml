title: 'awaiting/status nightly-red signal is stale: a newer green workflow_dispatch on main does not clear it (only schedule runs are read)'
description: |-
  Observed 2026-09-13 21:10 local: aida awaiting / aida status report "cross-platform nightly red since 2026-08-24 (run 34754786464, 20 nights)". But the fix for that red (PR #1800, BUG-1127, merged 18:00Z) is on main, and gh run list --workflow cross-platform.yml shows two NEWER successful runs: a workflow_dispatch on fix/xplat-nightly (17:40Z) and a workflow_dispatch on main at e49850f81 (22:10Z), which is a descendant of the failing scheduled run's SHA 88b6c6d1f. The signal stays red until the next cron fires, so the operator sees a 20-night alarm for a problem that is already fixed and verified on main.

  Root cause (aida-cli-lib/src/lib.rs): nightly_red_status feeds summarize_nightly_red_runs with fetch_scheduled_cross_platform_ci_runs, which only fetches event=schedule runs. A newer green run on main of any other event (workflow_dispatch, the release pre-check's dispatch) is invisible to the streak logic.

  Fix: after computing the scheduled streak, also fetch the latest COMPLETED run on the main branch regardless of event; if it is newer than the latest scheduled failure and its conclusion is success, clear nightly_red (or render "nightly red on <date>, cleared by run <id> on main" for one cycle). Keep the streak count (nights) scheduled-only so it still means nights.

  ## Acceptance
  - Scheduled failure at T0, workflow_dispatch success on main at T1 > T0 whose SHA descends from the failing SHA: nightly_red is None (awaiting/status/statusbar show no nightly-red).
  - Scheduled failure at T0, dispatch success on a NON-main branch only: nightly_red stays set (a branch-only green proves nothing about main).
  - Scheduled failure at T0, later dispatch FAILURE on main: nightly_red stays set.
  - Unit tests next to latest_scheduled_success_clears_nightly_red cover the three cases with fixture runs (no network).
