- id: 01a0e08a-19c1-73a2-ba67-fb85be894f38
  author: mcp
  content: |-
    ADVISOR — REQUESTED REVISION / OPERATOR TRUST-MODEL CHOICE REQUIRED. NOT SIGNED OFF. PRODUCT MAY NOT DISPATCH BUG-1669.

    Independent advisor: Codex, separate from sketch author/product/implementer. Reviewed AGENTS.md, .aida/discipline/two-seat-protocol.md, BUG-1669 --full (currently Approved), and SKETCH 01a0e086-e274-7333-9fa5-28891f6a88d0. Source examined at 854b7e26f7222c73845064275a18c293c9895283. Approved lifecycle status is not architecture signoff. This disposition does not authorize implementation, queue changes, dispatch, or merge.

    Evidence and inventory:
    - The sketch correctly identifies the central AC2 mismatch. orchestrator.rs::detect -> classify -> run_is_live accepts any nonempty AUTO_COMPLETE, a parseable UUID equal to DrainState.run_uuid, and pid_is_alive(orchestrator_pid). drain_state.rs:383-399 reads/writes ordinary .aida/drain-state.json. process_probe re-exports aida_core::liveness::pid_is_alive; on Unix liveness.rs:579 probes kill(pid, 0), accepting EPERM too. No issuer authentication, caller ancestry, process-start identity, spec/phase or operation authorization is checked. A same-user agent can write its own UUID plus a live PID or replay a readable live token. The existing run_is_live_true_when_token_matches_live_drain test even constructs state with the test process's own PID. This is corroboration, NOT an unforgeable dispatch credential. UUID entropy, chmod 0600, ancestry alone, or private Rust permit fields do not repair that same-user boundary.
    - Independently traced bypass literals/builders and caller references: compete and zen arms/judges (compete_cmd.rs:794/818; destructive worktree removal starts at 833); intake assess (lib.rs:56164 onward, direct status); burndown quiet/verbose/resume (56499 onward); shared session fresh/exec/resume sinks and research/remedy/dryrun-AI/intent/harvest/reconstitute/queue implementer/reviewer callers; advisor-watch fork/cold boot; direct RealPhaseDriver advisor (103815) and CI-fix (108696); agent-new foreground/background/config/default flags and interactive session/reviewer plans. Codex/Agy headless builders ignore contained and still emit bypass. These support sketch groups A-F; the title's three commands are not the full scope.
    - Add explicit wrapper coverage to the PR inventory: solo_cmd.rs::solo_cycle launches intake --apply and burndown run; shift.rs builds queue work --batch ... --auto-complete --no-human=both and launches detached or via systemd. maintenance_schedule.rs and schedule_driver.rs supply scheduler plumbing. Wrapper routing must preserve refusal and must not manufacture authority. Do not describe a scheduler invoker tag, user systemd service, or no-human acknowledgement as authenticated approval.
    - Confirmed scripts/aida-demo.sh:1029 executes a bypass probe, and scripts/ablations/gate-vs-rule*.sh execute bypass vendors. Distinguish those from printed previews. List them explicitly in the PR; the revised scope must adjudicate the shipped demo probe, not silently call every script nonproduction. Pure argv renderers/previews are not launches. Arbitrary executables/vendor-local settings remain a stated boundary; a gate on AIDA flag-emitting paths cannot promise mediation of arbitrary same-user shell execution.

    Required operator choice (the advisor does NOT choose a weaker requirement on the operator's behalf):
    A. Retain literal AC2 protection against a same-user agent able to use shell/files/PTYs. Revise the architecture around an approval/credential issuer and enforcement boundary inaccessible to that agent, with authenticated, scoped delegation. Identify how the agent is prevented from modifying the verifier/binary/state or bypassing the issuer. A same-UID file secret or MAC whose key is readable by the agent is insufficient. This is a larger security-boundary design requiring a revised sketch and independent review.
    B. Explicitly amend AC2 to a trusted-local-state, cooperative/confused-agent guardrail: live-run corroboration plus explicit terminal confirmation, with malicious same-user file/env/PTY forgery and direct vendor execution outside the guarantee. Record the operator's acceptance of that weaker guarantee in the spec itself and stop calling the token unforgeable. This makes a smaller fix possible, but still requires the bounded design revisions below.
    Until a choice is recorded and a revised sketch is signed, retain literal AC2 and block dispatch. Neither option is approved by this comment.

    Revision constraints / unresolved gates (not conditional signoff):
    1. Token scope: reject an ambient root-wide license. Propose a grant bound to canonical repository identity, run identity, approved operation, spec set and permitted phase/child operations, with explicit delegation and lifetime. Single-spec grants cannot start unrelated compete/intake/watch or expand a wave. A wave may delegate only to its fixed approved members; expansion needs fresh authorization. Define owner death, restart, PID reuse, expiry/revocation, concurrency and token rotation. Today's detect cannot enforce this; specify the actual verifier/data flow and tests. Controller authorization must precede token minting, queue mutation and --with-plan; required credential publication must fail closed.
    2. PTY: authority_stdin_is_terminal and authority_stdout_is_terminal are IsTerminal checks (lib.rs:34612-34630). An agent-created PTY can satisfy both and answer yes. Thus they prove neither human identity nor human consent under option A. A requires an out-of-agent trusted approval channel. Only an explicit option-B amendment can accept the conventional default-no terminal prompt as a guardrail. Scope consent to the named operation/children; EOF/error/no refuse; flags, roles, --force, --yes and acknowledgement files cannot replace it.
    3. Burndown fan-out: source explicitly says the launcher holds only a lock, writes no per-phase state, passes AIDA_BURNDOWN_LOCK_HELD=1, uses Claude-native subagents, and allows three continuation rounds. A local in-memory permit covers the parent launches only; it does not authorize descendant AIDA processes, nor mediate native vendor subagents. Revised sketch must choose either controller-mediated child launches or a separate scoped wave-to-run delegation design with authenticated transport appropriate to the selected threat model. Show native fan-out treatment, nested per-spec runs, concurrent/pipelined runs, quiet/verbose/continuation behavior, and state ownership without shared drain-state overwrite. No lock flag exception. If native fan-out is to be excluded, amend scope explicitly. This remains a signoff blocker.
    4. Advisor-watch: grant only named watch work for one process lifetime, with an explicit time/wake bound and termination on home/away-TTL expiry, revocation or owner death. Revalidate each wake before transcript copying/log creation and spawn; restarting cannot inherit durable blanket consent. An ordinary implementation/reviewer run token must not authorize a watch. Fork and cold boot need identical enforcement. These are requirements for a revised design, not approval of an indefinite watch permit.
    5. Scheduler/solo: no grandfathering of current unattended bootstrap. Without an explicitly scoped authenticated grant, bypass launches refuse and report refusal rather than retry through another launcher/vendor. Read-only schedule due/status/maintenance can continue. If unattended launch continuity is required, specify an operator-authorized, bounded scheduler grant and credential delivery/revalidation across detached/systemd paths; same-user service provenance is not sufficient for option A. Product must acknowledge this operational consequence in the revised sketch.
    6. Enforcement/tests: preserve caller-before-side-effect and shared-sink checks, resolved vendor posture, canonical roots, and existing workflow gates. Denial must not be caught as a failed compete arm followed by an authorized-looking judge. Keep the sketch's hermetic fake-HOME/PATH per-branch tests, but change the security interpretation of the proposed positive fixture: hand-written state + fixture PID demonstrates the existing forgery, not security. Under A it must fail; under B it may pass only with the weakened guarantee explicit. Add PTY fabrication, unrelated spec/phase/operation, replay/rotation, wave delegation, native fan-out boundary, watch expiry, and scheduled bootstrap cases. Test refusal before worktree/lease/log/state mutations and zero vendor launches. A helper-only test does not satisfy AC4.

    Disposition: requested revision with an explicit operator choice blocking security signoff. The inventory and typed-permit direction are useful, but accepting them as-is would silently weaken AC2 and leave burndown/scheduler authority unresolved. No binding approval amendments can make this sketch signable without that choice and concrete delegation design. Product may prepare the revision/operator decision; product MAY NOT queue or dispatch BUG-1669 on this review. No code edits, launches, tests, queue/dispatch or merge performed; existing untracked .codegraph/ and target-review/ left untouched.
