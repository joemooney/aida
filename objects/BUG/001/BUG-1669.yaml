title: Headless commands that hard-code full-access bypass can be started by any agent without dispatch authority (compete, intake assess, burndown run)
description: |-
  Found by the TASK-1500 advisor (amendment A10); orchestrator confirmed compete.rs builds 'claude -p --permission-mode bypassPermissions' argv unconditionally. Intake assess and burndown run need the same audit. Any agent allowed to run 'aida *' can therefore start a detached full-access child with a prompt of its choosing.

  Acceptance:
  1. Audit every production code path that launches an agent with a bypass/full-access flag; list each in the PR body with its authorisation check.
  2. Each such path launches bypass only when (a) a human confirmed at a real terminal, or (b) the unforgeable drain run-token check (orchestrator::detect) confirms a dispatched drain child; an environment variable alone grants nothing.
  3. Otherwise it refuses with a plain message and launches nothing.
  4. Tests with a fake HOME and an injectable terminal check prove refusal for each listed path and that the drain-token path still works.
status: Approved
priority: High
owner: ''
feature: Uncategorized
