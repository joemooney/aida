- id: 01a0e116-d863-7bd3-9a94-faa8e2c3888c
  author: codex-fresh-architecture-sketch-advisor
  content: |
    REVISED SKETCH — P-enrolled-host protected authorization; awaiting independent advisor signoff:

    Author: fresh Codex architecture sketch-author advisor, separate from product, prior sketch/advisor seats, and the future independent gate. Design only; this comment is not signoff. Read AGENTS.md, two-seat protocol, rework-brief craft, recovery playbooks, BUG-1669 --full and all nine existing comments. Used only /home/joe/ai/aida/target/release/aida for AIDA reads/writes (0.15.0, build 7c6faed690+dirty); inspected source HEAD 854b7e26f7222c73845064275a18c293c9895283. Existing untracked .codegraph/ left untouched. No implementation, test execution, queue/status change, installation, credential migration or merge.

    Decision trail: Joe 19:13, 01a0e0a3-e301-7c72-83e7-68ab14eaf9e0; Joe 20:57 (recorded 20:58), 01a0e103-c774-7620-b1dd-f783c05bcb81; independent disposition 01a0e106-45f4-7a51-9107-7cadcc06eaf0; Joe 21:07 (recorded 21:08), 01a0e10c-66ae-7883-9f98-f422dff413fa. Prior review obligations remain from 01a0e08a-19c1-73a2-ba67-fb85be894f38 and 01a0e0ad-9b81-7e61-a3d4-8d00ef3077f8. This replaces the architecture proposal in 01a0e0a8-db11-7660-832d-7d55f00f0c21; it does not erase its evidence or waive its review findings.

    1. Settled contract and acceptance reconciliation

    P-enrolled-host is the accepted design direction IN PRINCIPLE: every AIDA-managed agent launch on this host, across projects, enters one host authority; unknown projects and unsupported routes refuse. Enrollment enables scoped requests, never an exemption. Full vendor access is inside a service-owned isolated worker, without unrestricted host HOME, processes or credentials. Unmanaged vendor clients outside AIDA using independent authority remain outside this promise. This is not P-managed confinement of all workstation software and not selection of H's deny-only substitute. Do not ask Joe those settled questions again.

    Proposed precise AC interpretation/text for product to record later (this comment does not edit the spec):
    - AC1: inventory all AIDA-managed production agent launches, including configured/foreground/resumed/wrapped/script routes and effective vendor posture, across projects; each has protected admission or explicit refusal.
    - AC2: a full-access launch requires either explicit operator approval through an authenticated, agent-inaccessible approval endpoint displaying the exact scoped request, or an authenticated, still-live, scope-limited controller delegation derived from such approval. The broker validates and performs the launch atomically. A terminal is only a request/display surface unless it is that separately protected endpoint. IsTerminal, a PTY plus yes, legacy detect, UUID/PID/state, role and environment never grant authority.
    - AC3: otherwise typed nonzero refusal and no agent launch, no alternative vendor/backend/local fallback, and no launch-associated mutation before a valid preparation reservation.
    - AC4: retain fake HOME, injectable terminal observations, real-handler per-sink refusal and positive drain coverage; reverse the old writable-state/live-PID positive fixture into a required forgery-negative. The positive is authenticated approval -> protected controller -> scoped phase worker -> allowed next phase over real protected channels. Add hermetic protocol coverage AND disposable actual-boundary evidence. Test injection is not a production authorization feature.

    orchestrator.rs::detect -> classify -> run_is_live currently only corroborates writable DrainState plus UUID and PID. Keep it diagnostic, audit every authority-consuming caller, and introduce a request-specific protected_dispatch_authority API rather than strengthen the meaning of an ambient is_orchestrated boolean. No environment-carried bearer run token. AC2's word “unforgeable” describes the required boundary, not today's detect implementation. authority_stdin_is_terminal/authority_stdout_is_terminal remain UX/test observations, never the issuer. These interpretations preserve Joe's literal requirement; the old mechanism names cannot override it.

    2. Host-wide admission, repository identity, and honest coverage boundary

    Proposed host registry is protected service state: host/broker identity, enrollment generation, canonical repo ID, approved forge identity and refs, import/export roots, adapter/image versions, supported protocol schemas and policy. It is not project .aida configuration. Every official entry point is a thin proposal/status/attach client; only installed service code can execute an agent. All postures, including “contained,” use the same external worker boundary in v1. There is no retained local contained launch that could escalate or invoke unmediated descendants. Vendor flags can tighten guest permissions but cannot weaken the VM boundary.

    The broker normalizes typed operations itself. It does not trust a client version string, executable path, PATH lookup, local git remote, .git indirection, AIDA_DRIVE_ROOT, caller-provided role, argv, or grant ID as authority. Supported public protocol clients can propose; even a copied or adversarial client cannot approve, acquire a controller principal, select a privileged executable, or turn an ID into authority. Unsupported schemas refuse before preparation. Pin execution code/images at the service, not by trusting a hash reported by the requesting CLI. Unknown adapters, custom executables, arbitrary extra flags, AIDA_AGENT_CMD/AIDA_COMPETE_JUDGE/AIDA_OS_WRAP overrides refuse unless converted to an enrolled, reviewed typed adapter configuration.

    Repo A consent never authorizes repo B. Bind repo ID + enrollment generation + base artifact + spec/plan content digests + operation/phase to every grant, artifact and adapter call. Sibling worktrees import into the same enrolled identity only through validated snapshot manifests. Same path, same spec number, cloned remote, symlink switch, renamed checkout or copied .aida-store cannot transfer authority. A cross-project operation needs separately approved per-repo roots; v1 has no cross-repo parent grant and no implicit sharing of artifacts, transcripts, model context or credentials. A host-wide scheduler can display multiple jobs but each has independent authority and counters. New repositories inherit nothing.

    Mandatory cutover contract: inventory global and per-project binaries, installed wrappers, IDE/MCP launch commands, shipped scripts, tmux routes, cron, user/system units and detached processes for ALL managed projects; replace supported entry points with broker-only clients, disable old launch services and revoke old AIDA execution credentials. Do not trust or execute target/release as installed privileged code. The release binary used to write this comment is not a trusted deployment artifact. Installation uses a separately verified immutable package. Unsupported old binaries remain read-only tooling at most; they cannot remain supported execution paths.

    Important limit, not a scope escape: public IPC cannot distinguish an honest CLI from a modified same-user client, and an unrestricted login can reconstruct an old CLI's shell behavior using independent unmanaged vendor credentials. The proposed boundary prevents those clients obtaining protected AIDA resources. It does not prove that arbitrary copied programs cannot run unrelated clients. An official legacy AIDA route that still launches using host credentials is a FAILED cutover case, not something to relabel “unmanaged.” Before a host-wide coverage claim, the installation inventory must show no retained official route has that behavior, and managed launch principals must lack those credentials/host execution bridges. If the actual host requires an official route to retain independent host execution, return that concrete incompatibility to Joe; do not claim coverage or silently require migration of every unrelated vendor client. Preventing arbitrary reconstructed legacy programs with independent credentials would exceed P-enrolled-host; no provenance detector or version allowlist is asserted to solve it.

    3. Chosen design candidate, principals, authenticated channels

    Chosen candidate FOR THIS SKETCH: Linux KVM + Firecracker microVMs, launched through Firecracker jailer, one cold-booted disposable VM per phase attempt, immutable guest base plus private scratch disk. No VM snapshot restore or live migration in v1. This is a concrete candidate for independent architecture review, not Joe's backend selection or permission to install. Exact host/kernel/Firecracker/guest/vendor/TLS-library versions and digests are release qualification inputs still to be pinned; no assertion that this machine currently qualifies.

    Why this candidate: small VM device surface, separate VMM processes and a documented jailed deployment and per-VM vsock/Unix-socket transport. Alternatives: QEMU/KVM with libvirt and sVirt could supply the boundary but adds a larger device/management surface; a dedicated execution host can improve separation but introduces remote channel/operations work; rootless containers/bwrap or a same-UID daemon alone do not supply the selected independent kernel boundary. None is an automatic fallback. A backend change requires a reviewed ADR and its own boundary tests.

    Proposed service principals and ownership:
    - Independent administrator/offline release principal installs policy, pins builds, enrolls the approval device and performs recovery; no agent-accessible sudo/polkit path, signing key, management group, cached admin session or approval-device control.
    - aida-broker owns grant/epoch/enrollment/audit state and approval protocol; aida-controller owns deterministic transitions over an authenticated private service socket. Neither parses arbitrary repository programs as privileged instructions.
    - A minimal root domain supervisor owns KVM/jailer creation, fixed service unit policy, kill operations and resource caps; it accepts only typed domain plans referencing installed hashes. Per-VM jailer UIDs/cgroups and private runtime directories prevent VMM siblings inspecting one another.
    - Separate model/forge/artifact adapter principals own only their credentials/resources. No worker or CLI receives upstream credentials. The guest worker is untrusted, including root in that guest; all its processes share that attempt's limited rights.
    - Code/dependencies/images under administrator-owned immutable /usr/libexec/aida-launch and policy under /etc/aida-launch; protected DB/audit under /var/lib/aida-launch; private per-domain sockets/disks under a service-owned runtime/storage tree. These are proposed paths, not files created here. No writable host mounts, SSH agent, Docker/libvirt/tmux socket, home directory or host network device in workers. No guest NIC in v1; resource traffic uses typed vsock adapters only.

    Approval: choose a separate operator device running a reviewed approval client with a non-exportable device key and explicit local user verification. Initial pairing occurs through the independent administrator console, exchanging broker public-key fingerprint and device public key out of band. No enrollment through ordinary CLI/localhost PTY. TLS 1.3 mutual authentication over a separately configured approval listener, with application approval signatures using a standard reviewed signature library, binds broker/host ID, fresh broker epoch, random single-use nonce, canonical request digest, repo/members/phases, artifact/input policy, vendor/image, budgets, detach behavior and expiry. Device fetches the normalized request directly from the pinned broker and displays it; a QR/link from an agent is only a locator. No TLS 0-RTT for mutations. Timeout, cancellation, changed digest, replay or unknown key denies. Public local Unix IPC accepts rate-limited proposals/status only; SO_PEERCRED is attribution, not human consent. Approval credentials never enter agent HOME, env, argv, logs or guest disks. Listener address/port is a later deployment choice; consult the host ports registry then.

    Worker channel: supervisor creates a unique per-domain Firecracker vsock backing Unix socket in its private jailer tree and records domain UUID, boot nonce, cgroup/process identity, image digest and current broker epoch. Broker initiates connection through that specific service-held endpoint. A one-boot mTLS credential and pinned broker trust are injected in a private initialization disk, never in shared image or host user files. TLS plus a nonce challenge binds domain/boot/epoch/protocol and a fresh channel generation; broker requires BOTH the certificate and its independently held endpoint/domain mapping. A guest claiming a CID/run/PID or host caller presenting a stolen worker ID/certificate over public IPC fails. Distinct approval, controller and worker endpoints/key usages prevent role confusion. No generic tunnel or forwarding API.

    Reconnect is broker-initiated to the same still-live mapped instance, re-challenged with a new channel generation; old channels close and old sequence numbers reject. Uncertain identity, reused endpoint, stale epoch or lost supervisor mapping terminates the attempt. IDs and forwarded FDs alone confer nothing. Guest compromise can use or relay that guest's already narrow operations; do not claim process-level separation inside a compromised VM or prevent colluding guests sharing permitted data. It cannot turn a worker channel into parent/sibling authority. Cross-domain resources remain checked on every request regardless of claimed IDs.

    4. Typed resource mediation, pinned updates and recovery

    Model adapter: enum provider/model + bounded generation request/messages/tools schema, fixed upstream endpoints/TLS trust, allowed models, token/cost/request/concurrency limits charged to the grant tree. No caller URL, proxy CONNECT, redirects to arbitrary destinations, arbitrary HTTP headers or upstream bearer token return. Vendor CLI compatibility must use a reviewed protocol adapter; a vendor needing unrestricted login HOME, generic network proxy or reusable OAuth credential is unsupported until separately designed. No promise that every current Claude/Codex/Agy configuration will work on day one. Vendor tool/shell execution stays in the guest. Model output is untrusted; scope controls resources/actions, not whether thought content follows a spec.

    Forge adapter: typed read revision/diff/status, upload approved patch/commit artifact, create/update the grant's named branch or PR, with pinned forge/repo ID, expected old ref, allowed ref prefix and operation. No arbitrary REST/GraphQL passthrough, credential helper, arbitrary remote URLs, force-push, default-branch write, workflow/secret administration or merge under a launch grant. Merge needs its existing independent governance and a separately designed explicit authorization; this bug does not grant it. Narrow upstream credentials per repo/action where available; service policy enforces the finer phase restrictions. Treat pushes/PRs that trigger CI as credential-bearing effects: pin allowed CI policy, forbid workflow-definition changes or privileged workflow triggers under ordinary code grants, and require separate reviewed authorization for those actions; downstream CI must not expose protected secrets to untrusted worker code. Otherwise the forge adapter recreates a host/credential escape and that repo is unsupported. Revalidate before every side effect; bounded in-flight operations are audited and cancelled on revocation where supported, without promising reversal.

    Artifact adapter: typed import/export of content-addressed manifests, bounded file count/bytes/depth, normalized relative paths, regular files/directories only in v1. Reject traversal, symlinks/hardlinks, devices, sockets, absolute paths, setuid metadata, archive bombs, .git hooks/config and arbitrary external submodule/LFS URLs. Import parsers and git interpretation run in disposable untrusted workers; privileged host logic handles validated blobs, not repository hooks or shell. Export to enrolled staging destinations through safe directory-relative creation with no symlink following; publish only enumerated refs/paths after validation. Treat transcripts as scoped artifacts bound to source repo/run/phase/hash, not trusted instruction or credentials. Logs are bounded untrusted data too.

    Every adapter receives a broker-derived principal/scope, not worker-asserted permission; each operation checks epoch, revocation, deadline and remaining quota. Long model streams have cancellable sessions and bounded lease refresh. No fallback to direct network if an adapter is down. Worker-to-worker copy, model context reuse and forge effects across repositories require explicit separately authorized export/import; default deny.

    Installer proposal (to return as a concrete manifest before execution): independently verified release bundle with broker/controller/supervisor/adapters, unit definitions, policies, guest kernel/rootfs, vendor runtimes and dependencies pinned by digest; offline/admin-approved signing trust and immutable installation. Never promote an agent-built target directory directly into trusted execution. Verify effective admin reachability, file/parent-directory ACLs, group/polkit/sudo/systemd/KVM access, backup permissions, inherited FDs/env and management sockets. Patches include host microcode/kernel/hypervisor advisories; a signed package is integrity evidence, not proof of correctness.

    Updates: stop admission, revoke grants, kill/reconcile workers, independently approve new manifest, atomically activate only verified service-owned artifacts, advance epoch, run boundary health checks, require new grants. No hot update from a worker artifact. Rollback is a new administrator-approved activation of an allowed old build with a NEW epoch; never restore grants or a vulnerable revoked build automatically.

    Recovery: on broker/domain-manager restart or DB/audit corruption, deny, stop/reconcile all old domains and adapter connections, generate a fresh boot/authority epoch before serving, then reapprove. Use a fresh high-entropy epoch per service boot; deployment anti-rollback generation is kept outside restorable grant backups, with independent administrator/device recovery reconciliation. Backup restore restores configuration/audit for inspection, not active approvals or budgets. VM/whole-host live-state snapshot resurrection is unsupported; qualification must either exclude it operationally and technically from agent control or supply an independent rollback fence. Device loss revokes its keys and grants; replacement enrollment requires the same independent administrator trust root, not a CLI recovery code. Normal rotation authenticates old+new keys with admin confirmation; emergency rotation uses offline recovery. Uninstall revokes first, kills domains, removes service credentials/units and leaves official launch clients refusing; it must not restore legacy bypass. No such actions are authorized now.

    5. Grant graph and transition table

    Server-side grant fields: host/broker epoch and enrollment generation; root/run/wave/parent IDs (public handles only); approval reference and request/content digests; repo/base/input/output lineage; exact members and phase/operation edges; installed adapter/image/launch-template digest and resolved posture; authenticated controller/domain owner; not-before/absolute deadline/elapsed ceiling; preparation, launch, retry, continuation, concurrency, token/cost/artifact quotas; state and revocation generation. All descendants have subset scope and an equal or earlier deadline; root budgets aggregate across them.

    Proposed transition table (principal | from -> to | condition/effect):
    - Untrusted CLI | none -> Proposed | normalize bounded request read-only; no grant, queue/lease/worktree/log mutation or vendor process. Broker refusal audit is the only exception.
    - Enrolled approval device | Proposed -> Approved root | exact digest + fresh nonce + explicit approval; atomically consume approval once. Operator reject/timeout -> Denied.
    - Protected controller only | Approved -> PreparationReserved | exact operation/member, consume preparation budget and durable attempt ID before --with-plan, transcript copying, locks, queue/tag/lease/state/log/worktree preparation. LLM request can suggest, never reserve authority itself.
    - Protected controller only | wave/schedule/watch parent -> child reservation | explicitly enumerated edge/member/duty, live parent, aggregate budget transaction; child cannot inherit parent delegation. Separate records for wave, per-spec run and attempt.
    - Broker + supervisor | PreparationReserved -> Starting -> Running | validate full scope, artifact lineage, backend health and revocation under serialized Start/revoke ordering; persist attempt/budget before domain allocation. Same attempt retry returns same result/status. Ambiguous start remains reserved/reconciling; never free a budget slot into a second launch.
    - Worker attempt | Running -> ResultSubmitted | submit bounded source-bound artifacts/proposals only. Cannot approve its output, mutate security state, delegate, start a sibling or merge. Protected collector hashes/records output; validation happens before reuse.
    - Protected controller | validated result -> next allowed phase | implementer -> reviewer -> advisor where required; CI failure -> bounded CI-fix -> reviewer; requested rework -> bounded implementer -> reviewer; optional plan/research/harvest only if explicitly included. Existing independent lifecycle gates still constrain progression. No self-authored verdict grants scope. Agent-written status/tags/comments may stop or suggest a transition, never create permission.
    - Protected controller | completed/failed attempt -> retry/resume | permitted edge, same approved inputs or validated prior output lineage, fresh worker, remaining shared budget/deadline; source-bound transcript only. Exhaustion -> terminal failure/expiry, no new root.
    - Approval device or trusted expiry/revocation/controller-owner-loss | any live root -> Revoked/Expired | atomically block new work, invalidate descendant/adapter rights, terminate active domains within supervision bound.
    - Supervisor/adapter collector | Running -> Finished/Failed | durable observed execution result, accounting and cleanup; no refund of consumed launch attempts merely because a process failed. Unused reserved capacity can be released only after authoritative proof no start occurred, never on client timeout alone.

    Allowed root operations are explicit: single drain, compete arms+judge set, intake-propose/apply (distinct), intake+then-drain bundle with frozen members, research/remedy/intent/harvest/reconstitution, supervised session, wave, watch, schedule. A drain grant cannot invoke unrelated compete/intake/watch or another spec. Compete judge sees only admitted arm output manifests. “All future approved specs” is not a valid root scope.

    Lineage rule: pin spec, acceptance, plan and base snapshot at approval; legitimate code output may differ from base, but only the protected collector's artifact from that attempt can feed the next allowed phase. Bind source attempt/parent/repo/hash and explicit writable path policy; the worker cannot substitute an arbitrary new snapshot or mutate the approved spec/plan. Changed scope/content or external base update requires new approval. CI/review outputs constrain workflow but do not widen permissions. Existing merge gates remain separate; no security transition interprets a writable review comment as operator consent.

    6. Lifetime and fault bounds

    Policy proposal for review, not already-approved runtime values: ordinary/wave default 2h, administrator maximum 24h; watch default 1h, maximum 6 starts; scheduler maximum 24h with explicit finite tick/start quota; preparation timeout 60s; burndown one coordinator start plus at most three continuations within the SAME root budget. Approval displays every actual limit; no implicit defaults hidden from consent and no indefinite grants.

    Use host trusted CLOCK_BOOTTIME elapsed accounting plus a trusted absolute deadline; expire at the earlier bound. Time is never supplied by the guest. Wall-clock rollback, large unexplained time jump or loss of trusted clock -> suspend admission and revoke, not extend. Counters are transactionally durable. Reboot starts with no live authority. In v1 suspend/hibernate with live grants is disallowed: pre-suspend revoke/kill and block sleep until cleanup; unexpected resume requires fencing before worker execution/resource access. Qualification must demonstrate this ordering or mark suspend-capable deployment unsupported. BOOTTIME includes suspend but is not by itself a pre-resume security fence.

    Proposed liveness bound on a functioning qualified host: supervisor/broker heartbeat every 1s, 5s lease timeout; adapter streams close and domain cgroups are forcibly killed by 10s after loss/revocation. A separate service-manager guardian watches the supervisor, owns kill access to all VMM cgroups, and blocks startup until stale domains are gone. Killing/hanging the broker OR supervisor is a required proof case. Guardian/process supervision must not share the failed process's event loop. No new Start if either health lease is unavailable. Full kernel/hardware failure is outside an ordinary software deadline guarantee; on boot recovery never resurrects authority. If the chosen host cannot prove the 10s bound under qualified load, adjust and re-review the displayed bound or refuse deployment, not claim it silently.

    Start and revoke serialize in protected state: revoke first means no start; start first may cause bounded already-started effects before termination. Revoke closes current adapter sessions as well as preventing new ones. It cannot undo an already sent model request, pushed ref or exported artifact. Detached jobs are owned by the protected controller and may survive CLI disconnect only when detached lifetime was approved; controller death revokes descendants. Worker death consumes that attempt, not siblings' scope. Process/PID reuse cannot revive a grant.

    7. Burndown, wave, watch and scheduling

    Burndown/queue auto-complete: deterministic protected wave controller resolves batch/nextN/multi-batch membership BEFORE approval and maintains wave -> spec run -> phase attempts independently. A model coordinator can propose order within the frozen set, never possess delegation. Quiet/verbose, continuation and resume share fixed membership/deadline/aggregate counters; three continuation rounds do not reset any of them. Per-spec concurrent/pipelined drains cannot overwrite authorization through shared drain-state. AIDA_BURNDOWN_LOCK_HELD and phase environment are diagnostics only. Preserve readiness, companion, lease and independent review gates as additional restrictions, and authorize before existing controller preparation/token publication.

    Replace native Claude burndown dispatch with that mediated controller. Until replaced, the old path MUST refuse. Native model subagents may compute inside the already scoped worker; they gain no sibling/project or independent principal rights. Tool processes stay in the VM with no external execution bridge. Hooks/prompts instructing native dispatch are not a security mechanism.

    Watch: independent root grant, fixed duties/spec set, minimum wake interval, finite starts and deadline capped by an authenticated protected away lease. Operator device sends authenticated home/away changes; local “away” cannot extend authority. A local stop/home request may conservatively revoke, never grant. Recheck before advisor::execute_fork copies a transcript, before log creation, and before fork/cold-boot launch. Import only a bound source transcript artifact; no host live-HOME scan. New incoming findings/specs are displayed for renewed consent, not silently admitted. Home/expiry/revocation kills the active worker too. Cold boot has identical controls; restart needs a new grant, not saved presence JSON.

    Scheduler/shift/solo: protected service clock and protected controller own exact job/member sets, cadence, due windows, total starts/waves and aggregate resources. Timer/cron/user-systemd invocations are unauthenticated wake hints, not credentials. Deduplicate by protected job generation + scheduled slot + attempt ID. A new project or queued spec never joins implicitly. Solo needs an approved intake+wave bundle; newly created intake specs await separate consent. Authority refusal stops the entire launch chain, including later integration attempts; no catch-and-continue or next-tick bypass. Read-only due/status continues.

    Detached/systemd/pane transports attach to protected process/log handles only. They may not execute vendor commands on the host. Transport retry is allowed only within the same protected reserved attempt after proven not-started outcome; ambiguous start stays reconciling. Refusal, expiry, unsupported backend/vendor, or unit failure never selects a detached local fallback or another unapproved vendor. Existing exit/log/tee UX should remain where compatible, but compatibility cannot weaken admission.

    8. A–G source inventory and concrete test mapping

    Paths below relative to aida-cli-lib/src unless scripts/ is explicit. Line numbers are inspected-HEAD anchors; symbols are authoritative. Each listed branch needs handler-level negative and authorized/fail-closed evidence, not merely a helper test. Proposed test files/symbols below do NOT exist by virtue of this sketch.

    A. compete_cmd.rs::handle_compete_command, handle_zen_compete (414), run_compete_arm (818), run_compete_judge (318), spawn_judge (794); compete.rs::vendor_adapter/headless_argv/judge_command. Current target/dry-run/dirty-tree checks are not protected authority. Reserve before destructive worktree/branch removal. Cover Claude/Codex arms, direct and zen judge, configured judge override, denial stopping judge, no-process Agy brief. Proposed tests/bug_1669_launch_sinks_tests.rs::compete_all_branches.

    B. lib.rs::handle_intake_command (56019; direct bypass status near 56164), including assess/groom/advisor routing, propose/apply and then-drain. Candidate fence/role/--apply is not consent. Cover each mode and prevent apply denial falling into drain. Proposed same file::intake_all_modes.

    C. lib.rs::handle_burndown_run (56499), run_burndown_verbose (58173), burndown_verbose_claude_args; quiet status, verbose spawn and continuation loop. --force can skip old role guard, never protected admission. Cover initial/three resumes, both output modes, no native-dispatch fallback, fixed wave membership and shared accounting. Extend tests/burndown_run_tests.rs and proposed sink test::burndown_modes_and_continuations.

    D. session.rs::spawn_claude_headless -> spawn_vendor_headless (1173) -> spawn_vendor_headless_with_seat (1193) -> compose_headless_command (1133); exec_vendor_headless (2679); spawn_claude_headless_resume (2941); headless_vendor_args and vendor/resume builders. Current optional wrapper/config and contained boolean are insufficient; Codex/Agy bypass builders demonstrate why resolved posture matters. Callers: lib.rs::handle_research_command (8533), questions_remedy (8995), run_dryrun_ai_pass (60611), generate_intent (61151); harvest.rs::handle_harvest_command (1057), run_harvest_agent (788); reconstitute.rs::handle_reconstitute_command/run_headless (322); queue_cmd.rs::handle_queue_work (10359), run_standalone_reviewer (12138), fresh/resumed implementer/reviewer; advisor_watch.rs::run_advisor_watch (121), fork_and_run (215), cold_boot_and_run (257), plus advisor::execute_fork ordering. Tests: proposed sink test::shared_headless_callers (each actual caller/vendor/fresh/resume), ::watch_before_copy_and_cold_boot; extend session.rs tests and tests/queue_work_tests.rs. Preserve narrower existing dryrun-AI/intent workflow restrictions; a protected grant is not permission to remove them.

    E. lib.rs::RealPhaseDriver::spawn_advisor_session (103710, cold/fork direct status), resume_implementer (108176), attempt_ci_fix (108630); session::advisor_tier_program_and_args_with_tuning/headless_vendor_args. Controller entry points lib.rs::handle_auto_complete (93529), run_auto_complete (94320), handle_auto_complete_batch (95636), handle_auto_complete_single_branch (96134), handle_auto_complete_batches (96309), handle_auto_complete_next_n (97935), resume/from-PR/pipeline paths and orchestrator_phase_child_env. No new root can mint its own authority through DrainState::write or set_run. Proposed sink test::direct_driver_phases and ::controller_entry_modes; proposed tests/bug_1669_grant_graph_tests.rs::wave_phase_lineage_and_atomic_budget. orchestrator.rs diagnostic tests must additionally prove legacy corroboration gives zero protected rights.

    F. lib.rs::agent_new_claude (27581), agent_new_codex (27699), agent_new_antigravity (27762), agent_new_with_config (27824), agent_new_bg_dispatch (28055), run_tracked_agent (30827), tool_bypass_flags/apply_agent_default_flags. session.rs::exec_claude_with_session/exec_claude (931)/run_claude_session (984)/spawn_claude_session (1027), spawn_claude_resume (1268), exec_claude_resume (4076), exec_codex_session (1313), spawn_codex_session (1335), spawn_reviewer_launch_plan (1413). Foreground, background, explicit flags, home/project defaults, vendor config, arbitrary extra flags/custom executable and caller-supplied headless mode all enter protected execution or refuse. Tests: extend tests/agent_launcher_tests.rs; proposed sink test::agent_new_and_interactive_matrix. Unknown posture never assumes safe; no contained escape hatch.

    G. Wrappers and shipped scripts: solo_cmd.rs::solo_cycle (15)/run_solo_loop; shift.rs::build_wave_argv (759)/wave_command (795)/RealExec::spawn_wave (1579)/launch_wave_isolated (1376); maintenance_schedule.rs::run_aida_command (2899); schedule_driver.rs::RealDriverHost, run_bounded (208), build_systemd_units (389), real_tick_invocation (1306), build_wave_unit_argv (1387); pane_host.rs::host_implementer_in_tmux (153)/tmux_new_window_argv. Cover systemd selected/off/unavailable/not-started/ambiguous results, cron and detached wake, stale executable resolver, pane/fallback, denial stopping solo. Extend tests/task_1510_wave_unit_tests.rs and tests/story_1218_shift_tick_tests.rs plus proposed sink test::wrapper_refusal_propagates. scripts/aida-demo.sh actual bypass probe at 1029 must become a bounded protected demo request or refuse. scripts/ablations/gate-vs-rule.sh and -i2/-i3/-i4 variants are shipped launch scripts: migrate to explicit experimental protected requests or make execution refuse; “research” is not an authority exemption. Proposed tests/security/bug_1669_scripts.sh exercises all five with recording vendors. Demo show_cmd examples, pure argv builders, dry-run output, queue deferred/headless launch hints, config_cmd.rs posture writers and templates/agents.toml are non-launch surfaces; test no grant/no spawn while ensuring none can later supply authority.

    Proposed module boundary: aida-cli-lib/src/launch_authority.rs exposes typed proposal/reservation/attach and ProtectedLaunchDenied; orchestration callers route through it and preserve refusal. Put trusted broker/protocol/controller/supervisor/adapters in separate proposed crates (aida-launch-protocol, aida-launch-service), not a root copy of lib.rs. Protocol types: LaunchRequest, ApprovedScope, AttemptId, ArtifactManifest, ProtectedLaunchDenied; service operations propose, approve, reserve_preparation, start_attempt, submit_result, revoke, attach_status. Only service-internal authenticated controllers invoke delegation; public RPC never accepts arbitrary Command/argv or a client-created permit. These are proposed symbols/contracts for review, not existing APIs.

    9. Verification, migration and evidence gates

    Hermetic layer: proposed tests/bug_1669_launch_authority_tests.rs, bug_1669_launch_sinks_tests.rs, bug_1669_grant_graph_tests.rs and tests/security/bug_1669_scripts.sh. Each uses private temp repo/store, fake HOME/XDG/vendor homes, recording claude/codex/agy/judge binaries and an isolated fake broker protocol harness. Valid workflow prerequisites prevent unrelated early returns masquerading as denial. Child-process env isolation preferred; in-process AmbientGuard uses its single environment lock, never nested EnvVarsGuard. No production AIDA_TEST_TTY/approval override. Per inventory branch assert typed nonzero denial, zero vendor recordings and unchanged launch-associated worktree/queue/lease/log/transcript/state before reservation (broker refusal audit excepted).

    Required negatives at every relevant branch: fabricated real PTY answering yes; injected both-TTY true; handwritten DrainState with live PID and matching UUID; copied env/roles/acks/--force/--yes; fake broker; wrong/replayed/revoked/expired grant; wrong project/spec/phase/digest; poisoned defaults/PATH/judge/wrapper; unsupported client/vendor; no backend. Positives exercise actual handler -> typed service request -> recording worker response for authorized root and delegated drain, every vendor/fresh/resume branch, bounded continuations, watch/schedule and wrappers. Contract mocks establish routing/refusal only, never isolation.

    Mandatory disposable real-boundary proof: proposed tests/security/bug_1669_boundary/ fixture, run in an explicitly authorized disposable Linux host/VM with working nested KVM if needed, pinned installed release bundle, separate admin/agent/approval principals, two enrolled repos plus unknown repo, actual Firecracker/jailer workers, fake vendors/model/forge/artifact endpoints and NO real credentials/user HOME. Use the actual approval app/protocol with a fixture-only enrolled test device; production has no test-key bypass. Invoke every A–G positive or explicit unsupported branch through real installed handlers and actual boundary. Record per-sink case IDs, binary/image/policy hashes, request/grant/attempt audit chain, sentinel counts, quotas and cleanup evidence. An unavailable KVM/privileged runner blocks boundary qualification/release; never mark the suite passed because it skipped.

    Attack/fault proof cases: agent effective sudo/polkit/admin/service-update/backup access; writable code/dependencies/images; cross-VM ptrace/socket/KVM/host HOME access; forged approval and public worker IDs; stolen worker certificate replay via host/other VM, stale boot/channel reconnect and FD relay; generic HTTP/forge/credential laundering; malicious archive/path/.git/hooks and transcript import; cross-repo IDs/artifacts/refs, sibling/parent escalation; spec/plan mutation vs legitimate code lineage; concurrent wave allocation, duplicate ticks/starts, retries/continuations; Start/revoke races; home/watch expiry; broker kill, supervisor kill/hang, adapter outage and existing stream closure; clock rollback/suspend/reboot; restore/rollback/key loss; stale/copied/global/project clients and replaced official wrappers. Prove adapter access denial and VMM death within the stated bound, including active-worker termination. An alternate client with protected IDs and no independent authority must obtain nothing. A separately labeled unmanaged fake vendor with independent credentials demonstrates the documented exclusion, not a pass for any official launch route.

    Later migration execution, only after explicit operator authorization: (1) capture a host-wide entry-point/project/current-run manifest without adopting anything; (2) stage independently verified service/adapters/device enrollment and disposable proof evidence; (3) stop admission on legacy official routes, disable old timers/watchers/drains and revoke/replace only AIDA-managed execution credentials; (4) terminate or checkpoint old workers into untrusted artifacts, reconcile effects, install broker-only entry points for all managed projects; (5) enroll projects individually and reapprove fresh roots, then enable schedules deliberately. Existing runs are UNPROTECTED; never grandfather UUID/PID/role or attach them as protected. They may finish before the cutover only under a separately accepted migration window with no protection claim; at declared cutover no old managed execution may survive. Checkpoints/resume transcripts are reviewed imports, never live authority. Preserve unrelated work/artifacts; no automatic kill/migration is performed now.

    Architecture signoff evidence available now: settled operator direction, inspected source/call inventory, explicit trust boundary/principals, candidate backend/channel protocol, transition/lineage rules, failure bounds, compatibility consequences, test and cutover contracts. The independent advisor must judge these mechanisms and the honest legacy/unmanaged distinction; author cannot sign its own design. Architecture signoff can approve dependent implementation planning, not certify protection, install services, migrate credentials or authorize merge. Product may split dependent ADR/backend-proof/grant-state-machine/sink-migration work only under the separate gate process; this comment creates or queues none.

    Deployment/release evidence still absent: implemented/reviewed protocol and adapters, exact pinned platform manifest, actual installed ACL/admin-boundary inspection, all per-sink hermetic results, real-boundary attack/fault results, provider compatibility, approved installer and migration/recovery manifest, host-wide inventory/cutover proof, independent evidence verdict and separately authorized deployment. Neither source reading nor platform docs nor mock passes establish those facts. BUG-1669 is not completed by this sketch.

    Open decisions to present later as concrete operator packages, not a blanket request now: actual backend/platform and version manifest; separate approval device/client/trust-root custody and recovery custodian; privileged disposable test environment and its cleanup; exact service identities/ports/storage/ACLs and update authority; real provider/forge credential creation/rotation and which AIDA-managed identities move; concrete repo enrollment/import/export mappings; actual runtime/budget/supervision limits; named existing runs' stop/checkpoint window; installer/uninstaller and rollback/backup policy. Unrelated unmanaged clients and credentials are not automatically in that migration. If the manifest exposes an official path that cannot be mediated, report it as a deployment blocker for operator resolution, never an inferred exception.

    Out of scope: implementing or installing this proposal; queue/status/merge changes; all-workstation control of independent unmanaged software; proving semantic model obedience or preventing all collusion/denial of service; surviving a compromised administrator/kernel/hypervisor/approval device; undoing completed external effects; arbitrary plugins, generic network proxies, host shell bridges, VM live migration/restore, indefinite watch/schedules and implicit cross-repo delegation. Unsupported execution refuses; read-only diagnostics and previews stay useful. No claim of existing protection.

    Delta/crosswalk requested by independent disposition: prior sketch sections 1/3/8 are replaced by settled P-enrolled-host plus host admission and explicit cutover (§§1–4,9); section 2 inventory expanded with exact sinks/tests (§8); section 4 gains service-authenticated state table and artifact lineage (§5); section 5 mediated wave/native dispatch (§7); section 6 bounded clock/supervisor/revocation protocol (§6); section 7 watch/scheduler bootstrap (§7); section 9 two-layer evidence and host-wide attack proof (§9). All seven prior proof groups are answered: installation/update/recovery §§3–4; worker/adapters §§3–4; scope/delegation §5; lifetime §6; burndown §7; watch/scheduler §7; tests/evidence §§8–9. Remaining deployment choices are explicitly later execution gates, not presumed consent.

    Primary platform references checked for candidate feasibility, not certification: Firecracker recommends jailed production execution and describes host prerequisites (https://github.com/firecracker-microvm/firecracker/blob/main/docs/prod-host-setup.md); jailer details (https://github.com/firecracker-microvm/firecracker/blob/main/docs/jailer.md); its vsock transport maps guest connections to per-VM Unix sockets (https://github.com/firecracker-microvm/firecracker/blob/main/docs/vsock.md), which alone are NOT our authentication protocol; kernel timekeeping distinguishes boottime including suspend (https://docs.kernel.org/core-api/timekeeping.html). Those documents support individual primitives; the combined protocol, exact qualified versions and protection argument require independent review and empirical evidence.

    Requested next action: a DISTINCT independent advisor reviews this revised sketch against the cited dispositions and Joe's decisions, then signs or returns concrete design changes. BUG-1669 remains blocked from implementation pending that gate. No queue/dispatch/status/install/credential/merge authorization is supplied by this author.
