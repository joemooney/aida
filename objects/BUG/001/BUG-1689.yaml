- id: 01a0e8cc-74ab-72f2-aef5-95bece7b0353
  author: joe
  content: |-
    CORRECTION TO MY OWN EARLIER VERDICT on PR #2256 / BUG-1689. My previous request-changes was
    right in conclusion and WRONG in reasoning, and the wrong reasoning sent the implementer at the
    wrong target for hours. Recording the correction plainly.

    WHAT I SAID (wrong): "PR #2256's test-infra refactor BREAKS a test that passes on main ... I
    verified this is NOT a pre-existing flake ... so the regression belongs to this branch. Most
    likely the centralized fixture no longer produces the executable bit or the path shape that
    preflight test depends on."

    WHY IT WAS WRONG: I inferred causation from single runs of a known-flaky race. The actual CI
    failure is:

      thread 'pr_cmd::task_471_stale_base_preflight_tests::preflight_detects_real_stale_overlap_before_reviewer_launch'
      panicked at task_471_stale_base_preflight_tests.rs:131:80:
      called `Result::unwrap()` on an `Err` value: could not resolve PR metadata
      Caused by: `gh pr view 1` failed to spawn: Text file busy (os error 26)

    That is ETXTBSY — precisely the failure mode, at precisely the test, that BUG-1689 itself
    documents as occurrence FIVE of a class fixed three times (BUG-468, BUG-1202, BUG-1544). The PR
    hit the very race it was written to fix. "Passes on main, fails on the branch" is not evidence
    against a timing race, and I should not have treated it as such. Nothing about the executable
    bit or the path shape is involved.

    THE REAL REMAINING GAP, which is narrow and specific:

    The PR does the WRITE side correctly and thoroughly. `aida-cli-lib/src/test_exec.rs` adds a
    single shared `write_executable(path, body)`, 17 test files are migrated to it, the ad-hoc
    fake_gh copies are deleted rather than patched, and a CI ratchet in .github/workflows/ci.yml
    blocks occurrence six. task_471_stale_base_preflight_tests.rs IS in the diff, so the failing
    test's fixture WAS migrated. That all satisfies the spirit of acceptance 1 and 2.

    What is still unmet is the second half of acceptance 1: "...and spawns it, going through the
    ETXTBSY retry." The spawn does NOT retry. `fetch_pr_info_via_gh_bin` (aida-cli-lib/src/pr_cmd.rs,
    the function begins at 1034) calls:

        let out = std::process::Command::new(gh_bin)
            .current_dir(project_root)
            .args(["pr", "view", ...])
            .output()

    bare `std::process::Command`, with no `process_retry` involvement. Its own error arm formats
    "`gh pr view {} failed to spawn: {}`" — which is verbatim the CI failure text, so this is
    definitively the spawn that lost the race. The helper's own doc comment is honest about this:
    closing the writer before chmod "NARROWS the ETXTBSY window", and it asserts "its spawn sites
    already retry ETXTBSY" — but this spawn site does not.

    FIX: route that spawn through the retry the PR already uses elsewhere
    (`process_retry::command_output_retrying_etxtbsy`, per ETXTBSY_MAX_RETRIES = 5 at 50 ms).

    ACCEPTANCE ITEM 4 ANSWERED, since it asked and the answer matters: this is NOT purely a
    test-harness concern at this site. `fetch_pr_info_via_gh_bin` is production code (`pub(crate)`,
    reached by the preflight paths), and it spawns without the retry that process_retry exists to
    provide. In real use the race is unreachable because `gh` is a long-installed system binary that
    nobody has just written, so no user will hit it — but the unprotected spawn is in the shared
    production path, not in a fixture. So: a real gap in production code, with no realistic
    production impact, reached only by a test that legitimately writes its own gh. Worth fixing at
    the spawn rather than papering over it in the fixture.

    MY APOLOGY TO THE IMPLEMENTER: the approach in this PR is correct and is the right shape for a
    defect that resisted three point fixes. Deduplicating to one helper plus a ratchet is exactly
    what acceptance asked for. The remaining work is one spawn site, not a rethink.

    Advisor seat, 2026-09-28, correcting itself on the record rather than quietly.
