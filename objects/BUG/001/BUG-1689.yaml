  content: "CI failure on PR #2256 at 8e136451e3: required Build (ubuntu-latest) failed because task_471_stale_base_preflight_tests::preflight_detects_real_stale_overlap_before_reviewer_launch could not spawn fake title:\tEPIC-20 v2: statusline @SCOPE fallback + lease enforcement (STORY-55, STORY-48)\nstate:\tMERGED\nauthor:\tjoemooney\nlabels:\t\nassignees:\t\nreviewers:\t\nprojects:\t\nmilestone:\t\nnumber:\t1\nurl:\thttps://github.com/joemooney/aida/pull/1\nadditions:\t543\ndeletions:\t6\nauto-merge:\tdisabled\n--\n## Summary\n- **STORY-55** — `aida statusline` now shows `@<scope>` when cwd is inside an active session lease and the role's last activity is older than `lease.started_at` (or there is no activity). In-session activity still wins. Scope is truncated to the same 12-char budget as `@SPEC`.\n- **STORY-48** — lease enforcement for cross-session writes:\n  - new `[session].enforcement = warn|block|off` knob in `.aida/config.toml` (default `warn`)\n  - `aida edit` warns when the target is owned by another session; `--strict` escalates to a hard block for one call\n  - `aida add --parent` warns when the parent is owned elsewhere\n  - `aida queue next` silently filters items in another session's scope and prints a `Note:` listing what was skipped\n  - self-lease is excluded so a session can freely write to its own scope; ancestry walks `rel_type:Child` edges (AIDA's descendant-points-at-parent storage convention)\n\n## Test plan\n- [x] `cargo test --workspace` passes (42 tests in aida-cli, including 9 new ones for lease enforcement and 3 for the statusline fallback decision table)\n- [x] `aida statusline` end-to-end against the live EPIC-20 lease in 3 scenarios: in-session activity → `@BUG-52`; pre-lease activity → `@EPIC-20`; no activity → `@EPIC-20`\n- [x] `aida edit STORY-48` from inside the lease's worktree: silent (self-lease)\n- [x] `aida edit STORY-48` from main repo: warns, names owner session + worktree path, still updates\n- [x] `aida edit STORY-48 --strict` from main repo: hard error, exit 1\n- [x] `[session] enforcement = \"block\"` in `.aida/config.toml`: hard error without `--strict`\n- [x] `aida edit FR-271` (unrelated spec) from outside lease: clean, no warning\n- [x] `aida add --parent EPIC-20` from main repo: warns on the parent\n- [x] `aida queue next` from inside lease: returns STORY-55 normally\n- [x] `aida queue next` from outside lease: queue is \"empty\" with a `Note:` listing both skipped items and their owning scope\n\n## Notes\n- Disjoint from BUG-52 (which fixes `aida session start`'s symlink behavior for tracked `.aida/` content); BUG-52 touches `session_start`/`session_end`, this PR only touches `handle_statusline_command`, `Command::Edit`, `QueueCommand::Next`, and the `aida add --parent` link path.\n- Both stories are already marked `Completed` in the AIDA store and dequeued.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code) (ETXTBSY); 7,228 passed / 1 failed. Exact-head reviewer also requested changes: tests/test_executable_fixture_ratchet.py scans only aida-cli-lib/src/tests and misses inline #[cfg(test)] code in aida-cli-lib/src/lib.rs. PR remains held."
