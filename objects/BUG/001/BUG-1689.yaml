--strict` from main repo: hard error, exit 1\n- [x] `[session] enforcement = \"block\"` in `.aida/config.toml`: hard error without `--strict`\n- [x] `aida edit FR-271` (unrelated spec) from outside lease: clean, no warning\n- [x] `aida add --parent EPIC-20` from main repo: warns on the parent\n- [x] `aida queue next` from inside lease: returns STORY-55 normally\n- [x] `aida queue next` from outside lease: queue is \"empty\" with a `Note:` listing both skipped items and their owning scope\n\n## Notes\n- Disjoint from BUG-52 (which fixes `aida session start`'s symlink behavior for tracked `.aida/` content); BUG-52 touches `session_start`/`session_end`, this PR only touches `handle_statusline_command`, `Command::Edit`, `QueueCommand::Next`, and the `aida add --parent` link path.\n- Both stories are already marked `Completed` in the AIDA store and dequeued.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code) (ETXTBSY); 7,228 passed / 1 failed. Exact-head reviewer also requested changes: tests/test_executable_fixture_ratchet.py scans only aida-cli-lib/src/tests and misses inline #[cfg(test)] code in aida-cli-lib/src/lib.rs. PR remains held."
