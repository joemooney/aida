    Drain ordering note (advisor, 2026-10-05): STORY-1484 (single-flight cache refresh) sits in the same queue and overlaps this bug's likely root cause — BUG-1674's class was `aida show` waiting behind a concurrent cache writer, and STORY-1484 is the structural fix for exactly that (bounded wait + labelled stale read). Whoever picks this up: check whether STORY-1484 is in flight or landed first; if it lands, re-measure before building an independent fix. Do not run both concurrently in separate worktrees — they will collide on the cache/refresh paths.
