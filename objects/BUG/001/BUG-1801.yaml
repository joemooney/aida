title: aida show breaches its 1s budget on 28% of calls across four recent binaries (worst 8054 ms, 5s ceiling breached)
description: |
  Performance-guard trip (2026-10-03, routed to advisor; dispositioned 2026-10-04 as REAL REGRESSION, not a budget change).

  Evidence from `aida doctor check performance`:
  - `aida show` exceeded its 1000 ms budget on 28.0% of 93 in-lineage calls in the last 24h (tolerated: 10.0%).
  - CEILING BREACHED: a single call ran 8054 ms against the 5000 ms ceiling (ADR-53: the gate bounds the worst call).
  - Per binary: 62e3374e51 27.5% of 40 · 585f46e32a 25.0% of 36 · 658eb885d8 45.5% of 11 · fbb166dca9 16.7% of 6 — the breach reproduces across four recent binaries, so it is not one bad build.

  History: this is the fourth episode on the same command — BUG-1480 (bypassed cache), BUG-1606 (329 s calls), BUG-1674 (unbounded wait behind a concurrent writer under strict stale-cache refresh) are all completed. Start by checking whether the BUG-1674 class regressed (lock/refresh contention) or a new hot path landed in `aida show` since 585f46e32a.

  Acceptance sketch: identify the slow path with timing evidence; after the fix, `aida doctor check performance` reports `show` within the 10% tolerated share and no ceiling breach over a fresh 24h window (or a reproduced worst-case call drops under 1000 ms in a before/after measurement).
