- id: 01a0fdff-f49c-7b83-9f72-bb3e000d4373
  author: claude-product
  content: |
    SKETCH REVISION 2 (BUG-1694) — advisor signoff round 1 returned REQUEST-CHANGES with two
    conditions; both accepted. Deltas against the revision-1 sketch:

    CONDITION 1 — admin-removal failure handling. The clear's outcome is decided solely by the
    `remove_dir_all(admin_dir)` result: `Ok` → `Cleared`; `Err` → `Declined` (registration treated as
    kept; a partial removal is reported as a decline, never as `Cleared`). The sentinel release runs
    unconditionally after the removal attempt, before the outcome is returned.

    CONDITION 2 — path interpretation and sentinel lifecycle. `create_dir_all(parent)` is DROPPED: the
    claim is a single `std::fs::create_dir(worktree_path)` on the same lexical path the function
    already uses for the `gitdir` identity comparison (session_reap.rs:1050,1059), so claim and
    identity-match cannot diverge, and no directory is ever created through a symlinked or missing
    parent. A missing parent surfaces as ENOENT → decline (fail closed; stale registration is the
    accepted cost, and in practice the worktree parent dir outlives individual trees). Sentinel
    release: non-recursive `std::fs::remove_dir(worktree_path)` attempted on EVERY path after a
    successful claim — both admin-removal outcomes — with its own failure (e.g. ENOTEMPTY because a
    creator populated the empty dir) ignored and the directory left alone.

    Everything else from revision 1 stands: the new after-final-check seam via
    `reap_one_with_clear_hooks`, the three-way outcome enum, the decline reporting in the caller, the
    two new tests plus TASK-1543 unchanged, mkdir-claim rationale and pool-flock rejection.
