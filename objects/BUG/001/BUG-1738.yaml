- id: 01a0fcfd-4c6d-74a0-9922-5d26f32c7624
  author: joe
  content: |-
    DECISION: The `aida doctor` finding will be report-only (not `safe_heal`).

    ### Decision & Rationale

    We will make the hook staleness finding report-only, prompting the user to run `aida remote mirror <name>` manually. Automatically rewriting files in `.git/hooks/` crosses a trust boundary (modifying executable code outside the AIDA store). Even if we verify the AIDA header, it is safer to require the operator to opt-in to the rewrite by running the suggested command themselves. This avoids violating the safe default arm of `heal_doctor_finding` and ensures the operator is aware the hook is being updated.

    ### Acceptance Criteria Updates
    The ACs remain as written, with the decision above resolving AC4.
