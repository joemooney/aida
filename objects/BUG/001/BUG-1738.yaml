  content: 'Consider-do-not-assume survey: other generated-once artifacts. .git/hooks/pre-commit and .git/hooks/commit-msg are scaffold-pipeline artifacts in the ''template'' category — aida scaffold status reports their drift and aida scaffold upgrade overwrites them, and deployed .claude/.codex prompts/skills are covered by the TASK-1124 scaffold-drift doctor category. The pre-push mirror hook was the uncovered outlier because aida remote mirror installs it outside the scaffold pipeline. I found no other generated-once artifact without a drift check, so no separate spec filed.'
