  content: |-
    Evidence carried in from TASK-201 (rejected as a duplicate of this spec, finding from PR-2249 review).

    Live confirmation on the dev host, 2026-09-28 06:2x: `codex#1907632` is `STAT Zs` — a defunct zombie, elapsed 2-11:18:58 — and `aida agent status` still reports it `busy`. This is the STATUS-path half of the defect; BUG-1703 fixed the STOP path only. The prior advisor handoff independently flagged the same seat and recommended folding it here.

    Note this zombie case is NOT covered by the two candidate signals in DIRECTION as written: a defunct process has no subtree to sum (rule b) and accrues no CPU between samples (rule a), but it also fails the `pid not alive` test in rule 1 only if `classify_status` treats a zombie as dead. A `Zs` process still exists in the process table, so a naive liveness probe reads it as alive. Worth an explicit acceptance criterion: a zombie/defunct PID must classify as Stale, never Busy.

    Added by the advisor seat under the operator's 2026-09-28 emergency burndown authorization.
