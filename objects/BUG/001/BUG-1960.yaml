title: 'BUG-0445 follow-ups: zsh init side-channel never run in CI; no trap cleanup; AIDA_INIT_CD_FILE leaks to init''s children'
description: |
  Minors from the night review of PR #2505 at 16078e0fba. (1) CI has no zsh, so the zsh wrapper path in bug_0445_init_side_channel_tests.rs always skips. Run it once in zsh, or install zsh in CI. (2) dev_cmd.rs ~1492-1503: no trap, so Ctrl-C during init leaves an empty aida-init-cd.* file in TMPDIR. This is harmless, since each run uses a fresh mktemp name. (3) init_bootstrap.rs ~438-450: AIDA_INIT_CD_FILE is inherited by every process init spawns, and a nested emit_enter_dir would overwrite it. Scope it to the binary.

  ## Acceptance

  (groom:night, 2026-10-11: all three items verified still open on origin/main 17ff749954.)

  1. CI runs the zsh leg of bug_0445_init_side_channel_tests: install zsh in the CI Build job (ci.yml) so `wrapper_shells()` includes zsh, and the zsh case passes rather than skips.
  2. The init wrapper (dev_cmd.rs, around the `mktemp -t aida-init-cd.XXXXXX` block) removes the temp file on INT/TERM (a `trap` scoped to the function, restored afterwards); the generated-wrapper test asserts the trap is present.
  3. `AIDA_INIT_CD_FILE` is not inherited by processes init spawns: init reads it once and every child `Command` it spawns removes it (or it is cleared from the process env at init entry after reading). Test: a nested init/emit_enter_dir does not overwrite the outer file.
