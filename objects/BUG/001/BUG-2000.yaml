title: 'zsh: shell wrapper on main prints the entire environment (including API keys) to stdout on every wrapped aida call'
description: |-
  SECURITY. Found during the strict review of PR #2577 (BUG-1960).

  On main, the generated shell wrapper begins with 'local -'. That form is valid in bash but not in zsh, where it prints every shell variable to stdout. This was introduced with BUG-1811.

  Effect: for zsh users, every wrapped aida call dumps the whole environment, including any API keys or tokens it holds, to the terminal. Agent tool shells capture that output into transcripts and logs. A reviewer reproduced it: the comparison run printed Anthropic, OpenAI, Gemini and AIDA token values into an agent transcript.

  Fix: PR #2577 (BUG-1960) removes 'local -' for zsh and uses 'setopt localoptions'. That PR is currently at REQUEST CHANGES for an unrelated trap issue. If #2577 stalls, the zsh part could ship on its own.

  Operator actions:
  - rotate any keys present in the environment of zsh sessions that ran the wrapper, including the 2026-10-12 review session;
  - consider whether shipped releases carry this wrapper.
