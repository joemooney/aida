title: 'auto-complete failure: phase 3 (reviewer) on BUG-1265'
description: |-
  PROMOTED from an auto-drafted phase record (TASK-266) by the advisor 2026-09-19 09:40, because the pattern recurs and the recovery is mechanical.

  Symptom, three occurrences in 15 hours: the reviewer phase refuses with "PR-N base is K commits behind origin and overlaps M files touched on base since the PR forked — refusing to launch reviewer against stale code", the spec shelves tool-exit, and the round costs a full re-drive.
    2026-09-19 00:41  TASK-1271 / PR-1942  5 commits behind, 3 files overlap
    2026-09-19 06:05  BUG-1239  / PR-1955  3 commits behind, 1 file overlap
    2026-09-19 15:31  BUG-1265  / PR-1966  2 commits behind, 2 files overlap

  The refusal itself is CORRECT and must stay (BUG-1218): reviewing stale code wastes a reviewer round and can approve against a base that no longer exists. The defect is the response. A stale base is the textbook transient failure EPIC-62 exists to self-recover: main moved while the round was in flight, which on a busy wave is the normal case, not an exception. Nothing about it needs human judgment, and `aida pr rebase` already does the work.

  Fix: before shelving on a stale base, the reviewer phase attempts recovery once — rebase the PR branch onto the current base (the existing pr rebase path), re-check, and continue to the reviewer if the rebase is clean. Shelve only when the rebase CONFLICTS, and then with a typed cause that says so (stale-base-conflict) plus the manual recipe, so triage can tell "main moved" from "this needs a human".

  Guards: the attempt is bounded (one per phase entry, so a rebase loop cannot form); a conflicting rebase is aborted and leaves the branch exactly as it was; the attempt is logged and emits an event so the wave record shows a self-recovery rather than a silent success; --no-auto-rebase (or the existing lifecycle short-circuit tag convention) opts out.

  Acceptance: with a PR whose base is behind and whose rebase is clean, the reviewer phase rebases, says so, and proceeds to review with no shelve; with a conflicting rebase, the spec shelves with the stale-base-conflict cause, the branch is untouched, and the message names the manual recipe; the rebase is attempted at most once per phase entry; unit test on the pure decision (behind+clean / behind+conflict / current) and a fixture for the bounded-attempt rule.

  Related: BUG-1218 (the guard being obeyed), TASK-1272 (drain resume — the manual counterpart), EPIC-62.
