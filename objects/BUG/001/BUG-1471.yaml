- id: 01a0c614-c3e9-7eb0-b2e1-287c37013a0d
  author: joe
  content: 'Decision (option a): normalize the CLI spelling ''related'' to the existing standard References relationship. Rejected (b) because a new non-directional core type would expand serialization, inverse, and traversal taxonomy without a distinct semantic need; rejected (c) because this natural spelling has one unambiguous safe meaning and refusal would break callers unnecessarily. Store audit on 2026-09-21 found 139 exact !Custom related edges across 86 spec YAML objects. They are deliberately left as-is (not silently migrated): the core parser remains lossless and explicit custom traversal remains available, while new ''rel add --type related'' writes References. Rewriting shared git-canonical history is outside this bounded CLI fix and could alter deliberately custom data.'
