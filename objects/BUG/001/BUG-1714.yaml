    Rework for the PR #2350 reviewer blocker landed as 363dc78623 (pushed to bug-1714): hold_inconclusive_publication now captures both merge-hold layer results; when BOTH fail it retracts the PR through the shared close path with an honest notice (reports marker + label errors, states the close happened only because the PR could not be made unmergeable, never claims the guards refused the change). Codex's draft test had a hole — a bare temp root short-circuits label sync to Ok(()) as pure-git — so the advisor corrected the fixture (git init + declared github forge with no origin remote, which is unpinnable) and narrowed the over-broad no-'refus' assertion to the refused-notice discriminators ('guards refused', 'Closed automatically:'), since the embedded label error legitimately says 'refusing to call gh unpinned'. Mutation-proven both directions: the test fails on pre-fix production code (closed=[]), passes with the fix; forge_seam_tests 6/6, fmt clean. Independent codex delta review dispatched.
