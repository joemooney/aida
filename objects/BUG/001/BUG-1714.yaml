    First codex delta review on 363dc78623 returned REQUEST_CHANGES with one blocker: on a double hold-layer failure the shared retraction path can leave the PR open with no hold layer and no on-PR warning (foreign/unverified ownership, or a failed close call). Verified genuine but bounded — closing a foreign PR is deliberately forbidden, so the honest remaining lever is a non-destructive comment. Fix landed as 626cb4809a: retract_publication_with_notice now reports whether it closed the change; when it did not, the double-failure path posts the warning as a best-effort PR comment stating the PR is OPEN and UNVERIFIED and must not merge unreviewed (never that it was closed). Refused path behavior-unchanged (return ignored). New test inconclusive_preflight_warns_on_the_pr_when_it_can_neither_hold_nor_close drives the foreign-ownership case, mutation-proven against the prior commit. forge_seam_tests 7/7, fmt clean, no new clippy warnings (a needless_borrow the refactor introduced was also fixed). Second codex delta review dispatched on 626cb4809a.
