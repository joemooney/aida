title: task_1508_index_answer_reports_source_and_tip is timing-flaky under load (index build exceeds the default budget)
description: 'It failed once in the batch 89 full-suite preflight under heavy load and passed twice in isolation. The test turns index serving on but uses the default 1500ms index budget. Under load the first build doesn''t finish, so the answer falls back to the git walk and the source assertion fails. Fix: give the test an unlimited, or explicitly generous, budget via AIDA_HISTORY_INDEX_BUDGET_MS or a test seam, and audit the other task_1507/task_1508 tests that assert Index serving under the default budget.'
