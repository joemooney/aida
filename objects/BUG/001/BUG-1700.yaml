- id: 01a0e645-8438-7091-8d3d-6bba8d0df0aa
  author: joe
  content: |-
    Probe evidence (advisor seat, 2026-09-27, claude v2.1.283, isolated HOME + PTY, WITH a working control):

    CONFIRMED — folder trust inherits from a parent directory.
      Case F (control, nothing trusted, onboarding complete): modal FIRES —
        'Accessing workspace: .../tp3/lone/child / Quick safety check: Is this a project you created...'
      Case E (ONLY the parent dir has hasTrustDialogAccepted:true, claude launched in parent/child):
        NO modal; reaches the prompt.
      Earlier probes were inconclusive because a fresh HOME shows first-run onboarding (theme picker)
      BEFORE the trust gate; the probe HOME must carry hasCompletedOnboarding:true for the control to
      be meaningful. Any future re-probe must include Case F or it proves nothing.

    ALSO CONFIRMED — the headless lane is immune. 'claude -p' in a fully untrusted directory answers
    normally and never shows the gate. So this bug bites ONLY the interactive TUI lane that
    'aida agent new' uses; the drain lane (session::spawn_claude_headless, per the BUG-1701
    correction) is unaffected. This narrows the blast radius and is why the fix need not touch
    ~/.claude.json at all.

    Consequence for acceptance: AC2-AC5 as filed assume AIDA WRITES a trust record into the shared
    ~/.claude.json. That is now the wrong design — inheritance means the operator trusts ONE parent
    once and AIDA writes nothing to the user's config. Rewriting the criteria accordingly.
