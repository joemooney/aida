- id: 01a0e65d-1941-7c03-aa34-7b266796d1ac
  author: joe
  content: |-
    Implemented on claude/bug-1700-worktree-trust-parent, PR #2248 (stacked on #2247 so the review diff is BUG-1700 alone).

    Design landed as the rewritten AC, NOT the originally-filed one: AIDA writes nothing to
    ~/.claude.json. [worktree_pool] worktree_parent (opt-in, unset by default) nests created worktrees
    under one directory the operator trusts once; the single derivation site was pool_path_for in
    aida-core/src/worktree_pool.rs. Plus a read-only 'aida doctor --category agent-launch' check that
    names the directory to trust and stays silent when a covering grant already exists.

    Verified on the real binary in all three states (untrusted configured parent / unset with no
    covering grant / correctly silent on this host, where /home/joe/ai is already trusted). 22 new
    tests; doctor suite 194/0; fmt clean.
