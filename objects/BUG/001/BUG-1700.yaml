id: 01a0e5e8-349e-7810-bff6-1aa486a811ab
spec_id: BUG-1700
agreed_id: BUG-1700
title: Claude Code folder-trust modal blocks every aida agent new claude --spec launch, because AIDA creates a worktree path Claude has never seen and no launch flag dismisses the gate
description: |
  Claude Code gates a directory it has not seen before behind an interactive folder-trust modal:

      Accessing workspace: <path>
      Quick safety check: Is this a project you created or one you trust? ...
        > No, exit
          Yes, I trust this folder
      Enter to confirm · Esc to cancel

  AIDA creates a NEW worktree per spec (`/home/joe/ai/aida-bug-1693`, `/home/joe/ai/wt-story-1480`,
  ...). Each is a path Claude Code has never been launched in, so `aida agent new claude --spec <ID>`
  lands on this modal, in a PTY nobody is watching, and the caller blocks until it is killed.

  Measured 2026-09-27 on this host: of 149 project entries in `~/.claude.json`, only 9 are AIDA
  worktree paths, and the live spec worktrees have no entry at all. So the gate is armed for
  effectively every fresh spec worktree.

  No launch flag dismisses it (`--permission-mode bypassPermissions`, `--dangerously-skip-permissions`
  both still show it), and `hasTrustDialogAccepted: false` does not satisfy it.

  SCOPE, narrowed by probe 2026-09-27 (see comments for the full evidence + control):

    * Folder trust INHERITS from a parent directory. With ONLY a parent dir marked
      `hasTrustDialogAccepted: true`, an interactive launch in `<parent>/child` shows NO modal and
      reaches the prompt. The matching control (nothing trusted) DOES fire the modal, so the
      observation is real and not a probe artifact.
    * The HEADLESS lane is immune: `claude -p` in a fully untrusted directory answers normally and
      never shows the gate. So this bug bites ONLY the interactive TUI lane `aida agent new` uses.
      The drain lane (`session::spawn_claude_headless`) is unaffected.

  Therefore the fix is NOT for AIDA to write trust records into the operator's shared `~/.claude.json`
  (the originally-filed AC2-AC5). Instead AIDA gains an OPT-IN setting that places the worktrees it
  creates under ONE parent directory, which the operator trusts once. AIDA writes nothing to
  `~/.claude.json` and claims no new authority.

  The single path-derivation site is `pool_path_for` in `aida-core/src/worktree_pool.rs` (one caller,
  `acquire`), which today returns `project_root.parent()/<name>`.

  ACCEPTANCE

  AC1. `[worktree_pool] worktree_parent` in `.aida/config.toml` (opt-in, unset by default) makes
       every worktree AIDA creates land under that one directory, instead of as a sibling of the
       project root. A relative value resolves against the project root; the directory is created
       if missing.
  AC2. Default behaviour is UNCHANGED when the setting is absent: worktrees are still siblings at
       `<project_root>/../<name>`. Nothing moves under a live fleet, and existing pool entries keep
       being found at the paths already recorded in the registry.
  AC3. Pool names stay collision-free when two repositories share one `worktree_parent`: the name is
       already namespaced by the project directory slug (`aida-pool-<slug>-<n>`), and this must keep
       holding when the parent is shared rather than implied.
  AC4. With `worktree_parent` set to a directory the operator has trusted, an interactive
       `aida agent new claude --spec <ID>` reaches the agent's prompt with no folder-trust modal.
  AC5. AIDA never writes to `~/.claude.json` and never marks any directory trusted on the operator's
       behalf.
  AC6. Covered by unit tests: the derivation with the setting set and unset, a relative value, and
       two distinct project roots sharing one parent not colliding.
  AC7. `aida doctor` (or the launch path) tells the operator plainly what to trust once: the resolved
       worktree parent directory. No silent hang on a modal.
