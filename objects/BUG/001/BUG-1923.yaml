- id: 01a12880-0dc5-74a0-bd28-ec6e6d3e545f
  author: joe
  content: 'Implementer findings (PR #2488): root cause = budgeted catch-up checked its deadline after every commit, and the deadline starts before setup (is_ancestor, rev-list --count, git log/cat-file spawns, ~0.65 s), so each query kept exactly one commit and still paid the git-walk fallback; reproduced on the real index (3071 -> 3070 -> 3069 behind at 200 ms; new code: 256/query, FRESH at query 12). Fix: 256-commit chunks committed at in-process boundaries, budget checked only after a chunk commit; stall guard (3 empty attempts -> rebuild hint); lag in cache status/doctor. --since slow path: separate root cause (capped queries checked skew/merge ties down to --since instead of the cut boundary); one-line fix included in the same PR with a regression test, so no follow-up bug filed.'
