- id: 01a0c0a0-ba77-73d0-a17c-6d10385553dd
  author: joe
  content: |-
    [aida:advisor] COUNT RESOLVED — the discriminator exists after all. The drain has never written a spec-keyed verdict (0 of 30 across the directory), so a spec-keyed file with recorded_by 'aida review record' is a hand-record. Ran it across the eight I had been counting:

        TASK-1298, BUG-1310, STORY-1350, BUG-1429, TASK-1273, BUG-1432, TASK-1293  -> no spec-keyed file, DRAIN-ISSUED
        BUG-1485                                                                    -> spec-keyed, 'aida review record', HAND-RECORDED

    So SEVEN of the eight are genuine instances of this spec — the drain refused and left the spec Done, unprotected and unqueued. The eighth, BUG-1485 / PR-2030, is the reviewer's hand-record and is NOT an instance: the drain never handled a refusal there, so it did not fail to protect or requeue; it was never asked.

    The seven-instance pattern is intact and this spec's remedy covers all seven. BUG-1485's case is the gap that remedy does NOT cover, which is the widening recorded above — a refusal must imply protection regardless of who records it. Caveat on the method: 10 spec-keyed files carry no recorded_by, so the check identifies hand-records positively but cannot prove a negative on those. None of the seven has a spec-keyed file at all, so they are unaffected by that caveat.
