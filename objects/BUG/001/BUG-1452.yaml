spec_id: BUG-1452
agreed_id: BUG-1452
title: A reviewer's refusal leaves the spec Done with an unprotected mergeable PR and no queue entry, so refused work is invisible, unrecoverable and still mergeable
description: |
  When a reviewer refuses a spec, the drain leaves it marked Done with an open, unprotected, fully mergeable PR and no queue entry, then moves on. Nothing will ever pick it up again, and nothing prevents it being merged over the refusal. Observed four times in one night on four different specs.

  THE STATE A REFUSED SPEC IS LEFT IN
    spec status      Done          — reads as finished in `aida list` and every rollup
    PR              OPEN, CLEAN   — all required checks pass; mergeable by anything that asks
    hold            none          — no marker, no `aida:merge-hold` label
    queue entry     none          — no implementer entry, so no drive will resume it
    verdict         RequestChanges at the current head

  Every one of those five is individually defensible. Together they describe work that is refused, invisible, unprotected and unrecoverable.

  THE FOUR INSTANCES, 2026-09-20
    TASK-1298  PR #2014  RequestChanges at head, Done, no hold, not queued
    BUG-1310   PR #2016  RequestChanges at head, Done, no hold, not queued
    STORY-1350 PR #1974  RequestChanges at head, Done, no hold, not queued
    BUG-1429   PR #2021  RequestChanges at head, Done, no hold, not queued

  Four specs, four different implementers, same terminal state. All four were found only because an advisor happened to open `aida awaiting` and read each PR's verdict file by hand. None was surfaced as needing anything.

  WHY EACH PART IS WRONG

  Done is wrong, or at least load-bearing in the wrong direction. The drain sets Done at the end of the implementer phase, before CI and review, which is a defensible design — but nothing moves it back when review then refuses. So Done means "an implementer stopped", while every reader takes it to mean "the work is finished". BUG-1310 sat at Done through three consecutive refusals.

  The missing hold is the dangerous part. A PR with a RequestChanges verdict and no hold is mergeable by `aida pr ship`, by the drain's own phase 4, and by anyone with the PR page open. The verdict is a file on disk that no gate consults. We shipped a PR over an unenforced hold earlier tonight (BUG-1435); this is the same exposure arriving by a different route, and it is worse, because here there is no hold at all rather than one that failed to fire.

  The missing queue entry is what makes it permanent. A shelved spec with no entry is not going to be re-driven. It will sit at Done forever unless a human reads its verdict.

  WHAT THIS IS NOT. Not the drain failing to fix the finding — refusing and stopping is correct. Not the reviewer being wrong; all four verdicts were legitimate and I verified BUG-1429's down to the file and line. The defect is entirely in what is left behind.

  ACCEPTANCE
  1. A spec whose reviewer refuses at the current head is not left at Done. It carries a status that distinguishes refused-and-waiting from finished — NeedsAttention or equivalent — and `aida list` does not present it as complete.
  2. The PR is protected at the moment the refusal is recorded. A RequestChanges verdict at the current head implies a merge hold, applied by the thing that records the verdict, not by an advisor noticing later. Removing it is a deliberate act.
  3. Either the spec is requeued for rework, or it appears in a surface that names it as awaiting a decision. Refused, unqueued and unmentioned must not be reachable.
  4. `aida awaiting` distinguishes the three PR states that currently look alike: awaiting merge, awaiting rework, and awaiting a human decision. They need opposite actions and today read identically.
  5. A test covers the full aftermath, not just the shelve: after a RequestChanges verdict at the current head, assert the spec is not Done, the PR is held, and the spec is either queued or surfaced.
  6. Sweep the existing store for specs already in this state and report them. Four are known; the count before tonight is not, and a fix that only prevents new instances leaves the old ones exactly as stranded.

  Found by the advisor across four consecutive mail ticks. Each instance was initially read as a one-off; the fourth is what established it as the default outcome of a refusal rather than an accident.
