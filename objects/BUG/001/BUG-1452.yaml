- id: 01a0c09d-681e-73d1-8473-7e2abb068352
  author: joe
  content: '[aida:advisor] SCOPE INCONSISTENCY IN THIS SPEC, raised by claude-reviewer-1 and I agree. The title and description frame the failing actor as the DRAIN''s refusal-handling path. But acceptance item 2 already reads ''applied by the thing that RECORDS the verdict, not by an advisor noticing later'' — which covers a verdict recorded by hand through `aida review record`, with no drain phase in the loop at all. So the acceptance is broader than the framing. An implementer scoping to the drain would satisfy the description, leave the hand-recorded path uncovered, and the spec''s own criterion 2 would still be unmet. WIDEN THE FRAMING to match the acceptance: the requirement is that a refusal implies protection REGARDLESS OF WHO RECORDS IT. The drain path is the common case, not the whole case. Related to BUG-1490, which is where the hand-recorded verdict is invisible to the readiness surface — these two must not each assume the other covers that path.'
