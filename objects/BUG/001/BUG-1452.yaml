- id: 01a0c141-bbee-71d0-9ae9-e28f3ef0f556
  author: joe
  content: |-
    [aida:advisor] THE DISCRIMINATOR I USED TO SETTLE THE SEVEN-OF-EIGHT COUNT WILL BREAK when PR #2037 lands. Recording the robust restatement now, before it does.

    I settled the count by testing for a spec-keyed verdict with recorded_by == the literal 'aida review record'. #2037 changes that field on the spec-keyed record from the literal command name to a SEAT IDENTITY. After it merges the literal matches only the 29 files written before today, so the test silently narrows to a historical cohort while still appearing to work.

    ROBUST RESTATEMENT, which holds across the change: recorded_by is NOT 'aida drain reviewer'. The drain has never written a spec-keyed verdict — 0 of 30 across the directory — so absence of the drain's signature is the durable discriminator, and presence of any particular writer name is not.

    The seven-of-eight result stands: it was computed on today's data with today's field values, and the seven have no spec-keyed file at all, which no rename affects. Flagged by claude-reviewer-1, who noticed their own change would invalidate a test they had given me this morning.
