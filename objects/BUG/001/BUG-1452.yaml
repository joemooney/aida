agreed_id: BUG-1452
title: A reviewer's refusal leaves the spec Done with an unprotected mergeable PR and no queue entry, so refused work is invisible, unrecoverable and still mergeable
description: "When a reviewer refuses a spec, the drain leaves it marked Done with an open, unprotected, fully mergeable PR and no queue entry, then moves on. Nothing will ever pick it up again, and nothing prevents it being merged over the refusal. Observed four times in one night on four different specs.\n\nTHE STATE A REFUSED SPEC IS LEFT IN\n  spec status      Done          â\x80\x94 reads as finished in `aida list` and every rollup\n  PR              OPEN, CLEAN   â\x80\x94 all required checks pass; mergeable by anything that asks\n  hold            none          â\x80\x94 no marker, no `aida:merge-hold` label\n  queue entry     none          â\x80\x94 no implementer entry, so no drive will resume it\n  verdict         RequestChanges at the current head\n\nEvery one of those five is individually defensible. Together they describe work that is refused, invisible, unprotected and unrecoverable.\n\nTHE FOUR INSTANCES, 2026-09-20\n  TASK-1298  PR #2014  RequestChanges at head, Done, no hold, not queued\n  BUG-1310   PR #2016  RequestChanges at head, Done, no hold, not queued\n  STORY-1350 PR #1974  RequestChanges at head, Done, no hold, not queued\n  BUG-1429   PR #2021  RequestChanges at head, Done, no hold, not queued\n\nFour specs, four different implementers, same terminal state. All four were found only because an advisor happened to open `aida awaiting` and read each PR's verdict file by hand. None was surfaced as needing anything.\n\nWHY EACH PART IS WRONG\n\nDone is wrong, or at least load-bearing in the wrong direction. The drain sets Done at the end of the implementer phase, before CI and review, which is a defensible design â\x80\x94 but nothing moves it back when review then refuses. So Done means \"an implementer stopped\", while every reader takes it to mean \"the work is finished\". BUG-1310 sat at Done through three consecutive refusals.\n\nThe missing hold is the dangerous part. A PR with a RequestChanges verdict and no hold is mergeable by `aida pr ship`, by the drain's own phase 4, and by anyone with the PR page open. The verdict is a file on disk that no gate consults. We shipped a PR over an unenforced hold earlier tonight (BUG-1435); this is the same exposure arriving by a different route, and it is worse, because here there is no hold at all rather than one that failed to fire.\n\nThe missing queue entry is what makes it permanent. A shelved spec with no entry is not going to be re-driven. It will sit at Done forever unless a human reads its verdict.\n\nWHAT THIS IS NOT. Not the drain failing to fix the finding â\x80\x94 refusing and stopping is correct. Not the reviewer being wrong; all four verdicts were legitimate and I verified BUG-1429's down to the file and line. The defect is entirely in what is left behind.\n\nACCEPTANCE\n1. A spec whose reviewer refuses at the current head is not left at Done. It carries a status that distinguishes refused-and-waiting from finished â\x80\x94 NeedsAttention or equivalent â\x80\x94 and `aida list` does not present it as complete.\n2. The PR is protected at the moment the refusal is recorded. A RequestChanges verdict at the current head implies a merge hold, applied by the thing that records the verdict, not by an advisor noticing later. Removing it is a deliberate act.\n3. Either the spec is requeued for rework, or it appears in a surface that names it as awaiting a decision. Refused, unqueued and unmentioned must not be reachable.\n4. `aida awaiting` distinguishes the three PR states that currently look alike: awaiting merge, awaiting rework, and awaiting a human decision. They need opposite actions and today read identically.\n5. A test covers the full aftermath, not just the shelve: after a RequestChanges verdict at the current head, assert the spec is not Done, the PR is held, and the spec is either queued or surfaced.\n6. Sweep the existing store for specs already in this state and report them. Four are known; the count before tonight is not, and a fix that only prevents new instances leaves the old ones exactly as stranded.\n7. The requirement is that a refusal implies protection REGARDLESS OF WHO RECORDS IT. The drain path is the common case, not the whole case: a verdict recorded by hand through `aida review record`, with no drain phase in the loop, must produce the same protection. Verified 2026-09-20 — of eight specs found in this state, seven were drain-issued and one (BUG-1485 / PR #2030) was hand-recorded, and the hand-recorded one is the case a drain-scoped fix would miss entirely. Delimit against BUG-1490 so neither spec assumes the other covers the hand-recorded path.\n\nFound by the advisor across four consecutive mail ticks. Each instance was initially read as a one-off; the fourth is what established it as the default outcome of a refusal rather than an accident.\n\"\nexecution_mode: drain\nrelationships[5]{rel,id,title}:\n  Parent,EPIC-28,\"Dependency-aware autonomous drain: shelve failures, skip dependents, continue independents (full --auto-complete batch)\"\n  Related,BUG-1435,\"The merge-hold classifier matches the refusal's own sentence, so a reword silently returns a supervised gate to burning both retries\"\n  Related,BUG-1445,\"A rebase-only rework round is indistinguishable from a real failed attempt, so requeueing a shelved spec can loop forever while reporting progress\"\n  Related,BUG-1435,\"The merge-hold classifier matches the refusal's own sentence, so a reword silently returns a supervised gate to burning both retries\"\n  Related,BUG-1445,\"A rebase-only rework round is indistinguishable from a real failed attempt, so requeueing a shelved spec can loop forever while reporting progress"
