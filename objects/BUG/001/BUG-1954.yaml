title: 'History flow fallback notes: cheap refresh for not-built/filling, no rebuild hint for an ancestor worktree, stale storage doc'
description: |
  Follow-up to STORY-1650 (PR #2491, merge 36c906f453), from the approving fresh review at ad6b4ad602. None of these blocked the merge.

  1. The "not built" and "filling" fallback notes in history_flow.rs (`fallback_note`) still suggest `aida cache rebuild --history`, which takes about 5.5 min on this store. The decoder bump means every user hits "not built" once after upgrading. Measured: one `aida history events --limit 1` (2.5 s) from no index was enough for bare `aida history` to show the flow. Fix: name the cheap refresh first and the rebuild second.
  2. In history_cache.rs `classify_miss`, a store worktree whose HEAD is an ancestor of the shared index tip (lag None) is classified Stuck, and its note says rebuild. That would reset an index another checkout is using. Fix: give it its own cause, with no rebuild suggestion.
  3. docs/cli/10-storage.md still says the index "fills itself in on normal `aida history` queries". Bare history now catches up only gaps of 16 commits or fewer (FLOW_CATCH_UP_CAP); the event and single-spec views do the full catch-up.


  ## Acceptance

  (groom:night, 2026-10-11: all three items verified still open on origin/main 17ff749954.)

  1. `fallback_note` for `NotBuilt` and `Filling` names the cheap refresh (`aida history events --limit 1`, the existing REFRESH const) first and `aida cache rebuild --history` second. Unit tests on both notes.
  2. `classify_miss` gives a store worktree whose HEAD is an ancestor of the shared index tip its own IndexMiss variant (not Stuck), and its note does not suggest a rebuild. Unit test on classify_miss and the note.
  3. docs/cli/10-storage.md no longer says the index "fills itself in on normal `aida history` queries": it says bare `aida history` catches up only gaps of up to 16 commits, while `aida history events` and single-spec views do the full catch-up.
