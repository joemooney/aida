title: Use MR identifiers and reliably queue GitLab review handoffs
description: GitLab implementer completion and handoff output must identify merge requests as MR-N, generate `aida queue work MR-N --role reviewer`, and reliably create the Review MR-N queue story before reporting completion. GitHub must continue to use PR-N. Add forge-specific regression coverage for identifier rendering, commands, and auto-queue behavior. Reproduced from qci#BUG-022 and again on MR !35, where the lifecycle envelope used PR-35 and failed to recognize the existing Review MR-35 story.
