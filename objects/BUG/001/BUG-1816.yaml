title: Restrict aida-orchestrate child model selection and set token/time limits
description: |-
  Moved from aida-relay BUG-71 (filed there by antigravity; the code lives here).

  aida-orchestrate burns large amounts of tokens. It defaults child implementer/reviewer sessions to gpt-6-astra, launches an unbounded number of concurrent child sessions, and spins in long polling loops that re-send ~200k of context.

  ## Acceptance
  1. Child sessions default to gpt-6.1-sol (or inherit the parent model). Using gpt-6-astra requires an explicit justification.
  2. There is a token/time budget, and concurrently launched child sessions are capped (e.g. 2-3).
  3. Large docs and handoffs are read with targeted reads (rg -n / sed -n), not whole-file reads.
