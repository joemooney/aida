  content: |-
    REVIEW (night): REQUEST CHANGES at 997a333737 (fresh reviewer)

    1. MEDIUM, aida-core/templates/skills-portable/aida-orchestrate.md, "Model." paragraph (~316). It says to pass `--model` on `aida agent new <vendor>`, but `aida agent new antigravity` has no `--model` (only claude and codex do). Name the vendors that support it and note that the antigravity lane has none.
    2. MEDIUM, both masters (skills/aida-orchestrate.md:217 and the portable copy). "Children inherit the orchestrator's model unless you set one" is false for AIDA-launched children: an unset model means the `[agents.<vendor>] model` config or the vendor default. It also contradicts the next sentence. Reword to "unset means the config/vendor default; pass the parent's model explicitly to inherit". The inherit claim holds only for Claude's Agent tool.
    3. LOW, commands/aida-orchestrate.md:33-36. The added cap/budget sentence has no test coverage and no trace comment.
    4. LOW. "The child's own usage report is the meter": children report tokens only when they finish, so state that the time budget is the one enforced live.
    The factory relay is down, so the night orchestrator is applying these fixes.
