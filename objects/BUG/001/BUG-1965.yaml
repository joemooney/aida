- id: 01a1314d-80f1-7fa3-af6f-1b1f74604efe
  author: joe
  content: |-
    **Advisor rework brief — round 2/3 — PR #2559 (BUG-1965), REQUEST CHANGES at 8f242ed2fb**

    Round-1 items 2–4 are resolved, and item 1 is resolved in code. The strict re-review confirmed that production behaviour is unchanged (`Err` still maps to `false`) and that the budget pin stays scope-local. Its mutation checks: forcing every check to `Err` fails the test, holding the lock for the whole test fails it, and removing `refresh_lock_contended` fails its guard.

    **Must fix (the only blocker)**
    1. **`ancestor_check_failed` has no guard test** (`aida-core/src/db/cached_git_backend.rs:612-613`). Deleting the counter passes all 290 `db::` tests. Add a guard modelled on `reader_path_never_calls_with_cache_write`, without the held lock. The reviewer prototyped one that passes on this PR and fails when the counter line is removed:
       ```rust
       scope.configure(false, Some(ReadBudget(Duration::from_nanos(1))));
       test_counts();
       backend.list_summaries(&ListFilter::default()).unwrap();
       let counts = test_counts();
       assert!(counts.contains_key("ancestor_check_failed"), "{counts:?}");
       assert_eq!(counts.get("write_attempt"), None);
       ```
       **Done when:** the guard passes, and it fails with the counter line removed (show that once).

    **Optional**
    2. Bump `refresh_lock_contended` only on the final hand-off. This is slightly more precise now that the 10 s pin lets a briefly contended read still win. Not required.

    Narrow tests, then `make check-ci-fast` must PASS, then push as a separate step to the same branch. This is round 2 of 3; one more REQUEST CHANGES parks the PR for the operator.
