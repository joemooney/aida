- id: 01a1311f-7cab-7820-ac81-123f79be1a66
  author: joe
  content: |-
    **Advisor rework brief — round 1/3 — PR #2559 (BUG-1965), REQUEST CHANGES at 82288040ab**

    The strict reviewer confirmed that production behaviour is unchanged (the counter is `cfg(test)` only). Removing the counter line makes the guard test fail, and holding the refresh lock for the whole test still fails it, so the retry can't hide a permanent regression. The fix is correct for the lock-contention cause, but a second cause produces the identical failure signature and is neither ruled out nor reported.

    **Must fix**
    1. **Second cause: the ancestor check times out** (`aida-core/src/db/cached_git_backend.rs` ~598-605). The lock winner runs `is_ancestor_with_timeout(.., budget.0)` (default 1500 ms) and treats `Err` as "not an ancestor". The read then reaches `file_and_spawn_refresh`, is labelled `deferred` and makes no write attempt — the same `left: None, right: Some(1)` failure. The reviewer reproduced it by forcing that timeout.
       - Add a `#[cfg(test)] cache_refresh::test_count("ancestor_check_failed")` on the `Err` arm.
       - Make the test immune to this cause: pin the read budget after each `CacheReadScope::new()` (e.g. `scope.configure(false, Some(ReadBudget(Duration::from_secs(10))))`), or treat `ancestor_check_failed` as a retryable contended read. Pinning is preferred.
       - **Done when:** an injected ancestor-check timeout no longer fails the test, or is retried and logged.
    2. **Diagnostics:** include `{counts:?}` in the messages of the `write_attempt` and `writer_busy` assertions (~4201, ~4222), so any future failure names its branch.

    **Should fix**
    3. **Acceptance deviation:** either run the specified 50 runs alongside a parallel `cargo test --workspace`, or record on BUG-1965 why a looping aida-core binary is an equivalent load. State it as an explicit deviation.
    4. **Optional:** fail the test if more than 3 of the 10 attempts are contended, so an intermittent self-contention regression can't be retried away silently.

    Re-run the narrow tests and `make check-ci-fast` (confirm it passes before pushing), then push to the same branch. The advisor will put a fresh reviewer on the new head.
