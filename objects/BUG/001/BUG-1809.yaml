  2026-10-08 around04:39–04:51UTC: root showBUG1806--json and independent advisor pre-post show both waited on git merge-base --is-ancestor cachedstore9880df767d84eb9376544a2ed880d91643d66d55 tocurrent4c1e8ae437a847b86193ea7596d33a2b72852529. Git kernelwait folio_wait_bit_common, mapped SATArepo pack/commit-graph; IOpressure someavg60~67%,full~50%, memoryavailable~60GB. Root ownedread stopped safely; bounded30s--no-git retry produced no successful result. Canonical no-git switch did not avoid cache ancestry. Independent reviewer eventually completed normally. Official cache rebuild succeeded projecting4905requirements; subsequent same show returnedCompleted promptly. No direct store/cache edits or gate bypass. Evidence .aida/handoff/orchestrator/status-read-io-observation.md and cache-rebuild-recovery.log, reviewer canonical-read-delay.txt.

  Source seams to verify: aida-core/src/db/cached_git_backend.rs ancestry checks around408/537, git_ops::is_ancestor, zero read-refresh budget propagation. Distinguish lock-wait budget from unbounded Git subprocess I/O. Determine whether exact current source reproduces before changing code.

  ## Acceptance

  1. Reproduce under deterministic owned delayed ancestry/Git fixture from exact built source and record affected single-show formats.
  2. Single-spec reads return canonical object with honest stale/deferred cache context within their read budget rather than synchronously waiting for an unbounded ancestry child. Preserve real worker-state distinctions; no false background-progress promise.
  3. Strict mutation/cache-rebuild/gate operations remain strict; do not bypass canonical consistency or authority. Parent return and eventual owned child cleanup remain honest under timeout/uninterruptible I/O.
  4. Add meaningful delayed-subprocess and matching normal-source controls, preserving BUG1801 latency coverage. No live diskfault experiments or broadhosttuning.

