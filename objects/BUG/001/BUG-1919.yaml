title: aida pr ship derives a completing trailer from the branch name, falsely completing multi-PR specs (TASK-1600 gap)
description: |
  ## Problem
  For multi-PR specs, `aida pr ship` still adds a completing trailer. `derive_squash_subject_spec_ids_resolving` (aida-cli-lib/src/pr_ship.rs:328) falls back to `extract_spec_ids_from_text(branch)` when the title has no trailing ID. The TASK-1600 fix covered title scraping only.

  ## Observed 2026-10-10
  PR #2477's title "[AI:antigravity] refactor(cli-lib): extract output_format.rs" had no spec ID, which follows the slice-1 convention from the 2026-10-05 operator note. Branch `task-1538-output-format` → squash subject fe6723558e "... (TASK-1538)" → merge-time completion flipped TASK-1538 to done with ~42/45 modules left (held only by closure:pending). The same happened on #2474 and #2475.

  ## Acceptance
  - A PR can declare itself a non-completing slice (a flag on ship, or a PR-body marker), and ship then adds no completing trailer from any source.
  - Alternatively, or as well: the branch-name fallback is not used when the spec has `closure:pending` or open slice children. The spec ID is then traced in the PR body only.
  - Ship prints the derived trailer and where it came from (title / branch) before merging.
  - Regression test: title with no ID + branch `task-1538-x` + non-completing marker → subject has no trailer.
