title: aida push reports stale main as up to date and returns partial success after code push rejection
description: |
  Observed on 2026-09-25 while running `aida push` from `main`.

  ## Reproduction

  1. Local `HEAD` and the local tracking ref `origin/main` both point to `ac9803a`.
  2. The actual GitHub `refs/heads/main` has advanced to `41d8244`, but no fetch has refreshed the local tracking ref.
  3. Run `aida push` with both code and store legs enabled.

  ## Observed

  The pre-action plan says `code main -> origin (up to date, nothing to push)` because `push_code_leg_status` compares only against the stale local `origin/main` ref. The command nevertheless runs `git push origin main`; GitHub rejects it with `fetch first` because remote main contains work absent locally. `handle_push_command` prints the nonzero code push as a warning, continues to push the store successfully, and does not retain a code-leg failure for the final command result.

  Concrete evidence after the incident:
  - local HEAD: `ac9803a159e1871122232d6e6512ca668da96446`
  - local origin/main: `ac9803a159e1871122232d6e6512ca668da96446`
  - `git ls-remote origin refs/heads/main`: `41d8244b9b2537f5b9396a6a95ff4917cf8c6609`
  - Store push completed successfully and remained synchronized.

  ## Root cause

  `push_code_leg_status` derives ahead/behind solely from the locally cached `origin/<branch>` ref and performs no fetch or `ls-remote` freshness check. Later, the code push failure arm only prints `git push exited with status ...`; unlike `handle_pull_command`, it does not record a per-leg failure or return an error after the other leg runs.

  ## Expected

  The push plan must not claim that a branch is up to date unless that conclusion is based on fresh remote state. If any requested push leg fails, the command may still attempt the independent remaining leg, but its final exit status must be nonzero and its summary must clearly identify partial success.

  ## Acceptance

  - A regression test makes remote main advance while local `origin/main` remains stale; the push plan reports behind, stale, or refresh-needed instead of `up to date`.
  - The code leg does not attempt a pointless push when fresh remote state proves there are no local commits to publish.
  - A non-fast-forward code rejection is retained while the store leg is still attempted.
  - After a code failure and store success, `aida push` exits nonzero and reports partial success plus the appropriate `aida pull` recovery command.
  - The symmetric store-failure/code-success case also exits nonzero.
  - Scripted and interactive modes have consistent exit semantics.
