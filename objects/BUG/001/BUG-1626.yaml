  content: 'Strict re-review: APPROVE — reviewed 8a1788a092..82829af7dc, plus the full branch vs origin/main (merge-tree clean against 979c3137db). (1) Mirror fan-out, FIXED: aida-cli-lib/src/lib.rs:68586-68595. The (0,0) skip arm now runs fan_out_mirror_push, which clears drift through clear_store_mirror_fanout_failure on success, and then sync_mirror_ci_link. The (0,behind>0) arm (lib.rs:68576-68585) correctly does not fan out. Stale-tip analysis: nothing_to_push requires Fresh. On a detached HEAD, current_branch returns ''HEAD'', so the refs/heads/HEAD fetch fails and ls-remote exit 2 gives Absent, which means no skip and no fan-out. On a non-main branch the fan-out pushes the local branch, and (0,0) proves it equals the fresh origin tip, so no stale tip is possible. The mirror test (lib.rs:69068) asserts plan.nothing_to_push() before calling handle_push_command. Mutation: deleting the two skip-arm fan-out lines makes up_to_date_push_still_catches_up_a_lagging_mirror fail (''mirror caught up on the skip path''). (2) Wording: the new UpToDate outcome means ''store rejected + code no-op'' now reports ''failed — code leg already up to date'', not partial success (test at lib.rs:69155). Nit: UpToDate is also used for (0,behind>0), where ''already up to date'' overstates it. ''nothing to push'' would be exact. The separate Note line does say ''run aida pull'', so this does not block. (3) Non-TTY gate: confirm_push_anyway (lib.rs:67536) never calls read_answer when non-interactive, returns an error naming --no-rebase-check, and a declined or EOF answer is also an error. The plan prompt decline now bails (lib.rs:68426), and confirm_push_plan still returns true without a TTY and never reads stdin. Callers: handle_push_command is reached only from the CLI (git_backend_cmd.rs:1468), and no MCP, drain or hook code spawns ''aida push''. scripts/multi-clone-harness.sh:209/238 run on main, where both prompt checks are skipped, and they keep the ''|| db sync --push || true'' fallback, so they are unaffected. The aida-pr skill (templates/skills/aida-pr/SKILL.md:291) already expects a ''behind main'' error. Headless pushes of a feature branch that is behind main or whose PR merged now fail loudly instead of silently exiting 0 unpushed, which is the intended fix. Minor: behind_main_check_without_terminal_exits_nonzero_unpushed returns early if the test''s stdin is a TTY. The unit test covers the gate. (4) Budget: one deadline is shared (lib.rs:67350). If the fetch times out, it returns Err, which gives Unknown with no ls-remote. If the fetch fails fast, ls-remote gets only the remaining time. Worst case is about 20s plus the 100ms poll. (5) pushurl: origin_push_url_matches_fetch (lib.rs:67398) gates nothing_to_push. pushInsteadOf is covered because get-url --push applies it (verified). Mutation: dropping the guard makes separate_push_url_is_always_pushed fail. NON-BLOCKING EDGE: with multiple remote.origin.url values, fetch and push lists compare equal, but git fetch reads only the first URL while push goes to all of them. The skip can therefore suppress a push to a lagging second URL, which is a regression versus main''s always-git-push. Suggested one-liner: also require fetch.len()==1. Tests (CARGO_BUILD_JOBS=3, isolated target): bug_1626 15/15, push 74, remote 89, mirror 33, all pass. Tests use tempdirs only. The live store advanced during the run only by a ''schedule: tick'' commit, and ~/.aida changes were only usage.jsonl from session hooks, so the tests wrote to neither. Throwaway worktree removed.'
