id: 01a0c642-f929-7361-a675-4c8dcbbb4f82
spec_id: BUG-1582
agreed_id: BUG-1582
title: The doc-intent gate resolves specs by filename (spec_id) while every human-facing surface uses agreed_id, so 96 specs are unresolvable to a required check and their doc-impact tags are silently unenfo
description: |-
  THE DOC-INTENT GATE RESOLVES A SPEC BY FILENAME, AND THE FILENAME IS THE spec_id WHILE EVERY HUMAN-FACING SURFACE USES THE agreed_id. A spec whose two ids differ is UNRESOLVABLE to the gate, so its `docs:impacted` tag is invisible and the gate reports it as UNRESOLVED rather than as UNMARKED — a different and misleading failure.

  THE MECHANISM, read at docs/cli/verify-interface-changes.py:113-128 (`load_spec_yaml`):

      for path in ls.stdout.splitlines():
          if path.endswith(f"/{spec_id}.yaml"):      # orphan-branch lookup
      ...
      if f"{spec_id}.yaml" in fnames:                 # local-worktree fallback

  BOTH paths key on the FILENAME. The store names each object by its spec_id.

  THE SCALE, measured across the whole store:

      objects carrying a spec_id                  4287
      objects whose agreed_id DIFFERS from it       96   (2.2%)

      e.g.  file TASK-1-107.yaml   spec_id TASK-1-107   agreed_id TASK-132
            file TASK-1-159.yaml   spec_id TASK-1-159   agreed_id TASK-190
            file CR-1-116.yaml     spec_id CR-1-116     agreed_id CR-6

  FOUND TWICE INDEPENDENTLY, WHICH IS WHY IT IS FILED. First by the implementer lane working TASK-185: its doc-impact tag was placed on TASK-185 and the gate could not see it, because TASK-185's YAML is TASK-1-164.yaml. Then by the advisor an hour later, hitting the same wall from the other direction — `find .aida-store/objects -name "TASK-190.yaml"` returns NOTHING, because that spec lives in TASK-1-159.yaml. Two seats, two tasks, same cause.

  WHY THE FAILURE MODE IS WORSE THAN A MISS. An unresolvable spec is not reported as "you forgot to mark doc-impact". It is reported as the gate being unable to find the spec at all, which reads as a store or CI problem and sends the reader to the wrong place. AND IT IS A REQUIRED-CHECK PATH: the doc-intent gate runs in ci.yml and can red a PR, so 2.2% of specs can fail a merge gate for a reason that has nothing to do with their content and cannot be fixed by tagging harder.

  WHY 2.2% UNDERSTATES IT. The divergence is created by `aida db merge-gate`, which assigns short agreed ids — so the affected set is exactly the specs that have been through that process, i.e. the OLDER and more-referenced ones, which are disproportionately the ones a surface change touches. A random 2.2% would matter less than this 2.2%.

  Acceptance:
  - `load_spec_yaml` resolves a spec by spec_id OR agreed_id, matching what every other surface
    accepts. `aida show` already takes either; the gate should not be stricter than the CLI.
  - An unresolvable spec is reported DISTINCTLY from an unmarked one. "Spec not found" and
    "doc-impact not marked" must not print the same way — today the first masquerades as the
    second's neighbour and misroutes the reader.
  - ENUMERATE the affected specs rather than sampling: the 96 are computable from the store in one
    pass, and whoever fixes this should say how many of them carry `docs:impacted` today and were
    therefore silently unenforced.
  - A test with a spec whose agreed_id differs from its spec_id, asserting the gate resolves it.
    A fixture where the two ids are equal cannot see this defect — which is presumably why the
    existing tests pass.

  NOT IN SCOPE: changing how the store names files, or the merge-gate's id assignment. The gate
  should accommodate the existing, deliberate two-id design rather than the reverse.

  Filed by the driver-advisor seat. Discovered independently by the implementer lane on TASK-185
  and by this seat on TASK-190. Related: the doc-intent gate's CI step in ci.yml.
