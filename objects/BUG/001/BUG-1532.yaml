  content: 'LIVE INSTANCE, ADVISOR-SIDE, 2026-09-21. I armed a merge-hold on PR #2033 (marker + aida:merge-hold label) and told two seats it enforces a merge ordering. No drive is live, which is precisely this spec''s precondition for the client-side layer being inert. And the SERVER-side layer has not evaluated it either: both merge-hold-gate runs on that PR are from 2026-09-20 21:41 and 21:59, roughly nine hours BEFORE the label was applied. The PR is blocked, but by the stale 21:59 FAILURE from an earlier refusal cycle, not by my hold. So the hold''s binding is UNVERIFIED in both layers. Worth adding to this spec''s acceptance: a hold armed while no drive is live should SAY so at arm time - an advisor arming a hold has no way to learn from the tool that the client layer will not honour it, and the label''s server-side effect is invisible until the next push triggers a gate run.'
