title: A merge-hold marker does not bind aida pr ship unless a drive is live AND its reason text names a running spec, so with the lane stopped no hold in the repo is honoured client-side
description: |
  Found by the reviewer 2026-09-20 22:16 while acknowledging the standing instruction on
  BUG-1531. Re-verified in code by the driver advisor at 22:18 against main at 0b474a66d1.
  Independent of BUG-1531 and shippable on its own.

  THE CLIENT-SIDE GUARD ALREADY EXISTS AND ALREADY READS THE MARKER. pr_cmd.rs:1476-1478:

      let hold_matches_drive_spec = crate::merge_hold::read_hold(&main_worktree, pr_number)
          .is_some_and(|reason| drive_specs.iter().any(|spec| reason.contains(spec)));
      let pr_is_drive_owned = reviewer_live_here || hold_matches_drive_spec;

  So a hold is honoured only when its REASON TEXT contains a spec id that a LIVE DRIVE
  MEMBER is currently running. drive_specs at pr_cmd.rs:1438-1446:

      drive_state.members.iter().filter(|m| m.is_running()).map(|m| m.spec)

  WITH NO DRIVE RUNNING, drive_specs IS EMPTY. `.any()` over an empty iterator is false,
  so hold_matches_drive_spec is false for EVERY marker in the repo. Then
  pr_ship.rs:397-411:

      if override_allow          -> None
      else if caller_is_drive_seat -> Some(DriveSeat)
      else if pr_is_drive_owned    -> Some(DriveOwnedPr)
      else                         -> None        <- a non-drive caller, held PR, NO BLOCK

  STATE AT TIME OF FILING: the rework lane is stopped, running members 0, and there are 24
  merge-hold markers standing under .aida/merge-holds/ (counted at 22:19; an earlier draft
  of this spec said 23, which was carried over from a different count and not measured). None of them binds `aida pr ship`
  client-side right now.

  THE MARKER IS THEREFORE NOT A HOLD. It is a hold only during a live drive whose running
  member's spec id happens to appear as a substring of the reason text. A reviewer who
  places a hold by hand, outside a drive - which is how every hold tonight was placed -
  gets a marker that reads as protection and is not consulted.

  LAYERS, stated because it changes how much is actually protecting a held PR:

      aida pr ship 2035            client guard  INERT (hold not honoured, no live drive)
                                   server gate   CATCHES IT (aida:merge-hold label)
      aida pr ship pr2035-review   client guard  INERT (new PR number, no marker)
                                   server gate   INERT (new PR, no label)

  So a held PR on the direct path is protected by exactly ONE layer, and only because the
  label happens to be present. That single-layer state is this spec; the zero-layer
  snapshot path is BUG-1531.

  THIS IS THE THIRD WIDENING OF ONE GUARD, not a new concept. The guard's own doc comment
  records the second:

      v1  does the drive's CURRENT SPEC own this PR     (missed the shelved-spec case)
      v2  is ANY LIVE MEMBER phase-bound to THIS PR     (TASK-1292, after the 2026-09-18
                                                         near-miss on PR #1948)
      v3  is there a HOLD on this PR at all             (this spec)

  Every version so far asks a liveness question - "is someone reviewing RIGHT NOW". A
  refusal outlives the session that recorded it and the drain that produced it. That is
  why v2 cannot cover a stopped lane.

  THE FIX IS SMALL AND IS A DELETION. The narrowing to drop is the
  `drive_specs.iter().any(|spec| reason.contains(spec))` substring test. A merge-hold
  marker is a hold whether or not a drive is running, whether or not its reason names a
  running spec, and whoever the caller is. That one change moves `aida pr ship <N>` from
  one layer to two without touching the snapshot path.

  WHAT WAS NOT VERIFIED, by either seat, deliberately: no ship path was executed. And it
  is unknown whether the bare-branch form reaches this guard BEFORE or AFTER gh pr create.
  If it creates first and guards after, the new PR exists regardless of the guard's
  verdict - which changes the required shape of BUG-1531's fix but not this one's.

  ## Acceptance

  ACCEPTANCE REWRITTEN 2026-09-20 22:25. The original criteria 1-6 said "remove the
  substring test, not extend it". THAT FIX WOULD DEADLOCK EVERY SUPERVISED HOLD, and the
  reason is in code the original filing had not read. Corrected by the reviewer; verified
  by the driver advisor before rewriting.

  WHAT THE ORIGINAL FILING MISSED — IT IS ZERO LAYERS, NOT ONE. `aida pr ship` does not
  merely fail to block on a held PR. It RELEASES the hold, deliberately:

      pr_cmd.rs:1655-1657  on a coarse CI red it reads the hold and uses its PRESENCE to
                           discount the red — the merge-hold gate's own failure is treated
                           as expected because "this command releases it at step 3".
                           It does not abort. trace:BUG-1180 / ADR-39
      pr_cmd.rs:1788-1800  "BUG-1167: aida pr merge / pr ship is an EXPLICIT human/advisor
                           merge ... So it RELEASES any supervised merge-hold marker before
                           merging (the chokepoint would otherwise refuse it). The
                           automatic and concurrent paths — drain auto-merge, an integrate
                           sweep, another session's merge_change — never clear, so they
                           stay refused."
                           clear_hold + sync_label(false), then it waits for the now-green
                           gate and squash-merges. It PRINTS the hold's reason text in an
                           info line while clearing it.

  So both ADR-37 layers fall to one command, on the direct form as well as the snapshot
  form. The marker is discounted, then removed, then the gate goes green because the label
  is gone.

  WHY DELETION OVER-CORRECTS. Dropping the substring test makes pr_is_drive_owned true for
  EVERY held PR, so `pr ship` would refuse all 24 markers — including the supervised holds
  BUG-1167 exists to release. The documented client-side release path stops working and
  the only remaining escape is AIDA_PR_SHIP_ALLOW_IN_DRIVE=1. That converts a bypass into
  a deadlock plus an env-var override, and an env var that routes around a merge gate is
  how the next bypass gets built.

  THE RELEASE INTENT IS LEGITIMATE. It rests on the assumption that RUNNING `pr ship` IS
  the human/advisor decision the hold was waiting for. For a supervised hold that is true
  and the release is the feature. For a REVIEWER REFUSAL hold it is false and no amount of
  human intent makes it true — a reviewer examined a specific commit and rejected it, and
  a different human running a merge command is not that decision. The release path cannot
  tell them apart because a marker is only reason text. The #2035 marker literally reads
  "Clear only on my re-review", and `pr ship` would print that sentence and then clear it.

  SO THE DEFECT BREAKS ON HOLD KIND, NOT HOLD PRESENCE.

  1. A merge-hold marker records its KIND as a first-class field, not as reason prose:
     SUPERVISED (a human decision is awaited) versus REFUSAL (a reviewer rejected this
     commit). `aida merge-hold add` already takes --reason; this is one more field.
  2. `aida pr ship` RELEASES a supervised hold — BUG-1167 behaviour preserved exactly,
     including the automatic/concurrent paths continuing to refuse.
  3. `aida pr ship` REFUSES a refusal hold, and the refusal names the recorded verdict and
     the sha it was recorded against. It does not discount the red gate at 1656 and does
     not reach the clear at 1793 — the guard's early return at pr_cmd.rs:1491 is the right
     place, verified to short-circuit both.
  4. A refusal hold is released ONLY by a fresh verdict at the current head. This is the
     same predicate as BUG-1531 criterion 3 and BUG-1522 criterion 6 — read the verdict,
     not the PR number. Third consumer of one predicate.
  5. UNTIL KINDS EXIST, AN UNKINDED MARKER IS READ AS REFUSAL, NOT SUPERVISED. Unknown is
     not permission — the same shape as BUG-1522 criterion 9.
  6. MIGRATION, and it is not free: all 24 current markers are unkinded, so criterion 5
     refuses all of them until a one-time kinding pass. The 24 are enumerable with
     `aida merge-hold list` and are distinguishable by eye — the reviewer's and
     #2042/#2043 say REVIEWER HOLD, the supervised ones say "is marked drive/unset". THE
     KINDING PASS IS DONE BY READING THE LIST, NOT BY REGEXING THE PROSE. Regexing prose
     to infer intent is the defect this spec is about; doing it in the migration would
     reproduce it.
  7. The TASK-1292 behaviour is preserved: a live reviewer phase bound to this PR still
     blocks independently of any marker. This spec widens the guard and removes nothing.
  8. A test asserts a REFUSAL hold with no drive running blocks the ship AND that the
     marker still exists afterwards. A test asserts a SUPERVISED hold with no drive running
     is still released. A test asserting only the live-drive case passes today and would
     pass after a no-op change.
  9. AIDA_PR_SHIP_ALLOW_IN_DRIVE remains the single documented override. If it is left able
     to bypass a REFUSAL hold, say so explicitly in the spec and in its help text rather
     than leaving it implicit — an undocumented override around a reviewer refusal is the
     same hole one layer out.

  ON v3'S WORDING. The sequence in this spec's body reads v3 as "is there a HOLD on this
  PR at all". That is right for the guard, but the question that survives contact with
  BUG-1167 is narrower: IS THIS COMMAND THE DECISION THE HOLD WAS WAITING FOR? For a
  supervised hold it is; for a refusal hold it never is. Without that sentence, criterion 3
  and the BUG-1167 comment read as contradictory and an implementer will pick one.

  NOT VERIFIED BY ANYONE, DELIBERATELY: no `pr ship` path was executed, in any form,
  including --dry-run. The sequence above is read from pr_cmd.rs:1476, 1491, 1655-1657 and
  1788-1800 and their comments. Whether the merge-hold gate re-runs green fast enough for
  the bounded wait to succeed is unverified — if it times out the merge fails, which would
  make the present behaviour a deadlock rather than a bypass in practice. That leg is not
  worth verifying by running it on a held PR.

  10. A REFUSAL HOLD REFERENCES THE VERDICT RECORD; IT DOES NOT QUOTE THE VERDICT'S TEXT.
      Reviewer's finding 2026-09-20 23:00, from a live instance on PR #2034.

      THE STRUCTURAL PROBLEM: a merge-hold marker is written ONCE, and a verdict for the
      same PR can be re-recorded many times. So any hold that survives a second verdict
      carries a reason describing a SUPERSEDED refusal.

      THE LIVE INSTANCE. PR #2034's marker read "BUG-1460 criterion 5's test asserts source
      order rather than execution order" — the DRAIN REVIEWER's finding from 20:52. The
      reviewer seat recorded a fresh RequestChanges at 2cb2c15c4268 at 22:26 on an entirely
      different ground (Build red from classifier-inventory line drift, which skipped the
      test suite). The marker still quoted the first.

      WHY THAT IS MORE THAN STALE TEXT: under the TASK-1-170 convention the reason text is
      how a later seat identifies WHO OWNS the hold. Reading #2034's marker, a seat
      concludes it belongs to the drain reviewer — a phase that no longer exists — which is
      exactly the unanswerable-refusal state BUG-1485's transfer ruling was written to
      prevent. A stale reason does not merely misinform; it MISROUTES.

      So this is not a documentation nicety, it is criterion 4's mechanism seen from the
      marker side: if a refusal hold clears only on a fresh verdict at the current head,
      the marker must point AT the verdict record rather than snapshot its prose, so it
      follows the verdict instead of freezing the first one.

      Concretely: the marker carries the verdict's identity (spec or PR key, and the
      recording seat), and any human-readable summary is explicitly a convenience that a
      reader must not treat as current. The owner is read from the verdict, not from the
      marker's prose.

      Corrected by hand on PR #2034 at 23:02 as a one-off; the other markers have not been
      audited for the same staleness.
