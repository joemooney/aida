  content: |-
    CRITERION 10 ASKED FOR AN AUDIT OF THE OTHER MARKERS. Done, product seat, 2026-09-20 23:15 local. EIGHT of the 24 cannot be validated against their PR head, in three distinct shapes.

      shape A -- VERDICT CARRIES NO SHA (5)   PR-1984, PR-1998, PR-2009, PR-2039, PR-2040
          Each has a verdict file reading CHANGES REQUESTED with reviewed_sha and head both
          absent and recorded_by null. The refusal cannot be tied to any commit, so criterion
          4 (released only by a fresh verdict AT THE CURRENT HEAD) has nothing to compare
          against. This is BUG-1466 output.

      shape B -- VERDICT SHA IS STALE (1)      PR-2030
          verdict sha 8ba48f5b98, current head 05969aa397. The head moved at 04:52:42Z when
          the BUG-1442 run pushed BUG-1485 work onto this branch -- the misbinding recorded
          on BUG-1485. So the hold refuses a commit that is no longer the head, and the
          marker prose describes the earlier refusal. Same shape as the PR-2034 instance in
          criterion 10, arrived at independently.

      shape C -- NO VERDICT FILE AT ALL (2)    PR-2019, PR-2042
          PR-2019 is an advisor-opened hold (supervised, by criterion 1 taxonomy).
          PR-2042 says REVIEWER HOLD and quotes commits 93d0c80671 / da8b589b58 while the
          head is 35de6d3abb -- a refusal-shaped marker with no verdict record to point at,
          which is precisely what criterion 10 says a marker must not be.

    WHAT THIS MEANS FOR CRITERION 5 AND 6. Criterion 5 reads an unkinded marker as REFUSAL.
    Criterion 4 releases a refusal only on a fresh verdict at the current head. For shape A
    there is no sha to match, so those five are UNRELEASABLE under criteria 4+5 as written --
    not deadlocked by policy but by missing data. The kinding pass in criterion 6 does not
    fix it, because the missing field is on the VERDICT, not the marker. Either BUG-1466
    lands first, or criterion 4 needs an explicit answer for a verdict with no recorded sha.
    I would not weaken criterion 4 to accommodate it -- the fail-safe reading is that a
    refusal you cannot tie to a commit stays refused until someone re-reviews.

    A CORRECTION TO MY OWN AUDIT, because the first number I produced was wrong. My script
    initially reported 3 of 24. It tested the parsed sha for `is None`, but an absent sha
    yields an EMPTY STRING, so the five shape-A markers fell through the check and printed as
    consistent. Three is the number I would have reported had I not gone back to look at the
    five directly. The predicate did not match what the data contained, and the answer came
    out small and tidy -- the same failure recorded several times tonight, caught here only
    because criterion 10 made me enumerate rather than summarise.
