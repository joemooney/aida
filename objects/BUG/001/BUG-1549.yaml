- id: 01a0cd99-3ba6-7e72-96d0-addc48c03f7f
  author: joe
  content: 'PROXY DECISION (Claude for the operator, 02:30): after 5 incremental rounds, the complete resolution rule is fixed here, and it will be implemented table-driven in one pass. For each PR: candidates = the spec-keyed verdict for EVERY title spec plus the PR-keyed verdict; relation(c) vs head = Same | Moved | Unverifiable (no sha, sha <7 chars, or no head). A refusal is LIVE unless Moved, or superseded by a later approval (both recorded_at known) whose relation is Same; unknown recency means stay live. Any live refusal: SUPPRESS with a Blocked row (reason AtHead | Unverifiable). Else the newest approval decides: Same means mergeable with no row; Moved means SUPPRESS with a Stale row; Unverifiable means SUPPRESS with an Unverifiable row. No verdicts or only Moved refusals: not suppressed (the existing rework_ready row remains). INVARIANT: suppressed iff a Blocked, Stale or Unverifiable row exists.'
