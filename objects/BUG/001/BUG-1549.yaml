  content: 'Strict re-review BLOCK (01:35): pr_has_stale_or_unverifiable_local_approval (the mergeable suppression) reads the SPEC-keyed verdict via read_recorded_verdict_any, while stale_approval_rows (the explanatory row) reads the PR-keyed verdict (PR-{n}). On disk these disagree (PR-keyed approvals are often sha-less; spec-keyed ones carry a sha), so one PR can show ''cannot be verified - do not merge'' AND stay mergeable, or be suppressed with no row. Also there is no test of the suppression or the union. Dropped from batch 5; a rework is dispatched to make both use ONE verdict source.'
