title: 'aida doctor heal: spec-status-drift + stale-leases in one pass can leave a spec in the OPPOSITE drift (bump-then-reap ordering)'
description: 'Running aida doctor heal across categories in one invocation: spec-status-drift bumped TASK-1207 Approved to In Progress (it had a lease), then stale-leases reaped that stale lease, leaving TASK-1207 In-Progress-with-no-lease (the opposite drift). A second heal pass converges it (reverts to Approved). Fix: order heals so lease reaping precedes status derivation, or re-derive status after lease heals within a single pass, so one ''aida doctor heal'' converges without needing a second run.'
