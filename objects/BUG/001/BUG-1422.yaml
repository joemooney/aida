  content: |-
    [rework round 2] PR: none — both attempts exited without opening one. This is NOT a design problem and the spec is not misrouted; the implementer was cut off mid-exploration. Its last message was "I'm locating the drain selection and QueueDrained emission paths now", with a clean worktree and no commits.

    So the fix is to remove the exploration, not to re-drive the same search. There is a merged precedent for exactly this change shape and it is one commit old.

    FOLLOW TASK-1297 / PR #1982, WHICH MERGED TONIGHT. That spec added a count to the same event, for the mirror-image reason — it reports approved routed specs a batch filter EXCLUDED; this spec reports batch members the drain found INELIGIBLE. Same event, same wiring, same rendering surfaces.

    Its field, now on main in aida-cli-lib/src/events.rs:

        /// alarm on this field without scraping the closing summary line.
        // trace:TASK-1297 | ai:claude
        #[serde(default)]
        excluded_from_batch: usize,

    Copy that shape exactly, including `#[serde(default)]` so old event lines still parse.

    THE EIGHT FILES #1982 TOUCHED are your map. Every one is a place this change also belongs:

        aida-cli-lib/src/events.rs           the QueueDrained field
        aida-cli-lib/src/drain_state.rs      the live `aida drain status` figure
        aida-cli-lib/src/lib.rs              the batch drive + closing summary
        aida-cli-lib/src/watch.rs            rendering
        aida-cli-lib/src/notify.rs           the alarm rule
        aida-cli-lib/src/event_wait.rs       existing QueueDrained construction
        aida-cli-lib/src/integrate_view.rs   existing QueueDrained construction
        aida-cli-lib/src/tests/...           a dedicated test file

    Read #1982's diff first (`gh pr diff 1982`). It will answer the questions the last two sessions spent their budget rediscovering.

    WHAT THIS SPEC ADDS BEYOND A COUNT, and it is why a bare number is not enough: the acceptance wants the ineligibility REASON per member — guided, blocked, in-flight elsewhere. A count alone tells a supervisor the wave is stuck but not whether a human could unstick it. So the field is richer than `excluded_from_batch`; decide whether that is a count plus a reason breakdown or a small typed list, and say which in the PR body.

    THE BINDING CONSTRAINT, restated: a drain that genuinely completed its batch must produce NO extra output. The whole defect is that `shipped:0 shelved:0` reads identically for "finished" and "could never start" — adding noise to the success path would trade one unreadable signal for another.

    REGRESSION FIXTURE, from the incident: batch followups-0918i on 2026-09-20 ended with two members, STORY-1218 (execution_mode guided, which the drain correctly refuses) and TASK-1277 (approved but colliding with an unmerged PR). Three consecutive drains reported shipped:0 shelved:0 and a supervising launcher relaunched every three minutes indefinitely.

    Commit and open a PR even if incomplete — a PR with a stated gap is reviewable; a third session exiting with nothing is not.
