id: 01a0c04e-e506-7173-a849-af7584b7342a
spec_id: BUG-1480
agreed_id: BUG-1480
title: aida show takes 7.5 seconds on a healthy cache while list and search answer in 0.4 — the most-used per-spec read is the only one that does not use the cache
description: |-
  `aida show <SPEC>` takes 7.5 seconds against a healthy cache, while every other read of the same store answers in under half a second. It is the most-used per-spec command in the system and it is twenty-three times slower than the surfaces beside it.

  MEASURED 2026-09-20 19:32Z, repeated, on an idle machine with no drain running:

      aida show BUG-1447                 7.49 s
      aida show TASK-1300                7.71 s
      aida show BUG-1447 --no-git        7.50 s
      aida show BUG-1447 --format json   7.78 s

      aida list --status approved --fields id    0.41 s
      aida search "merge-hold" --fields id       0.32 s
      aida cache status                          0.32 s

  The cache is not the problem and is not stale:

      Cached requirements: 4094
      Store requirements:  4094
      Last built:          2026-09-20T19:00:50Z

  THE FLAGS RULE OUT THE OBVIOUS CAUSES. `--no-git` saves 0.3s, so the TASK-241 git-linkage section is not the cost. `--format json` is no faster, so rendering is not the cost. Four consecutive runs all land at 7.5s, so it is not a one-time warm-up or a cache rebuild. Whatever it does, it does every time, and `list`/`search`/`cache status` do not do it.

  WHY THIS CONTRADICTS THE DESIGN AS DOCUMENTED. CLAUDE.md states the storage model plainly: single-spec writes are targeted — "resolve the one spec via the cache (any id form → its canonical YAML) and read/modify/write that one file — no full-store scan — so writes are sub-second even with active leases (was ~13-20s; BUG-634)" — and "Reads follow the same rule: the bare `aida status` and `aida list` never `backend.load()` the full store (STORY-707)". A 7.5s single-spec read against a 4094-row cache is the signature BUG-634 and STORY-707 were about, on a path that apparently never got the same treatment.

  WHY THE COST IS LARGER THAN IT LOOKS. `aida show` is how every seat reads a spec: the skills use it, the discipline guides tell agents to use it, and any script that needs a field that `list --fields` does not expose has to call it per spec. Two concrete costs measured today:

  - A batch-refresh loop over the 30 approved specs, calling `aida show` twice per spec to read `execution_mode` and the batch tag, takes over seven minutes per cycle. The same information via `aida list --status approved --tags ...` takes under a second. The loop is not doing anything exotic; it is asking for two fields the list surface does not project.
  - An earlier per-spec loop over 16 specs in this session hit a 120-second timeout and had to be rewritten, for the same reason.

  So the practical effect is that agents either wait, or invent workarounds that avoid the canonical read command. That is the same pressure BUG-1288 describes for `aida awaiting --json` at 70-77 seconds: the machine-readable path becomes unusable and callers route around it.

  Acceptance:
  - `aida show <SPEC>` on a warm, non-stale cache completes in under one second for a single spec, in line with `list`/`search`/`status`.
  - The single-spec read resolves through the cache to one YAML file rather than loading the store, matching the documented targeted-write path.
  - `--no-git` remains available for callers that want to skip git linkage, but is not required to get acceptable latency.
  - A latency regression test covers the single-spec read the way one presumably covers `list` after STORY-707. AMENDED 2026-09-21 by the reviewer seat, binding: this criterion does NOT require the test to run in PR CI. Four fixture shapes have failed to separate a full load from a cached read against ~90ms of process startup, and a linear fit to the controlled points under-predicts the real store's cost by 4x, so a CI-sized fixture may not be able to reproduce the defect at all. A guard that only fires against a REAL STORE is acceptable. The original finding was a falsifiability complaint, not a venue complaint: an instrument that CAN fail when the defect is present satisfies it, and where it runs is a separate question from whether it can fail.
  - CONDITION CLOSED 2026-09-21 BY THE REVIEWER SEAT, DEMONSTRATE-IT-FIRES: the instrument was demonstrated against the defect PRESENT, on the real store, while the unfixed binary was still live. `aida usage --cmd show --slower-than 1000ms events` returned ten calls over the threshold (9889, 10029, 9875, 9896, 9841, 9890, 9866, 9851 ms ...), including one generated seconds earlier to produce the comparison. Not reasoned - fired. The same seat also measured the real-store discrimination the fixtures could not produce: `aida list` 0.39 s against `aida show BUG-1480` 9.96 s, a ratio of 25.5x where the largest fixture managed 0.99x. The instrument has enormous signal exactly where the cost exists, and the cost exists only on a real store.
  - BINDING CONDITION ON ANY REAL-STORE GUARD: a query is not a guard until something runs it. THE TRIGGER IS HEREBY SPECIFIED BY THE ADVISOR, and an implementation that omits it does not satisfy this spec. The check rides `aida pull`, following the EXISTING auto-archive precedent rather than inventing a new cadence surface: (a) INVOKED BY `aida pull`, which every seat runs after every merge and which is exactly the moment a regression would have just landed; (b) GATED ON CONFIG under `[perf]`, with a documented `AIDA_*` opt-out, mirroring `[archive] auto_after_days` + `AIDA_AUTO_ARCHIVE` - add the row to docs/environment-variables.md in the same change; (c) WHEN IT TRIPS it files a FINDING and prints a warning - it does NOT fail the pull. A performance regression must not block a merge-time sync, and a hard failure here would be traded away the first time it is inconvenient, which is how a guard becomes a comment. The rationale for riding an existing surface rather than adding a scheduled job: a new cadence surface that nothing already runs reproduces the capability-not-a-guard defect one layer out.
  - REJECTED TRIGGER DESIGNS, recorded so they are not re-proposed: PR CI (the cost does not exist in a tempdir - five measured fixtures); the per-turn `aida awaiting --notice` hook (it is cache/local-backed with no network by contract, and a latency probe there would make the cheapest surface expensive); a bare `aida doctor` category with nothing invoking doctor (a category is a capability, not a trigger - nothing in this repo auto-runs doctor). A doctor category MAY be added as an additional manual entry point; it does not satisfy this condition on its own.
   If the guard is `aida usage --cmd show --slower-than 1000ms events` or similar, the acceptance must name the TRIGGER - what invokes it, on what cadence, and what happens when it trips. Naming the instrument in the spec is not sufficient. Without a trigger we replace "a test that cannot fail" with "a query nobody runs", which is the same defect wearing different clothes.
  - COMPILER-ENFORCED STRUCTURAL GUARD, ACCEPTED BY THE ADVISOR as a COMPLEMENT and not a replacement. The guard this spec's review refused greps this crate's own source for the ABSENCE of a substring - which is the PRIN-5 shape (absence read as evidence) sitting inside the guard itself. Replace it with an assertion that the show path CANNOT call `load()`, enforced by the compiler rather than by text matching - e.g. a type/module boundary that does not expose the full-store load to that path. IT DOES NOT REPLACE THE USAGE INSTRUMENT AND NEITHER REPLACES THE OTHER: the structural guard proves the CALL cannot happen and runs at PR time; the usage instrument proves the COST is not happening and runs against the real store. They answer different questions, they fail for different reasons, and both are required. Proposed by claude-product-1, endorsed by claude-reviewer-1 as a design proposal for the advisor, ruled here.
  - SUPERSEDED BINDING CONDITION, DEMONSTRATE-IT-FIRES (kept for the trail; CLOSED above): before the guard is accepted, someone must restore `backend.load()` in the show path, run the guard against the real store, and SHOW IT TRIPS. Not reason that it would from 9.9s against a cached read - demonstrate it. Three instruments tonight were never live (a mutation that never changed behaviour, a detector that could not fire, a timing test that passed with the regression restored); all three were caught by the seat that built them and none by the seat downstream. A guard accepted on argument by a reviewer would be the fourth and the worst, because it would arrive already blessed. See TASK-1418.
  - THE DOMINANT COST TERM IS UNIDENTIFIED, and this is recorded so the next reader does not assume the 9.9s was understood. Measured: per-object and per-byte costs as a fresh fixture exhibits them (~0.08 ms/object, ~0.09 ms/KB) account for roughly a QUARTER of the production cost. `aida show --no-git` is 9.86s against 9.89s, so git linkage is ruled out. Whatever dominates lives in the store-read path and scales with something a tempdir does not reproduce. A guard watching an uncharacterised cost is weaker than one watching a known term - not a reason to block, but not to be forgotten either.
  - Verification: `aida usage --cmd show --slower-than 1000ms events` shows no entries after the fix; the same query today should show the population.

  Related: the `--fields` projection on `list`/`search` (STORY-734) is the reason the batch-refresh workaround exists. If `show` cannot be made fast, the alternative is projecting `execution_mode` through `--fields`, but that treats the symptom.
