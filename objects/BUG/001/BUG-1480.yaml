    6. MEASUREMENT NOTE for whoever sets the bar. Criterion 1 says 'under one second on a warm, non-stale cache'. On main at b09197ab72 WITHOUT this fix I measured aida show at 0.36s repeatedly against a healthy 4116/4116 cache - so the criterion as written is already satisfiable pre-fix and does not capture the defect. The spec's own verification query does: aida usage --cmd show --slower-than 1000ms events shows a live population today including 8455ms, 38864ms, 39033ms. The variance is consistent with the repo-walk cause - warm page cache is fast, cold or contended is not. Recommend restating criterion 1 as a tail target (p95/max) rather than a warm-case median, or the fix can be declared done against a number that was already true.
