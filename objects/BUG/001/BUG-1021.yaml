  content: 'Cause found from Sep 8/Sep 9 cross-platform logs: macOS failures were Linux-only /proc ancestry lookup plus /private/var vs /var temp-path assertions; Windows failures were POSIX shell subprocess tests and path-list/path-separator assumptions, plus role queue identity ''role:implementer'' being used as a raw filename. Scheduled notifier also failed because gh issue commands ran without repo checkout/context. Fix adds macOS ps fallback, path canonicalization/TOML escaping, Windows-portable PATH/path assertions, Unix-gated POSIX shell tests, portable queue filename encoding with decoded logical users, and checkout for notifier jobs.'
