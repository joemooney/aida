title: aida merge-hold clear --stale sweeps only MERGED PRs, so a hold on a PR closed without merging survives forever as a refusal that protects nothing
description: |-
  OBSERVED 2026-09-21, minutes after two PRs were closed without merging.

  `aida merge-hold clear --stale` documents its contract in its own --help: "Clear every marker whose PR has already merged (phantom holds)". A PR CLOSED WITHOUT MERGING is equally phantom — it can never merge, so its hold can never release anything — and the sweep leaves it behind.

  MEASURED ON THE FULL POPULATION, not on the two instances that prompted this. All 19 markers under .aida/merge-holds/ were checked against their PR's state:

      OPEN     17
      CLOSED    2    PR-2009, PR-2043 — both closed without merging, both still held
      MERGED    0

  So 2 of 19 markers were phantom within four minutes of the closures. The shape is not rare: any disposition ruling that closes a duplicate, a superseded round, or an untestable PR produces one, and tonight produced two in a single consolidation.

  WHY IT MATTERS MORE THAN TIDINESS. A merge-hold marker is a protection record — it says a seat refused and names the release condition. A marker on a closed PR is a refusal that protects nothing, and it pollutes exactly the surface a seat consults to answer "what am I blocking and why". `aida merge-hold list` shows it, `aida awaiting` counts it, and a reviewer sweeping stranded refusals has to hand-check each one against the forge to tell live from phantom. The sweep verb exists precisely so nobody has to do that, and it silently covers only half the cases.

  WHAT TO BUILD. `--stale` should sweep every marker whose PR is in a TERMINAL state — merged OR closed-without-merging — since neither can ever release. Report the two classes distinctly in the output so a human can see which happened ("merged" vs "closed unmerged"); they mean different things about how the hold ended even though the marker is equally dead. Update the --help text in the same change, since the current wording is what made the gap invisible.

  A NOTE ON HOW THIS WAS FOUND, because the method is the point. The reviewer seat did NOT run --stale to test the behaviour. They read the documented contract and reported that instead. Their stated reason: running a mutating sweep as a probe is the mistake they made earlier tonight with `merge-hold list --fix`, which silently erased the four label-unknown rows that were the visible signal being investigated. Probing a surface with the command that changes it destroys the evidence. That restraint is why this is filed from the contract rather than from a wrecked marker directory.

  Filed by the driver-advisor seat, disposing of an observation the reviewer seat sent rather than filed. Autonomous-safe: output and predicate only, no change to what a hold means or to the merge path.
