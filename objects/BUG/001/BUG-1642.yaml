  content: 'Strict review: APPROVE — eb2348ad19. Evidence: (1) release build of aida-cli: no ''aida-lib-test-home'' / AIDA_LIB_TEST_REAL_HOMES / ''hermetic'' strings, .init_array holds only the 2 std entries; module is #[cfg(test)] (lib.rs:323-325) so the constructor never ships. (2) strace -f of the branch lib test binary for ''queue_rework'' (51 pass) and ''auto_bump_done'' (74 pass): 0 syscalls touching /home/joe/.aida; temp home /tmp/aida-lib-test-home-<pid> created and removed at exit. With HOME=<fake home holding a copy of advisor.toml> + AIDA_SESSION_ROLE=advisor, queue_rework_tests (46 pass): fake advisor.toml md5 unchanged, no access to it. aida_done_emits_the_ship_record (sets AIDA_SESSION_ROLE=advisor, fixture BUG-12860) resolves the global role file to the temp home. (3) Full lib suite, CARGO_BUILD_JOBS=3, no pty: 6767 passed, 0 failed, 2 ignored; no leftover temp homes. The real ~/.aida/roles/advisor.toml did gain a BUG-12860 ''done'' row at 08:45:41Z during that window. It came from /home/joe/ai/wt-int88/target/debug/deps/aida_cli_lib-61bc7bb68ee4c459 (started 08:45:28Z, an integrate-88 build without test_home.rs), not this branch; the strace above shows this branch''s binary never opens ~/.aida. usage.jsonl changes are from the released f9c900b binary. (4) Release semantics: crate::home_dir() under not(test) is exactly dirs::home_dir() (lib.rs:48824-48833); all 59 call sites are one-for-one substitutions, with Option/context handling unchanged. The link_section attrs (.init_array / __DATA,__mod_init_func / .CRT$XCU) match what the ctor crate uses. set_var before main is sound because the process is single-threaded there. Non-blocking follow-ups: (a) The one-time cleanup of the fixture [[activity]] rows (BUG-9107/9112/9113, NFR-56, BUG-12860, possibly STORY-52) in the real ~/.aida/roles/advisor.toml is neither done nor documented, and the spec asks for it. Do it after merge, because unfixed builds in other worktrees keep appending. (b) The constructor does not clear AIDA_SESSION_ROLE/AIDA_SESSION_PROJECT. record_role_activity (lib.rs:22123) also probes the project role file, which resolves to the operator''s MAIN checkout (/home/joe/ai/aida/.aida/roles/advisor.toml, seen in strace). It is not written today only because that file does not exist. This is the same bug class, so clear AIDA_SESSION_* in test_home.rs CLEARED_VARS. (c) Windows gap: dirs::home_dir in aida-core (user_prefs.rs:40, agents_config.rs:281, registry.rs:141, liveness.rs:398) and dirs::config_dir (remote_create.rs:799, scaffold_cmd.rs:372) ignore HOME/USERPROFILE on Windows. CI only runs cargo check --tests on Windows, so this is theoretical today; file it as a follow-up. (d) The source-scan test (test_home.rs no_direct_dirs_home_dir_in_crate) only matches dirs::home_dir. It misses dirs::config_dir and direct var_os("HOME") readers (reconstitute.rs:604, init_cmd.rs:72). Layer 1 covers these on Linux/macOS. (e) Nested mode (test_home.rs install_nested) trusts AIDA_LIB_TEST_REAL_HOMES verbatim. A bogus inherited value keeps the real HOME and disables the fence. Harden it by also adding the passwd home. This is test-only and cannot affect production. (f) A test binary killed by SIGKILL or abort leaks /tmp/aida-lib-test-home-<pid>. That is minor. (g) Edition-2024 migration will need ''unsafe extern "C"'' and #[unsafe(link_section)] (test_home.rs:66-86). Could not cross-check the Windows/macOS test builds locally (ring needs a C cross toolchain); CI''s windows cargo check --tests covers compile.'
