title: Queue file writes (queue_add, queue_remove_for_role, queue_clear) read-modify-write registry/queues/<user>.yaml without the store lock, so concurrent queue commands drop each other's entries
description: 'Found by the planner reading git_backend.rs on main (queue_add ~1761, queue_remove_for_role ~1814, queue_clear ~1887; queue_remove_many ~1948 is fixed by BUG-1671). Each does ensure_store_write_safe but no lock_store(). Acceptance: 1. All four queue writers take lock_store() around the read-modify-write. 2. A concurrency test (threads or processes on a fixture store) adding/removing distinct entries loses none. 3. No lock-order inversion with callers that already hold the store lock (document the order).'
