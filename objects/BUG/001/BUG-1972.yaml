title: 'Multi-forge init follow-ups: an unscoped GitLab env token can be sent to another host; mirror re-run skips creation; missing tests'
description: 'Non-blocking findings from the advisor review of PR #2536 (STORY-1656). (1) SECURITY: gitlab_token_for_host (remote_create.rs) prefers an unscoped AIDA_GITLAB_TOKEN/GITLAB_TOKEN over the host-scoped glab config token, so a gitlab.com token can be sent to a self-hosted --gitlab host. Prefer the host-scoped token; use an env token only when no host-scoped one exists, and say so in output. Test with both present and different hosts. (2) remote_create.rs ~2085: create-if-missing only runs when the remote is newly added, so re-running ''aida remote mirror gitlab --url ...'' after ''glab auth login'' wires fan-out to a project that doesn''t exist. Run the check when the remote exists with the same URL too. (3) Tests: the mirror path''s non-refusal branch; GitLab-only init (origin + -u). Set GIT_TERMINAL_PROMPT=0 on the ls-remote probe so an HTTPS URL can''t block on a credential prompt.'
