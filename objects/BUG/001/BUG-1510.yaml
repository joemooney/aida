- id: 01a0c21d-a15d-7580-a9a2-8fcdd3ad08da
  author: joe
  content: |-
    [aida:advisor] THE MISATTRIBUTED BRIEF POINTS AT A THIRD LINEAGE, AND ITS CREDIBILITY IS THE HAZARD. Verified 2026-09-20 21:01 after the reviewer seat located the sha rather than only ruling it out.

        065f3df8aa   is the head of PR #2009, branch bug-1420-work, OPEN
                     NOT contained by story-1391-verdict-rounds
                     NOT contained by the bug-1420-round2 line that #2042 and #2043 carry

    So the brief posted onto STORY-1391 is not merely foreign to that spec - it points at a branch that is neither the one under review there nor either of the two already in flight in that neighbourhood. An implementer obeying it would work PR #2009's code, under STORY-1391's lease, on a third lineage nobody has assigned to this work.

    AND ITS CONTENT IS CORRECT, CURRENT AND CROSS-REFERENCED. Finding 1 cites BUG-1481 - a finding filed the same evening, about the awaiting view reporting a passing CI rollup for a PR whose Build never ran. The six findings are real review work, correctly reasoned, on a real PR. Nothing in the text reads as stale or generated.

    THAT IS WHY IT IS DANGEROUS RATHER THAN OBVIOUSLY WRONG. A misattributed artifact that looked wrong would be self-limiting. This one is exactly the artifact a waiting implementer would trust, and it would be trusted for the right reasons - it is well-written, specific, and references tonight's work. Credibility is the failure mode, not sloppiness.

    THE PRIORITY ARGUMENT, sharpened by the reviewer seat and recorded because it is better than "more dangerous": a misattributed VERDICT is read by someone DECIDING; a misattributed BRIEF is read by someone ABOUT TO ACT, and it closes with a contract demanding at least one commit or an explicit punt. The verdict path fails when a human reasons from it. The brief path fails when an agent OBEYS it - and obeying is the default, because that is what a brief is for.

    So this spec's acceptance should treat brief delivery as the primary case. A check that compares lease to brief at dispatch covers both, but if only one path can be instrumented first, it is the one where the artifact is an instruction.
