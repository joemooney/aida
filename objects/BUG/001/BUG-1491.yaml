    IT IS NEITHER. It is the THIRD case the template does not offer: THE SYSTEM WORKING AS DESIGNED. Failure kind `verdict:request-changes` means a reviewer read the work and asked for changes. That is the review gate doing its job. Shelving the drain was correct; filing a DRAFT BUG about it was not, because there is no defect to fix - the drain stopped because something told it to stop, which is the contract.

    The underlying work (BUG-1480) has since moved on under human/seat review, so nothing here is actionable even as a record.

    THIS IS NOT A ONE-OFF AND THE NUMBERS ARE ON BUG-1498: 408 auto-drafted shelve records exist in this store and 399 of them are ALREADY REJECTED - 97.8%. Ninety-one carry this same `verdict:request-changes` kind. A surface whose output is rejected 98% of the time is not a triage queue, it is a tax.
