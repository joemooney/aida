title: 'scripts/check-removed-flags.sh fails on main: it flags old mode-selecting flag names quoted in CHANGELOG.md history lines'
description: 'Running scripts/check-removed-flags.sh on main prints matches such as CHANGELOG.md:740 (BUG-534 ''aida graph --tree''), :1315 and :1465, plus ''old mode-selecting CLI flags found; use subcommands instead''. Those are historical release notes, not live usage. Every integration preflight since at least batch 90 has reported SH_FAIL for it, so it is ignored as noise, which hides real regressions. Fix: exclude CHANGELOG.md (and other dated or historical artifacts) from the scan, or scope it to live docs, help and skill sources; then make the script exit non-zero on a real match so the gate is meaningful. Acceptance: passes on main; a planted ''--tree'' in a live doc fails it.'
