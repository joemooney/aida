title: 'Windows nightly: bug_1651_rollback_restores_an_i64_max_position_exactly finds an empty queue (left 0, right 1)'
description: 'Cross-platform run 36249925145 (main b331809ce7, batch 96): on windows-latest, aida-cli-lib/src/tests/bug_1651_promote_queue_cas_tests.rs:180 panics with ''assertion left == right failed: [] left: 0 right: 1''. After a promote rollback that should restore a prior entry at position i64::MAX, the queue is empty on Windows; it passes on Linux and macOS. Determine whether this is a test-fixture portability issue (path/role/queue file location, CRLF in the queue YAML, the i64::MAX round-trip through YAML on Windows) or a real product bug in withdraw_promoted_queue_entry / queue_reorder on Windows. Fix production code if users would hit it. Acceptance: the test passes on windows-latest via a workflow_dispatch of Cross-platform (nightly) on the branch.'
