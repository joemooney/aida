  content: 'Implementation note (Codex, 2026-10-03): extended STORY-584''s persisted structural defer with an optional deferred_reason and an operator-held marker. Reasoned holds render as Held; product/advisor/unseated operator roles can set or lift them. Explicit/queue-head pickup and direct session start now return the typed OperatorHoldRefusal before queue synthesis, worktree, or lease side effects. Existing reasonless deferrals remain compatible. TASK-1580 migration guidance is in docs/lifecycle.md.'
