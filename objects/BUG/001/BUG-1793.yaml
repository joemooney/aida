  cache:
    stale: false presents it as actionable. Workaround used: a DECISION-GATE task (TASK-1580, kept Draft) wired as blocked-by, which pickup DOES enforce ('refused until all blockers are Completed'). That works but is a convention, not a feature: nothing stops a gate task being approved by an agent, nothing renders held specs distinctly in list, and punt cannot express it (requires In Progress, lands in NeedsAttention which nags the awaiting view). Substrate-as-bouncer principle: the hold should be enforced by the substrate, not depend on agents reading prose. Acceptance sketch: (1) a hold/defer verb (or status) settable on an Approved spec with a required reason + optional revisit trigger text; (2) pickup/queue/drain refuse a held spec with a typed refusal naming the hold; (3) count: 30 of 42 open
