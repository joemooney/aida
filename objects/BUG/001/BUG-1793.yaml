title: 'No first-class deferred/on-hold state: an operator hold recorded only in decisions/comments does not bind pickup, so a deferred-but-approved spec reads as drain-ready'
description: |
  Observed 2026-10-03 on BUG-1669: all original blockers Completed, operator hold existed only as decision records (01a0e125/01a0e10c) and comments — `aida session start` happily took a lease and moved the spec In Progress; the agy seat discovered the hold only by READING the spec, then had to back out (session 01a1027a, worktrees/branches cleaned).

  The status vocabulary (draft/approved/planned/in-progress/done/completed/rejected/superseded + punt's NeedsAttention) has no state for "approved but operator-held with a revisit trigger", and `approved` is documented as "blessed, ready to plan/queue" — a misstatement for a held spec, so `aida list` presents it as actionable.

  Workaround used: a DECISION-GATE task (TASK-1580, kept Draft) wired as blocked-by, which pickup DOES enforce ("refused until all blockers are Completed"). That works but is a convention, not a feature: nothing stops a gate task being approved by an agent, nothing renders held specs distinctly in list, and punt cannot express it (requires In Progress, lands in NeedsAttention which nags the awaiting view).

  Substrate-as-bouncer principle: the hold should be enforced by the substrate, not depend on agents reading prose.

  Acceptance sketch:
  1. A hold/defer verb (or status) settable on an Approved spec with a required reason + optional revisit-trigger text.
  2. pickup/queue/drain refuse a held spec with a typed refusal naming the hold.
  3. `aida list` renders held distinctly and excludes it from ready-lenses.
  4. Only an operator (or explicitly authorized seat) can lift the hold.
  5. Migration note for the TASK-1580-style convention.
