title: 'No first-class deferred/on-hold state: an operator hold recorded only in decisions/comments does not bind pickup, so a deferred-but-approved spec reads as drain-ready'
description: |-
  Observed 2026-10-03 on BUG-1669: all original blockers Completed, operator hold existed only as decision records (01a0e125/01a0e10c) and comments — aida session start happily took a lease and moved the spec In Progress; the agy seat discovered the hold only by READING the spec, then had to back out (session 01a1027a, worktrees/branches cleaned). The status vocabulary (draft/approved/planned/in-progress/done/completed/rejected/superseded + punt's NeedsAttention) has no state for 'approved but operator-held with a revisit trigger', and  is documented as 'blessed, ready to plan/queue' — a misstatement for a held spec, so count: 30 of 42 open
