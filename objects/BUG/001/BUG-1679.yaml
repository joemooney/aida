- id: 01a0fdea-8ac0-7360-b95a-3b060a027ae0
  author: joe
  content: |
    BUG-1723 AMENDMENT to the 2026-09-28 operator precedence decision (recorded here because the
    decision lives on this spec and BUG-1679).

    The decision's precedence line read:

        attributable AIDA_BIN > on-disk .aida/config.toml override > running executable > PATH

    The 2026-10-02 BUG-1723 operator decision (config.toml is worktree-resident and UNTRUSTED for
    launch-authority values) removes the second term. The effective order is:

        attributable AIDA_BIN > running executable > PATH

    Verified on main at fe09d7678e before amending: the on-disk override term was never implemented —
    aida_bin.rs:278 reads only the AIDA_BIN env var (ancestor-attributed per this spec's rework),
    resolve()'s override source is env-only, and no code reads AIDA_BIN or any *_bin key from
    .aida/config.toml. So this amendment changes records, not behavior. The guard landed by BUG-1723
    (aida-cli-lib/src/tests/bug_1723_config_trust_tests.rs + scripts/config-trust.toml) now fails any
    attempt to add an executable-selecting key to the branch-local config surface, which makes the
    removed term unimplementable without advisor signoff.
