- id: 01a0e115-11f5-7281-b3d2-a76d51b8ec1e
  author: codex-independent-advisor
  content: |
    ADVISOR DECISION — REVISE ACCEPTANCE / PROTECTED-LAUNCH DEPENDENCY; PR #2226 REMAINS OPERATOR-HELD. NO IMPLEMENTATION DISPATCH OR MERGE AUTHORIZATION.

    Independent advisor only, distinct from product, implementer and reviewer. Read AGENTS.md, two-seat protocol, rework-brief craft, recovery playbooks, BUG-1679 --full and product comment 01a0e0fc-362d-7862-b492-3e3a6e7df3a6, TASK-1-177 --full, and BUG-1669 --full with its operator/sketch/advisor comments. Used /home/joe/ai/aida/target/release/aida throughout. Inspected source read-only at exact PR head e63efc3997a85df8cb1ff463f48222900ed5f7d6 against base 854b7e26f7222c73845064275a18c293c9895283. Read verdict files .aida/review-verdicts/PR-2226/e63efc3997a85df8cb1ff463f48222900ed5f7d6.json and .aida/review-verdicts/BUG-1679/e63efc3997a85df8cb1ff463f48222900ed5f7d6.json. Both remain REQUEST_CHANGES. GitHub readback confirms OPEN, that exact head, and aida:merge-hold. This is a design/rework disposition, not a replacement review or test pass.

    1. Binding boundary and escalation

    BUG-1679 AC1 as written (prefer ANY executable AIDA_BIN, otherwise existing fallback) cannot be satisfied safely in this shared authoritative resolver under the settled operator requirements. Executability is a usability property, not provenance or authorization. A child cannot distinguish an authentic coordinator export from an attacker-supplied variable by inspecting the environment. Absolute paths, canonicalization, basename/version output, same-UID ownership, writable allowlists, UUID/PID state, a PTY, or another environment marker do not establish the missing protected identity. Even probing --version executes the candidate.

    Reject the product comment's classification of this patch as authority-neutral and its proposed automatic batched-integration route. Source confirms resolve_aida_exe_from_with_bin overrides a valid current executable; export_coordinating_bin_env runs before dispatch and prepends the selected directory to PATH. session.rs::drive_path_env repeats that coupling; intake and shared headless sinks select bare vendors. apply_session_env_to_process supplies the same resolver as the supposedly running executable to trusted_session_env; mcp.rs::McpRespawnState::check executes its result to probe identity. This is broader than a harmless handoff hint. The finding's fake-vendor execution is reviewer evidence; I independently verified the source data flow, not reran that probe. No installed broker bypass or OS privilege escalation is asserted.

    Joe's BUG-1669 decisions 01a0e0a3-e301-7c72-83e7-68ab14eaf9e0 (literal anti-forgery), 01a0e103-c774-7620-b1dd-f783c05bcb81 (every AIDA-managed launch on this host, across projects), and latest 01a0e10c-66ae-7883-9f98-f422dff413fa (P-enrolled-host accepted IN PRINCIPLE) control. The latter answers the deployment-direction question left open by advisor 01a0e106-45f4-7a51-9107-7cadcc06eaf0; do not ask it again. It does NOT select a backend, approve implementation/installation/migration, or satisfy the concrete architecture/proof obligations of 01a0e0ad-9b81-7e61-a3d4-8d00ef3077f8. Unmanaged independent vendor clients are excluded; official AIDA routes cannot be reclassified as unmanaged to evade the perimeter.

    Route to PRODUCT for explicit BUG-1679 acceptance reconciliation, and to the BUG-1669 architecture author for the self/vendor identity and admitted-update contract; return the design to an independent advisor before implementation dispatch. Preserve this spec and TASK-1-177 as the rework trail. This comment changes no status/queue and does not request an implementation requeue now.

    Recommended revised acceptance: AIDA_BIN is untrusted input only. It cannot change authoritative AIDA self identity, vendor identity, authorization, or vendor search directories. A different coordinating build can be selected only through independently established, protected installation/admission/update policy and a launch plan bound to that identity; the variable may at most name a candidate already admitted by that mechanism. Unknown/unadmitted identity or unavailable protected authority refuses managed protected launch; no arbitrary PATH/vendor fallback. Identity admission is necessary but is not itself a scoped launch grant.

    For a smaller pre-architecture repair, product may instead revise BUG-1679 to withdraw general env precedence, retain independently determined running-binary behavior, and isolate regression tests. That removes this PR's new redirection but does NOT implement today's 'prefer any executable' acceptance, repair all existing PATH/current-executable weaknesses, or complete BUG-1669. Merely accepting AIDA_BIN when it equals the independently chosen identity is a redundant hint, not fulfillment of arbitrary coordinator selection. No hidden developer/contained-mode exemption is approved. Until acceptance is reconciled and independently gated, the original override remains blocked; do not build a broker inside this small bug.

    2. Concrete rework obligations after that gate

    P1 — lib.rs::resolve_aida_exe_from[_with_bin], aida_exe_path, export_coordinating_bin_env; session.rs::drive_path_env; trusted_session_env callers; mcp.rs identity probe/respawn; all self-spawn consumers identified in TASK-1-177. Remove ambient-env authority from these paths. Keep self-location, an untrusted handoff hint, and admitted vendor selection distinct. Never prepend a directory solely because AIDA_BIN names an executable there. The protected design must pin self/vendor artifacts and their dependencies under protected policy, sanitize launch environment/search paths, and govern replacement/update; current_exe is the existing locator, not a newly certified same-user security anchor. Tests must start with fixed PATH and a different executable override plus sibling fake vendors; assert no override execution, no sibling vendor selection and no env laundering into session/MCP/scheduler/self-spawn identity. Use recording fixtures only.

    P2 — relative/bare path identity and TOCTOU. The reviewed resolver returns ./aida or aida unchanged after checking the parent's directory. maintenance_schedule.rs::run_with_kill_timeout changes cwd; a bare name can select another PATH entry. A revised candidate API must reject nonabsolute input, or resolve it once against explicit captured parent cwd to an absolute path before validation, caching and launch; never re-resolve against child cwd/PATH. Prefer rejection for the authoritative path. Include parent/child marker binaries, competing PATH binary, Windows drive-relative/root-relative inputs, and symlink cases. Absolute/canonical paths fix resolution ambiguity only: replacement of a file, symlink or directory between check and spawn remains possible, and OnceLock caches a pathname, not an immutable executable. The protected architecture must bind admitted artifact identity through actual execution using its protected storage/spawn/update mechanism; a second metadata check is not proof. Require a replacement-race fixture to prove refusal or execution of the admitted artifact, never the substituted one.

    P2 — executable validation. lib.rs::is_executable tests any Unix execute bit and accepts every regular file off Unix. It is insufficient for this contract. If revised acceptance retains candidate validation, define supported executable formats and validate access for the process credentials that will execute, with platform-specific semantics; do not equate mode & 0111 with permission for that caller. Cover owner mode 0001 under an unprivileged fixture, 0644, directories, absent/dangling paths, valid binaries and invalid formats/interpreters. Permission prechecks can still race and cannot guarantee successful exec. On Windows use a real native fixture executable and runtime checks for denied access, ordinary text, and malformed .exe; an extension alone is insufficient. Do not classify arbitrary PATHEXT entries or shell scripts as native AIDA binaries, or add shell fallback. Prevalidation failure may use only an independently permitted fallback as the revised contract specifies. Actual access/format/identity failures must produce explicit nonzero failure for protected launches, with no unprotected retry; do not run an untrusted candidate to test it. Cross-compilation is not Windows runtime evidence. Keep changes to the shared helper scoped or audit its other callers before altering their contracts.

    P2 — inherited environment/tests. tests/resolve_aida_exe_tests.rs::deleted_executable_path_uses_replacement_at_clean_path now observes ambient AIDA_BIN. test_home.rs::CLEARED_VARS does not clear it; a directory named fake_home is not environment isolation. Make deterministic resolver tests inject all inputs explicitly, including absent override; clear/pin AIDA_BIN in top-level test startup before resolver OnceLock initialization. Audit re-executed test children: deliberately injected fixture values must survive only where intended, while operator values never leak in. Use child-local env removal/assignment and fake HOME/XDG/vendor homes, not concurrent global mutations; any unavoidable process-global test mutation uses the existing common guard without nested locking. Add fresh-process runs with AIDA_BIN unset and with a harmless absolute poison executable, invalid path, directory, bare and relative values; both the old deleted-executable regression and new tests must be deterministic. Exercise production export/session/MCP plumbing through hermetic seams, including OnceLock initialization, rather than only testing the helper. No real vendor, real HOME or protected service launches.

    3. Evidence required and hold/routing

    After revised acceptance/design signoff: implementer supplies a finding-by-finding mapping to changed symbols and tests; run targeted crate tests and cargo fmt, Linux behavioral fixtures, and native Windows runtime evidence for any supported Windows behavior. The prior reviewer used extracted exact-source probes; its Cargo run was canceled waiting for build slots, so there is no full-crate pass to inherit. Windows runtime was not tested. Obtain a fresh independent strict review on the NEW exact head; no reuse of e63efc3997's verdict as approval. Protected identity claims additionally require the actual boundary evidence and separately authorized disposable environment specified by BUG-1669; mocks cannot close that gate.

    PR #2226 MUST STAY OPERATOR-HELD EVEN AFTER REPAIR. Keep aida:merge-hold; neither green CI, mechanical P2 repairs, revised acceptance, nor a future reviewer pass removes it. Return to an independent advisor with reconciled acceptance and new exact-head evidence; Joe must explicitly release the operator hold before an integrator can merge. Any retained authority-changing behavior also requires the protected-launch architecture gate. This decision does not approve a review, authorize deployment, or waive any gate.

    Routing: product -> acceptance reconciliation on BUG-1679; protected-launch architecture author -> concrete identity/admission/update delta under BUG-1669; independent advisor -> design gate; only then implementer -> bounded repair; fresh reviewer -> exact-head evidence; advisor and Joe -> final disposition/hold release; integrator only thereafter. No agents dispatched or queue/status changed here. Only this durable comment is written; no code edits, tests, security installation or merge performed.

    Platform references consulted to constrain the requested tests: Rust Command documents relative-path/current_dir ambiguity and inherited environment (https://doc.rust-lang.org/std/process/struct.Command.html); Linux access(2) documents real/effective-ID differences and check/use races (https://man7.org/linux/man-pages/man2/access.2.html); Microsoft CreateProcessW describes executable/module and batch/interpreter behavior (https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocessw). These support the correctness constraints, not certification of a protected design.
