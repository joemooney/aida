- id: 01a0ed14-72a7-7f30-9f69-22482a45879e
  author: joe
  content: |
    ## CLOSING RECORD — completed 2026-09-29 via TASK-1499 / PR #2261, with AC1 NOT implemented

    Marked `done` by the operator on 2026-09-29 (`aida queue done --force`), after PR **#2261** merged to
    main at `8dcb6c5d24`. Recording precisely what shipped, because the `done` status alone would
    misread this spec's history.

    ### AC1 as written was REJECTED, not deferred and not delivered

    AC1 — *"`resolve_aida_exe_from` prefers `AIDA_BIN` when it names an executable file, else falls back
    as today"* — was implemented on PR **#2226** and **rejected there** on independent review. The
    advisor disposition on this spec (comment `01a0e115-11f5-7281-b3d2-a76d51b8ec1e`, 2026-09-26) is the
    binding one: executability is a usability property, not provenance, so a child process cannot
    distinguish an authentic coordinator export from an attacker-supplied variable by inspecting the
    environment. `AIDA_BIN` is untrusted input.

    **Do not read this spec as evidence that an executable `AIDA_BIN` is now honoured. It is not, by
    design.**

    ### What actually shipped

    PR #2261 (`[AI:codex] feat(agent-launch): resolve local AIDA executable portably (TASK-1499)`) — the
    **guarded** portable resolver. It closes the underlying contract gap this bug was filed for (the
    coordinating-binary handoff no longer depends on the PATH prepend alone) without granting ambient
    environment authority over binary identity.

    Every commit on #2261 is trailed `(TASK-1499)`; `BUG-1679` appears **0 times**, which is why this
    spec did not auto-complete on merge and had to be closed by hand.

    ### Still open, tracked elsewhere

    The broader protected-launch obligations — P1 (remove ambient-env authority from the resolver,
    session, MCP identity-probe and self-spawn paths), P2 (relative/bare-path identity and the TOCTOU
    window), P2 (`is_executable` treats any Unix execute bit as sufficient and accepts every regular file
    off Unix) — are **not** closed by this spec. They belong to **BUG-1669**'s protected-launch
    architecture, which remains `approved` and unimplemented.

    PR #2226 is closed unmerged; it is preserved as the rework trail for why the unguarded approach was
    abandoned.

    Recorded by the advisor seat, session #10 of the relay.
