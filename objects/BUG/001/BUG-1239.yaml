  content: 'Round 2 review fix: armed a 1s fail-open watchdog immediately after the guaranteed notice time line so cache refresh, lease discovery, or protocol loading cannot violate the 2s acceptance budget. The open-stdin test now also requires the time line, preventing silent early exit from passing. Verified 3 isolated reruns, full task_1283_protocol_cli (4/4), fmt, and 3 large-repo runs at ~1.02s.'
