  author: joe
  content: |-
    FACTORY PLAN (antigravity):
    Approach:
    1. In dev_build.rs (recover_live_dir):
       - Detect old-format rollback state where swap.join(PROMOTED_FILE) exists (.rollback/.promoted).
       - Move .rollback/.promoted to .rollback/live.promoted.
       - If !layout.live_dir.join(PROMOTED_FILE).exists(), move layout.prev_dir().join(PROMOTED_FILE) to swap.join(PARKED_PREV_RECORD) (prev.promoted).
       - Treat marked as true (marked = swap.join(ROLLBACK_MARKER).exists() || had_old_promoted).
       - Continue through normal settle_records and binary cleanup.
    2. In dev_build.rs: clarify comment regarding .swapping marker so it does not overstate its role.
    3. In dev_build_tests.rs: remove truncated dangling doc comment at line 1397.
    4. In dev_build_tests.rs: add unit tests simulating older binary crash points with .rollback/.promoted present across stages (before binary swap, after partial/full binary swap, and with/without prev record).

    Files to change:
    - aida-cli-lib/src/dev_build.rs: recover_live_dir
    - aida-cli-lib/src/tests/dev_build_tests.rs: remove truncated doc comment, add test cases

    Tests to add:
    - recovery_with_old_format_promoted_before_binary_swap_restores_records
    - recovery_with_old_format_promoted_after_binary_swap_swaps_records
    - recovery_with_old_format_promoted_when_live_already_has_record
    - recovery_with_old_format_promoted_without_prev_record

    Risks:
    - Low; applies only when transitioning from old-format .rollback/.promoted crash state under live_dir lock.

    Acceptance:
    - Old-format leftovers migrate cleanly and preserve correct record attribution.
    - dev_build_tests.rs:1397 dangling comment removed.
