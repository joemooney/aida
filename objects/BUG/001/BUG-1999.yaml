title: aida dev recovery misattributes prev's record when an old-format .rollback/.promoted leftover is present
description: |-
  Follow-up from the BUG-1959 strict round-3 review (PR #2573, APPROVE at f90eb0aa08).

  Scenario: an older binary crashes partway through a rollback (stages 1-4 of the old flow), and a binary built with BUG-1959 then recovers.
  - Result: live is B with no record, and prev is A beside record b; record a is deleted.
  - The old code handled stages 1 and 3 correctly, so this is a small regression for those stages.
  - Only metadata is wrong, never a binary: after a later rollback, aida dev status would show B's sha and allow-dirty flag for A.

  Fix: during recovery, if .rollback/.promoted exists:
  - move it to .rollback/live.promoted and treat the state as marked;
  - move prev/.promoted to .rollback/prev.promoted when live has no .promoted;
  - then settle as usual.
  At minimum, correct the Known limits wording.

  Also from the same review:
  - the .swapping marker is now redundant (mutating the marked guard away is an equivalent mutant), so the comments overstate it;
  - dev_build_tests.rs:1397 has a dangling, truncated doc comment.
