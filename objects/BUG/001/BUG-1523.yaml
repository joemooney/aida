title: An InProgress spec with no live lease is not surfaced as an anomaly, so the substrate reports work in flight that nobody is doing
description: |
  Split out of BUG-1470 acceptance criterion 2 by the driver advisor on 2026-09-20,
  before PR #2035 merges. #2035 satisfies criterion 1 only (metadata-only rework leaves
  the spec claimable). BUG-1470 is already Done, so merging auto-bumps it to Completed
  and would close this criterion unmet and unfiled.

  THE DEFECT. A spec can sit InProgress with no live session backing it: a drain that
  exited, a session that crashed, or an advisor flip like the one this advisor performed
  on BUG-1460 at 2026-09-20 21:30 to get past a pickability refusal. Nothing reports the
  mismatch, so every open-work view counts it as being worked.

  aida ps already computes the harder half of this - it lists orphaned In-Progress specs
  with no live session. What is missing is that the anomaly does not reach the surfaces
  where the lie is actually read: aida list, aida status, aida awaiting.

  ## Acceptance
  1. A spec that is InProgress with no live lease and no live process is reported as an
     anomaly on at least one always-read surface, not only on aida ps.
  2. The report distinguishes the three causes it can distinguish from substrate alone:
     no lease record at all, a lease whose process has exited, and a lease held by a
     live process. Absent evidence is labelled absent, never folded into "stale"
     (PRIN-5).
  3. A test drives the no-lease and exited-process cases through the reporting path and
     asserts the anomaly is emitted; asserting only that aida ps prints something does
     not satisfy this.
