title: aida drain start passes mutually exclusive auto-complete and drain flags
description: 'Reproduction from qci on 2026-10-01: run ''aida drain start --role implementer --vendor codex --no-human both --max-failures 2 --max-runtime 6h''. The wrapper prints that it expands to ''aida queue work --auto-complete --drain ...'' and exits code 2 because --auto-complete and --drain are mutually exclusive. Expected: aida drain start launches the canonical queue-wide drain successfully, using only the supported drain-mode flag set. Acceptance: the wrapper command starts a live drain; its generated command contains no mutually exclusive flags; add a regression test for the exact invocation.'
