  content: '[aida:advisor] EXPLICIT, at the reviewer''s flag-back, so an implementer cannot read it otherwise: the ratchet work in criterion 1 is NOT optional once the three tests go green. If BUG-1233 and BUG-1283 turn out to be regressions of the same sites (criterion 4), then a green scheduled nightly is necessary but NOT sufficient to close this spec — a site that has now regressed twice is evidence that point fixes do not hold there, and the only thing that changes the outcome is the rule that would have caught it at PR time. Do not close on three green tests plus one green nightly while the ratchet rules are unwritten; that is precisely the state this spec exists to end, and it is how BUG-1233 and BUG-1283 were both closed before.'
