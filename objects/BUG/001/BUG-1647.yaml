- id: 01a0dd8b-f1de-7d80-b519-fe13e83e7ce8
  author: joe
  content: 'Review (fresh strict Opus reviewer): APPROVE WITH NITS on ff730227e7 (origin/claude/bug-1647). Verified: dismiss writes via update_spec_atomically and judges the lock-held copy (already Rejected = no-op with no write, because a closure that changes nothing skips the write in git_backend update_spec_atomically_with_subject; Completed/Superseded refused; deleted = clean error). Approved write refuses terminal statuses. transition_to_completed_atomically: already Completed means prepare is not run and nothing is written or emitted; Rejected/Superseded refused; ship record only on Completed, after the lock is released. Its only production caller is findings_promote_auto_complete_write, and the handler reports ''already Completed'' and returns before record_role_activity. Authorship: every status write goes through record_caller_status_transition (caller-authored, BUG-1637 invariant kept), and the audit comment helper keeps the author and session_id. Lock ordering: the git queue ops take no store lock, and the undo runs after update_spec_atomically has returned, so locks never nest and there is no deadlock. The race seam is cfg(test)-only. --json gating of the Refused line is fixed and restore lines use Display. Tests pass: bug_1647 14, bug_1638 13, findings 144, auto_complete 279, story_1418 13, completion 29. fmt clean, no clippy hits on the changed lines. Mutations: (1) dropping the dismiss terminal check fails 2 bug_1647 tests; (2) skipping the queue undo fails 4. Both reverted, tree clean. NITS (non-blocking, follow-up OK): (1) Low, lib.rs findings_promote_to_work undo (~706-710): the undo is not compare-and-swap. Restoring a prior entry uses queue_add, which upserts by requirement_id, so a concurrent ''aida queue remove/done'' of that entry during the window is brought back, and the role-scoped remove drops a concurrent same-role re-add. Git queue writes also take no lock (pre-existing, git_backend.rs queue_add ~1674 and queue_remove_for_role ~1727). Fix: re-read before undoing and act only if the current entry for req.id is still the one this call added (match note, added_at and for_role); otherwise leave it and say so. (2) Nit, lib.rs ~712: ''withdrawn, so nothing was changed'' after two ''update queue'' store commits, and possibly a new empty queue file. Prefer ''its queue entry was withdrawn; the finding is unchanged''. (3) Nit: ''byte-for-byte'' restore is not exact for a legacy entry stored with position i64::MAX, because queue_add re-resolves that to max+1000. Document this, or restore without the sentinel resolution. (4) Nit tests: nothing pins the --json gating of the phase-1 Refused line. (5) Info/follow-up: the Approved write still reopens non-terminal InProgress/Done findings to Approved, and a re-promote of an Approved finding appends another reason comment. History is safe, because record_status_transition no-ops on the same status. Out of scope here.'
