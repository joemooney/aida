title: aida findings dismiss writes the spec with unlocked update_requirement (promote was moved to update_spec_atomically in BUG-1638)
description: 'Found while implementing BUG-1638: findings promote now writes through update_spec_atomically, but findings dismiss still uses the old unlocked update_requirement read-modify-write. A concurrent edit made between the read and the write can be clobbered. Fix: route dismiss through update_spec_atomically, add a race-seam test like bug_1638_race_seam_tests, and make dismissing a finding that was deleted in the meantime fail cleanly.'
