  content: 'PROXY DECISION (orchestrator for Joe): scope expanded with the BUG-1638 strict-review low findings, all in findings promote (lib.rs ~595-622, completion.rs). Acceptance adds: (1) plain promote: if the status write fails after the queue entry was added, remove the entry or report it truthfully, never say ''nothing was changed''. (2) Approved write re-checks status under the lock and refuses when it is terminal (''is now X''). (3) Auto-complete re-promote of an already-Completed spec adds no duplicate comment or history and reports ''already Completed''; refuse on Rejected or Superseded. (4) A committed test pins exactly one ship record per real completion through transition_to_completed_atomically. (5) The --json Refused-line and status-formatting nit at lib.rs ~94160.'
