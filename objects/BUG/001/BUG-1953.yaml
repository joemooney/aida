title: aida pr ship <N> step 5 matches the lease on the cwd branch instead of the PR head branch, so shipping by number from main leaves the lease, worktree and mcp-claim behind
description: |
  Problem: `aida pr ship <N>` step 5 (EndLease) looks up the lease by the CWD branch, not by the shipped PR's head branch. pr_cmd.rs:1777 sets `branch = current_git_branch(&project_root)`; :1943 derives `ship_branch` from the PR (BUG-733, used for the delete/stacked logic); but :2961 still does `list_leases(&main_worktree).find(|l| l.branch == branch)` (and :3035 in the "no lease" message).

  Failure scenario: an integrator runs `aida pr ship 42` from the main checkout (branch `main`) for a PR whose head is `task-123-work` with a live lease. Step 5 reports "no AIDA lease for branch main — nothing to clean up". The lease, the worktree and the mcp-claim for the shipped spec survive the merge. `run_session_reap` only rescues them later if the implementer process has already exited and the auto-bump landed; otherwise `aida ps` keeps showing the spec as live work on a merged branch (see BUG-1941 and STORY-1653 for what that costs the operator).

  Evidence path: pr_cmd.rs:1777, :1943, :2961, :3035. No test covers step 5 with an explicit PR number from a branch other than the PR head.

  Acceptance:
  - Step 5 matches the lease on `ship_branch` (falling back to `branch` only when no PR branch was resolved) and the "no lease" message names `ship_branch`.
  - A test ships a PR by number from `main` with a lease on the PR head branch and asserts the lease is ended (or the BUG-61 inside-worktree skip is reported, not "nothing to clean up").

  Found by the night-fable review sweep of pr_ship post-merge cleanup. Related: BUG-733 (fixed the delete/stacked logic but not step 5). Size S.
