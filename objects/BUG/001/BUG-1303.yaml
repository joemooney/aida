id: 01a0bc31-6859-7971-b588-a2814b48e2b2
spec_id: BUG-1303
agreed_id: BUG-1303
title: 'A try-lock contention contract is not honoured: contended or interrupted locks surface as hard failures, deterministically on Windows and as a parallel-load flake on Linux'
description: |-
  Every try-lock in this workspace detects contention by comparing the error kind to ErrorKind::WouldBlock. That comparison is false on Windows, so a lock held by another process is reported as a hard failure instead of as contention. Three sites, one root cause, and the fix is a helper the dependency already provides.

  ROOT CAUSE, verified in source rather than inferred from the red build. fs2's try_lock returns the platform's raw contention error. On Unix that maps to ErrorKind::WouldBlock. On Windows the OS returns error 33, ERROR_LOCK_VIOLATION, which Rust does not map to WouldBlock, so every guard of this shape falls through to the error arm:

    aida-cli-lib/src/maintenance_schedule.rs:1656-1660   try_tick_lock
        Err(err) if err.kind() == ErrorKind::WouldBlock => Ok(None)
        Err(err) => Err(err.into())                      <- Windows takes this arm

    aida-core/src/storage.rs:336-345                     exclusive lock, retry loop
    aida-core/src/storage.rs:373-385                     shared lock, retry loop

  CONSEQUENCES DIFFER BY SITE, and none of them is test-only.

  maintenance_schedule: the contract is that Ok(None) means another tick already holds the lock, so skip quietly. On Windows that case is an Err instead, so two overlapping maintenance ticks produce a hard error rather than a graceful skip. This is the machinery STORY-1218 wants for the BUG-1291 backstop, so an unattended recovery path that works on Linux would not work on Windows.

  storage.rs, both sites: the WouldBlock arm is what implements the five-second wait-and-retry. On Windows that arm is never taken, so the retry loop never retries. The lock does not wait at all; it fails on first contention. The behaviour the loop exists to provide is entirely absent, and the surrounding code reads as though it is present.

  OBSERVED 2026-09-19 in cross-platform run 35477353903, Windows only, ubuntu and macos green:

    maintenance_schedule::tests::tick_lock_is_nonblocking_and_reusable ... FAILED
    panicked at aida-cli-lib\src\maintenance_schedule.rs:1977:43
    called Result::unwrap() on an Err value: The process cannot access the file
    because another process has locked a portion of the file. (os error 33)

  Line 1977 is the second try_tick_lock, the one asserting the already-held case returns Ok(None). It returns Err. The test is correct and the code is wrong; this is a genuine platform defect surfaced by a test, not a test artifact.

  THE FIX EXISTS IN THE DEPENDENCY. fs2 ships lock_contended_error() at fs2-0.4.3/src/lib.rs:125 precisely so callers need not know each platform's code. Compare against its raw_os_error in addition to the WouldBlock kind, at all three sites, through one shared helper rather than three copies of the same condition.

  ACCEPTANCE
  1. A single helper decides "is this error contention", used by all three sites. No site repeats the comparison inline.
  2. The helper treats both ErrorKind::WouldBlock and fs2::lock_contended_error()'s raw OS error as contention, so it is correct on Unix and Windows without cfg branching.
  3. maintenance_schedule's try_tick_lock returns Ok(None) for a lock held elsewhere on every platform. tick_lock_is_nonblocking_and_reusable passes on Windows, unchanged; do not weaken the test.
  4. Both storage.rs loops actually retry on contention, so the five-second wait exists on Windows rather than only appearing to.
  5. A test covers the helper directly against a synthesised raw OS error 33, so the Windows path is proven on Linux CI and does not depend on the nightly to catch a regression.
  6. A grep finds no remaining comparison of a lock error against WouldBlock outside the helper.

  WITHDRAWN: THE conflict.txt REPORT WAS A FALSE ALARM, and this is recorded rather than deleted because the near-miss is instructive.

  This spec briefly carried a criterion 7 about a test leaving conflict.txt behind and a later test's merge tripping over it. That was reported in good faith from the Windows log, where the line does appear twice:

    error: The following untracked working tree files would be overwritten by merge: conflict.txt

  It is intentional. aida-cli-lib/src/tests/handle_pull_command_tests.rs:235-242 deliberately writes an untracked conflict.txt so that git pull --ff-only aborts, because the abort is the behaviour under test. The comment above it says so. The git error text is expected output captured in the log, and the test passes: both Windows runs read 5009 passed, 1 failed, and the single failure is the lock test.

  So there is no hygiene defect, nothing is ordering-dependent, and a criterion telling an implementer to stop that test leaving files behind would have sent them to break a correct test to silence a log line that is supposed to be there. Removed before anyone picked it up.

  Worth keeping visible: the report was plausible, came with a mechanism, and was wrong. Reading the log is not the same as reading the test.

  THIS SHAPE IS LINTABLE AND SHOULD JOIN THE RATCHET. A try_lock result compared against ErrorKind::WouldBlock with no raw-OS-error fallback is a greppable pattern, not a semantic judgement. It belongs in BUG-1283's rule widening once BUG-1301 makes the ratchet extensible. Fix the three sites here; add the rule there so the fourth site cannot be written.

  Found by the advisor at the gate while reading cross-platform run 35477353903; all three call sites and the fs2 helper read directly before filing.

  SCOPE WIDENED 2026-09-19 — THIS IS PROBABLY NOT WINDOWS-ONLY, AND MY ORIGINAL FRAMING WOULD HAVE INVITED THE WRONG FIX.

  A second sighting, on LINUX, reported unprompted by an implementer during a full-suite run:

    maintenance_schedule::tests::tick_lock_is_nonblocking_and_reusable
    failed once under full-suite parallelism, passed standalone, passed on a clean rerun

  My original explanation was a platform-semantics difference: Windows returns raw error 33 for a contended lock, Rust does not map it to ErrorKind::WouldBlock, so the guard never matches and contention becomes a hard error. That explanation predicts the test can NEVER fail on Linux, because there fs2 contention does map to WouldBlock. It failed on Linux. So the explanation is at best incomplete.

  TWO HYPOTHESES, AND THEY CONVERGE ON THE SAME DEFECT.

  (a) The lock genuinely blocks where the test asserts it does not, and Windows merely makes deterministic what Linux makes a load-dependent race.

  (b) Under heavy parallelism the failing call returns an error that is neither success nor WouldBlock — EINTR, or a file-descriptor exhaustion such as EMFILE/ENFILE, both plausible during a full-suite run. Those take the identical catch-all arm as Windows error 33.

  Either way the defect is the same and it is broader than "Windows": THE ERROR CLASSIFICATION IS TOO NARROW, so the contract that Ok(None) means "held elsewhere, skip quietly" is not honoured for several error kinds on more than one platform.

  WHY THE FRAMING CHANGE MATTERS FOR THE FIX. A Windows-semantics framing invites a cfg-guarded or platform-specific remedy, which would leave (a) and (b) unfixed on the primary platform. A too-narrow-classification framing does not. Comparing against fs2::lock_contended_error()'s raw OS error remains necessary and is no longer sufficient on its own.

  AND THE LINUX SIGHTING IS THE MORE DANGEROUS OF THE TWO. A test that fails reliably on a secondary platform gets investigated. A test that flakes under parallel load on the primary one gets re-run until green and written off as flakiness, which is approximately what happened until someone reported it rather than re-running.

  ADDITIONAL ACCEPTANCE
  7. The fix is not gated behind any cfg(windows) or platform conditional. The contention contract must hold identically on every platform.
  8. Establish which hypothesis holds before choosing the remedy. If the lock genuinely blocks, that is a defect in the lock and the test is right. If the failing call returns an unclassified error such as EINTR or descriptor exhaustion, the helper must classify retryable and contended cases distinctly from genuine failures. Say which was found; do not fix both speculatively.
  9. Reproduce before fixing. Run that test under parallel load enough times to see it fail, since a fix that cannot be shown to close an observed failure is a guess. If it cannot be reproduced, say so and record the attempt rather than declaring it fixed.
  10. Do NOT weaken or serialise the test to make it pass. It asserts a real property. A test that flakes is evidence about the code, not a problem with the test.

  Second sighting reported by an implementer on BUG-1299's lane; first sighting was the Windows nightly recorded above. Two independent platforms is why the scope moved.
