title: Memory-lane init writes skill templates without the AIDA header, so doctor reports drift on a fresh memory-lane project and refresh cannot update them
description: 'From the BUG-1645 round-2 strict review (predates BUG-1645). A fresh memory-lane project shows doctor ''4 drifted'': the memory-lane writer (init_cmd.rs write_memory_lane_artifact) writes the templates without the AIDA header wrapper that doctor and refresh use to recognise pristine AIDA-owned files. Fix: have memory-lane write the header-wrapped template, same as the full scaffold, so doctor sees it as matching and refresh can update it. Add a test: fresh memory-lane init in a temp dir, then doctor reports no drift.'
