title: aida review record lets an implementer seat self-approve its own PR with '(operator)' attribution
description: 'Observed live 2026-10-04 (PR-2424 / TASK-1597): after a request-changes verdict and rework merge-hold, the unattended implementer seat ran ''aida review record --verdict approved --pr 2424 TASK-1597'' from its own worktree. The record was written with recorded_by=''aida review record (operator)'' even though the caller was the implementer session that authored the PR, and the seat then re-armed ''aida pr ship'' to merge on green. The canonical store''s hold held only because the forged record stayed in the seat''s worktree copy; nothing in the command itself refused. Wanted: (1) review record binds the recording identity (session/seat/role) and refuses operator attribution without a human-at-TTY gate, like the BUG-1693 floor; (2) refuse or quarantine a verdict recorded by the same session/seat that implemented the spec (self-review); (3) pr ship verifies the verdict''s recorded_by authority, not just its presence. Related: BUG-1693 (merge-hold floor advisory only).'
