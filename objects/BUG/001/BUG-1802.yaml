- id: 01a11966-fa04-7bd1-860e-02dc758abfc3
  author: codex-sketch-revision
  content: |
    SKETCH (awaiting advisor signoff): BUG-1802 — revision 2, retained actors and complete work coverage

    Author: separate sketch-revision author, 2026-10-07 America/Phoenix. NOT signoff, implementation authorization, or a review verdict. Final authority-changing merge belongs only to the operator. Root must assign a DIFFERENT independent advisor after this revision.

    Baseline and binding provenance

    Source baseline is main 199e591b07aa76a59cd34f0a41946f918501f6ba. Read the full BUG-1802 UUID 01a10a4c-889f-75cf-9f4f-a7c52dfe0bcc and BUG-1808 specs/comments through /home/joe/ai/aida/target/agent/aida; both remain Approved. The v1 comments match the original handoff files exactly; both posted CHANGES REQUESTED comments match INDEPENDENT_SKETCH_SIGNOFF.md. BUG-1802's binding review comment is 01a11953-7936-7782-a03e-d9ec75676654. Keep that file, both v1 files, SKETCH_AUTHOR_READY.md, and the old bug-1802-review-independence branch untouched. TASK-1599 and PR-2426's erroneous completion are not enforcement evidence.

    All reviewer answers A–E are adopted. Reviewer/advisor grant or authenticated direct-human TTY only; exclude the author and author-descended reviewers; independent siblings under a nonimplementing driver are valid. Unknown implementation provenance refuses even with a fresh review. Explicit revocation, including role end, invalidates consumption for unmerged work; natural expiry/process exit does not erase record-time authority. Preserve closed history. No attribution-repair override, authority expansion, protected broker, or operator fork is proposed.

    Concrete storage choice (proposed additive fields, not baseline capabilities)

    Use existing per-session manifests and existing grants as the retained evidence; existing verdict JSON rounds reference them. No global commit/provenance ledger and no new requirement format. All UUIDs below are actual UUIDs, all SHAs full object IDs. Display spec IDs, branch names and role strings are diagnostic, never identity.

    1. seat_authority.rs::SeatGrant keeps its existing id, session_id, subject, principal, seat, parent_grant_id, issued_at, expires_at, revoked_at and delegable_seats. Give existing session_id the stable actor meaning: it is preserved across role reissue and vendor resume for the SAME conversation/shell actor; a genuinely new child receives a new session_id. Add predecessor_grant_id: Option<UUID> to preserve a reissue edge, issued_roster_store_sha (the retained canonical store commit whose registry/team.toml authorized issuance), and binding: Option<{repo_key, manifest_id}>. The binding points to the retained manifest, not a second scope store. Historical grants remain at the existing session-grants/<id>.json path; do not garbage-collect grants referenced by manifests, verdicts, or their ancestry. Mutating revoked_at remains supported; identity/lineage fields become immutable. Reissue never erases a prior revocation or renews its historical approval. Old grants without these joins cannot record an authenticated approval.

    2. session_manifest.rs::SessionManifest adds one optional versioned evidence block:
       schema=1; repo_key; actor_session_id; grant_ids[]; predecessor_manifest_ids[]; process_bindings[{pid,start_identity,native_session_id?,registry_id?}]; commits[{sha,parents[],tree,assignment_id,grant_id,contributor_manifest_ids[],source_commit_shas[],observed_at}]; coverage_gap: Option<{reason,first_observed_head}>; ended_at?.
       The same manifest has ONE canonical launch_assignments[] array shared with BUG-1808: each item holds assignment_id, repo_key, spec_uuids[], selected_seat, actor_session_id, grant_id, parent_grant_id, predecessor_assignment_id?, native_session_id?, branch, worktree, kind, run_token?, member_uuid?, phase?, phase_attempt_uuid?, issuer_pid/start_identity, consumer_pid/start_identity?, state, publication_id. BUG-1802 adds lineage_manifest_id, base_sha, entry_head, entry_tree, entry_clean to each item. These are not duplicated in the evidence block; commit witnesses reference assignment_id. Standalone/no-orchestrator items omit token/member/phase.
       repo_key is the canonical real git-common-dir path paired with the resolved canonical store root; resolve both through git/store discovery, compare both, and refuse ambiguity or a moved repository until evidence is resolved through a separately reviewed procedure. An origin URL or AIDA_DRIVE_ROOT alone is not a repo key. manifest_id is the existing session_id filename key (lease ID when a lease exists), distinct from actor_session_id = SeatGrant.session_id. A manifest can hold multiple scoped assignments/commits for a cluster. lineage_manifest_id is the first manifest for that unclosed spec work episode; it is NOT reminted by branch renaming, rework, new lease or a new reviewer. predecessor edges preserve all imported work episodes. base_sha is the immutable accepted-default-branch anchor at episode admission; it is not advanced merely because a new session starts.
       Retain these manifests IN PLACE under canonical main-root .aida/sessions/<id>.manifest.toml. End/prune may delete live leases and activity, but not the evidence-bearing manifest. A retained ended manifest does not claim work: active-plan/lease views must exclude it from active ownership while evidence readers read it strictly. Do not use list_all's current skip-parse-errors behavior for authority. Explicit UUID references plus full-directory strict discovery for a target detect corrupt/orphaned records; an unreadable potentially relevant record is a coverage error, not zero contributors.

    3. agent_registry.rs::AgentRegistryEntry adds grant_id and process_start_identity. Keep existing id, native_session_id, resumed_from, pid, worktree_path and ended_at. These are live lookup pointers into retained grant/manifest evidence, not permanent authorship proof themselves. register_spawned_agent/register_existing_agent/register_role_enter_agent persist the join before exposing a managed process as ready. Registry GC can remove its row only after the corresponding process/native-session binding and end state are retained in the manifest. A registry error does not silently mint a new actor. A native session or validated process ancestry resolving to an old actor must resume that actor, including when AIDA_AGENT_NAME/TYPE/GRANT are missing. PID alone is never a durable key.

    4. lib.rs::OrchestratedLeaseReceipt adds evidence_manifest_id (and uses the BUG-1808 assignment reference when present). Existing lease_id, claude_session_id, branch and worktree_path stay. write_orchestrated_lease_receipt/publish_orchestrated_lease_receipt_from_env require the saved manifest/grant join, then publish the pointer. prepare_orchestrated_lease_receipt and RealPhaseDriver::recover_lost_child_state may clear a transient handshake/refusal file, never retained evidence. Receipts are discovery hints: deleting one cannot remove an implementation actor.

    5. review_verdict.rs::RecordedVerdict/build_verdict_object add a fresh authority envelope per round:
       version=1; round_id; parent_round_id; repo_key; spec_uuids[]; forge_project; pr; base_sha; reviewed_sha; implementation[{lineage_manifest_id,manifest_id,manifest_evidence_digest,commit_shas[]}]; reviewer={kind,actor_session_id,grant_id?,manifest_id,ancestor_grant_ids[],record_time_roster_store_sha,record_time_roster_digest}; recorded_at; transport={kind,session_id?}; policy=1.
       Direct-human kind additionally records explicit target/head/independence confirmation and the human principal. Envelope fields are not accepted from arbitrary caller JSON as proof. The canonical recorder computes them from validated retained records. Grant secrets are not duplicated. Evidence digest covers immutable assignment/commit facts used for THIS head, not later mutable manifest bookkeeping. Later commits can append evidence without invalidating an earlier head's digest. A new round explicitly clears/replaces authority; build_verdict_object must not inherit it from previous arbitrary fields.

    Identity/ancestry validation and retention ownership

    The proposed typed resolver returns Granted, DirectHuman, Missing, Invalid(reason), never the current current_grant(None) ambiguity. Starting from the actual grant handle, validate subject and the process/native-session join, immutable IDs and repo binding. Walk every parent_grant_id AND predecessor_grant_id to roots with a visited set and strict missing/corrupt/cycle refusal. At recording, validate current expiry/revocation and roster ceilings for the active delegation ancestry; prove each historical delegation edge was valid at issuance from retained grant timestamps and registry/team.toml at issued_roster_store_sha. Pin referenced store commits against local GC; absence of the historical roster object refuses rather than using today's roster as proof. Reissued actor identity is inherited through predecessor evidence; reissue does not confer the predecessor's delegable seats. A historical expired predecessor can establish actor identity, not current authority. The actual current grant must authorize reviewer/advisor.

    Compare the reviewer's stable actor and every validated ancestor actor against the COMPLETE implementation contributor set for the target. Common principal and a nonimplementing common driver do not collide; implementing actor anywhere in the reviewer ancestry does. Compare direct-human identities only against direct-human contributor identities as well as any managed actor they actually resumed: a shared Unix account hosting independent agent children is not automatically self-review.

    seat_authority::{issue_direct,issue_child,write_grant,revoke_current}, role_cmd::{handle_role_enter,handle_role_end}, session_manifest::{save,load}, and the launch producers below own retention. issue_direct must consult existing parent-shell PID/start, registry and native conversation joins before minting a session identity. A new role in the same process/native conversation preserves the actor. If positive managed evidence exists, require_direct_human plus a PTY cannot provide an operator fallback. A genuinely direct human uses require_direct_human, stdin+stderr TTY, known principal, explicit target/head confirmation and a retained human manifest. A missing/invalid supplied grant is an error, not human detection. Supported local workflows are the boundary; no claim of resisting a user who edits local evidence or secretly copies another person's patch.

    How ALL later commits become covered

    An initial head is insufficient. Add one proposed commit-observation helper reached by commit.rs::run_git_commit and the scaffolded git post-commit hook via internal_cmd::handle_internal_command. Extend the existing hook in aida-core/templates/hooks/aida-post-commit.sh independently of its best-effort field-study/no-verify detector; attribution must not be behind AIDA_FIELD_STUDY or the sentinel's early return. A failed post-commit observation leaves the already-created commit UNVERIFIED; gate validation, not hook exit status, enforces coverage. aida commit invokes the same idempotent helper so an absent hook does not lose normal CLI attribution.

    Before writable implementation attachment, resolve the retained work episode, inspect exact head/index/worktree, save the new actor assignment and all predecessors before allowing work. A fresh episode can begin only at a clean accepted default-branch anchor with no earlier open implementation evidence for the spec. Existing unclosed work, rework, a legacy branch, dirty entry or imported unknown commits cannot be baptized as a fresh episode. A gap is sticky through subsequent sessions in that episode and cannot be cleared by a fresh reviewer or role reissue. Existing supported requirement history, leases/manifests, traced commits and PR linkage are discovery evidence of prior work; they are not authentication. Conflicting or incomplete discovery refuses, including an old implemented/open spec with no retained manifest. The approved-but-never-worked, clean new-spec case is distinguishable from missing evidence of an existing episode; unknown is never inferred empty.

    At each commit observation: resolve the actual actor/process and granted scoped assignment; read HEAD^{commit}, its parents and tree; check repo/branch/worktree and index state against the assignment; collect every retained writable participant in this episode (including participants who left dirty work and never committed). Append that immutable commit witness to that actor's existing manifest under the episode lock. Multiple legitimate writers are conservatively all contributors, not reduced to the last committer. A reviewer starts in a separate clean review snapshot; if it commits a fix, it becomes an implementation contributor and can no longer approve this work. A role string does not decide whether a commit is implementation. A human contributor uses the explicit human recording path; email or an [AI:...] trailer cannot create identity.

    For review at head H, resolve the immutable episode anchor B and enumerate the complete git DAG reachable from H but not B (including side parents, not first-parent-only). Every new commit must have a matching retained witness with exact SHA/parents/tree and valid assignment/actor references. Union ALL relevant manifest assignments and witness contributors for every linked spec/episode; conservatively cover the entire PR delta, not just traced lines. Validate there is no unknown ancestry, dirty handoff gap or unexplained worktree transition. Missing one commit refuses with its SHA and evidence gap. Commits already in the accepted base need not acquire retroactive authorship. A launch head, git author email, commit time, spec trailer, latest lease, zero current leases or successful test run cannot fill a gap.

    Rebase/amend/cherry-pick cannot discard contributors. Add the same helper to a scaffolded post-rewrite callback (new hook integration); retain the old witnesses and map old->new commits only with the actual git rewrite mapping, verified objects/parents and the transforming actor. Conservatively union all source actors and the transformer. For cherry-pick/merge/import, capture source SHAs from git operation state at the pre-commit boundary and verify their retained coverage; retain that source reference in the new commit witness. An unknown source, missing rewrite callback, unsupported squash mapping or raw imported uninstrumented history remains a gap. Do not implement a patch-id/email/time heuristic or accept a caller-supplied list as authenticated provenance. AIDA's supported rebase helpers must invoke this capture explicitly when hooks are not executed. Already-merged squash commits remain closed historical base; this is not retroactive re-review.

    This is the smallest unavoidable extra coverage scope: retained per-session commit witnesses and git commit/rewrite integration. Existing commits/session manifests are reused; a broad global authorship ledger would still not prove unobserved contributions. An implementation that only adds launch fields fails this sketch. Missing legacy identity can leave an existing open PR unshippable through the authenticated path; that is the binding conservative verdict, not permission for a repair override.

    Producer/consumer sequences

    - Interactive queue pickup: queue_cmd::handle_queue_command / handle_queue_work resolves canonical target -> BUG-1808 staged scoped issuance -> session_start + write_queue_work_manifest save actor/episode before writable child release -> interactive spawn installs that exact grant -> commit helper extends coverage -> session_end retains manifest. No actor derived from shell role.
    - Standalone headless: handle_queue_work is the issuance owner when it is a launcher; exec_vendor_headless consumes the prepared assignment, never runs under inherited driver authority. The same manifest/commit writer is used for every vendor. spawn_vendor_headless_with_seat accepts a prepared grant for a covered queue path rather than minting another actor.
    - Orchestrated implementation: run_auto_complete admission pins spec UUID/member; RealPhaseDriver::run_implementer creates a token/phase/attempt assignment and prepares the grant/manifest using BUG-1808's parent-owned transaction. Queue child validates and consumes it; receipt references that manifest. No use of shared DrainState.current or env flags as identity. RealPhaseDriver::run_reviewer launches a DISTINCT reviewer actor; CI/drain transports are not the reviewer.
    - Direct session: lib.rs::session_start attaches its actual current actor to the existing episode before allowing edits, without pretending a lease UUID equals the grant session UUID. Session creation without a resolvable actor may remain read-only/planning, but it cannot produce trusted implementation coverage. Direct foreground lib.rs::run_tracked_agent and background agent launch at lib.rs:29649 retain the issued grant and manifest before vendor readiness; agent_registry::register_spawned_agent binds the resulting PID/start/native ID. An agent with no role/grant cannot supply authenticated implementation evidence; its commits remain unknown, never empty.
    - Resume: resolve_queue_work_launch/resolve_resumable_ended_agent resolve native conversation -> retained manifest -> stable actor; validate predecessor evidence, carry all old contributors, issue at most one new valid grant from an authorized launcher. spawn_claude_headless_resume consumes the already prepared grant on queue/drain paths. Missing resume evidence refuses; process restart does not mean independence.
    - Rework: handle_queue_rework with --work joins the SAME unclosed episode and previous manifest set before its combined transaction. New implementers accumulate; reopened work starts a successor episode referencing the prior relevant lineage/closure, never erases its authors. Review target scope determines which closed historical episode is relevant; unrelated closed episodes do not poison a new target.
    - Role reissue: handle_role_enter preserves actor session identity using the validated registry/process/native join; predecessor_grant_id links the old grant. handle_role_end's revoke_current is explicit revocation. Subsequent reviewer seating of an implementing actor still refuses. Cleanup: session end/prune, gc_dead_agents/gc_row, lost-child recovery and run removal retain evidence before deleting runtime discovery hints. Failed retention fails cleanup, not independence.

    Canonical publication, candidates and all consumers

    Canonical root: resolve main_worktree_root_from/find_main_worktree_root, git-common-dir and detect_distributed_store_from, then require equality with launch/grant/manifest repo_key and forge project identity. Resolve all display IDs through the store to UUIDs. Resolve PR head/base through the forge and local full commit objects; reread before publication. AIDA_DRIVE_ROOT is only a corroborated pointer. Local/sibling JSON is input evidence, never permission to override the canonical round.

    Use a permanent canonical .aida/review-verdicts/.locks/<forge-project-and-pr-key>.lock and sorted spec-UUID locks for multi-spec rounds. All record/archive/adopt/close writers and authority consumers must use the same lock domain. Lock order with BUG-1808: home authority lock -> repo lifecycle lock -> store write lock if required -> sorted episode/manifest locks -> sorted verdict locks -> existing merge lease acquired last. This requires moving pr_ship's lock acquisition ordering while retaining the under-lease recheck, not nesting authority acquisition after a lease held in the opposite order. Normal mutations never acquire a merge lease. Grant/roster writers honor the authority lock; publication and consumption validate retained facts under it.

    handle_review_record_at sequence: resolve caller/target and read round generation -> acquire locks -> reread target head and all authority/coverage/candidates -> reject invalid caller WITHOUT hold/marker/verdict/event/status writes -> allocate round_id and parent_round_id referencing the actual current canonical generation -> archive current round with full provenance -> atomically publish the canonical current round -> fsync/verify it -> publish derived PR/SPEC handshake and event -> only then perform permitted marker changes. A failure before canonical publication cannot clear anything; a failure afterwards leaves a valid canonical record and conservative blocking markers, reports partial transport, never fabricates approval. Emergency hold placement remains available through its existing separate authority floor.

    Concurrent recorders must submit the parent generation they observed; the second recorder seeing a different current generation refuses/retries a NEW actual review. It cannot overwrite a concurrent refusal because its timestamp is newer. Approval after refusal must explicitly reference that refusal round and satisfy existing findings/corpus closure requirements; valid identity alone does not clear a human merge hold. A stale transport replays by exact round ID idempotently; it never advances ordering. Same-head contradictory unordered rounds block. Histories and per-SHA archives remain readable with original order/closure; no migration rewrite.

    Change pr_ship::merge_gate_verdict_candidates to return a typed candidate set including Absent, Parsed(round,path), Invalid(path,reason), and inaccessible-directory errors. Only NotFound at an expected path with no known prior evidence is absence. Explicit paths, relevant current PR/SPEC keys, head archive paths and referenced rounds must report unreadable/malformed/missing referenced content as Invalid. A malformed object cannot be filtered by .ok().and_then(parse...) into no-review-required. An unclassifiable relevant-path record blocks; an explicitly well-formed closed/unrelated record can be excluded by validated target/closure, not by parse failure. Absent all evidence retains existing no-review-required policy only when no corpus/rework/review obligation exists. Invalid always refuses even if another valid approval exists. Legacy approval remains displayable but untrusted for an unmerged target; a valid later target-scoped canonical round can supersede it under ordered parentage, never rewrite it.

    One proposed classify_approval_authority helper must be called by pr_ship::{approval_head_refusal,open_approvals,approved_match_head}; pr_cmd::{ship_preflight_gates,pr_ship_approval_gate,ship_refusal_release,pr_ship_handler}; merge_hold::{refusal_release,enforce_corpus_gate_before_merge}; lib.rs::{drain_merge_match_head,stamp_pr_review_verdict,read_verdict_file,read_verdict_file_for_head,spec_verdict_fallback_for_phase3,sibling_verdict_sweep_for_phase3}; and review_verdict's corpus/queue-done release decisions. It returns a structured refusal, never bool false that means approval absent. --override-stale-approval cannot override identity/coverage/refusal errors.

    At pr ship preflight validate complete candidate set and exact forge head. After CI, reacquire the stated locks and merge lease, reread forge head, candidate generation, corpus, holds, supervision and retained identities. Explicit reviewer/ancestor revocation or a current explicit roster removal now blocks; natural expiry after a valid record does not. Keep authority/verdict serialization through the exact-head forge merge submission and use the existing match-head protection; if the forge cannot guarantee that head, refuse. A revocation serialized before submission wins; after a successful merge it does not reopen closed work. Do not hold these locks during CI polling.

    reviewer handshake ingestion must verify the canonical round, reviewer assigned actor and current phase/attempt, rather than mtime alone. Direct child JSON without authenticated canonical publication can communicate a refusal/escalation but cannot approve. stamp_pr_review_verdict can append CI transport metadata tied to an existing round ID/head; it cannot set recorded_by to 'aida drain reviewer', mint authority, copy a prior round's authority, or turn an approved payload into a canonical review. Sibling sweep/adopt_direct_write may retain diagnostic artifacts but cannot promote them without canonical recorder validation. CI transport failure preserves the canonical round and blocking evidence.

    Real CLI witnesses required after implementation (not executed here)

    All fixtures use isolated HOME/AIDA_HOME and temporary repos/stores, fake vendor/forge, actual built aida, ready caches, real grants issued by the fixture helper, and actual production phase launch paths. S is a fixture spec and N a fake forge PR, never the live bugs.

    - review_record_implementer_cannot_self_approve_cli: `aida review record S --verdict approved --pr N`; implementing grant, removed env names, forged display role, PTY, and implementing ancestor all refuse with identical verdict/marker/hold/event snapshots. Also exercise reissued actor without grant env but retained process/native evidence.
    - review_record_independent_granted_reviewer_cli: same argv under a distinct reviewer child of a nonimplementing driver passes; run actual queue/drain reviewer launch, not just synthetic JSON. Sibling same Unix principal passes; child of implementing actor fails.
    - review_record_direct_human_tty: actual PTY target/head confirmation passes for a known independent human; managed PTY, non-TTY, invalid supplied grant and human who implemented refuse.
    - review_record_identity_survives_cleanup_and_rework and review_record_reissued_grant_same_actor_refused: actual session end/prune, registry GC, queue rework/resume and role reissue preserve actor set; test two contributors, including one who leaves dirty work without a commit. A later fresh reviewer cannot repair a coverage gap.
    - review_record_covers_later_head_cli: launch at B, make two later commits using both `aida commit` and git hook, review H; omit one witness, import an unknown side-parent, skip hook, rebase/amend/cherry-pick, move head during record, and replace current lease. Every gap refuses; fully retained rewrite union passes. A clean fresh session on a legacy diff does not launder it.
    - ship_rejects_untrusted_review_provenance_entrypoint and ship_malformed_approval_is_not_no_review: `aida pr ship N --wait 1`; corrupt current/archives, inaccessible canonical dir, missing referenced manifest/grant, local/canonical conflict, forged operator, wrong UUID/repo/head, and explicit malformed approval cannot reach fake forge merge. Separate truly absent, no-review-obligation fixture preserves existing behavior.
    - drain_review_transport_cannot_authenticate_child_json: `aida queue work S --auto-complete --no-human=both --vendor claude` in the hermetic production driver; fake reviewer writes unsigned approved JSON, parent stamps CI, sibling sweep sees it. No merge/rework-release; authenticated canonical sibling reviewer round succeeds. Run --from-pr variant too.
    - review_record_concurrent_rounds_preserve_refusal: barriers before publication; refusal wins generation CAS and stale approval cannot erase it. Inject canonical write failure and confirm markers remain. Exercise retained archive rather than only current file.
    - ship_rechecks_provenance_under_merge_lease and ship_revoked_review_refuses_but_expired_review_retains_record_time_authority: barrier after preflight/CI and under lease; revoke reviewer/ancestor, move head, change corpus, expire grant or exit process. Revocation/head movement blocks; natural expiry retains record-time authority. Exercise actual refusal_release and corpus gates; hold clearance remains separately human-gated.
    - review_provenance_roundtrip_and_legacy_policy: preserve a closed legacy fixture byte-for-byte, including refusal/findings/closure/archive; no reopened status and no rewritten history. A new relevant round supersedes only its explicit target predecessor.

    Retain/extend existing review_verdict_tests, read_verdict_file_tests, bug_775_commits_ahead_tests and bug_1774_corpus_merge_gate_tests, but parser tests alone are insufficient. No tests, implementation, grants, queue/status/hold changes, commits or merges were performed by this author. The revision answers review blockers 1 (records/producers/coverage) and 2 (canonical typed candidates/publication/all consumers); the independent advisor must judge the design, not infer signoff from this mapping.
