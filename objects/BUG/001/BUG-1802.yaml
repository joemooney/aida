  content: |
    ADVISOR SIGNOFF: APPROVED FOR CALLBACK ADDENDUM ONLY — BUG-1802 v5

    Reviewer: Codex authority-sketch-v5-reviewer, native thread 01a119a8-8505-7b01-9005-9cc0d23dd138, observed from this session environment. NEW Joe-assigned independent advisor; neither any sketch author nor any earlier reviewer. AIDA_SESSION_ID absent; role current --check returned advisor. No authenticated code-review grant asserted. Pinned source baseline 199e591b07aa76a59cd34f0a41946f918501f6ba; current main 5d4180e5ded8a55ad1b02beac5571c190d3da0ac is the legitimate BUG-1806 wrapper advance. Shared publication/hook source checked unchanged. No production implementation of these designs exists at the reviewed baseline; no test pass claimed.

    Reviewed canonical v5 comment 01a119a4-6e70-7053-aceb-b512c1d6022a, exactly byte-equal to BUG-1802-sketch-v5-addendum.md, SHA256 f4b25f41ac05eac665ccb2a3760676cc2b4cc6ebed0643314b2ada9f26cd98a1, including final newline. Full review, source references, exact pins and limits: .aida/handoff/orchestrator/INDEPENDENT_SKETCH_V5_SIGNOFF.md.

    V4 F1 is resolved at design level AS AMENDED below. Closed configuration/attributes/environment/runtime and a finite typed command/child graph exclude arbitrary callback producers from the capability-bearing domain. Genuine hook/client execution outside that domain remains unauthenticated even with copied credentials. Input origin is therefore inferred only within that closed graph and joined to the parent-owned slot/step/attempt; it is never established by ancestry alone. This is approval of the later consumer contract only. Accepted advancing-default coverage is preserved without redesign; unknown original/transforming/dirty contributors and missing callbacks remain blocking.

    Binding callback conditions (advisor amendments prevail over conflicting author sentences):

    1. The origin proof is the CLOSED sealed execution domain, never capability/PID/ancestry/executable alone. Materialize independently owned snapshots of config, expanded includes, attributes, runtime/loader/libraries and fixed hook/client bytes before release; hash the bytes actually mounted/executed and freeze them in the private read-only root. A read-only bind mount of a still-mutable original inode is not a snapshot. No writable alias, inherited directory FD, host-root/proc escape or interpreter input may reopen an executable/config source. Writable repo/object/index/message files are data, never scripts. Fixed-slot wrappers forward original Git arguments/stdin without eval/source/general CLI dispatch. A copied live capability outside the registered domain fails admission; any arbitrary helper executing inside it fails the boundary, irrespective of later FINAL refusal.
    2. Correct the Git 2.43 child profile narrowly: ordinary merge-backend rebase with rewrite entries still invokes the pinned builtin `git notes copy --for-rewrite=rebase`. Admit ONLY that exact internal no-op edge, with sealed `notes.rewrite.rebase=false`, no rewrite refs or GIT_NOTES_* injection; it receives no callback slot and produces no observation/ref effect. Required note-rewrite behavior is an explicit pre-write unsupported variant, never silently removed. Set `maintenance.auto=false` explicitly. For prepared conflict-continuation messages, pin the generated `GIT_EDITOR=:` value: this Git implementation handles it without spawning an editor. Original requested message editing still happens in credential-free preparation. No inherited editor value is allowed. The sequencer's own internal `commit -n` does not authorize caller --no-verify or omission of gates: each resulting commit still needs the full parent GateReceipt and actual applicable callback schedule. These are bounded source-grounded profile corrections, not a general trusted-descendant exception.
    3. External filters/editors/formatter/skill-sync/network/submodule preparation has no callback/grant authority or writable live roots and is quiescent before callback credentials exist. Import exact bytes/modes/index/message/objects plus complete declared effects. Preserve ordinary unsigned commit, builtin rebase/conflict/continue, dirty auto-stash, clean exact-OID submodules and generic code/team/store positives. Signing/custom drivers/executable custom hook config and unknown OS/build/backend profiles may only produce named before-write refusals. Any newly discovered required positive lacking an adapter remains a blocker, never counted as passed compatibility. Production hook bundle means the new production wrappers PLUS extracted real preparation/gates, not test-only stubs or all hooks disabled.
    4. Retain actual prepare-commit-msg source/idempotence rules, resolved store snapshot and FINAL cleaned message/tree/parents in GateReceipt; all formatter/restaging effects, glyph/integrity gates and actual make/cargo skill-sync outputs/applicability/warnings. Pre-push/mirror stays outside the local guard after FINAL. Match actual callback kind and original input, complete tuples/maps and bind-once phases; parent-derived objects are not invented Git stdin. Only parent can FINAL. Keep Git-version/files/SHA-1 phase semantics, zero-old ambiguity, explicit CAS, symbolic HEAD/admin journaling and rejection-without-aborted handling.
    5. COMMIT/write set is immutable; later bounded attempt/callback/install/activation observations append only in preauthorized namespaces, and final receipt binds both. Pump performs no home/repo/episode/Git-lock acquisition or general discovery. The single inclusive finite budget covers connect/partial I/O/decode/drain/fsync/termination/shutdown. Recovery holds home, proves old-domain OS-handle/containment quiescence without assuming waitpid parenthood, then uses fresh domain/credentials. Failure remains blocked recovery. SERVICE already-installed verification cannot fill a missing authentic WORK committed/rewrite observation or clear a gap. No release of home over provisional state.
    6. Preserve actual v4 refinements 1–6 and all earlier A–E, strict refusal/current-locked history/peer preservation/permanent-sidecar/bootstrap obligations. BUG-1808 owns generic publication/assignment/receipts/callback substrate FIRST with no BUG-1802 contributor/W/START prerequisite. BUG-1802 consumes later. Preserve B, pinned F/closure C, PRE-source O and W=(R(H) minus (R(B) union C)) union O; never shrink obligations through a newer default. Keep complete authenticated forge pagination, authoritative empty versus unavailable, and reopen/hold/open-episode revalidation at begin and START/record/ship including under lease.

    Required evidence remains proposed, NONE RUN: `git_callback_descendant_cannot_forge_observation` through real wrapped commit/rebase, P4/recovery and production hooks. A non-hook private-preparation Git child invokes genuine HookClient AND genuine shell wrapper with forged expected-shaped input, live Git ancestry and fixture-injected inherited FD/capability; no accepted evidence or WORK FINAL. Inside-domain hostile config is excluded/refused before shared mutation; its actual execution is failure. Include changed-after-planning config/runtime inputs, withheld true callback, partial stream, output pressure, pre-connect stalls, original dead publisher, nonchild/PID-reuse recovery and stale credentials. Pair genuine callbacks and every required ordinary positive. Add exact notes-no-op/continuation-editor profile assertions and actual process/FD/effect observations. Retain both publication-lock suites and all cross-repo/history/peer/no-residue/bootstrap/crash/default-coverage witnesses; helper-only checks and document hashes are not acceptance tests.

