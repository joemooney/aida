- id: 01a1197c-168c-7202-a129-e447a086efd7
  author: codex/authority-sketch-v3-author
  content: |
    SKETCH (awaiting advisor signoff): BUG-1802 — revision 3, atomic work evidence and bound execution

    Author: Codex `authority-sketch-v3-author`, native thread `01a11970-6f4f-7c60-8e4f-c910556f0d8a`, separate revision-author session assigned by Joe, 2026-10-07 America/Phoenix. AIDA_SESSION_ID is absent; no lease UUID or authenticated review grant is asserted. This is authorship provenance, not signoff. Final authority-changing merge belongs to Joe. No production code, dispatch, approval, grant, status/queue/hold change, merge or experiment is authorized by this document.

    Read AGENTS.md, two-seat/rework/recovery discipline, aida-orchestrate §3 (authoring only), full owning specs and every canonical comment, both v2 sketches, INDEPENDENT_SKETCH_SIGNOFF.md and the actual INDEPENDENT_SKETCH_V2_SIGNOFF.md. Earlier answers A–E remain binding without acceptance relaxation. Prior artifacts are preserved. All new types/functions/flags below are PROPOSED; cited baseline symbols are existing integration points, not claimed implementations.

    All reviewer answers A–E are adopted. Reviewer/advisor grant or authenticated direct-human TTY only; exclude the author and author-descended reviewers; independent siblings under a nonimplementing driver are valid. Unknown implementation provenance refuses even with a fresh review. Explicit revocation, including role end, invalidates consumption for unmerged work; natural expiry/process exit does not erase record-time authority. Preserve closed history. No attribution-repair override, authority expansion, protected broker, or operator fork is proposed.

    Concrete storage choice (proposed additive fields, not baseline capabilities)

    Use existing per-session manifests and existing grants as the retained evidence; existing verdict JSON rounds reference them. No global commit/provenance ledger and no new requirement format. All UUIDs below are actual UUIDs, all SHAs full object IDs. Display spec IDs, branch names and role strings are diagnostic, never identity.

    1. seat_authority.rs::SeatGrant keeps its existing id, session_id, subject, principal, seat, parent_grant_id, issued_at, expires_at, revoked_at and delegable_seats. Give existing session_id the stable actor meaning: it is preserved across role reissue and vendor resume for the SAME conversation/shell actor; a genuinely new child receives a new session_id. Add predecessor_grant_id: Option<UUID> to preserve a reissue edge, issued_roster_store_sha (the retained canonical store commit whose registry/team.toml authorized issuance), and binding: Option<{repo_key, manifest_id, assignment_id}>. The binding points to the retained manifest, not a second scope store. Historical grants remain at the existing session-grants/<id>.json path; do not garbage-collect grants referenced by manifests, verdicts, or their ancestry. Mutating revoked_at remains supported; identity/lineage fields become immutable. Reissue never erases a prior revocation or renews its historical approval. Old grants without these joins cannot record an authenticated approval.

    2. session_manifest.rs::SessionManifest adds one optional versioned evidence block:
       schema=1; repo_key; actor_session_id; grant_ids[]; predecessor_manifest_ids[]; process_bindings[{pid,start_identity,native_session_id?,registry_id?}]; commits[{sha,parents[],tree,assignment_id,grant_id,op_id,completion_digest,contributor_manifest_ids[],source_commit_shas[],observed_at}]; coverage_gap: Option<{reason,first_observed_head}>; ended_at?.
       The same manifest has ONE canonical launch_assignments[] array shared with BUG-1808: each item holds assignment_id, repo_key, spec_uuids[], selected_seat, actor_session_id, grant_id, parent_grant_id, predecessor_assignment_id?, native_session_id?, branch, worktree, kind, run_token?, member_uuid?, phase?, phase_attempt_uuid?, issuer_pid/start_identity, state, publication_id, activation_attempts[] (actual PID/start lives only in these retained attempts). BUG-1802 adds lineage_manifest_id, base_sha, entry_head, entry_tree, entry_clean to each item. These are not duplicated in the evidence block; commit witnesses reference assignment_id. Standalone/no-orchestrator items omit token/member/phase.
       repo_key is the canonical real git-common-dir path paired with the resolved canonical store root; resolve both through git/store discovery, compare both, and refuse ambiguity or a moved repository until evidence is resolved through a separately reviewed procedure. An origin URL or AIDA_DRIVE_ROOT alone is not a repo key. manifest_id is the existing session_id filename key (lease ID when a lease exists), distinct from actor_session_id = SeatGrant.session_id. A manifest can hold multiple scoped assignments/commits for a cluster. lineage_manifest_id is the first manifest for that unclosed spec work episode; it is NOT reminted by branch renaming, rework, new lease or a new reviewer. predecessor edges preserve all imported work episodes. base_sha is the immutable accepted-default-branch anchor at episode admission; it is not advanced merely because a new session starts.
       Retain these manifests IN PLACE under canonical main-root .aida/sessions/<id>.manifest.toml. End/prune may delete live leases and activity, but not the evidence-bearing manifest. A retained ended manifest does not claim work: active-plan/lease views must exclude it from active ownership while evidence readers read it strictly. Do not use list_all's current skip-parse-errors behavior for authority. Explicit UUID references plus full-directory strict discovery for a target detect corrupt/orphaned records; an unreadable potentially relevant record is a coverage error, not zero contributors.

    3. agent_registry.rs::AgentRegistryEntry adds grant_id and process_start_identity. Keep existing id, native_session_id, resumed_from, pid, worktree_path and ended_at. These are live lookup pointers into retained grant/manifest evidence, not permanent authorship proof themselves. register_spawned_agent/register_existing_agent/register_role_enter_agent persist the join before exposing a managed process as ready. Registry GC can remove its row only after the corresponding process/native-session binding and end state are retained in the manifest. A registry error does not silently mint a new actor. A native session or validated process ancestry resolving to an old actor must resume that actor, including when AIDA_AGENT_NAME/TYPE/GRANT are missing. PID alone is never a durable key.

    4. lib.rs::OrchestratedLeaseReceipt adds evidence_manifest_id (and uses the BUG-1808 assignment reference when present). Existing lease_id, claude_session_id, branch and worktree_path stay. write_orchestrated_lease_receipt/publish_orchestrated_lease_receipt_from_env require the saved manifest/grant join, then publish the pointer. prepare_orchestrated_lease_receipt and RealPhaseDriver::recover_lost_child_state may clear a transient handshake/refusal file, never retained evidence. Receipts are discovery hints: deleting one cannot remove an implementation actor.

    5. review_verdict.rs::RecordedVerdict/build_verdict_object add a fresh authority envelope per round:
       version=1; round_id; parent_round_id; repo_key; spec_uuids[]; forge_project; pr; base_sha; reviewed_sha; implementation[{lineage_manifest_id,manifest_id,manifest_evidence_digest,commit_shas[]}]; reviewer={kind,actor_session_id,grant_id?,manifest_id,ancestor_grant_ids[],record_time_roster_store_sha,record_time_roster_digest}; recorded_at; transport={kind,session_id?}; policy=1.
       Direct-human kind additionally records explicit target/head/independence confirmation and the human principal. Envelope fields are not accepted from arbitrary caller JSON as proof. The canonical recorder computes them from validated retained records. Grant secrets are not duplicated. Evidence digest covers immutable assignment/commit facts used for THIS head, not later mutable manifest bookkeeping. Later commits can append evidence without invalidating an earlier head's digest. A new round explicitly clears/replaces authority; build_verdict_object must not inherit it from previous arbitrary fields.

    Identity/ancestry validation and retention ownership

    The proposed typed resolver returns Granted, DirectHuman, Missing, Invalid(reason), never the current current_grant(None) ambiguity. Starting from the actual grant handle, validate subject and the process/native-session join, immutable IDs and repo binding. Walk every parent_grant_id AND predecessor_grant_id to roots with a visited set and strict missing/corrupt/cycle refusal. At recording, validate current expiry/revocation and roster ceilings for the active delegation ancestry; prove each historical delegation edge was valid at issuance from retained grant timestamps and registry/team.toml at issued_roster_store_sha. Pin referenced store commits against local GC; absence of the historical roster object refuses rather than using today's roster as proof. Reissued actor identity is inherited through predecessor evidence; reissue does not confer the predecessor's delegable seats. A historical expired predecessor can establish actor identity, not current authority. The actual current grant must authorize reviewer/advisor.

    Compare the reviewer's stable actor and every validated ancestor actor against the COMPLETE implementation contributor set for the target. Common principal and a nonimplementing common driver do not collide; implementing actor anywhere in the reviewer ancestry does. Compare direct-human identities only against direct-human contributor identities as well as any managed actor they actually resumed: a shared Unix account hosting independent agent children is not automatically self-review.

    seat_authority::{issue_direct,issue_child,write_grant,revoke_current}, role_cmd::{handle_role_enter,handle_role_end}, session_manifest::{save,load}, and the launch producers below own retention. issue_direct must consult existing parent-shell PID/start, registry and native conversation joins before minting a session identity. A new role in the same process/native conversation preserves the actor. If positive managed evidence exists, require_direct_human plus a PTY cannot provide an operator fallback. A genuinely direct human uses require_direct_human, stdin+stderr TTY, known principal, explicit target/head confirmation and a retained human manifest. A missing/invalid supplied grant is an error, not human detection. Supported local workflows are the boundary; no claim of resisting a user who edits local evidence or secretly copies another person's patch.

    Bounded work-operation protocol: no usable new head before complete attribution

    Keep evidence in existing retained manifests. Add ONE episode state block to the first (lineage) manifest, with `accepted={head, tree, generation, completion_digest}`, `participants[]`, sticky `gaps[]`, and append-only `operations[]`. This replaces v2's post-commit-first publication. Each operation has immutable `{op_id, kind, episode_id, repo_key, branch/worktree, owner_pid/start, assignment_id, actor_id, grant_id, old_head/tree, old_generation, source_heads[], source_commits[], source_witness_digests[], participant_manifest_ids[], command_digest, allowed_ref_updates[]}` and state `PENDING | FINAL | ABORTED | GAP`. A separate bind-once `git_process={pid,start_identity}` is absent when PENDING is first saved, then parent-written and fsynced before Git bootstrap release; it is immutable after binding. Large source sets may be digest-addressed immutable attachments to THAT manifest, not a global ledger. Fsync attachments and referenced Git objects/pins before PENDING is published. No source set is reconstructed from the post-operation DAG.

    Named new producers: `work_evidence::{begin_operation, bind_git_child, observe_ref_update, retain_rewrite_mapping, finish_operation, abort_unchanged_operation}`. They take the home publication guard, repo guard and permanent sorted episode locks; all completion decisions happen under those locks. `begin_operation` resolves actual caller actor/assignment and last accepted observation, and durably publishes PENDING BEFORE any Git operation may change HEAD/ref. It refuses concurrent pending operations; it does not hold filesystem locks across Git/hooks. Gates can therefore acquire locks, observe PENDING and refuse. The operation's exact Git subprocess is bound by the parent to PID/start using a waiting exec bootstrap before that subprocess runs; hook input/env op_id only locates this retained binding, never authenticates it. Generic vendor work and Git subprocess binding use the same process proof but only a vendor launch issues a grant.

    Continuity prerequisite: current pre-operation HEAD/tree must equal episode.accepted, no unresolved gap/pending, and every source outside the accepted closed base must have retained complete evidence. All writable participants, including a participant leaving uncommitted work, are conservatively accumulated. A reviewer who edits/commits joins this contributor set. A new episode requires a clean accepted default-base anchor and no prior open work; a legacy diff, dirty unexplained handoff, incomplete prior episode or unknown source is not empty authorship. Git email, current lease, role/name and absence of logs do not prove an empty contributor set.

    Supported operation matrix (strict, deliberately bounded):

    | Operation / exact producer | Pre-operation source and completion rule |
    | --- | --- |
    | Ordinary `aida commit`, `commit.rs::run_git_commit` | Wrap its exact existing `git commit [-a] -m ...` argv; immutable old head and SINGLE parent, staged tree after controlled staging, no merge/rebase/cherry-pick/sequencer state. Parents of result must be exactly `[old_head]`, tree must equal prepared tree, Git child and hook observations must join the operation. Union old episode contributors plus all writable participants/actor. Wrapper captures authoritative command identity; parent equality alone never classifies an operation as ordinary. |
    | `aida pr rebase N`, `pr_cmd::pr_rebase_handler` | Begin before Step 6 and before any branch-head replacement, after read-only target resolution; retain full old reachable source set, onto/base boundary, objects and actors, including skipped/drop candidates. Register temp worktree in same episode; preserve source identity across cleanup. Require complete actual rewrite map captured from Git callback and validated against old/new objects and intended ref transition. Include ALL old source contributors + transforming actor even for dropped/squashed sources. Accepted base contributors need not be retroactively reviewed, but missing open-source attribution is sticky. Missing map NEVER finalizes on successful Git exit. |
    | Amend / cherry-pick / merge | Add proposed bounded `aida internal work-operation amend|cherry-pick|merge -- <validated Git arguments>`; it resolves sources itself and owns Git execution. Amend sources include immutable old head; cherry-pick includes selected source SHAs and existing episode; merge includes ALL side-parent DAGs. Refuse opaque aliases/shell commands, squash/interactive variants or options whose source set cannot be enumerated before mutation. Exact command grammar and no unexplained ref changes are mandatory. Post-commit only stages result; finish validates mapping (amend), selected-source/result association (cherry-pick), or all parent edges (merge). Union original actors + transformer, never just committer. |
    | Import / arbitrary reset / filter / raw replacement | No complete authenticated import adapter is present or proposed here. Refuse supported AIDA import/head replacement into an open episode before mutation unless all source witnesses and exact transition are supplied by a future reviewed adapter. Raw imported or rewritten heads remain unknown/gap and block both record and ship. A fresh reviewer cannot repair them. |
    | Raw Git hooks | Supported hooks are enforcing observers for a PREEXISTING bound operation: pre-commit, pre-rebase, reference-transaction prepared/committed/aborted, post-commit and post-rewrite, routed through internal_cmd. pre-commit/pre-rebase refuse managed mutations without that operation; reference-transaction prepared rejects unregistered HEAD/branch updates. post hooks only stage observations/mappings, NEVER mark complete alone. Raw `git commit`, amend/rebase/cherry-pick/merge without a parent operation wrapper is explicitly unsupported for trusted evidence and refused where hooks can stop it. If bypassed/missing hooks allow Git to run, the head differs from last accepted or lacks a FINAL witness: gates refuse, never silently classify it ordinary. Existing best-effort no-verify telemetry remains separate. |

    This raw-operation restriction is explicit fail-closed support, not a claim that Git exposes a reliable universal pre-amend/pre-import hook. No reliable such baseline producer was found; v2's raw-hook positive claim is withdrawn. Positive hook tests invoke the hooks through the wrapped Git subprocess. If raw standalone Git success is required beyond this refusal policy, that needs a concrete authenticated pre-operation adapter before implementation signoff, not a post-hoc parent/patch-id heuristic.

    Operation state/order:

    1. `begin_operation`: retain immutable source objects/evidence and actor join; atomic fsynced lineage-manifest replacement creates PENDING while accepted head remains old H0. Bind and release only its exact Git child. For multiple linked spec episodes acquire sorted locks and mark all PENDING before Git release; any incomplete preparation leaves blocking pending evidence, no Git mutation.
    2. Hooks/parent retain observed old->new ref transactions and rewrite mapping as immutable operation attachments. A post-commit callback with H1 only sets `result_observed`; H1 is still untrusted. A raw unexpected transition records GAP when observable. Callback failure never clears PENDING. Gates at both old and new heads block while a relevant operation is pending.
    3. `finish_operation`: after Git exits and callback evidence is durable, re-read actual branch/ref/head/tree and objects under episode lock. Require old generation unchanged, exact operation owner, allowed command/source set, complete mappings/associations, no unexplained head/index transition and valid source references. Derive result witnesses with conservative UNION of all source and participant actors. Stage/fsync actor witness fragments first. ONE atomic fsynced lineage-manifest replacement publishes FINAL + witness digests + new accepted head/generation together. For multi-episode completion, keep all gates blocking until every referenced episode has finalized the same op completion digest; no cross-file partial state is usable. A new commit witness alone is never sufficient.
    4. Crash after H1 exists, missing rewrite callback, partial witness write, unknown source or ambiguous mapping: PENDING/GAP remains durable, accepted H0 never advances. `review record` AND `pr ship`, including archive/corpus/drain/release paths, check this state before accepting any approval (even an old valid approval). New reviewer/lease/grant/retry cannot wash it away. Unknown source is sticky even if no longer reachable in H1.
    5. Recovery is read-only classification until a supported bounded recovery can prove completion using the retained PRE-operation state plus already durable callback/ref evidence. Missing maps cannot be invented after crash. Only a proven unchanged result (old HEAD/index/ref state, dead Git process, no unexplained observation) may become ABORTED and unblock H0. Changed/uncertain state stays PENDING/GAP with exact op/source SHA diagnostic. No automatic human attribution override or blessing of an unknown transition. A supported retry may complete only the same immutable operation with authentic retained evidence.

    For head H, shared `validate_work_coverage` requires accepted.head==H, no relevant pending/gaps, exact final completion digest, and complete witnesses for the FULL DAG H minus immutable base B, including side parents. Also compare current forge/local branch head with H. Keep old operation/source evidence even after rewrite removes it from the DAG. Refuse missing/corrupt potentially relevant manifest references rather than treating them as zero contributors. This closes both the new-head window and source-erasure hole without a second authorship ledger.

    Shared executable launch contract (normative in BOTH sketches)

    One proposed `launch_publication::LaunchPublisher` is owned by the authorized AIDA launcher, never by the vendor. `bind_waiting_child` is its only process-binding writer; `release_bound_child` is its only release writer. `session::spawn_bound_vendor` replaces covered low-level spawn/exec calls. It consumes a prepared assignment and cannot issue authority. There is one issuance owner, even for resume/reviewer/phase launch. New children receive distinct actor UUIDs and empty delegation sets; verified resumes/reissues retain their old actor UUID through predecessor evidence. A driver is not an implementation contributor merely because it launched two independent children.

    The shared minimal assignment is immutable `{assignment_id, publication_id, repo_key, manifest_id, spec_uuids, seat, kind, actor_session_id, grant_id, parent_grant_id, predecessor_assignment_id?, branch, worktree, issuer_pid/start, run_token?, member_uuid?, phase?, phase_attempt_uuid?}` plus append-only activation attempts. Each attempt records `{activation_id, pid, boot_id/start_identity, executable/argv_digest, channel_nonce_digest, expected_native_id?, state, receipt_id}`. Standalone launches use an explicit standalone kind and omit run fields; phase launches require ALL run fields. Schema names are `selected_seat` for seat, `actor_session_id` for actor and `phase_attempt_uuid` for phase attempt throughout; shorthand prose denotes those same fields, never a parallel array. Grant binding points to manifest/assignment; manifest activation points to the retained publication receipt; RunMarker.phase_assignments points to the same activation/actor/grant. No optional consumer PID can describe a released activation. Setup-only assignments have NO executable activation and confer no vendor execution right.

    L0 PLAN: resolve authoritative roots, caller actor and complete grant chain, exact routed seats and vendor command. Validate delegation and supported launch adapter before lifecycle writes. Prepare exactly one scoped child grant (or consume the already-issued exact assignment without reissuing). Rework, admission and setup writes are part of the same publication. Direct agent-new planning must stage its early session/context/registry changes too. The immediate-launch protocol below uses BUG-1808's P0–P4 contract; BUG-1802 needs the same contract for its direct-launch producers even if implemented separately.

    L1 WAITING PROCESS, before COMMIT: launch the AIDA bootstrap executable, NOT the vendor, with an already-open private socketpair and immutable command description. Bootstrap does only bootstrap validation, READY on that channel and blocking receive. It cannot open the worktree for vendor work, call pickup, write a manifest/grant, create vendor logs, or run vendor initialization. READY is not authority. The parent obtains the actual child PID from spawn, corroborates READY peer identity, reads OS process start identity (including boot identity), verifies executable/argv and process ancestry, and holds an OS process handle where available. Missing platform proof refuses before COMMIT. Process names, environment handles and a PID without start identity do not suffice.

    L2 BIND: `LaunchPublisher::bind_waiting_child`, under home -> repo -> store/queue/drain -> episode/manifest locks, writes the exact PID/start/activation join into the staged manifest, grant binding, registry and token-specific phase assignment; validate reciprocal joins and live member/parent + snapshot membership. Registry registration is moved BEFORE vendor execution, and cannot be best-effort. The bootstrap does not write these records. The journal includes every installed binding. Bind failure, timeout, missing grant, changed member/attempt, expired authority, missing native predecessor, or a dead bootstrap causes pre-COMMIT ABORT: close the channel, kill/reap only the verified bootstrap, roll back this invocation's finite write set, remove its staging. Never fall back to a human or inherited driver grant. No writable vendor has existed.

    L3 P4: parent rechecks authority/time/roster, scope, exact bound process start and all reciprocal records. It durably commits the publication with an activation receipt binding the command digest, process identity, assignment and validation instant. Finish recoverable installs/refs and make the committed view durable BEFORE sending RELEASE. Keep the home publication lock through the release exchange, then drop it before waiting for vendor completion. Revocation serialized before P4 wins; natural expiry is checked at P4, not frozen by locking. A queued revocation whose writer only acquires after P4 is later in serialization. No late `issue_child` call is permitted.

    L4 RELEASE: the still-live publisher sends one nonce/activation/receipt-bound RELEASE on its private channel to that same waiting process. Bootstrap accepts only on its original channel, checks the parent process identity is still live, replies READY_TO_EXEC, and performs an in-process `execve` of the prevalidated vendor executable. PID/start survive this exec; this is why a bound bootstrap PID becomes the vendor PID. It never spawns an unbound vendor subprocess. The parent records release-sent/ack observations in the receipt; neither proves successful vendor execution. Exec-error channel is close-on-exec and reports errors; parent OS inspection can corroborate exec. An error after committed authorization is an authorized startup failure with manual continuation, not an unchanged-state authority refusal.

    Parent death/channel EOF BEFORE RELEASE makes bootstrap exit without exec; death after receipt COMMIT but before RELEASE leaves committed setup, not rollback. Recovery never sends RELEASE or blindly respawns. It retains `committed/interrupted-or-release-uncertain`, checks actual bound process liveness, and requires a NEW activation transaction with current authority and a new PID/attempt; a possibly live old attempt prevents a concurrent replacement. If RELEASE was already delivered and validated while parent was alive, subsequent death is after launch authorization, not an uncommitted refusal; vendor may already run. This explicit linearization avoids claiming an impossible atomic parent-liveness/exec guarantee. A setup-only/TUI deferred launch is always a new activation transaction; it cannot reuse a prior P4 instant.

    Adapters and actual producers:

    | Surface | Parent owner / actual child |
    | --- | --- |
    | Foreground `agent_new_with_config` -> `run_tracked_agent` | AIDA caller owns LaunchPublisher; spawn bootstrap then exec vendor. Move issuance, session/context/registry writes inside publication; registry identity is actual exec PID. |
    | Queue interactive and `exec_vendor_headless`; standalone reviewer; fresh/resume wrappers | `handle_queue_work` owns publication. Low-level wrappers use `spawn_bound_vendor`; they consume its assignment, never delegate again. A CLI previously replacing itself must retain a publisher parent until release. |
    | `run_auto_complete` / `RealPhaseDriver::{run_implementer,run_reviewer}` / retries | Driver calls shared in-process pickup preparation and is the sole issuance owner per phase/attempt. DIRECT bootstrap-to-vendor launch replaces the old `build_implementer_phase_args` queue-work subprocess. Root/first admission/first setup form one boundary; register membership before status/release. No nested queue child setup or recursive delegation. |
    | Background phase and pane-host | Same driver publisher. Background is a direct bootstrap child. tmux gets ONLY an AIDA bootstrap command, no vendor shell command. Private Unix socket rendezvous (0600, random nonce) authenticates peer PID with OS peer credentials; verify start identity/executable and pane's actual process ancestry. Shell/tmux PID is transport only. Bootstrap later execs vendor in place. No platform peer-PID adapter means explicit preflight refusal. Fallback to background is permitted only after proving the pane bootstrap never released and is dead/reaped; never double launch after an uncertain pane result. |
    | Actual TUI `App::spawn_tab` -> `queue_work_argv` -> `PtyHost::spawn` | PTY hosts the AIDA queue launcher; it owns publication and launches the waiting bootstrap in the PTY. TUI PID and minted Claude UUID are selectors, not proof. Proposed inherited `launch_status_fd` from PtyHost carries only `{publication_id, assignment_id, result}`; queue publisher writes success after durable COMMIT/install, TUI verifies that retained receipt through PublicationGuard before persist_state. EOF/refusal removes only the invocation placeholder and never changes prior tabs. Delay persisted lifecycle/tab-success state until that receipt. Codex resume must refuse rather than silently fresh-launch a requested old actor. |
    | Explicit `--no-launch --session-id` | Authorized setup-only publication, no bootstrap and no active process. A later proposed `aida internal activate-assignment <id>` is a launcher-owned activation entrypoint with current authority; it uses L0–L4, preserves preexisting setup on refusal, and does not let the vendor self-issue. |
    | Direct session attachment / role reissue | No child launch is invented. Resolve the existing live actor through retained PID/start/native evidence; preserve actor on role reissue. Unknown actor cannot become trusted writable/review evidence. |
    | Native `agent_new_bg_dispatch` / `claude --bg` | UNSUPPORTED authenticated launch in this revision: baseline daemon dispatcher returns after a hidden launch and has no pre-exec binding adapter. Refuse at L0 before session/context/grant/setup changes with “native background daemon cannot bind vendor before execution; use foreground agent-new or supported headless queue launch.” Do not bind dispatcher PID, parse stdout as authority, or silently change native attach/log semantics. Supporting native --bg requires an actual vendor pre-exec waiting-process API or separately reviewed AIDA-owned supervisor adapter. This is a concrete support blocker, not an invented mechanism. |

    Containment: bootstrap must be the innermost process that will exec vendor. A wrapper such as bwrap may create PID namespaces; the parent must obtain the real host PID/start by authenticated peer credentials and namespace mapping before L2. A wrapper without this adapter is refused before setup. Windows needs a suspended-process/creation-time equivalent bound by the same publisher before ResumeThread; absent that implemented adapter, explicitly refuse authenticated launch. Do not silently remove containment or substitute host PID. These adapter limitations are implementation blockers to positive coverage for those variants, not permission to relax identity.

    Native IDs are corroboration, not boot credentials. For fresh Claude the parent's requested UUID is only expected identity until joined to the bound process and its vendor session artifact. For fresh Codex, do not mint a fake native UUID; PID/start binding permits execution. Parent-owned registry monitoring may append an immutable native binding only after joining bound process/descendant, actual transcript/session artifact and canonical cwd; ambiguous/conflicting discovery refuses further authority use. Vendor-supplied text alone cannot create that join. Resume resolves exact native ID -> retained manifest -> actor BEFORE L1; missing mapping refuses. Environment-free descendants authenticate through an OS ancestry walk to a live bound PID/start plus retained committed manifest/grant; missing/reparented/ambiguous ancestry cannot infer “human.” Native evidence alone cannot authorize an unrelated live process. Role reissue and process exit retain evidence; a truly new sibling remains a different actor.

    Standalone publication requirements for this bug

    The launch contract is adoptable as part of BUG-1802 without assuming BUG-1808 has shipped. Its required finite setup publication service uses an exclusive permanent resolved-home .aida/authority-publication.lock, home coordinator active slot and home-resident immutable journal generations/payloads. Entry to ALL supported queue/grant/roster/manifest/run/authority readers and writers recovers the active transaction's pinned repo before acquiring any requested repo lock, even from repository B or outside a project. Root/common-dir/store identity and journal digest must validate; missing/moved repo or corrupt payload means refusal, never a scan or shared-lock upgrade. Journaled preimages and code/store Git closure packs are fsynced before provisional installation; parent bind failure is pre-COMMIT abort. COMMIT is an immutable fsynced decision carrying exact write-set digest and bound activation identity. PREPARED recovers by restoring locked preimages; COMMIT rolls forward without respawn. Retain home receipts/<publication_id>.json and referenced manifest/grant records before clearing the active coordinator and deleting journal payloads. Keep all permanent sidecars. The companion v3 provides the complete finite-resource inventory and detailed P0–P4 algorithm; these same publication invariants are required here, not permission to rely on a future unspecified launcher. Authority consumption validates the retained receipt after cleanup, and missing receipt blocks. If this infrastructure cannot be supplied, authenticated launch support remains blocked.

    Review START, recording and retained expected parent

    Add proposed CLI `aida review start S --pr N --sha <full-head>` (or explicit branch target) returning `review_assignment_id`; add `aida review record ... --review-assignment <id>`. `review_start::prepare_assignment` is also called internally by `run_standalone_reviewer`, actual review launch, and `RealPhaseDriver::run_reviewer` BEFORE bootstrap release. CLI start resolves current bound reviewer actor (or the explicit direct-human TTY identity) and canonical target under home/repo/episode/verdict locks, checks coverage, then saves immutable `{review_assignment_id, reviewer_actor, manifest_id, target UUIDs/forge/PR, expected_head/base, expected_parent_round_id or explicit ROOT, expected_generation, started_at, phase/attempt}` in the retained manifest. It marks the target under review through the existing marker producer. Automated launch stages this start record in its launch publication; a caller flag cannot mint its expected generation. Reviewer prompt includes the start handle/head; environment is only a locator.

    Recording requires this already-existing start assignment, bound to the actual reviewer and exact target. It NEVER creates a start implicitly or reads “latest” as the caller's expectation. Explicit --sha/--branch must equal the retained expectation. Under the same locks compare current forge head, canonical parent round/generation and assignment; any change refuses without verdict/marker/hold/event/status writes. To supersede a new refusal the reviewer must start a NEW actual review after seeing it; stale submission cannot adopt it. Root means observed absence at start, not wildcard. No-start legacy recorder syntax refuses with the exact start command. Direct human also explicitly starts and confirms exact target/head/independence at a TTY; missing managed proof cannot fall back to human.

    Canonical publication, candidates and all consumers

    Canonical root: resolve main_worktree_root_from/find_main_worktree_root, git-common-dir and detect_distributed_store_from, then require equality with launch/grant/manifest repo_key and forge project identity. Resolve all display IDs through the store to UUIDs. Resolve PR head/base through the forge and local full commit objects; reread before publication. AIDA_DRIVE_ROOT is only a corroborated pointer. Local/sibling JSON is input evidence, never permission to override the canonical round.

    For standalone BUG-1802, use the same home-first publication/recovery guard defined in the companion sketch; if unfinished home publication cannot be recovered, refuse before reading authority. There is no recursive acquisition from an already-held merge lease. Use a permanent canonical .aida/review-verdicts/.locks/<forge-project-and-pr-key>.lock and sorted spec-UUID locks for multi-spec rounds. All record/archive/adopt/close writers and authority consumers must use the same lock domain. Lock order with BUG-1808: home publication lock (exclusive recovery first, before selecting a repo lock) -> canonical repo lifecycle lock -> store write lock if required -> sorted queue locks -> drain snapshot lock if required -> sorted episode/manifest locks -> sorted verdict locks -> existing merge lease acquired last. This requires moving pr_ship's lock acquisition ordering while retaining the under-lease recheck, not nesting authority acquisition after a lease held in the opposite order. Normal mutations never acquire a merge lease. Grant/roster writers honor the authority lock; publication and consumption validate retained facts under it.

    handle_review_record_at sequence: resolve retained START assignment/caller/target -> acquire locks -> compare START-pinned head and parent generation against current canonical state plus all authority/coverage/candidates -> reject invalid/stale caller WITHOUT hold/marker/verdict/event/status writes -> allocate round_id using the START-pinned parent_round_id -> archive current round with full provenance -> atomically publish the canonical current round -> fsync/verify it -> publish derived PR/SPEC handshake and event -> only then perform permitted marker changes. A failure before canonical publication cannot clear anything; a failure afterwards leaves a valid canonical record and conservative blocking markers, reports partial transport, never fabricates approval. Emergency hold placement remains available through its existing separate authority floor.

    Concurrent recorders must submit the parent generation they observed; the second recorder seeing a different current generation refuses/retries a NEW actual review. It cannot overwrite a concurrent refusal because its timestamp is newer. Approval after refusal must explicitly reference that refusal round and satisfy existing findings/corpus closure requirements; valid identity alone does not clear a human merge hold. A stale transport replays by exact round ID idempotently; it never advances ordering. Same-head contradictory unordered rounds block. Histories and per-SHA archives remain readable with original order/closure; no migration rewrite.

    Change pr_ship::merge_gate_verdict_candidates to return a typed candidate set including Absent, Parsed(round,path), Invalid(path,reason), and inaccessible-directory errors. Only NotFound at an expected path with no known prior evidence is absence. Explicit paths, relevant current PR/SPEC keys, head archive paths and referenced rounds must report unreadable/malformed/missing referenced content as Invalid. A malformed object cannot be filtered by .ok().and_then(parse...) into no-review-required. An unclassifiable relevant-path record blocks; an explicitly well-formed closed/unrelated record can be excluded by validated target/closure, not by parse failure. Absent all evidence retains existing no-review-required policy only when no corpus/rework/review obligation exists. Invalid always refuses even if another valid approval exists. Legacy approval remains displayable but untrusted for an unmerged target; a valid later target-scoped canonical round can supersede it under ordered parentage, never rewrite it.

    One proposed classify_approval_authority helper must be called by pr_ship::{approval_head_refusal,open_approvals,approved_match_head}; pr_cmd::{ship_preflight_gates,pr_ship_approval_gate,ship_refusal_release,pr_ship_handler}; merge_hold::{refusal_release,enforce_corpus_gate_before_merge}; lib.rs::{drain_merge_match_head,stamp_pr_review_verdict,read_verdict_file,read_verdict_file_for_head,spec_verdict_fallback_for_phase3,sibling_verdict_sweep_for_phase3}; and review_verdict's corpus/queue-done release decisions. It returns a structured refusal, never bool false that means approval absent. --override-stale-approval cannot override identity/coverage/refusal errors.

    At pr ship preflight validate complete candidate set and exact forge head. After CI, reacquire the stated locks and merge lease, reread forge head, candidate generation, corpus, holds, supervision and retained identities. Explicit reviewer/ancestor revocation or a current explicit roster removal now blocks; natural expiry after a valid record does not. Keep authority/verdict serialization through the exact-head forge merge submission and use the existing match-head protection; if the forge cannot guarantee that head, refuse. A revocation serialized before submission wins; after a successful merge it does not reopen closed work. Do not hold these locks during CI polling.

    reviewer handshake ingestion must verify the canonical round, reviewer assigned actor and current phase/attempt, rather than mtime alone. Direct child JSON without authenticated canonical publication can communicate a refusal/escalation but cannot approve. stamp_pr_review_verdict can append CI transport metadata tied to an existing round ID/head; it cannot set recorded_by to 'aida drain reviewer', mint authority, copy a prior round's authority, or turn an approved payload into a canonical review. Sibling sweep/adopt_direct_write may retain diagnostic artifacts but cannot promote them without canonical recorder validation. CI transport failure preserves the canonical round and blocking evidence.

    Real CLI witnesses required after implementation (not executed here)

    All fixtures use isolated HOME/AIDA_HOME and temporary repos/stores, fake vendor/forge, actual built aida, ready caches, real grants issued by the fixture helper, and actual production phase launch paths. S is a fixture spec and N a fake forge PR, never the live bugs.

    - review_record_implementer_cannot_self_approve_cli: `aida review start S --pr N --sha H`, then `aida review record S --verdict approved --pr N --review-assignment R`; implementing grant, removed env names, forged display role, PTY, and implementing ancestor all refuse with identical verdict/marker/hold/event snapshots. Also exercise reissued actor without grant env but retained process/native evidence.
    - review_record_independent_granted_reviewer_cli: start then record under a distinct reviewer child of a nonimplementing driver passes; run actual queue/drain reviewer launch, not just synthetic JSON. Sibling same Unix principal passes; child of implementing actor fails.
    - review_record_direct_human_tty: actual PTY target/head confirmation passes for a known independent human; managed PTY, non-TTY, invalid supplied grant and human who implemented refuse.
    - review_record_identity_survives_cleanup_and_rework and review_record_reissued_grant_same_actor_refused: actual session end/prune, registry GC, queue rework/resume and role reissue preserve actor set; test two contributors, including one who leaves dirty work without a commit. A later fresh reviewer cannot repair a coverage gap.
    - review_record_covers_later_head_cli: launch at B, make two later commits using `aida commit` with its actual Git hooks, review H; omit one witness, import an unknown side-parent, skip hook, rebase/amend/cherry-pick, move head during record, and replace current lease. Every gap refuses; fully retained rewrite union passes. A clean fresh session on a legacy diff does not launder it.
    - ship_rejects_untrusted_review_provenance_entrypoint and ship_malformed_approval_is_not_no_review: `aida pr ship N --wait 1`; corrupt current/archives, inaccessible canonical dir, missing referenced manifest/grant, local/canonical conflict, forged operator, wrong UUID/repo/head, and explicit malformed approval cannot reach fake forge merge. Separate truly absent, no-review-obligation fixture preserves existing behavior.
    - drain_review_transport_cannot_authenticate_child_json: `aida queue work S --auto-complete --no-human=both --vendor claude` in the hermetic production driver; fake reviewer writes unsigned approved JSON, parent stamps CI, sibling sweep sees it. No merge/rework-release; authenticated canonical sibling reviewer round succeeds. Run --from-pr variant too.
    - review_record_concurrent_rounds_preserve_refusal: barriers before publication; refusal wins generation CAS and stale approval cannot erase it. Inject canonical write failure and confirm markers remain. Exercise retained archive rather than only current file.
    - ship_rechecks_provenance_under_merge_lease and ship_revoked_review_refuses_but_expired_review_retains_record_time_authority: barrier after preflight/CI and under lease; revoke reviewer/ancestor, move head, change corpus, expire grant or exit process. Revocation/head movement blocks; natural expiry retains record-time authority. Exercise actual refusal_release and corpus gates; hold clearance remains separately human-gated.
    - review_provenance_roundtrip_and_legacy_policy: preserve a closed legacy fixture byte-for-byte, including refusal/findings/closure/archive; no reopened status and no rewritten history. A new relevant round supersedes only its explicit target predecessor.

    Retain/extend existing review_verdict_tests, read_verdict_file_tests, bug_775_commits_ahead_tests and bug_1774_corpus_merge_gate_tests, but parser tests alone are insufficient. No tests, implementation, grants, queue/status/hold changes, commits or merges were performed by this author. The revision answers review blockers 1 (records/producers/coverage) and 2 (canonical typed candidates/publication/all consumers); the independent advisor must judge the design, not infer signoff from this mapping.

    V3 baseline evidence (all at 199e591b07aa76a59cd34f0a41946f918501f6ba)

    - `aida-cli-lib/src/commit.rs:306` runs Git without retained operation state; `aida-core/templates/hooks/aida-post-commit.sh` is best-effort no-verify telemetry and can return early. `pr_cmd.rs:447,650` owns actual PR-rebase execution. These require the new operation protocol; none already proves attribution.
    - `seat_authority.rs:17,104,159,235` separately mints grant session IDs and validates only immediate parents; `session_manifest.rs:77,147,173` has no operation/assignment fields and discovery skips errors. `agent_registry.rs:636,686,912` writes registry entries, not immutable complete attribution.
    - `lib.rs:32510,32614` spawns then registers; `session.rs:1179,1221,2769,3035,3063` shows differing issuance/spawn paths. `lib.rs:29446,29675` hands --bg to Claude and later parses native ID; no actual vendor PID is retained. `pane_host.rs:154` hosts a shell command with a return-code rendezvous, not a pre-exec identity handshake. `process_probe.rs` reexports OS start/ancestry helpers from core liveness; extending proof is required, not assumed.
    - `aida-tui/src/app.rs:1147,1355` launches queue-work via PTY. It does not generally pass --no-launch; v2's TUI shortcut is corrected. Its Codex resume fallback at queue_work_argv must not reclassify resumed identity as fresh.
    - `lib.rs:95825,96318` recorder uses name/type attribution fallback; `pr_ship.rs:1628` filters parse/read failures; `review_verdict.rs:1129` copies prior JSON fields; `lib.rs:9473,9486` consumes/stamps drain approval; `pr_cmd.rs:2393` acquires merge lease and repeats gates. The proposed START assignment, strict invalid candidates and shared validator replace those authority gaps.

    V3 exact barrier witnesses — PROPOSED acceptance tests, none run

    - Extend `review_record_covers_later_head_cli` with ordinary commit and `pr rebase`/amend barriers after actual new HEAD but before `finish_operation`; drive real start/record and real pr ship (including a previously valid round). Both refuse while pending, after parent/Git death, missing post-commit/post-rewrite/reference callback and partial manifest finalization. A previously unknown source replaced by amend/rebase remains blocked. Fully observed source rewritten by another actor succeeds only with union of both actors; dropped/squashed source contributor remains. Raw unwrapped Git is explicitly refused; hook bypass produces an untrusted head, never an ordinary FINAL witness.
    - Extend `review_record_concurrent_rounds_preserve_refusal`: reviewer starts at H/R0, barrier, another reviewer publishes refusal R1, original records with retained R0. Must refuse rather than adopt R1. New review start after R1 may submit only with ordinary corpus/hold closure rules. Concurrent head movement behaves identically.
    - `review_launch_first_action_requires_bound_identity`: actual foreground agent-new, queue fresh/headless, standalone reviewer, phase direct/background/pane and real TUI PTY launch. Fake vendor's FIRST action commits or starts/records review. Delay/fail bind, drop release channel and kill parent before release: sentinel absent; pre-COMMIT failures have no invocation lifecycle residue. Post-COMMIT/pre-release crash retains setup, cannot auto-respawn. Native agent-new --bg and unimplemented containment/platform adapter refuse before mutation with named unsupported diagnostics.
    - Extend independent-granted-reviewer and reissued-grant tests with bound sibling positive, author/resumed-author/author-descended negative, missing env with valid OS ancestry positive and missing identity at PTY negative. Exercise phase attempt/member mismatch, nondelegating assigned-child positive, resume without second issuance, real TUI setup and later activation.
    - All retained v2 witnesses above remain: malformed candidate alongside valid approval still blocks; archive retention, cleanup/rework identity, explicit ancestor/reviewer revocation vs natural expiry, drain handshake, refusal-release/corpus and exact-head under-merge-lease recheck, closed legacy history unchanged. Unit helpers alone do not satisfy these witnesses.

    Support limits / disposition

    No implementation or test pass is claimed. Native daemon --bg has no demonstrated pre-exec adapter; raw unwrapped Git and opaque import/rewrite have no authenticated pre-operation source producer; containment/platform variants require real process adapters. They are explicit refusals, never fabricated complete evidence or human fallback. This design can be signed with those fail-closed boundaries under the binding supported-operation policy; if positive compatibility for one is required, that exact adapter remains a blocker. No acceptance reduction is proposed. A DIFFERENT advisor must judge v3; author supplies no approval.
