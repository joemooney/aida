    Common owner decisions are callback `01a119af-a347-7961-b01d-66603478a59b`, launch `01a119b5-ea32-7ed0-b5e9-11858700f78b`, and pane/containment `01a119d7-0711-7613-9c2a-c0643b331549`. The last explicitly judges the common production architecture coherently designed AS AMENDED; its canonical body agrees with its exact receipt. The common doer's active branch `bug-1808-delegation-publication` and TASK-1612 activity supply no implementation proof here. Earlier narrow approval did not approve BUG-1802 wholesale; this comment supplies that distinct policy judgment.

    Binding A–E and independent amendments prevail over author prose. V4's advancing-default/refinements and v5's six callback conditions remain in full. The signed common launch and pane supersessions apply to BUG-1802's copied v3 launch paragraphs as well: no duplicate standalone publisher, old home-held RELEASE, path-only vendor exec, second mutable-authority check for the same committed dispatch, or invented pane fallback survives. No competing grant/assignment/receipt/launcher/publisher format is authorized.

    Readbacks, input matches and source hashes are retained in `bug1802-final-policy-evidence/`. Inspected source paths have no diff from pinned main. Some initial combined reads exceeded output limits; relevant policy sections were read separately. Hashes establish document/source provenance only. No source edits, builds, tests, live launch/crash experiments, status/queue/grant/hold mutation, new spec, code-review record, cleanup, commit/push or merge were performed.

    ## 1. Actual reviewer and grantor identity; complete independence

    APPROVED with binding A/B/E intact. Use one typed resolver for Granted, DirectHuman, Missing and Invalid. Authenticate actual subject/process/session/grant and canonical repo/assignment joins, not role strings, queue identity, a supplied handle alone, Git author/email, trailer, PR prose or the display recorded_by field. Validate all parent and predecessor edges, cycles, retained historical roster issuance evidence and active delegation ceilings. Actor identity survives role reissue, environment omission, lease/registry cleanup, rework and verified conversation resume. Historical evidence remains retained when active ownership ends.

    The contributor set includes every original source actor, transformer, writable/dirty participant and predecessor episode. Reviewer actor and every actual authority ancestor must be independent of that set. An implementing driver cannot create an independent reviewer by launching a child. Two distinct reviewer/implementer children of a NONimplementing driver remain valid despite shared Unix principal and common driver ancestry. The nonimplementing driver's launcher activity alone is not authorship.

    Binding concretization of the already signed actual-human requirement: `issue_direct`, the direct review START/record path and any grantor used as the independent root must resolve the actual terminal principal and retained shell/process identity. On the supported local Unix path, use kernel process credentials and the account mapping, corroborated terminal/session/process ancestry, with stdin AND stderr TTY and explicit target/head/independence confirmation. `current_user_id(None)` currently reads AIDA_USER/USER/USERNAME and is a queue selector, not that authentication mechanism. Caller flags, those strings, missing agent environment, a fresh shell name or PTY allocation cannot mint a different human or discard positive managed ancestry. Unknown or contradictory attribution refuses. The direct human grantor's retained human identity must participate in ancestor/contributor exclusion when that human implemented the target; comparing only newly minted grant UUIDs would be insufficient. A human principal shared as host by independent managed children is not itself proof that the human authored their work.

    This concretizes A and the v3 retained-human-manifest/issue_direct rules without adding a broker, identity store, grant class or delegation. It guards supported workflows. It does not resist hostile same-UID edits to local evidence, arbitrary OS manipulation or direct use of a forge admin credential. Worker sandbox bypass supplies no AIDA grant or TTY exception.

    Required proposed witness: independent direct-human terminal START/record succeeds; an implementing human changes AIDA_USER/USER and opens another shell, or a managed author unsets grant/name/type/role and opens a PTY, and cannot acquire independent approval. An implementing direct grantor's reviewer descendant refuses; genuinely independent sibling children of a nonimplementing driver succeed. Missing/cyclic/reparented/ambiguous evidence is refusal, not human fallback.

    ## 2. PRE/PENDING/FINAL and the accepted-default work set

    APPROVED. Existing retained SessionManifest evidence and common assignments are the owners; verdicts reference them. Actor UUID, manifest/lease UUID, native conversation ID, assignment UUID and activation attempt remain distinct joined identities. Parent-controlled actual PID/boot/start binding precedes writable vendor execution. No child can self-issue or make its first write before binding. Cleanup of transient receipts or live registry rows cannot erase contributors.

    Before any supported Git mutation, capture immutable old head/tree/generation, exact sources and actors, participants, operation/effect identity and object attachments. PENDING precedes shared effects. Post-commit or status 0 is not completion. FINAL atomically joins accepted head/generation with complete authenticated observations and conservative source/transformer union; every relevant episode must expose the same complete digest. Pending, missing callbacks, partial mappings, unknown old sources and dirty handoff gaps block START, NEW record and ship, including consumption of an earlier valid approval. Source obligations persist when rebase/amend/drop/squash removes their SHAs from the final DAG. Recovery can use already durable exact evidence; it cannot invent a missing map, infer success from an empty result, or call a changed/uncertain operation unchanged ABORT.

    Retain immutable B; capture old obligations against C_previous BEFORE considering a newer default F. The pinned observation records actual configured forge project/default ref, full objects/DAG, closure records and complete authoritative pagination. Authoritative empty associations and unavailable/partial results are distinct. Known squash/merge associations with missing or contradictory closure cannot become direct-default commits. Define exactly:

    `W(H) = (R(H) minus (R(B) union C)) union O`.

    C excludes only unrelated accepted default history from the first term. It cannot subtract O, participants or sticky gaps. K unions W's original/transformer contributors and all open-lineage participants. An unrelated closed squash M requires no fabricated local author. START pins B/F-observation/W/O/K/FINAL digests; record and every consuming gate use those SAME facts. New default advancement alone cannot shrink obligations. Relevant local reopen history/markers, holds, open episodes and closure generations are revalidated at BEGIN, START, record and ship under the merge lease; a stale forge closure cannot conceal a local reopen.

    The actual producer boundary is before PR rebase Step 3 and forced pr-N fetch, not Step 6. `run_git_commit`, PR check/default/onto-parent/continue/abort, `cascade_rebase_stacked_branches` reached through real pull --auto, finish ceremony, rebase --auto and known dirty auto-stash all consume the one common Git adapter. Private refs/worktrees and expected-old CAS preserve old source evidence and peer state. Missing old sources refuse before fetch/ref/stash/cleanup effects. Unsupported raw/import variants remain honestly refused; those refusals cannot replace mandatory ordinary positives. No H-minus-B-only or HEAD/trailer authorship shortcut is accepted.

    ## 3. START, record, candidate set, corpus and release

    APPROVED. Review START is an actual retained assignment produced before reviewing, tied to authenticated reviewer, canonical UUIDs/project/PR, exact full H and explicit parent round or ROOT plus generation. Record cannot create START implicitly or adopt whatever refusal became current while the reviewer was working. Under the canonical lock domain it validates START, target/head, source coverage, authority and all relevant candidates BEFORE hold/verdict/marker/event/status effects. New authority envelopes replace rather than inherit prior fields. Archive/current publication and conservative derived markers preserve evidence if a later transport write fails.

    Typed candidate discovery must preserve Absent versus Invalid, malformed/unreadable relevant paths, inaccessible directories and missing referenced rounds/manifests/grants. An invalid candidate still blocks beside a valid one; no `.ok()` filter, `find_map` first-valid selection or bool-false-as-absence can erase it. Well-formed unrelated closed history may be excluded by validated target/closure; an ordered valid fresh round may supersede an old target round while preserving it. It cannot repair unknown implementation authorship. Keep historical closed files/rounds/refusals/findings/closures untouched. No bulk inferred migration or attribution-repair override is approved.

    Coverage and existing review/corpus/rework obligations are checked independently of whether discovery found an approval. A genuinely absent candidate set permits the existing no-review-required path only when there is no relevant review/corpus/rework obligation and no blocking work-evidence gap. Unknown legacy open work cannot become shippable simply by deleting or failing to parse its candidate.

    The same structured decision governs `approval_head_refusal`, `open_approvals`, `approved_match_head`, `ship_preflight_gates`, `pr_ship_approval_gate`, `ship_refusal_release`, `merge_hold::refusal_release`, `enforce_corpus_gate_before_merge`, drain merge/handshake/sibling-adoption/fallback, and queue-done/rework-release equivalents. Identity validity does not discharge findings, clear human holds or weaken stale-definition/supervision gates. `--override-stale-approval` cannot override wrong identity, target, provenance, START or coverage. CI stamping is transport on an existing round/head; it cannot become reviewer authority or carry old authority to a new head.

    Binding CLI/MCP concretization: baseline MCP exposes queue_done/status/rework paths, not a direct review-record tool. Do not claim a nonexistent recorder already shares the fix. Existing relevant MCP lifecycle/closure consumers must call the same guarded decisions before mutation; any later START/record surface must use those same decisions. A supported per-client stdio server resolves its own actual launch/process ancestry to the client's retained bound actor, carries that authenticated context into library calls, and revalidates current authority per operation. Server respawn must preserve the join or refuse. JSON `user`, role/name/environment, tool parameters and an asserted client session ID cannot impersonate another reviewer. An unbound/shared/multiplexed server without an authenticated caller join refuses authority-bearing policy actions; it cannot borrow its supervisor's advisor grant or direct-human TTY path. This is the existing process-join/fail-closed policy applied at the actual MCP boundary, not a new authentication transport or permission expansion.

    ## 4. Expiry, revocation and exact-head ship serialization

    APPROVED with D preserved. Validate live authority and complete delegation ancestry at recording; retain record-time validity and issuance roster evidence. Natural time expiry or ordinary process exit after a valid record does not erase that review. Explicit reviewer/relevant-ancestor revocation, including current role-end behavior, invalidates subsequent use for an unmerged target. Current explicit roster removal and ambiguous/missing durable authority remain blockers. Reissue does not renew an old revoked approval. Closed historical work is not reopened by rollout or later revocation.

    After CI, ship must reacquire the prescribed home-first domain and merge lease, reread the authoritative forge head and canonical candidate/START/parent generations, revalidate pinned coverage plus current local blockers, then submit an exact-head merge. No old target_change/envelope/head snapshot or successful CI substitutes for that check. A concurrent new refusal cannot be overwritten or outranked by timestamp alone. A retry after uncertainty must establish whether the exact merge occurred, and otherwise revalidate; it cannot replay a cached authorization at another head.

    Binding lock composition, to avoid reviving superseded v3 behavior: home -> repo -> sorted seats when needed -> store -> queues -> drain -> manifests/episodes -> verdict -> merge -> Git remains the acquisition order. Ship does not launch a child or commit occupancy. Any needed seat observation is taken before lower locks and the seat lock is released before forge/network I/O. Home remains held across this short final authority/verdict check and exact-head merge submission, so enlisted grant/roster/seat writers cannot interleave a supported mutation after the sample; retained repo/episode/verdict and merge guards preserve the target generation. Do not reacquire seat beneath the merge lease. Sample time-sensitive current predicates at the final check; historical review expiry follows D. No CI polling, Git callback, child wait, backoff or forge request runs under seat. On a retry requiring dropped guards, restart validation in order. This satisfies both v3's authority serialization and the common launch/ADR seat-wait prohibition; it is not a second durable merge permit or a new grant. Existing merge-lease lifetime for subsequent pull must be reconciled with home-first acquisition rather than reentering home beneath it.

    Proposed witness: race explicit revocation/refusal/head movement after preflight and at final submission; whichever supported mutation wins the serialization determines refusal versus exact-head submission. Instrument seat ownership during fake-forge delay and assert none; verify no reverse home acquisition during retry/pull. Natural reviewer expiry control remains valid, explicit role-end revocation does not. These are required tests, not passes.

    ## 5. Common publication, launch and callback composition

    APPROVED as consumption of the already signed owner architecture. BUG-1808 alone owns home discovery/recovery, finite current-locked preimages, coordinator/journal, shared assignments/activations, immutable COMMIT, retained receipt/history projection and purpose-separated transport. Discover/recover A before selecting B's lower locks. PREPARED restores exact owned effects/full history while preserving peers; immutable or uncertain-visible C never rolls back. Storage faults forbid release. Missing/corrupt evidence blocks, status 0/empty output does not supply it. Retain receipt, possible-execution intent and UUID-idempotent existing history before coordinator retirement. No new global provenance ledger substitutes for these records.

    Use final P4 authority/process/member/attempt/image/optional-occupancy sample after provisional finite work. Before C, losing authority causes exact rollback; after C, the original live bounded bootstrap/channel consumes the one historical immediate dispatch after locks drop. New PID/channel/attempt, delayed setup-only activation, retry/resume or recovered publisher needs new authorization. Recovery never releases vendor or infers nonexecution from lost ACK. Preserve actual native leaf identity, sealed helper/leaf, creating-thread/lifetime/FD rules and no privilege expansion.

    Pane/containment condition 5 remains the default no-PID, still-anchored owned group cleanup and PTY pause/resume contract, not arbitrary-descendant extermination. Tmux/relay/Node/bwrap/supervisor/tab IDs are not reviewer identities or TTY exceptions. Actual bound leaf and original contributor ancestry govern. Required pane/PTY/no-PID/installed-Codex positives remain implementation gates; unsupported native daemon/platform refusals do not satisfy them.

    Git-only PreparedGitStep cannot construct vendor CommittedDispatch, and vendor's trusted-system-loader concession cannot weaken Git's closed independently snapshotted runtime/config/includes/attributes/fixed hooks. Preserve the six signed callback conditions: exact supported version/backend/phase grammar, actual original input and mappings, credential-free external preparation, genuine formatter/restaging/store-trailer/skill-sync/gate effects, non-reentrant bounded parent pump, immutable decision/predeclared observation namespaces and fresh recovery credentials after proven quiescence. SERVICE exact-installed verification never fabricates missing WORK callbacks or clears sticky source gaps. Callback-capability/PID/ancestry alone is not origin proof.

    This consumer is never a prerequisite to generic common code/team/store positives. No common code edit, production activation, copying unreviewed TASK-1612 work or parallel schema follows from this review.

    ## Source verification and acceptance still owed

    At pinned main, these remain implementation seams, not delivered defenses:

    - `lib.rs:95825` handle_review_record_at derives a string identity and performs protection/verdict/marker/event/status writes; `lib.rs:96318` labels missing name/type as operator. `lib.rs:9486` stamps drain reviewer metadata. The proposed typed authority/START boundary must precede those effects.
    - `seat_authority.rs:17,104,142,159,235` has no retained actor/assignment joins, validates only the immediate parent, tests managed environment for direct TTY issuance and mints separate actor IDs. `lib.rs:97728` uses environment queue identity. These cannot be reused as authentication proof unchanged.
    - `session_manifest.rs:77,147,173` lacks the proposed evidence and has best-effort corrupt-record discovery; AgentRegistryEntry has native/resume pointers but lacks the full durable join. `lib.rs:106723` OrchestratedLeaseReceipt is a transient conversation/lease/branch/worktree record. Retention and strict authority discovery are required.
    - `review_verdict.rs:154,1129` lacks the typed envelope and copies prior object fields. `pr_ship.rs:1628` drops parse/read failures. `pr_cmd.rs:1539` selects the first readable release candidate; `merge_hold.rs:2078` releases based on approval/head. Existing corpus protection at `merge_hold.rs:2690` is valuable but not reviewer authentication.
    - `pr_cmd.rs:2393` currently acquires the merge lease before repeated gates; adopting home-first authority guards requires changing that order and the downstream pull/retry path. `mcp.rs:4214,6221` currently supplies lifecycle/status behavior and ambient-role plumbing, not this complete review-policy decision.
    - `commit.rs:306`, `pr_cmd.rs:447` and `lib.rs:74844` expose bare commit, pre-rebase fetch/ref replacement and cascade rebase seams. `internal_cmd.rs:17`, real pre-commit hook gate calls, core git_ops/team/git_backend auto-commit paths establish the shared Git integration obligation. They do not already implement PRE/FINAL or callback-origin proof.

    All earlier proposed witnesses remain mandatory. Use actual built CLI/MCP/drain/foreground/reviewer/PR-rebase/cascade/finish/auto-stash paths with isolated HOME/AIDA_HOME, fake forge/vendor, production hooks, deterministic barriers and owned processes. Preserve paired positives, not helper-only refusal tests. In particular:

    1. Self-review after role/env/resume/reissue/cleanup; full parent/direct-grantor exclusion; valid independent siblings/direct human; actual bound MCP context and forged/unbound context refusal.
    2. Pending old/new head barriers, dirty participants, dropped unknown sources, partial cross-episode completion, crashes before/after callback/FINAL, retained exact recovery.
    3. B->M unrelated closed squash and witnessed X->X' rebase with A/T excluded and M-only Q allowed; unknown X remains blocked; last-page blocking forge association, unavailable versus authoritative empty, reopen/hold after observation.
    4. START H/R0 followed by refusal R1; stale record refuses unchanged. Malformed/missing/local/archive candidate alongside valid approval blocks. Unknown legacy cannot be repaired by fresh review. Closed fixtures remain byte-identical.
    5. Actual corpus/refusal-release/queue-done/drain transport, current head/round/generation under merge lease, explicit revocation versus natural expiry, CI transport unable to self-authenticate; authority/candidate lock and MCP parity witnesses above.
    6. Common actual-entrypoint launch/publication/callback/image/pane/containment/cross-repo/durability and required ordinary code/team/store positives, followed by policy integration against the independently reviewed exact common dependency. Full state/refs/reflogs/index/history/peer/process/FD evidence; later guard-removal/restoration nonvacuity remains required.

    No test was run here. No proposed witness, document hash, component design signoff, active implementation branch or old BUG-1802 docs-only worktree at b409b5ae3ebb7c6e1e354d5ee77492d1f048ef32 is a security fix or implementation proof. That old worktree was not modified.

    Final disposition: APPROVED FOR BUG-1802 POLICY DESIGN AS AMENDED, with the bounded identity/MCP/lock concretizations above and every prior binding condition. Implementation/dependency acceptance, required positive/negative witnesses, fresh independent exact-head code review, CI and Joe/operator's authority-sensitive merge remain mandatory. No source or lifecycle work is authorized by this comment beyond the separate doer's existing assignment. Exact canonical posting/readback/provenance and advisor notification are saved separately in BUG1802_FINAL_POLICY_SIGNOFF_RECEIPT.json.
