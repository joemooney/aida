- id: 01a11990-78a8-7780-9055-0b76eeec7049
  author: codex/authority-sketch-v4-author
  content: |
    SKETCH (awaiting advisor signoff): BUG-1802 — v4 normative addendum, callback join and pinned accepted-default coverage

    Author: Codex authority-sketch-v4-author, native thread 01a11985-64f1-7150-96d8-e92930acab65, Joe-assigned separate REVISION AUTHOR, 2026-10-07 America/Phoenix. AIDA_SESSION_ID absent; no authenticated review grant asserted. This is authorship, never approval. Design only; final authority-sensitive merge is Joe's. All new symbols/records are proposed.

    ## Exact amendment and precedence

    Amends BUG-1802 v3 canonical comment 01a1197c-168c-7202-a129-e447a086efd7, matching BUG-1802-sketch-v3.md exactly: 51042 UTF-8 bytes, SHA256 165f0ce49e4a80788a9ec4cfa1c1e740c3d06ed694f359a9825e5fe5292d3b1f. Baseline 199e591b07aa76a59cd34f0a41946f918501f6ba. Read actual INDEPENDENT_SKETCH_V3_SIGNOFF.md, including canonical BUG-1802 verdict 01a11982-f260-7fd2-ae09-18e3c614ef4a. SKETCH_V3_READY.md is an author notice, not approval.

    Earlier policy A–E and binding independent v1/v2/v3 decisions take precedence over author text. Under those constraints this addendum supersedes ONLY:

    1. “Bounded work-operation protocol”, paragraph “Named new producers…”: the clause making `observe_ref_update` and `retain_rewrite_mapping` take home/repo/episode locks is replaced by the transport below. Begin/bind/finalize still use ordered guards in the parent. Hook processes never do so. Operation-state steps 2 and 5 use the durable callback/recovery rules below; FINAL remains parent-owned.
    2. Supported-operation table, PR-rebase row: replace “Begin before Step 6…” with before-ANY-shared-fetch/ref/worktree/staging-mutation preparation below. Replace the unqualified sentence “Accepted base contributors need not be retroactively reviewed…” with the precise accepted-default closure and covered-work formula below. Preserve all original/transforming open-work contributors and sticky gaps.
    3. Paragraph beginning “For head H, shared validate_work_coverage…”: replace FULL DAG H minus B alone with FULL DAG minus the validated pinned closure PLUS retained source obligations, as formally defined below. B is still immutable. The original side-parent, unknown-source and missing-manifest rules remain.
    4. “Standalone publication requirements for this bug”: replace “adoptable … without assuming BUG-1808 has shipped” and any independent implementation implication with BUG-1808-first ownership. Also replace “For standalone BUG-1802…” in canonical publication with use of the already delivered shared service. Shared launch L0's “even if implemented separately” no longer permits a second launcher. Its L1–L4 behavior, assignments, actual-process binding and v3 adapters are unchanged.
    5. Review START/envelope schemas gain pinned coverage observation IDs/digest as below; no existing expected-head/parent-round/generation/actor constraint is removed.

    Everything else remains normative: contributors including dirty handoffs; stable resumed/reissued actors; independent siblings under a nonimplementing parent; complete ancestry; malformed candidates blocking beside valid approval; ordered refusals/archives/closed history; natural expiry versus explicit revocation; corpus, drain, refusal-release, under-merge-lease and exact-head checks. Native daemon --bg, raw unwrapped Git, opaque import and unavailable OS/containment adapters retain only the boundaries explicitly accepted by v3 signoff. No additional positive is silently removed by a generic “unsupported” sentence.

    ## Shared callback/publication contract consumed here

    BUG-1808 FIRST owns and independently verifies the single LaunchPublisher, PublicationGuard/coordinator, assignments/activations/receipts and `git_publication::{GitPublicationAdapter, CallbackPump, PreparedGitStep, HookClient}`. Its v4 addendum BUG-1808-sketch-v4-addendum.md (SHA256 7ed0561699c5f184572612e03f19b72aa3e06cf049eb4ea6958ef45da369e4f2) defines that complete common substrate; BUG-1802 adds work policy, accepted-default observations and review START/verdict enforcement only. No duplicate launcher/schema, no dependency of BUG-1808 reviewer identity binding on this policy. This addendum is separately signable as the later consumer contract, without pretending the substrate is already implemented.

    The one selected mechanism is a parent-serviced private local socket with bounded parent-written immutable observation attachments, NOT hook acquisition of home/repo/episode locks. Hooks dispatch `aida internal git-operation-callback` before ordinary CLI discovery. Parent owns a 0700 operation directory/0600 socket; OS peer credentials, PID/boot/start, exact live bound Git ancestry, executable/hook bundle and canonical physical/logical repo/worktree identities authenticate every callback. A capability sent to waiting Git bootstrap over its private inherited descriptor is also required; env op/path/nonce or a Rust guard alone is never trust. Dead/stale/sibling/wrong-repo callers fail. Parent's event loop services callbacks while polling Git exit, never blocks in status/wait instead of pumping.

    PreparedGitStep and each authenticated observation bind publication/work-op ID, step/attempt, journal generation/digest, repo key plus actual gitdir, command/hook/gate digests, exact ref/HEAD identity and full old/new OID tuples. For code construction whose new OID is not known before spawn, parent validates prepared tuples against the predeclared finite refs/command/source/parent/tree grammar and fsyncs a bind-once exact tuple subrecord BEFORE ACK. Committed/aborted use that same tuple digest; post-rewrite additionally retains numbered complete old/new mapping frames and terminal count/digest. No namespace-only exemption for service refs. The pump uses only preloaded immutable context, read-only object decoding and its preopened attachment directory; it does not acquire AIDA/Git locks, call normal Storage/gates, or run mutating Git. Hooks only stage evidence; they never publish FINAL or COMMIT.

    Parent fsyncs each numbered content-hashed observation via temp-write/rename/directory-fsync before ACK. Partial temp frames are not proof. Exchange timeout defaults to 5 seconds, frame <=1 MiB, ref transaction <=4096 tuples, total default attachment budget 64 MiB, finite predeclared step deadline; planning can select a larger finite configured budget before mutation. Missing/oversized/reordered/conflicting callbacks fail closed, not into global hook ignore. Limits cannot remove required positive fixtures. Parent death may follow prepared permission but precede the actual ref update or committed observation; neither ACK nor exit code proves completion.

    Begin publishes PENDING plus exact effect reservation under home/repo/sorted episode locks BEFORE any shared staging/fetch/ref effect. Release locks during private Git construction. A supported writer seeing the reservation and wanting the same ref/index/worktree refuses boundedly before taking Git locks; it never waits holding home for this parent. Other-repo/unrelated writers may proceed. Shared installation reacquires home first and holds the publication guard through callbacks, using the pump without reacquisition. Review START/record/ship refuse while PENDING even if actual HEAD is old or new. Completion requires the full cross-episode completion digest and exact final source/witness state, never merely a commit callback.

    Existing integrity gates run over exact prepared contents: owner first stages/formats privately, seals tree/diff/message, evaluates advisor-code, locking, scope, ignored-path, doc-provenance, applicable store bulk-write and commit-message policy. Real production pre-commit callback checks the SAME sealed tree and policy snapshot through pure parent evaluation. Any changed tree repeats preparation/gates BEFORE release/install. Each rewritten commit generated without Git invoking pre-commit must explicitly receive this same prepared-content gate evaluation before shared installation; do not claim Git runs that hook for rebase. GateReceipt pins exact objects, logical original root/actor and policy/hook digests; P2/P4 validates locked read-set equality. Existing warning/enforcement distinctions remain. No --no-verify, env bypass, skip-all-hooks, disabling integrity gates or home release around provisional shared state. Hook formatting/restaging/sentinel/telemetry effects are moved to owner-controlled preparation/journaled publication, not dropped.

    Journal every effect: refs/HEAD/retention pins and exact old/new; reflogs; objects; index and its locks; affected tracked/untracked files/modes; formatter edits; temp/final worktree admin/gitdir; ORIG_HEAD, FETCH_HEAD, sequencer/rebase/stash state; signal/sentinel/event outputs. Private physical roots map explicitly to logical code root for gates. An unchanged abort means exact preimages restored, not “HEAD looks old.” Parent/recovery cannot roll back over a peer's later committed edits.

    Recovery with publisher dead enters home first; it validates durable operation/publication and quiesces the exact old Git child by PID/start before effects. It uses a NEW callback step/socket/child binding tied to original decision/effects, not dead credentials. Service COMMIT can roll forward exact journaled installs with retained gate proof and newly authenticated recovery observations or exact already-installed verification. It cannot synthesize code callbacks or contributor maps. WORK finalization needs already durable complete PRE-source and callback evidence; missing post-rewrite/uncertain source stays PENDING/GAP. Only proved unchanged state/dead child/no unexplained transitions can ABORT. Complete durable observations surviving parent death may permit the same operation to FINAL under ordered locks; parent death alone is not a permanent gap. Torn/missing/corrupt proof is never repaired from email/patch-id/reflog/current default. Ref/index recovery mutations also use the pump. This avoids both ordinary Git's reversed lock order and publisher/recovery's recursive home wait.

    Service-generated store (`refs/heads/aida-store`), exact selected branch create-only, and `refs/aida/retained/<publication-or-operation>/<object-id>` pins belong to BUG-1808's typed producer/effect adapter. They are not implementation witnesses or reviewed-code exemptions by spelling. Ordinary `team` roster CAS, Storage spec/comment/history writes and store pull/rebase/structural-merge remain supported through its private preparation/current-locked publication adapter. A team/store writer under home must not call unadapted Git that invokes ordinary AIDA gate discovery. Ref creation for a feature at a base does not prove any later authored work.

    ## Accepted-default observation BEFORE mutation

    Keep episode admission anchor B immutable, including its exact retained repo/object identity. Add a separate immutable attachment to that episode's existing lineage manifest:

    `AcceptedDefaultObservation {id, episode_id, repo_key, forge_project_id, remote_identity, default_ref_fullname, frontier_oid F, previous_observation_id?, captured_at, before_operation_id, before_accepted_head, before_accepted_generation, before_obligations_digest, fetched_object_closure_digest, reachable_set_digest, default_query_digest, closure_items[], validation_digest}`.

    This is evidence of accepted DEFAULT history, not authorship, a grant, a mutable replacement for B, or a new global ledger. Its producer is proposed `work_evidence::prepare_accepted_default`, called by the operation planner BEFORE rebase or any local branch replacement. The first observation is B's admission evidence. Later observations are appended, never overwritten. Objects and complete reachable-set attachments are pinned/packed with the same existing manifest/operation retention owner before Git release. Observation IDs/digests are copied into the immutable operation, FINAL completion and review START; caller flags cannot manufacture them.

    Production order:

    1. Under guarded read capture H0, accepted generation, all old open-source obligations and participant/dirty-handoff/gap evidence against the PREVIOUS pinned closure. Validate those obligations FIRST. If source X is unknown, retain/refuse that gap BEFORE considering a newer default; X cannot disappear by appearing in F. Re-read this exact state at begin. No moving-ref reconstruction after rewrite.
    2. Outside shared mutation, resolve configured forge PROJECT identity and its authoritative default ref (not arbitrary --base, current local branch name, PR head or AIDA_DRIVE_ROOT). Query exact default tip F and fetch that exact ref/object closure into an invocation-private repo; re-query to ensure returned ref/oid and fetched tip agree. Reject wrong project/remote/ref/object format, shallow/missing ancestry, ambiguous identity or inconsistent replies. Pin full OIDs and full DAG including side parents. A concurrent default advance causes retry at preparation; after the observation is accepted it does not silently change F.
    3. Validate F is a descendant of B and of any previous accepted frontier. Non-fast-forward default replacement does not advance coverage automatically; before-mutation refusal preserves old episode and needs separate grounded handling. This is no claim to repair a rewritten default. Resolve each newly introduced squash/merge closure item through the forge's actual merged change record: project, PR/MR ID, terminal MERGED state, default base ref, exact merge result OID contained in the fetched DAG, source head/parent identity where provided, and retained closure/canonical round reference where AIDA has one. Persist normalized result and response digest. A missing response is not a closed PR. Validate relevant local closure/hold/reopen history; contradictions or a still-open episode remain blocking. Direct default commits are accepted only as default-history observations from the authenticated configured forge/ref, not fabricated PR closures or code witnesses. An existing local open-source obligation always takes priority over this classification.
    4. Form the accepted-default closure C = Reach(F) minus Reach(B) from those validated objects/observations. Record closure membership with the observation, and why newly accepted objects are default history. The observer does NOT assign the squash M to its merger, Git author, PR author or prior feature actors. No author is needed for an unrelated, closed default object. The manifest still retains every original source witness and old obligation, even if its SHA also enters C. No “default ref says so today” exemption at START/record/ship.
    5. On begin, under ordered locks compare H0/generation/old obligations/gaps/read-set against step 1, verify observation identity/object hashes and closure predicates, then attach observation to PENDING before child release. Rebase uses exact F OID, never a ref that can move while Git runs. A --base pointing at an open stacked branch cannot mint C: its complete side/source DAG instead requires ordinary retained contributor evidence. Successful rebase does not mutate B or clear gaps. Unknown source refusal occurs before shared fetch, forced branch replacement, temporary-worktree removal, stash, index edit or Git rebase.

    Acceptance of unrelated default history is distinct from discharging prior feature obligations. If an open episode later closes, retain that closure separately with canonical exact target/round/forge evidence; this rebase adapter cannot close/reopen the episode, erase contributors or confer approval. Observing a forged/reopened/mismatched closure does not heal work. Missing prior open-work discovery cannot be inferred empty just because the current default includes its patch.

    ## Exact covered-work set at START, record and ship

    Let R(x) be the full commit DAG reachable from full OID x, not first-parent ancestry. Let C be the union of valid pinned default closures referenced by this episode's FINAL completion (monotone observations may equivalently use the latest F). Let O be the monotonically retained source-obligation set for the still-open episode:

    - At admission/first legitimate operation, enumerate all open work against B and any already validated prior closure, including side parents and imported/selected source commits; an unexplained initial diff is a gap, not empty O.
    - Before each rewrite, append `(R(H0) minus (R(B) union C_previous))` and every selected non-default source DAG, predecessor episode source obligation, and prior operation's source obligations to O. Retain known original contributors and unresolved gaps before considering C_new. Include skipped, dropped, squashed and conflict-resolved sources. O is never recomputed from H1, nor reduced by C_new.
    - Append new resulting work witnesses/participants and retain the transform actor. Writable participants with no commit remain contributor obligations even though they have no SHA in O.

    For reviewed H the required witness domain is

    `W(H) = [R(H) minus (R(B) union C)] union O`.

    Every member of W requires exact object/tree/parents plus authentic retained operation/source/contributor evidence. Membership in C removes ONLY unrelated accepted-default DAG objects from the first term; it does NOT remove O, participant obligations or any sticky gap. Require accepted.head == H, exact FINAL/cross-episode completion digests, no relevant pending/gaps, complete immutable source attachments and valid observations. Contributor set K is union of all W witnesses' source/transformer actors, predecessor obligations and all writable/dirty participants in the open lineage, never git-author names and never automatically actors from unrelated C. For multi-spec PRs take union of every relevant episode; a closure classification for one cannot hide open obligations of another. Conservative original source+transformer union applies even to dropped commits. Complete ancestry-based reviewer exclusion uses K unchanged from v3.

    `review_start::prepare_assignment` pins `{B, observation_ids/digests, W_digest, O_digest, K_evidence_digest, FINAL generation/digest}` along with H, parent round/generation, actor and target already required by v3. Recorder re-evaluates those exact pinned facts, compares head/generation/current candidates and retained source references, then publishes an envelope referencing them. Ship and every drain/corpus/refusal-release consumer re-evaluate the SAME envelope facts at preflight and under merge lease. They do not sample current default to shrink W. A new work completion/head requires new START. If default merely advances after START, the old accepted observation remains historical fact; that alone does not attribute new authors or invalidate a review of unchanged H. Actual target/base policy changes still trigger existing stale-definition/head/corpus gates.

    Positive: B -> forge squash M on default; independently witnessed feature B -> X by actor A. Before rewriting, O contains X and A's complete evidence. Observe default F=M with actual merged unrelated change closure; C contains M. Actor T rebases X to X' onto exact M; all source/map/transform evidence reaches FINAL. W contains X' and retained X, but unrelated M needs no local work witness. K contains A and T (plus feature participants), not actor Q who only authored unrelated closed M work. Independent reviewer Q can START/record for X' with the usual valid reviewer grant; author A, transformer T and their descendants cannot. No invented squash authorship is used.

    Negative: old feature X lacks provenance, or a dirty/source gap already exists. Step 1 refuses before mutation and retains blocking discovery; even if M later includes X or its patch, C cannot clear it. If hooks were bypassed and X has already been rewritten away, retained old PENDING/source set still blocks. Fresh reviewer/lease/grant/default observation cannot repair it. Missing old source objects/maps or incomplete side DAG also refuses. Nothing in this addendum relaxes conservative unknown-source policy.

    ## Actual producer adapters — no Step-6-only wrapper

    1. `commit.rs::run_git_commit` (baseline 306): route staging/format preparation, exact command, PENDING, bound Git and complete callbacks through shared adapter; remove bare blocking status path. It may not publish a head witness before full operation completion. `-a` stages tracked inputs privately; compare current live index/worktree preimages before installing exact results. Existing staged/unstaged peer bytes survive a failed precondition. Normal ordinary-commit positive remains.
    2. `pr_cmd::pr_rebase_handler` (447): insert `prepare_pr_rebase_operation` after read-only metadata/cross-fork/argument resolution, BEFORE Step 3 fetch and before forced `+<PR-head>:refs/heads/pr-N` at 528. Snapshot existing pr-N/head and episode sources first. Replace broad shared `fetch origin --prune` and forced pr-N fetch with private exact default and PR-head fetches. Validate both forge project/head identity and full source coverage; imported unknown PR head cannot overwrite old evidence. Journal any planned pr-N creation/replacement with old/new CAS and both prior/new source obligations. If pr-N is occupied or has unmatched local work, refuse before touching it, not force-clean it. --check uses private objects and performs no shared fetch/ref/worktree mutations.
    3. That handler's temp worktree add/remove, submodule preparation, onto-parent ancestor check, Step 6 rebase, abort/continue and final push/cleanup are inside the bounded operation plan. Use a uniquely owned private worktree instead of deleting a preexisting temp path. Preserve the stale-stack guard; pin onto-parent object and F, full old source set, complete rewrite-map stream and dropped-source union. Install exact reviewed head only after private Git completes required gates/callbacks and journal payloads are durable; keep PENDING through live install/FINAL. Network push follows FINAL with exact expected remote old head, cannot retroactively fix provenance. Failure retains truthful local FINAL or PENDING state and its own worktree evidence; no hidden reset.
    4. Interactive conflict positive is retained: private rebase worktree and durable PENDING survive; parent closes the current Git attempt. Printed continuation uses proposed `aida internal work-operation continue <op-id>` (or abort), not unwrapped `git rebase --continue`. New parent authenticates actual same/resumed actor or adds a valid scoped transformer, validates exact retained source/worktree/sequencer state and unchanged shared head reservation, binds a new Git attempt/socket and appends map frames. Conflict edits accumulate participant evidence. Abort restores only owned exact journaled preimages; ambiguous manual modifications remain blocking, never guessed complete. Raw standalone continue retains v3 refusal policy, but the interactive AIDA operation has a concrete supported continuation.
    5. `lib.rs::cascade_rebase_stacked_branches` (74844, fetch before 74994): `prepare_cascade_member` snapshots full old member source and stack graph generation BEFORE that member's fetch, checkout/stash/ref/rebase effects. Replace best-effort live default fetch with private pinned accepted-default observation; unavailable evidence refuses before mutation rather than using stale moving origin ref. Validate actual parent merge closure, not “branch disappeared”, and keep exact parent_branch_sha ancestor predicate. Use same rebase operation with exact F and parent cut; include ALL pre-cut source contributor obligations, not only replayed commits. On FINAL publish graph remove/repoint/dependent-SHA changes through guarded current graph CAS preserving peer entries; a failed graph publication is retained/recoverable metadata, never permission to discard operation evidence. Conflict uses the continuation above. Earlier independently committed cascade members remain intact if a later member refuses. Real `aida pull --auto` dispatch at lib.rs:74212 reaches this adapter; it is not just a helper test.
    6. `pr_cmd::run_human_finish_ceremony` (1193, add/commit then rebase at 1332), `rebase_cmd::handle_rebase_command` and `aida_core::rebase::detect` (207/241 fetch), plus the phase fallback invoking `aida rebase --auto` at lib.rs:114580, route to the SAME planner before any add/fetch/stash. Default base uses the pinned observation; an open stacked base uses full source coverage, never closed-default exemption. Auto-stash is an exact source/worktree operation: retain dirty/untracked bytes and actors, stash object/ref/reflog/index preimages and replay result, restore/reapply only validated owned bytes; unknown dirty contributors refuse BEFORE stash. Legacy missing actor remains refused as in v3, not human fallback. `git_ops::pull` and `fetch_branch_into_local` callers that can replace a bound code branch require this operation adapter; store variants instead use BUG-1808 service adapter. All code abort/reset cleanup paths (`pr_cmd` 746/1339, rebase_cmd 159, lib 52025) take the retained operation, never raw rollback over peer changes.

    Implementation audit must enumerate all newly discovered reachable mutators against these exact classes. An unconverted producer must refuse at its OUTER boundary before its first mutation; that is an honest temporary implementation gap, not satisfaction of any existing required positive case. PR rebase, cascade, ordinary commit, supported rebase/finish and ordinary team/store positives listed here cannot be waived using that fallback. This is scoped adapter integration, not a second launcher or attribution-repair command.



    Git callback edge cases are part of this contract: the installed githooks(5) reference-transaction contract does not cover symbolic-ref changes and emits no aborted callback when prepared itself returns nonzero. Symbolic HEAD/admin changes therefore use explicit owner-journaled before/after file/target verification, not an invented hook receipt. A refused prepared request plus exact unchanged state/dead child is a legitimate abort without an aborted callback; absent committed evidence after an allowed prepared transition remains uncertain. A hook's all-zero old OID can mean an unconstrained update, not just creation. Preserve raw callback old separately from the adapter's pinned effective old OID; reject unconstrained updates to shared existing refs and use expected-old CAS there. Private Git-generated unconstrained transitions may be observed only against the sealed private starting-ref map with no other writer, retaining both values. Never reinterpret raw zero as proof of shared absence. These details are verified in the installed Git manual, not inferred from v3.

    ## Grounded assertions and proposed acceptance witnesses

    At baseline 199e591b07aa76a59cd34f0a41946f918501f6ba, `pr_cmd.rs:447` has live broad fetch before forced pr-N fetch (528), temp cleanup/add, then direct Git rebase (652 onward). `lib.rs:74844` selects vanished-parent stacks and directly fetches/rebases at 74994, then changes stack graph on success; no pinned accepted-default observation is present. `pr_cmd.rs:1193/1332`, `rebase_cmd.rs:31,110-168` and core `rebase.rs:241` add more fetch/stash/rebase seams. `commit.rs:306` directly blocks on Git. `aida-pre-commit.sh:127,149` calls AIDA gates and section 3 mutates formatting/index. These were read from source; no behavior reproduction or test run occurred. Store/team seams and hook-safe service producer obligations are grounded in the companion's git_ops 239, git_backend 604 and team 223 source inspection.

    All following are proposed real-binary tests in isolated HOME/AIDA_HOME/temp repos with production hooks, fake vendor/forge, primed infrastructure/cache and deterministic barriers. No live store/user files/timers/peers; no executed-pass claim.

    - `work_operation_hook_publication_lock_order`: actual `aida commit` and `aida pr rebase N`; barrier in reference-transaction prepared; race real queue-work publication, team/store writes, and another wrapped code writer. Exercise normal private construction and actual live ref installation while home held, then kill publisher and trigger recovery from repo B/outside commands with hooks enabled. Require bounded completion/refusal, no circular wait; record AND ship blocked at old/new PENDING heads including old valid approval; no provisional grant/queue exposure; exact peer history preservation. Include socket/peer/ref/old/new spoof, missing callback, partial map and parent death after ACK. Complete durable evidence permits recovery finalization; incomplete evidence remains gap.
    - Extend `review_record_covers_later_head_cli` with EXACT B -> M unrelated forge squash/default advancement, B -> X feature, actor T rebase onto pinned M, original A plus transformer T retained, Q who authored only closed M allowed as independent reviewer. Invoke real START, record with assignment, and `aida pr ship N --wait 1` with fake merge endpoint. Q remains excluded if Q also edited open feature. Check B byte-identical, pinned F=M retained after default advances again, side-parent full DAG, skipped source union, no fabricated M actor, and unchanged closed history.
    - Paired unknown-old-source negative: omit X witness or dirty-handoff identity; attempt PR rebase whose existing pr-N differs from forge head. Assert refusal BEFORE forced ref replacement/index/worktree cleanup/shared FETCH_HEAD change, and later newer M cannot wash gap. Bypass/missing hooks plus crash after new shared head still blocks START/record/ship. Remove referenced source object/map or corrupt accepted-default observation; no fresh review repairs it.
    - `pr_rebase_frontier_captured_before_forced_fetch`: actual PR-rebase --check/default/--onto-parent and interactive conflict -> retained continue. Barriers before former Step 3 and Step 6; move default/PR tip or race pr-N owner. Assert private retry or bounded refusal, original sources survive, no silent import, known positive completes. Verify production reference hooks and gate rejection on exact prepared contents, including formatter-restaged tree. `--check` does not replace pr-N.
    - `cascade_rebase_pins_default_and_preserves_sources`: actual `aida pull --auto` routing to cascade, stacked witnessed sources, forge-confirmed parent squash, retained parent contributors, unrelated M-only reviewer positive; missing parent closure/source/mapping negative before member mutation. First member completion survives second refusal; concurrent graph edit preserved. Run actual finish ceremony and `aida rebase --auto` (including known dirty auto-stash) through shared adapter; unknown dirty actor fails before stash. Helper-only assertions are insufficient.
    - Retain ALL v3 actor/bootstrap/START parent-round/refusal/invalid-candidate/archive/expiry-revocation/drain/corpus/hold/under-lease cases. A common nonimplementing parent still permits siblings; source and transformer ancestry never does. Missing hooks cannot be hidden by success exit or an unrelated valid approval.

    No unresolved operator policy fork is claimed. Concrete implementation risks requiring demonstration are exact Git-effect inventory, production hook transport/gate extraction, closure observation validation, and preserving continuation/auto-stash mappings through actual entrypoints. If any remains unimplemented, name it as an engineering blocker rather than calling a constraint an adapter. This addendum requests fresh independent design signoff; it grants no implementation or merge authority.
