  author: joe
  content: 'Strict re-review: REQUEST CHANGES (one test-only fix). RELEASE AUTHORITY BEHAVIOUR IS UNCHANGED, and the diff is not an authority change. Reviewed 85e91bbb8a. (1) Release: test_ambient is #[cfg(test)] (lib.rs:34136-34137), test_env is #[cfg(test)] (lib.rs:319-320), and both override reads are #[cfg(test)] statements (lib.rs:34108, 34123). In release, find_project_root (lib.rs:34103) reduces to the old find_project_root_from(current_dir) body, and authority_stdin_is_terminal (lib.rs:34122) reduces to std::io::stdin().is_terminal(). The 4 call sites are verbatim substitutions: lib.rs:49515 (authority_carveout_active), 49836 (has_advisor_authority), 49859 (has_integrity_floor_authority) and requeue.rs:103. cargo build --release -p aida-cli: the binary has 0 hits for test_ambient, AmbientGuard, bug-1618-hermetic-test-user, hermetic_guard and BUG-1618. (2) Hermeticity: with a simulated leased roster (fake .aida-store in the checkout root, joe=advisor; not the live store), the filters queue_rework, mcp::tests, auto_bump, authority, advisor and test_env pass 393/393 in all 4 combinations of AIDA_SESSION_ROLE=advisor or unset and --test-threads=1 or 8. A pty run with a narrow filter under MemoryMax=6G (queue_rework, authority, mcp_update_requirement, mcp_triage_finding, test_env, auto_bump_required) passes 96/96. The guard holds ENV_LOCK, Drop restores the thread-local before the env is restored and the lock released, and the scope is thread-local. (4) No production check was loosened, and the merge-hold and ADR-52 integrity floor are untouched. The only floor change is the TTY read at lib.rs:49859, which is identical in release. (5) BUG-1627 (#2187) is now MERGED on main (5b98d7cfb3). git merge-tree main + branch is clean: EnvVarsGuard::snapshot is a separate impl block at test_env.rs:~108 and AmbientGuard is at ~196, so the hunks do not overlap. The merged tree compiles, and queue_rework, test_env, bug_1627, bug_1624, authority and mcp_update_requirement pass 110/110. No manual resolution is needed, but rebase before the merge. (3) CHANGE REQUESTED: the new test hermetic_guard_defeats_a_leased_advisor_roster (test_env.rs:305) only works on a machine that already has ambient authority. I deleted the guard at test_env.rs:334 in a throwaway copy. The test FAILS as intended with AIDA_SESSION_ROLE=advisor, and it fails with the role unset when $USER=joe resolves against the fake roster. With the role unset, no roster in the cwd and a non-joe user (a CI runner), the guard-less test PASSES. I also removed only the AIDA_USER override: under USER=runner the test still PASSES. So in CI a regression of the guard would go unnoticed, because the negative half measures the ambient environment, not the guard. Fix, test-only: under the guard, also assert the guard''s postconditions directly (AIDA_USER == the hermetic id, AIDA_SESSION_ROLE/AIDA_ROLE_INSTANCE/AIDA_AUTO_COMPLETE* unset, test_ambient::stdin_is_terminal()==Some(false), project_root()==Some(tmp)). In addition, write the roster to name the process''s resolved ambient identity ($USER, or whatever the identity resolver returns before the guard) as advisor, not a hard-coded joe. Both assertions then fail on any machine when the guard regresses. Once that lands, this is proxy-mergeable, since release authority decisions are byte-identical.'
