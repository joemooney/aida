title: queue_rework authority tests fail when run inside a leased worktree (ambient session/lease leaks into the test)
description: |-
  Seen by the TASK-1497 implementer on 2026-09-25. These three tests fail even when run alone inside a worktree created with `aida worktree add` (which takes an implementer lease), and also on unmodified main in that environment:
  - metadata_rework_needs_attention_spec_becomes_pickable_queue_head
  - metadata_rework_of_a_draft_is_refused_without_advisor_authority
  - work_rework_of_needs_attention_spec_is_refused_without_advisor_authority
  The same test passes on main from a plain shell, and CI is green. The authority or session resolution evidently reads ambient state (the cwd lease, session env or roster) rather than the test fixture.

  ## Acceptance
  - Identify the leaking input (cwd-based session/lease detection, AIDA_* env, or the ~/.aida roster) and make these tests hermetic: injected authority, a temp HOME and cwd, and cleared session env under the env lock.
  - The three tests pass when run from inside a leased `aida worktree add` worktree and from a plain shell.
  - Grep for other authority tests with the same dependency and fix them the same way.
