title: 'BUG-1637 follow-ups: race-test seam for self-reading status writers, restore result propagation, atomic findings promote'
description: From BUG-1637's re-review. (1) The race tests for ensure_spec_done_after_pr, bump_spec_in_progress_at_lease_take and restore_phase1_status_on_lease_failure call shared helpers rather than the functions themselves. Add a test seam that injects a concurrent change between the read and the write, so the atomicity is pinned end to end. (2) restore_phase1_status_on_lease_failure returns Ok even when the restore was refused, so the orchestrator prints 'status restored to X' when it wasn't; return the outcome. (3) Zen's error message is wrong ('is now Draft, not Draft') when the spec is deleted mid-flight. (4) The findings promote write (lib.rs ~6751) is unlocked; move it onto update_spec_atomically.
