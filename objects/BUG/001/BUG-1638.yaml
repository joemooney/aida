title: 'BUG-1637 follow-ups: race-test seam for self-reading status writers, restore result propagation, atomic findings promote'
description: |
  From BUG-1637's re-review. (1) The race tests for ensure_spec_done_after_pr, bump_spec_in_progress_at_lease_take and restore_phase1_status_on_lease_failure call shared helpers rather than the functions themselves. Add a test seam that injects a concurrent change between the read and the write, so the atomicity is pinned end to end. (2) restore_phase1_status_on_lease_failure returns Ok even when the restore was refused, so the orchestrator prints 'status restored to X' when it wasn't; return the outcome. (3) Zen's error message is wrong ('is now Draft, not Draft') when the spec is deleted mid-flight. (4) The findings promote write (lib.rs ~6751) is unlocked; move it onto update_spec_atomically.

  ## Acceptance (groomed 2026-09-25, proxy)
  - A test seam injects a concurrent status change between the read and the write, and race tests call ensure_spec_done_after_pr, bump_spec_in_progress_at_lease_take and restore_phase1_status_on_lease_failure directly (not shared helpers). Each test fails if the write is made non-atomic.
  - restore_phase1_status_on_lease_failure returns the restore outcome (restored / refused with reason). The orchestrator prints "status restored to X" only when it was, and otherwise prints the refusal. A test covers the refused case.
  - When the spec is deleted mid-flight, zen reports that the spec no longer exists, never "is now Draft, not Draft". A test covers it.
  - The findings promote write goes through update_spec_atomically; a test shows a concurrent edit is not lost.
