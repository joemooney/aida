title: Guard route jobs fire on ANY CronJobFailed, so one guard trip wakes every guard route with the wrong evidence
description: 'Observed 2026-09-26: a single hub-drift-guard trip (2026-09-24T20:00) made disk-headroom-guard-route, watchdog-route and hub-drift-guard-route all due, each showing the hub-drift trip evidence. In .aida/config.toml each *-route job declares on = ["CronJobFailed"] with no filter on WHICH job failed, so every route matches every guard failure. The operator inbox (aida awaiting) inflates, and an advisor is told to reclaim disk or stop a runaway seat based on unrelated evidence. Fix: let an event trigger name its source job (e.g. on = ["CronJobFailed:disk-headroom-guard"], or a from_job field), make the default route templates bind to their guard, and keep backward compatibility for unfiltered triggers. Acceptance: (1) a trip of guard A makes only A''s route due; (2) the route shows only A''s evidence; (3) the template and this repo''s config are updated via make sync-templates; (4) a test covers two guards where only one fails.'
