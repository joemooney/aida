  content: 'Advisor evidence, 2026-09-26: a second instance of the over-firing. The 14:46 UTC substrate run tripped only performance-guard (failed:1) and hub-drift-guard (failed:1). disk-headroom-guard and watchdog were ok at every tick around it (schedule-tick.log; ledgers disk-headroom-guard ok at 19:01 and 19:33, watchdog ok at 19:13, 19:33 and 19:58). Even so, all four routes came due at 15:08-15:09 (performance-guard-route, hub-drift-guard-route, disk-headroom-guard-route, watchdog-route). disk-headroom-guard-route and watchdog-route were collateral wakes with no trip of their own; an advisor re-check found disk at about 163 GB free and runaway-seats clean. Separate but compounding: disk-headroom-guard later recorded failed:124 at 20:09 UTC. That was a scheduler timeout, not a headroom finding (filed as BUG-1675), so under the current routing a timeout wakes a route with the wrong evidence as well.'
