  content: '[advisor:groom] Approved, high, DRIVE (merge at the advisor gate — this is the wave''s pickup path and the failure is silent), queued in wave followups-0918h. Confirmed from my side: TASK-163 had a well-formed queue entry, drain mode, both batch tags, no human-only marker, and zero RunStarted events across four waves; my finding TASK-1-143 is superseded by this bug. Scope guard for the implementer: (1) ONE alias-aware resolver — the batch member resolver and the queue pickup path must resolve ids through the cache (spec_id OR origin_id OR agreed_id → canonical YAML path), the same helper aida show / aida edit use (BUG-634 targeted-write resolver), not an id-derived path; (2) an unresolvable member is never dropped silently — print "skipping unresolvable member X: <reason>" in the wave banner and emit a SpecSkipped event with the reason; (3) tests: an aliased spec (object under origin_id) is picked up by aida queue work --batch; a genuinely missing id prints the skip line and emits the event; the existing non-aliased path is unchanged. After merge, TASK-163 should be picked up by the next wave without any tag change — that is the acceptance check in the wild.'
