title: Batch drain silently drops a queued member whose store object lives under its origin_id alias (TASK-163 → TASK-1-140.yaml never picked up across four waves)
description: |
  Observed 2026-09-18/19: TASK-163 sat on the role:implementer queue (approved, execution_mode drain, tagged batch:followups-0918e then 0918h) through four batch waves and was never picked up; no skip line, no shelve, no event. Cause found by inspection: TASK-163 is an ALIASED id — its store object is objects/TASK/001/TASK-1-140.yaml with spec_id TASK-163 and origin_id TASK-1-140 (the merge-gate short-id assignment). The batch member resolver (and possibly the queue pickup path) locates a member by the id-derived object path, which does not exist for an aliased spec, so the member is dropped silently instead of being resolved through the cache/alias registry the way aida show TASK-163 resolves it.

  Also affected: my tag-loss audit on 2026-09-18 found the same spec under TASK-1-140, and aida queue list shows it as TASK-163 — the two surfaces disagree.

  Fix: every id → object resolution in the orchestrator's batch/queue path must go through the same alias-aware resolver the CLI uses (cache lookup by spec_id OR origin_id → canonical YAML path), and a member that cannot be resolved must be reported ("skipping un-resolvable member X") rather than dropped silently. Acceptance: a queued, batch-tagged spec whose object lives under its origin_id is picked up by aida queue work --batch; an unresolvable member prints a skip line and emits a SpecSkipped event; unit test on the resolver with an aliased fixture.
