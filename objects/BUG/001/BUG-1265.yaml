  content: |-
    Correction to my previous comment: this spec is COMPLETED, and I wrote that comment as though it were open, suggesting acceptance additions. It should not be reopened on the strength of what I observed.

    The observation stands but belongs elsewhere. I have verified that this spec's fix (e4e75678aa, PR #1966) IS present in the drain's running binary — `git merge-base --is-ancestor e4e75678aa 52493554` exits 0, and the live wave binary is 52493554 built 2026-09-20 08:32:59. So the 16:22:40Z shelve on BUG-1291 / PR #2001 is neither a regression of this fix nor a stale-binary artifact.

    It is an uncovered sibling case. This fix guards the path where CI check details cannot be READ ("CI check details stayed unavailable while PR-{pr} was under a supervised merge-hold"). On #2001 the rows read fine — `Build (ubuntu-latest) = in_progress`, `merge-hold-gate = failure` — so the guard never engages, and terminality is decided on that partial rollup.

    Filed as BUG-1455 with the full evidence, linked to this spec and to BUG-1447. Leaving this one Completed.
