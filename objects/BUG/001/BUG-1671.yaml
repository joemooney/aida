spec_id: BUG-1671
agreed_id: BUG-1671
title: Archive and queue sweeps re-check a spec outside the store lock, so a reopen between the re-check and the write is overwritten
description: |-
  Follow-up from the BUG-1664 strict review. After BUG-1664 the sweeps re-read each spec from its stored object, but outside the store lock; the archive write later writes the whole object back under the lock, so a reopen landing in between is overwritten (window: duration of the sweep). Queue sweeps have a millisecond window before queue_remove_many.

  Acceptance:
  1. Archive sweeps (archive --older-than and the post-pull sweep) perform the eligibility re-check inside the store lock via update_spec_atomically (or equivalent), writing only if still eligible.
  2. Queue sweeps re-check each candidate under the queue/store lock immediately before removal.
  3. archive --older-than skips (and counts) a spec it cannot read instead of aborting the whole command.
  4. A test injects a reopen between candidate selection and the write and proves the reopen survives.
