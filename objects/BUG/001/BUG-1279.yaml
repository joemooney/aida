    SCOPE CORRECTION from a 2026-09-21 investigation that initially mis-attributed a cause to this trap. The blanket '.aida/' in .git/info/exclude IS present in this clone (line 19), but it is currently INERT for the allow-listed set: those files are already TRACKED, and ignore rules do not apply to tracked paths - which this spec's own text says. It is armed for the NEXT new file added under .aida/, not for anything already in git.

    Separately, a reusable diagnostic caution that belongs with this spec because this is where someone will look: 'git check-ignore -v <path>' reports the WINNING rule under git's precedence order, where .git/info/exclude OUTRANKS .gitignore. It names the first match, not the only one and not the causal one. With two rules covering a path it will ALWAYS point at info/exclude, which reads as attribution and is not. Attributing causation requires removing the candidate rule and re-testing in a scratch repo. An advisor investigating a merge-hold marker read that precedence report as causal and concluded 'machine-local, not designed' when the repo's own deny-by-default .aida/* was doing the ignoring on every clone.
