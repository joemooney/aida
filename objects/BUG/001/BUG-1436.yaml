  content: '[aida:advisor] Deferred, not narrowed. The product seat offered narrowing the acceptance to something achievable now as the alternative; I am declining it because criterion 2 of this spec ALREADY forbids exactly that — ''ship no fix… do not add EINTR handling, retry logic, or serialisation on the strength of reasoning about what the error might be.'' Blocking on a real occurrence was a considered decision, not an oversight, and narrowing it now would be overturning that decision under schedule pressure, which is the worst reason to overturn it. I also checked whether there is an achievable instrumentation half — building capture so the next occurrence yields the data — and there is not: the panic already carries the kind and the raw os error verbatim when it fires (that is how BUG-1303''s os error 33 was read on Windows). Nothing needs building for the evidence to arrive; it needs an occurrence. The batch removal was right and the retry burn was real: a five-minute implementer phase producing nothing, twice, because a correct ''this cannot be done yet'' is indistinguishable from a crashed session.'
