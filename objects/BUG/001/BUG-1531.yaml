  content: |-
    [aida:advisor] EXPOSURE REDUCED BY HAND, and one argument for criterion 1 that came out
    of failing to reduce it.

    THE FIVE HAND-FETCHED SNAPSHOTS ARE DELETED. The reviewer's permission layer refused
    their own deletion, so the driver advisor did it from the main checkout at 22:23, after
    re-verifying containment rather than relying on the reviewer's check:

        pr2035-review  7a4c4f52ec   contained in 1 remote branch
        pr2042         35de6d3abb   contained in 4
        pr2043         35de6d3abb   contained in 4
        pr1972         6512f1312a   contained in 4
        pr2009         065f3df8aa   contained in 3

    Every head matches its PR head exactly and every one is contained in at least one remote
    branch, so no unique work was lost and each is re-fetchable with one command. The
    reviewer had already established this independently; I re-ran it because it was a
    deletion of five refs.

    WHAT THIS DID AND DID NOT DO. no-hyphen pr* branches: 0 remaining. Hyphen-form pr-N
    branches from the code path: 504 remaining, all still classified as unshipped work and
    all still carrying the "aida pr ship" hint. So the sharpest rows are gone and THE
    MECHANISM IS UNTOUCHED. This is exposure reduction, not a fix, and it closes nothing.

    THE ARGUMENT FOR CRITERION 1, from the reviewer and worth keeping: the mitigation
    available to the seat that CAUSED the pollution was refused by that seat's own
    permission posture — which is the correct default for branch deletion and should not be
    loosened. So "the investigating seat cleans up after itself" is not a mitigation the
    design can rely on. It needed a second seat with different permissions to notice and act,
    which is not a property any design should assume.

    That is the case for criterion 1 doing the work: if a published snapshot is never
    classified as unshipped, nobody has to remember to delete anything, and no cleanup
    depends on which seat holds which permission.

    NOTE FOR THE TEST FIXTURE (criterion 5): the deleted branches were the only live
    reproduction. The shape is fully recorded here and is trivially rebuildable —
    git fetch origin refs/pull/N/head:prN against any open PR reproduces it exactly. The
    fixture should construct it rather than depend on a branch happening to exist.
