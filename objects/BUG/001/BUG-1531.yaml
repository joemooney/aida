title: The unshipped-work detector reports published PR snapshots as unshipped and recommends 'aida pr ship' on them, which would open a hold-free second PR for a commit a reviewer refused
description: "ESCALATED AND REWRITTEN 2026-09-20 22:14 by the driver advisor. The original filing had\nthe MECHANISM WRONG and the SEVERITY wrong. Both corrections are the reviewer's; the\nverification below is mine.\n\nWHAT I ORIGINALLY CLAIMED, AND WHY IT WAS WRONG. I wrote that \"two code paths create a\nlocal checkout branch for one PR under two naming conventions\". There is ONE code path.\nEvery hyphen-form creation site uses format!(\"pr-{}\", n) - lib.rs:30221, lib.rs:76605,\npr_cmd.rs:253, plan_cmd.rs:394 - and there is no no-hyphen creation site in Rust,\nscripts, skills or templates. The four no-hyphen branches were HAND-TYPED fetches by\nseats investigating PRs, readable in the reflogs:\n\n    pr1972          fetch origin refs/pull/1972/head:pr1972 --quiet\n    pr2009          fetch origin refs/pull/2009/head:pr2009 --quiet\n    pr2042/pr2043   fetch origin refs/pull/2042/head:pr2042 refs/pull/2043/head:pr2043\n    pr2035-review   fetch -q origin pull/2035/head:pr2035-review\n\nAt least three are the reviewer's own investigation branches - pr2042/pr2043 fetched in\none command while comparing the branch-crossing behind their 18:52 and 18:53 holds, and\npr2035-review created at 21:18 to read PR #2035's diff. So I filed a defect about\npollution that an investigating seat had introduced, and attributed it to the system.\nRecording that because it is the second instance tonight of an observer changing the\nthing observed and the next reader taking the change as the system's own behaviour.\n\nAlso corrected: there are THREE duplicate pairs, not two. I missed\npr-2043 = pr2043 = 35de6d3abb.\n\nTHE ACTUAL DEFECT IS MORE GENERAL AND MUCH WORSE.\n\nTHE DETECTOR TREATS ANY LOCAL pr* BRANCH AS UNSHIPPED WORK, and attaches a RECOVERY\nHINT telling the reader to ship it. A branch fetched from refs/pull/N/head is by\ndefinition already published - it cannot be unshipped. Deduplicating the spellings\nwould fix three rows and leave the mechanism; pr2035-review has no pair at all.\n\nTHE HINT IS A MERGE-GATE BYPASS. Observed verbatim in aida awaiting:\n\n    BUG-1470,pr2035-review,2,\"50m (first seen 2026-09-21T05:00:14Z)\",\n      aida pr ship pr2035-review\n\nVERIFIED STATE, all four legs checked by the driver advisor at 22:13:\n\n    pr2035-review head          7a4c4f52eceeffd9df698ed4d72fe1bb3205bab0\n    PR #2035 head               7a4c4f52eceeffd9df698ed4d72fe1bb3205bab0   IDENTICAL\n    .aida/review-verdicts/BUG-1470.json\n                                verdict request-changes\n                                reviewed_sha 7a4c4f52eceeffd9df698ed4d72fe1bb3205bab0\n                                reviewed_branch bug-1470-work\n    pr2035-review on origin     NO - local only\n    merge-hold markers          keyed PER PR NUMBER (PR-1972, PR-1974, PR-1978, ...)\n\nSo the recommended command targets a snapshot of the exact commit a reviewer refused.\n\nTHE CHAIN. aida pr ship --help: \"With no <N>, the command targets the current branch's\nopen PR - CREATING ONE via gh pr create (deriving title/body from the latest commit) IF\nNONE EXISTS\", and it is documented as \"for human-pre-approved work where NO ORCHESTRATOR\nREVIEW PHASE IS NEEDED\".\n\n  1. gh pr create opens a NEW PR from the refused head\n  2. the new PR has no aida:merge-hold label and no .aida/merge-holds/PR-<new> marker,\n     because BOTH ARE KEYED PER PR NUMBER - merge-hold-gate passes GREEN\n  3. squash-merge to main\n  4. the commit carries the (BUG-1470) trailer, so aida pull auto-bumps BUG-1470 to\n     Completed\n\nNet: a RequestChanges verdict, a merge hold, and the advisor's three-child scope\ndisposition on BUG-1470 are all bypassed, and the spec closes as done - recommended by\nthe coordination surface, in a field labelled \"recovery\".\n\nNOT VERIFIED, DELIBERATELY. Nobody ran the command. Whether gh pr create's push leg\nsucceeds non-interactively from a local-only branch is unconfirmed, and that single leg\nis the difference between a severe bypass and a severe near-miss. It is not worth\nexecuting to find out. Steps 2, 3 and 4 are verified from the code and the workflow\nregardless of step 1.\n\nTHE EXPOSURE IS NOT LIMITED TO HAND-MADE BRANCHES. The same hint is attached to the\ncode-created hyphen-form snapshots - pr-2009 and pr-1972 both render\n\"aida pr ship pr-<n>\" in the same table. Three of the affected rows are snapshots of\nPRs carrying live reviewer holds (#2035, and #2042/#2043 from the 18:52/18:53\nbranch-crossing holds), so the surface currently offers a hold-free path around three\nseparate refusals.\n\n## Acceptance\n1. A branch fetched from refs/pull/N/head is a published snapshot and is NEVER reported\n   as unshipped work. This removes every affected row including the ones with no\n   duplicate pair, and does not depend on recognising a naming convention.\n2. NO surface emits a \"ship\" hint for a branch whose head equals an open PR's head.\n   This is the safety floor and it is INDEPENDENT of criterion 1: even where the\n   classification is correct, the recommended ACTION must never be one that opens a\n   second PR for a commit that already has one.\n3. A ship hint is NEVER emitted for a head carrying an unresolved RequestChanges\n   verdict, on ANY branch. The verdict names a sha - 7a4c4f52ecee here - and anything\n   pointing at that sha is refused work regardless of which ref reaches it. THIS IS THE\n   CRITERION NOT TO TRIM: 1 and 2 fix this shape, 3 makes a refusal bind to a COMMIT\n   rather than to a PR NUMBER, which is the general form of the hole. It is the same\n   predicate BUG-1522 criterion 6 requires - read the verdict, not the PR.\n4. Genuine unshipped work still reports. Several entries are real authored spec branches\n   over 100 days old (story-418-2, bug-478-479-resume-lease); a fix that suppresses the\n   whole channel is not acceptable.\n5. A test asserts a refs/pull-derived branch produces no unshipped row and no ship hint,\n   and a test asserts a genuinely unpushed authored branch still produces both.\n6. A test asserts no ship hint is produced for a sha carrying an unresolved\n   request-changes verdict, driven from a verdict fixture rather than from a PR number.\n\nSPLIT OUT: the 500 accumulated pr-N branches are a separate concern, filed separately.\nThey are the bulk but they are a cleanup problem; this spec is the classification and\nthe hint.\n\nCREDIT: mechanism, escalation and criteria 1-3 are the reviewer's, from their 22:11 and\n22:12 reports. The four-leg verification and the merge-hold-keying check are the driver\nadvisor's.\n\"\nrelationships[1]{rel,id,title}:\n  Related,BUG-1530,\"aida awaiting is not scoped to the seat reading it: a reviewer is shown nineteen advisor- and implementer-owned items and is NOT shown the reviewer work routed to them\n\n7. THE SAME CORPUS LIMIT APPLIES TO CRITERION 3, AND ABSENCE MUST NOT MEAN PERMISSION.\n   Measured 2026-09-20 22:16: of 556 verdict files, 127 (22%) carry a sha under any of\n   the three key names and 429 (77%) carry none. Criterion 3 forbids a ship hint for a\n   head carrying an unresolved request-changes verdict â\x80\x94 but for most of the corpus the\n   verdict cannot be tied to a head at all.\n\n   A hint suppressor that emits the hint whenever it cannot find a matching sha is worse\n   than no suppressor, because it reads as a safety feature. Where provenance is absent,\n   the surface must fall back to criterion 2 â\x80\x94 no ship hint for a head that already has\n   an open PR â\x80\x94 which needs no verdict data and covers this case regardless.\n\n   This is why criterion 2 is independent of 3 rather than a weaker version of it: 2 is\n   the floor that holds while 77% of verdicts cannot support 3.\n\"\nrelationships[2]{rel,id,title}:\n  Related,BUG-1530,\"aida awaiting is not scoped to the seat reading it: a reviewer is shown nineteen advisor- and implementer-owned items and is NOT shown the reviewer work routed to them\"\n  Related,BUG-1466,\"aida review record --pr writes a PR handshake with no provenance: reviewed_sha, reviewed_branch, recorded_at and recorded_by are all dropped (452 of 481 files affected)\n\nCORRECTION TO THE DENOMINATOR ABOVE — THE 77% IS THE WRONG NUMBER FOR SIZING THIS\nCRITERION, and reading it as the blast radius leads to the opposite conclusion from the\none the evidence supports. Reviewer's correction 2026-09-20 22:19, re-measured by the\ndriver advisor and identical:\n\n    WHOLE CORPUS            127/556  have a sha   23%   <- BUG-1466's coverage question\n    SPEC-KEYED               43/53   have a sha   81%   <- what THIS guard reads\n    PR-KEYED, OPEN PRs       16/21   have a sha   76%   <- what BUG-1531's hint reads\n\nA live guard never reads the whole corpus. It reads the verdict for the spec or PR in\nfront of it. The 429 missing are overwhelmingly closed, legacy, PR-keyed files no live\nguard will consult. 77% is the right figure for \"can retention reach the corpus\"; it is\nthe wrong figure for \"how often will this guard hit unknown\".\n\nTHE OPERATIONAL RATE IS ROUGHLY ONE IN FOUR AND IT IS NAMEABLE. Five open PRs carry a\nverdict with no sha, so these are the cases where this criterion refuses TODAY:\n\n    PR-1984   PR-1998   PR-2009   PR-2039   PR-2040\n\nVerified by the driver advisor 22:21 against the open-PR list.\n\nWHY THIS ARGUES FOR KEEPING THE CRITERION HARD RATHER THAN SOFTENING IT. Sized against\n77%, \"refuse or escalate on unknown\" reads as \"the guard refuses most of the time\",\nwhich invites softening — and softening is precisely what reintroduces the silence this\nspec exists to remove. Sized against five named PRs it is survivable and specific, and\nan implementer can check the behaviour against each one. Do not soften this criterion on\nthe strength of the corpus-wide figure.\n"
