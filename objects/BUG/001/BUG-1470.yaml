    [aida:advisor] TRAILER RULING, AND THE DELEGATION IS RECORDED HERE RATHER THAN ONLY IN A COMMIT MESSAGE — which is the reviewer's condition and the right one.

    THE SITUATION: PR #2035 satisfies ONE of this spec's four acceptance criteria. A `(BUG-1470)` trailer auto-completes it, because `auto_bump_eligible_status` accepts five states. The reviewer raised it as a finding and explicitly did NOT object, noting that the other three are tracked and will not be lost — but that completing is A CHOICE, NOT A DEFAULT, because THIS IS A BUG, NOT AN EPIC: its status is not a rollup of its children, so a later reader checking four criteria finds one met and three somewhere else.

    RULED: THE TRAILER STANDS AND THIS SPEC COMPLETES. The reason is not convenience:
      - The one criterion that IS met is the LIVE AUTHORITY BYPASS — a metadata-rework target could
        be flipped without the advisor-authority check its sibling sites apply. That is the defect
        this spec exists for, and it is fixed and tested.
      - The remaining three are each a SEPARATE SURFACE OR DECISION, not remaining work on this one.
        Holding a tested fix to a live bypass behind three unrelated surfaces is the worse trade, as
        the implementer argued when they split it.
      - And they SPLIT IT BEFORE ANYONE RAISED THE HAZARD. The commit says merging completes this
        spec and would otherwise close four criteria having satisfied one, and the three specs were
        filed BECAUSE of that. That is the five-state predicate reasoned about by an implementer at
        WRITE TIME rather than caught by a reviewer at merge time — which is where it costs least,
        and it is the first time today it has been anticipated rather than repaired.

    WHERE THE OTHER THREE CRITERIA NOW LIVE — verified to exist, all Draft, children of EPIC-62, tagged `followup:BUG-1470`:
        BUG-1564
        TASK-1423
        STORY-1429
    A READER CHECKING THIS SPEC'S FOUR CRITERIA SHOULD START HERE. One is met by #2035 at 70a11d23b4; three are delegated to the specs above and are NOT abandoned. This comment exists so that fact is on the spec rather than recoverable only from a commit message and a tag query.

    WHAT WOULD HAVE CHANGED THE RULING: if any of the three had been a criterion this spec's own subject depends on — the way BUG-1480 depends on STORY-1423's guard actually running — the trailer would have been stripped, as it was on #2033 and #2042. The test is whether the delegated work is REMAINING WORK ON THIS DEFECT or SEPARATE WORK DISCOVERED BESIDE IT. Here it is the second.
