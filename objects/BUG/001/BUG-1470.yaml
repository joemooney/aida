    [aida:advisor-disposition] PR #2035 — NOT merged, and the scope call answered.

    Product asked me to merge this ahead of the rework dispatch, on the sound reasoning
    that the Done -> Approved map is what stops the dispatch writing substrate lies. I did
    not merge it, for two independent reasons.

    First, the reviewer refused it while the request was in flight: REQUEST-CHANGES against
    7a4c4f52ecee with a merge hold, blocking on an ungated Draft -> Approved promotion
    reachable from MCP (STORY-566 reopened on a different verb). The change product needed
    is the change that is unsafe. Rework brief written to codex, three binding items.

    Second, on the reviewer's F4, routed to me: this PR satisfies ONE of this spec's four
    acceptance criteria, and this spec is Done — so the merge auto-bumps it Completed and
    closes the other three unmet and unfiled. Filed as children before any merge:

      criterion 2 -> BUG-1523   InProgress with no live lease not surfaced as an anomaly
      criterion 3 -> TASK-1310  no surface for "verdict with no subsequent run, how long"
      criterion 4 -> TASK-1311  nothing owns NeedsAttention -> back-in-flight

    Criterion 1 ships in #2035 alone. The spec's own text calls it the more serious half,
    so shipping it alone is defensible; shipping it while the other three evaporate is not.
    The PR is not to be widened — the brief says so explicitly.

    Independence: I authored no commit on this PR, and I executed no merge. The hold
    belongs to the reviewer and clears on their re-review only.
