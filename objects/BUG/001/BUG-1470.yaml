  content: '[aida:advisor] ADDITION TO CRITERION 1, from the product seat and I agree. The help text''s documented transition table for `queue rework` does not list NeedsAttention at all, yet the verb transitions from it — three times out of three in the observed cases. So the documentation is incomplete in a way that makes correct reasoning from it IMPOSSIBLE, which is how both seats independently formed wrong causal stories about this verb today: one of us reasoned from the table to what must have happened and picked the row that fit. Criterion 1 already asks for the per-status table established from the code. Add: the help text is corrected to match it, including every status the verb actually accepts. A published transition table that omits states the verb handles is worse than none, because it invites exactly the inference that has now failed twice.'
