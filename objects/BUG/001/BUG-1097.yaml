title: 'cache schema-drift heals only on the SECOND invocation - first command exits 1 with raw sqlite error (BUG-627 gap: write paths + non-requirements tables)'
description: |
  ## Observed (3x on 2026-09-11, mixed 0.14/0.15 binaries active)
  1. ~13:56 `aida edit BUG-1072 --status rejected` → error: table requirements_cache has no column named origin (retry succeeded)
  2. ~21:05 `aida edit STORY-1066 --status rejected` → warning: cache upsert failed, cache marked stale: same column (next command fine)
  3. ~23:08 `aida mailbox inbox --peek` → error: table hierarchy_edges has no column named author_id (immediate retry succeeded)

  ## Why it matters
  BUG-627's contract is drift-heal BEFORE the query: a missing column triggers drop+rebuild and the command still serves. Today's pattern is fail-first-heal-second — the first invocation exits 1 with a raw sqlite error. Under drains/hooks/scripts an exit-1 is a false failure signal (a hook swallows output, a script branches wrong). Drift is common today because multiple binary versions (pre/post 0.15.0 schema changes) share one .aida/cache.db.

  ## Acceptance
  1. On 'no such column'/'has no column' from any cache read OR write, the command drops+rebuilds the cache and retries the operation once, in-process — first invocation succeeds (BUG-627 semantics extended to all tables incl. hierarchy_edges and write paths).
  2. Regression: open a cache built without a column (e.g. hierarchy_edges.author_id), run a command that touches it — command exits 0 with correct output.
