title: Nothing ever un-drafts a PR, so a drafted retraction leaves a PR GitHub will refuse to merge
description: |
  Found by the strict independent review of TASK-1529 (2026-09-27), non-blocking for that spec but a real product gap.

  `gh pr ready` without `--undo` appears NOWHERE in the tree. `is_draft` is parsed at pr_rebase.rs:224 but no merge or review path acts on it. Consequence chain after a verified draft retraction: the spec returns to InProgress, the retry reuses the same PR, phase 1 accepts a draft as already published, and GitHub then refuses to merge a draft PR. So the work stalls with no signal.

  This also makes `draft_notice`'s wording at preflight_retraction.rs:261 ("or let the drain retry") misleading, because the retry cannot succeed. The previous close-only behaviour forced a fresh PR and did not have this trap. Draft-first was an operator-approved change, but this consequence appears not to have been considered.

  Acceptance:
  1. Either a retry un-drafts the PR it is reusing, or phase 1 stops treating a draft PR as published and opens a fresh one. Pick one deliberately and record why.
  2. A fixture test proves a retry after a draft retraction reaches a mergeable state rather than stalling.
  3. `draft_notice`'s text matches whatever behaviour is chosen.
