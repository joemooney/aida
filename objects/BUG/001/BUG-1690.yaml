- id: 01a0fcfa-a451-7412-a6bd-2af2ea980c9b
  author: joe
  content: |-
    DECISION: Un-draft the reused PR.

    ### Decision & Rationale

    We will implement the branch to un-draft the reused PR, rather than opening a fresh one. While the previous close-only behavior did not suffer from this trap, the "draft-first" retraction was explicitly an operator-approved change designed to reuse PRs and avoid polluting the repository with closed PRs. Un-drafting the PR when retrying allows us to preserve that operator decision while escaping the stalling trap.

    ### Acceptance Criteria Updates
    1. The implementation must add `gh pr ready` (or equivalent forge API call) when reusing a PR that was found in a draft state.
    2. The `draft_notice` in `implementer_preflight.rs` is updated to correctly state that the drain retry will un-draft and reuse the PR.
    3. Tests assert that a draft PR is correctly marked as ready (un-drafted) before it is merged by the orchestrator.
  created_at: 2026-10-02T14:17:59.633265376Z
  modified_at: 2026-10-02T14:17:59.633265376Z
- id: 01a0fed4-6983-7560-86d0-121fc9bee8bf
  author: joe
  content: 'Implemented on branch bug-1690, PR #2357 (session 01a0feb65a11). Design per the recorded decision: un-draft the reused PR at phase-1 adoption. New Forge::mark_change_ready (gh pr ready / glab mr update --ready / pure-git no-op); undraft_reused_publication at both phase-1 adoption points, keyed on forge-reported is_draft; review:draft-only specs keep their draft (that draft IS the STORY-529 human-review hold — the drain merge path never reads the tag, so un-drafting would license auto-merge past the gate); retraction_notice updated to state the retry reuses an open PR, un-drafting it first if needed. Seam tests + mutation proof both directions; make check-ci-fast green.'
