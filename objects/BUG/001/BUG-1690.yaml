    Advisor disposition (relay session #12, 2026-10-02): APPROVED. Every load-bearing
    claim re-verified against main at 30638a79ea, 5 days after filing.

    - `pub is_draft: bool` is still at **pr_rebase.rs:224** exactly as filed, parsed
      at pr_rebase.rs:251 and stored at :274.
    - It is consumed by **nothing**: the only readers of that field are its own unit
      tests (pr_rebase.rs:982, :998). 35 `is_draft` hits exist across the tree, and
      every other one is a different concept -- spec Draft status (health_metrics.rs,
      lib.rs) or the `review:draft-only` tag (`is_draft_only_tagged`, pr_ship.rs:922).
      No merge or review path reads the PR's draft state.
    - `gh pr ready` still appears **nowhere** in the tree. Verified by grepping for
      the subcommand and for a bare `"ready"` argument; all hits are unrelated (test
      control files, `zen_drive` verdict strings).

    So the consequence chain as filed is intact and the bug is live.

    ONE CORRECTION for the implementer: the `draft_notice` reference is stale. There
    is no `preflight_retraction.rs`. The "or let the drain retry" wording is now at
    **implementer_preflight.rs:99**. AC3 applies there.

    AC1 is a deliberate design fork (un-draft the reused PR, vs. stop treating a
    draft PR as published and open a fresh one) and the spec correctly requires
    recording why. Both options are legitimate; the advisor is not pre-empting the
    choice. Note for whoever takes it: the filed text observes that the previous
    close-only behaviour did not have this trap, which is evidence for the
    open-a-fresh-PR branch, but draft-first was an operator-approved change, so
    un-drafting is the option that preserves that decision. State the choice against
    those two facts.
