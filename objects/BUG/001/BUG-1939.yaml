title: Flaky aida-core test a_forked_child_holds_the_lock_past_its_guard_until_exec fails CI with WouldBlock on a lock that has no recorded holders
description: |-
  Seen on PR #2488 (BUG-1923), CI run 38100750183 (Linux), 2026-10-11 01:12Z. The PR only touches aida-cli-lib history/cache/doctor files and doesn't touch aida-core, so this is not the PR's fault. main's CI was green at 3bb1454cf0 and 67fae0243e.

  Panic at aida-core/src/db/cache_refresh.rs:733:
  sidecar=/tmp/.tmpXXX/cache.db.refresh.lock registry_entry=None direct_flock=Some((WouldBlock, Some(11))) holders=[] own_fds=[]
  test result: FAILED. 1322 passed; 1 failed (aida-core --lib).

  The diagnostics show a direct flock returning WouldBlock while neither the in-process registry nor the holder scan finds any holder. That points to a race between the forked child releasing the lock (exec/exit) and the parent's probe, or to a holder the scan can't see. Same family as BUG-1729 and BUG-1736, which made earlier refresh-lock tests wait out contended flocks. This test seems to need the same bounded wait-for-release, or a deterministic handshake with the child.

  Acceptance: the test is deterministic under parallel cargo test on a loaded host (for example, 200 iterations with stress), and asserts the real invariant instead of timing.
