title: 'Flaky test: test_show_latency.py passes then fails tearing down its temp dir (.aida not empty, a background writer races rmtree)'
description: |-
  CI run 38266643902 (PR #2553, head d08f5475db, which touches only awaiting/idle-in-progress code) failed the Build step 'Run single-spec show latency regression'. Every check in tests/test_show_latency.py PASSED (it printed 'PASS show latency, canonical object, cache labels, strict refresh'). Then TemporaryDirectory cleanup raised OSError [Errno 39] Directory not empty: '.aida' (shutil.rmtree, tests/test_show_latency.py:21).

  Hypothesis: a detached child that the last aida show spawned (a background cache refresh, or a history/auto-sync child) is still writing under <temp>/.aida while rmtree walks it, so a file appears after the directory listing.

  Acceptance: the test waits for (or stops) every child it caused before teardown, or tears down with a bounded retry on ENOTEMPTY that is logged. The latency and label assertions are not weakened. Ideally, identify which child writes there (e.g. log the leftover entries on failure).
