title: pr list docs overstate 'CI Failing' as gating checks only, and long CI labels misalign the table
description: 'Noted by the fresh reviewer of PR #2516 (BUG-1935), non-blocking. docs/cli/04-git-lifecycle.md describes ''Failing'' as meaning only gating checks fail, which overstates the BUG-1935 classifier (it uses an informational allow-list; anything not on it counts). Separately, long CI labels push the pr list table out of alignment. Acceptance: the doc sentence matches the classifier''s actual rule; the CI column truncates or pads so a long label keeps the columns aligned (snapshot test with a long label).'
