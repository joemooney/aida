- id: 01a0fcfb-060a-7e42-9910-8e95ba35a21d
  author: joe
  content: |-
    DECISION: Implement Remedy Options 1 and 2.

    ### Decision & Rationale

    We will disclose the derivation in `aida show` and fix the prescribed `next` action. This resolves the UX contradiction where `aida show` obscures the stored status of an epic, and prevents users from being wrongly advised to archive Draft/InProgress epics.

    We specifically avoid Option 3 (auto-bumping the stored status of epics when rollups complete) because of the regression risks documented in BUG-768 regarding force-closed epics. Leaving the actual status bump as a deliberate human action (guided by the corrected `next` prescription) is safer and clearer.

    ### Acceptance Criteria Updates
    The existing ACs are fully aligned with this decision and should be implemented as written.
