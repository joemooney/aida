  author: joe
  content: |
    [groom:night] NEEDS-DECISION (SECURITY; never close). Still open on main: `git_ops::worktree_is_dirty` (aida-core/src/git_ops.rs:2181) runs plain `git status --porcelain` (fsmonitor is now off via git_ops, but submodule recursion is not), and raw `Command::new("git")` calls remain in aida-cli-lib/src/agent_launch.rs (:585, :3370), init_cmd.rs (:42, :420, ...), main_checkout_drift.rs and the worktree pool.

    Question: what is the host policy for git status over a code worktree a contained session can write?

    Options:
    A. Ignore submodules (`--ignore-submodules=all`, `-c submodule.recurse=false`) only for pool / contained-session worktrees; uncontained user worktrees keep normal submodule dirtiness. Smallest change; requires knowing reliably which worktrees a contained session could write.
    B. Refuse (or flag as tampered) any gitlink in the index that has no matching `.gitmodules` entry before running status; real submodules keep working everywhere. Closes the planted-repo vector in all worktrees but adds a pre-scan to every status.
    C. Always run host status with `--ignore-submodules=all` and report submodule dirtiness separately via a non-recursing `git submodule status`/`ls-files -s` check. Uniform, but changes dirtiness semantics for every user project.

    Recommendation: A + B together: A for the contained/pool worktrees (where the attacker can write), B as a cheap defense-in-depth refusal; and in either case route all raw status calls through one hardened git_ops helper with the planted-filter-driver test from the description. Related: BUG-1982.
