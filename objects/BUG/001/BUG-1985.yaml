  content: 'ADVISOR RULING 2026-10-18 18:50 (PR-2731, review cap reached): round 4 passed BUG-1982 but left BUG-1985 BLOCKED. F1 is the round-1 security blocker: a .gitmodules ignore= override re-enables recursion into a planted filter driver. F4 is a regression this PR introduced (a refused host_git_command reads as a clean tree, so ship step 1 skips the commit). F3 and F5 are fail-open paths. I won''t sign off containment code with these. #2731 closes and resubmits as two fresh PRs: (A) BUG-1982 alone plus F5, and (B) BUG-1985 fail-closed, covering F1-F4 and F6. Implementer split-2731 is assigned.'
