title: Host git runs over contained session worktrees can still recurse into a planted embedded repo (filter drivers in its config)
description: |-
  Found while fixing advisor E1 on PR #2541 (BUG-1929). That PR hardens host git over the store: every host git run gets -c core.fsmonitor=false, store trees also get diff.ignoreSubmodules=all and submodule.recurse=false, and store writes refuse gitlinks and nested .git.

  A contained session can also write its own code worktree, and the host runs git status there (git_ops::worktree_is_dirty, used by the worktree pool, adopt and destroy). The fsmonitor vector is closed there too because core.fsmonitor=false now applies to every git_ops::git run. But a planted embedded repo that is staged as a gitlink still makes host status recurse into it. Its own config can name a filter.<x>.clean driver, selected by a .gitattributes in the embedded worktree, and that driver may run when the embedded index is stale. The code-tree side was not given --ignore-submodules=all, because a user project with real submodules must still see them as dirty.

  Several raw Command::new("git") calls outside git_ops (worktree_pool.rs status --short, main_checkout_drift.rs, agent_launch.rs, init_cmd.rs status) also miss the hardening.

  Acceptance: decide the policy for code worktrees (for example, ignore submodules only for pool and contained worktrees, or refuse a gitlink that is not in .gitmodules), route the raw status calls through one hardened helper, and add a test that plants an embedded repo with a filter driver in a worktree and asserts the host never runs it. Related: BUG-1982 (writable <main>/.git).
