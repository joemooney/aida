title: make build-fast works with a configured sccache wrapper
description: 'Regression: with build.rustc-wrapper set to sccache in ~/.cargo/config.toml, make build-fast sets CARGO_INCREMENTAL=1 and fails before compilation with sccache: incremental compilation is prohibited. Acceptance: make build-fast preserves incremental release iteration and succeeds with sccache configured globally; the ordinary build-release behavior is unchanged; document the wrapper interaction near the target.'
