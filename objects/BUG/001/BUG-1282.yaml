  content: '[advisor:triage] Rejected as an auto-drafted phase record (TASK-266) — the cause is real and already filed twice over. This IS the misleading message: ''could not match the orchestrated session (claude id 01a0bb64) to a session lease'' is a true statement about the wrong thing. The actual cause was that lease 01a0bb6261fe, orphaned when a process-group teardown killed the previous drain and its codex child together, was still held on scope TASK-1-144 — and the two retries were burned in fifteen seconds failing to claim it. Filed as BUG-1285 (approved, high, drain, queued), which covers both halves: a lease whose holder is provably dead must not block a fresh claim, and the refusal must name the holding lease and its scope rather than session-id matching. TASK-168 itself was verified clean and reset to Approved at 13:52. The product seat has also fixed the proximate trigger at source by launching drains under setsid, so a launcher swap can no longer take a live drain down with it.'
