title: 'aida list --status shelved / needs-decision are dead on the git-backend path: the STORY-1023 lens filters only exist in the legacy list_requirements'
description: |
  Found 2026-10-02 (relay session #18) while scoping BUG-1687's AC2.

  STORY-1023 added two NON-stored "lens" status filters so an operator could ask
  for parked work by how it is parked:

      aida-cli-lib/src/lib.rs:18954  enum ListStatusFilter { Stored(..), Shelved, NeedsDecision }
      aida-cli-lib/src/lib.rs:18968  "shelved" => Ok(ListStatusFilter::Shelved)
      aida-cli-lib/src/lib.rs:18970  "needsdecision" => Ok(ListStatusFilter::NeedsDecision)

  `parse_list_status_filter` has exactly ONE non-test caller: `fn list_requirements`
  (lib.rs:18877), which takes a `&Storage` and reads `store.requirements` — the
  LEGACY centralized path. A distributed-mode repo (this one) routes `aida list`
  through `handle_git_backend_command`, whose status arm (git_backend_cmd.rs:1805)
  hands the raw token to `aida_core::RequirementStatus::expand_filter_spec` and
  errors on anything that is not a canonical status or an open/closed alias.

  Reproduction on this repo at 30638a79ea:

      $ aida list --status shelved
      error: "Unknown status filter 'shelved'. Use a status (draft, approved,
      planned, in-progress, done, completed, rejected, needs-attention), an alias
      (open, closed), or a comma-separated set (draft,approved). ..."

      $ aida list --status needs-decision
      (same error)

  So both lens filters are unreachable from the shipped CLI, and the error message
  actively denies that they exist. The unit tests at lib.rs:19145-19204 pass
  because they call `requirement_matches_status_filter` directly, never the live
  surface — the shape warned about in "a test on the branch may be wired into
  nothing".

  Relationship to BUG-1687: BUG-1687 AC2 asks for `aida list --status deferred`.
  The idiomatic fix is a third lens filter, but the precedent it would copy is
  itself dead on the live path, so BUG-1687 cannot simply add an arm to
  `ListStatusFilter` and call it done. Whoever fixes either one should wire lens
  tokens into the git-backend status arm once and satisfy all three.

  Acceptance:
  1. `aida list --status shelved` and `aida list --status needs-decision` return
     the matching parked specs on the git-backend (distributed) path, not an
     "Unknown status filter" error.
  2. A fixture test drives the real list surface (the git-backend command path, or
     an aida-cli integration test), not `requirement_matches_status_filter` in
     isolation; each new test is proved to fail without the fix.
  3. The "Unknown status filter" message enumerates the lens tokens it accepts, so
     the refusal and the accepted set cannot drift apart again.
  4. If a lens token is combined with a stored status in a comma set
     (`--status shelved,approved`), the command either honours both or refuses with
     a message naming the limitation — it must not silently drop a token.
