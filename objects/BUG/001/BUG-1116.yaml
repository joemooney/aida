title: roleless-recovery picks the wrong last-used role under mtime/dir-order tie — flaky test blocks unrelated PR merges
description: |
  ## Observed (recurs across unrelated PRs, 2026-09-12)
  role_identity_tests::roleless_recovery_uses_last_used_role_and_copyable_command fails intermittently in CI as the SOLE failure, on PRs that touch none of its files:
  - PR-1783 (BUG-1112, reconcile code) — failed, retriggered, passed.
  - PR-1785 (STORY-1041, drain-state code) — failed.
  main is green on this test. The test sets role `implementer` last_active 2h ago and `advisor` last_active now, then asserts the roleless-recovery line names `advisor`; CI instead reports 'Last-used role: implementer' (the OLDER role).

  ## Root cause hypothesis
  The 'last-used role' selection does not reliably order by last_active_at — likely a directory-iteration/mtime tie-break: in fast CI both role .toml files can land with indistinguishable mtimes (or the resolver reads dir order), so it picks the wrong (older) role. This is a real product defect (the recovery hint can name the wrong role), surfaced as a flaky test.

  ## Acceptance
  1. The roleless-recovery 'last-used role' is selected by the stored last_active_at field (not file mtime / dir order); ties broken deterministically (e.g. by name) so the result is stable.
  2. The test is deterministic across runs and run-order (seed distinct last_active_at, assert the newer wins every time).
  3. Regression: 100x loop of the test is green; two roles with equal last_active_at pick a defined winner.
