title: 'Remaining env-var test races: task_490 queue snapshot test reads current_user_id without ENV_LOCK; vendor_activity sets AIDA_CODEX_SESSIONS_DIR outside the lock; audit bug_774 and queue_work tests'
description: 'From BUG-1658''s review. Same class as BUG-1658 (a test reads process env such as AIDA_USER/USER, or sets env, without the process-wide ENV_LOCK, so parallel tests race; set_var concurrent with getenv is a data race on Linux/macOS). Known: task_490_status_in_progress_tests::collect_queue_snapshot_pulls_in_progress_past_display_budget_with_lease (current_user_id twice, no lock); vendor_activity.rs sets and removes AIDA_CODEX_SESSIONS_DIR directly. To audit: bug_774_queue_role_fallback_tests.rs, queue_work_tests.rs. Fix: move pin_queue_user into aida-cli-lib/src/test_env.rs and use it (or EnvVarGuard) everywhere; consider a lint or test that greps for raw std::env::set_var/remove_var in tests. Acceptance: no raw set_var/remove_var in test code outside the guard helpers; the listed tests hold the lock.'
