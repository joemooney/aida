title: aida pr auto-queue-review says 'already has a Review PR-N story queued — skipping' when the story exists but is NOT in the reviewer queue
description: 'Observed 2026-09-18 (TASK-1254 live drain on the GitLab mirror). After a store recovery restored the Review PR-2 story file (STORY-1241) but not its queue entry, the drain''s reviewer phase refused: ''review envelope is set for PR-2 but no pickable review story is queued (8 queue entries but none is a review story for this change)''. Following the printed help, aida pr auto-queue-review --branch task-1269 replied ''PR #2 already has a Review PR-2 story queued — skipping'' and queued nothing, because pr_review_story_already_exists checks only that an open review story with that title exists, not that it sits in the reviewer queue. The two surfaces disagree and the user is stuck until they run aida queue add STORY-N --for reviewer by hand. Fix: the idempotency check should require BOTH an open story AND a queue entry for it; if the story exists but is unqueued, (re)queue it and say so. Acceptance: story present + unqueued → auto-queue-review queues it (no duplicate story); story present + queued → skip as today; test on the pure decision.'
