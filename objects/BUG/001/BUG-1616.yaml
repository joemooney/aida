title: aida history drops add/delete events on commits git reports as renames (default rename detection in git show --name-status)
description: |-
  Found by the TASK-1505 advisor review. The history event walk calls `git show --name-status` with git's default rename detection. The last 3,000 store commits contain 426 rename lines; for example, one commit pairs BUG-389 with BUG-390 as a rename. The walk reads both paths as a single path, the two blob reads fail, and it silently emits neither the delete event nor the add event. The digest view is affected the same way.

  ## Acceptance
  - The history walk and the digest disable rename detection (`--no-renames`) and report adds and deletes as separate events.
  - A regression test uses a fixture store with a delete plus an add that git would pair as a rename, and asserts both events.
  - The live store's `aida history events` over a window containing a known rename pair shows both events.
