  content: 'Review: APPROVE — claude/bug-1616 @16bf434aa1. (1) Coverage: every store-history name-status parser now disables renames: event walk history.rs:455 (git show), digest history.rs:723 (git log), print_pull_summary lib.rs:72170. The only other store name-status reader, aida-core git_ops.rs:1042 changed_object_files, already passes --no-renames (BUG-636). Remaining --name-only/--numstat callers (rebase.rs:163, field_study.rs:412, lib.rs:37549/51880/51911, pr_cmd, harvest) read the code repo, not aida-store, and do not emit spec events. No libgit2 diff/find_similar paths. digest.rs/digest_cmd.rs do not shell out to name-status. (2) Regression test history.rs:1803 verified in a scratch worktree: removing both flags fails (''missing Deleted BUG-389, got: []''); removing only the event-walk flag fails at the same assert; removing only the digest flag fails at the BUG-389 digest row expect (history.rs:1898). So both halves are guarded, and a precondition assert confirms the fixture really is an R pair. (3) Pull summary: correct. R lines have 2 tabs and were silently skipped by the tabs==1 branch; with --no-renames they come through as D/A rows and land in deleted/added. Minor, non-blocking: there is no unit test for the pull-summary path (it is a println function). (4) trace:BUG-1616 | ai:claude comments are present at all 3 sites and on the test. cargo test -p aida-cli-lib --lib history: 37 passed, 0 failed. cargo fmt --check is clean.'
