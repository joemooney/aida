  content: |
    LIVE RE-MEASUREMENT RESULT (same session as the disposition above) — the filing's step 2/3
    observation REPRODUCES exactly, so its evidence is sound even though its root cause was not.

    Baseline, both hubs identical: `aida-store ✓ in sync`, gitlab and origin both `de9b4901e28c`.

    I then made exactly two advisor store writes — one `aida comment add BUG-1746 --body-file` and
    one `aida edit BUG-1746 --status approved` (3 store commits between them). No `aida pull`, no
    `aida db sync --push`, no other actor.

    Immediately after:

    ```
    aida-store       ⇡ BEHIND (3 commits)
      gitlab       +3/-0      de9b4901e28c     <- exactly where the baseline left it
      origin       +0/-0      fdd8c1a0d9a2     <- carries all 3
    ```

    So: every write pushed to origin, none to gitlab, and the drift is one-for-one with the number
    of commits written. Confirmed independently of the filing session. The mechanism identified in
    Correction 2 — the shipped `mirror_sync_hubs` never ran because the seat never crossed the
    `aida pull` boundary — accounts for it precisely.

    MEASUREMENT GOTCHA for whoever verifies the fix: fetching an explicit refspec
    (`fetch <remote> <branch>`) updates only `FETCH_HEAD`, NOT the remote-tracking ref, so
    `rev-parse <remote>/aida-store` keeps printing the PREVIOUS tip afterwards and will tell you the
    hubs agree when they do not. I hit this here and it briefly read as "no drift". Measure hub tips
    with `aida remote status` (it queries the hubs directly) or a bare fetch of the whole remote. A
    test or AC that compares tracking refs after an explicit-refspec fetch will pass against a
    broken fix.
