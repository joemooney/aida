title: Automated status writers without status history can still overwrite a terminal status (BUG-1625 follow-up)
description: 'From BUG-1625''s strict review. The terminal-status merge guard depends on status-history author evidence. These automated writers change status without recording history under an automated author, so a newer write can still overwrite Completed/Rejected/Superseded: the orchestrator shelve (lib.rs ~46440), queue_cmd.rs ~8168, the MCP punt (mcp.rs ~3097), and requeue return_to_flight (requeue.rs ~265). Fix: record status history under an automated author (add each to AUTOMATED_STATUS_AUTHORS), or give each its own guard that refuses to leave a terminal status. Acceptance: a test per writer shows a terminal spec is not regressed through the merge.'
