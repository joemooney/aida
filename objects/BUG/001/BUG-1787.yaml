title: 'Dead assignment: cache.rs empty-migration error arm sets migration_pending=true that the post-match reassignment immediately overwrites'
description: 'cargo check on main warns unused_assignments at aida-core/src/db/cache.rs:1332 (introduced by BUG-1752, #2311): the read-only/unwritable error arm assigns migration_pending = true, then the line after the match reassigns migration_pending = (outcome == EmptyMigration::NowHasRows), which is also true because the arm returns NowHasRows. Behavior is correct; the inner assignment is dead but the warning now appears in every workspace check (surfaced during aida pull 2026-10-02). Fix: delete the dead assignment (or make the arm the sole assignment site). Acceptance: cargo check --workspace emits no unused_assignments warning for cache.rs; no behavior change (existing migration-pending tests still pass).'
