  content: 'Inspection: mirror_sync_hubs already pushes observed origin SHAs; the pre-push hook mirrored proposed local SHAs before origin acceptance. Fix gates hook refspecs on origin confirmation, pins post-push code fan-out to fetched origin SHAs, and reports ignored local-only commits in mirror-sync. Regression exercises rejection, hook, post-push fan-out and sync using local bare hubs.'
