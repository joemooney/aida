- id: 01a0dde7-e0d2-7e42-8c18-9522c5d70952
  author: joe
  content: 'Review (fresh strict Opus reviewer): REQUEST CHANGES on b3ed6c5059. Verified: aida-cli-lib --lib (scaffold/init/task_1503/bug_1645/doctor_/refresh/skill) 335 pass; aida-core --lib scaffold 153 pass, bug_1645 2 pass; check-portability exit 0; make check-templates OK (pure shell, unaffected). Mutation (non-lane skill no longer disqualifies in looks_like_memory_lane) is killed by bug_1645_pre_footprint_memory_lane_is_not_seeded_or_nagged; reverted. TASK-1503 policy holds: legacy full packs still fail closed on refresh; upgrade/init ignore the inferred footprint, so an explicit upgrade still delivers once. Tests use tempdirs only. FINDINGS: (1) MEDIUM init_cmd.rs:851-853 (looks_like_memory_lane): any opt-out disqualifies, even an opt-out of a memory-lane skill. Reproduced with a probe: memory-lane scaffolding, delete aida-learn from both packs, re-run write_memory_lane_scaffolding, which records opted_out={aida-learn}. effective_init_footprint is then None, and refresh promotes both manifests to complete with 53/21 unconfirmed and prints the ''run aida scaffold upgrade'' nag, which is exactly the L2 symptom, now permanent. Fix: return false only when opted_out holds a NON-memory-lane name (mirror the delivered check), and add that case to the L2 test. (2) MEDIUM doctor_cmd.rs ~849-857: under a memory-lane footprint (saved or inferred) a missing aida-capture/aida-learn still yields the action ''Run aida scaffold upgrade'', and upgrade ignores the footprint and writes the full scaffold (the flood). L2 asked for the hint not to invite a full upgrade. Fix: when the footprint is MemoryLane, make the action a lane-safe command (e.g. ''aida init --footprint memory-lane'') and assert the action text in bug_1645_doctor_does_not_nag_memory_lane_toward_full_upgrade. (3) LOW (L5 completeness) init_cmd.rs:1058-1073 write_memory_lane_artifact: the memory-lane skill writes bypass symlink_blocking_write. A missing aida-capture/SKILL.md inside a symlinked .codex/skills or skill dir is written into the link target, and with --force it writes through a per-file symlink (the BUG-718 case). Fix: call symlink_blocking_write(root, rel, path) there, skip it and count it as skipped. (4) LOW doctor/report loop: files inside a user-symlinked skill dir that are stale are still reported as drift (''aida scaffold upgrade''), and upgrade now skips them, so the doctor nag never clears. Fix: have check_scaffold_status/doctor treat symlink_blocking_write hits as user-owned, not drift. (This also explains the existing false drift on this repo''s dir-symlinked folder skills, e.g. .claude/skills/aida-pr.) (5) NIT init_cmd.rs:1546: the new init check runs before ''exists && !force'', so re-running aida init in the dev repo (about 100 per-file symlinks) prints one warning per link where it used to skip silently. It also newly skips AGENTS.md->CLAUDE.md symlinks, a common pattern (consistent with BUG-718 apply, but a behaviour change for init). Fix: for file-level links, warn only when the write would otherwise happen (force, or not existing). (6) NIT: the skip warnings give no remedy; add one clause (e.g. ''refresh it in the project that owns the target, or replace the link''). (7) NIT symlink_blocking_write checks only the pack and skill dirs. A symlinked .codex/.claude parent or a folder-skill subdir (aida-pr/examples) still passes; document this or check every ancestor under the project root. (8) NIT looks_like_memory_lane ignores strong full-install markers (.claude/AIDA.md, .claude/commands/aida-*); using them as negative evidence would harden the inference against a pruned or interrupted full install. L1, L3 (partial skill: no SKILL.md, not recorded, retried whole; leftover pristine supporting files are overlaid harmlessly; a warning each run only while the blocker persists) and L4 look correct.'
