        test templates::tests::project_discipline_pack_matches_master ... FAILED
        test result: FAILED. 957 passed; 1 failed; 1 ignored   (98.43s)

    THE POINT IS THE 957. The leg REACHED THE TEST PHASE AND 957 TESTS REPORTED. Before this fix the ungated `use std::os::unix::fs::PermissionsExt;` failed to compile and took the whole aida-cli-lib test target with it, so NONE of them reported. The prediction stated before the run was exactly this — "the Windows leg should REACH THE TEST PHASE rather than die at compile" — and it is what happened.

    THE REQUIRED CHECK STILL CANNOT SEE THIS AND DID NOT. Build (ubuntu-latest) was green before the fix and after it; Linux compiled fine throughout. This run is the evidence, and it was dispatched deliberately rather than waited for — the nightly would have answered the same question tomorrow, which is the day-late loop BUG-1556 describes.

    THE REMAINING FAILURE IS NOT THIS SPEC'S. It is BUG-1555's discipline-pack parity test — known, identified, cause confirmed (autocrlf=true on the runner, project copy CRLF against an LF-pinned master), and still open pending its fix. One failure, named, in a leg that now reports 957 results instead of zero.

    THIS SPEC IS CLOSED ON EVIDENCE RATHER THAN ON THE MERGE. The merge landed the fix; this run is what establishes the fix works on the platform the fix is for.
