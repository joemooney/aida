spec_id: BUG-1164
agreed_id: BUG-1164
title: 'A stale .aida-store git index.lock wedges EVERY subsequent drain spec (fast-fail on ''git add failed: index.lock: File exists'')'
description: |-
  2026-09-15: during a multi-spec drain, the first spec left a stale .git/worktrees/-aida-store/index.lock (a concurrent store write — an advisor `aida edit`/`add` running alongside the drain's own store write — collided). Every SUBSEQUENT `aida queue work <spec> --auto-complete` then fast-failed in ~2s with: error: git add failed: fatal: Unable to create '<repo>/.git/worktrees/-aida-store/index.lock': File exists. The whole remaining drain blew through 9 specs failing instantly. Recovery: rm the stale lock (verified no live git process held it) + re-launch.

  Two problems:
  1. A stale store index.lock is not detected/cleared by the drain — it should probe for a stale lock (no owning process) at the start of each spec's store write and clear it, rather than fast-failing every spec.
  2. Concurrent store writers collide: the drain writes the store AND a human/advisor session can write it (edit/add/comment/queue) at the same time; the collision can leave a stale lock. Serialize store writes (a store-level lock with proper wait/backoff) or make the drain resilient to a transient lock (retry with backoff) instead of hard-failing.

  Impact: a single stale lock silently wedges an entire unattended drain — high-severity for autonomy reliability (EPIC-62 class).

  Acceptance:
  - A stale .aida-store index.lock with no owning process is detected and cleared (or waited-out) before a store write, not fast-failed.
  - Concurrent store writes (drain + interactive) either serialize safely or retry-with-backoff; a transient lock does not fail the phase.
  - Regression test: simulate a stale index.lock and assert the store write recovers rather than erroring.
