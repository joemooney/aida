title: 'aida scaffold refresh on a memory-lane project floods it: adds the 26-file discipline pack and replaces the lane AGENTS.md block with the full AIDA Conventions block'
description: 'Found by BUG-1653''s strict review (tempdir memory-lane project, with and without a saved footprint): refresh_agent_packs_at plus the CLI refresh steps add .aida/discipline/ (26 files, ~200KB) and its .gitignore allow-list, and replace the lane''s ''# AIDA Memory Lane'' AGENTS.md block with the full ''# AIDA Conventions'' block, which points at .claude/AIDA.md, settings.json statusline and discipline docs that a lane project doesn''t have. By reading the code, the CLI step also seeds missing type protocols and may offer the permission-posture fix. This contradicts the TASK-1503 memory-lane footprint policy. Fix: refresh honours the effective footprint (saved or inferred): under MemoryLane it refreshes only lane artifacts (the lane skills and the lane AGENTS.md block) and skips the discipline pack, full AGENTS block, protocol seeding and posture offer, and says so in its output. Acceptance: (1) a tempdir lane project refreshed, then a tree diff shows only lane skill/lane-block updates; (2) a full-footprint project''s behaviour is unchanged; (3) after this lands, the doctor lane-drift hint may point at refresh (update the BUG-1653 hint then).'
