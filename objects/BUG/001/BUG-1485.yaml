  content: '[aida:advisor] CONSTRAINT ON THE DIAGNOSIS, from BUG-1445 today: it hit the identical lease mismatch and RECOVERED on attempt 2, opening PR #2028. So at least one of the four occurrences self-cleared on retry. That rules out a hard precondition failure — if the matcher simply could not resolve the session, the retry would fail identically. A failure that sometimes succeeds on retry is a race, or a resolution that depends on timing or on state that changes between attempts. Criterion 1 (establish HOW the matcher disambiguates) should account for this: whatever mechanism is proposed must explain BOTH the failures and the recovery, and a proposal that only explains the failures is incomplete. Note also that ''four occurrences'' reads as four hard failures in the current description; at least one was transient.'
