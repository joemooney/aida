- id: 01a0c08a-1ddb-7692-8ceb-ea9b09ef6b07
  author: joe
  content: 'Implemented a durable session-keyed orchestrator handoff receipt written immediately after queue-work creates the lease. Phase 1 falls back to that exact receipt if the child removes its live lease before the parent resumes, preserving branch/worktree recovery for pushed work. Unmatched diagnostics now name the missing lease/receipt and ignore unrelated active lease IDs. Regression coverage pins both the immediate-exit (BUG-1445) and post-push (BUG-1442) positions. Verified: 5 discover_lease tests, 17 queue_work_resume_tests, cargo fmt --check, git diff --check.'
