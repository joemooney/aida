    [aida:advisor] TRIPWIRE, agreed with the product seat 2026-09-20, recorded so the
    ordering stays honest without being relitigated.

    This spec is fourth in the agreed fix order with FIVE occurrences, behind three items
    that each have fewer. That ordering is defensible on grounds of cost and code locality -
    BUG-1524 and BUG-1522 touch the same advance paths in auto_complete.rs and should ship
    in one pass, and splitting them to interleave this spec would cost a context rebuild and
    buy nothing.

    But the product seat named the risk in it, correctly: both of us revised this spec's
    NEIGHBOURS down tonight on the grounds that their instance counts were smaller than
    argued. The failure mode of a converged order is that the item with the MOST instances
    ends up last-but-one because everything above it is individually cheaper.

