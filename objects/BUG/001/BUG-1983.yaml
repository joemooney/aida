title: aida edit Draft->Approved ignores the advisor seat grant that aida review record honours
description: |
  Observed 2026-10-11 19:45 in the advisor seat session (Claude Code, headless Bash tool, no TTY).

  The session carries a seat grant in its environment: AIDA_SESSION_ROLE=advisor, AIDA_SESSION_GRANT=<grant id>, AIDA_SESSION_PURPOSE set by the SessionStart hook. The same session ran `AIDA_AGENT_TYPE=claude aida review record ... --verdict approve|request-changes` many times today, and those were accepted as advisor authority.

  But `aida edit BUG-1982 --status approved` (Draft -> Approved), with or without AIDA_AGENT_TYPE=claude, fails:

      error: "promoting a Draft spec to Approved needs advisor authority (advisor role or an interactive session). Leave it for advisor triage, or run as the advisor. No active role. Last-used role: advisor. Run: `aida role enter advisor`."

  `aida role current` prints nothing, and `aida role enter advisor` refuses without a TTY ("role grants require a human at an interactive TTY"). So the advisor seat cannot do one of its core duties (gating Draft -> Approved); the operator had to run the edit by hand.

  Likely cause: the Draft->Approved authority check reads the "active role" from the role-enter store, not the validated seat grant that review record and the statusline (BUG-1924) honour. The two authority paths disagree.

  ## Acceptance
  - In a session whose environment carries a valid advisor seat grant, `aida edit <ID> --status approved` on a Draft spec succeeds without `aida role enter`, and the status-change event records the advisor seat and grant.
  - A forged or stale grant (unknown grant id, grant for another seat, or expired) is still refused, with the same error class as review record.
  - One shared helper decides "has advisor authority" for both `aida edit --status` promotion and `aida review record`, so they cannot drift again. A test covers both commands against the same grant fixture.
  - The error text names the grant it found and why it was rejected, instead of "No active role" when a grant is present.
