    [groom:night] APPROVE (supervised, security/authority). Confirmed: role.rs has_advisor_authority() decides from effective_role_with_roster + TTY + orchestrator only. It never consults seat_authority::current_grant/current_seat, which validate grant expiry, revocation, subject, roster and parent delegation and are what the statusline (BUG-1924) and review record's seat display use. Note that review record does not actually check advisor authority today. It only gates the operator-fallback identity (see BUG-1978) and refuses the implementer seat. So the "one shared helper" acceptance means introducing an advisor-authority check that both paths call, not reusing review record's. This widens authority, so it needs a sketch + advisor signoff, and the forged/stale-grant tests are mandatory. BUG-1978 is related but separate (error text for a grant with no agent identity).
