    REVIEW FINDINGS TO ADDRESS (PR #1956, advisor round 2):
    Verdict: CHANGES REQUESTED (one item; everything else from round 1 is resolved — PhaseDonePr binding, lease-resolved workspace, rework-recovery ownership check, status joined from the spec)
    Findings:
    1. workflow_hints::branch_belongs_to_spec still over-refuses: the id regex ([a-z]+-\d+(?:-\d+)*) treats ANY word-dash-digits as a spec id. Real branches this breaks: `pr-1948` (the reviewer worktree branch pr_rebase_handler creates → reads as PR-1948, so finishing a review story from it is refused), `batch-followups-0918h` (reads as FOLLOWUPS-0918), slice branches like `task-1189-4` (reads as TASK-1189-4 ≠ TASK-1189). Fix: extract only ids whose prefix is an AIDA requirement-type prefix (derive the set from RequirementType / the id dispenser, do not hand-list), and compare on the numeric core so slice suffixes and node-qualified agreed ids (TASK-1-127) match their spec. Tests: accept pr-1948 for STORY-1231, batch-followups-0918h, task-1189-4 for TASK-1189, bug-1244-keyboard for BUG-1244; refuse story-1221 for BUG-1236.
    Contract: one commit for this item; the drain reviewer's findings (if any) stack on top.
