    REVIEW FINDINGS TO ADDRESS (PR #1956, advisor round 1 — CI red, no drain reviewer ran):
    Verdict: CHANGES REQUESTED
    Findings:
    1. CI red is caused by the new guard itself: workflow_hints::branch_belongs_to_spec returns false for `main`, so `queue done` run from the main checkout (aida-cli/tests/agent_write_confirm.rs::queue_done_non_interactive_without_yes_marks_done_not_cancelled and aida-cli/tests/journey.rs::agent_journey_toon_list_search_queue_done_and_status both do exactly that) is refused. Change the rule to: refuse ONLY when the branch names a DIFFERENT spec — extract [A-Z]+-\d+ ids from the branch name; if any id is present and none equals the target, refuse; if no spec id is present (main, master, feature/foo, batch-followups-0918h, single-branch cluster names), allow. Apply the same rule in the phase-1 workspace check. Add tests for main, a batch branch and a sibling spec branch.
    2. Acceptance items missing: (3) the CI and reviewer phases must resolve the PR from THIS run's PhaseDonePr event, never from a branch inherited from a sibling, and must punt when no PR exists for this spec; (4) a queue entry whose status is Done while the spec is Approved/InProgress is treated as a FRESH pickup (or `aida edit --status` resets the entry) — this is what produced recurrence 2; (5) the rework brief attached at pickup is keyed to a PR this spec's run opened, not to the last verdict file written under this spec's phase.
    3. The acceptance's drain banner (worktree + branch at phase-1 start) only prints a real workspace on retry/resume; on the first attempt implementer_workspace() returns the project root + current branch, which is the misleading case. Print the minted lease's worktree and branch once the lease exists (or omit the line until then) rather than the driver cwd.
    Contract: produce at least one commit addressing 1 (the red) and as much of 2-3 as fits; if items 2(3)-(5) are split into a follow-up, say so and file it as a child BlockedBy nothing.
