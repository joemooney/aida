    what landed, against the five findings this spec collected:
     1. phase 1 runs in the spec's OWN workspace — implementer_workspace resolves from the spec's lease (or its default worktree/branch), the phase-1 args are pinned to it even on the first attempt, and a sibling workspace is refused before the implementer runs.
     2. queue done ownership — the final rule is the acceptance as clarified after round 3: a branch naming a different requirement refuses; a branch naming the target (slice suffixes, node-qualified ids) accepts; an unscoped branch consults commits since the merge-base ONLY when there are any, so no commits accepts, commits with no spec references accept, and commits naming only other specs refuse; an unreadable range fails closed; --force is the ledgered override. Requirement prefixes come from the new RequirementType::ALL rather than a second hand-maintained table.
     3. CI and reviewer phases bind to THIS run's PhaseDonePr and refuse a mismatch, so a phase can no longer review a sibling's PR under this spec's name.
     4. a queue entry whose status has diverged from the spec is treated as a fresh pickup (the mechanism behind recurrence 2).
     5. rework recovery only adopts a PR that belongs to this spec.
