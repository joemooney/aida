    Mechanism to add to the fix list: (4) a queue entry's status must not diverge from the spec's — resetting a spec from Done to Approved (or any status edit) must reset its queue entry, or the pickup must read the SPEC status and treat a Done-entry/Approved-spec mismatch as fresh; (5) the rework brief must be keyed to a PR that this spec's run opened (PhaseDonePr for this spec), never to a verdict file written while this spec's phase was reviewing a sibling's PR.
    Repair applied at the gate: #1952 retitled to TASK-1283 (the spec that actually asked for those tests); after this run's reviewer finishes, BUG-1236's queue entry is removed and re-added fresh and the spec reset to Approved so the next pickup implements BUG-1236 itself.
