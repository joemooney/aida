    ## Advisor verdict — round 1 (AC2, AC3, AC5, AC6 + sketch limbs 1-3): APPROVED after one rework round

    PR #2305, branch `bug-1747` @ `9e813ca444`, on `main` @ `3f68acaa1a`. Implemented by a dispatched
    codex implementer against `docs/plans/2026-09-30-bug-1747-merge-hold-label-fail-direction.md`
    (Option C, signed off). **AC1's doctor wiring and limb 4 remain open** — briefed for round 2 at
    `.aida/handoff/advisor/bug-1747-round2-brief.md`.

    ### Blocker found in round 1, fixed in 1b

    The repo-scoped probe's existence predicate was a **substring** test, and two of the three registry
    names carry the third as a prefix:

    ```
    "aida:merge-hold-recorded".contains("aida:merge-hold") == true
    "aida:merge-hold-cleared".contains("aida:merge-hold")  == true
    ```

    A repository missing `aida:merge-hold` but carrying `aida:merge-hold-recorded` therefore reported the
    base label **present** — a false pass on exactly the label whose absence silently disables the
    `merge-hold-gate` check. That is this spec's own defect reintroduced one layer up, in the code meant
    to detect it.

    The round-1 test could not catch it: its partial fixture defined only `aida:merge-hold` and asserted
    the other two missing, which is the single ordering the substring bug cannot break. **Lesson for AC1's
    round 2 tests: a prefix-family predicate must be tested in both directions.**

    Fixed in 1b — GitHub compares parsed names exactly; GitLab, which must scan raw output lines, uses a
    boundary-safe `line_defines` rejecting a match extended by alphanumeric, `-`, `_` or `:`. Two
    regression tests now cover the previously untested ordering on both forges.

    ### Verified first-hand by this seat, not carried from the implementer's report

    - `--lib merge_hold` **69 passed, 0 failed**; `--lib pr_ship` **118 passed, 0 failed**.
    - `cargo fmt --all -- --check` exit 0; `cargo clippy -p aida-cli-lib` no errors, 194 warnings
      (unchanged baseline across both rounds).
    - **Mutation proof re-run independently.** Restoring the substring predicate reddens
      `github_probe_does_not_treat_longer_labels_as_the_base_label` with `left: []` /
      `right: ["aida:merge-hold"]`. Restored with `cp`, confirmed by `diff -q`, re-confirmed green.
    - `merge-hold-gate` SUCCESS on the PR head.

    ### Two should-fixes also taken in 1b

    - `unreachable!()` in the new `MergeHoldAction::Labels` arm replaced with the no-forge reporting path.
      A panic in the command an operator runs to diagnose a broken gate is the wrong failure mode, and the
      branch is reachable the moment `resolve_pinned_repo`'s "Ok(None) only when ForgeKind::None"
      invariant changes.
    - `--json` emitted two different schemas (hand-rolled `status` for no-forge/unknown, `serde_json`
      without `status` for success). Now one shape from all three branches, one document per invocation.

    ### Accepted with a note, not a blocker

    `line_defines` checks only the character **after** each match, not before, so a hypothetical label
    named `xaida:merge-hold` would read as defining `aida:merge-hold` on the GitLab path. Not a realistic
    member of this prefix family, and GitLab self-provisions labels on application, so the exposure is
    negligible. Recorded here rather than spent as a third round.

    ### Confirmation of the spec's own evidence

    All three label definitions **do** currently exist on `joemooney/aida` (read via `gh label list`
    2026-09-30: `aida:merge-hold` B60205, `aida:merge-hold-recorded` B60205, `aida:merge-hold-cleared`
    0E8A16), consistent with the filing's note that BUG-1693's unblock was a one-off operator action. The
    registry reproduces those values exactly, so provisioning a fresh repository yields the same
    definitions this repo already runs.
