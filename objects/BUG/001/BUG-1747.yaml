    ## Round 1 merged; this spec was auto-bumped to Completed prematurely and deliberately reopened

    PR #2305 squash-merged to `main` as **`b6dd78aebe`** at 2026-10-01T07:09:40Z. Both gates were read at
    the same head SHA `9a8385b0ca` before merging:

    - Local `cargo test --workspace` from the branch worktree: **7437 passed, 0 failed, 2 ignored**,
      `cargo_exit=0`, 94 `test result:` lines and **zero** `test result: FAILED`. (The `error:` and
      `panicked at` lines in that log are inside tests that drive failure paths on purpose.)
    - GitHub checks at `9a8385b0ca`: `Build (ubuntu-latest)` **success**, `merge-hold-gate` **success**,
      `Release` skipped. `mergeStateStatus=CLEAN`.

    The `(BUG-1747)` trailer then auto-bumped this spec to Completed on `aida pull`
    (`auto-bumped 1 spec -> Completed: BUG-1747 (was Approved, commit b6dd78a)`). **That bump is wrong**
    and I reversed it with `aida edit BUG-1747 --status approved --force` — note the plain `--status`
    form refuses a reopen without `--force`, which is a good guard, not an obstacle.

    **What round 1 actually delivered:** AC2, AC3, AC4, AC5, and AC6's atomic-failure half.

    **What is still open and why this spec is not done:**

    - **AC1** — `aida doctor check merge-hold-integrity` does not yet probe for the three label
      definitions. The probe primitive (`label_definitions` / `label_definitions_with` /
      `LabelDefinitions`) is now on `main`, but nothing in `doctor_cmd.rs` calls it.
    - **AC6's doctor half** — all-present / some-missing / forge-unreachable coverage of that probe.
    - **Sketch limb 4** — a live hold recorded `Unsynced` becoming a durable finding. (Its `aida human`
      half is ruled out of scope in the preceding comment, with the verification behind that ruling.)

    **The round-2 brief is written, premise-checked against the merged code, and ready to dispatch
    verbatim:** `.aida/handoff/advisor/bug-1747-round2-brief.md`. Its prerequisite ("round 1 must be
    merged first") is now satisfied.

    A fast way to confirm this spec is genuinely incomplete rather than taking this comment's word for it:
    `grep -n 'label_definitions' aida-cli-lib/src/doctor_cmd.rs` returns nothing on `main`.
