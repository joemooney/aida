title: Resolve MR-scoped stale leases before headless steal
description: |
  A direct reviewer pickup with `--steal` can fail closed before reclaiming a clean stale MR-scoped lease because the guard attempts to resolve synthetic scope `MR-N` as a requirement and reports `store unreadable or spec unknown`.

  Observed in qci#TASK-207 for MR-26. The stale lease and worktree were clean and could be ended safely with `aida session end`, after which the same reviewer pickup succeeded without `--steal`.

  ## Acceptance
  - `aida queue work <review-story> --role reviewer --steal` recognizes MR/PR synthetic scopes without requiring a requirement lookup.
  - A dead-process, clean MR-scoped lease is reclaimed and the reviewer starts.
  - Live or dirty leases still fail closed with actionable diagnostics.
  - GitHub PR and GitLab MR scope forms are covered.
