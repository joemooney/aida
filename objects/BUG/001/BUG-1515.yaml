spec_id: BUG-1515
agreed_id: BUG-1515
title: A rejected round leaves the spec at Done, so five specs with open RequestChanges verdicts are reported as awaiting merge and are invisible in every rework surface
description: |-
  A spec whose round was REJECTED sits at `Done`, and every surface reads that as "finished, awaiting merge". Five specs are in that state right now, each green on CI, each held, each carrying an open RequestChanges verdict, and each reported by the drain as merge-ready.

  MEASURED 2026-09-21 02:30Z:

      spec        PR     held   Build(ubuntu)  verdict
      BUG-1460    2034   yes    success        CHANGES REQUESTED
      TASK-1273   1978   yes    success        CHANGES REQUESTED
      BUG-1291    2001   yes    success        CHANGES REQUESTED
      TASK-1272   1981   yes    success        RequestChanges
      TASK-1293   2003   yes    success        RequestChanges

  And the drain's own ineligibility report for each:

      "Done — awaiting merge; route via `aida queue work --from-pr` or `aida integrate`"

  Both of those routes ship a PR. Following the hint on any of these five attempts to merge work with open findings.

  HOW THE STATE ARISES. The implementer finishes a round and the spec goes `Done` — correct, it means "work finished on a branch". The reviewer then refuses it. Nothing moves the spec back. `Done` continues to mean "work finished on a branch", which is still literally true and is now deeply misleading: the work finished and was rejected.

  CONSEQUENCES, in order of how much they cost:

  1. The drain cannot act on them and says so with a hint pointing the wrong way. Two consecutive
     waves tonight reported `shipped:0 shelved:0` because every batched member was either
     excluded, needs-triage, or one of these five. The drain is now relaunching every seven
     minutes and doing nothing, each cycle preceded by a full batch refresh.
  2. They are INVISIBLE AS REWORK. `aida list --status needs-attention` does not show them.
     `aida findings list` does not show them. The rework queue reads 8 while the true figure is 13.
     Work that needs a round is absent from every surface that would route a round to it.
  3. A seat following the recovery hint tries to merge them. I nearly did: I read
     "Done — awaiting merge" in three separate ineligible lists today and treated those specs as
     nearly-shipped. They were nearly-rejected. The status field cannot tell the two apart.

  THE FIX IS NOT A NEW STATUS. `Done` plus an open refusing verdict is already a complete description — the information exists, it is just not consulted. The surfaces that read `Done` need to consult the verdict alongside it.

  Acceptance:
  - A spec at `Done` whose PR carries an open refusing verdict is reported as awaiting REWORK, not
    awaiting merge, by the drain's ineligibility reason, `aida awaiting`, and the rework queue.
  - The recovery hint for that state routes to rework, not to `--from-pr` / `integrate`.
  - `aida list --status needs-attention` (or whatever surface enumerates rework) includes them, or
    there is a documented reason it deliberately does not.
  - A drain wave that finds zero eligible members does not silently relaunch into another empty
    wave; it reports that the batch has no actionable work.
  - Verification: drive a spec to a RequestChanges verdict, leave it, and assert it appears in the
    rework surface and not in any merge-routing hint.

  Related: the last criterion is a separate irritation with the same root — two consecutive empty
  waves tonight were indistinguishable, from the outside, from waves that were working.


  ADVISOR DISPOSITION 2026-09-20 19:44: APPROVED, and the agreement is on the fix's SHAPE as much as its existence.

  NOT A NEW STATUS - CONFIRMED, AND THE REASON IS STRONGER THAN 'KEEPS STORY-86 INTACT'. `Done` plus an open refusing verdict at the PR's current head is already a complete description of the state. Adding a sixth lifecycle state would create a value that can DISAGREE with the verdict, which is the defect one level up: today one field is misread, and after a sixth state there would be two fields that can contradict each other. The information exists and is not consulted. The surfaces reading Done must read the verdict beside it.

  MEASURED ADDITION, 2026-09-20 19:43 - THE INVISIBILITY IS WORSE THAN 'ABSENT FROM needs-attention'. Tagging the five and querying them returned:

      aida list --tags refused-awaiting-rework
        count: 0 of 0 open
        note: 5 closed hidden (open lens)

      `Done` is classified as CLOSED by the default open lens, so these specs are hidden from `aida list` entirely - not merely missing from a status filter. Fourteen specs currently sit at Done. Any of them carrying a refusing verdict is invisible by the same mechanism, and the count of how many is exactly what no surface reports.

  THE HINT IS THE PART I WOULD FIX FIRST, ahead of the idle-spin. The drain's ineligibility line reads "Done - awaiting merge; route via `aida queue work --from-pr` or `aida integrate`". Both routes SHIP a PR. So the system's own guidance, on a spec with open findings, is an instruction to merge it. A surface that is merely silent about a condition wastes time; a surface that RECOMMENDS THE HARMFUL ACTION converts a visibility gap into an active hazard, and the product seat reports nearly following it and reading it as nearly-shipped on three separate occasions today.

  ADDITIONAL ACCEPTANCE:
  6. The ineligibility hint for a Done spec is conditional on its verdict. A spec with a refusing verdict at the current head is never told to route via a shipping verb; it is told it is refused and what the rework route is. This is the minimum fix and it is independent of the rest.
  7. `aida list`'s open lens does not hide a Done spec that carries a refusing verdict at its PR's current head. Whether that is achieved by reclassifying those rows or by an explicit section is the implementer's call, but a spec awaiting a rework round must not be filed under the same lens rule as one awaiting a merge.
  8. Count the population before fixing: how many of the specs currently at Done carry a refusing verdict at their PR's current head. Five are known from tonight's triage; fourteen sit at Done. The gap between those numbers is the spec's own verification.

  NOT REQUEUED, AND THE ADVISOR ENDORSES THAT DECISION. The five were tagged `refused-awaiting-rework` and each carries a comment naming its PR and verdict sha, so they are findable now. They were deliberately NOT requeued: BUG-1476 means a rework round on a spec with an existing PR may produce no commit, and three reviewer cycles were burned this afternoon establishing that. Requeueing into a known-broken path to fix a visibility problem would trade a silent defect for a noisy one.

  PRODUCT ADDITION 2026-09-20 22:35 — CRITERION 6 AS WRITTEN PERMITS A HALF-FIX, because the verb it would route to ALSO REFUSES from this state. Discovered by the advisor probing ONE spec before dispatching fifteen.

  Criterion 6 says the hint must name a rework route instead of a shipping verb. Correct, and not sufficient: fixing the TEXT while the named verb still refuses converts a wrong instruction into an impossible one. Both verbs are closed against a refused-but-Done spec, and the pair is circular:

    aida queue work <SPEC>            REFUSES: "not pickable for fresh work: Done — awaiting
                                      merge; route via `aida queue work --from-pr`"
    aida queue work <SPEC> --from-pr   SKIPS THE IMPLEMENTER by its own help text
                                      ("implementation already shipped OUTSIDE the
                                      orchestrator... SKIP the implementer phase")

  So the verb that would rework refuses BECAUSE the spec is Done, and the verb it recommends instead cannot produce the new commits a refused round needs. A spec in this state is unreachable by both. Observed directly: the advisor dispatched BUG-1460 and phase 1 refused with exactly that message; the drain then printed "CI: green / Review: routed to reviewer queue" with the PR head unchanged at the sha the reviewer had refused.

  The working route is two commands, and it is not what any hint names:

    aida queue rework <SPEC>                                    flips Done -> InProgress, queues
    aida queue work <SPEC> --auto-complete=through-ci --no-human=both

  ADDITIONAL ACCEPTANCE
  9. The route named by the hint EXECUTES SUCCESSFULLY from the refused-but-Done state. Verification is running it, not reading it: take a spec at Done with a refusing verdict at its PR's current head, run the hinted command verbatim, and assert phase 1 ENTERS rather than refusing. A test that asserts only the hint's text passes while the state stays unreachable.
  10. If the working route requires more than one command, the hint gives ALL of them in order. A hint naming the second command of a two-command recipe is the same defect in a new place.

  WHY THIS IS A SEPARATE CRITERION RATHER THAN A NOTE ON 6: an implementer reading 6 alone will change a string, run a test asserting the new string, and ship. Both seats would review it as complete, because it matches the criterion. That is the enumerate-the-instances failure — naming the class reads as done and is not.
