title: 'Windows nightly red: reconstitute scratch_gc test sets a directory mtime via File::open, which fails on Windows (needs FILE_FLAG_BACKUP_SEMANTICS or filetime on the path)'
description: |-
  Cross-platform nightly 2026-09-18 (run 35337447928, GitHub auto-issue #1925) is red on Build (windows-latest) with exactly one failure:

    reconstitute::tests::scratch_gc_expires_old_runs_and_keeps_only_the_newest
    panicked at aida-cli-lib/src/reconstitute.rs:773:18 (4899 passed, 1 failed)

  Cause (verified against the test source): the test opens each run DIRECTORY with std::fs::File::open(&run) and calls set_times(...) on it to back-date the mtime. On Windows, opening a directory as a File requires FILE_FLAG_BACKUP_SEMANTICS; std's File::open does not set it, so the open (or set_times) fails and .unwrap() panics. Linux/macOS allow it, which is why PR CI is green. The product code (prune_scratch_runs) is not implicated; the test fixture is.

  Fix options (pick the smallest): on Windows open via std::os::windows::fs::OpenOptionsExt::custom_flags(FILE_FLAG_BACKUP_SEMANTICS) before set_times; or write a small cross-platform helper set_dir_mtime(path, time) used by this test (and any sibling fixture doing the same). Do NOT #[cfg(not(windows))] the whole test away — the GC behaviour must stay covered on Windows.

  Acceptance: the test passes on windows-latest (cross-platform.yml dispatch or the next nightly green); scripts/check-portability.sh still passes; no product-code change unless prune_scratch_runs itself is found to misread Windows dir mtimes.
