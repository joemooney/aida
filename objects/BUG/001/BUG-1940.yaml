title: aida cache rebuild fails with 'database disk image is malformed' instead of rebuilding when cache.db is corrupt
description: |-
  2026-10-10 18:50: with a corrupt .aida/cache.db (broken requirements_fts table; integrity_check: 'vtable constructor failed: requirements_fts'), both aida cache rebuild and aida cache verify exit with error "database disk image is malformed". The documented recovery path can't recover from the one failure it most needs to handle. Every aida read command fails the same way until someone moves the file by hand (mv .aida/cache.db{,-wal,-shm} aside) and runs rebuild again; after that, rebuild succeeds (5006 specs, verify clean).

  Expected: rebuild doesn't depend on the old file being readable. On an open/integrity failure it moves cache.db, -wal and -shm into a quarantine path, prints that it did so, and builds from the git store. Read commands that hit SQLITE_CORRUPT should print the one-line fix (aida cache rebuild) instead of the raw sqlite error.

  Recurrence evidence for the underlying corruption is on STORY-1484.
