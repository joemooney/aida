title: 'GitLab mirror hub drifts for hours: aida remote mirror-push finishes in ~11 ms and appears not to push'
description: 'Seen 2026-09-26 by the hub-drift guard triage: gitlab main was 5 commits behind origin and gitlab''s aida-store copy was ~5 h stale, while usage.jsonl shows remote mirror-push calls completing in ~11 ms. Acceptance: 1. Determine why mirror-push does not update the gitlab hub (skip condition, wrong remote, silent error) and fix it. 2. mirror-push reports what it pushed or why it skipped, and exits non-zero on a push failure. 3. Fixture test with two bare remotes proves main and aida-store reach the mirror after a merge.'
status: Done
priority: Low
