  ## Acceptance
  - AC1. Both stale-base and intermediate-only reviewer preflight probes fetch the pull-request head into a process-specific `refs/aida/preflight/pr-N-PID` ref, leave the conventional local `pr-N` branch unchanged, and delete the scratch ref after a successful probe.
  - AC2. When the stale-base force-push guard refuses, the surfaced recovery hint tells the operator to follow the fetch-and-rebase recipe in the failure detail and then rerun review with `aida queue work PR-N --steal`.
