    [aida:sem]
    decision: A force-push refusal preserves the full actionable guard diagnostic by appending it to `.aida/logs/pr-rebase-N.log`, and failure to create or write that log does not prevent scratch-worktree cleanup.
    rationale: The requirement asks to keep a patch/log for inspection but does not specify a durable location, append behavior, or that diagnostic persistence is best-effort and subordinate to cleanup. A user can inspect the log after repeated refusals or make the log unwritable and verify cleanup still occurs.
