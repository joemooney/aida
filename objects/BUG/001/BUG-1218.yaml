- id: 01a0b3dd-4fb3-7c92-a44f-1cc2ac7f2c83
  author: harvest
  content: |
    [aida:sem]
    decision: The reviewer classifies an auto-rebase subprocess failure as `stale-base-refused` when its combined stdout/stderr contains either `force-push refused` or `Force-pushing would DROP`; other nonzero auto-rebase exits retain the generic failure path.
    rationale: This is the observable boundary that makes the typed non-retryable outcome work across the child-process interface. Tests can vary subprocess output and verify which cause is emitted; the requirement does not state the recognition protocol.
