title: 'Drain reviewer phase: a refused stale-base auto-rebase leaves .aida/worktrees/pr-rebase-N with pr-N checked out, so the retry''s reviewer cannot fetch pull/N/head:pr-N and the member shelves as tool-ex'
description: |-
  Observed 2026-09-18 00:38 on BUG-1207 / PR-1916 (batch followups-0917b, binary 6a948876). Phase 3 attempt 1: 'stale-base + overlap detected on PR-1916; attempting one clean auto-rebase' → worktree .aida/worktrees/pr-rebase-1916 on branch pr-1916 → rebase ok → the force-push guard correctly refused ('origin/bug-1207 has 1 commit not incorporated into this branch by patch-id: 88cf4ac918') → 'Worktree left at .aida/worktrees/pr-rebase-1916 for inspection' → error surfaced as a plain tool-exit and the phase retried. Attempt 2: the reviewer child ran  and failed 'refusing to fetch into branch refs/heads/pr-1916 checked out at .aida/worktrees/pr-rebase-1916' → exit 1 → tool-exit → SpecShelved. The leftover from attempt 1 poisoned attempt 2 deterministically; no reviewer ever ran. Three defects: (1) the auto-rebase must remove its scratch worktree (and drop the pr-N branch it created) on EVERY exit path, keeping only a patch/log for inspection; (2) a force-push refusal is not transient — it must shelve with a typed cause (e.g. stale-base-refused) carrying the guard's recovery text (fetch + rebase the un-incorporated commit) instead of tool-exit + a wasted retry; (3) the reviewer's pr-N checkout must not target a branch checked out in another worktree (detect and use a unique branch name, or fail with a typed message naming the worktree). Acceptance: after a refused auto-rebase, /home/joe/ai/aida                                            3f200c957c [main]
