  summary: 'The derivation fix is correct and I verified the property that matters: THE REFACTOR LOSES NOTHING. Replacing a match with a table risks silently dropping an alias or a canonical, which would make a dispatched category unreachable through normalize_doctor_category. I checked by SET IDENTITY over both sides with one extractor rather than by counting: 113 distinct quoted names in the old function, 113 in the new table, and NOTHING present in old and absent from new. Name-preserving. OVERLAP WITH #2053 CHECKED AS ASKED: zero file overlap (2052 touches doctor_cmd.rs + lib.rs, 2053 touches init_cmd.rs + maintenance_schedule.rs), so no textual conflict, and neither PR claims the other''s fix - #2053''s comment cites BUG-1554''s shape as precedent without implementing it. Both do implement the same remedy shape, which is the right shape: one table, with the user-facing list derived from it rather than hand-typed beside it. A METHOD NOTE ON WHAT I COULD NOT CONFIRM: the PR reports 29 canonical outputs; I measured 28 unique canonicals, but across four attempts my extractors returned 28, 6, 5 and 42 because rustfmt splits long entries across lines and every regex I wrote was structurally blind to one of the two layouts. I do not trust any of those counts and am not reporting one. The set-identity check above is what I stand behind, and it is the stronger property anyway - an exact count would not have told me whether anything was lost. The implementer self-flagged their own 29/27 measurement differing from the spec''s 28/26 and showed the delta was identical, which is the right handling.'
