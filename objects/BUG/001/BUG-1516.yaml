    WHAT REMAINS HERE after BUG-1546 lands:
      2. New verdicts record the FULL 40-character sha. One writer already does this; the
         abbreviated ones come from paths that pass an already-abbreviated string through.
      3. The existing abbreviated verdicts are resolved to full shas where the commit is still
         reachable, and marked unresolvable where it is not.
      5. A test compares an abbreviated recorded sha against a full head and asserts they are
         recognised as the same commit.

    UPDATED MEASUREMENT for whoever takes those three. The description cites "24 existing abbreviated verdicts"; a full sweep on 2026-09-21 over all 572 files under .aida/review-verdicts found 147 carrying a sha, with lengths {8:4, 9:3, 10:19, 11:1, 12:12, 13:2, 40:106} — so 41 abbreviated, not 24, and the shortest is 8 characters. Criterion 3's population is larger than the spec states.

    AND THE HEADLINE SYMPTOM IS ALREADY MITIGATED IN ONE SURFACE, which changes this spec's urgency but not its scope: the rework-ready row merged as ad85e8ed32 compares by shared prefix, so 5 of 14 open sha-bearing verdicts that are abbreviated-but-current are judged SAME rather than stale. That is this spec's symptom handled at ONE call site. Criterion 2 is what stops it recurring at the next one, and criterion 3 is what repairs the records already written — neither is done by that merge.

