  author: joe
  content: |
    PLAN (planner, origin/main 2e01ffe4ab; claude/integrate-101 noted, no overlap): retry a listed object once before omitting it, and make AIDA's own object writes atomic.

    FILES/SYMBOLS
    - aida-core/src/object_store.rs: load_all_objects_with_fingerprints :393-423 (read at :401-407, warn-and-omit at :410-418); list_objects :246-279 (filters on the .yaml extension); write_object :131-150 (std::fs::write at :147) and write_object_if_changed :161-190 (std::fs::write at :188): these two are AIDA's own object writes. delete_object :225-234 unchanged.
    - aida-core/src/fs_atomic.rs: write_atomic :84-96 (temp <stem>.tmp.<pid>.<seq> + rename); read_atomic :119-126 (BUG-1660: no retry on Unix; do not reintroduce a blanket wait).
    - aida-core/src/db/git_backend.rs: load :1542-1555 (caller); save_reporting deletion plan :1099-1119 (BUG-1612 guard: deletes only snapshot-recorded, fingerprint-matching objects; unchanged). save_metadata :711 and the queue/user YAML writes at :1797-1978 use the same in-place pattern: out of scope here, mention in the PR.
    - aida-core/src/git_ops.rs: add_all :170-177 (`git add -A objects` stages untracked files) and ensure_store_lock_excluded :83-86 (runtime info/exclude): add objects/**/*.tmp.* to the exclude entries so a SIGKILL-orphaned staging file is never committed.

    APPROACH
    In the loader, wrap the per-object read+parse in read_listed_object(spec_id, path) -> Result<(String, Requirement)>; on Err classify: io NotFound (walk err.chain() for a std::io::Error of that kind) or a serde parse error -> sleep 25 ms once, then retry the SAME path (the path is deterministic; a re-list is a full directory walk and buys nothing). Retry outcome: Ok -> push as normal; still NotFound -> the object was genuinely deleted during the load: omit with a one-line `note: <spec_id> was removed while loading; skipped` (not the parse-failure hint, which misleads for a deletion) and record no fingerprint; still a parse error -> today's warning + hint, and keep inserting the fingerprint of the text read (BUG-1612 relies on unparseable files being recorded so a save never deletes them). Only listed objects retry, only once, so a genuinely missing file costs one 25 ms wait per missing object, never a blanket delay. Convert :147 and :188 to crate::write_atomic(&path, &yaml); list_objects ignores the temp names because with_extension drops .yaml.

    EDGE CASES / FAIL-SAFE
    - A half-written file from a git checkout (git writes in place) is the parse-error retry case. Windows: write_atomic's rename-over-existing is already used elsewhere; read_atomic keeps its Windows retry. A checkout that deletes the shard dir between read_dir and the read lands in the NotFound branch. The whole-store save guard stays exact: an omitted object has no fingerprint, so save_reporting classifies it kept_unloaded (:1106-1108) and never deletes it. count_objects unchanged.

    TESTS (aida-core object_store tests; tempdir fixtures, no HOME use; add a cfg(test) thread-local hook between_list_and_read(spec_id) invoked in the loader before each read, mirroring OBJECT_LIST_COUNT :429-432 and the TASK-1515 hook style)
    - loader_retries_object_recreated_between_listing_and_reading: hook deletes then rewrites the file for one spec on its first call; assert the spec is loaded, its fingerprint recorded, and the hook ran once for it.
    - loader_retries_half_written_object_once: hook truncates the file to half, then restores it on the second call; loaded.
    - loader_omits_object_deleted_for_good_without_parse_hint: hook deletes and does not restore; spec absent, no fingerprint, the note is printed, and save_reporting afterwards leaves the surviving objects untouched.
    - loader_records_fingerprint_for_persistently_unparseable_object (guards the BUG-1612 contract).
    - write_object_is_atomic_and_leaves_no_temp_file: after write_object no *.tmp.* sibling; a concurrent read_atomic loop in a thread never observes a partial file.
    - store_exclude_covers_object_staging_files (git_ops: the exclude file contains the pattern and `git status --porcelain` ignores a planted objects/BUG/000/BUG-1.tmp.1.1).

    OVERLAP / ORDERING
    - Disjoint from BUG-1663 (which changes the rebuild caller in cached_git_backend.rs and git_ops, not the loader) and from integrate-101; land in any order. BUG-1660's zero-wait Unix contract must stay: the new wait is per-failed-object, not in read_atomic.

    VERDICT: READY.
