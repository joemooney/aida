title: Store loader silently skips a spec that a concurrent git checkout is recreating (immediate NotFound on Unix)
description: 'Follow-up from the BUG-1660 review. .aida-store objects are written in place (object_store.rs std::fs::write) and git checkout/pull replaces files by delete+create. load_all_objects_with_fingerprints warns and omits a spec whose read fails, so a load racing a checkout can drop a spec from that one load (no data loss: whole-store save only deletes objects its load recorded). Acceptance: 1. On NotFound (or a parse error) for a listed object, the loader re-lists and retries that object once after a short delay before omitting it. 2. Store object writes use write_atomic (temp+rename) where they are AIDA''s own writes. 3. Test: a fixture that deletes and recreates an object between listing and reading still yields the spec.'
