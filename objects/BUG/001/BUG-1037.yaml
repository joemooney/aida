title: reviewer preflight checks resolve the forge as pure-git on a github-origin project — one forge resolution for the whole pipeline
description: 'TASK-1198 attempt 6 (2026-09-10 05:39, testbed with github origin): the phase-3 stale-base and intermediate-only preflight checks both warned could not resolve change metadata — this project has no forge (pure-git) and proceeded degraded, while the same pipeline''s auto-open resolved GitHub fine post-BUG-896. Forge resolution is still computed independently per call site with different context (cwd/root), so the same project is GitHub in one phase and forge-less in the next. Fix: resolve the forge ONCE per pipeline run from the target project root and thread it through every phase consumer (preflights, auto-open, merge, linkage); a resolution mismatch between call sites becomes impossible by construction. Acceptance: a github-origin project resolves GitHub in every phase message; regression test asserting the preflight and auto-open use the shared resolution; the pure-git warning appears only for genuinely forge-less projects.'
