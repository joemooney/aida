agreed_id: BUG-1656
title: aida ps/awaiting flag Agent-tool subagents' live spec work as orphaned/abandoned and suggest a salvage-commit into the worktree they are editing
description: 'Observed 2026-09-26: the orchestrator dispatched Claude Code Agent-tool subagents into existing leased worktrees (wt-task-1515, wt-bug-1641). The subagents hold only a generic harness-worktree lease on the main checkout, so aida ps showed the spec lease as dead, ''salvageable: nothing running, uncommitted work'', and recommended ''git add -A && git commit -m wip: salvage'' in the worktree the live agent was editing mid-change. aida awaiting listed both as ''orphaned In-Progress: abandoned''. Following the advice would commit half-written work under the agent and race its edits. Fix: (1) treat recent file movement in the worktree (dirty mtime within N minutes) as liveness, and never recommend salvage while the dirty tree is still changing; (2) give Agent-tool subagents a way to adopt the spec lease (e.g. aida worktree enter/adopt from within the subagent, or the dispatcher records the harness session against the spec lease); (3) the awaiting item should say ''possibly worked by a subagent'' when a live harness lease exists in the same repo. Acceptance: a test with a dead spec-lease pid plus fresh dirty-file mtimes gives no salvage advice and no ''abandoned'' awaiting row.'
status: InProgress
priority: Medium
owner: ''
feature: Uncategorized
