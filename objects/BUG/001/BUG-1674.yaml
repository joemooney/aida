    ADVISOR SIGNOFF: APPROVED (with binding amendments)

    Independent advisor: Codex, separate from product, sketch author and implementer; independent cache-correctness consultation by GPT-6 Astra. Reviewed the latest “SKETCH (awaiting independent advisor signoff)”, STORY-1484's signed-off A1–A13/Q answers, live TASK-1526 scope/comment and uncommitted implementation overlap, BUG-1606, and actual main source at 854b7e26f7222c73845064275a18c293c9895283. This approves design only: no implementation/test-pass, merge, dispatch, queue, relation or closure approval.

    VERIFIED RATIONALE
    The sketch correctly repairs the premise. git_backend_cmd.rs:1018–1041 opens with_inner and runs the upstream notice before Show; :4111 uses get_requirement_unambiguous_for_read. cached_git_backend.rs:40–51, :353–447 conditionally enter strict refresh when the diagnostic sidecar shortcut fails; cache.rs:547 has 25.5 seconds of sleeps, and incremental error can escalate to full_rebuild plus another ladder. Cache::open also performs schema/open work. resolve_unambiguous :212 can inner.load on error; git_backend.rs:1584–1628 scans aliases/UUIDs on misses. These are real ceiling escape paths, not proof that a particular historical 24,484ms call spent exactly that time in one ladder. Reject the earlier PLAN's “telemetry matches exactly” and “show strict since BUG-1606” claims. Lock-info is first-writer-wins before SQLite acquisition (cache.rs:699; cache_lock.rs:487–539); it is not lock ownership or refresh progress evidence.
    Our requested CLI --full reads themselves encountered a schema-migration lock error naming schedule tick. That is an additional observation, not the required isolated reproduction or a historical stack attribution. Full comments were read via MCP.

    BINDING AMENDMENTS
    1. Select alternative B. Reuse TASK-1526's reviewed reader protocol, collector and lock arbitration. Do not implement alternative A's strict-by-delta resolver or a competing temporary bounded-mode subsystem. The actual prerequisite is BUG-1674 blocked-by TASK-1526, not merely an advisory sequencing hold. Product must record that edge before pickup; no edge is changed by this signoff. Wait for B's reviewed/merged APIs, then rebase. This approval does not authorize a stack or concurrent edits of B's live cache files. Preserve B's existing prerequisites. TASK-1514 retains deferred strict-by-delta ownership and TASK-1527 owns workers.

    2. Whole invocation: approve 4 seconds operational deadline with 1 second headroom, measured externally strictly below 5000ms. Start at CLI entry as soon as command classification is available, before backend/open/notices; propagate remaining time through every cache attempt, resolver, enrichment, git/forge subprocess, rendering and exit hook. Aggregate cache waiting <= min(1500ms, remaining), never per helper/backend. Env settings cannot enlarge the cap. Existing 2/3/4-second linkage limits do not add up to compliance. Kill/reap timed-out children within the budget; do not leave detached reader work. Success must contain a useful spec in the healthy old-cache fixture, not merely a timeout error. Budget exhaustion skips optional enrichment with explicit incomplete/unavailable semantics, never invented zero/current values or a false notice marker. Avoid inline refresh when its work cannot be bounded; no full scan, full rebuild, schema repair or normal retry ladder on this show path.

    3. Show-specific exception to STORY-1484 Q1/Q2/A7: no TTY inline full rebuild, 15-second migration wait, no-detach override or worker-crash strict fallback may exceed the command cap. Healthy compatible snapshots may be served labelled even for non-ancestor/missing stamp or full-rebuild-needed conditions if identity/object provenance can be established. Missing/corrupt/incompatible cache with no safe locator/provenance returns a specific bounded retry/upgrade/unavailable error; no destructive auto-heal or old-schema stale read. Unsupported flock fails bounded and explicit rather than entering strict refresh. Show does not depend on slice C: before C, say refresh is not running where appropriate; never invent a worker/request or promise progress. This does not decide B's separate interim behavior for other commands.

    4. Identity and object epoch are explicit. Pin ONE SQLite read transaction for candidate rows, graph rows and cache_head/built_at; perform any optional refresh BEFORE pinning, not in the read snapshot. Retain the selected UUID and native file path. Directly verify UUID, native spec ID and requested alias/ID; do not finish with existing get_requirement_by_spec_id(requested_id), which can choose another object or scan the store. Known multiple candidates are ambiguity errors; do not discard unreadable evidence to obtain a unique answer.
    Per STORY-1484 A1, a single snapshot candidate may be returned with explicit stale/identity-incomplete labelling when current collision completeness is unknown. This is not a claim of current global uniqueness. A stale snapshot miss, changed alias, UUID/path mismatch, deleted target or unreadable object is a bounded explicit retry/ambiguity/unavailable result, not false not-found. Mutations retain strict current collision checks.

    For a safe bounded historical object, read only the selected object's committed YAML blob at the pinned cache_head with a bounded subprocess and verify its identity. Use this as the specified stale-object route; it is a single-object read, not a new immutable whole-store snapshot. Do not treat mutable working YAML, even if it parses and HEAD is unchanged, as a complete historical object: object_store.rs:147/188 uses fs::write, so a valid partial YAML prefix is possible. If the blob is unavailable or fails identity validation, fail bounded. Any optional current-YAML optimization must separately prove a complete safe object; two byte reads/HEAD equality are insufficient and are not authorized as that proof. The entire historical object's status/outgoing relationships are labelled stale when newer or dirty/in-flight store state exists or freshness cannot be established. A dirty/unprovable epoch never emits stale:false merely because HEAD equals cache_head. Known cache projection race BUG-1663 is not repaired or assumed fixed here; snapshot metadata identifies the rows read, not proof all rows equal a Git tree.

    5. Output: reuse A9's scoped collector and one emit point, always-present cache metadata on object JSON/global JSON/TOON, with stale:false only when justified. Human note must cover historical object, identity resolution AND derived graph data, not just degrees. Preserve stored status versus effective epic rollup. A rollup from stale projection cannot silently overwrite stored/current semantics. Relationship IDs/types come from the selected YAML; unresolved target titles remain explicitly unavailable/UUID, never trigger find_by_uuid. Snapshot provenance survives a later writer commit; do not read built_at/head after reading older rows. No marker stamping from stale/skipped notices. Retain B's inside-IMMEDIATE head recheck, reentrancy, lock ordering and canonical sidecars; lock-info remains diagnostic. Restore deadline/collector state on all exits and between invocations. MCP is not silently converted to tolerant reads by this bug; any converted call must satisfy A9 each call.

    6. Scope: normal canonical-ID/UUID/alias single-spec show, human/default/full/brief/card/relationship projections and JSON/TOON, with default linkage enabled, is covered. --no-git only isolates diagnosis; it is not sufficient acceptance. Explicit --sync, PR-number network resolution and arbitrarily large --tree traversal are outside this single-spec ceiling proof; retain their behavior and identify them separately in measurement, without excluding any event from the configured doctor gate. If they keep the gate red, closure stays pending and product routes the residual scope; do not silently filter or redefine acceptance.

    REQUIRED NAMED TESTS (proposed names, not claimed present/passing)
    - show_live_foreign_writer_over_20s_returns_under_5s: real separate process, isolated git store/cache/fake HOME, old valid cache plus committed changed status AND relationships; BEGIN IMMEDIATE readiness handshake, >=22s hold, holder/transaction still live when externally timed CLI exits successfully <5000ms. Both absent sidecar and real holder sidecar; no shortened writer ladder. Assert useful result plus correct whole-object stale label/provenance, all output modes/default linkage, then let holder complete its required hold.
    - show_live_refresh_holder_over_20s_returns_under_5s: actual B refresh flock held/stalled with readable old WAL, same success/timing requirements.
    - show_snapshot_rows_and_stale_metadata_share_transaction: barrier-controlled commit between reads cannot relabel old rows fresh.
    - show_stale_alias_collision_does_not_silently_pick: known native/alias collision refuses; newly introduced unseen collision yields only explicitly snapshot/identity-incomplete result; selected UUID cannot change on final lookup.
    - show_uuid_locator_mismatch_never_full_scans; show_deleted_target_and_alias_change_fail_bounded.
    - show_parseable_partial_yaml_uses_committed_blob_or_fails_bounded; show_dirty_yaml_without_head_move_never_claims_fresh; show_stale_epic_status_and_relationships_never_unlabelled.
    - show_deadline_covers_open_notice_resolution_enrichment_linkage_and_exit; show_wait_env_cannot_extend_ceiling; show_nonancestor_or_missing_cache_never_full_scans; show_pending_migration_or_corrupt_cache_fails_bounded_without_old_schema.
    - show_labels_human_json_toon_and_collector_resets_after_error; show_uncontended_fresh_cache_preserves_output_semantics.
    - Preserve read_path_epic_rollup_refresh_never_scans_the_whole_store, epic_targeted_miss_makes_incremental_catch_up_decline, fresh-head upstream notice marker tests, strict mutation collision regressions, and B's refresh_txn_rechecks_head_inside_txn / nested_freshen_in_lock_holder_does_not_wait.
    Use deterministic barriers plus full-scan/rebuild/read-count probes, including a large-store case. Dispatcher-only timing or a same-process thread fixture is insufficient for the acceptance. Before implementation, reproduce/profile on isolated fixtures; no live-cache lock experiments.

    DOGFOOD / CLOSURE
    After owning seats review, merge and install, record binary SHA/version, activation time and lineage; verify running binary with aida dev status if needed. Retain closure:pending until a COMPLETE post-activation in-lineage 24h of normal concurrency and actual doctor check performance human/JSON outputs are attached here: eligible count, window, worst_ms and proportion >1000ms. BOTH configured limbs must be quiet (<=10% slow, no 5s ceiling breach); no filtered failures, quiet substitute, narrowed window or budget increase. This signoff supplies no passing measurements and clears none of BUG-1606/STORY-1423's separately owned closure gates.

    PRODUCT HANDOFF
    Record the actual BUG-1674 blocked-by TASK-1526 dependency before implementation; keep B's unresolved non-show interim fork with its owning advisor. Apply the show stale-allowed and bounded Q1/Q2/A7 exception to STORY-1484 (companion comment records it). Do not dispatch BUG-1674 into the live B edits. No operator choice is needed: these routine design decisions are binding. No queue or relation mutation was made by this advisor.
