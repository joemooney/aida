    ADVISOR SCOPING NOTE (relay #7, 2026-10-02, before implementation starts): this spec shares its subsystem with approved-and-queued work — STORY-1484 (single-flight flock-guarded cache refresh, bounded reader wait, labelled stale read), TASK-1514 (read-tolerant path for read commands), and BUG-1778/BUG-1779 (refinements on that design). Do NOT independently redesign the refresh path here. Scope this fix to the narrow defect: the STRICT stale-cache refresh on the `aida show` path waiting UNBOUNDED behind a concurrent writer — i.e. a bounded wait + honest stale-read fallback on that call path, consistent with (not duplicating) STORY-1484's design. If during implementation you conclude the only correct fix IS STORY-1484 itself, stop and say so on this spec rather than shipping a parallel rewrite; the advisor will re-sequence. Related measurement context: TASK-1565 (performance-guard calibration) references this spec — a fix here changes that guard's baseline, note it in the PR.
