    Advisor disposition of the performance-guard trip (2026-09-29T03:30Z, result failed:1), routed to
    the advisor seat as `performance-guard-route`.

    Re-ran `aida doctor check performance` this session and reproduced it:

      `aida show` exceeded its 1000 ms budget on 11.4% of 359 calls in the last 24h (tolerated 10.0%,
      worst 13118 ms); CEILING BREACHED — a single call ran 13118 ms against a 5000 ms ceiling.

    **Decision: real regression, NOT a budget to change.** The budget in force is
    `[performance.budgets] show = { budget_ms = 1000, ceiling_ms = 5000 }`. I am deliberately NOT
    raising it, because this bug is exactly what it exists to surface and the 13118 ms sample is the
    same unbounded-wait signature this spec already describes (the 24.5 s observation here is 13.1 s,
    which is the same failure with a shorter queue, not a different one).

    Per-binary breakdown says the same thing — this is not one stale build:
    - counted, in this HEAD's lineage: 0bd634c 14.4% of 257, 8c899184c0 16.7% of 6, b046018459 5.9% of
      17, 1e594926d8 5.1% of 39; the remaining eight binaries are 0.0%.
    - excluded as outside the lineage: abc0255259 27.3% of 55, 5632229e66 40.0% of 50, bcd7822d28
      20.0% of 5, 304ca777b1 7.1% of 14.

    The two heaviest-sampled excluded binaries breach far harder than anything counted, so the counted
    11.4% is a floor on the real rate, not a peak.

    Routing note: the structural fix is STORY-1484 (single-flight cache refresh — flock-guarded,
    double-checked, durable refresh request, detached worker, bounded reader wait then a labelled stale
    read). That story, not a budget edit, is what closes this. Leaving BUG-1674 approved and
    unqueued; whoever takes STORY-1484 should expect to close this one with it.

