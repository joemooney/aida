  content: |
    LIVE REPRO (relay #7, 22:13 -07:00): `aida queue done BUG-1771` exceeded a 120s timeout in the operator's advisor session while three freshly-claimed agent sessions (BUG-1663/BUG-1674/SPIKE-91) were active on the store — consistent with this spec's unbounded strict-refresh wait. Timestamp given so the sample is findable in the 24h performance window.
    DIAGNOSIS UPDATE (22:23): the stalled process is in D-state (folio_wait_bit_common), 8.5 min elapsed / 3 s CPU, holding .aida/cache.db{,-wal,-shm} open — and its read fds show the cache refresh scanning files inside ABANDONED .claude/worktrees/agent-* directories (~28 stale harness worktrees) while two agent lanes run cargo builds. Two implications for the fix: (1) the unbounded wait is I/O starvation during a full-tree walk, not lock convoy alone; (2) the refresh walking dead agent worktrees multiplies the walk by the number of stale dirs — scoping the scan away from .claude/worktrees (or honoring gitignore boundaries there) may be a bigger win than the wait bound itself.
