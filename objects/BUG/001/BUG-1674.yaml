  content: 'Acceptance evidence: (1) aida-cli/tests/bug_1674_show_bounded_under_writer.rs — four black-box tests: show under a live BEGIN IMMEDIATE writer in the incremental shape, the full-rebuild shape, and under a foreign refresh-flock holder, each asserted < 5 s wall-clock, exit 0, spec served, stale: true in TOON and the stale note on stderr; plus the correctness witness: an external YAML status change (Draft→Approved committed to the store) is displayed as approved while the cache is stale and the write lock is held — show''s spec body reads authoritative YAML, so it never shows a contradicting status (and the cache-backed context carries the stale label). (2) Unit test tty_full_rebuild_winner_bounded_behind_live_writer in cached_git_backend.rs pins the interactive winner: one bounded attempt (full_rebuild==1, retry_sleep==None), durable request filed, labelled snapshot served; mutation-proof run with the strict path restored fails with ''database is locked''. (3) tty_full_rebuild_winner_remains_strict_before_c still passes (free lock keeps the inline rebuild). Re-measure note: aida doctor check performance TODAY (pre-merge, 24 h window) still trips both limbs — worst 35488 ms on d5b1957658 at 23:15:36Z, which correlates with a host-wide stall (shift tick 33.9 s and schedule tick 38.9 s ending within 2 s of it; statusline stayed ~100 ms throughout, so the cache write lock was not the blocker) — that sample is IO/CPU starvation, not a lock wait. The ADR-53 re-measure on both limbs needs a fresh 24 h window of traffic on the merged binary; the performance-guard cron re-trips automatically if the tail persists, and the quiet output will be pasted here when that window has run.'
