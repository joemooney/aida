title: TOON output appends the 'cache:' footer with no preceding newline when the body doesn't end in a newline
description: |
  Reported in the factory's 2026-10-11 handoff (seen with 'aida docs glossary' piped, which defaults to TOON): when a command's body doesn't end in a newline, the cache: footer is glued onto its last line. That also broke the BUG-1950 drift guard until the generator pinned --format human.

  Note (groom): the footer is emitted by the dispatcher (`cache_output::finish`, aida-cli-lib/src/cache_output.rs) via `println!` after the command returns, so it cannot see the body. The fix therefore needs either a record of whether stdout's last byte was a newline (e.g. a small stdout-tracking writer used by the agent-output path) or a guarantee at the source.

  ## Acceptance
  - In agent/TOON output mode, the `cache:` footer always starts on its own line, whether or not the command body ended with a newline.
  - `aida docs glossary` piped (TOON default) ends with its last body line, a newline, then `cache:` on its own line.
  - A body that already ends in a newline does not gain an extra blank line before the footer.
  - Unit test: footer emission after a body lacking a trailing newline, and after one that has it. Regression test for `aida docs glossary` piped output.
