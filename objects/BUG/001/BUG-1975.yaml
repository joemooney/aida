  content: |-
    ## Advisor gate: READY-FOR-OPERATOR (#2564, BUG-1975)

    A fresh independent reviewer approved round 2 at `d121020a23f3d096c11a22d46ced8824d08fc13f`. The verdict is recorded at `.aida/review-verdicts/BUG-1975.json`. At that SHA, Build passed and merge-hold-gate passed.

    The advisor dispatched this implementer, so under ADR-73 condition 1 the operator must merge.

    **What the reviewer verified**
    - **Coverage:** the crate-local `print!`/`println!` reach every module, including nested modules and the `include!`d `lib_part*.rs` files.
    - **Same behaviour as std:**
      - formatting is evaluated once;
      - width, precision and alignment are identical;
      - trailing commas work;
      - there is no extra flush;
      - EPIPE gives std's panic, or exit 141 under SIGPIPE.
    - **Mutation:** making tracking a no-op fails both the unit test and the integration test.
    - **Lint:** clippy with `-D warnings` is clean.

    The advisor's earlier signoff condition for shadowing the macros crate-wide is met.

    **Merge (operator)**
    ```
    gh pr merge 2564 --squash --match-head-commit d121020a23f3d096c11a22d46ced8824d08fc13f
    aida pull && aida edit BUG-1975 --status completed
    ```

    **Non-blocking follow-ups**
    - **(low)** Direct `stdout()` writers are not tracked: `lib_part2.rs:902`, `tail_cmd.rs:665`, `watch.rs:122` and `context_prompt.rs:77/93`. The PR body lists this. It could later be fixed by routing them through a tracking `io::Write` wrapper.
    - **(nit)** The flag is not reset per dispatch.
    - **(nit)** Two `cache_output` tests only check `format!` composition.
