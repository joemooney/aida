title: TOON output appends the 'cache:' footer with no preceding newline when the body doesn't end in a newline
description: 'Reported in the factory''s 2026-10-11 handoff (seen with ''aida docs glossary'' piped, which defaults to TOON): when a command''s body doesn''t end in a newline, the cache: footer is glued onto its last line. That also broke the BUG-1950 drift guard until the generator pinned --format human. Acceptance: the TOON footer writer emits a newline first when the body doesn''t end in one; a unit test with a body lacking a trailing newline.'
