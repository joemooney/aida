  content: |-
    Scope expansion (2026-09-25, operator + Antigravity review):

    1. DISCOVERY PATH IS UNSETTLED — verify before fixing. The scaffolder writes Codex skills to .codex/skills/ and Antigravity skills to .antigravity/skills/. But AIDA's own docs/agents/porting-claude-code-to-codex.md (§A.1) says Codex skills live at .agents/skills/<name>/SKILL.md, and Antigravity reports it discovers workspace skills from .agents/skills/ (walking cwd → repo root), not .antigravity/skills/. BUG-1117 asserted .codex/skills/ is the discoverable Codex surface. These cannot all be right. Acceptance: an empirical check per vendor (current Codex CLI, Antigravity CLI) that records which directories each discovers, whether it follows a symlinked SKILL.md, and the vendor version tested. Record the outcome in docs/agents/seat-parity.md and fix whichever of the scaffolder / porting doc / BUG-1117 note is wrong.
    2. If both vendors read .agents/skills/, scaffold ONE shared pack there (portable body wins over the Claude master) instead of two per-vendor dirs. Keep the old dirs working only as long as a supported vendor version still reads them.
    3. Dev repo: extend make sync-templates (and make check-templates) to link the non-Claude pack as symlinks into aida-core/templates, the same way .claude/skills is linked, so this repo dogfoods Codex/Antigravity skills without running scaffold apply (which would also rewrite README.md/CLAUDE.md/AGENTS.md here).
    4. .agents/ is currently untracked in this repo and holds a third-party skill (typesafe-ai, MIT). Decide whether that directory is tracked, and whether third-party skills belong in it or in a gitignored local area.
