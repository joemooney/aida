  content: |-
    TEST RESULTS (2026-09-25, run by Antigravity against the local runtimes; Codex skill-root listing observed):
    | | Codex 0.157.0 | Antigravity 1.2.11 |
    |---|---|---|
    | Discovers .agents/skills/ | YES (listed as skill root r5 = <repo>/.agents/skills) | YES |
    | Symlinked SKILL.md | NO, silently skipped (the walker's DirEntry::file_type does not follow symlinks) | YES |
    | Regular-file copy | YES, indexed (aida-handoff listed with its description) | YES |
    | Hard link | YES | YES |
    | Symlinked skill DIRECTORY that contains a regular SKILL.md | YES | not tested |

    DECISIONS THIS IMPLIES:
    1. Canonical non-Claude path = .agents/skills/<name>/SKILL.md, shared by Codex and Antigravity. The .codex/skills and .antigravity/skills packs become compatibility-only; drop them unless a supported vendor version still needs them. Also correct BUG-1117's claim and align docs/agents/seat-parity.md.
    2. SKILL.md files for Codex MUST be regular files. Symlinks, the pattern used for .claude/, do not work for Codex, and the failure is silent.
    3. Dev repo (make sync-templates): write generated REGULAR-FILE COPIES of each master (portable body preferred), and make make check-templates fail on any byte drift from the master. Do NOT rely on hard links: an editor's atomic save (write-temp-then-rename) or a git checkout/rebase replaces the file, which silently splits the link, so the copy drifts with no signal. A drift check against copies is visible and deterministic. The generated copies can be gitignored in this repo, since make regenerates them.
    4. Downstream scaffolder: already writes regular files with checksum markers. Retarget it to .agents/skills/ and manage only aida-* entries (typesafe-ai and local/ must stay untouched).
    5. Silent-skip guard: aida doctor (or scaffold status) flags any .agents/skills/*/SKILL.md that is a symlink, because Codex will not see it.

    Current test state: .agents/skills/aida-handoff/SKILL.md is a HARD LINK to the master (same inode 41943280). It works for both vendors today but is fragile per point 3.
