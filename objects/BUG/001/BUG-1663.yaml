- id: 01a0e10b-dd7a-70e1-8547-7e7022beff3f
  author: codex independent signoff advisor
  content: |
    ADVISOR SIGNOFF: APPROVED with binding amendments

    Independent Codex advisor, separate from product and sketch author. This is design signoff only, not implementation validation or merge approval. I read AGENTS.md, .aida/discipline/two-seat-protocol.md, BUG-1663 --full and ALL four existing comments, including PLAN 01a0dfa2-b1cd-7522-802f-33b585ee7a0c, SKETCH 01a0e104-4b78-72e2-999e-79972b4e139e and its clarification. Inspected actual main code at 854b7e26f7222c73845064275a18c293c9895283 and active TASK-1526 WIP read-only in /home/joe/ai/aida-task-1526, plus all TASK-1526 comments, notably binding decision 01a0e0fb-8d6b-7790-b04b-f808236dbe2d and product adoption 01a0e0fd-bc48-7600-bc20-b0a8f781d0f7. All AIDA commands used /home/joe/ai/aida/target/release/aida. No tests run; tests below are acceptance requirements, not passing evidence.

    Finding and choice (Q1)
    Approve the cache-only immutable committed-tree loader and fail-closed parsing in the new sketch. Reject the prior touched-path/worktree reconciliation implementation route and its BEFORE-B ordering. A touched union can repair committed ABA only if reconciliation itself reads a coherent target snapshot; it does not observe uncommitted change/revert, and bounded exhaustion or git-log failure cannot certify its remaining mixed rows. Equality of HEAD or index mtime is not a source-consistency proof.

    Actual code confirms the defect: full_rebuild, rebuild_cache and schema-drift rebuild read inner.load after capturing HEAD; GitBackend::load reads mutable metadata and load_all_objects_with_fingerprints, whose object errors warn and skip. Atomic rows/stamp publication in cache::rebuild_projection solves visibility, not provenance. current_head_sha swallows Git errors to empty; is_stale accepts equal empty strings. save/update_atomically also pass in-memory stores with a current SHA, while GitBackend auto-commit helpers ignore commit failures. TASK-1526's active WIP changes full_rebuild(head, refresh_only), rebuild_for_refresh, apply_incremental, ancestor pre-resolution and tolerant dispatch; its refill-skip must not suppress forced save reconciliation. These are real overlap points, not disjoint edits.

    BINDING AMENDMENTS

    A1. One immutable source. Resolve commit S and enumerate membership, read object blobs and metadata from S, including deletion/absence semantics. Use checked, batched Git reads or equivalent; validate framing, object kind, paths and duplicate/contradictory identities rather than stamping a partial projection. Missing metadata defaults only when absent in S; malformed/unreadable metadata or object aborts before publication. Projection-only RequirementsStore must not become a load/save CAS baseline. Keep rows, source_head_sha, built_at and schema version in one transaction. No per-row persistent blob schema is required. No live checkout or store-wide scan lock is introduced.

    A2. Dirty/no-auto-commit decision (Q2). Ordinary cache rebuilds project committed S, regardless of dirty index/worktree bytes; they must leave those bytes untouched. They do not promise visibility of pending edits. Preserve GitBackend's live load/save/CAS and returned mutation data; do not replace those with an older committed store. For REAL Git save reconciliation, a valid SHA requires proven correspondence to the successful committed result, not merely auto_commit=true, an unchanged HEAD, or a held cooperative store lock. If the requested save remains uncommitted (disabled or failed commit), do not silently rebuild the old commit and report the save fully reconciled. Preserve written files, invalidate freshness, and return an explicit error distinguishing 'store write persisted; committed cache reconciliation unavailable' from a rolled-back write. Do not auto-commit on the operator's behalf. An unstamped projection is permitted only if its rows and invalid stamp publish together; never advertise it fresh or a verified committed generation. Subsequent explicit committed-cache reads may show S and must document that pending edits require commit to appear; this does not erase the pending files. Non-Git fixtures have a separate explicit local projection path; a real Git repository with unreadable/unborn HEAD must not fall through to it. Empty stamp is never evidence of committed freshness. Scope this audit to rebuild/save reconciliation and any stamping path used to establish its preconditions; do not claim all unrelated write-through races solved.

    A3. Bounded strict semantics (Q3). At most THREE source-generation attempts total per strict refresh operation, shared across incremental selection, pinned rebuild, publication conflicts and catch-up; no nested 3-by-3 retry loops or counter reset on schema retry. A decline can choose the full loader within the same target-generation attempt, but cannot refresh its target invisibly. After publication OR a transaction-level skip, reread actual committed cache stamp and current store HEAD; success requires their agreement and valid provenance. On observed continued movement after attempt three, return an explicit StoreMoved/retry error. A correctly published historical S may remain, honestly stale. Parse/Git failures abort without changing that attempt's previous committed cache; deterministic corruption is not retried three times. Real lock exhaustion propagates without full-rebuild escalation, preserving B's busy_timeout=0 and existing strict SQLite ladder. The three-attempt cap is not a new absolute wall-clock guarantee. A commit after the final observation is inherently outside that observation.

    A4. Publication/base safety. Under BEGIN IMMEDIATE, recheck schema and cache generation before applying anything. Skip only a proven usable generation already satisfying the target/current lineage; never use lexical SHA order. If another publisher changed the expected base, re-evaluate: an incremental delta must apply only to the exact base it was computed against, otherwise decline/retry. B's current WIP target-reached test alone is not a general mismatched-base guard. For a delayed full snapshot on a rewritten/non-ancestor lineage, discard/retry the obsolete target instead of overwriting the newer usable publication. Apply equivalent generation protection to explicit/schema-drift paths without treating a forced save repair as an optional freshness refill. A skipped publication must not cause the caller to report its candidate S/count as the committed result.

    A5. Incremental scope (Q4). No path used to complete this fix may reintroduce mutable bytes under a committed stamp, including the normal subsequent refresh and tolerant winner, not just the strict rebuild loop. Safe reuse requires changed objects AND stored ancestor/epic inputs from pinned target S, deletion from that tree, and A4's exact-base guard; late ancestor misses must resolve at S or decline, never read live files. Existing graph approximation policy is unchanged. If the landed API cannot establish this boundedly, decline the incremental: strict/TTY exception paths use pinned full rebuild; compatible non-TTY paths use B's Deferred. Do not silently undertake a broad incremental rewrite. Seek a follow-up design decision if needed to preserve incremental performance; unsafe live-file catch-up is not an accepted optimization.

    A6. Tolerant semantics remain B's binding contract. Compatible non-TTY full-rebuild-needed readers serve Deferred without full scan, SQLite ladder, request or worker. WriterBusy requires actual SQLite contention; running requires observed flock evidence. Preserve one invocation's wait budget and snapshot-consistent rows/head/built_at labels. This fix's retry/catch-up paths must not create an unbounded tolerant re-entry loop when HEAD changes between refresh and row snapshot. Parse/Git/schema corruption is an error, not Deferred. Preserve migration/no-cache/unsupported-lock exceptions and BUG-1674's separate boundary. No worker dependency or fabricated background progress.

    DETERMINISTIC NAMED ACCEPTANCE TESTS
    Use isolated real Git stores/caches and fake HOME, scoped hooks/channels/barriers with cleanup, never sleeps as the race scheduler. Inspect rows and raw metadata in the same separate SQLite read transaction; compare membership/content to a separately decoded pinned commit oracle. Counters must prove branch selection/attempt limits. Adapt locations to landed B.

    1. bug_1663_rebuild_change_revert_has_no_mislabelled_rows: pin S(original), commit T(transient) before consumption, commit U(original) afterward; assert net diff(S,U) empty, no transient row ever stamped S/U, normal next refresh converges.
    2. bug_1663_rebuild_add_delete_has_no_ghost: X absent at S, added at T before enumeration, deleted at U after consumption; same empty-net-diff assertion and no X row in S/U. Also cover delete/restore of an existing object.
    3. bug_1663_same_head_dirty_aba_is_ignored: unchanged S, write/revert dirty title and add/delete dirty object across consumption barriers, staged and unstaged variants; pinned projection remains S. Mutating the loader back to worktree reads must fail tests 1-3, not merely pass their eventual quiet rebuild assertion.
    4. bug_1663_all_rebuild_entrypoints_pin_objects_and_metadata: ordinary fallback, explicit rebuild, schema drift; move object and metadata bytes independently after pinning, assert both inputs come from S. Missing metadata defaults; malformed metadata fails.
    5. bug_1663_delayed_publication_preserves_newer_generation: competing SQLite publisher wins while S waits, including descendant and non-ancestor/ref-rewrite cases; delayed publisher neither regresses valid rows nor reports its skipped candidate as current. Verify exact-base incremental mismatch declines.
    6. bug_1663_commit_after_load_before_publish_catches_up: advance HEAD after final blob read; any intermediate published generation matches its stamp, strict return matches final observed HEAD.
    7. bug_1663_three_generation_attempts_then_store_moved: advance at every attempt barrier, assert exactly three maximum, explicit error, last published snapshot/stamp consistent; after quiescence normal strict refresh succeeds. Include schema retry and incremental decline so limits cannot multiply.
    8. bug_1663_snapshot_errors_preserve_cache: malformed object, malformed metadata, missing batch blob, truncated batch response and unreadable real Git HEAD; retain previous rows/head/built_at/schema, no worktree fallback. Include commit object loss injected at reader seam.
    9. bug_1663_dirty_save_never_stamps_committed_head: no-auto-commit and injected commit failure for save and metadata/deletion update reconciliation; pending files and live returned data preserved, explicit partial-success error, freshness invalid. Successful committed save converges; retain bug1612_cached_atomic_update_and_stale_save_keep_concurrent_add, including non-Git fixture behavior and forced reconciliation at unchanged HEAD.
    10. bug_1663_incremental_dirty_object_and_epic_inputs_decline_or_pin: dirty changed object and dirty ancestor status at constant target HEAD; either exact pinned inputs are applied or zero incremental publication occurs, followed by pinned strict rebuild/Deferred tolerant result. No wrong stamp.
    11. bug_1663_tolerant_decline_keeps_budget_and_labels: non-TTY decline and repeated HEAD movement between refresh/row snapshot; bounded operation, correct old rows/head/built_at, Deferred, zero full scans/ladder/request/spawn; no retry-budget reset. Retain B's busy/strict-after-busy tests and error-class distinctions.
    12. bug_1663_migration_publish_remains_atomic: held WAL reader sees complete old schema/generation or complete new generation; failure preserves old committed projection and pending migration; no empty intermediate cache. Include competing completed migration.

    SEQUENCING / AUTHORITY
    APPROVAL DOES NOT AUTHORIZE CONCURRENT IMPLEMENTATION WITH TASK-1526. It remains In Progress with active uncommitted edits at this inspection. BUG-1663 implementation must wait for TASK-1526 completion/integration, then start from its landed API and reconcile these acceptance names with B's tests. Product owns eventual routing. No implementation, queue/status/lease changes, merge or authorization to resume work was performed. This comment supersedes the earlier PLAN's algorithm and ordering; the new sketch is approved only with all amendments above. Independent strict implementation review remains required.
