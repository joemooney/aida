- id: 01a1003b-d959-7603-af8b-9189d3444af0
  author: ai:claude:joe
  content: 'Implemented via load_at_stable_head in cached_git_backend.rs: a rebuild now re-captures HEAD after its store load and retries (bounded, 3 attempts) until pre- and post-load HEADs agree, stamping the verified HEAD; on exhaustion it stamps the final attempt''s pre-load HEAD (older than every row, so the next incremental re-reads the trailing commits). Covers ensure_cache_fresh''s full rebuild, rebuild_cache, and the schema-drift rebuild. Acceptance test bug_1663_spec_committed_mid_rebuild_load_then_deleted_leaves_no_ghost_row commits a spec mid-load via a test hook, deletes it in a later commit, and asserts the next refresh converges with no ghost row (proven red on the unfixed code); a second test pins the bounded-retry/exhaustion stamp.'
  created_at: 2026-10-03T05:28:04.697729410Z
  modified_at: 2026-10-03T05:28:04.697729410Z
