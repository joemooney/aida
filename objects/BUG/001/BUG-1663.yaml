spec_id: BUG-1663
agreed_id: BUG-1663
title: Cache incremental refresh can keep a deleted or reverted spec's row marked fresh when the file changes during a rebuild load and a later commit reverts it
description: 'From TASK-1515''s round-3 strict review (finding 3; pre-existing on main with a wider window). A full rebuild stamps the HEAD captured before the load. If a file changes during the load and a later commit reverts or deletes it, the next incremental diff from the older stamp sees no net change, so the stale row stays marked fresh; a deleted spec can reappear until a full rebuild. Fix options: stamp the rebuild with the HEAD captured AFTER the load and verify the tree didn''t change mid-load (re-check HEAD or the index mtime and retry), or record per-row source blob ids and validate on the incremental. Acceptance: a test that changes then reverts a file across a rebuild load, then asserts the next refresh converges (no ghost row).'
