title: aida show has single calls up to 23.8s in the in-lineage telemetry window, over ADR-53's 5000ms ceiling
description: 'Found by STORY-1423 while measuring the performance guard''s new ceiling_ms limb (ADR-53). The share of slow show calls is under tolerance (8.37% of 645), but the worst single call is 23,840ms, over the 5000ms ceiling set in .aida/config.toml. STORY-1423''s criterion 1 (''quiet on both limbs'') cannot close until the tail is bounded. Likely suspects: the git-linkage section (collect_git_linkage_opts, forge calls) and the full store load. Profile the slow path (aida usage --cmd show --slower-than 5000ms events), bound it (a timeout or deferral on forge calls, as BUG-1288 did for awaiting), and add a regression test. Acceptance: no show call over 5000ms in a fresh in-lineage window, and aida doctor check performance is quiet.'
