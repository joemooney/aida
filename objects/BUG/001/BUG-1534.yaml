title: Reasoning relayed between seats carries no provenance, so a claim is repeatedly credited to the wrong seat — three instances tonight, and the envelope identity does not prevent any of them
description: |
  Filed by the driver advisor 2026-09-20 22:34, after committing earlier tonight to file
  if it happened a third time. It has.

  DISTINCT FROM BUG-1533, AND THE DISTINCTION IS THE POINT. BUG-1533 is that the mailbox
  ENVELOPE cannot identify the authoring seat for the `joe` bucket. This is that REASONING
  RELAYED INSIDE A BODY carries no provenance at all — and it fails between seats whose
  envelopes are perfectly good.

  Measured against the mailbox store, 902 messages:

      claude-reviewer-1   236      claude-product-1   207
      joe                 340      advisor             94
      562 of 902 carry a distinct seat identity on the envelope

  Every instance below involves at least one seat with a correct envelope identity. Fixing
  BUG-1533 would not have prevented any of the three.

  THE THREE INSTANCES, with provenance ESTABLISHED FROM THE STORE rather than asserted.
  The original filing of this spec named the driver advisor as the likely cause of
  instances 1 and 2. THAT WAS WRONG, and it was itself a misattribution — this spec
  misattributed two of its own instances, to the seat writing it. Corrected 22:41 after
  the reviewer owned them and the store confirmed it.

    1  "BOTH YOUR ADDITIONS ACCEPTED" — brief items 1c and 5 credited to the product seat.
       They were the driver advisor's.
    2  "YOUR c9 AND c7 ARE RIGHT" — BUG-1522 c9 / BUG-1531 c7 credited to the product
       seat. They were the driver advisor's.

       AUTHOR OF BOTH: claude-reviewer-1. Six mailbox records carry those two sentences and
       every one is from=claude-reviewer-1, each sent to BOTH joe and claude-product-1,
       the pairs within the same second (ts 1789965956649/984 and 1789967948011/344).
       One body, two recipients, second person. Product read "your additions" and "your c9"
       as theirs, correctly, given what arrived.

    3  A 902-message mailbox tally credited to the driver advisor, which did not produce
       it. THE TALLY IS claude-reviewer-1's, produced 22:29 and sent to the product seat.
       Product then sent "YOUR TALLY IS RIGHT" to claude-reviewer-1 (ts 1789968757820) and
       to advisor (ts 1789968758156) — the same body, 336 milliseconds apart. Correct for
       one recipient, wrong for the other.

       THE NUMBERS ARE CORRECT. The advisor reproduced all of them independently from
       .aida-store/mailbox/*.json before replying, so the BUG-1533 correction built on them
       stands. Only the authorship was wrong. (The reviewer measured 898 and product 902
       minutes later; four messages arrived between the runs, which is consistent.)

  SO ALL THREE ARE ONE MECHANISM, PERFORMED BY TWO DIFFERENT SEATS: a body addressed in
  the second person and sent to more than one recipient. The pronoun binds to whoever is
  reading. Instances 1 and 2 are claude-reviewer-1's sending practice; instance 3 is the
  product seat's. NONE of the three is the driver advisor's, and the advisor's original
  self-naming was an inference from its own habit of multicasting bodies rather than from
  any evidence.

  THAT SELF-NAMING IS WORTH KEEPING IN THE RECORD rather than deleting, because it is a
  fourth instance of the same family in a different direction: a seat attributing a defect
  to ITSELF without checking, on the strength of knowing it had the means. Plausible
  authorship is not authorship, whether the guess is generous or self-critical.

  BOTH DIRECTIONS OF THE FAILURE ARE NOW EVIDENCED, which is the spec's argument:
    - a correction ACCEPTED by a seat who believed they had authored the thing corrected
      (instances 1 and 2)
    - a spec description CORRECTED on a measurement attributed to a seat that had not made
      it (instance 3)
  In neither direction did the substrate object.

  THE REVIEWER STOPPED MULTICASTING AT 22:28 and the advisor did likewise. That is a
  practice change, not a fix, and it is the reason criterion 2 exists.

  A CAVEAT ON THE EVIDENCE, recorded because the reviewer flagged it against their own
  search: some mailbox JSON files appear to hold more than one message, so SUBJECT pairings
  extracted from a file's top level are unreliable. The SENDER and RECIPIENT fields above
  were read per-record and are consistent across all nine records examined; the advisor
  re-ran the extraction independently. Treat sender and recipient as established and any
  subject mapping as not.

  ## Acceptance
  1. A claim relayed from another seat is attributable: when a seat's message reproduces
     another seat's measurement, finding or argument, the source seat is identifiable
     without the reader having to remember who said what.
  2. The mechanism is not a prose convention. "Always name the author" is the weak form and
     is what failed three times tonight; whatever is built here should make the unattributed
     form harder to produce than the attributed one.
  3. Second-person reference is not treated as attribution. "Your point about X" identifies
     the recipient, not the author, and in a three-seat exchange those differ.
  4. A seat may state what it VERIFIED versus what it RELAYED, and the distinction survives
     into anything built on it — a spec edited on a relayed measurement should record that
     it was relayed and by whom.
  5. Existing records are NOT retro-corrected. The three instances above are the evidence;
     guessing at authorship to repair them would reproduce the defect. Mark, do not repair.
  6. The fix does not require an envelope identity to work. All three instances involved a
     seat with a correct envelope identity, so a fix that depends on BUG-1533 landing first
     does not address this.

  NOT ESTABLISHED: whether any of the three caused a decision to go differently than it
  would have. Instance 3's numbers were correct; instances 1 and 2 were credit only. The
  cost measured so far is the checking each one triggered, not a wrong outcome.
