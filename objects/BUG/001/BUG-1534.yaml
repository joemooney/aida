  content: 'Branch claude/bug-1534 (926d7fe531) ships part of the fix. (1) The send refuses a second-person body (you/your) when it is a broadcast, or when the same sender already sent the identical body to a different recipient within the last 10 minutes. The CLI and MCP share the check, and --allow-second-person overrides it. This covers the mechanism behind instances 1-4 and does not depend on BUG-1533 (criteria 2, 3, 6). (2) A new relayed_from field on mail and on comments, set with --relayed-from on ''mailbox send'' and ''comment add'' and through MCP, shows as ''via X, originally Y'' in the CLI, MCP and TUI (criterion 1, part of criterion 4). Old records carry no mark (criterion 5). STILL OPEN: (a) ''aida edit'' has no relayed/verified marker, so a spec description edited on a relayed measurement does not record it (criterion 4). (b) A single-recipient relay that omits --relayed-from is not detected; that would need claim-matching against other seats'' mail, which is not cheap. (c) Second-person text in spec comments is not checked. Leaving the spec open.'
