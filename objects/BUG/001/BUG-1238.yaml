title: docs/cli/verify-interface-changes.py watches aida-cli/src/cli.rs, but the CLI surface moved to aida-cli-lib/src/cli.rs (STORY-772) — the doc-intent gate never arms for CLI changes
description: 'Found 2026-09-18 while landing STORY-1226 (new aida schedule subcommands): running docs/cli/verify-interface-changes.py reported ''gate not armed'' because its SURFACE_PATHS list still names aida-cli/src/cli.rs; since STORY-772 the clap definitions live in aida-cli-lib/src/cli.rs, so no CLI change trips the gate and the docs-impact intent check is silently off. Fix: point SURFACE_PATHS at aida-cli-lib/src/cli.rs (keep the old path for safety), add a self-test that a synthetic change under the lib path arms the gate, and confirm the ci.yml step still calls the script. Acceptance: a PR touching aida-cli-lib/src/cli.rs without docs:impacted / interface_changes on its spec fails the gate; the script''s own test covers the path.'
