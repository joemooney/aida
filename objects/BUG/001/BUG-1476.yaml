  content: 'Root cause: begin_rework_guard read the blocking verdict only under the spec id, while normal reviewer output is persisted under PR-N. The guard therefore stayed unarmed for existing-PR rework rounds. Fixed lookup to accept both identities; regression covers PR-2024-style RequestChanges and confirms the existing no-op gate stops before CI.'
