title: A read-only --resume-dry-run preview is gated behind drain-dispatch authority, so a non-dispatching seat cannot inspect a re-entry plan
description: |-
  aida queue work <SPEC> --auto-complete --from-pr --resume-dry-run prints the reconciled re-entry plan WITHOUT re-entering. Its help text calls it the safe way to preview a PR-only drive. It is refused for a non-advisor seat with the same error as a real dispatch: starting an autonomous drain needs the advisor role.

  Nothing is started by a dry run, so the authority check is being applied to the wrong operation. The effect is that the seat most likely to need the preview -- one that must hand dispatch to another seat and wants to say WHAT it is asking for -- is the one that cannot produce it.

  Observed while triaging 15 PRs holding CHANGES REQUESTED at their current head from the product seat. Forcing past the gate was available and deliberately not used.

  ACCEPTANCE
  1. --resume-dry-run succeeds regardless of seat role, for both --from-pr and --resume-drain.
  2. The same invocation WITHOUT --resume-dry-run still refuses for a non-advisor seat, unchanged.
  3. A test covers both halves, so a fix that drops the gate entirely fails.
