title: headless drain picks up execution_mode=guided (and operator/decide) specs and drives them headless — must skip them like deferred
description: |
  ## Observed (2026-09-12 19:40)
  A running `aida queue work --drain --no-human=both` re-polled the queue and began headless-driving STORY-1094, whose execution_mode is `guided`. Guided/keystone specs require the up-front AskUserQuestion decision dialog (the /aida-guided-implement contract) and, for STORY-1094 specifically, a cold-agent-on-fresh-repo validation a headless self-drive cannot perform. The drain drove it anyway.

  ## Why it matters
  Same class as BUG-1099 (deferred specs must be skipped by the drain), but for execution_mode. A headless drain silently producing a keystone's implementation skips the operator decisions that define it, and — if the merge weren't independently gated — could ship an unvalidated make-or-break change. execution_mode is the substrate's own signal for HOW a spec should be executed; the headless drain ignores it at pickup.

  ## Acceptance
  1. `aida queue work --drain` / batch pickup SKIPS specs whose execution_mode is `guided` (and `operator`/`decide`) with an explicit 'skipped — needs guided/operator session' line, same as the deferred skip.
  2. Such a spec can only be driven via `aida do` / `aida queue work --guided` (the interactive path), never a headless drain.
  3. Regression: a queued guided spec is not a drain member and is not driven headless.
