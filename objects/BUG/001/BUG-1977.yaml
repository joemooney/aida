spec_id: BUG-1977
agreed_id: BUG-1977
title: Store-write refusal for a stale AIDA hook recommends 'aida scaffold apply', which skips existing hooks; --force would overwrite README/CLAUDE/AGENTS
description: |
  Seen 2026-10-11 in aida-relay after the live binary was promoted. 'refusing AIDA store write: the prepare-commit-msg hook ... is not this aida build's shipped hook ... Run aida scaffold apply (or aida init --force)'. But 'aida scaffold apply' skips every existing file ('skipped - exists, use --force'), so it never replaces the stale hook. '--force' would also overwrite the repo's README.md, CLAUDE.md, AGENTS.md and 33 locally modified scaffold files. The only working fix was to delete the hooks and re-apply. Each run surfaced only ONE stale hook (pre-commit, then prepare-commit-msg), so it took several attempts. Related: STORY-1647 (hook template changes). Absorbs BUG-1981 (same refusal, seen from the aida-host regenerability pilot, where the `scaffold apply` dry run would have rewritten the pilot's README.md and CLAUDE.md charter).

  Note (groom): `aida scaffold upgrade` already treats `.git/hooks/*` as the Template category and leaves README.md / CLAUDE.md / AGENTS.md (Seed) alone, but it also overwrites every other drifted Template file (skills, commands, `.claude/hooks/*`), so it is not a hook-only fix either. The refusal text lives in aida-core/src/git_ops.rs (HookKind::OtherAidaGenerated).

  ## Acceptance
  - A hook-only refresh exists: one command (e.g. `aida scaffold upgrade --only git-hooks`, or `--only <path>` accepting `.git/hooks/<name>`) replaces stale AIDA-generated `.git/hooks/*` files with this build's shipped hooks and touches no other file. A stale hook is backed up beside itself before replacement. A custom (non-AIDA-header) hook is never replaced.
  - The store-write refusal names that hook-only command, and no longer recommends `aida scaffold apply` or `aida init --force`.
  - The refusal lists ALL stale AIDA-generated hooks found in one pass, not just the first one.
  - Tests: (a) a repo with two stale AIDA hooks gets one refusal naming both and the hook-only command; (b) running the hook-only command replaces both, leaves a drifted README.md/CLAUDE.md/skill file untouched, and the next store write succeeds; (c) a custom hook is left alone.
  - FAQ-49's answer is updated to the new command.
