title: Store-write refusal for a stale AIDA hook recommends 'aida scaffold apply', which skips existing hooks; --force would overwrite README/CLAUDE/AGENTS
description: 'Seen 2026-10-11 in aida-relay after the live binary was promoted. ''refusing AIDA store write: the prepare-commit-msg hook ... is not this aida build''s shipped hook ... Run aida scaffold apply (or aida init --force)''. But ''aida scaffold apply'' skips every existing file (''skipped - exists, use --force''), so it never replaces the stale hook. ''--force'' would also overwrite the repo''s README.md, CLAUDE.md, AGENTS.md and 33 locally modified scaffold files. The only working fix was to delete the hooks and re-apply. Each run surfaced only ONE stale hook (pre-commit, then prepare-commit-msg), so it took several attempts. Acceptance: the refusal names a command that replaces only the stale AIDA-generated hooks (e.g. ''aida scaffold apply --hooks'' or ''aida scaffold hooks --refresh''); scaffold apply refreshes AIDA-generated hooks whose header matches the generated form, even without --force; the refusal lists ALL stale hooks at once. Related: STORY-1647 (hook template changes).'
