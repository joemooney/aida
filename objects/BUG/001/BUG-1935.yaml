title: aida pr list reports CI Failing for non-required informational checks and lists multi-spec PRs once per spec
description: |
  Observed 2026-10-10. `aida pr list` showed CI "Failing" for PR #2483 when only the non-required, path-filtered `Build (windows-latest)` had failed; the required `Build (ubuntu-latest)` and `merge-hold-gate` were green. It also listed PR #2487 twice (rows for ADR-72 and TASK-1723) because its title mentions both IDs.

  Want: the CI column honours the same informational_workflows / informational_checks config as ci_gate (BUG-1191), or reads only the branch-protection required checks, so "Failing" means "blocks merge". Collapse a multi-spec PR into one row listing every ID.

  Acceptance: a PR whose only red check is informational shows Passing (or "Passing, 1 informational red"); a two-spec PR is one row.
