- id: 01a12b20-521d-7871-a9ed-df06c9291119
  author: joe
  content: 'FACTORY PLAN (night): (1) CI column: in aida-cli-lib/src/pr_list.rs replace the inline statusCheckRollup loop with a pure helper github_rollup_ci_status(rollup, &CiGateConfig) that maps each rollup entry (CheckRun name/workflowName/status/conclusion; StatusContext context/state) to a ci_gate::CheckRow bucket and runs ci_gate::classify_red (required = [] so no extra API call; config read once via read_ci_gate_config). Real red -> Failing; only informational red -> ''Passing (N informational red)''; relevant pending -> Pending. Human table colours any ''Passing…'' green. (2) De-dup: a post-pass collapse_by_pr(entries) merges rows sharing pr_number, joining spec_id with '','' (order preserved) — applied at the return of both GitHub and GitLab builders so the listing loop (concurrently touched by BUG-1927) is not restructured. Tests (new #[cfg(test)] mod in pr_list.rs): ci_column_ignores_informational_checks, ci_column_fails_on_required_red, ci_column_pending_ignores_informational_pending, multi_spec_pr_is_one_row. Docs: aida pr list bullet in docs/cli/04-git-lifecycle.md (one row per PR, comma-joined spec ids in --json spec_id, informational checks don''t fail). Risks: no local compile; merge-hold-gate red stays Failing (no hold-marker lookup) as before.'
