    DECISION: Adopt the suggested disposition.  is worktree-resident and must be treated as UNTRUSTED for launch-authority values.

    ### Decision & Rationale

    We will split the config surface by consequence.  may provide POLICY values (timeouts, thresholds, roles) since those only govern internal AIDA behavior. It may NOT provide EXECUTABLE paths, credentials, or other authority-escalating values. Those must come from the running binary or from a location outside the worktree (like  or environment variables).

    This aligns  with the doctrine established in BUG-1624 for .

    ### Acceptance Criteria

    1. Implement a validation function (e.g. ) or type-level split in  that explicitly rejects any executable-selecting or path-selecting keys if loaded from the worktree .
    2. Add a clear doc-comment on the  struct (and its loading mechanisms) codifying this split: policy keys are allowed from the worktree, authority/executable keys are not.
    3. Tests assert that attempting to load a config from the worktree with an executable override (if any exist) is ignored or fails, while policy keys are correctly loaded.
    4.  overrides in  (if implemented per the TASK-1499 rework) are explicitly discarded or rejected, deferring to the running executable.
