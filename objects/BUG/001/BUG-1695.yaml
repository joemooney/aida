title: 'sandbox_create_and_seed_round_trip flakes on teardown: destroy fails with ''Directory not empty'' (os error 39)'
description: |-
  Blocked PR #2240 (STORY-1478) on the REQUIRED Build (ubuntu-latest) check with 7152 passed / 1 failed. The failure is unrelated to that branch, which touches only cli.rs, git_backend_cmd.rs, history.rs, history_timeline.rs, lib.rs and docs/cli/08-reporting.md — no sandbox code.

  OBSERVED (CI run 36345474679, job 108693654830, 2026-09-27T19:52:35Z):
    thread 'sandbox_cmd::tests::sandbox_create_and_seed_round_trip' panicked at aida-cli-lib/src/sandbox_cmd.rs:275:40:
    destroy: failed to destroy sandbox at /tmp/.tmpvydjCu/sb
    Caused by: Directory not empty (os error 39)

  DIAGNOSIS (to confirm, not assumed): os error 39 on a recursive destroy is the classic teardown race — something is still creating or holding entries under the sandbox root while the remove walks it, so the directory refills between the walk and the rmdir. Candidates: a child process spawned by the seed step that has not exited, an unflushed/unclosed handle, or a concurrent test sharing the temp root. It passes locally and under lighter load, which fits a race rather than a logic error.

  WHY IT MATTERS BEYOND THE ONE TEST: it fails a REQUIRED check, so it can block ANY unrelated PR from merging, and it teaches readers to dismiss a red Linux build as 'probably the flake' — which is exactly how a genuine regression gets waved through. That second cost is the larger one.

  ## Acceptance
  - The destroy path is robust against the race: either it waits for the sandbox to be quiescent before removing, or it retries the removal on ENOTEMPTY a bounded number of times, or the test's sandbox root is isolated from whatever else is writing under it. Whichever is chosen, the reason is recorded in a comment so a later reader does not 'simplify' it away.
  - Root-cause first: identify WHAT is still writing under the sandbox root at destroy time and state it in the fix. A bare retry loop added without that answer is not acceptable, because it would equally mask a genuine leak of a child process.
  - A test demonstrates the fixed behavior deterministically with fixtures — no sleeps and no polling loops.
  - If the cause is a leaked child process, the fix closes the leak rather than only tolerating it at teardown.
