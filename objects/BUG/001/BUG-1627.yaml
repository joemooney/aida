title: Session-env hardening follow-ups after BUG-1624 (no-launch hint, NUL panic, AIDA_AGENT_TYPE trust, test env restore)
description: 'Low findings from BUG-1624''s security re-review. (a) queue_cmd.rs ~11703: the queue work --no-launch hint still says ''source .aida/session-env.sh''; point to aida worktree enter instead. (b) lib.rs ~40472: a NUL byte in an allowed value makes std::env::set_var panic; skip such values. (c) The file still controls AIDA_AGENT_TYPE, which turns on the advisor code-gate agent exemption and adds a mailbox identity; take it from the lease, or accept only known agent types. (d) bug_1624_apply_session_env_to_process_ignores_non_allowlisted_names should restore PATH and LD_PRELOAD in case of a regression. Acceptance: a test for each.'
