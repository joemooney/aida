title: push_store_after_id_allocation reports every push_exact error as 'origin unreachable', hiding auth, ref and hook failures
description: 'Noted by the fresh reviewer of PR #2502 (TASK-1717), non-blocking. In aida-cli-lib/src/lib_part1.rs push_store_after_id_allocation (~12970), push_exact returning Err is treated as the TASK-857 offline case. A permission-denied, protected-ref or server-hook failure therefore prints the offline/unreachable guidance, and the operator retries a push that can never succeed. Latent today. Acceptance: distinguish a network/unreachable error from the rest (classify the git stderr); non-network errors bail with the real git message and the same recovery hint. Unit test with a fake push error of each kind.'
