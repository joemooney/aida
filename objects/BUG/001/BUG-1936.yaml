title: aida-git-guardrails hook blocks commands whose text merely mentions git push operations, with no stderr reason
description: |
  Observed 2026-10-10, twice in one session. The PreToolUse hook .claude/hooks/aida-git-guardrails.sh blocked Bash calls whose TEXT mentioned git push operations, even though they never ran git:
  1. `aida add ... --description "..."` whose description mentioned a mirror push;
  2. a heredoc writing a markdown file that quoted a force-push command (while filing this very bug).
  The hook printed nothing on stderr, so the agent saw only "hook error: No stderr output" with no reason. Workaround: write the text with a file tool, then use --description-from-file.

  Want: the guardrail matches only actual git invocations (the command word and its arguments after shell parsing), not words inside quoted arguments, heredoc bodies, or other commands' arguments. When it blocks, it says why on stderr.

  Acceptance: `aida add --description "mentions a force push"` and a heredoc containing that text are allowed; a real force push is still refused with a stated reason.
