  content: 'Scope addition from BUG-1628''s strict review (same phase-1 area, fold in here): (1) lib.rs ~104004: the resolver runs a second time after the phase-1 check accepts, and ''.ok().flatten()'' discards errors. A failure in that window launches the implementer without a pinned worktree (the BUG-1244 problem). Use the checked value, never re-resolve. (2) Add a test that a live lease wins over the resolver. (3) queue_done_ownership should use the configured prefixes, so queue done and phase 1 agree. (4) known_spec_prefixes loads the whole store and creates the objects dir as a side effect; make it read-only and cheap. (5) The explicit --branch reuse race (TASK-245 rule) versus ordinary pickup.'
