- id: 01a0dc96-775a-7ca2-bb82-72b1897fbe5e
  author: joe
  content: |-
    Strict re-review: REQUEST CHANGES — 3b46894ab7 (vs d931b9904b). The prior blockers are fixed. One small coverage regression blocks approval.

    VERIFIED OK:
    - Tests pass: bug_1629 18, auto_complete 276, real_phase_driver 50, queue 498.
    - Blocker 1 fixed. Mutation: forcing the unleased check to true makes never_force_claims_a_worktree_another_lease_holds and symlinked_project_root fail.
    - Blocker 2 fixed: worktree_is_unleased (lib.rs:100319) canonicalizes both sides and fails safe. Mutation: reverting to the raw PathBuf compare makes symlinked_project_root_still_matches_the_canonical_lease and uncanonicalizable_paths_count_as_leased fail. The symlink fixture really has a textual mismatch; it asserts leases[0].worktree_path != pinned.
    - Retry trace (lib.rs:102691): SpecRetried with cause lost-child-state (2/2), an append_phase_retry ledger entry, and a JSON 'retrying' line. It fires once, because the second recover returns Err before recording. Mutation: removing it fails replacement_launch_emits_a_retry_event. It does not change budgets. drain retries are only read for display (latest_phase_retry_for_member). SpecRetried is excluded from the supervised re-drive count, and is_transient_retry_cause ignores 'lost-child-state'. The only effect is a supervisor wake, which is consistent with transient retries.
    - Refusal file: the path comes from the parent-set receipt env plus an orchestrator-minted uuid. No spec or session text is ever joined, so there is no traversal. Each launch gets a fresh uuid and its own file. prepare_orchestrated_lease_receipt removes any same-uuid leftover, and phase 1 take()s the file before the replacement, so there is no cross-child or stale misattribution. The file is written only when the receipt env is set, argv starts with 'queue work', and neither the receipt nor the refusal file exists. The receipt is published before the agent launches (queue_cmd.rs:11729), so a nested 'aida queue work' inside the agent never writes one. The writer caps at 400 chars and takes the first line only. .aida/orchestrator-handoffs is covered by the deny-by-default .gitignore rule '.aida/*'.
    - The launch-budget doc (lib.rs:102624) is accurate. BUG-826 is [30,60], so 2 relaunches, and empty_launch_retries_used is never reset (lib.rs:104941).
    - The tests use tempdirs, stubs, and project-local events and drain-state only.

    BLOCKING:
    1. auto_complete.rs (removed bug_1629_lost_child_state_is_not_retried_again_or_credited): this was lost coverage, not a pure duplicate. The surviving launch_refusal_shelves_and_never_reaches_ci_or_reviewer (~9813) runs with the mock base transient_retry_budget = 0. The removed test used budget 3, and it was the only test proving the orchestrator never transient-retries a LaunchRefused. Mutation: adding "launch-refused" to is_transient_retry_cause (auto_complete.rs:1202) leaves all 276 auto_complete tests green. With that regression the single-replacement bound would be multiplied by the orchestrator retry budget. Fix: add "launch-refused" to the negative list in transient_retry_policy_is_closed_and_bounded (~7710), or set transient_retry_budget = 3 in the surviving test.

    SHOULD-FIX (non-blocking):
    2. lib.rs:100344 record_orchestrated_child_refusal has no test. The final-failure test writes the refusal file from the stub. None of its gates are exercised: the env check, the 'queue work' argv check, receipt-exists, and no-overwrite. Extract a pure fn taking (receipt_env, args, message) and unit-test it.
    3. lib.rs:100365 and 102649: the summary keeps control characters (ESC/ANSI, CR) from the child's error text. That text goes into the stderr line, the SpecRetried detail, and the shelve reason. Strip char::is_control before storing.
    4. lib.rs:100384: the parent's read_to_string is unbounded. Cap the read, for example with take(4096), for symmetry with the writer.
    5. A refusal written by a child that did create a lease (the receipt write failed afterwards) is never consumed and leaks one small file per occurrence. This is harmless because it is keyed by uuid.
    Verdict by independent reviewer; branch not modified.
