title: 'BUG-1986 review follow-ups: shrink the recheck-to-remove window, stop session end on a failed salvage, gate pause tests on debug_assertions, untracked .aida/ dirty false positive'
description: |
  Non-blocking findings from the advisor's independent review of PR #2548 (BUG-1986, merged as 998d99ea60).

  ## Acceptance
  1. In session_end.rs, the window from the final holder recheck (~:1383) to the remove/return (~:1645) contains only local filesystem steps and the salvage git diff. Move coordination::release_claim (~:1523, a store pull, commit and push), the mcp-claim reap, zen::clear_needs_human_marker and the manifest and activity-log deletes after the remove/return block. The recheck stays before the chdir (the self-exemption depends on cwd).
  2. When salvage_before_return is set and the session-end salvage fails (~:1444), session end stops before deleting the lease: the lease stays, the session is not ended, and the error names the recovery command. Today the lease is deleted, return_to_pool then fails on its own salvage, and the pool entry stays leased with no session record.
  3. The two pause-driven tests in aida-cli/tests/bug_1947_session_end_live_process.rs (~:529, ~:553) and the end_with_a_holder_started_at helper are #[cfg(debug_assertions)], so `--profile agent` runs don't wait 60 s and fail.
  4. dirty_entries_ignoring_runtime_links doesn't refuse a bare `?? .aida/` when everything under it is a runtime link (or that gate's git status uses -uall). Add a test with .aida/ not gitignored.
  5. Optional: print the "pid namespace unverified" warning once per session end, not three times.
