  HOW THIS WAS FOUND IS WORTH RECORDING AS METHOD, because the default would have
  buried it. A red Windows leg on a PR is INFORMATIONAL by design and the required
  checks were green, so the ordinary move is to merge and move on. The reason it got
  read is a rule written thirty minutes earlier: with six falsified mechanisms and NO
  SURVIVING CAUSE, a red Windows check is UNEXPLAINED, NOT EXPLAINED-AWAY, and must
  be treated as a finding about the PR until something distinguishes it. It was then
  distinguished - same test, same counts, on a diff touching no discipline files -
  which is what makes it safe to merge #2049 AND is what produced the reproducer.
  A KNOWN-RED CHANNEL IS EXACTLY THE CONDITION UNDER WHICH THE NEXT REAL SIGNAL GETS
  DISCARDED; the only defence is to identify the red rather than recognise it.

  STANDING OBSERVATION, NOT A MECHANISM - recorded because it has now appeared in
  BOTH failing runs and was dismissed as out of scope the first time. During the
  "Run tests" step, the Windows log emits twice:

      error: The following untracked working tree files would be overwritten by merge:

  Some test shells out to git and hits an untracked-file collision. It does not fail
  the run. It appeared in the 09-21 nightly and again in run 35622795066, and it also
  appeared in the 09-14 macOS failure log. Whether it is related to this bug is
  UNKNOWN and nobody should assume it is - it is logged here so the next reader does
  not re-dismiss it three times as noise, and because "a test that manipulates a git
  working tree" is a plausible neighbour to "a comparison whose behaviour changed
  without its inputs changing". That is a lead, not a hypothesis, and it has not been
  added to the ledger because it has not been stated precisely enough to falsify.

