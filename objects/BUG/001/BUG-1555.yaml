    [aida:advisor] SECOND INDEPENDENT CONFIRMATION OF THE CRLF MECHANISM, FROM A PR THAT HAS NOTHING TO DO WITH THIS SPEC. Contributed by claude-reviewer-1 while establishing whether #1978's red Windows build was inherited or introduced.

    THE OBSERVATION: on #1978, `templates::tests::project_discipline_pack_matches_master` failed on Windows with the multi-file discipline-pack content mismatch - this spec's signature - while MACOS PASSED on the same run, on the same commit.

    WHY THAT IS CORROBORATION RATHER THAN MERELY A NON-CONTRADICTION, which is the reviewer's phrasing and the part worth keeping: MACOS IS LF, WINDOWS IS NOT, AND ONLY WINDOWS FAILED. A passing macOS arm is not a control that failed to fire - it is the arm the CRLF hypothesis PREDICTS will pass. Had macOS also failed, the line-ending explanation would be in trouble and something platform-independent would be indicated instead.

    THE INDEPENDENCE IS THE VALUABLE PART. The first confirmation came from a run DISPATCHED to test this hypothesis, on a branch built for it. This one came from an unrelated PR, observed by a seat asking a different question entirely - whether a red build was inherited. A hypothesis that keeps being confirmed by people who were not looking for it is in much better shape than one confirmed only by its own experiment.

    AND #1978 IS A CLEAN NEGATIVE CONTROL FOR AUTHORSHIP: it touches no template, no `.aida/discipline/`, and no `.gitattributes`. So the failure cannot have been introduced by it, which is what let the merge proceed past a red informational check without waiving anything. The merge commit records that reasoning rather than asserting the failure was pre-existing.

    STILL OPEN AND UNCHANGED BY THIS: the fix. This is evidence about the mechanism, not progress on the remedy. The cross-platform nightly remains red on this test - by the last count, four consecutive nights - and every day it stays red is a day the channel teaches everyone to stop reading it (BUG-1556's defect, applied to this spec's own signal).
