    The loop globs `.aida/discipline/*.md`. Of the 23 files the drift test actually compares, 22 are `.md` and were measured CRLF directly. glossary.yaml — the 23rd, and one of the files in the 09-21 nightly's failure list — IS INFERRED from the same checkout rule rather than observed.

