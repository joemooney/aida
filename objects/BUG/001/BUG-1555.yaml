    IT IS ALSO THIS SPEC'S OWN FINDING BITING FOUR HOURS AFTER IT WAS RAISED. The `*.md` glob was recorded as finding 2 on PR #2050's review, with the stated reason that a `.gitattributes` rule scoped to `*.md` would leave glossary.yaml unpinned AND THE PROBE WOULD REPORT ALL-LF AND NEVER SHOW IT. The first result the probe ever produced contains exactly that gap — one file short, and it is the file the future fix is most likely to miss. Glob the directory, not the extension, and the number becomes 23 of 23 measured.

