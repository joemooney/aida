    THAT IS BUG-1551 BITING THE SEAT THAT SPENT THE MORNING DOCUMENTING IT. `auto_bump_eligible_status` routes to `lifecycle::git_merge_completes`, which accepts Approved | Planned | InProgress | Done | NeedsAttention — five states, deliberately. I established that fact today, used it two hours ago to justify STRIPPING the trailer on #2033 so BUG-1480 would not complete past STORY-1423, and then did not apply it here. The difference between the two merges was not judgement; it was that on #2033 I had written the strip into the hold marker as a release condition, and here I held the condition only in a mail and in my own head.

    THE LESSON IS NOT "REMEMBER HARDER". A condition that lives in prose is a condition that fires only if the person who wrote it is the person who acts and remembers at the moment of acting. The one that worked was mechanical — a release condition on the marker file, read at merge time. The one that failed was a sentence in a message I sent.

