title: 'The discipline-pack parity guard was born unable to work on Windows: it compares an LF-pinned master against an unpinned project copy, and the control that seemed to rule that out compared a test NAME across two dates while the body changed'
description: |
  THE CROSS-PLATFORM NIGHTLY HAS BEEN RED FOR FOUR NIGHTS ON A FALSE POSITIVE. Windows fails one test; macOS is green; Linux PR CI is green on the same commits. The test is not detecting drift - it is comparing LF against CRLF.

  Found by the advisor 2026-09-21. PROVENANCE, CORRECTED: the trigger was the `nightly_red` field of `aida awaiting`'s own output - "cross-platform nightly red since 2026-09-18 (run 35600363642, 4 nights)" - NOT a report from any seat. The first version of this line credited the reviewer seat, because that seat's mail and the awaiting block printed in one batched shell call and the advisor attributed the tail of the output to the author of its head. A spec outlives the mail thread, so the misattribution would have left the next reader trusting a seat's instruments for a measurement that seat never made. Corrected on that seat's own objection. What the reviewer seat DID measure, after the question was raised, is the denominator below. Diagnosed against run 35600363642 (main, 2026-09-21T12:34:56Z) and the tree at 8bc2512480.

  WHAT FAILS:

      Build (macos-latest)    success
      Build (windows-latest)  failure   -> `-p aida-core --lib`

      test result: FAILED. 954 passed; 1 failed
      templates::tests::project_discipline_pack_matches_master
      panicked at aida-core\src\templates.rs:1245

      "project copy .aida/discipline/ has guide(s) whose content differs from
       the embedded master: [two-seat-protocol.md, machinery-glossary.md,
       brief-polling.md, backlog-grooming.md, integrator-role.md,
       skill-prompt-kinds.md, glossary.yaml, rework-brief-craft.md,
       spec-authoring.md, session-discipline.md,
       agent-agnostic-vs-claude-specific.md, seat-recovery-playbooks.md,
       docs-lane.md, workflow-patterns.md, skill-cli-symmetry.md,
       advisor-role.md, reserved-paths.md, robust-project-root-resolution.md,
       lifecycle-vocabulary.md, git-sync-and-review.md,
       observation-discipline.md, tag-conventions.md, implementer-discipline.md]"

  Everything else on that runner passes, including the 5157-test aida-cli-lib suite.

  THE COUNT IS THE TELL. There are 26 masters under aida-core/templates/.aida/discipline/ and 3 are excluded as LOCALIZED_DISCIPLINE_GUIDES, leaving 23 compared. TWENTY-THREE OF TWENTY-THREE FAIL. Genuine content drift does not hit every compared file at once; a systematic difference in every file does.

  THE MECHANISM, read out of the tree rather than guessed:

    1. `.gitattributes` pins ONLY the master side to LF:
           aida-core/templates/** text eol=lf
       with a comment explaining exactly why - "so a Windows checkout (git autocrlf)
       cannot embed CRLF". trace:BUG-244.

    2. THE PROJECT COPY IS NOT PINNED. There is no rule for `.aida/discipline/**`, so a
       Windows checkout with autocrlf writes that side with CRLF.

    3. The comparison does not normalize. aida-core/src/templates.rs:1159-1172,
       `discipline_content_mismatches`, is `local.trim_end() != *master` - trailing
       whitespace only, interior line endings untouched.

  So the embedded master is LF by fiat, the project copy is CRLF by checkout, and every interior newline in every file is a difference. Linux and macOS never produce CRLF, which is why this is invisible in PR CI - PR CI is Linux-only by design (TASK-257).

  WHY THIS IS WORSE THAN A FLAKY TEST. This is the BUG-1279 instrument - the guard that keeps the shipped discipline pack honest against the master. It is currently UNABLE TO REPORT REAL DRIFT ON WINDOWS, because it reports drift unconditionally there. A real stale guide landing tomorrow would change nothing observable. AND IT HAS TRAINED THE NIGHTLY TO BE RED: four consecutive nights of a known-red signal is how a cross-platform gate stops being read, which is the failure mode the release process depends on NOT happening (scripts/pre-release-check.sh blocks a tag on a green cross-platform run within 24h - so this also blocks releases).

  A NEW FAILURE FAMILY FOR TASK-1418'S CATALOGUE. The five instruments catalogued there were INERT - they could not fire. This one is the mirror image: it fires when nothing is wrong. Both destroy the instrument's information content, and the always-firing form is more dangerous because it looks like vigilance and it degrades a shared signal everyone else reads.

  Acceptance:
  - The Windows leg of cross-platform.yml goes green on a commit with no discipline-pack changes.
  - The comparison normalizes line endings before comparing. `normalize_line_endings` already exists at aida-cli-lib/src/lib.rs:11061 but is in the wrong crate for this test - either lift it to aida-core or add the equivalent there. The .gitattributes comment already states the house position: "the load-bearing fix is parser-side line-ending normalization; defense-in-depth" is the attributes rule.
  - `.gitattributes` ALSO pins the project copy: a rule covering `.aida/discipline/**` with `text eol=lf`, matching the existing master-side rule. Both, not either - this is the same defense-in-depth pairing BUG-244 already chose, and they fail independently.
  - DEMONSTRATE-IT-STILL-FIRES, binding: after the fix, show the test FAILING on a deliberately edited project-copy guide. A normalization fix that silences the comparison entirely would look identical to a correct one from the nightly's point of view, and this spec is about an instrument that stopped carrying information - replacing always-red with always-green is not a fix.
  - Check whether any OTHER content comparison in the tree has the same raw-compare shape. This one was found because it was red; a sibling that is quietly green on Linux and wrong on Windows would not announce itself.

  Not in scope, but noticed in the same log and worth its own look if it recurs: the Windows run logs "error: The following untracked working tree files would be overwritten by merge:" twice during the suite, and a rustup-init cache guard message referencing BUG-103. Neither failed the run.

  ===============================================================================
  CORRECTION BY THE ADVISOR, SAME DAY, BEFORE ANYONE PICKED THIS UP. MY CENTRAL
  MECHANISM ABOVE IS FALSIFIED. READ THIS SECTION BEFORE THE ONE ABOVE.
  ===============================================================================

  THE ONE OBSERVATION THAT KILLS THE LF-vs-CRLF EXPLANATION:

      2026-09-20 nightly, Build (windows-latest), aida-core lib:
          test templates::tests::project_discipline_pack_matches_master ... ok
          test result: ok. 952 passed; 0 failed
      2026-09-21 nightly, Build (windows-latest), aida-core lib:
          test templates::tests::project_discipline_pack_matches_master ... FAILED
          test result: FAILED. 954 passed; 1 failed

  The test was on main for BOTH runs - `ecb710411e` (the BUG-1279 commit that added it)
  committed 2026-09-20T07:16Z, verified an ancestor of `26c7f5107e`, which was main's HEAD
  when the 09-20 nightly triggered at 11:06:35Z. SO IT PASSED ON WINDOWS ONE NIGHT AND
  FAILED ON WINDOWS THE NEXT. A checkout-level line-ending mismatch is a property of the
  platform, not of the day: it would have failed both nights identically. IT DID NOT.

  WHAT I DID WRONG, precisely. The 23-of-23 count IS strong evidence of a SYSTEMATIC
  difference rather than per-file drift, and that part stands. I then jumped from
  "systematic" to "line endings" because the `.gitattributes` asymmetry was sitting there
  and explained it beautifully. I never looked for a case where the mechanism predicted
  failure and failure did not occur - and the immediately preceding run was exactly that
  case, one API call away. AN EXPLANATION THAT FITS THE EVIDENCE IN FRONT OF YOU IS NOT
  THE SAME AS ONE THAT SURVIVED AN ATTEMPT TO KILL IT, and I filed this at priority high
  with an acceptance criterion built on the unfalsified version.

  WHAT IS STILL VERIFIED AND SHOULD NOT BE RE-DERIVED:
  - The failing test, run, platform and message are as quoted above.
  - 26 masters, 3 LOCALIZED_DISCIPLINE_GUIDES, 23 compared, 23 of 23 reported stale. The
    count still says SYSTEMATIC, not per-file drift.
  - `discipline_content_mismatches` (aida-core/src/templates.rs:1159-1172) really is
    `local.trim_end() != *master` - no interior normalization, and trim_end is applied to
    the LOCAL side only, so a trailing-newline difference is masked on one side and not
    the other. That asymmetry is real and worth fixing regardless of whether it is THIS
    failure's cause.
  - `.gitattributes` really does pin only `aida-core/templates/**`. Also real, also worth
    fixing on its own merits, and NOT established as the cause.
  - macOS was green on both nights.

  THE WINDOW THE REAL CAUSE LIVES IN. Between the two nightly triggers, exactly four
  commits touched either side of the discipline pack (all local times -07:00, all AFTER
  the 09-20 nightly which fired at 04:06 local):

      d65ae3c54b  10:51  docs(discipline): why purpose-holding reviewers miss failures (TASK-1295)
      a0ec8fb22f  10:54  feat(roles): ship cold-session seat handoff pack (STORY-1351)
      53e3176e6e  11:09  docs(discipline): verify against the artifact, not the step's own report (TASK-1302)
      433c63bb4d  23:43  feat(criteria): flag post-deployment acceptance (TASK-1293)

  Each appears to touch both sides. START HERE: bisect these four against the Windows leg,
  or reproduce the comparison on a Windows checkout of each. A systematic 23-of-23 failure
  introduced by a commit that touched 2-4 files is itself informative - it points at
  something global (an embedding/build step, a path or separator assumption, a BOM, a
  whole-file rewrite) rather than at the edited content.

  REVISED ACCEPTANCE - the earlier list is superseded where it conflicts:
  - IDENTIFY THE ACTUAL CAUSE AND STATE THE OBSERVATION THAT DISTINGUISHES IT FROM THE
    LINE-ENDING HYPOTHESIS. A fix that merely makes the test green satisfies nothing here;
    the 09-20 pass is the control and any accepted explanation must account for it.
  - Normalize line endings in the comparison AND apply trim consistently to both sides,
    AND pin `.aida/discipline/**` in `.gitattributes`. These are correct independently of
    the cause and should ship either way - but they are NOT to be recorded as fixing this
    bug unless the cause is shown to be line endings.
  - DEMONSTRATE-IT-STILL-FIRES stands unchanged: after the fix, show the test FAILING on a
    deliberately edited project-copy guide. Replacing always-red with always-green is not a fix.
  - THE SCOPE CLAIM IN THE TITLE IS WRONG AND IS CORRECTED BELOW. This bug is ONE NIGHT'S
    failure, not the four-night streak.

  THE FOUR-NIGHT FRAMING WAS ALSO WRONG, AND THE REAL PATTERN IS BIGGER THAN THIS BUG.
  Corrected after claude-reviewer-1 sent the denominator instead of the streak. Over the
  last 30 SCHEDULED runs: 27 failure, 3 success. The green is the anomaly, not the red -
  the red runs go back to at least 2026-08-23. And the four recent nights fail on FOUR
  DIFFERENT TESTS, none recurring:

      09-18  windows  reconstitute::tests::scratch_gc_expires_old_runs_and_keeps_only_the_newest   4899 passed, 1 failed
      09-19  windows  git_ops::tests::failed_pull_rebase_aborts_and_restores_branch                 940 passed, 1 failed
      09-20  windows  auto_bump_done_tests::auto_bump_resolves_stranded_review_pr_specs_via_forge_lookup  5092 passed, 1 failed
      09-21  windows  templates::tests::project_discipline_pack_matches_master                       954 passed, 1 failed

  None repeats, and the passing count grows each night - so each is being fixed within a
  day and a NEW portability defect arrives to replace it. Earlier runs also failed on
  macOS (09-14: fs_atomic::tests::read_atomic_returns_notfound_when_missing) and on both
  platforms (09-09), so it is not even one platform across the population.

  THAT IS THE FINDING THAT MATTERS AND IT IS NOT THIS BUG. It is an ARRIVAL RATE: Linux-only
  PR CI lets a portability defect land roughly nightly, the nightly catches it a day later,
  someone fixes it, and the next one lands. CLAUDE.md documents three PR-time guards
  intended to catch exactly this - a report-only Linux-hosted target check, the
  `scripts/check-portability.sh` ratchet, and a path-filtered informational Windows/macOS
  matrix. They are evidently not catching these. Filed separately as the real spec; this
  bug is narrowed to the single 09-21 failure.

  - THE ONE-SIDED NORMALIZATION IS A SECOND DEFECT IN THE SAME LINE, AND IT IS A TRAP FOR THE FIX. Found by claude-reviewer-1 2026-09-21. `local.trim_end() != *master` trims the LOCAL side and compares against master RAW. It is benign today - the test passes on Linux, so the embedded master must already arrive trimmed - but it is the same shape as the suspected bug: normalize one side, compare against the other. IF THE FIX ADDS LINE-ENDING NORMALIZATION TO `local` ONLY, IT REPRODUCES THE DEFECT IN A NEW DIMENSION and Linux stays green while telling you nothing. Normalize BOTH sides, apply trim to BOTH sides, and let the demonstrate-it-still-fires case be a project copy edited with a CRLF-ONLY change - a test that must still detect a difference the normalizer is not supposed to erase.
  - THE .gitattributes ASYMMETRY IS CONFIRMED REAL UNDER THE RESOLVER, WHICH IS NOT THE SAME AS BEING THE CAUSE. Verified independently by claude-reviewer-1 with `git check-attr` rather than by reading the file - master side resolves `text: set, eol: lf`, project side resolves `text: unspecified, eol: unspecified`. The method matters and is recorded: reading .gitattributes tells you a rule exists; check-attr tells you what a path actually GETS, the same distinction that made `git check-ignore` mislead both seats on BUG-1279. So the asymmetry is real and pinning `.aida/discipline/**` is correct on its own merits - AND the 2026-09-20 Windows pass documented above still rules it out as this failure's cause. A confirmed mechanism that cannot explain the control is not the explanation.
  - THE COUNT INFERENCE IS THE LOAD-BEARING STEP AND IT GENERALISES. Endorsed by claude-reviewer-1 as the part worth keeping if everything else were rewritten: 23 of 23 failing simultaneously is not drift, because no plausible edit history produces it. Their generalisation, recorded for TASK-1418's catalogue: A CONTENT GUARD THAT FAILS ON 100% OF ITS COMPARISON SET IS REPORTING ABOUT ITSELF. That separates "the guard found something" from "the guard is broken" BEFORE any mechanism is known - which is exactly the step that should have stopped this spec's first diagnosis from being filed with a named cause at high priority.
  - THE SIBLING SWEEP IS STILL OPEN AND ITS SCOPE IS RECORDED SO NOBODY CREDITS IT AS DONE. claude-reviewer-1 grepped ONLY templates.rs and ONLY for that exact comparison shape; within that file it is the single occurrence. A raw content compare written differently, or living in another module, would not have matched the pattern. They scoped their own sweep unprompted rather than letting it read as exhaustive - the acceptance bullet asking for a tree-wide sweep for the same shape remains OPEN.

  ===============================================================================
  FALSIFICATION LEDGER - FIVE MECHANISMS ELIMINATED, EACH BY A NAMED OBSERVATION.
  DO NOT RE-PROPOSE ANY OF THESE WITHOUT FIRST ANSWERING THE OBSERVATION BESIDE IT.
  Built 2026-09-21 by the advisor and claude-reviewer-1 working the same window.
  ===============================================================================

    1. LINE ENDINGS (LF master vs CRLF project checkout)
       KILLED BY: the same test PASSED on Windows on 09-20 and FAILED on 09-21.
       A platform property does not switch on by date. Reinforced: `.gitattributes`
       has not changed since 2026-05-19 (commit 5220c4d3ad, BUG-244), so the pin
       that creates the asymmetry was in force on BOTH nights.
       THE MECHANISM IS NEVERTHELESS REAL - see the standing note below.

    2. CONTENT DRIFT BETWEEN THE TWO SIDES
       KILLED BY: both commits in the window touched BOTH sides symmetrically -
       433c63bb4d (TASK-1293) README + spec-authoring, 53e3176e6e (TASK-1302)
       session-discipline - same files, same line counts, master and project copy
       together. Verified by claude-reviewer-1.
       REINFORCED BY DIRECT MEASUREMENT on Linux at origin/main by the advisor:
           26 files compared byte-for-byte (cmp), 3 differ
           the 3 are EXACTLY the LOCALIZED_DISCIPLINE_GUIDES entries
           (README.md, autonomous-burndown.md, substrate-as-bouncer.md)
       So all 23 compared files are byte-identical. There is no drift to find.

    3. STALE EMBEDDED MASTERS (a cached CI target dir + a directory-level
       `cargo:rerun-if-changed=templates/` in aida-core/build.rs:13, with
       Swatinem/rust-cache@v2 in the workflow - the ingredients are all present)
       KILLED BY: four masters landed in the window (rework-brief-craft.md,
       seat-recovery-playbooks.md, spec-authoring.md, two-seat-protocol.md) and
       ALL FOUR APPEAR IN THE 09-21 FAILURE LIST. The failure list is derived from
       EMBEDDED_TEMPLATES keys, so the embed contained the new files. The embed
       was fresh.

    4. SYMLINKED PROJECT COPIES (a Windows checkout without developer mode
       materialises a symlink as a text file containing its target path, which
       would mismatch every file at once - the right shape for 23 of 23)
       KILLED BY: `git ls-files -s .aida/discipline/` returns 27 entries, ALL mode
       100644. No symlinks, and none in the window.

    5. STRAY CR BYTES COMMITTED INTO THE PROJECT COPY
       KILLED BY: `grep -rlc $'\r' .aida/discipline/` matches nothing at
       origin/main. No carriage returns are stored on either side.

  THE ONE THING EVERY SURVIVING EXPLANATION MUST ACCOUNT FOR. Only three files were
  edited in the window (README.md, spec-authoring.md, session-discipline.md) and
  twenty-three were reported stale. SO FILES WHOSE CONTENT WAS UNTOUCHED ON BOTH
  SIDES FAILED ON 09-21 HAVING PASSED ON 09-20. Whatever fired changed the BEHAVIOUR
  OF THE COMPARISON without changing what was compared. Any proposed mechanism that
  turns on file content is answering the wrong question.

    A METHOD CAVEAT ON THE EXACT COUNT, recorded so it is not over-read: the
    reviewer's "19 of the 23 also passed on 09-20" is arithmetic over master counts
    at each HEAD (22 -> 26 masters, 3 localized, so 19 -> 23 compared), NOT a
    reading of the 09-20 log, which printed only `ok` and enumerated nothing. The
    exact 19 is an inference. THE ARGUMENT DOES NOT DEPEND ON IT: three files were
    edited, twenty-three failed, so at least twenty untouched files flipped
    regardless of how the compared set is counted.

  STANDING NOTE - THE .gitattributes PIN IS NOT A NON-ISSUE, and the drop to medium
  must not be read as demoting it. At claude-reviewer-1's request, recorded plainly:
  the asymmetry is CONFIRMED LIVE under the resolver (`git check-attr` gives master
  `text: set, eol: lf` and the project copy `text: unspecified, eol: unspecified`).
  It did not fire in CI on 09-21, but it is a latent trap for THE FIRST WINDOWS
  DEVELOPER WHO CHECKS THE PROJECT COPY OUT LOCALLY - a different population from
  CI, and one with no nightly to catch it. Pin `.aida/discipline/**` regardless of
  what this bug turns out to be.

  A SEPARATE, STRUCTURAL DEFECT IN THE SAME FUNCTION - DELETION IS INVISIBLE.
  Found by claude-reviewer-1 while checking the above. `discipline_content_mismatches`
  reads the project copy with `std::fs::read_to_string(...).ok()?` inside a
  `filter_map`, so A MASTER WITH NO PROJECT COPY YIELDS None AND IS SILENTLY SKIPPED
  rather than reported. A DELETED PROJECT GUIDE MAKES THE PACK READ CLEAN. Not firing
  today - every master has a copy at origin/main - but this is the BUG-1279 guard and
  deletion is one of the drifts it exists to catch.

    NOTE THE PARTIAL MITIGATION AND WHY IT IS NOT A FIX: the test's earlier `missing`
    assertion does check `project_dir.join(name).is_file()` for every master, so a
    deletion IS caught by that assertion today. The blindness is in
    `discipline_content_mismatches` ITSELF, which is the reusable unit - any future
    caller that uses it without the separate missing-check inherits a guard that
    cannot see deletion. Fix the function, not only the call site.

    TAXONOMY - THIS IS A THIRD FORM FOR TASK-1418, and per the reviewer the hardest
    to notice: not an inert instrument and not an always-firing one, but an instrument
    that FIRES CORRECTLY ON ONE FAILURE MODE AND IS SILENT ON ANOTHER. It looks alive,
    because it is - just not for the case you are relying on.

  ADDED ACCEPTANCE:
  - Make `discipline_content_mismatches` report a missing project copy as a mismatch
    rather than skipping it, and cover it with a test that deletes a project guide and
    asserts the function alone (not the test's separate missing-assertion) reports it.
  - Every mechanism in the ledger above that ships as a hygiene fix - the
    .gitattributes pin, two-sided normalization, two-sided trim, deletion reporting -
    ships with the note that it is NOT credited as this bug's cause unless the cause
    is demonstrated to be it.

    6. RUNNER-IMAGE CHANGE altering git's checkout behaviour on Windows (e.g. a
       different `core.autocrlf` default). Generated and killed by claude-reviewer-1
       2026-09-21 BEFORE sending it.
       KILLED BY:
           2026-09-20  Build (windows-latest)  Image: windows-2025-vs2026  Version: 20260907.229.1
           2026-09-21  Build (windows-latest)  Image: windows-2025-vs2026  Version: 20260907.229.1
       Byte-identical image and version across both nights, so nothing at that layer
       can have changed the checkout. Line endings stay dead for a SECOND independent
       reason rather than only the control.

    THE REASON MECHANISM 6 IS THE MOST USEFUL ENTRY IN THIS LEDGER IS THAT IT FIT
    BETTER THAN ANY OF THE OTHERS, INCLUDING THE ONE THAT WAS FILED AT HIGH PRIORITY.
    It is platform-specific, day-specific, content-independent, hits all 23 at once,
    requires no repository change, and it RESURRECTS mechanism 1 in a form that
    survives the control - the .gitattributes asymmetry both seats confirmed would be
    the PRECONDITION, latent all along, with only its ACTIVATION being new. It
    explained more of the evidence than the original diagnosis did. AND IT WAS WRONG.

    THE ASYMMETRY WORTH KEEPING: it cost two API calls to kill and it would have cost
    another seat hours to chase. HOW WELL A HYPOTHESIS FITS IS NOT EVIDENCE FOR IT -
    it is a measure of how much you will regret not checking it. The reviewer
    generated it, killed it, and sent only the corpse, from the seat that had an hour
    earlier told the advisor that confirming a mechanism is not explaining an event.
    That is the discipline this ledger exists to record, and it is the reason the
    ledger is more useful to whoever picks this up than a sixth candidate would be.

