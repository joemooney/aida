title: New 'faq' type gets node-aware IDs (FAQ-1-NNN) because it has no pre-allocated block (TASK-1614 gap)
description: |-
  ## Problem
  `aida faq add` issues node-aware IDs (`FAQ-1-232`). The agreed short form (`FAQ-9`) only appears after a manual `aida db merge-gate`. Cause: `PHASE3_AUTO_ALLOC_TYPES` (aida-cli-lib/src/lib_part2.rs:1264) lists FR, BUG, TASK, EPIC, STORY, SPIKE, PRIN, VIS, CON, ADR, TERM. TASK-1614 added the `faq` type but not FAQ to that list, so blocks-then-fallback always falls back. DOC and CR have the same gap: the store has 6 DOC-1-* and 3 CR-1-* objects.

  ## Observed 2026-10-10
  FAQ-1-232..241 were promoted by hand with merge-gate to FAQ-1..10, not in creation order. FAQ-10 documents the dual numbering.

  ## Acceptance
  - FAQ is added to the auto-allocated types, and so are DOC and CR unless there's a recorded reason they're excluded. Better: derive the list from the type registry so a new type can't miss it again.
  - An existing node that lacks a block for a listed type claims one lazily on its first `aida add` of that type. Today allocation only runs on acquire, so already-acquired clones would never get one.
  - Regression test: on an already-acquired node, `aida add --type faq` yields an agreed `FAQ-N` ID with no merge-gate step.
  - Adding a type has a checklist item, or a test that fails, for block allocation.
