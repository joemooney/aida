  content: |-
    Fresh review of PR #2489 at 0caeb65860: APPROVE. Non-blocking follow-ups:
    (1) The rollback restores blocks.yaml from HEAD instead of from a copy taken before the claim, so it can discard uncommitted dispense-pointer edits (db_block.rs ~1337).
    (2) The claim-commit check matches on the exact subject; a hook that rewrites it would defeat it. A trailer marker or comparing commit ids would be safer.
    (3) If HEAD has no registry/blocks.yaml, the checkout fails silently.
    (4) A rejected push runs reset --hard HEAD~1, which discards uncommitted store changes. This predates the PR, but a first add can now reach it.
