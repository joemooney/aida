    independent: yes — neither implemented nor briefed by this advisor
    gates cleared: required Build SUCCESS; merge-hold-gate re-run SUCCESS after the drive hold was cleared by this review; mergeStateStatus CLEAN; no reviewer phase live at merge time

    THE NEW DEFAULT IS ARGUED FROM MEASUREMENT, which is the part I most expected to be a guess. 1200s sits above the measured 705-second p95 of the latest 97 completed CI runs, with the command that produced that figure recorded in the source comment. A timeout raised to a round number because the old one felt short is how the next regression arrives; a timeout raised above a measured p95, with the measurement written down, can be re-derived when CI gets slower.

    THE ACTUAL FIX IS THE RE-ARM, NOT THE NUMBER. Treating an in-flight required check as its own liveness signal is the correct diagnosis: a check that is queued or running IS progress even when the rollup fingerprint has not moved. The old code could only observe change, so a long check that simply took a while was indistinguishable from a dead one. Raising the window alone would have moved the cliff rather than removed it, and that distinction is the difference between this fix and a papering-over.

    I VERIFIED THE SAFETY PROPERTY rather than taking the comment's word, because a re-arm is exactly the kind of change that can create an unbounded wait by accident. `ci_wait_verdict` evaluates the absolute ceiling BEFORE the idle timer, so a perpetually-pending check that keeps re-arming still terminates at the ceiling. The bound holds.

    The environment-variable documentation was updated in the same change, with both rows rewritten to describe the new re-arm semantics and the new config keys rather than having their numbers bumped. That is the standing rule for an env-var change and it is the easiest thing in a fix like this to skip.

    ONE COSMETIC NOTE, not worth a round: `ci_observation_rearms_idle` returns its only argument unchanged and reads as a placeholder. The intent is a named, testable seam for a policy that may grow conditions, and the name earns its place at the call site — worth a line saying so, so a later reader does not simplify it away.
