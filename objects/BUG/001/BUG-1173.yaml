title: 'BUG-1167 residual race: merge-hold marker written at hold-DECISION time, not PR-CREATION — concurrent merger slips the pre-hold window'
description: |-
  STORY-1163 (#1861) merged ~49s BEFORE its drive-hold escalation fired (2026-09-16). The merge-hold marker + aida:merge-hold label are written at the drain's HOLD-DECISION time (merge_wave_pr supervised path / the SupervisedMerge escalation), so between 'PR goes green' and 'drain decides to hold' there is a window with NO marker present — a concurrent or stale-binary merger merges the CI-green+approved PR unopposed (no marker to refuse on, no label for merge-hold-gate to fail on).

  Fix: stamp the merge-hold marker (+ mirror the label) the MOMENT a supervised (drive/guided/operator/decide/unset) spec's PR is OPENED — not at merge-hold-decision time. Then any merger sees it from creation, and merge-hold-gate fails from the first check. This is the PR-open write I deferred when building BUG-1167 (the drain only wrote it at wave-hold time).

  Acceptance: a supervised spec's PR carries the marker + aida:merge-hold label from creation; a concurrent merge attempt in the pre-hold window refuses (client chokepoint) AND is blocked server-side (merge-hold-gate fails); drain-mode PRs remain unmarked (auto-merge intact); clearing on explicit human/advisor review still works. Refs ADR-37, BUG-1167.
