  content: '[advisor:groom] Approved, HIGH, DRAIN. This is the highest-value papercut in the backlog on volume alone: roughly thirty three-command dances in one window, every one of them after a review round, in the single most repeated loop we have. And the command''s own next-step line proves the defect — it prints ''aida queue work <SPEC> --user <invoking-user> --role implementer'' while a batch drain reads --user role:implementer, so the entry it just created is invisible to the thing that would act on it. A verb whose printed advice cannot work is worse than a missing verb, because it looks like it succeeded. Scope guard: queue the pickup on the ROLE queue by default — the same queue the drain reads and the same one aida queue add --for <role> targets — and make the printed next-step line match what was actually written; an explicit --user must still override for the rare personal-queue case. Second guard, and it is what makes this safe to land alongside STORY-1353: this is pure DISPATCH, so do not use it to widen who may call rework. Whoever may rework today may rework after; the fix is where the entry lands, not who may put it there. Regression test: after aida queue rework <SPEC>, the entry is visible to a batch drain reading the role queue — assert on the queue the drain actually reads, not on the command''s exit code.'
