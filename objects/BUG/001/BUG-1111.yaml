title: headless phase-1 lease anchors liveness on the live orchestrator pid - dead vendor child is unreclaimable (retry re-entry structurally broken)
description: "## Observed (TASK-1210 controlled specimen, 2026-09-12 12:23, testbed TASK-28)\nCodex implementer kill-9'd mid-phase-1 with a dirty worktree. The transient retry ran BUG-1078's 3 liveness re-probes and still refused: 'phase 1 retry cannot reclaim predecessor lease 01a09712 after 3 liveness re-probe(s)' â\x80\x94 with the predecessor pids verifiably dead.\n\n## Root cause hypothesis\nThe lease created for an in-process headless phase-1 records the ORCHESTRATOR'S own pid as its liveness anchor (creator pid), not the vendor child. The orchestrator is alive while retrying, so the probe reads Live forever; no reprobe/grace helps. (Split from reopened BUG-908 â\x80\x94 its original release-path fix shipped in PR-1739; this is the anchor defect. 908's reopen was phantom-shipped by the reconciler, see companion bug.)\n\n## Acceptance\n1. A lease for a headless vendor phase child anchors liveness on the CHILD pid (or records both, with the child authoritative for reclaim); alternatively the reclaim treats a lease created by this same orchestrator run as continuation and reclaims regardless of liveness.\n2. [Moved to TASK-1210, 2026-09-12: the injection rerun requires this fix MERGED and the binary rebuilt - pre-merge evidence is circular. TASK-1210 holds the rerun pass condition.]\n3. Unit test: lease with live creator pid + dead child pid is reclaimable by the same run's retry.\n\"\nrelationships[1]{rel,id,title}:\n  Related,STORY-1089,\"Review PR-1782: [AI:codex] fix(orchestrator): reclaim dead headless child leases (BUG-1111)"
