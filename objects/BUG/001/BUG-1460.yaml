  content: 'Implementation sketch (implemented on bug-1460-work): make phase 2 wait for hosted-forge check registration before accepting PrNoChecks; bind every successful terminal conclusion to the forge-reported PR head SHA; re-run phase 2 for resume/pipelined handoffs that cannot carry that proof; refuse and do not emit PhaseEntered(reviewer) when the current head differs or no head-bound conclusion exists; stamp ci_terminal_sha and ci_terminal_green into the reviewer verdict. Regression coverage asserts registration and head validation precede reviewer announcement. Targeted tests and cargo check pass.'
