- id: 01a0ddd0-8599-7920-a09f-9bbcdb6695c1
  author: joe
  content: 'PROXY DECISION (orchestrator for Joe) on the strict-review findings. Principle: no existing config may resolve to a different store than before. (1) Precedence test required. (2) Legacy unescaped-backslash configs: fall back to the raw line-scan value when the toml-parsed path doesn''t exist. (3) Empty store_path keeps the old behaviour (no walk-up). (4) Remove the alphabetical any-table TOML fallback; order is [deployment] → top-level → legacy raw line scan in file order. (5) An invalid ssh_port string is kept raw on save, with a warning. (6) Doctor diagnostic lines get toml-ok opt-outs instead of conversion. (7) Note the rule''s known gaps. Rework sent to the implementer; a round-2 strict review will follow.'
