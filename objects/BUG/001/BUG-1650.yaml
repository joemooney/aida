- id: 01a0dd6e-4e69-75d2-ad2f-ea7f373dc38f
  author: joe
  content: 'Scope added from the BUG-1649 strict review (orchestrator proxy): (a) remote_create.rs:143-164: the TOML path ignores a string ssh_port like "2222" that the old parser accepted, and the next save silently drops the port. Accept both int and string forms. The line fallback at :197 must strip single quotes too, and the stale doc comment at :134 needs updating. (b) mcp_translate.rs:168,181: quote the table name mcp_servers.<name> and the env keys (bare keys only when [A-Za-z0-9_-]+). (c) Add the three telemetry .jsonl files to the AIDA_HOME row in docs/environment-variables.md:197. (d) Move the misplaced trace comment at aida-core/src/lib.rs:144 onto pub mod toml_quote. Readers: parse with the toml crate first, then fall back to the line scan (covers multi-line and triple-quoted forms).'
