title: 'Flaky: task_1507_inconsistent_index_resets_instead_of_wedging fails under full-workspace load'
description: |
  Seen 2026-10-11 during a TASK-1538 lib-split proof: cargo test --workspace at f5bb1a3c72 failed with 1/7972 lib tests at aida-cli-lib/src/tests/task_1507_history_cache_tests.rs:2239 ('the inconsistent catch-up falls back': history_cache::serve_at returned Ok after the planted side-commit tip). The same test passed at four neighbouring SHAs and passed 5/5 in isolation (0.3-0.9s). The commit only moves session_end code and touches no history_cache code, so the failure looks timing- or load-dependent, like BUG-1643. Repro: run the full aida-cli-lib lib suite while another cargo test --workspace is running.

  ## Suspected cause (groom, 2026-10-11)
  `serve_with_budget_at` (aida-cli-lib/src/history_cache.rs) takes `IndexLock::try_acquire`; when the flock is busy it returns `Ok(None)`, skips `ensure_fresh` entirely, and answers from the stale index with `Ok`. The fixture's lock file is private to the test, so a busy lock most plausibly means a child process forked by a parallel test still holds the inherited lock descriptor between fork and exec (the class BUG-1939 hit in aida-core). That turns "the catch-up must fail" into "no catch-up ran". The same symptom (serve_at skipped the catch-up) matches BUG-1968 and BUG-1974.

  ## Acceptance
  - Root cause confirmed or refuted with evidence (for example, a test-only counter or log showing whether `try_acquire` returned `None` on the failing run).
  - History-cache tests that assert a catch-up ran (this test, the bug_1923/bug_1942 catch-up and cool-down tests, story_1650_stalled_catch_up_falls_back_without_trying_again) cannot silently pass through a contended lock: either the test fixture waits for or asserts lock acquisition, or the production path makes the skip observable to the test. The production behaviour (a contended reader falls back without blocking) is unchanged.
  - The test passes 50 consecutive runs of `cargo test -p aida-cli-lib task_1507 -- --test-threads=16` while a second `cargo test --workspace` runs in parallel.
