title: schedule install-cron appends a second line instead of repairing a legacy unmarked 'schedule tick --format json' entry
description: |-
  Found while applying BUG-1600's repair live on 2026-09-24. The installed crontab line predated the marker convention: it had no trailing '# <marker>' comment. So crontab_after_install did not recognise it and appended a correct new line. Both then ran every 15 minutes, and the old one kept failing with the unsupported-JSON error. The orchestrator removed the legacy line by hand; a backup is in the session scratchpad.

  ## Acceptance
  - install-cron (and the aida init offer) recognises a legacy unmarked AIDA tick line for THIS repo and replaces it in place rather than appending. Detection: the line runs '<aida> schedule tick' after 'cd <this repo root>', with or without --format json.
  - Never touch lines for other repos, and never touch unrelated user lines.
  - Tests cover a legacy unmarked line being repaired, a marked line being repaired, another repo's legacy line being untouched, and unrelated lines being preserved byte-for-byte.
