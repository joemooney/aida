title: 'aida init writes store_path into config.toml with format!: a Windows --store-path C:\... produces an invalid TOML file'
description: 'Found during BUG-1646: aida-cli-lib/src/init_cmd.rs (around lines 4197, 4513, 5103) writes store_path = "{}" with format!, dropping raw paths into a TOML basic string. On Windows a backslash path becomes invalid escapes, so .aida/config.toml fails to parse. Fix: serialize with the toml crate (or proper escaping); add a unit test that round-trips a path containing backslashes and quotes on every platform; audit init_cmd.rs and other production writers for the same format!-into-TOML pattern. The portability rule added in BUG-1646 only covers tests; extend it to production code where feasible.'
