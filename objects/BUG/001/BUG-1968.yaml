    [groom:night] CLOSE-DUP of BUG-1974 (in-progress, high). Same catch-up/cool-down test family with the same symptom: a serve_at that should have attempted (and failed) the injected catch-up did not. Failure count 1 instead of 2 means one of the two serve_at calls never reached catch_up_guarded. This spec's own comment already lists the bug_1942 sibling that BUG-1974 tracks. Suspected shared cause (see BUG-1964): serve_with_budget_at skips ensure_fresh when IndexLock::try_acquire is contended, which a parallel test's fork-before-exec can cause. BUG-1974's fix should make bug_1923_a_kept_chunk_clears_the_failure_count deterministic too.
