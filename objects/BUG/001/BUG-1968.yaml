  content: '[groom:night] Re-bucketed CLOSE-DUP -> CLOSE-DONE. The survivor, BUG-1974, is now completed: eb46745a0c (#2549, 2026-10-12 01:06) routes bug_1923_a_kept_chunk_clears_the_failure_count through test_support::serve_locked, so an unlocked serve no longer consumes or skips the injected catch-up failure. That was the failure-count off-by-one (1 vs 2) this bug reported. Close as completed and cite #2549.'
