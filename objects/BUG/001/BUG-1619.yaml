- id: 01a0d871-c5c5-7023-92f7-4fde19614324
  author: joe
  content: 'PROXY DECISION (orchestrator for Joe): the review approved it, but I''m folding the medium finding in before merge, because it touches the never-zero-drivers rule. (1) Before a fresh install writes anything, check is-enabled for the timer name. If systemd already knows the unit (anything but not-found), refuse without writing, so cleanup can never disable a timer loaded from another directory. If the state is Unknown, also refuse. (2) Fix the shift.rs wording for the second-file-write failure. (4) Make the shift enable hint agree with label() for disabled and stopped timers. Finding 3, the leftover .aida-tmp, is cosmetic; remove it on rename failure only if that''s trivial.'
