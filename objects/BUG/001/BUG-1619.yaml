- id: 01a0d871-7823-7a42-b34f-d06c2a0fd4d6
  author: joe
  content: 'Strict review: APPROVE — all four items fixed at 44f60824d1, no blockers. Tests (fresh worktree, target-review): task_1491 42/42, --lib schedule 151/151, shift 44/44, doctor 149/149. Revert checks: removing the cleanup disable fails 3 tests; reverting atomic_tmp_path fails second_unit_write; reverting driver_hint fails the hint test; restoring the ''unchanged'' hedge for Rewritten fails the wording test; treating a repair as fresh (none_existed -> true) fails failed_repair + wording. VERIFIED: fresh vs repair is decided only by whether both unit files were absent (schedule_driver.rs:485); a systemctl Unknown cannot flip it (prior is read only for !none_existed, :488-492); an unreadable file bails before any write (:471); a foreign file with our name refuses before any write. Cleanup order is disable --now timer (only if enable_attempted, set just before enable :507/:533), then remove_marked_files (marker-checked, :584), then daemon-reload only if something was removed; the .service is never stopped. A failed repair returns Rewritten/Unchanged and never disables or deletes. Cron is removed only after install succeeds, so a failed systemd switch never reaches zero drivers via cron. Temp files are <unit>.aida-tmp in the same dir, write then rename (atomic); unit names are per repo, so no cross-repo collision. Repaired wording is split by cause (rewrote / re-enabled / started / unreadable). driver_hint (shift.rs:2088) uses the same any_installed + unknown_reasons conditions as label(). Tests use FakeHost, tempdirs and an explicit layer path; no real crontab write, systemctl or ~/.config unit dir (cfg(test) guards). NON-BLOCKING: n1 (medium, narrow) schedule_driver.rs:533 — the fresh-install cleanup runs disable --now on the timer NAME without checking that the manager had not already loaded it from another directory. With the known N8 XDG_CONFIG_HOME mismatch, or a copy in ~/.local/share/systemd/user, a previous working systemd install of this repo looks fresh. enable/restart then act on that other unit, and if start or the verify fails (a transient bus Unknown is enough), cleanup disables the previously working timer. If that was the only driver, the repo has zero drivers while shift.rs:2066 says ''scheduler driver is unchanged''. Cheap fix: when none_existed, probe is-enabled first; if it is not not-found, skip the disable (or refuse). n2 shift.rs:2066 — when the second file write fails, nothing was enabled and no timer file was written, yet the message says ''The partly installed systemd timer was disabled and removed''. Word it by what happened (e.g. ''the unit file(s) this install wrote were removed''). n3 schedule_driver.rs:309 — if the tmp write succeeds but the rename fails, <unit>.aida-tmp is left behind; systemd ignores the suffix, so this is cosmetic. n4 shift.rs:2098 — for systemd Disabled/Stopped, the enable hint still says ''needed: a scheduler driver'' while label() says installed-but-disabled/not-running. Not in scope for this spec''s item 4 (Unknown is handled), but it is the same inconsistency.'
  created_at: 2026-09-25T12:01:50.115601262Z
