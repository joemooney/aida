title: 'Schedule driver: tidy messages and partial-install cleanup after TASK-1491'
description: |-
  Non-blocking findings from TASK-1491's strict re-review:
  (1) schedule_driver.rs: a fresh install that fails at restart/start or the post-check leaves the unit files and an enabled timer. A failed write of the second file leaves the first behind. Extend fresh-install cleanup to these steps; delete marker-carrying files only.
  (2) The Repaired message says 'was running an older invocation' even on a plain re-enable or restart. Reword it by cause.
  (3) shift.rs: 'scheduler driver is unchanged' is inaccurate when a repair rewrote the files before failing.
  (4) shift.rs: 'aida shift enable' prints 'needed: a scheduler driver' for Unknown. It should say unknown, like label().
  Acceptance: fake-host tests for each case. No real crontab or systemctl in tests.
