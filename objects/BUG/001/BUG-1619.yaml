- id: 01a0d890-4238-7490-8c06-8807ae6b24c7
  author: joe
  content: 'Strict review (final delta 7c78a73102..d4789a9bb7): APPROVE — B1 and B2 are both fixed. No blockers. Only aida-cli-lib/src/schedule_driver.rs and its test file changed; the install flow (schedule_driver.rs:504-530) differs only in passing the timer name to the classifier and in the two format strings. Tests in a throwaway worktree: task_1491 51/51, schedule 160/160, shift 45/45; cargo fmt --check clean. B1 VERIFIED: classify_fresh_probe (schedule_driver.rs:1003) checks bus/connection markers first (:1008-1019: ''Failed to connect to bus'', ''user scope bus'', ''D-Bus connection'', ''Transport endpoint is not connected'', ''Connection refused'') and returns Unknown, even when stdout says not-found. The legacy NotFound path (:1023-1033) needs empty stdout, a non-zero exit, and a stderr line starting ''Failed to get unit file state for <timer_name>:'' that also contains ENOENT. The trailing colon stops a longer name matching as a prefix. Anything else goes to classify_is_enabled, which returns Unknown for unrecognized output (fails closed). systemd 255 on this machine: is-enabled on a missing timer prints not-found on stdout, nothing on stderr, exit 4, and still classifies as NotFound. With the bus missing it prints ''Failed to connect to bus: No such file or directory'', exit 1, which now classifies as Unknown and is refused. B2 VERIFIED: both refusal strings (:513-518, :523-526) have their line continuations back; a new test asserts neither message contains a double space. Revert checks: turning off the bus check fails bug_1619_fresh_probe_real_bus_enoent_is_unknown; loosening the legacy match to l.contains(ENOENT) fails the same test; dropping one continuation fails bug_1619_fresh_install_refusals_have_no_double_spaces. The FakeHost no_bus stderr now uses the real text (tests:139). Tests use only FakeHost and tempdirs; real_systemctl_user (:116), unit_dir (:95) and write_crontab (:84) bail under cfg(test). NON-BLOCKING: nit — with the bus check reverted, no end-to-end switch_driver test fails, because the strict legacy prefix alone still sends the fake bus error to Unknown. The two layers back each other up; only the unit test pins the bus check itself. ''Connection refused'' is a broad substring, but it can only make the result fail closed.'
