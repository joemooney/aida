  content: |-
    Adjacent hazard from the same family, offered as a scope extension rather than a separate spec — your call whether it belongs here or on its own.

    Incident 2026-09-19 10:35: the product seat pushed a hand-written fix to origin/bug-1265 while a LIVE round-3 implementer session had that branch checked out in its worktree at the previous commit. Nothing was lost, but the exposure was real: had that session force-pushed on completion, the pushed fix would have been silently dropped and CI would have gone red on the same guard a fourth time. It had to be handled by warning the live session through a spec comment, which is a memory-backed mitigation of exactly the kind STORY-1351 argues against.

    Where BUG-1270 already sits: it makes the LAUNCHER refuse or fast-forward when the local branch has diverged, instead of silently forking. The push side is the mirror image of the same coordination gap — a write to a branch another live session is actively working.

    Suggested extension: a push through an AIDA verb (aida push, aida pr rebase, the drive phases) checks whether a live session's lease claims that branch, and when it does, refuses with the session id and the two safe options — wait for it, or steal the lease explicitly. Raw git is out of scope; this only covers the verbs AIDA owns.

    Acceptance if adopted: pushing to a branch claimed by a live lease refuses naming the session; the same push with no live claim proceeds unchanged; a test covers both.
