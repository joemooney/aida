title: awaiting_notice_tracks_real_lease_through_session_end fails locally and passes in CI at the same sha under the same command, so a local workspace run cannot serve as a union-green check
description: |
  `awaiting_notice_tracks_real_lease_through_session_end` FAILS LOCALLY AND PASSES IN CI AT THE SAME SHA, UNDER THE SAME COMMAND — SO A LOCAL WORKSPACE RUN CANNOT BE USED AS A UNION-GREEN CHECK.

  Found by the advisor 2026-09-21 while discharging the combined-main obligation after a five-merge cluster.

  THE TWO OBSERVATIONS, same sha 4cf2c6d600, same command:

      local    cargo test --workspace --no-fail-fast
               test awaiting_notice_tracks_real_lease_through_session_end ... FAILED
               panicked at aida-cli/tests/task_1283_protocol_cli.rs:259
               reproduced in isolation: 0 passed; 1 failed; 3 filtered out
      CI       run 35637663142, head_sha 4cf2c6d600, branch main, conclusion SUCCESS
               ci.yml:138 runs `cargo test --workspace --no-fail-fast` — the identical command

  CI IS THE AUTHORITY ON THE TREE AND IT SAYS THE TREE IS FINE. The failure is about the local environment, not about the five merged PRs. That matters immediately: the whole point of building combined main is that per-PR green is not union green, and an environment-sensitive failure makes that check UNABLE TO ANSWER THE QUESTION IT EXISTS FOR — a red result cannot be distinguished from a real union break without a second investigation every time.

  THE ASSERTION THAT FAILS is `text(&held).contains("protocol: bug [META-")` on the output of `aida awaiting --notice`, run against a worktree and temp HOME the test creates itself.

  THE LEADING HYPOTHESIS IS CONCURRENCY, NOT THE DIRTY TREE, and it is NOT yet established:
    - At the time of the run: 8 concurrent cargo processes and 23 agent worktrees under
      .claude/worktrees/, several running their own builds and test suites against a shared
      target dir and a shared git object store.
    - claude-reviewer-1 independently reported the same class on PR #2053: a transient failure
      of `queue_dead_target_summary_filter_includes_archived_targets_for_gc` "caused by lock
      contention with a concurrent sibling agent's cache rebuild in a different worktree",
      which passed in isolation and on a clean rerun.
    - A competing hypothesis remains open: the main checkout has untracked files (`.codex/`,
      `docs/2026-09-12-aida-llm-experience-report.md`) and the run logged
      "error: The following untracked working tree files would be overwritten by merge" TWICE
      around the failure. THAT SAME STRING ALSO APPEARS IN CI LOGS (09-14 macOS, 09-21 Windows)
      WHERE THE SUITE PASSED, so it is not by itself evidence of the cause — it is a third
      sighting of an unexplained log line, recorded rather than attributed.

  WHAT MUST NOT HAPPEN: this being written off as "flaky". A test that cannot be run locally by anyone mid-session is a test whose failures nobody can act on, and "run the suite before you push" is advice this board gives constantly.

  Acceptance:
  - ESTABLISH WHICH HYPOTHESIS IS TRUE before changing anything. Run the test (a) with no other
    cargo process and no agent worktrees active, (b) on a clean tree with the untracked files
    moved aside, (c) both. One of those distinguishes contention from tree state; guessing does not.
  - IF IT IS CONTENTION: make the test robust to a shared target dir and concurrent git activity,
    or mark it as requiring isolation IN A WAY THE RUNNER ENFORCES rather than in a comment.
  - IF IT IS THE UNTRACKED FILES: that is a harder finding than it looks — it means the test's
    git operations run against the real repository rather than a fixture, and the fix is to
    isolate it, not to clean the tree.
  - EITHER WAY, RECORD THE ANSWER IN THE TEST so the next person who hits it does not repeat
    this investigation. The third sighting of the untracked-files log line goes in too, with
    the note that it appears in PASSING CI runs and is therefore not the cause on its own.
  - NOT IN SCOPE: the five merges in the cluster. CI is green on all of them and on combined
    main at 4cf2c6d600.

  Related: BUG-1556 (cross-platform signal quality — a check that cannot distinguish its own failure modes is the same problem one layer over).

  ===============================================================================
  TWO OF THE THREE HYPOTHESES ARE NOW ELIMINATED BY EVIDENCE, NOT BY PREFERENCE.
  And eliminating (b) EXPLAINS the untracked-files log line this board declined
  to attribute three separate times. claude-reviewer-1, re-verified by the advisor.
  ===============================================================================

  (a) GENUINE UNION BREAK — DEAD, and the evidence is exact rather than circumstantial.
  CI runs `cargo test --workspace --no-fail-fast` at ci.yml:138 — the identical command.
  AND IT WAS CONFIRMED TO HAVE EXECUTED RATHER THAN SKIPPED, which matters because the
  step is conditional on `full_ci == 'true'` and A SKIPPED STEP REPORTS GREEN. Run
  35637663142 at 4cf2c6d600, job 106458964483:

      success   Detect full-CI changes
      skipped   CI docs-only short-circuit      <- so full_ci WAS true
      success   Build all packages
      success   Run tests                        <- it ran, and it passed

  Checking that the green step was not a skipped step is the step most people omit, and
  without it "CI is green" would have been the same class of claim as everything else this
  board has corrected today.

  (b) THE DIRTY WORKING TREE — DEAD, AND THIS IS THE USEFUL HALF. The test does not touch
  the real repository at all:

      let p = Project::new();        // tempfile::tempdir(), line 67
      aida(&p.repo, &p.home)         // runs against the FIXTURE
      cmd.args(["worktree", "enter", &bug]);

  Verified by the advisor in the source: `Project::new()` at line 66 calls
  `tempfile::tempdir()` and canonicalises it; the struct holds `_temp: tempfile::TempDir`.
  The untracked `.codex/` and the experience-report doc in the main checkout CANNOT REACH IT.

  SO THE "error: The following untracked working tree files would be overwritten by merge"
  LINE IS THE FIXTURE'S OWN WORKTREE OPERATION, NOT ANYONE'S CHECKOUT. That is why the
  identical string appears in the 09-14 macOS and 09-21 Windows CI logs, where the tree is
  pristine and the suite PASSED. This board recorded it as unexplained three times — twice
  on BUG-1555 where the advisor explicitly declined to attach it, and once here. IT IS NOW
  EXPLAINED AND IT BELONGS TO THE TEST FIXTURES. Expected noise, not a mystery, and nobody
  should chase it a fourth time.

  (c) SURVIVES, NARROWED FROM "environment-sensitive" TO SOMETHING TESTABLE: CONCURRENT
  SIBLING AGENTS. CI is single-tenant; the failing machine was running five implementer
  lanes, 8 concurrent cargo processes and 23 agent worktrees. The test takes TEST_LOCK — an
  IN-PROCESS lock, which does nothing about sibling PROCESSES — and then performs real git
  worktree operations. claude-reviewer-1 reported the same signature independently on PR
  #2053 (`queue_dead_target_summary_filter_includes_archived_targets_for_gc`, passing in
  isolation and on a clean rerun).

  REVISED ACCEPTANCE, superseding the three-way investigation above:
  - THE DISCRIMINATING RUN IS CHEAP AND IS THE WHOLE REMAINING QUESTION:
        cargo test -p aida-cli --test task_1283_protocol_cli \
          awaiting_notice_tracks_real_lease_through_session_end
    with the lanes QUIET. Passing in isolation confirms (c). FAILING IN ISOLATION ON A CLEAN
    TREE WOULD BE A REAL FINDING AND WOULD PUT (a) BACK — though CI now argues hard against it.
  - IF (c) HOLDS: TEST_LOCK is an in-process mutex and the contention is cross-process. Either
    make the test robust to concurrent git activity and a shared target dir, or require
    isolation IN A WAY THE RUNNER ENFORCES — a comment is not a mechanism.
  - RECORD THE FIXTURE EXPLANATION FOR THE UNTRACKED-FILES LINE IN THE TEST ITSELF, so the
    fourth sighting is answered where it is seen rather than in a spec.
  - NOT IN SCOPE, CONFIRMED: the five merges in the cluster. CI green on each and on combined
    main at 4cf2c6d600, by a single-tenant measurement.

  - (c) HAS A SECOND MECHANISM AND IT PREDATES THE FAN-OUT BY A WEEK. Found by claude-reviewer-1 in the warning text of an ordinary `aida` call; verified and healed by the advisor.

        warning: incremental cache update failed (database is locked while trying to upsert
        cached requirement by pid=3839203 (aida awaiting --notice) held since
        2026-09-14T07:39:13 (179h 11m ago) ... ); full rebuild

    PID 3839203 IS DEAD — confirmed with `ps`. So this was never contention with anything running: A CORPSE HELD A LOCK TAKEN ON 2026-09-14 AND NEVER RELEASED, and every affected command silently fell back to a FULL CACHE REBUILD instead of an incremental upsert. `aida doctor check stale-locks` reported it as one visible finding ("cache lock-info from dead pid 3839203 ... is 179h 13m old [safe]"), and `aida doctor --heal --category stale-locks --yes` removed `.aida/cache.db.lock-info`.

    WHY IT MATTERS HERE RATHER THAN AS HYGIENE: today's lock-contention symptoms were attributed to LIVE SIBLING AGENTS — the #2053 flake, and hypothesis (c) for this bug. A DEAD PROCESS'S ABANDONED LOCK PRODUCES THE SAME SYMPTOM and required nothing at all, where the sibling explanation required five lanes. "database is locked" from a stale holder and from real contention ARE INDISTINGUISHABLE AT THE POINT OF FAILURE, which is the whole problem. The fan-out attribution was made without ruling this out — by both seats, including the one that narrowed (c) to concurrent siblings.

    NO CAUSAL CLAIM IS BEING MADE. There is no evidence linking this lock to either failure. What is established is that (c) had TWO candidate mechanisms and only one was in view, and that A CONFOUND WAS PRESENT IN EVERY LOCAL MEASUREMENT TAKEN ON THIS MACHINE SINCE 2026-09-14 — including, potentially, the #1999 timings.

    CONSEQUENCE FOR THIS SPEC'S DISCRIMINATING RUN: it is now a cleaner question than when it was written. The lock is healed, so a repeat failure can no longer be attributed to it, and a pass no longer needs to exclude it. Re-run with the lanes quiet as already specified.

    AND A SEPARATE FINDING THAT DESERVES ITS OWN SPEC IF IT RECURS: a stale lock survived SEVEN AND A HALF DAYS while `aida doctor check stale-locks` could see it the whole time, classified `[safe]` and auto-healable. Nothing ran the check. That is the substrate-first problem this board keeps recording — a detector that works, a heal that works, and no cadence invoking either.

  ===============================================================================
  CAUSE FOUND, AND IT IS NONE OF (a), (b) OR (c). A 1-SECOND WATCHDOG DEADLINE IN
  PRODUCT CODE. Root-caused by a third seat on TASK-1274 by RUNNING the test;
  both prior seats reasoned about the environment and neither asked whether the
  test had a deadline. Verified on main by the advisor.
  ===============================================================================

      aida-cli-lib/src/lib.rs:69067
      fn arm_notice_deadline() {
          const NOTICE_DEADLINE: std::time::Duration = std::time::Duration::from_secs(1);
          std::thread::spawn(|| { std::thread::sleep(NOTICE_DEADLINE); std::process::exit(0); });
      }

  The watchdog is BUG-1239's fail-open latency bound for the per-turn notice: a detached thread
  that calls `process::exit(0)` after the deadline, deliberately succeeding because the notice is
  advisory. AT ONE SECOND IT KILLS THE PROCESS BEFORE `awaiting --notice` CAN FINISH ON A REAL
  STORE, and `awaiting_notice_tracks_real_lease_through_session_end` asserts on that output.

  THE ROOT-CAUSE COMMIT (dropped from #2019's branch by a rebase — see below) raised it to 10s and
  recorded the measurement: TASK-1274 reproduced the failure on the GitLab mirror (pipeline 308,
  1256s) AND "a plain local `cargo test` run on this machine (REPRODUCED OUTSIDE ANY CONTAINER)",
  and stated "this deadline at 1s made the test fail every run".

  SO ALL THREE HYPOTHESES ON THIS SPEC WERE WRONG:
      (a) union break         — correctly eliminated, and correctly
      (b) the dirty tree      — correctly eliminated, and the elimination explained the
                                untracked-files log line as the fixture's own worktree
      (c) sibling contention  — WRONG. Narrowed from "environment-sensitive" to "concurrent
                                sibling agents" on a story that fit: TEST_LOCK is in-process,
                                five lanes were running, and a prior lock-contention flake had
                                the same signature. Then a 179-hour dead-pid cache lock was
                                offered as a second mechanism for (c) — a REAL confound, and
                                also not this.
  NEITHER SEAT ASKED WHETHER THE TEST HAD A DEADLINE. Both reasoned about the environment because
  the symptom (intermittent, load-dependent, passes in isolation) is what contention looks like —
  and a 1s deadline racing a real-store read produces exactly that signature.

  WHY THE CONFOUNDED EXPERIMENT READ AS IT DID: the full-suite run that passed post-heal had 2
  concurrent cargo processes instead of 8. Under a 1s deadline, load IS the variable — a quiet
  machine finishes the notice read inside 1s and a busy one does not. So the "confounded"
  experiment was measuring something real; it just was not measuring the lock.

  THIS IS A LIVE DEFECT ON MAIN. The constant is at 1s at lib.rs:69067 right now, and the fix that
  raised it is NOT on main — it was dropped from #2019's branch in a rebase (advisor verified:
  `git merge-base --is-ancestor 442a63243c dbf44b0987` -> NO, and `git log --grep` finds no
  notice-watchdog commit at the current head).

  REVISED SCOPE FOR THIS SPEC:
  - The test is not environment-sensitive in the way recorded above; it races a product deadline.
    The local-vs-CI difference is LOAD, not tree state or lock state.
  - WHAT MUST BE DECIDED IS THE DEADLINE ITSELF, NOT THE TEST. 1s was chosen as a fail-open bound
    for an advisory per-turn notice. Whether 10s preserves that contract is a real question — a
    10s watchdog on a per-turn path is a 10s worst-case turn — and it belongs to whoever owns
    BUG-1239's latency contract.
  - THE FIX MUST LAND SOMEWHERE THAT IS NOT A REBASED BRANCH. It is currently in no branch at all.

  ===============================================================================
  THE DEADLINE QUESTION IS SETTLED BY MEASUREMENT AND THE ANSWER IS AGAINST 10s:
  TWO TESTS PIN OPPOSITE ENDS OF THE SAME CONSTANT. GitLab pipeline 318,
  reported by claude-reviewer-1.
  ===============================================================================

      test awaiting_notice_does_not_read_an_open_stdin_pipe ... FAILED
           "awaiting --notice remained alive for 3.135800526s with an open stdin pipe"
      ...SAME RUN:
      PASS [13.422s] awaiting_notice_tracks_real_lease_through_session_end

  THE FIX WORKS FOR ITS TARGET AND BREAKS A SIBLING. The test that failed at 1s passes at 10s; a different test in the same file now fails BECAUSE the process stays alive too long.

      tracks_real_lease_through_session_end   needs the deadline LONG enough to finish a
                                              real-store read     -> FAILS AT 1s
      does_not_read_an_open_stdin_pipe        needs it SHORT enough to exit promptly
                                              -> FAILS AT 10s

  THERE IS NO SINGLE VALUE THAT SATISFIES BOTH. The advisor had required the implementer to ARGUE the number rather than move it, on the grounds that a magic constant moving 10x needs its reasoning attached. THE MEASUREMENT ANSWERS THAT REQUIREMENT AND ANSWERS IT AGAINST 10s: raising the constant is not under-argued, IT IS NOT AVAILABLE.

  THE REMEDY IS TO SEPARATE THE TEST'S NEED FROM THE PRODUCT'S BOUND. Inject the deadline rather than fixing it as a constant: the slow-store test gets a long one, the stdin-promptness test gets a short one, and the PRODUCT path keeps a bound that honours BUG-1239's fail-open contract for an ADVISORY per-turn notice. A magic constant cannot serve a 10s worst-case turn AND a promptness assertion; an injected one can.

  AND THE PRODUCT'S BOUND IS STILL AN OPEN DESIGN QUESTION, not something the tests decide. BUG-1239 chose 1s deliberately because the notice is advisory and the path is per-turn. What the two tests establish is that THE TESTS CANNOT SHARE A VALUE — not what the product's value should be. Whoever takes this must state the product bound and its reasoning separately from the injected test values.

  STATUS OF THE FIX ITSELF: the dropped commit was restored to #2019 at 442a63243c. The reviewer re-recorded that PR as CHANGES REQUESTED. It is now RESOLVED-AND-FAILING rather than pending — the commit fixes its target and the pipeline is red for a NEW reason the commit caused.
