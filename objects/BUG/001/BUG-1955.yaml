- id: 01a1313a-ea90-7832-b2d6-a34371480729
  author: joe
  content: |-
    **Advisor rework brief — round 1/3 — PR #2560 (BUG-1955), REQUEST CHANGES at dbebacaa64**

    The independent reviewer found the patch to be sound hygiene, and CI is green. But the stated root cause doesn't match the evidence, and merging with the `(BUG-1955)` trailer would auto-complete a spec whose acceptance is unmet.

    **Must fix**
    1. **Root cause is unproven** (HIGH). The only two git shims in the lib pass straight through to the real git: `status_prs.rs:3588-3620` runs `exec "{real_git}"`, and `handle_pull_command_tests.rs:675-709` runs `exec /usr/bin/git`. Going through one can't produce git's own "unable to create temporary file / failed to write commit object". That message means the repo's `.git/objects` was missing or not writable *under the real git*. The `/tmp/.tmpwstHPt/bin/git` strace line matches no git shim in the tree (those `bin/` dirs hold gh, glab, claude and tmux), so it is most likely execvp probing PATH and getting ENOENT.
       - Investigate the real candidate: the fixture's own `TempDir`/repo being removed or swapped while a commit runs. Look at drop order, any background refresh worker or child still writing, a shared/reused path, and `HOME`/`TMPDIR` changes by sibling tests.
       - **Done when:** you either name the mechanism with a reproduction, or state plainly "defensive hardening; root cause unconfirmed" in the commit/PR, with what you ruled out.
    2. **Windows regression** (MEDIUM) at ~L226-228. `dir.join("git")` never matches `git.exe`. Use `format!("git{}", std::env::consts::EXE_SUFFIX)`, and fall back to `PathBuf::from("git")`, not `/usr/bin/git`.
    3. **Spec honesty** (MEDIUM). If the root cause stays unconfirmed, `aida comment add BUG-1955` with exactly which acceptance items are met and which aren't, linked to BUG-1994. The advisor will then decide whether this merges as a partial fix, with BUG-1955 re-opened/re-scoped after merge.

    **Should fix**
    4. Document the `TMPDIR` assumption in `real_git()`: entries under `temp_dir()` are skipped, so a `TMPDIR` of `/` or `$HOME` would skip real entries. A comment or `debug_assert!` is enough.
    5. Route `is_anc` (~L2232) and `sweep::fast_import` (~L3362) through `fixture_git()` so they get the hermetic environment too.

    Narrow tests plus `make check-ci-fast` must PASS before pushing (don't chain the push). Push to the same branch.
