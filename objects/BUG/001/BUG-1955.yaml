- id: 01a13161-db08-7030-9a8b-b4fd475c0dd7
  author: joe
  content: |-
    **Advisor verdict — APPROVE at 843c6e43e4 (round 2) — READY-FOR-OPERATOR**

    An independent re-review found all round-1 items resolved, and Build is green at this SHA. The change is test-only defensive hardening and cannot make the fixture less reliable than bare `git`. The advisor dispatched this implementer, so under ADR-73 cond. 1 the advisor will not merge it.

    **Merge with an explicit body.** The repo squash default is COMMIT_MESSAGES, which would put commit dbebacaa64's retracted root-cause claim onto main:
    ```
    gh pr merge 2560 --squash --match-head-commit 843c6e43e44571242b72e1ccad9f8d6540b32790 \
      --subject "[AI:claude] fix(tests): pin history-cache fixture git against PATH-shim leakage (BUG-1955) (#2560)" \
      --body "Defensive hardening; the CI root cause is unconfirmed (see PR body and the BUG-1955 comment). Remaining PATH-leak flakes are tracked in BUG-1994.

    Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
    ```
    **After merge:** the `(BUG-1955)` trailer will auto-complete BUG-1955, but its acceptance is only partly met (a: not met, b: partial, c: not shown). Re-open it, or re-scope it to hardening and leave the rest to BUG-1994.

    Non-blocking: F2, a comment at ~L209-211 overstates the exit-127 path. F3, the PATH filter decides by location, not by what the file is (not a regression).
