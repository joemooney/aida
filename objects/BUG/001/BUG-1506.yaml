  author: joe
  content: |-
    [aida:advisor] LIVE INSTANCE RESOLVED, AND THE RECOVERY PATH HAS ITS OWN DEFECT. 2026-09-20 21:18.

    THE INSTANCE. PR #2045 merged as 9c8373f5d6 carrying the (STORY-1391) trailer. STORY-1391 stayed at In Progress: it never passed through Done, so the auto-bump - which promotes done to completed - had nothing to promote. That is this spec's exact case, occurring on the verdict-retention spec itself, within minutes of its own merge.

    RESOLVED with aida db reconcile-status. The spec now reads Completed. No open PR referenced it, so BUG-1454's defer-while-a-PR-is-open guard correctly permitted the flip.

    CORRECTED 2026-09-20 21:22 - MY DEFAULT-RANGE DIAGNOSIS WAS WRONG AND IS WITHDRAWN.

    I originally wrote that the default scan range missed a commit at HEAD. The code rules that out: with no --since the verb runs `git log --max-count=200 HEAD`, which STARTS at HEAD. A commit at HEAD cannot be outside it. The reviewer seat quoted the construction and verified 9c8373f5d6 is one match in that range with zero commits after it.

    WHAT ACTUALLY HAPPENED, from the reflog rather than from inference:

        main@{21:15:04}  pull -q --ff-only origin main: Fast-forward -> 9c8373f5d6

    Local main did not contain the merge until 21:15:04. The first reconcile ran against a local main that genuinely did not have the commit, so the verb was correct-but-blind: it reported nothing in range about a commit it could not see. The second run, with --since HEAD~5, came after that fast-forward - so what changed between the two was the LOCAL REF, not the range. Widening --since appeared to be the fix and was coincidental.

    THE REQUIRED ADDITION IS THEREFORE THREE-STATE, NOT TWO, and the third is the one that actually fired:

        nothing eligible                 no spec in scan range is at a graduatable status
        nothing in range                 the scan window excluded the commit
        NOTHING IN THE LOCAL CLONE       the commit is not in this checkout at all

    A two-state message would have said "nothing in range" and sent the caller to widen --since - exactly the wrong move when the commit is not local. The verb must also NAME THE REF IT SCANNED, which its output currently does not: "scanned local main at <sha>; if the commit you expect is not there, pull first."

    THE UNDERLYING SHAPE is the same as the rest of this class: the surface reports a true fact about what it LOOKED AT, the reader infers a fact about the WORLD, and nothing in the output distinguishes them. It is PRIN-5 inside a verb whose entire purpose is catching what another surface missed - and the verb's dependence on local state is invisible.
