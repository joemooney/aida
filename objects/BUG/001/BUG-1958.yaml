title: 'show linkage follow-ups from STORY-1649 review: aida done skips the warning, double scan, missing --, docs'
description: |
  Minor findings from the night review of PR #2501 (STORY-1649, merged 5ca72fd2b9):
  1. punt_done.rs:284 handle_done_command: `aida done` marks a spec Completed through transition_to_completed, but it never calls shipped_linkage::warn_if_completed_without_shipped_commit. Add the call and a binary test. Also check MCP status edits.
  2. shipped_linkage.rs:234-247: an unshipped spec pays for two full scans (origin/main and main, each a git log plus a git grep; about 270ms on this repo), which is the common case for TOON show. Skip the local ref when it is an ancestor of the remote, or when the two resolve to the same SHA.
  3. shipped_linkage.rs:152, 188-193: there is no '--' after the ref, so a path named like the branch makes git log/grep ambiguous, and the swallowed error gives a false result. Append '--'.
  4. shipped_linkage.rs:289: the token 'detail=--format json' contains a space and breaks the promise that the line splits on whitespace. Use 'detail=--format=json'.
  5. docs/cli/01-getting-started.md (aida show, edit, done) doesn't mention the TOON linkage: line or the completion warning and its doctor:no-code opt-out.
  6. In a shallow clone, completing an old shipped spec warns falsely. Add '(shallow clone)' to the warning when git rev-parse --is-shallow-repository is true.
  7. shipped_linkage.rs:204: the trace-hit parser splits on the first ':', so a path containing ':' is miscounted. Cosmetic.

  ## Acceptance

  (groom:night, 2026-10-11: all seven items verified still open on origin/main 17ff749954.)

  1. `aida done` (handle_done_command) calls `shipped_linkage::warn_if_completed_without_shipped_commit` after a successful completion; a binary test shows the warning for a spec with no shipped commit and none with `doctor:no-code`. If the MCP status-edit path completes specs without the warning, add the call there too (or note in the PR why not).
  2. `scan_default_branch_linkage` skips the local ref when it resolves to the same SHA as the remote ref or is an ancestor of it; unit test asserts one scanned ref in that case.
  3. `referencing_commits_on_ref` and `trace_files_on_ref` pass `--` after the ref; test with a file named like the branch.
  4. The TOON token is `detail=--format=json` (no space); existing linkage-line tests updated.
  5. docs/cli/01-getting-started.md (show / edit / done sections) documents the `linkage:` line and the completion warning with its `doctor:no-code` opt-out.
  6. The completion warning appends "(shallow clone)" when `git rev-parse --is-shallow-repository` is true; unit test on the formatter.
  7. The trace-hit parser handles paths containing ':' (e.g. split on `<ref>:<path>:` using `git grep --null` / `-z`); unit test with a ':' path.
