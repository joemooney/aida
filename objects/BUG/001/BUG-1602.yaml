title: 'rel remove: parent/child removal leaves the reverse edge that rel add wrote, and the CLI type parser rejects spellings core/MCP accept'
description: |-
  Found by the TASK-1426 review. (1) `rel add --type parent|child` always writes the reciprocal edge, but `rel remove --type child` without -b leaves the reverse Parent edge behind. Remove should mirror add, removing both sides for the parent/child pair. (2) `cli_relationship_type` does not accept spellings that the core and MCP parsers map to built-in types (verified_by, depends-on, replaced-by), so a typed remove with those finds nothing. Use one shared parser for rel add, rel remove and MCP. (3) The rel remove handler itself (edge filtering and --bidirectional) has no test; only rel_remove_matches does.

  ## Acceptance
  - rel remove --type parent|child removes both reciprocal edges, matching rel add.
  - CLI, core and MCP use one relationship-type parser; spellings accepted by core resolve identically in rel remove.
  - Handler-level tests cover typed removal, --bidirectional and the parent/child pair.
