title: 'docs/cli/12-glossary.md is a generated page but was never regenerated after STORY-1023: NeedsAttention and role definitions contradict ''aida docs glossary'', and no gate catches the drift'
description: |
  Problem: docs/cli/12-glossary.md is a generated page ("GENERATED FILE — do not edit by hand. Source: `aida docs glossary`", regenerated by `make book-glossary`, never hand-maintained per ADR-5), but the committed copy no longer matches what the binary emits, and its definitions contradict the discipline copy.

  Evidence path:
  - docs/cli/12-glossary.md:194-199 defines NeedsAttention as a split into Shelved (FailureReason: stale base, CI red, reviewer tool exit, merge/pull failure) and Needs Decision (AttentionReason). `.aida/discipline/machinery-glossary.md:211-223` says a spec moves to NeedsAttention "when a phase failure isn't shelvable", which is the post-STORY-1023 wording.
  - docs/cli/12-glossary.md:156 defines role as the closed set implementer / reviewer / advisor; machinery-glossary.md:164 says "such as advisor, implementer, reviewer, integrator, or product".
  - `aida docs glossary --machinery` on main is byte-identical to `.aida/discipline/machinery-glossary.md` (trailing newline aside), so the committed book page is the stale side: `make book-glossary` was not re-run after STORY-1023 / TASK-1260 changed the template.
  - Nothing in CI compares the committed page with the generator's output, so the "can never drift" promise in the page header is not enforced.

  Acceptance:
  - `make book-glossary` is re-run and the regenerated page is committed, so 12-glossary.md matches `aida docs glossary` output.
  - The two NeedsAttention definitions are reconciled in the template master (aida-core/templates/docs/aida/discipline/machinery-glossary.md); which wording is correct post-STORY-1023 needs an owner's call and should be stated in a comment on this bug.
  - A CI gate (full tier is fine; it needs the binary) fails when docs/cli/12-glossary.md differs from `aida docs glossary` output, the same way check-templates guards the generated mirrors.

  Found by the night-fable review sweep. Size S for the regeneration, M if the gate is added.
