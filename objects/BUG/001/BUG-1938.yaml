- id: 01a12b3f-389e-7843-bfea-a56c59cab266
  author: joe
  content: 'FACTORY PLAN (night): New module aida-cli-lib/src/config_commit.rs: snapshot whether .aida/config.toml is tracked+clean before a setup command edits it; afterwards commit ONLY that file (new aida_core::git_ops::commit_paths, git commit -- <path>, same identity redaction as commit) when it was clean and mode allows (non-TTY auto, TTY prompt default-Y), otherwise print ''config changed: .aida/config.toml — commit it with: git add ... && git commit ...''. A pre-dirty config is never auto-committed; a failed commit degrades to the hint. remote_create.rs: handle_remote_mirror delegates to run_remote_mirror(mode) which settles the change with subject ''[AI:aida] chore(remote): list <name> as a store mirror'' and ends with a Next steps block (aida remote mirror-sync, aida remote status). init: commit_init_scaffolding marks a process flag on success; lib_part1 init dispatch snapshots config state before finish_remote/record_and_report and calls config_commit::finish_init_refresh, which commits the provider/capabilities refresh only if the scaffold commit was made this run (clone bootstrap / declined prompt -> hint only, preserving BUG-570). Tests: remote_create::handle_remote_mirror_reports_config_change, handle_remote_mirror_commits_config_change_when_clean, handle_remote_mirror_never_commits_a_dirty_config; config_commit unit tests (auto commits only config leaving other staged work, previously dirty never committed, never mode, cleanliness detection, not-a-checkout). Docs: docs/cli/04-git-lifecycle.md mirror paragraph. Risk: compiled only on CI; init --github end-to-end needs gh so covered by unit tests of the shared helper.'
