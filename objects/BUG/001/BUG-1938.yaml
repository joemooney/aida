title: aida remote mirror / init leave .aida/config.toml changes uncommitted and unmentioned
description: |
  Observed 2026-10-10 creating aida-host. `aida remote mirror gitlab --url ...` (with `aida init --github` before it) changed .aida/config.toml (mirror_remotes, provider, class, ci) but did not commit the change or mention it, so the file sat dirty until noticed. The mirror is also skipped on the first push ("not confirmed on origin"); that is expected, but the setup flow should still end with every hub in sync.

  Want: a command that changes committed config either commits it (as an [AI:tool] chore commit) or prints a clear "config changed; commit it" line. The init/mirror flow finishes with `aida remote mirror-sync` and `aida remote status`. Related: STORY-1656.
