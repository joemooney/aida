  content: |-
    FACTORY PLAN (antigravity):

    Approach:
    1. In aida-cli-lib/src/history_cache.rs:
       • Add tip_live_elsewhere: bool to HistoryCacheStatus.
       • In status_at, when tip != head and !st.head_behind_tip, evaluate st.tip_live_elsewhere = tip_is_live_elsewhere(store, tip, head).
       • In classify_miss, if st.head_behind_tip || st.tip_live_elsewhere, return IndexMiss::CheckoutBehind.
    2. In aida-cli-lib/src/cache_cmd.rs (history_status_lines):
       • Branch on st.head_behind_tip || st.tip_live_elsewhere to report:
         "History status:   BEHIND — another checkout moved the shared index on".
    3. In aida-cli-lib/src/doctor_cmd.rs (history_index_doctor_line):
       • Branch on st.head_behind_tip || st.tip_live_elsewhere to report:
         "history index behind the store{by}{running} — another checkout moved the shared index on.".
    4. Tests:
       • Unit tests for history_status_lines and history_index_doctor_line when head_behind_tip or tip_live_elsewhere is true: verify neither mentions "catches up" nor recommends "rebuild".
       • Unit tests for classify_miss and status_at: verify a diverged HEAD with tip live elsewhere classifies as CheckoutBehind (with no-rebuild note), while a diverged HEAD without tip live elsewhere classifies as Stuck.

    Acceptance Mapping:
    - With HEAD an ancestor of the index tip, cache status and doctor lines neither say index will catch up nor suggest rebuild -> verified by formatter unit tests.
    - Diverged HEAD with tip live in another checkout gets no-rebuild miss (CheckoutBehind) and note; diverged HEAD without tip live elsewhere stays Stuck -> verified by classify_miss / status_at tests.
