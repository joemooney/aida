  summary: 'THREE SMALL CHANGES, ALL SOUND, AND THE SECOND IS BETTER THAN ITS SUMMARY LINE SUGGESTS. (1) A blank-or-whitespace subject is now treated as absent in the expanded CLI row, via .filter(|s| !s.trim().is_empty()). (2) The reply-target resolution switched from map_err(|error| format!(...)) to with_context(...) - THIS IS THE ONE THAT MATTERS: map_err with a format! FLATTENS a typed error into a string and destroys the not-found/ambiguous distinction; with_context preserves the source. The summary calls this "preserve typed reply-target resolution failures", which undersells it - it is the difference between a caller being able to branch on which failure occurred and a caller having only prose. (3) The ambiguous-prefix message now says "lengthen the prefix to select one of:" rather than just listing candidates - actionable rather than descriptive. THE TESTS PIN THE RIGHT THINGS. blank_subject_uses_body_in_expanded_mailbox_row covers BOTH blank forms - Some("") and Some(" \t") - so a fix that only checked is_empty() without trimming would fail it. And reply_target_ambiguity_and_not_found_remain_distinct_typed_outcomes pins exactly what change (2) preserves: without it, a future revert to map_err would silently re-flatten the two kinds and nothing would notice, which is how the distinction was lost in the first place.'
