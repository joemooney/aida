  content: 'Implementation audit: the core subject_line projection is compact/truncated and returns only a title, while print_mailbox_line is an expanded row that retains the full body beneath an explicit subject. They should not become one formatter because that would change the CLI row contract. Extracted mailbox_line_body instead so the expanded renderer shares the core projection''s nonblank-subject rule without conflating the two output shapes. BUG-1297''s typed MailboxResolveFailure was already present; the send path now preserves it through anyhow context and the ambiguous variant provides lengthen-the-prefix guidance.'
