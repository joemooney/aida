id: 01a0bb7d-e389-7e33-96a0-036917d17b9d
spec_id: BUG-1288
agreed_id: BUG-1288
title: aida awaiting --json takes 70-77 seconds and aida status --full takes 89, while their human forms take under a second — the machine-readable path is unpollable
description: |
  The machine-readable coordination surfaces are too slow to poll, while their human counterparts are fast. This is the read path a dashboard, a statusline or another agent actually calls.

  MEASURED 2026-09-19 in this repo, warm, drain active:

    aida ps                    0.38 s
    aida list                  0.44 s   (0.44 warm; a cold first call measured 7.66 s)
    aida status                0.66 s
    aida awaiting --notice     0.93 s
    aida awaiting --json      70.2 / 71.9 / 77.5 s   (three consecutive runs)
    aida status --full        88.6 s

  So the two surfaces wired into interactive paths are fine — STORY-707 already moved the heavy diagnostics out of bare `aida status`, and the `--notice` form the UserPromptSubmit hook injects is under a second. The problem is confined to the full machine-readable forms, which are precisely what an external consumer must use.

  CAUSE TO CONFIRM, not assumed: the reported cause is that the unshipped-work scan iterates every ref running `git cherry origin/main <branch>`, and this repo has 301 stale remote branches and 38 worktrees. That is consistent with the shape of the number and with `UnshippedWorkDetected` being the second most common event kind in the feed, but it should be profiled rather than taken on faith before the fix is written.

  WHY IT MATTERS BEYOND THE DASHBOARD. A 70-second read makes polling impossible, so consumers either skip the surface or set aggressive timeouts and silently get partial data. It also means anything that calls `awaiting --json` inside a phase budget can burn more than a minute of that budget on a status read.

  ACCEPTANCE
  1. The cause is profiled and recorded on this spec before the fix — which calls dominate, and how the cost scales with branch count.
  2. `aida awaiting --json` completes in under 3 seconds on this repo in its current state (301 stale remote branches, 38 worktrees), with no reduction in what it reports.
  3. The unshipped-work scan is bounded to branches that belong to an active lease or session rather than every ref, or is cached with an explicit freshness bound; whichever is chosen, the choice is stated on the spec.
  4. `aida status --full` is brought under a stated bound or its slow sections are moved behind an explicit flag, so no default-shaped invocation takes 88 seconds.
  5. A regression test or benchmark pins the bound so it cannot silently drift back.
  6. Correctness is unchanged: a branch with genuinely unshipped work is still reported.

  Reported by the aida-monitor project, which measured 10-25 s; independently measured here at 70-77 s, so the reported figure was optimistic rather than exaggerated.

  ===============================================================================
  THIS SPEC IS **NOT** SATISFIED BY PR #1999, AND THE REMAINING WORK IS HARDER
  THAN WHEN THE SPEC WAS WRITTEN. Ruled 2026-09-21 by the advisor on a review
  call from claude-reviewer-1, who was asked for it explicitly.
  ===============================================================================

  #1999 FIXED A CORRECTNESS DEFECT AND THE HEADLINE CRITERION IS UNTOUCHED. The
  command moved from FAST AND WRONG to SLOW AND RIGHT:

      unfixed   awaiting --json  7.6 / 4.4 / 5.2 s     status --full  22.2 s
      fixed     awaiting --json  27.0 / 26.8 / 25.1 s  status --full  36.9 s
      (1295 local / 357 remote branches; binary sha verified against HEAD before each run)

  THE 5s BASELINE WAS NOT A BASELINE. `collect_unshipped_work_items` gated on an
  ALLOW-LIST of `inprogress | in-progress | done`, so it probed ~12 of 193
  eligible candidates. FIVE SECONDS WAS THE COST OF NOT DOING 94% OF THE WORK.
  There is no correct-and-fast predecessor to regress from: 26s IS THE FIRST
  MEASUREMENT OF THE CORRECT COMPUTATION, and 134 Approved-status specs' branches
  were entirely unscanned before.

  SO 5s -> 26s MUST NOT BE RECORDED AS A REGRESSION. It is the correct
  computation being measured for the first time.

  AND IT MUST NOT BE RECORDED AS SATISFYING THIS SPEC EITHER. The subject here is
  "the machine-readable path is unpollable". 26s is not pollable; neither was 5s.
  THE HEADLINE CRITERION IS UNMET AND THE TRAILER AT MERGE MUST NOT CLOSE IT —
  `auto_bump_eligible_status` accepts five states including NeedsAttention, so a
  `(BUG-1288)` trailer would complete a spec whose central criterion is open. See
  BUG-1551; this is the case it bites.

  THE MEASUREMENT THAT TELLS THE NEXT PERSON WHERE TO START, and it is the most
  useful thing in the review: A ~16x WIDENING OF THE CANDIDATE SET COST ~5x WALL
  CLOCK. THAT IS SUB-LINEAR. A linear result would have been ~80s. So FIXED
  OVERHEAD DOMINATES and the performance win is in the PROBE'S SETUP, not in
  trimming candidates. Anyone who opens this expecting to win by filtering the
  candidate set will be optimising the term that is not the problem.

  WHAT ALSO SURVIVES AND SHOULD NOT BE RE-DERIVED:
  - THE PER-TURN NOTICE PATH IS NOT AFFECTED, verified in review: lib.rs:68554
    gates the notice behind `notice_fast` and SKIPS collect_unshipped_work_items
    entirely, with the latency contract stated in-code. A 5x slowdown on every
    prompt in every session would have been a real regression that NO PR-LEVEL
    TIMING WOULD HAVE SURFACED. The cost lands on `--json` and `status --full`
    only.
  - THE WIDENING IS PRINCIPLED, VERIFIED LITERALLY RATHER THAN ACCEPTED: the gate
    now filters on `completed | rejected | superseded` and the downstream terminal
    check on the resolved spec_id filters on `completed | rejected | superseded`.
    BYTE-IDENTICAL. Nothing is dropped at the gate for a reason that would not
    also drop it downstream.

  REVISED ACCEPTANCE for what remains:
  - THE CORRECT COMPUTATION must become pollable — the sub-3s target applies to
    the 193-candidate set, not to the 12-candidate approximation.
  - START AT THE PROBE'S SETUP, not at candidate trimming. The sub-linear scaling
    above is the evidence; re-measure it rather than trusting it if the tree has
    moved.
  - ANY FUTURE NARROWING OF THE CANDIDATE SET MUST STATE WHAT IT MAKES INVISIBLE.
    Narrowing is what caused this defect, and a narrowing justified by latency is
    exactly how it recurs.
