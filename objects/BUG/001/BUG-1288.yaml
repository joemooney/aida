title: aida awaiting --json takes 70-77 seconds and aida status --full takes 89, while their human forms take under a second — the machine-readable path is unpollable
description: |
  The machine-readable coordination surfaces are too slow to poll, while their human counterparts are fast. This is the read path a dashboard, a statusline or another agent actually calls.

  MEASURED 2026-09-19 in this repo, warm, drain active:

    aida ps                    0.38 s
    aida list                  0.44 s   (0.44 warm; a cold first call measured 7.66 s)
    aida status                0.66 s
    aida awaiting --notice     0.93 s
    aida awaiting --json      70.2 / 71.9 / 77.5 s   (three consecutive runs)
    aida status --full        88.6 s

  So the two surfaces wired into interactive paths are fine — STORY-707 already moved the heavy diagnostics out of bare `aida status`, and the `--notice` form the UserPromptSubmit hook injects is under a second. The problem is confined to the full machine-readable forms, which are precisely what an external consumer must use.

  CAUSE TO CONFIRM, not assumed: the reported cause is that the unshipped-work scan iterates every ref running `git cherry origin/main <branch>`, and this repo has 301 stale remote branches and 38 worktrees. That is consistent with the shape of the number and with `UnshippedWorkDetected` being the second most common event kind in the feed, but it should be profiled rather than taken on faith before the fix is written.

  WHY IT MATTERS BEYOND THE DASHBOARD. A 70-second read makes polling impossible, so consumers either skip the surface or set aggressive timeouts and silently get partial data. It also means anything that calls `awaiting --json` inside a phase budget can burn more than a minute of that budget on a status read.

  ACCEPTANCE
  1. The cause is profiled and recorded on this spec before the fix — which calls dominate, and how the cost scales with branch count.
  2. `aida awaiting --json` completes in under 3 seconds on this repo in its current state (301 stale remote branches, 38 worktrees), with no reduction in what it reports.
  3. The unshipped-work scan is bounded to branches that belong to an active lease or session rather than every ref, or is cached with an explicit freshness bound; whichever is chosen, the choice is stated on the spec.
  4. `aida status --full` is brought under a stated bound or its slow sections are moved behind an explicit flag, so no default-shaped invocation takes 88 seconds.
  5. A regression test or benchmark pins the bound so it cannot silently drift back.
  6. Correctness is unchanged: a branch with genuinely unshipped work is still reported.

  Reported by the aida-monitor project, which measured 10-25 s; independently measured here at 70-77 s, so the reported figure was optimistic rather than exaggerated.
