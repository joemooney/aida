title: Wall-clock ceilings in bug_1956 and bug_1594 show-bounded tests are load-sensitive (convert to budget + hard ceiling like BUG-1967)
description: |-
  Noted by the BUG-1967 implementer (PR #2562). aida-cli/tests/bug_1956_reader_fallbacks_bounded_under_writer.rs (bare 5 s ceiling) and aida-cli/tests/bug_1594_show_bounded.rs use plain elapsed-time asserts. These are load-sensitive, as BUG-1967 showed: on an oversubscribed host, CPU starvation is reported as a product failure.

  ## Acceptance
  - Each converts to the BUG-1967 pattern: the soft budget logs BUDGET-MISSED with loadavg; locks are held for the whole call; retry delays are stretched so a regression trips a hard ceiling (~60 s).
  - A mutation check shows each still catches the regression it guards.
