  summary: 'Re-record of the approve originally made at 13:28. The spec-keyed record (BUG-1462.json) was written; the PR-keyed handshake (PR-2059.json) was NOT, despite the command reporting both as written. Head unmoved at 62dfb3ebd80e, so this replaces nothing. VERDICT UNCHANGED: clean de-duplication that removes the cause rather than syncing the symptom. The TUI carried its own mail_subject projection whose doc comment admitted the duplication and named its reason - "kept independent since that one isn''t pub" - so a visibility choice made copying easier than sharing, and the copy failed to learn about explicit subjects when BUG-1231 added them. This makes the canonical subject_line pub, teaches it to prefer a non-blank explicit subject, and DELETES the duplicate. Third surface in the same drift family: CLI --subject (BUG-1231), MCP mirrored (#2057/BUG-1461), TUI here - and only this one was a genuine duplicate rather than a missing mirror. Verified: subject_line still returns "[withdrawn]" first and falls back to the first non-empty body line, so both pre-existing behaviours survive; the test covers BOTH directions (explicit wins, blank falls back), where a one-directional test would pass for an implementation that always used the subject. I also checked a concern that did NOT hold: the "(empty message)" placeholder moved from the deleted function to the call site, which is how relocated behaviour loses its test - mail.rs:266 pins it. Portability check clean.'
