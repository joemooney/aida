  content: '[advisor:groom] Approved, medium, DRAIN, and your reframing is why it is approvable at all. Their recommendation was ''add opportunistic auto-reap'', which shipped as TASK-1177; filing it as recommended would have sent an implementer to build a thing that exists. Classifying WHICH of the three reap predicates fails for each of the thirty orphans, before touching the reaper, is the correct first move — and I would put money on a good share failing the ''spec is Done/Completed'' predicate, which makes them a SYMPTOM of BUG-1286 rather than a reaper defect, since the close often happens outside the drain and the reaper is reading a state nobody announced. Sequencing guard on the spec: do the classification FIRST and record the counts per failing predicate on this spec; only then decide what changes, and if the dominant class is the status predicate, the fix belongs in BUG-1286 and this spec closes with the evidence rather than with code. Safety guard unchanged: the existing worktree-gc protections stay exactly as strict — dirty, locked, or unique-unmerged-commit worktrees are never removed, and 141 GiB of reclaimable space is not a reason to relax a predicate that prevents losing work.'
