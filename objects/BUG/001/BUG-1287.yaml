  content: |-
    [advisor:correction] THE FIX I VERIFIED AND MERGED HAS ALREADY STOPPED WORKING, and my verification is why I did not see it coming. Filed as BUG-1424.

    Three hours after this merged, `aida session reap --dry-run` clears nothing. The same five branches this spec was written to clear — BUG-1163, BUG-1167, BUG-1268, STORY-1129, TASK-1251 — are all back to "its PR is merged (squash-merged), but N unique unmerged commit(s) — keep, operator decision".

    Same branch, same command, three hours apart:

      ~21:00  git diff --quiet origin/main bug-1163-work -- <files>  -> exit 0  (Removable)
      ~00:04  git diff --quiet origin/main bug-1163-work -- <files>  -> exit 1  (Keep)

    Nothing about the branch changed. Thirteen merges landed on main between those two runs, some touching files that branch had also touched.

    THE MECHANISM ANSWERS THE WRONG QUESTION. Comparing the branch tip against main's CURRENT tree asks "does this match main right now", which coincides with "did this land" only until someone else edits those files. So the fix is self-limiting in exactly the situation it exists for: a repo merging steadily, where worktrees accumulate because nobody reaps promptly. The failure direction is safe — it keeps rather than deletes — but it is inert.

    PATCH-ID IS ROBUST AND I CONFIRMED IT ON THE SAME BRANCH. Its commit's patch-id still appears among main's patch-ids since the merge-base, because a squash rewrites SHAs while preserving the diff. That comparison does not care how far main has moved.

    WHAT I WANT ON THE RECORD ABOUT MY OWN REVIEW. I verified this empirically before merging, ran the exact comparison the code runs, checked both directions, and reported that it protects the branch with real work and clears the artifacts. All of that was true when I ran it. None of it was true three hours later, and nothing in my method would have revealed that, because I tested the mechanism at a single moment against a repository that was about to change underneath it.

    The classification audit on this spec used PATCH-ID to establish which branches were artifacts. The implementation shipped tree comparison. The audit method was the more robust of the two and the gap between them was not noticed by the implementer, the product seat, or me. That is the more useful lesson than the bug: when the investigation and the implementation use different methods to answer the same question, the difference is worth a sentence in the review, and I did not ask for one.
