title: aida ps suggests salvage-committing untracked files onto main for dead harness sessions on the main checkout, repeated once per dead session
description: 'Seen 2026-09-26 in aida ps: five identical ''Salvageable harness-worktree /home/joe/ai/aida (branch main) ... git add -A && git commit -m "wip: salvage main"'' rows. The only ''uncommitted work'' was untracked tool directories (.agents/, .codegraph/, target-review/). Following the hint commits junk straight to the default branch. Acceptance: 1. Never suggest a salvage commit on the default branch (or any protected branch); instead suggest inspecting the files. 2. Untracked-only trees are not ''uncommitted work'' for salvage purposes unless the files are inside tracked directories touched by the session (or say ''untracked files only''). 3. Rows for the same worktree path are shown once with a count. 4. Fixture tests for each.'
