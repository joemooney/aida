comments:
- id: 01a0fb52-15e4-7630-b1be-78a01c7cc2df
  author: joe
  content: |-
    ## Triage Investigation (aida-triage)

    ### Status: Reproduced (Substrate architectural defect)

    ### Root Cause
    1. In `aida-cli-lib/src/coordination.rs:363-371`, session-lease claims written to `.aida-store/coordination/leases/<scope>.toml` carry `ttl_secs: 1800` and `process_backed: false` (because the creating `aida session start` process exits immediately).
    2. Whole-crate search via codegraph + grep confirms that `heartbeat_lock_claim` is called ONLY by long-lived locks with background heartbeat threads (`drain_lock.rs:314` and `solo_lock.rs:302`). Nothing ever refreshes `heartbeat_at` for session leases.
    3. Consequently, in `decide_claim` (`coordination.rs:220-231`), exactly 1800s after session start, `aged_out` evaluates to true. Any peer clone running `aida session start` or `aida queue work` is told to `ClaimDecision::Reclaim`, causing cross-clone race collisions on active work.
    4. Furthermore, under BUG-1764's staleness predicate, after 1800s the claim is hidden from `aida session leases`.

    ### Affected Sites across Crate
    - `aida-cli-lib/src/coordination.rs:decide_claim` (reclaim decision)
    - `aida-cli-lib/src/coordination.rs:build_claim` (initial claim creation with ttl=1800)
    - Display readers: `session leases`, `doctor`, `team::build_team_view`

    ### Recommended Fix Strategy
    As noted in the spec options, session leases are worktree/session backed rather than daemon-process backed.
    - For same-host claims (`host == our_host`): do not rely on 1800s TTL expiry. Instead, check if the worktree exists and whether a live agent session or active process is present (or probe session liveness).
    - For cross-host claims: require a explicit heartbeat refresh mechanism (e.g. hooked into session command execution / status line / MCP keepalive) or fallback to requiring explicit release / operator confirmation rather than silent auto-reclaim after 30 minutes.
  created_at: 2026-10-02T06:34:15.908663819Z
  modified_at: 2026-10-02T06:34:15.908663819Z
- id: 01a0fcfb-42a6-7860-9e3a-205fa2dc1069
  author: joe
  content: "DECISION: Option 2 - Stop pretending the TTL applies.\n\n### Decision & Rationale\n\nWe will remove the TTL/heartbeat mechanism for session leases and instead rely on the existing local liveness checks (e.g. verifying the worktree and process). \n\nAs noted in the spec, adding a reliable heartbeat for short-lived processes (like `aida session start` which exits immediately) is difficult without introducing a persistent background daemon for every session. Failing to heartbeat means the cross-clone registry silently stops coordinating after 30 minutes, which leads to duplicate work and merge races.\n\nIt is better to admit that we cannot reliably probe the liveness of a remote clone (and perhaps require manual intervention or an escape hatch) than to silently expire the lease and allow conflicting work.\n\n### Acceptance Criteria Updates\nThe ACs will follow the implementation of Option 2: `decide_claim` must no longer reclaim session leases purely due to a 1800s TTL expiry."
  created_at: 2026-10-02T14:18:40.166680064Z
  modified_at: 2026-10-02T14:18:40.166680064Z
