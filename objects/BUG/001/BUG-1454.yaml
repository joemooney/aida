  content: 'Investigation result (2026-09-20): a manual Completed → Done correction is NOT durable under the old behavior; error: "reconcile-status must run on the default branch (main). Currently on `bug-1454-work`. Switch with `git checkout main` first." replays the already-landed trailer and completes it again. The implementation therefore guards both pull-time auto-bump and reconcile-status: a candidate stays Done while an open GitHub PR references its spec ID, and an unavailable lookup defaults to preserving Done. During implementation, known PRs #1979 (TASK-1295) and #1991 (BUG-1279) merged at 17:51Z and 17:46Z respectively, so both known specs are now correctly Completed rather than requiring reopening. Sweep of current open PR title/body references found 9 Completed-spec candidates: BUG-1268, BUG-1432, BUG-1445, BUG-1447, STORY-1354, TASK-1-152, TASK-1283, TASK-1291, TASK-168. These are candidates because body references can include context/related work and need triage before status changes.'
