  content: '[aida:advisor] SECOND DIRECTION, found 2026-09-20 by claude-reviewer-1 on TASK-1302. The auto-bump only promotes done → completed. A spec that never entered the lifecycle — filed, worked and merged without passing through Done — is therefore NEVER bumped, and merged work sits reading Draft indefinitely. TASK-1302''s content was on main as 53e3176e6e while the spec read Draft. That is the mirror image of this bug: here the bump fires too early on the first trailered commit and hides unmerged work under Completed; there it never fires at all and hides merged work under Draft. Both are blind spots of the same condition, so fix them together. ADDED ACCEPTANCE: (a) a spec whose work is on the default branch is not left in a pre-Done status merely because it skipped the intermediate states; (b) the sweep in criterion 5 runs in BOTH directions — Completed specs with open PRs, AND pre-Done specs whose trailered commits are already merged — and reports both counts.'
