- id: 01a0e101-bf24-7c71-882a-a9e28b9b08e6
  author: codex (sketch-author advisor)
  content: |
    SKETCH (awaiting advisor signoff):

    Owner/trigger and evidence
    BUG-1682 owns serialization and atomic persistence of the per-home, per-role global queue. Trigger: independent CLI processes/projects concurrently adding/upserting/removing entries in ~/.aida/queue/<role>.yaml. The spec has no named implementation owner; route to an implementer only after independent advisor signoff. I am the sketch author, not its approver. Read AGENTS.md, the two-seat protocol, and the full spec; inspected working-tree source at HEAD 854b7e26f7 read-only. Actual owner is aida-cli-lib/src/global_queue.rs, not aida-core/global_queue.rs. load currently prechecks exists and converts YAML parse failure to an empty vector; save uses bare fs::write; add/remove read before any lock. The failure is both lost updates and possible torn content.

    API and file/symbol surface
    Keep GlobalQueueEntry's YAML schema, queue_path, load, add, remove, and project_name_for behavior/signatures except explicit fail-closed errors below. In global_queue.rs introduce private path-based read/write helpers and a private transaction/RAII guard that resolves one queue path, acquires its sidecar, reads, mutates, serializes, and commits. Make the current save helper private and lock-required (prefer a guard parameter or guard method); repository search found no global_queue::save callers. A public snapshot save with its own lock would still permit stale load-then-save overwrites, so do not retain that escape hatch. Preserve add's (requirement_id, project_root) upsert key, position sort, remove's optional project scope, boolean return, and no write on no-op removal. Reuse aida_core::{read_atomic, write_atomic}; fs2 already exists in aida-cli-lib/Cargo.toml. Tests should be local to global_queue.rs or a focused registered BUG-1682 test module. No new CLI/MCP contract or YAML migration is needed.

    Sidecar flock lifetime and ordering
    Use a stable sibling ~/.aida/queue/<role>.lock, opened create/read/write/truncate(false), with fs2 exclusive locking (flock on Unix, corresponding Windows lock). Create the directory before opening the lock; acquire BEFORE reading even when the queue does not yet exist. Keep the descriptor/RAII guard alive across read, validation, mutation, serialization, write_atomic's staging and rename, and error cleanup. Release on all returns/unwind; process termination closes the descriptor. Never remove, replace, truncate, or age-expire the lock file: unlinking it lets contenders lock different inodes. Lock the sidecar, never the replaceable YAML inode. One role per critical section; different roles remain independent. Helpers used inside the guard must not reacquire it. Keep store operations, callbacks into storage, logging hooks, subprocesses, and other lock acquisition outside this section; there is no need for a store/global nested transaction. Audit call sites before introducing any nesting. Proposed baseline is blocking exclusive acquisition, matching the existing worktree-pool precedent; bounded waiting remains a signoff question. Any lock error fails closed, never falls back to unlocked writes.

    Atomic I/O and Windows rename semantics
    load and lock-held reads must call read_atomic directly, with no exists() precheck. Only a final NotFound means a new/absent queue and yields an empty vector; other read errors and YAML/type errors propagate with role/path context. Empty/truncated/null documents should fail unless they deserialize as the required vector; [] is the canonical empty queue. Serialization succeeds before write_atomic publishes the replacement. Read-only load can remain lock-free and returns a complete old or new snapshot, not a transaction spanning later decisions. The current core helper stages a PID/sequence-named sibling then renames; its Windows reader retries transient NotFound/PermissionDenied under an approximately 200 ms budget. Reuse that implementation, do not invent remove-target-then-rename or separate retries. Windows replacement may still fail: propagate the write error without claiming success. The helper has no fsync durability guarantee. This promises process-race safety/atomic visibility, not persistence across power loss.

    Crash, race, and fail-closed behavior
    Successful mutations serialize by sidecar acquisition; a waiter re-reads the latest committed queue. Concurrent distinct upserts retain all entries; same-key upserts resolve in lock order without duplicates. Unrelated removal cannot erase a concurrent add. Death before rename leaves the old committed file (or an absent initial file); death after rename leaves the new file. A crash may leave a staging file; readers ignore it, and recovery must not delete the permanent sidecar. A caller dying after commit but before acknowledgment has an uncertain outcome; do not claim exactly-once delivery. Malformed YAML, permissions, lock failures, serialization/staging/rename failures must not rewrite the queue as empty. No mutation caller may catch such errors and continue with a default snapshot. Advisory locking cannot protect against old binaries/manual writers that ignore it; deploy all queue writers consistently.

    Required fake-HOME cross-process fixtures
    Use real child processes exercising production add/remove/load code, not merely threads or a process-local mutex. Prefer the existing lib-test executable child mode with its test_home inherited fencing: crate::home_dir uses fake HOME under cfg(test), including Windows. Set child env with Command::env, inherit the real-home fence, assert every child resolves the same temporary queue path, and isolate each fixture. AIDA_HOME alone does NOT redirect this module; production Windows dirs::home_dir ignores HOME, so a plain production CLI child with fake HOME is not a safe Windows fixture. No real ~/.aida access, parent-wide environment racing, or new production test flags.
    1. Barrier-start multiple writers, each adding many distinct IDs/projects to one role (including first creation); require every child success, valid YAML, and the exact final identity set plus preexisting sentinels. Coordinate contention deterministically, repeat enough operations to expose lost updates.
    2. Hold the actual sidecar in one child; another must not finish its mutation until release and must retain an intervening committed entry. Confirm an unrelated role can progress. Use readiness/release handshakes and bounded waits with child cleanup, not sleep-only ordering.
    3. Mixed add/remove on disjoint keys, same-key upserts, and same UUID in different projects; assert all untouched/new entries survive, removals stay removed, scoped semantics and uniqueness hold. For conflicting same-key actions accept a valid serialized outcome rather than guessing scheduler order.
    4. Continuous reader child while writers replace an already seeded queue: every read parses and retains an invariant sentinel. Exercise on Windows as well as Unix; rely on core fs_atomic's deterministic retry-policy tests for synthetic transient errors.
    5. Kill a child confirmed to hold the lock before commit; the next writer acquires it, the permanent sidecar persists, and committed entries survive. Cover pre/post-publication outcomes with a narrow test-only synchronization seam if needed.
    6. Missing file initializes normally; malformed/empty YAML and deterministic read/lock/write failures return errors and preserve previous bytes. Verify a later operation can acquire the lock after an error. Use portable failure injection rather than chmod-only assertions that pass as root or fail on Windows. Atomic-helper failure/cleanup tests can supply lower-level coverage without changing the shared helper.

    Out of scope
    No local/store queue migration, distributed/network-filesystem lock guarantee, scheduler/lease semantics, broad global persistence framework, role-name/path policy redesign, crash-temp scavenger, or shared fs_atomic rewrite. No implementation, approval, queue action, or merge is part of this sketch-author task.

    Open design questions for independent advisor
    1. queue_cmd.rs computes --top/default append positions from unlocked load calls (~3461-3474); autopilot_audit.rs ReversalStep::QueueAdd does likewise (~1254). The bounded fix retains entries but permits equal/stale positions. Is that acceptable for this bug, with strict concurrent placement deferred, or should a typed placement intent be evaluated inside the transaction now? If expanded, both callers must migrate and ordering/overflow tests are required; no silent scope expansion.
    2. Approve blocking flock for this small section, or require a bounded contention timeout? If bounded, choose the existing contention classifier and an explicit policy; do not reuse the store timeout environment variable accidentally.
    3. Confirm fail-closed parse behavior (including empty documents) as a necessary change from silent data-loss recovery. Read-only display callers currently using unwrap_or_default may still hide load errors; decide whether visible diagnostics belong here or in a follow-up. Mutation paths must always propagate errors.

    This is a proposal awaiting an independent advisor's explicit signoff, not an approval or implementation authorization.
