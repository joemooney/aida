title: Global role queue (~/.aida/queue/<role>.yaml) is a read-modify-write with a bare fs::write and no lock, so concurrent writers drop entries
description: 'Found by the BUG-1677 review: global_queue.rs ~76 rewrites the home-dir global queue with an unlocked read-modify-write and non-atomic fs::write. Acceptance: 1. Writers take an flock on a sidecar lock file for the whole read-modify-write. 2. Writes use write_atomic; reads use read_atomic (rename-safe on Windows). 3. A concurrency fixture test (fake HOME) loses no entries.'
