- id: 01a0ddf2-225c-7d91-8f0a-982b9e6c7687
  author: joe
  content: 'Review (fresh strict Opus reviewer): APPROVE WITH NITS on db8c3b1abc. Verified: cargo check -p aida-cli-lib clean (no new warnings on changed items); --lib bug_1651 6/6, bug_1647 14/14, bug_1638 13/13, bug_231 47/47, findings 144/144, queue 510/510. Mutation (f): with every message assert commented out, disabling the CAS guard fails all 3 concurrency tests on queue-state asserts (lines 84, 112, 138); disabling only the identity check fails re-add tests at 112/138; skipping the i64::MAX reorder fails at 182. The queue-state asserts are load-bearing. Reverted; tree clean. (a) added_at is chrono::Utc::now() at ns resolution and round-trips exactly through serde_yaml RFC3339 (the undisturbed Withdrawn test proves the round trip). A false positive needs the same ns, role and note. That is not plausible, so no nonce is needed. (b) git queue_reorder mutates only the matched entry and re-sorts; other positions are untouched. (c) queue_spec_for_role (gate route, lib.rs:10328) is unchanged: same entry, returns role. (d) queue_promoted_finding has only test callers (bug_231 tests). FINDINGS: 1. LOW lib.rs:790 and 726: if queue_add(prior) succeeds but the follow-up queue_reorder fails, the Err branch says the entry ''could not be withdrawn'' and advises ''aida queue remove X --for <promote role>''. The prior entry (possibly a different role) has in fact been restored, only not at i64::MAX, so the advice would be a no-op or wrong. Fix: make the reorder best-effort (return Withdrawn plus a position caveat), or map it to a distinct outcome with a truthful message. 2. NIT lib.rs:751: the CAS predicate relies on the backend round-tripping for_role and ns added_at. The SQLite queue table stores neither for_role nor (necessarily) ns. This is unreachable today because promote takes CachedGitBackend, and it fails safe (LeftReplaced, entry left). Add a one-line comment saying the predicate is git-backend-only. 3. NIT lib.rs:12030: the rustdoc link [queue_promoted_finding] points at a cfg(test)-only item, so it breaks under cargo doc --document-private-items. Use plain text. 4. INFO: queue_add followed by queue_reorder is two unlocked writes (two commits), which slightly widens the documented residual window. This is acceptable. 5. INFO: the branch base is one commit behind main (ff2975a5ce vs 9beb57f86d); the merge-base diff is clean. None of these block the merge.'
