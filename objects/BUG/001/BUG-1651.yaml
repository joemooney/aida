title: 'findings promote queue undo is not compare-and-swap: a concurrent queue remove or re-add can be clobbered by the rollback'
description: 'From the BUG-1647 strict review (non-blocking). (1) aida-cli-lib/src/lib.rs ~706-710 findings_promote_to_work restores a pre-existing entry with queue_add (replace semantics), so a concurrent aida queue remove or done during the window is undone. With no prior entry, the role-scoped remove drops a concurrent same-role re-add. Git queue writes are unlocked (git_backend.rs ~1674, ~1727). Fix: re-read the queue before undoing; act only if the current entry for this spec is still the one this call added (match note, added_at and for_role); otherwise leave it and say so. (2) Reword ~712 ''withdrawn, so nothing was changed'' to ''its queue entry was withdrawn; the finding is unchanged''. (3) Restore a position of i64::MAX exactly, or document the exception. (4) Add a test pinning --json gating of the phase-1 Refused line.'
