title: aida remote status / doctor reports 'release v0.15.0 missing' on gitlab even after the release exists (false negative)
description: 'After creating the GitLab release v0.15.0 on gitlab.joemooney.com (verified via API: name+tag+4 asset links present), aida remote status still reports ''release v0.15.0 drift / gitlab release missing''. The release-drift detector has a false negative — it does not recognize a release created with asset LINKS (glab release create uploads assets as links, not direct attachments), or it caches, or it checks a field the API populates differently. Fix: align the detector''s release-existence check with the GitLab releases API shape (a release object at /projects/:id/releases/:tag with assets.links counts as present).'
