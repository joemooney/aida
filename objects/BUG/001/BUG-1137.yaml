  content: 'Advisor review of PR #1811: PARTIAL fix, NOT merged. The PR improves detection (http_code + body/tag_name parsing, adds AIDA_GITLAB_TOKEN) but reads the token ONLY from env (AIDA_GITLAB_TOKEN/GITLAB_TOKEN). Verified the operator''s real setup: gitlab ai/aida is PRIVATE (unauth release read → 404) and GITLAB_TOKEN is UNSET (token lives in ~/.config/glab-cli/config.yml). So on the operator''s box the detector still makes an unauthenticated call → 404 → still reports ''release missing''. The fix does not close the bug for a glab user. Needed: authenticate the release check the way glab does — env var first, THEN fall back to the glab config token (hosts.<host>.token), OR shell out to ''glab api projects/:id/releases/:tag'' which uses glab''s own auth. Rework #1811 with a real auth source before completing.'
