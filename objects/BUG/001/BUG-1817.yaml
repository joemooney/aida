agreed_id: BUG-1817
title: Canonicalize auto-complete review stories across retries and queue identities
description: |
  Auto-complete must create or reuse exactly one canonical review story for a PR/MR head and covered-spec set, then launch that story even when role-scoped queue identities are in use.

  Observed in qci#BUG-118 and again on qci MR !26: retries produced several active Review MR stories, while the reviewer resolver reported no pickable review story.

  ## Required behavior
  - Auto-queue review is idempotent for PR/MR head plus covered-spec set.
  - Search all relevant local/global role queues and non-terminal review stories before filing.
  - Deterministically select one canonical item when legacy duplicates exist; duplicates must not block launch.
  - Writer and reviewer resolver use the same queue identity semantics.
  - Persist the chosen review SPEC-ID in orchestration state and reuse it on retries.
  - Missing-story errors name the queues and identities searched.

  ## Acceptance
  - One auto-complete run creates at most one active review story and enters phase 3.
  - Two retries do not increase the active review-story count.
  - A fixture with legacy duplicates resolves one deterministic canonical story.
  - Role-user and ordinary-user routes both resolve what auto-queue wrote.
  - GitHub and GitLab use the same selection behavior.
  - Regression tests reproduce the qci failure.
