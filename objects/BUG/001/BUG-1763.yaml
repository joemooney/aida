  content: 'Implementation approach: introduced PreclaimBranchState {Absent, Merged, Unmerged, MergeStateUnknown} in queue_cmd.rs. preclaim_branch_state(branch_exists, merged_probe) invokes the forge probe (detect_merged_pr_for_branch_via_forge → gh pr list --head <branch> --state merged) only when the branch exists; probe failure maps to MergeStateUnknown, never Unmerged. preclaim_collision_check now refuses the branch arm only on Unmerged; PR arm and bypass chain unchanged. Tests: bug_1763_merged_branch_preclaim_tests.rs covers AC1-AC7 incl. a real squash-merged git fixture proving merge-base --is-ancestor reports NO where the forge path allows, probe invocation counting, and a source pin that the preclaim block uses the forge helper and no ancestry.'
