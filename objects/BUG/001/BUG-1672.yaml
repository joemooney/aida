- id: 01a0dfe5-610d-71d2-b5ff-6b17ab0168fc
  author: joe
  content: 'Implemented on claude/bug-1672 @ 688477d939 per the proxy design: newest review wins across the PR-keyed file, the spec-keyed file and review comments; a comment counts only when its first line starts with Review (Review:, Review (...):, Review round N:) or VERDICT:; no owner/author exclusion (history records only the author ''joe'', not the done-setter session); an approving file counts only if newer (mtime) than a blocking review comment, unknown order stays listed. Orchestrator ''delta check'' comments no longer count, so a spec approved only by a delta check (e.g. BUG-1653) stays listed. Tests: bug_1672 7/7, human 130/130, fmt + clippy clean.'
