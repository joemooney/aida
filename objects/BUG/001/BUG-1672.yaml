- id: 01a0dfa3-2bc6-7c62-9371-a5dfe1014e2b
  author: joe
  content: 'DRAFT (uncompiled) on claude/bug-1672 @ 0873c5847f: root cause — reviews_awaiting_human set reviewed only from the drain''s .aida/review-verdicts/PR-<n>.json; a keyboard aida review writes <SPEC>.json and fresh-reviewer/delta-check flows post only a spec comment (the live PR-1653/1658/1664.json files are unrelated old PRs). Added in lib.rs next to pr_has_approved_verdict: spec_verdict_record_approves (spec-keyed file via read_recorded_verdict_any, not merge-closed), review_comment_verdict (first-line parser: head starts with ''review'' or names ''delta check''; REQUEST_CHANGES/REJECT/PARTIAL block, APPROVE/APPROVED/LGTM approve unless WITHHELD/PENDING/NOT APPROVED), latest_review_comment_verdict (newest top-level comment by anyone but the spec owner), and spec_review_approved (PR file || spec file || latest comment) now used for OpenChange rows. Tests: aida-cli-lib/src/tests/bug_1672_reviews_awaiting_approved_tests.rs (tempdir project root, in-memory Requirement/Comment): parser cases from the four real comment trails, newest-wins + owner exclusion, and the three acceptance cases (approve by comment → not awaiting; request-changes-after-approve and no-review → still awaiting; spec-keyed/PR-keyed files, closed-by-merge). Decisions to confirm: ''non-author'' = comment author != spec owner (owner is empty on the four specs, so nobody is excluded there); orchestrator ''delta check'' comments count as reviews; a verdict FILE wins over a later request-changes comment. Compile risks: Option::map_or closure borrow of exclude in latest_review_comment_verdict, is_some_and on Option<VerdictKind> (Copy, fine),  imports of private fns from the #[path] test module (same pattern as other bug_* modules), chrono Duration::minutes.'
