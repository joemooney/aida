title: aida human lists specs under reviews-awaiting after an independent review has already approved them
description: 'Seen 2026-09-26: BUG-1653, BUG-1658, TASK-1515 and BUG-1664 each carry a posted ''Review: APPROVE'' comment and are queued for integration, yet aida human lists them as reviews-awaiting for the operator. Acceptance: 1. A spec whose latest review comment/verdict is APPROVE from a non-author reviewer is not listed under reviews-awaiting (it may appear under an ''awaiting integration'' line instead). 2. REQUEST_CHANGES or no review keeps it listed. 3. Fixture test covering all three.'
