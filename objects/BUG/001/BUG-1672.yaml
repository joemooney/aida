  content: 'PROXY DECISION (orchestrator for Joe): (1) confirmed — a first line beginning with ''Review'' (incl. ''Review (…)'', ''Review round N …'') or ''VERDICT:'' counts; (2) delta-check comments don''t count (fails toward listing; BUG-1653 is completed anyway); (3) implementer-self-review exclusion needs session IDs in history — not in scope.'
