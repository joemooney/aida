title: 'pr ship --no-complete: derive_pr_ship_squash_subject returns None when subject equals head commit subject, letting gh''s default subject carry the title''s spec id'
description: 'Found by the strict reviewer of PR #2571 (BUG-1957), outside that PR''s diff, low confidence and not reproduced. derive_pr_ship_squash_subject (aida-cli-lib/src/pr_cmd.rs:~3685) returns None when the normalized subject equals the branch-head commit subject. With --no-complete, a title ''fix: x (ID)'' and a head commit ''fix: x'', gh may then fall back to its default squash subject (the PR title), which carries the withheld ID, so merge-time completion could fire. Acceptance: reproduce with a test; if confirmed, never return None when ids are withheld.'
