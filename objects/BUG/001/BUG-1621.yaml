- id: 01a0d96a-b3dc-7201-8333-8333737eb1f6
  author: joe
  content: 'Implemented on claude/bug-1621 at bd8f2e5971. watch --execute now runs the night shift''s own re-drive step (shift::run_redrive_pass -> redrive_step: plan_redrives -> apply_requeue with the attempt recorded first -> apply_cap), with the same guards and floors. It takes shift.lock, only re-queues, and never launches or uses --force-claim. Opt-in decision: it REQUIRES the per-clone redrive = true, because watch --execute is run by the aida-oversee agent seat and on --interval loops, so a human caller cannot be assumed. The manual ''aida supervise redrive --execute'' is unchanged and still launches with --force-claim; that is out of scope here.'
  created_at: 2026-09-25T16:34:03.867995794Z
  modified_at: 2026-09-25T16:34:03.867995794Z
