title: make check-ci-fast misses the CLI-manual drift guard (needs a built binary), so a hidden-flag doc citation reaches CI
description: |
  Observed 2026-10-10 on PR #2487. `make check-ci-fast` passed locally, but CI's "CLI-manual drift-guard (every command documented)" failed: docs/cli/11-dev.md cited `--skip-xplat-check`, a flag the PR had hidden. The gate needs a built aida binary, so the fast tier skips it, yet CLAUDE.md presents check-ci-fast as the pre-push gate. This cost one extra ~15-minute CI cycle.

  Want: when docs/cli/** or the clap definitions change, check-ci-fast runs verify-manual.py's flags and completeness checks against an existing target/debug or target/release aida if present (warning if it is stale), or a static fast-tier variant parses --flag citations against cli.rs.

  Acceptance: re-introducing a citation of a hidden flag fails `make check-ci-fast` locally.
