title: 'Auto-followup filing over-files: creates tasks from ''## Followups'' bullets that name an existing spec-id or are meta-prose (''Consider a small task: ...'')'
description: 'Completing SPIKE-79 (with a docs/plans assessment containing a ''## Followups'' section) auto-filed each bullet as a child TASK. Two were noise: TASK-1225 from a bullet that NAMED the already-existing TASK-1223 (''TASK-1223 — ... (in flight)''), and TASK-1226 from a meta-prose bullet (''Consider a small task: store mirror fan-out ...'') that duplicated the manually-filed TASK-1227. Fix: the auto-followup parser should (a) skip a bullet that already contains a resolvable spec-id reference (it''s a pointer, not new work), and (b) skip meta-prose bullets like ''Consider a small task:'' / ''Consider ...'' openers, or require an imperative shape. Prevents the exact duplicate-noise cleanup this created. trace:AIDA_AUTO_FOLLOWUPS'
