title: Queue-wide drain starts a blocked dependent after upstream failure despite max-failures one
description: |-
  Observed live from `aida queue work --drain --user joe --role implementer --vendor codex --max-failures 1 --max-runtime 8h` on 2026-09-24.

  ## Reproduction evidence
  - STORY-52 was the sole pickable head; NFR-56 had an explicit BlockedBy edge to STORY-52.
  - STORY-52 implementation committed, then phase 2 failed because the new project had no usable origin. AIDA shelved STORY-52 to NeedsAttention and auto-filed qci#BUG-57 at 21:07:41Z.
  - Despite `--max-failures 1`, the same drain started NFR-56 less than one second later. NFR-56 then failed phase 1 and auto-filed qci#BUG-58 at 21:07:42Z.
  - The prerequisite was neither merged nor Completed.

  ## Expected
  A failure budget of one stops before dispatching another spec after the first shelved failure. Independently, a BlockedBy dependent remains unpickable until its prerequisite is Completed; Done, NeedsAttention, a pushed branch, or a failed CI phase must not satisfy the dependency.

  ## Acceptance
  - End-to-end CLI test for untagged queue-wide `--drain --max-failures 1`, not only the pure `drain_batch` unit path.
  - First shelved member stops the queue before a second launch when the cap is one.
  - A dependent is skipped and reported with its blocker after the blocker shelves in any phase.
  - Independent work may continue only when the configured failure budget permits it.
  - Regression coverage exercises the real queue resolver/status transitions used by `--drain`.

  Regression context: STORY-449 documents and tests both the failure cap and dependent skip, but the observed queue-wide drain violated both guarantees.
