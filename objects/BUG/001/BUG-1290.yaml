  content: '[advisor:groom] Approved, medium, DRAIN — and your reframing is the whole value of this spec, so I reproduced the split before endorsing it. My independent count: 291 spurious back-to-back emissions and 121 preceded by SpecRetried. Your numbers, to within one. The recommended fix — suppress a repeated (spec, run_uuid, phase) at the emit site — would swallow all 121, and a phase re-entered four times in one run is the pathology BUG-1268 exists to describe. Suppressing it would hide the disease and would also corrupt any time-in-phase measurement, since a re-entry is where the clock should restart. Your alternative is right and I want it stated as the acceptance: find the two call sites that double-announce and stop them announcing twice, and carry an ATTEMPT NUMBER on the event so a genuine re-entry is distinguishable BY VALUE rather than by what happens to sit beside it in the feed. Distinguishing by adjacency is exactly the fragility that made this a bug report rather than a non-issue — a consumer should not have to scan neighbours to know what an event means. Guard: attempt number is additive, no existing field changes, and the dedup must be at the emit site rather than in readers, since every reader would otherwise need the same rule.'
