title: 'aida dev build follow-ups from STORY-1646 review: rollback crash recovery swaps .promoted wrongly, untested smoke env, empty sha'
description: |
  Minor findings from the night round-2 review of PR #2506 (STORY-1646):
  1. dev_build.rs:773-781: crash recovery can restore the .promoted records the wrong way round. 'swapped' is only true while a binary is mid-swap. If rollback crashes after both binaries are swapped but before swap_meta_forward, .rollback/ holds only .promoted, and recovery puts the parked record back onto live, where it now describes the wrong pair. Only metadata is affected. Fix: treat the swap as started when LIVE_BINARIES.iter().any(|n| !swap.join(n).is_file() || !layout.prev(n).exists()). Add a test with .rollback/ holding only .promoted.
  2. dev_build.rs:1250-1256: there is no test that the smoke commands remove GIT_DIR, GIT_WORK_TREE and GIT_INDEX_FILE. Extract pub(crate) fn smoke_command(bin) -> Command and assert on get_envs().
  3. With --allow-dirty and an unreadable HEAD, PromotionMeta.sha is empty, and status prints 'HEAD  at …'. Write 'unknown' instead, or skip the Promoted: line.

  ## Acceptance

  (groom:night, 2026-10-11: all three items verified still open on origin/main 17ff749954.)

  1. Rollback crash recovery treats the swap as started when any live binary is missing from `.rollback/` or its prev slot is missing (the condition given in item 1). Test: `.rollback/` holding only `.promoted` (both binaries already swapped) finishes the `.promoted` swap forward instead of restoring the parked record onto live.
  2. A `pub(crate) fn smoke_command(bin) -> Command` is extracted from `smoke`, and a unit test asserts via `get_envs()` that GIT_DIR, GIT_WORK_TREE and GIT_INDEX_FILE are removed.
  3. With an empty `PromotionMeta.sha`, `aida dev status` prints `unknown` (not an empty field); unit test on the status formatting.
