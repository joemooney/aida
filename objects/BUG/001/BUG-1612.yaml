id: 01a0d679-4f75-7e33-af81-6cbc11de71f1
spec_id: BUG-1612
agreed_id: BUG-1612
title: update_atomically on the git store is a lock-free whole-store load/save and can delete a spec added concurrently
description: |-
  Found by the STORY-1429 strict review (2026-09-24). DatabaseBackend::update_atomically uses the default trait method on GitBackend and CachedGitBackend, and Storage::update_atomically on directory stores does the same: load() every object, mutate, then save() the whole store, with no lock. That is a whole-store rewrite, which breaks the single-spec targeted write rule (BUG-634), and a full save deletes any object absent from the loaded copy. A spec added by another process between the load and the save can therefore be deleted.

  ## Acceptance
  - GitBackend (and CachedGitBackend, and Storage for directory stores) implement update_atomically as a per-spec compare-and-swap. Re-read the one spec's YAML under a write lock, apply the closure, and write only that file with the targeted commit. No whole-store save.
  - A concurrent add of a different spec between load and save is never deleted (test with two writers).
  - A concurrent modification of the same spec is detected, and the operation retries or refuses; it never silently clobbers.
  - Audit every caller of update_atomically and save() on the git store, and list any remaining whole-store writers with their justification.
