  author: joe
  content: |
    Follow-on to the probe above — the candidate worklist for the leading hypothesis, so the next session starts from a list instead of a grep.

    Hypothesis restated: some code path resolves a project root from `AIDA_PROJECT_ROOT` / `AIDA_DRIVE_ROOT` / `find_project_root()` while a parallel test holds those pointed at ITS temp dir, and then removes under that root. 296 non-test sites read one of those three. Fifteen modules both resolve a root and call `remove_file`/`remove_dir_all`:

    drain_lock, reconstitute, session_reap, doctor_cmd, lib, mcp, pr_cmd, headless_tee, drain_state, queue_cmd, solo_lock, agent_registry, internal_cmd, session (plus tests/agent_launcher_tests).

    Already eliminated from that list: `session_reap`'s `remove_dir_all(admin_dir)` — it removes a git worktree admin directory under `<common_dir>/worktrees/<name>` keyed by a matching `gitdir` file, never anything under `.aida/`.

    Recommended order for the next session, cheapest-first, and note this is static narrowing, NOT a reproduction: prefer the ones that can plausibly run as a side effect of an unrelated command rather than only from an explicit verb, since the failing test never invokes these directly. `drain_state`, `agent_registry`, `solo_lock` and `drain_lock` fit that shape; `doctor_cmd`, `pr_cmd`, `reconstitute` and `internal_cmd` are explicit verbs and are lower yield.

    Caution carried from BUG-1695's AC2: if none of them turns out to be the writer, the honest conclusion is "not identified", not "no writer exists". The second acceptance bullet here was written to accept a self-diagnosing failure as the floor precisely so this spec cannot stall on proving a negative.
