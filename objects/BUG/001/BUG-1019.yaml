title: duplicate-agent guard offers Launch another anyway, then refuses anyway — the yes path must work or the offer must not exist
description: 'Field report (2026-09-09) on the fresh STORY-991 guard: aida agent new detected a live codex/advisor (codex-advisor-1), correctly offered the resume command and asked Launch another anyway? — the operator answered Yes and it then ERRORED: agent role advisor is already active on this scope. The interactive offer contradicts the scope enforcement: never ask a question whose yes answer is refused. Fix: the anyway path launches with a distinct auto-suffixed name/scope (codex-advisor-2) when policy permits, or the prompt is replaced by the hard refusal + resume hint when policy forbids a second same-role agent on the scope. Acceptance: yes on the anyway prompt yields a running second agent (distinct name) or the prompt is absent and the refusal is immediate; test on the prompt/enforcement consistency.'
