    [aida:proxy-approval] pr: #2028 fix(drain): classify rework head changes (BUG-1445)

    verdict: APPROVE + merged
    proxy: claude driver-advisor, session 01a0adee
    timestamp: 2026-09-20 20:26:19Z

    independent: yes on the code. This advisor FILED this spec — the rebase-only rework loop — and wrote its acceptance, but wrote none of the implementation. Codex implemented; the drain's phase-3 reviewer approved. Recording the authorship of the spec explicitly, since I am merging against criteria I wrote.

    gates cleared at the pinned head 13da26cf46:
      - reviewer verdict APPROVED at 13da26cf46, which IS the current head
      - Build (ubuntu-latest) pass
      - merge-hold-gate failed on a hold whose stated reason was "BUG-1445 is marked unset
        (supervised) — auto-merge refused". That reason was DISCHARGED, not waived: the spec had
        no execution_mode, I set it to drain, and the condition the hold named no longer held.
      - no drive owned it; the drain had handed it off at the merge gate

    WHAT I VERIFIED MYSELF rather than taking from the verdict, because the acceptance was mine and the failure mode I was guarding against is a message that claims a method the code does not use:

      acceptance 2 required detection by patch-id, explicitly NOT tree-diff, "because a rebase onto
      newer main changes the tree substantially while changing nothing the findings asked for".

      The implementation runs `git rev-list --cherry-pick` over `{before}...{after}` with
      `^{default_ref}` excluded, and classifies empty stdout as RebaseOnly. --cherry-pick is
      patch-equivalence; it omits commits whose patch-id matches one on the other side. So the
      message "the PR head moved, but its patch-ids are unchanged (rebase-only)" is truthful about
      its own mechanism. That check mattered: BUG-1424 was exactly a case where the stated method
      and the implemented method diverged, and I would have refused this on the same grounds.

      acceptance 1 required rebase-only be distinguishable from a content-changed round. Delivered
      as a three-state enum — Unchanged / RebaseOnly / ContentChanged — rather than a bool, which is
      the shape PRIN-5 asks for.

      acceptance 4 required the recovery hint say what actually happened. The message now names the
      classification instead of telling the reader to "push fixups", which on an unchanged head was
      advice to repeat what had just failed.

    what this unblocks: BUG-1476 is the root cause of rework rounds producing nothing, and this spec
    is the detector for one of its two shapes. With this merged, a rebase-only round is reportable
    rather than indistinguishable from a genuine failed attempt.
