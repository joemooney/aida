  content: |-
    SECOND INSTANCE, observed live 2026-09-20 14:00Z, under an hour after filing — BUG-1310 / PR #2016.

    Round 1  6a6f0668  patch-id ad3adfdd2d4fe5c4  -> CHANGES REQUESTED
    Round 2  8f017df1  patch-id d06b43831f584594  -> CHANGES REQUESTED   (genuinely new work; I checked this round by hand and cleared it as productive)
    Round 3  55f1ddf3  patch-id ad3adfdd2d4fe5c4
             499bbc69  patch-id d06b43831f584594  -> CHANGES REQUESTED

    Round 3's two commits carry exactly the patch-ids of rounds 1 and 2. Both SHAs changed; neither contribution did. A rebase-only round, a full reviewer cycle spent, same verdict.

    This instance adds two things the STORY-1350 case did not show.

    First, it happened to a spec I had checked one tick earlier and confirmed was making real progress. So a round being productive tells you nothing about the next one, which means a one-off manual patch-id check is not a substitute for the detection in criterion 1 — the check has to run every round.

    Second, the spec is left marked Done with an open PR and a refusing verdict, and the drain moves on. Three rounds in, BUG-1310 sits in exactly the state it started in, while `aida list` shows it Done.
