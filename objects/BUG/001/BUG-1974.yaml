  content: 'NIGHT READY: PR #2549 green at 60617474c845739c06f75e47d9c11ccaebfa1e92. Root cause: the history index flock is inherited by a git child that another test thread is spawning (fork-to-exec window), so serve_at reads the lock as held and answers Ok from the fallback without consuming the injected catch-up failure. The fix is test-side: test_support::serve_locked retries only while unlocked (an unlocked call is side-effect free), plus a deterministic reproduction test. Proof: 50/50 runs of the bug_1923 module at --test-threads=16 alongside a concurrent full lib suite. Two fresh reviews: APPROVE. Follow-up race in classify_miss/is_held filed as BUG-1987.'
