title: 'Flaky on main: bug_1942_stalled_catch_up_skips_inside_cooldown fails at stalled_three_behind (serve_at returned Ok during injected catch-up failures)'
description: 'Main CI went red at 34e3fe48e1 (#2533, a docs-only glossary PR, unrelated), run 38163356542, then green on the next commit 0095daaf6f with no relevant change. Failure: task_1507_history_cache_tests::bug_1923::bug_1942_stalled_catch_up_skips_inside_cooldown panicked at aida-cli-lib/src/tests/task_1507_history_cache_tests.rs:3749 (the helper stalled_three_behind): ''assertion failed: history_cache::serve_at(&fx.store, &fx.db, &opts(), Duration::ZERO).is_err()''. 8088 passed, 1 failed. Added by BUG-1942 (#2521, merged 2026-10-11). FAIL_NEXT_CATCH_UP is thread-local (history_cache.rs:207), so it isn''t cross-test consumption of the injection. Suspect: by the 2nd or 3rd injected failure, the new BUG-1942 cooldown / stall logic (or a wall-clock / RFC3339 seconds-granularity comparison) makes serve_at skip the inline catch-up, so the injected failure isn''t consumed and serve_at returns Ok. Acceptance: root cause named; the helper drives the stall deterministically (injected clock, or set the failure count directly) with no wall-clock dependence; 50 consecutive runs pass under ''cargo test -p aida-cli-lib bug_1942 -- --test-threads=16'' alongside the full suite.'
