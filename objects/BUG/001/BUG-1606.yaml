- id: 01a0d575-6818-7913-baf7-3576bb5c91b7
  author: joe
  content: 'Review follow-up in 519af1777c: (1) The upstream-report notice now writes its marker only when the cache snapshot it read is stamped at the store HEAD it checked. A test covers the stale-cache case, where a foreign writer holds the lock and catch-up is skipped. (2) In the incremental catch-up, a missed targeted epic read now makes the catch-up decline, so the cache falls back to a full rebuild. Write paths mark the cache stale in the same case. (3) The targeted epic read now opens that one object file directly, so a miss no longer falls through to the agreed_id scan. (4) For custom_status rows, the notice resolves the base status with one targeted read. If it can''t be resolved, the report counts as open.'
