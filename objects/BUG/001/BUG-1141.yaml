title: 'aida digest panics on every invocation: subcommand ''format: DigestFormat'' collides with the global --format (OutputFormat) clap arg'
description: 'aida digest (with ANY args, incl. none) panics: ''Mismatch between definition and access of format. Could not downcast...'' (clap_builder error.rs). Root cause: the root Cli struct defines a GLOBAL ''--format: Option<OutputFormat>'' (global=true, propagates to every subcommand), and the Digest subcommand ALSO defines ''format: DigestFormat'' (cli.rs:9327). Two --format args of different value types reach the digest subcommand; clap''s derive downcast fails at access -> panic. digest is the ONLY subcommand redefining ''format'', so it''s the only one that crashes. DigestFormat {Markdown,Plain,Json,Brief} is distinct from OutputFormat {human,toon,json}, so they can''t be unified. Fix: rename the digest arg to a non-colliding id+long (field digest_format, clap long ''digest-format'') and update the handler; keep the 4 digest formats. Acceptance: aida digest runs (no panic); aida digest --digest-format json|markdown|plain|brief works; the global --format still applies where relevant. Add a test that the CLI parses digest without panicking (a parse/downcast regression guard).'
