  content: 'FACTORY PLAN (night): In aida-cli-lib/src/history.rs build_digest_rows, replace the lexical sort over last_ts_iso with a new helper sort_digest_rows(): parse each last_ts_iso via chrono::DateTime::parse_from_rfc3339 (UTC instant, any offset form), order newest instant first, tie-break by spec_id ascending (matches the old stable order for exact-string ties, so existing goldens stay byte-identical). Unparseable timestamps sort after all parseable ones, newest-string-first among themselves, then spec_id; no panic. Rendering untouched (last_ts_iso string kept as-is). Tests (history::tests): digest_orders_by_instant_not_string (-07:00 vs Z), digest_tie_breaks_by_spec_id (live ...Z vs deleted ...+00:00 same instant, both input orders), digest_unparseable_timestamp_sorts_last. Risk: none architectural; compile-correctness only (built on CI). Acceptance checked by those unit tests plus existing digest goldens in CI.'
