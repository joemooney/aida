  content: 'Advisor, performance-guard trip triage (2026-10-12 03:45). The show ceiling was breached again: worst 30740 ms against the 5000 ms ceiling, and 18.8% of 1263 calls in 24h were over the 1000 ms budget (tolerated 10%). By binary: 95f15a20d4 48.7% of 335 (the outlier), 4cced67be8 9.7%, 97453570d6 7.8%, 9116ba7f23 4.7%. Disposition: a real regression, owned by this spec (PR #2552, under review). Budget unchanged per ADR-53. After #2552 merges and the live binary is promoted, the 24h window should age out the old lineages; if 95f15a20d4-class proportions persist on the new binary, reopen. Also check why 95f15a20d4 alone sits at ~49%.'
