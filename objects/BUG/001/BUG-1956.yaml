  content: |-
    NIGHT READY: PR #2552 green at 00ff2b9d40b55aee872705e8310d3d99ae77e131

    - Fresh re-review: APPROVE. All four first-round findings are fixed. The cap is scoped to budgeted reads, so mutations keep the full ladder; there is a migration check; the unbounded paths are documented; and the tests clear the env.
    - Build: the first run failed on task_1717 allocation_pull_and_push_follow_the_window_discipline (store lock read as held during pre-push). That code is outside this diff, and the test passed 5 of 5 local runs at the same SHA. I filed it as flaky BUG-1989. The re-run of the same SHA is green.
    - LOW notes for follow-up, not blocking:
      1. A first-build show behind a writer only counts sleep time against the 3 s allowance, so on a large store it can take about 6 s before it errors. A wall-clock deadline would close this.
      2. read_ladder_budget_caps_the_retry_ladder doesn't clear AIDA_CACHE_RETRY_* (a false-pass risk only).
    - The PR body lists the remaining unbounded paths (schema-drift rebuild, unbudgeted list and comment list, MIGRATION_WAIT).
