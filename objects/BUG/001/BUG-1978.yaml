title: '''aida review record'' attribution-fallback error points at ''aida role enter'' even when the seat grant is valid; the real fix is AIDA_AGENT_NAME/TYPE'
description: 'Seen 2026-10-11 in an advisor session with a valid AIDA_SESSION_GRANT and AIDA_SESSION_ROLE=advisor. ''aida review record'' failed with ''aida review record attribution fallback'', help: ''aida role enter''. Cause (lib_part5.rs ~11720 and review_recorded_by_from ~12142): with neither AIDA_AGENT_NAME nor AIDA_AGENT_TYPE set, recorded_by becomes ''aida review record (operator)'', which then requires require_direct_human(). An agent seat with a grant is never told to identify itself. Exporting AIDA_AGENT_TYPE=claude fixed it. Acceptance: when a seat grant is present but no agent identity is set, the error says so and names AIDA_AGENT_TYPE / AIDA_AGENT_NAME. Consider having Claude Code sessions export AIDA_AGENT_TYPE automatically (the SessionStart hook already sets the role). Test the message for both cases (no grant; grant but no agent identity).'
