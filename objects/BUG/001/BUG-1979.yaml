title: aida show markdown rendering ignores AIDA_GLYPHS=ascii
description: |-
  Found in the post-merge review of #2540 (STORY-1652). aida-cli-lib/src/markdown_render.rs hard-codes Unicode glyphs: heading rules ═/─ (~:577), bullets • (~:631), blockquote │ (~:845, :859) and box-drawing table borders (~:978-1034). The rest of aida show goes through the glyph profile, so with AIDA_GLYPHS=ascii on a terminal that cannot draw box characters, rendered descriptions show mojibake tables and rules.

  ## Acceptance
  - With AIDA_GLYPHS=ascii, rendered headings, bullets, blockquotes and table borders use ASCII only (e.g. = - * | +-).
  - The renderer takes its glyphs from the existing glyph profile rather than literals.
  - Snapshot tests cover ascii mode for a table and a nested list.

  Also fold in (trivial, same file): the catch_unwind fallback in render_markdown_for_terminal (~:108) still lets the default panic hook print to stderr, so install a silent hook around the render or avoid the panic path; and styling_enabled (~:101) should ignore an empty NO_COLOR value per no-color.org.
