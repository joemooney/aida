- id: 01a12b1d-5ff8-76a2-b264-f41bc1bc1bd7
  author: joe
  content: 'FACTORY PLAN (night): In aida-cli-lib/src/pr_list.rs, replace the per-spec row loop with a mapping step: title IDs, then branch IDs (unchanged loose extractor), then the first spec ID in the PR body (case-sensitive uppercase ID, forge refs excluded), then the scope of a live lease riding the PR branch, else none. Unmapped PRs still get one row with spec_id None. PrListEntry.spec_id becomes Option<String> (JSON null) and gains mapping_source in {title,branch,body,lease,none}; the table shows ''—'' or ''body:TASK-1538''. gh query adds the body field; GitLab reads the MR description. Add --mapped-only to ''aida pr list'' (old filter); ''aida list pr'' keeps default all-PRs. Empty-state message only says ''with mapped specs'' under --mapped-only. Refactor GH/GL row building into pure fns over deserialized structs and add inline tests: pr_list_keeps_unmapped_pr, pr_list_maps_body_only_reference (both assert PR number appears once), plus title-mapping, lease-mapping, mapped_only filter and JSON null tests. Risks: compile-only on CI; no TOON output exists for pr list today (JSON only), so TOON is out of scope. Acceptance checked by those unit tests.'
