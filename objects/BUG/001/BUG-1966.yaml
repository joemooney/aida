title: 'Flaky: bug_1683 two_hour_live_lock_blocks_all_launch_entry_points fails under load (fixture ''aida add'' step fails)'
description: |
  Seen 2026-10-11 during lib-split run 7 r2 proofs (TASK-1538) at 7845fb3943 and 295f8bf9c7, load average ~60, two cargo test --workspace lanes in parallel. Panic at aida-cli/tests/bug_1683_live_drain_lock.rs:84 on the fixture 'add --type task ... bounded fixture' command. Unrelated to the pure-move commits under test.

  ## Further evidence (groom, 2026-10-11)
  A second failure mode appeared in /tmp/libsplit/test-plan_intent.fail1.log: panic at bug_1683_live_drain_lock.rs:228, "missed holder gate", for `queue work TASK-1 --auto-complete` run from the sibling clone. The command failed (so the unexpected-success assert passed), but its output ends after "cross-clone coordination unavailable ... proceeding" with no "a drain is already running (pid ...)" line, and the test ran for 77 s (over the 60 s warning). Under load, the launch path in the sibling clone either did not see the live drain lock or failed for another reason before the gate printed. The fixture's `ok()` helper already includes stdout and stderr in its panic, so the line-84 failure text should be captured on the next occurrence.

  ## Acceptance
  - The cause of each failure mode is named: the fixture `aida add` failure at line 84 and the missing holder-gate line at line 228.
  - If the gate can be skipped under load, that is a production bug and is fixed (a live drain lock must block every launch entry point regardless of host load), with a test that proves it. If the failure is fixture-only (for example a timeout, or a lock-holder process that has not started yet), the fixture waits for its holder deterministically instead of relying on timing.
  - The test passes 20 consecutive runs of `cargo test -p aida-cli --test bug_1683_live_drain_lock` while a second `cargo test --workspace` runs in parallel.
