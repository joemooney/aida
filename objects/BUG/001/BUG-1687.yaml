  content: 'I was able to reproduce the bug and verify that `aida list --status deferred` was failing because ''deferred'' is not a value in the RequirementStatus enum. \n\nI fixed it by:\n1. Updating `aida list`''s argument parsing in `aida-cli-lib/src/git_backend_cmd.rs` to explicitly intercept the `--status deferred` positional/flag shorthand. It now applies the deferred list-filter and bypasses the enum deserialization.\n2. In `aida show`, if `req.deferred` is true, the human output surfaces `Status: · Deferred (was <Status>)` prominently, and the TOON output emits `status: deferred` directly, so both surfaces agree and agents no longer read stale non-deferred status.\n\nAdded an integration test in `aida-cli-lib/src/tests/bug_1687_defer_status_tests.rs` covering both surfaces and the round trip.'
