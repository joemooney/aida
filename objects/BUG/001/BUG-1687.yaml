spec_id: BUG-1687
agreed_id: BUG-1687
title: A deferred spec still reports its old status, and 'aida list --status deferred' never matches it
description: |
  Found 2026-09-27 by the orchestrator seat, after it misled two separate agents in one session.

  `aida defer <ID> --until <trigger>` sets deferred = true and deferred_until, dequeues the spec, and correctly hides it from the default open lens. But it leaves the status field untouched. After deferring BUG-1679 and TASK-1533, both still report `status: needs-attention` in `aida show`, even though both are deferred with a recorded trigger and neither appears in `aida list`.

  Two concrete harms observed in one session:

  1. The orchestrator ran `aida defer` on both specs, saw the success output ("Revisit when: ...", "Dequeued: removed 1 queued row"), and reported them as deferred. An independent advisor session then read the store directly and reported the contradiction back: "BUG-1679's store status is still NeedsAttention despite a 07:30 comment claiming DEFERRED." Both agents reasoned correctly from what their own command showed them; the substrate gave two different answers to the same question.

  2. `aida list --status deferred` returns NOTHING for a spec that `aida show --json` reports as deferred = true. So there is no status-based way to list deferred work, which is exactly the query an orchestrator needs in order to honour the rule that deferral never counts toward draining the list.

  Expected: deferring a spec should either move its status to a deferred state, or `aida show` should surface the deferral prominently enough that the stale status cannot be misread. Either way `aida list --status deferred` must return deferred specs.

  Acceptance:
  1. After `aida defer <ID> --until <t>`, `aida show <ID>` does not present a status implying someone should act now (needs-attention or in-progress).
  2. `aida list --status deferred` returns every spec with deferred = true; a fixture test proves it.
  3. Un-deferring restores the prior status rather than stranding the spec; a fixture test covers the round trip.
  4. A fixture test asserts the defer path and the show/list surfaces agree on one answer.
