title: aida mailbox send has no --subject; the inbox list shows the first body line, and the body/flag combinations are easy to get wrong
description: 'Observed 2026-09-18: sending a note to the advisor took three attempts. aida mailbox send --to advisor --subject X --body-file F is rejected (no --subject); --body-file plus a positional subject is rejected (''choose exactly one mailbox body source''); the working form is --body-file alone with the subject written as the first line of the file. aida mailbox read <id> does not exist (it is inbox / thread), and thread <short-id> said ''no messages in thread'' for a message the inbox had just listed. Proposal: add --subject (stored, shown in inbox/notice), accept the short id everywhere the inbox prints it, and make the error for a wrong body-source combination show the three valid shapes. Acceptance: mailbox send --to X --subject S --body-file F works; inbox shows S; thread <8-char id> resolves; the error text lists the valid forms.'
