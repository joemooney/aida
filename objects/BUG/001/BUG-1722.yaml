title: check_portable_pack errors instead of reporting drift when an aida-* pack entry shadows an inventory skill name as a plain file
description: |
  Disclosed residual from TASK-1520's review, not fixed there because it is low-plausibility.

  `scaffolding::agent_pack::check_portable_pack` returns `Err` instead of drift when an entry under
  `.agents/skills/` whose name IS an inventory skill name exists as a plain FILE rather than a
  directory — e.g. a file literally named `.agents/skills/aida-capture`. The per-file loop then
  stats `.agents/skills/aida-capture/SKILL.md`, the OS answers `ENOTDIR` (os error 20), which is not
  `ErrorKind::NotFound`, so the `Err(e) => return Err(e)` arm propagates it. `make check-templates`
  reports an IO error rather than naming the drift, and `sync_portable_pack` fails the same way at
  `create_dir_all`.

  `find_orphans` cannot catch it either: the name is in the inventory, so the `!skills.contains`
  branch is skipped, and `entry.file_type()?.is_dir()` is false, so the orphan walk is skipped too.

  Not fixed in TASK-1520 because no AIDA code path creates such a file — the retired flat form was
  `<name>.md`, not a bare `<name>` — so it takes a hand-made file to reach. It is still a case where
  the check's own error handling hides the finding it exists to report, and the fix is small:
  classify a non-directory `aida-*` entry that shadows an inventory skill name as
  `PackDrift::Orphan` in `find_orphans`, and have `sync_portable_pack` remove it before writing.

  A test would plant that file and assert the drift kind rather than an `Err`.
