    | REPORTED → RESOLVED{ACCEPTED(i), REWOUND_AFTER_ACCEPT, REWOUND, PENDING, NOT_IN_TIP, UNKNOWN} | T fetch (or its failure); per-candidate plus aggregate; `RemoteObservation` | `store_cas::resolve_lineage` |
    | PENDING → SENT (same C, same admission) | §9.4 re-push, or §10.7 resolve-by-repush | `store_cas::push_candidate` |
    | NOT_IN_TIP → PLANNED(k+1) | Live op only, within the family limit | Family retry loop through the owner |
    | ACCEPTED(i) → INSTALL_PLANNED / SUPERSEDED / INCOMPLETE | §11.1 steps 1–4 | `store_cas::validate_install` |
    | INSTALL_PLANNED → INSTALLED | §11.1 steps 5–8 COMMIT; `InstallVerification` | Common SERVICE import publication |
    | INSTALLED → PEER_DELIVERED / ALREADY_DELIVERED / NOTIFICATION_CONFLICT / NOT_DELIVERED (row 16) | §13.3 | `store_cas::deliver_peer` |
    | any terminal → SETTLED_* | `Settlement`; owned `.keep` removed; P refs cleaned | `store_cas::settle` |
    | REWOUND / REWOUND_AFTER_ACCEPT → BLOCKED (key) | Retained; no automatic settlement (§10.8) | `store_cas::block` |
    | two INDETERMINATE with unchanged T / UNKNOWN → UNKNOWN_RETAINED (open) | Durable; settles by later evidence | `store_cas::retain_unknown` |
    | (owner dead) ADMITTED…INSTALL_PLANNED → recovery | HOME released for the network, then revalidated; never re-pushes, builds or allocates | `store_cas::recover` within common recovery |

    # 18. Witnesses (ALL PROPOSED, NONE RUN)

    **Common conditions for every witness.**
    - **Environment.** Real Git 2.43.0 with a pinned executable digest. Native-profile origins: local bare repositories with an owned receive-pack wrapper (fixture only) that can update and then drop the status, delay, or reject. Helper-profile origins: a local smart-HTTP fixture (`git http-backend` behind an owned HTTP server) that can update and then drop the response, delay, or decline.
    - **Entrypoints and identity.** Real production entrypoints AND public core routes; fake HOME/AIDA_HOME; stripped identity.
    - **Snapshots** before, at each barrier, and after:
      - origin and local refs, reflogs, index and worktree;
      - store bytes and history;
      - roster and grants;
      - node.toml;
      - blocks and dispenser;
      - own and peer markers;
      - P refs and P identity;
      - kept packs;
      - receipts and observation chains;
      - the HOME index;
      - lock inodes.
    - **Safety cases.** Safe state is read after lock acquisition. Dirty and pre-existing rebase states are preserved. Sibling/symlink same-root checks. Progress on a distinct store.
    - **Nonvacuity.** Every negative has a matching healthy positive and a scratch guard removal that shows an executed assertion failure, followed by restoration and a pass.

    **Witnesses:**

    1. **W1-a `store_cas_porcelain_native_decoder`.**
       - Wrapper updates, then kills status → `[remote failure]` → INDETERMINATE → T ⊒ C → ACCEPTED → one install.
       - Paired: client non-ff; `[remote rejected]` (pre-receive decline) → SERVER_REJECTED_REPORTED; ` ` and `*` with `Done`; `=` adoption; pre-push refusal (no line) → INDETERMINATE → the two-unchanged stop.
       - Grammar: the `To <url>` header matches the profile; a missing `Done` → INDETERMINATE; two ref-status lines → INDETERMINATE.
       - Pins the `<from>` form.
       - Asserts no "not accepted" text derived from the tip alone.
       - Guard removal: trust `!` → it reports a false rejection (failure).
    2. **W1-h `store_cas_porcelain_http_helper`.**
       - Smart-HTTP server updates then drops the response → INDETERMINATE (including any `[remote rejected] (expecting report)` form) → ACCEPTED by lineage.
       - Paired: healthy fast-forward with `Done`; declined update → INDETERMINATE → T == R → re-push → INDETERMINATE again → UNKNOWN_RETAINED (no spin); helper killed mid-push → INDETERMINATE.
       - Pins the helper `To`/`Done` constants.
       - Guard removal: map helper `[remote rejected]` to rejected → the accepted case is misreported (failure).
    3. **W1-b `store_cas_per_candidate_lineage`.**
       - Delayed C_1 against C_2: exactly one lands and is adopted; no second range or id.
       - Mixed bases (C_1 on R_1, C_2 on R_2 ≠ R_1) → the defined aggregate.
       - `ok` then a peer force-rewind → REWOUND_AFTER_ACCEPT, BLOCKED, no second range.
       - Squash epoch → REWOUND. Restore epoch (O ⊐ R) → ACCEPTED or NOT_IN_TIP per §9.5. Restore to exactly R → PENDING.
       - Fetch failure after `ok` → UNKNOWN, never Acquired or installed.
       - Lost status with T == R → re-push of the SAME C → `=` adoption, exactly one lineage entry.
       - Guard removal: drop the report-class join → the force-rewind case allocates a second range (executed failure).
    4. **W2 `store_cas_object_lifetime_continuous`.**
       - `gc --prune=now`, `repack -a -d` and aggressive repack at barriers: after the P seed, after the kept-pack install, during the push, before install. Push and install SUCCEED. The kept pack survives repack. `git log --all` never shows C. Settlement removes only the owned `.keep` and never the `.pack`/`.idx`. Objects stay reachable after install.
