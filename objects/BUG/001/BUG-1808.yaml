    # 5. Notation and one-operation order

    **Notation.**

    | Symbol | Meaning |
    |---|---|
    | G | Shared git common dir (`git -C <store> rev-parse --git-common-dir`; here `/home/joe/ai/aida/.git`) |
    | W | Canonical store worktree (`.aida-store`) |
    | b | Store branch (`aida-store`) |
    | P | Owner-private object repository (§6.1) |
    | S_k | v5 sealed construction gitdir for attempt k |
    | L_k | Captured local tip |
    | R_k | Fetched origin tip |
    | M_k | merge-base(L_k, R_k), computed in P |
    | B_k | L_k rebased onto R_k |
    | C_k | Candidate |
    | A_k | Origin's advertised old value at push time. Always R_k or an ancestor of R_k (§9.1) |
    | T | A freshly observed origin tip |
    | H | Current local canonical tip |
    | K | Operation key |

    **One operation (attempt k).** Each "local" step is inside `PublicationGuard::enter(home)` with HOME recovery first, then REPO, then STORE. No AIDA lock is held across any network spawn, the pre-push hook or a wait.

    | Step | Action | Locks |
    |---|---|---|
    | 0 PLAN | Resolve W, G, b and the origin configuration. No origin → the family's no-origin policy (R-3 / L) with no network. Resolve EndpointProfile, PrePushProfile and PTransportProfile (§7) and refuse on any mismatch. Seed or refresh P outside locks (§6.2). A peer-capture step for hijack (§13.2) runs here, holding the peer lock alone. | none, or peer STORE alone |
    | 1 JOIN + CAPTURE | Enumerate open admissions for K from the HOME index (§10.6). Run `ensure_store_write_safe` AFTER acquiring STORE. Capture L (incremental fetch into P, §6.2). Record local before-images. | HOME → REPO → STORE (finite, local) |
    | 1n NETWORK | Release all locks. Fetch R into P (§6.3). If open same-key admissions exist, this fetch is also their T (§10.7). Failure → the family's unreachable policy; no admission. | none |
    | 1j RESOLVE JOIN | Reacquire HOME → REPO → STORE and revalidate. Apply the §10.7 join outcome: adopt, settle, re-push the same C (after dropping locks), or refuse. | HOME → REPO → STORE |
    | 2 PREPARE | Build B and the FamilyView in S_k from P. `decide`: NoOp/Refuse returns with no shared effect; Adopt goes to step 7; Apply builds C through a v5 `PreparedGitStep`. Pin B and C into P (§6.4). | none (v5 pump, no AIDA locks) |
    | 3 ADMIT | The S3 recheck, then the ADMISSION publication: journal, the kept-pack FileEffects, COMMIT, a receipt marked `remote-unsettled`, readback (§10.1). | HOME → REPO → STORE |
    | 4 SEND | Re-resolve and compare the profiles. Run the closure verification (§6.5). Append a durable `PossibleExecution` observation. Spawn the push (§7.4). | none, except brief HOME for the observation append (§10.4) |
    | 5 DECODE + OBSERVE | Decode (§8), append `SendOutcome`, fetch T into P, resolve each candidate and the aggregate (§9), append `RemoteObservation`. | none for the network; HOME for the appends |
    | 6 RETRY | Per §9.4, within the family's existing limit. | — |
    | 7 INSTALL | Only for ACCEPTED(i): §11, as a common SERVICE publication. | HOME → REPO → STORE (→ `blocks.lock`) |
    | 8 PEER | Hijack only, after the install receipt: delivery (§13.3). | HOME → peer STORE alone |
    | 9 SETTLE | Settlement publication: remove the owned `.keep` files; idempotent cleanup of P refs (§10.5). | HOME → REPO → STORE |

    Every attempt yields a new immutable C_k. Nothing is amended, reset to L/B/C, restored from an old snapshot, pushed by branch name or wildcard, forced or leased.

    # 6. Object lifetime (F5, F6, amendment A4)

    ## 6.1 P location and identity

    - **Path.** `<G>/aida-store-cas/<store-key>/p.git`, a bare repository with mode 0700. `store-key` = hex SHA-256 of (canonical W path, `b`, device/inode of G). One P per store.
    - **Recorded identity.** The canonical path, plus device/inode of `p.git`, `p.git/objects` and `p.git/refs`, are recorded in every admission (§10.3).
    - **Missing or replaced P.** If P is missing, or its identity differs, at any later step that references an open admission, that admission is RECOVERY-BLOCKED(P identity) and is never treated as success or rejection. A new operation recreates P only when NO open admission references the old identity. Otherwise it refuses with "unsettled store-CAS admissions reference a missing private repository".
    - **Generated P config** (repository scope; written once, then verified at every use):
      - `core.bare=true`;
      - `core.hooksPath=<p.git>/hooks-empty` (an empty directory, mode 0500);
      - `core.fsync=objects,reference` and `core.fsyncMethod=fsync`;
      - `gc.auto=0` and `maintenance.auto=false` (P is pruned only by explicit settlement cleanup);
      - `HEAD` → `refs/heads/<b>` (unborn, for `onbranch:` parity);
      - `remote.origin.url` = the store's RAW (pre-rewrite) local `remote.origin.url` value, for `hasconfig:remote.*.url:` parity only, never used by name;
      - the store's repository-scope transport-key subset (§7.2) copied verbatim.
    - P never holds a working tree, an index or a hook.

    ## 6.2 Seeding and capture of L

    - **Seed (outside all locks).** `git --git-dir=P -c core.hooksPath=<empty> fetch --no-tags --no-write-fetch-head --no-recurse-submodules <G> +refs/heads/<b>:refs/cas/seed`. This is a local transport with no network. G's upload-pack runs no repository hooks (`uploadpack.packObjectsHook` is honored only from non-repository scopes, which are included in the profile digest, §7.2). The seed is an advisory snapshot, not authority.
    - **Capture (under HOME → REPO → STORE).** Read L = `git -C W rev-parse --verify refs/heads/<b>^{commit}`. Then `git --git-dir=P … fetch <G> refs/heads/<b>:refs/cas/<op>/<k>/L` (incremental beyond the seed). Verify that P's ref equals L, and that the fetch's own connectivity check passed.
    - **STORE-delta bound.** If the incremental delta exceeds 4096 commits or 64 MiB, release STORE, reseed, and retry the capture once. A second excess refuses before admission with "store capture delta too large under lock".

    ## 6.3 Remote observations into P

    R and every T are fetched with no AIDA locks: `git --git-dir=P -c core.hooksPath=<empty> fetch --no-tags --no-write-fetch-head <fetch-url> refs/heads/<b>:refs/cas/<op>/<k>/{R|T<n>}`. The command runs with the verified PTransportProfile and a deadline. Pins exist from the moment the fetch completes. G is never touched by these fetches.

    ## 6.4 Construction and pinning of B and C

    - S_k (v5) is populated by hardlinking P's immutable pack and loose files (copying across filesystems). The {L, R} closure is then verified with the v5 bounded object reader before any Git runs in S_k. No alternates are used.
    - B and C are built by the v5 SERVICE step.
    - `git --git-dir=P fetch <S_k> <C>:refs/cas/<op>/<k>/C` (and likewise for B). S_k is destroyed (v5 domain shutdown) only after P's refs exist.
    - The **original→copy map** `{(o, c) : o ∈ M_k..L_k, c ∈ R_k..B_k}` is recorded at ADMISSION. It is produced by the sealed rebase step, which reports each picked original and its rewritten commit (§11.2).

    ## 6.5 Kept transport pack and closure verification

    **Pack contents.** In P: `git pack-objects --revs --stdout` over the input `C_k`, `L_k`, `^M_k`. The pack is not thin and is self-contained.

    **Private build.**
    - Write it to `<p.git>/staging/<op>-<k>/`.
    - Index it in a private empty bare repository there with `index-pack --stdin --rev-index`. `.rev` is written because `pack.writeReverseIndex` defaults to true in 2.43 (local manual).
    - Write the `.keep` bytes ourselves: `aida-store-cas <store-key> <op> <k> <admission-tx>\n`.
    - Verify (index-pack checksum, and the object count equals `rev-list --count --objects C L ^M` in P).
    - Record the exact bytes and modes of `pack-<h>.{keep,pack,rev,idx}`. Mode 0444 passes the 6a1733 owner-read rule.

    **Install.** Inside ADMISSION (§10.1), as four `FileEffect`s on `TargetRoot::GitCommonDir` with relative paths `objects/pack/pack-<h>.<ext>`. Before-images are exact (Absent, or identical bytes if a byte-identical pack already exists). Order: **`.keep` → `.pack` → `.rev` → `.idx`**, each fsynced, each followed by a directory fsync. Git finds a pack only through its `.idx`, so no concurrent repack can see an index without its keep. Git 2.43 repack and gc never delete `.keep` packs, and `gc.autoPackLimit` and `multi-pack-index expire` exempt them (manuals, as verified by the V2 review receipt).

    **Budgets.** At most 64 MiB per kept pack. At most 1 GiB of owned kept packs per store. Exceeding either refuses before admission.

    **Settlement** removes ONLY the owned `.keep` file: a FileEffect from before=Regular(the exact keep bytes) to after=Absent, applied only if the current bytes equal it, and otherwise preserved and reported. It never removes `.pack`, `.rev` or `.idx`. Objects now reachable from canonical refs must persist; normal gc and repack later consolidate the now-unkept pack.

    **Closure verification `V(X; Y)`** runs two checks in G, both with a deadline:
    - (i) `git --git-dir=G rev-list --objects --missing=error X --not Y` proves the objects new relative to Y. `--missing=error` is the default action per git-rev-list(1).
    - (ii) `git --git-dir=G rev-list --objects --missing=error --no-walk Y` walks Y's complete snapshot (here about 7176 blobs plus trees).

    Check (ii) exists because this design does not rely on (i) reading Y's trees to mark edges; that internal behavior is not grounded here.
    - It runs immediately before EVERY push spawn (including re-push) as `V(C_k, L_k; M_k)`.
    - It runs at install, after the T-pack import, as `V(T; M′)`.
    - Failure → RECOVERY-BLOCKED(closure), retained. Never a rejection, never an acceptance.

    **Definition of M′.** M′ = merge-base(T, L_i), computed in P, where i is the accepted candidate's attempt. M′ is an ancestor of L_i, so closure(M′) is pinned by the same reachability argument (§6.6).

    **The T import at install** packs `T ^M′` from P in the same way (private build, exact images, the same four-file order, kept until settlement).

    ## 6.6 Why closure(M) remains present, and the fence (F6, corrected)

    M_k is an ancestor of L_k. L_k is an ancestor of H at ADMISSION (S3 recheck). In the shared store, M's objects therefore stay reachable from `refs/heads/<b>` and from its reflog (`core.logAllRefUpdates=true`) unless something moves the branch off M's history AND those references expire.

    Enumeration of AIDA paths at bf652209 that rewrite or reset refs or prune (S-F4):

    | Path (anchor) | Effect on the store branch | M-unreferencing? | Disposition while any admission on this store is open |
    |---|---|---|---|
    | `squash_orphan_to_snapshot` (`git_ops.rs:2548`, via `store_cmd.rs:136`) | Moves `b` to a parentless snapshot, but first creates and verifies `refs/heads/aida-store-pre-squash-<ts>` at the old HEAD. The reflog also keeps it. | No (the backup branch and the reflog retain M) | **Fenced**: refuses with "unsettled store-CAS admissions; compaction would invalidate the local base". This is required for §11/§9, not for objects. |
