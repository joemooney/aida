    | Current user+mount profile, no PID unshare | O -> W -> S -> B. W uses exact resolved mount policy, creates user/mount namespaces, drops setup capabilities, then descriptor-execs sealed S. S is a dedicated single-thread local subreaper and forks/clone3s B through existing transport. | W and S are setup/creating processes, never vendor identity. Pin unprivileged UID/GID mapping, group policy, namespace inode FDs and mount plan. O independently verifies host facts before accepting READY. |
