    | F4 | No cross-invocation lineage and no bounded settlement | Open admissions are keyed by K = (store, record domain, subject digest). A join runs BEFORE any decision. ACCEPTED is adopted; PENDING is resolved by re-pushing the same C when T == R; UNKNOWN and REWOUND refuse with a named reason. Later operations settle earlier ones. Per-key and per-store caps apply. Bounded settlement is evidence-driven. The REWOUND and REWOUND_AFTER_ACCEPT schedules are UNSUPPORTED production joins and the key stays BLOCKED. No expiry, no second id or range. | §10.6–§10.8 |
    | F5 | ADMISSION atomicity, discovery, P placement and pack effect were unspecified | Discovery is authoritative from the HOME publication record (a REQUIRED open-admission index). There are NO locator refs. A crash-point table is given. P lives at a concrete `GitCommonDir` subpath with recorded device/inode; missing or replaced gives RECOVERY-BLOCKED. P refs are outside the journal, with explicit idempotent cleanup. The kept pack is built and verified privately and installed as exact FileEffects in the order `.keep` → `.pack` → `.rev` → `.idx`. Recovery releases HOME for the network and then revalidates. M′ is defined. There is ONE `RemoteObservation` mapping: a seventh kind, a REQUIRED common extension. InstallVerification is not overloaded. | §6, §10 |
