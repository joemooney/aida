- id: 01a11990-553d-7f80-bcf6-21f9b3e06bfe
  author: codex/authority-sketch-v4-author
  content: |
    SKETCH (awaiting advisor signoff): BUG-1808 — v4 normative addendum, finite hook-safe publication

    Author: Codex authority-sketch-v4-author, native thread 01a11985-64f1-7150-96d8-e92930acab65, separate Joe-assigned REVISION AUTHOR, 2026-10-07 America/Phoenix. Observed AIDA_SESSION_ID absent. This identifies this author, not an authenticated review grant or independent approval. Design only; final authority-sensitive merge is Joe's. Named APIs/records below are proposed, not baseline capabilities or executed-test claims.

    ## Amendment target and precedence

    Amends ONLY BUG-1808 v3 canonical comment 01a1197c-257b-72d3-a98b-0509656b8bf7, exact UTF-8 body/file BUG-1808-sketch-v3.md, 60505 bytes, SHA256 d9d115040cc34d7dddec7826b1aacc24099c2fcd03f9cc4f010702253fe091de. Source baseline: 199e591b07aa76a59cd34f0a41946f918501f6ba. Read actual INDEPENDENT_SKETCH_V3_SIGNOFF.md and its canonical BUG-1808 verdict 01a11983-323f-7a13-85b7-87635929a4e2, not merely SKETCH_V3_READY.md.

    Earlier policy A–E and all binding v1/v2/v3 decisions win over author prose. Subject to those decisions, this addendum replaces only the clauses listed here; all unaffected v3 text, witness matrices, strict refusal snapshots, containment, assignment, bootstrap, history and receipt mechanisms remain normative. This addendum supplies no signoff and does not resolve a conflict by reducing acceptance.

    - In “Discovery and lock order — no lock upgrades”, replace the sentence starting “Pass typed guard into nested library calls; do not reacquire non-reentrant home lock in a hook/callee…” with the executable callback contract below. Typed guards remain in-process only. Git locks stay last; hooks never enter PublicationGuard or lower AIDA locks.
    - In P1, P3, P4 (“Complete ref/working-file installs idempotently…”), ABORT and “Recovery and durable retention”, every Git-producing action uses GitPublicationAdapter below. Their decision, restore/roll-forward, current-preimage, no-release and receipt rules remain unchanged. “Already-new” is accepted only by the recovery predicates below, never merely because Git exited zero.
    - In the enlistment table's authority/roster and canonical-store rows, replace direct guarded calls to mutating shell Git helpers with prepared store edits and GitPublicationAdapter; ordinary supported team/store operations remain positive supported cases. The broad enlistment list alone is not an implementation.
    - In “One assignment model…” replace “Use BUG-1802's canonical repo_key…” with BUG-1808 ownership of that common schema. In the standalone reviewer/phase rows, “prepare … review-start expectation” means identity/target assignment in BUG-1808; BUG-1802 later supplies its policy START extension. In shared L0, replace “…even if implemented separately” with the one-way order below.

    BUG-1808 FIRST owns, implements and independently verifies LaunchPublisher, PublicationGuard/coordinator, assignment/activation schema, retained receipts and this callback transport in a shared core-accessible module. CLI LaunchPublisher uses that module; core git/store/team code does not import CLI or start another launcher. BUG-1802 subsequently consumes the same types and transport for work evidence/START/verdict enforcement. BUG-1808 launch and reviewer identity binding require no BUG-1802 coverage policy. No reciprocal prerequisite, duplicate grant issuer, launcher or schema. Either addendum can receive its own design verdict; implementation order is not a status/queue/relationship edit.

    ## One transport and its executable owner

    Choose ONE mechanism: parent-serviced private local socket, with parent-written bounded durable callback attachments. There is no hook-written global ledger or alternative env bypass. Proposed shared `git_publication::{GitPublicationAdapter, CallbackPump, PreparedGitStep, HookClient}`; `aida internal git-operation-callback` is a minimal transport entrypoint dispatched BEFORE normal project/store/cache/authority discovery. Production pre-commit/pre-rebase/reference-transaction/post-commit/post-rewrite hooks invoke it; commit-message and other installed AIDA hook callbacks that consult substrate state use the same transport. None may fall through to normal CLI discovery under Git locks. Internal advisor-code/locking/scope gate calls in those hooks use this transport too, never a normal home-locking CLI invocation.

    The calling owner (LaunchPublisher, ordinary store/team publisher, work-operation parent, or recovery owner) creates a 0700 operation directory and 0600 Unix socket beneath its existing private operation/publication staging. Socket path is only a locator. HookClient obtains OS peer credentials for the server; server obtains hook peer PID/UID, boot/start identity and ancestry to the exact waiting-bootstrap-bound Git child. Parent validates executable identity and allowed shell-hook-to-HookClient chain, canonical cwd/gitdir/common-dir, and the production hook digest/version pinned before spawn. A random per-attempt capability is delivered to the Git bootstrap on its inherited private descriptor; descendants inherit that descriptor. Capability possession alone is insufficient: exact live Git ancestry and peer process identity are mandatory. Environment op/path values cannot authenticate or select a different owner. A sibling process with copied environment/UUID, stale PID, foreign repo, wrong hook executable or replayed attempt is refused. This stays within A–E's local supported-workflow threat model, not hostile same-UID tamper resistance. Unsupported OS peer adapters retain v3's before-setup refusal; do not remove containment.

    `PreparedGitStep` is durably part of the existing publication journal or work-operation attachment set, containing:

    `{version, publication_id OR work_op_id, step_uuid, attempt_uuid, journal_generation/digest, repo_key, actual_gitdir_identity, logical_worktree_identity, private_execution_root_identity?, owner_pid/boot/start, git_pid/boot/start, executable/argv_digest, hook_bundle_digest, gate_snapshot_digest, operation_class, exact_ref_targets[], input_objects_digest, before_index_hash, before_worktree_manifest_hash, allowed_effect_manifest_digest, callback_budget, deadline}`.

    Each exact target includes fully qualified ref name (or per-worktree HEAD identity), symbolic referent where applicable, full old/new OIDs including explicit zero for create/delete, and object format. Service-install old/new pairs are fully fixed before child release. Work construction may not know new OIDs until Git creates objects: prepared callback proposes exact tuples; the parent validates them against that step's finite ref-name set, current per-step expected old OIDs, immutable command/source/tree/parent grammar, then fsyncs a bind-once subrecord containing the FULL tuple set before ACK. No wildcard ref grant, prefix-only namespace trust, or “whatever Git changed” authorization. A follow-on transaction advances the expected-old map only from the prior durable committed observation. A transaction mixing service and reviewed-code tuples fails unless all tuples are separately typed/authorized in this same step.

    Callback identities add `{kind, phase, transaction_sequence, tuple_set_digest, payload_digest, peer_pid/boot/start, request_sequence}`. `prepared`, `committed`, `aborted` refer to the identical tuple set; duplicate identical messages are idempotent, conflicting duplicates fail. `post-rewrite` additionally binds ordered full old/new object pairs, command kind and map count/digest. `post-commit` binds commit/tree/parents; pre-commit binds the finalized prepared index tree and gate results. No callback can publish FINAL, grants, manifests, queues, closure or COMMIT.

    The owner runs an event loop polling child exit and servicing the socket; it MUST NOT call blocking `Command::status`/`wait` while callbacks are pending. CallbackPump executes only validation against already loaded immutable context, bounded read-only Git-object decoding, and writes to its preopened exclusive operation attachment directory. It never calls PublicationGuard, Storage, queue/roster readers, episode/verdict locks, a mutating Git command, or a subprocess requiring those locks. It cannot recursively perform publication. The parent may already hold home/repo guards; no new acquisition occurs in the pump. The hook sends evidence and waits for a bounded ACK, then exits. Git ref/index locks therefore have no edge back to home/repo/episode locks.

    Bounds are explicit per step: at most 5 seconds per callback exchange after connection, 1 MiB per frame, 4096 ref tuples per ref transaction, 64 MiB total attachments, and a predeclared finite operation deadline (default 120 seconds for local publication steps). Large rewrite maps stream numbered frames, with a final count/digest; no partial map counts as complete. Planner checks source/effect size and may select larger finite budgets before mutation when needed, with a hard configured ceiling, never unbounded growth during callbacks. Overflow/timeout/EOF is a refusal or interrupted operation, never permissive fallback. It is not acceptable to reject an existing required positive fixture by selecting an artificially small budget. Disk/fsync failure gives no prepared ACK. A hung I/O operation cannot promise wall-clock progress under a failed kernel/device; process watchdog refusal bounds cover functioning OS/filesystem assumptions and preserve a blocking journal on storage failure.

    Before ACK, parent writes `observations/<sequence>.tmp`, fsyncs it, renames to immutable numbered content-hashed record, then fsyncs the directory. Record contains the authenticated peer binding and request/decision, chained to PreparedGitStep. Only this parent writes it; hooks stage evidence through the channel. A torn temp file is not evidence. Parent logs a grant of prepared permission BEFORE sending ACK; permission is not proof Git committed. Committed/aborted receipt and rewrite-map end are distinct required observations. ACK loss permits only identical retry; each callback kind is admitted only in its expected phase. The prepared journal names the exclusive observation directory, step and finite sequence budget before Git release. Recovery reads only that bounded namespace, validates the hash chain and expected terminal records, and never scans other episodes. Final receipt/manifest retains the exact observation-set digest; newly generated immutable journal generations include it before retirement. Keep these bounded attachments with the owning manifest or committed publication receipt until its consumers no longer require them; no second home-global provenance table.

    ## Gate timing, formatting and effects

    Baseline pre-commit is not a pure observer: it calls AIDA gates and runs cargo fmt/restaging. Preserve gate semantics, move mutations to owner-controlled PRIVATE preparation. `prepare_git_contents` reproduces requested staging (`aida commit -a` includes tracked changes), runs the existing optional formatting preparation on an isolated checkout/index, captures every formatter-touched path, and seals final tree T. Preserve warn-only formatting/toolchain behavior; failure is not mislabeled a successful format. Unstaged/untracked preimages and ownership are retained; final formatting effects cannot overwrite concurrently changed files.

    `evaluate_prepared_integrity` executes the existing advisor-code, locking, worktree-scope, ignored-new-file, staged-doc-provenance and applicable commit-message checks over T and its exact diff/parents/message, with logical original worktree/actor and pinned policy/config/store snapshots. Preserve existing warn versus enforce semantics and store-specific applicability. Store bulk-write checks use the authenticated StoreWriteGuard owner/context, not the mere presence of AIDA_STORE_WRITE_GUARD. This design does not set AIDA_ALLOW_INTERMEDIATE, AIDA_ALLOW_ADVISOR_CODE, no-verify or a global hook-ignore switch to gain passage.

    Timing: initial private preparation; re-evaluate against current locked read-set at P2 before installation; production pre-commit requests the same pure evaluation over the exact private index tree immediately before Git commit. Parent rejects a changed tree/snapshot instead of blessing it. After any formatter change, gate evaluation uses the FINAL tree, not a prior tree. Persist a GateReceipt binding T, input diff/message, original logical root, actor, gate implementation/bundle digest and policy snapshot. P4 requires these receipts and final read-set equality. A service `update-ref` does not run pre-commit: it must consume the exact retained GateReceipt for its preconstructed commit, plus its own reference-transaction callbacks. Recovery verifies those receipts over immutable objects; it does not rerun commit-making or formatting against changing contents. Missing gate proof before COMMIT aborts; missing retained proof after COMMIT blocks recovery. Hooks remain enabled, and the production hook dispatch must enforce receipt/evidence collection even on the existing store early-return path. Absence or stale hook support is detected before mutation, not ignored.

    Every actual ref/index/worktree effect is journaled BEFORE install: refs/packed-refs as applicable and exact symbolic HEAD targets; reflogs old and final bytes; index bytes and owned lock paths; tracked and affected untracked path bytes/modes/absence; formatter changes; worktree admin entries/gitdir pointer; ORIG_HEAD/FETCH_HEAD/MERGE_HEAD and sequencer/rebase state when used; retention refs and object closure; hook sentinel/telemetry outputs. Use private staging for construction, map physical private roots to pinned logical roots for gates. Gate/telemetry side effects become buffered journal outputs; hooks cannot append shared files. No hook can run the ordinary store mutation path as part of logging. Post-COMMIT event/sentinel publication is idempotent. For live ref installation, fix the committer identity/time and reflog message in PreparedGitStep, construct the expected reflog append bytes from the locked preimage, and retain them before executing update-ref with explicit expected-old values. Recovery restores/verifies exact bytes; it does not append a second synthetic reversal entry. Private construction retains its own ref/reflog results before any live promotion. Ref backend-specific layout is enumerated by the adapter; an unknown backend cannot be labeled supported until its finite effects adapter exists. This does not excuse missing support for the project's existing positive cases.

    ## Class-specific producers, consumers and ordering

    | Class | Exact owner and permitted effects |
    | --- | --- |
    | Reviewed code | `commit::run_git_commit`, PR/cascade/rebase wrappers and BUG-1802 work-operation parent own PENDING and source evidence; transport never invents an implementation actor. Construction runs privately, with logical-worktree gates, then exact ref/index/worktree install uses journaled expected-old transitions. All final evidence is parent-owned. |
    | Store service commit | `Storage` staged mutation -> `git_backend::{auto_commit,auto_commit_paths,update_spec_atomically_with_subject,bulk_update_atomically,record_op}` -> shared adapter. Only planned object YAML/history/oplog/registry paths; old store head, full resulting tree and history are pinned. No code-episode authorship is inferred for the service identity. Errors propagate; current best-effort swallowed commit errors cannot report successful publication. |
    | Team/roster service commit | `team::{set_allowed_seats_cas,update_seats_cas,unset_role_cas}` stages its exact roster transform on current locked store state. Existing human/seat authority floor remains; socket authentication supplies no authority. Same store commit adapter and GateReceipt, not nested ordinary `git_ops::commit` while home is held. |
    | Branch creation / retention | LaunchPublisher or evidence-retention owner installs explicitly named `refs/heads/<selected>` create-only at pinned base, and exact `refs/aida/retained/<publication-or-operation>/<object-id>` pins. Class is a registered producer plus typed exact effects, not the ref name alone. Creating a feature branch is not a commit witness; changing an existing feature head requires work-operation policy. Delete only owned temporary refs with expected OID; referenced evidence pins survive cleanup. |
    | Store pull/rebase/structural merge | `git_ops::{fetch_rebase_target,pull_rebase,pull_rebase_auto_merge}` prepare remote objects and exact merged store history privately, preserve TASK-1604's no-shared-FETCH_HEAD property, then publish via service adapter under home/store guards. Include any private-ref create/delete in the journal when promoted. A merge may not erase peer history/roster fields. |
    | Recovery | `PublicationGuard::recover_active` becomes the new parent of exact recovery Git children, as specified below; it consumes durable publication decision and effects, not dead process credentials. |

    Supported ordinary team/store writes enter home before store/queue locks, prepare privately outside the held guard when network is needed, and recheck/rebuild from current locked preimages at P2. They use the SAME publication service with no launch assignment and no vendor. Team remote CAS retry must not execute baseline `reset --hard HEAD~1`: after a rejected push retain the committed local history, privately reconcile remote peer history, and publish a new guarded store result; retry push outside the guard with explicit expected remote identity. Failed/uncertain push never rolls local committed history back. Bounded retry exhaustion reports unsynchronized committed local state, not a false unchanged-state launch refusal. Network publication is not part of pickup authorization; pickup still does no hidden push/pull. This replaces an unsafe nested mutation without removing ordinary team/store success.

    Ordinary work parent publishes its durable PENDING/effect reservation under home/repo/episode guards, then releases AIDA locks during private Git execution. A guarded same-repo writer checks reservations BEFORE Git/low locks and refuses boundedly if it would change the reserved refs/index/worktree; it cannot wait holding home for that parent to finish. Unrelated home/other-repo work may proceed. Parent callback pump uses immutable preparation and no shared locks; completion reacquires home first and revalidates read-set/authority. During actual shared install, parent holds ordered guards and pumps callbacks. Thus both ordinary and P4/recovery Git share one transport, with no reversed acquisition. Ordinary code PENDING blocks BUG-1802 record/ship even when home is momentarily free; no new head is usable merely because a callback arrived. Service-only publication operates without that later review consumer.

    ## Parent death and recovery

    Before a prepared ACK, dead/missing owner gives callback EOF/timeout and nonzero prepared/pre-commit response. After an ACK, Git may have committed before parent death; do not claim nonexecution. New owner first acquires home and validates the coordinator/root/journal as in v3; if the bound old Git child remains live, it must settle or be terminated/reaped using PID/start identity before recovery writes. Bounded inability to establish quiescence refuses; never delete a possibly live Git lock or steal another process's operation. Callback code never tries to recover home itself.

    Recovery creates a NEW recovery step/attempt with new socket/child binding, naming original publication ID, exact decision digest, current validated before/after state and required remaining transitions. It fsyncs that attempt before release. It can service production hooks while retaining home, using immutable journal/gate context exactly like the original parent. Old channel nonces/peer identities are never reused. New service callbacks are recovery observations, not fabricated old committed callbacks or code authorship.

    - PREPARED/no COMMIT: stop unreleased bootstrap and Git, reverse only journaled installed effects with current-equals-before/after predicates, using this callback adapter for ref restoration. Restore exact reflog/history bytes rather than append compensating history. Clean only owned locks/private files after quiescence. Existing v3 exact rollback and missing-A refusal remain.
    - COMMIT: validate full object closure, gate receipts and exact ref/index/worktree before/after predicates; finish missing service installs idempotently. Missing original committed callback can be resolved for a SERVICE install by durable COMMIT + exact expected state + fresh authenticated recovery observation (or a read-only already-installed verification recorded by recovery). It does not produce a work witness. Never redo a completed update just to make a missing callback, duplicate a reflog/event, roll back committed setup or release/respawn vendor during recovery.
    - Reviewed WORK: callback attachments complete and actual resulting state matching permits parent/recovery final validation under episode locks. A missing rewrite map or uncertain changed source stays PENDING/GAP, even if a service publication can finish installing bytes. Successful Git exit, a matching final tree or a newer frontier cannot replace absent source observations. Only proved unchanged exact preimages with dead Git and no unexplained transitions may ABORT. No new grant clears a sticky gap.
    - Torn attachment is ignored as evidence; acknowledged prepared/complete-map records are durable. Missing required records never get synthesized from reflog/email/current head. Missing/corrupt journal, receipt or root retains home recovery refusal per v3. No release of home around provisional installs to let a hook proceed.



    Git callback edge cases are part of this contract: the installed githooks(5) reference-transaction contract does not cover symbolic-ref changes and emits no aborted callback when prepared itself returns nonzero. Symbolic HEAD/admin changes therefore use explicit owner-journaled before/after file/target verification, not an invented hook receipt. A refused prepared request plus exact unchanged state/dead child is a legitimate abort without an aborted callback; absent committed evidence after an allowed prepared transition remains uncertain. A hook's all-zero old OID can mean an unconstrained update, not just creation. Preserve raw callback old separately from the adapter's pinned effective old OID; reject unconstrained updates to shared existing refs and use expected-old CAS there. Private Git-generated unconstrained transitions may be observed only against the sealed private starting-ref map with no other writer, retaining both values. Never reinterpret raw zero as proof of shared absence. These details are verified in the installed Git manual, not inferred from v3.

    ## Source grounding and required real-entrypoint witnesses

    Verified at the pinned baseline: `aida-cli-lib/src/commit.rs:306` blocks on Git status; `pr_cmd.rs:447,528,652` fetches and rebases; `lib.rs:74844,74994` directly cascades rebase; `aida-core/src/git_ops.rs:239` commits via shell Git; `db/git_backend.rs:604` stages and commits paths; `team.rs:223` commits independently and its rejected-push arm resets HEAD~1. `aida-core/templates/hooks/aida-pre-commit.sh:127,149` invokes AIDA gates, and its section 3 formats/restages. `internal_cmd.rs:17` currently dispatches those gates through project discovery. These are seams needing changes, not a claim this protocol exists. Git's prepared reference-transaction callback runs with refs locked; a Rust guard cannot cross that process boundary.

    Proposed `bug_1808_publication_git_hooks_do_not_reenter_home`: actual queue work/rework argv from v3, two temp repos sharing fake HOME/AIDA_HOME, production hooks and actual CLI, fake vendor/forge. Barrier at P4 reference-transaction prepared while owner holds home; race B/outside-project queue/authority reads, supported team/store/comment writers and ordinary `aida commit`. Release barrier without waiting for blocked writer inside it. Require bounded completion/refusal, no circular wait, no provisional row/grant exposure, and exact post-settlement peer preservation. Run ordinary team roster and spec/comment store writes positively through their real commands; include rejected push/reconcile retry. Service retention/branch/store tuple classes must all be exercised; forged service label on a code update must fail.

    Kill parent before/after prepared ACK, COMMIT, committed callback fsync, rewrite-map end, receipt retention and slot clear. Recovery is triggered by B/outside real commands with publisher dead and production hooks STILL installed. Assert PREPARED full history/index/ref/reflog/worktree restoration; COMMIT exact setup retention, no event duplication or vendor respawn; missing A/payload/gate proof blocks. Corrupt/truncate/reorder callbacks, spoof env/peer/repo/ref/old/new, omit hooks, change prepared contents and overflow budgets: bounded refusal/blocking evidence, never FINAL from a hook. First vendor action remains impossible before bound release. Unrelated closed records and supported later peer history stay byte-identical.

    The companion `work_operation_hook_publication_lock_order` witness must use real `aida commit`, `aida pr rebase`, concurrent publication, real review record and pr ship at pending/new-head barriers; it is implemented with BUG-1802, not a prerequisite to shipping the independently tested BUG-1808 substrate. All v3 positives and negative witnesses remain required. No test was executed in this authoring session.

    No unresolved policy fork is declared. Concrete implementation obligations are the callback pump, hook gate extraction/private formatter staging, per-ref-backend effect accounting and private store/team adapters described here. If any cannot be implemented, report that exact mechanism as a blocker; “hooks must not re-enter” alone is not implementation. Fresh independent signoff remains required.
