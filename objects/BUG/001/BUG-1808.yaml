    CHANGES REQUESTED — BUG-1808 v4 independent advisor sketch review

    Reviewer: Codex authority-sketch-v4-signoff, native thread 01a11992-a842-7943-ba31-6ff04727a2da; NEW Joe-assigned advisor, neither sketch author nor earlier signoff reviewer. AIDA_SESSION_ID absent; no authenticated code-review grant asserted. Canonical comment 01a11990-553d-7f80-bcf6-21f9b3e06bfe matches BUG-1808-sketch-v4-addendum.md exactly, SHA256 7ed0561699c5f184572612e03f19b72aa3e06cf049eb4ea6958ef45da369e4f2. Baseline 199e591b07aa76a59cd34f0a41946f918501f6ba. Full independent finding, source references and binding refinements: .aida/handoff/orchestrator/INDEPENDENT_SKETCH_V4_SIGNOFF.md.

    F1 is the remaining shared blocker: GitPublicationAdapter passes an attempt capability to Git and descendants, then authenticates peer PID/start/ancestry, executable/hook chain and payload joins. This identifies a permitted-looking process but does not establish that Git supplied its callback input. A configured non-hook Git helper can exec the genuine pinned hook/client with fabricated input while retaining the live Git parent, inherited capability, valid cwd and expected executable chain. No grant/journal/hook tampering is needed. The proposal does not yet seal permitted external Git execution or supply a distinct invocation-origin mechanism. A matching tuple or object is not proof that the missing committed/rewrite callback happened.

    Required narrow revision: choose an executable callback-origin boundary covering effective Git configuration/attributes, non-hook descendants and descriptor inheritance, exact hook kind/input, nested Git helpers, and recovery children after publisher death. A sealed trusted execution configuration or a concrete per-invocation supervisor channel can be considered, but specify the mechanism rather than asserting the child is a hook. Preserve production gates, no home/repo/episode acquisition in hooks, parent-serviced finite pump, bounded fsynced attachments, exact tuple CAS, parent-only FINAL and strict service-versus-WORK recovery. No generic hook disabling, environment-only trust, released home guard over provisional state, or waived positive cases.

    Required proposed test: git_callback_descendant_cannot_forge_observation through real commit/rebase and P4/recovery service ref install, production hooks and isolated fixtures. A non-hook configured child attempts genuine HookClient/hook execution with inherited capability and forged expected-shaped phase/payload while the real callback is missing. It must not produce accepted evidence/FINAL; genuine callback positives still complete boundedly. Include shell exec, changed config after planning, partial stream and original dead publisher. Retain the existing publication-lock/cross-repo/peer-history/no-residue/bootstrap crash witnesses; none was executed here.

    The parent pump otherwise resolves the v3 lock inversion at design level. New recovery owner holds home and services its own fresh step, never reuses dead credentials; SERVICE exact-state roll-forward cannot manufacture WORK attribution. Preserve full v3 bootstrap/preflight/strict refusal/current-preimage history/permanent-sidecar/TASK-1337/TASK-1603 obligations. No blanket hold because BUG-1802 policy is unfinished: this spec owns the shared substrate FIRST.

    Report refinements 1–5 are binding integration details: Git version/backend protocol; actual prepare-commit-msg store trailer and skill-sync hooks; immutable decision versus later receipt digests; finite connect/IO/termination and recovery quiescence; substrate-only independence from BUG-1802 policy. They are not requests for another broad architecture rewrite. Earlier A–E and v4 explicit supersession take precedence over conflicting v3 author statements. BUG-1808 delivers one LaunchPublisher/publication/assignment/receipt/callback substrate first; BUG-1802 consumes it later.

    Disposition: CHANGES REQUESTED for F1, not acceptance relaxation or an operator policy fork. Return the narrow executable mechanism to a fresh independent advisor. No implementation/status/queue/grant/hold changes or merge authorized by this comment. Final authority-sensitive merge remains Joe/operator-owned.
