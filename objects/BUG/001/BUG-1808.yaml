    Existing independent A–E and binding verdict refinements, signed ADR67–70/C1–C8 and C7 fixes outrank author proposals. Subject to a NEW DIFFERENT advisor's signoff, this document replaces only the launch clauses enumerated below. Unaffected v3/v4 contracts and all historical artifacts remain. Callback v5 and this launch amendment are disjoint requirements; either failing blocks affected production publication. Neither unsigned proposal becomes normative merely by being newer.

    Exact proposed supersessions:

    1. BUG-1808 v3 L3 sentence “Keep the home publication lock through the release exchange…” is replaced: complete and durably retire publication before release; child never acquires home or seat for consuming this dispatch. L4 READY_TO_EXEC is transport observation only, not a second decision.
    2. V3 P3's bootstrap readiness and any Git installation move outside the seat-held portion; v3 P4's final authorization remains the sole decision. Its occupancy clause is the SAME decision, not a later independently fallible authorization. Normal-path finite Git installation/verification is completed provisionally before the final local decision; post-COMMIT Git recovery retains v4's callback gate and never holds seat.
    3. V3 shared “Assignment validation in exact order” steps 3–5 and `validate_assigned_consumer` still apply freshly to NEW invocations/activations, including setup-only activation. They do not run again as fresh authority at the last instruction of an already committed immediate bootstrap. L2's actual PID and reciprocal joins remain mandatory before P4.
    4. V3 P4/retention COMMIT bytes remain immutable. Install/cancel/release observations append in its predeclared bounded namespace; they never revise COMMIT or broaden its write set. Recovery never releases a child.
    5. TASK-1607 first-sketch steps 3–5, the requested “final generation validation/exec under seat” C8 expansion, “transfer before final lock invalidates RELEASE”, and the fresh-authorization part of ETXTBSY retries are superseded by the table below. Steps 1–2 are adjusted to acquire READY before the seat-held decision, and to execute a sealed helper image. Wrong-process/replay/dead-parent checks remain.

    ## One authorization, one committed dispatch

    The signed sketch faa07e4acb §2 states that already committed children remain in-flight and may continue after transfer. ADR70 replaces durable reservations with a bounded locked commitment; it does not move commitment to a later vendor instruction. Here COMMIT means the complete actual-child-bound dispatch and its setup, including occupancy generation evidence. A PREPARED child, a setup-only assignment, or an admission-only prefix is NOT committed dispatch.

    Define predicates:

    - **A**: current issuer subject/session and complete active parent chain, delegation to the selected seats (or exact assigned-consumer authority for a new invocation), nonrevocation, roster ceiling and expiry at P4. No inherited driver handle, role selector or native UUID substitutes.
    - **J**: one reciprocal repo/manifest/assignment/actor/grant/parent-grant join; exact spec UUIDs, branch/worktree, selected_seat and kind; actual activation PID/boot/start and issuer identity. Phase work additionally joins run token, member_uuid, phase, phase_attempt_uuid, registered snapshot membership and live parent/member. Resume joins retained predecessor/native session and preserves actor; new siblings have distinct actors. Exactly one owner issues each grant.
    - **O**: fresh C7 caller classification under the permanent seat lock; actual holder grant/session/anchor and generation match, holder/requester authority and absolute request deadlines are current, no effective pending takeover/demotion fence permits this new dispatch. Ordinary/plain-shell exemptions preserve their signed scope and do not invent a holder row.
    - **I**: sealed helper/leaf image, argv/env/cwd/stdio/containment description and adapter digest match the prepared plan; live owned waiting PID/READY agrees, all required FDs are present, no release/cancellation has occurred.
    - **W**: current locked preimages, complete finite undo/redo/object closure, exact provisional installations and gates are verified; durable journal/coordinator and history/event IDs cover every effect. No unfinished callback/Git step remains in the normal final seat section.
    - **C**: immutable valid COMMIT binds A/J/O/I/W results and the complete decision digest; required file and directory syncs and retained receipt/install proof have succeeded before any release capability exists.

    A/J/O are decided once at P4 for this particular dispatch. Revocation/roster/transfer/member writers take home first, and changes that serialize BEFORE P4 must cause a fresh check and, where invalid, full ABORT. Clock time is freshly sampled at the final P4 authorization decision, after provisional work, never at P0 as a frozen promise. Record that `validated_at` with all expiry bounds. The decision and its persistence are one lock-held critical section with no intervening task/child/network wait. Time after that decision is running-dispatch time, not a new authorization. A failed persistence does not grant release; see uncertain durability below. This is the ordinary sampled-time authorization boundary, not a claim that a clock check and fsync are one kernel instruction.

    After successful C, later issuer revocation, roster loss, grant expiry or holder transfer does NOT revoke this one already committed immediate dispatch. Those changes affect all subsequent privileged operations, new assignments and activations. There is NO second generation/grant/member authorization in the bootstrap. It checks the exact decision's historical join, not mutable “current” pointers. A supported member replacement must retain old committed attempts and cannot reuse their identities or admit a concurrent replacement for an unsettled same attempt. Removal/advancement of current membership does not erase historical commitment. Newly requested launches after those changes revalidate and can genuinely refuse with no new invocation residue.

    Immediate means this already living bound bootstrap, original living supervising parent/thread, original channel, one consumed release and a finite monotonic startup deadline fixed before P4 (default 30 seconds from decision; shorter remaining preparation budget allowed). It is not a release file, transferable token, retry by another process, scheduler queue or crash-recovery entitlement. Setup-only/TUI deferred start, reconstructed parent/channel, new PID, different image/argv/scope, different member/phase/attempt, or resume/retry by a new invocation requires a NEW publication and current A/J/O. No admission-only prefix can be relabeled an earlier successful transaction inside the same initial invocation.

    Concrete conflict statement: demanding “current grant/generation must still authorize at the kernel exec instant” AND immutable earlier COMMIT AND strict unchanged-state authorization refusal is incompatible with releasing the locks between those instants. A supported revoke can win between them. Retaining home through a child that reacquires it deadlocks. This proposal removes the unsigned SECOND authorization check, preserving the signed committed-child continuation rule and existing P4 semantics; it does not rename a real fresh refusal as an exec error. If independent review instead requires exec-time current authority, this proposal is NOT compatible with that policy; the decision boundary itself must be redesigned before signoff. No such new policy is assumed here.

    ## The common transition table

    One total lock order when present: HOME publication -> canonical REPO lifecycle -> sorted SEAT sidecars -> STORE -> sorted QUEUE -> DRAIN snapshot -> sorted EPISODE/MANIFEST -> VERDICT -> MERGE -> Git locks. Omitting seat does not permit reacquiring it under lower locks. Release lower guards before the final seat acquisition while retaining home/repo. All seat lifecycle/peek/authority readers and writers enlist home-first; locked grant/roster reads use already guarded APIs and never recursively enter home. No Rust guard crosses exec.

    | State/transition | Locks and owner; exact decision | Durable facts and failure/crash disposition |
    | --- | --- | --- |
    | PLAN/PREPARE | Publisher P0/P1 resolves A/J targets, adapters/images and finite writes read-only; private work and network outside seat. Spawn only trusted waiting bootstrap; receive/authenticate READY outside seat and before provisional installation. | No lifecycle authority or vendor execution. Unsupported mode/image/chain and initial refusal leave no lifecycle changes; remove owned private staging. Infrastructure must preexist. Waiting process alone has no authority. |
    | P2/P3 actual-PID BIND | Publisher takes home, recovers active foreign repo before choosing own repo, takes ordered non-seat resource locks. Re-read current preimages; verify actual owned child PID/boot/start, READY and I, then write J into staged/provisional records and journal. Git/callback pump runs here without seat, subject to separately signed callback mechanism. | Durable PREPARED generations and coordinator before installs; bind child/registry/manifest/grant/run attempt reciprocally, no optional released PID. Failed A/J/I, timeout, child death or storage error before decision takes ABORT. No empty-start row or vendor. |
    | Final O check and occupancy install | Retain home/repo, drop lower locks, acquire seat then needed lower locks. Fresh A/J/O/I/W; local seat after-image names exact activation and proposed decision identity. Seat bytes are durable but PROVISIONAL until C. No Git/hook/child readiness work here. | Occupancy is enlisted in SAME journal with locked exact preimage and appended child reference. Unknown capture refuses before decision. A changed generation before this lock fails O. No reservation surviving unlock or Unknown seat reservation is introduced. |
    | P4 publication COMMIT = occupancy commitment | Publisher samples final authority time and verifies predicates immediately before durable immutable COMMIT publication while home/seat remain held. Decision binds generation/holder and actual child. Persist COMMIT, retained decision/install receipt and bounded predeclared release-intent observation; no child ACK dependency. | Successful C commits BOTH setup and exact dispatch. No separate post-C occupancy decision. A/J/O failure remains pre-C ABORT, including late expiry. Any storage fault yields NO release. Valid visible COMMIT with uncertain sync is interrupted/uncertain COMMIT, never authorization refusal or rollback. |
    | Finish/retire before RELEASE | Publisher finishes local retained proof, reads it back, verifies existing event projection requirements, durably clears coordinator only per v3 retention order. Drop seat before any projection/callback/wait; retain home if completing publication. Normal final section had no unfinished Git. Recovery-only Git finish uses no seat. | Durable release-intent means “possibly executed” conservatively, even if the next send never happens. Live-child evidence survives seat replacement/cleanup. A post-C fault keeps committed setup and blocked/interrupted evidence; never mint token on fault. |
    | Parent RELEASE | All shared locks dropped. Original owner consumes noncloneable CommittedDispatch plus its exact WaitingChild; send one nonblocking fixed-size seqpacket referring to sealed decision/description, nonce, PID/start and deadline. Only publisher can enable this operation. | Parent's release-sent/ACK/exec-error are append-only observations, not authority. Failed/uncertain send invokes identity-owned cancellation; retain C and uncertainty. No rollback, fresh grant, alternate pane spawn or automatic retry process. |
    | Child validation / exec | NO home/seat/store locks, NO current authority lookup or cache. Bootstrap verifies original sender credentials/start/thread binding, live channel, own identity, sealed C/J/I digest, one-shot state and deadline; validates actual image FDs/seals and credential invariants. Same PID execveat of leaf. | Reject invalid channel/proof/image without exec; this is failure to consume this committed dispatch, not denial of a freshly requested role. Genuine new authorization never enters this path. Successful exec cannot return; ACK/EOF alone cannot establish it. C already retained possible-execution evidence. |
    | Cancellation before C | Mark owned transport canceled; no release capability exists. Drop seat before pidfd termination/reaping; home may retain exclusion during exact ABORT. Recover/reacquire lower locks in order, never wait on child under seat. | Reverse only journaled installed effects matching exact before/after, including full history/ref/reflog/index, preserving current locked peer preimages. Verify restoration, clear/fsync locator, remove only owned staging. Only THEN report unchanged-state authorization refusal. Failed cleanup remains recovery-blocked, not a pass. |
    | Cancellation after C | Publisher's serialized local release/cancel state prevents sending after cancel; if release might have escaped, signal only its pidfd/owned unreaped Child and settle outside locks. | Keep C, attempt identity and cancellation/possibly-executed observations. Never erase setup, signal a guessed/peer PID, or assert nonexecution from missing ACK/death. Transfer can proceed; only another attempt for this same unsettled assignment is fenced. |
    | Recovery | Next home owner discovers A before any B lock. Validate roots/payloads; no child authorization or release. PREPARED with no valid decision restores; valid COMMIT rolls forward exact finite effects, never backward. Git operations require the separate approved callback adapter, outside seat. | Missing/corrupt/ambiguous decision/root/payload blocks recovery. Quiesce exact old processes without assuming they are waitpid children. Preserve peers and UUID-idempotent history. Retain committed interrupted attempts; no auto-respawn. New explicit activation requires current authority and settled predecessor evidence. |

    V3 logical atomicity still covers supported CLI/MCP readers, not arbitrary raw filesystem readers. Home retention during provisional Git work prevents supported authority/seat changes; it does not hold seat during Git. All actual seat status/read paths must obey this enlistment before production activation. A missed supported writer is a failing acceptance condition, not an allowed peer-conflict excuse.

    Durability is `write_all -> file fsync -> atomic rename -> directory fsync`, including payloads, journal generations, locator, COMMIT, receipt and child evidence. Readback/digest is additional verification, not fsync. Pre-rename failure leaves old target; after rename a new target may be visible but not durably confirmed. Never release on either failure. If exact valid COMMIT is visible after an error, recovery treats it as irrevocable and first makes it durable; if after an actual crash it is absent with an intact PREPARED journal, rollback is allowed since release could not have occurred. Corrupt/indeterminate evidence blocks; do not guess absence. Later receipt appends do not rewrite decision digest. The release-intent must be durable BEFORE sending so a crash cannot leave “no ACK” mistaken for “safe to relaunch”.

    ## Executable images: concrete Linux adapter

    Add proposed `launch_image::SealedExecImage` beside BUG-1808's core-accessible transport. This is exact launch-image binding, not a sandbox/broker or authenticity service for arbitrary programs. Choose descriptor execution, never Command::new(original_path) after prepare.

    During P1, open selected helper and native leaf through their resolved source descriptors; record source locator only diagnostically. Copy bytes to a fresh executable memfd created with sealing enabled and the kernel's permitted executable-memfd mode; unsupported/noexec policy refuses before lifecycle writes, never falls back to path exec. Apply `F_SEAL_WRITE|F_SEAL_GROW|F_SEAL_SHRINK|F_SEAL_SEAL` with no writable mapping; verify seals, hash the SEALED bytes, validate ELF/architecture and loader metadata, and compare to the prepared image digest. Reopen read-only, close writable handles. Description includes digest/size/ELF class/machine/PT_INTERP, adapter version and source metadata. Memfd identity and digest, not inode/path text alone, identify executed bytes. Retain hash/description durably with C; memfd contents are volatile execution resources, not crash-recovery authority. Recovery cannot reconstruct them to release a child.

    Use `execveat(image_fd, "", argv, envp, AT_EMPTY_PATH)` for BOTH the early AIDA helper and final native leaf. No PATH search, shell, `/usr/bin/env`, source symlink or original file reopen occurs at either exec. Helper uses early internal bootstrap dispatch before normal CLI/store/cache/hook initialization. Parent verifies READY PID/start and `/proc/<pid>/exe` against the sealed helper image; final leaf is the same bootstrap PID, distinct from publisher/host PID. In-place mutation and rename/symlink swaps of original files after snapshot cannot change sealed bytes. A source change during copy cannot change the already sealed result; it must match the selected prepared digest or fail before writes. Replacement with a different valid executable is not silently accepted under the old digest.

    Credential contract: validate effective execution access and noexec policy at selection, reject source set-id/security.capability or a required privilege transition before setup, and create images with no copied privilege metadata. Set/verify `PR_SET_NO_NEW_PRIVS` in the owned child; require unchanged uid/euid/suid/fsuid, gid/egid/sgid/fsgid, groups/capability sets across bootstrap and final image adapter. No credential-changing pre-exec hook is allowed. Verify the SEALED image metadata and selected interpreter, not a prior path stat. Never silently strip a required privileged wrapper into an unprivileged success. Vendor code can later perform ordinary work; no general control of arbitrary vendor subprocesses is claimed.

    Trusted loader boundary: the kernel, approved system ELF PT_INTERP and its system shared-library resolution remain trusted platform components. Record the permitted interpreter path/identity and reject vendor-relative/unrecognized loader or RPATH/RUNPATH outside that adapter's approved system set. Unsupported LD_PRELOAD/LD_AUDIT/LD_LIBRARY_PATH injection is diagnosed before writes rather than silently removed. This proposal pins helper and vendor entry bytes, NOT every library or future tool the vendor may load; simultaneous hostile replacement of the trusted OS loader is outside this local supported-workflow model. If an installed vendor needs a non-system runtime/resource bundle, its adapter must bind that explicit bundle before it is a positive supported case. No claim that executable digest alone pins such resources.

    Script/wrapper policy is explicit:

    - Native ELF Claude and direct native Codex use the above primitive. Read-only inspection found `/home/joe/.local/bin/claude` resolving to ELF `.../versions/2.1.293`; this is inventory, not a launch test.
    - The installed `@openai/codex/bin/codex.js` is a Node launcher that SPAWNS a native binary. Its read source SHA256 is `61b0194f3bb6534439c8d26a3ed57d0805f84b884588b761795323eeb92fcf70`. Proposed `CodexNodeNativeAdapter` recognizes an audited wrapper/version/digest, resolves its platform package/`vendor/<target>/bin/codex` fallback from read-only package metadata without executing JS, seals the selected native leaf, passes arguments unchanged, retains cwd/stdio and exact package-root/manager environment behavior (clear four CODEX_MANAGED_BY_* then set the selected one; set CODEX_MANAGED_PACKAGE_ROOT). It reproduces signal forwarding/exit semantics in the already-required AIDA supervisor. Node does not execute and never becomes the vendor PID. Native package identity, selected target and wrapper/metadata digests are in I. Unknown wrapper changes, ambiguous package resolution or required behavior the adapter cannot reproduce refuse BEFORE P2. The tested installed variant and compiled native fixture are required positives; refusing all Node wrappers is not compliant.
    - Do not directly exec a shebang script via a CLOEXEC image FD: its interpreter may need that descriptor after exec. Do not clear CLOEXEC globally to make scripts work. This initial adapter rejects arbitrary shell/Node/Python wrapper chains before setup, with exact selected path, interpreter/chain and missing adapter in the diagnosis. Only explicitly translated, audited exec-only wrappers (including the Codex adapter above) are supported. A native leaf spawned by an unmodified wrapper is NOT supported evidence. Required additional vendor variants remain acceptance blockers until concrete adapters land; temporary refusal is not their positive acceptance.

    FD contract:

    | Descriptor | Helper exec / final leaf / failures |
    | --- | --- |
    | Helper image | Read-only sealed, CLOEXEC; used by execveat and closed on helper success. Parent copy retained until helper binding settles, then closed. |
    | Leaf image and sealed description | Explicit mapped FDs survive ONLY helper exec; helper immediately sets CLOEXEC and validates seals/digest. Leaf exec closes both; errors/drop close them. No writable description mapping. |
    | Socketpair control | AF_UNIX SOCK_SEQPACKET + SO_PASSCRED, CLOEXEC by default; only child's endpoint explicitly survives helper exec and is immediately re-marked CLOEXEC. Parent endpoint and sibling copies never inherited. Final leaf inherits neither. |
    | Exec error pipe | Child write FD survives helper exec, then CLOEXEC; bounded error frame on failure, closes on success. EOF also means death and is never execution proof alone. Parent read end is never inherited. |
    | Locks/pidfds/receipt files | NEVER inherited by helper/leaf. Any post-fork close list closes locks BEFORE helper exec, since CLOEXEC alone leaves a fork-inheritance interval. Parent keeps identity-owned pidfd. Child receives a sealed decision copy over its authenticated channel; it does not open current grants/seat files. |
    | Stdio and selected terminal FDs | Exactly planned 0/1/2 survive leaf. Any explicitly required terminal adapter FD must be enumerated and justified in I; no wildcard inheritance. No script FD exception in this initial support set. |

    Kernel references for these design obligations: [execveat](https://man7.org/linux/man-pages/man2/execveat.2.html), [memfd_create](https://man7.org/linux/man-pages/man2/memfd_create.2.html), [execve](https://man7.org/linux/man-pages/man2/execve.2.html), [PR_SET_PDEATHSIG](https://man7.org/linux/man-pages/man2/PR_SET_PDEATHSIG.2const.html). Descriptor execution selects the supplied image; seals prevent content mutation. These manuals do not establish AIDA implementation or tests.

    ## Parent lifetime, errors and crash windows

    The actual creating supervisor thread must remain alive until vendor exit, not just until READY. Record parent TGID/boot/start AND creating TID/start in the sealed description. Minimal post-fork code sets PR_SET_PDEATHSIG(SIGKILL) before helper exec, checks expected getppid plus parent/thread identity afterward, then helper revalidates and checks PR_GET_PDEATHSIG. This closes death-before-prctl: a changed/reparented parent is rejected. Same-PID credential-preserving exec retains protection. Do not set credentials afterward or rely on a process-level pidfd alone to prove the creating thread still lives. All unsafe fork-child work must be limited to supported async-signal-safe/syscall operations; no Rust allocator/lock acquisition in pre_exec.

    Normal parent errors/drop serialize against send, cancel the owned process via pidfd before closing a possibly released channel, then reap outside all seat locks. Unknown process identity never licenses bare-PID signaling; use the unreaped owned Child/OS handle or close an unreleased channel. Unexpected parent/thread death triggers kernel protection; the adopting namespace init or nearest preexisting subreaper owns orphan reaping. Recovery is an observer/identity-handle cleanup owner, NOT automatically a waitpid parent. Supported host/containment adapters must identify that adopter and prove eventual reaping in fixture tests; an environment lacking a functioning adopter cannot claim support. No new system-wide reaper daemon is proposed.

    Before COMMIT or before any release, parent death cannot run vendor. After durable COMMIT/before release, setup remains and bootstrap dies; no respawn. After release send/before validation, queued frame plus HUP/dead parent is rejected. After validation/before exec, kernel death protection remains armed; controlled barrier death must prevent sentinel. An unsynchronized death racing successful exec can allow vendor instructions before SIGKILL; report possible execution, not a promise of retroactive nonexecution. After exec, sentinel/work may already exist. Cancellation has the same race limit. Durable C plus release-intent covers every such window even without ACK.

    ETXTBSY retry is only a failed exec syscall returning synchronously to the SAME still-living bootstrap with the SAME sealed image and channel, within original finite deadline (at most existing five 50-ms backoffs). No locks during backoff. Recheck immutable proof/channel/liveness, not current A/O. A failed syscall proves that attempt did not exec; missing ACK/error EOF/dead process does not. A new process, changed image or deadline extension needs a fresh authorized activation after positive old-attempt settlement. Once possibly executed, even positive death does not prove work was undone: explicit retry/resume semantics and retained history are mandatory. TASK-1337 manual worktree-enter/guided continuation remains.

    ## Buildable prerequisite and remaining gates

    The only independently buildable transport slice here is BUG-1808-owned `SealedExecImage + WaitingChild + private channel + owned cancellation` with NO grants/manifests/member schema, occupancy policy or live production caller. `WaitingChild` can report READY/identity and cancel; production `release` requires a private, non-publicly-constructible CommittedDispatch from the SAME publication owner. Before that owner exists, production release is unavailable; isolated compiled fixtures may exercise a test-only permit unavailable in production builds. No env boolean/public constructor can substitute. This slice can compile and be independently tested after its own different-advisor approval, without callback v5 or BUG-1802. It alone does NOT satisfy TASK-1607 or BUG-1808 acceptance.

    Next BUG-1808 implements the ONE common assignment/publication/receipt schema and above table, including the separately signed callback-origin mechanism for Git paths. TASK-1607 then supplies O and enlisted seat after-images/receipts to that owner; its integration is reviewed separately. BUG-1802 later adds provenance/START policy to the same types. No circular prerequisite, second launcher/format or speculative grant-release path. No whole-BUG-1808 approval before callback gate passes and no TASK-1607 production activation before complete gateway/identity/history acceptance.

    Source seams: `aida-cli-lib/src/seat_occupancy/{runtime,store,mod,cmd}.rs` (record_child, save, ChildSpawn, fresh lifecycle callers), core `fs_atomic.rs` (rename without fsync), `process_probe.rs`, `process_retry.rs`, `internal_cmd.rs`, `session.rs::{spawn_vendor_headless_with_seat,exec_vendor_headless,spawn_claude_headless_resume,exec_codex_session,os_wrapped_program_and_args}`, `lib.rs::{run_tracked_agent,agent_new_bg_dispatch,RealPhaseDriver}`, `session_manifest.rs`, `orchestrator.rs`, `drain_state.rs` and `pane_host.rs`. Existing record_child substitutes empty identity after spawn; registry writes follow execution; neither is the proposed proof. Changes belong to guided implementers after independent signoff, not this author.

    Required real-entrypoint witnesses and gateway dispositions are specified in the companion TASK-1607-launch-v2-addendum.md and incorporated as consumption tests of this exact table, in addition to ALL retained BUG-1808 v3/v4 matrices. In particular `task1607_launch_publication_final_check_race` and `task1607_launch_exec_image_binding` are proposed, not passes. Outstanding judgments are whether this single P4 consumption mechanism and descriptor/adapter boundary satisfy F1/F2, and whether the narrowly buildable transport slice may proceed independently. This author supplies no approval.
