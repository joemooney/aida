    ADVISOR SIGNOFF: APPROVED FOR PANE/CONTAINMENT ADDENDUM ONLY — BUG-1808

    # Independent pane/containment design review

    ADVISOR SIGNOFF: APPROVED FOR PANE/CONTAINMENT ADDENDUM ONLY — BUG-1808 and TASK-1607, AS AMENDED below.

    The common BUG-1808 production publication architecture is now coherently designed AS AMENDED by the existing callback and launch signoffs and this review. I find no remaining design blocker in the reviewed composition. This is a design conclusion, not a claim that the publisher, adapters, complete gateways, or history integration exist or work. Full implementation, exact-head independent review, mandatory positive and negative witnesses, CI, and operator merge remain outstanding. TASK-1612 retains only its separately approved transport scope; production release remains unavailable there. This review does not dispatch broader implementation or activate production.

    Reviewer: Codex `pane-containment-independent-reviewer`, native thread `01a119ca-46b5-7222-9e0d-6eefaa699fc4`. New Joe-assigned independent advisor, neither pane/containment author nor an earlier reviewer. Observed AIDA_SESSION_ID absent; required-binary `role current --check` returned advisor. These are provenance, not a fabricated authenticated implementation-review grant. Review date 2026-10-07 America/Phoenix. Main: `5d4180e5ded8a55ad1b02beac5571c190d3da0ac`; occupancy owner: `56f7b55b32fba77a2b8bdbdd2573d59cce0ca29f`.

    ## Exact inputs and precedence

    Read AGENTS.md, two-seat/rework/recovery disciplines and the aida-orchestrate independent sketch gate, applying only that gate within Joe's design-only assignment. Canonical reads used `/home/joe/ai/aida/target/agent/aida`. Full owning specs/comment bodies, actual READY and receipt, signed callback/launch bodies, actual complete independent reports and launch receipt, C7_F3_INDEPENDENT_REVIEW.md, production inventory and NOT READY report govern this review. The signed STORY-1485 sketch at faa07e4acb and canonical decisions, TASK-1612 bounds, and supporting TASK-1120, STORY-612, TASK-298 and STORY-678 were also inspected. Historical tests remain inherited reports, not tests run here.

    | Reviewed body | Canonical comment | Full UTF-8 SHA256 |
    |---|---|---|
    | BUG-1808 pane/containment | 01a119c7-6694-7192-9b58-fc3da9298094 | 2a0c2bf1d4a900edc0838b79e78e89a30b542221ba085b1eec85b0decaba5b12 |
    | TASK-1607 consumer | 01a119c7-7ee6-72d0-8b37-8d02e1a6d693 | df4ed732d4c150b030d02fee2e426d355966d20a4ae5a709230164866ee842c6 |
    | Common launch amendment | 01a119ac-133b-7580-9381-e1febdeb8849 | 4d67af90b7320da207c7f1181ff7ab95d52d27d0fe5e4890be256d1afbf571ec |
    | Consumer launch amendment | 01a119ac-15f8-7141-a1dd-87492a75b840 | 2b809a68e9c9ebcc3f5ee078d88693651bd13e8d94dd30dd82877254eff5d368 |
    | Callback v5 amendment | 01a119a4-4908-7501-9c79-a18348497504 | 8c356c47fd5fd7aaf65b7e87ee679d0586819775e9063d59ef0940785244b5d5 |

    Each above matched exactly one complete canonical body, including final newline. Actual TASK1607_LAUNCH_V2_INDEPENDENT_SIGNOFF.md hashes to `f77fb2b49e605dbdc2a2afeae3112642d7211f6da1dd3d9fbbf42e59d8fcd658`; actual INDEPENDENT_SKETCH_V5_SIGNOFF.md to `0360a9b91f1c8092458e890c936425802702f813ce06a5a26b9e35026de54852`. Their common owner verdicts are respectively `01a119b5-ea32-7ed0-b5e9-11858700f78b` and `01a119af-a347-7961-b01d-66603478a59b`; consumer launch verdict is `01a119b5-f471-7621-aaa3-5a649fa5c9a2`. Existing binding approvals, explicit supersessions, A–E, ADR67–70/C1–C8 and C7 fixes prevail. Prior artifacts are preserved.

    Evidence is in `pane-containment-independent-evidence/`; the separate PANE_CONTAINMENT_INDEPENDENT_SIGNOFF_RECEIPT.json records input hashes, source pins, exact separate canonical posts/readbacks, field preservation and notification. Hashes establish documentary provenance, not executable acceptance.

    ## Common owner verdict and binding amendments

    ### 1. PANE-1: accept private display hosting, preserve its bounded product contract

    Accept the proposed private tmux server and fixed display-only relay. O remains the publisher, S the actual creating supervisor, B the waiting bootstrap that becomes V in the same process. M/R never own a grant, callback credential or release endpoint. Authenticate R by its actual owned-server child identity, start, image and per-message credentials before passing only the intended PTY master. A copied challenge, genuine relay in another pane, tab ID, pane_pid text or environment is insufficient. Terminal input is not a human-at-TTY authority exemption.

    Grounding: TASK-1120 requires opt-in titled windows, pane/spec cross-reference, detach/reattach and operator-owned pane cleanup. Its original fallback and publisher-independent vendor lifetime cannot override the later signed launch restrictions. Retain titles, attach hint, pane mapping as non-authoritative metadata, and completed display retention. Distinguish terminal-client disconnect while O/S remain alive from actual publisher/creating-thread death; only the former preserves the running vendor. Document this boundary explicitly. No uncertain fallback and no restart from a surviving display server.

    Binding concretization of `pane_host::prepare_tmux_pty`: start the pinned server as an owned foreground server (`tmux -D -f /dev/null -S <private-socket>`), without a command on that server invocation. Use a separate pinned client with `-N` to prevent accidental server recreation and an explicit multi-argument relay command for the first session and subsequent windows. This gives an actual owned M handle before accepting pane reports. Do not attach to or terminate the user's existing server. Validate the selected build's startup/config/FD behavior; `-D` is not itself an identity proof. Default shell creation, user hooks and loader/startup injection are excluded from preparation.

    M is display-only and need not inherit the vendor's parent-death contract. Before C, its exact handle and private directory/socket are cleanup resources of this invocation; a publisher crash is interrupted preparation until recovery proves them quiescent. A known preparation failure cannot be reported as unchanged refusal while M/R survive. After C, preserve completed windows for the operator (for example the pinned remain-on-exit behavior); ordinary lifecycle cleanup must not kill committed display windows. The preparation ownership/effects belong in the common journal's declared resource namespace, not a new authority ledger. Record ownership before proceeding to provisional lifecycle installation. Unknown recovery identity blocks cleanup; it never licenses kill-server on a guessed socket.

    The proposed `/proc/<live-O>/fd/<sealed-relay-fd>` entry is acceptable only as the fixed non-authoritative relay's immutable descriptor alias, with O's descriptor retained and never reused until R's actual image/start is joined. No vendor/helper may use that as a substitute for signed execveat. Failed entry/owner death cancels; no pathname fallback. R and M get no authority-bearing environment or FD. Keep server/relay failure before release as startup cancellation; after C retain committed/possibly-executed evidence. Their exit or missing rc cannot establish vendor success.

    ### 2. CONT-1: accept a new optional private descriptor-exec bundle

    Accept the proposed audited non-setuid BwrapFdAdapter, not stock bwrap as if it already supplied the mechanism. Pin actual source/build/binary and setup profile; no replacement of /usr/bin/bwrap, global installation, setuid/file capabilities, new service or privileged delegation is authorized. Preserve requested broad-ro or strict-read mounts, explicit rw paths, managed settings and shared network. Default remains the existing no-PID profile.

    The actual graph is O -> W (outer monitor) -> namespace setup process, which descriptor-execs S -> B=V. In the explicit PID profile that setup/S process is namespace PID 1; W is still the host monitor. The proposed phrase “W ... descriptor-execs S” must not imply that the monitor changes into S or that W's PID becomes leaf identity. Account every actual clone/fork/helper edge in the selected source. Non-setuid qualification excludes the privileged helper branch; selected options that add an intermediate init/process require its explicit audited join, not an unrecorded parent.

    Replace the final execvp edge with execveat on sealed S; use signed descriptor execution for B and V too. Include source permissions/noexec/credential requirements and actual sealed bytes for W/S/B/V, with relay/tmux byte policy as above. Preserve immutable mount-source object identity through staging/publication, not merely a string path that is reopened after planning. Managed settings are sealed prepared input and journaled publication, not the current pre-launch host write. Unknown required behavior refuses before lifecycle writes and remains missing positive coverage.

    ### 3. CONT-2: use real same-user observation, not presumed privilege

    Accept the host/inner join as a concrete design, conditional on actual observation access at readiness. O uses a procfs mounted for its verified observation PID namespace, which must see S/B. Bind its namespace and proc mount identities; “host PID” means this qualified view, not an unqualified integer copied from a container. Match B's kernel per-message credential PID with the received pidfd's O-view identity, boot/start, PPid/S, NSpid/NStgid and namespace inode/map facts. Recheck liveness/start around reads. Check S independently. B's self PID is corroboration, never the host lookup key.

    S supplies B's actual pidfd from clone3(CLONE_PIDFD), or an unreaped owned child with autoreaping disabled. It passes the handle, not a serialized descriptor number. O must receive B's own READY on B's original endpoint; an S-authored claimed PID cannot replace it. Reverse authentication uses inherited exclusive endpoints and actual received O/W handles where outer PID translates to zero; zero is not identity. Validate final real/effective/saved/fs credentials, groups and capability sets after setup, namespace maps and no_new_privs. Unexpected credentials or FD inventory are refusal before P4.

    Upstream bwrap's drop_privs explicitly restores dumpability after dropping privileges. Preserve and audit the selected nonprivileged profile's access behavior; this is not proof that every deployed AppArmor/proc policy permits the required reads. No CAP_SYS_PTRACE, peer setns, root broker, policy disablement or new delegation is presumed. A host denying these observations remains unsupported for this managed adapter, with an exact diagnosis. Required ordinary userns-enabled positives remain mandatory. Operating from an already permitted ancestor observation namespace is the bounded supported choice; a deployment needing a new privileged observer returns for a separate concrete decision.

    ### 4. Lifetime, adopter and FD ownership are kernel obligations

    Retain original O creating TID/start, single-thread W/S creation edges and B identity. Each child arms PDEATHSIG in minimal post-fork syscall-only code and checks expected parent/thread afterward; rearm after credential transitions and verify in settled S/B. For an invisible outer parent, use the supplied actual parent handle plus outer-observed original creating-thread identity, not getppid()==0. O cannot pass P4 after that thread disappeared. A surviving process pidfd does not prove its creating thread survived. Release still requires the original live bounded chain; no replacement supervisor may inherit its right.

    Fix descriptor ownership per edge before fork/exec, not with a global inheritable range. Monitor closes redundant launch endpoints, and S/B close opposite endpoints and sibling copies. Lock FDs close before helper execution. Supervisor-only pidfds/namespace/PTY-master handles never reach B/V; the new supervisor resources do not relax the signed leaf FD rule. B receives only its declared image/description/control/error and planned stdio descriptors, immediately restores CLOEXEC after helper exec, and closes all launch authority on native exec. R receives only terminal I/O. Enumerate every retained monitor/init FD so EOF and cancellation are not held open accidentally.

    S reaps its actual children and acts as local subreaper. W/O reap only their actual children. On supervisor death the actual nearest surviving subreaper or namespace init must be identified and its eventual reaping qualified; a later CLI is not automatically a waitpid parent. Unknown adopter/identity is a pre-write support refusal, or blocked interrupted cleanup if discovered after failure. No guessed peer PID/group signal. Controlled pre-exec death prevents the leaf sentinel; an unsynchronized death racing successful exec retains possible execution.

    ### 5. CONT-3: preserve no-PID policy; limit teardown to the actual obligation

    Do not make a delegated cgroup or changed PID profile mandatory for ordinary vendor launch. The signed common launch amendment explicitly says: “Vendor code can later perform ordinary work; no general control of arbitrary vendor subprocesses is claimed.” Its later independent approval binds exact owned cancellation/parent/adopter semantics, not a new hostile-tool sandbox. STORY-612 requires write confinement, shared network and fail-closed userns support; it does not require a PID namespace or arbitrary-descendant extermination.

    There IS a narrower existing obligation: TASK-298's canonical design comment requires process-GROUP cleanup on success, error and cancel; `exit_signal::spawn_and_wait_watched` and `sweep_process_group` implement it today. STORY-678 requires PTY process-group pause/resume. Preserve those operations safely instead of removing them or claiming PDEATHSIG covers them.

    Binding bounded remedy: S establishes and retains the dedicated session/process group for the owned launch, verifies its PGID and controlling-PTY/foreground arrangement, and remains a live group anchor while V and group tools run. O retains S's exact handle/start. The actual parent (O directly, or W in the contained graph) disables autoreaping and retains S unreaped until group settlement; a pidfd by itself is not a promise that its PID/PGID cannot be recycled after reaping. W's monitor must therefore use non-reaping exit observation and wait for bounded cleanup completion before its final reap, rather than its stock immediate-reap path. S remains alive after V's natural exit to perform the existing bounded group cleanup, collecting adopted children; O handles cancellation if S fails while its exact unreaped identity still anchors the group. Group signaling is permitted only against this deliberately created, still-pinned group, never `-wrapper_pid` followed by guessed bare-PID fallback. If the anchor cannot be established, refuse before writes; if lost after execution, report uncertain settlement, do not target a potentially reused group. Supervisor signal handling must avoid double delivery. O, outside the stopped group, retains the authenticated resume request path and performs SIGCONT on the still-anchored group when S itself is stopped. Terminal byte/resize forwarding remains separate from authority and pause/cancel control.

    W's cleanup exchange is a typed observation/cancellation exchange on the existing codec, with no grant or release authority. O pumps it before waiting for W exit, outside seat; W cannot wait for a callback that O will service only after waitpid(W). Settlement distinguishes the intentionally unreaped anchor zombie from remaining live group members; retain the anchor through the last group signal, then reap it and never signal that numeric group again. Missing process visibility or an incomplete live-member settlement is uncertainty, not a successful empty-group result.

    This covers the supported launch/job-control group and exact W/S/B chain. It does not promise that a tool deliberately creating another session is contained or that all arbitrary tools vanish instantly when every supervisor dies. Recovery must preserve uncertainty and possible-execution evidence. A functioning adopter collects terminated orphans; subreaping is not termination.

    Accordingly supersede the unconditional “mandatory ... descendant_settlement” reading in both new addenda: for the existing no-PID profile this witness proves owned bootstrap/leaf and TASK-298 group cleanup plus honest escaped-descendant limits. It must not require cgroup.kill or PID-init teardown to pass ordinary containment. For an explicitly requested stronger full-domain lifetime profile, retain the separately qualified PID-namespace S-as-init option; an already delegated cgroup with surviving cleanup owner is another conditional option, not assumed infrastructure and not automatic parent-death termination. Such optional stronger support cannot replace the no-PID positive. No product default changes or privileged setup follow from this review.

    ### 6. One publication and purpose-separated Git execution

    No adapter creates a second issuance owner, persistent schema, authorization decision or public release token. `PreparedLaunchAdapter::prepare_waiting` returns the common WaitingChild plus finite observations. S relays only O's exact one-shot immutable committed message; it cannot reconstruct CommittedDispatch from READY, a receipt file or text. TASK-1607 contributes O and the actual B after-image to that same publication.

    The verified composition is home -> canonical repo -> sorted seats -> store -> sorted queues -> drain -> manifests -> verdict -> merge -> Git. Discovery/recovery of A precedes acquisition of B's repo lock. Drop lower locks before final seat acquisition. READY, helper exchange, Git callbacks, waits, reaping, network/mail/forge and backoff stay outside seat; no child enters ordinary CLI/home discovery and no Rust guard crosses exec. The parent Git pump uses preloaded context and preopened bounded observation outputs, never reacquires home. There is no parent-waits-child-waits-parent guard cycle in this amended design.

    P4, after actual B READY and provisional finite work, is the single final A/J/O/I/W sample and immutable COMMIT decision. Before C, revoke/transfer/expiry/member changes that win cause exact current-locked rollback including history and peer preservation. Do not move initial setup into a later child call. After C, the original live B/channel consumes its bounded immediate historical dispatch once despite later revocation/transfer; NEW delayed/setup-only/recovery/new-PID/new-attempt activation needs fresh authority. Durable file-fsync/rename/dir-fsync and retained receipt/history/possible-execution intent precede release and coordinator retirement. No release on storage/observation fault, no COMMIT rollback, no automatic retry from lost ACK. Recovery cannot release vendor. Append-only observations stay in the decision's predeclared namespace and budget.

    PreparedGitStep remains Git-only, CommittedDispatch vendor-only; neither converts to the other. Callback v5's six signed conditions, independently sealed closed runtime/config/includes/attributes/hooks/loader, actual gate/formatter/restaging/store-trailer/skill-sync effects, WORK versus SERVICE accounting, finite quiescence/recovery and fresh credentials remain binding in full. Vendor's trusted-system-loader/broad-filesystem concession and this CONT-3 scope correction do NOT weaken Git-domain quiescence. Required configured Git containment must actually be available and witnessed; no privileged cgroup infrastructure is inferred from this design approval. Its deployment/implementation acceptance remains open.

    ## Separate TASK-1607 consumer verdict

    ADVISOR SIGNOFF: APPROVED FOR PANE/CONTAINMENT ADDENDUM ONLY — TASK-1607, AS AMENDED by all six owner conditions above.

    The exact-hash consumer correctly contributes one ChildSpawn/occupancy after-image for B=V, referencing the common issuer/grant/manifest/assignment/member/phase/attempt/image/receipt and committed generation. No tmux, relay, bwrap, namespace-init, Node, TUI-tab or native UUID is authority. Replace the existing `SeatPermit::record_child` post-spawn/empty-start behavior only through that shared integration; passing a Command to the old permit is insufficient. No independent seat commit or release.

    C7 approval at 56f7b55 remains checkpoint-only. Preserve fresh holder AND requester/deadline checks under the relevant lock, no F3 pre-lock snapshot, C1 direct assigned scope, C2/C3 notices, C4 demotion/env omission fencing, C5 disclosure, C6 platform limitations, C8 local-only work and disabled kill. TASK-1337 selection/delegation/branch-before-setup, manual retirement bounds and authorized startup-failure continuation remain. TASK-1603 checked token/member snapshot registration precedes status/phase/release; permanent sidecars and peer membership remain intact.

    All inventory rows remain: foreground/headless/resume/reviewer/advisor_watch, phase/pipelined/batch/nextN, actual App::spawn_tab/PtyHost, pane+containment, setup-only activation, CLI/MCP/core/direct backend queue mutations, schedule/backlog/assign/archive/defer/doctor/init, handoff and supervisor delivery to a valid holder without an independent timer loop. Native daemon and unsupported platforms retain explicit refusal; refusal is not the required ordinary pane/PTY/no-PID/installed-Codex positive. Tab success requires retained common result, not spawn success. History is durable UUID-idempotent projection into the existing feed before outbox clearing, never a replacement launch ledger.

    ## Acceptance witnesses — proposed, none run

    Use eventual REAL foreground/queue/rework/TUI/phase/pipelined/pane/containment entrypoints, fixed compiled fake vendors, fake HOME/AIDA_HOME, owned private server/processes, deterministic barriers/clocks and storage faults. No live peers or stores. Include installed-version Codex compatibility separately: pinned wrapper/package translation, native leaf identity, argv/cwd/stdio, package root and four manager flags, signals and exit behavior. Source/manual inspection cannot supply those positives.

    | Named witness | Required paired outcomes |
    |---|---|
    | `bug1808_pane_real_entrypoint_single_commit` | Actual private server, titled windows, attach/detach/resize/input, retained completed display; B is native leaf, one issue/C/consume; absent/forged rc never succeeds. Test M death before/after P4 and release, no silent recreation or fallback. |
    | `bug1808_pane_foreign_peer_and_fd_refusal` | Genuine own R succeeds; foreign pane/server, copied challenge, wrong PID/start/image, missing/extra/wrong/truncated/leaked descriptor rejects before publication, foreign peer untouched. |
    | `bug1808_containment_real_entrypoint_host_join` and `bug1808_namespace_ambiguity_and_credential_fence` | Broad-ro, strict-read/settings, ordinary no-PID and optional PID profile plus pane combination; two inner PID-2 children do not alias; inaccessible host proc, bad mappings/credentials/mounts/pidfd/FDs refuse with matching ordinary positives. |
    | `task1607_launch_exec_image_binding` | Helper/leaf/W/S/R/tmux/wrapper/package symlink and in-place replacement around prepare/READY/bind cannot execute replacement under old proof; actual selected bytes or canceled startup. Native and installed Codex positives mandatory. |
    | `bug1808_adapter_parent_thread_death` | O/thread/W/S/server death before prctl, after drops/rearm, READY, P4, intent/send/preexec and after exec; controlled no-sentinel cases, retained possible execution for races, actual adopter and closed FD inventory. |
    | `bug1808_containment_descendant_settlement` | Owned launch/job-control group cleanup on natural success/error/cancel, positive pause/resume, nonchild orphan reaping, peer group untouched; scope exactly condition 5. Optional stronger domain gets its own actual empty-domain positive, not a substituted default. |
    | `bug1808_adapter_replay_cancel_lost_ack` | Duplicate/replay/partial frames, stale channel, cancel-before-send/send race, EOF/lost ACK never mint another release; only signed same-PID returned-ETXTBSY bounded retry. |
    | `task1607_launch_publication_final_check_race` | Precommit supported revoke/transfer/expiry/member loss restores exact preimages; post-C original live immediate B executes once without current reauthorization; NEW invalid activation refuses preserving old setup. |
    | `bug1808_adapter_interrupted_publication_recovery` | Every payload/seat/journal/C/receipt/history/locator fsync/rename boundary, cross-repo/nonchild recovery and recovered publisher; PREPARED restoration versus immutable-C roll-forward, exact process quiescence, no vendor resurrection. |
    | `task1607_adapter_real_pty_result_and_signal_ownership`, `task1607_launch_no_network_or_wait_under_lock` | Actual TUI result persistence and bound-group pause/resume/drop, no guessed peer signal; production callback and all adapter waits outside seat, no recursive home guard. |

    Retain every earlier v3/v4/v5/launch/TASK-1337/TASK-1603/C7 witness, genuine Git hook/ordinary code/team/store positives, cross-repo recovery and later guard-removal/restoration nonvacuity. Snapshot full canonical objects/history/store HEAD; refs/reflogs/index/FETCH_HEAD/admin dirs; queue order/metadata/calibration; grants/leases/manifests/registry/receipts; occupancy generations/children/requests/tombstones/outbox; member/phase/attempt records; review/hold/signal artifacts; locator/journal/staging and lock inodes; host/inner PID/start/TID/parent/pidfd/credentials/namespaces/mounts/FDs, actual leaf image/sentinel and peer state before/barrier/after. Kernel unavailable or a missing positive means acceptance open, never skip-as-pass.

    ## Source and OS evidence; stop boundary

    Pinned source confirms `pane_host::host_implementer_in_tmux` shell/rc/default-zero result and `RealPhaseDriver` fallback; `PtyHost::signal_tree` guesses negative PID then bare PID; `App::spawn_tab` persists immediately after host spawn. `os_wrapped_program_and_args` writes managed settings and uses stock pathname argv; its mount builder has no PID unshare. Occupancy record_child captures after spawn and supplies empty start on failure. Source bytes and the author's recorded installed-image hashes match the pinned comparisons in inputs.json. None is the proposed production adapter.

    Documentary kernel checks: [parent-death signal](https://man7.org/linux/man-pages/man2/PR_SET_PDEATHSIG.2const.html) covers creator-thread death, fork clearing and credential resets; it cannot kill arbitrary forked tools. [PID namespaces](https://man7.org/linux/man-pages/man7/pid_namespaces.7.html) define ancestor visibility, zero outer parent and PID-init teardown. [Unix sockets](https://man7.org/linux/man-pages/man7/unix.7.html) ground credentials/SCM_RIGHTS; [proc status](https://man7.org/linux/man-pages/man5/proc_pid_status.5.html) qualifies namespace vectors. [tmux 3.4 source](https://raw.githubusercontent.com/tmux/tmux/3.4/spawn.c) closes extra descriptors and distinguishes multi-arg exec from shell; [its manual](https://raw.githubusercontent.com/tmux/tmux/3.4/tmux.1) defines -D/-N. [bubblewrap v0.9.0 source](https://raw.githubusercontent.com/containers/bubblewrap/v0.9.0/bubblewrap.c) exposes monitor/clone/init, credential drops, FD closure and final execvp. Upstream source is not distro-byte equivalence or a live probe.

    Only requested review artifacts, canonical comments and advisor notification were written. No source fixes, build, tests, live launch/crash experiment, lifecycle/status/queue/grant/hold mutation, commit/push or merge. An initial wrong source-path lookup was corrected; a supporting-spec formatter encountered absent comments and was corrected to optional handling. Neither was evidence of success. Worker sandbox authorization supplies no application authority. No permission or bypass request is needed to record this authorized design verdict. Final authority-sensitive merge remains Joe/operator-owned.
