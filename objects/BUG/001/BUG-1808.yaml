  content: |
    SKETCH (awaiting advisor signoff): BUG-1808 — revision 3, home-discoverable publication and actual-child activation

    Author: Codex `authority-sketch-v3-author`, native thread `01a11970-6f4f-7c60-8e4f-c910556f0d8a`, separate revision-author session assigned by Joe, 2026-10-07 America/Phoenix. AIDA_SESSION_ID is absent; no lease UUID or authenticated review grant is asserted. This is authorship provenance, not signoff. Final authority-changing merge belongs to Joe. No production code, dispatch, approval, grant, status/queue/hold change, merge or experiment is authorized by this document.

    Read AGENTS.md, two-seat/rework/recovery discipline, aida-orchestrate §3 (authoring only), full owning specs and every canonical comment, both v2 sketches, INDEPENDENT_SKETCH_SIGNOFF.md and the actual INDEPENDENT_SKETCH_V2_SIGNOFF.md. Earlier answers A–E remain binding without acceptance relaxation. Prior artifacts are preserved. All new types/functions/flags below are PROPOSED; cited baseline symbols are existing integration points, not claimed implementations.

    Binding policy: all A–E from both independent reviews are retained. --no-launch requires routed-child authority; assigned nondelegating children consume exact scope; late refusals leave no invocation lifecycle residue; preflight selected static seats and dynamic admissions; explicit non-review selector is consistent without changing launcher authority. TASK-1337 and TASK-1603 ordering remains. No narrower acceptance is proposed.

    One assignment model and exact retained extensions

    Use BUG-1802's canonical repo_key and retained SessionManifest evidence conventions. BUG-1808 must also work independently: its scoped assignment block and minimal grant/receipt joins can land without enabling review provenance enforcement. Do not make this bug wait for BUG-1802's verdict policy.

    - Extend session_manifest::SessionManifest with ONE versioned launch_assignments[] array (the same canonical array used by BUG-1802, not a duplicate evidence store). Each assignment holds: assignment_id (UUID), repo_key (real git common dir + canonical store root), spec_uuids[], selected_seat, actor_session_id, grant_id, parent_grant_id, predecessor_assignment_id?, native_session_id?, branch, worktree, kind (setup-only/implementation/review), run_token?, member_uuid?, phase?, phase_attempt_uuid?, issuer_pid/start_identity, state (prepared/setup-only/bound/committed/ended), publication_id, activation_attempts[] (actual PID/start lives only in these retained attempts, using the shared contract below). All authority fields except activation/end/process binding are immutable. Retain these entries after lease cleanup. Existing session_id is the manifest/lease key, NOT automatically the grant's session_id.
    - Extend SeatGrant with binding={repo_key,manifest_id,assignment_id}, predecessor_grant_id and issued_roster_store_sha as described in BUG-1802; retain the referenced store commit for historical validation. It points to the assignment rather than copying token/phase/spec into a second authority store. Existing session_id is the stable actor identity; issue a fresh grant id but preserve actor identity for a verified resume/reissue. A newly created child has a new actor session_id and an empty delegation set. Validate the complete parent chain, not only current_grant's immediate-parent check.
    - Extend orchestrator::RunMarker at its existing .aida/orchestrator-runs/<token>.json with member_uuid, canonical spec_uuid and phase_assignments[{phase,attempt_uuid,assignment_id,manifest_id,grant_id,actor_session_id,native_session_id?,activation_id?,state}]. The token is already the filename key. Preserve existing pid/spec/started_at/zen and existing parent/member liveness checks. A member has its OWN token and immutable member UUID; shared DrainState.current is telemetry only. drain_state::register_run owns checked member admission, orchestrator::publish_run owns the corresponding record. Both use the transaction described below, with TASK-1603's snapshot lock intact.
    - Extend OrchestratedLeaseReceipt with assignment_id and evidence_manifest_id. write_orchestrated_lease_receipt/publish_orchestrated_lease_receipt_from_env write the join only after it is staged/committed; prepare_orchestrated_lease_receipt does not delete retained manifests. Runtime receipt/run cleanup ends an assignment but does not turn its grant into a reusable unscoped credential.

    New proposed internal APIs (not claimed to exist): PreparedPickup, PreparedAssignment, PickupPublication, validate_assigned_consumer, prepare_child_grant, and publish_pickup. prepare_child_grant runs existing validate_child_delegation semantics under the publication locks and creates bytes in PRIVATE staging, not a live grant. publish_pickup is the ONLY writer that activates it for queue-work launch paths. seat_authority::issue_child remains a convenience wrapper for unrelated callers; covered paths must not call it again after setup. A low-level vendor wrapper receives a typed ActivatedAssignment; it cannot infer one from environment and cannot silently fall back to issuing a child.

    Assignment validation in exact order

    1. Resolve canonical repo/store from actual git discovery, not AIDA_PROJECT_ROOT/AIDA_DRIVE_ROOT alone; resolve requested display IDs to UUIDs. Resolve the routed seat/mode/worktree and validate caller's actual grant subject, stable actor/process join, complete grant parent/predecessor evidence, roster and current expiry/revocation.
    2. If no explicit retained assignment is supplied, this is a LAUNCHER: validate delegation of the selected seat. If an assignment handle/token is supplied but invalid, REFUSE; do not fall back to the launcher case or to an environment exemption.
    3. For an assigned consumer, read its manifest by exact ID and require assignment.repo_key, spec set, selected seat, kind and branch/worktree to equal the resolved operation. Assignment.grant_id must equal the grant resolved from the caller's bound process (an env handle is only a corroborated locator); actor_session_id must equal grant.session_id; grant.binding must point back. Verify the issuing parent grant, subject and every ancestor. Match native conversation when supported; otherwise use launcher-to-child pipe/process PID/start binding recorded before vendor readiness, not a caller-invented session id.
    4. Orchestrated consumers additionally require valid token filename, live member and parent process identities, matching member_uuid/spec_uuid, exact actual phase and attempt, and equality of ALL assignment/grant/session fields with that token's phase_assignments entry. Verify snapshot membership through read_live_run, not shared current. Reject a token from another concurrently live member, old phase/attempt or dead predecessor. A valid no-delegation implementer can execute ONLY this assignment; it cannot select another spec, issue reviewers or broaden the cluster.
    5. Resume uses the retained prior native-session/manifest join to preserve actor identity. Its authorized launcher may prepare one replacement grant/assignment linked to the predecessor; the resumed child merely consumes it. A missing predecessor is an error. Assignment handles and --session-id are selectors, not authority. Scoped grant validation is repeated at the final publication point below. Grant cannot be used while state=prepared or its publication journal is uncommitted.

    Per-entrypoint issuance ownership and sequence

    | Entry surface at the pinned source | Launcher / consumer and single issuance owner | Exact ordering change |
    | --- | --- | --- |
    | queue_cmd::handle_queue_command, QueueCommand::Work ordinary path -> handle_queue_work | External invocation is launcher unless a retained assignment validates. handle_queue_work's publication owns ONE child grant. | Read-only resolve_queue_work_plan/infer_queue_work_role/preflight_queue_work_branch; prepare setup and assignment; P3 spawn/bind waiting bootstrap; P4 publish; release it to exec the interactive vendor. Remove late issue_child at queue_cmd.rs:12421 for this path. |
    | Standalone fresh --no-human=both -> session::exec_vendor_headless | Launcher enters the SAME publication owner in handle_queue_work. exec_vendor_headless is assigned consumer. | Prepare scoped implementer grant before setup publication; install exact child grant/subject/assignment, overwriting inherited driver handle. Plain exec must never retain driver authority. |
    | Standalone --resume=<conversation> --vendor claude, interactive or headless | handle_queue_work is issuance owner. | Resolve old manifest/native identity, prepare ONE linked replacement grant; P3 spawn/bind waiting bootstrap; P4 publish and release; exec_claude_resume or spawn_claude_headless_resume consumes it through spawn_bound_vendor. No inner issue_child; non-Claude unsupported resume still refuses before any staging/publication. |
    | PR/MR standalone reviewer -> run_standalone_reviewer | handle_queue_work's publication is issuance owner; run_standalone_reviewer is consumer. | Route reviewer, preflight actual reviewer seat; stage any required review session/manifest and review-output resets (do not take an implementer lease merely to review); prepare grant and review-start expectation; P3 spawn/bind waiting bootstrap; P4 publish/release; spawn_vendor_headless_with_seat, spawn_claude_headless_resume or spawn_reviewer_launch_plan consumes the same assignment through spawn_bound_vendor. No double issue, no reviewer-file deletion before authority. |
    | Explicit --no-launch with --session-id (separate from normal TUI PTY path) | Launcher setup still owned by handle_queue_work publication; a valid assigned consumer uses its existing grant. | Caller session UUID cannot authorize. Commit setup-only assignment after final authorization; return exact setup assignment handle to the caller. Later vendor start is a NEW activation transaction requiring current grant validity, or an authorized launcher reissue; it cannot reuse an expired setup promise. Refused later activation preserves already-authorized setup from the previous invocation, and creates none of its own. |
    | --batch / --batches / nextN / --drain / --auto-complete wrappers in QueueCommand::Work, lib.rs::run_auto_complete | Outer wrapper plans bounded initial member set and actual phase seats before any run/drain-state/admission mutation. Per-member RealPhaseDriver is launcher for each phase. | Prepare root/admission transaction; register_run before status/launch. RealPhaseDriver::run_implementer is the SINGLE phase grant issuance owner, delegating from validated driver. It prepares complete setup through the shared planner/publication service; the phase vendor consumes the assignment directly, with no second queue-work setup subprocess after publication. |
    | Baseline RealPhaseDriver::run_implementer -> build_implementer_phase_args -> spawn_and_wait_watched/pane host -> queue work | Phase-driver publication owns implementer grant and token/member/attempt binding. Refactor this specific call graph to shared in-process pickup preparation followed by DIRECT assigned vendor launch. | Move mark_drain_phase_session, predecessor release, receipt preparation and signal reset into its staged write set; prepare exact branch/worktree before spawning. spawn_bound_vendor first starts ONLY a waiting bootstrap inside P3; LaunchPublisher binds its actual PID/start and validate_assigned_consumer checks that retained binding before P4; after COMMIT the parent releases that process to exec the vendor, not another queue-work setup command. This removes a second post-publication authorization/refusal boundary. Pipelined member process still registers its ownership before its own status bump/vendor release; shared parent never guesses current. |
    | RealPhaseDriver::run_reviewer, reviewer retry/resume | Phase driver owns ONE reviewer grant per attempt under its delegating driver authority. | Stage phase update/output reset/review-start expectation, prepare reviewer assignment, spawn and bind waiting bootstrap during P3; P4 publishes and releases it. Low-level wrapper never issues. Retried attempt never reuses old grant/token binding as a new round. |
    | RealPhaseDriver resume_implementer path -> spawn_claude_headless_resume | The authorized driver owns ONE replacement implementer grant preserving actor/native lineage. | Validate retained predecessor + member/phase; prepare/publish replacement assignment; wrapper consumes. Empty child delegation set remains empty. |
    | queue_cmd::{handle_rework_entry,handle_queue_rework} with --work/--resume -> direct handle_queue_work | Rework-with-work is one launcher transaction, owned by the combined rework/pickup planner. | Move rework status/reopened SHA/comment/queue changes currently before the direct call INTO the same staged write set. Refused child delegation leaves the WHOLE invocation unchanged, not merely its final handle_queue_work portion. Metadata-only rework retains its own existing authorization policy; it is not a vendor launch. |

    A separately invoked `queue work S` carrying an already-active assignment is still supported: it is an assigned consumer and validates its exact retained binding, then prepares only its own still-needed setup/activation changes under this transaction. Existing committed parent setup is pre-command state and is not recursively reissued or rewritten. The phase-driver path above deliberately avoids this extra subprocess boundary in the SAME launch invocation, so a late child refusal cannot strand that invocation's newly published setup. build_implementer_phase_args remains the baseline trace point; replace its production use here rather than leaving hidden duplicate setup in that subprocess.

    Standalone low-level spawn wrappers still used outside queue work must either take an ActivatedAssignment or own a separate correctly preflighted launch publication; they may not offer a magic 'already authorized' boolean. Direct agent-new uses the same launch contract below for BUG-1802; no second issuance design is permitted. Reconstitution outside these covered paths is not silently granted authority. Any newly discovered queue-reachable issuer must join this table before signoff/implementation acceptance. The shared manifest convention is additive, not permission to broaden delegation or change the roster.

    Selection and admission

    resolve_queue_work_plan must take one resolved selector everywhere, including no-argument head and synthesized explicit rows, instead of rereading AIDA_SESSION_ROLE. --role wins non-review selection; PR/MR review forces reviewer under the documented rule. Print selector/origin and selected routed seat separately from the validated launcher seat. Suggested syntax is for an ALREADY authorized launcher: `aida queue work S --role implementer --strict`; never suggest that changing the selector grants delegation.

    All statically required phase seats for the selected mode are checked before initial run writes. through-ci does not require a reviewer if no reviewer phase runs; --from-pr excludes implementer when skipped. Conditional advisor/escalation phases are preflighted before their OWN admission/launch, not unconditionally demanded from every drain. Dynamically refreshed members are checked before adding them to the snapshot. Each admission and each later phase is a separate bounded transaction; a refused later member cannot erase earlier members that executed under valid authority. Root-run creation, the first member's admission AND that member's first actual phase setup/issuance share one transaction through P4 so a late first-launch refusal leaves no empty run or earlier admission residue. Do not commit an admission-only prefix and then label its residue a prior successful invocation. Subsequent member/phase refusal retains prior committed run history and peer member tokens.

    Shared executable launch contract (normative in BOTH sketches)

    One proposed `launch_publication::LaunchPublisher` is owned by the authorized AIDA launcher, never by the vendor. `bind_waiting_child` is its only process-binding writer; `release_bound_child` is its only release writer. `session::spawn_bound_vendor` replaces covered low-level spawn/exec calls. It consumes a prepared assignment and cannot issue authority. There is one issuance owner, even for resume/reviewer/phase launch. New children receive distinct actor UUIDs and empty delegation sets; verified resumes/reissues retain their old actor UUID through predecessor evidence. A driver is not an implementation contributor merely because it launched two independent children.

    The shared minimal assignment is immutable `{assignment_id, publication_id, repo_key, manifest_id, spec_uuids, seat, kind, actor_session_id, grant_id, parent_grant_id, predecessor_assignment_id?, branch, worktree, issuer_pid/start, run_token?, member_uuid?, phase?, phase_attempt_uuid?}` plus append-only activation attempts. Each attempt records `{activation_id, pid, boot_id/start_identity, executable/argv_digest, channel_nonce_digest, expected_native_id?, state, receipt_id}`. Standalone launches use an explicit standalone kind and omit run fields; phase launches require ALL run fields. Schema names are `selected_seat` for seat, `actor_session_id` for actor and `phase_attempt_uuid` for phase attempt throughout; shorthand prose denotes those same fields, never a parallel array. Grant binding points to manifest/assignment; manifest activation points to the retained publication receipt; RunMarker.phase_assignments points to the same activation/actor/grant. No optional consumer PID can describe a released activation. Setup-only assignments have NO executable activation and confer no vendor execution right.

    L0 PLAN: resolve authoritative roots, caller actor and complete grant chain, exact routed seats and vendor command. Validate delegation and supported launch adapter before lifecycle writes. Prepare exactly one scoped child grant (or consume the already-issued exact assignment without reissuing). Rework, admission and setup writes are part of the same publication. Direct agent-new planning must stage its early session/context/registry changes too. The immediate-launch protocol below uses BUG-1808's P0–P4 contract; BUG-1802 needs the same contract for its direct-launch producers even if implemented separately.

    L1 WAITING PROCESS, before COMMIT: launch the AIDA bootstrap executable, NOT the vendor, with an already-open private socketpair and immutable command description. Bootstrap does only bootstrap validation, READY on that channel and blocking receive. It cannot open the worktree for vendor work, call pickup, write a manifest/grant, create vendor logs, or run vendor initialization. READY is not authority. The parent obtains the actual child PID from spawn, corroborates READY peer identity, reads OS process start identity (including boot identity), verifies executable/argv and process ancestry, and holds an OS process handle where available. Missing platform proof refuses before COMMIT. Process names, environment handles and a PID without start identity do not suffice.

    L2 BIND: `LaunchPublisher::bind_waiting_child`, under home -> repo -> store/queue/drain -> episode/manifest locks, writes the exact PID/start/activation join into the staged manifest, grant binding, registry and token-specific phase assignment; validate reciprocal joins and live member/parent + snapshot membership. Registry registration is moved BEFORE vendor execution, and cannot be best-effort. The bootstrap does not write these records. The journal includes every installed binding. Bind failure, timeout, missing grant, changed member/attempt, expired authority, missing native predecessor, or a dead bootstrap causes pre-COMMIT ABORT: close the channel, kill/reap only the verified bootstrap, roll back this invocation's finite write set, remove its staging. Never fall back to a human or inherited driver grant. No writable vendor has existed.

    L3 P4: parent rechecks authority/time/roster, scope, exact bound process start and all reciprocal records. It durably commits the publication with an activation receipt binding the command digest, process identity, assignment and validation instant. Finish recoverable installs/refs and make the committed view durable BEFORE sending RELEASE. Keep the home publication lock through the release exchange, then drop it before waiting for vendor completion. Revocation serialized before P4 wins; natural expiry is checked at P4, not frozen by locking. A queued revocation whose writer only acquires after P4 is later in serialization. No late `issue_child` call is permitted.

    L4 RELEASE: the still-live publisher sends one nonce/activation/receipt-bound RELEASE on its private channel to that same waiting process. Bootstrap accepts only on its original channel, checks the parent process identity is still live, replies READY_TO_EXEC, and performs an in-process `execve` of the prevalidated vendor executable. PID/start survive this exec; this is why a bound bootstrap PID becomes the vendor PID. It never spawns an unbound vendor subprocess. The parent records release-sent/ack observations in the receipt; neither proves successful vendor execution. Exec-error channel is close-on-exec and reports errors; parent OS inspection can corroborate exec. An error after committed authorization is an authorized startup failure with manual continuation, not an unchanged-state authority refusal.

    Parent death/channel EOF BEFORE RELEASE makes bootstrap exit without exec; death after receipt COMMIT but before RELEASE leaves committed setup, not rollback. Recovery never sends RELEASE or blindly respawns. It retains `committed/interrupted-or-release-uncertain`, checks actual bound process liveness, and requires a NEW activation transaction with current authority and a new PID/attempt; a possibly live old attempt prevents a concurrent replacement. If RELEASE was already delivered and validated while parent was alive, subsequent death is after launch authorization, not an uncommitted refusal; vendor may already run. This explicit linearization avoids claiming an impossible atomic parent-liveness/exec guarantee. A setup-only/TUI deferred launch is always a new activation transaction; it cannot reuse a prior P4 instant.

    Adapters and actual producers:

    | Surface | Parent owner / actual child |
    | --- | --- |
    | Foreground `agent_new_with_config` -> `run_tracked_agent` | AIDA caller owns LaunchPublisher; spawn bootstrap then exec vendor. Move issuance, session/context/registry writes inside publication; registry identity is actual exec PID. |
    | Queue interactive and `exec_vendor_headless`; standalone reviewer; fresh/resume wrappers | `handle_queue_work` owns publication. Low-level wrappers use `spawn_bound_vendor`; they consume its assignment, never delegate again. A CLI previously replacing itself must retain a publisher parent until release. |
    | `run_auto_complete` / `RealPhaseDriver::{run_implementer,run_reviewer}` / retries | Driver calls shared in-process pickup preparation and is the sole issuance owner per phase/attempt. DIRECT bootstrap-to-vendor launch replaces the old `build_implementer_phase_args` queue-work subprocess. Root/first admission/first setup form one boundary; register membership before status/release. No nested queue child setup or recursive delegation. |
    | Background phase and pane-host | Same driver publisher. Background is a direct bootstrap child. tmux gets ONLY an AIDA bootstrap command, no vendor shell command. Private Unix socket rendezvous (0600, random nonce) authenticates peer PID with OS peer credentials; verify start identity/executable and pane's actual process ancestry. Shell/tmux PID is transport only. Bootstrap later execs vendor in place. No platform peer-PID adapter means explicit preflight refusal. Fallback to background is permitted only after proving the pane bootstrap never released and is dead/reaped; never double launch after an uncertain pane result. |
    | Actual TUI `App::spawn_tab` -> `queue_work_argv` -> `PtyHost::spawn` | PTY hosts the AIDA queue launcher; it owns publication and launches the waiting bootstrap in the PTY. TUI PID and minted Claude UUID are selectors, not proof. Proposed inherited `launch_status_fd` from PtyHost carries only `{publication_id, assignment_id, result}`; queue publisher writes success after durable COMMIT/install, TUI verifies that retained receipt through PublicationGuard before persist_state. EOF/refusal removes only the invocation placeholder and never changes prior tabs. Delay persisted lifecycle/tab-success state until that receipt. Codex resume must refuse rather than silently fresh-launch a requested old actor. |
    | Explicit `--no-launch --session-id` | Authorized setup-only publication, no bootstrap and no active process. A later proposed `aida internal activate-assignment <id>` is a launcher-owned activation entrypoint with current authority; it uses L0–L4, preserves preexisting setup on refusal, and does not let the vendor self-issue. |
    | Direct session attachment / role reissue | No child launch is invented. Resolve the existing live actor through retained PID/start/native evidence; preserve actor on role reissue. Unknown actor cannot become trusted writable/review evidence. |
    | Native `agent_new_bg_dispatch` / `claude --bg` | UNSUPPORTED authenticated launch in this revision: baseline daemon dispatcher returns after a hidden launch and has no pre-exec binding adapter. Refuse at L0 before session/context/grant/setup changes with “native background daemon cannot bind vendor before execution; use foreground agent-new or supported headless queue launch.” Do not bind dispatcher PID, parse stdout as authority, or silently change native attach/log semantics. Supporting native --bg requires an actual vendor pre-exec waiting-process API or separately reviewed AIDA-owned supervisor adapter. This is a concrete support blocker, not an invented mechanism. |

    Containment: bootstrap must be the innermost process that will exec vendor. A wrapper such as bwrap may create PID namespaces; the parent must obtain the real host PID/start by authenticated peer credentials and namespace mapping before L2. A wrapper without this adapter is refused before setup. Windows needs a suspended-process/creation-time equivalent bound by the same publisher before ResumeThread; absent that implemented adapter, explicitly refuse authenticated launch. Do not silently remove containment or substitute host PID. These adapter limitations are implementation blockers to positive coverage for those variants, not permission to relax identity.

    Native IDs are corroboration, not boot credentials. For fresh Claude the parent's requested UUID is only expected identity until joined to the bound process and its vendor session artifact. For fresh Codex, do not mint a fake native UUID; PID/start binding permits execution. Parent-owned registry monitoring may append an immutable native binding only after joining bound process/descendant, actual transcript/session artifact and canonical cwd; ambiguous/conflicting discovery refuses further authority use. Vendor-supplied text alone cannot create that join. Resume resolves exact native ID -> retained manifest -> actor BEFORE L1; missing mapping refuses. Environment-free descendants authenticate through an OS ancestry walk to a live bound PID/start plus retained committed manifest/grant; missing/reparented/ambiguous ancestry cannot infer “human.” Native evidence alone cannot authorize an unrelated live process. Role reissue and process exit retain evidence; a truly new sibling remains a different actor.

    ONE bounded publication protocol with HOME discovery

    This is proposed infrastructure for a finite pickup/first-admission/activation write set, not a global provenance ledger or a transaction over an entire drain. AIDA-supported readers observe committed state under a guard; raw filesystem/Git readers are not promised physical multi-file atomicity. No current queue/grant helper already provides this protocol.

    Durable locations and identity

    Resolve home ONCE with the existing override-aware resolver. Add permanent `HOME/.aida/authority-publication.lock` and `HOME/.aida/pickup-publications/coordinator.json`. The coordinator has version, home identity and a SINGLE active slot `{tx_uuid, owner_pid/start/boot, repo_key, repo_root, git_common_dir, store_root, repo_identity_digest, journal_relative_path, journal_digest, payload_manifest_digest}`. Home lock serializes all transactions/readers, so a single slot suffices; no tree scan. Identity includes canonical paths plus device/inode or platform file identity for repo/common-dir/store and a stable initialized repository UUID. Roots must equal Git/store discovery; supplied env root is only a hint. Reject symlink redirection, path escape, changed identities, malformed IDs or journal/root mismatch. Infrastructure is initialized by explicit setup/migration, not a refused pickup; missing infrastructure refuses without creating lock/directory residue.

    The authoritative transaction directory is HOME/.aida/pickup-publications/<tx_uuid>/, containing `journal generations `journal.<generation>.json` (the first is generation 0), durable before/after payload blobs, Git object bundles/packs, and immutable `COMMIT.json` when decided. A repo-local journal/pointer under canonical `.aida/pickup-publications/<tx_uuid>/` is only a validated mirror, never the sole locator. Home journal names every enlisted repo-relative/home-relative target, before/after hashes/modes/absence, parent path identities, refs' old/new OIDs, owned staging/admin/ref-lock paths, process bindings, event UUIDs and immutable write-set digest. Locator/digest and journal identity must agree. No arbitrary absolute path from a corrupt journal is followed. Allowed write roots are pinned repo/common-dir/store/home queue+grants+registry, plus explicitly pinned sibling worktree parent; no arbitrary user-tree recovery.

    Before any shared install, all undo/redo bytes and code/store objects needed for that finite write set are copied from private preparation to this durable home transaction directory, fsynced with enclosing dirs. Git packs/bundles include the transitive object closure needed without temporary alternates, and verify against expected OIDs. Private checkout payloads and final-path admin metadata are recoverable from retained payloads/trees; ref/reflog/index preimages or exact owned-absence are recorded. Same-filesystem rename staging is prepared at validated targets and listed in journal. Nothing needed for rollback/roll-forward may exist only in /tmp. Objects can be promoted before refs while guarded; transaction-owned new object names are recorded and removed on abort only when unshared under guards. Unsupported Git/worktree actions without finite enumerated effects refuse at planning.

    Discovery and lock order — no lock upgrades

    Every supported authority/queue/lifecycle reader and writer calls proposed core `PublicationGuard::enter(home)` BEFORE selecting/acquiring a repository or fine lock. It always takes the HOME lock EXCLUSIVELY, including readers; this deliberately small serialized design avoids a shared-to-exclusive upgrade. Read coordinator immediately. If active, recover THAT transaction A first, even if the requested command is in B or outside any project. Recovery acquires A's validated repo lifecycle lock and needed fine locks; B has no lower-order lock yet. After A settles and slot clears, drop A locks, keep home lock, then select/acquire B locks and perform B's operation. A reader never returns provisional queue rows/grants while “deferring” recovery. No cwd-based lookup, environment scan or filesystem search substitutes for the locator.

    Order: HOME publication -> canonical REPO lifecycle -> STORE StoreWriteGuard -> sorted role QUEUE permanent sidecars -> DRAIN permanent snapshot -> sorted EPISODE/MANIFEST -> sorted VERDICT -> MERGE lease, then Git ref/index/worktree locks. Multi-repo commands either plan a bounded sorted repo set BEFORE taking any repo lock, after active recovery, or refuse/retry from the outer entrypoint; never discover and acquire A beneath a held B lock. Pass typed guard into nested library calls; do not reacquire non-reentrant home lock in a hook/callee or spawn an AIDA subprocess expected to acquire it while waiting under it. Drop the guard during private network preparation/CI and reacquire/revalidate. Writer APIs need guarded and staged forms; reentrant store guards do not make home locking reentrant.

    Recovery ownership is the first process holding home lock after the publisher exits/dies. PID/start is diagnostic/live-bootstrap cleanup proof; lock possession serializes recovery. A still-running owner holding the lock makes contenders wait boundedly then refuse, not steal. Once slot exists, any read/mutation must settle it or refuse. Missing/moved/unmounted A, changed root identity, missing/corrupt payload/journal/COMMIT or an impossible target hash state causes an explicit `recovery blocked: tx, A root, missing component` refusal BEFORE B/outside-home queue or authority state is exposed or changed. Do not clear slot, guess a new path or “recover only the home half.” An operator can restore A at the validated identity/path; root relocation/rebinding needs a separately reviewed recovery procedure. This trades temporary availability for correctness under existing acceptance.

    Enlisted boundaries (CLI AND MCP)

    | Boundary | Required guarded readers/writers |
    | --- | --- |
    | Home queues | `global_queue::{queue_path,load,read_queue,QueueMutation::acquire,add,remove}` and reorder/clear/derived queue/status/pickup callers. Split pure path resolution from current create-dir behavior. Guard BEFORE queue sidecar. Outside-project queue list/next/add/remove follows the same home recovery. |
    | Authority / roster | `seat_authority::{read_grant,current_grant,current_seat,roster_allows,write_grant,issue_direct,issue_child,revoke_current}`; `role_cmd` enter/end and supported grant inspection; `team::{set_role_cas,set_allowed_seats_cas,allow_seat_cas,disallow_seat_cas,unset_role_cas}` and team reads used for authorization. Store pull/import/rebase that replaces registry/team.toml joins BEFORE its store locks. Outside-project role/grant reads still recover home first, then refuse missing required project context. |
    | Canonical specs/history | `Storage::{load,save,save_with_conflict_detection,queue_add,queue_remove,queue_reorder,queue_clear,queue_remove_many_if,queue_remove_for_role_if}`; git/cached backend `update_spec_atomically_with_subject`, `bulk_update_atomically`, `record_op`, `auto_commit_paths`; canonical show/history/cache refresh consumers cannot expose provisional bytes. Guard/staged paths live below CLI/MCP dispatch so neither bypasses. Legacy storage backends lacking staged publication refuse covered pickup before mutation; no false atomicity promise. |
    | Local lifecycle | session start/end/prune/lease claim/release, `SessionManifest::{load,save}` and strict evidence discovery, assignment-bearing registry writes/GC, `drain_state::{register_run,set_run,read,write}`, `orchestrator::{publish_run,read_live_run,remove_run}`, receipt/signal/reviewer reset, calibration, stack, worktree/ref/fetch/pull/gc helpers reachable from setup. Raw helper entry must require a guard; it cannot open lower locks first. |
    | Consumption | review record/start, pr ship gates (preflight and under lease), drain handshake/merge, corpus/refusal-release/queue-done evidence reads; committed grant/assignment validator always checks retained receipt and reciprocal identities. Long-lived MCP/cache/TUI monitors reacquire on each snapshot and discard caches predating an unsettled transaction; no provisional cache publication. |

    This is an explicit enlistment obligation, not evidence that a broad list is already atomic. For any supported entrypoint not yet migrated, add an outer guard and either route to guarded APIs or explicitly refuse while the coordinator is nonempty BEFORE reading/writing its resources. A supported peer that can observe/install over provisional state is a failing acceptance test, not tolerated residue. Permanent home/repo/queue/snapshot lock inodes are NEVER unlinked.

    P0 READ PLAN: with guard/recovery as needed, resolve caller/assignment, selected role/UUIDs/branch/worktree occupancy, actual variant and bounded initial seats, bootstrap adapter, finite write set and command support. No lifecycle changes/cache refresh side effects. Dry-run/list return here; unsupported mode/authority or missing infrastructure returns unchanged. Release locks before private preparation.

    P1 PRIVATE PREPARE: isolated temp Git repository/object directory and checkout, proposed objects/history/queue/calibration/session/grant bytes. No live pull/fetch/FETCH_HEAD/refs, cleanup or status events. Rework-with-work stages its prefix history/queue/reopen fields here too. Stage only finite new worktrees or verified resumable metadata; no reset of peer files. Private preparation is disposable and has no authority. Cleanup this invocation's temp files on refusal.

    P2 PREPARED: enter home guard, recover active A BEFORE this repo lock, take ordered locks, re-read authority/time/roster and plan/read-set. On relevant change replan or refuse before install. Rebuild shared file updates using CURRENT locked bytes, retaining legitimate peer entries/history; those become undo preimages. Copy/fsync full undo/redo/Git packs to durable home transaction directory; publish journal PREPARED, then fsync coordinator active slot BEFORE any shared installation. Crash before slot leaves only an uninstalled staging directory; no authority can reference it, and setup's bounded transaction-directory cleanup can remove it. Crash after slot is discoverable from any B/outside reader. Stage registration/run membership before status images; preserve TASK-1603 ordering and token-specific peer members.

    P3 PROVISIONAL INSTALL + L1/L2: install finite after-images under guards. No supported reader can see them without settling the coordinator. Spawn only WAITING bootstrap(s); parent `LaunchPublisher::bind_waiting_child` verifies actual PID/start and adds reciprocal binding to all provisional records/journal. The child cannot execute vendor work or perform self-registration. Update/fsync journal, payloads and coordinator digest as a recoverable sequence: coordinator points to immutable journal generation filenames, old generations remain until transaction settles; never overwrite the only journal then leave a stale locator digest. A digest switch is one atomic fsynced coordinator replacement. At most one installed write-set version per generation; next generation must be durably locatable before its first install. Recovery replays all referenced generations in order/reverse as appropriate.

    Authority revocation writers take home lock; a committed revocation before P2/P4 acquisition wins. During a held P2–P4 section they wait and serialize after that transaction; tests must not deadlock waiting for a blocked revoke while the test barrier holds the lock. Clock expiry still progresses and is rechecked at P4. Fail binding or final authority => pre-COMMIT ABORT. No grant is active merely because its JSON after-image exists.

    P4 DECISION: recheck exact bound PID/start, parent/member/snapshot/attempt, manifest/grant/actor/target, current clock on active delegation chain and roster. Require every retained payload/object and old/new ref precondition recoverable. Durably create immutable HOME transaction `COMMIT.json` containing `{tx_id, immutable final journal digest/generation chain, write_set_digest, repo identity, assignments, activation IDs and PID/start, parent grant/roster version, validated_at, event IDs}` and fsync its dir. This is the sole commit decision/authorization linearization; coordinator state labels are hints, COMMIT's valid exact receipt decides. No file containing a partially written COMMIT is a decision (atomic rename from fsynced staging).

    Complete ref/working-file installs idempotently before child release. Update refs with expected-old OID, and accept already-new only when exact transaction receipt/ref state corroborates it. Git reflog writes and store inline history/events have retained exact pre/post bytes and stable event UUIDs; recovery neither adds duplicate transitions nor manufactures compensating history. No append-only event is emitted pre-COMMIT. Cache invalidation is after commitment. If any finish fails, keep coordinator active, do NOT release bootstrap, refuse further reads until recovery. This is interrupted COMMIT, never a clean authorization refusal.

    Once all installs are verified/durable, use L3/L4 to release the actual child. COMMIT-time valid authority authorizes this immediate live invocation only. Delayed/TUI activation and crash recovery require a new transaction. Vendor exec failure after release retains committed setup and TASK-1337's manual `aida worktree enter`/guided continuation. No delegation issue or refusal may be deferred to vendor startup.

    ABORT before COMMIT: close channel and verify/kill/reap only matching bootstrap (never a peer PID); reverse installs in journal order using current==installed or already-preimage hash/inode predicates. Restore CURRENT-locked preimages, including canonical object/history, queue and refs/reflogs; remove only owned new paths/admin entries/ref locks and transaction objects. No `edit status back`, no compensating event. Supported writers were excluded, so predicates must hold; mismatch is corruption/out-of-protocol mutation, remains recovery-blocked rather than clobbering a peer. Verify full restoration, then clear/fsync coordinator, then remove transaction payload/staging and invocation-created nonpermanent directories. Permanent preexisting sidecars remain. Return authority refusal only after cleanup verified: no invocation-owned lifecycle residue. Cleanup failure is a failed operation requiring recovery, NOT a passing unchanged-state refusal.

    Recovery and durable retention

    - PREPARED without valid COMMIT: rollback under A's locks from home-resident payloads; bootstrap cannot have been released. Restore full original inline history/store refs exactly; then clear active slot. A missing repo means refuse globally, even though home rollback bytes exist, to avoid exposing a half-restored state.
    - Valid COMMIT: roll forward finite after-images/objects/refs once; never restore old state. No new peer work could have run through supported APIs before active recovery completed. If a target is neither exact before nor exact after, stop; do not overwrite a peer. After recovery, later B edits run normally and must survive all cleanup.
    - Post-COMMIT/pre-release parent death: setup stays committed and activation is interrupted/uncertain. Keep bound process identity; close/kill unreleased waiting bootstrap if provable. Never infer nonexecution solely from missing acknowledgment, never respawn automatically. Fresh authorized activation requires old attempt dead/settled and preserves stable resumed actor.
    - Retention owner `PickupPublication::finish_and_retire`: FIRST copy/fsync immutable COMMIT into `HOME/.aida/pickup-publications/receipts/<tx_uuid>.json` with final install digest and activation disposition, plus validated repo mirror. Consumers reference THIS retained receipt, not a soon-deleted journal. Retain an append-only activation observation chain (release-sent/ack/exec-error/ended); none expands scope or substitutes for COMMIT. Missing/corrupt referenced receipt blocks authority, not a legacy fallback.
    - Only after receipt readback, all installs/events verified and activation disposition retained may owner clear/fsync active coordinator slot. Then remove bulky journal generations/undo/redo/temp payloads; cleanup after slot-clear is idempotent and cannot touch installed targets, shared history or receipts. Crash during cleanup leaves harmless transaction-only files; receipt remains discoverable by grant/manifest publication_id. Pin any Git objects still referenced by evidence in repository retention refs before deleting durable bundles. Referenced grants/manifests/receipts/native identity and operation evidence are not garbage-collected by session cleanup. Do not remove a receipt merely because a process ended. An aborted cleaned transaction needs no retained authority receipt or invocation lifecycle record.

    The coordinator is a HOME publication recovery locator, not a second authorship/authority database. Grants and existing session manifests remain the authority/evidence records; receipt is the retained proof that their multi-resource publication committed. Fail-closed missing-A availability cost is explicit. No tree scan, lock upgrade, post-hoc child binding, environment proof or broad snapshot restoration is part of this mechanism.

    First-write inventory and treatment

    | Existing early effect | Required treatment before/within the transaction |
    | --- | --- |
    | Synthesized queue row; rework queue removal/add/reorder | Stage against current locked role-queue bytes; no activity event before commit. Keep permanent queue sidecars. |
    | Canonical status, reopened_at_sha, rework reason/history, calibration tags | Staged object update and one staged canonical store commit; no status/history append or auto-bump before final decision. Include rework --work prefix operations. |
    | Complexity/effort calibration local files | Stage final bytes with current preimage; do not run best-effort live upsert before authority. |
    | Pull, fetch, refs and FETCH_HEAD | Remove shared pull/background fetch from pickup's setup path. Perform required base inspection/fetch privately; publish only selected new branch/base objects through the prepared transaction. No FETCH_HEAD write. If synchronized main/store is required first, refuse with a separate manual pull command rather than secretly pulling in this invocation. |
    | Dormant predecessor cleanup / --steal / held branch retirement | No unrelated cleanup or main/worktree GC in pickup. Stop live-owner steals before staging; offer separate manual action. For a provably dead same-assignment predecessor, journal only its exact lease/manifest runtime changes and retain evidence; never delete its code/worktree as part of authorization. Keep TASK-1337 manual retirement offer. |
    | New worktree/branch, stack files, existing resume cwd | Precompute private checkout/admin entries; exact target absence or locked expected existing metadata; no edits/reset of a peer's existing worktree. Incompatible occupancy refuses before mutation. Stack metadata is an enlisted file. |
    | Lease, manifest, receipt, session env, agent registry | Prepared together; reciprocal grant/assignment joins; only active on committed publication. Failed retention aborts rather than spawning. |
    | Reviewer-file reset, punt/hold/exit signals, headless logs | Archive old evidence; stage reset of runtime signals only. Never erase canonical review history. Create logs after final authorization; refusal has no vendor log/sentinel. |
    | Grant, run marker, phase session, drain snapshot and drain lock ownership | Stage/check bounded initial run or per-member update. register_run/snapshot membership logically precedes status and child release. Do not claim existing live run merely from shared current. Existing drain lock is retained as ownership gate, with new initial ownership write enlisted; later admission preserves peer members. |
    | History/events/cache | Buffer until commit; exact event UUID dedup on recovery; no append-then-counterevent. Readied test caches prevent unrelated lazy writes from masking lifecycle changes. |

    Real CLI witness matrix (proposed, not run)

    Extend aida-cli/tests/queue_work_dry_run.rs, keeping task_1337_delegation_refuses_before_any_pickup_mutation, task_1337_held_branch_refuses_before_any_pickup_mutation and task_1337_post_setup_launch_error_prints_manual_guided_continuation. New fixture snapshots canonical objects AND history/store HEAD, role queue metadata, refs/reflogs/FETCH_HEAD, worktree list/admin entries/dirs, leases/manifests/env, calibration/stack files, grants, registry, run/drain records, review/signal files, transaction staging and vendor logs. Preinitialize cache and infrastructure locks; also test missing infrastructure refusal with no created residue. Always use isolated HOME/AIDA_HOME, temp store/git repo, actual aida CLI, fixture grants, fake vendor/forge and no-vendor sentinel.

    Use these REAL supported argv shapes with fixture S, PR-N, B and an existing fixture Claude conversation UUID C:

    - `aida queue work S --guided --role implementer --no-pull --vendor claude`
    - `aida queue work S --fresh --no-human=both --role implementer --no-pull --vendor claude`
    - `aida queue work S --resume=C --no-human=both --role implementer --no-pull --vendor claude` (also interactive --resume=C without --no-human).
    - `aida queue work PR-N --role reviewer --no-human=both --no-pull --vendor claude` (also interactive reviewer and supported reviewer resume).
    - `aida queue work S --no-launch --session-id C --role implementer --no-pull --vendor claude` as the explicit setup-only contract; ALSO exercise actual App::spawn_tab/queue_work_argv/PtyHost::spawn, which normally launches queue-work without --no-launch.
    - `aida queue work --batch B --auto-complete=through-ci --no-human=both --vendor claude`; `aida queue work next2 --auto-complete --no-human=both --vendor claude`; `aida queue work S --auto-complete --no-human=both --vendor claude`; `aida queue work S --auto-complete --from-pr --no-human=both --vendor claude`.
    - `aida queue rework S --work --for implementer --reason fixture --no-pull` and `aida queue rework S --resume --for implementer --no-pull` exercise the direct in-process call and its PRECEDING rework writes. Include preexisting InProgress and reopened fixtures; no --force used as an authority override.
    - `aida queue work --role implementer --dry-run`, explicit S --dry-run, --list-sessions, and --resume-drain --resume-dry-run remain read-only.

    bug_1808_headless_delegation_refusal_is_atomic: each relevant argv under nondelegating implementer (and wrong reviewer parent) with queued and implicit rows; assert explicit authorization error, no vendor process/sentinel and exact full-state equality. Include complexity/assist/effort flags and known invalid vendor/resume before first write.

    bug_1808_explicit_selector_does_not_change_launcher_authority: valid delegating advisor/product/integrator selects implementer at head, explicit S, batch and synthetic row; the same selector under a nondelegating actor refuses. Fixture roster/grants determine delegation, not assumed seat names. PR/MR keeps reviewer. Diagnostics report both selector and validated authority.

    bug_1808_all_entrypoints_preflight_before_mutation: execute the entire argv table through production dispatch/RealPhaseDriver using fake vendor/forge. Assert one issuance per launcher/phase, zero recursive issuance per assigned consumer; no reviewer grant demanded in through-ci, no implementer demanded in --from-pr. Rework refusal includes prior status/history/queue prefix. Initial bounded batch has no writes if a required initial seat fails; dynamic member refusal preserves prior committed member history.

    bug_1808_preflight_races_fail_closed: deterministic test-only process barriers after P0 planning, before P2 first installation and immediately before P4 final validation. At each barrier revoke via the real supported authority writer, expire via controlled clock, change roster via supported team command, or race a peer queue/spec/comment/run update. A peer that wins before locks is preserved in the locked baseline; a peer arriving during installation waits until commit/abort, then applies normally. Test authority revocation queued behind the lock to document the linearization, AND expiry during installation to prove abort. Inject failures after EACH resource installation, disk-write failure and process kill with PREPARED vs COMMIT journals. Assert no vendor, no invocation-owned residue, identical original history (plus only legitimate peer history), intact peer rows/token membership, no stale backup restoration. Include refs/store commits and worktree metadata, not only queue count. Verify recovery through a DIFFERENT CLI reader before comparing the final snapshot. Child-launch failure after valid P4 instead verifies manual continuation.

    bug_1808_assigned_phase_is_not_recursive_delegation: run production phase launcher with a nondelegating scoped implementer child; matching token/member/phase/attempt/grant/PID-start identity with retained native corroboration where available succeeds without issuing another grant. Wrong live member token, old attempt, wrong spec UUID/repo, missing manifest, stale PID/start, caller-invented C, forged flags and inherited driver handle all refuse without writes. Exercise both background and pane-host command construction. Reviewer/resume wrappers issue no extra child and preserve actor identity. TUI later activation after grant expiry refuses without altering its preexisting authorized setup.

    Retain role-selection unit tests and source-contract tests only as supplements. Existing assert_pickup_unstarted does not suffice; it omits most of this state. No tests, live queue-work experiment, source edits, grants, queue/status/hold mutations or merge were performed in authoring this revision.

    V3 baseline evidence (all at 199e591b07aa76a59cd34f0a41946f918501f6ba)

    - `queue_cmd.rs:10936,10968` preflights delegation only when !no_launch && !no_human, then synthesizes rows/calibrates. `session.rs:1179,1221,3035,3063` creates logs then child grants; `exec_vendor_headless` at 2769 inherits command environment without that issuance. Covered paths must converge at the new parent publisher.
    - `lib.rs:112172,112254` builds a queue-work subprocess; `112369` chooses pane/background. `pane_host.rs:154` wraps a shell command and return-code rendezvous. They do not already have a waiting-process handshake. `lib.rs:32510,32614` starts foreground vendor before registry write; `29446,29675` native background dispatch delegates to Claude's daemon then parses a short session ID, not a PID binding.
    - `aida-tui/src/app.rs:1147,1355` actually spawns queue-work through PtyHost and passes --session-id/--resume for Claude; no-launch is a separate CLI case. Persisted TUI state at spawn_tab must not report refused work as successfully launched.
    - `lib.rs:105350` register-before-status; `drain_state.rs:648,693` checked membership registration and permanent snapshot locking; `orchestrator.rs:88` RunMarker lacks actor/grant/assignment fields. Add the exact reciprocal phase join; shared current/spec alone is insufficient.
    - `global_queue.rs:54,67,101` is home-global, creates path dirs and uses per-role mutation locks. `seat_authority.rs:35,58,104` writes home grants and reads current grant without shared transaction discovery. `aida-core/src/team.rs:223` writes/commits independently. Home coordinator and guarded read/write integration are new, essential mechanisms.
    - `aida-core/src/storage.rs:780,1674,1722`, `db/git_backend.rs:556,604,1042,1428`, `db/cached_git_backend.rs:1322,1363` are concrete mutation seams; `db/store_lock.rs:44` is the existing store lock. None provides the proposed multi-resource staged commit. Each enlistment needs implementation and real-entrypoint verification.

    V3 exact barrier witnesses — PROPOSED acceptance tests, none run

    1. `bug_1808_cross_repo_recovery_preserves_peer_queue`: two temp repos A/B sharing ONE fake HOME/AIDA_HOME, primed cache/locks, real binary. Kill A after provisional global queue AND grant install in PREPARED; invoke B's real queue list/next and queue add/remove, plus role/grant authority read and supported writer, including from outside any project. Each recovers A BEFORE B locks/use, or explicitly refuses without exposing/changing provisional state. Assert A status/history/refs and invocation write-set restored; later legitimate B row/history edits survive. Repeat at COMMIT before ref finalization, receipt-retained before slot clear, after slot clear during cleanup, after bulky journal deletion, and with missing/moved/unavailable A, missing journal/payload/COMMIT/receipt and locator-root mismatch. COMMIT case preserves setup and objects, never rollback/respawn. Missing A case blocks rather than scanning. Drive different CLI processes, not recovery helper alone. A supported grant read cannot return a provisional grant even if its JSON parses.
    2. `bug_1808_bound_bootstrap_first_action_barriers`: fake vendor FIRST action writes sentinel AND invokes assigned pickup (or review start/record). Through real fresh/resume/headless/standalone-reviewer/foreground-agent launch, production phase background/pane and actual TUI PTY, delay/fail L2 binding, kill parent before release, close channel, mismatch attempt/member and expire before P4. Pre-COMMIT failures: sentinel absent, no vendor process and exact lifecycle snapshot restored plus legitimate peer edits. COMMIT/pre-release death: sentinel absent, committed setup retained, next CLI reports interrupted activation and never respawns. Positive matching nondelegating child executes exactly once with one scoped issuance, never recursively issues. Resume preserves actor; sibling reviewer actor is distinct. Unsupported native --bg / missing containment or OS adapter explicitly refuses before writes. Do not label these unsupported variants positive passes.
    3. Extend `bug_1808_preflight_races_fail_closed`: barriers after P0, before first P3 install, after each install, after real PID bind, immediately before P4, after COMMIT, before RELEASE and during cleanup. Supported revocation/roster changes that serialize before P4 win; those blocked behind held home lock run after commit (test does not wait for their completion while blocking publisher). Controlled-clock expiry during P3 aborts. Peer queue/spec/comment/run change before lock is incorporated; peer arriving under lock waits then sees committed/recovered state. Failed cleanup is explicit incomplete recovery, never passing unchanged-state refusal. Stage code/store objects then kill/delete temp preparation before recovery to prove durable pack/payload independence.
    4. Extend `bug_1808_assigned_phase_is_not_recursive_delegation` through actual phase launcher and tmux socket bootstrap: true nondelegating scope works once; forged env, caller UUID, host PID, stale PID/start, wrong token/member/phase/attempt, parent death and native-resume mismatch refuse. TUI setup-only then expired activation preserves prior setup with no new residue; actual App::spawn_tab path is separately tested. --from-pr and through-ci demand only selected phase seats. Batch first-admission failure leaves no root-run prefix; later dynamic refusal retains committed peers/history. TUI Codex requested resume cannot silently mint a fresh actor.
    5. Preserve ALL v2 real argv/full snapshot cases above and all three TASK-1337 CLI tests. Snapshot includes canonical history/store HEAD, role rows, reflogs/FETCH_HEAD, worktree admin/index/dirs, grants/manifests/receipts, bootstrap descriptors/staging/run membership, calibration/stack/review/registry/markers and vendor logs. Infrastructure lock inode identity remains fixed. No source-string-only witness establishes this protocol.

    Independent review disposition / limitations

    This revision selects one discoverable journal/receipt protocol and one parent-bound launch protocol. These are proposed implementations, not verified capabilities. Native daemon --bg cannot satisfy the current handshake and is explicitly unsupported; namespace/platform adapters without real peer/process identity also refuse. Missing A deliberately blocks home-global authority/queue operations until its identity is restored; no root-rebinding convenience override is proposed. Unsupported finite-write-set Git/storage variants refuse before mutation. The independent advisor may sign these explicit fail-closed boundaries or name a required positive adapter as a concrete remaining blocker. No acceptance relaxation, self-approval, implementation dispatch or merge permission is supplied. No tests were run and no live state was experimentally changed.
