    ## 3. Owner, trigger and boundary

    The owner is the BUG-1808 common owner, as the core-accessible store-CAS join of the common substrate. The join is implemented in the owning family files; there is no second launcher, schema, lock or broker. TASK-1332's parent C rows consume it. The trigger is any of the 17 family entrypoints in §7, reached from the CLI, core public APIs, MCP or the server. The join runs no ordinary S/L/P work, which belongs to TASK-1717 and later L slices. It runs no launch release, and it carries no TASK-1607 occupancy or BUG-1802 policy.

