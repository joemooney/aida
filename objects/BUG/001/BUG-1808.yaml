    ## 8. Lock matrix

    Columns: HOME publication (proposed), canonical REPO, SEAT (TASK-1607), STORE (`store-write.lock`), `blocks.lock`, FileDispenser sidecar, scheduler tick flock, queues/drain/manifest/verdict/merge, cache/SQLite, peer STORE, Git ref/index.

    - S0, S1b, S2, S4, S5, S8: NONE of these. The v5 pump in S2 holds no AIDA lock (v5 condition 5). The pre-push hook in S4 runs with no AIDA guard held, so a hook that enters `aida` cannot form a cycle.
    - S1a and S3: STORE only, finite, with no network or child wait.
    - S6: HOME -> (REPO) -> STORE, never SEAT. The install is network-free. A1 order holds (STORE -> `blocks.lock`). STORE -> cache is kept, with no cache refresh inside the region.
    - S7: the peer clone's STORE alone, never nested under our own STORE or HOME. It is the existing lock keyed to the peer's canonical root, not a new lock.
    - The scheduler tick flock may enclose a ledger operation (existing tick -> store), but never the reverse edge. This flock is not one of the critical flocks barred from spanning network.
    - No seat, cache, queue, drain or manifest critical lock is ever held across S1b, S4, S5, hooks or waits.
    - A drain heartbeat thread takes its own closure. If the main thread holds HOME through a P2–P4 section, the heartbeat waits, which is bounded and safe given the TTL. `DrainGuard::drop` stops and joins the heartbeat BEFORE taking HOME or STORE, never while holding them (TASK-1332 A3).
    - No guard crosses into a child process, and no lock FD is inherited (S4's push child and S2's sealed domain receive none).

    New edges: only HOME -> STORE inside S6, which already exists in the signed order, and a lone acquisition of the peer STORE. No reverse edge is introduced.

    ## 9. Hook closure

    - The S2 candidate commit (and the private rebase when L is not empty) runs inside the v5 sealed domain with the production hook bundle:
      - store pre-commit early exit plus sentinel;
      - prepare-commit-msg store recipe with skip/absent disposition recorded;
      - commit-msg literal-config parsing;
      - post-commit sentinel match/mismatch;
      - reference-transaction against the sealed private starting-ref map (raw zero-old ≠ proven absence);
      - post-rewrite;
      - the notes-copy no-op edge;
      - `GIT_EDITOR=:` for continuation.

      No hook is disabled, no guard environment is spoofed, and no Internal command is re-entered (v5 conditions 1–4; TASK-1332 A3, which established that Internal dispatch is not a cache deadlock). Installed and template profiles are tested separately.
    - The S4 pre-push is NOT callback-capable and supplies no callback evidence:
      - The installed profile (`.git/hooks/pre-push`, BUG-1706) runs mirror-push only.
      - The template profile (`remote_create.rs` generator plus `identity_gate_hook_lines`, TASK-1330) runs the identity gate, then mirror-push.
      - `mirror_push_refspecs` (remote_create.rs:1315) skips `refs/heads/aida-store` by design, so no unconfirmed store mirror occurs. Store fan-out remains the existing store-leg job after origin confirmation (BUG-1803 rule preserved).
      - If the identity gate refuses, nothing is sent and the remote does not accept. §10 reports that as a failure without spinning.
    - The S6 install consumes TASK-1717's A3 profile: the store guard stays continuous through local rebase and commit hooks; the installed post-rewrite exits early in a linked worktree; pre-push and mirror stay outside. Once the common publisher exists, the same import moves into the v4/v5 adapter.
    - No hook runs under SEAT. No hook receives a store or home guard.

    ## 10. Remote observations and ambiguous transport (A2-4)

    Classification never parses free-form prose. It uses porcelain status lines, exit status, and a fresh observation:

    1. A porcelain `<TAB>C:refs/heads/<b>` line with flag ` ` (fast-forward) or `*` (new ref), and a zero exit, means `Accepted{tip=C}`. `+` cannot occur because no force is ever passed. `=` means C is already the tip and is handled as AdoptPrior.
    2. A porcelain `!` line for our ref means `RejectedProved`. Git reports a client-side non-fast-forward or fetch-first as `[rejected]`, and a server-side hook or update refusal as `[remote rejected]`. Neither applies the update.
    3. Anything else is UNKNOWN. That covers a timeout or kill at the deadline, transport errors, a missing status line, and a pre-push hook exiting nonzero. Then:
       - Fetch a fresh tip T (S1b mechanics). If the fetch fails, the result is `Unreachable`.
       - If C == T, or C is an ancestor of T, the result is `Accepted{tip=T}`. Go to S6.
       - Otherwise, if R (and B's remote base) is an ancestor of or equal to T, the result is `NotObservedAfterExit{T}`.
       - Otherwise (R is not an ancestor of T: a rewind or force-push) the result is `RemoteRewound`. Stop with `Unknown{evidence}`: no retry, no Acquired, no local effect.

    On `NotObservedAfterExit`, the next attempt builds C' on T. Git's server-side old-value check (the receive-pack ref update is expected-old-checked) means C and C' cannot both land on the same advertised base. A delayed application of C after the client died succeeds only if the ref still equals C's expected old. In that case C' is rejected, and the next decision sees our attempt's record and ADOPTS it through the `AttemptIdentity` stamp. This is why the identity stamp is fixed per operation (no duplicate node id or range).

    Two consecutive Unknown outcomes with T == the previous T and no acceptance stop the operation with `Exhausted{last_cause}`, which covers deterministic hook refusals.

    Current-successor rule: in every family, S2's decision and S6's re-verification evaluate the CURRENT record, not our attempt's history. If a successor reclaimed or re-hijacked after our acceptance, we report the successor state and never reclaim. A no-change local commit is never treated as remote proof.

    ## 11. Accepted remote with failed local install, and recovery (A2-3)

    If S6 fails after `Accepted` (store unsafe, lock timeout, an import conflict on a path with no union rule, an I/O error, or a crash), the result is `AcceptedInstallIncomplete{operation_id, family, R, B, C, T, attempt stamp, failing step}`. The family's local success is not claimed: no Acquired, no node.toml, no lease. Concretely, there is:
    - no reset;
    - no inverse remote push;
    - no new ownership attempt for this operation;
    - no deletion of the accepted record;
    - no retry that re-decides.

    Recovery follows from three facts:
    1. The accepted content is already on origin, so the next ordinary S import (TASK-1717) imports it.
    2. Family-local effects (node.toml, the own-marker clear, the peer marker) complete only through an explicit re-invocation of the SAME family entrypoint. That re-invocation runs S2 against a fresh base, and `AdoptPrior` matches the retained stamp. That is adoption, not replay.
    3. Claims that were accepted but never installed are not used, so existing staleness covers them: a same-host session probe finds no local lease and falls back to the TTL; process-backed claims follow PID-start; remote hosts follow the TTL.

    Evidence is retained as an append-only record in the common receipt/observation namespace (v5 condition 5), together with a bundle of C. Lifetime is independent of shared pruning, and there is no new pending-claim schema (R-2). Until the common namespace exists, Stage B (§15) is not dispatchable for families whose recovery needs evidence across invocations (#9, #13, #16). Within a single invocation the stamp suffices.

    ## 12. Hijack peer-marker lifecycle contract (A2-5) and faults

    Contract: a `HIJACKED.toml` in clone X's `.aida-store/.aida/` means that origin has accepted a re-attribution of `marker.node_id` away from X, and that X has not since re-acquired that id locally. It is advisory, never authority, and never consulted by seat_authority.

    Ordering:
    1. **S0:** decide reachability (same host, same user, the recorded clone_path exists and is not ours, its `.aida-store/.aida/` is writable) and record the marker's expected path and pre-image (absent, or bytes plus identity). No write.
    2. **S4/S5:** no marker exists before acceptance. Rejected, NotObserved, Unknown, Unreachable and Exhausted therefore never touch the peer root. Nothing needs restoring, and nothing is ever removed by pathname.
    3. **S6 (own root, under our own STORE):** write node.toml. Clear our OWN marker only if its `node_id == target_id` (we re-acquired that id). A marker about a different id is kept.
    4. **S7 (after our STORE is dropped):** acquire the peer clone's existing store lock alone, with the existing timeout, then:
       - Read the peer's `.aida/node.toml` and current marker.
       - Skip if the peer re-acquired the target after our accepted stamp (peer node.toml shows the target with a newer `registered_at`).
       - Write our marker by temp file, fsync and atomic rename if the marker is absent, or if it describes an older re-attribution of the same id that our accepted hijack supersedes (its `new_owner` equals our expected old owner).
       - If it already equals our identity, do nothing (idempotent).
       - Otherwise LEAVE it and report `marker conflict, not installed`, preserving the peer's marker.
       - If the root is unreachable or unwritable, or the peer lock times out, report the existing `Reattributed{reason}` outcome honestly.
    5. The peer's own later re-hijack clears the marker in its own S6 under its own lock. That is the same lock as step 4, so steps 4 and 5 serialize.

    Faults:
    - A crash between S6 and S7 leaves no marker, and a re-invocation adopts and completes S7.
    - A peer re-hijack accepted remotely but never installed locally can leave a stale-positive warning until that peer's next `node acquire`/`hijack` runs.

    That residual race exists between two independently accepted remote operations and an advisory local file. Removing it would require a distributed transaction, which is not approved, and the race is disclosed. Holding our STORE while taking the peer STORE is forbidden, which prevents a two-root deadlock when hijacks are mutual.

    ## 13. FORK F-1: claim acquire inside BUG-1808 strict-refusal entrypoints (UNRESOLVED)

    Concrete counterexample, using only signed constraints:
    - **(i)** Strict refusal. A covered pickup (`queue work` -> queue_cmd.rs:12077 -> `session_start` -> lib.rs:38569 `acquire_claim`), or a covered drain (run_auto_complete -> drain_lock.rs:370 `acquire_lock_claim`), must refuse with NO invocation-owned lifecycle residue whenever a supported revocation, expiry or roster change serializes before its final P4 (A–E C; launch condition 1). The original BUG-1808 text names "lease".
    - **(ii)** The existing STORY-637/638 positive, preserved by the TASK-1332 claim positives: a live foreign cross-clone claim refuses before setup.
    - **(iii)** Pickup does no hidden push or pull (v3 P1 "No live pull/fetch/FETCH_HEAD/refs"; v4 "pickup still does no hidden push/pull").
    - **(iv)** No distributed transaction, authority freeze or new schema (A2).

    By (ii), the claim must be won at origin before setup installs. By (iii), it cannot be won inside the publication. So the winning push either sits in the same invocation before P2 or is impossible. Take the first case: our claim is accepted at origin at time t1, before P2. A supported revocation serializes at t2, with t1 < t2 < P4. By (i), the invocation must refuse leaving nothing. But the remote record from t1 can be removed only by a second remote publication. If origin becomes unreachable after t1 (a supported condition; "configured unreachable remote is not no-origin"), that removal cannot finish, and (iv) forbids making t1 conditional. So (i)–(iv) contradict each other. This holds for the session lease and for process-backed drain claims, whose remote-host peers stay blocked until the TTL.

    The minimal technical missing owner decision is one of the following. Each changes acceptance or product behavior, so this author cannot choose:
    - **D-F1a:** classify the cross-clone coordination record (`coordination/leases/*`, `coordination/locks/*`) as an advisory effect outside the strict-refusal snapshot. Its existing contract is already best-effort with staleness bounds. A refusal path would make one forward conditional release (§7 #3/#6), and a failure would be disclosed with exact evidence. This relaxes the acceptance scope, which is an operator decision under A–E.
    - **D-F1b:** commit then claim. Local C first; the claim runs after C and before vendor release. A foreign winner becomes "committed setup, dispatch cancelled", with setup retained and manual retirement, under the launch "cancellation after C" row. This changes the refusal surface of STORY-637/638: it is a product decision.
    - **D-F1c:** an explicit separate claim command before pickup, so the claim is pre-command state for the pickup. This is a UX/product decision.
    - **D-F1d:** remove cross-clone claims from covered entrypoints. This regresses STORY-637/638.

    The author's recommendation, for the decision owner only: D-F1a, because it matches STORY-637's own documented best-effort/staleness contract and keeps every other signed rule.

    Until F-1 is decided, the BUG-1808 production pickup/drain integration cannot enlist `session_start`/`drain_lock` with a cross-clone claim. This is a concrete blocker within BUG-1808 gate 2. Claim acquire OUTSIDE covered entrypoints is resolved by §5–§10: plain `session start`, MCP `session_start`, `aida solo`, and any caller where no later local P4 can refuse after the push.

    ## 14. Precedence rulings requested (engineering, not product forks)

    - **R-1 (roster).** v4 says a team write commits locally first, keeps that history on rejection, and reconciles privately. TASK-1332 V2 signoff says roster is C, and that no rejected candidate may reach the canonical branch. I propose remote-first C (§7 #7), for three reasons:
      - The source's intent is remote-first already (reset on rejection), and local-first effects today exist only through defect D6.
      - Writer authority is invariant within the invocation (§6b).
      - `pull_rebase_auto_merge` has no `registry/team.toml` union rule, so a retained local-first commit would wedge on any concurrent member edit, or would need a new intent-preserving reconciler.

      If approved, this supersedes v4's "after a rejected push retain the committed local history … reports unsynchronized committed local state" for the roster family ONLY. v4's no-`HEAD~1`, private reconciliation and guarded-publication rules still hold. Alternative: keep v4 and add an intent-carrying team.toml reconciler, which is more mechanism with no gain.
    - **R-2 (evidence location).** Retain store-CAS evidence as typed payload kinds inside the signed common receipt/observation namespace, rather than as any new record family. The advisor must confirm this counts as consuming the signed schema, not adding one.
    - **R-3 (no-origin handling where none exists).** At bf652209, `hijack_node`, `unregister_node` and `db block claim` have no no-origin branch: each commits (hijack also writes the peer marker), then bails when the push errors. Proposed: refuse before any mutation, keeping today's net error without leaking effects. Alternative: L, consistent with BUG-40 registration and `auto_allocate_block_inner`.

    ## 15. Dispatch gating, staging, and separation from TASK-1717

    - **Stage A** (dispatchable only after NEW advisor approval; inactive, no production caller): pure `decide`/`AdoptPrior` per family, the porcelain and observation classifiers, the ancestry rules, and the marker planner. Tested against local bare remotes with real Git 2.43 (§16). This is like the 6a1733 component checkpoint.
    - **Stage B** (production C for families #3–#16 except F-1-dependent callers): gated on v5 `SealedGitDomain`/`PreparedGitStep` (BUG-1808 gate 3), on the TASK-1717 S import being independently accepted at an exact head, and, for #9/#13/#16 recovery across invocations, on the common observation namespace (R-2). Hand-built `commit-tree` or hooks-off candidates are forbidden.
    - **Stage C:** claim acquire inside covered entrypoints, after the F-1 decision and BUG-1808 gates 1, 2 and 4. Roster's home-first install is part of the common enlistment of all store imports (gate 4), with no separate C gate.

    Separation from TASK-1717: this join CONSUMES the TASK-1717 closure and S import as reviewed. It does not edit, copy or duplicate them, adds no lock, and claims no global exclusivity. Unconverted writers can still race. TASK-1717's doer is not dispatched by this assignment, and its unreviewed head `a6fac83f5c` is not a dependency.

    BUG-1808 common production, TASK-1607 and BUG-1802 consumers stay gated. TASK-1612 is not an accepted transport, and nothing here releases a vendor.

    ## 16. Witnesses (ALL PROPOSED, NONE RUN)

    Conditions for every test:
    - Isolated temporary stores with local bare origins, fake HOME/AIDA_HOME, a stripped AIDA identity, owned processes, deterministic barriers, and real Git 2.43/files/SHA-1.
    - Production entrypoints: `aida session start`, `aida team allow-seat`, `aida node acquire/hijack`, `aida db block claim`, scheduler tick, and drain start. Not helpers alone.
    - Before, barrier and after snapshots of origin refs, local refs/reflogs/index/worktree, registry files, node.toml, markers, private-ref absence and lock inodes.
    - A receive-pack wrapper on the bare origin (fixture only) to inject a delay or kill after the ref update, so ambiguity is real.

    Witnesses:
    1. **`store_cas_candidate_never_canonical`.** Barrier after S2. A peer runs an ordinary sync and a full `git for-each-ref --contains C`. C is in no shared ref, index or worktree, and is not on origin. After a rejection, C is never published by any later sync. Positive: uncontended Applied.
    2. **`store_cas_exact_oid_binding`.** The local branch advances between S3 and S4. Origin's tip must equal C exactly, not local HEAD. The pre-push stdin carries C. The template identity gate refuses a non-allowlisted author with no acceptance and no spin. Paired positives for both the installed and template pre-push profiles. Mirror is skipped for the store branch.
    3. **`store_cas_object_lifetime`.** `gc --prune=now` and an aggressive repack in the shared repo during S2–S4. The candidate stays constructible from the private hardlinked closure. A transport copy lost from the shared object store yields Unknown and a safe retry, never corruption.
    4. **`store_cas_family_contention_positives`.** Two clones race on each family:
       - lease, drain and solo: one Acquired, one Refuse; the force path is retained;
       - roster: disjoint members both survive; allow-seat keeps a peer's concurrently added seat; disallow of an absent seat is NoOp;
       - alias: union;
       - node: two automatic registrations get distinct ids; an occupied requested id refuses;
       - block: ranges are disjoint and respect the counter floor;
       - ledger: disjoint fields survive; debounce gives NoOp;
       - heartbeat and release: own operation OK; the successor is preserved; a stale-release with a mismatched heartbeat is NoOp.
    5. **`store_cas_ambiguous_transport_adopts_once`.** Kill the client after the server's ref update yields Unknown -> Accepted -> install. Kill before sending yields NotObserved and a retry, with at most one landing. Delayed server application racing C' leaves exactly one record. The automatic node id is never duplicated, the range is never duplicated, and the claim is adopted.
    6. **`store_cas_remote_rewound_blocks`.** A force-rewind of origin during Unknown yields `Unknown{evidence}`: no retry, no Acquired, no local effect.
    7. **`store_cas_accepted_install_incomplete`.** Inject an unsafe store state, a lock timeout, an import conflict on a path with no union rule, and a disk error at S6. Each yields AcceptedInstallIncomplete with no reset, inverse push or second attempt. The next ordinary pull imports the content. Re-invoking the same family adopts, and node.toml is written exactly once.
    8. **`store_cas_no_origin_vs_unreachable`.** Every family with no origin keeps its existing L, Unavailable or refusal. With a configured but unreachable origin there is no local speculative effect, except ledger offline retention, which is labeled local-only. Hook tick `push=false` does no network.
    9. **`store_cas_current_successor`.** After our acceptance and before S6, a peer stale-reclaims or re-hijacks. We report the successor and never reclaim.
    10. **`hijack_peer_marker_ordering`.**
        - Barrier between S4 and S5: no peer marker exists.
        - A rejected attempt never writes one.
        - With two concurrent hijackers, only the winner's marker exists and the loser never deletes it.
        - A peer re-hijack after our acceptance ends with no marker.
        - A peer node.toml showing a newer re-acquisition makes us skip.
        - An unwritable root reports Reattributed.
        - Our own-marker clear happens only when its `node_id` equals the target.
        - The peer lock is never held nested with our own: a mutual-hijack deadlock probe completes within bounds.
    11. **`store_cas_lock_order_no_network_under_guard`.** Instrumentation shows no HOME, STORE or SEAT guard held during S1b, S4 or S5, or during pre-push. No lock FD reaches the push child or the sealed domain. A heartbeat thread under a HOME-holding drain section waits without deadlock. `DrainGuard::drop` joins before HOME or STORE.
    12. **`store_cas_sealed_candidate_hooks`.** v5 domain with both the installed and template store hook profiles. Sentinel match, missing and stale cases. Executable commit-config refuses before setup. No hooks-off path.
    13. **`claim_acquire_strict_refusal_counterexample` (F-1 characterization; MUST stay failing/open until F-1 is decided).** Covered `queue work` with a revocation between claim acceptance and P4, and origin made unreachable. It shows the remote claim residue. It is never counted as a pass.
    14. **`store_cas_second_rejection_and_exhaustion`.** Repeated contention exhausts the limit with failure, never partial success.
    15. **`release_identity_after_refresh`.** A successor's reclaim between the old sample point and the pull is preserved (D7).
    16. **`store_cas_nonvacuity`** (scratch copies only, each restored afterward). Remove one guard at a time, confirm a named witness fails, then restore and confirm it passes:
        - the exact-OID refspec, replaced by a branch-name push (#2);
        - the private candidate, replaced by an in-place commit on the shared branch (#1);
        - AdoptPrior (#5);
        - the expected-old hijack predicate (#4/#10);
        - post-acceptance marker ordering (#10);
        - the S3 relevance check (#1);
        - the current-locked reread, replaced by reset-to-L (#7).

    ## 17. Limits

    - This is design and source reading only. Git server-side ref-update semantics, porcelain flags, the pre-push stdin form for OID refspecs, and hardlinked-clone lifetime are grounded in documented Git behavior and must be confirmed by witnesses 2, 3 and 5. None of them was executed here.
    - The supported local same-UID model applies, as in v5. An origin rewind blocks; it is not resolved.
    - Legacy speculative commits already on local branches from earlier binaries (D6/D8) are indistinguishable from ordinary L history and are treated as such. Identifying them would need a new schema or a doctor slice, both outside A2.
    - Cost: S2 hardlinks the repository's object store per operation (about 1.1 GB of objects here; the store has 45,796 commits). Across filesystems it copies instead. Planners must budget finitely.
    - The F-1 residual is stated, not fixed. The hijack stale-positive race (§12) is disclosed.
    - No claim is made about TASK-1612, the 6a1733 primitives on main, or any runtime pass.
