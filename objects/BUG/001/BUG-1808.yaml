    New source facts verified for V2. All are pinned at bf652209 unless they name Git 2.43.0 (the installed version), and all are reading only, not execution:
    - **Git 2.43.0 `transport.c::print_one_push_report`.** `!` is used for `[rejected]` (non-fast-forward, already exists, fetch first, needs force, stale info, remote ref updated, shallow, atomic push failed, no delete), for `[remote rejected]` (server `ng` text) and for `[remote failure]` (`REF_STATUS_EXPECTING_REPORT`, "remote failed to report status"). `=` is `[up to date]`. `*` is a new ref. ` ` is a fast-forward and `+` a forced update. When the pre-push hook fails, `transport_push` returns -1 before sending anything and prints NO per-ref status.
    - **Git 2.43.0 manuals.** `git-index-pack --keep=<msg>` creates the `.keep` file before the index is moved into place. `git-repack` "does not delete .keep packs". `gc.autoPackLimit` ignores kept packs.
    - **`identity_gate.rs`.** `parse_pre_push_ref_lines:193` does NOT skip the store branch (TASK-1330). `handle_identity_check_push:399` reads the allowlist from the AIDA-discovered `project_root`. `commits_for_pushed_ref:263` runs `git log <remote>..<local>` in that repository and falls back to `<local> --not --remotes=<remote>`. Template pre-push = identity gate followed by mirror-push (remote_create.rs:1290–1302). The installed `.git/hooks/pre-push` here is a mirror-only BUG-1706 profile with no gate. `mirror_push_refspecs:1315` skips `refs/heads/aida-store`.
    - **`seat_authority.rs:136`.** `require_direct_tty` checks only that stdin and stderr are terminals. `require_direct_human:147` additionally refuses `AIDA_AGENT_NAME`/`AIDA_AGENT_TYPE`. `team_cmd` roster handlers call only `require_direct_tty`. The core `team::*_cas` functions run no check at all. The CLI wrappers are their only production callers, MCP exposes no roster/alias/node/block tool, and REST `set_team_role` is FORBIDDEN.
