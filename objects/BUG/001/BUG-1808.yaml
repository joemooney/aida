    # 7. Endpoint, P-transport and native pre-push profiles (F1, F2)

    ## 7.1 EndpointProfile (resolved in W)

    - `git -C W remote get-url --all origin` (fetch list) and `git -C W remote get-url --push --all origin` (push list). Both are after `url.*.insteadOf`/`pushInsteadOf`.
    - **Refusal before any mutation** (a named reason, never a silent choice) unless:
      - there is exactly ONE fetch URL and exactly ONE push URL; and
      - those two strings are byte-equal after rewriting. A different-string pair that might denote the same repository (for example ssh versus https) is UNSUPPORTED and refused.
    - The **transport profile** is `Native` for `file://`, local paths, `ssh://`, scp-like and `git://`. It is `Helper(<scheme>)` for `http://` and `https://`. Here it is `Helper(https)`.
    - The profile digest also covers `remote.origin.{receivepack,uploadpack,proxy,vcs,pushurl,url,fetch}` and the transport key set of §7.2.

    ## 7.2 Store transport profile versus P transport profile

    **Transport/identity/hook key set:**
    - `remote.origin.*`, `url.*.insteadof`, `url.*.pushinsteadof`;
    - `http.*` (including `http.<url>.*`), `credential.*` (including `credential.<url>.*`, with list resets);
    - `core.sshcommand`, `core.askpass`, `core.gitproxy`;
    - `protocol.*`, `transfer.*`, `fetch.*`, `push.*`, `uploadpack.*`, `gpg.*`;
    - `include.*`, `includeif.*`;
    - `core.hookspath` (store side only; see below).

    **Environment subset:** `GIT_SSH`, `GIT_SSH_COMMAND`, `GIT_SSH_VARIANT`, `GIT_ASKPASS`, `SSH_ASKPASS`, `GIT_TERMINAL_PROMPT`, `GIT_PROXY_COMMAND`, `GIT_CONFIG_PARAMETERS`, `GIT_CONFIG_COUNT`/`KEY_*`/`VALUE_*`, `GIT_CONFIG_GLOBAL`, `GIT_CONFIG_SYSTEM`, `GIT_CONFIG_NOSYSTEM`, `HOME`, `XDG_CONFIG_HOME`, `http(s)_proxy`, `HTTP(S)_PROXY`, `no_proxy`, `NO_PROXY`, `GIT_SSL_*`, `SSL_CERT_*`, `CURL_CA_BUNDLE`. This also covers the command-scope configuration observed here (S-F2).

    **Store listing:** `git -C W config --list --show-scope --show-origin`, restricted to the key set.

    **P listing:** `git --git-dir=P config --list --show-scope --show-origin`, restricted to the key set and run with the same environment snapshot.

    **Equality rule.** The multiset of (scope, key, value) must be equal. Repository-scope origins differ by design (W's `.git/config` versus P's config), and every other origin must be equal. This includes everything that conditional includes (`gitdir:`, `gitdir/i:`, `onbranch:`, `hasconfig:remote.*.url:`) pull in for each repository. Any inequality refuses with "private transport profile differs from store profile (<key>)". The rule is checked at PLAN, and again immediately before EVERY P network spawn and every push spawn.

    **hooksPath is the deliberate exception.**
    - P's effective `core.hooksPath` must equal `<p.git>/hooks-empty`. It is pinned in P's repository config AND passed per spawn as `-c core.hooksPath=<p.git>/hooks-empty`. The latter is appended to `GIT_CONFIG_PARAMETERS` after any environment-provided value, so it wins over command scope.
    - `hooks-empty` must be an empty directory. If any file appears in it, the spawn refuses.
    - The store's hooks path is recorded in PrePushProfile (§7.3) and is not compared with P's.

    **Spawn environment.** Every network child (P fetch, push) receives the same recorded environment subset, with no inherited lock FD and a closed FD set.

    ## 7.3 PrePushProfile: actual hook context (F1)

    - **Hooks directory:** `git -C W rev-parse --git-path hooks`. Here this is `/home/joe/ai/aida/.git/hooks`, from the local `core.hooksPath`.
    - **`pre-push`:** bytes, mode and digest. Classification:
      - absent;
      - BUG-1706 mirror-only (installed here);
      - generated mirror+identity (`MIRROR_HOOK_HEADER` plus `identity_gate_hook_lines`);
      - identity-only (`IDENTITY_HOOK_HEADER`);
      - custom (executed unchanged, digest recorded, effects never treated as AIDA evidence).
    - **Actual discovery the hook sees.** githooks(5): pre-push runs in the root of the working tree, which is W. The generated hook unsets `GIT_DIR`/`GIT_WORK_TREE`. `aida identity check-push` then resolves `project_root = find_project_root_from(W) = W` (the linked worktree resolves to itself). The profile records:
      - `gate_project_root = W` (canonical);
      - `allowlist_source = W/.aida/config.toml`, with its digest, or `ABSENT`;
      - `gate_state`:
        - `INERT_NO_ALLOWLIST` (here);
        - `ACTIVE(allowlist digest)` if a store-local config is present;
        - `FAIL_CLOSED_FALLBACK` if `aida identity check-push` is unavailable and `W/.aida/config.toml` mentions `allowed_emails`.
    - **Truthful statement.** At bf652209, store pushes from W are NOT gated by the project allowlist in `<project>/.aida/config.toml`. V3 preserves that behavior exactly: the push cwd stays W, nothing is moved to the main checkout, no allowlist is copied, no hooks are disabled, and nothing runs with `--no-verify`. Whether store pushes must enforce the project allowlist is TASK-1330's owner decision. Root relays it there (canonically relayed; peer-owner FYI `8a28900d`, as supplied by root). It is not decided in A2 and is not a Joe question.
    - **Re-checked immediately before the push spawn:** hook bytes, the hooks path, W's `.aida/config.toml` digest or absence, and the discovery result. Any change refuses before the spawn, with Cancellation followed by settlement NOT_SENT (§10.4).
    - **What the hook receives on stdin:** Git's own `<local-ref> <C> refs/heads/<b> <A>`. githooks(5) says an object-name source is supplied "as it was originally given", so the local-ref field is C's full OID text. W3 pins this. When the gate is ACTIVE, `commits_for_pushed_ref` (`identity_gate.rs:263`) runs `git log A..C` in W, whose object store is G, where C is kept (§6.5). The gate therefore evaluates C.
    - **Mirror fan-out.** `mirror_push_refspecs:1315` skips `refs/heads/aida-store`, so no unconfirmed mirror can occur. Store mirroring stays the existing origin-confirmed store-leg job.
    - **Callbacks.** No hook callback authority exists on this path; it is not v5 callback-capable Git.

    ## 7.4 The push

    `git -C W push --porcelain --no-force --end-of-options origin <C_k-full-oid>:refs/heads/<b>`

    - It runs as an owned child with deadline D_push (default 120 s), the recorded environment subset and no lock FDs.
    - `origin` is named so that the real remote configuration, insteadOf rules and the hook argument `$1` are exactly today's. The recorded single push URL must still be the only one (re-resolved immediately before the spawn).
    - A re-push of the same admitted C_k (§9.4) uses the identical command.

    # 8. Push decoder (F2, amendment A3)

    The decoder is pinned to Git 2.43.0 by the v5 profile executable digest. Bounds: stdout ≤ 64 lines, ≤ 4 KiB per line, ≤ 64 KiB total. Stderr is retained as bounded evidence and is never classified. Exit status is recorded.

    **Accepted stdout grammar.** Anything outside this grammar is INDETERMINATE:

    ```
    To <url>                                   exactly one, first; <url> must equal the profile's push URL after Git's
                                               credential anonymization (userinfo removed)
    <flag> TAB <from>:<to> TAB <summary>[ (<reason>)]   exactly one ref-status line; <to> == refs/heads/<b>;
                                               <from> == C_k full OID (form pinned by W1-a)
    Done                                       present iff Git reports overall success; required for ACCEPTED
    ```

    Several ref-status lines, zero ref-status lines, a missing or different `To` line, an unknown line, truncation, or a deadline kill all give INDETERMINATE. That includes a pre-push hook refusal, which prints no ref-status line.

    | Ref-status line | Exit / Done | Native profile class | Helper profile class |
    |---|---|---|---|
    | ` ` (fast-forward), summary `<old>..<new>` with new a prefix of C_k | 0 / Done | ACCEPTED_REPORTED | ACCEPTED_REPORTED |
    | `*` `[new branch]` | 0 / Done | ACCEPTED_REPORTED | ACCEPTED_REPORTED |
    | `=` `[up to date]` | 0 / Done | REMOTE_ALREADY_C (adoption still requires observation, §9) | REMOTE_ALREADY_C |
    | `!` `[rejected]`, reason ∈ {non-fast-forward, fetch first, stale info, needs force, already exists, remote ref updated since checkout, new shallow roots not allowed} | ≠0 | CLIENT_REJECTED (not sent) | CLIENT_REJECTED (helper-reported refusal of a not-applied update) |
    | `!` `[remote rejected]` (any text) | ≠0 | SERVER_REJECTED_REPORTED (receive-pack `ng`) | **INDETERMINATE**. Through the helper, a lost status (for example send-pack `--helper-status` "expecting report") can surface as a remote rejection, so it is never treated as proof. |
    | `!` `[remote failure]` | any | INDETERMINATE | INDETERMINATE |
    | ` `/`*`/`=` without `Done`, or with nonzero exit | any | INDETERMINATE | INDETERMINATE |
    | Helper death, helper EOF, `X`, `+`, `-`, unknown summary, wrong `<from>`/`<to>` | any | INDETERMINATE | INDETERMINATE |

    - **Native grounding:** git-push(1), local manual. `rejected` means Git did not try to send the ref. `remote rejected` means the remote refused. `remote failure` means it "did not report the successful update". V2 and the V2 review additionally cite Git 2.43 `transport.c::print_one_push_report`.
    - **Helper grounding:** gitremote-helpers(7), local manual. A helper's push reports `ok <dst>` or `error <dst> <why>?` lines followed by a blank line. The mapping from those to porcelain is in `transport-helper.c` (cited by the review, not re-verified offline). The helper column is therefore deliberately conservative: only the success forms with `Done` and the `[rejected]` forms are trusted, and everything else stays INDETERMINATE until observation.
    - **Fail-safe:** if the W1-a or W1-h witnesses show that a constant (the `To` form, the `<from>` form, `Done`) differs from this table, the decoder constant is corrected from the witness before activation. Until then every mismatch is INDETERMINATE, which is safe because it only triggers observation (§9).

    # 9. Per-candidate resolution, lineage aggregate and retry (F3)

    ## 9.1 Facts used

    - **What the server compares.** A sent update command carries old value A_k, the tip origin advertised at push time. Without force, Git sends a command only when the new value descends from A_k (a client-side fast-forward check). A_k is therefore R_k or an ancestor of R_k: B_k and C_k contain no other origin-visible commits, because their copies were built privately.
    - **When a delayed command can land.** A delayed or duplicated command for C_k can land only while origin's ref equals A_k.

    ## 9.2 Per-candidate state (from that candidate's report history and one observation T)

    Evaluated in P, in this order:
    1. `C_i ⊑ T` (C_i equals T or is its ancestor) → **ACCEPTED_i**.
    2. Otherwise, if any push of C_i decoded as ACCEPTED_REPORTED or REMOTE_ALREADY_C → **REWOUND_AFTER_ACCEPT_i**. The server confirmed acceptance and the candidate is no longer in the tip.
    3. Otherwise, if `R_i ⋢ T` → **REWOUND_i** (origin no longer descends from the base).
    4. Otherwise, if `T == R_i` → **PENDING_i** (C_i may still land).
    5. Otherwise (`R_i ⊏ T`, C_i ⋢ T) → **NOT_IN_TIP_i**. Origin moved past R_i, and therefore past A_i, without C_i. C_i can land only if origin returns exactly to A_i (the ABA bound, §9.5). This state never says "never accepted".

    **Observation failure.** If the fetch of T fails, no per-candidate state is computed and the aggregate is **UNKNOWN** (no T).

    ## 9.3 Lineage aggregate (all candidates of one key; §10.6)

    In this order:

    | Condition | Aggregate | Effect |
    |---|---|---|
    | Any ACCEPTED_i | **ACCEPTED(i)** | At most one i qualifies (argued below). Go to install (§11). |
    | Else any REWOUND_AFTER_ACCEPT_i | **REWOUND_AFTER_ACCEPT** | BLOCKED: no retry, no reallocation, no local effect. |
    | Else any REWOUND_i | **REWOUND** | BLOCKED. |
    | Else any PENDING_i | **PENDING** | At most one, because the same-base rule means one candidate per base. |
    | Else (all NOT_IN_TIP) | **NOT_IN_TIP** | Every candidate settles as SETTLED_NOT_IN_TIP. |
    | No T | **UNKNOWN** | Stays ADMITTED, open. |

    **Why at most one ACCEPTED.** A new candidate is built only on a fresh base that contains no lineage candidate; if it did, the candidate would be adopted instead. So for j > i, C_j ⊑ T and C_i ⊑ T can hold together only if C_i ⊑ R_j, which would have forced adoption.

    ## 9.4 Retry policy (live operation, within the family's existing limit)

    Family limits: claims 5, roster/alias 10, node `MAX_CAS_RETRIES` 10, block 3, ledger `MAX_RETRIES`.
    - **ACCEPTED(i)** → install (§11). There is no further push.
    - **PENDING (T == R_k) after any outcome** → re-push the SAME C_k under the SAME admission (append `PossibleExecution`, then `SendOutcome`). No new candidate, stamp or lineage entry is created, and the repeat is idempotent (`=` if C_k already landed).
    - **NOT_IN_TIP after CLIENT_REJECTED, SERVER_REJECTED_REPORTED or INDETERMINATE** → settle C_k's admission NOT_IN_TIP. Re-run the family predicate on the fresh base T (attempt k+1, a NEW admission). Lineage adoption is checked first.
    - **Two consecutive INDETERMINATE outcomes for the same C_k with T unchanged (== R_k)** → stop with **UNKNOWN_RETAINED**: the admission stays open and the family returns its truthful unreachable/failed result. This covers a deterministic pre-push refusal and a helper that persistently loses status, without spinning.
    - **REWOUND or REWOUND_AFTER_ACCEPT** → stop BLOCKED and retained. The family returns a named refusal ("origin rewound during store-CAS operation; retained for settlement").
    - **UNKNOWN (observation failed)** → stop. The family returns its existing unreachable result (claims: `Unavailable`; registry: Err; ledger: offline retention as L where that is the existing policy, labelled local-only). Never Acquired and never installed. The admission stays open.
    - **Allocation families never allocate again** while any admission for the key is PENDING, UNKNOWN or REWOUND* (§10.7). The automatic node id and block range are therefore never duplicated.

    ## 9.5 Supported rewind epochs and the ABA bound

    The supported origin rewinds are those of `aida store compact --squash`: the operator force-pushes a parentless snapshot S (S-F3), and may later restore from the backup branch by force-pushing the pre-squash tip O.
    - **Squash epoch observed (T = S, or a descendant of S).** `R_i ⋢ T`, so the result is REWOUND_i, or REWOUND_AFTER_ACCEPT_i if acceptance was reported. Never NOT_IN_TIP and never a retry.
    - **Restore epoch (T = O or a descendant).**
      - If C_i landed before the squash, then C_i ⊑ O → ACCEPTED_i.
      - If C_i had not landed, its command's old value A_i ⊑ R_i ≠ S, so the command failed during the squash epoch. With T = O ⊐ R_i the result is NOT_IN_TIP_i, which is sound. If O == R_i exactly, the result is PENDING_i, which is also sound.
    - **ABA bound (stated).** NOT_IN_TIP_i is unsound only if origin's ref returns EXACTLY to A_i after we observed a tip past R_i, and C_i's original command then executes. No supported writer does that: fast-forward pushes never return to an old tip, the squash force-push goes to a new root, and a restore goes to O, which descends from every R_i observed before the squash. The remaining case, a manual force-push of a historical tip, is UNSUPPORTED. Even then, ACCEPTED_REPORTED is never discarded: with the report it gives REWOUND_AFTER_ACCEPT, which is BLOCKED.
    - **No global exactly-once claim.** No claim is made beyond this bound.

    # 10. Admission, observations, discovery, joins and settlement (F4, F5; R-2)

    ## 10.1 ADMISSION(op, k): a common SERVICE publication that must COMMIT before the push spawn

    Under HOME → REPO → STORE:
    - **(i) S3 recheck.** `ensure_store_write_safe`. L_k must be an ancestor of the current H. No commit in `L_k..H` touches the family's record paths. The local before-images must still equal their PLAN capture. The open-key caps must not be exceeded (§10.8). Any failure refuses with a named reason and sends nothing.
    - **(ii) Journal PREPARED.** It contains the four kept-pack FileEffects (§6.5) with exact before/after images and payloads.
    - **(iii)** Apply the FileEffects in order (`.keep` → `.pack` → `.rev` → `.idx`, fsync, then directory fsync).
    - **(iv) P4/COMMIT.** `COMMIT.json` is created no-replace (6a1733 `durable.rs`), fsynced along with its parent directory.
    - **(v) Retire with a retained receipt** whose disposition is `remote-unsettled`. Read the receipt back.

    The push may start only after (v) has been read back AND a `PossibleExecution` observation has been appended durably (§10.4).

    ## 10.2 Crash points (discovery is authoritative from HOME; there are no locator refs)

    | Crash point | Durable state | Recovery disposition |
    |---|---|---|
    | c0: before (ii) | No HOME record. P refs and staging may exist. | Orphan cleanup (§10.5). Nothing was sent. |
    | c1: between (ii) and (iv) | PREPARED, no COMMIT | v3 rollback restores the exact before-images. Kept-pack files are removed ONLY if their current bytes equal the recorded after-images, and are otherwise RECOVERY-BLOCKED. Then orphan cleanup. Nothing was sent. |
    | c2: between (iv) and (v) | COMMIT, receipt not retired | v3 roll-forward completes the install and retires the receipt `remote-unsettled`. No `PossibleExecution` exists, so nothing was sent: **SETTLED_NOT_SENT** (remove the `.keep`, clean up P refs). |
    | c3: between (v) and the `PossibleExecution` append | Retired receipt, no `PossibleExecution` | SETTLED_NOT_SENT, as above |
    | c4: after `PossibleExecution`, before `SendOutcome` | A send may have happened | Resolve by observation (§9.2/§9.3) |
    | c5: after `SendOutcome` or `RemoteObservation` | — | Resolve by observation |
    | Install or peer crash | §11.4, §13.5 | — |

    ## 10.3 The COMMIT decision payload `StoreCasAdmission` (fields only; no new top-level record family)

    - `{op_id, attempt k, key K = (store_key, domain, subject_digest), family, intent_digest, lineage: [prior admission tx ids for K]}`.
    - `{L_k, R_k, M_k, B_k, C_k}` and the original→copy map (§6.4).
    - `record_stamp_k`: the EXISTING record fields actually written by C_k, **computed per attempt**. For example: the claim's `started_at`/`pid`/`pid_start_time`/`clone_path`/`heartbeat_at`; the node entry `{id, hostname, email, clone_path, registered, name}`; the exact block range computed at attempt k; the ledger delta; the hijack marker image M_ours.
    - The EndpointProfile digest with its single fetch and push URLs and transport profile; the PTransportProfile digest; the PrePushProfile digest with discovery and gate state.
    - The refspec, `<b>`, and the expected base R_k.
    - The local before-images: `.aida/node.toml` (rows 9, 11, 13, 16), own `HIJACKED.toml` (row 16), `.aida/dispenser.toml` and the range view (row 13), and the peer capture (row 16, §13.2).
    - P identity (§6.1) and P ref names `refs/cas/<op>/<k>/{L,R,B,C}`.
    - The kept-pack file set.
    - The owner's PID/boot/start (the existing identity convention, not a new scheme).
    - `invocation_authorization` (§12.4).
    - An `ObservationPlan`: namespace = admission tx; origin = the COMMIT digest; allowed kinds = {PossibleExecution, SendOutcome, RemoteObservation, InstallVerification, Cancellation, Settlement}; `max_records` 256; `max_bytes` 1 MiB.

    ## 10.4 Observation mapping (one mapping, no alternatives)

    | Kind | When appended | Typed payload |
    |---|---|---|
    | `PossibleExecution` | Durably, immediately BEFORE each push spawn, including a re-push | `{attempt, push_n, argv_digest, endpoint_digest, prepush_digest, closure_verified: true}` |
    | `SendOutcome` | After each push | `PushReport {transport_profile, lines[] (bounded), exit, class}` |
    | `RemoteObservation` (**seventh kind; REQUIRED common extension**) | After each T fetch, or after a fetch failure | `{fetch_n, T? , failure_class?, per_candidate: [(i, state)], aggregate}` |
    | `InstallVerification` | Only for LOCAL installation verification by the install publication (its signed meaning) | `{install_tx, H, H', effects_digest}` |
    | `Cancellation` | Live owner abandons before spawn (profile or closure mismatch) | `{reason}` |
    | `Settlement` | Terminal | One of `SETTLED_INSTALLED`, `SETTLED_SUPERSEDED`, `SETTLED_NOT_IN_TIP`, `SETTLED_NOT_SENT`, `SETTLED_ADOPTED_BY(op′)`, `BLOCKED_REWOUND`, `BLOCKED_REWOUND_AFTER_ACCEPT`, `BLOCKED_RECOVERY(reason)` |

    `InstallVerification` is NOT used for remote state. Adding `RemoteObservation` to `ObservationKind` extends the SIGNED common record and needs common-owner disposition: it is REQUIRED (gate 1), not presumed.

    **HOME use during observation appends.** Each append takes HOME briefly, with no network inside. If HOME is unavailable before a spawn, the spawn does not happen (Cancellation is appended when possible; otherwise c3 applies).

    ## 10.5 P refs and staging: outside the journal, with explicit idempotent cleanup

    P refs and staging directories are private pins, not authority, and are not FileEffects (6a1733 has no ref-effect type; V3 does not add one).

    Cleanup rules (idempotent; each runs at any C-family entry for the store, under HOME → REPO → STORE, after the HOME index read):
    - **(a)** `refs/cas/<op>/*` and `staging/<op>-*` for an op with NO HOME record, whose owner is proven dead → delete.
    - **(b)** For an op whose admissions are ALL settled → delete.
    - **(c)** For an op with any open admission → keep. A named P ref that is missing or has a different OID → RECOVERY-BLOCKED(P ref) for that admission.

    P never runs gc. Objects freed by deleting refs are reclaimed only by an explicit bounded `git --git-dir=P prune --expire=now`, run when no operation for the store is open and the P budget exceeds 75%.

    ## 10.6 Cross-invocation key and open-admission index

    **K = (store_key, record domain, subject digest):**

    | Rows | Domain | Subject |
    |---|---|---|
    | 1, 3, 4 | `lease` | Normalized scope (`owns`) + clone canonical path |
    | 2, 5, 6 | `lock` | `LockKind` + clone canonical path |
    | 7 | `roster` | Member key (user id) |
    | 8 | `alias` | Normalized link pair |
    | 9 | `node-register` | Clone canonical path, plus the requested id when given |
    | 10 | `node-register` | Clone canonical path |
    | 11, 12 | `node` | Target node id |
    | 13 | `blocks` | (Own node id, block type) |
    | 14, 15 | `ledger` | Job key set |
    | 16 | `node` | Target node id |

    **Index.** `store_cas_open_index(home, store_key) -> bounded [(admission tx, K, family, owner, last aggregate)]` is derived from retained receipts whose disposition is `remote-unsettled` or `blocked`, together with their observation chains. It is a REQUIRED common-owner function (the checkpoint has no index enumerator). It is the ONLY discovery source; P refs are cross-checks.

    ## 10.7 Join before decision (step 1/1n/1j)

    Every new operation for key K first resolves every open admission for K, using the T fetched at step 1n:
    - **Owner other than ourselves is alive (PID/boot/start)** → refuse with "store-CAS operation in progress for <K>". We never decide independently.
    - **ACCEPTED(i)** → run the §11 install under that admission. The result is SETTLED_INSTALLED or SETTLED_SUPERSEDED. The new operation then decides on the fresh base, which now includes the record. When the new op is in an allocation family with an equal intent_digest, it ADOPTS: it returns the accepted id or range (`SETTLED_ADOPTED_BY(op′)`) and allocates nothing.
    - **NOT_IN_TIP** → settle and proceed.
    - **PENDING (T == R_i)** and the owner is dead or is us → **resolve by re-push**. Drop the locks and re-push the SAME admitted C_i under ITS admission, after re-verifying its EndpointProfile, PrePushProfile and closure. Then re-observe and resolve. This builds no candidate and allocates nothing. Landing C_i was already a possible outcome of that admitted send; the re-push only forces Git to decide it under the old value R_i. A same-clone claim that then lands is re-entrant for the new op (`decide_claim` returns Acquire for the same clone, S-F7). If the re-push is INDETERMINATE twice with T unchanged, the outcome is UNKNOWN (next item).
    - **UNKNOWN, REWOUND or REWOUND_AFTER_ACCEPT:**
      - **creation-class** families (1, 2, 9, 10, 13, 16) refuse with "unsettled prior store-CAS attempt for <K>: <state>";
      - **update-class** families (3, 4, 5, 6, 7, 8, 11, 12, 14, 15) may proceed ONLY if their own decision is `Apply`. Their push on the fresh base then serializes against the earlier candidate under Git's old-value check (§9.1). A `NoOp` or `Refuse` decision while an earlier same-key candidate is unresolved refuses with the same named reason, because a NoOp cannot fence an earlier candidate that may still land. A heartbeat NoOp (the record is no longer ours) skips the tick, which is its existing behavior.

    The **pure recovery pass** (at any C-family entry for the store, for keys other than the entering operation's) uses the same steps with one exception: it NEVER re-pushes. With no requesting invocation, it creates no new remote activity. It also never builds a candidate, re-runs a scheduler job, allocates, reclaims or deletes a claim, issues a grant, or reports Acquired to a dead consumer.

    ## 10.8 Bounds and settlement liveness

    **Caps.**
    - Creation-class keys: one open admission per key (the join forbids a second).
    - Update-class keys: at most 4 open admissions per key; a fifth refuses (a heartbeat skips its tick).
    - Per store: at most 64 open keys; beyond that new keys refuse with "unsettled store-CAS operations need settlement".

    **Settlement triggers (evidence-driven only; no time-based expiry).**
    1. An owner's own later observation settles its own earlier admissions.
    2. Any later same-key operation (§10.7).
    3. The pure recovery pass, which fetches T with HOME released (§10.9).
    4. Install completion.

    PENDING admissions settle as soon as any writer moves origin, or by a same-key re-push. UNKNOWN admissions settle once origin is reachable.

    **Unsupported production join (stated).** REWOUND, REWOUND_AFTER_ACCEPT and RECOVERY-BLOCKED admissions have no automatic settlement. Their key stays BLOCKED with retained evidence and a named refusal. Unblocking requires a common-owner operator settlement surface, which is REQUIRED-FOR-SUPPORT and NOT designed or authorized here. The affected schedule (a peer compaction rewind, or unsupported manual Git, during an open admission) is therefore an UNSUPPORTED production join for every row. No expiry permission, no second id, no second range and no reclaim is introduced.

    ## 10.9 Recovery and the network

    Recovery runs at any C-family entry and in the existing common recovery pass:
    1. Under HOME → REPO → STORE: read the index, validate the records and P identity, and run cleanup (§10.5). Release ALL locks.
    2. Fetch T into P (network; no AIDA locks).
    3. Reacquire HOME → REPO → STORE. Revalidate: the receipt generation is unchanged and the admission is not yet settled by someone else.
    4. Act per §10.7 (or §11).

    HOME is never held across the network. A fresh invocation from another repository, or from outside the project, recovers through the same HOME index.

    # 11. Install: validate before any effect (F7)

    ## 11.1 Sequence

    The install is a common SERVICE publication, v4 class "Store pull/rebase/structural merge", network-free, under HOME → REPO → STORE (→ `blocks.lock` for row 13, per TASK-1332 A1):
    1. `ensure_store_write_safe` after STORE. A rebase in progress, or dirty canonical paths, gives INCOMPLETE{unsafe}. Nothing is aborted or swept.
    2. Read H. Import T's objects (§6.5 T pack, kept). Run the closure verification `V(T; M′)`.
    3. **Plan privately in a fresh v5 S_k** (the integration set, §11.2). A conflict on a path with no union rule (`registry/{team.toml,nodes.toml,blocks.yaml,aliases.toml}`, `coordination/**`) gives INCOMPLETE{conflict}, carrying the content evaluation of §11.2(e).
    4. **Family validation, before any effect, against the named observation horizon T (fetched at t_obs).** Acceptance is historical; current ownership is checked only against T and H:
       - (a) The planned result H′ and T both contain the family record exactly as C_i wrote it (`record_stamp_i`).
       - (b) No commit in the integration set changes that record (no local same-family successor).
       - (c) Every dependent local before-image equals its ADMISSION image.

       Any failure gives SUPERSEDED (a successor exists in T or H) or INCOMPLETE (anything else), with zero local effects.
    5. Journal PREPARED: the ref H → H′ (or no ref change), index, worktree files, node.toml, own-marker effect, dispenser view and T kept-pack files, each with exact before/after images.
    6. **Revalidate at the owning install boundary**, immediately before the first effect and under the same locks. H must be unchanged and all before-images exact. Otherwise ABORT, with nothing installed.
    7. Install through the adapter: the canonical ref CAS with expected-old H; the v5 callbacks through the pump; node.toml only for the accepted id; the own marker only per §13.4.
    8. P4/COMMIT, the retained receipt, `InstallVerification`, and settlement of the admission (`SETTLED_INSTALLED`) in a following publication.

    Remote changes after t_obs cannot be excluded by a local lock, and no perpetual ownership is promised. SUPERSEDED reports the successor and never reclaims. Nothing ever resets to L, B or C, and no old snapshot overwrites anything.

    ## 11.2 Exact integration set and ordinary-sync races (F7)

    **Definitions** (in S_k, with H and T both present):
    - X = merge-base(H, T).
    - The candidate set is `X..H` minus every commit that is an original in the admitted original→copy map of C_i (those are represented in T by their copies).
    - The integration set I is that candidate set, replayed onto T in order using the existing union rules (spec objects, oplog, queue registries, schedule ledger). A commit that becomes empty is DROPPED (git-rebase(1): `--empty=drop`, the default). Commits that are clean cherry-picks of T commits are dropped.
    - H′ is the result.

    **Cases:**
    - **(a) Normal: L_i ⊑ H and C_i ⋢ H.** X ⊑ M_i, so the candidate set is `L_i..H` (the commits made after capture) plus no originals. H′ = I replayed onto T. The ref update H → H′ has CAS expected-old H.
    - **(b) H already contains C_i** (C_i ⊑ H, for example an ordinary sync imported T or a later tip). No ref update. Only local effects (node.toml and so on), after validation 4(a) evaluated against H's tree and T.
    - **(c) H ⊑ T** (H fell behind, for example H == L_i with no originals outside the map). H′ = T, a fast-forward.
    - **(d) L_i ⋢ H** (an ordinary sync rebased H during the push window onto a tip that lacks C_i, creating new copies "copies2" of L's originals). The candidate set includes the copies2. Replaying them onto T, which holds the copies1 inside C_i, reproduces content already present: union rules merge by entry id, and paths without a union rule get identical content. They therefore become empty and are DROPPED. A non-union path with differing content is a conflict and gives INCOMPLETE{conflict}, with no effect.
    - **(e) Content rule for supersession.** After planning, 4(a)/(b) compare the family record in H′ with `record_stamp_i`. Any difference introduced by a commit of I is a local same-family successor, so SUPERSEDED. A difference coming from T (a remote successor) is SUPERSEDED with the successor reported.
    - **(f) An ordinary sync pushed L's ORIGINALS during the window.**
      - If the originals landed first, C_i's push is non-fast-forward or its delayed command fails the old-value check, so C_i is NOT_IN_TIP. The next attempt is built on a T that contains the originals, so B_{k+1} has nothing to rebase.
      - If C_i landed first, the ordinary sync's own rebase onto T drops patch-identical commits and empty results. That is its existing behavior (TASK-1717 S), not A2's.

      Either way the install's I contains no duplicate of C_i's content, by the map exclusion plus drop-empty.

    **Guarantees.** Unrelated H commits are always preserved, unless their effect is already present in T. There is no reset and no duplicated content. Every case is witnessed (W4).

    ## 11.3 Effects by family

    - node.toml: rows 9, 11 (self only) and 16.
    - Dispenser visibility: row 13. The range becomes visible only after install, and refill never runs under the dispenser lock.
    - Own marker: row 16.
    - Peer step: row 16, §13.
    - Every other row: the import only.

    ## 11.4 Install crash closure

    - A PREPARED install restores the exact current-locked before-images (v3).
    - A COMMITted install rolls forward.
    - Neither undoes the remote C_i. A retained receipt plus the open admission make the install re-runnable through §10.7.

    # 12. HOME, authority surfaces and per-row authority disposition (F10, amendment A6)

    ## 12.1 HOME mandatory

    **Scope.** Every local step of every row runs inside `PublicationGuard::enter(home)`, with HOME recovery first: capture, join resolution, ADMISSION, observation appends, install, the peer step and settlement.
    - HOME is never acquired late beneath STORE.
    - HOME is never dropped around provisional effects.
    - HOME is never held across network or hook execution.

    **Why this applies to every family.** A whole-store import can change `registry/team.toml` whichever family triggered it, so every install is authority-bearing. The signed text requires this: BUG-1808 capture l.171 says "store pull/rebase/import paths that can replace registry/team.toml … must acquire it BEFORE their store locks". No row may install before the common owner exists (gates 1 and 4).

    **Required seams.**
    - Readers: `seat_authority::{roster_allows:93, current_grant:104, issue_direct:159, validate_child_delegation:211, issue_child:235}` and every `TeamRoster::load` used for authorization.
    - Writers: the 16 rows, plus the ordinary S imports, which the common owner enlists separately (gate 4).
    - Core: `team::*_cas`, `alias::link_cas` and the `git_ops` node functions are public. They must route to the owner API, not rely on CLI wrappers.
    - MCP: exposes none of these writers. The `session_start` tool returns CLI text only (`mcp.rs:4982–5010`).
    - REST: `set_team_role` stays FORBIDDEN.

    ## 12.2 Authority surfaces (four, kept separate)

    | Surface | What it is at bf652209 | Serialized by Git? |
    |---|---|---|
    | (a) Invocation authorization | Roster CLI: `require_direct_tty` (`seat_authority.rs:136`, called at `team_cmd.rs:207/246/265/290`), which checks only that stdin and stderr are terminals. It is a guardrail, NOT authority and NOT proof of a human. Core `team::*_cas`: no check. Other rows: none beyond the invocation. | No. Sampled at PLAN and at ADMISSION only. |
    | (b) Clone or local identity | `clone_path` canonicalization; `.aida/node.toml` | No. Checked as before-images at ADMISSION and at the install boundary (detected, not prevented). |
    | (c) Remote content precondition | Records in the compared remote history | Yes (old-value check / fast-forward) |
    | (d) Local consumer authority | Grant and roster at a consumer's P4 | No. Sampled home-first at the consumer's own P4. |

    **Meaning of remote acceptance (answering the commission's "family authority at remote acceptance").** Remote acceptance is a content linearization at origin and confers NO local AIDA authority. Authority-bearing local state (the roster) changes only at the §11 HOME install. Every later grant, P4 or `roster_allows` reads that committed view home-first. A fresh local sample followed by an unlock is never presented as authority at remote success, and a local P4/C is never relabelled as a remote CAS.

    ## 12.3 Signed texts governing "authority at remote acceptance" (citations)

    - **[T1] BUG-1808 capture l.171.** "Every supported authority writer uses the home lock: … team::{set_role_cas,set_allowed_seats_cas,allow_seat_cas,disallow_seat_cas,unset_role_cas}; store pull/rebase/import paths that can replace registry/team.toml. They must acquire it BEFORE their store locks. Direct/grant validators and current_grant/roster_allows read the same committed view. Their lock does not freeze time."
    - **[T2] BUG-1808 capture l.191.** "Revocation/roster writers racing P4 are serialized: if they acquire first, P4 refuses; if after, they affect subsequent commands/activations."
    - **[T3] TASK-1332 capture l.157** (V2 step 3). "This sample does NOT establish a new authority freeze across network. Existing operations needing fresh authority through remote acceptance must be handled by their already-owned authority protocol."
    - **[T4] TASK-1332 capture** (V2 per-family table, roster row). "Existing authority caller revalidation remains owned separately." Claim row: "decide_claim with current claimant identity, current time/TTL/PID-start/session liveness." Node row: "local node config only after corresponding accepted identity." Step 5: "Publish .aida/node.toml/dispenser identity only against the accepted matching registration/range."
    - **[T5] BUG-1808 capture l.1247** (the A2 commission). "Fresh local sample then unlock does not establish authority at remote success; local P4/C cannot be relabeled remote CAS."
    - **[T6] BUG-1808 A–E strict refusal, launch contract** (l.267 "no invocation-owned lifecycle residue"; l.322 standalone spawn wrappers). These apply to covered launch entrypoints.

    **Finding.** None of T1–T6 requires a mutable local grant, a roster-writer authorization, a TTL or liveness sample, or a local node identity to remain valid AT remote acceptance for these families, except through T6 for covered claim callers. T1 and T2 require home-lock serialization of the writer's LOCAL effect against P4, which the §11 HOME install supplies. T3 delegates any fresh-authority need to the family's already-owned protocol; T4 shows those protocols to be decision-time (claims) and install-time (node, dispenser).

    ## 12.4 Per-row disposition (U-1..U-4 are never acceptance waivers)

    | Row(s) | Governing text | Disposition |
