    ## 2. Current source C-family defect inventory (pinned before any new join)

    These are source observations at bf652209. They are not reproduced races.

    | ID | Location | Actual behavior | Consequence |
    |---|---|---|---|
    | D1 | coordination.rs:753, 1155 `commit(..).unwrap_or(true)` | A commit ERROR counts as committed, then `push(origin, branch)` runs. | An unchanged branch pushes successfully ("up to date"), so `Acquired` is reported with no claim on origin. |
    | D2 | coordination.rs:754–759, 1156–1161 | `Ok(false)` (nothing to commit) returns `Acquired`/`Reclaimed` without any push. | A local-only claim file is reported as won, with no remote evidence. |
    | D3 | git_ops.rs:262 `push` = `git push --end-of-options origin <branch>`, used by every family | Pushes the mutable local branch, not a pinned OID. | The C attempt is coupled to whatever local history exists. A peer's later ordinary sync can publish a retained speculative C. |
    | D4 | coordination.rs:774/784/1172/1179; team.rs:273/360/423; alias.rs:265; schedule_ledger.rs:399/522; git_ops.rs:3044/3150/3277/3469/3525; lib.rs:22048 | `reset --hard HEAD~1` after rejection, and in coordination also after a transport error. | Destroys a local peer commit when HEAD moved. A transport error can follow remote acceptance, which leaves the remote holding the claim while local reports `Unavailable`. |
    | D5 | lib.rs:21302 (`db block claim`) | `reset --soft HEAD~1`, an ignored `pull_rebase` error (21254), then reload of the mutated `blocks.yaml` and a new claim. | Stale staged bytes, a wedged pull, and risk of an overlapping or duplicate range. |
    | D6 | team.rs:278/364/428; alias.rs:270; git_ops.rs:3054/3159/3286/3474/3530; lib.rs:21318/22053 | A transport `Err` returns an error but leaves the speculative registry commit on the canonical branch. | Locally it is in effect immediately (`seat_authority.rs:93 roster_allows` reads the local `team.toml`; the dispenser reads the local `blocks.yaml`). A later ordinary S sync publishes it unconfirmed. |
    | D7 | coordination.rs:846→858 and 1317→1326 | Release decides ownership BEFORE `pull_rebase`. | The decision uses a stale owner sample (named by the signoff). |
    | D8 | coordination.rs:870/922/1304/1336 | Release, stale-release and heartbeat ignore the push result, so a rejected commit is retained. | The next ordinary sync rebases a delete/modify of `coordination/**`. That path has no union rule (git_ops.rs:381–460, 826–875 cover only objects, oplog, queues and schedule), so it aborts and wedges, or replays a stale heartbeat or delete over a successor. |
    | D9 | drain_lock.rs:497–514 heartbeat thread | `pull_rebase`/commit/push in the shared store from a second thread, with no store lock. | Races main-thread and peer writers on the index and HEAD. |
    | D10 | drain_lock.rs:370; solo_lock.rs:131; lib.rs:38569 (`session_start`, reached from queue_cmd.rs:12077 pickup) | The shared claim is pushed BEFORE the local lock decision or spec-status preflight. | A later local refusal leaves a remote claim. Pickup performs a network push, which v4 forbids ("pickup still does no hidden push/pull"). See F-1. |
    | D11 | git_ops.rs:2909–2913 (register), team.rs:241, alias.rs:233, coordination writers | Some families decide on unpulled local state on the first attempt. | Safe only because the push is CAS. A no-change outcome (D2) or a no-push path makes it unsafe. |
