    Private windows/server/socket/staging are invocation-owned temporary preparation. Before-C refusal requires no surviving owned pane/process/socket and exact lifecycle/history/peer preimages, not merely no vendor sentinel. Never kill a user's existing pane/server or use `kill-server` on a shared socket. Dedicated server allocation is journal-discoverable private cleanup, not a persistent grant reservation. On cleanup uncertainty report interrupted recovery, not unchanged-state success. Shared existing server state is untouched by construction.

