    | 1, 2 outside covered entrypoints | T4 (claim row: decision-time TTL/liveness), T3 | **Acceptance-neutral (U-2 disclosed).** TTL and liveness are sampled on each fresh base, and Git serializes only the holder record, exactly as today. |
    | 3, 4, 5, 6 (release, stale-release, heartbeat) | T4 (release/heartbeat row: ownership compared after refresh) | Acceptance-neutral. Content precondition (c) only. |
    | 7 (roster) | T1, T2, T4 roster row, T5 | **Acceptance-neutral (U-1 not invoked).** No signed text requires the invocation authorization to hold at remote acceptance (T4: "caller revalidation remains owned separately"). T1/T2 serialization is supplied by the HOME install, and the committed roster view becomes authority only there. |
