    ## 16. Limits

    - Design and source reading only. The Git transport, porcelain and `index-pack --keep` semantics come from the Git 2.43.0 source and the local manuals. The pre-push local-ref field, receive-pack behavior under the fixture wrapper, and hardlink portability are not yet executed.
