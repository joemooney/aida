    ## READY, lifetime and adopter obligations

    Every wrapper/setup transition precedes B READY and final P4. S first verifies its own descriptor image, settled credentials, mounts and original parent evidence, creates B, arms/checks parent-death behavior and drains only bounded transport. O accepts aggregate READY only when actual S/B joins, image/FD inventory, terminal/containment profile and parent creating TID are verified. A pane relay or bwrap “setup finished” byte is not B READY. No child wait/network/READY exchange happens under seat.

    The creating thread is a concrete TID plus start, not the process TGID. S is single-threaded, runs the fork and remains alive until V terminates. O's W/S creating thread is pinned and remains alive too; dispatch from an unrelated worker after that thread exits is prohibited. `PR_SET_PDEATHSIG(SIGKILL)` is armed in minimal syscall-only post-fork code, then expected parent/thread is checked; helper rechecks. Credential-changing namespace setup can clear it, so the audited W adapter must arm/check AGAIN after its final drops, and S must do so before creating B. No allocation or Rust lock access after fork before exec.

    For parent crossing a PID namespace, getppid()==0 is expected only for the explicitly pinned boundary; it does not close the pre-prctl death window. O must verify W's host PPid/start/creator TID after READY, while S checks the actual W pidfd supplied over O's exclusive setup channel is still live after rearming. That pidfd comes from O's owned W creation, not a textual PID. If O's creating thread died before W's rearm, O's final creator-TID check cannot pass and no CommittedDispatch is sent. After READY rearm the kernel chain covers that thread's later death. Inside B/S's same namespace, check nonzero expected parent directly. Host process pidfd alone never proves a particular thread alive. [Parent-death semantics](https://man7.org/linux/man-pages/man2/PR_SET_PDEATHSIG.2const.html).

    | Loss point | Required result / adopter |
    |---|---|
    | O or its creating thread dies before READY/P4 | No vendor execution. Inherited control EOF/dead parent or failed identity aborts; W/S/B terminate under their owned handles/death chain. Next publication recovery handles PREPARED only. No spawn replacement. |
    | W dies / credentials change before settled READY | S cannot establish parent join; no B release. Death AFTER settled READY propagates to S/B. Unknown setup failure remains recovery/cleanup failure, not unwrapped success. |
    | S or B-creating thread dies before controlled pre-exec barrier | B's armed parent-death signal prevents sentinel. For no-PID profile, nearest surviving subreaper/host namespace init adopts killed descendants; for PID profile S is init and namespace teardown kills remaining processes. |
    | O dies after C before release | Committed setup/receipts stay; no successor releases. Cleanup observes original exact pidfds if retained, or reacquires handles with full boot/start/namespace proof before any signal. Missing/Unknown evidence blocks same-attempt retry, never licenses PID guessing. |
    | Loss after release / lost ACK | Possible execution retained even if channel closes or all processes die. Only exact owned cancellation, bounded wait outside seat. Preexisting C/intent cannot be rolled back. |
    | Inner adopter recovery | While alive, S is local subreaper and reaps its children; PID1 S handles signals explicitly. If S is dead, named host namespace init/preexisting external subreaper adopts outside-PID orphans; W/O reap only their actual children. The adapter qualification fixture must prove eventual reaping for that actual deployment profile. Recovery from another CLI cannot assume waitpid parenthood. |

    PID namespaces make S's PID-1 death a namespace-wide termination, not a portable group-kill trick ([PID namespaces](https://man7.org/linux/man-pages/man7/pid_namespaces.7.html)); subreaping changes actual adoption, not ownership inferred from text ([subreaper](https://man7.org/linux/man-pages/man2/PR_SET_CHILD_SUBREAPER.2const.html)). A host without a functioning observed adopter is an explicit deployment fork, not a supported positive. No new system-wide reaper is introduced.

    Lifetime limit retained: an unsynchronized death racing successful exec can allow some vendor instructions before SIGKILL. Record possible execution; only controlled pre-exec barrier deaths promise no sentinel. Same-PID returned ETXTBSY may retry the SAME sealed image/channel/deadline within the already signed bound; missing ACK, EOF or a new process is never that retry. Detached pane I/O cannot extend the default fixed 30-second committed-start deadline or resurrect a dead owner.

    ### Explicit post-exec descendant limit (CONT-3)

    PDEATHSIG is not inherited by a vendor's forked children. For the default existing no-PID namespace profile, death of S/B alone therefore does NOT prove that arbitrary post-exec tool descendants stopped. Subreaping supplies collection, not termination. This proposal does not disguise that gap with process-group/PID scans. The controlled pre-release bootstrap guarantees above remain exact.

    If full post-exec tree containment is required for this profile, the bounded remedies requiring advisor disposition are: (a) use a per-invocation cgroup v2 below an ALREADY delegated subtree, placed before W/B creation with no migration capability given to the vendor, with exact held directory identity and cgroup.kill plus populated=0 observation during owned cleanup; or (b) explicitly select the PID-namespace S-as-init profile, acknowledging the changed PID visibility. No system service, privilege request, global cgroup management or live migration is authorized here. A delegated cgroup is not assumed present on this host. cgroup.kill requires a surviving cleanup owner (or later recovery); it does not automatically fire when O/S die. For an immediate all-supervisors-dead termination guarantee, select the PID-init profile or separately specify an already-authorized external lifetime manager; this sketch does not invent one. If neither is acceptable/available, full descendant-lifetime positive for the original no-PID profile is still OPEN and requires an operator/design decision, even if its launch bind succeeds. Do not call it fully supported. Recovery retains possibly-executed work even after positive empty-domain observation. [Kernel cgroup v2 interface](https://docs.kernel.org/admin-guide/cgroup-v2.html).

    Mandatory additional witness `bug1808_containment_descendant_settlement`: real wrapped native fixture forks a tool that outlives V/S, with separate owned peer domain; force outer/inner death after execution and prove the selected owned cgroup or PID-namespace domain empties and is reaped while peer domain is untouched. A no-PID/no-delegated-cgroup profile must report this unmet lifetime capability explicitly before publication when requested; that refusal is not its missing positive.

