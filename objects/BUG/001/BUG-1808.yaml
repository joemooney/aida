    - `AttemptIdentity { operation_id: Uuid, family, record_stamp }`. `record_stamp` is set ONCE per operation from EXISTING record fields: Claim `started_at`/`pid`/`pid_start_time`/`clone_path`; node `registered`/`clone_path`/`hostname`; block `owner`/`host`/range; marker `hijacked_at`/`new_owner_clone_path`. It does not change across retries, which lets a later attempt recognize an earlier attempt that landed. No new record field or schema is introduced.
