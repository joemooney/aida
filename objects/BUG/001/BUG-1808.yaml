    **F3 — candidate resolution [§9].**
    - Each candidate is resolved on its own: ACCEPTED, REWOUND_AFTER_ACCEPT, REWOUND, PENDING or NOT_IN_TIP. A lineage aggregate combines them.
    - An accepted report followed by C missing from the tip gives REWOUND_AFTER_ACCEPT. That is BLOCKED: no retry and no reallocation.
    - The squash and restore rewind epochs, and the ABA bound, are explicit.
    - When T == R, the SAME C is re-pushed under the same admission.
    - A failed observation gives UNKNOWN: never Acquired and never installed.

    **F4 — cross-invocation lineage [§10.6–§10.8].**
    - Open admissions are keyed by (store, record domain, subject), and a join runs before every decision. Its outcomes:
      - adopt ACCEPTED;
      - settle NOT_IN_TIP;
      - resolve PENDING by re-pushing the same C;
      - refuse UNKNOWN, REWOUND or "in progress", each with a named reason.
    - Update-class rows may proceed past an unresolved candidate only when their own decision is Apply.
    - Caps: one open admission per creation key, four per update key, 64 keys per store.
    - Settlement is evidence-driven only. The rewind schedules are UNSUPPORTED production joins and their keys stay BLOCKED. There is no expiry, no second id and no second range.

    **F5 — admission, discovery and the kept pack [§6, §10].**
    - Discovery is authoritative from the HOME record, through a REQUIRED open-admission index. There are no locator refs.
    - A crash-point table covers c0–c5.
    - P lives at `<G>/aida-store-cas/<store-key>/p.git`, with its device/inode recorded. If it is missing or replaced, the result is RECOVERY-BLOCKED.
    - P refs are kept outside the journal and have idempotent cleanup rules.
    - The kept pack is built privately and installed as exact FileEffects in the order `.keep` → `.pack` → `.rev` → `.idx`. Settlement removes only the `.keep`.
    - Recovery releases HOME before any network step, then revalidates.
    - M′ is defined.
    - `RemoteObservation` is a single seventh observation kind, named as a REQUIRED common extension. InstallVerification is not overloaded.

