- id: 01a11967-1add-7ad1-a922-0b833f2cd980
  author: codex-sketch-revision
  content: |
    SKETCH (awaiting advisor signoff): BUG-1808 — revision 2, scoped issuance and one journaled pickup publication

    Separate sketch-revision author; 2026-10-07 America/Phoenix. No signoff or implementation. Final authority-changing merge is operator-only. Root dispatches a DIFFERENT independent advisor for the v2 decision.

    Baseline, scope and binding decisions

    Inspected main 199e591b07aa76a59cd34f0a41946f918501f6ba. Read full BUG-1808 UUID 01a11874-024a-71b2-935d-56a2a7e89778, BUG-1802 and TASK-1337 specs/comments using /home/joe/ai/aida/target/agent/aida. Original sketch comments equal the original files. Both CHANGES REQUESTED comments equal their sections in INDEPENDENT_SKETCH_SIGNOFF.md; BUG-1808's binding comment is 01a11953-8437-7bf1-b89b-c2a2b9c419ac. Preserve all original artifacts/provenance. TASK-1337 is implemented and Completed, not absent.

    Adopt answers A–E without weakening acceptance: setup-only/TUI requires authority; caller-minted session ID is not permission; a truly assigned child consumes its assignment without delegating recursively; inherited driver authority cannot run implementation; late authorization refusal leaves NO invocation-owned lifecycle changes; peer changes survive; preflight only the seats the selected mode actually runs; initial bounded admissions are preflighted before run writes, later admissions separately; explicit --role consistently selects non-review work while PR/MR remains reviewer. Changing a role selector cannot remedy missing authority. No operator fork is needed.

    The source has NO common grant/roster/lifecycle transaction. A new scoped journaled pickup transaction, with enlisted readers/writers, is the smallest concrete extra architecture necessary for strict late-refusal atomicity. It is detailed below rather than treated as an existing CAS primitive. Moving validate_child_delegation earlier or adding another queue lock alone cannot satisfy the spec. This remains a proposed design requiring independent signoff; it is not approval to implement a generic database rewrite.

    One assignment model and exact retained extensions

    Use BUG-1802's canonical repo_key and retained SessionManifest evidence conventions. BUG-1808 must also work independently: its scoped assignment block and minimal grant/receipt joins can land without enabling review provenance enforcement. Do not make this bug wait for BUG-1802's verdict policy.

    - Extend session_manifest::SessionManifest with ONE versioned launch_assignments[] array (the same canonical array used by BUG-1802, not a duplicate evidence store). Each assignment holds: assignment_id (UUID), repo_key (real git common dir + canonical store root), spec_uuids[], selected_seat, actor_session_id, grant_id, parent_grant_id, predecessor_assignment_id?, native_session_id?, branch, worktree, kind (setup-only/implementation/review), run_token?, member_uuid?, phase?, phase_attempt_uuid?, issuer_pid/start_identity, consumer_pid/start_identity?, state (prepared/active/ended), publication_id. All authority fields except activation/end/process binding are immutable. Retain these entries after lease cleanup. Existing session_id is the manifest/lease key, NOT automatically the grant's session_id.
    - Extend SeatGrant with binding={repo_key,manifest_id}, predecessor_grant_id and issued_roster_store_sha as described in BUG-1802; retain the referenced store commit for historical validation. It points to the assignment rather than copying token/phase/spec into a second authority store. Existing session_id is the stable actor identity; issue a fresh grant id but preserve actor identity for a verified resume/reissue. A newly created child has a new actor session_id and an empty delegation set. Validate the complete parent chain, not only current_grant's immediate-parent check.
    - Extend orchestrator::RunMarker at its existing .aida/orchestrator-runs/<token>.json with member_uuid, canonical spec_uuid and phase_assignments[{phase,attempt_uuid,assignment_id,manifest_id,grant_id,actor_session_id,native_session_id?,state}]. The token is already the filename key. Preserve existing pid/spec/started_at/zen and existing parent/member liveness checks. A member has its OWN token and immutable member UUID; shared DrainState.current is telemetry only. drain_state::register_run owns checked member admission, orchestrator::publish_run owns the corresponding record. Both use the transaction described below, with TASK-1603's snapshot lock intact.
    - Extend OrchestratedLeaseReceipt with assignment_id and evidence_manifest_id. write_orchestrated_lease_receipt/publish_orchestrated_lease_receipt_from_env write the join only after it is staged/activated; prepare_orchestrated_lease_receipt does not delete retained manifests. Runtime receipt/run cleanup ends an assignment but does not turn its grant into a reusable unscoped credential.

    New proposed internal APIs (not claimed to exist): PreparedPickup, PreparedAssignment, PickupPublication, validate_assigned_consumer, prepare_child_grant, and publish_pickup. prepare_child_grant runs existing validate_child_delegation semantics under the publication locks and creates bytes in PRIVATE staging, not a live grant. publish_pickup is the ONLY writer that activates it for queue-work launch paths. seat_authority::issue_child remains a convenience wrapper for unrelated callers; covered paths must not call it again after setup. A low-level vendor wrapper receives a typed ActivatedAssignment; it cannot infer one from environment and cannot silently fall back to issuing a child.

    Assignment validation in exact order

    1. Resolve canonical repo/store from actual git discovery, not AIDA_PROJECT_ROOT/AIDA_DRIVE_ROOT alone; resolve requested display IDs to UUIDs. Resolve the routed seat/mode/worktree and validate caller's actual grant subject, stable actor/process join, complete grant parent/predecessor evidence, roster and current expiry/revocation.
    2. If no explicit retained assignment is supplied, this is a LAUNCHER: validate delegation of the selected seat. If an assignment handle/token is supplied but invalid, REFUSE; do not fall back to the launcher case or to an environment exemption.
    3. For an assigned consumer, read its manifest by exact ID and require manifest.repo_key, spec set, selected seat, kind and branch/worktree to equal the resolved operation. Manifest.grant_id must equal the actual active grant handle; actor_session_id must equal grant.session_id; grant.binding must point back. Verify the issuing parent grant, subject and every ancestor. Match native conversation when supported; otherwise use launcher-to-child pipe/process PID/start binding recorded before vendor readiness, not a caller-invented session id.
    4. Orchestrated consumers additionally require valid token filename, live member and parent process identities, matching member_uuid/spec_uuid, exact actual phase and attempt, and equality of ALL assignment/grant/session fields with that token's phase_assignments entry. Verify snapshot membership through read_live_run, not shared current. Reject a token from another concurrently live member, old phase/attempt or dead predecessor. A valid no-delegation implementer can execute ONLY this assignment; it cannot select another spec, issue reviewers or broaden the cluster.
    5. Resume uses the retained prior native-session/manifest join to preserve actor identity. Its authorized launcher may prepare one replacement grant/assignment linked to the predecessor; the resumed child merely consumes it. A missing predecessor is an error. Assignment handles and --session-id are selectors, not authority. Scoped grant validation is repeated at the final publication point below. Grant cannot be used while state=prepared or its publication journal is uncommitted.

    Per-entrypoint issuance ownership and sequence

    | Entry surface at the pinned source | Launcher / consumer and single issuance owner | Exact ordering change |
    | --- | --- | --- |
    | queue_cmd::handle_queue_command, QueueCommand::Work ordinary path -> handle_queue_work | External invocation is launcher unless a retained assignment validates. handle_queue_work's publication owns ONE child grant. | Read-only resolve_queue_work_plan/infer_queue_work_role/preflight_queue_work_branch; prepare setup and assignment; publish; exec interactive vendor using that assignment. Remove late issue_child at queue_cmd.rs:12421 for this path. |
    | Standalone fresh --no-human=both -> session::exec_vendor_headless | Launcher enters the SAME publication owner in handle_queue_work. exec_vendor_headless is assigned consumer. | Prepare scoped implementer grant before setup publication; install exact child grant/subject/assignment, overwriting inherited driver handle. Plain exec must never retain driver authority. |
    | Standalone --resume=<conversation> --vendor claude, interactive or headless | handle_queue_work is issuance owner. | Resolve old manifest/native identity, prepare ONE linked replacement grant; publish; exec_claude_resume or spawn_claude_headless_resume consumes it. No inner issue_child; non-Claude unsupported resume still refuses before any staging/publication. |
    | PR/MR standalone reviewer -> run_standalone_reviewer | handle_queue_work's publication is issuance owner; run_standalone_reviewer is consumer. | Route reviewer, preflight actual reviewer seat; stage lease and review-output resets; prepare grant; publish; spawn_vendor_headless_with_seat, spawn_claude_headless_resume or spawn_reviewer_launch_plan uses same ActivatedAssignment. No double issue, no reviewer-file deletion before authority. |
    | --no-launch, including TUI --session-id | Launcher setup still owned by handle_queue_work publication; a valid assigned consumer uses its existing grant. | Caller session UUID cannot authorize. Commit setup-only assignment after final authorization; return exact assignment handle to the TUI. Later vendor start is a NEW activation transaction requiring current grant validity, or an authorized launcher reissue; it cannot reuse an expired setup promise. Refused later activation preserves already-authorized setup from the previous invocation, and creates none of its own. |
    | --batch / --batches / nextN / --drain / --auto-complete wrappers in QueueCommand::Work, lib.rs::run_auto_complete | Outer wrapper plans bounded initial member set and actual phase seats before any run/drain-state/admission mutation. Per-member RealPhaseDriver is launcher for each phase. | Prepare root/admission transaction; register_run before status/launch. RealPhaseDriver::run_implementer is the SINGLE phase grant issuance owner, delegating from validated driver. It prepares complete setup through the shared planner/publication service; the phase vendor consumes the assignment directly, with no second queue-work setup subprocess after publication. |
    | Baseline RealPhaseDriver::run_implementer -> build_implementer_phase_args -> spawn_and_wait_watched/pane host -> queue work | Phase-driver publication owns implementer grant and token/member/attempt binding. Refactor this specific call graph to shared in-process pickup preparation followed by DIRECT assigned vendor launch. | Move mark_drain_phase_session, predecessor release, receipt preparation and signal reset into its staged write set; prepare exact branch/worktree before spawning. validate_assigned_consumer runs on the prepared child command/identity inside publication before P4; after P4 spawn_and_wait_watched/pane host runs the vendor with the exact activated assignment, not another queue-work setup command. This removes a second post-publication authorization/refusal boundary. Pipelined member process still registers its ownership before its own status bump/vendor release; shared parent never guesses current. |
    | RealPhaseDriver::run_reviewer, reviewer retry/resume | Phase driver owns ONE reviewer grant per attempt under its delegating driver authority. | Stage phase update and output reset, prepare reviewer assignment, publish, then low-level reviewer spawn consumes it. Retried attempt never reuses old grant/token binding as a new round. |
    | RealPhaseDriver resume_implementer path -> spawn_claude_headless_resume | The authorized driver owns ONE replacement implementer grant preserving actor/native lineage. | Validate retained predecessor + member/phase; prepare/publish replacement assignment; wrapper consumes. Empty child delegation set remains empty. |
    | queue_cmd::{handle_rework_entry,handle_queue_rework} with --work/--resume -> direct handle_queue_work | Rework-with-work is one launcher transaction, owned by the combined rework/pickup planner. | Move rework status/reopened SHA/comment/queue changes currently before the direct call INTO the same staged write set. Refused child delegation leaves the WHOLE invocation unchanged, not merely its final handle_queue_work portion. Metadata-only rework retains its own existing authorization policy; it is not a vendor launch. |

    A separately invoked `queue work S` carrying an already-active assignment is still supported: it is an assigned consumer and validates its exact retained binding, then prepares only its own still-needed setup/activation changes under this transaction. Existing committed parent setup is pre-command state and is not recursively reissued or rewritten. The phase-driver path above deliberately avoids this extra subprocess boundary in the SAME launch invocation, so a late child refusal cannot strand that invocation's newly published setup. build_implementer_phase_args remains the baseline trace point; replace its production use here rather than leaving hidden duplicate setup in that subprocess.

    Standalone low-level spawn wrappers still used outside queue work must either take an ActivatedAssignment or own a separate correctly preflighted launch publication; they may not offer a magic 'already authorized' boolean. Direct agent-new/reconstitution behavior outside the queue reachable call graph is not silently included in this bug. Any newly discovered queue-reachable issuer must join this table before signoff/implementation acceptance. The shared manifest convention is additive, not permission to broaden delegation or change the roster.

    Selection and admission

    resolve_queue_work_plan must take one resolved selector everywhere, including no-argument head and synthesized explicit rows, instead of rereading AIDA_SESSION_ROLE. --role wins non-review selection; PR/MR review forces reviewer under the documented rule. Print selector/origin and selected routed seat separately from the validated launcher seat. Suggested syntax is for an ALREADY authorized launcher: `aida queue work S --role implementer --strict`; never suggest that changing the selector grants delegation.

    All statically required phase seats for the selected mode are checked before initial run writes. through-ci does not require a reviewer if no reviewer phase runs; --from-pr excludes implementer when skipped. Conditional advisor/escalation phases are preflighted before their OWN admission/launch, not unconditionally demanded from every drain. Dynamically refreshed members are checked before adding them to the snapshot. Each admission and each later phase is a separate bounded transaction; a refused later member cannot erase earlier members that executed under valid authority. Root-run creation, the first member's admission AND that member's first actual phase setup/issuance share one transaction through P4 so a late first-launch refusal leaves no empty run or earlier admission residue. Do not commit an admission-only prefix and then label its residue a prior successful invocation. Subsequent member/phase refusal retains prior committed run history and peer member tokens.

    ONE bounded final-validation/publication mechanism

    Choose JOURNALED STAGED PUBLICATION, with exact preimages for rollback of an UNCOMMITTED publication. This is one transaction protocol, not a choice between ad-hoc compensation strategies. It covers the finite pickup/admission/phase-launch write set, never a whole drain or a vendor's work. Required new code belongs in a small shared publication module plus enlistment of existing storage/authority/runtime writers. None of the following locks or multi-resource semantics should be described as already implemented.

    Locks and readers/writers

    Use permanent resolved-home `.aida/authority-publication.lock` (global grants and cross-repo role queues), then canonical-main `.aida/lifecycle-publication.lock`, then canonical store's existing StoreWriteGuard, then sorted permanent role-queue `<role>.lock` sidecars, then drain_state's permanent snapshot lock, then sorted session/episode/verdict locks. Merge lease is last for merge paths, as in BUG-1802. Code ref transactions/index/worktree metadata operations are below these locks. Never unlink these sidecars or replace their inodes. Initialize infrastructure outside pickup (project setup/migration); if unavailable, a refusal must not leave a new lock directory behind. A normal request may open existing locks without lifecycle changes. Do not add lock acquisition in a callee after a higher-order lock is already held; pass a typed guard/capability and use existing reentrant store facilities deliberately.

    Every supported authority writer uses the home lock: seat_authority::{write_grant,issue_direct,issue_child,revoke_current}; role_cmd enter/end; team::{set_role_cas,set_allowed_seats_cas,allow_seat_cas,disallow_seat_cas,unset_role_cas}; store pull/rebase/import paths that can replace registry/team.toml. They must acquire it BEFORE their store locks. Direct/grant validators and current_grant/roster_allows read the same committed view. Their lock does not freeze time; expiry is rechecked at final activation.

    Every supported lifecycle writer for enlisted paths participates in home->repo ordering before existing fine locks: Storage::{save,save_with_conflict_detection,queue_add,queue_remove,queue_reorder,queue_clear,queue_remove_many_if,queue_remove_for_role_if}; db::git_backend::{update_spec_atomically_with_subject,bulk_update_atomically,record_op,auto_commit_paths}; global_queue::{add,remove,QueueMutation} (and load for guarded reads); session_start/end/prune/lease release; session_manifest::save; registry write/GC when assignment-bearing; drain_state::{register_run,set_run,DrainState::write}; orchestrator::{publish_run,remove_run}; calibration writers; review output resets; session worktree/ref creation/removal; background fetch and supported pull/gc/rebase paths touching the same repo. Read APIs used for authority, queue selection, leases/manifests, run membership, canonical objects/history and verdict gates acquire shared publication guards and recover an interrupted journal before returning state. Cached views must not refresh/emit provisional state; invalidation happens after commit. The dispatcher/storage guard must cover CLI AND MCP mutations, not only the queue_work handler.

    This enlistment is necessary additional architecture. Existing queue locks and team CAS do not already coordinate. Raw manual filesystem/git mutation does not honor AIDA locks and is outside the supported-workflow transaction guarantee, just as with existing local grants. The design must not claim protection from hostile same-user mutation. Normal supported peer commands ARE covered, including commands in another repo sharing the role queue. If any supported writer cannot enlist, this sketch's strict acceptance is unmet; reporting residual files is not a passing substitute.

    Stages and publication boundary

    P0 read-only: resolve caller/assignment, selected UUIDs/seats, exact worktree/branch occupancy, vendor support and commands. Read live state without mutating caches/lifecycle; preview/dry-run/list return here. No synthesis, fetch, cleanup, status tag or grant write. Static refusal returns unchanged.

    P1 private preparation: under an invocation-private system temp directory `aida-pickup-<publication-uuid>/`, make a private git repository/object directory for network/base inspection, private checkout contents and proposed YAML/TOML/JSON bytes. Never `git fetch` in the live repo here: no FETCH_HEAD, remote-tracking ref, shallow boundary or live ref changes. Resolve remote metadata into the private repo. Prepare worktree contents without registering a live worktree. Existing resumed worktrees are read and must remain unmodified by setup. Canonical mutation/history/oplog/queue/calibration calls run in a staging adapter, never against the live Storage. New grant is prepared bytes only. Private staging is deleted on ordinary refusal; abandoned temp staging has no usable grant/lease and is removed by recovery.

    P2 lock and compare: acquire the locks above; recover prior incomplete transaction first; reread authority/roster and the exact selected specs/rows/ref heads/worktree/session/run generations. Compare read-set hashes and UUID identities with the plan. A peer change affecting the plan aborts/replans before live writes. A peer change to unrelated entries in a shared file is incorporated by rebuilding the proposed file from CURRENT locked bytes, not restoring the initial snapshot. Journal preimages are taken NOW, preserving all completed peer changes. Read-only plan locks may be released before P1; only P2 onward holds the full publication guard. Prepare per-target same-filesystem staging siblings to make final rename atomic; record parent-directory ownership/inode, before bytes/hash/mode or absence, after hash and expected ref old/new OIDs. Durable journal at main `.aida/pickup-publications/<uuid>/journal.json`, fsync backups/payloads/directories before touching live state. Journal records publication ID, owner PID/start, planned assignment IDs, write-set paths and state PREPARED. Readers see PREPARED and recover/block, never treat its files as active authority.

    P3 install provisionally while locks remain held: publish only the journaled finite write set. Canonical YAML plus inline history, local calibration/queue/session/runtime files and grant bytes are installed by rename. Append-only history/oplog/telemetry is BUFFERED until commitment; do not call ordinary appenders here. Stage its full next file version under the same lock if it must be transactional. Requirement status history comes from the staged object once, not `edit status back` on abort. For canonical store Git, prepare a commit in the private object directory but do not publish a canonical branch/history ref until final commitment. Code objects prepared for a new worktree stay quarantined/transaction-owned until commit. Stage new branch/ref values with explicit expected-old values through a Git ref transaction; no live fetch/FETCH_HEAD is needed. Worktree administrative entries and `.git` pointer are prepared for their FINAL paths; record all created path/inode ownership in the journal. Any setup operation lacking a finite journaled write set is refused at P0 rather than delegated to an opaque mutating helper.

    No provisional file is an active grant or lease: readers require its publication committed plus the shared guard. No vendor has started. This stage can fail or run past grant expiry without leaving accepted lifecycle state. The final validator reruns after installation/preparation, immediately before activation. Failed delegation/expiry/revocation/roster or read-set validation takes the ABORT path, below.

    P4 final validation and COMMIT: under the same authority/repo locks, recheck current time against the grant AND every active ancestor, subject/roster, token/member/phase/attempt, exact manifest/grant/target joins and no new blockers. For assigned consumers validate assignment rather than delegation. Save a durable commit decision carrying validated_at, assignment IDs and exact write-set digest; this is the linearization point for BOTH final launch authorization and publication. Complete the prepared code/store ref transaction and object promotion, activate assignments and release the vendor command from this already-authorized invocation. Do not call issue_child or introduce another delegation check after this point. A vendor exec failure now is an authorized post-setup failure and retains TASK-1337 manual continuation, not an authority refusal disguised as success. Emit buffered events/cache invalidation only for the committed transaction and idempotently by publication/event UUID.

    Expiry is checked at P0, P2 and P4, never frozen by a lock. Expiry before P4 ABORTS even if files were provisionally installed. Expiry after the linearized launch authorization is ordinary running-session expiry, not permission to perform later privileged commands; those commands validate current authority. No queued/delayed activation may reuse P4: if execution is deferred (TUI setup-only, scheduler handoff, crash before vendor starts), it needs a NEW activation check and transaction. Revocation/roster writers racing P4 are serialized: if they acquire first, P4 refuses; if after, they affect subsequent commands/activations. The implementation must expose this linearization in tests and documentation, not describe a check arbitrarily before setup as 'final'. Do not hold authority/repo locks for the vendor lifetime.

    ABORT (before COMMIT only): keep locks; reverse each installed entry only if its current bytes/hash/inode equals the journal's installed value (or is already the exact preimage during recovery). Restore original bytes/mode or remove only invocation-owned newly created paths; roll back the still-uncommitted Git ref transaction (journal each ref lockfile path and owner PID/start so crash recovery removes only this transaction's abandoned locks); remove transaction-owned worktree admin entries/private object quarantine and staged files. Restore from the LOCKED preimage, including original inline history, never a compensating status transition or whole-file copy from pre-command time. No shared history/ref was published and no event emitted, so no fabricated audit history is necessary. In supported writers the ownership/hash predicate MUST hold because they were excluded; its violation is corruption/out-of-protocol mutation and fails closed pending recovery, never authorizes clobbering a peer. A test exposing such a violation through a supported peer disproves the implementation and must block acceptance. Delete the journal/private staging and newly created empty infrastructure directories once restoration is verified, then return the authority refusal. Persistent preexisting lock inodes remain unchanged. Successful refusal has no new grants, manifests, rows, history or logs.

    CRASH: an uncommitted PREPARED/installing journal is rolled back under the same locks by the next lifecycle/authority reader or writer BEFORE exposing state; no vendor was released, so it cannot have made legitimate writes. A durable COMMIT journal is rolled forward idempotently (including store/code refs, event IDs and assignment activation), NEVER restored over subsequent history. Commit with vendor launch not proven is not automatically respawned: retain committed setup, report interrupted authorized launch and require a new activation transaction with current authority. A crash is not falsely reported as a clean refusal. Crash recovery itself must complete before a later refusal returns unchanged-state evidence. Missing/corrupt journal or impossible old/new ref state blocks use rather than guessing. Journal cleanup after committed recovery must not erase retained manifests/assignments.

    Practical publication limit: raw Git cannot offer one atomic rename covering YAML, role queues, home grants, worktree directories and refs. The durable decision plus guarded recovery supplies logical atomic publication for supported readers; it is not a claim of instantaneous physical multi-filesystem atomicity. This is why the additional publication module, staged storage adapter, ref/object quarantine and reader/writer enlistment are unavoidable. Baseline does not have them. If the implementer cannot provide them, strict acceptance remains blocked; no narrower race guarantee, acceptance relaxation, generic CAS slogan or 'residue diagnostic' substitutes.

    First-write inventory and treatment

    | Existing early effect | Required treatment before/within the transaction |
    | --- | --- |
    | Synthesized queue row; rework queue removal/add/reorder | Stage against current locked role-queue bytes; no activity event before commit. Keep permanent queue sidecars. |
    | Canonical status, reopened_at_sha, rework reason/history, calibration tags | Staged object update and one staged canonical store commit; no status/history append or auto-bump before final decision. Include rework --work prefix operations. |
    | Complexity/effort calibration local files | Stage final bytes with current preimage; do not run best-effort live upsert before authority. |
    | Pull, fetch, refs and FETCH_HEAD | Remove shared pull/background fetch from pickup's setup path. Perform required base inspection/fetch privately; publish only selected new branch/base objects through the prepared transaction. No FETCH_HEAD write. If synchronized main/store is required first, refuse with a separate manual pull command rather than secretly pulling in this invocation. |
    | Dormant predecessor cleanup / --steal / held branch retirement | No unrelated cleanup or main/worktree GC in pickup. Stop live-owner steals before staging; offer separate manual action. For a provably dead same-assignment predecessor, journal only its exact lease/manifest runtime changes and retain evidence; never delete its code/worktree as part of authorization. Keep TASK-1337 manual retirement offer. |
    | New worktree/branch, stack files, existing resume cwd | Precompute private checkout/admin entries; exact target absence or locked expected existing metadata; no edits/reset of a peer's existing worktree. Incompatible occupancy refuses before mutation. Stack metadata is an enlisted file. |
    | Lease, manifest, receipt, session env, agent registry | Prepared together; reciprocal grant/assignment joins; only active on committed publication. Failed retention aborts rather than spawning. |
    | Reviewer-file reset, punt/hold/exit signals, headless logs | Archive old evidence; stage reset of runtime signals only. Never erase canonical review history. Create logs after final authorization; refusal has no vendor log/sentinel. |
    | Grant, run marker, phase session, drain snapshot and drain lock ownership | Stage/check bounded initial run or per-member update. register_run/snapshot membership logically precedes status and child release. Do not claim existing live run merely from shared current. Existing drain lock is retained as ownership gate, with new initial ownership write enlisted; later admission preserves peer members. |
    | History/events/cache | Buffer until commit; exact event UUID dedup on recovery; no append-then-counterevent. Readied test caches prevent unrelated lazy writes from masking lifecycle changes. |

    Real CLI witness matrix (proposed, not run)

    Extend aida-cli/tests/queue_work_dry_run.rs, keeping task_1337_delegation_refuses_before_any_pickup_mutation, task_1337_held_branch_refuses_before_any_pickup_mutation and task_1337_post_setup_launch_error_prints_manual_guided_continuation. New fixture snapshots canonical objects AND history/store HEAD, role queue metadata, refs/reflogs/FETCH_HEAD, worktree list/admin entries/dirs, leases/manifests/env, calibration/stack files, grants, registry, run/drain records, review/signal files, transaction staging and vendor logs. Preinitialize cache and infrastructure locks; also test missing infrastructure refusal with no created residue. Always use isolated HOME/AIDA_HOME, temp store/git repo, actual aida CLI, fixture grants, fake vendor/forge and no-vendor sentinel.

    Use these REAL supported argv shapes with fixture S, PR-N, B and an existing fixture Claude conversation UUID C:

    - `aida queue work S --guided --role implementer --no-pull --vendor claude`
    - `aida queue work S --fresh --no-human=both --role implementer --no-pull --vendor claude`
    - `aida queue work S --resume=C --no-human=both --role implementer --no-pull --vendor claude` (also interactive --resume=C without --no-human).
    - `aida queue work PR-N --role reviewer --no-human=both --no-pull --vendor claude` (also interactive reviewer and supported reviewer resume).
    - `aida queue work S --no-launch --session-id C --role implementer --no-pull --vendor claude` through the actual TUI setup command contract.
    - `aida queue work --batch B --auto-complete=through-ci --no-human=both --vendor claude`; `aida queue work next2 --auto-complete --no-human=both --vendor claude`; `aida queue work S --auto-complete --no-human=both --vendor claude`; `aida queue work S --auto-complete --from-pr --no-human=both --vendor claude`.
    - `aida queue rework S --work --for implementer --reason fixture --no-pull` and `aida queue rework S --resume --for implementer --no-pull` exercise the direct in-process call and its PRECEDING rework writes. Include preexisting InProgress and reopened fixtures; no --force used as an authority override.
    - `aida queue work --role implementer --dry-run`, explicit S --dry-run, --list-sessions, and --resume-drain --resume-dry-run remain read-only.

    bug_1808_headless_delegation_refusal_is_atomic: each relevant argv under nondelegating implementer (and wrong reviewer parent) with queued and implicit rows; assert explicit authorization error, no vendor process/sentinel and exact full-state equality. Include complexity/assist/effort flags and known invalid vendor/resume before first write.

    bug_1808_explicit_selector_does_not_change_launcher_authority: valid delegating advisor/product/integrator selects implementer at head, explicit S, batch and synthetic row; the same selector under a nondelegating actor refuses. Fixture roster/grants determine delegation, not assumed seat names. PR/MR keeps reviewer. Diagnostics report both selector and validated authority.

    bug_1808_all_entrypoints_preflight_before_mutation: execute the entire argv table through production dispatch/RealPhaseDriver using fake vendor/forge. Assert one issuance per launcher/phase, zero recursive issuance per assigned consumer; no reviewer grant demanded in through-ci, no implementer demanded in --from-pr. Rework refusal includes prior status/history/queue prefix. Initial bounded batch has no writes if a required initial seat fails; dynamic member refusal preserves prior committed member history.

    bug_1808_preflight_races_fail_closed: deterministic test-only process barriers after P0 planning, before P2 first installation and immediately before P4 final validation. At each barrier revoke via the real supported authority writer, expire via controlled clock, change roster via supported team command, or race a peer queue/spec/comment/run update. A peer that wins before locks is preserved in the locked baseline; a peer arriving during installation waits until commit/abort, then applies normally. Test authority revocation queued behind the lock to document the linearization, AND expiry during installation to prove abort. Inject failures after EACH resource installation, disk-write failure and process kill with PREPARED vs COMMIT journals. Assert no vendor, no invocation-owned residue, identical original history (plus only legitimate peer history), intact peer rows/token membership, no stale backup restoration. Include refs/store commits and worktree metadata, not only queue count. Verify recovery through a DIFFERENT CLI reader before comparing the final snapshot. Child-launch failure after valid P4 instead verifies manual continuation.

    bug_1808_assigned_phase_is_not_recursive_delegation: run production phase launcher with a nondelegating scoped implementer child; matching token/member/phase/attempt/grant/native identity succeeds without issuing another grant. Wrong live member token, old attempt, wrong spec UUID/repo, missing manifest, stale PID/start, caller-invented C, forged flags and inherited driver handle all refuse without writes. Exercise both background and pane-host command construction. Reviewer/resume wrappers issue no extra child and preserve actor identity. TUI later activation after grant expiry refuses without altering its preexisting authorized setup.

    Retain role-selection unit tests and source-contract tests only as supplements. Existing assert_pickup_unstarted does not suffice; it omits most of this state. No tests, live queue-work experiment, source edits, grants, queue/status/hold mutations or merge were performed in authoring this revision.

    Blocked-item closure map for independent review

    Review item 1 is addressed by the retained assignment fields, reciprocal validator and per-entrypoint single-owner table; none relies on DrainState.current/RunMarker.spec/env alone. Item 2 is addressed by one concrete staged publication protocol with ordered locks, enlisted readers/writers, current locked preimages, Git ref/object quarantine, exact final validation, expiry linearization and crash recovery. The larger-but-bounded scope is stated explicitly because current primitives cannot meet strict acceptance. The independent advisor must accept or request concrete changes to this scope; the author supplies no signoff and proposes no operator acceptance relaxation.
