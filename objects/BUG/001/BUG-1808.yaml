    **F1 — identity gate [§7.3].** The gate's actual discovery is recorded: `project_root` = the store worktree, and the allowlist source is `<store>/.aida/config.toml`, with its digest or recorded absence (here it is absent, so the gate is INERT). V3 states truthfully that store pushes are not gated by the project allowlist at bf652209, and preserves that exactly:
