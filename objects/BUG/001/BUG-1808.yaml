    **`invocation_authorization` field (concrete core-route negative, F10).** ADMISSION records exactly one of:
    - `cli_tty_guardrail{stdin_tty, stderr_tty}` (CLI roster route; labelled guardrail);
    - `none_recorded{route: core|mcp|internal}`.

    No field is named or treated as authority. For a direct core `team::allow_seat_cas` call:
    - the call is permitted as today (core permissiveness is preserved unless its owner records a decision);
    - the receipt carries `none_recorded{route: core}`;
    - the receipt carries NO CLI-derived TTY sample;
    - no output or receipt describes the call as authorized.

    That is the observable negative (W6 (f)). It is evidence hygiene, not a fake protection.

    ## 12.5 Lock order (unchanged in substance)

    HOME → REPO → (SEAT never) → STORE → (`blocks.lock`, row 13) → Git (local, short).
    - A peer step holds HOME → peer STORE alone, never with our REPO or STORE.
    - No AIDA lock is held across any network fetch, push, pre-push hook or wait.
    - The scheduler tick flock may enclose a ledger operation (tick → HOME → STORE), never the reverse edge.
    - No guard crosses into a child process, and no lock FD is inherited.

    ## 12.6 Heartbeat cost and DrainGuard (amendment A6)

    **Per-tick bound.**
    - At most one tick operation per `HEARTBEAT_INTERVAL_SECS = 300` s.
    - Each tick does at most 2 network fetches (R and one T, plus one more T per same-C re-push), at most 2 pushes of the same C, and finite local publications.
    - The tick deadline is 120 s overall, including lock waits. Its lock wait uses a 30 s timeout, after which it skips the tick (existing unreachable-skip behavior).

    **Thread.** The heartbeat thread enters HOME itself.

    **Per-key cap.** Key `lock/<kind>/<clone>` holds at most 4 open admissions, and a fifth skips the tick. If the R fetch fails, no admission is created at all. Accumulation therefore needs repeated push or observe failures after a successful R fetch. Open ticks are settled by the next tick's own observation (§10.8, trigger 1).

    **DrainGuard.** `DrainGuard::drop` (`drain_lock.rs:629–638`) sets stop and joins the thread BEFORE taking HOME or STORE, never while holding them. The join is bounded by one tick deadline (≤ 120 s).

    **TTL.** The 1800 s TTL means a stuck heartbeat makes the claim reclaimable by peers, which is the existing semantics for unreachable origin.

    # 13. Hijack markers: capture, delivery, own clear (F9, amendment A5)

    ## 13.1 Contract

    A `HIJACKED.toml` in clone X's `.aida-store/.aida/` means: origin accepted a re-attribution of `marker.node_id` away from X, and X has not since re-acquired that id locally. It is advisory, never authority, and never consulted by `seat_authority`.

    ## 13.2 PeerCapture (step 0; a separate step before ADMISSION)

    - It holds NONE of our locks.
    - Under HOME, it resolves the before-owner entry `E_before` of the target at the PLAN base: `{hostname, email, clone_path, registered}`. It evaluates reachability by the existing rule (S-F6).
    - **Absent or unreachable at capture** (different host, different user, no clone_path, path missing, or no writable `.aida-store/.aida/`) → `PeerCapture::Absent{reason}`. There is no peer step. The outcome is the existing healthy `Reattributed{reason}` positive.
    - **Reachable** → take the peer root's permanent store lock (`<peer>/.aida-store/.aida/store-write.lock`) ALONE and record:
      - the canonical path and device/inode of `<peer>/.aida-store` and `<peer>/.aida-store/.aida`;
      - the exact peer marker bytes, or absent;
      - the exact peer `.aida/node.toml` bytes.

      Then release the lock.
    - The capture goes into `record_stamp`/before-images at ADMISSION. M_ours, the marker this operation would deliver, is fixed at attempt k as `{node_id: target, new_owner_hostname/email/clone_path: ours, hijacked_at: t_k}`.

    ## 13.3 PeerDelivery (step 8; a separate finite common SERVICE publication after our install receipt)

    Under HOME → peer STORE, holding none of our REPO or STORE locks:
    1. Re-resolve the peer root and prove it is the same device/inode. Otherwise → `notification-not-delivered{peer root replaced or vanished}` (it vanished after capture; remote ownership stays accepted).
    2. If the current peer marker bytes == M_ours → **already delivered**: idempotent success, settle.
    3. The current peer marker bytes must equal the capture image AND the current peer node.toml must equal its capture image. Otherwise → `notification-conflict{changed since capture}`, preserved.
    4. The replacement predicate, all compared exactly:
       - capture image Absent → install M_ours;
       - capture image is a marker with `node_id == target` AND its `(new_owner_hostname, new_owner_email, new_owner_clone_path)` ≠ `E_before`'s `(hostname, email, clone_path)` AND ≠ our own tuple → install M_ours. Registry lineage then shows that the marker's named new owner had already lost the target before our accepted transition, so the marker is stale;
       - any other marker (a different `node_id`, or a same-id marker naming ourselves or `E_before`) → PRESERVE and report `notification-conflict{other marker present}`.
    5. Install by temp file, fsync, atomic rename and directory fsync. The journal holds the exact before-image and after-image, and rollback restores exactly that before-image only if the current bytes equal our after-image (never pathname deletion).

    There are no clocks, no `registered_at` ordering, no nested own/peer locks, and never an overwrite outside step 4.

    ## 13.4 Own-marker clear (inside the §11 install)

    Allowed only if all three hold:
    - the current own-marker bytes EQUAL the ADMISSION image;
    - that image names `node_id == target`;
    - its `(new_owner_hostname, new_owner_email, new_owner_clone_path)` equals `E_before`'s tuple, meaning it records the takeover we are now reversing.

    Otherwise the own marker is preserved. Example: B took the id from A after A's accepted takeover. B's marker in A's clone names B, but A's later operation's `E_before` is B's entry, and A's install is SUPERSEDED anyway when T shows B. Validation 4(a) makes A SUPERSEDED whenever T shows another owner, and then nothing is cleared.

    ## 13.5 Crash closure

    | Crash point | Recovery |
    |---|---|
    | Remote accepted, before own install | Lineage → §11 |
    | Own install committed, before delivery | Run PeerDelivery against the ADMISSION capture (§13.3) |
    | Delivery committed, before settlement | Step 2 sees M_ours → already delivered → settle |
    | Recovery observes a successor | SUPERSEDED: no own install, no delivery, report "not notified: superseded" |

    No marker exists before acceptance, so nothing ever needs restoring for a rejected or unknown attempt.

    ## 13.6 Portability (amendment A5)

    `HIJACKED.toml` is not listed in the store `.gitignore` (D15). Here `.git/info/exclude` excludes `.aida/`. Whether a peer's staging could commit a marker therefore depends on that peer's local excludes. A2 never stages it (install effects are exact FileEffects), and W7 (k) witnesses both an exclude-present and an exclude-absent peer.

    # 14. F-1 and the caller matrix (F8)

    ## 14.1 The confirmed counterexample (kept)

    For the PARTICULAR pre-P4 schedule:
    1. A claim is accepted at origin before final P4.
    2. A winning revoke or expiry follows.
    3. Origin then becomes unreachable.

    The result is accepted remote history that no local journal can remove. A TTL eventually expiring is not no-residue rollback. This is not claimed to be universal. There is no advisory exclusion, no acceptance relaxation and no new claim command.

