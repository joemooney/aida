    ## Scope, pins and precedence

    BUG-1808 owns this common amendment; TASK-1607 consumes it, and BUG-1802 consumes the common substrate later. The concurrently authored callback-origin v5 is separate, independently unsigned and required for Git publication paths. This addendum neither implements nor replaces that mechanism, changes its files, nor approves BUG-1808 wholesale.

