    ## 2. One-paragraph mechanism

    Each C operation follows the same sequence, and every local step runs inside the common PublicationGuard (HOME first):
    1. Capture the canonical store tip L into an owner-private object repository P.
    2. Fetch origin's tip R directly into P.
    3. Build B = L rebased onto R, and then candidate C, inside a v5 sealed construction gitdir populated from P.
    4. Durably ADMIT the attempt with a common SERVICE publication, which records lineage, endpoint, hook profile, before-images and the observation plan, and installs a ref-less kept pack holding C's transport closure in the shared object store.
    5. Push exact C by full OID from the canonical store worktree, so the real pre-push profile runs, with no AIDA locks held.
    6. Decode the report with the pinned table, then observe a fresh tip T into P.
    7. Resolve acceptance through candidate lineage.
    8. Install only through a validated common SERVICE import whose before-images are checked before the first effect.
    9. Notify a hijack peer in a separate finite publication.
    10. Settle by releasing pins.

    Recovery resolves only existing lineage. It never creates a new attempt, allocation, reclaim or grant.

    ## 3. Owner and trigger

    The owner of preparation, transport, admission, install and recovery is the BUG-1808 common Git/publication owner. Each family function remains the semantic decision owner. The trigger is any row in §13. TASK-1717 owns only its approved protective S/P scope and supplies no part of this mechanism.

    ## 4. Continuous object lifetime

    | Hop | Mechanism | Predecessor kept until | Verification before the predecessor may lapse |
    |---|---|---|---|
    | Canonical branch → P (L) | Inside HOME→REPO→STORE: `git --git-dir=P fetch --no-tags --no-write-fetch-head <shared-common-gitdir> refs/heads/<b>:refs/cas/<op>/<k>/L`. This is a local transport with no network and no hooks (P has a private empty hooks directory and is not a production repository). Fetch performs its connectivity check, then L must equal the canonical ref value read under STORE. | The canonical branch still names L (STORE held). | Connectivity check, and P's ref equals L. |
    | origin → P (R) | No AIDA locks: `git --git-dir=P fetch --no-tags --no-write-fetch-head <resolved-fetch-url> refs/heads/<b>:refs/cas/<op>/<k>/R`, using EndpointProfile (§5). R is pinned in P the moment the fetch completes. The shared repository is never touched. | Origin. | Fetch connectivity check. |
    | P → sealed construction gitdir S_k | v5 requires a verified complete private closure. Immutable pack/loose files are hardlinked from P (copied across filesystems), then the {L,R} closure is verified with the v5 bounded object reader. No alternates. | P's refs. | Bounded closure verification before S_k runs any Git. |
    | S_k → P (B, C) | `git --git-dir=P fetch <S_k> <C>:refs/cas/<op>/<k>/C`, and likewise for B. | S_k stays alive until P's ref exists. | Connectivity check. S_k is destroyed afterwards (v5 domain shutdown). |
    | P → shared object store (transport closure) | Inside ADMISSION (§8): `pack-objects --revs --stdout` over `{C, L} ^M`, where M = merge-base(L, R), streamed into `git -C <common> index-pack --stdin --fix-thin --keep="aida-store-cas <op> <k> <admission-tx>"`. Git writes the `.keep` before the pack is visible, and repack never deletes kept packs. No ref names C. | P's refs. | `rev-list --objects C ^M` succeeds in the shared store. `closure(M)` is reachable from the canonical branch (below). |
    | Shared object store during push | The pre-push identity gate and send-pack read C/R from the shared store, which is pinned by the kept pack. | Kept pack until settlement. | — |
    | After acceptance | The S6 import (§7) installs T through the common adapter. It first imports `closure(T) ^ M'` the same way (kept), then the canonical ref update makes the objects reachable. | Kept packs until the S6 receipt is settled. | Validated before the ref update. |
    | Settlement | Delete exactly the owned `.keep` files whose content names `<op> <k>`, and delete P refs `refs/cas/<op>/*`, both as journaled effects of a settlement publication. Normal gc may later prune now-unreachable transport objects. | — | Delete happens only after the settlement receipt is durable. |

    Why `closure(M)` stays alive: M is published history and an ancestor of every supported future canonical tip, because origin only fast-forwards under supported writers and S imports rebase local commits onto origin. The single supported rewriter of history is explicit store compaction (`squash_orphan_to_snapshot`, TASK-1332 L row). Under the common owner it is enlisted to REFUSE while any unsettled store-CAS admission for that store exists. That is a bounded predicate over existing admissions (§8), not a maintenance freeze.

    Failure modes: closure construction or verification failure, insufficient space, or an exhausted P/kept budget all refuse before ADMISSION with a named reason, and none counts as an ordinary positive. Size: P converges to the size of the store history once (incremental after that). S_k is hardlinked. The kept pack is bounded by unpublished local commits plus new remote commits plus C. The planner declares a finite byte budget, and exceeding it refuses before admission.

    ## 5. Exact transport, endpoint and native pre-push context

    `EndpointProfile` is resolved by the planner from the CANONICAL STORE WORKTREE's effective configuration, all scopes, with `--show-origin --show-scope`:
    - `remote.origin.url` / `pushurl` after `url.*.insteadOf` / `pushInsteadOf` (`git remote get-url [--push] origin`);
    - `remote.origin.{receivepack,uploadpack,proxy,vcs}`;
    - `core.sshCommand` and the `GIT_SSH*` environment;
    - matching `http.<url>.*` and `credential.<url>.*`;
    - `credential.helper`;
    - `transfer.*` / `fetch.*` / `push.*` keys that alter transport.

    It records the digest of that key/value/origin set and the two resolved URLs. It is re-resolved and compared immediately before EACH network spawn (P fetch and push); any mismatch refuses before the spawn. P's generated config carries the repository-scope subset verbatim, so the fetch into P uses the same endpoint and credential path. Global and system scopes apply unchanged because the same HOME/environment is used. `has_remote("origin")` alone is never treated as a binding.

    `PrePushProfile` is resolved by the planner:
    - hooks path = `git -C <store-worktree> rev-parse --git-path hooks`, which honors `core.hooksPath` and worktree config;
    - `pre-push` bytes, mode and digest;
    - classification: absent; BUG-1706 mirror-only (installed here); generated mirror+identity (`MIRROR_HOOK_HEADER` with `identity_gate_hook_lines`); identity-only (`IDENTITY_HOOK_HEADER`); or custom.

    It also records the AIDA project discovery result that the hook will see. The hook runs with cwd = store worktree top level and unsets `GIT_DIR`/`GIT_WORK_TREE`. The planner computes the same discovery from the same cwd through the library function `aida identity check-push` uses, and records the resolved `project_root` and allowlist source digest. It re-checks both bytes and discovery immediately before the push spawn. A custom hook executes unchanged, as every store push does today, and its digest is recorded. Its effects are never AIDA evidence. No hook is disabled, and nothing runs with `--no-verify`.

    The push, from the store worktree:

    `git -C <store-worktree> push --porcelain --no-force --end-of-options origin <C-full-oid>:refs/heads/<b>`

    It runs as an owned child with the operation deadline, a closed FD set (no lock FD) and the existing environment. Stdin to the hook is Git's own `<local-ref> <C> refs/heads/<b> <advertised-old>`. Whether the local-ref field equals the OID text is UNVERIFIED and pinned by witness W2. The identity gate runs `git log <advertised-old>..C` in the discovered `project_root`, whose object store is the shared common store, where C is kept, so the real gate evaluates C. Mirror fan-out skips the store branch, so no unconfirmed mirror can happen. Store-leg mirror fan-out stays its existing origin-confirmed job. No hook callback authority exists on this path: it is not v5 callback-capable Git.

    ## 6. Remote outcome decoding, observation and lineage (finding 1)

    `PushDecoder` is pinned to Git 2.43.0 by the v5 profile executable digest. Its bounds: at most 64 stdout lines and 4 KiB per line, plus exit status. It accepts exactly ONE porcelain line whose `<to>` equals `refs/heads/<b>`. Under the exact-OID refspec, `<from>` must equal C's full OID; if it does not, the result is INDETERMINATE.

    | Porcelain line (flag + summary [+ reason]) | Exit | Class |
    |---|---|---|
    | ` ` (fast-forward, `old..new` where new is a prefix of C) | 0 | ACCEPTED_REPORTED |
    | `*` `[new branch]` | 0 | ACCEPTED_REPORTED |
    | `=` `[up to date]` | 0 | REMOTE_ALREADY_C. Adopt only after observation shows T contains C. |
    | `!` `[rejected]` with reason ∈ {non-fast-forward, fetch first, stale info, needs force, already exists, remote ref updated since checkout, new shallow roots not allowed} | ≠0 | CLIENT_REJECTED. send-pack never sent the update command, so it is not applied. |
    | `!` `[remote rejected]` (any text) | ≠0 | SERVER_REJECTED_REPORTED. A known server refusal for this command. |
    | `!` `[remote failure]` | any | INDETERMINATE (EXPECTING_REPORT: the command may have been applied) |
    | `X`, `+`, `-`, an unknown summary, a wrong `<from>`/`<to>`, several lines, no line, truncation, deadline kill | any | INDETERMINATE. This covers a pre-push hook failure (no status printed) and transport death. |

    No class is inferred from stderr prose or from exit status alone. A known pre-push refusal is not distinguishable from a transport failure by the pinned observables, so it stays INDETERMINATE (§6 bound below prevents spinning).

    After EVERY push outcome, observation fetches a fresh tip T into P (`refs/cas/<op>/<k>/T`) through EndpointProfile.

    `Lineage(op)` is the durable, ordered set {C_1..C_k} of the operation's ADMITTED candidates (§8). Resolution, in order:
    1. If any C_i equals T or is an ancestor of T, the result is ACCEPTED(i). Ancestry is evaluated in P. At most one i can qualify, because every later attempt is built only after a fresh base that contains no lineage candidate. A delayed earlier command fails the server's expected-old check once the ref moved, and a later candidate fails client-side non-fast-forward once an earlier one landed.
    2. Otherwise, if T advanced from R_i (R_i is an ancestor of T and T ≠ R_i) for every unsettled C_i, the result is NOT_IN_OBSERVED_TIP. C_i can no longer land without an origin rewind. This is NOT "never accepted": an accepted-then-rewound C_i is possible only through an unsupported origin rewind (an R→C→R ABA), which no supported writer performs, and V2 never states that C_i did not land.
    3. Otherwise, if T == R_i, the result is PENDING_POSSIBLE. C_i may still land, for example through a delayed receive-pack.
    4. Otherwise (R_i is not an ancestor of T), the result is REWOUND, which is BLOCKED (Unknown, retained). No further attempt and no local effect.

    Retry policy for the live operation, within the family's existing limits (claims 5, roster/alias 10, node MAX_CAS_RETRIES, block 3, ledger MAX_RETRIES):
    - CLIENT_REJECTED and SERVER_REJECTED_REPORTED, together with NOT_IN_OBSERVED_TIP/PENDING_POSSIBLE: the next attempt re-runs the family predicate on the fresh base T. Lineage adoption is checked first.
    - INDETERMINATE together with PENDING_POSSIBLE: the next attempt is built on T == R. Git serializes C_i against C_{i+1}, since both carry expected-old R; whichever lands is adopted via lineage.
    - Two consecutive INDETERMINATE outcomes with an unchanged T: stop as UNKNOWN_RETAINED. This covers a deterministic pre-push refusal without spinning.
    - A REWOUND observation also stops as UNKNOWN_RETAINED.

    On the INDETERMINATE+ABA path, an allocation family (#9 automatic, #13) may allocate again. That is safe for identities and ranges actually in use, because no unresolved C_i is EVER installed locally (§7). Our dispenser and node.toml use only installed ranges and ids, and no other node dispenses our range. The prior C_i stays in evidence as "indeterminate, superseded by attempt j", never as "not accepted".

    ## 7. Install: validate before any effect (finding 3)

    The install runs only for ACCEPTED(i), as a common SERVICE publication of v4 class "Store pull/rebase/structural merge", with HOME→REPO→STORE taken in order and never late:

    1. `ensure_store_write_safe` after STORE. A rebase in progress, or dirty canonical paths, refuses as INCOMPLETE (no abort, no sweep).
    2. Read the current local canonical tip H.
    3. **Prepare privately** in a fresh v5 S_k:
       - Integrate H's local-only commits onto T with the existing union rules only.
       - A conflict on a path with no union rule (`registry/{team.toml,nodes.toml,blocks.yaml,aliases.toml}`, `coordination/**`) is NOT resolved generically. The result is INCOMPLETE{conflict}, carrying the semantic-successor evaluation below.
    4. **Family validation, before any effect**, against the NAMED observation horizon T (fetched at time t_obs; acceptance is historical, current ownership is checked only against T):
       - (a) T and the prepared result still contain the family record that C_i created or changed, in the exact form C_i wrote it.
       - (b) H has no local commit after L_i that touches this family's paths in a way that changes that record. That would be a local same-family successor.
       - (c) Every dependent local before-image is byte-equal to the image recorded at ADMISSION: `.aida/node.toml` (#9, #11, #13, #16), the own `HIJACKED.toml` (#16), `.aida/dispenser.toml` and the range view (#13).

       Any failure gives SUPERSEDED or INCOMPLETE with zero local effects. Unrelated H commits are always preserved. Origin changes after t_obs cannot be excluded by a local lock, and V2 promises no perpetual ownership.
    5. Journal PREPARED with every before-image and after-image (ref H→H', index, worktree files, node.toml, own marker, dispenser view, kept-pack files) per the v3/v4 rules.
    6. **Revalidate at the owning install boundary**, immediately before the first effect and under the same held locks: H unchanged and all before-images still exact. Otherwise ABORT with nothing installed.
    7. Install the finite verified set through the adapter. Canonical ref CAS expected-old H. The v5 callbacks run through the pump. node.toml is written only for the accepted id. The own marker is cleared only per §10.
    8. P4/COMMIT, retained receipt, `InstallVerification` observation.

    There is no reset to L, B or C, and no old-snapshot overwrite. SUPERSEDED with a successor in T: report the successor and do not reclaim. The plain import of T is left to ordinary sync and is not forced by this operation. A fault at any boundary follows v3 recovery: a PREPARED install restores exact current-locked preimages, and an install with COMMIT rolls forward. Neither undoes the remote C_i.

    ## 8. Durable pre-send ADMISSION, discovery and settlement (finding 4)

    `ADMISSION(op, k)` is a common SERVICE publication. It must COMMIT before the push child is spawned. Under HOME→REPO→STORE:
    - (i) S3 recheck: safe state; L_k is an ancestor of the current H; no commit after L_k touches the family's paths.
    - (ii) Journal PREPARED.
    - (iii) Install the kept pack, a `TargetRoot::GitCommonDir` effect with exact before (absent) and after bytes for `.pack/.idx/.rev/.keep`.
    - (iv) P4/COMMIT, fsynced with its parent directory per launch condition 4.
    - (v) Retire with a retained receipt whose disposition is `remote-unsettled`.

    The push starts only after (v) has been read back. A crash before (iv) leaves nothing to send: PREPARED rolls back and the kept pack is removed. A crash after (iv) is discoverable as described below.

    The immutable COMMIT carries existing fields only. Store-CAS adds no new top-level record family:
    - `write_set`: the kept-pack effects.
    - The decision payload `StoreCasAdmission`, encoded as the COMMIT decision's typed body:
      - `{op_id, attempt k, family, intent_digest, lineage: [C_1..C_k with R_i, B_i, L_i, M_i]}`;
      - `record_stamp_k`: the EXISTING record fields actually written by C_k, for example the claim's `started_at`/`pid`/`pid_start_time`/`clone_path`, the node entry, the exact block range computed at attempt k, the ledger delta, or the marker image;
      - the EndpointProfile digest and both URLs, and the PrePushProfile digest plus discovery;
      - the refspec, `<b>` and the advertised-old expected R_k;
      - local before-images (§7(c));
      - P repository identity (path, device/inode) and the P ref names;
      - the operation owner's PID/boot/start, which is the EXISTING identity convention, not a new scheme.
    - An `ObservationPlan` for namespace `(op, k)` with allowed_kinds = {SendOutcome, Settlement, InstallVerification, Cancellation} and finite budgets.

    Mapping onto 6a1733, together with what is still missing:
    - The push report is a `SendOutcome` whose payload is the typed `PushReport {lines[], exit, class}`.
    - The remote observation is an `InstallVerification` whose payload is the typed `RemoteObservation {T, class, i?}`. It verifies remote state, not local installation; if the next reviewer finds that kind's semantics too narrow, the alternative is a seventh kind `RemoteObservation` added to the SAME enum (an extension of the existing owner record, not a new ledger).
    - Settlement is `Settlement {SETTLED_INSTALLED | SETTLED_SUPERSEDED | SETTLED_NOT_IN_TIP | UNKNOWN_RETAINED | INCOMPLETE}`.
    - The checkpoint has NO typed StoreCas payload codecs, validators, admission decision type, lineage or discovery. `Observation.payload` is untyped bytes. All of these are REQUIRED new typed decoders inside the common owner, with deny-unknown-fields, fixed versions and size bounds, validated before they are acted on. They are not presumed to be supplied.

    Discovery has three pieces:
    - P's refs `refs/cas/open/<op>/<admission-tx>` → C_k, written with `core.fsync=reference,objects` in P's generated config. This is a LOCATOR naming the retained receipt, the analog of v3's grant/manifest → publication_id. It is not authority.
    - The bounded set of open operations per store (64). If that set is full, new operations refuse with "unsettled store-CAS operations need recovery".
    - Each locator is cross-checked against its receipt digest and kept-pack content. If they disagree, the operation is RECOVERY-BLOCKED, never success or restoration.

    Who recovers, and when: at the next entry to ANY C family for that store, after HOME is entered and before its own decision, plus the existing common recovery pass. Recovery may act only when the recorded owner PID/boot/start is proven dead and the recorded push child is proven quiescent. This uses the v5 quiescence standard (pidfd/start, no waitpid assumption). A live owner is skipped.

    What recovery does:
    - Fetch T into P and resolve lineage per §6.
    - ACCEPTED(i): run the §7 install, whose validation decides between INSTALLED and SUPERSEDED.
    - NOT_IN_OBSERVED_TIP for all candidates: SETTLED_NOT_IN_TIP.
    - PENDING_POSSIBLE: stays open.
    - REWOUND: UNKNOWN_RETAINED.

    Recovery NEVER builds a new candidate, re-runs a scheduler job, allocates, reclaims or deletes a claim, issues a grant, or reports Acquired to a dead consumer. Settlement journals the deletion of exactly the owned kept packs and P refs.

    Deletion and no-op families: release, stale release, lock release and unregister have no surviving record to match, so acceptance is ONLY lineage ancestry. Content matching is never used. `NoOp` and `Refuse` decisions admit nothing and send nothing.

    Ranges: `record_stamp_k` holds attempt k's computed range, not a frozen pre-allocation value.

    ## 9. HOME mandatory; authority surfaces (finding 5)

    Every local step of every family is inside `PublicationGuard::enter(home)` with recovery first: the L capture, ADMISSION, the install, the marker step and settlement. HOME is never acquired late beneath STORE and never dropped around provisional effects. A whole-store import can change `registry/team.toml`, whatever family triggered it, so every family's install is authority-bearing. No family may install before the common owner exists (gates 1 and 4).

    The required seams:
    - Readers: `seat_authority::{roster_allows:93, current_grant:104, issue_direct:159, validate_child_delegation:211, issue_child:235}` and every `TeamRoster::load` used for authorization.
    - Writers: the 16 rows in §13, plus ordinary S imports (TASK-1717 routes), which the common owner enlists separately.
    - Core: `team::*_cas`, `alias::link_cas`, the `git_ops` node functions. These are public, and must route to the owner API rather than rely on CLI wrappers.
    - MCP: exposes none of these writers at bf652209; the `session_start` tool only returns CLI text (mcp.rs:4982–5010).
    - REST: `set_team_role` stays FORBIDDEN.
    - The network-free common SERVICE import (§7) is distinct from TASK-1717's protective S path, which embeds fetch/rebase.

    Authority surfaces per family. All four are named separately:

    | Surface | What it is | Can Git serialize it? |
    |---|---|---|
    | (a) Invocation authorization | The EXISTING caller check. Roster CLI: `require_direct_tty`, a terminal guardrail ("Guardrail, not security", `ROLE_GUARDRAIL_CAVEAT`). It is NOT proof that a human is present and NOT authority. Core primitives: none. Node/block/alias/claim/ledger: none beyond the invocation. | Sampled at S0 and again at ADMISSION under HOME. Git does not serialize it afterwards. |
    | (b) Clone or local identity | `clone_path` canonicalization; `.aida/node.toml` | Not serialized by Git. Checked as before-images at ADMISSION and at the install boundary. A change leaves the remote C accepted but makes the result INCOMPLETE{local identity changed} with no install. |
    | (c) Remote content precondition | Records in the compared remote history | YES, through expected-old/fast-forward. |
    | (d) Local consumer authority | Grant/roster at a consumer's P4 (session, drain, grant issuance) | No. Sampled home-first at the consumer's own P4. |

    Joins that remain explicitly UNSUPPORTED:
    - **U-1.** A contract requiring a mutable local grant or roster-writer authority to stay valid AT remote acceptance. The source has none for roster writes. If such a contract is adopted, Git cannot supply it, and this sketch supplies no freeze.
    - **U-2.** TTL clocks and liveness/session probes in `decide_claim` are sampled at decision time. Git serializes only the holder RECORD. A holder whose record is unchanged but whose liveness changes after S3 is not re-evaluated, exactly as today.
    - **U-3.** A local node identity changing during the push is detected, not prevented.
    - **U-4.** F-1 (§11).

    Lock order, unchanged in substance: HOME→REPO→(SEAT never)→STORE→(blocks.lock per A1 for #13 installs)→Git. No AIDA lock is held during the network fetch, the push, the pre-push hook or waits. The tick flock may enclose a ledger operation (tick→HOME→STORE, never the reverse edge). The heartbeat thread enters HOME itself. `DrainGuard::drop` joins it before HOME/STORE.

    ## 10. Hijack markers: exact owned images (finding 6)

    Images captured at ADMISSION, under HOME→REPO→STORE of OUR repository:
    - the own marker's exact bytes, or absent;
    - the old peer root's identity: the canonical path of `<old_clone>/.aida-store` and its `.aida/` directory, both with device/inode;
    - the peer marker's exact bytes, or absent;
    - the peer `.aida/node.toml` exact bytes;
    - the marker image M_ours that this operation will install. Its bytes are deterministic from `record_stamp_k`: node_id, new_owner_hostname/email/clone_path and `hijacked_at` fixed at attempt k.

    Own-marker clear, inside the §7 install: allowed only if the current own-marker bytes EQUAL the ADMISSION image AND that image names `node_id == target` with a `new_owner` equal to the BEFORE-owner of C_i's accepted transition (the owner we took the id back from). In every other case the marker is preserved. For example, B took the id from A after A's accepted takeover: B's marker names B, not the before-owner, so A never erases it. Validation 4(a) also makes A SUPERSEDED when T shows B as the owner, in which case nothing is cleared.

    The peer marker step is a SEPARATE finite common SERVICE publication, run after our install's receipt. We hold none of our own repository locks. Under HOME, it targets the peer repository identity as a single-repository plan:
    1. Take the peer root's permanent store lock alone, and re-resolve and prove it is the same root (device/inode).
    2. Require the current peer marker bytes to EQUAL the ADMISSION image, and the peer node.toml bytes to EQUAL their ADMISSION image. If node.toml changed, the peer re-acquired or changed identity locally, so the step is preserved and reported.
    3. The before-image must be absent, or must name `node_id == target` with `new_owner` equal to the before-owner recorded in C_i's transition (an older re-attribution that our accepted hijack supersedes). Anything else, including any same-id marker with a different owner, is PRESERVED and reported as `notification-conflict`.
    4. Install M_ours by temp file, fsync, atomic rename and directory fsync. The journal holds the exact before-image and after-image, and rollback restores only that exact after-image to that exact before-image, never by pathname deletion.
    5. If the peer is missing, unreachable or locked past the timeout, report `notification not delivered`. Remote ownership remains accepted, and this is never presented as a successful notification.

    No ordering uses `registered_at` or wall clocks. Own and peer locks are never nested.

    Crash closure:

    | Crash point | What recovery does |
    |---|---|
    | Remote accepted, before own install | Lineage → §7 |
    | Own install committed, before the peer step | Run the peer step against the ADMISSION images |
    | Peer marker installed, before settlement | Settle |
    | Recovery observes a successor | SUPERSEDED: no own install, no peer step, report "not notified: superseded" |

    No marker exists before acceptance, so nothing ever needs restoring for a rejected or unknown attempt. Healthy takeover: accepted registry, own node.toml, own-marker handling per the rule above, and the correct old peer notified.

