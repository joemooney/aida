    Independent reviewer: Codex task1607-launch-v2-independent-advisor, native thread 01a119ad-da7c-7d23-b690-d144616373cb. NEW Joe-assigned advisor; neither revision author nor earlier reviewer. Canonical role current --check returned advisor; AIDA_SESSION_ID absent. No authenticated implementation/review grant is asserted. Design/source/document review only, 2026-10-07 America/Phoenix. All canonical operations use /home/joe/ai/aida/target/agent/aida.

    Reviewed owner comment 01a119ac-133b-7580-9381-e1febdeb8849 by task1607-launch-v2-author, exact full-body match to BUG-1808-launch-commit-addendum.md, SHA256 4d67af90b7320da207c7f1181ff7ab95d52d27d0fe5e4890be256d1afbf571ec. Its TASK-1607 consumer is reviewed separately. Read the actual first launch CHANGES REQUESTED comment 01a1199c-f282-7fe3-868a-e3700eba3ab3 and report/receipt, original launch sketch, full owning specs/comments, signed STORY-1485/ADR67–70/C1–C8 and refinements, C7_F3_INDEPENDENT_REVIEW.md, production NOT READY report/inventory, earlier BUG-1808 decisions A–E and v3/v4, callback v5 and its now-available independent signoff. Full report: .aida/handoff/orchestrator/TASK1607_LAUNCH_V2_INDEPENDENT_SIGNOFF.md. Exact readback/provenance receipt is separate.

    Main is legitimately 5d4180e5ded8a55ad1b02beac5571c190d3da0ac, advanced from 199e591b07aa76a59cd34f0a41946f918501f6ba by BUG-1806 shell fixes. Inspected common source bytes equal that earlier baseline. Occupancy owner source remains 56f7b55b32fba77a2b8bdbdd2573d59cce0ca29f in /home/joe/ai/aida-worktrees/aida-task-1607. The binary label 199e591b07+dirty is not source-equivalence proof. Hash comparisons and code inspection, not that label, ground this review.

    F1 — RESOLVED AT DESIGN LEVEL AS AMENDED

    The single parent-owned P4 decision binds A/J/O/I/W, actual waiting PID/start, exact activation/assignment and occupancy generation. It commits setup and that immediate dispatch together. The old counterexample is resolved: a supported transfer/revoke that wins before P4 causes pre-COMMIT ABORT and exact restoration; one serialized after P4 affects subsequent operations, while this already committed immediate dispatch can be consumed once. This preserves signed faa07e4acb section 2's committed-child continuation and v3 P4's sole decision. It does not rename a fresh refusal as an exec error.

    Binding conditions:

    1. P4 must be the FINAL current-authority sample, after provisional installation and before the immutable decision, under home/repo/seat and ordered lower guards. Full parent-chain expiry/revocation/roster, subject/session, live parent/member, snapshot membership and exact phase/attempt/assignment/process joins are checked there. A process or clock change before that sample cannot inherit a P0 verdict. Revocation/roster/generation/member writers and seat peek/status readers enlist home-first. Reacquire lower locks only in order; no hidden home acquisition from a locked resolver. C7 holder/requester/deadline checks stay fresh under the seat lock. Time is sampled, not frozen by fsync; do not insert a task/child/network wait between decision validation and persistence.
    2. After durable COMMIT, the original live supervisor/creating thread and original live bootstrap/channel may consume the same immutable dispatch within its fixed monotonic startup deadline (default 30 seconds from decision). No second current-grant/generation/member lookup is permitted at leaf exec. Historical committed identities survive current-member advancement or holder transfer. New PID/channel/parent, image/argv/scope, member/phase/attempt, delayed setup-only activation, reconstructed recovery owner or explicit new retry/resume is a NEW authorization transaction. Same-attempt Alive/Unknown replacement refuses; retained possibly-executed evidence survives even proven death. A child's later privileged operation separately validates current authority and cannot conceal unfinished setup from this initial invocation.
    3. The final seat region contains only bounded local validation and durable local publication. READY, Git/hook work, network/mail/forge, child waits, termination/reaping and ETXTBSY backoff are outside seat. No process-local guard crosses exec. Occupancy after-images are provisional under the common journal until the SAME C; they confer no released authority or durable seat reservation. Unknown identity fails before decision, never creates an empty-start launch row. Unsettled committed attempts fence replacement of that attempt, not unrelated seat transfer.
    4. Durability remains write_all, file fsync, atomic rename, directory fsync for payloads/journal/coordinator/COMMIT/receipt/child evidence; readback is additional. Any storage fault forbids release. Visible exact COMMIT after a sync error is irrevocable uncertain commitment, not authorization refusal or rollback. Absent decision after an actual crash permits PREPARED rollback only with intact unambiguous journal evidence and no possible release. Corruption/ambiguity blocks. Before clearing the coordinator, retain exact COMMIT/install proof, durable release-intent meaning possibly executed, and required idempotent history projection. Post-decision observations cannot rewrite COMMIT or expand its finite write set. No ordinary cleanup erases live/possibly-executed attempts or restores stale snapshots over peers.
    5. Parent release is a bounded local operation after ALL shared locks are dropped: consume the noncloneable private CommittedDispatch plus exact WaitingChild, check original deadline/cancel state, make one nonblocking full seqpacket send and record its exact outcome. Full send is delivery evidence only; short/invalid/send-error/uncertain outcomes cancel via the owned identity handle and retain uncertainty. ACK/error-pipe EOF/death is not execution or nonexecution proof. Observation append failure cannot undo C or justify another process. Cancellation is serialized against send; pidfd/unreaped Child ownership, bounded settlement outside locks, and retained error/uncertainty evidence are mandatory. Kernel/storage stalls cannot be reported as successful bounded cleanup. Recovery never mints or sends vendor release.

    F2 — RESOLVED AT DESIGN LEVEL AS AMENDED

    SealedExecImage supplies an executable mechanism: copy BOTH helper and actual native leaf into independently owned sealing-enabled executable memfds; enforce write/grow/shrink/seal seals, no writable mappings, hash sealed bytes, and execute each with execveat(fd, empty path, argv, envp, AT_EMPTY_PATH). The original mutable path/inode is never reopened for execution. Source replacement, symlink replacement and in-place edits after snapshot cannot redirect that descriptor. Source changes during selection/copy must fail the prepared-image comparison or produce the precisely selected sealed image before writes, never an old digest with new bytes. Source permission/noexec/set-id/capability checks must apply to the opened selected object and explicit adapter semantics; checking only stripped memfd metadata cannot establish whether requested privilege behavior was discarded.

    Bind ELF class/machine/PT_INTERP, exact argv/env/cwd/stdio and adapter identity to I/C. Reject credential-changing hooks/images before setup; verify no_new_privs and the stated UID/GID/group/capability invariants plus PDEATHSIG across helper and leaf. The trusted kernel/system loader/system-library boundary is accepted ONLY for vendor entry-image binding as explicitly bounded. Unknown/vendor-relative loader/RPATH/RUNPATH, LD_* injection and required unbound resource bundles remain pre-write refusals, not silent sanitization. Any required installed variant missing a concrete positive remains an acceptance blocker.

    The installed Node Codex launcher is NOT the vendor leaf. I read codex.js, SHA256 61b0194f3bb6534439c8d26a3ed57d0805f84b884588b761795323eeb92fcf70, package 0.161.0: it resolves a platform package/fallback and spawns native Codex, adjusts four manager flags/package root, and forwards signals/exit. The proposed audited translation can remove Node from the launch chain while preserving those behaviors and pinning the selected native leaf. Its required installed-version positive is not satisfied by refusing all JS wrappers. Read-only ELF inspection found the selected Linux Codex leaf has no PT_INTERP/NEEDED entries; Claude has system shared-library dependencies. Neither inspection proves runtime compatibility. Arbitrary scripts/interpreters/wrappers require their own explicit supported adapter or pre-write refusal. Never clear CLOEXEC globally to accommodate a shebang.

    FD/lifetime conditions: only explicitly mapped leaf/description/control/error FDs survive helper exec and immediately regain CLOEXEC; helper image closes there, all those descriptors close on native vendor exec, and only planned stdio/individually declared terminal FDs survive. Close fork-inherited lock FDs before helper exec, not merely on eventual leaf exec. Verify sealed descriptor identity at READY and final consumption; actual bootstrap PID becomes native vendor PID, never publisher/Node/tmux/bwrap PID. Async-signal-safe post-fork code arms PDEATHSIG before helper exec then checks expected TGID and creating TID/start, including pre-prctl death. Creating thread survives until leaf exit. Recovery cannot assume waitpid ownership; the supported adapter names namespace init/preexisting subreaper and proves orphan reaping. Identity-bound cancellation never targets guessed/reused/peer PIDs. Controlled pre-exec parent/thread death prevents sentinel; unconstrained exec-racing death may have executed and must retain that evidence.

    Kernel semantics checked against execveat(2), memfd_create(2), F_ADD_SEALS(2), execve(2), PR_SET_PDEATHSIG(2) and kernel mfd_noexec documentation. Descriptor execution and sealing address different risks; memfds are volatile, not recovery launch entitlements. These documents support the proposed primitives, not implementation/test success.

