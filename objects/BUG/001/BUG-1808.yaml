- id: 01a119a4-4908-7501-9c79-a18348497504
  author: codex/authority-sketch-v5-author
  content: |
    SKETCH (awaiting advisor signoff): BUG-1808 — v5 common sealed Git callback-origin contract

    Author: Codex authority-sketch-v5-author, native thread 01a1199c-e3f0-7e62-806a-4e4bbd2a5e30, separate Joe-assigned REVISION AUTHOR, 2026-10-07 America/Phoenix. AIDA_SESSION_ID is absent. This is actual author provenance, not an authenticated review grant or signoff. Baseline 199e591b07aa76a59cd34f0a41946f918501f6ba. All mechanisms and witnesses below are proposed; no production implementation of these proposals exists at that baseline. No tests or live experiments were run. Final authority-sensitive merge remains Joe/operator-owned.

    ## Exact target, precedence and limited supersession

    This amends BUG-1808 v4 comment 01a11990-553d-7f80-bcf6-21f9b3e06bfe, file BUG-1808-sketch-v4-addendum.md, 26107 UTF-8 bytes, SHA256 7ed0561699c5f184572612e03f19b72aa3e06cf049eb4ea6958ef45da369e4f2. The underlying v3 is comment 01a1197c-257b-72d3-a98b-0509656b8bf7, SHA256 d9d115040cc34d7dddec7826b1aacc24099c2fcd03f9cc4f010702253fe091de. Both were compared byte-for-byte with canonical CLI readback, including trailing newlines.

    Read the actual INDEPENDENT_SKETCH_V4_SIGNOFF.md and canonical verdict 01a11999-4e97-7f12-b0f4-ba8dede0081f (body SHA256 6c16cbefcb3efe04ce791a82e52c95825aba84e043bfb2da01d9f8a32303c9c7), not merely the readiness notice. Earlier independent A–E and binding decisions, then v4 report refinements 1–6, take precedence over author prose. Within those constraints this addendum supersedes only:

    - V4 “One transport and its executable owner”: “descendants inherit that descriptor” and the following peer/ancestry paragraph as a SUFFICIENT admission rule. Inheritance, a genuine shell/client, cwd, matching tuples and live Git ancestry do not establish input origin. Replace that rule with the sealed domain below; retain peer checks as necessary corroboration.
    - V4 callback identities gain a parent-owned sealed execution-domain join and fixed hook slot, not another caller-reported authentication digest.
    - V4 “5 seconds ... after connection” is replaced with the inclusive deadline below.
    - V4 “newly generated immutable journal generations include [the observation-set digest] before retirement” cannot amend a decided COMMIT chain. Use the immutable decision plus separately appended observations/final receipt below.
    - V4 recovery “terminated/reaped” must use the nonchild-safe quiescence protocol below. V4's universal installed-Git edge-case paragraph is restricted to the explicitly supported profile.

    All unaffected v3/v4 publication, receipt, lock, history, assignment, bootstrap, reservation, source/gap and witness rules remain normative. In particular, no revival of hooks taking home/repo/episode locks, no Step-6-only rebase preparation, no independent duplicate launcher, and no H-minus-B-only coverage. BUG-1808 owns and independently delivers the COMMON substrate FIRST; BUG-1802 later consumes it. No dependency on BUG-1802 contributor, W or START policy is introduced for generic code/team/store operations.

    ## Selected new mechanism: closed execution domain, not descendant trust

    Choose ONE sealed Git execution/configuration boundary, `git_publication::SealedGitDomain`, in the same shared core module as GitPublicationAdapter/PreparedGitStep/CallbackPump/HookClient. This is the new mechanism answering F1, not a relabeling of a missing mechanism as an implementation detail. No protected service, new privileged broker, global ledger, or hostile-same-UID guarantee is proposed.

    The origin argument is exclusion of ALL arbitrary executable producers from the callback-capable domain. Only the pinned Git program can invoke a production hook slot there; the fixed hook wrapper forwards Git's original arguments/stdin without interpreting payload as code. A helper executing that very same wrapper outside this domain remains unauthenticated even with a copied capability. A non-hook helper inside the domain is a boundary failure, never an authorized descendant. There is no permission to accept its observations while investigating the boundary failure.

    The initial normative profile is Linux, upstream Git 2.43.0 behavior, files ref backend, SHA-1 objects. Each deployment must pin exact Git executable bytes/build identity, loader/libraries, shell, HookClient, immutable hook bundle and profile revision, not trust `git --version` text or an arbitrary distro executable with that version. An unvalidated build, reftable, SHA-256 repository, unknown extension or unavailable namespace/process adapter refuses during P0 before lifecycle setup. New Git versions/backends require a separately reviewed profile, not best-effort parsing of new phases. The installed 2.43.0/files ordinary project cases are mandatory positives; this profile does not claim broader portability.

    `seal_git_execution` runs before PENDING/setup/provisional writes. It resolves the complete effective config, includes/includeIf expansion and their contextual conditions, system/global/XDG/common/worktree/command scopes, attributes and object-source identities. It records both ORIGINAL semantics and the normalized execution profile; normalization must never silently discard requested effects. It checks current files/conditions again at begin/P2 and before every continued attempt. A changed effective input replans privately or refuses before shared mutation. During an attempt Git cannot see a newly changed config: a private mount namespace presents sealed read-only config/attributes/hook/runtime files, with a fresh private construction gitdir or the exact journal-authorized live ref gitdir. Live publication overlays its config/config.worktree/info-attributes inputs read-only without changing their actual disk bytes. Mounts, namespaces and staging belong to the attempt; no namespace escape or host-path fallback is permitted. A pinned private runtime PATH/exec-path contains only the admitted runtime, never the worktree, HOME bin or caller PATH.

    The config builder emits a closed schema, not `git -c` overrides on top of unknown live configuration. System/global config and include processing are absent inside the domain. Repository/worktree config is replaced by the generated snapshot. Only layout/object format, identity/time, explicitly selected builtin diff/merge/rename/whitespace/EOL behavior, exact core.hooksPath, and profile control values are emitted. The builder rejects an unclassified effective input which could change the command's execution/effects; harmless UI fields are recorded as inapplicable, not forwarded. Explicitly fixed controls include no fsmonitor command/daemon, no pager/external diff/textconv, no filter commands/processes, no custom merge driver, no commit/tag signing, no automatic gc/maintenance, no notes-rewrite command, no recursive submodules, no auto-stash inside Git, and no lazy network/promisor fetch. Objects and alternates are copied into a verified complete private closure; grafts/replacement refs/shallow or missing objects are not silently consulted. The parent journals any supported stash semantics itself as v4 requires.

    Clear the inherited environment and construct a finite map: private HOME/XDG/TMP, runtime PATH, locale/timezone, fixed author/committer identity/dates, explicit gitdir/worktree/index/object paths and the exact prepared operation locators. No inherited GIT_CONFIG_* injection, GIT_EXEC_PATH, GIT_EXTERNAL_DIFF, GIT_SSH*, editor/pager/askpass, credential, trace-to-command, LD_*/loader injection, BASH_ENV/ENV, shell exported functions or language startup variables. Shell uses noninteractive no-startup-file invocation. Original AIDA policy settings are parsed into the immutable gate context, never interpreted as environment authentication. No bypass flag becomes enabled as part of normalization. URLs, filenames, messages and ref values are typed data; never interpolated into `sh -c` text.

    Attributes are resolved for the complete input/source DAG and all affected paths, including info/global attributes, macros and per-directory .gitattributes. External conversion is materialized as described below. The domain's highest-precedence info attributes suppress external filter selection; original attribute bytes/meaning are retained separately. Only builtin text/binary/union merge behavior is admitted, with external-driver and renormalization-dependent configurations refused before setup. Builtin EOL/encoding conversion, mode/symlink handling and literal path quoting remain explicit in the profile and prepared manifests. A source/config/attributes change on continuation requires new private preparation, never reuse of a prior seal. New output paths are checked against the effect manifest; they cannot introduce executable config or hook code into the domain.

    Allowed top-level commands are typed constructors, not a user-supplied argv tail: ordinary `commit` over the prepared index/message (including explicit amend), merge-backend noninteractive `rebase --onto <OID> <OID>` and its retained continue/abort/skip forms, bounded cherry-pick of enumerated OIDs, builtin ort merge of enumerated OIDs, and `update-ref --stdin` with explicit start/prepare/commit and expected-old tuples. Private checkout/reset/read-tree/update-index/write-tree/hash-object stages are separate typed steps with enumerated file/index effects. No alias, `git hook run`, external subcommand, `!` command, `--exec`, interactive todo exec/reword/edit command, alternate strategy executable, arbitrary `-c`, caller hooksPath, --no-verify or --no-post-rewrite is admitted. Conflict continuation remains supported: exit the current attempt, edit privately without credentials, re-prepare message/index, then start a fresh sealed `rebase --continue` attempt against retained sequencer state. Noninteractive rebase todo is parent-validated pick/drop-only, including Git's recorded stopped/conflict state; changes to its commands are not accepted on trust.

    Inside the domain the ONLY external exec images are the pinned Git executable (its builtin internal commit/update-ref/checkout/reset/read-tree/update-index/write-tree/hash-object/diff/status/rev-parse commands with profile-controlled arguments), the pinned shell executing a named immutable production hook wrapper, and the pinned HookClient. Nested Git is permitted only as Git's implementation of an admitted typed command; hooks/client never launch nested Git. No nested `git hook`, arbitrary subcommand or shell command is permitted. Automatic maintenance, notes and apply-backend rebase are excluded, so their helper commands are not admitted. The source-profile child graph is finite and enforced by the runtime's closed executable filesystem and normalized input grammar. If implementation finds a required reachable child outside this exact graph, it must name the concrete command and revise this sketch; it cannot add “trusted Git descendant” as a catchall. Runtime confinement prevents writable files from becoming executable inputs; read-only config/runtime mounts cannot be replaced by Git or a hook. Unknown pre-existing hook composition or executable commit-config refuses before setup.

    The production bundle implements pre-commit, pre-rebase, prepare-commit-msg, commit-msg, reference-transaction, post-commit, post-rewrite, post-checkout, post-merge and pre-merge-commit where applicable. Each slot has its own immutable fixed-kind shell wrapper, doing only builtin argument handling and `exec <pinned HookClient> <literal-slot> ...` with original stdin. It neither evaluates/source-loads repository files nor calls another hook. HookClient's callback entry is before ordinary AIDA discovery and cannot execute general CLI commands, Git, cargo, make, a shell or Storage. Existing hook logic is extracted to the owner preparation/pure gate routines below; those routines and wrapper dispatch are the production bundle, not a test-only replacement. Missing/changed slot or integrity receipt refuses; all-hooks-off is never a profile.

    The capability descriptor is created ONLY after arbitrary preparation and all its descendants have terminated and their outputs have been copied/sealed into a fresh domain. It is narrowly inherited by this domain's bound Git bootstrap, internal Git processes and hook/client chain; all other descriptors are closed, and no grant secrets are passed. HookClient closes the capability after establishing its channel and has no subprocess path. External preparation, vendor, network and generator children never receive it. An accidentally copied live descriptor is insufficient: admission also requires the exact registered domain/namespace and process-start join, closed profile and expected hook slot/phase. Peer ancestry remains corroboration of membership, not evidence that an arbitrary descendant is a hook. Domain shutdown destroys its credentials; retries/recovery create new credentials. This is a concrete restriction on where the v4 inherited capability can exist, not environment-only authentication.

    ## External preparation and production effects stay real

    External execution is outside callback-capable Git and outside the held local publication guard. It runs with no callback credential, no writable live repository/home mount and no ambient authority; the parent copies input bytes into a disposable preparation sandbox, then validates all produced effects and quiesces it before sealing. Preparation's output is data, never callback evidence. Preparation helpers cannot write retained observations, COMMIT, grants or FINAL, even if they run the genuine client/script. The parent's exact output import includes bytes, modes, absence, index entries, message, object OIDs, warnings and applicability; undeclared effects or dependence on a live mutable outside path cause explicit refusal. Private preparation cannot report shared publication success.

    - Ordinary clean/smudge and process filters are supported through credential-free private Git staging/checkout using the ORIGINAL pinned filter/attribute configuration. Retain exact canonical blob/index results and smudged worktree outputs separately. Commit consumes the already converted index; rebase merges canonical blobs with builtin drivers in its sealed private checkout. After private rebase finishes and its callback domain is shut down/quiescent, an independent credential-free materialization pass applies original checkout conversions to the exact result tree; it cannot change the commit objects or supply rewrite evidence. Conflict edits go through original clean conversion before resuming. All outputs/readsets are compared before shared install. Stateful conversions needing writes outside declared private scratch, delay protocols not completed within the budget, and external merge drivers/merge.renormalize combinations have explicit P0 unsupported refusal, not a silently unfiltered commit.
    - Ordinary message editors run privately before the final seal, with prepared message/template and logical context; exact returned bytes plus requested cleanup are sealed. Callback-capable commit gets an exact message file and verbatim cleanup, with no live editor. Git's internal conflict continuation receives the prepared message without spawning an editor. Interactive sequence editing/exec and an editor requiring arbitrary live repository mutations are unsupported before setup. Ordinary edit-the-message behavior is a required positive, not prohibited as “external execution.”
    - Commit signing by gpg/ssh/x509, arbitrary external merge drivers and arbitrary user-composed hook executables are NOT supported by this initial profile. Detect an effective/requested signing or driver/hook requirement at P0 and name it in the refusal; never silently turn it off. These are concrete compatibility limits, not successful test cases. No earlier required ordinary unsigned commit, builtin rebase/conflict, known dirty auto-stash, code/team/store or installed AIDA hook positive may be refused by this limit. If an acceptance fixture requires signing/custom drivers/custom hooks beyond that inventory, that exact positive remains an unresolved adapter blocker and must return to the advisor; it is not waived here.
    - Credential/SSH/network helpers run only in separate private fetch/preparation or later push operations without callback credentials. Exact fetched remote/project/ref/OIDs and complete objects are sealed before begin. Push and installed pre-push `aida remote mirror-push` run after local FINAL/receipt and outside the local home publication guard; retain remote-confirmed mirror rules, warning/dry-run behavior, and no rollback of local committed history after push rejection. They cannot contribute local Git callback evidence.
    - Submodule gitlinks are pinned data. Required PR private submodule materialization fetches/checks out exact recorded OIDs separately without callback credentials, inventories nested roots/outputs, then seals those directories. No recursive submodule Git runs inside callback-capable Git. Dirty nested submodule mutation, an unpinned update or custom update command refuses before setup. Ordinary clean exact-OID submodule preparation is retained.
    - `aida-store-pair.sh` prepare-commit-msg behavior is not omitted: resolve logical code-root to the canonical store snapshot under the existing read-set protocol, retain exact store HEAD/object and absence/skip disposition, source-kind and existing-trailer rules. Apply trailer preparation before the editor, then seal FINAL cleaned message bytes and store snapshot. The owner supplies those exact final bytes in the private message file before release. The actual prepare-commit-msg callback validates Git's message/source arguments and final bytes against that retained recipe (including its already-present-trailer idempotence); it stages evidence only, never writes the file. Commit-msg checks the same final bytes. Bind final message AND tree/parents/store snapshot in GateReceipt and object acceptance. Never run a live `git -C store rev-parse` from the hook or bless a pre-trailer message.
    - Formatter preparation preserves cargo-fmt check/apply success and warning behavior, staged-path restaging and ALL touched staged/unstaged/untracked bytes/modes, not just `staged_rs`. Gate evaluation follows final formatting/conversion. Include ignored-new-file, staged-doc-provenance and the installed glyph-lint rule, advisor-code, locking, scope, store bulk-write and message gates. Shell `.aida/commit-config` is parsed only as the supported literal policy settings; executable shell content is a named P0 refusal. Existing warn/enforce/applicability distinctions remain; no missing binary silently becomes valid authority proof.
    - Skill-sync post-checkout/post-merge/post-rewrite semantics include the actual `make --no-print-directory sync-agent-skills` -> `cargo run -q -p aida-core --example agent_skill_pack -- sync` chain. In private preparation, map physical checkout to logical main/linked-worktree applicability. Preserve linked-worktree skip, missing-example warning and generation-failure warning. Capture generated .agents/skills output and every other generator/build effect, including declared private target/cache scratch; only manifest-approved outputs are journaled for live install, build scratch is disposable. A generator requiring unconfined live writes is a concrete refusal, not arbitrary pump work. Applicable successful regeneration and warning cases remain mandatory positives. Actual post hook only stages its authentic event and checks the already prepared disposition; preparation output alone cannot claim that hook ran.

    ## Actual callback kind/input and admission

    PreparedGitStep retains its v4 owner/publication OR work-operation, repo_key/actual gitdir/logical root, step/attempt, journal/decision, actor or SERVICE class, exact ref/old/new/objects/effects, gate receipts, budgets and deadline. Add the parent-owned sealed-domain identity, config/attributes/runtime/bundle identities, allowed slot schedule and OS process bindings. Store this durably before release. A client cannot nominate another owner, operation class, domain, ref set or kind.

    Admission requires ALL: the current owner is servicing this exact step; peer credentials/start/namespace and live bound Git ancestry match its sealed domain; pinned wrapper/client bytes and fixed slot match; the step's state machine expects that slot; payload grammar and exact object/ref/phase joins validate. Direct HookClient requests without the fixed slot chain refuse. With the wrapper using exec, the shell image may already be gone: the retained closed-profile proof of Git's sole allowed slot invocation plus the resulting PID/start/client join is required; do not pretend a post-exec /proc lookup observed a vanished shell. This inference is invalid outside the closed domain. A caller's claimed `kind`, executable digest or capability cannot supply any of these parent-owned facts. Domain eligibility is checked before parsing payload into an accepted observation.

    For reference-transaction the input origin is the admitted Git program's ref transaction hook call: actual phase argument and full raw stdin tuple stream passed unchanged through the fixed wrapper. For post-rewrite it is Git's actual command argument and complete old/new map stream. For pre-rebase it is Git's exact upstream/branch arguments; for pre/post-commit there is no Git-supplied commit tuple on stdin—record the authentic slot occurrence and independently decode the sealed private index/result objects. For prepare-commit-msg/commit-msg it is the real Git-provided message-file path/source arguments plus the owner-validated exact file; path must resolve inside the declared private message effect. Post-checkout's old/new/flag and post-merge's squash argument remain their actual Git inputs. Never describe parent-derived tree/OIDs or staged generator results as hook-supplied stdin.

    The closed graph is essential to this inference: no filter/helper/editor/custom hook exists in that domain to call the fixed wrapper with fabricated bytes. All other graph inputs capable of selecting an executable are sealed data or refused. If that premise cannot be established for an attempt, accept zero callback evidence from it. Correct cwd, parent PID, executable and expected-shaped input alone do not repair it. This explicitly excludes the F1 exec-into-genuine-shell counterexample instead of declaring the helper trustworthy.

    For 2.43.0/files the admitted ref phases are prepared, committed and aborted. Preserve raw-zero old separately from effective expected old: zero may mean unconstrained, not proven creation. Shared updates require explicit expected-old CAS; private unconstrained transitions are interpreted only against the sealed exclusive starting-ref map. A transaction binds once to the COMPLETE tuple set, full ref names and OIDs, symbolic referents/HEAD identity, object grammar and per-step sequence before prepared ACK. Committed/aborted must match it exactly; mixed typed effects require separate authorization for every tuple. Prepared rejection need not produce aborted; dead/quiescent Git plus exact unchanged effects can prove abort. Allowed prepared without committed cannot prove commit. Symbolic HEAD/admin changes in this profile have owner-journaled before/after verification, not invented ref callbacks. A `preparing` phase or symbolic-ref wire payload from a newer Git protocol is rejected as profile mismatch, never ignored/interpreted as OIDs. A later profile must explicitly implement preparing ordering, symbolic target grammar/CAS and abort variants before use.

    Parent writes bounded immutable attachment + fsync/rename/directory-fsync BEFORE ACK. Ref authorization is not an observation of completion. Post-rewrite requires all numbered frames and terminal count/digest; duplicates are idempotent only when identical and in the same bound attempt. A stale/foreign/partial/conflicting stream remains non-evidence. Hooks only stage evidence; only the parent under ordered guards may decide COMMIT or publish FINAL/accepted head.

    ## Decision immutability, finite pump and dead-publisher recovery

    COMMIT freezes the generation chain, effect/write-set digest, gate receipts, allowed step/domain profiles and bounded observation namespaces/attempt policy. Predecision observations already known can be referenced there. Later ref callbacks, install verifications and activation observations append in separately named bounded namespaces chained to the immutable decision; they cannot change COMMIT, expand effects or retroactively alter its hash. Final retained receipt binds COMMIT plus the complete validated observation/install/activation set and its disposition. A receipt is not a rewritten decision. The decision declares a finite attempt-ID allocation range and aggregate budget (default eight recovery attempts, with a larger finite plan permitted before decision); exhaustion blocks recovery rather than silently extending authorization. A recovery attempt may append fresh process/credential identity only within the original exact remaining effects/profile/budget authorization; it cannot authorize another ref or regenerate a different commit.

    Keep v4's lock-free parent pump. One monotonic deadline is set BEFORE Git/bootstrap release: default local step 120 seconds, including connect, authentication, partial-frame reads, ACK writes, Git stdout/stderr draining, object decoding, fsync completion, termination and shutdown. Five-second callback exchange budget starts before connection and is capped by the remaining step budget; frame 1 MiB, transaction 4096 tuples, aggregate attachments 64 MiB unless planning selects larger finite limits below a hard ceiling. Reserve the last 10 seconds of the step for TERM/KILL/quiescence; stop accepting work at that cutoff. Output buffers and decoded object sizes/counts have explicit finite limits in PreparedGitStep. Poll callbacks and output concurrently; partial frames or a full stderr pipe cannot starve an active hook. Object decoding uses bounded in-process readers or credential-free bounded read-only workers over sealed objects, never a Git command which can execute helpers. No blocking status/wait, new home/repo/episode acquisition or ordinary AIDA discovery occurs while Git locks are held. A watchdog cannot guarantee a failed kernel/device returns; such a failure retains a blocking journal, not false finite successful cleanup.

    Each attempt is placed before release in its own tracked process containment group (Linux cgroup v2 plus boot/start identities and pidfds for bound processes); lack of an available configured containment adapter refuses before setup. This is local process containment, not authority delegation or a privileged broker. Persist its exact identity in the journal. Recovery owns home first, validates coordinator/root/decision and proves the old execution domain quiescent BEFORE any ref-lock cleanup or writes. For a dead publisher's nonchild Git, reopen an OS handle with boot/start verification, use pidfd poll/signal plus containment membership/empty proof, and never assume waitpid can reap it. Freeze/terminate the owned group as needed within the bounded recovery attempt; do not kill reused PIDs or peers. If membership/death/quiescence cannot be proved, recovery stays blocked. No lockfile is deleted on PID absence alone.

    Recovery then creates a fresh sealed domain/step/socket/capability using the SAME pinned contract and retained exact effects, not inherited dead credentials. PREPARED restores exact current-locked preimages/history as v3/v4 require. COMMIT rolls forward only decided effects. SERVICE already-installed verification can finish installation accounting, but is labeled owner verification, never a fabricated prepared/committed/post-rewrite observation. It cannot satisfy missing WORK observations or publish a WORK FINAL. Complete authentic durable WORK observations may support parent recovery finalization; missing real committed/rewrite observations stay PENDING/GAP. No helper, successful Git exit, current tree or SERVICE receipt can manufacture them. Failed restoration/quiescence is incomplete recovery, not a no-residue refusal. No vendor auto-release/respawn, home release over provisional files or new authority grant is allowed.

    ## Mandatory witnesses and ownership

    Add proposed `git_callback_descendant_cannot_forge_observation` to BOTH existing publication-lock suites. All cases use real wrapped commit/rebase, actual queue/rework P4 and dead-publisher recovery entrypoints, production hook bundle, temporary repositories and fake HOME/vendor/forge. No helper-only acceptance test and no claimed pass in this document.

    Configure a non-hook clean/process filter or other helper which execs the genuine HookClient AND genuine pinned shell wrapper with fabricated prepared/committed/rewrite stdin while the true callback is withheld. Cover correct logical repo/cwd, live Git parent/start ancestry, shell exec preserving PID, a live copied/inherited descriptor/capability, and exact expected-shaped tuples/maps. In the supported private-preparation case execute the attack under real Git; even a fixture-injected live attempt capability must fail because it is not the sealed callback domain. In the callback-capable case attempt to put that configuration into the sealed domain before release and change it after planning: configuration admission must refuse before setup/shared mutation, or the immutable overlay must keep it out. Do not deliberately launch an arbitrary helper in an admitted domain and then claim that ancestry authenticates it. The negative may be a proved before-write refusal for that unsupported execution configuration; if the helper actually executes there, the boundary test fails regardless of later FINAL refusal.

    Withhold real committed/map-end events, send partial streams, fill stdout/stderr, stop a client before connect/ACK and kill original publisher before/after prepared permission and COMMIT. Assert zero accepted forged evidence and no WORK FINAL; SERVICE recovery accounting is not mislabeled callback evidence. Trigger recovery from repo B/outside the project, including old Git reparented to a nonchild, fresh credentials, stale descriptor replay and PID reuse. Genuine wrapped callbacks must succeed in the paired ordinary unsigned commit, builtin rebase/conflict/continue, dirty auto-stash, P4 and recovery cases. Include ordinary clean/smudge/process filters, message editor, store trailer/final message, formatter full restaging effects, skill-sync applicable/skip/warn cases and pre-push mirror outside guard. Assert named P0 refusal for signing/custom drivers/executable hook config without stripping requested behavior.

    Preserve `bug_1808_publication_git_hooks_do_not_reenter_home`, `work_operation_hook_publication_lock_order`, all v3 cross-repo recovery/history/peer/no-residue/permanent-sidecar/first-action bootstrap/crash witnesses and v4 accepted-default witnesses. BUG-1808's real ordinary code/team/store positives use generic PreparedGitStep/publication completion, with no BUG-1802 contributor/W/START prerequisite. BUG-1802 later adds its independent work-evidence assertions to this same test substrate, not a second launcher.

    Implementation seams: new shared SealedGitDomain/config+attribute planner and runtime/process profile inside git_publication; existing proposed GitPublicationAdapter/CallbackPump/HookClient and early internal callback dispatch; commit.rs::run_git_commit, pr_cmd::pr_rebase_handler, cascade/finish/rebase adapters; git_ops/git_backend/team staged publishers; production hook templates/scaffolding plus pure preparation/gate extraction. The source grounding includes actual installed prepare-commit-msg, commit-msg (currently sources shell config), skill-sync make/cargo chain, formatter/glyph gate and pre-push. Git 2.43 hook dispatch and protocol were read in upstream [hook.c](https://raw.githubusercontent.com/git/git/v2.43.0/hook.c) and [githooks documentation](https://raw.githubusercontent.com/git/git/v2.43.0/Documentation/githooks.txt); they describe Git behavior, not an existing AIDA seal.

    V4 binding refinements 1–5 are explicitly embodied above: version/backend protocol; all production effects; immutable decision versus later observations; finite IO/quiescence; substrate independence. Refinement 6 is retained in the short BUG-1802 consumer addendum: complete forge pagination, authoritative empty versus unavailable, and reopen/hold/open-episode revalidation. Accepted-default coverage is not redesigned. Unknown required positive compatibility or an unclosed executable child graph is a concrete design blocker for the fresh DIFFERENT advisor, never an accepted “binding detail.” No author signoff, implementation authorization, status/relationship/queue/grant/hold change or merge is supplied.
