    ## Containment adapter: actual executable joins, not bwrap PID guesses

    Inspection of upstream [bubblewrap v0.9.0 source](https://raw.githubusercontent.com/containers/bubblewrap/v0.9.0/bubblewrap.c) shows a monitor outside the mount namespace, namespace setup before credential drop, optional PID-init fork, and final execvp. Ordinary inherited FDs reach its exec child; monitor/init closes extras. `--die-with-parent` alone arms prctl without a post-arm parent identity check. Installed package is 0.9.0-1ubuntu0.3. Downloaded upstream source is a mechanism reference, NOT proof that the patched distro binary has identical bytes/semantics.

    Do NOT invent a stock `--preserve-fds`/`--exec-fd` flag or say stock bwrap calls execveat. Bounded engineering remedy proposed here: a locally bundled, separately audited non-setuid `BwrapFdAdapter`, derived from the exact source corresponding to the selected distro/upstream profile, with a narrow internal descriptor-exec entry replacing only the terminal `execvp` edge and enforcing FD/lifetime checks. Future affected upstream symbols are argument parsing/main final exec block, `handle_die_with_parent`, monitor FD close list and optional init selection. New internal `--aida-exec-fd <N>` is explicitly PROPOSED, not an existing command. It calls `execveat(S_image_fd, "", ..., AT_EMPTY_PATH)` for the sealed native S. Its allowed descriptor manifest comes from the common sealed I description; no new grant schema/transport. Pin full source/build/binary digest before admitting a profile. Do not replace `/usr/bin/bwrap`, install a global hook, use setuid/cap binaries, or authorize deployment in this sketch. Stock bwrap remains unavailable for managed release until this remedy is accepted, implemented and witnessed.

    This is a bounded adapter-build decision CONT-1 for the different advisor: accept the private descriptor-exec bundle, or commission a separately reviewed equivalent descriptor-preserving namespace entry. The current stock wrapper cannot satisfy the exact signed execveat helper requirement by prose; refusing all containment is still not acceptance. No suggested private bundle is a protected broker: same UID, per invocation, no ambient grants, no privileged service or new host permissions.

