    | `bug1808_adapter_replay_cancel_lost_ack` | Duplicate READY/release, wrong sequence/channel/attempt, partial/truncated frame and original sender death; cancel before send, send/cancel race, lost ACK and EOF. Exactly one or conservatively possible execution, retained C/intent, no automatic retry. Only returned same-PID ETXTBSY retries. |
    | `bug1808_adapter_interrupted_publication_recovery` | Fault each file fsync/rename/dir-fsync for journal/seat/C/receipt/history/locator; recovery in another repo/process, nonchild orphan and dead namespace. No release on fault; PREPARED exact restoration, valid C roll-forward, ambiguous evidence blocked; recovery never sends vendor release. |
    | `task1607_adapter_real_pty_result_and_signal_ownership` | Actual App/PtyHost route persists tab success only from retained committed launch; resize/input correct. Suspend/resume/drop uses authenticated owner channel/owned handles for intended session; remove current guessed group/PID fallback. Foreign/reused PID untouched. Explicit setup-only then revoked activation preserves setup. |

    For every row capture before/at-barrier/after: canonical full objects/history + store HEAD; code refs/reflogs/index/FETCH_HEAD/worktree admin/dirs; queue order/metadata/calibration; grants/manifests/registries/retained C/receipts; seat holder/generation/children/requests/demotion/outbox; run token/member snapshot/phase/attempt; review/punt/hold/signal files; home locator/journal/private cleanup; permanent lock inode identities; all owned/peer process identities/parent/TID/namespace/mount/credential facts; actual open FD inventory before helper/READY/native exec/error/recovery; peer data and absence of vendor sentinel where required. Capture native /proc/exe image or first-action descriptor digest, not path-stat assertions. No terminal/control/image/error/lock/namespace FD leaks to V beyond explicitly planned stdio/terminal descriptors.

    Installed Codex contract stays exact: translate audited Node wrapper, do not execute Node; resolve pinned package/fallback without JS, preserve argv/cwd/stdio, package root, manager detection/clear-four-set-one flags, SIGINT/SIGTERM/SIGHUP forwarding and exit/signal result without duplicate terminal signals. Metadata replacement after preparation cannot re-resolve the leaf. Unknown wrapper/required resource behavior is a named missing adapter, not “all JS unsupported” completion. Native Claude and native Codex remain required positives under the signed loader boundary.

    Retain all original common v3/v4/v5, launch-v2, TASK-1337/TASK-1603 and C7 matrices, production hooks/cross-repo recovery and later guard-removal/restoration nonvacuity. These named tests are PROPOSED, NONE RUN. No helpers, source reading or hash receipts count as acceptance passes.

    ## Requested independent disposition

    A DIFFERENT fresh advisor must inspect the actual process/FD/credential mechanisms and explicitly dispose PANE-1, CONT-1, CONT-3 and any deployment-specific CONT-2/adopter limitation. Bounded remedies are concrete above; an unsatisfied required positive remains an open gate, never full acceptance by refusal. Review common BUG-1808 first, then exact-hash TASK-1607 consumer; BUG-1802 later. TASK-1612 continues only its already approved non-release scope. Author readiness supplies no broader code authorization, production deployment, status/queue/hold clearance or merge.
