    - Legacy speculative commits from earlier binaries remain indistinguishable from ordinary local history.
    - U-1..U-4 and F-1's BLOCKED rows are open by design. The hijack stale-positive window (peer re-acquires remotely but not locally) remains advisory.
    - P costs about the size of the store history, once per store.
    - No production slice is dispatched. All eight gates remain OPEN.


