    ## 6. Two linearization points and fresh authority

    - The **remote linearization point** is origin's ref transaction for `refs/heads/<branch>`, checked against the advertised old value (in the normal case R or B's remote ancestor). It decides the CONTENT of shared coordination records. Git applies at most one of several fast-forward candidates built on the same advertised value.
    - The **local linearization point** is the S6 install under STORE. Once the common publisher exists, an enlisted family's install becomes a v4 store-pull service publication with its own PREPARED, P4 and COMMIT. It decides what LOCAL readers see.

    These two points are never merged. No distributed transaction, authority freeze or new schema joins them. Two rules follow from that:

    (a) A local P4/C never asserts that remote state exists. Only an `Accepted` observation of a tip that contains the attempt does.

    (b) Remote acceptance never asserts local AIDA authority. Coordination records (claims, nodes, blocks, aliases, ledgers) are NOT authority in the BUG-1808 sense; seat_authority reads only grants and the roster ceiling. The one authority-bearing family is roster. Its writer authority is the interactive TTY human (`team_cmd.rs` `require_direct_tty` before every `*_cas`), which is invocation-scoped, never revocable, and present through the whole command. So the sample taken at S0 is still the valid writer authority when the remote accepts. The roster CONTENT then becomes local authority (`roster_allows`) only at the S6 install, where every later grant or P4 samples it home-first.

    "Fresh local sample, then unlock" is therefore never used as authority at the moment of remote acceptance. Any AIDA authority that a C result feeds is sampled again at the consumer's own P4. Where that consumer's strict refusal cannot coexist with a remote effect taken before P4, the join is unresolved (F-1).

