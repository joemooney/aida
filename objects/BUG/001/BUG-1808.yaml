    ## Finding-by-finding

    1. **Push outcome.** A decoder pinned to Git 2.43.0, grounded in the actual `transport.c` mapping. `[remote failure]` and a missing status line (which includes a pre-push hook failure) are classed INDETERMINATE. Candidate lineage spans attempts. The resolution vocabulary is ACCEPTED, NOT_IN_OBSERVED_TIP, PENDING_POSSIBLE or REWOUND; it never says "never accepted". ABA is limited explicitly, and no unresolved candidate is ever installed.
    2. **Object lifetime and hook context.** An owner-private object repo P pins L/R/B/C from capture onward. In the shared store, a ref-less `index-pack --keep=<op>` pack pins C's transport closure; this is grounded in the local Git 2.43 manuals. No `refs/aida` ref is used, because `git log --all` readers would see it. While an admission is open, compaction refuses. The push runs from the canonical store worktree with an exact `EndpointProfile` and `PrePushProfile`, re-resolved before every network spawn. The identity gate's `git log` in the discovered `project_root` therefore sees the kept C.
    3. **Install validation.** The install is a validated common SERVICE import. The current family record, local same-family successors and all dependent before-images are checked BEFORE any effect, then revalidated at the install boundary. SUPERSEDED and INCOMPLETE produce zero local effects, and the observation horizon is named.
    4. **Pre-send durable admission.** A common SERVICE publication COMMITs before the push. The exact field mapping onto the 6a1733 records is given, and the missing typed codecs and validators are named as REQUIRED rather than presumed. Discovery is through P locator refs, bounded at 64 open per store. Recovery runs only under proven owner quiescence, resolves existing lineage only, and covers deletions, no-ops and ranges.
    5. **HOME and authority.** HOME is mandatory for every local step of every family. TTY is no longer treated as human authority. Four authority surfaces are kept separate per family, and joins U-1..U-4 are stated as unsupported.
    6. **Markers.** Exact owned images and a same-root device/inode revalidation under the peer root's permanent lock. No clock ordering and no nested locks. Crash closure is given, and the marker only notifies; it never overwrites.
    7. **F-1.** The confirmed pre-P4 contradiction is kept, and D-F1a and all product forks are withdrawn. Caller-by-caller outcome:
       - BLOCKED: queue work, agent new, drains.
       - Production join BLOCKED until the entrypoint is classified: `aida do` guided.
       - SUPPORTED, with the existing order and residue preserved and disclosed: session start, worktree add/enter, queue integrate, solo.
       - Not applicable: the MCP tool (text only).
    8. **Gates.** All eight distinct gates are listed. A2 production requires gates 1, 2, 3, 4, 7 and 8, and all are OPEN. TASK-1717 S/L and TASK-1612 PARTIAL are not common acceptance.
    9. **Family closure.** All 16 family rows plus excluded row 17 are carried with predicates, surfaces, install effects, no-origin/unreachable behavior, paired positive/negative cases and guard removals. A state-transition table names an API owner for each transition, and witnesses W1-a through W9 are PROPOSED, none run.

    R-1, R-2 and R-3 are preserved as ruled: remote-first roster; the existing evidence namespace with the protocol now specified; and refusal before mutation when a changing operation has no origin, with ordinary L and absent-target no-op kept.

    ## Still open by design

    - The F-1 BLOCKED rows and U-1..U-4.
    - The typed StoreCas codecs and decoders, which the checkpoint does not provide.
    - Executed verification of the pre-push local-ref field and of receive-pack behavior.
    - All eight production gates.

