title: Preflight child-seat delegation before queue-work mutations
description: 'Validate that the active launcher seat may delegate the routed child role before changing requirement status, queue membership, branch/worktree, lease, or manifest state. A refusal must leave all pre-command state unchanged. Add regression coverage for implementer launching implementer-routed work. Diagnostics must distinguish queue selection from child-role delegation and tell an authorized advisor/product/integrator launcher to use an explicit role selector. Reproduced from qci#BUG-021. Authority-class: requires sketch and independent advisor signoff before implementation; never proxy-merge.'
