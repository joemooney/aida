    ## One common adapter seam; identity is not environment

    O remains the only authorization/publication/issuance owner. S is a minimal trusted creating supervisor, not a seat delegate, child-grant issuer or generic CLI. B is the TASK-1612 waiting bootstrap; the leaf is V in that same process. Add proposed common adapter seam `PreparedLaunchAdapter::prepare_waiting` returning the existing WaitingChild plus a finite adapter observation bundle for existing I/J. `PreparedTerminal`, `PreparedContainment` and `HostProcessJoin` are proposed in-memory types, not separate disk formats. `CommittedDispatch` can be constructed only by common P4 publisher; S cannot create one from text, deserialize a public permit or infer it from READY.

    I binds sealed helper, leaf AND any new trusted supervisor/relay/containment setup image, exact adapter build/profile digest, argv/env/cwd/stdio, source permission/credential policy, namespace/mount plan and live channel identities. J reciprocally binds existing repo/spec UUID, selected seat/kind, actor/grant/parent grant/session, assignment/activation/publication/receipt, outer PID/boot/start/creating TID/start, S and B identities, and run token/member_uuid/phase/phase_attempt_uuid/snapshot membership. Store the host boot/start identity as existing Linux opaque start, plus namespace-qualified mapping in the common owner join, not an alternative seat identity. Never use TMUX, pane number, Node PID, env omission, ancestry alone or a caller-provided numeric PID as the join.

    Use the ONE inherited AF_UNIX SOCK_SEQPACKET transport for adapter control/READY/release evidence. Distinct typed instances/roles of that transport may connect O-S and S-B/O-B; they share the common codec, deadline, sequence/replay and cancellation machinery. Display byte forwarding is terminal I/O, cannot decode launch control and carries no grant or CommittedDispatch. Exactly one release consumption per B, not one per hop. S may relay the immutable owner's exact release on its private B endpoint, authenticate as the recorded creating supervisor, and account its delivery; it cannot alter the digest, deadline or historical authorization.

    ## Pane adapter: tmux is display, not execution authority

    A stock tmux 3.4 pane child calls closefrom(3), then multiple-argument commands use execvp; a single command uses a shell. Passing an FD number in `-e` cannot preserve that FD. Source: [tmux 3.4 spawn.c](https://raw.githubusercontent.com/tmux/tmux/3.4/spawn.c). Installed package metadata here says 3.4-1ubuntu0.1; this is inventory, not an execution witness or distro-source-equivalence claim.

    Bounded proposal: use an invocation-owned private tmux server/socket with config `/dev/null`, fixed environment (especially loader/shell variables), no user/global hook execution, and explicit multi-argument command for a sealed fixed relay. Do not attach authority to a pre-existing long-lived user's tmux server. Run the tmux client/server image from a prepared immutable image with an audited adapter profile; source/profile and actual selected binary digest belong in I. A fresh server startup and relay are private preparation after selected-seat/delegation/branch preflight and before lifecycle publication, and must be fully quiesced/removed on ABORT. Do not run an empty default shell to create the first session: `new-session` receives the same multi-argument relay command as `new-window`. Explicit unset/closed environment excludes config/LD/shell startup injection. No terminal grant exemption is added.

    R may be entered using `/proc/<live-O-host-pid>/fd/<sealed-relay-image-fd>` as the multi-argument executable path. This is a descriptor alias to immutable relay bytes, NOT the vendor/helper launch primitive; no pathname lookup of a mutable installed relay is accepted. O retains the descriptor and identity until R's executable digest is checked. R is a distinct non-authoritative display program, never B; it cannot run a command, open a vendor executable, source rc files, or interpret a control frame. The required bootstrap and vendor still use the signed descriptor execveat primitive. If proc access policy prevents this fixed relay entry, that profile refuses before lifecycle mutation; do not switch to a shell or path-exec vendor. An actual installed private-tmux positive remains required before support is claimed.

