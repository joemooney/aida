    - BUG-1808 v3 shared L1 and P3 bootstrap-spawn/readiness timing: prepare sealed waiting helper/READY outside seat and before provisional installation; L2 actual reciprocal PID binding remains before P4. V3 L2 and discovery lock order gain SEAT after REPO and before STORE/QUEUE; drop lower guards before acquiring seat.
