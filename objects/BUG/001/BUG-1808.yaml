    # 4. Owner, trigger, scope and seams

    **Owner.** The BUG-1808 common Git/publication owner owns preparation, transport, admission, install, settlement and recovery. Each family function remains the semantic decision owner.

    **Trigger.** Any row in §16, reached through the CLI, the public core API, MCP (none is exposed at bf652209) or REST (`set_team_role` stays FORBIDDEN).

    **Out of scope.**
    - TASK-1717 owns only its approved ordinary protective S/L/P scope. Nothing here is borrowed from it, and its proof is never common acceptance.
    - The L inventory (doctor, init, dispenser, compaction), TASK-1332 parent closure and the TASK-1333 B1 profile are out of scope.

    **PROPOSED seams.** All live in a new `aida-core/src/store_cas/` (native, Linux profile identical to v5), inside the common owner:
    - `StoreCasFamily`: one variant per §16 row. Each provides `decide(view: &FamilyView, attempt: &AttemptIdentity) -> FamilyDecision`, where `FamilyDecision = Apply(FamilyEffect) | Adopt(LineageRef) | NoOp(reason) | Refuse(reason)`. `FamilyView` is read from the private B tree only.
    - `OpKey { store_key, domain, subject_digest }` (§10.6). `AttemptIdentity { op_id, attempt k, family, intent_digest, record_stamp_k }`.
