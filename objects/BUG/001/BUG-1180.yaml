spec_id: BUG-1180
agreed_id: BUG-1180
title: aida pr ship watches CI BEFORE releasing the supervised merge-hold, so the red merge-hold-gate (the hold itself) aborts the very tool meant to release it
description: |-
  Hit live 2026-09-17 00:01 releasing TASK-1246 / PR-1880 as the operator's proxy. The drain correctly parked the (execution_mode unset → supervised) spec at its merge: record_merge_supervision_hold stamped the .aida/merge-holds/PR-1880 marker AND synced the aida:merge-hold label (post-CI, per the BUG-1173 fix), so the Layer-2 merge-hold-gate went RED and the PR is BLOCKED — as designed, pending human/advisor release.

  The designed release path is `aida pr ship <n>` (BUG-1167: "an EXPLICIT human/advisor merge — it RELEASES any supervised merge-hold marker before merging"). But pr_ship_handler runs step 2 (watch CI) BEFORE step 3 (where the read_hold → clear_hold + sync_label(false) release lives). Step 2 sees merge-hold-gate = fail, reports "CI failed for PR-1880", and aborts — it never reaches the release. Result: a supervised hold cannot be released by the tool whose job is to release it; the only path is a manual `aida merge-hold clear <pr>` (TASK-161, just shipped — which is how I got through tonight) and THEN a second `pr ship`. Every drive/guided/unset spec parked at merge hits this.

  Root cause: the BUG-1167 client-side release was placed inside the merge step, after the CI watch; Layer 2 (the label → required check) was added alongside, and the ordering interaction was missed. Same family as the BUG-1173 self-shelve (CI-watch has no notion that merge-hold-gate red == "held", not "failed").

  Fix (pick one, prefer the first): (a) in pr_ship_handler, perform the hold release (clear_hold + sync_label(false)) BEFORE the CI watch when a marker exists for the PR, then watch CI (the gate re-runs green on the unlabeled event); (b) teach the pr-ship CI watch to treat merge-hold-gate as non-blocking when a local marker exists (it is about to be released); (c) both. Add a regression test: a PR with a marker + red gate ships (release → gate green → merge). Also make the abort message say "this PR is under a supervised merge-hold — run `aida merge-hold clear <pr>` or let pr ship release it" instead of "CI failed", so the operator isn't misled into debugging CI.
