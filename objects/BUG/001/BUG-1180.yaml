  content: 'Sibling defect seen 01:46 on TASK-1251/PR-1881: the drain''s phase-2 CI-watch (and pr ship''s step-2 watch) treat ANY red check as CI failure, with no notion of REQUIRED vs INFORMATIONAL. PR-1881 had Build(ubuntu)+merge-hold-gate GREEN (the required set) but the TASK-1205 path-filtered Windows/macOS matrix — informational by design — was red on an UNRELATED inherited failure (the #1873 merge_lock Windows test, filed separately). The drain shelved ''ci-red'' and pr ship would have aborted the same way, so a correct PR was blocked by a check that is explicitly non-blocking. Fix alongside this bug: the CI-watch should gate on the branch''s REQUIRED checks (branch-protection required_status_checks) and report informational reds as warnings, not failures. Tonight''s workaround: merge-hold clear + raw gh pr merge + aida pull.'
