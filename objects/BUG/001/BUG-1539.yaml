- id: 01a0c312-6aa6-7ba0-9ef1-9834b3909585
  author: joe
  content: |-
    MECHANISM CORRECTION — the description's account of WHERE the clobber happens is wrong, and the correct one makes the fix much cheaper. Caught by the reviewer seat, who went back to the code because they were the one who handed me the mechanism they had not read. I then verified both sites myself rather than taking it.

    THE TWO FILES ARE WRITTEN BY DIFFERENT CODE AND BEHAVE DIFFERENTLY.

    SPEC-KEYED <SPEC>.json — aida-cli-lib/src/review_verdict.rs, record_verdict(). Verified at lines 496-506: it READS the existing file into a generic serde_json object, mutates known keys and rewrites, so UNKNOWN FIELDS SURVIVE. And review_verdict.rs:501 carries a shipped STORY-1391 block that snapshots the round being replaced into a `rounds` array before overwriting, commented: "a finding that survives a round is evidence about the BRIEF, and nothing could detect it because this function overwrote the prior round in place. Append-only; the current round stays at the top level so every existing reader is untouched."

        The spec-keyed file is NOT single-slot. That half is already fixed.

    PR-KEYED PR-N.json — aida-cli-lib/src/lib.rs, the BUG-802 phase-3 handshake block. Verified at lines 76429-76447: it does NOT read the existing file. It builds `body` from scratch with serde_json::json!{...} and calls std::fs::write. That is a TRUE CLOBBER — prior findings, prior rounds, and any extra field are gone.

    SO THE REMEDY IS NARROW. Make the handshake writer do what record_verdict already does roughly fourteen thousand lines away in the same crate. The read-merge-and-snapshot pattern EXISTS in this codebase; one of the two callers simply does not use it. This is not a new mechanism to design, it is one call site adopting its sibling's shape.

    THE 27 SIDECARS STILL STAND as evidence, and so does the second-form instance with #2042/#2043. What changes is the fix's size and location, not that the gap is real.

    AND STORY-1391 IS A SHARPER JOKE THAN THE ONE ALREADY RECORDED HERE. This spec notes that the branch story-1391-work was reused for unrelated work and that STORY-1391 is "about verdict files being overwritten each round." It is — and it fixed the SPEC-keyed half while leaving the PR-keyed half, which is the half THE ORCHESTRATOR READS. A round-preservation feature that does not cover the file the machinery consumes.

    IMMEDIATE CONSEQUENCE, which is why this could not wait for morning. The hand-carried provenance on PR-2042.json — transferred_from, transfer_note, transferred_by — WILL BE SILENTLY DESTROYED by the next `aida review record ... --pr 2042`, because the handshake writer rebuilds the body from scratch. That is not hypothetical: it is the very next thing that happens when product addresses the two findings and someone re-records. The workaround performed to save the verdict is erased by the next normal use of the tool that made the workaround necessary. I have therefore recorded the transfer durably on the spec itself, where no verdict writer can reach it.

    ACCEPTANCE CRITERIA, replacing the vaguer direction in the description:
      1. The PR-keyed handshake writer reads any existing PR-N.json and preserves unknown top-level fields rather than rebuilding the body from scratch.
      2. It snapshots the round being replaced, as record_verdict does, so a second round does not destroy the first's findings.
      3. A test proves that a field the writer does not know about (transferred_from is the worked example) survives a subsequent `aida review record --pr N`.
      4. The 27 existing sidecar files are folded in or explicitly declared legacy; they must not remain invisible to the phase-3 handshake without a decision saying so.
