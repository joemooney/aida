title: aida edit lacks --description-from-file / --description-stdin (aida add has them), so refining a description forces the shell-expanded inline form
description: 'Observed 2026-09-18: aida add accepts --description-from-file and --description-stdin (the safe forms for multi-line text with backticks or dollar signs), but aida edit only accepts --description, so refining an existing spec''s acceptance (the ''refinements must be acceptance criteria'' discipline) forces --description "$(cat file)", the exact form that wiped a description earlier this week when the producer failed. Fix: add both flags to aida edit with the same semantics and the same mutual-exclusion error; the MCP update_requirement tool already takes a body, no change there. Acceptance: aida edit SPEC --description-from-file F replaces the description; an empty or missing file is refused (not written as an empty description); help text lists all three forms.'
