- id: 01a0de6b-7a92-7ea1-9806-a0ab6d7a0be8
  author: joe
  content: |-
    Review (fresh Opus reviewer): branch claude/bug-1654 @ 01400e7d0b. VERDICT: APPROVE WITH NITS.
    Tests: cargo test -p aida-core --lib fs_atomic x3 in a scratch worktree (CARGO_BUILD_JOBS=3, fake HOME, host load avg 11-16): 11/11 passed each time (0.67s, 12.5s, 16.7s wall; the spread came from host contention, since each test run on its own took <=0.35s). The new bug_1654_* tests use a fake clock and fake sleep with no real sleeping, so they are deterministic and add no flake risk. cargo fmt --check is clean.
    Mutations: (a) removing the deadline check (remaining.is_zero()) makes bug_1654_budget_holds_when_sleeps_overshoot FAIL with 'wall-clock budget exceeded: 9.95s', so it is caught. (b) removing the attempt cap makes bug_1654_accurate_and_frozen_clocks_keep_backoff_semantics FAIL at the accurate-clock sleep-count assert, so it is caught (the frozen-clock sub-case is not reached in that mutant, but the cap is still covered).
    Findings:
    1. Bounded: yes. The deadline is primary and the 200-attempt cap is secondary. If the clock freezes or a sleep returns early, the cap ends the loop. If the clock goes backwards, saturating_duration_since keeps the sleep at <=1 ms and the cap ends the loop. With overshooting sleeps, the loop runs at most one sleep past the deadline. Instant + 200ms cannot realistically overflow.
    2. Error semantics unchanged. The last NotFound/PermissionDenied error is returned as-is, and other kinds still return immediately through the untouched match arm. Nit: no test asserts that another error kind (e.g. reading a directory) returns without retrying. That gap predates this branch.
    3. Injectable clock: read_atomic_with is private, not pub or pub(crate), so the public surface does not grow. Production cost is one Instant::now() per retry plus one at the start, which is negligible. It is not cfg(test)-gated, and that is fine as a private helper.
    4. Unix product cost: NOT a regression. Main waited 200 x 1 ms nominally and had no upper limit under load. This branch waits <= ~200 ms plus one overshoot, which is strictly better. Recommendation (follow-up, not a blocker): gate the NotFound and PermissionDenied retry behind cfg(windows). POSIX rename(2) is atomic, so neither error is transient on Unix, and every Unix read of a genuinely missing file pays ~200 ms for nothing. The exposure is limited because most callers (workspace.rs:83, object_store.rs:177, git_ops.rs:1715) check exists()/is_file() first. Unguarded callers (git_ops.rs:122 exclude file, dispenser.rs:207, node.rs:828, registry.rs:30, stacks.rs:90, session_manifest.rs:140) do pay it when the file is absent. Suggest filing a low-priority follow-up rather than widening this bug fix.
    5. Trace markers: all new markers are // comments. The one remaining /// trace:TASK-346 on read_atomic's doc comment predates this branch (unchanged context). This branch also moves the const's TASK-346 marker from /// to //.
    6. The acceptance criteria are met: (1) a deadline bound, (2) the existing test is kept and an overshoot-injection test is added, (3) the fs_atomic suite is green.
