title: aida queue list --for reviewer returns an implementer row and counts it, so the declared count disagrees with the filter and two careful counts cannot be reconciled
description: |
  `aida queue list --for reviewer` returns a row whose for_role is `implementer`. The declared count includes it, so the command's own header disagrees with its own filter, and two people counting carefully get different right answers.

  MEASURED 2026-09-20 19:17:

      aida queue list --for reviewer
        count: 23                        <- the command's declared count
        queue[23]{id,title,status,for_role}
        rows by for_role:  22 reviewer, 1 implementer

      the leaked row:
        BUG-1420, "The implementer preflight runs CI's guards under a more permissive shell
        than CI does...", in-progress, implementer

  HOW IT SURFACED, which is the argument for fixing it rather than noting it. Two seats triaged the reviewer queue within forty minutes. One counted 22 by filtering rows on the reviewer role; the other counted 23 by trusting the declared count. Both were correct about what they measured and the two numbers could not be reconciled by re-measuring, because each reproduced perfectly. The discrepancy was only resolvable by inspecting for_role per row - which nobody would do, because the command was asked to do exactly that.

  A count that includes rows the filter excludes is worse than a wrong count. A wrong count gets corrected on the next measurement; this one is STABLE, so it survives re-measurement and gets promoted into binding text as verified.

  WHY THE LEAKED ROW IS PLAUSIBLE-LOOKING. BUG-1420 is genuinely in flight and genuinely related to work the reviewer queue holds - PR #2009 is its held PR, and #2042/#2043 carry its commits. So the row does not look like noise to a human scanning the list; it looks like a reviewer entry for a spec the reviewer has been dealing with all evening. That is what let it sit in the output unnoticed.

  Acceptance:
  1. `--for <role>` returns only entries whose for_role matches. If a related-but-different-role entry is deliberately surfaced, it is labelled as such and excluded from the count, or shown in a separate section.
  2. The declared count equals the number of rows the filter admits. A header count that disagrees with the filter is the specific defect here.
  3. Establish WHY the row is admitted before changing the filter. A spec in flight with a held PR may be joined in by design somewhere; if so, that behaviour is the thing to make explicit rather than silently drop.
  4. A test asserts that every row returned under `--for X` has for_role X, and that the declared count matches the row count.

  NOT IN SCOPE: whether a routed entry should exist for a spec at all, which is BUG-1508 and BUG-1512.
