spec_id: BUG-1513
agreed_id: BUG-1513
title: aida queue list --for <role> passes the caller's OWN rows through regardless of role and counts them, so the seat that can see the bug is not the seat qualified to report it
description: |-
  `aida queue list --for reviewer` returns a row whose for_role is `implementer`. The declared count includes it, so the command's own header disagrees with its own filter, and two people counting carefully get different right answers.

  MEASURED 2026-09-20 19:17:

      aida queue list --for reviewer
        count: 23                        <- the command's declared count
        queue[23]{id,title,status,for_role}
        rows by for_role:  22 reviewer, 1 implementer

      the leaked row:
        BUG-1420, "The implementer preflight runs CI's guards under a more permissive shell
        than CI does...", in-progress, implementer

  HOW IT SURFACED, which is the argument for fixing it rather than noting it. Two seats triaged the reviewer queue within forty minutes. One counted 22 by filtering rows on the reviewer role; the other counted 23 by trusting the declared count. Both were correct about what they measured and the two numbers could not be reconciled by re-measuring, because each reproduced perfectly. The discrepancy was only resolvable by inspecting for_role per row - which nobody would do, because the command was asked to do exactly that.

  A count that includes rows the filter excludes is worse than a wrong count. A wrong count gets corrected on the next measurement; this one is STABLE, so it survives re-measurement and gets promoted into binding text as verified.

  WHY THE LEAKED ROW IS PLAUSIBLE-LOOKING. BUG-1420 is genuinely in flight and genuinely related to work the reviewer queue holds - PR #2009 is its held PR, and #2042/#2043 carry its commits. So the row does not look like noise to a human scanning the list; it looks like a reviewer entry for a spec the reviewer has been dealing with all evening. That is what let it sit in the output unnoticed.

  Acceptance:
  1. `--for <role>` returns only entries whose for_role matches. If a related-but-different-role entry is deliberately surfaced, it is labelled as such and excluded from the count, or shown in a separate section.
  2. The declared count equals the number of rows the filter admits. A header count that disagrees with the filter is the specific defect here.
  3. Establish WHY the row is admitted before changing the filter. A spec in flight with a held PR may be joined in by design somewhere; if so, that behaviour is the thing to make explicit rather than silently drop.
  4. A test asserts that every row returned under `--for X` has for_role X, and that the declared count matches the row count.

  NOT IN SCOPE: whether a routed entry should exist for a spec at all, which is BUG-1508 and BUG-1512.


  DIAGNOSIS NARROWED 2026-09-20 19:25, AND IT IS SHARPER THAN "THE FILTER LEAKS". The leaked row is the CALLER'S OWN. Verified by querying the same store under two identities:

      aida queue list --for reviewer --user joe                count: 23   22 reviewer + 1 implementer
      aida queue list --for reviewer --user claude-reviewer-1  count: 22   22 reviewer, 0 others

      The 22 reviewer rows appear under BOTH identities, so they are role-routed. BUG-1420 appears only under joe, and BUG-1420 is in joe's queue. So `--for <role>` filters role-routed rows correctly and passes the CALLER'S OWN rows through regardless of their role. The queue is keyed on the shell's user identity per BUG-89, and the two seats do not share one.

  THE PROPERTY THAT MATTERS MOST: THE SEAT WITH STANDING TO REPORT THIS CANNOT SEE IT. The reviewer seat gets a clean 22 with every row correctly tagged - there is nothing to notice. The only caller who sees the leak is the one who OWNS the leaked row, and to them it does not read as a leak: it is a spec they are already working, in a list they filtered by a role they are not in. So the surface is correct for the person qualified to call it broken, and misleading for the person with every contextual reason to accept it. That is why it survived a night in which two seats audited this exact surface repeatedly.

  AND IT DEFEATS CROSS-SEAT RE-MEASUREMENT, WHICH IS THE STRONGEST CHECK AVAILABLE HERE. Re-measuring from the same seat confirms the wrong number. Re-measuring from a DIFFERENT seat returns a different number, each correct for its caller, with no signal to either that the other would see something else. Two people running the same command against the same store and comparing normally settles a disagreement; here it manufactures one that looks like arithmetic error, and one seat publicly concluded the other had mis-counted.

      THE RULE THIS YIELDS: a count from a filtered surface is comparable between two callers only if the filter's inputs are identical, and CALLER IDENTITY is a silent input to this one. Comparing counts across seats is not a check unless the identity is part of what is compared.

  ADDITIONAL ACCEPTANCE:
  5. Establish whether passing the caller's own rows through a role filter is deliberate. If it is - a convenience so you always see your own work - it must be labelled as a separate section and excluded from the declared count, not merged into the filtered rows.
  6. `aida queue list` prints the RESOLVED user id alongside the count. This is cheap and it generalises past this bug: BUG-89's whole failure mode is two people seeing different queues without knowing it, and an identity printed next to the count collapses that class of confusion into one glance.
