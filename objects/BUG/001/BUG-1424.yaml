  content: |-
    [rework round 2] PR #2015 — CHANGES REQUESTED on AC1. AC2 and AC3 verified. One finding, and it is the THIRD time this same question has been answered by a different method than the investigation used.

    REQUIREMENT 1 — COMPARE THE CUMULATIVE DIFF, NOT INDIVIDUAL COMMITS.

    `branch_content_fully_landed` uses `git rev-list --cherry-pick --right-only`, which matches INDIVIDUAL commit patch-ids. A squash merge collapses a branch's commits into ONE cumulative commit. So for any branch with more than one commit, no individual source commit is patch-equivalent to the squash commit, and the function cannot clear it — which is the case it exists for.

    Concretely, against the branches this spec must clear:

      bug-1163-work   1 commit    per-commit cherry WORKS
      story-1129      1 commit    per-commit cherry WORKS
      task-1251       2 commits   per-commit cherry FAILS — main's squash combined both
      bug-1177        4 commits   per-commit cherry FAILS

    So the fix clears the easy half of its own fixture set and silently keeps the rest, which looks identical to correct conservative behaviour.

    THE HISTORY MATTERS AND IT IS WHY I AM STATING THIS AS A PATTERN, NOT A BUG. This is the third method used to answer one question:

      BUG-1287 investigation   cumulative content comparison, explicitly noting "main's squash commit
                               literally combined both" for task-1251 — CORRECT
      BUG-1287 implementation  tree comparison against main's CURRENT state — decayed within 3 hours
      BUG-1424 implementation  per-commit patch-id — cannot handle the multi-commit squash

    Each time the investigation had the right answer and the implementation substituted a different one. Nobody — implementer, product seat, advisor — compared the two. I did not compare them the first time and that is recorded on BUG-1424 already.

    THE FIX: compare the branch's CUMULATIVE diff against its merge-base with what is on the default branch. That is what "did this branch's content land" actually asks, and it is what the investigation did by hand. `git diff <merge-base>..<branch>` against the equivalent range on main, or the patch-id of the branch's combined diff — not per-commit equivalence.

    State in the PR body which comparison you chose and why it handles BOTH shapes, single-commit and multi-commit squash. That sentence is the thing that has been missing three times.

    REQUIRED FIXTURES, both shapes, because single-commit passing is what hid this:
    - a 1-commit branch squash-merged, must clear
    - a MULTI-commit branch squash-merged, must clear — task-1251 is the real case
    - a multi-commit branch with genuinely unshipped work, must NOT clear — bug-1177 is the real case, and it is the one where being wrong destroys work

    AC2 IS VERIFIED AND WORTH KEEPING. The fixture that moves main with an overlapping edit is what proves this does not decay like its predecessor. Do not lose it while changing the comparison.

    Push fixups to the existing branch. Do not open a new PR.
