title: unified queue pickability policy — Done entries selectable by next/dry-run, NeedsAttention accepted without triage or force
description: 'Field report (2026-09-09; tracked as BUG-032 in the originating project): queue surfaces disagree on what is pickable — ordinary queue data contains Done entries; queue next SELECTS a Done requirement; queue work --dry-run proposes a fresh branch for Done work; dry-run accepts NeedsAttention work without resolved triage or --force. Fix: ONE pickability policy (terminal statuses excluded; Done excluded from fresh pickup — it is awaiting-merge, route to from-pr/integrate instead with that hint; NeedsAttention requires resolved triage or explicit force) shared by queue next, queue list default lens, dry-run, and live pickup — the dry-run must never propose what live pickup would refuse. Acceptance: table-driven test over statuses x surfaces asserting identical pickability; queue next on a Done-headed queue skips with the awaiting-merge hint; dry-run on NeedsAttention refuses without force naming the triage path.'
