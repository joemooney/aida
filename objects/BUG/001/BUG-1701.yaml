- id: 01a0e633-4f20-7453-8748-a4bd3c1dda1c
  author: joe
  content: 'CORRECTION, 2026-09-27 21:08, operator question. I framed AC1-AC3 as needing a NEW detached dispatch lane requiring an architecture sketch and advisor signoff. That was WRONG, and a next seat acting on it would rebuild machinery that already ships. The one-shot lane exists: `aida do <SPEC>` routes a spec to the right harness by its groomed execution mode, and for drain mode that is `aida queue work <SPEC> --auto-complete`, which runs a HEADLESS vendor CLI. Verified in source: session::spawn_claude_headless returns Result<std::process::ExitStatus> (aida-cli-lib/src/session.rs:1059) — it runs the child to completion and returns an exit status, so it exits on its own, and it is vendor-selectable via AIDA_HEADLESS_VENDOR / [orchestrator] headless_vendor. The whole phase-driver, retry, findings and verdict machinery hangs off that path (queue_cmd.rs, real_phase_driver_wiring_tests, headless_hint_tests). `aida autonomy` documents the rungs: headless cron, live solo, zen, and one-shot `aida zen <spec>`. So AC1, AC2 and AC3 as filed are ALREADY SATISFIED by an existing lane, and this spec should not grow a second one. What actually went wrong in the 2026-09-27 burndown is narrower and needs no architecture: the orchestrator reached for `aida agent new` 38 times — the INTERACTIVE lane, which blocks for the child TUI lifetime — because nothing steered it to `aida do` / `queue work --auto-complete`, and because `agent new --help` advertised ITSELF as the one-shot lane that ships a PR and exits. That help text is already fixed (AC4, commit 78d172eb99). Revised remaining scope, all tractable: (1) `aida agent new` should say which lane to use instead when the caller clearly wants one-shot spec work — it already names `queue work --auto-complete`, so consider refusing or warning on `agent new --spec <ID>` for a drain-mode spec and pointing at `aida do <SPEC>`; (2) AC5 stands and is a real defect — `aida agent status` reported three seats `busy` whose threads had been idle 48-88 minutes and which had burned 3-46 SECONDS of CPU across hours, so the busy/idle classifier needs to consider CPU consumed, not just recency; (3) keep AC4. Drop AC1-AC3 as already-satisfied, or restate them as "the docs and the launcher route callers to the existing headless lane". This spec is no longer architecture and no longer needs advisor signoff.'
