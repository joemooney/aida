- id: 01a0e637-d4ef-7680-be6f-b684c5eceb07
  author: joe
  content: 'AC5 partially implemented 2026-09-27 21:15, and here is what I deliberately did NOT do. Implemented: `aida agent status` now has a CPU column showing accumulated CPU seconds per process-backed agent (agent_registry::process_cpu_secs via `ps -o time=`, with a pure parser covering MM:SS, HH:MM:SS and DD-HH:MM:SS, tested). That is the exact signal I used to diagnose the nine stranded seats: 3-46 SECONDS of CPU across 1-6 hours, for rows the STATUS column called `busy`. A caller can now tell a finished seat from a working one without attaching to the PTY. NOT done, on purpose: I did not change classify_status. The root cause of the false `busy` is its second rule — `covers(&ctx.live_lease_worktrees, &entry.worktree_path)` returns Busy whenever ANY live lease covers the agent worktree, and for the main worktree that is always true (123 active leases on this host), so every agent rooted at /home/joe/ai/aida reads `busy` forever regardless of what it is doing. The obvious fix — let low CPU override the lease rule — is unsafe as stated, because CUMULATIVE CPU cannot distinguish "finished its turn" from "blocked on a long cargo build": a build-blocked seat also shows low own-CPU, and flipping it to `idle` would invite an orchestrator to stop a seat that is working. A correct classification fix needs a CPU DELTA between two samples (or descendant-process CPU), which is a behavioural change to a shared classifier and deserves its own slice rather than a hurried edit. Recommend: keep the column, and file the classifier change as a child spec with the delta-sampling design. The lease rule itself should probably be reconsidered — a lease means work is CLAIMED at that path, not that this process is doing it.'
