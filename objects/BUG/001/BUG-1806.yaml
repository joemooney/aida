title: 'Regression: role-enter shell wrapper evaluates failed CLI diagnostics'
description: 'The shell wrapper around `aida role enter <seat>` must evaluate only a successful, explicitly delimited environment-update payload. A denied role request containing backticks currently allows diagnostic text to reach eval, producing command substitution. Acceptance: non-zero CLI exits print diagnostics verbatim and never reach eval; a regression test covers a denied advisor request with backticks; the caller role remains unchanged. Reproduced from qci#BUG-020; verify whether TASK-1171 regressed or stale-wrapper compatibility remains unsafe.'
