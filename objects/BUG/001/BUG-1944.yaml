  content: |-
    REVIEW (night): REQUEST CHANGES at e9ef4c437b (fresh reviewer)
    1. BLOCKER: live_work.rs:187 calls detect_open_pr_for_branch without with_forge_lookup_timeout (lib_part3.rs:4293), so `gh` can run unbounded once per spec branch. A slow forge then hangs `doctor --heal` while it holds the loaded store (doctor_cmd.rs:7299-7359). Wrap the call with a short ceiling so a timeout returns GhUnreachable, which means Keep.
    2. MEDIUM: live_work.rs:83/86. When `git for-each-ref` fails it returns an empty list, which becomes NoLiveWork, and the spec reverts. A git failure must mean Keep.
    3. LOW: pr_cmd.rs:5090 bumps only in `aida pr auto-queue-review`. Move the bump into try_auto_queue_pr_review so the session-end backup (lib_part3.rs:3991) and the orphan sweep (lib_part5.rs:686) bump as well.
    4. LOW: live_work.rs:194 bump_spec_in_progress duplicates bump_spec_in_progress_at_lease_take (lib_part2.rs:4998); reuse one. Also, `mod live_work` breaks alphabetical order at lib.rs:92.
    5. LOW (d): neither new call site has an end-to-end test. Not blocking, but add one if it's cheap.
    Out of scope, noted for STORY-1653: evidence comes only from branches named after the spec, so work on a relay branch under another spec's lease (the TASK-1538 / slice-05 case) is neither bumped nor protected. Relay/driver attribution belongs to STORY-1653.
    Verified: the only automatic InProgress→Approved writer is the doctor heal (doctor_cmd.rs:7346). (c) already handles Approved, and a new test pins that, including the gates. The lib_part4 edits are minimal.
