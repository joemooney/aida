title: 'Specs with live work or a merged PR sit at Approved: session end reverts InProgress, re-dispatch doesn''t re-claim, and merge auto-bump only completes InProgress specs'
description: |-
  Two cases on 2026-10-10 (same class as BUG-549, a newer path):

  1. TASK-1723: PR #2487 squash-merged at c6c0d9c3b2 with the (TASK-1723) trailer, but the spec was never claimed, so it stayed Approved. aida-auto-bump completed STORY-1642/1643 and BUG-1925 at the same time because those were InProgress, and skipped TASK-1723. The advisor completed it by hand.
  2. STORY-1644: claimed at 18:36 (Approved→InProgress). At 18:52 the session ended and the store recorded InProgress→Approved (aida-store bff3fc482c). A later implementer kept working and opened PR #2490 (head story-1644-work) without claiming again. The operator saw a live 'fix is ready' report next to 'Approved' in aida list. The advisor set it back to in-progress at 19:53.

  Effect: the status contradicts live work, and when the PR merges, auto-bump silently skips the spec, so it never completes.

  Expected / acceptance:
  (a) Ending or abandoning a session doesn't move a spec back to Approved while it has an open PR or unmerged commits on its branch.
  (b) Any path that starts work on a spec (worktree add, session start, relay dispatch, the pr create/open path) moves Approved→InProgress.
  (c) Merge-time auto-bump completes an Approved spec whose (SPEC-ID) trailer lands on main, not only InProgress ones. Same gate rules (closure:pending holds still apply).
  (d) A regression test for each of (a)–(c).
