  content: 'LIVE INSTANCE, ON THE PAIR THAT PRODUCED THIS SPEC. PR #2033 is BUG-1480''s fix and is OPEN. BUG-1480 carries an in-spec criterion that it does not close until STORY-1422 is done. When #2033 merges, auto_bump_done_to_completed flips BUG-1480 to Completed - and it reads neither the graph nor the description, so the criterion is never consulted. The repair the advisor and reviewer agreed guards the REVIEW gate (a reviewer refuses at PR time) and not the AUTO-BUMP (which fires at merge time and asks nobody). So this spec''s scenario is not hypothetical and is not only about BlockedBy edges: a PROSE closure criterion is equally invisible to the auto-bump. Worth widening criterion 1''s decision to cover both - whether ANY closure precondition, edge or prose, should gate the merge-driven bump. Routed around today by holding #2033 until STORY-1422''s gate exists, which is three agents remembering an ordering rather than a substrate gate, which is the thing this spec exists to fix.'
