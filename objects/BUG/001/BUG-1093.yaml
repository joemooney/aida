title: aida agent new launches from .git/modules metadata for a submodule instead of the submodule working tree
description: "## Field report (2026-09-11, work machine, rex_mission_gen submodule)\nLaunching a Codex agent from an AIDA-enabled Git SUBMODULE resolves the launch root to the submodule's Git metadata dir (../.git/modules/rex_mission_gen) instead of the submodule working tree. The child starts OUTSIDE the project, discovers the PARENT repo's .codex files, and skips 16 invalid skills.\n\nEnv: AIDA 0.14.0 (b4f163adb+dirty), Codex CLI. Project root intended: /…/rex/rex_mission_gen (a submodule with a `.git` POINTER FILE: `gitdir: ../.git/modules/rex_mission_gen`).\n\nRepro: cd into the submodule; `aida agent new codex` (role product). \nActual: \"launching codex … in /…/rex/.git/modules/rex_mission_gen\" → Codex loads the parent repo's stale skills, \"Skipped loading 16 skill(s) due to invalid SKILL.md\". \nExpected: launch root = the submodule working tree (/…/rex/rex_mission_gen), loading ITS .codex/skills. A submodule with its own .aida/config.toml is an INDEPENDENT AIDA project and must not be collapsed to the superproject root.\n\n## Probable cause\nagent_new_with_config and child_role_project_root call main_worktree_root_from(find_aida_project_root_from(...)). The helper uses `git worktree list --porcelain` and returns its first entry (the enclosing SUPERPROJECT main worktree). Valid for a linked worktree of the SAME project, wrong for a submodule (whose .git pointer resolves into the superproject's .git/modules/…).\n\n## Proposed fix\n1. Preserve an AIDA root discovered from .aida/config.toml when it is a submodule; do NOT call main_worktree_root_from across that project boundary.\n2. Distinguish a linked worktree from a submodule (git --show-superproject-working-tree / --show-toplevel + presence of project-local .aida/config.toml).\n3. Apply the same root rule to role selection, launch-context, agent-registry paths, duplicate checks, and spawned-process current_dir.\n4. Error loudly before launch if a resolved cwd is under .git/.\n\n## Acceptance\n1. From an AIDA submodule, `aida agent new codex --show-context` reports the submodule working tree as launch root and writes context under <submodule>/.aida/agents/context/.\n2. A real launch starts in the submodule root and loads only that root's .codex/skills.\n3. A normal linked worktree retains existing main-worktree behavior.\n4. Regression fixtures for BOTH a linked worktree AND a submodule with its own .aida/config.toml.\n5. A resolved launch cwd inside .git/ is rejected.\n\nWorkaround: launch codex directly from the submodule root (bypasses AIDA launch-context/registry)."
