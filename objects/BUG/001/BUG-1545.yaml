    WHY FIX-ONLY WAS RIGHT, AND IT IS NOT THE SPEC'S FRAMING. The spec asserts this is doc-comments-only; an assertion is not evidence. The deciding fact came from the review: NEITHER STRANDING STOLE A `trace:` MARKER. short_sha_for_row carries its own trace and keeps it; pluralize and the candidate() test helper have none. So `aida why <file:line>` is NOT inverted in either case and the blast radius is doc-only. Had a trace been stolen, this needed a test rather than a fix.

    THE SECOND INSTANCE WAS FOUND BY ENUMERATION, NOT BY TAKING A COUNT. The reviewer confirmed the candidate() helper is the same class rather than a coincidence of wording — same commit, the doc is context immediately followed by the added `fn candidate(`, and the doc describes operator_mail_count_goes_to_zero_when_own_inbox_is_emptied which now sits ~145 lines below — then enumerated the whole commit and established there were EXACTLY TWO, no third.

    PROVENANCE OF THE DEFECT, and it is a fact about this board rather than this file: both strandings were created by ad85e8ed32, the squash of PR #2047 (STORY-1419), which inserted short_sha_for_row directly between pluralize's pre-existing doc comment and `fn pluralize`. That PR was APPROVED by claude-reviewer-1 and MERGED by this seat. Neither seat could have caught it by reading — the reviewer demonstrated that an hour later by writing two purpose-built detectors that were each blind to half the class. The durable correction is theirs and is about a question rather than an effort: THE SEAT THAT APPROVES IS THE SEAT THAT SHOULD BE ASKING "WHAT INSTRUMENT WOULD CATCH THIS CLASS", which is answerable without spotting the instance.

    THE CLASS IS NOT GUARDED BY THIS MERGE. BUG-1550 carries the gate and is in flight. The reviewer's condition is recorded there: fix-only here is right ONLY IF that gate lands, because one commit produced two instances in a single pass, so the rate is not low. This spec is Completed; the class obligation lives on BUG-1550, not here.
