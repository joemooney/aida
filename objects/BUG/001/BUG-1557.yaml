spec_id: BUG-1557
agreed_id: BUG-1557
title: A scaffolded [[schedule.jobs]] example whose command is not in parse_scheduled_command's closed allowlist errors at every tick forever, and nothing checks the two hand-maintained lists against each ot
description: |
  A SCAFFOLDED `[[schedule.jobs]]` EXAMPLE WHOSE `command` IS NOT IN THE ALLOWLIST IS DEAD ON ARRIVAL - IT ERRORS AT EVERY TICK, FOREVER, WHILE SITTING IN CONFIG LOOKING LIKE A GUARD. NOTHING CHECKS THE TWO LISTS AGAINST EACH OTHER.

  Found by claude-product-1 2026-09-21 while closing STORY-1422's criterion 4, and verified independently by the advisor against the tree at 8bc2512480. It is filed here as the GENERAL form; the specific instance was fixed in PR #2049.

  THE TWO LISTS THAT MUST AGREE AND ARE MAINTAINED SEPARATELY:

    1. `parse_scheduled_command` (aida-cli-lib/src/maintenance_schedule.rs:1511) is a CLOSED
       match over literal strings - "cache verify", "session reap", "queue gc",
       "notify check", "doctor", "fetch --code-only", "store compact"|"store gc" - with a
       `_ => anyhow::bail!("unknown scheduled task command ...")` arm.
    2. The scaffolded config template (aida-cli-lib/src/init_cmd.rs, around :2224-2248) ships
       commented `[[schedule.jobs]]` examples, each with a `command = "..."` string.

  Nothing compares them. Today's five scaffolded examples all happen to be allowlisted; that is a property of who wrote them, not of anything enforced.

  HOW IT BIT, and this is why it is worth a spec rather than a comment. STORY-1422 scaffolded a job with `command = "doctor check performance --fail-on-findings"`. That string was NOT in the allowlist, so the job would have bailed on every tick for the life of the project - in a config block explicitly documented as the trigger that makes a performance budget a guard rather than a report.

  AND THE SECOND HALF IS SHARPER. The one allowlisted `doctor` entry maps to bare `args: &["doctor"]`, which exits 0 on everything (BUG-1552). SO BEFORE THIS WAS FIXED, NO ALLOWLISTED COMMAND COULD CARRY A NON-ZERO EXIT OUT OF A DOCTOR CATEGORY AT ALL. The scheduler could run doctor and could never learn that doctor had found something. A whole class of substrate guard was unreachable through the only surface that runs on a cadence.

  WHY EVERY ISOLATED CHECK PASSED. The implementer had verified each link separately: the category exists and exits non-zero with the flag; `CronJobFailed` is a real event, defined at events.rs:291 and emitted at maintenance_schedule.rs:1615 on a non-zero substrate exit; the seat-job matcher exists at maintenance_schedule.rs:708-741; the reviewer independently traced the same three statically. EVERY LINK WAS REAL AND THE CHAIN WAS DEAD, because the allowlist sits between link one and link two and no static reading of either link crosses it. IT WAS FOUND ONLY BY RUNNING IT, under an advisor ruling that scaffolded-is-not-demonstrated and that a live end-to-end run was required before the branch shipped.

  Acceptance:
  - A test asserts that EVERY `command = "..."` string in the scaffolded config template parses through `parse_scheduled_command` without error. Mechanical, not by reading - the two lists stop being independently maintained.
  - DEMONSTRATE-IT-FIRES, binding: show the test RED by adding a scaffolded example with an unallowlisted command, then green. A test written against the current five - which already all pass - proves nothing about the drift it claims to catch, and this board has filed that exact failure four times today.
  - The bail message already enumerates the valid commands; if that enumeration is hand-maintained separately from the match arms, derive it from them in the same change. Same shape as BUG-1554 for `aida doctor` categories - see that spec, where the hand-typed list had already drifted by two names.
  - Consider whether the allowlist should be closed at all, and record the answer rather than leaving it implicit. A closed allowlist for a SUBSTRATE runner - a command executed unattended, with no human present - is a defensible security posture and probably the right one. If it stays closed, then the scaffold parity test above is not optional, it is the only thing keeping the two halves honest.
  - Not in scope: making bare `aida doctor` exit non-zero is BUG-1552. This spec is about the allowlist and the scaffold agreeing, which is a defect even if 1552 is never fixed.

  - THE PREMISE IS TESTED: THIS IS A STRUCTURAL RISK, NOT A PRESENT BREAKAGE. Checked by claude-reviewer-1 and re-verified independently by the advisor against main at 8bc2512480. All five scaffolded commands ARE allowlisted today:
        scaffolded (init_cmd.rs :2224-2248)   session reap, doctor, queue gc, cache verify, notify check
        allowlist (maintenance_schedule.rs)   the same five, PLUS fetch --code-only, store compact, store gc
    So nothing on main ships a dead job right now. That matters for urgency and for how this is written up: the fix is needed BEFORE THE NEXT SCAFFOLD CHANGE, not because something is broken in the field. The original filing said today's five "happen to be allowlisted, a property of who wrote them" - that was a reasonable inference and it is now a measurement. (On PR #2049's branch both halves land together, so the branch is consistent too.)

  - TRAP FOR THE IMPLEMENTER, AND IT WOULD BITE ON DAY ONE: THE RELATIONSHIP IS NOT SET EQUALITY. Found by claude-reviewer-1 before anyone started. The allowlist has eight entries and scaffolding uses five; `fetch --code-only`, `store compact` and `store gc` are allowlisted with NO scaffolded example, which is correct and intended. A check asserting the two sets MATCH fails immediately for three false reasons, and a test that is red on arrival for reasons nobody believes gets weakened or deleted - which is how this board loses guards.
    THE ONE-DIRECTIONAL FORM IS THE CORRECT ONE AND IT IS WHAT THIS SPEC REQUIRES: EVERY SCAFFOLDED `command =` MUST PARSE. THE CONVERSE IS NOT A DEFECT. An allowlisted command with no scaffolded example is a capability nobody has written an example for; a scaffolded example with no allowlist entry is a job that errors forever. Only one direction is a bug, and the check must encode that asymmetry rather than the tidier-looking equality.

  - SECOND TRAP, SAME FILE: THERE IS A SIXTH `command =` AND IT IS DOCUMENTATION. init_cmd.rs:2177 contains the literal placeholder `command = "<allow-listed aida subcommand>"` inside explanatory prose. A naive extractor picks it up and it will NEVER parse, so the first run of the new check fails on a string that is correct as written. Either scope the extraction to the `[[schedule.jobs]]` blocks or exclude the documentation example - but DO IT KNOWINGLY, as a decision recorded in the test, rather than discovering it as a failure and special-casing it under time pressure. A placeholder that looks like data is exactly the shape that turns a good check into a check with an unexplained exclusion list.

  - SCOPE OF THE ABOVE CHECK, recorded as its author scoped it so it is not read as exhaustive: claude-reviewer-1 grepped init_cmd.rs ONLY, for `command *= *"`, six matches including the placeholder. Scaffolded jobs defined in another file, or written with a different key, would not have matched. The acceptance's requirement stands on the scaffolded template as a whole, not only on that grep.
