  summary: 'BOTH TRAPS I SPECIFIED ARE HANDLED, AND ONE IS HANDLED BETTER THAN I ASKED. (1) ONE-DIRECTIONAL, NOT SET EQUALITY: the test asserts only that every scaffolded command parses, and the code comment states why the other direction would be wrong - an allowlisted command with no scaffolded example (fetch --code-only, store compact, store gc) is correct, and a set-equality check would fail for three false reasons and get weakened or deleted. (2) THE DOCUMENTATION PLACEHOLDER IS EXCLUDED KNOWINGLY: extraction is scoped to [[schedule.jobs]] blocks tracked line-by-line rather than a blanket grep. BETTER THAN SPECIFIED - they added a companion test, scaffold_extraction_excludes_the_documentation_placeholder, which first asserts the placeholder STILL EXISTS and only then asserts it is not extracted. That makes the exclusion itself falsifiable and stops it going vacuous if the placeholder is ever moved or deleted; I asked for a knowing exclusion and got a guarded one. I VERIFIED THE EXTRACTOR AGAINST THE REAL TEMPLATE RATHER THAN READING IT: I re-implemented the extraction algorithm and ran it over init_schedule_config_section at this sha - 6 commands extracted (doctor check performance --fail-on-findings, session reap, doctor, queue gc, cache verify, notify check), placeholder NOT captured, and all 6 present in the allowlist. That independently reproduces their stated count of 6 and their exclusion claim. RED-FIRST IS DEMONSTRATED WITH REAL OUTPUT, not asserted: a temporary bogus scaffolded command produced a named panic quoting the parse error and the full valid-command list, then reverted to green with git diff --stat confirming only the intended one-line pub(crate) change remained. THE REFACTOR IS THE RIGHT SHAPE: command_table() becomes the single source of truth, with both the parser and valid_commands() derived from it, so the bail message can no longer drift from the match arms - the same de-duplication BUG-1554 asks for. The pub(crate) visibility change is one line and is the minimum needed for the test to reach the template. This closes a STRUCTURAL risk, not a present breakage, and the PR says so plainly.'
