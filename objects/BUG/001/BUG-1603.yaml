title: Outside any AIDA project, write commands fall back to an unrelated project's legacy requirements.db
description: |-
  Seen during TASK-1480 implementation. A manual smoke test run from a directory outside any AIDA project wrote a requirement into /home/joe/ai/pacilab/requirements.db, an unrelated project's legacy SQLite store, which was picked up as a fallback default. The agent deleted the row immediately. This is the same class as BUG-1598: stray-state adoption by a store resolver. A write command outside any project must fail closed (PRIN-5) with setup guidance, and must never adopt a legacy store it was not pointed at.

  ## Acceptance
  - Reproduce and identify the fallback resolver: the default database path, env/config default, or registry lookup that resolves to another project's requirements.db.
  - Outside any AIDA project, write commands (add/edit/comment/rel) refuse with a clear message instead of writing to a fallback store; read commands likewise do not silently read an unrelated store.
  - An explicitly configured legacy path (flag or env) still works.
  - A test covers running from a directory with no AIDA project while a legacy requirements.db exists elsewhere.
