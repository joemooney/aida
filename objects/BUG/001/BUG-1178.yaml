  content: 'Two additions from the live repro. (1) The same root cause blocks NETWORK, not just Bash: the native sandbox prompts on a new domain and dontAsk auto-denies it, so gh/git fetch inside the contained advisor got ''CONNECT tunnel failed, response 403'' for github.com. Workaround shipped as a config PR: [contained] allowed_hosts pre-allowing GitHub (+api/objects/codeload), gitlab.joemooney.com, Anthropic, crates.io, npm — listed hosts pass with no prompt (STORY-605). (2) Display gap: aida config permissions show does NOT render the effective allowed_hosts for claude (network column says ''native/tool-specific'' and the JSON view has no allowed_hosts field) even though contained_allowed_hosts() reads it — so an operator can''t see the egress policy that is actually in force. Fold into the fix: show the effective allowlist per agent, and show the permission mode per launch kind (headless vs interactive).'
