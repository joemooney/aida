description: |-
  Found by BUG-1646 verification run 36234834586 (Cross-platform nightly on claude/bug-1646): Windows shows 6629 passed, 9 failed. The four BUG-1646 tests now pass. The remaining failures come from the 22 commits merged after f9c900b:
