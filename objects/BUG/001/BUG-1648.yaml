  - bug_1633 followup_failed_add_counts_as_already_filed (docs/plans\ separator)
  - statusline apply_session_env_to_process_sets_env
  - bug_1621 watch_pass_dry_run_queues_nothing_and_execute_requeues
  - task_1507 history_cache_merge_commit_decodes_like_git_show_cc
  - worktree_handler enter_shell_payload_cd_then_sources_session_env (asserts a /tmp path)
  For each, decide whether it is a test portability bug or a real Windows product bug; fix production where users would hit it. Acceptance: a workflow_dispatch of Cross-platform (nightly) on the branch is green on windows-latest. Extend scripts/portability-rules.json where a rule would have caught the class.
