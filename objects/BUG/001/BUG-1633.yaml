  content: 'Scope addition from BUG-1626''s re-review: (a) with multiple remote.origin.url entries, the push skip can suppress a needed push to a lagging second URL; require exactly one fetch URL before skipping. (b) When the branch is behind origin, the push summary should say ''nothing to push'', not ''already up to date''.'
