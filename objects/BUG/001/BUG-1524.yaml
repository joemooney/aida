  content: |-
    [aida:advisor-disposition] Execution mode set to drive (keyboard), not drain, deliberately.

    This fix changes the drain's own phase-1 fallback. A headless drain dispatched to fix
    it would run THROUGH the defect it is fixing: if its own phase 1 refused to launch,
    the run would continue from the CI gate and report the fix complete with no commit -
    the exact failure mode, masking itself. An instrument cannot be trusted to observe the
    defect that is in its own observation path.

    Same reason BUG-1524 is filed high rather than medium: it is not the size of the fix,
    it is that the failure is silent and the blast radius is every rework dispatch.
