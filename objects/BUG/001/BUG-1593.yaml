title: role_from_jsonl scans an unbounded, still-growing transcript when the role is unresolved, so a session's reported role can change between calls
description: |-
  Found while fixing BUG-1521 (2026-09-23). session::role_from_jsonl's doc says it caps at ~400 lines, but the loop only stops past MAX_LINES once role, title AND started_at are all resolved. With the role unresolved it substring-scans the whole transcript, which may still be growing, for markers like 'Role: '. Two invocations seconds apart can take a different first match, and an echoed string (a transcript quoting 'Role: product') can be mistaken for the session's own marker. This is the likely root cause of BUG-1521's product/advisor/general-purpose divergence.

  ## Acceptance
  1. The scan honours its line cap regardless of which fields are resolved; past the cap the role is 'unknown', never a late match.
  2. Only structural role markers from the session's own launch context count (not arbitrary substrings in tool output).
  3. A test with a transcript that echoes a foreign 'Role:' string later in the file returns the launch role (or unknown), deterministically.
