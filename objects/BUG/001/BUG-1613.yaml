spec_id: BUG-1613
agreed_id: BUG-1613
title: save() and BulkWriter write metadata.yaml wholesale and can revert a concurrent metadata change
description: |-
  Follow-up from BUG-1612 (review). GitBackend::save() rewrites metadata.yaml from the caller's in-memory store, and BulkWriter::finish writes the metadata snapshot taken at bulk_writer(). A concurrent change to store-level fields (features, id counters, users, teams, type definitions) that lands between the caller's load and its save is silently reverted. Counter reverts can re-issue IDs. Object writes are now a per-spec compare-and-swap (BUG-1612); metadata is not.

  ## Acceptance
  - A whole-store save and BulkWriter::finish write metadata.yaml only when a store-level field actually changed, and compare-and-swap it against the copy loaded (refuse with a typed conflict, as object writes do).
  - ID counters are merged monotonically (max of disk and caller), never lowered.
  - Tests: a concurrent feature add and a concurrent counter bump between load and save both survive.
