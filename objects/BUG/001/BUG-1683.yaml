title: A live drain older than 30 minutes can have its lock reclaimed by queue work --auto-complete / burndown run (decide_lock age backstop never refreshed)
description: 'Found by the TASK-1518 round-3 review: decide_lock (used by direct ''queue work --auto-complete'' and ''burndown run'', not by ''drain start'') applies an 1800 s age backstop on started_at_utc, which is never refreshed, so a still-running drain older than 30 minutes is treated as stale and its lock reclaimed locally — two drivers on main (the BUG-538 class). Acceptance: 1. decide_lock treats a lock whose pid is alive (pid + start-time identity) as held regardless of age; age applies only when liveness can''t be determined. 2. Alternatively/additionally the holder refreshes a heartbeat timestamp and the backstop keys on it. 3. Fixture test: a lock held by a live pid with started_at 2 h ago is not reclaimable by any entry point.'
