- id: 01a0c348-25b9-7aa0-b4d0-29a1f1556cf4
  author: joe
  content: |-
    THE HOLD RULE, FINAL FORM — sharpened 2026-09-21 02:24 after two live clearance decisions an hour apart, and the sharpening matters because the earlier phrasing would have gotten the second one wrong.

    THE RULE HAS TWO CLAUSES AND NEITHER MENTIONS CI:

        1. OWNERSHIP:  Do not clear another seat's hold on a PR that CAN STILL MERGE.
                       On a CLOSED or MERGED PR, any seat may sweep the phantom.
        2. TIMING:     Clear when the refusal the marker carries is NO LONGER THE
                       REVIEWER'S POSITION. Not when CI goes green.

    BOTH LIVE CASES FALL OUT OF CLAUSE 2:

        #1998   cleared, because the marker named "CHANGES REQUESTED at 698dd77c7cea" while
                the reviewer's own APPROVAL at 5393454ef62b had superseded it. The marker was
                FALSE at the moment it was cleared, and it was blocking a merge on a stale
                refusal.
        #2030   NOT cleared, because the marker names "CHANGES REQUESTED for BUG-1485 at
                293da2d0cc94" and that IS the reviewer's current position. Build (ubuntu-latest)
                passed at that same head. The marker is TRUE and the gate failing is the
                substrate working.

    WHY THE CI PHRASING IS DANGEROUS. The driver-advisor's first statement of the distinction was framed around CI — "#1998's marker was stale, #2030's is current, green CI here only means the tree builds." That reaches the right answer on both but for a reason that does not generalise: it fails exactly where CI is GREEN AND THE FINDINGS STAND, which is precisely where #2030 sits. A rule phrased around CI would have invited clearing #2030 the moment its Build passed.

    The reviewer seat caught this and restated it as one sentence covering both. The discriminator is the TRUTH OF THE MARKER, never the colour of the checks.

    WHAT A GREEN BUILD IS WORTH ON A PR WITH DESIGN-LEVEL FINDINGS, recorded here because it is the other half of the same confusion: the tree builds and the suite passes, and neither finding is reachable by it. On #2030, F1 is a missing production change that compiles fine without it, and F2 is a fixture that passes PRECISELY BECAUSE IT STOPS SHORT — it asserts branch recovery, which F1 already grants, and halts immediately before the disputed step. A green Build is the EXPECTED result on both findings, not evidence against either.

