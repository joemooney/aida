title: tick_bounds_global_schedule_log test races other writers of the global schedule-tick.log under parallel cargo test
description: 'Observed 2026-10-05 in a full ''cargo test --workspace'' run: maintenance_schedule::tests::tick_bounds_global_schedule_log_for_timer_but_not_hook_invocation panicked (''a non-hook tick must bound the log: 526186 bytes'') but passes in isolation (0.04s). The test asserts bounding of a GLOBAL log (~/.aida/schedule-tick.log) that other tests and live shift timers append to concurrently; under parallel test execution the log can grow between the tick and the assertion. Fix: point the test at a test-scoped AIDA home (test_env/test_home pattern) instead of the real global log, or serialize it with the lock the other global-log tests use.'
