comments:
- id: 01a10f37-b3c4-7d80-8111-caf1bf0fd932
  author: joe
  content: 'Investigation: the test already pins AIDA_HOME to a guarded tempfile, and 526186 bytes exactly matches its oversized fixture. The timer tick can instead return early on contention for the preceding hook tick’s project lock: parallel Command spawns briefly inherit flock open-file descriptions (documented by BUG-1595 in the neighboring lock test). Fix uses separate hook/timer project roots sharing the guarded temp home; checks resolved log path and empty tick results so skipped ticks cannot masquerade as execution. No production locking behavior changes.'
  created_at: 2026-10-06T03:17:51.172193983Z
  modified_at: 2026-10-06T03:17:51.172193983Z
