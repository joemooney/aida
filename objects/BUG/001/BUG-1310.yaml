title: Classifiers that read external tool prose can drift with no edit of ours and no test failing, and were scoped out of the exit-code sweep
description: |
  BUG-1295 replaced prose-matching with exit codes for AIDA's own producers, and deliberately scoped out the classifiers that read EXTERNAL tool output — CI rollup status, `gh pr merge` text, SQLite lock messages, OS out-of-memory and disk strings. That boundary is correct as a class distinction and should not be mistaken for the risk being absent.

  THE DISTINCTION THAT JUSTIFIES THE SPLIT. For our own commands we can add an exit code and have the producer own the classification, which is what BUG-1295 did. We cannot give `gh` or SQLite an exit code. So the remedy genuinely differs, and folding these into that change would have made it larger and worse.

  THE ARGUMENT THAT CUTS THE OTHER WAY. Not controlling a tool's wording is a reason to be MORE careful about matching its prose, not less. Our own text drifts only when one of us edits it, and BUG-1295's new test now fails when that happens. An upstream release can reword its output with no deprecation notice we would read, no changelog entry we track, and no test of ours failing — so the external classifiers are the ones most likely to break silently and the least likely to be noticed when they do. The failure shape is identical to the one PRIN-4 names: the decision stays right while the diagnostic explaining it degrades, and nothing reports it.

  NOT URGENT. Nothing is known to be broken today. This is filed so the exclusion is a recorded decision with a follow-up rather than a gap that closed quietly.

  SCOPE
  1. Enumerate every classifier in the workspace that matches text produced by an external tool. Record the site, the tool, the matched string and what the classification drives.
  2. Per site, decide whether the tool offers a structured alternative. `gh` supports `--json` for most of what we shell out to, which is the obvious lever and probably closes the majority.
  3. For sites with no structured alternative, pin the matched strings as named constants in one place, with a comment naming the tool and the version observed, so a drift is findable by reading one file rather than by grep across the workspace.
  4. Where a match drives a safety decision rather than a cosmetic one, prefer failing closed on no-match over failing open. A classifier that silently permits when it stops matching is the shape that made BUG-1295 worth fixing.

  NOT IN SCOPE: changing what any classifier decides today, and adding a dependency to parse a tool's output where we currently shell out.

  Filed by the advisor while reviewing PR #1993, where the exclusion was argued explicitly and well. The reasoning there is worth reading alongside this.
