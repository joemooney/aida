title: Resolve persisted merge requests before local rework branch lookup
description: |
  Auto-complete rework must resolve an already-open PR/MR by the verified identifier persisted during implementation/ship handoff, rather than depending on the local rework branch name.

  Observed in qci#BUG-138: local staging branches such as <source>-work pushed fixes to an existing forge source branch, but phase 2 searched only by the local branch and reported no open change.

  ## Required behavior
  - Persist the resolved PR/MR identifier and produced head SHA from phase 1.
  - Use that identifier as phase 2's primary lookup key and verify covered specs plus exact head.
  - Fall back to local branch lookup only when no verified identifier exists.
  - Support local branches without upstreams and staging branches that push to an existing source branch.
  - Refuse ambiguous multiple matches with identifiers and evidence.

  ## Acceptance
  - Rework from <source>-work advances through phase 2 against open MR <source> when heads match.
  - GitHub and GitLab paths behave consistently.
  - No-upstream local branches work when orchestration state has a verified change identifier.
  - Exact-head mismatch and multiple matches fail actionably.
  - Regression tests reproduce the qci failure.
