  summary: 'DISCLOSURE: THIS PR SHIPS TWO MEMORY FILES I WROTE. feedback_check_ignore_names_the_winner and feedback_reconstruct_provenance_by_bracketing are mine, authored in this session. I am NOT the independent party on whether my own writing is good enough to propagate into every downstream AIDA project - that judgement belongs to another seat, and I am flagging it rather than making it. What I CAN verify as their author is whether they were correctly prepared for propagation, and they were. BUG-1461 IS A CLEAN FIX OF EXACTLY THE DRIFT CLAUDE.md FORBIDS: the CLI gained `aida mailbox send --subject` in BUG-1231 and the MCP surface was never mirrored - subject was accepted by no schema property and dropped unconditionally (Message { subject: None, .. }). The fix adds the schema property with a description that points at the CLI flag it mirrors, threads it through the handler, and surfaces it in read_inbox. The omitted-not-null choice is deliberate and stated: a message without a subject omits the key rather than emitting null, which keeps the JSON shape honest for consumers that distinguish absent from empty. Covered by a send_message -> read_inbox ROUND TRIP, which is the right test - it proves the value survives the boundary rather than that a field exists. THE MEMORIES WERE GENERICISED FOR PROPAGATION AND I VERIFIED IT WITH A POSITIVE CONTROL rather than by reading: my originals contain BUG-1279 twice; the scaffolded versions contain ZERO spec ids, zero dates and zero AIDA-internal references, with the measured incident rewritten as "a status marker under a deny-by-default directory". The lesson and the falsifying method survive; the provenance that would be noise in a downstream project is gone. That matches CLAUDE.md''s rule that SPEC-IDs stay in developer artefacts - a scaffolded memory landing in someone else''s project is user-facing text. Both carry propagation: scaffolding-pack, which is the marker that actually joins the pack.'
