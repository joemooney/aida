- id: 01a0f4f7-a4d7-7730-b792-ff64d53d9d02
  author: joe
  content: "ADVISOR DISPOSITION (2026-09-30, relay #21): APPROVED — the SYMPTOM is real, reproduced, and\nworth high priority. The ROOT CAUSE in the filing is WRONG, and following its acceptance\ncriteria literally would (a) not fix the bug and (b) risk breaking the scheduler's command\nlookup. Everything below is measured in this session and is BINDING on the implementation.\n\n## What is actually broken (proven, not inferred)\n\n`--json` is already in force, and the typed envelope is already emitted correctly. The parse\nfails because **a TOON error block is appended to STDOUT after the JSON document.**\n\nI reproduced the whole chain in an isolated scratch project (a bare `.aida/config.toml` with one\nbudget on a never-called shape, so the unobserved-shape rule trips the guard). Running the\ncommand exactly as the scheduler runs it, with stdout captured:\n\n```\n$ aida doctor check performance --fail-on-findings --json   (stdout redirected to a file)\nEXIT=1\n{\n  \"total\": 1,\n  \"findings\": [ { \"category\": \"performance\", \"id\": \"never-called-shape\", ... } ],\n  \"bwrap\": \"bwrap: OK (userns confinement available)\",\n  \"performance_audits\": [\n    { \"command\": \"never-called-shape\", \"budget_ms\": 10, \"over_budget\": 0,\n      \"denominator\": 0, \"proportion_millipercent\": 0, \"tolerated_millipercent\": 10000,\n      \"window_hours\": 24, \"excluded_samples\": 0, \"lineage_scoped\": false,\n      \"ceiling_ms\": 20, \"ceiling_breached\": false }\n  ]\n}\nerror: \"1 finding(s) in performance — failing because --fail-on-findings was requested\"\n```\n\nLine 29 is that `error:` line, **on stdout**, after a complete and valid JSON document carrying\na complete and valid `performance_audits` record. `serde_json::from_str` on the whole of stdout\ntherefore fails with \"trailing characters at line 30 column 1\" — which is byte-for-byte the\nshape of the recorded trip's `audit_error`. The recorded symptom is explained exactly, and NOT\nby any of the causes the filing names.\n\nThe mechanism, end to end:\n\n1. `main_entry` (`lib.rs:1072-1073`, TASK-972 / AXI #6) deliberately routes errors to **STDOUT**\n   as a structured TOON `error:`/`help:` block when `agent_output_mode()` is true. Its comment\n   states the intent: \"agents read STDOUT. An error printed to stderr ... is invisible to the\n   agent loop, forcing blind retries.\"\n2. `agent_output_mode()` (`lib.rs:2304`) is true when stdout is not a TTY **and also whenever\n   `--json` / `--format json` is pinned** — the comment at `:2307` is explicit: \"`toon` / `json`\n   both select the agent (machine) path\".\n3. So `--fail-on-findings` → `anyhow::bail!` in `doctor_check_store_free_light`\n   (`doctor_cmd.rs:823-828`) → that bail is rendered by TASK-972's agent-mode branch → appended\n   to the same stdout that already holds the JSON report.\n4. `failure_trip` (`maintenance_schedule.rs:3118`) parses the whole of `outcome.stdout` as one\n   `PerformanceAuditEnvelope`, so it sees trailing characters and records `audit_error`.\n\n**The guard can only record evidence when it TRIPS, and tripping is precisely what pollutes the\nstdout it records.** That is the bug, in one sentence. Put that sentence in the PR.\n\n## Corrections to the filing (each one changes the fix)\n\n**1. \"The configured command passes NO `--json`\" — FALSE, and this is the load-bearing error.**\nThe string in `.aida/config.toml:132` is a *display key*, not an argv. `maintenance_schedule.rs`\nmaps `\"doctor check performance --fail-on-findings\"` to an argv that **already contains\n`--json`** (`:2796-2807`: `[\"doctor\",\"check\",\"performance\",\"--json\",\"--fail-on-findings\"]`). The\nsame is true for all five guards (`remote-drift` `:2844`, `stale-remote-branches` `:2858`,\n`runaway-seats` `:2874`, `disk-headroom` `:2888`).\n\n**DO NOT add `--json` to `.aida/config.toml` or to the `init_cmd.rs` scaffold.** The filing's\nfifth AC asks for exactly that. It is a no-op at best, and at worst it changes the key used to\nlook up `ScheduledCommand`, so the job stops matching a known command. If any config string\nchanges, the alias array (the tuple's first element) must gain the new spelling in the same\ncommit — but the right answer here is to change nothing in the config.\n\n**2. \"Adding `--json` does NOT fix it ... that projection's top-level keys are exactly `total`,\n`findings`, `bwrap` — there is no `performance_audits` key\" — FALSE as a structural claim.**\n`performance_audits` is a field on the very struct `--json` serializes (`doctor_cmd.rs:387`),\ncarrying `#[serde(skip_serializing_if = \"Vec::is_empty\")]`. The key is absent only when the\nvector is empty. It is emitted whenever it is non-empty — demonstrated above.\n\n**3. \"Both error branches are reachable; the success branch is not\" — FALSE.** The success branch\nis reachable and I reached it. The envelope above would parse and yield one audit if the trailing\n`error:` line were not there.\n\n**4. Why the filing measured otherwise.** `performance_audit_records` (`doctor_cmd.rs:2396`)\nproduces records ONLY from `performance_breaches` and `performance_unobserved`. A budget that is\nobserved and within tolerance yields zero audits by design. The filing ran the command by hand\n**at a terminal, in a passing state**, and generalised \"no key today\" to \"no key ever\". I\nreproduced their reading first (from the repo root: keys `total`/`findings`/`bwrap`, 0 audits, 0\nfindings, exit 0 — the guard is simply passing right now) and then falsified the generalisation\nby constructing a tripping state. The lesson for the PR: **measure a guard in the state where it\nfires, in the environment the scheduler gives it** (stdout not a terminal). A by-hand TTY run of\na passing guard is a different program.\n\n**5. \"`doctor check performance` emits HUMAN box-drawing text\" — true only at a TTY by hand.**\nUnder the scheduler's captured stdout with no pin, aida auto-switches to TOON and says so on\nstderr (STORY-764). With the injected `--json` it emits JSON. The filing's step 3 describes an\nenvironment the guard never runs in.\n\n## The filing's open question, ANSWERED — do not file a second bug\n\n\"Confirm whether `--fail-on-findings` on the `performance` category gates on performance findings\nor on the generic finding set.\"\n\n**It gates on the performance-category set only.** `doctor check performance` dispatches to the\nstore-free light path (`doctor_cmd.rs:90-97` → `doctor_check_store_free_light` → \n`performance_light_report`, `:815`/`:834`), whose `report.findings` is `performance_findings(...)`\nalone (`:859`) — no `collect_doctor_findings`, no other category. Confirmed empirically: my\ntripping run reported `total: 1` with the single finding `category: \"performance\"`. The filing's\ncontingent \"if it is the generic set, that is a second defect\" does not apply. **No second bug.**\n\n(Also measured, and consistent with the standing disposition: the guard exits 0 today because the\n`show` shape is currently within its tolerated proportion over the 24h window. 30,279 `show`\nevents are present in `~/.aida/usage.jsonl`, most recent one minute before this reading, and the\nrunning binary `7d85a8057d` IS an ancestor of HEAD `7c37dd81ac`, so the BUG-1572 lineage gate is\nNOT filtering them out. Exit 0 is an honest pass of the proportion rule, not a silent failure.)\n\n## Blast radius — this is bigger than the performance guard\n\nEvery one of the five guards runs `--json --fail-on-findings` and bails on findings, so **every\nguard's stdout is polluted by the TOON error block on every trip.** More generally, because\n`--json` itself selects the agent path, **any `aida … --json` invocation that fails appends a\nTOON error block after its JSON document.** Performance is just the only consumer that currently\nparses a typed envelope, so it is the only one that records an `audit_error` instead of silently\nbeing unparseable to whoever reads it next.\n\nTreat this as a stdout-contract defect in the shared error path, not as a performance-category\ndefect. Fixing it at `main_entry` fixes all five guards and every future typed consumer at once.\n\n## Design fork, RESOLVED — and an architecture sketch is REQUIRED before implementation\n\nTwo shipped decisions collide, each locally correct: TASK-972 says the agent's error channel is\nstdout; `failure_trip` requires stdout to be exactly one machine-readable document.\n\n**Resolution: when a machine-readable document has been written to stdout, the error must not be\nappended after it as a second document.** The error still reaches the agent on stdout — inside\nthe JSON it is already parsing — so TASK-972's intent is preserved rather than reverted. Concrete\nshape to sketch: in JSON output mode, carry the failure as a field of the envelope (or suppress\nthe trailing block and let the non-zero exit plus the envelope's own findings carry it), and keep\nthe TOON block for TOON mode where there is no competing document.\n\n**Rejected: making `failure_trip` tolerant of trailing bytes** (e.g. pulling the first value off\na streaming `serde_json::Deserializer`). It would make this one trip parse while leaving stdout\nmalformed for every other consumer, and it would hide the contract break instead of fixing it. It\nis acceptable as *additional* defensive hardening on the consumer side; it is NOT the fix, and a\nPR that only does this will be rejected.\n\nBecause this changes a documented AXI output contract (TASK-972), per CLAUDE.md this needs a\nsketch on the owning spec and advisor signoff **before** implementation. Post the sketch on this\nspec: state precisely which channel carries an error in each of the three output modes (human,\nTOON, JSON), and what an agent loop is expected to read in each. I will sign off on the sketch,\nnot on a diff that arrives without one.\n\n## Acceptance criteria — REPLACING the filing's where they conflict\n\nKEEP from the filing, unchanged:\n- A tripped performance guard records at least one `performance_audits` entry in\n  `.aida-store/schedule/performance-guard.yaml` with budget, measured value, denominator and\n  ceiling — enough to disposition without re-measuring by hand.\n- Both existing failure branches stay reachable and tested (malformed output; well-formed output\n  with no audits). Neither may be quietly converted into a success.\n- MUTATION PROOF: reverting the fix must make the new round-trip test fail.\n- The round-trip test must run the real command and feed its real stdout to `failure_trip`. A\n  hand-built JSON literal does not satisfy it (`maintenance_schedule.rs:3959` is the test shape\n  that let this ship — and note that `performance_audit_records` itself has **zero** direct test\n  coverage anywhere in the tree, which is why a producer/consumer mismatch was invisible).\n\nREPLACED or ADDED, binding:\n1. **Delete the \"add `--json` to the config and scaffold\" criterion.** See Correction 1. If the\n   config is touched at all, the alias array in `maintenance_schedule.rs` must gain the new\n   spelling in the same commit, and a test must assert the job still resolves to a known\n   `ScheduledCommand`.\n2. **The round-trip test must capture stdout as a NON-TERMINAL**, exactly as the scheduler does.\n   A test that runs the command with an inherited TTY measures a different output format and will\n   pass against the broken code. State in the PR that this was done.\n3. **The round-trip test must run in a TRIPPING state.** A passing guard emits no audits by\n   design, so a test asserting \"audits present\" against a passing state is impossible to satisfy\n   and a test asserting \"parse succeeds\" against a passing state passes today, bug and all. The\n   never-called-shape fixture above (one budget on a shape with no recorded calls) is a cheap,\n   deterministic way to force a trip with no dependence on machine latency — use it or something\n   equally deterministic; do NOT depend on `show` actually breaching.\n4. **Prove the contract on at least one OTHER guard.** Add a test that a second\n   `--json --fail-on-findings` guard's stdout is a single parseable document on a trip. This is\n   what stops the fix being quietly performance-specific.\n5. **The human-output path must stay byte-identical.** TASK-972's comment claims \"the\n   human-at-a-TTY path below is byte-identical to before\"; keep that true of this change too, and\n   pin it with a test.\n6. The filing's second criterion — a human evidence block for `performance`, in the shape\n   `runaway-seats` already prints — is ACCEPTED but is **separable and secondary**. It is a\n   usability improvement for a human running the command by hand; it is not on the path that\n   fixes the guard. If it adds risk or size, split it into its own spec and land the stdout\n   contract fix first. Say which you did.\n\n## Disposition\n\nAPPROVED, high. The priority is right: the filing's own account of the cost is accurate and is\nthe real harm — on 2026-09-29 the advisor seat had to re-measure `aida show` latency by hand\nbecause the trip carried nothing, and a guard whose evidence is always absent trains the seat to\ndisposition from memory. PRIN-5 is the principle at stake and the filing cites it correctly.\n\nBudget disposition unchanged and explicitly preserved: BUG-1674 is real, tracked, approved, and\nits fix is STORY-1484's single-flight cache refresh. Nothing here raises a budget.\n\nStart from the mechanism in this comment, not from the filing's root-cause paragraph. The\nfiling's evidence-gathering was careful and its symptom report is exactly right; it simply\nmeasured a passing guard at a terminal and inferred a structural absence from a conditional one.\n"
