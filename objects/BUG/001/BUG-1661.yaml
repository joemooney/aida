title: 'Pre-commit hook and docs polish: rg -nE in user-facing-text docs (-E is --encoding), hook treats //// as a doc comment, cargo-fmt step claims ''drift fixed'' when cargo itself fails'
description: 'From TASK-1516''s round-2 review. (a) docs/user-facing-text-conventions.md has several ''rg -nE ...'' commands; in ripgrep -E means --encoding, so they fail with ''unknown encoding''; use ''rg -n''. (b) aida-core/templates/hooks/aida-pre-commit.sh treats ''////'' lines as doc comments, but Rust treats them as plain comments; exclude 4+ slashes. (c) The hook''s cargo-fmt step prints ''drift fixed and re-staged'' even when cargo fails (e.g. no rustup default toolchain); report the failure honestly and don''t claim a fix. Edit the template master, then make sync-templates. Acceptance: tests in tests/test_precommit_provenance_move.sh for (b) and (c) (fake failing cargo on PATH); the doc commands run.'
status: Done
