title: Store writes made while .aida-store is mid-rebase (detached HEAD) are silently lost on rebase --abort
description: |-
  Observed 2026-09-18 in the GitLab-origin checkout /home/joe/ai/aida-gitlab-mirror during the TASK-1254 live drain. A store `git pull --rebase` inside the drain failed mid-way (cross-hub divergence: "cross-clone coordination unavailable: store unreachable (git pull --rebase failed …) rm -fr …/.git/worktrees/-aida-store/rebase-merge"), leaving .aida-store on "HEAD (no branch)" with a rebase-merge dir.

  Every subsequent store write in that clone — the reviewer phase's "add STORY-1241", "update STORY-1241", "update queue", and the auto-filed "add BUG-1319" — committed onto the DETACHED HEAD with no error; the orchestrator printed "✓ filed STORY-1241 → reviewer queue". Recovering the store with `git rebase --abort` (the documented step) dropped those commits; they were only recoverable from the reflog by hand (cherry-pick conflicted on registry/blocks.yaml; files were restored directly).

  Expected: the git backend refuses (or repairs, then retries) a write when the store worktree is not on the aida-store branch or has a rebase/merge in progress, and `aida doctor` / `aida remote status` flag the state. The pull --rebase failure path must not leave the worktree detached (abort its own rebase before reporting).

  Acceptance:
  - With .aida-store deliberately left mid-rebase, `aida add` fails loudly naming the state and the fix (or repairs and lands the write on the branch); integration test covers it.
  - `aida remote status` and `aida doctor` report "store worktree detached / rebase in progress".
  - The store pull --rebase failure path leaves the worktree on the branch (its own rebase aborted) — test.
