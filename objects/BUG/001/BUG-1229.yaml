    ? AC (0.95) — A linked `.aida-store` worktree attached to any branch other than `aida-store` is treated as unsafe and store writes are refused, even when no rebase is active.
    ? AC (0.90) — `aida remote status --json` always includes a `store_worktree_issue` field, containing the detected unsafe-state description or null, including when no remote is configured.
    ? SEM (0.88) — An unborn but symbolically attached HEAD is not classified as detached, and standalone Git repositories are not required to be on the `aida-store` branch; the branch-name invariant applies only to linked worktrees.
    ? AC (0.96) — When an AIDA-started pull rebase fails and automatic abort succeeds, the original local branch, HEAD commit, and working-tree content are restored before the failure is returned; if automatic abort itself fails, the returned error reports both failures.
    ? SEM (0.82) — The doctor unsafe-store finding is not auto-healable and directs the operator to explicitly continue or abort the rebase before retrying.
    - AC skipped (matches a deny keyword) — Every Git-backed store mutation entry point—including bulk updates/import completion, full saves, requirement add/update/delete, and queue add/remove/reorder/clear—refuses an unsafe store worktree before changing any store file.
