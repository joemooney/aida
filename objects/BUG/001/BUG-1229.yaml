  content: 'Implementation sketch (architecture-signoff surface): centralize an unsafe-store predicate in git_ops (detached HEAD and rebase markers); invoke it before every GitBackend mutation, including bulk flushes, so failure precedes filesystem changes; make pull_rebase abort any rebase it started before returning failure; expose the same predicate in doctor and remote status; document recovery in multi-hub sync. Regression coverage proves detached add produces no object/commit and conflicting pull restores the branch. Implementation is committed only after validation; merge remains held for advisor review.'
