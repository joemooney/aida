- id: 01a0da5c-c424-7d33-8835-6dec9281305e
  author: joe
  content: 'Review: REQUEST CHANGES — small, one-line fix. The core resolution is correct and verified. Blocker: in a fresh linked worktree the 2nd build is still Dirty, because the build script''s own `git status --porcelain` (aida-cli-lib/build.rs:48-50) opportunistically rewrites the per-worktree index during the build (the index is racy right after `git worktree add`), and the index is watched (build.rs:~92). Observed on the real crate: build 1 compiled; build 2 Dirty ''index has changed (52ms after last build)'', lib recompiled; build 3 Fresh. That fails the acceptance literally in the exact worktree-per-spec scenario. Fix: `.args(["--no-optional-locks", "status", "--porcelain"])`. An A/B in a scratch crate (plain: Dirty on every rebuild; with the flag: Fresh from build 2) confirms it. Verified OK: rev-parse --absolute-git-dir / --git-common-dir (relative common dir joined to CARGO_MANIFEST_DIR = build-script cwd, correct); gitdir:/commondir fallback with no git on PATH (linked worktree resolved); no-.git tarball emits nothing and the 2nd build is Fresh; paths with spaces are fine; only existing paths are emitted. Stamp: detached HEAD + empty commit -> Dirty via HEAD, sha updated to the new commit, next build Fresh; on a branch, commit -> Dirty via logs/HEAD, sha updated, next Fresh. Checkout, reset, amend and rebase all touch HEAD and/or logs/HEAD. Fetch-only correctly does not rerun. packed-refs omission is justified (a branch update always writes a loose ref). Non-blocking edge (not a regression vs main): with core.logAllRefUpdates=false, no logs/HEAD, and a nested branch (a/b) whose ref is only packed, the parent dir refs/heads/a does not exist, so nothing catches the next commit. Reproduced: the stamp stayed stale. A suggested tweak is to watch the nearest existing ancestor of the loose ref instead of just parent() (build.rs:~113). Other build scripts (aida-core: templates/, aida-server: proto) do not reference git and need nothing. Hang risk: no network or credential paths; stdout is piped, so there is no pager. Minor note: inherited GIT_DIR/GIT_INDEX_FILE from a git hook would redirect resolution; that also applies pre-existing to the sha.'
