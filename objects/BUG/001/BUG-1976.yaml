title: Advisor guard hook blocks subagent writes outside the repository (session scratchpad)
description: |
  ## F18. Scope guard hooks to the repository

  **Seen:** in trial 0, the project's advisor-seat guard hook blocked a
  subagent's write to the session scratchpad. That is a path outside the
  repository, which the hook exists to protect.

  **Proposal:** guard hooks act only on paths inside the project worktree (or
  an explicit list). Scratchpad and temp writes by subagents pass silently. A
  spurious block costs a retry, and it teaches agents to repeat blocked writes,
  which weakens the guard where it matters.

  ## Acceptance

  To be written at triage; the proposals above are the starting point.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), feedback file docs/regeneration/aida-feedback.md at commit f2b8d2d; results in docs/regeneration/results-2026-10-11.md. Headline numbers: a blind agent rebuilt the 1,600-line system from the curated store at 93.9-95.5% of discriminating oracle checks (3 replicates), 22.7% without the 3 contract rows, 11.4% from the store as it stood before regenerability work; an AfterVibe Prompt A.1 spec distilled from the transcript reached 97.7%.
