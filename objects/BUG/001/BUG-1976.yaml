    [groom:night] APPROVE (supervised). Rewrote the "To be written at triage" Acceptance section into testable criteria. Verified: aida-core/templates/hooks/aida-advisor-code-guard.sh fires on any code-extension path (`*.py`, `*.rs`, ...) with no check that the path is inside the repository, so scratchpad writes from an advisor's subagent (which inherits AIDA_SESSION_ROLE=advisor) trip it. Key nuance added to acceptance: "inside the repo" must include sibling linked worktrees (same git-common-dir), otherwise scoping would open a hole for advisor edits in sibling worktrees. Supervised: it narrows a seat-boundary guard.
