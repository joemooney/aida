id: 01a12c99-875f-7611-ba44-1ee0db97c4e7
spec_id: BUG-1976
agreed_id: BUG-1976
title: Advisor guard hook blocks subagent writes outside the repository (session scratchpad)
description: |
  ## F18. Scope guard hooks to the repository

  **Seen:** in trial 0, the project's advisor-seat guard hook blocked a
  subagent's write to the session scratchpad. That is a path outside the
  repository, which the hook exists to protect.

  **Proposal:** guard hooks act only on paths inside the project worktree (or
  an explicit list). Scratchpad and temp writes by subagents pass silently. A
  spurious block costs a retry, and it teaches agents to repeat blocked writes,
  which weakens the guard where it matters.

  ## Acceptance

  - `aida-core/templates/hooks/aida-advisor-code-guard.sh` resolves the target
    `file_path` (relative paths against the hook's cwd) and fires only when that
    path lies inside a worktree of the session's repository: the main checkout or
    any linked worktree sharing the same `git rev-parse --git-common-dir`
    (sibling worktrees still count as "inside", so an advisor editing code in a
    sibling worktree is still guarded).
  - A path outside every such worktree (for example `$TMPDIR/...`, `/tmp/...`, the
    Claude session scratchpad) exits 0 silently and does NOT create the
    per-session fire-once marker.
  - If the path's repository cannot be determined (git missing, parent directory
    does not exist), the hook keeps today's behaviour (guard applies) rather than
    failing open.
  - Shell test in the hook test suite: advisor role + `.py`/`.rs` write to a temp
    directory outside the repo → exit 0 and no marker; the same write inside the
    repo and inside a sibling linked worktree → exit 2 on first fire.
  - `make sync-templates && make check-templates` clean.
  - Audit the other PreToolUse guards (`aida-git-guardrails.sh` is command-based,
    so out of scope) and note in the PR whether any other path-based guard needs
    the same scoping.

  ## Evidence

  Source: the aida-host regenerability pilot (EPIC-20 in /home/joe/ai/aida-host), feedback file docs/regeneration/aida-feedback.md at commit f2b8d2d; results in docs/regeneration/results-2026-10-11.md. Headline numbers: a blind agent rebuilt the 1,600-line system from the curated store at 93.9-95.5% of discriminating oracle checks (3 replicates), 22.7% without the 3 contract rows, 11.4% from the store as it stood before regenerability work; an AfterVibe Prompt A.1 spec distilled from the transcript reached 97.7%.
