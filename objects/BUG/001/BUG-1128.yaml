title: Epic rollup treats a DEFERRED child as unfinished, so an epic whose only open child is parked never reads ready-to-close
description: EPIC-62's 10 non-deferred children are all terminal (completed/done/accepted); its only remaining child STORY-1096 is deferred on the primed shelf. The rollup still reports the epic in-progress and 'aida why' says 'nothing for you until they all finish' — but all NON-deferred children have finished. A deferred child should be treated as resolved for rollup purposes (like rejected/superseded already are), so the epic reads ready-to-close while the parked child stays on the deferred shelf. trace:BUG-626
