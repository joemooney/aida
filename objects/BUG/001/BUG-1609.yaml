title: GitLab reviewer preflight still uses GitHub metadata resolution
description: |-
  Observed live with `[forge] provider = "gitlab"` and an authenticated self-hosted `glab` remote on 2026-09-24.

  ## Reproduction
  1. Open GitLab MR-1 from `story-52-work` to `main`.
  2. Queue its review story.
  3. Run `aida queue work STORY-59 --role reviewer --vendor codex --user joe --dry-run`.
  4. AIDA prints `could not resolve PR base/head via gh — falling back to base=main, head=pr-1`.
  5. The non-dry run subsequently fetches `refs/merge-requests/1/head` and prepares the correct GitLab review worktree, proving the forge and MR were available.

  The fallback head `pr-1` is GitHub-shaped and not the GitLab source branch. Help for `aida pr auto-queue-review` also still says it detects changes via `gh pr list`, despite the command successfully handling this GitLab MR.

  ## Expected
  Reviewer preflight resolves change metadata through the configured Forge implementation. For GitLab it should use `GitLabForge::change_metadata` or equivalent `glab` API calls, report `story-52-work -> main`, and never emit a GitHub lookup warning or fabricate `pr-1`.

  ## Acceptance
  - GitLab integration test for review-story dry-run resolves the real MR head/base and SHA through the Forge trait.
  - No `gh` process or GitHub-specific fallback name is used when provider is GitLab.
  - Preflight fetch, stale-base, and intermediate-only checks share the same resolved change metadata.
  - Auto-queue-review and review help text is forge-neutral or provider-specific.

  This is a concrete live instance of the remaining call-site migration tracked by STORY-621.
