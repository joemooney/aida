    Cold-review rework for PR #2076 closes the live-consumer gap. The actual phase-3 verdict reader now refuses Approved when reviewed_sha is absent, when the current PR head cannot be resolved, or when the recorded commit differs; safe abbreviations of at least seven hexadecimal characters still compare by commit identity. Both the ordinary reviewer path and configured agent-gate path pass the forge-resolved PR head. probe_resume_facts now compares the PR-keyed handshake against the resolved current branch tip before setting reviewed=true.

    Red-first evidence: a temporary mutation restored the old spelling-only behavior (`return Ok(outcome)` for Approved). Both new live consumer tests failed by receiving Ok(Verdict(Approved)) for stale and SHA-less records. The mutation and unreachable-code allowance were removed; all three live phase-3 tests then passed. The real probe_resume_facts test now exercises SHA-less=false, stale=false, and exact-head=true.

    Verification: live_phase3 tests 3/3 passed; probe_resume_facts live consumer test passed; prior bug_775 suite remained 27/27; cargo fmt check and git diff check passed.
