spec_id: BUG-1729
agreed_id: BUG-1729
title: Cache-refresh tests flake under host contention; refresh flock twice seen free while held
description: |
  ## Summary

  The STORY-1484 / TASK-1526 cache-refresh test family degrades under host CPU/IO
  contention. On a 6-core host, running four concurrent `aida-core --lib` suites
  reproduced failures in this family 4 out of 4 times, while the same tests pass
  reliably when the host is quiet. This is the most plausible umbrella
  explanation for the CI-only failures seen on PR #2283, which a quiet local
  machine never reproduces.

  Two distinct observations, filed together because they share the same trigger
  (concurrency) and the same module.

  ## Observation A — `single_flight_four_readers_one_refresh` fails under load

  Reproduced deterministically, 4/4 workers, first iteration each:

  ```
  thread '<unnamed>' panicked at aida-core/src/db/cached_git_backend.rs:3573:21:
  assertion failed: rows.iter().any(|r| r.title == "gen1")
  thread 'db::cached_git_backend::tests::single_flight_four_readers_one_refresh'
    panicked at aida-core/src/db/cached_git_backend.rs:3582:35:
    called `Result::unwrap()` on an `Err` value: Any { .. }
  ```

  Recipe (the filter `db::cache` prefix-matches BOTH `db::cache_refresh::` and
  `db::cached_git_backend::`, which is what makes this reproduce):

  ```
  for w in 1 2 3 4; do
    ./target/debug/deps/aida_core-<hash> db::cache --test-threads=8 &
  done
  ```

  Solo the filtered run takes ~140s; under 4x contention it takes ~360s, and the
  readers exhaust their `ReadBudget` (default 1500ms) before the refresh lands,
  so they serve stale rows with no `gen1` title. The assertion asserts a
  wall-clock outcome, not a state-machine outcome.

  Suggested fix direction: drive these assertions off the refresh state machine
  (or an injected budget, as `set_migration_wait_limit` already does for the
  migration window) rather than off ambient wall-clock.

  ## Observation B — the refresh flock was twice observed free from outside while held

  `RefreshLock::try_acquire` holds an `flock` on the `refresh.lock` sidecar. A
  probe that asks a SEPARATE process (python3, `LOCK_EX|LOCK_NB`) whether the
  sidecar is lockable answered "free" **while a guard was still alive**, twice in
  a row, when the host was at load ~26. It has not reproduced since at lower load.

  If real, this is a single-flight defect: two processes could refresh the same
  cache concurrently. If not real, it is an artifact of the probe. It is
  currently UNRESOLVED and deliberately not shipped.

  What is already ruled out, with evidence:

  - Not filesystem lock emulation. `/tmp` here is ext4 (`df -T /tmp`), so `flock`
    is real and per-open-file-description; closing a second descriptor cannot
    release the holder's lock.
  - Not external load alone. The probe test passed **60/60** in isolation with
    the host loaded. The failure requires concurrently running in-process tests.
  - Not a cross-test sidecar collision. `cache_sidecar_path` ->
    `shared_cache_path` returns the path unchanged when it is not a symlink, so
    the sidecar is `<tempdir>/cache.db.refresh.lock`, unique per test.

  The reproduction harness (an out-of-process descriptor-lifecycle test plus a
  `/proc/locks` + dev/ino diagnostic) is saved in the plan doc referenced below.
  That test was PROVEN load-bearing: injecting a lifecycle defect
  (`existing._file = file` in the nested branch of `try_acquire`, which closes
  the locked descriptor and registers an unlocked one) makes it fail with
  "the nested acquire's second descriptor released the holder's flock when it
  closed", while BOTH existing tests -- `nested_freshen_in_lock_holder_does_not_wait`
  and `nested_refresh_through_directory_alias_uses_same_registry_entry` -- still
  pass. So there is a genuine coverage gap here regardless of how B resolves.

  ## Relationship to the PR #2283 blocker

  CI run 36626825833 failed once on
  `db::cache_refresh::tests::nested_freshen_in_lock_holder_does_not_wait`
  (`cache_refresh.rs:427:9`, `assertion failed: ..is_some()`), and passed on
  re-run of that job. That assertion has now been made self-diagnosing on the
  branch: on failure it reports which of the two `Ok(None)` sources fired (a
  foreign-owned registry entry, or a contended `flock`) plus the raw errno, so a
  recurrence is root-caused from the CI log alone instead of requiring
  reproduction. That diagnostic shipped with TASK-1526; this bug tracks the
  underlying load sensitivity.

  ## Acceptance

  1. `single_flight_four_readers_one_refresh` passes 20/20 consecutive runs of
     `db::cache --test-threads=8` with four such suites running concurrently on a
     6-core host, OR its wall-clock assertion is replaced by a state-machine /
     injected-budget assertion that does not depend on ambient scheduling.
  2. Observation B is resolved either way, with evidence: EITHER the
     out-of-process lifecycle test is restored and passes 200/200 under the same
     4x contention, OR the transient free-lock is reproduced with the
     `/proc/locks` + dev/ino diagnostic and the underlying defect is fixed.
  3. Whichever way B resolves, the coverage gap proven above is closed by a test
     that fails under the `existing._file = file` injection.
