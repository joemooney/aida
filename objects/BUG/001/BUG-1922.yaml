agreed_id: BUG-1922
title: Skills and docs tell agents to run 'aida list --search', which does not exist
description: |-
  ## Problem
  `aida list --search <kw>` fails with `error: unexpected argument '--search' found`. The real command is `aida search <kw>`. The template master `aida-core/templates/skills/aida-capture.md` uses it three times (Step 2 "Check Against Database" and the CLI Reference), and `docs/agents/aida-repository-guide.md` plus the generated mdBook (`docs/book/`) repeat it. So every `/aida-capture` run hits an error at its dedup step, and agents either skip deduplication or improvise.

  ## Fix
  Replace `aida list --search` with `aida search` in the template master and the repository guide. Then run `make sync-templates` + `make check-templates`, and rebuild the book. Add a template lint (or extend check-templates) that runs every `aida ...` invocation in fenced code blocks of skill templates through clap parsing (e.g. `aida <args> --help`, or a parse-only mode), so invented flags fail CI.

  Alternative considered: add `--search` to `aida list` as an alias. Rejected for now, because `aida search` already exists and ranks results.

  ## Acceptance
  - No `aida list --search` remains in templates/docs (`rg 'list --search'` is clean outside history).
  - `/aida-capture`'s dedup step runs without error.
  - The template-command lint exists and fails on an unknown flag.
