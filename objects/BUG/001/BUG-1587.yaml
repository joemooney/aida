title: Re-running init repairs missing Codex hook runtime files
description: An initialized project can retain .codex/hooks.json while its ignored .codex/hooks handler copies are absent. aida init currently exits at the already-initialized guard before scaffolding Codex hooks, and the suggested scaffold apply command does not manage them, leaving Codex hooks to fail with exit 127. Re-running init with the Codex profile must safely restore missing handler files without resetting the store or overwriting existing customized files.
