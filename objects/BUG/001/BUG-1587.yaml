- id: 01a0c6bb-96f2-7e11-9749-e5f6e29d7ae5
  author: joe
  content: 'Root cause: every already-initialized guard returned before maybe_scaffold_codex_hooks_on_init, while .codex/hooks is intentionally ignored and can disappear independently of hooks.json. Fixed all three init modes to run a non-force Codex-hook repair before returning. The repair respects --agent and --no-hooks, preserves customized wiring/files, and restores only missing handlers. Verified with 2 new regression tests, 5 existing aida-core codex_hooks tests, cargo fmt, git diff --check, and an end-to-end initialized-project probe restoring 10 executable handlers.'
  created_at: 2026-09-22T01:29:37.778158413Z
  modified_at: 2026-09-22T01:29:37.778158413Z
