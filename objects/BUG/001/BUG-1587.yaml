- id: 01a0c6d1-1885-7d42-8b76-f7a16b64b25e
  author: joe
  content: 'Rework for reviewer RequestChanges: sibling mode incorrectly checked .aida/node.toml although standard sibling init writes .aida/config.toml. Changed the sibling already-initialized marker to config.toml and added a regression. Exact real-CLI sequence now passes: fresh init --sibling --store-path (rc 0), remove generated hook directory, rerun identical init (rc 0), 10 executable handlers restored, no populated-store refusal.'
