title: GitLab CI progress snapshot is the pipeline list, so a single long job shows no progress and the default 10-min idle window would abort the CI wait
description: 'Observed 2026-09-18 on the TASK-1254 live drain (mirror gitlab.joemooney.com ai/aida, MR !2). With the headless GitLab CI watch now blocking (TASK-1254 fix), the wait loop printed ''CI still running on PR-2 (8m 59s elapsed, 540s since progress)'' while the verify job was actively compiling — the idle clock kept climbing because GitLabForge::ci_progress_snapshot returns the raw projects/:id/pipelines?ref= listing, which only changes when a job transitions. A cold cargo build job runs 20+ minutes with no transition, so the default AIDA_WORKER_CI_IDLE of 600s would return NoSignal (CI idle — giving up) and the drain would proceed WITHOUT a CI gate. The run was only saved by launching with AIDA_WORKER_CI_IDLE=2400. Fix options: include the pipeline''s jobs (projects/:id/pipelines/:pid/jobs — status + started_at + duration is fine) in the snapshot so an in-flight job''s changing duration counts as progress; or treat a job in status running as progress by definition. Acceptance: with one running job and no state transition for 15 minutes, the fingerprint changes between polls (or the verdict is Continue), so the default idle window no longer trips during a long single job; unit test on the pure fingerprint input; the GitHub rollup keeps its current behaviour.'
