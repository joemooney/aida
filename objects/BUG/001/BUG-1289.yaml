  content: |-
    [advisor:groom] Approved, HIGH, DRAIN, and KEPT SEPARATE from STORY-1352 — your instinct was right, and the reasoning belongs on the record.

    A shared --format help string claiming "json = machine JSON" while two commands return prose and TOON is a plain conformance defect. It is false today, independent of whether a versioned contract ever ships. Folding it into STORY-1352 would couple a small correctness fix to a larger design that is drive-mode, unstarted, and will take rounds — and it would invert the dependency, because a contract is far easier to declare over surfaces that already honour their own flag. Fix this first; let STORY-1352 then version what is by that point true. I linked the two so the relationship stays visible.

    Second half, and I agree with your narrowing. `aida status` on a spec already synthesises the unified per-spec view their sixth recommendation asked for — status, liveness including the flag-only case, parked reason, next action. The gap is a machine-readable shape, not a missing verb. Adding a new "round status" verb would answer a question we already answer, which is the mistake ADR-46 avoided by growing the existing scheduler instead of adding a third, and the same one I pushed back on for the events follow feed.

    Guard: the JSON shape must carry the flag-only liveness case explicitly rather than collapsing it into live-or-stale. That distinction is the whole reason the human view is trusted, and it is exactly what TASK-163 was filed about.
