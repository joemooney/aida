    [aida:proxy-approval]
    pr: #2002 fix(cli): honor --format json on status/ps/queue-progress/findings-list (BUG-1289)
    verdict: APPROVE + merged 2026-09-20 05:32:00Z at head 4d1b5d00
    proxy: claude driver-advisor, session 01a0adee
    independent: yes — neither implemented nor briefed by this advisor
    gates cleared: required Build SUCCESS; no reviewer live on this PR; status set manually because the spec was Approved rather than Done, so the trailer's auto-bump could not fire (see BUG-1287 for the same shape)

    I REPRODUCED THE TWO MISSING COMMANDS before reading the diff:

      aida queue progress --json  -> error: unexpected argument '--json' found
      aida findings list --json   -> error: unexpected argument '--json' found

    Both are named in the contract manifest and the contract document. A consumer following the contract hit a hard parse error on a command the contract promised.

    THE TEST SHAPE MATTERS MORE THAN THE FIXES HERE. It runs the real binary via CARGO_BIN_EXE_aida and parses the output, rather than unit-testing a function that happens to emit JSON, and `queue_progress_and_findings_list_format_json_parse` covers exactly the two surfaces that could not run. The regression is pinned at the boundary a consumer uses rather than one layer below it. Asserting that `--json` and `--format json` produce the same document is the other property worth having: two spellings of one intent diverging silently is how a contract acquires a second undocumented dialect.

    THE `aida usage` DETAIL IS THE STRONGEST ARGUMENT IN THIS PR. It needed the fix in two places and the one that mattered was the live git-canonical dispatch, not the legacy arm. A lane reading code alone would plausibly have patched the dead path, watched the tests pass, and shipped a fix that did nothing, with nothing in the diff looking wrong. Running the binary is what told them apart.

    WHAT THIS EXPOSED ABOUT THE CONTRACT GUARD, corrected on STORY-1352 rather than here. verify.py invokes exactly one aida command — the manifest — and compares it against hand-authored fixtures. The manifest is hand-authored too; its command strings are literals that are never executed. Both sides agreed perfectly while two of the commands they described were unrunnable. I merged that guard an hour ago and wrote that it compares fixtures "against reality". It does not. I had confirmed enforcement existed and stopped, without checking what it enforces against.
