title: aida-server REST add-comment swaps comment author and content
description: |-
  Found while writing the BUG-1612 server tests. add_comment_legacy (aida-server/src/rest.rs) calls aida_core::Comment::new(body.content, body.author...), but Comment::new takes (author, content). A REST comment is stored with the author as its text and the text as its author.

  ## Acceptance
  - REST add-comment stores content as content and author as author (the gRPC path is checked for the same swap).
  - A test posts a comment and asserts both fields.
