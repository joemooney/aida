title: 'pr ship follow-ups from BUG-1919 review: body-marker false match, dead helper, Done children, drain calibration ignores closure hold'
description: |-
  Minor findings from the night review of PR #2497 (BUG-1919, merged 0c62bfd7ea), none of which blocked the merge:
  1. pr_ship.rs (~356-371): the body marker only has to start a line followed by any non-word character, so a changelog bullet like `- `aida: no-complete` marker is now recognised` matches once the backticks are trimmed, and the merge completes nothing. Fix: accept only the exact marker line, or the marker followed by whitespace or an em-dash; add a negative test.
  2. pr_ship.rs:329: derive_squash_subject_spec_ids_resolving no longer has any callers. Delete it.
  3. pr_ship.rs (~479-498): Done children count as open, and so does any child link (not only slices), so the parent loses its branch-name fallback. Fix: subtract rollup.done, or document the stricter rule.
  4. pr_ship.rs (~425, ~452): the note says the spec id is 'traced in the PR body only', but nothing checks or adds it to the body. Reword the note, or check the body.
  5. No test covers parsing --no-complete, ship_completion_trailer, or derive_pr_ship_squash_subject returning the trailer; and --dry-run returns before the provenance line. Add a clap parse test and print the provenance in the dry-run plan.
  6. queue_cmd.rs:8714, 12850: drain-side calibration calls derive_squash_subject_spec_ids with |_| None for the hold, so it can credit a held spec that ship itself would not complete. Pass the store-backed check.
