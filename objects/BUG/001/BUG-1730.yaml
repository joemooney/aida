id: 01a0ef93-fdf0-7853-962e-dd4488e0d89e
spec_id: BUG-1730
agreed_id: BUG-1730
title: exit_signal and runaway_seats unit tests fail on main on a quiet host
description: |
  ## Summary

  Two `aida-cli-lib` unit tests fail on `main` (`8bd9fbb3d6`) in isolation on an
  otherwise quiet host. Verified against `main` in the operator checkout, not
  merely observed on a feature branch:

  ```
  MAIN: exit_signal::tests::sigkill_fires_when_sigterm_is_ignored
    -> test result: FAILED. 0 passed; 1 failed; ... finished in 11.67s
  MAIN: runaway_seats::tests::the_watchdog_is_bounded_and_spawns_nothing
    -> test result: FAILED. 0 passed; 1 failed; ... finished in 12.78s
  ```

  Recipe:

  ```bash
  cargo test -p aida-cli-lib --lib -- --exact exit_signal::tests::sigkill_fires_when_sigterm_is_ignored
  cargo test -p aida-cli-lib --lib -- --exact runaway_seats::tests::the_watchdog_is_bounded_and_spawns_nothing
  ```

  ## Why this was not noticed

  CI's `Build (ubuntu-latest)` is green on `main`, so either these tests behave
  differently on the runner or the runner's timing satisfies them. They are both
  process-lifecycle tests (SIGKILL escalation after an ignored SIGTERM; a bounded
  watchdog), so a host-timing dependency is the likely cause — a sibling of
  BUG-1729's load sensitivity, but in a different subsystem.

  Three neighbouring tests in the same family failed only under load and pass in
  isolation, which is ordinary load sensitivity:
  `exit_signal::tests::reaps_child_after_sentinel_touch` (panicked with "reap took
  too long: 7.73368098s"), `exit_signal::tests::watchdog_trip_reaps_a_running_child`,
  `session_liveness::tests::last_process_start_event_is_linear_and_handles_chunk_edges`.
  The two named above are worse: they fail even quiet.

  ## Why it matters

  A test that is red on `main` on a developer host trains everyone to ignore local
  red, which is exactly how PR #2283's genuine CI failure nearly got waved through
  as background noise for two sessions.

  ## Acceptance

  1. Both named tests pass on `main` in isolation on a quiet 6-core Linux host,
     10/10 consecutive runs.
  2. Whatever host assumption they depend on is either removed or asserted
     explicitly, so the failure names the unmet precondition instead of a bare
     timing assertion.
  3. If the behaviour is genuinely environment-specific and cannot be made
     host-independent, the tests are gated on the precondition they need rather
     than left failing.
