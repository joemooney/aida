title: 'Human explanation: reusable Jev questions and recorded judgments'
description: |
  docs/explanations/2026-09-24-jev-questions-and-recorded-judgments.md — plain-language explanation of what AIDA's optional Jev advisory integration actually does today, verified against exposition.rs, wiki.rs, graded_review.rs, contradictions.rs, and evaluator.rs on main.

  Today there are three hand-written Jev call sites, each with its own inline question: the `aida explain` constraint-preservation audit, the pull-request graded-review criterion check, and the `aida doctor --contradictions` semantic classification of candidate pairs the mechanical sweep already found. Jev is opt-in (one environment variable), advisory only, and fails closed to a deterministic offline fallback. Each site records its answer differently — an exposition sidecar file, a per-PR verdict file, or (for the contradiction scan) nowhere at all — so there is no shared recorded-judgments log yet.

  A reusable, versioned question catalog and a shared recorded-judgments store with full provenance (source hash, question version, model, confidence, heuristic marker, payload hash, timestamp, latency) — the surface this doc entry is filed against — is a proposed direction, not yet built. Neither is an `aida jev` command of any kind, nor the "route this to developer/reviewer/advisor/architect/research" question. See the comment on this entry for the full gap list against the acceptance criteria above.

  This is a human-authored explanation, not canonical requirement text and not an AI-generated replacement for the story.
