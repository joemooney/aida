description: 'Use  at an interactive human TTY to establish a session seat. The requested seat must be in the user''s team roster; add or remove roster seats with  and  at a TTY. Child delegation is empty by default: list each permitted child seat with a repeated . AIDA launchers issue a distinct grant for each requested child seat; children cannot delegate onward unless explicitly issued delegation scope.  is only a display/routing hint and cannot grant authority. An MCP server captures the grant it starts with, so enter advisor at a TTY and restart/reconnect the server to change its authority.'
