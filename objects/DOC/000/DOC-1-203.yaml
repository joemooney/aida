  content: "Code review — DOC-6 / TASK-1591, TASK-1592, TASK-1593\n\nVerdict: NOT ready for aida pr ship\n\nThe library builds, but the test suite doesn't compile, cargo fmt --check fails at 10 locations (so make check-ci-fast is red\nbefore we even get to substance), and three of DOC-6's load-bearing requirements are unimplemented. Nothing is committed yet,\nso there are also no [AI:tool] … (SPEC-ID) commits to drive merge-time completion.\n\nCritical\n\n1. Test suite does not compile (verified, 8 errors in aida-core alone). role_for() was removed from both TeamRoster structs,\nbut 14 test call sites still use it: aida-core/src/team.rs (614, 869–897, 1014, 1039), aida-cli-lib/src/team.rs (518–545), and\naida-server/src/rest.rs:4547. Fix: keep a thin compat accessor rather than touching 14 tests —\n\n/// First rostered seat, for single-seat callers/tests. trace:TASK-1591 | ai:claude\npub fn role_for(&self, user_id: &str) -> Option<&str> {\n    self.roles_for(user_id).first().map(String::as_str)\n}\n\n2. aida-core silently destroys legacy rosters. aida-cli-lib's TeamRoster got a backward-compat deserialize_map_string_or_vec\n(string → one-element vec), but aida-core's TeamRoster did not — it's a plain BTreeMap<String, Vec<String>>. An existing\nteam.toml in the old joe = \"advisor\" format fails core's strict parse, load() does unwrap_or_default(), and the roster reads as\nempty. Then set_role_cas/allow_seat_cas write that empty roster back and (in set_role_cas's case) commit and push it — the\nwhole team's roster is erased on the first role write after upgrade. Fix: move the compat deserializer into aida-core and apply\nit to both structs (or have cli-lib re-export core's). Add a round-trip test that parses the legacy string format.\n\n3. The permission gate never reads the grant — TASK-1593 is unimplemented where it matters. gated_effective_role_for_user\n(aida-cli-lib/src/permissions.rs:290) still sources only AIDA_SESSION_ROLE; AIDA_SESSION_GRANT is consulted in exactly two\nplaces, both display/routing paths (team.rs:356, lib.rs:52699). Worse, the new strict-mode logic in gated_effective_role now\nlets the raw env var select among roster seats: a user rostered [\"implementer\", \"advisor\"] gets advisor at the gate by export \nAIDA_SESSION_ROLE=advisor — no TTY, no grant. That directly contradicts DOC-6: \"AIDA_SESSION_ROLE is only a display/routing\nhint and cannot grant authority.\" Fix: in gated_effective_role_for_user, resolve the seat from a validated grant and pass that\n(not the env var) as the seat-selection input; env alone should never move a user off roster_roles[0] in strict mode.\n\n4. allow_seat_cas / disallow_seat_cas are CAS in name only. Compare set_role_cas: pull-rebase retry loop, migrate_integer_keys,\ngit add/commit/push, reset-on-rejected-push. The new functions (aida-core/src/team.rs:1048–1075) do a bare fs::write — no\ncommit, no push, no retry, no integer-key migration. The roster edit sits uncommitted in the store worktree, is never shared\nwith the team, and is lost on the next pull. Also: disallow_seat_cas for an unknown user inserts a stray user = [] entry. Fix:\nextract set_role_cas's loop into mutate_roster_cas(store_root, user_id, f: impl Fn(Vec<String>) -> Vec<String>, commit_msg) and\nimplement set/allow/disallow through it.\n\nImportant\n\n5. role enter issues grants without checking the roster. DOC-6: \"The requested seat must be in the user's team roster.\"\nhandle_role_enter (and handle_role_add) call save_grant for any seat name unconditionally. Once finding 3 is fixed this becomes\nthe actual authority boundary, so the roster check must happen at grant time, with a clear refusal naming aida team \nallow-seat.\n\n6. Grants are not session-bound and never expire. No TTY check at role enter (DOC-6 says \"at an interactive human TTY\"), no\ncreated-at/expiry/PID in SessionGrant, no cleanup — .aida/run/grants/ accumulates forever and any process that learns a UUID\nholds the seat indefinitely. Minimum: IsTerminal check on stdin at enter, a created_at + TTL honored by role_from_grant, and\nopportunistic sweep of expired files.\n\n7. --delegate-seat is write-only dead code. delegate_seats is parsed, stored in the grant JSON, and never read anywhere (rg \ndelegate_seats finds only definition sites). No launcher issues child grants, so TASK-1592's delegation half doesn't exist.\nEither implement consumption or split it out of this PR so the flag isn't shipped as silently inert.\n\n8. Path traversal in role_from_grant (session.rs:7258). grant_id comes straight from the environment into\njoin(format!(\"{}.json\", grant_id)) — AIDA_SESSION_GRANT=../../../tmp/evil reads an attacker-placed JSON and trusts its seat.\nFix: uuid::Uuid::parse_str(grant_id)? before building the path.\n\n9. Seat matching is un-canonicalized, and allow-seat validates nothing. Both resolvers compare rr == r on raw strings then\ncanonicalize afterwards — roster Advisor vs env advisor silently falls back to roster_roles[0]. And unlike handle_team_set_role\n(which canonicalizes and checks known_role_names()), handle_team_allow_seat writes any typo straight into the roster. Fix:\ncanonicalize both sides before comparing; mirror set-role's validation in allow-seat.\n\nMinor\n\n- Traceability fails the project standard. One trace comment total (// trace:TASK-1592 atop session.rs, missing  | ai:<tool>).\n  Every new block needs one: TASK-1591 on the roster/Vec changes, compat deserializer, allow/disallow plumbing; TASK-1592 on\n  grant save/emit and the CLI flag; TASK-1593 on both resolver changes.\n- Stale docs: gated_effective_role's doc still says strict mode means \"env ignored\"; cli-lib roles_for has the old role_for doc\n  line stacked above the new one; TeamMemberDto.role's // Legacy field for UI compatibility should be a /// doc comment.\n- Duplicated grant-resolution logic in team.rs:356 and lib.rs:52699, with two different project-root derivations\n  (store_root.parent() vs find_project_root()). Extract one helper.\n- emit_role_enter_eval prints grant_id without sh_single_quote — safe for a UUID, but inconsistent with every neighboring\n  export.\n- Zero new tests for any of this: no compat-parse test, no grant save/load round-trip, no multi-seat resolution cases, no\n  allow/disallow tests.\n- Mixed-version hazard worth a release note: the new serializer writes joe = [\"advisor\"], which old released binaries parse as\n  empty roster (same unwrap_or_default failure as finding 2, in reverse).\n\nSuggested order of work\n\nFindings 1 and 2 plus cargo fmt get you to green CI; 3, 5, and 8 are the security substance of DOC-6 and should land in the\nsame PR; 4 makes the new commands actually durable; 6 and 7 are honest scope questions to settle with the spec owner\n(implement, or narrow the PR and leave TASK-1592's delegation half open). Given the architecture-tagged specs, the resolver\nsemantics change in finding 3 likely also wants a sketch on DOC-6 and advisor signoff per repo rules before the fix round.\n"
