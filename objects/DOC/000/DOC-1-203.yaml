    ## Numbered actionable current blockers

    ### B1 — Standalone Claude conversation resume retains the parent seat/grant

    **Class:** functional source gap in externally owned authority/launcher scope. **Location:** `lib.rs:26953` (`SessionCommand::Resume`) -> `session.rs:633` (`resume`) -> `:4387` (`exec_resume_command`) -> `:4405` (`exec_claude_resume`).

    **Observed fact:** the Claude branch at `:4393` passes `None` for grant_id. `Command::new("claude")` at `:4412` only sets GRANT_ENV when Some; it does not remove an inherited handle. It also does not replace AIDA_USER or issue/validate a requested child seat. The command reaches `exec` at `:4426` (or status on non-Unix). Codex/Antigravity branches here print a command instead; this finding is specifically the executable Claude branch.

    **Causal authority consequence:** a valid same-subject parent grant remains valid under `current_grant`: subject is `current_user_id` (`lib.rs:97831–97837`, AIDA_USER/USER/USERNAME); both are inherited on this branch. Validation checks expiry/roster/revocation, but does not compare its session_id to a new process/session identity. Therefore a parent handle that was valid immediately before resume can resolve the same seat afterwards and still carries the parent's delegation scope. This is a source-derived conditional consequence, not a claim that every inherited handle works or that a live exploit was executed. It is distinct from stealing another user's token.

    **Required outcome:** the supported resume entrypoint must obtain/pass an explicitly authorized distinct child grant (empty default delegation), or refuse before launching when it cannot resolve that authority. It must not silently inherit the parent handle. The DOC-6 sentence and signed sketch `:21–25`, `:45–53`, `:103–109`, `:130–132` already require this; no new publisher/framework is needed to state the gap. If existing owner work defines verified continuation rather than a new child for this entrypoint, root must obtain that actual signed contract and proof; none is established by this source path.

    **Test evidence:** existing issued-child checks at `seat_authority.rs:423–432` establish empty child sets only for calls to issue_child. They do not witness this None branch. Required future evidence is the actual standalone resume branch with a controlled vendor fixture capturing the supplied handle/subject, including parent empty delegation refusal, authorized distinct child positive, and no parent-delegation inheritance. No test authored or executed by this reviewer.

    ### B2 — Roster CLI handlers enforce terminal presence but omit known-managed-agent exclusion

    **Class:** functional source gap, externally owned roster/authority work. **Location:** `team_cmd.rs:260` / `:285` and sibling set/unset handlers `:207/246`; production dispatch in `git_backend_cmd.rs:1473–1487` and `node_cmd.rs:463–477`.

    **Observed fact:** allow/disallow calls `require_direct_tty` before write. That helper at `seat_authority.rs:136–141` checks only stdin and stderr terminal status. It does not call `require_direct_human`, whose `:148–154` already rejects nonempty AIDA_AGENT_NAME/TYPE for direct issuance. A known managed foreground agent with real terminals is therefore not rejected on that basis before the roster CAS writer. This does not allege forged TTY or malicious same-UID isolation; it is an ordinary caller classification omitted at a human-only surface.

    **Required outcome:** preserve real human-at-TTY roster positives and deny known managed-agent roster writes before mutation, using the existing direct-human boundary or a canonically approved equivalent. Current ADR-66 “Roster writes require a human at an interactive TTY” and signed sketch `:28/58/74/134` establish the obligation. The hold emergency-brake exception is unrelated.

    **Test evidence:** `role_cmd.rs:1371` tests non-TTY role issuance, not managed-agent roster writes. REST's roster endpoint is separately blocked (`aida-server/src/rest.rs:1226`, test `:4501`); that does not prove CLI coverage. Required future evidence is human TTY positive plus marked managed-TTY and non-TTY roster refusal with unchanged roster/store. No human/TTY/role env or roster witness was manufactured here.

    ### B3 — Maintained roles/ADR documentation contradicts delivered grant semantics

