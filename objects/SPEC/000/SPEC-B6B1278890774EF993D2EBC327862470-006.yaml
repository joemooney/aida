title: Native standalone pickup cannot complete queue bookkeeping under approval-never policy
description: 'Observed while implementing BUG-2384: this native seat has .aida/cache.db linked into the read-only main checkout, so CLI mutation refuses before writing. MCP update_requirement and add_comment work, but queue_done was refused with `MCP tool call requires approval, but approval policy is never`, despite the explicit pickup ID authorizing completion. The implementation is pushed at 5ea7431157d with 101 passing targeted tests, but BUG-2384 remains In Progress and queued. Investigate a supported bookkeeping path or appropriate tool approval annotations for authorized headless native pickups, retaining the store''s authority checks. The launcher/advisor needs to complete/dequeue this spec separately.'
