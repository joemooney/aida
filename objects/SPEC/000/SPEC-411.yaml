title: aida pr ship post-merge pull assumes aida is on PATH
description: 'During TASK-486 shipping, `cargo run -p aida-cli -- pr ship` created and merged PR-226 successfully, then failed at step 4 with `Error: could not invoke `aida pull` ... No such file or directory (os error 2)`. The wrapper had enough context to run itself, but the post-merge pull shells out to `aida` by name and breaks when the binary is not installed/on PATH. Manual recovery via `cargo run -p aida-cli -- pull` completed the auto-bump. Suggested follow-up: have pr_ship reinvoke the current executable (`std::env::current_exe`) or provide a clear fallback/error before merging.'
