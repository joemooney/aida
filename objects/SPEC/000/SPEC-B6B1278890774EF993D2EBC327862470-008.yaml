  content: 'Disposition (2026-11-05): CLI mutation is intended, not connector-only. Current codex_native_sandbox::codex_native_write_paths reuses contained_write_set and grants main .aida/cache-db, including SQLite sidecars. Existing TASK-2712 fixture coverage asserts the grant for implementer/advisor/unknown roles and tests actual sandbox cache writes plus optional real aida edit. In this standalone native implementer lane, .aida/cache-db resolves to /home/joe/ai/aida/.aida/cache-db and aida edit TASK-2836 --status in-progress succeeded using live binary 70a5d68133a. Store Git metadata commit was queued for the host, a separate expected protected-.git limitation. This observation does not warrant reopening cache-boundary implementation or claim all TASK-2712 publication acceptance is complete. Added setup documentation describing CLI coordination, linked-cache grant and launch-time recovery; no permission widening.'
