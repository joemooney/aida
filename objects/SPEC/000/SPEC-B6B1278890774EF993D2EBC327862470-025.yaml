title: Containment conformance Python fixtures require writable real ~/.aida in native lanes
description: While validating TASK-3780's test-only extraction, the unchanged check-ci-fast Containment conformance evidence tests gate ran 65 tests and failed with six errors. tests/test_containment_conformance.py:267,303,433,937 uses Path.home()/'.aida' as fixture_home and tempfile.TemporaryDirectory(dir=fixture_home); native workspace-write lanes refuse mkdir there with OSError [Errno 30] Read-only file system. test_role_refusal_reports_actual_diagnostic_and_keeps_tty produced three such subtest errors. Use hermetic writable temporary fixture homes rather than the real operator home, preserving production boundary assertions. No containment implementation or fixture changes made in this extraction lane. Local evidence /tmp/task3780-containment.log; relevant gate result 65 tests in 44.2s, errors=6.
