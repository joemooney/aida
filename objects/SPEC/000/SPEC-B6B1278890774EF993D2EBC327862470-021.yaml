- id: 01a1af20-2a33-7861-820e-4eb4ac611f4d
  author: joe
  content: |-
    Implemented the approved native publication declaration: native aida ship -m records a lease/spec-bound subject in the seat; fresh host launch tokens and strict declaration/single-live-non-epic scope checks precede publication effects. Standalone, drain/resume, foreground and detached background launches provision/reset the handshake. Clean exits preserve declared Refs/completing form; failed exits always downgrade to Refs; punt/hold veto first. Post-exit commits and queue publication use canonical display IDs. Updated CLI guidance, pickup templates, AGENTS.md and OVERVIEW.md.

    Validation on final source: 47 seat-publication tests, 1 scope test, 5 queue-exit tests and 5 foreground/background post-exit launcher tests passed (58 distinct tests). cargo fmt --all -- --check and git diff --check passed. Fixed a test fixture issue by limiting live-store setup to publication fixtures, preserving existing storeless trailer tests. Lane job runner was unavailable; tests were executed directly (automatic runner evidence: untested=true).

    Native handoff: all source edits remain uncommitted; no project commit, push, PR creation or queue completion performed. BUG-2459 PR #3473 remains open at last check and overlaps ship_from_seat.rs and the seat-publication fixture; host should rebase/integrate over it if it merges first. Suggested canonical host subject: [AI:codex] fix(seat): preserve native publication declarations (TASK-2902).
