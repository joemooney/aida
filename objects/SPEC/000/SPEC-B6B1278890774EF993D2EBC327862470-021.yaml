title: Native lane clean-exit commits cannot preserve approved partial-spec Refs trailers
description: 'Observed while implementing TASK-3074 PR-A under the advisor''s explicit two-PR signoff (2026-11-05 18:42 UTC): PR-A must use (Refs TASK-3074), and PR-B completes. In a native Codex seat, `aida ship TASK-3074 --no-merge --dry-run` refuses publication and requires host-side post-exit commit. `aida-cli-lib/src/ship_from_seat.rs::post_exit_message` unconditionally gives every clean exit a completing `(SPEC)` trailer, whereas only failed-exit salvage uses `(Refs SPEC)`. `open_pr` takes its title from that commit subject. Thus the default host path cannot represent this approved partial implementation without a manual host subject override. Suggested follow-up: carry an explicit non-completing/Refs publication intent through the native exit handshake, while retaining ordinary successful completion. For this pickup, host publication must use `[AI:codex] feat(mailbox): record recipient request dispositions (Refs TASK-3074)` and keep TASK-3074 In Progress for PR-B.'
