  content: 'ADVISOR RULING 2026-11-05 20:50 MST: sketch APPROVED. Authoring surface: EXTEND the native-seat ''aida ship -m <subject>''. Inside a native seat it records the lane-scoped publication declaration instead of publishing; no new command. All other points stand as proposed: binding to the lease/spec, clearing beside punt/hold, the exact single non-epic spec resolution (absorbs TASK-2907), failed exits always Refs, punt/hold vetoes first, and the regression list. Coordinate with BUG-2459 (the post-exit trailer must use the canonical display ID). If BUG-2459 lands first, rebase on it. LIGHT gate.'
