  content: 'Additional native publication evidence: `aida pr hold --reason` refused with local branch task-3074-r1329 does not exist, while `git branch --show-current` reports task-3074-r1329. Thus the supported hold command did not record a manual gate for the required PR-A Refs-title override. No forced Git operation, push or hold-marker fabrication was attempted. The host must use the explicit seat path and a non-completing commit/PR subject.'
