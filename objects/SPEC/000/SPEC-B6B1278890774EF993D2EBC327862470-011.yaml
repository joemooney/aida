title: Repair strict regen aggregate validation for committed JSON fractional rates
description: 'SPEC-447 investigation confirms the remaining strict control defect using committed Git JSON fixtures: serde_json 1.0.149 parses 1/11 and 43/44 one ULP away from count-derived division. Original in-memory controls pass; committed stub controls refuse in ControlGate::from_records/load, and independently committed ordinary trials refuse in ControlGate::apply, with ''control aggregate does not match checks''. Both characterization and consensus regression tests passed. Investigation/design: docs/plans/2026-11-04-spec-447-rate-roundtrip-investigation.md. Implement a reviewed bounded consistency check in strict require_execution only: retain exact check-derived nonempty passed/total counts; finite in-range redundant rates; exact 0/1 endpoints; proposed <=2 ULP for interior rates (survey of 131840 ratios had 13710 changes, max 1 ULP). Preserve all existing provenance, latest-reference batch/repeat identities, reference 100% pass, generated-noop stub, confinement, guard, fresh-root, flags, exit, survivor, committed-only and file-identity gates. Do not silently reuse optional display validation or change consensus policy. Replace investigation refusal assertions with positive committed-fixture regressions; add ULP boundary, nonfinite, wrong-count, materially wrong/out-of-range rate negatives and rerun authority-gate tests. Current SPEC-447 change leaves production eligibility unchanged and uses synthetic execution records in real temporary Git repositories, not a live confined execution.'
