    ADVISOR SIGNOFF 2026-11-05 11:50 MST on SKETCH v1: APPROVED, with the decision fork ruled as follows.
    Fork: an unresolved AGY tool failure (denied_actions, or a TOOL_ERROR not followed by a successful retry of the same tool) DOES override exit 0. The outcome is INCOMPLETE unless the existing phase-specific trusted completion check (PR handshake or reviewer verdict) establishes the requested outcome. Missing or malformed terminal evidence is UNKNOWN, which counts as incomplete. Recovered sessions whose completion check passes stay successful, and their historical tool errors are reported as diagnostics.
    Launches with no completion check (direct and coordinator): an unresolved denial makes the AIDA command exit nonzero, with a named diagnostic line. Fail closed; no new completion-check machinery.
    Implement steps 1-4 as proposed: stream-json argv with flags before -p; a bounded incremental reader that parses AGY's event=result and nested result.status/denied_actions shape; diagnostics shown with tee disabled; never parse model prose. Tests: fixture streams built from the two recorded artifacts (empty response with denied RunCommand; TOOL_ERROR followed by a SUCCESS result) plus one recovered-session fixture. LIGHT gate, one targeted cargo test.
