description: 'Observed while executing STORY-2460''s sketch-only native sandbox experiment with agy 1.4.12. Run a0d7722d-d013-4ddf-91a2-2ec38ad0db30 exited 0 with result.status=SUCCESS, empty response and denied_actions=[command] after print-mode permission refusal. Run 80ae5463-0380-4f26-9d8b-e75388580679, with an exact session-local command allow rule, exited 0/status SUCCESS despite run_command TOOL_ERROR before payload execution: ~/.gemini/antigravity-cli/bin/agentapi was read-only under outer Codex lane. No test sentinels were created. These are not empirical native sandbox passes. Triage whether AIDA''s AGY adapter must classify denied_actions/tool errors/absent positive completion evidence instead of trusting process exit. Preserve explicit pending/failed outcome without interpreting every recoverable tool error as final failure. Full bounded-run evidence and limits are in SKETCH v1 on STORY-2460; transient artifacts /tmp/story2460-pdqj_i8_/. No production changes made.'
