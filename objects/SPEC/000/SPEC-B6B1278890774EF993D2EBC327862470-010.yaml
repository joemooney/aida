  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-2838):
    Verdict: CHANGES REQUESTED
    Reviewed commit: 86031040947c
    Recorded: 2026-11-06T01:26:52.207515779+00:00
    Findings:
    1. BLOCKER (CI): CI (lib-1) failed in step 'Run tests' at 86031040947c (job 127642901620, run 42141581368); aggregate Build (ubuntu-latest) is therefore red. main f0d924ce776 and the previous head 26a173a39f8 both passed lib-1, so the failure appeared with the merge from main. The reviewer sandbox could not fetch the job log (blob host denied). Identify the failing test from the log and fix it, or prove it is an unrelated flake with a green rerun at the same SHA. All other jobs passed; merge-hold-gate is red only because of the review hold.
    2. MINOR (correctness/flake, likely lib-1 cause): aida-cli-lib/src/agy_outcome.rs CoordinatorPipe::read checks 'stop' BEFORE poll(). Once coordinator_status sets stop after its 250 ms post-exit recv_timeout, any data still buffered in the pipe is discarded with TimedOut, which sets invalid=true. If the reader thread is delayed on a loaded host or a slow forward file, a clean ERROR+RETRY+SUCCESS run is reported as 65 instead of 0, and an explicit terminal ERROR as 65 instead of 1. The tests task_2838_structured_evidence_and_launch_wiring (coordinator loop expects 0/65 via cat) and task_2838_coordinator_bounds_descendant_stdout (expects 1) assert exactly these timing-sensitive outcomes. Fix: after stop, keep reading while poll() reports POLLIN, and cancel only when poll returns no data. That gives an idle-time grace, not a wall-clock one. Or join the reader with a grace measured from the last byte. Add a regression in which the reader is delayed past 250 ms while data is buffered.
    3. COSMETIC (test coverage): two paths are verified only by inspection. (1) The MAX_TOOLS overflow path in Evidence::line, which sets invalid=true once there are more than 256 distinct failing tools. (2) The stderr 'AGY outcome:' diagnostic line that the advisor ruling requires for direct/coordinator launches with tee disabled. Pin both with a targeted test.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
