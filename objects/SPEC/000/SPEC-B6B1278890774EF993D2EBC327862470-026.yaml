title: Define archive-aware gate-ledger retention before automatic closed-change rotation
description: 'BUG-2531 partial implementation scopes aggregate selection payloads to relevant change ledgers and adds a 50% capacity warning. Automatic closed/merged rotation is not implemented: checked selection refuses by-spec references to missing active ledgers; direct change, audit, carry-over, legacy import and append readers all assume the active path. Simply moving files and pruning indexes can hide older refusals and make reopened-change history disappear. Decide an archive-aware read/write and revival contract (including missing/stale index discovery, concurrency under the ledger-wide lock and retention/forge-closure evidence), then implement rotation with regressions. Current discovery still strictly inspects all active files under independent per-file caps; this slice isolates aggregate byte exhaustion, not discovery I/O growth.'
