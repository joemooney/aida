spec_id: SPEC-442
title: History strftime templates reject decoded event timestamps
description: 'Discovered during bounded STORY-1477 R1-R3 rework of PR #2224, not an independent review. Exercising proposed R2 MCP example template={date:%H:%M} {id} {event} against the isolated tests/test_history_templates.py fixture returned history: invalid_arg: invalid event timestamp (log /tmp/story-1477-rework-direct-smoke.log). history.rs decode path constructs Event.timestamp with human_timestamp(&commit.iso_timestamp) around line 2126; event_record copies that string around line 2553. history_layout.rs format_date parses RFC3339 around line 133. Existing unit fixture uses an RFC3339 timestamp and misses the real feed mismatch. This behavior exists in original head 30fb7000634c5d5d3e554dacbae9980e63afa4c6; it is distinct from the earlier far-future Git bound finding SPEC-441. User explicitly limited this rework to advisor R1-R3, so no timestamp/decoder/rendering repair is made. R2 will use valid working string example {id} {event}; report this unresolved acceptance issue to product/advisor for separate authorization/sequencing. Reproduction uses temporary HOME and throwaway git-canonical repo, never operator config. Expected: real CLI/MCP event rows render date strftime placeholders with approved local-time semantics without altering default JSON/history contracts.'
