title: Adjacent BUG-2130 fixtures still assume host namespace or PID above 2
description: 'TASK-2889 validation with a freshly built debug lib-test binary: both assigned regressions pass. Broad bug_2130_liveness_identity_tests run passed 5/7; unchanged worktree_gc_owner_is_caller_matches_legacy_lease_and_exact_caller fails because sample_lease omits pid_namespace, and review_authority_tokens_match_across_legacy_and_exact fails when the test binary is exec''d as PID 2 because it constructs unqualified process tokens (production intentionally refuses unqualified PIDs 1/2). Confirmed both failures on older pre-change artifact /tmp/task-2889-baseline/deps/test-lib (copied from target/worktrees/aida-seat-aida-task-b6b1278890774ef993d2ebc327862470-801/agent/deps/aida_cli_lib-82ec29df8be17ceb). GC failure reproduces in broader run; token failure reproduces with exec env -u AIDA_PROJECT_ROOT -u AIDA_DRIVE_ROOT -u AIDA_REVIEW_VERDICT_FILE TMPDIR=<private-dir> <old binary> --exact bug_2130_liveness_identity_tests::bug_2130_review_authority_tokens_match_across_legacy_and_exact --test-threads=1. These are separate fixtures from the two covered by TASK-2889/TASK-2900. Adapt fixture namespace evidence and use a suitable live PID without weakening production checks. No outside-seat baseline was run.'
