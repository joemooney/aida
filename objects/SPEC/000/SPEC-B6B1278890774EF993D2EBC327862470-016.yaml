title: Top-level lib test homes still use PID-only names across native PID namespaces
description: While validating TASK-2861, dispatch neighboring tests intermittently lost advisor/reviewer grant files (14/19 passed in a parallel module run; 9/19 in another namespace). test_home.rs create_test_home uses /tmp/aida-lib-test-home-<pid> and removes an existing same-name directory; sweep_stale_test_homes probes bare PIDs from its own namespace. Separate native tool invocations share /tmp but reuse local PIDs, so neither operation establishes ownership of another namespace's home. A private TMPDIR made the named dispatch regression pass. TASK-2861 gives run_path_isolated_test children a unique private TMPDIR; top-level non-isolated lib test binaries remain exposed unless their runner supplies a private TMPDIR. Follow up with namespace-safe unique home ownership/cleanup and a concurrent cross-namespace regression, without weakening authority checks. This is a source-supported diagnosis; no outside-seat baseline was run.
