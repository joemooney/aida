  content: 'Implementation: atomically allocate private randomized test homes, qualify stale cleanup by Linux boot UUID and PID namespace device/inode, and retain legacy/foreign/unknown homes. Namespace-local kill(0) probes require ESRCH before cleanup because procfs can belong to an ancestor namespace. Added deterministic ownership/fallback tests and a live concurrent unshare regression with two PID-1 test binaries sharing TMPDIR; validation compiling.'
