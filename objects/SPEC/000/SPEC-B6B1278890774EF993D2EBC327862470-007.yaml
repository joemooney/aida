title: Native Codex worktree launch mounts .git read-only and omits writable shared cache
description: 'Standalone headless implementer for STORY-2346 on 2026-11-03 can edit assigned source worktree but cannot stage changes: git add fails `Unable to create ''<worktree>/.git/index.lock'': Read-only file system`. The session filesystem profile explicitly marks .git read-only and grants no shared main-checkout metadata. CLI `aida edit` also refuses the .aida/cache-db/cache.db symlink into /home/joe/ai/aida/.aida/cache-db as not writable; connected AIDA MCP updates succeed. This blocks the required commit/push/PR lifecycle. Preserve source edits and hand off with an appropriately configured native launch; do not work around the filesystem boundary or mark Done before a committed branch. Review native vendor launch grants for worktree Git metadata and the cache-only directory.'
