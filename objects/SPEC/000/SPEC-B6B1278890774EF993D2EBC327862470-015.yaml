title: Native implementer finish prompt still requires commits and a PR from a read-only git seat
description: 'Observed while implementing BUG-2452 in native Codex seat /home/joe/ai/aida-worktrees/aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-218: the injected pickup/standalone finish instructions require commit, push, queue done and an open PR before stopping, but git commit fails on read-only .git/index.lock. TASK-2712 / codex_native_sandbox explicitly requires leaving pending changes for the host-side post-exit commit and host `aida ship --from-seat ... --commit-pending ...` publication. The test runner also correctly reports no lane job runner for this agent-new launch; direct local tests passed (35). Align native finish prompts and launcher result classification with the host publication handoff so tested pending work is not mistaken for either success or an empty rework before host commit. BUG-2452 code is staged and its publication command/test evidence are recorded on the spec; no commit/push/PR was possible in the seat.'
