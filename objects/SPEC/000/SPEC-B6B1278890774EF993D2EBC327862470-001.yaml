  content: |
    # TASK-2712 — FULL SKETCH, awaiting independent signoff

    Author: codex-advisor-16, companion advisor, 2026-11-01. This is a proposal, not an approval, implementation, dispatch, completion, or claim of passing acceptance. A DIFFERENT independent advisor must judge it. Implementation of overlapping launch/authority code is serialized after BUG-2398 completes.

    Exact owning object: `SPEC-b6b1278890774ef993d2ebc327862470-001` (UUID `01a19600-3f6f-7672-b6b2-6611ff226175`), current display/agreed ID TASK-2712, actual type Task despite its legacy SPEC prefix, parent EPIC-612. Read the current canonical object, all four ACs and both comments, not only the /tmp scope copy. Its corrected disposition restores the native owner and supersedes TASK-2714. BUG-2398 remains its existing implementation blocker. Read BUG-2398's full current AC3, comments including adopted signed B1-B4 and expanded independent approval, STORY-2238's sketch and signed C1-C12 amendments, and TASK-2707's current acceptance. No relationship, queue, status, authority record, or gate is changed by this sketch.

    ## 1. Decision and present availability

    Choose an explicit, typed, per-launch HOST collection/publication and own-coordination service. Keep Codex workspace-write / approval never and its source `.git` protection. A normal managed implementer invokes installed AIDA client verbs through ordinary native tool shells; its already-running AIDA launcher/supervisor handles typed operations without another advisor/publisher session or escalation. This is a product service, not an agent-created /tmp publication checkout or a free-form host shell deputy.

    The service does NOT exist today. Existing `ship_from_seat` is a useful one-ref publication precedent, not a ready native transport: it expects a recorded contained seat and a bundle already made by that seat. Existing deputy jobs are not this service and must not accept native publication shell jobs. Do not describe either as implementing this proposal. TASK-2712 implements the narrow service itself; it does not wait for the complete STORY-2238 backend.

    The service owns a private, durable publication Git repository, index and exactly one implementation branch, associated with exactly one source/clone identity + lease + child grant + process lifetime. Typed stage/commit operate THAT index/ref; they do not unlock the source `.git`, shared common dir, or run `git add/commit` in the source. This is the selected host-channel interpretation of own Git index/ref workflow. Source HEAD/index remain at their captured state; source dirty files remain available. The publication receipt identifies both source HEAD and published HEAD explicitly. Every launcher completion/PR consumer must use this bound receipt, never substitute source HEAD. This difference is deliberate user-visible behavior, not a silent workaround. No source-metadata reconciliation is attempted by this task.

    A sanctioned custom native profile may express filesystem exceptions, but filesystem access alone cannot enforce grant revocation, branch/lease ownership, ref CAS, host config safety or attribution. No claim that ALL native scoped permission arrangements are impossible is made. The selected route avoids overriding protected SDK metadata paths entirely. No danger-full-access, blanket root, SDK protection bypass, parent/sibling grant forwarding, inherit=all, global user configuration/approval change, or bearer/key in argv.

    ## 2. Source-backed basis and limits

    Repository read at HEAD `471540a8c477a50a81170f338d81532cb5dbd329` (moving main: implementation must reread after BUG-2398). Installed executable `/home/joe/.nvm/versions/node/v24.12.0/bin/codex`, resolved npm launcher `.../lib/node_modules/@openai/codex/bin/codex.js`, reports `codex-cli 0.166.0`. Actual `--help`, `sandbox --help`, `mcp --help`, `app-server --help` were read. CLI has `--add-dir`, `--sandbox workspace-write`, `--ask-for-approval never`, per-invocation `-c`; model-free sandbox instead uses `codex sandbox -P :workspace -C <fixture> -- <command>`. Do not assume these two command surfaces take identical flags.

    Version-tagged upstream source retrieved read-only into `/tmp/aida-TASK2712-codex0166/`:
    - `codex-rs/protocol/src/permissions.rs`: `FileSystemSandboxPolicy::workspace_write`, `default_read_only_subpaths_for_writable_root`, `with_additional_legacy_workspace_writable_roots`, `metadata_write_denial`. The workspace policy protects `.git` and a worktree pointer's resolved gitdir, `.agents`, `.codex`, `.aws`. Explicit rules exist, so “0.166 cannot represent any exception” would be false.
    - `codex-rs/linux-sandbox/src/bwrap.rs`: `create_bwrap_command_args`/filesystem assembly reapply RO subpaths and daemon socket masks. A broader workspace root does not establish safe own-Git semantics.
    - `codex-rs/linux-sandbox/src/seccomp.rs`: `install_network_seccomp_filter_on_current_thread`, Restricted case denies `connect` even though it permits AF_UNIX socket creation; ProxyRouted case has separate Unix-socket restrictions. Therefore this design does NOT assume an arbitrary Unix listener is available, enable all Unix sockets, change networking policy, or borrow Codex's daemon socket.
    - `codex-rs/core/src/config/mod.rs`, `core/src/config/permissions.rs`, `config/src/permissions_toml.rs`: legacy workspace and named profiles are distinct compilation/configuration surfaces, not a grant/lease-aware AIDA publishing API. A future SDK-specific alternative needs its own evidence/signoff.

    Primary upstream source links: https://github.com/openai/codex/blob/rust-v0.166.0/codex-rs/protocol/src/permissions.rs ; https://github.com/openai/codex/blob/rust-v0.166.0/codex-rs/linux-sandbox/src/bwrap.rs ; https://github.com/openai/codex/blob/rust-v0.166.0/codex-rs/linux-sandbox/src/seccomp.rs . Fetched official configuration/security documentation: https://learn.chatgpt.com/docs/config-file/config-reference and https://learn.chatgpt.com/docs/agent-approvals-security . Current web documentation is contextual; installed CLI and version-tagged source govern this sketch's syntax. The fetched release tag ref is retained in `tag.json`; version-tag source correspondence is not a cryptographic attestation of the installed binary.

    Actual local synthetic nested probe: `/tmp/aida-TASK2712-native-probe-result.json`, with fresh 0700 HOME/CODEX_HOME/workspace, inherit=core, no auth/model/real store. Installed `codex sandbox -P :workspace ...` returned 1 BEFORE running the probe: `error building bubblewrap command: app-server socket directory must be a user-owned directory with mode 0700`. Do not repair/mask the user's directory from this session. This is NOT passing host smoke, a Git-lock result, or proof the proposed service works. Prior spec comments report successful host native fixtures under other preparation; neither those nor contained probes substitute for this task's required actual host/native gate. No cargo or code tests ran here.

    Current AIDA source facts:
    - `agent_launch.rs::tool_contained_flags` emits workspace-write/never for native Codex. `session.rs::headless_vendor_args{,_contained_in}` removes bypass only for the selected managed posture. No new uncontained fallback is allowed.
    - `gate/seat_authority.rs::grant_check_at`, `grant_check_for`, `presenter_tokens_for`, `possession_token`, `issue_launch_child`, `bind_grant_to_pid` supply existing authority checks. BUG-2398 signed B1-B4 finalizes only explicit child metadata immediately before spawn, preserves companion and present-empty baseline, and excludes bearer tokens. Reuse it; do not redesign grant discovery/keyrings.
    - `aida-core/src/git_ops.rs::host_git_command` explicitly REFUSES host execution in a leased seat clone; `contained_seat_git_command` is only for proven contained execution. General code-tree hardening is not a promise to ignore all config. Neither helper may be relabelled as a safe native host publisher.
    - `ship_from_seat.rs::{single_branch_head,verify_bundle,stage_bundle,seat_trailer_check,explicit_spec_check,finish_published}` and `gate::ledger::open_change_bound` are reusable checks/ledger/forge seams, not permission to run Git in native source trees or infer PR success.
    - `Storage::update_atomically` delegates git-canonical updates to `GitBackend`; `db/store_lock.rs` is the existing store writer lock. `db/cache.rs::CACHE_SANDBOX_SIDECARS` names `-wal`, `-shm`, `.refresh.lock`, `.refresh-request.lock`. Canonical persistence, cache update and store Git must retain their real lock/hook/transport contracts.

    ## 3. Owner, trigger and concrete surfaces

    Proposed new owner `aida-cli-lib/src/native_workflow/{mod,protocol,client,supervisor,authority,collect,publish,coordination}.rs`, plus isolated Git plumbing in proposed `aida-core/src/git_ops/native_publication.rs`. Names below are proposed symbols, not assertions that they already exist:
    - `NativeWorkflowPlan`, `prepare_native_workflow`, `NativeWorkflowGuard`, `serve_native_workflow` own preparation/readiness/lifetime.
    - `NativeRequestV1`, `NativeResponseV1`, `BoundChild`, `authenticate_request`, `revalidate_bound_child` own closed schemas and authority.
    - `capture_snapshot`, `SnapshotManifestV1`, `ValidationClaimV1`, `NativePublicationReceiptV1`, `commit_snapshot`, `push_pinned_branch`, `open_bound_change` own byte/evidence/publication identity.
    - `apply_own_coordination` invokes existing permitted operation handlers with a validated explicit caller context.

    Integrate at the actual final spawn/exec seams in `session.rs::{exec_codex_session,run_vendor_headless_child,spawn_reviewer_launch_plan_granted}` and `agent_launch.rs::{build_agent_new_bg_command,run_tracked_agent_after_spawn,supervise_spawned_child}`/foreground child launch, after BUG-2398 finalization. Inventory additional Codex spawn paths as that fix does. Native implementer ordinary launch prepares this service automatically when publication/coordination is requested; reviewer launch only receives applicable own-coordination operations, not implementer commit rights. Do not introduce a broader role matrix. Other vendors and existing contained paths retain behavior.

    Proposed explicit CLI: `aida native-workflow capture`, `stage <snapshot-id> <relative-path...>`, `commit <snapshot-id> --message-file <file>`, `push <commit-id>`, `pr <commit-id> --body-file <file>`, `coordinate <closed-operation>`, `status <request-id>`, `retry <request-id>`. Message/body are bounded UTF-8 DATA copied by the client, never shell/script paths executed by the host. Final verb names may be mechanical naming changes; adding arbitrary argv, cwd, executable, env or raw store payload is a design change requiring judgment. An aggregate `publish` may orchestrate the SAME idempotent phases, not bypass them.

    Trigger = a typed request issued by the child, not child exit. Host starts the service at managed launch, outside the native tool sandbox but bound to its existing AIDA-owned supervisor. Before model readiness: pin source/policy/forge/lease/own child grant; prepare private service state; apply final child metadata; bind actual model PID/start/pidfd and lease; complete actual-native model-free channel/authority preflight; then release readiness. A blocked service/preflight means a named failed native workflow launch, not successful roleless work. Foreground exec uses a retained supervisor process rather than losing the owner through exec; existing supported headless/background lifecycle retains a supervisor until child reaped. This does not add support for an otherwise unsupported native background launch or a daemon that cannot be bound to the actual worker.

    ## 4. Transport, authenticated collection and lifetime

    Use a per-run file protocol, not MCP approval exemptions, a Unix host-exec socket, model polling, a scheduled task, or free-form shell jobs. The host precreates one 0700 request/response exchange directory in the child's already-admitted native scratch/workspace runtime area. Its nonsecret path/run ID go in launch context already conveyed by BUG-2398; no additional key/token/parent env whitelist. Native excludes /tmp or a required write spelling? Select the verified workspace runtime spelling; if neither is admitted, refuse. Do not enlarge roots to make this pass.

    Keep authoritative run records, immutable snapshots, Git repository and journal OUTSIDE native writable roots, under a pinned host-owned common-Git runtime namespace. Preparing this namespace is a trusted launcher operation. Per-run permissions and native `.git` RO protect it; do not trust read-only mode bits alone for same-uid protection. Fail if the resolved host state is writable through a native alias. Never grant the child that common dir. Exchange files are UNTRUSTED even at mode 0600.

    The trusted host watches the pinned inbox with inotify, handles only atomic ready-file publication, and blocks in an event loop shared with pidfd/lifecycle shutdown. Startup and overflow perform a bounded rescan; invalidation/replacement refuses. No timer/polling/scheduler or unattended run enablement. Request deadlines are bounded operation waits, not recurring jobs. Exhausted limits return a typed refusal; no shell fallback.

    Authentication: at issuance, the host binds the run to EXACTLY the own delegated child grant and retains its existing key-possession context. Client reads only that own selected grant/key through the existing grant/keyring contract. No scanning parent/sibling keys or authority discovery. Use a domain-separated MAC derived in memory from the existing child secret, fresh host challenge and full canonical request digest (version, run, counter/request UUID, expected child/lease/source identities, operation, payload hashes, expected refs). Secret bytes never enter files, argv, logs or config. The host verifies against its fixed child key context, not a request-selected grant. This authenticates collection of DATA, not a new grant: existing authority validation still runs. HMAC encoding/domain separation/challenge replay tests are required new protocol work and require independent signoff here. This is not BUG-2398's rejected ambient keyring pointer scheme.

    Bind challenges to the host-observed live model process's PID/start and pinned lease/subject/scope; do not accept an env-named PID as ownership. If authenticating the actual tool process is needed, include its PID/start and verify host-observed descendant ancestry, while retaining the launched child's pidfd. Namespace mapping unknown => refuse requested channel rather than assuming ancestry. PID reuse, child reap, grant revocation/expiry, lease transfer or service owner death ends mutation authority; durable results remain inspectable. No new lease/grant lifetime, renewal or sibling/parent authority. Existing ADR-66 same-uid selector/key replay residual remains; this service additionally rejects any selector different from the run-bound child even if its key is possessed. It does not claim OS isolation from a hostile same-uid host process.

    Requests use strict versioned structs/closed enums, deny unknown fields, bounded file/aggregate sizes and counts, monotonic counters and idempotency keys. Reject symlink/nonregular/multiply linked request files, traversal, special files and changed content; open relative to pinned directory handles with O_NOFOLLOW/O_NONBLOCK and copy bounded bytes once. MAC covers exactly copied bytes. Host responses are data with request/snapshot/commit IDs and per-phase truth; only the protected journal establishes completion to the launcher. A child-forged/replayed response cannot create author credit, PR success or queue completion.

    ## 5. Snapshot, source identity and validation scope

    At launch pin clone binding, root dev/inode/mount identity, `.git` pointer bytes and gitdir/common-dir identities, tree kind, symbolic branch and expected head, canonical owning spec UUID, lease ID/ownership and actual child identity. Values come from trusted launch facts, not a request's cwd/branch/env. The source branch must still be exclusively owned by this lease; wrong/unrelated/default branch, a live competing owner, or changed branch/root refuses. Distinguish original source HEAD from subsequent host publication refs.

    Host collection is a two-phase handshake: client requests capture with a declared bounded relative path set; host builds and returns an immutable candidate; client accepts its manifest digest, and all later stage/validation/commit operations name it. Never accept a caller-chosen tar/patch pathname as authority or run source Git to create a patch. Collect tracked differences plus explicitly selected untracked files from the pinned source; do not publish unrelated dirty files automatically.

    No host traversal through writable symlink components. Use pinned root dirfds and beneath/no-symlink traversal, read regular files through handles with pre/post inode, type, size, nlink, timestamps and digest; reject hardlink aliases/special files. A versioned manifest represents relative byte-safe path, add/delete/mode, previous blob and exact new content hash. Reject `.git` components, metadata/control/grant/lease paths and protected directory overlaps. Treat executable bit as data; never execute the file. Symlink entries, if supported, capture ONLY the literal target without following it and refuse protected/escape targets; initially unsupported cases return precise refusal rather than flattening them. Gitlinks, LFS/external filter transformations, ambiguous case/path encodings, sparse/unsupported source formats fail named pending a separately signed extension.

    A cooperative source lock is necessary but not a filesystem snapshot against arbitrary writers. Therefore the IMMUTABLE captured bytes define the candidate; do not claim a globally atomic source tree just from two stat passes. Recheck source identity, branch/lease and the full declared capture-set digest immediately before final capture acceptance and before publication; changes require a new snapshot (do not recapture silently). This gives exact artifact identity even when an old source changes later. Hash/record excluded dirty paths so the client sees what was left out. Never reset, clean, stash, overwrite or auto-resolve the original source.

    Validation records bind snapshot digest, tested tree/base, full relevant captured inputs, actual tool version, command/argv identity, exit state and output digest. Agent-supplied records are labelled CLAIMED. Exit 0 from the agent, a shell, cargo or the publisher is not validation authority. Validation performed on the old mutable source does not automatically transfer to a candidate: require matching captured input manifest and known scope, otherwise record UNTESTED. If requirements demand trusted local validation, run only a fixed reviewed recipe in the same-or-tighter native sandbox on the sealed candidate, with synthetic/isolated state as applicable; the host never executes branch-selected tests/Makefiles as host authority. Existing original validation logs are retained, not replaced by a new misleading pass. CI and fresh independent review remain separate at the published head. Publication may truthfully open a PR with unknown local evidence where existing policy permits; it may not claim tests passed or release any gate on that basis.

    ## 6. Trusted Git, objects, refs and forge races

    Host Git executes ONLY in its own pinned private repository with a host-authored, validated minimal config. It never uses source `-C`, source gitdir, source config/includes/config.worktree/hooks/info/alternates, environment redirects, or the source PATH. Pin an installed trusted Git executable (not a source-built binary), fixed argv, clean explicit environment, isolated HOME/XDG, no system/global config. A minimal repo config is generated from typed host facts; reject unexpected config/files/ownership/link identities on every entry. `core.hooksPath=/dev/null`, fsmonitor/maintenance/auto-GC off; no pager, signing command, editor, external diff, textconv, clean/smudge/process filter, recurse/submodule helper, arbitrary credential/askpass/SSH command or external remote helper. Disable replacements/grafts/alternates/promisors and use explicit object/ref inputs. `GIT_CONFIG_NOSYSTEM` and global=/dev/null ALONE do not disable local config; the separate safe repository is essential. Preserve original hooks/config and protected metadata byte-for-byte.

    Build blobs via `hash-object --no-filters --stdin`, construct the private index/tree from typed mode/OID/path data, and commit with fixed `commit-tree` arguments/data. Pin expected parent. No `git add` over source, checkout filter, `--all`, hooks, `eval`, `sh -c` request, path-derived helper or arbitrary bundle execution. Trusted base objects arrive through the pinned trusted remote or already host-owned validated object cache, not `--shared`/alternates/hardlinks into agent-writable storage. Verify objects/hashes/connectivity and exact resulting tree; corruption or unexpected extra refs/parents refuses. If reusing one-ref bundle checks, import into quarantine first and do not treat successful parsing as authority. Prefer constructing the commit from the captured manifest so no agent-created object database crosses the trust boundary.

    Git staging/index locks and ref transactions occur in the service-owned repository. Under a permanent per-source/branch workflow lock, authorize each operation and use `update-ref <own-ref> <new> <expected-old>` (or a transactional equivalent) with complete OIDs. Only the bound branch/ref namespace is addressable. Revalidate launch identity/lease and fresh grant after lock acquisition and immediately before mutation; require source branch still at launch-captured source head and publication ref at its separately expected tip. Index staging and ref advancement are separate journal phases; no multi-file atomicity claim. An unexpected index/ref/config change refuses and retains the candidate. Crash after CAS is recovered by inspecting journal + actual ref/object identity, not rerunning commit blindly.

    Remote URL, forge repository/base and branch are pinned from trusted launch/default-branch configuration; never read a branch-edited origin, URL rewrite or helper. Start with a supported credentialled HTTPS path whose transport uses installed trusted helpers ONLY from separately trusted policy, or a fixed host credential adapter; never use an agent-provided helper/config/askpass value. Unsupported SSH/custom helper deployments refuse with a concrete supported-path message; no global config edit. Credential bytes remain host-side and out of argv/logs/responses. No local-path/file/ext remote accepted from a production request (fake local forge is an explicit test seam).

    Push one explicit refspec with expected remote old OID. An explicit `--force-with-lease=<exact ref>:<old>` may be used solely as the atomic comparison primitive after proving the new commit descends from that exact old; this never authorizes non-fast-forward replacement, reset or force publication. New branch expects absence. Read back the remote ref independently; exit 0/forge output alone is insufficient. Lost response after push => UNKNOWN until bounded readback resolves it. Remote advance/branch capture/competing publisher refuses; no automatic rebase, merge or different branch selection. A distributed remote owner that changes a branch to the identical OID is indistinguishable from no ref change without server ownership enforcement; retain this Git CAS limitation rather than claiming an ABA-proof forge lock.

    PR lookup/create uses typed `Forge`/`OpenChange` and `gate::ledger::open_change_bound` with exact branch/base/repository, current published SHA, owning spec and run-bound author. Re-read returned PR identity and head. Lookup unknown/error is not NoChange. Timeout after create => lookup same idempotency identity before retry; never duplicate blindly. A PR that now points elsewhere is not publication success. The ledger records original implementation child/lease as AUTHOR, host service as mechanical publisher, model/vendor/version evidence as actually known. It must not credit this service as independent reviewer or approve its own work. Launch/source/published OIDs and validation provenance remain separate fields.

    Normal independent review, required CI at the right head, merge holds, authority checks, mandate exclusions and operator merge floor remain intact. This channel ends at verified PR handoff; it has NO ship/merge/approve/hold-clear/mandate-arm/disposition verb. No raw `gh pr merge`, no status Completed from publication, no fabricated review receipt, no exit-0 completion inference.

    ## 7. Own-scope canonical store/cache and compatibility

    `apply_own_coordination` supports only typed own-work actions already allowed by existing handlers: own-spec comment/progress, allowed implementation lifecycle transition, own lease progress/end when normal evidence permits, and linked publication/author ledger recording. Add other ordinary own-work actions only after enumerating their existing validator and tests. It does not invent authority for them. UUID resolves from the launch's canonical spec, including legacy-prefix/display aliases. A request cannot name another spec/root/branch, write arbitrary YAML/SQL, alter grant/lease records directly, widen a role, issue/revoke another grant, enqueue agents or clear holds.

    Each operation must validate the SAME live child grant, subject, project, role, scope, lease/process and parent-chain/revocation facts from the bound context, then invoke the ordinary existing authorized mutation seam. The host's advisor/operator identity and inherited parent environment are never used as fallback. Do not mutate process-global env in a threaded host. Factor only the minimal explicit caller-context adapter needed to reuse current validators; no public “trust this caller” API or synthesized approved authority map. The collection MAC is possession evidence, not permission to skip the existing checks.

    Canonical updates use `Storage::update_atomically`/GitBackend and the existing store writer lock. Re-read own object/version under that lock, compare expected object revision where a stale update could overwrite, preserve provenance/hypothesis/transport/evidence rules. Cache updates use existing strict mutation/cache locking, exact resolved cache and WAL/SHM/refresh sidecars; the host handles the real canonical target even when the source exposes a read-only or outside-root symlink. This route does not grant the child direct shared-cache/store writes and does not claim an env override fixed them. Resolve symlink spelling from host-recorded main/store identity, pin the target and refuse target replacement or unrelated store. No broad `.aida`/HOME access grant.

    Store Git persistence uses existing `git_ops::host_git_command`, verified versioned shipped store hooks/profile and existing transport trust/locks, not source hooks or a new arbitrary Git wrapper. The shipped hook/profile executable/config closure must be verified as currently required; any newly encountered agent-controlled execution path refuses. Never treat the current general host Git helper as safe for source publishing. Do not bypass transport refusal or push after an evidence refusal.

    Journal canonical write, store commit and cache refresh independently: object write committed with cache refresh failure is “canonical committed; cache stale/failed”, not rolled back by clobbering newer data or retried as a second comment. Return exact object/store revision and cache state. A partial canonical persistence failure retains the object/current dirt and names the existing supported recovery command, without hand-editing the store. No all-or-nothing promise across code Git, remote forge and store/cache.

    Wrong/absent/empty/revoked/expired/foreign/scope-mismatched grants REFUSE every new channel mutation. Existing authority-requiring operations keep their validator refusals. Existing NONAUTHORITATIVE absence compatibility remains: particularly a named ungranted review artifact may still be recorded by the old recorder, presented invalid grants refuse, and such artifacts confer no positive review authority under BUG-2398's expanded AC3. Protective refusals still protect. Do not gate every old CLI/MCP/artifact path behind a newly invented mandatory grant policy. New channel tests must separately prove its strict absent-grant refusal and that existing recorder compatibility survives.

    ## 8. Failure and recovery contract

    Durable phase machine: Prepared -> Authenticated -> SnapshotAccepted -> Staged -> Committed -> PushVerified -> PrVerified -> CoordinationRecorded, with distinct Refused/Failed/Unknown outcomes per phase. Acceptance is never publication; publication is never review/merge. Every step records request UUID, immutable hashes, expected/observed refs, source identity, own child and author credit. Receipts are persisted before reporting success, and source/published tips are never conflated.

    On source replacement/symlink/race, branch capture, live competing owner, bad grant, validation failure, unsafe Git/config, push refusal or PR error: keep original source bytes/index/HEAD and dirty work; retain sealed snapshot, logs and any already-created private commit/ref. No cleanup/reset/branch deletion or automatic overwrite. Revocation stops future operations, never pretends a remote write already accepted was undone. No remote rollback after a partial success.

    Print/runbook uses exact IDs and paths from the trusted journal, for example `aida native-workflow status <request-uuid>` and `... retry <request-uuid>`; retry is authorized afresh against the SAME run/lease/snapshot/expected refs and resumes only the missing phase. Push succeeded/PR failed => retain published SHA, verify remote then retry PR lookup/create. Validation mismatch => capture a NEW snapshot and rerun the affected validation; old evidence remains on the old digest. Root/branch/owner changed => stop; recovery requires an existing authorized lifecycle rebind/new launch, not `--force`, a parent grant, a stale run resumption or manual metadata repair. Dead service => no mutation until trusted supervisor recovery validates its persisted identity and current child authority. Cleanup only exact newly owned artifacts after identity checks; retain uncertain resources with recovery details.

    ## 9. Decisive tests and bounded gates

    Proposed grouped Rust module/filter `native_workflow` in `aida-cli-lib/src/tests/task_2712_native_workflow_tests.rs`, with isolated core plumbing tests under the same filter. Fixture uses only new temporary fake HOME/CODEX_HOME, source/main/store/cache, disposable Git remotes and fake forge/credential adapters. Never import the live user's grants/store, auth, source config, timers or daemon service into a test. PATH mutations use existing `test_env::run_path_isolated_test` before env guards. Assertions invoke production handler paths; mocks alone cannot satisfy AC1/4.

    Named required cases:
    1. `native_workflow_actual_boundary_source_git_stays_ro_channel_completes`: installed 0.166 sandbox, inherit=core, real source `.git/index.lock` refusal, then actual AIDA client requests produce private-index stage/commit, verified fake-remote push/PR and own canonical/cache mutation. Assert source/published byte identity, original dirty source preserved, receipt reports differing HEADs correctly, hooks/config/unrelated/protected paths unchanged. A host Command with merely copied env is insufficient.
    2. `native_workflow_own_child_only_core_companion`: real BUG-2398 finalization, own subject/role/lease/context, companion stays companion; own operation succeeds; wrong/advisor action and all absent/invalid/revoked/expired/foreign/scope-mismatch cases refuse. Parent/sibling selectors rejected even if present in an ancestor keyring; no parent forwarding. Also `native_workflow_existing_ungranted_record_artifact_still_nonauthoritative` drives actual old recorder output through expanded positive readers without granting authority.
    3. `native_workflow_mac_challenge_replay_and_tamper_refused`: unknown fields, oversized/nonregular/hardlinked files, nonce/counter/payload/run swaps, replay, fabricated result and stale owner/process reuse. Raw JSON without valid proof cannot cause writes. A negative control confirms an unauthenticated handler would have accepted the synthetic request.
    4. `native_workflow_source_swap_symlink_pathrace_refused`, `...branch_capture_competing_lease_refused`, `...edit_during_capture_requires_new_snapshot`: barriers, not sleeps; atomic root/parent/path swaps, .git pointer change, concurrent file mutation, deletion, hardlink/protected alias and different main/store/cache target. Fail closed and preserve exact original dirt; immutable old candidate is never silently replaced.
    5. `native_workflow_host_git_never_executes_agent_config`: plant hooks, fsmonitor, includes, filters/process/textconv, credential/SSH/askpass helpers, URL rewrites, attributes, replace refs, alternates, submodule metadata and source-built binaries. Sentinels stay untouched through capture/stage/commit/push/PR/inspection/recovery. Positive attack controls must execute only in isolated test confinement. Ratchet no direct host Git in native source trees, retain BUG-2169/TASK-2053 host-refusal tests.
    6. `native_workflow_objects_index_refs_exact_cas`: real Git verifies all blobs/tree/parent/author/trailer; private index staging and CAS contention; unexpected refs/config, corrupt objects, source branch drift, remote advanced/new-branch-exists and non-fast-forward fail. Never push an unrelated ref. `...push_zero_without_readback_is_unknown` and `...forge_zero_wrong_head_is_failure` forbid success inference.
    7. `native_workflow_failed_push_pr_validation_recover_exactly`: fake transport/forge faults before/after remote acceptance, crash after commit/CAS, lost PR response, partial own coordination/cache refresh. Retry resumes without duplicate PR/comment or changed author and retains original source/snapshot. Lease/grant revoked between phases stops next mutation.
    8. `native_workflow_real_shared_cache_and_store_locked`: fresh fixture canonical store and SQLite target through a source symlink; actual own mutation/cache sidecars/store persistence succeeds under own authority. Concurrent own updates retain both; changed revision and corrupt/unsafe store hook or transport policy refuse. Shared-store dirty state/cache failure is reported truthfully, no privileged shell retry.
    9. `native_workflow_validation_scope_not_laundered`: source test log versus differing candidate, changed test input, claimed exit0, publisher exit0, unknown scope all remain claimed/untested; genuine fixed sandbox validation is bound to the sealed candidate; independent review/CI/hold/mandate remain unsatisfied by publication alone.
    10. `native_workflow_lifetime_readiness_no_unattended_restart`: request before binding, supervisor/worker death, PID reuse, inotify overflow/replacement, failed preflight and unsupported profiles; no model readiness/silent downgrade, no new timer, no host shell fallback. Other vendor launch vectors unchanged.

    Manual completion gate, named `task2712_native_host_fixture_smoke`: run installed production launcher/client from an actual HOST outside nested agent confinement, using only disposable fake HOME/CODEX_HOME/store/forge and fixture-issued own child authority. Record installed executable/version, effective workspace-write/never, exact fixture config, final child metadata, real native tool operation transcript, protected writes refused, channel authentication, publication readback, cache/store side effects and recovery. Require PASS; skip, socket-precondition failure or unavailable host runner remains MISSING/FAILED evidence. An additional model-backed actual-tool fixture, with isolated test account/runtime if available and no real user data, must exercise normal launched implementer tool calls; model-free sandbox is a proxy for that crossing, not a model execution claim. No tests may quietly consult real user auth or canonical store. If such a model fixture cannot be run, disclose the missing gate for independent judgment; do not call AC1/4 complete.

    Future implementation local gate is LIGHT: `AIDA_CARGO_TIMEOUT=10m cargo test --profile agent -p aida-cli-lib native_workflow` plus `make check-ci-fast`. Include the proposed core tests in that focused fixture's dependency/production-path coverage; if core tests form a separate necessary target, name the additional focused target concretely in the implementation plan rather than broadening to a suite. If actual change touches >10 files or shared test infrastructure, additionally run `make test-touched` and `make check-ci-compile`. Use normal cargo slots, long cargo in tool background, no outer timeout/slot bypass. On timeout/KILLED inspect `cargo ps` before retry. Full workspace tests belong to CI. This sketch orders no cargo/build or test implementation now.

    ## 10. Reuse, open forks and out of scope

    Reuse signed contained C8 for protected metadata, trusted host Git separation, exact own refs and host-side planted-execution tests; C9 for real canonical/cache locking and sidecar inventory plus typed store persistence. The native route's authenticated collection, immutable snapshot/index/ref ownership and receipts can later be shared with TASK-2707. Do not claim that C8's proposed hardened helper already exists or is adequate: current host clone execution explicitly refuses, and existing hardening still reads local config. Do not require Landlock/egress proxy/Claude migration/full contained backend before this native service. Contained proof is not native proof, and native service availability is not AIDA-contained posture credit.

    Independent advisor judgment requested on this concrete proposal, especially:
    - Affirm the selected host-owned index/ref + receipt semantics while original source .git/HEAD stay protected, and the corresponding launcher/own-work consumers. If source HEAD advancement is required, that is a different typed metadata transaction with crash/CAS design and must be signed separately; do not quietly add source Git execution.
    - Sign the narrow MAC/challenge file-collection protocol and explicit existing-validator caller-context seam. If installed/native key possession cannot authenticate it or source/runtime isolation cannot protect host state, refuse unsupported launches; no bearer-file, argv-key or ambient parent fallback.
    - Verify supported HTTPS credential adapter closure and deployed Git feature/version floor. Unsupported helper/remote formats must have named refusal, not inherited user config execution. Decide any additional supported transport through independent judgment.
    - Confirm the precise minimum own-coordination verb inventory against code after BUG-2398 and receipt consumers so ordinary handoff is complete; no hidden requirement to use an unavailable MCP tool under never. These are implementation inventory/compatibility checks, not authority widening.

    No implementation, Cargo/source edits, new requirements, queue actions, dispatch, merge, self-signoff, global config edits, SDK protection exceptions, new grant issuance policy, general host execution/MCP approval bypass, credential refresh redesign, lease/raw-ledger hand edits, unrelated branch cleanup or timers are authorized by this sketch. Existing independent STRICT authority/security review and normal CI/hold/mandate/operator merge floors remain required. Await a different advisor's signoff on this exact canonical object before code.
