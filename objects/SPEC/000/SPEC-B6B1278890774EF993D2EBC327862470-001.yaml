- id: 01a19721-f4ec-7731-8260-9f95529ea8af
  author: codex-advisor-17
  content: |
    # INDEPENDENT ADVISOR JUDGMENT: CHANGES REQUESTED — TASK-2712

    Reviewer: codex-advisor-17, own companion advisor context, 2026-11-01; independent of sketch author codex-advisor-16. Exact owner SPEC-b6b1278890774ef993d2ebc327862470-001, UUID 01a19600-3f6f-7672-b6b2-6611ff226175, agreed/display TASK-2712, actual type Task. This is sketch judgment only. It is not implementation review, dispatch, status/queue action, merge approval, credential/runtime installation permission or permission to relax native protection. All four ACs stay required. Overlapping launcher/authority implementation remains serialized after BUG-2398.

    I read the FULL 39KB `/tmp/aida-TASK2712-sketch-result.md`, full owning description/four ACs/corrected proxy rulings, BUG-2398's full expanded AC3 and adopted B1-B4/independent expanded approval plus latest rework, STORY-2238's sketch/C1-C12 and probe qualifications, TASK-2707's acceptance, and actual relevant current source at 471540a8c477a50a81170f338d81532cb5dbd329. Installed Codex is 0.166.0 and Git is 2.43.0. Upstream comparison is pinned to 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856; permissions/bwrap/seccomp source was inspected, not a moving SDK assumption. Evidence was source and synthetic artifacts/spec rulings only. No live transcripts, registry payloads or credentials, no Cargo, user scheduling/configuration, implementation, agent launch, status/queue mutation or merge.

    ## Selected architecture: accepted portions and explicit choices

    I select the proposed typed per-launch HOST collection/publication plus own-coordination channel. It is NEW product work; neither existing deputy jobs nor ship_from_seat implements it. This preserves the native workspace-write/approval-never boundary. Source .git, index, HEAD and common-dir authority remain RO/protected; typed stage/commit own a private host index/ref. A source-HEAD-advancing alternative is rejected for this scope and needs separate judgment. The full end-to-end native handoff is still the goal; this choice is not a contained-only substitute or a silent reduction to code editing.

    The immutable captured manifest/tree, independently pinned source and publication OIDs, original dirty-work preservation, explicit claimed/untested local validation, remote ref CAS plus independent readback, forge repository/branch/base/head readback, and protected durable phase receipts are sound requirements. Existing reviews/CI/holds/mandates/author independence remain unchanged. Host publication is mechanical authoring support, not independent review. No source hook/filter/branch-selected test execution is admitted as host authority.

    A file request transport avoids assuming a permitted Unix connect under Codex's Restricted seccomp policy. Pinned seccomp.rs:205 denies connect and other network operations; it is not a general IPC grant. A pinned request directory inside existing writable scope can carry UNTRUSTED DATA, while the authoritative journal/index/ref/snapshot stays outside all native writable aliases. No new writable root, SDK bypass, inherited parent authority, global setting or unrestricted host-command verb follows from that choice.

    I do NOT sign the entire sketch yet. Three protocol/deployment choices below must be made concrete in an amended sketch; they cannot be left as “reuse validators,” “trusted helpers,” or an implementation-time availability guess. The preserved positive/negative test contract follows in full. No requirement is autofiled.

    ## T1 — possession, challenge lifetime and existing validators: core amendment required

    Source facts:
    - seat_authority.rs::issue_child_from (~2232-2299) installs a raw fresh child secret in the launcher's session keyring and stores only key_token(secret) plus process bindings in the grant. Successful issuance may also produce a proc-only child where keyrings are structurally unavailable; MAC authentication cannot work on that route merely because ordinary process-bound role checks work.
    - grant_keyring.rs::available checks a syscall/keyring availability condition; read(id) separately returns Held(secret), NotHeld or Unavailable. availability is NOT a key read. Holding a grant selector or its persisted `key:<sha256>` binding is not holding the MAC secret.
    - seat_authority.rs::grant_check_for_at (~1101) checks lifetime, subject, roster and parent delegation, but does NOT apply presenter possession. grant_check_at applies with_presenter; presenter_tokens_for reads the CURRENT host process tokens/keyring. Calling either from a privileged supervisor without a defined request-bound presenter seam can validate the supervisor rather than the requesting child.
    - bind_grant_to_pid (~2524) stamps a process/start identity. It does not authenticate a request, bind a namespace-mapped tool PID supplied in JSON, or make the worker live forever. Companion restrictions also occur in role_authority.rs and ambient role/current-scope readers outside grant_check_for. Restoring only a grant object is insufficient.
    - Pinned native bwrap.rs uses user/PID namespaces, new-session and daemon socket masks; its seccomp deny list does not itself deny keyctl/add_key. That makes inherited key possession plausible, not verified. Existing BUG-2398 comment 6 proves present-empty env/keyctl availability; comment 7 proves a role recovery. Neither proves this new MAC client can read its exact child's raw key through every actual launch/tool runtime. STORY-2238's own corrected P1 qualification expressly distinguishes key availability from key READ. A daemon executing tools outside the launch key inheritance/process tree would invalidate the assumption; it cannot be accepted as the child merely because the CLI is alive.

    Required concrete amendment/proposal:
    1. Specify ONE exact protocol, not selectable authentication backends. A suitable bounded proposal is HMAC-SHA256 using the existing Held child secret, domain-separated request/response keys derived with a standard reviewed KDF, a 256-bit host-random challenge, fixed run UUID, full bound launch identity and monotonically allocated request sequence. Define canonical bytes (including duplicate-key/number/path rejection and length framing), digest algorithm and MAC comparison, key derivation input encoding, one outstanding challenge or an explicit bounded concurrency table, nonce consumption, crash persistence and idempotent duplicate results. Host authority state is private; inbox/challenge/response content remains attacker writable. Never MAC using the persisted public binding digest as the secret.
    2. Client selects ONLY the run's own fixed grant ID and reads exactly that key using the existing grant_keyring path; host independently reads/retains that SAME child secret and verifies its hash against the reloaded binding. No parent/sibling key search, pointer, key file, argv/config/env payload, keyring redesign or parent-secret fallback. Host verifies copied bounded request bytes before interpreting any operation. Secret-derived response authentication may protect client interpretation, but the child also holds the secret; ONLY the host-protected journal is completion authority for launcher/forge/ledger consumers, never a response MAC alone.
    3. Define an internal request-bound caller object produced ONLY after valid MAC and current run checks. It carries canonical child subject/role/scope/project/instance/lease and proved key possession, never a caller-supplied “allowed” boolean or fabricated authority map. Reuse grant lifetime/roster/parent plus presenter validation and the existing operation policy/companion/lease checks explicitly. The supervisor's ambient key or proc ancestry cannot fill a missing request proof. No process-global env mutation in a threaded service. Enumerate every existing handler's context inputs and where its authorization runs.
    4. Bind the host-observed actual worker process/start/pidfd, exact lease and scope before readiness; a model-free probe process and the real model worker are separate identities. State which real supported launcher paths preserve keyring inheritance into native tools and how the host observes that binding. A JSON/env PID is not evidence. Prefer key possession plus a host-proved live bound worker over claiming a namespaced tool PID proves ancestry without a mapping. If tool ancestry is required by the chosen policy, specify the kernel-observed namespace mapping. Daemon detachment/unknown worker identity refuses the unsupported path; no new daemon/service launch mode is implied.
    5. Resolve revocation/lifetime semantics at a precise mutation linearization point: after acquiring the permanent workflow/store lock and immediately before each irreversible action, re-read current own grant, parent chain, subject/roster, lease owner, process and source/policy bindings. No cached-valid shortcut. Revocation after remote acceptance cannot undo a push; retain truthful partial result. Expiry/revocation during idle must terminate or quiesce the service through a bounded event/deadline mechanism without inventing recurring timers; inotify grant events alone are insufficient for absolute expiry. Requests always revalidate, even if a notification was lost. Owner/worker death and restarted supervisors invalidate outstanding challenges. Recovery authenticates afresh against a STILL-LIVE same child/lease; no revival of a dead grant/run and no unattended restart.
    6. Before treating the MAC deployment assumption as settled, require a bounded HOST synthetic existing-launch/key-read diagnostic: temporary HOME/CODEX_HOME/roster/store, fixture-issued exact child using existing issuance, actual installed native sandbox/tool boundary under inherit=core, parent/sibling negative controls, and an HMAC over a synthetic fixed challenge without printing key bytes. Prove actual own key READ, matching own subject/scope/companion and both host/client views, not just available() or env booleans. A proc-only/key-unavailable negative must refuse the new channel. Do not run against user grants/credentials or change socket permissions to obtain a pass. Root decides this bounded prerequisite; it is not requested as an implementation/launch in this session. Model-backed tool evidence remains a later separate AC1/4 completion gate.

    I can sign a concrete MAC protocol satisfying those conditions on its own merits; I cannot sign the present unspecified challenge/restart/context seam as a completed core protocol, nor infer universal native key possession from keyctl availability. No upstream patch or new grant policy is authorized to make it work.

    ## T2 — close the coordination verbs and receipt consumers before code

    The host-owned index/ref choice changes observable HEAD behavior and needs explicit consumer routing, not only a receipt struct. Current phase_driver_trait.rs::capture_phase_done_pr (~8-20) prefers implementer_worktree HEAD before a forge head; it can persist the unchanged source base into drain_state::set_change_binding. agent_launch.rs (~757) uses source HEAD in liveness snapshots (diagnostic, not publication proof). ship_from_seat.rs::finish_published/open_seat_pr (~597/~669) provides useful author/forge seams but its existing success path is not the proposed verified receipt reader. Do not relabel it as such.

    Amend with a finite producer/consumer table naming actual symbols, identity source and expected result for each native path. For publication-aware completion, select only a journal-backed receipt matching run + own child + source-root identity + lease + canonical spec + branch/repository + sealed tree/commit + verified forge head. Never fall back to source HEAD, arbitrary response JSON, exit 0 or another run's receipt after selecting this channel. Diagnostic source HEAD remains labelled source HEAD. Preserve all non-channel/other-vendor consumers. Native ordinary interactive/headless handoff must both be accounted for; do not widen unsupported background/resume modes. Add a source-base versus published-tip production consumer test for capture_phase_done_pr and every newly inventoried completion reader.

    Close `apply_own_coordination` to exact operations and existing validator/mutation seams: append own comment/progress, specifically enumerated allowed implementation transitions, exact own lease progress/end, and publication/author ledger recording. “Add other ordinary own-work actions after enumeration” is not a signed extensible authority surface. No arbitrary status field, YAML/SQL, other spec/root/lease, role grant, enqueue/dispatch, reviewer approval, hold clearance or merge verb. Pin the canonical UUID across legacy SPEC/display aliases. Author/session/provenance come from the bound original child; source test logs remain claims where scope is unknown. Ordinary comment_cmd.rs paths do not by themselves prove this new channel's live child/scope check; some comment/store helpers read ambient author/session context. Map their inputs explicitly rather than bypassing checks with a privileged Storage handle. A companion must remain unable to perform driver actions even with a valid MAC.

    Own lease end needs a defined final transaction: persist the authorized final receipt/coordination result before ending the lease; immediately retire future mutation capability. Do not require a now-dead lease to authenticate completion of its already committed end, nor permit further work under a cached earlier valid lease. Retry distinguishes read-only durable inspection from new mutations; dead-run status may be readable but may not restart work. Preserve all ordinary dirty-work/lease cleanup gates; publication does not clean the source or authorize deletion.

    ## T3 — pin one executable/credential closure, not “trusted helpers or adapter”

    The separate host repository is the right isolation boundary. Current git_ops::host_git_command explicitly refuses leased clone host execution (~128-152); host_git_hardening/transaction_git_config do not erase local config. The sketch correctly forbids using it as a native publisher. Do not weaken that refusal.

    Current git_ops/remote_credentials.rs::configure_remote_credentials_with reads named remote URLs and may preserve operator helper chains for fallback credentials; host_remote_git_command starts from host_git_command. It is a credential-redaction gate, NOT proof of the proposed whole executable/config closure. A credential-clean URL can leave the Command unchanged. Reusing that helper generically could reintroduce exactly the local/global helper/config execution this design excludes.

    Choose ONE initial HTTPS host adapter and document its fixed trusted executable/helper path(s), digest/ownership/config source, exact Git runtime exec-path and CA/protocol inputs, host-side credential source, host/repository/path scoping, redirect policy, redaction and error closure. A fixed AIDA adapter receiving trusted host credentials through an existing host-only credential mechanism is a reasonable bounded choice; a branch-provided helper, inherited global helper or arbitrary `!` shell is not. No model credential reuse, token argv/URL/logging, credential refresh redesign or broad HOME access. Unsupported auth/SSH/custom helpers must refuse by name, but the supported normal production path must actually exist—fake-remote-only success cannot satisfy AC1. Root decides any newly required credential adapter authority/external runtime integration. This is a concrete sketch amendment, not permission to inspect real credentials now.

    Pin the trusted Git executable AND its subordinate git-remote-https/libexec/dependency closure; scrub GIT_EXEC_PATH and all inherited Git/config/SSH/askpass/loader redirects, use fixed host PATH, isolated HOME/XDG, fixed config and disabled includes/attributes/filter/hooks/fsmonitor/textconv/pager/editor/signing/replacement/grafts/alternates/promisors/submodule recursion. Blob insertion must use --no-filters. Refuse unexpected private-repo config/refs/links or untrusted base object sources. Remote protocol allow-list is HTTPS only in production, with pinned URL/branch/base; file/local/ext seams are fixture-only. Native source work/config/hooks are never a host-executed directory, including inspection/recovery. Installed Git 2.43.0 is evidence of this deployment, not a substitute for a declared supported version/features floor and failure behavior.

    Keep normal fast-forward-only remote publication. Exact --force-with-lease may serve only the atomic expected-old comparison after verified ancestry; it is not permission for history replacement. Independently read remote ref and actual forge PR head/repository/branch/base. Unknown is not NoChange; timeout after acceptance is Unknown until bounded exact reconciliation. Retain Git CAS's same-OID ABA limitation. No automatic rebase/merge/branch capture or retry to a different branch.

    ## Binding requirements already sound and retained

    - Capture only declared selected paths with pinned dirfds/beneath/no-symlink resolution and bounded regular opened files; reject special files/hardlinks/protected aliases/path swaps. Pre/post stat alone is not an atomic tree snapshot. Immutable captured bytes define the candidate; before acceptance/publication recheck exact declared set/source identity/lease/branch, require a NEW snapshot on change. Track add/delete/mode/old blob/new hash. No source reset/stash/clean/overwrite; preserve excluded dirt with bounded manifest evidence. Unsupported symlink/gitlink/LFS/sparse/path forms refuse precisely.
    - Host validation never runs source Makefiles/tests as host authority. Fixed reviewed validation runs in same-or-tighter native confinement on the sealed candidate. Bind relevant tested input closure/tree/base/tool recipe/output/exit to the candidate; claimed source logs or changed test inputs remain claimed/untested. CI/independent review is at actual published head. A tree hash alone does not cover external mutable test inputs or unknown environment.
    - Canonical updates use existing GitBackend/Storage::update_atomically under store writer locking; cache uses existing strict mutation/cache locks and sidecars. Existing transport trust, shipped store hook profile, hypothesis description locks, evidence refusal and provenance invariants remain required. A direct Storage facade is not an authority bypass; a source symlink to real canonical/cache targets grants no new writable roots. Pin target identities/generations and obey existing lock order; do not add a second global store writer or hold a leaf lifecycle lock while acquiring store lock.
    - The phase journal distinguishes object persistence, store commit, cache refresh, code commit/ref CAS, remote push and PR verification. Canonical committed/cache-failed is partial success with exact revision/cache state; never clobber newer data or duplicate the comment on retry. Dirty canonical state/store-commit refusal stays visible with supported recovery, no raw YAML repair or privileged shell fallback. Idempotency records must reconcile already applied object changes after a crash, not merely promise transactional atomicity across journal and store.
    - The new channel strictly refuses wrong/absent/present-empty/revoked/expired/foreign/mismatched scope grants. Existing NONAUTHORITATIVE absent-grant review artifact compatibility under BUG-2398 stays unchanged; presented invalid grants refuse and ungranted artifacts cannot give positive collection/dispatch/classification/actionability/ship/hold-release authority. Protective refusal artifacts still protect. No blanket role/recorder policy is invented.
    - Permanent workflow locks are never unlinked. Bound every request/payload/manifest/file/directory walk/state log/challenge table/event rescan/output/Git/network/forge call and retention policy with explicit finite defaults in the implementation plan; no unbounded pre-capture inventory or blocking FIFO/open. Exhaustion is a named refusal/unknown, not partial clean success. Lock ordering and expiry/revocation checks must remain coherent across phase boundaries. All retained resources carry exact trusted identity and recovery instructions. No unauthenticated resume/service restart or new timer, no model polling.

    ## Full retained test contract (proposed; none run here)

    Proposed grouped Rust module/filter `native_workflow` in `aida-cli-lib/src/tests/task_2712_native_workflow_tests.rs`, with isolated core plumbing tests under the same filter. Fixture uses only new temporary fake HOME/CODEX_HOME, source/main/store/cache, disposable Git remotes and fake forge/credential adapters. Never import the live user's grants/store, auth, source config, timers or daemon service into a test. PATH mutations use existing `test_env::run_path_isolated_test` before env guards. Assertions invoke production handler paths; mocks alone cannot satisfy AC1/4.

    Named required cases:
