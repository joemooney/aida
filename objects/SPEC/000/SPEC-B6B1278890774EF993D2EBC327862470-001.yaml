    ## T1 fixed protocol: exact own Held key, HMAC-SHA256/HKDF-SHA256

    One authentication scheme only. Existing grant secret payload from `grant_keyring::read(OWN_FIXED_CHILD)` MUST be KeyRead::Held(bytes), exact nonempty bounded payload (existing read cap 256 bytes). Use those exact payload bytes as IKM, including their existing ASCII representation; do NOT hex-decode/reinterpret the public binding `key:<SHA256>` into a secret. `available()`/role/env/proc ancestry/public digest alone is NEVER a MAC credential. Host independently reads that same own key after issuance, compares key_token(Held) to the live own grant's key binding, retains only own raw key in memory; client reads ONLY that run-fixed selector. No parent/sibling key search, key-list enumeration, alternate key backend, secret file, parent fallback, argv/env/config secret or grant redesign. Host memory zeroizes on retirement; journal stores binding digest only. Successful ordinary proc-only grants remain valid for existing compatible operations but REFUSE this MAC channel.

    Standard primitives: HKDF-SHA256 (RFC5869) and HMAC-SHA256 (RFC2104), full 32-byte tags, constant-time comparison, CSPRNG host challenges. Fixed source algorithm/version; no negotiation to weaker algorithms. Run UUID and generation UUID each 16 bytes; host random challenge 32 bytes. Identity digest SHA256 of domain-framed canonical launch identity: canonical own grant UUID, principal/subject/seat/instance, grant session ID, project UUID and root dev/inode/mount identity, source/gitdir/common-dir identities + pointer digest, canonical spec UUID, exact lease UUID, repo/branch/base/source HEAD, HOST-observed worker pid/start + supervisor pid/start + generation. None come from request assertions. Re-read source/lease/grant identities before mutations.

    Canonical envelope bytes, in EXACT order (big-endian): fixed ASCII `AIDA-NWF-REQ-V1` followed by NUL; run[16]; generation[16]; challenge[32]; counter u64; request UUID[16]; identityDigest[32]; operation u16; payloadLength u32; payload bytes. Canonical payload is RFC8785/JCS UTF-8 JSON over CLOSED per-operation structs: reject duplicates at EVERY nesting level, unknown fields, floats/negative numbers/-0/NaN, invalid Unicode, noncanonical encoding and integers outside 0..2^53-1. u64 counter is only in the binary header. JSON parsed only into bounded syntactic structs before MAC; no filesystem/operation interpretation before MAC/current-run check. Re-serialize and require byte equality. Field-name sort, escaping and number spelling follow JCS; no locale/NFC/whitespace/path normalization. Paths are strict UTF-8 relative components, no empty/dot/dotdot/NUL, absolute/drive/root/backslash aliases; initially unsupported byte paths refuse. Bodies preserve exact Unicode/CRLF data. UUID/OID strings require fixed canonical lowercase syntax/full length; legacy SPEC/display alias never appears as authority selector (launch resolves canonical UUID).

    `frame(x)` = u32 byte-length + x; all concatenations below use fixed bytes or frame. HKDF salt = SHA256(`AIDA-NWF-SALT-V1` NUL + run + generation). PRK = HKDF-Extract(salt,Held bytes). Kreq = HKDF-Expand(PRK, frame(`AIDA-NWF-REQUEST-KEY-V1`)+identityDigest,32); Kresp uses distinct `AIDA-NWF-RESPONSE-KEY-V1`. Request tag = HMAC(Kreq,exact envelope above). Response tag covers fixed `AIDA-NWF-RESP-V1` NUL, run/generation/counter/request UUID, SHA256(accepted request envelope), result length and canonical result bytes. Key domains/challenge/identity are never omitted. The response MAC only protects the client's interpretation; the child also has that key and can forge it. Completion authority exists ONLY in the protected host journal, never response JSON/tag or exit0.

    ### One outstanding challenge, crash/idempotency and transport

    Exchange directory is 0700 inside ALREADY admitted native runtime/workspace scope, containing untrusted challenge/request/response DATA. Nonsecret run/path metadata may travel in approved explicit child metadata/context; no new secret whitelist. Host private journal, immutable snapshots, private Git index/ref live in `<trusted main common Git dir>/aida/native-workflow-v1/<run>/` outside ALL effective native writable spellings/aliases/mounts. Pin every ancestor/root directory nofollow with retained handles and host-owned private modes; source `.git` or other symlink does not itself prove protection. If installed native policy exposes a writable alias to that authoritative state, requested channel refuses before readiness; no native protection bypass or new root grant.

    Directory/file entries: openat2 RESOLVE_BENEATH|NO_SYMLINKS (or equivalently checked pinned-dirfd traversal), O_NOFOLLOW|O_NONBLOCK; dirs exact0700, files exact0600, host uid, singly linked regular, bounded fstat/read; root/anchor identity rechecked. Child-writable exchange content is always adversarial despite permissions. Permanent workflow lock never unlinked. Request atomic rename publication + inotify; copy bounded bytes ONCE through opened handle. Reject partial/moving/malformed files; do not open FIFOs/special files or execute data paths. File digest in MAC binds copied bytes. No Unix socket permission relaxation or arbitrary IPC grant.

    Host allocates counter from protected journal under workflow lock; one Issued challenge per live generation, expires in 30 s and no later than effective own/parent grant deadline. Persist Issued state and fsync before publishing challenge. It contains run/generation/counter/identity/challenge/expiry and no key. Exactly one request can consume it. Under the workflow lock, validate bytes/MAC/current authority then fsync `Accepted(counter,request UUID,request digest,op,idempotency identity,expected before state)` BEFORE any action. Subsequent duplicate with IDENTICAL accepted bytes/UUID returns exact journal-backed result or Pending/Unknown; different payload on same counter/UUID refuses permanently. A fresh operation requires a fresh counter and challenge; lost response is recovered by status/reconciliation, not new commit/comment.

    Phase journal records Intent -> Applying -> ObservedOutcome -> durable Result. Cross-resource atomicity is NOT promised. Before each irreversible action append/fsync phase intent; after it, independently read exact objects/refs/store revision/forge head and fsync result before reporting. Crash between action and result is Unknown until that exact recorded before/after state can reconcile. Never simply rerun a maybe-applied comment/push/PR. Comments/activities use stable request-derived UUID/event identity; store object exact revision/history entry is the reconciliation seam. Counter never resets within generation. Supervisor death invalidates generation/all outstanding challenges; NO unattended restart. Explicit trusted recovery may bind a new supervisor generation ONLY for same STILL-LIVE worker/child/lease after all rechecks, then issue new challenge and inspect old phases by exact identities. Dead-run status is read-only; old MAC cannot restart mutation or revive a dead child.

    ### Real worker binding, deadlines and request-bound authorization

    Managed foreground interactive native workflow chooses EXISTING supported `--no-daemon` in its per-invocation Codex argv so the actual embedded worker/tool tree inherits this launch's key. It is not a global setting, socket workaround or new service; pinned daemon_startup.rs explicitly excludes daemon discovery/start for this option. Headless `codex exec` must use its actual in-process owned launch and inherited-key tool path; do not pass unsupported TUI flags to exec. A managed path that reuses a preexisting daemon, detaches tools outside this proved ownership tree, or cannot bind the real worker refuses this channel. No stamp on the TUI client alone can authorize an independent daemon worker. Existing supported bg supervisor may serve only while it observes that actual worker tree/lease; unsupported resume/bg/remote paths are not widened. Interactive embed compatibility with mail-wake's shared-daemon route is NOT claimed: those are separate supported runtime selections; no new implicit daemon queue endpoint follows.

    At final spawn, after BUG-2398 intended metadata/effective-context validation, host captures actual returned worker PID, kernel starttime and pidfd, exact own child and lease; bind_grant_to_pid persists that process. Release a launch readiness barrier only after binding and actual-native model-free raw-key probe success. A preflight tool probe's PID is a DIFFERENT identity; its success does not stamp model worker. Normal real tool requests use own key + host-observed live bound worker, not a JSON/env-named namespace PID. This protocol does NOT require the tool's namespaced PID to be falsely equated to a host PID. If an existing operation genuinely needs tool ancestry beyond this key presenter, kernel-observed namespace/process mapping must be available or that operation refuses. Key possession plus bound worker lifetime is a specific channel presenter seam, not a general identity resolver change.

    Proposed internal `RequestBoundCaller` constructor is private to the host authenticator. It can be built ONLY after current run/generation/challenge/MAC proof and exact own-key hash revalidation. It carries own canonical child record/subject/seat/instance/project/scope/lease, key-possession proof tied to accepted request digest, original session/provenance, current source/policy and host-proved worker lifetime. Operation payload CANNOT provide grant/seat/user/project/lease/allowed flags. It is not a synthesized role map or a privileged Storage bypass.

    Existing grant_check_for_at checks lifetime/subject/roster/parent but does not enforce possession; with_presenter presently ADDS the HOST process's possession_token, so calling it unchanged inside a supervisor could validate the supervisor! Minimal explicit adapter factors `validate_bound_presenter` to reuse grant_check_for_at plus presenter_rejection/matched_binding with ONLY this authenticated own-key token and host-proved worker binding; it MUST NOT call presenter_tokens_for or possession_token on supervisor ambient identity. It supplies exact child context to role/effective_role_with_roster and companion checks; no std::env swapping in threaded process. Existing public CLI/MCP authority resolvers keep their old behavior. All functions below receive this internal context through their real validation and mutation seams; no bypass via a new boolean.

    Mutation linearization: workflow lock -> existing store writer lock WHEN canonical work is involved -> existing backend/cache lock order; never hold a lifecycle/lease leaf lock while acquiring store. Under the final mutation lock and immediately BEFORE write/refCAS/push/PR/lease retirement, reload own grant + full parent validity, subject/principal/roster/delegation, effective minimum expiry, exact lease owner/state, live pidfd/start and source/root/branch/policy binding. Companions remain companions. Revalidation failures persist refusal; no cached-valid shortcut. Remote action uses bounded deadline capped by effective expiry; revocation after remote acceptance cannot undo it, so retain truthful Unknown/partial and reconcile read-only before any further mutation. Revocation races follow ordering: accepted irrevocable action before observed revocation is retained; no later phase is authorized by that success.

    Supervisor event loop waits on request inotify, lifecycle watches and worker pidfd with a one-shot absolute deadline at min(own,parent expiry,current phase deadline). It uses deadline-aware wait, NOT recurring timers/scheduler/model polling. Watches/overflow trigger bounded re-read, not authority; absolute timeout ensures idle expiry without filesystem notifications. Worker/supervisor death, pid reuse, lease transfer, invalid authority or unresolved watch overflow quiesces mutation and invalidates outstanding challenge. New request always revalidates even if no event arrived. Existing no-unattended-restart floor stands.

    ## Fixed HOST diagnostic preparation — NOT EXECUTED

    The complete fixed recipe is included below and saved separately as `/tmp/aida-TASK2712-own-key-HOST-diagnostic-recipe.md`. Root reviews it first; separate doer/root executes ONCE on HOST outside the nested agent socket mask. No compile, fixture launch or key read occurred in this sketch. Result currently MISSING, not PASS. This is a deployment prerequisite, not a choice of weaker authentication.

