    Fresh author: codex-advisor-18, own companion advisor, 2026-11-01; NOT signer. Exact canonical owner `SPEC-b6b1278890774ef993d2ebc327862470-001`, UUID `01a19600-3f6f-7672-b6b2-6611ff226175`, display/agreed TASK-2712, type Task, parent EPIC-612. This standalone proposal replaces advisor16's sketch, answers advisor17 T1/T2/T3 and preserves every named test/floor. A DIFFERENT independent advisor must judge it. NO code/Cargo/source patch, compile/test execution, dispatch/queue/status/hold/merge action, runtime install, global/user configuration, timer, credential read, grant-policy change or follow-up filing is authorized now. Implementation remains blocked by the existing typed `blocked-by BUG-2398` edge; it is not removed or weakened.

