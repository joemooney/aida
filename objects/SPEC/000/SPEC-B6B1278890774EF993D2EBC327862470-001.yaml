title: Codex native implementer sandbox cannot stage in assigned worktree or mutate shared AIDA cache
description: 'Observed during BUG-2397 standalone Codex implementation after TASK-2631. Assigned worktree /home/joe/ai/aida-worktrees/aida-seat-aida-bug-b6b1278890774ef993d2ebc327862470-171 is writable but its .git is explicitly read-only in the native sandbox. git add fails: Unable to create ''<worktree>/.git/index.lock'': Read-only file system. aida edit BUG-2397 --status in-progress separately refuses because .aida/cache.db symlinks to /home/joe/ai/aida/.aida/cache.db outside writable roots. Initial role show reports no active role despite routed implementer/launcher lease. Use an approved native sandbox launch configuration that supports the intended git/index/refs and AIDA store/cache mutations without broadening unrelated authority. Temporary writable /tmp publishing checkout is the workaround for this PR; source worktree remains dirty at base HEAD, so the launcher should not infer the published head from its local HEAD.'
