title: CLI JSON audit fixtures refuse advisor authority inside native Codex PID namespace
description: 'During STORY-2476 round-2 validation, cargo test --profile agent -p aida-cli --test bug_1502_format_json_audit built successfully but 8/9 tests failed at fixture setup line 140: add --status approved returned ''filed as draft (requested approved needs advisor authority)''. Re-running the compiled test binary with all inherited AIDA_* variables removed gave the same result, before the audit assertions. Likely cause: aida-cli/tests/support/mod.rs::test_process_binding emits unqualified proc:<pid>@<start>, whereas production gate/seat_authority.rs now uses review_authority::author_process_token to namespace-qualify presenters inside non-host PID namespaces (BUG-2419). Suggested follow-up: make fixture bindings use the same namespace-qualified contract and test in native Codex sandbox. aida lane job run is unavailable: this standalone lease names no runner. No production authority checks were relaxed; the audit was regenerated from the built CLI and checked separately.'
