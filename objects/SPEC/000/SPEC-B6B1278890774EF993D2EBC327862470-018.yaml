title: Dispatch fresh-review fixture still lacks sandbox session key in native PID namespace
description: 'While validating TASK-2886, all 11 test_home tests passed, including live concurrent PID-1 namespaces. The adjacent dispatch module passed 18/19 after building the matching CLI. The remaining bug_2398_dispatch_flow_ungranted_artifact_requires_fresh_authorized_review also fails alone with a private TMPDIR, so this reproduction is not explained by shared test HOME cleanup. Captured dispatch log: review record rejects the reviewer grant because the sandboxed process namespace does not hold its session key (grant bound to test process PID 4). The fixture mints a reviewer grant and invokes the matching CLI from review-fresh-authority, but the CLI refuses before recording. Evidence: /tmp/task-2886-dispatch-diagnostic-oltpn0be/logs/.tmpi1mEjV/repo/.aida/dispatch/logs/bdd61820-7d0e-47c2-b0b2-81d9a13f2075.log. Test: env -u AIDA_PROJECT_ROOT -u AIDA_DRIVE_ROOT -u AIDA_REVIEW_VERDICT_FILE <matching lib test binary> --exact gate::dispatch_auth::story_1917_dispatch_flow_schedule_tests::bug_2398_dispatch_flow_ungranted_artifact_requires_fresh_authorized_review --nocapture --test-threads=1, with private TMPDIR. Investigate fixture authority/session-key setup without weakening production grant checks. Related historical TASK-2861/TASK-2862. No outside-seat baseline was run.'
