- id: 01a1ad30-d237-7ba2-a6e8-dbf2bbaf67d0
  author: joe
  content: |-
    REVIEW FINDINGS TO ADDRESS (TASK-2887):
    Verdict: CHANGES REQUESTED
    Reviewed commit: e2620621c6e5
    Recorded: 2026-11-05T18:56:59.605994925+00:00
    Findings:
    1. [blocking/CI gates: Check Rust test portability ratchet] aida-cli-lib/src/workflow_hints.rs:1427 adds a new tmp-literal hit: assert!(text.contains("/tmp/fake-project")). Only the root_ok() literal at :1386 is allowlisted (scripts/portability-allowlist.txt:147), so the ratchet sees growth. Fix: assert against root_ok().unwrap().display().to_string() (or a shared const) instead of repeating the literal; do not grow the allowlist.
    2. [blocking/CI contracts: CLI-manual drift-guard] docs/cli/04-git-lifecycle.md:73: the new paragraph sits under the '### aida done' section and cites bare `--skip-pr-check` / `--force` / `--yes`. verify-manual.py parse_chapters resolves pathless flag citations against the section command (aida done), which has no --skip-pr-check (declared only in queue_cmd_args.rs:474). Fix: cite full commands, e.g. `aida queue done <ID> --skip-pr-check`, `aida queue done <ID> --force`, so the flags resolve to aida queue done. (Job log blob was unreachable from the sandbox; failed step name confirmed via the jobs API, and the cause was confirmed by reading verify-manual.py.)
    3. [minor] aida-cli-lib/src/queue_cmd.rs:5103: the BUG-1244 ownership gate still calls the Option-returning current_branch_at, so a seat-clone host-git refusal silently skips the ownership check. The spec describes exactly this class of caller swallowing the refusal. Combined with --skip-pr-check (not --force), queue done in a seat clone now bypasses ownership with no diagnostic. Use current_branch_at_checked there too: refuse, or warn when --force, and add a refusal test.
    4. [cosmetic] aida-cli-lib/src/workflow_hints.rs refusal line 2 ('Restore branch lookup access, then re-run') does not help the detached-HEAD case that this change now also refuses (docs/cli/04-git-lifecycle.md:70). Suggest also telling the user to check out the spec's branch.
    Contract: produce at least one commit, or punt explicitly naming the finding you dispute; never pass through silently with no changes.
