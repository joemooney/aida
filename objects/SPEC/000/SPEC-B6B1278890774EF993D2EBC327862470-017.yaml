title: Queue done skips its PR check when native seat branch lookup is refused
description: 'While completing TASK-2852 from the standalone implementer clone /home/joe/ai/aida-worktrees/aida-seat-aida-task-b6b1278890774ef993d2ebc327862470-803, git branch --show-current and commit/push succeeded, but aida queue done TASK-2852 warned: queue-done PR-check skipped: current_branch_at returned None ... Gate did not fire. It then marked the task done and dequeued it. This appears to be another caller swallowing host_git_command''s seat-clone safety refusal (TASK-2852 fixes pr hold''s diagnostic only). Investigate preserving lookup errors and refusing or explicitly handling unavailable PR-check evidence rather than silently skipping the gate. No publication authority change was attempted in TASK-2852.'
