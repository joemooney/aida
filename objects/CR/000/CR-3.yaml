  author: joe
  content: 'Implementer investigation (2026-06-09): exhaustively searched aida-web-react/src for any scroll-wheel -> selection coupling. Findings: NO onWheel/WheelEvent/deltaY handler, NO onScroll/IntersectionObserver/scroll-snap anywhere in the React dashboard. Selection (selectedId in useListSelection; selectedCardId in KanbanBoard) is mutated ONLY by click, drag, and keyboard hotkeys (j/k/Arrow/Enter via HotkeyProvider keydown). The only scroll-related code is selection->scrollIntoView({block:''nearest''}) in RequirementsList/QueuePage and focusCard() in KanbanBoard — i.e. selection drives scroll, never the reverse. CR-3 dates to 2025-11 against the prior egui GUI (cf. commits a49c31b14 ''navigation lock for synchronized list scrolling'' + 4cc8c936d ''keep selected requirement visible when scrolling reqlist''), where list-scroll and selection were coupled. That coupling does not exist in the React rewrite — the bug appears resolved-by-rearchitecture. No code change made; recommend closing as obsolete/won''t-fix or re-scoping with a concrete repro. Web gates baseline: ''npm run build'' GREEN; ''npm run lint'' has 27 pre-existing problems across many untouched files (already red on main).'
