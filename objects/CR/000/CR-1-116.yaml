title: Reposition the 'missing index' headline (intent/lifecycle) — operator decision
description: |-
  RECOMMENDATION doc: docs/competitive-analysis/2026-06-09-positioning-recommendation-index-to-lifecycle.md

  Lane D (2026-06-09 weekly scan, Kill-shot 3) found AIDA's 'your project's missing index' tagline (VIS-1 + README line 1) collides with zero-discipline auto-code-graph tools (CodeGraph, Augment, CodeCompass) that now own the word 'index'. AIDA's defensible value (intent/spec traceability + lifecycle truth) is under-marketed because the cheaper claimants own the word.

  Proposes 3 headline options (A: keep 'index', qualify '...of intent, not just code'; B: pivot to 'specs and code stay permanently linked'; C: pivot to 'lifecycle that keeps specs and code true'). Advisor recommends A or B (lean A — smallest honest fix, preserves Trojan-horse humility). NOT applied unilaterally — touches VIS-1 + README + OVERVIEW (brand). Operator picks A/B/C/keep.

  Blast radius if changed: README.md line 1 + elevator para; OVERVIEW.md line 1 + Vision; VIS-1 title/description; first-project.md closing 'index' sentence (optional); docs/positioning framing (minimal). Caveat from Lane D itself: this is the CHEAP lever — distribution/use is the larger one; don't over-invest. needs-design-signoff (operator-only).
