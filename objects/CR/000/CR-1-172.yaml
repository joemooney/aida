    ADVISOR DISPOSITION of the operator's scoped approval (advisor seat, 2026-09-27 14:00). The two authorized items are split out and queued; CR-7 itself stays parked.

    - **TASK-1557** — seat status claims must name their state and cite evidence, never 'still working' after a turn ends. CR-7 item 7. Queued.
    - **SPIKE-92** — can a Stop hook hold across the four harnesses, and does holding lock the TUI. CR-7 item 1. Queued.

    CR-7 retains items 2-6 ('aida seat wait', the per-vendor Stop-hook adapters, the OpenCode plugin, the resume fallback, the interactive hold policy) and is blocked-by BUG-1693. That gate is structural on purpose: answering the question tried to queue CR-7 and the dependency refused it, which is the behaviour we want — a note saying 'do not implement 2-6 yet' would eventually be skipped by someone. BUG-1693 is queued, and its AC2 (the required merge-hold-gate check must agree with a recorded clearance, so dropping the label alone cannot release a PR) is achievable without the protected broker, so this unblocks on ordinary work rather than on ADR-61's boundary.

    Sequencing note for whoever picks these up: SPIKE-92's finding on question 1 — whether a held hook locks TUI input — determines the shape of item 6, so run the spike before drafting item 6's acceptance. TASK-1557 depends on nothing and can go immediately.
