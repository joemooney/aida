agreed_id: SPIKE-48
title: Isolated sandbox store for play/test scenarios (first-user learning + dev drain-testing)
description: |-
  Idea (operator, 2026-06-03): give new users (and ourselves) a throwaway store to run scenarios against WITHOUT polluting the project's real graph.

  ## The real need is ISOLATION, not bundling
  Bundling example specs into the project's orphan aida-store branch is an anti-pattern: they're committed + shared with the whole team and clutter 'aida list' from day one. 'Hidden'/archived doesn't fix that (still in the real graph). The fix is an isolated, discardable store. (Note: these are ordinary tasks/stories/bugs — NOT META type, which is reserved for AI prompt templates.)

  ## Dual use case (what makes it worth building)
  1. First-user learning — spin up scenarios (a lifecycle walk, a blocked-by chain, a drain) to play with, then discard.
  2. Dev/test playground — run live drains without polluting the real store. EVIDENCE: validating STORY-492's resume today required throwaway TASK-639/640/641, several of which we had to reject — they're now clutter in the real store. A sandbox would have avoided that entirely.

  ## Smallest valuable slice (de-risk first)
  'aida sandbox' (or 'aida demo --sandbox'): create an isolated store (separate dir/worktree, not the project's orphan branch), seed 2-3 curated scenario specs, '--reset'/'--destroy' to throw away. Reuse existing parts:
  - 'aida export --format tree' / 'aida import' → ship scenarios as opt-in importable template TREES (curated, versioned), not auto-bundled.
  - scripts/aida-demo.sh + the isolated-$HOME pattern in scripts/validate-resume.sh → throwaway-environment plumbing.

  ## Layering / out of scope for the slice
  - 'aida-tutor' (guided, narrated walkthrough) is the richer layer ON TOP of the sandbox primitive — later, not first.
  - 'Generate on the fly': start with DETERMINISTIC templated scaffolds (fast, offline, repeatable). AI-generated/varied scenarios are a second-order nicety, not the foundation.

  ## Open questions for the spike
  - Sandbox store mechanism: separate dir + AIDA_STORE override? a 'sandbox' deployment mode? temp orphan branch?
  - How does 'aida' target the sandbox (env var / flag / cwd)?
  - Curated scenario set: which 3-4 scenarios teach the most (lifecycle, blocked-by/impact graph, autonomous drain, traces)?

  ## Timing
  Bugs-before-marketing phase — the first-user/tutorial framing is marketing-adjacent (defer). BUT the dev-playground use is on-thesis now (it would have saved us today). Revisit trigger: bug backlog clears, OR next time we need a throwaway drain. trace:STORY-492
