  content: 'Advisor groomed (2026-06-17): exploratory/Low. The tag union-merge (STORY-645) uses G-Set (grow-only) semantics, so a tag REMOVED on one clone concurrently with an edit on another is re-added by the union (lost removal). Real but rare; the common-case merge is correct. Not worth a speculative OR-Set CRDT upgrade now. Deferring with a concrete trigger rather than approving speculative work.'
