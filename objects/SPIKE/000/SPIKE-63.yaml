  content: 'OBE — resolved by BUG-602 (#1075, merged): ''fix(conflict): 3-way set merge for tags/relationships/dependencies — stop tombstone resurrection.'' The exploratory concern (tag G-Set loses concurrent removals on union merge) was promoted to a real bug and fixed — and notably via the *cheaper* path this spike listed as an alternative (a 3-way set merge against the merge-base to tell ''added on one side'' from ''removed on the other''), NOT the heavier OR-Set. Recommend closing this spike as resolved. Verified against origin/main 2026-06-20.'
