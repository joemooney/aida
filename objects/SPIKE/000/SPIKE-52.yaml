title: 'SPIKE: ride Claude Code Agent Teams as within-session executor; bridge it to the spec graph (re-scope P3)'
description: |-
  Lane B scan finding B1 + signals-to-watch §1 tripwire FIRED. Agent Teams now natively provides the within-session mailbox + shared-task-claiming + quality-gate hooks that AIDA's P3 (MCP send_message/read_inbox) and queue/lease mechanical layer were going to build. Per signals-to-watch §1's prescribed pivot ('delegate session hosting to native Teams; focus on the requirements graph + trace verification'), investigate RIDING the primitive instead of reimplementing it.

  Investigate: (1) seed an Agent-Teams shared task list from `aida queue` (spec graph -> teammate tasks, preserving SPEC-ID anchoring); (2) map teammates -> AIDA implementer roles; (3) harvest teammate mailbox messages + task outcomes back into spec history/comments (the durable, cross-session record Agent Teams lacks — it has no session resumption, local-JSON only); (4) register AIDA reviewer/pre-commit gates as Agent-Teams TaskCompleted/TaskCreated/TeammateIdle hooks (substrate-as-bouncer, native). Deliverable: recommendation on build-vs-ride for P3, and whether AIDA's within-session coordination should defer to Agent Teams while AIDA owns the cross-session/cross-vendor projection. Caveat: Agent Teams is experimental + Claude-only; the bridge must degrade when it's absent. Source: https://code.claude.com/docs/en/agent-teams
