  content: |-
    OVERNIGHT EXECUTION PLAN (2026-07-15, autonomous — operator granted the refactor overnight):
    GATING: must wait until TASK-1020 (the last in-flight session, editing main.rs) merges — a main.rs refactor mid-flight = conflict hell.

    Approach = SAFE, incremental, verifiable module extraction (NOT the big-bang crate split, NOT unattended-risky):
    1. First, `cargo build --timings` to get the real per-crate/codegen breakdown (record it).
    2. Then extract cohesive, self-contained handler clusters OUT of the 157k-line main.rs into focused module files, ONE cluster per commit, `cargo build` + `env -u AIDA_SESSION_ROLE cargo test -p aida-cli` GREEN before each next step. Move each cluster's inline `#[cfg(test)] mod tests` with it. Candidate clusters (self-contained handle_* groups): advisor (handle_advisor_*), findings (handle_findings_*), schedule (handle_schedule_command), archive/unarchive/defer/undefer, init (handle_init_*), memories, punts. Pure code movement — compiler + tests catch any breakage.
    3. This shrinks main.rs + improves navigability + incremental-compile granularity at LOW risk. Defer the heavier crate-boundary split (parallel-compile win) to a supervised follow-up once the module boundaries are clean.
    Each extraction ships as its own reviewable PR, self-merged on CI green (mechanical refactor). Halt + park on any red.
