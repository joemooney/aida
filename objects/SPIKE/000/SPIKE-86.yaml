- id: 01a0d3f1-b2ca-7270-a9d0-5b4b389701d5
  author: joe
  content: 'Positioning note from the operator: to date, the operator has never used the AIDA capability described as “ask your codebase why” or “point at any line of code and get the decision behind it.” That may become useful later, and an LLM may be able to use it today, but it is not currently the lived center of gravity. A more grounded framing is that AIDA stands for an AI design/development assistant: a lightweight requirements-management and implementation system, a requirements plug-in for Codex, Claude, and other AI agents, and a runtime harness for agent work. AIDA may be comparable in spirit to Temporal, but is oriented toward coordinating and recording more nondeterministic behavior rather than deterministic workflows alone.'
