title: 'WS3a SPIKE: Beads + Gas Town empirical install — schema/ID mapping, conflict-on-reimport, bd git-hooks, Gas Town governance depth (gates vs-gastown.md)'
description: |-
  Expanded by red-team. Install and RUN both tools (not docs-only). Deliverables:
  1. BEADS: JSONL export schema field-map vs AIDA's model (link types incl. relates_to/duplicates/supersedes/replies_to/parent-child/blocks; hash + hierarchical IDs; memory entries); what imports cleanly / lossy; export stability (~3-week release cadence noted — maintenance treadmill risk); **conflict-on-reimport semantics** (what must never clobber AIDA-side decision fields — feeds STORY-574's ownership rule); **what bd's optional git hooks actually do** (the 'no code-to-issue linking' row is scoped to 'none documented' — confirm or correct empirically); feasibility of the sidecar trace-gate validating trace:bd-<id> against .beads/issues.jsonl.
  2. GAS TOWN (now load-bearing — it gates vs-gastown.md per plan §13): how deep is multi-vendor support really (Copilot/Codex/Gemini — real or thin scaffolding)? Is the Overseer escalation loop a genuine disposition gate or notify-only? What does the Refinery merge queue actually gate on? These decide how much of the narrowed wedge survives.
  3. Upgrade/correct every remaining [W]-grade claim in the rescope ERRATUM. Output: dated mapping doc + erratum-2 if needed.
