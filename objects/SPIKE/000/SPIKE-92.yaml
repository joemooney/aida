    SPIKE-92 could not measure TUI input, cancellation, actual timeout ceilings, or live continuation behavior on any harness. Official docs define the contracts, but current headless risks remain for Antigravity GEMINI_API_KEY runs and OpenCode one-shot runs. Pending human-operated TUI probes, the conservative CR-7 item 6 policy is hold=0 for human-present seats, with bounded long holds only for explicitly headless seats and resume-on-addressed-work as fallback.

