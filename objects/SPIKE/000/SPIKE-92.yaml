decision_request:
  question: What hold policy should CR-7 item 6 adopt for seats where a human may be present while harness behavior remains unmeasured?
  choices:
  - label: No interactive hold
    consequence: Human-present seats use hold=0 and rely on resume-on-addressed-work; longer holds remain headless-only pending measurements.
    resolution: set:interactive_hold=0
  - label: Short grace period
    consequence: Human-present seats wait briefly before resuming, accepting unverified TUI responsiveness risk; 5 seconds is a provisional value only.
    resolution: set:interactive_hold=5s
  - label: Long interactive hold
    consequence: Human-present seats use the held hook as primary wake despite unknown input and cancellation behavior.
    resolution: set:interactive_hold=long
  recommended: 0
  rationale: The research provides no empirical basis to claim that any harness keeps its prompt editor responsive during a sleeping Stop hook. hold=0 avoids imposing an unknown lock on a human-present seat; resume fallback already exists in CR-7's design. Treat a short grace as an experiment, not a safe measured value, and retain headless fallbacks for Antigravity API-key runs and OpenCode one-shot runs until current-version probes pass.
  asked_at: 2026-09-27T21:26:21.207146567Z
