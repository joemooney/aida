title: 'Spike: what would an OpenCode adapter take (launch, posture, plugin hooks, mail wake, MCP)?'
description: |
  ## Why
  OpenCode (anomalyco/opencode, MIT, ~223k stars, v1.19.5 on 2026-10-28) is the most-used open-source terminal agent and an integration target elsewhere (Spec Kit lists it; Devin Desktop drives it over ACP). AIDA has adapters for Claude Code, Codex and Antigravity only. OpenCode would be the fourth harness AIDA coordinates. Answer whether an adapter is worth building and what it would take, before anyone files implementation stories.

  ## Questions (each answered with a probe against the current release, not docs alone)
  1. **Launch and resume.** Can `aida agent new` start OpenCode headless and resume a named session (`opencode run`, session/continue flags, `opencode serve` + attach)? What identifies a session for `aida agent list`?
  2. **Permission posture.** How does OpenCode's permission config (allow/ask/deny per tool) map to AIDA's contained / bypass tiers? Can it be contained the way Claude is, or must containment refuse it like Codex and agy (BUG-2144, BUG-2223)? What does `aida doctor --category permission-posture` need to read?
  3. **Hooks via plugins.** Which OpenCode plugin events map to AIDA's session-start, tool-gate and stop/idle hooks? Does the plugin load in headless runs? SPIKE-92 found no Stop-hold (opencode #16626): confirm on the current release.
  4. **Mail wake.** Can an idle session be woken for new mail (server API, SDK, or relaunch-with-resume)? Fit it into the per-vendor wake adapter ruled on STORY-HOME-096, or report "unsupported".
  5. **MCP and skills.** Does registering the AIDA MCP server and shipping AIDA skills/commands into OpenCode's config work without per-project hand edits?
  6. **Attribution.** Commit and trace format: `[AI:opencode]`, `ai:opencode`. Any collision with model-name attribution, given OpenCode runs many models?

  ## Deliverable
  A go / no-go recommendation, a findings comment per question with the probe used, and (on go) a decomposed set of draft stories for the adapter.

  ## Out of scope
  Implementing any adapter piece. Comparing OpenCode as a competitor (that is the roster's job).

  ## See also
  SPIKE-92, SPIKE-HOME-002, STORY-HOME-096, BUG-HOME-028

  ## Acceptance

  - Resolved (2026-11-03, operator decision via `aida questions answer`): Defer v2 integration — Retain the research and postpone adapter investment until current v2 MCP, skills and command activation is repeatable or an upstream blocker is resolved.
