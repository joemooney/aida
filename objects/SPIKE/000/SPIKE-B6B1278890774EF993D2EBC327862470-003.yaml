decision_request:
  question: Should AIDA fund a bounded, v2-first OpenCode adapter path that first resolves global MCP/skills/commands activation, keeps AIDA-contained launch unsupported, and proceeds to a version-pinned pilot only after the integration gate passes?
  choices:
  - label: Staged v2 pilot
    consequence: Qualify current v2 global integration first; if it passes, consider the decomposed version-pinned adapter pilot with explicit capability limits and containment refusal. Stop for human review if qualification fails.
    resolution: tag:+adapter:staged-v2
  - label: Defer v2 integration
    consequence: Retain the research and postpone adapter investment until current v2 MCP, skills and command activation is repeatable or an upstream blocker is resolved.
    resolution: tag:+deferred:opencode-v2-integration
  - label: Legacy v1 pilot
    consequence: Consider a deliberately v1.19.5-only pilot using demonstrated global integration, accepting no pre-stop hold parity and near-term major-version migration work.
    resolution: tag:+adapter:legacy-v1-pilot
  recommended: 0
  rationale: Current v2 provides measured exact-session execution, durable authenticated input and an awaited pre-idle seam that make an adapter technically worthwhile. An early global-integration gate contains the largest unresolved risk without silently substituting v1 evidence. Deferring is reasonable if that bounded investment is not a priority; production support, OS containment and long interactive holds are not justified by this spike.
  asked_at: 2026-11-03T02:46:07.465713636Z
