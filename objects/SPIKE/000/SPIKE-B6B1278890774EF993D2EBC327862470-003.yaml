  content: |-
    [research-lane] source-grounded analysis (agent: claude / deep-research).

    OpenCode is a credible fourth-harness target, with a conditional go for a staged, version-pinned v2 pilot rather than production parity today. Isolated v2.2.5 probes verified fresh launch, exact-session resume, authenticated idle wake and generation-time queuing, headless plugins, and short awaited pre-idle continuation. Tool permissions failed an out-of-worktree shell-write containment probe, so AIDA-contained launch must refuse. V1.19.5 connected real AIDA MCP and discovered global skills/commands, but current v2 parsed equivalent native configuration without runtime activation in bounded probes; resolving this is the first gate. Attribution syntax works in metrics/trace linkage, while first-class vendor identity needs changes. No specs, implementation or project direction were changed.

