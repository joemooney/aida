    RESEARCH DELIVERABLE (full text; the scratchpad artifact is ephemeral):

    # OpenCode adapter feasibility

    **SPIKE-707 · research conducted 2026-11-02 MST / 2026-11-03 UTC**

    **Recommendation: conditional GO for a staged, version-pinned v2 adapter investigation and pilot; NO-GO for declaring a production fourth harness today.** Current OpenCode v2.2.5 can launch and resume an exact session, accept authenticated input into an idle or busy session, load headless plugins, and hold briefly before idle with same-run continuation. These were executable probes, using isolated local mock models. The principal unresolved integration gate is that v2 parsed the tested global configuration but did not activate the configured AIDA MCP server, skills, or commands; v1.19.5 passed those discovery/connection probes. OpenCode's tool permissions do not provide AIDA filesystem containment: an allowed shell wrote outside its worktree despite `external_directory: deny`. Human approval should choose whether to fund a bounded v2-first path with an explicit early integration gate or defer it. No implementation, spec amendment, posted finding, merge, or project-direction change is part of this research. [Synthesis from L-runtime, P-runtime and I-runtime; primary sources and local evidence below.]

    ## The current release changes the answer

    The question is whether an OpenCode adapter is worth building, and what launch, posture, plugins, wake, MCP/skills and attribution require. The prompt names v1.19.5 as current. At research time GitHub's `/releases/latest` designation did return that version, published **2026-10-28 06:17:49 UTC**, but its release enumeration listed newer stable v2 releases, and the official `@opencode/cli` npm `latest` was **2.2.5**, published in GitHub releases **2026-10-30 23:17:23 UTC**. Consequently this report tests both the requested v1 baseline and the newer published v2. It does not treat the v1 result as evidence for v2. [L-source, P-source, I-source; ([GitHub latest designation](https://api.github.com/repos/anomalyco/opencode/releases/latest)), ([release enumeration](https://api.github.com/repos/anomalyco/opencode/releases?per_page=5)), ([official npm metadata](https://registry.npmjs.org/@opencode%2fcli/latest)).]

    | Pinned baseline | Source commit | Executed binary SHA-256 |
    |---|---|---|
    | v1.19.5 | `810c0eba1a7348036f8bdf61e6632d0c36c6876c` | `7df4e4136301f16589b0f30bf91a61380fca5f8ef22dd36570f5ebe1d4ec802c` |
    | v2.2.5 | `9bbb8ce18c80f099e0e448775f59d965ead40a21` | `8d060e1d2fbb9bb44cf09ae6ed1f3f6a7cff070b5227e2f90970132b23a92050` |

    The research lanes verified tag metadata and executed the binaries; the report writer independently computed the two binary hashes. Tag commits identify source; binary hashes identify the actual downloaded executables and do not imply a reproducible-build attestation. AIDA source inspection used HEAD `553f7d5984c6083a9f2b47cfa358ce57c438843b`; installed AIDA reported `0.16.0`, built 2026-11-02 19:30:05 -07:00. [P-source, I-runtime; ([v1 tag metadata](https://api.github.com/repos/anomalyco/opencode/git/ref/tags/v1.19.5)), ([v2 tag metadata](https://api.github.com/repos/anomalyco/opencode/git/ref/tags/v2.2.5)); writer hash verification.]

    **Provenance notation matters.** `L` means the launch/wake researcher, `P` the posture/hooks researcher, and `I` the MCP/attribution researcher. `runtime` means that named researcher executed the isolated probe; `source` means they read primary upstream source, metadata, local AIDA code, or read-only substrate; `inference` marks an engineering proposal; `unverified` marks a remaining gap. These are **delegated findings from the coordinator/report writer's perspective**, not a claim that the coordinator personally reran all tests. Each researcher calls their own executed probes verified-by-me in the retained notes. This report uses primary material and those probe records; no secondary popularity claim is needed for the recommendation.

    ### Q1 — Exact-session launch and resume work, with a version-specific server contract

    On v1, `run --help` exposes `--session`, `--continue`, `--attach`, `--dir`, username and password. A private server accepted `POST /session`; its session ID appeared in API reads and `session list --format json`. `run --session ID --attach URL --format json` completed successfully. On v2, the corresponding CLI uses `--server` and `--standalone`; its server routes live under `/api`, and the v1 `POST /session` returned 405. A v2 probe created a session through `POST /api/session` and resumed it through `run --server URL --session ID --format json`. A repeat using a realistic mock context completed both fresh launch and exact-ID resume with exit 0 and `WAKE_PROBE_OK`; the resumed run retained its ID. [L-runtime; ([v1 run implementation](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/cli/cmd/run.ts)), ([v2 OpenAPI](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/protocol/openapi.json)); [final launch results](/tmp/opencode-707-launch/v2-cli-large/results.json), [reproduction script](/tmp/opencode-707-launch/v2-cli-large.py).]

    An AIDA registry binding should contain **the exact session ID, server instance/endpoint, project/location directory, runtime owner and executable version**. Titles and slugs are display information; a PID can own several sessions. V2's `--session` may create a missing ID, so a requested resume needs a successful exact-session lookup before launch and must refuse missing or mismatched evidence. `--continue` selects implicit history and is unsuitable for a durable wake binding. A private authenticated server with an explicit AIDA lifecycle is easier to audit than silently adopting the user's global daemon. These are proposed adapter rules, not implemented behavior. [L-source, L-inference; ([v2 CLI source](https://github.com/anomalyco/opencode/tree/v2.2.5/packages/cli)), ([v2 protocol](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/protocol/openapi.json)).]

    Interactive TUI attach/rendering, replacement-server identity, restart retention and real-provider behavior remain unverified. The initial small-context mock triggered an auto-compaction template error; the larger-context repeat supersedes it as evidence for basic launch. No probe executed `aida agent new opencode`; that adapter does not yet exist. [L-runtime, L-unverified; [initial results](/tmp/opencode-707-launch/v2-cli/results.json), [corrected results](/tmp/opencode-707-launch/v2-cli-large/results.json).]

    > **Ready-to-file Q1 finding, not posted:** Verified v1.19.5 `run --attach --session` and current v2.2.5 `run --server --session` with isolated servers; final v2 fresh and exact-session resume runs exit 0 using a local mock provider. Probe: `/tmp/opencode-707-launch/v2-cli-large.py`, results alongside it. Recommend explicit v2 session/server/project/owner/version bindings and a preflight GET before resume because v2 can create an absent session ID. TUI attach and restart recovery remain acceptance work. Provenance: delegated L-runtime/L-source.

    ## Tool permissions and lifecycle hooks need separate contracts

    ### Q2 — Permissions map to tool approval, while contained requests must refuse

    Both releases support `allow`, `ask` and `deny`, but headless behavior is significant. In the measured v1 turn, allowing `bash` executed `printf probe-ok`, asking caused an explicit auto-rejection, and denying removed that tool from the model's available definitions. In v2 the corresponding tool is `shell`; the same three cases behaved likewise. V2 `--auto` allowed a tool whose rule was `ask`, while an explicit deny remained unavailable even with `--auto`. **Exit 0 only established completion of the turn**, not successful execution of a rejected tool. Thus `--auto` is not identical to replacing every rule with allow. [P-runtime; ([v1 run permissions](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/cli/cmd/run.ts#L791)), ([v2 permission evaluation](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/core/src/permission.ts)); [v1 probe](/tmp/opencode-707-posture/probe2.py), [v2 probe](/tmp/opencode-707-posture/probe-v2b.py), [auto-deny repeat](/tmp/opencode-707-posture/probe-v2c.py).]

    A decisive negative containment probe used v2 with cwd and PWD set to a scratch worktree, rules `{"*":"allow","external_directory":"deny"}`, and an allowed shell invoking Python to write a marker outside that worktree. The marker was created with the expected contents. This disproves equivalence between those permission rules and an OS filesystem boundary; it does not require a comprehensive hostile-command audit to establish that limitation. The pinned v2 shell implementation also describes host-user authority. [P-runtime, P-source; ([v2 shell plugin](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/core/src/tool/plugin/shell.ts)); [negative probe](/tmp/opencode-707-posture/probe-v2-external.py), [external marker](/tmp/opencode-707-posture/v2/external-marker).]

    The proposed mapping is an explicit **native tool-approval mode, reported as not sandboxed**, and an explicit bypass mode whose exact allow/auto semantics are recorded. Neither warrants `AIDA_CONTAINED=1` or containment-applied credit. Unsupported contained launches must refuse before leases, worktrees or child spawn, consistent with BUG-2144. A separate external confinement adapter could be investigated later; this spike provides no validation for one. The prompt's comparison with Codex is outdated: current AIDA allows an explicit trusted Codex native-sandbox opt-in while only Claude gets AIDA-applied containment. BUG-2223 concerns orphaned-lease resume/fresh recovery, not the containment ruling. [P-source, P-inference; [AIDA launch/posture resolver](/home/joe/ai/aida/aida-cli-lib/src/session.rs:3128), [vendor metadata](/home/joe/ai/aida/aida-cli-lib/src/containment/vendors.toml), read-only `aida show BUG-2144 --full --comments` and `aida show BUG-2223`.]

    `doctor --category permission-posture` must read **effective resolved state**, rather than one global file: executable major/version; global and project configuration directories; `OPENCODE_CONFIG`, `OPENCODE_CONFIG_DIR`, `OPENCODE_CONFIG_CONTENT` and legacy `OPENCODE_PERMISSION`; `--auto`; selected agent permission overrides; saved project approvals; plugin permission transformations; remote-server state; inherited AIDA containment; and any actual external confinement receipt. Unknown plugin or server authority should remain unknown. Its output should distinguish approval rules, headless ask refusal, explicit bypass and OS confinement, and healing must not silently enable allow. Current AIDA's doctor vendor loop contains Claude, Codex and Antigravity only. This is an inspection design inferred from the source, not a completed doctor implementation or an exhaustive runtime test of every precedence rule. [P-source, P-inference; ([v1 config resolver](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/config/config.ts)), ([v2 permission hooks](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/plugin/src/promise/permission.ts)); [current doctor loop](/home/joe/ai/aida/aida-cli-lib/src/config_cmd.rs:1539).]

    > **Ready-to-file Q2 finding, not posted:** Isolated release probes establish allow/ask/deny behavior and v2 `--auto` preserving explicit deny. Headless ask auto-rejects. More importantly, `/tmp/opencode-707-posture/probe-v2-external.py` wrote outside cwd through allowed shell despite `external_directory: deny`. Recommend explicit tool-approval/bypass reporting and fail-closed refusal of AIDA-contained OpenCode launch. Doctor must inspect effective config, env, argv, agent/project approvals, plugins, server and actual confinement receipt. Provenance: delegated P-runtime/P-source; doctor scope is P-inference.

    ### Q3 — Headless plugins work, and v2 reverses the old Stop-hold result

    V1 loaded a global local-JavaScript plugin during `opencode run`, delivering session created/status/idle events, tool before/after and permission events. Throwing `AIDA_PROBE_GATE_DENIED` from `tool.execute.before` produced the matching tool error, skipped execution and after-hook, and still let the turn complete exit 0. A declared `permission.ask` did not fire in the measured ask cases. Its notification-style event dispatcher is not awaited, the run loop exits on idle, and no supported stopping hook appears in the interface. These observations support the older v1 limitation rather than assuming stdout can control continuation. [P-runtime, P-source; ([v1 hook types](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/plugin/src/index.ts#L261)), ([v1 dispatch](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/plugin/index.ts#L255)), ([v1 tool invocation](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/session/tools.ts#L106)); [v1 probe](/tmp/opencode-707-posture/probe2.py), [plugin log](/tmp/opencode-707-posture/plugin.log).]

    **V2 has a different plugin API and a measured pre-idle hold.** A package default-exporting `{id, setup(context)}`, registered through `plugins:[packageDirectory]`, loaded in a headless standalone run. It observed session prompt, tool before/after and permission evaluation. Its awaited `session.hook("experimental.idle", callback)` delayed 1.5 seconds, admitted a synthetic session message, and caused a second completion on the same session ID in the same run before exit 0. This is stronger evidence than documentation alone. It establishes short awaited hold/reentry, not unlimited unattended holding or a production-equivalent Claude Stop contract. [P-runtime; ([v2 plugin interface](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/plugin/src/promise/plugin.ts)), ([v2 idle contract](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/plugin/src/promise/session.ts#L166)); [probe](/tmp/opencode-707-posture/probe-v2c.py), [package](/tmp/opencode-707-posture/v2/probe-package/index.mjs), [same-session output](/tmp/opencode-707-posture/v2/hold.stdout), [timed plugin log](/tmp/opencode-707-posture/v2/plugin.log).]

    | AIDA lifecycle need | Proposed v2 seam | Evidence boundary |
    |---|---|---|
    | Session-start context | Session prompt/context hooks plus exact binding | Prompt observed; context mapping source-inspected; once-per-session/resume semantics need adapter tests |
    | Tool gate | `tool.hook('execute.before', ...)` | Invocation observed; typed pre-execution failure channel source-inspected; typed v2 denial not independently thrown in probe |
    | Tool completion | `execute.after` | Observed in successful shell run |
    | Permission gate | `permission.hook('evaluate', ...)` | Callback/effects observed; full override/deny-preservation semantics unverified |
    | Stop/idle continuation | `session.hook('experimental.idle', ...)` and synthetic admission | 1.5-second awaited hold and same-run continuation measured; failure/interruption paths excluded by source contract |

    The mapping above combines P-runtime with P-source and P-inference; it is not a list of shipped AIDA hooks. ([V2 hook registry](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/core/src/plugin/hooks.ts#L27)), ([tool hook contract](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/plugin/src/promise/tool.ts)), ([permission hook contract](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/plugin/src/promise/permission.ts)).

    Issue #16626 is **closed as not planned**. That describes the requested v1 `session.stopping` feature; it does not negate the newer v2 `experimental.idle` seam. SPIKE-92 was source-grounded, not a current executable test. Long holds, TUI keyboard response, Ctrl-C/Esc cancellation, hook errors and crash recovery remain unverified; an adapter should leave long human-present holds disabled until those pass. [P-source, P-unverified; ([issue #16626](https://github.com/anomalyco/opencode/issues/16626)); [prior SPIKE-92 report](/home/joe/ai/aida/docs/research/2026-09-27-spike-92-research.md).]

    > **Ready-to-file Q3 finding, not posted:** Headless plugins load in both lines, with incompatible APIs. V1 has observational idle without a supported awaited stop hold; #16626 is closed not planned. Current v2.2.5 loaded a package plugin and awaited `experimental.idle`; `/tmp/opencode-707-posture/probe-v2c.py` measured a 1.5-second hold plus synthetic input and second same-session completion. Treat v2 hold as experimental, with typed gate failures, interruption, TUI responsiveness and long-duration behavior still requiring acceptance tests. Provenance: delegated P-runtime/P-source.

    ## An authenticated durable inbox fits wake better than concurrent resume

    ### Q4 — Current v2 can wake idle and busy sessions through the server

    On a private loopback v2 server with `OPENCODE_SERVER_PASSWORD`, unauthenticated API access returned 401 and the configured Basic credentials worked. `POST /api/session/{id}/prompt` returned HTTP 200 with an inbox receipt including message ID, session ID, payload and delivery. Submitting with `resume:false` staged input without executing; a normal subsequent prompt woke the session and consumed it. Another prompt sent during a two-second mock generation was accepted and consumed in a subsequent turn. Final state contained all three user markers, two `WAKE_PROBE_OK` assistant replies, an empty inbox and successful idle outcome. This verifies configured authentication and measured generation-time queuing, not secure defaults or tool-interruption behavior. [L-runtime; ([v2 protocol](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/protocol/openapi.json)); [probe](/tmp/opencode-707-launch/v2-api.py), [results](/tmp/opencode-707-launch/v2-api/results.json), [mock request log](/tmp/opencode-707-launch/v2-api/mock-requests.jsonl).]

    V2's protocol describes durable admission and exposes caller IDs, delivery mode and resume control; its handler includes 409 conflict handling. Retry idempotency and persistence across a crash were not measured. V1's `prompt_async` 204 is a different, weaker receipt; a 500ms read initially lacked the message, which later persisted and ran on resume. A v1 204 must not be presented as evidence of v2 durable admission or of AIDA mail consumption. [L-source, L-runtime; ([v2 handler](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/server/src/handlers/session.ts#L290)), ([v1 handler](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/server/routes/instance/httpapi/handlers/session.ts#L311)); [v1 evidence](/tmp/opencode-707-launch/api-probe.json).]

    The read-only substrate lookup resolves STORY-HOME-096 to **STORY-2136**, SPIKE-HOME-002 to **SPIKE-706**, and BUG-HOME-028 to **BUG-2345**. The existing wake contract requires verified inbox/audience ownership, exact session binding, one multiplexed project unit, arm/retire ownership checks, dedupe ledgers, doctor/list visibility and unsupported fallback. The previous AGY investigation rejected concurrent resume as a substitute for a supported exact-target submission path. OpenCode v2's measured server API is a substantially better fit. Use it as a per-vendor dispatch beneath the existing watcher; do not start a second process to race ownership of the same session or use model mail polling. [L-source, L-inference; [AIDA wake implementation](/home/joe/ai/aida/aida-cli-lib/src/mailbox_wake_run.rs), [wake setup and recovery](/home/joe/ai/aida/docs/agents/codex-mail-wake.md).]

    **OpenCode acceptance is not AIDA acknowledgement.** Persist the API receipt separately; only AIDA's read/ack lifecycle changes mailbox state. A production adapter must bind endpoint and owner as well as ID, choose a tested busy-delivery policy, reconcile lost responses before retry, and handle retired or replaced servers. Default `steer` happened to queue the mock turn; explicit queued delivery should be tested if no mid-tool steering is intended. Caller-generated IDs are promising recovery primitives but remain source-level evidence until duplicates, conflict, dropped-response and restart tests pass. [L-inference, L-unverified; ([v2 protocol](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/protocol/openapi.json)); [existing acceptance ledger](/home/joe/ai/aida/aida-cli-lib/src/mailbox_wake_run.rs).]

    > **Ready-to-file Q4 finding, not posted:** Current v2.2.5 authenticated prompt API woke a bound idle session and accepted a prompt during generation, consumed later in the same session. Probe: `/tmp/opencode-707-launch/v2-api.py`; receipts/transcript/mock log retained. This supports a per-vendor wake adapter under STORY-2136's existing watcher, with OpenCode acceptance distinct from AIDA ack. Lost responses, retries, ID conflicts, restart/replacement and long-running-tool delivery remain release gates. Do not substitute concurrent resume. Provenance: delegated L-runtime/L-source; adapter policy is L-inference.

    ## Global integration is the early gate; harness attribution is mostly compatible

    ### Q5 — v1 integrates globally; current v2 activation remains unresolved

    The v1 probe wrote only isolated global configuration. It registered a local wrapper that changed cwd to the AIDA repository and executed the real installed `aida mcp-serve`; `opencode mcp list` reported connected. Genuine repository `aida-queue` and `aida-status` skills were placed respectively under isolated `~/.config/opencode/skills` and `~/.agents/skills`; `debug skill` returned their names, paths and contents. A global `commands/aida-queue.md` appeared in `debug config`. These establish MCP connection and skill/command discovery without project hand edits, not complete MCP tool invocation or model-selected skill/command execution. [I-runtime; ([v1 MCP documentation](https://opencode.ai/docs/mcp-servers/)), ([skills documentation](https://opencode.ai/docs/skills/)), ([pinned command parser](https://github.com/anomalyco/opencode/blob/v1.19.5/packages/opencode/src/config/command.ts)); [probe](/tmp/opencode-707-integration/probe.py), [MCP log](/tmp/opencode-707-integration/v1-mcp-list.log), [skills log](/tmp/opencode-707-integration/v1-debug-skill.log), [command/config log](/tmp/opencode-707-integration/v1-debug-config.log).]

    Current v2 was tested with migrated v1 config and native `mcp.servers`, both default daemon and `--standalone`, then a private authenticated `serve` with explicit `OPENCODE_CONFIG` and the correct `location[directory]` query. `/api/config` showed the intended global configuration and AIDA command, while `/api/mcp` returned `data:[]`; skills and commands exposed builtins or empty results, not the injected AIDA items. A session-create plus three-second repeat still failed registration. **This is an unresolved bounded runtime discrepancy, not proof that v2 lacks MCP or skills.** Its official docs and pinned registration source advertise those facilities. Parsing a config, HTTP 200, or CLI exit 0 is insufficient to claim activation. [I-runtime, I-source; ([v2 config docs](https://opencode.ai/v2/docs/config/)), ([v2 skills docs](https://opencode.ai/v2/docs/skills/)), ([v2 MCP registration](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/core/src/config/plugin/mcp.ts)); [native probe](/tmp/opencode-707-integration/probe-v2-native.py), [direct server probe](/tmp/opencode-707-integration/probe-serve2.py), [session repeat](/tmp/opencode-707-integration/probe-serve3.py), [runtime MCP response](/tmp/opencode-707-integration/v2-private-mcp.json), [parsed config](/tmp/opencode-707-integration/v2-private-config.json).]

    The first staged story should resolve that discrepancy and require a real AIDA handshake, genuine skill discovery and command discovery under the intended private-server/headless architecture before adapter parity is claimed. Global delivery also needs per-session project/worktree selection: the successful v1 wrapper deliberately pinned this repository and is not a production multi-project solution. Config sync should preserve JSONC/user settings, be idempotent, respect opt-outs and validate reload/restart. These are proposed acceptance requirements. [I-inference; [existing shared skills scaffold](/home/joe/ai/aida/aida-cli-lib/src/scaffold_cmd.rs:900), ([v2 MCP schema](https://github.com/anomalyco/opencode/blob/v2.2.5/packages/schema/src/config/mcp.ts)).]

    > **Ready-to-file Q5 finding, not posted:** V1.19.5 globally connected the real AIDA MCP server and discovered genuine AIDA skills and a global command without project edits. Current v2.2.5 parsed the tested native global config but did not register those runtime integrations, including direct-server and post-session repeats. Evidence: `/tmp/opencode-707-integration/probe.py`, `probe-v2-native.py`, `probe-serve3.py` and retained logs. Root cause remains unknown; require a v2 activation gate rather than treating v1 success as v2 support. Provenance: delegated I-runtime/I-source.

    ### Q6 — Keep OpenCode as harness identity and models as separate evidence

    An actual isolated Git commit with `[AI:opencode] test(probe): attribution (SPIKE-707)` produced AIDA `metrics ai-lift --json` output `tools:{"opencode":1}`, one trailer commit and coverage 1.0. A real `trace scan` found the `// trace:SPIKE-707 | ai:opencode` link. The fixture's separate `trace check` reported zero traces/store unreachable and is excluded as positive evidence. Trace scanning proves linkage, not preservation of attribution in every renderer; one older regex captures the tool only with an additional confidence field. [I-runtime, I-source; [attribution script](/tmp/opencode-707-integration/probe-attribution.py), [metrics output](/tmp/opencode-707-integration/attribution-metrics.log), [trace output](/tmp/opencode-707-integration/attribution-scan.log), [trace parser](/home/joe/ai/aida/aida-cli-lib/src/trace_cmd.rs:377).]

    The central agent normalizer still maps unrecognized `opencode` to `other`; remote activity uses that normalizer. Vendor enums/allowlists elsewhere contain only the established harnesses, with different subsets. A fourth adapter therefore needs an identity/dispatch inventory beyond changing commit syntax. The proposed conventions are exactly **`[AI:opencode]` and `ai:opencode`**, with executable-reported harness version and provider/model stored separately. A Claude-family model running inside OpenCode does not make the harness Claude Code; an OpenAI model does not make it Codex. Do not overload the attribution confidence suffix with a model name. [I-source, I-inference; [identity normalizer](/home/joe/ai/aida/aida-core/src/mailbox_identity.rs:61), [remote activity](/home/joe/ai/aida/aida-cli-lib/src/remote_activity.rs:47), [dispatch enum](/home/joe/ai/aida/aida-core/src/dispatch_routing.rs:30), [vendor config](/home/joe/ai/aida/aida-core/src/agents_config.rs:33), [provenance](/home/joe/ai/aida/aida-core/src/provenance.rs:228); ([v2 provider/model configuration](https://opencode.ai/v2/docs/config/)).]

    Model switches and per-turn attribution across real providers were not exercised. The implementation must retain unknown model evidence as unknown and avoid converting the harness label into model authority. [I-unverified, I-inference; [AIDA write context](/home/joe/ai/aida/aida-core/src/provenance.rs:228).]

    > **Ready-to-file Q6 finding, not posted:** `[AI:opencode]` passed actual AIDA commit metrics and `ai:opencode` retained trace-ID linkage in an isolated Git fixture. Central identity still collapses OpenCode to `other`, so enum/normalizer/registry readers need an audit. Use OpenCode for harness attribution, with provider/model/version separate; no model-name collision is inherent. Probe: `/tmp/opencode-707-integration/probe-attribution.py` and metrics/scan logs. Provenance: delegated I-runtime/I-source; naming policy is I-inference.

    ## A staged v2 choice preserves the useful evidence without claiming parity

    The demonstrated API and plugin seams make an adapter technically credible; they do not establish operational parity or user demand. This research did not validate the prompt's stars, market ranking or strategic adoption claims and does not use them to justify investment. The strongest reasons to proceed are concrete coordination capabilities: exact-session execution, authenticated durable-input admission, busy-turn delivery and headless lifecycle hooks. The strongest reason to defer is the unresolved current-release MCP/skills activation combined with rapid v1/v2 interface change. [Cross-lane inference from the cited runtime evidence; demand remains unverified.]

    | Human option | Consequence and trade-off | Proposed sidecar token |
    |---|---|---|
    | **Staged v2 pilot — recommended** | Fund bounded v2 integration qualification first, then a version-pinned adapter pilot if it passes. Keep contained launch refused and unsupported capabilities explicit. Gains current wake/pre-idle seams, with migration and experimental API cost. | `tag:+adapter:staged-v2` |
    | Defer until v2 integration is repeatable | Avoid adapter maintenance now; retain evidence and re-enter when MCP/skills/commands activate reliably or an upstream cause is known. Delays a fourth harness. | `tag:+deferred:opencode-v2-integration` |
    | Legacy-v1-only pilot | Use demonstrated v1 MCP/skills connection and established v1 interfaces, explicitly without pre-stop hold parity. Creates immediate major-version migration work and does not benefit from measured v2 durable inbox/idle hook. | `tag:+adapter:legacy-v1-pilot` |

    These tokens are machine-readable **proposals**, not executed changes or approval to implement. A staged GO should stop at its first failing acceptance gate rather than silently fall back to v1, change containment policy or advertise unsupported integration. No cost estimate is justified by the probes alone. [Cross-lane inference.]

    ### Draft story decomposition for the recommended option

    The following are **draft story outlines in this report only**; no canonical IDs have been allocated and no stories have been filed. “D1” through “D7” are local outline labels, not AIDA spec IDs. Dependencies describe a proposed order if the human chooses GO. All tests should run against an explicit supported v2 range and refuse incompatible versions. [Cross-lane inference based on the evidence above.]

    | Draft | Scope and dependency | Testable acceptance and stop condition |
    |---|---|---|
    | **D1 — Qualify current v2 global integration** | First gate; no adapter launch work required. Explain parsed-config/runtime-absence discrepancy. | In isolated global roots and the intended private-server/headless mode, connect the real AIDA MCP server, inspect its tool discovery without writes, discover genuine AIDA skills and a command, and execute a harmless command/skill selection. Cover two projects/worktrees with correct cwd and authority. Preserve user JSONC/settings and prove idempotent sync/opt-out/reload behavior. If this fails, report the exact cause or upstream blocker and stop the staged path for human review. |
    | **D2 — Add first-class harness identity and capability/version selection** | After D1. Audit vendor enums, normalizers, registry/status/list, dispatch, resume, session end and compete/judge paths; separate model provenance. | OpenCode remains `opencode` rather than `other`; existing commit/trace conventions and established vendors retain behavior. Provider/model/harness version stay distinct, unknown evidence stays unknown, unsupported versions/capabilities refuse with useful diagnosis. Arbitrary names gain no authority. |
    | **D3 — Enforce launch posture and doctor visibility** | After D2; prerequisite for any actual AIDA child launch. | Contained requests refuse before resource mutation/spawn, including inherited containment. Native tool approvals and explicit bypass are accurately reported; headless ask, deny and auto semantics match probes. Doctor reports effective config/env/argv/agent/plugin/server state and unknowns without enabling allow. No synthetic probe or hook receipt grants containment credit. |
    | **D4 — Implement exact-session launch/resume and owned server lifecycle** | After D2–D3, using D1's qualified config. | Fresh headless start and exact resume capture IDs; absent requested IDs and project/owner/endpoint mismatch refuse. Verify bounded startup, cancellation, failed spawn cleanup, server replacement, crash/restart identity and registry/PID correlation. Interactive attach is separately gated until rendering/input tests pass. |
    | **D5 — Bridge versioned lifecycle plugins** | After D1–D4. Package and install v2 plugin once, with explicit capability receipts. | Startup/prompt context preserves AIDA identity without duplicate injection; typed tool-gate refusals prevent execution; errors/disabled plugins fail visibly. Preserve explicit permission denials. Test short pre-idle synthetic continuation, interrupted/failed turns, cancellation, Ctrl-C/Esc, TUI responsiveness and timeout behavior. Keep long holds disabled unless tested; report experimental API status. |
    | **D6 — Add OpenCode to the existing wake adapter dispatch** | After D3–D4; use D5 only for hook-specific requirements, not as a reason to keep a turn held. | Exact audience/session/project/server/owner binding; authenticated private endpoint; accepted receipt separate from AIDA ack; stable caller-ID dedupe/conflict, lost response, restart/replacement and retirement recovery. Idle, generation-busy and long-tool busy delivery follow an explicit tested policy. Uncertain submission pauses pending reconciliation. No model polling, keystroke injection or concurrent resume. |
    | **D7 — Prove bounded end-to-end pilot and document support limits** | After D1–D6, independent review before widening support. | Run the actual AIDA launch/list, MCP/skills, lifecycle, mail acceptance/ack, attribution and resume flows in isolated fixtures and a human-approved pilot. Include wrong version, dead server, disabled plugin and unresolved permission cases. Document global install/recovery and unsupported containment; regression-test established harnesses. A human chooses whether to expand from pilot based on results. |

    This decomposition deliberately makes global integration qualification the cheapest early exit. OS containment is a separate optional future investigation, not a hidden promise inside these stories. V2's experimental pre-idle seam should not be made essential to mail delivery when a supported server inbox already provides a better lifetime boundary. [Cross-lane inference.]

    ### Reproduction and evidence limits

    | Question | Retained executable entry point | Important retained result |
    |---|---|---|
    | Launch/resume | `python3 /tmp/opencode-707-launch/v2-cli-large.py` | `/tmp/opencode-707-launch/v2-cli-large/results.json` |
    | Permissions | `python3 /tmp/opencode-707-posture/probe2.py`, `probe-v2b.py`, `probe-v2c.py` | `/tmp/opencode-707-posture/v2/{allow,ask,deny,auto,autodeny}.{stdout,stderr}` |
    | OS write boundary | `python3 /tmp/opencode-707-posture/probe-v2-external.py` | `/tmp/opencode-707-posture/v2/external-marker` |
    | Plugin hold | `python3 /tmp/opencode-707-posture/probe-v2c.py` | `/tmp/opencode-707-posture/v2/hold.stdout`, `plugin.log` |
    | Wake | `python3 /tmp/opencode-707-launch/v2-api.py` | `/tmp/opencode-707-launch/v2-api/results.json`, `mock-requests.jsonl` |
    | MCP/skills/commands | `python3 /tmp/opencode-707-integration/probe.py`, `probe-v2-native.py`, `probe-serve3.py` | v1 discovery/connection logs; v2 private config/MCP/skill/command JSON |
    | Attribution | `python3 /tmp/opencode-707-integration/probe-attribution.py` | attribution metrics and scan logs |

    The scripts retain their exact argv, configuration, fixture-server setup and assertions; inspect them before rerunning because they create local servers and scratch state. Runtime homes/XDG roots and model fixtures were isolated under `/tmp`; the AIDA MCP wrapper read this repository's substrate without mutating requirements. The launch researcher disclosed an early credential-free v1 default-provider turn that listed an empty scratch directory before all v2 model probes were switched to local mocks. No private project content was sent by that probe. The integration researcher disclosed an initial non-isolated `--version` attempt whose attempted default data-directory creation was refused; subsequent probes used isolated roots. Researchers report their owned servers/processes stopped. These bounded exceptions are retained rather than claiming perfect isolation from the first command. [L-runtime, I-runtime disclosures in retained notes.]

    No paid/live-model interoperability, exhaustive permission audit, all MCP schemas, model-driven skill use, long-duration hold, restart durability or end-to-end AIDA adapter has been proven. Positive mock results establish transport and lifecycle mechanics, not model quality. All six question findings above remain ready-to-file text only. Full lane notes are retained in [launch/wake](<notes/OpenCode adapter feasibility/launch-wake.md>), [posture/hooks](<notes/OpenCode adapter feasibility/posture-hooks.md>) and [integration/attribution](<notes/OpenCode adapter feasibility/integration.md>).

    The human decision is therefore whether the demonstrated v2 seams justify a bounded early-gated investment. A staged pilot is the recommendation because it tests the unresolved dependency first and gives a deterministic exit if it remains broken. Selecting that path would still leave support expansion, long-hold policy and any OS confinement design as later explicit decisions; this report applies none of them.
