title: Evaluate extracting store multi-node sync logic into an aida-store-sync crate
description: |
  The audit prototyped crates/aida-store-sync in ~/ai/aida-multinode (3-way merge, pull-conflict gating, field diffs, rebase command builder, author resolution, multi-hub topology) with 11 fast unit tests. Architecture change: needs a sketch on this spec and advisor signoff before any code. Question to answer: does extraction pay for itself against the crate split already under way (TASK-1067 line), and which pieces move.

  Source: aida-multinode audit 2026-11-15 (~/ai/aida-multinode/docs/UPSTREAM-REPORT.md). Candidate fix already exists on branch fix/multinode-sync-bugs (worktree ~/ai/aida-multinode-fixes, base 6f0d951, 7 behind main); commits carry [AI:antigravity] and BUG-MN-* ids, so a lane must re-trailer with this spec id and run our CI, not trust the report's local test run. Harness: ~/ai/aida-multinode/harness/run_multinode_suite.sh --aida-bin <bin> --strict.

  ## Acceptance (spike output)
  1. A sketch comment on this spec lists each candidate piece (3-way merge, pull-conflict gating, field diffs, rebase command builder, author resolution, multi-hub topology) with a move / leave / drop call and its current home in the workspace.
  2. The sketch compares extraction against the crate split already under way (TASK-1067 line) and states whether a separate crate pays for itself (build-time and dependency impact, test isolation).
  3. The fix/multinode-sync-bugs commits are triaged: each BUG-MN-* item is either mapped to an existing AIDA spec, filed as a new draft, or rejected with a reason.
  4. Advisor signoff is recorded before any implementation spec is approved. No production code lands under this spike.
