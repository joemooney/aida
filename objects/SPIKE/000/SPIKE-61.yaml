  content: |-
    ADVISOR VERDICT (2026-06-13, after reviewing the research doc PR #851 + verifying its load-bearing claim): research is excellent and ACCEPTED. Source-grounded competitor table + tech tradeoff matrix; confirms the prior with two well-argued corrections.

    VERIFIED (provenance): the doc's key claim — that AIDA already has the 'contained' seam — checks out, with ONE correction: STORY-567 ('Contained execution posture') is COMPLETED and ON MAIN (the '--contained' flag exists in aida-cli/src/cli.rs:600,708: 'Launch Claude in contained mode: strict Bash sandboxing'), NOT 'in flight on codex/story-567-contained' as the doc states — that branch is an unpruned leftover. So slice 1 builds on already-shipped code, not pending work.

    CORRECTIONS TO THE PRIOR (accepted): (1) bubblewrap OVER rootless Podman for cheap local isolation — it's already in the stack via Claude Code, zero cargo-build overhead, no rootless-net/UID-map friction. (2) Firecracker microVM OVER gVisor for the strong unattended-drain profile — gVisor imposes a real cargo-build slowdown + lacks the iptables nat table clean egress-allowlisting needs; gVisor stays as the no-/dev/kvm fallback.

    THE REAL GAPS (what to build): (a) an OS boundary around the WHOLE 'claude -p' process — the contained posture only sandboxes Claude's Bash tool, not Edit/Write/MCP/network; (b) network-egress allowlisting — the single most differentiated competitor capability. DIFFERENTIATION: an opt-in LOCAL strong-isolation mode (microVM) is genuinely novel — every competitor's strong isolation is cloud-only.

    ROADMAP: slice 1 (~1 day) = harden the EXISTING contained posture with default-deny egress allowlist config. slice 2 = the OS-wrapper [sandbox] posture around the full process. Both keystone-adjacent → keyboard, advisor-watched, not unsupervised drain. Awaiting operator go before filing slice 1 as an implementable spec.
