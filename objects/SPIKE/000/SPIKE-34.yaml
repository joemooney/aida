title: Re-shape `aida agent new claude` as a `claude --bg --agent <subagent-def>` wrapper
description: 'Divest move from the 2026-05-29 strategic-recompose synthesis. Claude Code''s `claude --bg --name ''...'' --agent <subagent-def>` ships native dispatch + worktree isolation + supervisor process. AIDA''s current `aida agent new claude` re-implements much of this. Re-shape as a wrapper: keep only role-context snapshot file + brief-polling + lease registration; strip parts that now duplicate `claude --bg`. Reduces surface area without reducing capability. Pre-req: `.claude/agents/<role>.md` scaffolding from AIDA''s role defs (separate STORY). trace:SPIKE-15'
