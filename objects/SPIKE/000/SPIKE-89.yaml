  content: 'Prototype reference: /home/joe/.gemini/antigravity-cli/brain/9c629ead-bd75-4722-88c6-5378a0d7d8cd/shimmer_prompt.py. This Python example demonstrates the intended interaction: render a 30 FPS copper shimmer and prompt together, switch the terminal to cbreak mode, use select with a frame timeout, stop shimmering on the first input byte, retain the byte in the prompt buffer, support Enter/Ctrl-C/Ctrl-D/backspace/Ctrl-U/Ctrl-W/escape handling, redraw only the banner region, restore terminal settings and cursor in finally, and fall back to ordinary stdin when not attached to a TTY. The Rust spike should use this as behavioral reference, while replacing the Python terminal handling with a cancellation-safe Rust implementation and configurable shimmer/static/off modes.'
