title: Prototype configurable AIDA launch animation
description: |-
  Build a small standalone Rust terminal prototype for AIDA's pre-interaction launch experience. Before the agent picker or any user input, show either an animated shimmer, a static AIDA banner, or nothing according to configuration. The prototype must validate terminal ownership, first-keystroke handling, and cleanup before this behavior is integrated into `aida init` or `aida agent new`.

  The first keystroke should stop the animation and remain available to the following interactive picker rather than being lost. Non-TTY and machine-readable/headless launches must not animate.

  ## Acceptance
  - A standalone Rust test program can run the shimmer before a simulated picker.
  - Modes exist for animated shimmer, static banner, and disabled output.
  - The first keystroke cancels animation and is forwarded or buffered for the next input consumer.
  - Ctrl-C, terminal resize, normal completion, and process interruption restore cursor visibility, colors, and screen state.
  - The prototype does not emit animation when stdin/stdout are not terminals or when machine-readable output is selected.
  - The prototype documents the terminal assumptions and recommended integration boundary for `aida init` and `aida agent new`.
  - Automated tests cover mode selection and cancellation/cleanup logic where terminal-independent testing is possible; manual verification covers the real terminal interaction.
