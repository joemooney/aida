  content: 'CONCRETE FIX IDENTIFIED (2026-06-26): the CLI ''aida queue list --epic'' (TASK-923) reuses aida_core::graph_walk::walk_union over BOTH (Child,Parent) edges — the same closure aida graph --tree uses (BUG-543/BUG-448) — so it AGREES with the tree and is robust to one-directional edges. The TUI focus-lens closure (STORY-695, SpecStore::descendants_of) was written to walk ONLY Parent edges, which is exactly why it showed 4 of ~10 children. FIX: port the focus lens to the same walk_union(Child,Parent) pattern so the TUI lens, --tree, and the CLI --epic filter all agree and are direction-robust. That aligns the three views and removes the focus lens''s dependence on perfectly-bidirectional edges.'
