  content: 'SPIKE-13 conclusion (report: docs/spikes/2026-06-07-spike-13-budget-aware-dispatch.md). VERDICT: recommend the portable FUSED Path 2+3+4 (operator-supplied hints + observed-availability inference + heartbeat paused-state); DEFER Path 1 (per-provider budget APIs) indefinitely as non-portable/brittle/pre-evidence. Key insight: dispatch needs an availability STATE BIT + timestamp (''unavailable since T, ~back T''''), not a token-budget integration — budget/rate-limit/manual pauses all collapse to one `paused` record on the EPIC-31 registry, extending STORY-435 heartbeat. Brief-time guard WARNS (heuristic), never refuses (per substrate-as-bouncer: hard gates are for invariants). BUILD STILL GATED: we have 2 budget-pause observations; spec self-gates at >=3-5, and the operator''s 2026-06-06 disposition said KEEP PARKED/recurrence-triggered. So this spike de-risks the design and files STORY-528 (draft, recurrence-gated) ready to pull at event #3 — no build now. Manual discipline (feedback_multi_agent_budget_dispatching) already covers the gap meanwhile. No code change — report doc only.'
