title: 'SPIKE: multi-agent budget-aware dispatching surface (per-agent headroom in aida status; brief-time budget check)'
description: "## Hypothesis\n\nMulti-agent AIDA work hits budget walls (Antigravity hourly limit, web /ultraplan usage caps, Claude credit pools). Master/advisor dispatch decisions today don't surface agent-budget state — operator + advisor must mentally track. A substrate-aware budget surface would let dispatch be budget-aware programmatically.\n\n## Why now\n\nEmpirical 2026-05-23 evening: Antigravity paused mid-implementation hitting budget; web /ultraplan hit 'Approaching usage limit' mid-plan-generation. Both were surprises to the master advisor mid-dispatch. The pattern is real + recurring; warrants evidence-gathering on what budget surface would actually help.\n\n## Investigation paths\n\n1. **Per-agent budget API integration** — each agent provider has a credit/usage API. Could AIDA aggregate?\n   - Claude (Anthropic): /v1/messages/count_tokens + usage tier\n   - Codex (OpenAI): usage API\n   - Antigravity: ?\n   - Web /ultraplan: same as Claude credit, presumably\n   \n   Cost: per-provider integration; non-portable; coupling to upstream APIs that change.\n\n2. **Operator-supplied budget hints** — operator declares 'Antigravity has ~/hour reset' or 'Codex has Y tokens remaining'; advisor uses for dispatch heuristics. Manual but portable.\n\n3. **Observed-availability inference** — agent fails or pauses -> advisor records 'paused at HH:MM' tagged to the agent identity; next brief checks 'how long ago was the last pause?' as a proxy for budget recovery.\n\n4. **Heartbeat-based** (composes with STORY-435 when shipped) — agent's last_active_at + 'in known-paused state' bool surfaced in aida status.\n\n## Deliverables\n\n- Evidence-based recommendation on which path(s) to pursue\n- Drafted spec(s) for the recommended approach (likely 1-2 TASK/STORY filings post-SPIKE)\n- Updated discipline doc (per feedback_multi_agent_budget_dispatching memory) reflecting the empirical findings\n\n## Spec selection for the SPIKE itself\n\nNot implementation work; this is investigation. Do over a few sessions or sprint observations to gather more empirical data on budget-pause events. Defer pickup until we have more data points than today's 2 observations.\n\n## Composes with\n\n- feedback_multi_agent_budget_dispatching memory (just-written) — the manual discipline this SPIKE potentially mechanizes\n- EPIC-31 (agent registry + launcher + state) — sibling agent-coordination work; budget is the missing dimension\n- STORY-435 (MCP heartbeat) — heartbeat already tracks last_active_at; 'paused' state is a natural extension\n- STORY-447 (effort estimation 4 touchpoints) — calibration data 'expected duration vs agent budget headroom' feeds this analysis\n- TASK-513 (credit-burn workflow) — sibling 'be budget-aware about ultra* spend' surface; this SPIKE generalizes to all agents\n\n## Out of scope\n\n- Implementation (this is a SPIKE — investigate, then file follow-up specs)\n- Solving cross-machine budget rebalancing\n- Real-time budget polling (cost-prohibitive)\n\n## Origin\n\n2026-05-23 user (after master deferred filing this 'until tomorrow'): 'anything Worth filing tomorrow is Worth filing today, otherwise I will forget.' Discipline lesson + the substantive observation both filed same-turn.\n\n## ✅ Operator decision (2026-06-06 disposition sweep)\n\nKEEP PARKED, recurrence-triggered — the spec self-defers on thin evidence (2 observations); revisit when budget-pause events recur (≥3-5 data points). The manual discipline is already captured (feedback_multi_agent_budget_dispatching). Per-provider budget APIs are non-portable, so don't over-invest pre-evidence.\n"
