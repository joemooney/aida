  content: |-
    Write-up: docs/plans/2026-10-28-private-core-split-spike.md (PR #3007).
    1. Repo is already PUBLIC + MIT with 966 aida-core commits; a split only protects future code; history scrub breaks SHA refs and protects nothing.
    2. Coupling: 85/99 core modules consumed (~3,150 refs); 50 of 57 core-src PRs in last 200 also touched a consumer (25% of all PRs would go two-repo).
    3. Fork PRs: 0/200 from forks; public logs leak any privately-compiled source, so private code must never build on public runners.
    4. Recommendation: DO NOT SPLIT YET. If a proprietary capability is named, use a narrow private aida-pro crate behind public traits (option C); monorepo+export mirror (D) only if it grows large.
    5. Operator decision: what, specifically, is proprietary? (none -> close; named capability -> C; most of core -> D; also weigh a license change.)
