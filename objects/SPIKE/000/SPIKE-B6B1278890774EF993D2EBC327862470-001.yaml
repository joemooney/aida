title: Evaluate splitting aida-core (or proprietary core crate) into a private repo with public-repo GitHub Actions CI
description: |
  ## Context
  Explored architectural options for keeping a core library (`aida-core` or a dedicated proprietary crate) in a private GitHub repository while keeping the rest of AIDA (`aida-cli`, `aida-cli-lib`, `aida-tui`, `aida-server`, etc.) in a public repository that runs GitHub Actions CI.

  ## Options Discussed
  1. **Full `aida-core` Private Repo**:
     - Checked out into `./aida-core` during public CI via `actions/checkout@v4` with a fine-grained read-only token (`AIDA_CORE_READ_TOKEN`), or referenced as a Cargo git dependency using `git config url.insteadOf`.
     - External users cannot `cargo build` from source without private repo read access, though pre-built binaries from CI remain distributable.
  2. **Open-Core Split**:
     - Keep public traits/models/interfaces in public `aida-core` so external users and `--no-default-features` builds compile from source, while isolating proprietary logic in an optional private crate pulled during CI.

  ## Key Constraints & Risks to Resolve
  - **Public CI Logs**: Public repo Actions logs are world-readable; compiler error snippets or panic backtraces inside the private crate can appear in CI logs unless sensitive tests run in the private repo via `repository_dispatch`.
  - **Fork PRs**: External fork PRs do not receive `secrets.AIDA_CORE_READ_TOKEN` on standard `pull_request` events.
  - **Coordinated Cross-Repo Changes**: Atomic workspace PRs across `aida-core` and `aida-cli-lib` become two-repo changes unless branch-matching or staging is automated.
  - **Git History Scrubbing**: Making the existing repo public requires `git filter-repo` or a clean snapshot push so historical `aida-core` commits are not exposed in git history.
