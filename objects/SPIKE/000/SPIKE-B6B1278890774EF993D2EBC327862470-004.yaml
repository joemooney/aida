decision_request:
  question: Should AIDA first harden and document direct root-to-inside bundle grants, invest now in recursive offline pool delegation, or defer inside agreed-ID support?
  choices:
  - label: Bounded hardening first
    consequence: Repair final-slot admission and the generic claim-evidence gap, clarify direct root-to-hub scope, and add two-hub bundle regression coverage; defer recursive delegation and replenishment design.
    resolution: tag:+spike708:bounded-hardening
  - label: Recursive delegation now
    consequence: Design and implement parent-home-accepted subgrants and portable ancestor evidence for root-to-inside-to-team delegation, including compatibility, replay, and replenishment semantics.
    resolution: tag:+spike708:recursive-delegation
  - label: Defer inside agreed IDs
    consequence: Use node-local IDs inside the gap and postpone support claims for inside agreed-ID operation until a broader authority design is approved.
    resolution: tag:+spike708:deferred
  recommended: 0
  rationale: The direct bundle workflow already works through grant import, inside-hub claim ordering, non-final minting, return union, and overlap refusal. Bounded repairs address observed failures without prematurely expanding the authority model. Recursive grants require a separate reviewed design for offline ancestor acceptance and stable authority identity.
  asked_at: 2026-11-03T02:42:27.887807136Z
