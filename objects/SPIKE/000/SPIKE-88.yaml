agreed_id: SPIKE-88
title: Evaluate multi-clone aida-store writer policies and proposal branches
description: 'Evaluate a simpler multi-node synchronization model for the git-canonical `aida-store` branch. Candidate policy: one designated maintainer clone writes the canonical branch directly; satellite clones use proposal mode, committing requirement/comment changes to branches based on `aida-store` (for example `aida-store/<node>/<slug>`) and handing them to the maintainer as a forge change request or a forge-less cherry-pick/bundle recipe. Consider an optional readonly mode as well. Preserve readable/offline operation in every clone, but prevent proposal clones from directly pushing canonical queue, lease, lock, registry, or coordination state. Investigate which store data is append/merge-friendly versus conflict-prone, how new IDs/comments/status edits should behave, how canonical branch protection interacts with code-branch workflows, and how to recover without a forge. Deliverable: a bounded design recommendation with migration/backward-compatibility notes and explicit acceptance criteria for a follow-on implementation spec. Do not implement during the spike.'
