    ? SEM (0.98) — For the 2026-09-17/18 window, first-parent commits reaching main are the authoritative throughput measure; PrMerged events cover only 17 of the 28 main commits and therefore cannot be treated as a complete merge ledger.
    ? AC (0.93) — An overnight drain must preserve reciprocal gate independence: the author of a change cannot approve and merge that same change; the observed window satisfied this for both advisor-authored and Codex-authored changes.
    ? SEM (0.97) — BUG-1213 required five orchestrator runs before merge: two ci-red shelves, two verdict:request-changes shelves, and one AdvisorEscalated run; the escalation rather than another unchanged cycle was the successful dogfood signal.
    ? SEM (0.94) — BUG-1218 was exposed by one BUG-1207 drain round with two reviewer attempts, then reached the advisor gate in one implementation/CI/review run after the fix; BUG-1195 was fixed before the bounded window after one reviewer phase made two failed tool attempts.
    ? ADR (0.91) — Unattended shift supervision is event-first: persist the last consumed event and an idempotent action key, wake on event append, and use periodic scheduler ticks only for crash recovery so restarts cannot duplicate launches, rework, or mail.
    ? ADR (0.94) — Drain ownership and liveness must be lease-based, using PID plus process-start identity, heartbeat, command/run UUID, and an expiry/reap policy; process-name matching is insufficient to own or recover the global drain lock.
    ? AC (0.90) — A durable advisor gate may release a merge only after an independent verdict, required CI, and harvest/ledger checks; changes requiring judgment remain held for morning rather than being auto-released.
    ? AC (0.88) — Mailbox supervision must emit a MailReceived event, track oldest unread age, and escalate or reassign when the gate misses its service window instead of assuming the recipient session is reading.
    ? SEM (0.92) — Every running wave must identify its binary build SHA; a substrate fix landed during a wave triggers a controlled rebuild whose new binary applies only to the next run, and the version transition is recorded.
    ? AC (0.91) — End-of-shift reconciliation must be machine-generated from event counts, queue membership, open PRs, holds, findings, unread mail, and remaining operator-only work, and must flag discrepancies between main commits and PrMerged-event coverage.
