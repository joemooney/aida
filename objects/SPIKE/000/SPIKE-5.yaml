id: 019df46f-c199-7c31-b818-f54e5c44d554
spec_id: SPIKE-5
title: 'Spike: scaffold file categorization (template / seed / managed-merge)'
description: |-
  Design the categorization model for scaffolded files so `scaffold upgrade` (FR-1-028) has well-defined per-file semantics.

  Investigation goals:
  1. **Enumerate categories.** Confirm the three categories proposed in EPIC-1-026 are sufficient (template, seed, managed-merge), or refine. Edge cases: `.git/hooks/commit-msg` (template? but git-managed), `.gitignore` patches (managed-merge slot model), `docs/plans/` directory (seed for the dir, but new files belong to user).
  2. **Declaration mechanism.** How does each entry in the scaffold manifest declare its category? Options: (a) hard-coded in the Rust scaffolder source, (b) per-file frontmatter in `aida-core/templates/`, (c) a manifest file (`templates/manifest.toml`). Recommend one with rationale.
  3. **Slot model for managed-merge.** For `.claude/settings.json` and `.mcp.json`, define how AIDA-owned slots are identified and patched without disturbing user content. Options: (a) JSON pointer paths in manifest, (b) marker comments (impossible in JSON), (c) deep-merge with "AIDA owns these keys" allowlist. Recommend one.
  4. **Detach semantics.** When user runs `scaffold upgrade --detach <path>`, where is that recorded? Options: (a) `.aida/config.toml`, (b) per-file marker, (c) checksum-based (any modification = implicit detach). Tradeoffs.
  5. **Status output reform.** Once categories exist, `scaffold status` should report drift differently per category — seed drift shouldn't even show by default. Sketch the new output.

  Deliverable: a short design doc in `docs/plans/YYYY-MM-DD-scaffold-categorization.md` covering the five questions above, plus a recommended implementation order. Unblocks FR-1-028.

  Originating context: ~/ai/paradox drift showed all three categories failing simultaneously — `CLAUDE.md` (seed false-positive), `.claude/hooks/*.sh` (template, should auto-upgrade), `.claude/settings.json` (managed-merge, needs slot semantics).
