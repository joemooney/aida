  author: joe
  content: 'Operational refinement: snapshot creation may be asynchronous/best-effort after a successful write when the snapshot interval has elapsed, so the user-facing write is not delayed by copying the database. Do not rely on an untracked in-process task that dies when the CLI exits; evaluate a bounded scheduler/worker or durable maintenance request. Snapshot work needs its own single-flight lock, must not block the primary cache writer, and must atomically replace only a validated snapshot. A failed or abandoned snapshot leaves the previous read-only copy intact.'
