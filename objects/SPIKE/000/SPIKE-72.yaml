title: 'Decide: per-agent cache isolation vs harden the shared cache'
description: The clean fix floated this session is one-clone-per-agent OR a per-agent cache path (.aida/cache.<node-id>.db or AIDA_CACHE_PATH) so co-located agents stop sharing one SQLite file — vs just hardening contention. Spike the smaller alternative + decide before building. Reuses per-clone rebuildable cache + node id.
