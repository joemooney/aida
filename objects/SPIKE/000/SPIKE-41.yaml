title: AIDA hook bundle for lifecycle integration (SessionEnd→aida pull, PreCompact→snapshot, Stop→lease validate)
description: 'Claude Code ships 27 hook events (not the 9 I previously catalogued). New-to-me events with AIDA relevance: PostToolBatch (can block loop after parallel batch), InstructionsLoaded (fires when CLAUDE.md/rules/* load, with load_reason discriminator), PreCompact/PostCompact (gates on context compaction — substrate sync moment), FileChanged async (react to .env / config), SessionEnd matcher discriminating clear|resume|logout. AIDA could ship a default hook bundle scaffolded by ''aida init'': SessionEnd→''aida pull'' to sync auto-bumps; PreCompact→snapshot lease state to .aida/snapshots/; Stop→validate lease isn''t dormant; InstructionsLoaded→audit AIDA-emitted rules actually fired. Hook types: command|http|mcp_tool|prompt|agent — significant new surface vs the simpler model I had. Reference: code.claude.com/docs/en/hooks. trace:strategic-recompose-round-3'
