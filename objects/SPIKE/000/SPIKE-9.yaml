  content: 'Verdict: HYBRID. Keep file-handshakes as canonical (filesystem is source of truth); extend MCP server as a transport surface over the same files. Orchestrator stays file-direct; cross-agent (Codex/Cursor) participation works via MCP tools that map to existing .aida/ file conventions. Full writeup + smallest-valuable-slice (~12-15 MCP coordination tools) in docs/spikes/2026-05-20-spike-9-mcp-as-bus.md.'
