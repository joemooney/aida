title: Parse bughunter-severity from Code Review check run as orchestrator phase 3 gate
description: 'Claude Code Code Review writes a machine-readable severity tally to its check run''s Details: last line is ''bughunter-severity: {"normal":N,"nit":M,"pre_existing":K}''. AIDA orchestrator phase 3 (reviewer) can parse this via ''gh api repos/OWNER/REPO/check-runs/CHECK_RUN_ID --jq ...'' and use it as the merge-gate decision: normal>0 → request changes, normal==0 + nit acceptable → approve. Delegates the multi-agent review work to Anthropic''s infrastructure; AIDA reads the verdict + applies lifecycle rules. trace:strategic-recompose-round-2'
