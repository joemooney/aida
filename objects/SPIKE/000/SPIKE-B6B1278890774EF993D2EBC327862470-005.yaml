title: 'Spike: pool grants across an air gap via git bundle, spent on the inside hub'
description: |
  Spike (proposed by the product seat, 2026-10-31): can a pool grant cross an air gap in a git bundle and be spent on the inside hub?
  Questions: (1) The docs say "a block that only appears in an imported store is never spendable". Does a bundle-delivered grant count as imported, and what should make it spendable (a signed grant? a home_ref on the inside hub?). (2) Racing claims on the inside hub. (3) Pool exhaustion inside the gap. (4) Bringing claims back out, and reconciling them with the outside hub without conflicts. (5) Lineage depth: today only the immediate parent pool's home_ref is checked.
  Output: a written findings doc under docs/plans/ with a recommended design, plus a throwaway fixture that reproduces each case. No production code.
