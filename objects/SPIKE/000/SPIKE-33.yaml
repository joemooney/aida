title: Emit `claude-cli://` deep links from `aida brief` + paste-ready prompts
description: Compose move from the 2026-05-29 strategic-recompose synthesis. Claude Code ships a URL scheme `claude-cli://open?cwd=&q=&repo=` that is inert until the operator presses Enter (preserves user-in-the-loop invariant). `aida brief <agent> <SPEC> --as-deep-link` emits the URL; click opens Claude Code in the right `cwd` with the brief pre-filled. Same compose for `aida goal --copy`, `aida ultraplan --stdout`. Eliminates one paste step per work item. Small effort, real papercut elimination.
