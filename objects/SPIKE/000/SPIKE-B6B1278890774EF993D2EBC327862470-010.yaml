title: 'Command inventory for EPIC-613: classify all registered commands (read-only, writes through core, authority) and map the helpers each reaches'
description: |-
  Step 2 of EPIC-613; input to ADR-601. Read-only analysis; no production code changes. Deliverable: docs/plans/2026-11-11-command-inventory.md plus a machine-readable table at scripts/command-inventory.toml.
  For each command registered in command_registry::REGISTRY (about 173 CommandReg entries; count them with the registry, not grep):
  (1) class: read-only (reads store, forge or files only), core-write (mutates substrate state through store or gate), or authority (grants, holds, leases, mandates, containment);
  (2) evidence for the class: the writer sites it reaches, cross-checked against scripts/store-writers.toml;
  (3) the modules it calls outside its own file, and the helper items it would need widened to pub to move out;
  (4) whether it can move to a peripheral crate now, after the leaf crates (aida-term, aida-cmdkit) exist, or only after the EPIC-78 family split;
  (5) the proposed home crate (porcelain-views, a named aida-<name> extension, or an application family).
  Then summarise: counts per class; the first porcelain-views batch (the read-only commands with the fewest helper dependencies, about 20); which helpers block the most moves; and any command whose class surprised you (a 'read' that writes, such as a cache refresh or a usage log).
  Use rg to confirm any 'no callers' result from codegraph. Do this after TASK-3428 batch 5 (#3829) lands if possible, since glob imports hide edges; otherwise list the glob-importing files as lower-bound rows.
  Acceptance: (1) every REGISTRY entry has a row with class and evidence; (2) every core-write or authority row cites at least one writer or gate site; (3) the first porcelain batch is named with its blocking helpers; (4) the doc states its commit and method so it can be re-run.
