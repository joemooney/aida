  content: 'Spike complete — deliverable: docs/spikes/2026-05-16-claude-headless.md (committed 197290dc). Verdict: headless claude -p WORKS for AIDA skills, with caveats -> STORY-263 proceeds, scoped, with a watchdog (decision-tree branch: ''works but with caveats''). Full empirical suite run (~16 invocations, ~$3.80). Headline findings: (1) bypassPermissions mandatory — default mode auto-denies every tool; (2) exit 0 is a liar — a run that bailed at a human gate still exits 0/is_error:false, so permission_denials is the real completion signal; (3) pauses (AskUserQuestion) fail fast+clean (~10s), never hang or silently default; (4) no built-in timeout — caller must impose one; (5) SIGTERM-killed sessions resume cleanly; (6) ~$3 per implementer->reviewer lifecycle is a real STORY-263 cost input. AIDA-specific constraints surfaced: fresh worktrees lack .aida-store/cache wiring; interactive aida prompts (queue done) cancel silently headless. Test artifacts (PR-62, branch, TASK-296, STORY-274) created + cleaned up.'
