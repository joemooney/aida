title: Flagship TUI unused 33d in telemetry despite "the TUI is the product" framing — is it discoverable/used?
description: 'Telemetry: tui last used 33d ago, in the unused-candidates list. EPIC-26 framing is "the TUI is the public face / the product". A flagship surface unused for a month (even by the dev) is a legibility/discoverability signal: either it is not surfaced in onboarding, or the daily workflow never routes through it. Investigate: is tui offered at init / in the statusline / in first-run? Decide: invest in discoverability, or honestly de-emphasize the "TUI is the product" framing. W5 legibility.'
