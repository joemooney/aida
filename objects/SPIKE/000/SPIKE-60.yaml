title: 'SPIKE: durable advisor-watch supervisor for machine-asleep (cloud/cron vs daemon)'
description: 'STORY-586''s watch loop survives only while the launching terminal/laptop is awake (same lifetime as Claude''s /loop). For truly durable ''garden while I''m away overnight / machine asleep'' we''d need a supervisor that outlives the session — cloud cron, a system service, or a daemon. SPIKE-11 deliberately AVOIDED a daemon (operational complexity for a solo tool). Evaluate: is durable-supervisor worth it, and if so cloud-cron (cold-boot, no daemon) vs a local service? Verdict + smallest-slice. Deferred design — do NOT build unsupervised. trace:STORY-586 trace:SPIKE-11'
