  content: |-
    SPIKE-6 compatibility spike completed. Shipped comprehensive competitive analysis at docs/competitive-analysis/skillfold-spike.md.

    Key findings:
    1. skillfold offers strong declarative compilation to 12 targets (Cursor, Copilot, Codex, Gemini, Goose, etc.) and integrates with Claude Code plugins.
    2. Alignment gaps exist in AIDA's custom interactive slash commands (like /aida-status) and AIDA's active local requirements graph (.aida-store), which skillfold cannot represent.
    3. Recommendation: Adopt Option C (Bilingual Scaffold Pack) post-alpha. This allows AIDA to consume a `skillfold.yaml` to configure its roles, while using skillfold to compile AIDA's requirements-driven skills into Cursor .mdc rules and Gemini rules. AIDA positions itself as the local requirements database backbone for cross-platform agent teams.
    4. Non-Claude-Code experience: YAML acts as a machine-readable execution protocol for agents (like Antigravity and Codex), replacing manual prose parsing with deterministic inputs/outputs.
