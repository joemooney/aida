title: Abstract forge integration (gh vs glab) so AIDA composes with GitLab CI/CD
description: 'Claude Code''s GitLab CI/CD integration shows the forge-agnostic pattern: install via shell script, invoke ''claude -p'' with --allowedTools, use gitlab-mcp-server for forge actions. AIDA''s orchestrator is gh-coupled today (gh pr view, gh pr comment, gh pr merge). Worth abstracting to a ''forge trait'' so AIDA composes with GitLab projects too. Lower priority than the GH-side reviewer work (no near-term GitLab users), but the architecture matters when one arrives. trace:strategic-recompose-round-2'
