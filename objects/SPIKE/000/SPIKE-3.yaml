title: GitLab Integration Architecture Design
description: "Technical spike to design the architecture for GitLab integration.\n\n## Goals\n- Define module structure for GitLab integration\n- Design trait abstractions for remote backends\n- Plan database schema changes\n- Evaluate GitLab API crate options\n- Prototype key workflows\n\n## Deliverables\n1. Architecture diagram\n2. Module/file structure proposal\n3. Key trait definitions\n4. Database schema additions\n5. API client evaluation\n\n## Architecture Overview\n\n### Module Structure\n```\naida-core/\n├── src/\n│   ├── integrations/\n│   │   ├── mod.rs              # Integration traits\n│   │   ├── gitlab/\n│   │   │   ├── mod.rs          # GitLab module\n│   │   │   ├── client.rs       # API client wrapper\n│   │   │   ├── models.rs       # GitLab data models\n│   │   │   ├── mapping.rs      # Field mapping logic\n│   │   │   ├── sync.rs         # Sync coordinator\n│   │   │   └── config.rs       # Configuration\n│   │   └── sync_state.rs       # Common sync state\n│   └── db/\n│       └── sync_state_backend.rs  # Sync state storage\n```\n\n### Key Traits\n```rust\n/// Remote system integration\n#[async_trait]\npub trait RemoteIntegration: Send + Sync {\n    type Item;\n    type Id;\n    type Filter;\n    \n    async fn list(&self, filter: Self::Filter) -> Result<Vec<Self::Item>>;\n    async fn get(&self, id: &Self::Id) -> Result<Option<Self::Item>>;\n    async fn create(&self, item: &Requirement) -> Result<Self::Id>;\n    async fn update(&self, id: &Self::Id, item: &Requirement) -> Result<()>;\n    async fn delete(&self, id: &Self::Id) -> Result<()>;\n    \n    fn map_to_requirement(&self, item: &Self::Item) -> Result<PartialRequirement>;\n    fn map_from_requirement(&self, req: &Requirement) -> Result<Self::Item>;\n}\n\n/// Sync state storage\npub trait SyncStateBackend: Send + Sync {\n    fn get_sync_state(&self, req_id: &Uuid) -> Result<Option<SyncState>>;\n    fn save_sync_state(&self, state: &SyncState) -> Result<()>;\n    fn list_by_status(&self, status: SyncStatus) -> Result<Vec<SyncState>>;\n    fn delete_sync_state(&self, req_id: &Uuid) -> Result<()>;\n}\n\n/// Sync coordinator\npub struct SyncCoordinator<R: RemoteIntegration, S: SyncStateBackend> {\n    remote: R,\n    state_backend: S,\n    rules: SyncRules,\n}\n```\n\n### Database Schema\n```sql\n-- New table for sync state\nCREATE TABLE gitlab_sync_state (\n    id INTEGER PRIMARY KEY,\n    requirement_id TEXT NOT NULL UNIQUE,\n    spec_id TEXT NOT NULL,\n    gitlab_project_id INTEGER NOT NULL,\n    gitlab_issue_iid INTEGER NOT NULL,\n    gitlab_issue_id INTEGER NOT NULL,\n    linked_at TEXT NOT NULL,\n    last_sync TEXT NOT NULL,\n    aida_content_hash TEXT NOT NULL,\n    gitlab_content_hash TEXT NOT NULL,\n    link_origin TEXT NOT NULL,\n    sync_status TEXT NOT NULL,\n    last_error TEXT,\n    FOREIGN KEY (requirement_id) REFERENCES requirements(id)\n);\n\nCREATE INDEX idx_gitlab_sync_status ON gitlab_sync_state(sync_status);\nCREATE INDEX idx_gitlab_sync_issue ON gitlab_sync_state(gitlab_project_id, gitlab_issue_iid);\n```\n\n### GitLab API Client Options\n\n1. **gitlab crate** (https://crates.io/crates/gitlab)\n   - Pros: Full API coverage, typed responses\n   - Cons: Large dependency, sync-only (needs tokio::spawn_blocking)\n\n2. **Direct reqwest**\n   - Pros: Full control, async native, minimal deps\n   - Cons: More code to write, manual deserialization\n\n3. **Recommendation**: Start with direct reqwest for needed endpoints only\n\n### Key API Endpoints\n```\nGET  /api/v4/projects/:id                    # Test connection\nGET  /api/v4/projects/:id/issues             # List issues\nGET  /api/v4/projects/:id/issues/:iid        # Get issue\nPOST /api/v4/projects/:id/issues             # Create issue\nPUT  /api/v4/projects/:id/issues/:iid        # Update issue\nDELETE /api/v4/projects/:id/issues/:iid      # Delete issue\nPOST /api/v4/projects/:id/issues/:iid/notes  # Add comment\nGET  /api/v4/projects/:id/labels             # List labels\nPOST /api/v4/projects/:id/labels             # Create label\nGET  /api/v4/projects/:id/milestones         # List milestones\nGET  /api/v4/projects/:id/members            # List members\n```\n\n## Risks & Mitigations\n| Risk | Mitigation |\n|------|------------|\n| API rate limits | Batching, caching, exponential backoff |\n| Network failures | Retry logic, offline queue |\n| Data loss on conflict | Three-way diff, audit trail |\n| Schema drift | Version sync state schema |\n| Token security | OS keyring, env vars |\n\n## Timeline Estimate\n- Phase 1: 2-3 weeks\n- Phase 2: 2-3 weeks  \n- Phase 3: 3-4 weeks\n- Phase 4: 4-6 weeks\n\nTotal: ~12-16 weeks for full implementation"
