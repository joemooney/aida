title: Can headless 'claude -p' invoke the disable-model-invocation /aida-burndown skill?
description: |-
  ## Question (gates STORY-545 implementation strategy)

  STORY-545 ('aida burndown run', headless parallel overnight drain) has two implementation strategies:
  - B (preferred): `aida burndown run` launches `claude -p \"/aida-burndown <selector>\"` and reuses the proven skill fan-out.
  - A (fallback): CLI reimplements parallel headless worker fan-out in Rust.

  B is far cheaper (no second fan-out engine to harden) BUT depends on an unknown: `/aida-burndown` is declared `disable-model-invocation: true`. Can a headless `claude -p` session invoke that skill at all — via an explicit `/aida-burndown` slash command in the prompt, or some headless flag — or does disable-model-invocation also block explicit/headless invocation?

  ## Deliverable

  - Determine whether headless `claude -p` can run `/aida-burndown` (explicit slash-command in the -p prompt, or documented headless skill-invocation path).
  - If yes: confirm the skill's Agent-tool fan-out actually executes under headless `-p` (subagents spawn, worktrees isolate, PRs integrate) — not just that the command is accepted.
  - If no: STORY-545 falls back to Strategy A; record why.

  ## Method

  - Read Claude Code docs on `claude -p` headless mode + skill/slash-command invocation + `disable-model-invocation` semantics.
  - Empirical: `claude -p '/aida-burndown --status approved --dry-run'` (or equivalent) in a throwaway repo with a tiny ready set; observe whether the skill runs and fans out.

  ## Decision

  Resolves STORY-545's B-vs-A fork. Blocks STORY-545 build.
