    ## 2. `docs/agents/seat-parity.md` Cells Found Wrong Under Containment (with Command Output / Refusal Evidence)

    In this repository, `.aida/config.toml` sets:
    ```toml
    [agents]
    contained = true
    vendor = "codex"
    ```
    and `.aida/agents.toml` sets:
    ```toml
    [agents]
    contained = true
    ```

    Under this default contained configuration, **every cell in `docs/agents/seat-parity.md` (lines 12–19) claiming `full` or `functional` parity for Codex is wrong**, and several cells also fail even with `--uncontained`. Below is the cell-by-cell audit with exact command output / refusal evidence:

