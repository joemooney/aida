    | `aida-cli-lib/src/session_start.rs:2039, 2296, 3089-3102, 3511-3549`<br>`aida-cli-lib/src/leases.rs:304, 1209, 2122, 2257, 2719, 2800, 4226, 4357, 4439`<br>`aida-cli-lib/src/session_end.rs:50-72, 1297-1315`<br>`aida-cli-lib/src/status_sections.rs:433, 1812, 1872`<br>`aida-cli-lib/src/doctor_root.rs:754`<br>`aida-cli-lib/src/queue_cmd.rs:15404`<br>`aida-cli-lib/src/burndown_run.rs:1549, 1638` | `session_start` records a lease without a live agent PID when hand-starting in a worktree, and `leases.rs` / `session_end.rs` / `status_sections.rs` / `doctor_root.rs` only scan `~/.claude/projects` and `comm == "claude"` for live-session correlation, ignoring `~/.codex/sessions` and `codex` processes. | `aida ps` reports a live hand-started Codex session in a seat worktree as `◐ dormant` / `⚠ salvageable: dead process, uncommitted work` and recommends salvage-committing over the live session. | `high` | Extend session-liveness and transcript discovery in `leases.rs`, `session_start.rs`, `session_end.rs`, and `status_sections.rs` to inspect `codex` process trees and `~/.codex/sessions`. | `BUG-2382` (`BUG-HOME-156`) |
