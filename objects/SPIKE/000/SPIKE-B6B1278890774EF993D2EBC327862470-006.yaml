    | `.aida/config.toml:45, 89-95`<br>`aida-cli-lib/src/config_cmd.rs:1437-1445, 1845-1853` | `.aida/config.toml` sets `[agents] vendor = "codex"` and `contained = true`, while `[agents.containment] allowed_hosts` lists `api.anthropic.com` and omits OpenAI hosts (`api.openai.com`, `chatgpt.com`); `aida config permissions show` hardcodes ` Managed settings: /etc/claude-code/managed-settings.json` and fails to flag the contradiction. | Default repo config contradicts itself out of the box: default vendor `codex` cannot launch or reach OpenAI APIs under containment, and `aida doctor` / `aida config permissions show` do not warn. | `high` | Add OpenAI endpoints to `allowed_hosts`, make `config permissions show` vendor-aware, and add a `doctor` check flagging `[agents] vendor` vs `contained` / `allowed_hosts` mismatches. | `TASK-2631` (`TASK-HOME-648`) |
