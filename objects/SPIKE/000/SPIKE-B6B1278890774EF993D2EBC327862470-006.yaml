    # SPIKE-710 Audit Report: Where AIDA Still Assumes Claude on Codex-First Linux

    Audited across `aida-cli/`, `aida-cli-lib/`, `aida-core/` (including `templates/`), `aida-tui/`, `.aida/`, and `docs/` (including `docs/agents/seat-parity.md`, `docs/product-integrations.md`, and `docs/showcase/*.html`).

    ---

    ## 1. Master Findings Table (`path:line`, Claude Assumption, User Impact, Severity, Proposed Fix, Linked `EPIC-612` Spec)

    ### A. Existing Open `EPIC-612` Specs (Linked, Not Refiled)

