title: Reproduce the AXI MCP-vs-token-efficient-CLI benchmark on AIDA tools; decide MCP weighting
description: 'AXI (kunchenguid) publishes benchmarks claiming agent-native token-efficient CLIs beat MCP on cost/success/turns (gh-axi 100pct/0.05usd/3turns vs GitHub MCP 87pct/0.15usd/6turns). AIDA README calls the MCP server the highest-leverage surface — directly challenged. Reproduce the comparison on AIDAs OWN surfaces: pick representative agent tasks, measure cost/success/turns for (a) the current CLI, (b) the MCP tools, (c) a token-efficient CLI output mode (TOON/minimal schema). Decide: is MCP over-weighted? Should the token-efficient CLI be the PRIMARY agent surface with MCP secondary? Output a decision + evidence. Load-bearing strategic question. See docs/positioning/vs-axi.md + docs/competitive-analysis/2026-06-28-axi-ecosystem.md.'
