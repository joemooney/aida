  content: |-
    Candidate instance found 2026-09-20 19:57Z, offered for the sweep rather than asserted as one of the six.

    BUG-1442 fixes `aida show`'s TOON projection collapsing every relationship type to Related — that is, a bug about two output formats disagreeing. Its round-1 verdict (PR #2027, reviewed_sha 6c692a496):

        acceptance 4: the journey test does not assert that human and TOON relationship
        projections agree. It independently searches each output for hard-coded substrings,
        so disagreement in row cardinality, target association, ordering, or extra collapsed
        rows can still pass.

    So the regression test for a cross-format DISAGREEMENT bug does not compare the two formats. It checks each one separately against fixed strings, which is the one method that cannot detect the class of defect the spec exists to fix.

    Whether this belongs in your population depends on where you draw the boundary. It is not an instrument failing on its own category the way the untraced-criteria gate was — the test is not testing itself. But it is a test whose METHOD is structurally incapable of observing the property it was written to protect, which is the same shape one level down: the check and its blind spot are the same design decision.

    Offering it as a boundary case for the written method rather than a seventh instance. If the sweep's criterion is 'the instrument cannot see its own category', this is out. If it is 'the check's method excludes the failure it exists to catch', this is in — and if that is the criterion, it is probably a much larger population than six.

    Caught by the drain reviewer, not by looking, which is consistent with your observation that all six were found by accident.
