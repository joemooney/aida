title: decision protocol
description: |-
  Purpose: make and preserve an architecture decision.
  Deliverable: an ADR recording context, options, decision, and consequences.
  Before done: status is accepted and references connect the decision to affected work.
  Reviewer: checks alternatives, evidence, reversibility, and consequences.
  Human boundary: the accountable human accepts consequential or taste-based choices.
