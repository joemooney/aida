title: bug protocol
description: |-
  Purpose: restore intended behavior and prevent recurrence.
  Deliverable: a focused fix plus a regression test.
  Before done: reproduce or characterize the failure, make the test fail before the fix where practical, and run the relevant suite.
  Reviewer: checks the root cause, regression coverage, and blast radius.
  Human boundary: product-policy changes are decisions, not bug fixes.
