title: cross-vendor fleet coordination — canonical term, short forms, and the multi- vs cross- split
description: |-
  Canonical full term: "cross-vendor fleet coordination" — the L5 apex layer of the coordination stack (docs/research/2026-06-16-coordinating-multi-vendor-agent-fleets.md; layered-evaluation-framework L5; g1/g2/g4 graphics).

  Scope of the claim (operator correction, 2026-07-08 — do not overstate): "cross-vendor" names the LAYER AIDA works in, not a unique capability and not a moat. The layer is CONTESTED — Gas Town OSS ships cross-vendor support (Claude Code/Codex/Gemini/Copilot) plus Wasteland federation (2026-06-26 landscape refresh). Any differentiation claim must cite the narrower bundle (typed requirements + machine-checkable code<->spec traces + pre-work authority + plain-git program-owned record + cross-vendor access), anchored on incentive ("no vendor is paid to coordinate all of yours"), never on "only we do cross-vendor." In slides/graphics the L5 label is "next frontier," not "white space."

  Usage rules:
  - The modifier "cross-vendor" is load-bearing for PRECISION, not exclusivity. Unqualified "fleet coordination" blurs two things: it includes the within-vendor territory AIDA deliberately rides natively rather than owns (Agent Teams etc.), and it names the crowded generic lane (Gas Town, Claude Flow, Goosetown). Keep the modifier so the term says which layer is meant — while remembering the layer has other occupants.
  - Full term REQUIRED: first use in any doc; layer names, titles, and diagrams.
  - Short forms PERMITTED after the full term is established in the same doc: "fleet coordination" or "the fleet" in running mechanical prose where vendor-mix is not the point.
  - Preferred compression when the 4-word phrase is too heavy for a title or spoken use: "cross-vendor coordination" (drop the generic word, keep the layer-naming one) — never "fleet coordination" as the standalone canonical form.
  - multi- vs cross- split (codified, both stay): "multi-vendor" describes fleet COMPOSITION (a multi-vendor fleet, multi-vendor agent fleets); "cross-vendor" describes the coordination layer's PROPERTY (coordination that spans vendors). A multi-vendor fleet needs cross-vendor coordination. Do not treat these as interchangeable or "fix" one into the other.
  - "multi-agent": the CATEGORY/DISCOVERABILITY word, not part of the canonical term. It is redundant with "fleet" (a fleet is by definition multi-agent) and is the label every competitor wears (CrewAI/AutoGen/LangGraph/Claude Flow), so it differentiates nothing — but it IS what outsiders search for and the problem's common name in the wild. Use it in first-contact/on-ramp framing (README opening, search-facing copy: "coordination for multi-agent, multi-vendor development"), then introduce the precise canonical term and use it thereafter. Slash-compounds ("multi-agent/multi-vendor fleet coordination") are rejected as canonical: six words, says agent-plurality twice, reads as indecision.

  Origin: operator proposed shortening to "fleet coordination", then floated "multi-agent/multi-vendor fleet coordination", then corrected the exclusivity framing ("not a moat — Gas Town supports cross-vendor") (2026-07-08). Analysis across README/OVERVIEW/positioning/research docs led to: keep the modifier for precision, codify short forms, assign multi-agent the on-ramp role, anchor differentiation on the bundle + incentive.
