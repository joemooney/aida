title: How do I delete a comment I posted on a spec by mistake?
description: |
  **`aida comment delete --req-id <SPEC-ID> --comment-id <comment-uuid>`. The flags are required; the positional form `aida comment delete <SPEC> <id>` is rejected.**

  ## Why
  Comments are part of the spec's record, so deleting one takes both IDs explicitly. The comment's UUID is the line ending in `:` above each comment in `aida comment list <SPEC-ID>`.

  ## How
  ```bash
  aida comment list TASK-1538 | grep -B3 -E '^\s+x$'      # find the stray comment's id
  aida comment delete --req-id TASK-1538 --comment-id 01a12b66-496d-7033-8a8c-45ab3ef2da16
  aida comment list TASK-1538 | grep -c 01a12b66           # 0 = gone
  ```
  To correct a comment instead of removing it, use `aida comment edit`. In shared work, prefer posting a short correction comment, so readers who already saw the original can tell what changed.

  ## Caveat
  Text you pass through a shell in double quotes is expanded first: backticks run as commands and their output is dropped. For long or code-heavy comments, write the text to a file and pass it with `"$(cat file)"`, or use a tool that writes the file directly.

  ## See also
  `aida comment --help`
