spec_id: FAQ-1-267
title: Why does aida pr list show a PR as Failing when the required Linux checks passed?
description: |
  **Usually because a non-required check failed, such as the old path-filtered `Build (windows-latest)` run. `aida pr list` counts every check, while merging needs only `Build (ubuntu-latest)` and `merge-hold-gate`.**

  ## How
  - See which check failed: `gh pr view <N> --json statusCheckRollup --jq '.statusCheckRollup[]|"\(.name)=\(.conclusion//.status)"'`
  - Only `Build (ubuntu-latest)` and `merge-hold-gate` are required by branch protection.
  - A PR can appear twice in `aida pr list` when its title mentions two spec IDs (for example a TASK and the ADR it implements).

  ## Caveat
  Since TASK-1723 / ADR-72, Windows no longer runs on PRs, so this mostly affects PRs opened before that merge.

  ## See also
  ADR-72, TASK-1723
