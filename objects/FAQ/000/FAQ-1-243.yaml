title: What's the difference between 'done' and 'completed'?
description: |
  **`done` means the work is finished but not closed. `completed` means it has merged *and* nothing is holding it open.**

  ## The statuses
  | Status | Meaning |
  |---|---|
  | `done` | Work finished on a branch before merge, **or** merged but held by the spec's closure criteria |
  | `completed` | Merged to the default branch, with no closure criteria outstanding |

  ## Why a merged spec can sit at `done`
  Merge-time completion normally goes straight to `completed`. If the spec has unmet closure criteria (e.g. a `closure:pending` tag), it stops at `done` and the bot posts `[aida:closure-held]` with the exact command to finish it. See FAQ-6.

  ## Common surprises
  - A spec flipping to `done` partway through a multi-PR effort means a merge commit carried its ID. See FAQ-1 and FAQ-2.
  - FAQs are filed directly as `completed` because they're reference material, not work. See FAQ-11.

  ## See also
  FAQ-1, FAQ-6, `aida list --help` (status table)
