title: How do I watch a batch relay session in a human-readable form instead of raw JSON?
description: |
  **A batch relay prints raw stream-json, so don't read the relay's own terminal. Follow its session log through a jq renderer in a second terminal.**

  ## How
  ```bash
  tail -n +1 -f "$(ls -t <project>/.aida/relay-sessions/session_*.log | head -1)" \
    | jq --unbuffered -rR -f ~/ai/aida-advisor-tools/relay-view.jq
  ```
  This shows one line per agent message (💬), per tool call (→), for each subagent start/finish (⇢/⇠), and the turns and cost at the end of each session. The raw log is unchanged, because the relay's telemetry reads it.

  ## Caveat
  `tail -f` follows ONE session file. When the relay rotates to a new session, run the command again.

  ## Why
  In batch mode the relay runs `claude -p --output-format stream-json | tee <log>`. Typically only a few percent of the events are agent text; the rest are tool calls and results, thinking, progress ticks and hook messages.

  ## See also
  aida-relay STORY-80 (render a human view on a TTY automatically), FAQ "How does claude_relay.sh fit with AIDA's drain, burndown and orchestrate…"
