title: Why does 'aida review record' fail with 'attribution fallback'?
description: |
  **No agent identity is set, so the CLI treats the verdict as the operator's and requires a human at the terminal. Agents should export `AIDA_AGENT_TYPE` (e.g. `claude`) or `AIDA_AGENT_NAME` before recording.**

  ## Why
  `review_recorded_by` builds the recorder label from `AIDA_AGENT_NAME` / `AIDA_AGENT_TYPE` plus the seat. With neither set, the label is `aida review record (operator)`, and that path calls `require_direct_human()`. A seat grant alone doesn't change this. The error's hint (`aida role enter`) is misleading when the grant is already valid.

  ## How
  ```bash
  export AIDA_AGENT_TYPE=claude
  aida review record <SPEC> --verdict approve --sha <full head sha> --summary "..."
  ```
  The verdict is then recorded as `claude advisor seat` (or the current seat).

  ## Caveat
  BUG-1978 tracks fixing the misleading hint.

  ## See also
  BUG-1978, BUG-1802, ADR-73
