title: How do I preview what an unattended drain will pick up before running it?
description: |
  **Run `aida burndown plan`. It's read-only and lists which specs are ready to fan out and which are parked, and why.**

  ## Why bother
  An unattended drain (`/aida-drain-queue`, `/aida-burndown`) acts on whatever the picker considers buildable. On 2026-10-10 the plan showed ten *approved FAQs* as "ready to fan out", because FAQ wasn't yet treated as a knowledge type (STORY-1642). A drain would have assigned implementer seats to them.

  ## How
  ```bash
  aida burndown plan                        # + = ready to fan out, others parked with a reason
  aida burndown plan | grep -E '^\s+\+ '    # just the ready set
  ```
  Check the `+` rows for anything that isn't buildable work: FAQs, decisions, terms, umbrella stories, specs still awaiting signoff. Fix the spec (status, type, blocker), don't just skip it.

  ## When
  Before starting any unattended drain, and after filing a batch of specs of a new or unusual type.

  ## See also
  STORY-1642, FAQ-11, the FAQ "Which spec types count as work, and which as knowledge?"
