title: Can I edit or commit in the main checkout (e.g. ~/ai/aida)?
description: |
  **No. Never commit, and avoid editing, in the primary checkout. Create a worktree per spec (`aida worktree add <SPEC>`) and work there. The primary checkout stays on a clean `main` that tracks origin.**

  ## Why
  - The primary checkout is shared by every session, and in a single-binary dev setup it is also where the live `aida` gets built. Stray edits there end up in everyone's binary.
  - Commits made directly on `main` skip the PR, the independent review, and merge-time completion.
  - Leftover scratch files (logs, one-off scripts) make the build report `+dirty`, which hides a real tracked change.

  ## How
  ```bash
  aida worktree add STORY-123          # sibling worktree + lease
  cd ../aida-story-123 && ...          # edit, build, test, commit here
  git -C ~/ai/aida status --short      # should be empty
  ```
  Clean up scratch files in the session that created them, or ask whoever created them. Don't delete another agent's files without checking.

  ## Coming
  STORY-1647 (pre-commit refuses primary-checkout commits on main), STORY-1648 (drift warning at session start and in the status line), TASK-1721 (GitHub requires a PR on main).
