title: How do I see which reviews are running right now?
description: |
  **Run `aida ps | grep reviewer` from a host terminal; there is no dedicated command.**

  ## Why
  Reviews run as leased reviewer sessions, listed by `aida ps`. Rows with very large ages are stale leases.

  ## How
  `aida ps | grep reviewer` for live work, `aida review list` for recorded verdicts.

  ## See also
  BUG-2498
