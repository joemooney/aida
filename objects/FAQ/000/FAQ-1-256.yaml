title: My relay or orchestrator session crashed mid-batch. How do I resume without redoing or losing work?
description: |
  **Nothing is lost. Work state lives in the substrate and in the worktrees, not in the dead session. Inspect what's there, re-enter your role in a new shell, tell the next run where to resume, and relaunch the same command.**

  ## How
  1. Check whether it's really dead: `pgrep -af claude_relay`, and when the newest `.aida/relay-sessions/session_*.log` was last written.
  2. See what it left behind:
     ```bash
     aida burndown plan --tag <batch-tag>      # what's still pending
     aida ps                                    # leases (may still look live)
     gh pr list --state open
     git -C ../<worktree> status --short        # uncommitted implementer work
     ```
  3. Have uncommitted work in a worktree reviewed by a fresh reviewer before anyone commits it. A crashed implementer never got a review.
  4. Add a short RESUME section to the prompt file. Name the worktrees to continue in, where the rework brief is, and say "don't re-dispatch these". A dead session's leases still look live, and the orchestrator's rule is to skip specs with a live lease.
  5. Open a NEW terminal and re-enter the role there. The role grant belonged to the shell that died. Then run the same relay command.

  ## Why
  The relay's handoff file only carries what was in flight. Everything else is rebuilt each session from the queue, leases, PRs and verdicts, so a restart picks up where the substrate says things are.

  ## See also
  FAQ "How does claude_relay.sh fit with AIDA's drain, burndown and orchestrate…", FAQ "Do I need --delegate-seat…"
