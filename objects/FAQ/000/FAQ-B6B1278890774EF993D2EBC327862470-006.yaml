title: Should a stacked mechanical refactor be squash-merged or rebase-merged?
description: |
  **Rebase-merge, in batches. Squash stays the default for everything else.**

  ## Why
  - **Speed:** a run of approved slices lands as one PR with one CI run, instead of one PR and one ~13-minute CI run per slice.
  - **History:** each module move stays its own commit on main, so blame, bisect and `git log --follow` work one move at a time.
  - **No squash subject:** nothing gets built from the title or branch name, so BUG-1919 can't fire.

  ## Conditions
  - No commit subject contains a spec ID except the final one. Every subject lands on main as written.
  - **Every commit must build on its own.** A move commit and its `retarget:` commit go together and are approved as a pair.
  - Merge with `gh pr merge --rebase`, run by a human or the advisor. Ship's merge path is built around squashing.

  ## See also
  FAQ on landing a multi-PR change, TASK-1538
