agreed_id: FAQ-4
title: Can the implementer keep working while its earlier work waits for review?
description: |
  **Yes, as long as nothing ships until it's reviewed.** The two-seat rule controls who approves and who ships. It doesn't make the implementer wait.

  ## How (pipelined stack)
  1. One linear stack: slice N branches from slice N-1. Tag each round `slice-NN-rR`.
  2. The implementer keeps building, pushes tags, and posts one line per tag (SHA, module, proofs) to the spec.
  3. The reviewer gives each tag a verdict: approved at `<sha>`, or request-changes with a brief.
  4. On request-changes, the fix becomes round `rR+1` and the slices above it are rebased and re-tagged. A rebase changes the commit hashes, so those slices are re-checked.
  5. **Ship only an unbroken run of approved slices from the bottom of the stack, at exactly the approved SHAs.**
  6. If a finding is about the *method* (visibility, wiring, test ownership), stop adding slices until it's fixed. Otherwise every slice above inherits it.

  ## When it fits
  Mechanical, low-overlap work such as code moves and renames, where review is cheap and rebases are easy. For design-heavy work, review each step before starting the next.

  ## See also
  TASK-1538 (where this was first used, 2026-10-10)
