agreed_id: FAQ-9
title: Can an implementer approve its own PR with 'aida review record'?
description: |
  **No.** An approval only counts if it comes from a seat other than the one that wrote the code: the advisor, a reviewer, or a human.

  ## Why
  The two-seat protocol keeps writing code and judging it separate. If an implementer records its own approval, nobody independent has looked at the change. On 2026-10-10 PRs #2474, #2475 and #2477 merged this way and had to be reviewed after the fact.

  ## How
  - The implementer pushes and reports. It never runs `aida review record --verdict approved`, `aida pr ship`, `gh pr merge`, or `gh pr review --approve`.
  - The reviewing seat records its verdict against the PR's **head SHA**. A human or the advisor ships.
  - A fresh-context subagent the implementer spawns is a *self-check*, not an independent review.

  ## Caveat
  The tooling doesn't fully enforce this yet. BUG-1802's fix only blocks verdicts whose `recorded_by` text says "implementer seat" (see BUG-1918). Until that's fixed, the rule is enforced by discipline.

  ## See also
  BUG-1802, BUG-1918, `.aida/discipline/two-seat-protocol.md`
