title: What does the 'closure:pending' tag do, and when should I use it?
description: |
  **It stops a merge from fully completing the spec.** Merge-time completion stops at **done** instead of **completed** and posts an `[aida:closure-held]` comment.

  ## When to use it
  For work that lands across many PRs (refactor slices, phased rollouts), or anywhere a stray `(SPEC-ID)` trailer could complete the spec early.

  ## How
  - Set: `aida edit <SPEC> --add-tag closure:pending`
  - Clear when the work is really finished: `aida edit <SPEC> --remove-tag closure:pending`, then `aida pull`. The bot comment includes the exact replay command (`aida db reconcile-status --spec <SPEC> --since <sha>^`).
  - If a merge flipped it to done early, set it back with `aida edit <SPEC> --status approved` and add a comment explaining why.

  ## See also
  FAQ on why a spec flipped to done when only part of the work merged
