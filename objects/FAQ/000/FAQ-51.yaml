title: Why does 'aida agent new --spec <ID>' fail with 'scope is already owned by session ...'?
description: |
  **Another session still holds the lease (work claim) on that spec. Re-dispatch into its worktree without `--spec`, or find the holder with `aida session leases --all`.**

  ## Why
  `agent new --spec <ID>` refuses when any lease owns that scope. It is often an earlier implementer whose Claude process has exited. `aida session leases` hides older leases by default, so the blocking lease may not show up.

  ## How
  - Find the holder: `aida session leases --all`, then `aida session show <id>`.
  - For a rework round in the same worktree, leave out `--spec`:
    `aida agent new claude --bg --no-resume --role implementer --cwd <worktree> --prompt-file <brief>`
    The new agent works under the existing lease. `--no-resume` skips the session picker.
  - Don't run `aida session end <id>` just to clear the lease: it deletes the worktree.

  ## Caveat
  BUG-2002 tracks surfacing this before the interactive prompts, and showing every blocking lease by default.

  ## See also
  BUG-2002, FAQ-53
