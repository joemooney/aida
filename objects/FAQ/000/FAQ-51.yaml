title: Why does 'aida agent new --spec <ID>' fail with 'scope is already owned by session ...'?
description: 'Another session still holds the lease (work claim) on that spec, often an earlier implementer whose Claude process has exited. ''aida session leases'' hides older leases by default; use ''aida session leases --all'' to see them. To re-dispatch into the same worktree for a rework round, leave out --spec and pass --cwd <worktree>; the new agent works under the existing lease. Add --no-resume to skip the session picker. Don''t run ''aida session end <id>'' just to clear the lease: it deletes the worktree. (Tracked: BUG-2002.)'
