title: How do I list all FAQs?
description: |
  **Use `aida faq list completed` (or `aida faq list --all`). Plain `aida faq list` shows nothing, because FAQs are filed as `completed` and the default view hides completed specs.**

  ## Commands
  ```bash
  aida faq list completed      # every current FAQ
  aida faq list --all          # also archived/deferred
  aida search "<words>"        # find an answer by content
  aida show FAQ-7              # read one
  ```
  `aida list faq` doesn't work yet: the positional argument there is a status, not a type ("Unknown status filter 'faq'").

  ## Coming
  STORY-1642 makes `aida faq list` show every FAQ with no flags, accepts type words like `aida list faq`, and slims the table to ID + question. STORY-1644 sorts by numeric ID (FAQ-2 before FAQ-11).

  ## See also
  FAQ-11 (FAQ convention), STORY-1642, STORY-1644
