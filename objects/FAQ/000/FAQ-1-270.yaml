title: Can a relay's reviewer subagent approve the PR its implementer subagent wrote?
description: |
  **Not once BUG-1918 lands. Approval authority is bound to session identity, and every subagent of one Claude process shares that identity (`CLAUDE_CODE_SESSION_ID` plus the harness process), so the approval counts as self-approval and `aida pr ship` refuses it.**

  ## Why
  PRs #2474, #2475 and #2477 merged with no independent review because the old guard checked a free-text label. BUG-1918 compares identities instead. An in-process reviewer subagent of the orchestrator that also ran the implementer is, correctly, the same session.

  ## How
  Run reviewers as separate processes with their own session and reviewer seat (for example a separate `claude -p` reviewer launched by `aida queue work PR-<n>`), recording the verdict with `aida review record`.

  ## Caveat
  BUG-1918 (PR #2485) is on hold until STORY-1654 changes relays to launch separate reviewer processes. Until then, the old label-based guard applies.

  ## See also
  BUG-1918, STORY-1654, BUG-1934
