title: How do I record an architecture decision (ADR), and why does --status accepted fail?
description: |
  **Use `aida add --type decision --status approved ...`. `aida add` rejects `--status accepted` ("invalid status `accepted`"), even though older decisions display as accepted. The new decision gets an `ADR-N` id.**

  ## Why
  `aida add --status` takes only the lifecycle statuses: draft, approved, planned, in-progress, done, completed, rejected, superseded, needs-attention. "Accepted" is how decisions read, and history's `--to` accepts `accepted` as a spelling of approved, but creation doesn't.

  ## How
  ```bash
  aida add --type decision --status approved --priority high \
    --tags "two-seat,merge" --title "<the decision, as one sentence>" \
    --description-from-file /path/to/adr.md        # Decision / Conditions / Context / Related
  aida rel add <FOLLOW-UP-ID> ADR-N --type implements   # link follow-ups
  ```
  Write the body to a file and pass `--description-from-file`, which avoids shell expansion of backticks. Supersede a decision later with a successor (`aida edit ADR-N --status superseded --superseded-by <NEW>`) instead of editing it in place.

  ## See also
  ADR-73 (an example with conditions and an enforcement-status section), FAQ-11
