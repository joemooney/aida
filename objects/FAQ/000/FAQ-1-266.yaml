title: Does AIDA support Windows or macOS?
description: |
  **No. AIDA supports Linux only, for the foreseeable future. Windows and macOS have no CI, no release binaries, and no fix work (ADR-72, 2026-10-10).**

  ## Why
  Windows CI was a large drain on throughput, and nobody uses those platforms. Earlier "until the backlog drains" decisions (ADR-47, ADR-62, ADR-65) kept expiring, and the release gate re-forced Windows work every release. ADR-72 has no expiry; only a new operator decision reverses it.

  ## How
  - `scripts/install.sh` refuses non-Linux systems with a clear message.
  - The `Cross-platform (manual)` workflow still exists but only runs by hand, and never gates anything.
  - A Windows/macOS-only failure is not a bug: don't file or fix it, and reviewers reject PRs that re-add those platforms.

  ## See also
  ADR-72, TASK-1723
