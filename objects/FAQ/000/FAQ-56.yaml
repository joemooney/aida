title: Does a running relay pick up API keys I rotated?
description: |
  **No. A process keeps the environment it started with. A relay that was already running holds the old keys until you restart it from a shell that has the new ones.**

  ## Why
  Environment variables are copied into a process when it starts. Editing `~/.env` or re-exporting keys in your shell changes nothing for processes already running, or for their children. On 2026-10-12 a night relay started before a key rotation still held the old OpenAI, Gemini and AIDA keys. The Claude sessions kept working because they use the Claude login, not an API key. Anything the relay called through the rotated keys (evaluator, Codex, Gemini) would have failed.

  ## How
  Check a running process **without printing the key**, by comparing hashes:
  ```bash
  tr '\0' '\n' < /proc/<pid>/environ | grep '^OPENAI_API_KEY=' | sha256sum
  printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" | sha256sum   # in the updated shell
  ```
  If the hashes differ, then at the relay's next handoff or halt, start it again from a fresh shell (`source ~/.env` first). Avoid killing a relay mid-PR.

  ## Caveat
  Never `env`, `printenv` or `cat` the environment in an agent session: transcripts are kept. Compare hashes only.

  ## See also
  DOC-7, BUG-2000, FAQ-20
