title: Why isn't 'cargo fmt --check' catching formatting in include!'d files?
description: |
  **Because `cargo fmt` only follows `mod` declarations, not `include!`.** Files pulled in with `include!("lib_part1.rs")` are never visited, so formatting drift in them goes unnoticed.

  ## How
  While `include!` files exist, run `rustfmt --check` on them explicitly in the fmt gate, e.g. `rustfmt --check --edition 2021 aida-cli-lib/src/lib_part*.rs`.

  ## Context
  The `lib_part1..6.rs` split (PR #2474) is temporary scaffolding so codegraph can index `lib.rs`. The part files must be emptied and deleted by the final slice-1 PR. Clippy and the compiler still see the code; only formatting is skipped.

  ## See also
  STORY-1488, TASK-1538
