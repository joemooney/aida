spec_id: FAQ-1-242
agreed_id: FAQ-11
title: What's the convention for writing and filing an FAQ entry?
description: |+
  **An FAQ is reference material, not work. File it as `completed`, skip the lifecycle, and find it with `aida faq list` or `aida search`.**

  ## Convention
  - **Title** = the question, worded the way someone would search for it.
  - **Body (markdown)**: a bold one-line answer first, then `## Why`, `## How`, and `## See also` with spec IDs. Add a `## Caveat` when the answer depends on an open bug, and update it when the bug is fixed.
  - **Status `completed` at birth.** No draft → approved step, no AI evaluation, no acceptance criteria, no trace comments.
  - **Stale answer?** Edit it in place, or mark it `superseded --superseded-by FAQ-N` if a new entry replaces it.

  ## Commands (interim, until STORY-1642 and BUG-1921 land)
  ```bash
  aida faq add --title "How do I ...?" --description-from-file answer.md --status completed
  aida db merge-gate          # promote FAQ-1-NNN → canonical FAQ-N (see FAQ-10)
  aida faq list completed     # list them (the open lens hides completed)
  aida search "<words>"       # find an answer
  ```

  ## Tags
  Also give every FAQ 1–2 `audience:` tags:
  - `audience:user`: anyone using AIDA on their own project (workflow, roles, drain, relay, CLI).
  - `audience:dev`: someone developing AIDA itself (this repo's build, hooks, refactors, CI).
  Use both when the question fits both. Filter with `aida faq list --tags audience:dev`.

  Give every FAQ 1–3 `topic:` tags from this set; add a new topic only if none fits:
  `topic:completion` (status, closure, trailers) · `topic:merge` · `topic:review-gate` (two-seat, approvals) · `topic:roles` (seats, grants) · `topic:drain` (burndown, orchestrate, queue) · `topic:relay` · `topic:refactor` (code moves) · `topic:ci` (hooks, gates, fmt) · `topic:ids` · `topic:types` · `topic:list` · `topic:cli` · `topic:faq` (about FAQs themselves) · `topic:build` (binaries, building AIDA)
  ```bash
  aida faq add ... --tags "topic:drain,topic:roles" --status completed
  aida faq list completed --tags topic:drain
  ```

  ## Why not `approved`?
  Today the burndown and backlog pickers treat FAQ as **work**. Approved FAQs showed up in `aida burndown plan` as "ready to fan out" (2026-10-10), so an unattended drain would have assigned implementers to answer them. `completed` keeps them out until STORY-1642 makes FAQ a knowledge type.

  ## Where FAQs (and other knowledge types) show up
  Once STORY-1642 lands, the default `aida list` shows work only. Decision, Vision, Term, Principle and FAQ appear with `aida <type> list`, `--type`, or `--include-knowledge`, and always in `aida search`.

  ## See also
  STORY-1642, BUG-1921, FAQ-10

