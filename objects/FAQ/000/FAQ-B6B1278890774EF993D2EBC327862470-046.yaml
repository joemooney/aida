title: Is aida review watch always running in the background?
description: |
  **No. `aida review watch` runs only while something keeps it running; it is not a built-in service.**

  ## Why
  On this host `review-watch-loop.sh` restarts it after each exit, and the loop is started by hand. The watcher inherits the grant present at launch, so a grant change can make every review dispatch fail with "no valid parent seat grant is active".

  ## How
  Check with `ps -eo cmd | grep 'aida review watch'` outside the sandbox. A skipped head appears under `review_watch_skipped` in `aida awaiting`; retry one with `aida review watch --release PR-N`. Restart the loop after a grant renewal.

  ## See also
  STORY-2691, STORY-2571
