title: Is aida push --store-only equivalent to a raw Git store-branch push?
description: |
  **An ordinary `aida push --store-only` is not equivalent to a raw Git ref push. An enabled transport profile deliberately narrows AIDA's behavior.**

  ## Difference

  ```bash
  git -C .aida-store push origin aida-store:aida-store
  ```

  This pushes existing commits using the explicit refspec. It does not itself stage or commit pending store files, publish mailbox data, or run AIDA lifecycle reconciliation. Git hooks still run and can have side effects.

  Ordinary AIDA push orchestration may commit pending state, publish collaboration metadata, run lifecycle follow-ups, and fan out to configured mirrors. `--store-only` disables the code leg, not all those other behaviors.

  ## How

  Inspect the effective profile before assuming push is ref-only:

  ```bash
  aida config transport show
  ```

  ## Caveat

  Raw Git bypasses AIDA's transport content scanner. An explicit refspec limits the destination branch but does not certify the history as safe. Neither a blocked code push nor a store-only flag is a complete information-boundary control.

  ## See also

  STORY-1742, FAQ-33, FAQ-34.
