title: 'Why does ''aida pull'' print ''main → gitlab FAILED: non-fast-forward''?'
description: |
  **The mirror hub's `main` has commits that origin's `main` lacks, so the fast-forward mirror push is refused. Nothing on origin is broken, and the store mirror still syncs.**

  ## Why
  `aida pull` mirrors origin to each `mirror_remotes` hub by fast-forward only. A hub that diverged (for example, commits pushed straight to it) can't be fast-forwarded.

  ## How
  1. See what is extra: `git log --oneline origin/main..gitlab/main`.
  2. If those commits are preserved elsewhere, realign the hub:
     `git push --force-with-lease=main:<old-hub-sha> gitlab origin/main:main`
  3. GitLab refuses force pushes to a protected `main`. Allow force push temporarily (Settings → Repository → Protected branches), push, then turn it off again, and make sure `main` is still protected afterwards.
  4. Or leave the warning until a planned hub migration.

  ## See also
  EPIC-44, TASK-1735, DOC-7
