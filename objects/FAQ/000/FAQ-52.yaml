title: 'Why does ''aida pull'' print ''main → gitlab FAILED: non-fast-forward''?'
description: The mirror hub's main has commits that origin's main doesn't, so a fast-forward mirror push is impossible. The store mirror is unaffected and nothing on origin is broken. Find what is extra with 'git log --oneline origin/main..gitlab/main'. If those commits are preserved elsewhere, realign the mirror with 'git push --force-with-lease=main:<old-mirror-sha> gitlab origin/main:main'. GitLab blocks force pushes to a protected main, so allow force push temporarily in Settings → Repository → Protected branches, push, then turn it back off (make sure main stays protected). Otherwise leave the warning until the hub migration.
