title: How do I check that the disk-headroom guard is running, and when does it fire?
description: |
  **Run `aida schedule status` and read the `disk-headroom-guard` row: it shows the last run and the next due time (every 30 min). It fires only when free space drops below `[doctor.disk_headroom] min_free_gib` in `.aida/config.toml` (60 GiB in this repo).**

  ## Why
  The guard is a substrate job driven by the scheduler tick (cron or systemd), so no agent has to be running. A quiet guard means free space is above the floor, not that the guard is dead. When it fires, it routes a due item to the advisor seat (`disk-headroom-guard-route`). On its own it deletes nothing.

  ## How
  - Is it running: `aida schedule status | grep disk-headroom`
  - Current reading: `aida doctor check disk-headroom` (`total: 0` means no findings: above the floor)
  - The floor: `grep -A1 'doctor.disk_headroom' .aida/config.toml`
  - Free space: `df -h /mnt/build`

  ## Caveat
  While free space stays below the floor and nothing can be reclaimed, the guard keeps firing every 30 min and frees nothing. STORY-1916 adds an automatic emergency tier (default 95% used), a stuck-escalation notice, and visible last-run and last-reclaim status.

  ## See also
  STORY-1916, BUG-1675, TASK-1298
