title: Why didn't my git push reach the GitLab mirror?
description: |
  **The pre-push mirror hook only mirrors commits that origin has already accepted. On a plain `git push` it runs before origin confirms, so it skips the mirror. Use `aida push`, or run `aida remote mirror-sync` afterwards.**

  ## How
  - Message to expect: `mirror-push: refs/heads/<b>@<sha> is not confirmed on origin — skipped`.
  - Catch up: `aida remote mirror-sync` (default branch + store), or push with `aida push` (fans accepted code branches out).
  - Check: `aida remote status`.

  ## See also
  FAQ about store drift (aida remote status), STORY-1656
