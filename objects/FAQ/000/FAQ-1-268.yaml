spec_id: FAQ-1-268
title: Why is a mirror hub (e.g. GitLab) behind or diverged from GitHub, and how do I fix it?
description: |
  **Run `aida remote status` to see the drift, then `aida remote mirror-sync` for a hub that's simply behind, or `aida remote reconcile` for one that has diverged.**

  ## Why
  Mirrors follow `origin`. A forge-side merge, or a store push from another clone, never fires the local pre-push mirror hook, so a hub can fall behind. A hub diverges when something commits to it directly. On 2026-10-09 a clone registered as node 11 against GitLab only, so GitLab's `aida-store` had 14 commits GitHub lacked, while GitHub had 438 GitLab lacked, and nothing reported it.

  ## How
  - `aida remote status`: per-branch drift for each hub. It exits non-zero when hubs disagree.
  - `aida remote mirror-sync`: fast-forwards the hubs to origin's tips (never forces).
  - `aida remote reconcile` (a dry run), then `--execute`: union-merges a diverged store and pushes it to every hub.

  ## Caveat
  BUG-1932 tracks surfacing divergence automatically.

  ## See also
  BUG-1932
