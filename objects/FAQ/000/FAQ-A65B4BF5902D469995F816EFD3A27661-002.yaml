title: Where does scaffold status get the templates it compares against?
description: |
  **Scaffolding compares against the templates shipped in the running AIDA binary; it does not automatically download the latest templates from a forge.**

  ## Why

  Pulling the AIDA source checkout and upgrading a consuming project's scaffolding are separate operations. Templates in `aida-core/templates/` are compiled into AIDA. An older executable can therefore report scaffolding as current relative to its own older templates.

  ## How

  ```bash
  aida --path
  aida --version
  ```

  After updating the primary AIDA source checkout, run `aida dev build` there to build, smoke-test, and promote the updated binary. Then run `aida scaffold status` and `aida scaffold upgrade --dry-run` in the consuming project.

  ## Caveat

  Check for deliberately configured template customizations when the generated output differs from stock templates. "Current" describes the selected binary/template source, not the latest remote commit.

  ## See also

  FAQ-25 and FAQ-27.
