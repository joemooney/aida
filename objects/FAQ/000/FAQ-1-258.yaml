title: Which aida binary am I running, and why is it older than I expect?
description: |
  **Run `type -a aida` (and `aida dev status`). The first path wins. `~/.local/bin` comes before `~/.cargo/bin` on a typical PATH, so a copy left in `~/.local/bin` shadows anything newer that `make install` puts in `~/.cargo/bin`.**

  ## How
  ```bash
  type -a aida aida-server            # every copy on PATH, in priority order
  aida --version                      # build time + sha (+dirty = see FAQ on +dirty)
  aida dev status                     # resolved binary, activation state
  git rev-list --count <sha>..origin/main   # how far behind it is
  ```

  ## Where copies come from
  - `make install` / `make install-cli` → `~/.cargo/bin`
  - `make install-released` / `scripts/install.sh` → `~/.local/bin` (released binaries)
  - `aida dev activate` → prepends the repo's `target/<profile>` to PATH in the current interactive shell only. Hooks, MCP servers and relay subprocesses don't see it.

  ## Before deleting one
  Check it isn't the ONLY `aida` on PATH. Hooks, the status line, MCP and running agents all call `aida` by name, so removing the last copy breaks every session at once. Install or link the replacement first, then remove the old copy.

  ## See also
  FAQ "How should I set up the aida binary while developing AIDA itself?"
