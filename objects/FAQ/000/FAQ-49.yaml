title: 'How do I fix ''refusing AIDA store write: hook is not this build''s shipped hook''?'
description: |
  **Back up the stale AIDA hooks under `.git/hooks`, delete them, and run `aida scaffold apply`, which recreates missing files. Never use `--force`.**

  ## Why
  Before committing to the store, AIDA refuses to run an AIDA-generated git hook whose body differs from the hook this build ships. Plain `aida scaffold apply` skips files that already exist, so it won't replace the stale hook. `--force` replaces EVERY scaffold file, including the repo's own README.md, CLAUDE.md and AGENTS.md. Each refusal names only one hook, so refresh all the AIDA git hooks at once.

  ## How
  ```bash
  cd <repo> && mkdir -p ~/hooks-bak-<repo> && \
    cp .git/hooks/{pre-commit,prepare-commit-msg,commit-msg,post-commit} ~/hooks-bak-<repo>/ && \
    rm .git/hooks/{pre-commit,prepare-commit-msg,commit-msg,post-commit} && \
    aida scaffold apply 2>&1 | grep -v skipped
  ```
  Git hooks aren't tracked, so there's nothing to commit. If you customised a hook on purpose, remove its `# AIDA Generated` / `# To customize` header lines instead, and AIDA checks it as a custom hook.

  ## Caveat
  BUG-1977 tracks a hooks-only refresh and a refusal message that lists every stale hook.

  ## See also
  BUG-1977
