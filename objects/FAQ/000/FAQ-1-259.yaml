title: How should I set up the aida binary while developing AIDA itself?
description: |
  **Symlink `~/.local/bin/aida` and `~/.local/bin/aida-server` to the main checkout's `target/agent/` builds, keep the main checkout on a clean `main`, and do all feature work in worktrees.**

  ## How
  ```bash
  ln -sfn ~/ai/aida/target/agent/aida        ~/.local/bin/aida
  ln -sfn ~/ai/aida/target/agent/aida-server ~/.local/bin/aida-server
  cd ~/ai/aida && git status --short && make build-fast   # rebuild the live binary
  ```
  Then remove the other copies (`~/.cargo/bin/aida*`, old `.bak` files) so only one binary remains.

  ## Caveats (until STORY-1646 lands)
  - **The live binary is whatever the main checkout last compiled.** If an agent edits or builds there, its unfinished work becomes everyone's `aida`. Feature work goes in worktrees, which build into their own `target/`.
  - **Don't run `cargo clean` in the main checkout.** It deletes the binary the symlink points at, and every session loses `aida` until the build finishes.
  - **A build that compiles but misbehaves goes live immediately, with no rollback.** To recover, check out a known-good commit and run `make build-fast`.
  - Use `make build-fast` rather than plain `cargo build`. It runs the live-wave build guard and restarts stale MCP servers.

  ## Coming
  STORY-1646: `aida dev build` builds, smoke-tests and atomically promotes to a live directory outside `target/`. It refuses from a dirty checkout, and adds `--clean` and `aida dev rollback`. `aida dev rebuild` is being removed.
