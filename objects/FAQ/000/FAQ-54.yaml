title: Why did a reviewer's test run show the wrong tests or a stale binary?
description: Several worktrees shared one CARGO_TARGET_DIR. Cargo's dep-info records relative paths, so a build from another worktree can make cargo think the PR's sources are already built, and it then runs main's binary. Give each review worktree its own target dir. If you must share one, touch the changed .rs files, confirm the output shows 'Compiling <crate>' from the review path, and confirm the PR's new test names appear in the run.
