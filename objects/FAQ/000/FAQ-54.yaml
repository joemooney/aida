title: Why did a reviewer's test run show the wrong tests or a stale binary?
description: |
  **Several worktrees shared one `CARGO_TARGET_DIR`. A build from another worktree made cargo treat the PR's sources as already built, so it ran main's binary. Give each review worktree a private target dir.**

  ## Why
  Cargo's dep-info and fingerprints are per target dir. Concurrent builds from different worktrees overwrite each other's outputs, so a later run can reuse a binary built from other sources.

  ## How
  - Preferred: `CARGO_TARGET_DIR=<private dir per worktree>`.
  - If you must share one: `touch` the PR's changed `.rs` files, confirm the build output shows `Compiling <crate>` from the review path, and confirm the PR's new test names appear in the run (`cargo test -- --list`).
  - Treat a run that fails these checks as invalid.

  ## See also
  DOC-7
