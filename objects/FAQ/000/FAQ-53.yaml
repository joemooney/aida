title: Why does 'aida agent new --bg' ask me to confirm bypass, and why can't an agent launch it?
description: |
  **`--bg` detaches the agent from any terminal, so it must run with permission prompts off. Turning them off needs a human to confirm at an interactive terminal, so a headless agent hands you the command instead.**

  ## Why
  A detached agent has nobody to answer permission prompts, so `--bg` forces `--permission-mode bypassPermissions`, and AIDA requires interactive confirmation for that. Dispatching also needs a parent seat grant that is allowed to delegate the child seat.

  ## How
  ```bash
  aida role enter advisor --no-resume --delegate-seat implementer
  aida agent new claude --bg --no-resume --role implementer --cwd <worktree> --prompt-file <brief>
  ```
  Answer `y` at `Continue with bypass?`. Seeing `backgrounded · <id>` means it launched.
  Without the delegating grant, you get `no valid parent seat grant is active`.

  ## See also
  FAQ-51, BUG-2002, DOC-6
