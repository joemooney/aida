title: Why does 'aida agent new --bg' ask me to confirm bypass, and why can't an agent launch it?
description: '--bg detaches the agent from any terminal, so nobody can answer permission prompts, and it forces --permission-mode bypassPermissions. Turning prompts off requires a human to confirm at an interactive terminal. A headless agent (such as the advisor seat) can''t confirm, so it hands you the command. The launching shell also needs a seat grant that may delegate the implementer seat: run ''aida role enter advisor --no-resume --delegate-seat implementer'' first. Otherwise you get ''no valid parent seat grant is active''.'
