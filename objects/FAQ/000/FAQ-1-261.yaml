title: What does '+dirty' mean in 'aida --version'?
description: |
  **`+dirty` means `git status --porcelain` was non-empty when the binary was built, and that includes UNTRACKED files. It doesn't necessarily mean the code differs from the commit.**

  ## How to tell which
  ```bash
  git -C <checkout> status --porcelain | grep -v '^??'   # empty → only untracked files; the code is the commit
  ```
  A build from a checkout whose only changes are stray scratch files (`*.log`, `fix_*.py`) still reports `+dirty`.

  ## Why it matters
  If tracked files were modified, the binary contains uncommitted code that may be someone else's unfinished work. Find out what was modified before trusting that build.

  ## See also
  `aida-cli-lib/build.rs` (computes the flag), STORY-1648 (flag main-checkout drift at session start)
