spec_id: FAQ-1-246
title: The advisor seat blocked my code edit. What are my options?
description: |
  **The advisor seat judges, reviews and routes. It doesn't implement. The guard hook asks you to choose a hat before writing code.**

  ## Your options (from the hook)
  | Command | Use when |
  |---|---|
  | `aida role enter implementer` | You really mean to implement it yourself in this session: switch hats openly |
  | `aida queue add <SPEC> --for implementer` | It's real product work: route it to an implementer seat |
  | `aida solo` | The operator sanctions this seat coding *and* integrating its own work |

  ## Notes
  - The guard fires **once per session**. Repeating the edit proceeds. Do that only for non-product work you won't commit, e.g. a reviewer-only script in your scratchpad (2026-10-10: the pure-move checker `verify_move.py`).
  - An advisor never approves or merges code it wrote. Switching hats doesn't change that: someone else must review it.
  - Template and skill edits (`aida-core/templates/`) are implementation too. File a spec instead of editing from the advisor seat.

  ## See also
  `.aida/discipline/two-seat-protocol.md`, FAQ-9
