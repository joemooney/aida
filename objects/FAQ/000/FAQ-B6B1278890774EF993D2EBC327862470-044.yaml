title: How do I set up a new remote lane host like dell1?
description: |
  Run `aida doctor --lane-host` on the target machine, and `aida doctor --lane-host --fix` for safe user-level permission and Cargo configuration fixes. See docs/cli/07-project-setup.md#lane-host-readiness for the checks, fix scope and current limits. This replaces the hand-maintained containment checklist; do not restore the old extra Codex writable roots.

  The command is an initial diagnostic slice, not full host certification: lane cache transport/reachability still depends on STORY-2641; release freshness and vendor credential validity are unverified. STORY-2642 remains in progress.

  ## Remaining manual setup
  - Configure SSH access (for example `ssh dell1`) and clone the project (reference checkout: `~/ai/aida`).
  - Configure remote/mirror connectivity. The reference GitLab remote uses ssh://git@gitlab.joemooney.com:2222/ai/aida.git. Machines on that LAN may need an /etc/hosts pin to bypass Cloudflare Access: other hosts use 192.168.179.100 and dell1 uses 127.0.0.1 for gitlab.joemooney.com.
  - Put `~/.local/bin` on PATH in both `.profile` and `.bashrc`. Use a login shell for remote commands, for example `ssh dell1 'bash -lc "aida doctor --lane-host"'`.
  - Install AIDA and vendor CLIs, and log in on the host (`codex login` for ChatGPT Codex). Authentication is manual; credential-source presence does not establish token validity.
  - Follow `aida doctor --fix-sandbox` for any system-level userns/AppArmor setup; run sudo commands yourself.
  - Fetch dependencies on the host before starting lanes. Leave AIDA_OS_WRAP unset to use the lane test-runner default.
