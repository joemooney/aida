title: How do I set up a new remote lane host like dell1?
description: |
  Checklist for a new remote lane host. Reference host: dell1 (user dirtlab), set up 2026-11-05..07. Keep this row current whenever a lane host's config changes.

  ## 1. Access and checkout
  - `ssh dell1` works from the primary (permission rule `Bash(ssh dell1:*)`).
  - Clone at `~/ai/aida`. Remote `all` = ssh://git@gitlab.joemooney.com:2222/ai/aida.git. The host pulls main and aida-store from GitLab, which the primary keeps current with `aida remote mirror-sync`.
  - `~/.local/bin` is on PATH in BOTH `.profile` and `.bashrc`. Run remote commands as `ssh dell1 'bash -lc "..."'`; a non-login ssh shell does not find `aida`.

  ## 2. AIDA binary
  - `aida dev build --install-links` once, then `aida dev build` after each pull (the standing order keeps the host binary current). `~/.local/bin/aida` links to `~/.local/share/aida/live/aida`.

  ## 3. Containment (without this, lanes run UNCONTAINED)
  - `~/.aida/agents.toml`: `[agents] contained = true, bypass = false`; `[agents.codex] default_flags = ["--sandbox","workspace-write","--ask-for-approval","never"]`. Copy it from the primary.
  - `~/.codex/config.toml`: a `[sandbox_workspace_write]` section with `network_access = true` and `writable_roots = ["~/.cargo","~/.rustup","~/.aida"]`.
  - bubblewrap user namespaces: `/etc/sysctl.d/99-aida-bwrap-userns.conf` containing `kernel.apparmor_restrict_unprivileged_userns=0`, then `sudo sysctl --system`.
  - Verify: a lane log says "this lane's test runner is on", and the codex argv shows `--sandbox workspace-write` with posture=native.

  ## 4. Vendor auth
  - `codex login` (ChatGPT) on the host; `~/.codex/auth.json` must exist.

  ## 5. Build cache
  - sccache: NOT installed on dell1 yet (2026-11-07). The primary uses `rustc-wrapper = "~/.cargo/bin/sccache"` in `~/.cargo/config.toml`. dell1's target dir is 76G.

  ## 6. Running lanes (advisor procedure)
  - Primary: `aida push && aida remote mirror-sync`. Host: `git fetch origin main && git merge --ff-only origin/main && aida pull`.
  - Launch: `setsid nohup env -u AIDA_SESSION_PURPOSE aida queue work SPEC --role implementer --no-human --vendor codex [--force-claim] [--branch NEW] > ~/lanes/lane-SPEC.log 2>&1 < /dev/null &`
  - Do NOT set AIDA_OS_WRAP=0: leaving it unset gives the lane its bwrap test runner.
  - Leases are per host: record the dell1 partition on each spec, and keep those specs out of the local fill-slots and auto-rework.
  - Lanes run ungranted: if one dies before opening its PR, open the PR from the primary with gh.
