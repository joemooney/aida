title: How does a Codex lane's work get published when its sandbox makes .git read-only?
description: |
  **From the host, run `aida ship SPEC --from-seat <seat-clone> --commit-pending "[AI:codex] type(scope): summary (SPEC)"`. It commits the seat's pending edits and pushes them to the spec's existing PR, or opens one.**

  ## Why
  Codex's native sandbox mounts `.git` read-only, so a Codex `queue work` lane can't fetch, merge, commit or push. It leaves validated edits uncommitted in its seat clone and exits.

  ## How
  1. After the lane exits, check its seat: `git -C <seat> status --porcelain`.
  2. If there are changes, publish them from the host with the command above. It reuses the open PR on that branch, or creates the PR and files the review story.
  3. If the seat sits on a stray `<branch>-2` that started from main (BUG-2451), don't publish it as a second PR. Save the diff and apply it on the real PR branch instead.
  4. If the branch is already on origin with nothing new, the bundle is empty: use `gh pr create --head <branch>`.
  5. Before ending a seat, confirm no commit is unpushed: `git rev-list HEAD --branches --not --remotes=origin` must be empty.
  6. Merge-conflict reworks go to a Claude lane; Codex can't fetch or merge.

  ## Caveat
  STORY-2475 (in review) automates step 2, and BUG-2451 fixes the stray `-2` branches. Once those land, much of this is automatic.

  ## See also
  STORY-2475, TASK-2712, BUG-2451, BUG-2450
