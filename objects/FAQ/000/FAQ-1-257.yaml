title: Why does 'aida list --search' fail?
description: |
  **`aida list` has no `--search` flag. Use `aida search "<words>"`.**

  ## Why
  Search is its own command and ranks matches across titles, descriptions and comments. Older copies of some skills (e.g. `/aida-capture`'s dedup step) said `aida list --search`, which fails with `unexpected argument '--search'`.

  ## How
  ```bash
  aida search "faq topics"
  aida faq list --tags topic:relay   # filter one type by tag instead
  ```

  ## Caveat
  The shipped skill templates now use `aida search`, and CI checks every `aida ...` command in skill and command templates against the CLI's `--help`, so invented flags fail before release. A project with skills installed from an older release keeps the old line until its skills are refreshed.
