title: Why does 'aida list --search' fail?
description: |
  **`aida list` has no `--search` flag. Use `aida search "<words>"`.**

  ## Why
  Search is its own command and ranks matches across titles, descriptions and comments. Some skills and docs (e.g. `/aida-capture`'s dedup step) still say `aida list --search`, which fails with `unexpected argument '--search'`.

  ## How
  ```bash
  aida search "faq topics"
  aida faq list --tags topic:relay   # filter one type by tag instead
  ```

  ## Caveat
  BUG-1922 tracks fixing the stale skill/doc text and adding a lint so made-up flags in skill templates fail CI.
