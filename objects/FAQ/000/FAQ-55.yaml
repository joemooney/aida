title: 'How do I see where a spec''s time goes: working vs waiting (cycle time)?'
description: |
  **Run `aida metrics cycle-time --since 30d`. It splits elapsed time into work (implementer, CI, review, merge) and waiting (queued, awaiting approval, parked, awaiting merge), with p50/p90 per activity and the slowest specs.**

  ## Why
  "Specs take too long" usually means waiting, not working. On 2026-10-12 the 30-day view showed work at under 1% of tracked time: implementer p50 about 7 min, CI p50 about 8 min. The waits were much larger: queued p50 2.7h and p90 49h, awaiting approval p90 23h. Speeding up the agents would hardly move that; shortening queues and approval would.

  ## How
  ```bash
  aida metrics cycle-time --since 30d              # whole window
  aida metrics cycle-time --since 30d --type bug   # one type
  aida metrics cycle-time --slowest 10             # the long tail
  aida history <ID> --timeline                     # one spec's spans
  ```
  Output can be human, TOON or JSON. It works offline, because it rebuilds timelines from store transitions plus this machine's drain feed.

  ## Caveat
  Work done on another machine, or outside a drain or relay, has no local drain events. It shows up as `unexplained` or under `excluded` with a reason, so check `included` against `completed_in_window` before trusting the split.

  ## See also
  STORY-1479, EPIC-73, ADR-64, DOC-7, STORY-1684
