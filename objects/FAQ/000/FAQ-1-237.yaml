title: How do I verify that a refactor commit only moves code?
description: |
  **Compare the lines the commit removes with the lines it adds. In a pure move they're the same set.**

  ## How
  - Advisor tool: `python3 -I ~/ai/aida-advisor-tools/verify_move.py <commit|A..B> --repo <checkout>`. For each commit it reports PASS/FAIL, lines added or removed beyond the allowed wiring, whitespace-only changes, and files touched outside the move.
  - Allowed additions: the `//!` header, `// trace:` comment, `use crate::*;`, `mod X; use X::*;`, and the manifest entry.
  - By hand:
    ```bash
    git show <sha> -- <old-file> | grep '^-' | grep -v '^---' | sed 's/^-//' | sort > rm.txt
    git show <sha> -- <new-file> | grep '^+' | grep -v '^+++' | sed 's/^+//' | sort > add.txt
    comm -3 rm.txt add.txt   # should list only the allowed wiring
    ```
  - `git diff --color-moved=zebra` shows the same thing visually.

  ## Why it matters
  A "refactor" that also edits behaviour can't be reviewed as a move. Keep test, guardrail or tooling changes in their own `retarget:` / `tooling:` commit so the move commit stays pure.

  ## See also
  STORY-1488 V2 proof, TASK-1538
