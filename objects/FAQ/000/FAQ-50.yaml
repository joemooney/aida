title: Why did the runaway-seat watchdog flag my cron as a mail poll?
description: |
  **Its prompt mentioned the mailbox. A `CronCreate`, `ScheduleWakeup` or `/loop` prompt containing "mailbox", "inbox" or "mail tick" counts as a model-side mail poll, which has been forbidden since BUG-1589. Mail reaches the seat through the prompt hook, so leave those words out.**

  ## Why
  `aida doctor check runaway-seats` (`runaway_seats.rs`, `mentions_mailbox`) scans session transcripts. Any scheduling tool call whose prompt contains those words is flagged `mail-poll-setup`, and the `watchdog-route` job is routed to the advisor seat.

  ## How
  Delete the cron (`CronDelete`) and re-create it with a prompt that does the real checks (CI, `aida schedule due --seat <seat>`, PR states) and never mentions mail. Close the routed job with `aida schedule done watchdog-route --note "..."`.

  ## See also
  BUG-1589
