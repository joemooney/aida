title: How do I mark a needs-attention spec done after its work has shipped?
description: |
  **Go through in-progress: run `aida edit <ID> --status in-progress`, then `aida edit <ID> --status done`.**

  ## Why
  A needs-attention spec can only be triaged to Approved, In Progress or Rejected. A direct change to done or completed is refused. Normally a merged PR whose trailer names the spec completes it on `aida pull`. As of 2026-10-14 that did not happen for a needs-attention spec (BUG-2134), so a spec whose work has fully shipped can stay needs-attention.

  ## How
  ```bash
  aida comment add <ID> "Closing: <PRs that shipped it>; follow-ups: <IDs>"
  aida edit <ID> --status in-progress
  aida edit <ID> --status done
  ```
  Leave the comment first so the closure has a recorded reason.

  ## Caveat
  Depends on BUG-2134. Once a merged trailer completes needs-attention specs, this manual route is only needed for work shipped without a trailer.

  ## See also
  BUG-2134, BUG-1797, BUG-1994
