title: Why didn't my merged PR's spec move to Completed?
description: |
  **Merge-time completion runs when `aida pull` brings in the merge commit. After a plain `git pull` or a `gh pr merge`, run `aida db reconcile-status --since <sha>`.**

  ## Why
  A trailing `(SPEC-ID)` on a merged commit completes the spec, but only through the pull-time auto-bump scan, which looks only at the commits that the current `aida pull` brings in. Commits pulled some other way (`git pull`, or merging on GitHub and fetching with git) are never scanned, so the spec stays In Progress. The trailer itself is fine: a squash title like `... (BUG-1928) (#2534)` is recognised.

  ## How
  ```bash
  aida db reconcile-status --since <sha-before-the-merges> --dry-run   # preview
  aida db reconcile-status --since <sha-before-the-merges>
  aida db reconcile-status --spec BUG-1928                              # one spec
  ```
  Specs with an open PR still referencing them stay as they are.

  ## See also
  FAQ-2, FAQ-16, BUG-506, TASK-1338
