title: Do I need --delegate-seat when entering a role for an orchestrator, burndown or relay run?
description: |
  **Yes, if the run will have AIDA launch child sessions. Enter the role with every seat its children will need: `eval "$(aida role enter integrator --delegate-seat implementer --delegate-seat reviewer)"`.**

  ## Why
  When AIDA itself starts a child session, it issues a **child grant** for that seat. That happens in `aida queue work` / headless spawns, the reviewer launch path, `aida burndown run` and `aida agent new`. The child grant is refused unless the parent grant lists the seat as delegable: *"the active `integrator` grant does not delegate `implementer`"*. Without the flag, a long unattended run fails the first time it takes that path.

  Native Claude Code subagents (`Agent` tool) don't need it, because they inherit the parent's grant (`AIDA_SESSION_GRANT`).

  ## Also
  - `aida role enter` needs a human at a TTY. Run it in the shell that will start the relay, burndown or orchestrator; children inherit the grant through the environment.
  - Grants expire after at most **24 h**. Re-enter and restart longer runs.
  - Each delegated seat must be in your roster entry (`.aida-store/registry/team.toml`). Add one with `aida team allow-seat` (TTY).
  - Check: `aida team my-role`, `aida role show`.

  ## See also
  the FAQ "What's the difference between a role seat and a handoff seat?"; `aida role enter --help`
