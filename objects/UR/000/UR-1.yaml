id: c3012f71-f00d-4074-91d5-d051fb0b9bab
spec_id: UR-1
title: Why have Feature
description: |
  Why have Feature

    Current Model:
    - RequirementType (enum): Defines the nature - Functional, Bug, Story, Task, etc.
    - feature (string field): Defines the domain/area - "Authentication", "Payments", "UI"
    - Both have prefixes for ID generation (e.g., AUTH-STORY-0001 in TwoLevel mode)

    Recommendation: Keep them separate.

    The two concepts are orthogonal:

    | Dimension          | Type                             | Feature                        |
    |--------------------|----------------------------------|--------------------------------|
    | Question answered  | "What kind of thing is this?"    | "What area does it belong to?" |
    | Examples           | Bug, Story, Task, Functional     | Authentication, Payments, UI   |
    | Filtering use case | "Show all bugs"                  | "Show all auth-related items"  |
    | Methodology        | Requirements engineering / Agile | Business domain                |

    Why separate is better:
    1. Cross-cutting queries - A bug in authentication is type=Bug, feature=auth. You want to filter independently.
    2. Type defines workflow - Bugs have different workflows than Stories or Tasks
    3. Feature defines ownership - Auth team owns all auth items regardless of type
    4. ID flexibility - TwoLevel mode gives AUTH-BUG-0001 which communicates both dimensions

    If you merged them:
    - You'd need AuthBug, AuthStory, PaymentsBug, PaymentsStory... combinatorial explosion
    - Or lose one dimension of classification
    - Can't easily query "all bugs across all features"

    The current design follows standard requirements engineering practice where type (functional/non-functional/constraint) and feature/module are separate taxonomies.

    One possible simplification: If you rarely use both prefixes in IDs, you could make feature optional and use tags for domain classification instead. But the current two-field approach is more explicit and queryable.
