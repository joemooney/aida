- id: 01a11c81-84ff-7fb2-bfb5-633661415241
  author: joe
  content: |
    # DRAFT ADR — EPIC-74 canonical admission and landing evidence

    Status: PROPOSED, awaiting a new different advisor; not an accepted ADR and not published to docs. Codex same sketch-author lineage, 2026-10-08. Main b46aec1e674baae5a329416d4119e67b59200a88. Technical response to E2–E4 of ANSWERED_DESIGN_SKETCHES_INDEPENDENT_REVIEW.md. No implementation or new release entitlement.

    ## Proposed decision and scope

    Use the existing canonical store writer guard for graph/action serialization, composed with existing local branch merge leases. For effects requiring other existing locks/processes, use a durable admission intent under the SAME store guard and require graph writers to honor that intent. This is one protocol with two execution forms, not another advisory lock namespace. These are proposed schema/API extensions for review, not shipped capabilities.

    Cooperative boundary: one canonical store lock domain and AIDA-managed actions/writers using the upgraded validator. Different independent clones and old binaries do not share that mutex/protocol. A declaration synchronized into clone B must still exclude main-line work, but a local lock does not authorize protected concurrent cross-clone shipping. If a positive operation requires coordination across those domains, refuse it as unsupported rather than introducing a distributed service here. Raw git/forge/file mutation remains outside the claim and, when detected, invalidates admission. Full remote atomic expected-base guarantees are unsupported unless an adapter proves them.

    ## Durable representation (proposed version 1)

    Typed `branch_isolation` extension on the owning epic Requirement, serialized in its existing canonical object, with normal store commit/history/replication. No parallel lane store. Identifiers are UUIDs; display IDs are presentation only. Known descendant UUIDs retain a typed reference to epic UUID + generation; reciprocal field/graph mismatch refuses. A retained epic generation cannot be deleted or erased by clearing its active declaration. Schema unknown/malformed/partial => action refusal and no status promotion.

    | Record | Required fields / invariants |
    | --- | --- |
    | IsolationGeneration | schema_version=1; epic_uuid; random generation UUID; repo identity (forge instance + immutable repository ID, not just mutable URL); target full ref; default full ref/identity at declaration; optional parent full ref; state Active or Landed (no unlanded Released state authorized); membership UUID set; graph generation/digest; creation audit identity. Retained after active declaration clears. Redeclare creates new generation, never reuses old evidence. |
    | InputVector | generation UUID; canonical bidirectional ancestor/subtree edge digest and sticky membership digest; target/parent/default identity and observed ref SHAs; child UUID -> acceptance-definition digest + reopen generation/evidence revision; applicable review/hold gate input revisions; schema version. Store HEAD recorded for audit only. |
    | ActionIntent | random action UUID; kind and affected UUIDs/generations; InputVector digest; expected effect identity (PR/MR/source/base or queue/lease/worktree operation); owner process/session identity using existing identity primitives; Pending / Applied / Uncertain / Verified / Aborted; result identities; output revisions. Pending admission survives crash, not silently expired into permission. |
    | ChildMergeEvidence | immutable evidence UUID; generation + child UUID; repository; PR/MR immutable identity; actual base full ref; original source SHA/tree; original merge/result SHA and observed time; original child acceptance digest and reopen generation; existing reopening SHA/history evidence; independent review reference; associated action UUID. A new landing never rewrites these freshness fields. |
    | LandingCoverage | coverage UUID/version; isolation generation; repository; landing PR/MR; actual intended target/base ref; reviewed source full SHA/tree and base full SHA/tree; merge method; canonical diff/content digest; sorted covered child evidence UUIDs; explicit excluded UUIDs/reasons; reviewed set digest; reviewer identity/verdict/reference and existing authority validation context; review revisions; eventual forge-confirmed actual source/base/result SHA, verification timestamp and action UUID. Review alone is not a merge result. |

    Graph/input generations change only for relevant graph, declaration, membership, acceptance/reopen, default identity or review/gate edits. Changes to these fields are derived by backend before/after comparison, not trusted caller-supplied counters. New coverage evidence and status changes are output revisions; recording Pending/Verified or Done/Completed does not increment its own input generation. Unrelated comments/history append do not invalidate content by changing store HEAD. Reopen ALWAYS increments child reopen generation and retains existing SHA/history fences. Imported old/new objects reconcile against retained generations; importing a lower counter or absent ledger refuses, never resets lineage. A replica missing required retained lineage cannot prove completion.

    ## Transaction and lock order

    1. Pure planning resolves D context; no queue/lease/status/worktree/PR effects. Enumerate all input UUIDs and target branch identities; fail on unknown graph/default. No store guard while acquiring external locks.
    2. For merge/retarget/sync acquire necessary existing branch merge leases in stable repository/full-ref order (both old and new target for retarget). An unsupported branch-key collision or identity mapping refuses. Then acquire existing `GitBackend::lock_store` / `StoreWriteGuard`. No reverse-order path. Non-merge admission begins directly with the store guard.
    3. Re-read canonical graph, retained ledger, input revisions and pending intents under the guard. Check current forge identity/head/base for a forge action, existing authority/hold/review gates and all generations. No cached absence. Write Pending intent and make it durable before external effects; persistence failure => no effect. This committed Pending record is the admission linearization point: it reserves the full affected input set.
    4a. Bounded forge request that does not need another AIDA/store writer: retain SAME StoreWriteGuard through request and local outcome/coverage write. All AIDA graph writers and retargeters therefore serialize. Supply atomic source-head precondition where supported. Network deadline must be shorter than valid lease ownership; uncertain/expired lease validity refuses before send. No sleeping on CI/review under locks, no refresh/pull, no child AIDA command requiring the guard. Bounded I/O timeout releases the guard only after persisting Uncertain if possible; Pending already survives otherwise.
    4b. Local queue/lease/worktree/spawn setup requiring existing queue locks or AIDA child processing: publish Pending with a complete effect identity under guard, release the guard, obtain existing resource locks in their unchanged order and perform only the admitted effect. Every isolation-affecting writer, including reopen, checks conflicting Pending/Uncertain intents under store guard and refuses with action ID (does not wait holding a lock). Thus graph inputs remain reserved after guard release. A second admission touching the reserved set refuses too. Reacquire store guard after releasing resource locks, validate expected effect and same inputs, then atomically mark Verified/output. Do not call arbitrary child workflow as one admitted effect: spawn admission ends after successful child registration/spawn; the child subsequently obtains fresh per-phase admission. Its first mutation cannot race registration because it waits for published registration/admission completion through the existing launcher handshake; if no such handshake can be used, that path remains unsupported for positive launch.
    5. Release store and branch guards before cache upsert, post-merge pull or subsequent phase. Caches are derived after success; failure does not undo canonical evidence. No cache lock held while waiting for the store. A helper executing inside the guard must use canonical backend primitives without hidden cache/queue/merge lock acquisition. Existing `CachedGitBackend` callers must be refactored at these seams if they cannot honor this order; no assertion that all current writers already can.

    The proposed guarded callback and admission validator must cover `update_spec_atomically_with_subject`, `bulk_update_atomically`, ordinary save/delete/import, relationship mutations, and store-ref/worktree replacement. Same-thread re-entrancy is permitted only for canonical writes inside the callback; it does not permit acquiring a different lock in reverse order. Pending conflicts produce bounded refusal, not polling while holding another resource lock. Readers may show pending/unknown without blocking a long network operation; readers never create authority.

    ## Writer closure, crashes and recovery

    All isolation-affecting mutations compare the full before/after graph and retained generations under the existing guard. Changes conflicting with Pending/Uncertain intent refuse even if made through alternate APIs, import, restore, rebase/conflict resolution or generic --force. AIDA store pull prepares candidate content outside the live store then acquires guard, validates candidate graph/lineage and installs under guard; a direct live worktree rebase that bypasses that validator is unsupported for this protected feature. Default changes are intercepted for AIDA-mediated updates; externally changed defaults invalidate operations on next probe and cannot make generation isolation disappear.

    Target reset/clear, ancestor removal, reparent/detach, deleting/retyping the epic or its retained evidence, omitting sticky child refs, and importing older state count as release equivalents. In slice 1 all refuse. After verified complete landing, a proposed clear is one guarded output only if every retained current member's exact evidence validates and there is no live/unlanded/pending work. Active lease state must be read through existing locks/admission inventory without reversing order; inability to establish quiescence refuses. Quiescence alone never authorizes release of unlanded work. That capability remains operator-blocked.

    Process death releases OS store lock but NOT the durable Pending reservation. Recovery acquires the same ordered locks and reads intent, actual forge/queue/lease/worktree state and original input vector. It queries actual merge status before any retry, verifies immutable identities, and completes the same action UUID once. If no effect can be positively proved and safe cancellation is established (no live spawned process, no in-flight remote request, no later arrival), mark Aborted without changing isolation. Uncertain timeout may have a request still reaching server: never declare “no effect” merely because a current query says unmerged; refuse/reconcile until definitively resolved. No automatic timeout releases isolation. Partial local effects are reported and reconciled using the action identity; no destructive cleanup is invented. Existing pending state blocks unrelated continuation only where input sets overlap. Global store serialization may reduce throughput; this is accepted as a proposed tradeoff, not a hidden distributed guarantee.

    ## Forge limits

    Current `MergeOptions.match_head` supplies source precondition only; the wave path currently sets None. V2 requires actual source pin on all supported merges and serializes AIDA retarget under this store protocol. Read actual base/default again under guard just before request; the full reviewed base SHA remains a review input. A same-head raw forge retarget remains possible outside the AIDA-managed boundary. Do not represent this as prevented. A backend requiring atomic expected-base, default-ref or expected target-tip to uphold its requested contract must refuse if its adapter cannot provide them. A changed observed target tip forces review/replan; a backend's unpreventable concurrent external base update is an unsupported strict path. Result verification can withhold completion but cannot undo a wrong remote merge, so it is not a substitute for a missing required precondition. Positive tests may use capable fake adapters; no claim either current production adapter meets all strict conditions.

    ## Completion algorithm — same validator everywhere

    1. Resolve UUID lineage using retained canonical generation records, even after clear/remap/clone. No record/unknown schema for known isolated work => error. Legacy ordinary work follows existing rules; a missing isolated record cannot silently be reclassified ordinary.
    2. Validate each original ChildMergeEvidence against child's current acceptance and reopen generation, existing `auto_bump_evidence_is_stale` SHA/history rules and verified actual child merge. Old child evidence remains stale even when a later squash SHA is fresh. A new reviewed implementation/evidence record is required after reopen.
    3. Build landing candidates from original child evidence. Require ancestry/inclusion to the reviewed source where the merge topology preserves it. If previous squash removed ancestry, traverse prior verified coverage links, never infer from subjects or patch-id alone. Unknown topology refuses coverage for that child.
    4. Independent reviewer explicitly assesses the final landing diff and proposed sorted covered set against each child's acceptance. Review records include rejected/reverted/omitted child work. Ancestor-but-reverted is excluded; not auto-covered. A generic green review lacking explicit coverage attestation is insufficient. Bind attestation to source/base trees, full diff digest, coverage set and child definition/reopen inputs; changed inputs invalidate it. Existing reviewer independence/authority checks apply; manifest author cannot self-approve.
    5. Before merge rerun 1–4 under M. After actual merge obtain authoritative forge result including actual source/base/result; verify result reachable from the positively identified default for Completed. For squash, verify resultant tree/diff against the reviewed source/base content with declared merge method (e.g. base/result diff for a pinned fast-forwardable source or deterministic reviewed merge result tree). If intervening base changes prevent that proof, retain Done and require renewed review; never patch-id/subject guess. Intermediate parent records coverage chain but is not default completion.
    6. C promotes only intersection of verified covered child evidence and current fresh child inputs. Body trailers, current descendants, umbrella/review-covers links and direct status edits cannot expand it. All promotion callers use C. Persist result and status outputs idempotently for the action UUID under guard. If local persistence fails, Pending retains isolation; recovery revalidates original evidence and actual result, not just latest squash SHA.
    7. Only fully covered current retained membership with no unlanded/live/pending additions permits the proposed verified-landing clear. Partial landing retains declaration. Cleared generation/history and membership remain replicated for replay; no “new descendant now Done” bulk completion.

    ## Tests and open technical gates

    Use isolated temp repositories/HOME, fake vendors/forges and explicit barriers: hold a writer after action's FINAL validation and show it cannot affect admitted inputs; exercise intent path after dropping guard as well. Names: declaration_change_after_final_check_serializes_with_action; pending_local_admission_blocks_reparent_after_guard_release; store_pull_generation_change_invalidates_plan; own_evidence_output_does_not_invalidate_input_generation; lock_order_never_waits_queue_or_cache_under_store; crashed_pending_intent_never_silently_expires; same_head_pr_retarget_during_merge_is_not_head_pinned; unsupported_base_precondition_refuses_before_request; remote_merge_success_local_persist_failure_reconciles_once; reopened_child_old_work_in_new_squash_stays_open; reverted_child_ancestor_is_not_coverage; squash_body_omitted_id_cannot_bypass_manifest; clone_replay_after_clear_retains_coverage_fence; landing_races_new_child_no_clear. Pair negatives with ordinary and supported fake-adapter positive outcomes. No test executed.

    Pending independent review: lock/callback feasibility at every writer, admission handshake availability, exact capability conditions per adapter, schema migration and supported canonical writer domain. No live/unlanded release permission is selected. This ADR cannot authorize full epic implementation or protected production merges; it makes the technical and unsupported boundaries reviewable.
