  content: |-
    Terminology + design fork proposed (operator, 2026-09-28): replace the coined noun 'lane' with AIDA_TARGET_BRANCH / AIDA_PARENT_BRANCH plus one store-side declaration on the epic.

    Write-up: docs/plans/2026-09-28-epic-74-target-branch-vs-lane.md

    Core argument: 'lane' never escapes branch vocabulary in this epic's own acceptance criteria, so it adds a word without adding a concept. The two variables fully replace STORY-1482's PR targeting and STORY-1483's sync, and they make Completed definable (target == default branch) instead of special-cased. What they CANNOT replace is this epic's safety guarantee: main-line exclusion must stay a store fact, because the sessions that must honour it (main-line drains, integrate, groom) are exactly the ones that never set the env vars.

    NOT a disposition. This rewrites the model across three approved children, so it is a design fork for the advisor, and this epic's own DIRECTION already requires a sketch + ADR before implementation. Nothing here changes status.

    Cheap to decide NOW: EPIC-74 is Draft, all three children are guided + needs-sketch, nothing is implemented. Post-implementation the same rename costs a deprecation shim for 'aida lane *'.
