agreed_id: EPIC-74
title: 'Feature lanes: epic-bound side work that cannot reach main until deliberately landed'
description: |
  Let an operator (or an agent seat) work a feature **on the side**, bound to an epic, with a guarantee that nothing reaches `main` until the lane is deliberately landed.

  What exists today is `aida worktree enter EPIC-N`: a sibling worktree on `epic-n-work`, with focus scoped to the epic's subtree. The isolation is by convention only:
  1. **Scoping is one-way.** Main-line seats (drains, `aida integrate`, `aida groom`, the queue) still see the epic's specs. An approved and queued child ships to **main**.
  2. **There is no integration target.** Implementer PRs target `main`, and Completed is hard-wired to "merged to the default branch", so work merged into a side branch has no truthful status.
  3. **The side branch drifts.** EPIC-72 was built on `feat/jev-integration` and needed TASK-1470 to transplant it onto a fresh branch from main before it could land.

  Slices:
  1. The lane record and main-line exclusion (the safety guarantee).
  2. Lane-targeted PRs and the Done-in-lane status.
  3. Sync with main and landing the lane.

  Architecture change: it touches drain selection, PR base selection and Completed semantics. It needs a sketch, advisor sign-off and an ADR before implementation. Slice 1 alone already delivers "cannot interfere with main" and ships first.
