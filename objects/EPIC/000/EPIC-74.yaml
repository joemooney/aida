  content: |
    # DRAFT ADR v4 — typed late results and explicit store-only transitions

    Codex, same sketch-author lineage, 2026-10-08. Full positive design PROPOSED, awaiting NEW different independent advisor. Current committed main 0ffe03948e25949ec8961ca81d0dd44f16580107; relevant source inventory is unchanged from reviewed b46aec1e674baae5a329416d4119e67b59200a88 (intervening commit touches dev_cmd.rs). Concurrent working edits are not incorporated. No canonical operations during shared-store recovery; exact proposed relay body only. V1–V3 remain preserved.

    This replaces the unsigned full v3 ADR proposal, not the independently signed S1–S4 boundary. The complete signed section is reproduced verbatim at the end and retained in answered-sketch-v4-evidence/S1-S4-verbatim.md. The current independent report signs only that protective DESIGN; implementation readiness remains NOT READY. Sections 2–6 below address the two remaining findings for future positive paths, and are not covered by that limited signoff.

    ## 1. Preserved owners, locks and prerequisites

    Canonical store writer owns checked persistence and candidate-graph validation; TASK-1332 is the existing integration seam, not work duplicated here. The signed common publisher alone owns provisional lifecycle after-images, final authority sample, immutable C/receipt and original-child release. Epic reservations constrain actions, never grant authority or act as launch tokens. Existing forge owner owns one authorized request and its actual immutable result. No second publication/release owner, recovered release, or retry inferred from Pending/Closed.

    Existing signed order remains home -> canonical repo -> sorted seats -> store -> sorted queues -> drain -> manifests -> verdict -> merge -> Git. READY, callback/helper exchange, network/forge, waits/reaping/backoff remain outside seat. Reservation preparation and later store projection are bounded STORE-ONLY phases, with no merge/seat/queue/cache/common lock held. Lifecycle consumer enters common only after dropping that phase; common validates in its already-ordered store phase. Forge-only preflight is store-only; optional branch lease request phase holds no store/common lock, then drops lease before store projection. No merge->store nesting or global reversal of ordinary lock callers. No guard crosses exec.

    Required common isolation-consumer hook/receipt mapping, checked canonical persistence/strict snapshot API, candidate-before-install adoption and hook-safe Git adapter where configured are UNPROVIDED prerequisites, not existing functions inferred from spawn_vendor_headless_with_seat or update_spec_atomically. Missing support refuses before affected effects. Current auto_commit_paths ignores stage/commit errors, bulk writes are sequential, and cached single writes can hold store through cache work; these do not establish the required contract. Required hooks may not be disabled or replaced by recursive ordinary AIDA under parent store lock. Existing typed StoreMetadata load/save/extract/import must preserve versioned constraint data or refuse; merely naming a new field is not writer closure.

    ## 2. Immutable intent, typed output slots and digest serialization

    Replace v3's impossible pre-effect exact-result digest with separate phase projections. The pre-effect intent is immutable: action UUID, kind, owner identity/domain expected under existing authority, repository/PR/spec UUID identities known at that phase, requested operation, resolved Ordinary/Isolated input predicates, source/base refs and SHAs where known, fixed bounded slot schema and quotas. A slot represents one specifically named observation, not arbitrary replacement of an object. Unknown actual result bytes are absent until the real owner binds them; they are not guessed or zero-filled into a supposed result hash.

    Canonical encoding for these proposed digest projections: schema-tagged JSON with UTF-8; object keys sorted lexicographically by UTF-8 bytes; no insignificant whitespace; strings escape quotation mark/backslash and controls U+0000..U+001F (lowercase four-digit Unicode escapes), other characters encoded as UTF-8; invalid Unicode rejected; no floating point; integers decimal with no leading zeros; booleans literal; explicitly typed optional fields always present as null when absent. UUIDs and hex hashes lowercase with validated lengths/algorithm tags; full Git refs retained byte-exact as valid strings; no lossy Unicode/path normalization. Set-valued arrays sorted by their declared UUID/slot key, duplicates rejected; order-sensitive arrays retain order. Timestamps, if required by a projection, use UTC with exactly nine fractional digits. Encoding/hash golden fixtures are required before implementation, not an implicit dependency on a vendor serializer.

    Digests use SHA-256 over UTF-8 domain separator + NUL + canonical bytes. Fixed domains: `aida.branch.intent.v1`, `aida.branch.inputs.v1`, `aida.branch.output-schema.v1`, `aida.branch.observation.v1`, `aida.branch.store-transition.v1`. Each projection excludes its own digest field. Git commit/tree OIDs are external receipt data, never inputs to the serialization of a payload contained in that same commit. Ordinary YAML remains storage serialization; a digest never hashes arbitrary YAML formatting or live cache projections.

    | Phase | Bound fields/digest | What is not yet known |
    | --- | --- | --- |
    | I: intent preparation | input digest + output-schema digest + immutable intent digest; UUID preallocated | actual waiting-child identity, common C/receipt, forge result SHA and observation timestamps |
    | P: checked Pending commit K0 | exact intent and finite slot declarations plus Pending; receipt R0 returned after commit/readback | K0/tree0 are NOT embedded in their own payload |
    | O: sole owner observation | common owner binds actual waiting-child/process/image/after-image facts in its EXISTING final publication C/receipt; forge owner binds actual response to its exact request | consumer does not invent identities or issue a new C |
    | B: bind/project concrete result K1 | observation digest over actual typed values and backward references to R0 and owner result; exact store after-images now derived and checked | K1/tree1 not contained in K1 payload; existing Pending remains |
    | T: terminal constraint observation K2 | bounded terminal observation references R0, owner result and checked output receipt R1 for K1 | K2/tree2 not contained in K2 payload; returned only afterward |

    Actual output slot schemas are finite arrays fixed in I, one slot per intended child/request/spec/result projection. Required fields, allowed enums, maximum byte lengths, maximum list cardinalities and aggregate byte budget must all be positive finite values fixed under the existing owner's configured limits; omitted/unbounded quotas refuse preparation. Increasing count/budget/namespace after I requires a new independent admission, never modifying Pending to fit. Slots cannot contain arbitrary JSON or caller-selected filesystem paths. Canonical destination keys derive from fixed action UUID + slot ID; optional new IDs are typed values, not authority to overwrite an arbitrary object with that ID.

    | Example slot | Late values permitted | Binding/negative constraints |
    | --- | --- | --- |
    | CommonResult | actual child process/start/image identity, existing common C/receipt reference, actual common-owned lifecycle result IDs | Bound by that same common owner's final sample/C, for the exact prepared child/operation and original channel. No consumer-supplied new child, grant, release token, changed requested role or substituted PID. Common C consumes R0; epic K1 is later observation, not a prerequisite hash folded back into C. |
    | ForgeResult | actual response result SHA/tree/first-parent, merge time, forge immutable response identity | Exact request/repo/PR/source/base and expected effect transition; owner verifies response. Cannot change target/default identity, source, covered set or requested operation. Unknown result => Uncertain, not fabricated slot completion. |
    | ChildEvidence / CoverageObservation | verified result link, declared child/evidence UUID or preallocated new evidence UUID, reviewed manifest reference | Original child definition/reopen and coverage set frozen in inputs; observation cannot bless stale child work or widen set. |
    | TerminalObservation | settled-success or settled-no-effect enum and references to earlier receipts/evidence within fixed observation budget | No arbitrary text-authority, self-reference, new effects or automatic retry. Closing requires full prior output proof. Uncertainty uses a bounded nonterminal observation and keeps Pending/Uncertain blocking; it cannot consume a terminal slot. |

    Store adapter validates concrete values against slot types/budgets/owner provenance and exact intent, then recomputes predicates against old and candidate graphs. Same-object writes have no blanket exemption. Fields outside the fixed projection, wrong identity, excess cardinality or owner-reference mismatch refuse. Lifecycle actual after-images are bound by the sole common C, not by epic K1. Common provisional effects and final C remain governed by its signed preparation protocol; the epic consumer accepts that result only through the common hook/receipt. A hook unable to express bounded typed observations is an unprovided prerequisite, not permission to create another publisher.

    ## 3. Acyclic checked receipts, fault and recovery semantics

    Preallocate transaction/action UUID, pin committed input snapshot and exact candidate payload/history for each STORE-ONLY transaction. Checked writer returns `CommitReceipt { transaction_uuid, intent_or_transition_digest, committed_tree_oid, committed_commit_oid, exact_payload_digest }` only after required file-sync/atomic replacement/directory-sync, stage/commit/ref durability and exact committed readback. This is a proposed contract at the common writer seam, not a new authority schema. No object in that commit embeds its own commit/tree receipt. Receipt delivery can fail without changing the committed result.

    Persistent references are backward only: K1 can reference K0/R0, K2 can reference K1/R1 and K0/R0. Owner C references already committed R0, and later epic observations reference that C; C never depends on future K1. A returned K2 receipt is not inserted into K2; any later audit refers backward from K3. References include repo/store identity, commit/tree and exact payload/UUID digest; missing/mismatched/cyclic links refuse. Existing common receipt must be verified through its owner, not trusted because an arbitrary canonical string names it.

    Lost receipt after any commit: exact committed readback by transaction UUID AND payload digest identifies the unique committed result and reconstructs the return receipt. Multiple/mismatched UUID instances, missing object/commit, uncertain durability or history outside validated lineage blocks. It never replays external effect or repeats common setup/release. Eligibility is freshly revalidated after readback; possession of an old receipt is not current admission permission.

    Pending commit must be durable before an effect; preparation stage/commit/sync/readback failure permits zero effects. After actual result, commit all required concrete evidence/status outputs K1 while retaining Pending. Partial output write failure preserves prior durable Pending; dirty/inconsistent state blocks even when an older clean snapshot exists. Only after verifying complete output receipt may K2 close the constraints reservation. Strict reads use validated committed snapshot/receipt graph, not partial live YAML or cache status. Missing output/terminal reference cannot grant Completed/Landed/clear. Result classes remain Committed, NoEffectFailure and UncertainEffect. NoEffectFailure requires definite original-owner evidence, not timeout or a transient unmerged query. Uncertain never expires into permission.

    Recovery may finish SAME-action store projections of verified owner outcomes, within original slots and budgets; it may not replace a process, replay request, recover a vendor release or allocate wider outputs. If original observation cannot be verified, preserve Pending/Uncertain and report. Terminal observations obey identical typed-slot/backward-reference checks and cannot authorize a retry.

    ## 4. Ordinary/Isolated predicates and expected external advance

    Keep `ResolvedIsolation = Ordinary | Isolated(epic_uuid,generation_uuid)`. Reserve subjects, both-direction ancestor closure/edge digest, relevant declaration ABSENCE/values, sticky generation membership, descendant/coverage set, repo/default identity/ref and required tip SHA, child definition/reopen/evidence and review inputs. Store metadata constraints journal is denial/serialization plus owner-result references, not issuance. Unknown schema/old-writer erasure refuses.

    All cooperative writers, including common after-images and sync/import adoption, evaluate old AND exact candidate graphs against active peer Pending/Uncertain predicates. Conservative all-reservation evaluation is valid; caller affected IDs/old member overlap are not enough. New isolating ancestor, new descendant, default reinterpretation or reparent changes reserved predicates and refuses. Typed owner outputs cannot smuggle those graph changes.

    An authorized merge necessarily advances a ref. The pre-effect intent therefore declares one typed expected external transition: SAME immutable repository, SAME named target/default identity, exact old base/tip B -> result R supplied only by verified original forge response, with exact pinned source and selected merge method. R is a late result slot; B/branch/default identity are immutable inputs. Observation validation may account for that exact proved advance when comparing this action's ref-tip predicate; it does not rewrite intent/input digest or treat all changed tips as output. No arbitrary retarget, renamed default, changed repo, new source, descendant-of-R guess or unrelated peer advance is exempt. Unknown additional advance => Uncertain/revalidation, not synthetic success.

    Peer reservations are not ignored because this owner has a valid result. Admission of mutually conflicting branch/default effects must already serialize through the shared predicates; if a peer predicate would be invalidated, refuse the conflicting new admission. Unexpected external mutation remains the documented cooperative-boundary limit, and result verification can withhold credit, not undo a wrong merge. Review/CI/hold/authority remain owner gates, not frozen into permission by isolation Pending.

    ## 5. Explicit store transitions: declaration, observation, separate clear

    Three classes are distinct: (D) store-only declaration; (O) input-preserving result observation with the exact declared ref advance above; (L) separate verified-landed clear. Only D is within signed first-slice positives. O/L remain proposed full-design extensions requiring NEW review. Neither D nor L creates an admission reservation that reserves its own pre-transition context; both atomically validate peers and commit a store transition under one writer guard.

    ### D — store-only declare (exact S1/S2)

    Before: validated committed epic has no active isolation declaration; fresh generation UUID and non-default validated target proposed; complete relevant ordinary/isolated in-flight inventory and all peer reservations known. Under writer guard compute exact candidate declaration + sticky membership/history; check every peer against old/candidate graph, and prove no unfenced running ordinary effect. Unknown activity or peer conflict refuses. Pure stale plans grant no permission and must re-resolve later.

    Initiator predicate expressly permits this one Ordinary-to-Isolated store transition, with only declared epic/generation/membership/history fields changed and authority checked under existing policy. It does NOT reserve its own Ordinary absence first. Preallocate transaction UUID and exact candidate digest; checked commit returns acyclic receipt. After: same scope is isolated canonically, read/selection truthfully excludes main-line action; no lease/queue/worktree/grant/vendor/PR effects. Failed/partial commit reports blocked, not declaration success. Peer histories/reservations retained.

    ### O — settle landing observation before any clear

    Validate original child freshness, immutable coverage chain, exact reviewed source/base/set and actual owner result. Bind late observations into K1 with Pending retained, then K2 closes only this action's reservation after complete checked output receipt. O NEVER clears active declaration. Required status credit is based on C coverage validator, not on closing reservation. Ref/result observation may account for exact expected B->R above; graph/default identity and covered-set predicates stay unchanged.

    After K2, the old action is settled historical evidence, not Pending. Active declaration/sticky membership remains fully protective. New admitted work or reopened/new children may now occur under ordinary isolation rules; they will make L fail. This is no gap in main-line exclusion because declaration stays active between transactions.

    ### L — separate freshly validated verified-clear transaction (chosen contract)

    Acquire a NEW store-only writer window and read current validated committed snapshot. Preallocate distinct clear transaction UUID. Resolve original landing action's exact K0/K1/K2 backward receipts and actual immutable default result through the SAME coverage validator; require its terminal observation already committed and settled. An own action merely named in a request is never exempted; only its proved Closed historic observation is not counted as Pending, exactly like any other settled historical record. If its Pending/Uncertain survives anywhere, refuse.

    Require active declaration still same epic/generation/target/default identity; retained current member set exactly accounted for by valid current coverage, child definition/reopen fences, actual default reachability, and complete fresh in-flight inventory. ANY peer Pending/Uncertain, new child, reopened/changed acceptance, live or unlanded member between O and L blocks clear. All peer predicates are validated against BOTH old and clear candidate graph; a peer expecting isolation blocks the change even when child content is already landed. Do not drop peer reservations or use blanket “self-action” exceptions.

    Initiator transition predicate is specifically Active -> Landed history + no active declaration, ONLY for the same fully verified generation. Keep all sticky memberships, original evidence/coverage/predecessors and observation receipts; clear does not itself grant Completed or erase lineage. Candidate payload/digest includes only this transition and audit history, not unrelated status/queue effects. Existing permitted landing workflow authority required; no unlanded close, --force release or new actor entitlement.

    Commit atomically with checked receipt while guard still excludes declaration/graph/reopen/admission writers. After: current eligibility can be ordinary only under fresh rules, while retained generation prevents old evidence laundering. A writer winning before L's guard (new child/reopen/live admission) makes L refuse; a writer after successful L sees the committed Landed history and must obey lineage/reopen fences. Fault before verified receipt preserves active committed declaration or dirty/uncertain block; exact UUID readback distinguishes whether L actually committed. Retrying observation cannot repeat a forge action. No release-equivalent mutation is permitted outside this explicit verified transition.

    ## 6. Accepted coverage, forge and parent rules retained

    Coverage records remain versioned/UUID-based, original child definition/reopen evidence distinct from later landing. Explicit immutable predecessor evidence/coverage IDs reject missing/cyclic chains; title/patch-id cannot reconstruct proof. Independent exact final-diff/set review excludes reverted/omitted work. Body trailers, umbrella/review-covers links, new descendants, clone/clear/remap cannot expand the covered set. Every promotion path uses the same committed-snapshot validator; new squash SHA does not refresh old child work.

    Initial squash proof: reviewed base B ancestor of pinned source S; actual result first-parent/base equals B; result tree equals S tree; forge confirms exact repo/PR/source/base/result; authoritative default reachability additionally required for Completed. Missing known condition refuses the mode before request; uncertain actual result retains Done/Uncertain. No unspecified equivalent-patch/general merge-tree algorithm. Partial/intermediate-parent/closed-unmerged keeps isolation.

    Source pin is not atomic base/default pin. AIDA-cooperative scope remains explicit; all-raw-forge protection is not a new universal prerequisite. A mode needing unavailable atomic precondition refuses with zero request. Existing local branch lease TTL/RAII/slug is not fencing; ambiguous ownership/collision/expiry refuses, durable constraints continue. No cross-clone consensus implied. Option<BranchRef> parent stays None/no-sync for ordinary default absent/empty; actual positively identified default for off-default absent; same-target no-op. Shared targets are not auto-rebased/deleted.

    ## 7. Proposed paired witnesses — not run

    Preserve all v3 actual-handler/refusal/coverage/race tests. Add reservation_receipt_is_acyclic_and_clone_verifiable; late_common_identity_binds_only_declared_slots; forge_result_binds_without_rewriting_reserved_inputs; late_unexpected_field_or_identity_refuses; terminal_observation_cannot_self_reference_or_widen_slots. Pair actual future common/forge happy path with namespace/budget/owner mismatch negatives, and crash after K0/K1/K2 commit before receipt delivery: exact readback, retained Pending as applicable, zero automatic effect replay.

    Canonical_digest_projection_has_stable_golden_bytes covers map order, set ordering, null optionals, Unicode/control escaping, integer/no-float rejection and omitted/unknown fields; own digest/containing commit never enters projection. Checked_faults_keep_effects_zero_and_pending_retained injects add/commit/fsync/rename/dir-sync/readback at each phase, plus partial output snapshots and clone receipt validation.

    Declaration_commits_without_self_conflicting_absence: uncontended D succeeds once with no own Ordinary reservation; peer admission/new ancestry/import/common writer races refuse appropriate side. Verified_landing_then_clear_revalidates_current_inventory: settled O then clean L succeeds; peer Pending/new child/reopen/live work between them refuses; own genuinely settled observation does not deadlock clear; O leaves declaration active. Expected_default_advance_is_not_peer_reinterpretation pairs exact B->R bound result with changed ref/repo/default/source or unrelated peer tip refusal. Fault during L preserves generation/receipt history and never replays landing. Tests remain proposed private fixtures, no execution or positive-runtime claim.

    ## 8. Readiness and preservation

    Full output/clear design awaits NEW different advisor. Signed S1–S4 below remains exact; prerequisites still unprovided and implementation NOT READY. Future live/unlanded release fork alone does not block that signed protective design. No profile rewrite: V2 profile/gap plus V3 amendment is accepted accurate blocked contract; strong functional AC2 still lacks supported backend. No code/canonical/queue/PR/grant/hold/activation/merge writes, source ownership changes, external reserved-spec edits or operator questions. Only draft files; root relay later after shared-store recovery.

    ## Independently signed bounded protective design: S1–S4

    This is a finite technical first slice of the existing proposals, not a replacement spec or waiver of full acceptance. The matrix's discovery inventory and refusing boundaries are **ADVISOR SIGNOFF: APPROVED AS AMENDED** by these exact limits.

    **S1 — declaration and discovery only.** Permit a store-only canonical declaration transaction through the existing writer owner. Under its guard, read the validated committed preimage, prove complete relevant in-flight inventory, evaluate every peer reservation against old and exact candidate graphs, and commit declaration/sticky history together. No self-reservation of Ordinary absence for this purely store-local atomic transition. No queue/calibration/lease/worktree/grant/vendor/PR/forge effects belong to declaration. Unknown or unfenceable ordinary activity refuses. Existing admissions must serialize through the same domain; absence of their participation prevents positive declaration. Discovery/selection supports real ordinary and isolated-subtree positives and truthful excluded/unknown results.

    **S2 — acyclic checked store-only receipt.** Preallocate transaction UUID, pin input snapshot and exact candidate payload/history; do not include the resulting commit/tree hash in that payload. The checked adapter returns the actual immutable commit/tree receipt only after required durability and exact readback. A later observation may reference that prior receipt, never its own containing commit. Loss of the return is uncertain to the caller; reconcile the exact UUID/payload in committed history and revalidate current eligibility, never repeat an external effect. Dirty/incomplete state blocks affected admissions even when an older clean snapshot exists. Unsupported required hooks or durability fail before a success claim. No new authority ledger or hook bypass.

    **S3 — explicit unsupported mutations.** Refuse isolated setup/claim/queue/worktree/launch/PR/merge/completion, all clear/release-equivalent transitions and every positive path whose required owner adapter is unavailable. Ordinary effect paths cannot be exempted from absence reservation just to keep a positive test green; their actual support requires the same safe admission contract. This slice may limit its positives to store-only declaration and read/selection. No fake lifecycle success is required or counted. Refusal entrypoints must cover actual handlers/aliases, explicit IDs, force/resume, existing PRs and refreshed batch members.

    **S4 — delivery prerequisites, not present evidence.** Positive declaration is disabled until checked canonical persistence/strict committed reads, hook-safe Git where needed, candidate-before-install adoption, schema preservation and every relevant writer/admission domain are actually integrated and independently verified. Refuse unsupported old-writer/in-flight domains; a config claim is not proof of closure. Required proposed positives are uncontended declaration and ordinary/isolated selection, paired with declaration-vs-admission/new ancestry/new descendant/import/common-writer races and persistence failures. Run eventual tests in private HOME/repos with deterministic barriers; all tests remain proposed here. No current task is dispatched.

    F1's sole common owner and F3's peer predicates are approved design directions. The full output/clear extensions need findings 1–2 resolved. Missing future unlanded release does not block this bounded design. Full original 1481 AC4/5, positive 1482/1483 and whole-epic completion remain unfulfilled. Root's condition of full applicable signoff plus real dependency readiness remains intact.
