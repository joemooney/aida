title: Deterministic trace-coverage merge gate — provenance as constraint, not convention
description: |-
  Promote AIDA's headline guarantee (code traces to a live requirement) from a client-side, message-level courtesy check into a server-side, coverage-level, non-bypassable merge gate. Today the commit-msg hook validates the *message* grammar ([AI:tool] type(scope): desc (REQ-ID)) and AIDA_COMMIT_STRICT can hard-reject it — but four gaps remain, which together mean provenance is still trusted, not guaranteed:

  1. Format, not coverage — the hook checks the message parses, not that the *diff* carries // trace: comments (or traces to anything).
  2. Trailer, not validity — the (REQ-ID) is matched as a string; nothing verifies the id exists in the graph and is live, so an agent can hallucinate a plausible id and pass.
  3. Local hook, not server gate — it runs on the dev machine, is bypassable (git commit --no-verify), and does not run on the PR/merge in CI.
  4. Soft by default in dev — it warns rather than blocks (e.g. the 'presentation' commit d822b9c15 landed despite failing validation).

  This is the one external-critique that survives scrutiny and is on-thesis everywhere (the substrate-as-bouncer principle: when you need an invariant against a confident LLM, ship a programmatic gate, not a rule). It is a FOUNDATIONS item — no market expansion. Explicitly OUT OF SCOPE: RBAC/zero-trust MCP, deep HW/SW DAG topology, compliance reporting (those are regulated-market costs we are not paying on spec).

  Builds on existing machinery: the (SPEC-ID) trailer parser, the merge-gate concept, the aida pull auto-bump scan, the graph lookup, and the TASK-488 mechanical-commit exemption.

  ## Acceptance
  - A non-bypassable CI check on PRs/merge that validates provenance against the live graph (not just message grammar).
  - Hallucinated / dead SPEC-ID references fail the check.
  - Coverage (diff carries traces) is enforced or reported per a defined policy.
  - Mechanical/release/docs commits are exempt by an explicit, audited rule.
