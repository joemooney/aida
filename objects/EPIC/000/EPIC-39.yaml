title: 'Repositioning: AIDA as the human-governance layer for agent-driven development (ADR-4 execution)'
description: |-
  ## Mission

  Execute ADR-4: reposition AIDA from 'git-canonical typed spec graph' (substrate — commoditized by Beads/Gas Town with 18.7k-star distribution) to **the human-governance layer for agent-driven development** (approved requirements, role-gated autonomy, enforced code-to-spec traces, audit trail), interoperating with Beads rather than competing, with regulated/enterprise as the sharpest evaluated segment.

  ## Scope boundary (deliberate)

  IN: every story-telling artifact (vision specs, README, OVERVIEW, positioning corpus, demo deck, scaffolded templates); governance surfaces sharpened to headline status; Beads interop (import/export/bridge); substrate-race roadmap triage (re-justify or cut); regulated-segment scoping.
  OUT: rewriting the engine. The graph/store/orchestrator/trace/lifecycle machinery IS the governance product — it gets re-aimed and surfaced, not rebuilt. No rename/rebrand unless the operator separately decides one (open question on ADR-4).

  ## Slices

  Filed as child stories/spikes tagged parent:EPIC-39. Work proceeds on branch 'repositioning' (worktree at ~/ai/aida-repositioning), merging to main as a coherent cluster once the story holds together.

  ## Plan

  docs/plans/2026-06-12-repositioning-governance-layer.md (on the repositioning branch).
