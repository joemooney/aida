- id: 019e33b6-c0c7-7861-94f8-be1e28f31e1e
  author: joe
  content: |-
    ## Scope shrunk 2026-05-16 — start with shelving-on-failure only

    User pushed back on over-engineering. The original EPIC scope (5 sub-STORYs: formal \`depends-on\` relationship type, dependency inference from trace graph, shelving mechanism, dependency-aware batch drain, patch-release integration) is **months of work** before any of it ships value.

    **Revised first-vertical scope**:

    Single sub-STORY: \"shelve-on-failure mechanism\" only. Specs:
    - Failed specs (any phase failure under \`--auto-complete\`) flip to a new \`NeedsAttention\` status with a reason category
    - \`aida queue list --needs-attention\` shows them
    - \`aida queue unshelve <SPEC>\` re-queues at Approved
    - Composes with STORY-263's \`--no-human\` punt-on-ambiguity (per earlier EPIC-28 comment)

    **Deferred** to subsequent EPIC-28 STORYs (file when needed):
    - Formal \`depends-on\` relationship type (postponed — manual sequencing works fine for now)
    - Dependency inference from trace graph (yagni until users actually trip on file conflicts during drains)
    - Patch-release integration (`make release-patch` after each spec — this is itself overhead; do it manually for now)

    Ships the meaningful 30% of EPIC-28 in 2-3 days; defers the rest until proven needed.
