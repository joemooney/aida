spec_id: EPIC-17
title: Documentation review/consolidate/archive + aida-desktop extraction
description: |-
  Single-session sweep that pruned dead surface area and brought all docs in line with the post-EPIC-1-001 architecture.

  ## Workspace prune

  aida-desktop (43k LOC, 6 commits in 6mo — abandoned) + aida-web (WASM port that depended on aida-desktop) extracted to /home/joe/ai/aida-desktop with full git history preserved via git-filter-repo. Workspace shrank from 7 → 5 crates (aida-core, aida-cli, aida-crate, aida-server, aida-generate-types).

  ## Doc archive

  22 stale planning/design docs moved to docs/archive/ with a README explaining what's there and why:
  - Root-level cruft: FINAL_RECOMMENDATION, FINAL_STATUS, IMPLEMENTATION_PLAN, PLAN, INTEGRATION_* (six variants), SIMPLIFIED_INTEGRATION, SPEC_ID_AS_ALTERNATE_KEY, SPEC_ID_IMPLEMENTATION_COMPLETE, UUID_SPEC_ID_VERIFICATION
  - docs/ stale designs: AI_INTEGRATION_DESIGN, EXTERNAL_INTEGRATION_ARCHITECTURE, RELATIONSHIP_DESIGN, SPRINT_EPIC_DESIGN, PROJECT_EVALUATION_2026-02-28, unified-gui-plan, unified-storage-architecture
  - DEVELOPER_GUIDE.md/.html (1389 lines, mostly about the removed desktop)

  Project root: 17 → 4 markdown files (CLAUDE.md, OVERVIEW.md, PROMPT_HISTORY.md, README.md). docs/ down 24 → 9.

  ## Doc rewrites

  - README.md: rewritten around the agent-collaboration pitch (was leading with \"5 Storage Modes\" — misleading post-EPIC-1-001)
  - CLAUDE.md: surgery from 352 → 163 lines; removed wall-of-text dashboard view dump; condensed 21-skill listing
  - docs/storage-modes.md: full rewrite around git-canonical default
  - docs/admin-guide.md: storage section rewritten
  - docs/getting-started.md: aligned with new defaults
  - docs/user-guide.md: removed ~91-line Desktop App section
  - docs/multi-user-setup.md: reframed PostgreSQL as opt-in feature flag
  - ~/.claude/CLAUDE.md (global): rewritten to be AIDA-aware (no separate REQUIREMENTS.md when AIDA exists)

  ## scripts/install.sh + Makefile cleanup

  - New scripts/install.sh for end-user install (curl + tar to ~/.local/bin)
  - Makefile: dropped gui/web targets that referenced removed crates
  - Dockerfile + docker/Dockerfile.server: COPY lists fixed (were broken since the prune)
