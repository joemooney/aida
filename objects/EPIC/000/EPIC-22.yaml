  content: |-
    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: Cross-project primitives (registry, cross-project queue/rel/search) are unimplemented (no `aida projects` subcommand) and the originating need was the aida↔aida-tutor pair. Is the multi-project use case still live enough to justify this EPIC during a bugs→stability phase?
      a) Reject — single-project + the global queue (`aida queue add --global`) covers solo use; the ~/.aida/projects.toml shortcut documents the boundary without code, and the multi-project demand hasn't grown.
      b) Keep parked; revisit only if/when a real multi-repo workspace (beyond aida↔aida-tutor) creates recurring manual-sync pain.
      c) Build only STORY-74 (registry foundation) as the cheap enabling primitive and defer the rest.
      REC: b — no evidence the cross-project pain is recurring enough to fund a new primitive now, and it cuts against the stability-first phase; keep the EPIC parked with a clear revisit trigger rather than building speculatively.
