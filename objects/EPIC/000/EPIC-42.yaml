  content: 'SEAT-LEAK observed (operator-caught 2026-06-14): ''aida human'' surfaced STORY-597 — an UNGROOMED draft — on the OPERATOR''s list under ''awaiting advisor grooming/approval''. But grooming (cross-spec reconciliation: it overlapped the now-Completed STORY-603, had a stale merged-branch ref, and part was already built) requires advisor knowledge the operator can''t derive from the spec. Surfacing ungroomed drafts to the operator shifts ADVISOR labor onto them. The fix EPIC-42 should encode: ungroomed drafts route to ''aida advisor'' (grooming worklist); ''aida human'' shows ONLY the post-grooming residual that needs operator-specific judgment (strategic/keystone/priority). TASK-807 (relabel) and TASK-808 (umbrella-only-if-actionable) are partial; the ungroomed-draft bucket is the remaining leak.'
