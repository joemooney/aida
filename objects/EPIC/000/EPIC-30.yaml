  content: |-
    ## Moved to backlog 2026-05-16 — yak-shaving risk

    User asked dialog to push back on over-engineering. Honest assessment: the persistent-daemon architecture (Unix sockets, REQUEST items, state files, signal handling, crash recovery) is **3+ months of infrastructure for a problem an 80-line bash loop already solves**:

    \`\`\`bash
    while true; do
        aida queue work next --auto-complete --no-human || break
        sleep 30
    done
    \`\`\`

    Once STORY-263 (\`--no-human\`) and TASK-292/293 (\`next\` keyword) ship, that loop IS the worker. Pause = Ctrl+C. Resume = re-run. The 90% case is covered.

    **Revisit triggers** (when to promote back to Approved):
    - The bash-loop pattern reveals concrete inadequacies in real use
    - Multi-machine workflow becomes important (worker on machine A, advisor on machine B)
    - User wants programmatic control plane that signals can't satisfy
    - Telemetry from TASK-266 shows specific failure modes the bash loop can't recover from

    Until any of those: STAY HERE. Captured for posterity, not blocking the alpha critical path.
