title: Onboarding hardening — a fresh 'aida init' → first 'aida queue work' must be clean, safe, and project-scoped
description: |-
  Umbrella for the first-run failures surfaced by a real new-project dogfood (2026-06-05). A user who runs 'aida init' then the natural next action 'aida queue work' currently hits a chain of papercuts and footguns. Goal: the fresh-init → first-pickup path is boring and correct.

  Members (filed this session): BUG-445 (seeded 'commit scaffolding' first-task is uncompletable + dangerous under queue-work worktree isolation), BUG-446 (init has no guard against initializing over a workspace-of-projects), BUG-447 (queue-work session-resume bleeds a deleted/other project's TASK-007 session in — global ~/.claude/projects scan, no project scoping). Root-cause-coupled: TASK-631 (init should commit its own scaffolding — fixes BUG-445's root). Candidates to fold in: BUG-433, TASK-450, TASK-1-097.

  Drain together via 'aida queue work --batch onboarding-hardening'.
