    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: Both current members (BUG-449, TASK-673) are Completed. Do we close EPIC-38 or commission the proposed audit of all mutating MCP tools (update_requirement done; add_relationship/add_comment/punt/… unaudited) for missing authority/lifecycle gates?
      a) Commission the full audit now as a child task — substrate-as-bouncer invariant must hold at EVERY MCP surface, not just the two fixed so far.
      b) Close EPIC-38 as drained; file individual bugs reactively if a specific MCP tool is found bypassing a gate.
      REC: a — this is an active do-now epic and the gate is security-relevant (agent self-completion on uncommitted code was the BUG-449 failure mode); a single bounded audit of the remaining mutating tools is cheaper than per-incident discovery. The open decision (audit vs close) is why this is human.
