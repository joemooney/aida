decision_request:
  question: GitLab-forge parity is gated on gitlab.joemooney.com being operational. Is GitLab a near-term target now?
  choices:
  - label: Start the Slice-0 SPIKE now
    consequence: inventory gh coupling + prove an MR round-trip
    resolution: spike
  - label: Ship only the free pure-git/none provider (STORY-621)
    consequence: any non-GitHub origin works today, defer the MR-drain SPIKE
    resolution: pure-git only
  - label: Fully defer
    consequence: no GitLab work until stabilization clears
    resolution: defer
  recommended: 1
  rationale: The pure-git provider makes the vendor-neutral claim partly true with low blast radius now; the full MR-drain SPIKE only pays off once you're actually driving on GitLab.
  asked_at: 2026-07-13T07:05:05.801390644Z
