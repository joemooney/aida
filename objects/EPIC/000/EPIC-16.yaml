id: 019dea8d-c189-72e3-a27f-ea562a6ff148
spec_id: EPIC-16
title: Git-canonical storage with SQLite cache view
description: |-
  Collapse AIDA's four storage backends (YAML, SQLite, PostgreSQL, Git-orphan-branch) into a single canonical model: the git orphan store is the source of truth, SQLite is a derived, rebuildable read cache for query performance, YAML is an export artifact, and PostgreSQL becomes an opt-in plugin.

  ## Motivation

  Maintaining four equivalent backends is unsustainable solo and dilutes AIDA's defensible niche (durable, agent-readable, distributed specs). The git orphan branch is the only backend that simultaneously supports all of: agent-readable (YAML files), durable (git history), distributed (HLC + agreed IDs + merge-gate), and code-adjacent (lives in the project repo).

  ## Target Architecture

  - Git orphan branch (aida-store/) — canonical writer of record
  - SQLite (requirements.db) — rebuildable read cache for web UI / search / analytics; not authoritative
  - YAML (requirements.yaml) — export artifact via pre-commit hook; not a runtime backend
  - PostgreSQL — opt-in via aida-backend-postgres plugin crate; for teams wanting shared server-backed view

  ## Phasing

  - Phase 0: Design doc + this epic (docs/plans/2026-05-02-git-canonical-storage.md)
  - Phase 1: aida cache rebuild command (read-only, no behavior change — validates the model)
  - Phase 2: Switch write path in distributed mode — writes go to git first, then cache update
  - Phase 3: Migration tool for existing SQLite-canonical projects; dogfood on AIDA itself
  - Phase 4: Deprecate standalone YAML/SQLite (warning, then remove); extract Postgres to plugin

  ## Success criteria

  1. AIDA itself runs in git-canonical mode with SQLite cache rebuilt from git
  2. cargo check --workspace passes after each phase
  3. Web UI query latency unchanged or better
  4. One round-trip: aida edit -> git commit on aida-store -> SQLite cache updated -> web UI sees change
