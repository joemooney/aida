spec_id: EPIC-71
agreed_id: EPIC-71
title: 'Cost observability: make token spend a queryable dimension attributable to spec, round, phase, seat and vendor'
description: |
  Operator request 2026-09-19: know the cost of everything we can, so expenditure can be optimised later.

  What already exists, measured rather than assumed:
  - TASK-967 (completed) writes token accounting at DRAIN EXIT into ~/.aida/usage.jsonl. Of 267,541 usage records, 92 carry token fields — and 57 to 58 of those 92 record cumulative_tokens: 0 and tokens_per_spec: 0. So the capture is coarse (one record per drain exit) and silently zero most of the time.
  - Real numbers do appear in drain stdout: "tokens: 23,155,720 cumulative, ~2,894,465/spec". That is roughly 2.9M tokens per spec shipped.
  - Per-MESSAGE usage already exists upstream for both vendors and is simply never collected: Claude Code session transcripts carry {"usage":{"input_tokens","cache_creation_input_tokens","cache_read_input_tokens","output_tokens","output_tokens_details":{"thinking_tokens"}}} per assistant message, and Codex keeps session files under ~/.codex/sessions.

  Why this matters now, from the 2026-09-18/19 failure analysis: 40 shelved rounds across 19 specs, one spec taking five rounds. At ~2.9M tokens per spec, the REWORK TAIL is plausibly the dominant cost line, not the base implementation. Today nobody can say that with a number, which is exactly the gap.

  The cheapest lever is also unmeasured: in a sampled assistant message, input_tokens was 2 while cache_read_input_tokens was 868,439. Cache reads are roughly a tenth the price of fresh input, so cache-hit ratio likely dominates unit cost — and no surface reports it.

  Epic goal: make cost a first-class, queryable dimension of the substrate, attributable to the things worth optimising — per spec, per round, per phase, per seat, per vendor — with a cache-efficiency view, and priced by a maintained rate table rather than hard-coded numbers.

  Slices (each shippable):
  1. SPIKE: audit the existing capture (why are most records zero), and survey reusable prior art rather than inventing — vendor usage APIs, the OpenTelemetry GenAI semantic conventions, existing Claude Code usage analysers, and published price/token maps. Deliverable is a dated report naming what to reuse and what to build.
  2. Collect at message granularity for both vendors from the artefacts that already exist, correlated to spec / phase / seat / run.
  3. Expose it: usage views by spec, round, phase, seat and vendor, with cache-hit ratio and a prices table that is data, not code.
  4. The derived numbers that change behaviour: cost per MERGED spec, and cost of the rework tail as a share of total — the figure that tells us whether the review round-trip or the implementation is the expensive part.

  Non-goals: per-request billing reconciliation with a vendor invoice; real-time budget enforcement (a later epic if the numbers justify it).
