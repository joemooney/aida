spec_id: EPIC-14
title: aida status (project overview) + aida statusline (one-liner for prompts)
description: |-
  Two related top-level commands.

  ## aida status

  Comprehensive project overview — adaptive based on context.

  Always-shown sections:
  - Project name + storage mode
  - Requirement counts grouped by status
  - Cache state (FRESH/STALE, last built, count vs store)
  - Sync state (orphan-branch ahead/behind origin)
  - Recent activity (last 5 modifications)
  - Scaffolding freshness (compares .claude/skills/, .mcp.json, etc. against embedded templates) — only for non-AIDA-self projects

  AIDA-self extra section (when run in the joemooney/aida repo):
  - Workspace version vs latest release tag, commits ahead
  - Template symlink integrity (23/23 OK)
  - Cargo.lock presence
  - Pointers to scripts/release.sh + scripts/publish.sh

  ## aida statusline

  Sub-50ms one-liner for ~/.claude/settings.json statusLine.command or shell PS1. Reads .aida/cache.db directly (read-only sqlite handle, no rebuild, no git ops).

  Format: aida · <project> · role:<name> · @<spec_id> · reqs:N · cache:fresh|stale

  Where role + @<spec_id> only appear when AIDA_SESSION_ROLE is set; @<spec_id> shows the most recent activity from the active role's log.

  ## Acceptance

  - aida status from non-AIDA project: 6-section overview, no dev context
  - aida status from AIDA repo: extra dev-context section with build banner + tag info
  - aida statusline: <50ms, single line, omits empty sections
