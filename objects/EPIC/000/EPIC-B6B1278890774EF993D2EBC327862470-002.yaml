  content: |
    Operator clarification, 2026-10-29: add a top-level Metrics tab and cover the full What is AIDA overview. The product includes people as developers, reviewers and collaborators. Its entry path is continuing normal conversational work with an agent while AIDA preserves requirements, decisions and implementation intent in the background. The lasting outputs are the working system and a durable intent record for maintenance, enhancement and collaboration. Full factory/autonomous delivery is optional, not a prerequisite for adoption. Implementing this clarification in docs/what-is-aida.md, its standalone HTML, the homepage/onboarding/workflow/brief and a new Metrics page. Reporting capabilities and coverage gaps stay explicit; historical numbers are dated, not displayed as live metrics.
