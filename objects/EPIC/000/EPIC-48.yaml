title: Coordinating Multi-Vendor AI Agent Fleets (research project)
description: |-
  Research project: extract and defend a theory of multi-vendor AI agent fleet coordination from the design and dogfooding of AIDA.

  Working draft basis: docs/research/2026-06-16-coordinating-multi-vendor-agent-fleets.md

  FRAME
  The artifact (AIDA) is the contribution; knowledge claims are design principles extracted from building it, organized as a coordination stack (L0 model capability up to L5 cross-vendor fleet coordination). Central research question: as model vendors absorb the lower layers, where does durable value accrue for a large organization? Bet: the apex (L5), because the cross-vendor coordination gap is incentive-persistent, not capability-bound.

  EIGHT PROPOSITIONS (see draft for full statements + evidence grades)
  P1 substrate-as-bouncer, P2 intent-as-durable-layer, P3 substrate-bounded autonomy, P4 conflict-light git state, P5 calibration over accuracy, P6 punt-and-continue role cascade, P7 trojan-horse surface, P8 incentive-persistent cross-vendor gap.

  CHILDREN TO FILE AS THE WORK PROCEEDS (not yet filed)
  - Red-team each load-bearing proposition (P3, P8 first); fold strongest objections into the draft.
  - Run any of the five ablations named in the draft section 10 (gate-vs-rule, substrate-richness, calibration longitudinal, cross-vendor portability, multi-team field study).
  - Refresh dated market snapshots feeding P8 (immutable, dated).
  - Develop the related-work section into real citations.

  STATUS: research / living document. Not a product deliverable; revise as collaborators challenge the propositions and as real data arrives.
