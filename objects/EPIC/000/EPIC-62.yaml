  author: joe
  content: 'CROSS-VENDOR MANDATE (operator, 2026-09-11): this reliability mechanism MUST work on Codex AND Claude (tier-1, both required), with Antigravity as tier-2 (future). Maps onto AIDA''s layering: detection/coordination read the vendor-NEUTRAL substrate (git-canonical record, events.jsonl, leases); only EXECUTION (activity signal, wake, re-drive launch) is vendor-specific and MUST go behind one adapter seam (the vendor-at-exec-layer principle — never vendor logic in coordination). Constraint on every child: the supervisor (STORY-1051), the watchdog, and idle detection (STORY-998) consume a per-vendor activity/liveness adapter, not vendor-specific code inline. Tier-1 (Claude stream-json + Codex --json/rollout, BUG-909) ships; tier-2 (Antigravity agy --output-format stream-json) is a stub adapter, wired but not validated. Enabling spec: the vendor activity/liveness adapter (filed as a child).'
