    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input.
    Q1: The foundational surface shipped (`aida doc` add/show + docs-tree projection), but the EPIC's larger vision (auto tutorial generation, book-chapter composition, diff-driven doc prompts) is unbuilt and several child edges are dangling/removed. Close as substantially-delivered or keep driving the vision?
      a) Close the EPIC as substantially delivered; re-file any still-wanted projection features as fresh standalone stories.
      b) Keep open and prioritize the auto-tutorial/book-projection children (heavy, prose-generation-adjacent work).
      c) Keep open but parked behind the stability phase; only the proactive-capture children (prompt for WHY at checkpoints) get revisited.
      REC: a — the load-bearing primitive (`aida doc`) exists and is in use; an open umbrella EPIC with dangling children is graph noise. Re-file the specific projection features that still have a champion as bounded specs.
