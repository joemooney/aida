title: 'Config-overridable glyph system: registry + ASCII profile + custom override table'
description: |-
  AIDA's CLI output leans heavily on unicode/emoji glyphs (~2568 inline literal sites across aida-cli; NO central registry). Some terminals cannot render all of them — e.g. Windows ConEmu drops several. Give users an OPT-IN way to switch to ASCII or custom glyphs WITHOUT stripping the emoji defaults (the emoji are deliberate; capable terminals keep them).

  Operator decision (Joe, 2026-06-15): build BOTH phases, opt-in default (unicode stays the default; nothing auto-downgrades).

  Because a glyph-rendering limitation is a per-MACHINE / per-terminal property (not per-project), the selector must be settable globally + per-shell, not just per-repo. Resolution order: AIDA_GLYPHS env (per shell) > project .aida/config.toml [ui] glyphs > user ~/.aida/config.toml [ui] glyphs > default unicode. The custom [glyphs] override table layers the same way (project over user).

  PHASES (children):
  1. Glyph registry + curated ASCII profile + [ui] glyphs selector (opt-in). The valuable slice.
  2. [glyphs] custom per-symbol override table layered on the registry.
  3. Migrate the long tail of raw glyph literals + a CI lint that blocks NEW raw literals (coverage ratchet; substrate-as-bouncer).

  PRECONDITION: there is no glyph registry today and no terminal-capability/[ui] config precedent — both are introduced by phase 1. status_display.rs already has a small status->glyph map that seeds the registry pattern.
