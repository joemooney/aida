title: 'Release lifecycle as composite: documenter role + queueable release with auto-decomposed subtasks'
description: "User insight 2026-05-12: today's release flow is a one-shot script (`scripts/release.sh`). Recasting RELEASE as a first-class queueable composite — with auto-decomposed subtasks routed to appropriate roles — changes what \"release\" means in the project lifecycle. Crucially: documentation becomes a gating step at RELEASE time (not PR time), letting PRs ship fast while documentation catches up before users see the work.\n\n## Vision\n\n```\n$ aida release add v0.5.2 --type patch\n✓ Filed release v0.5.2 as a composite spec\n✓ Auto-decomposed into 5 subtasks:\n    RELEASE-12-doc       Document features since v0.5.1     [for:documenter]\n    RELEASE-12-test      Smoke-test release candidate        [for:reviewer]\n    RELEASE-12-build     Build release artifacts             [for:builder] (or auto)\n    RELEASE-12-changelog Generate changelog from req metadata [for:documenter]\n    RELEASE-12-tag       Cut tag + push                      [for:release-master]\n  \n  Release v0.5.2 completes when all 5 subtasks complete.\n  Subtasks routed; documenter, reviewer, release-master will see them in /aida-pickup.\n```\n\nThe release item is queueable (sits in /aida-pickup for whoever's role is release-master); its completion gates on subtasks; subtasks gate on each other (build before test, doc before tag).\n\n## New role: documenter\n\nSibling of implementer/reviewer/dialog/architect/triage. Picks up:\n- Doc tasks auto-filed after PR merges (EPIC-24's /aida-doc captures)\n- Release-doc subtasks (changelog, tutorial drafting)\n- Doc gap analysis (specs without doc entries)\n\nDocumenter's natural rhythm:\n- Slower than implementer (writing prose, not code)\n- Reactive to PR merges (last batch's work needs documentation)\n- Proactive before releases (gate ensures coverage)\n\n/aida-document slash command (sibling to /aida-pickup + /aida-review):\n- Walks recent PRs since last release\n- For each new feature: prompts user/agent for doc capture (uses EPIC-24's aida doc add)\n- Files RELEASE-N-doc subtask as Complete when coverage threshold met\n\n## Release subtask types\n\nBeyond docs:\n- **build**: cargo build --release on all platforms (CI artifact); auto-completable\n- **test**: smoke + integration test pass; auto-completable from CI\n- **changelog**: structured changelog from req metadata + doc entries; mostly auto\n- **tag**: actual git tag + push; release-master role\n- **announce** (optional): post-tag — Discord/Slack/email notification\n\nSubtask dependency graph:\n- build, test, doc can parallel\n- changelog requires doc\n- tag requires build + test + changelog\n- announce requires tag\n\n## Gating\n\nPR merges don't gate on documentation (preserve fast PR cadence). RELEASE gates on documentation. Reasonable middle ground: features ship to main quickly; users learn about them via the next release's tutorial/changelog.\n\n## Composes with\n\n- EPIC-24 (living documentation) — provides the doc-capture mechanics this consumes\n- EPIC-23 (session orchestration) — release subtasks become work items the orchestration engine can route + auto-spawn sessions for\n- Existing role system (EPIC-12) — adds documenter, release-master, builder as new role names\n- scripts/release.sh — eventually deprecated; replaced by `aida release tag` invoked by the release-master subtask\n\n## Non-goals\n\n- Replacing CI infrastructure (build/test subtasks delegate to CI; AIDA tracks completion not runs them)\n- Forcing every project to use this model (opt-in via project config)\n- Strict gating that blocks emergency hotfixes (release-master can mark subtasks force-completed)\n\n## Child stories (to be filed)\n\n1. RequirementType::Release + RoleType::Documenter — data model\n2. `aida release add <version> --type {patch|minor|major}` — composite filing\n3. Auto-decomposition templates per release type\n4. Subtask dependency graph + completion gating\n5. /aida-document skill\n6. Documenter queue routing + role-enter pickup\n7. Changelog generation from req metadata + doc entries\n8. Migration: existing scripts/release.sh → `aida release tag` subtask handler\n\n## Acceptance for the EPIC\n\nWhen mostly shipped, `aida release add v0.6.0 --type minor` files a release that walks itself through documentation, build, test, changelog, tag — driven by the appropriate roles, gated correctly, with a clean audit trail. Users on the project don't need to remember `scripts/release.sh minor` — they queue the release like any other work.\n"
