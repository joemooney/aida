    ## Children deferred post-alpha 2026-05-16

    User pushed back on over-engineering. EPIC-29's architectural split is RIGHT, but executing it now (~3-5 days of yak shaving) is premature for an alpha audience that won't notice. The 5 sub-STORYs (STORY-266..270) are moved to Draft status — captured but not queued.

    **Revisit trigger**: after alpha launches and stabilizes, OR when the in-monorepo TUI starts adding deep coupling into \`aida-cli\` internals (which it currently doesn't), or when a third-party shows interest in building an alternate visualization.

    EPIC-29 itself stays at Approved as a captured architectural commitment; just don't execute the children until post-alpha.
