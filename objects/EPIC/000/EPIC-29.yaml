  content: |-
    🔵 DECISION REQUEST (disposition sweep 2026-06-06) — needs human input. LINCHPIN for the whole EPIC-29 cluster (STORY-266/267/268/269/270).
    Q1: Split aida-tui into a standalone companion repo — proceed or reject?
      a) REJECT the split — keep aida-tui in the monorepo. Current strategy makes the TUI 'the product' (EPIC-26, shipped default-on since STORY-137); demoting it to a companion repo + removing the tui feature from aida-cli (STORY-268) directly contradicts that. Multi-repo coordination cost lands against the bugs-first phase.
      b) Proceed with the full 5-story split as specified
      c) Defer until post-stability and re-decide
      REC: a — strong tension with the shipped 'TUI is the product' positioning; reject the split. BUT salvage STORY-266 (define/freeze aida-core's public API) as standalone API-hygiene work — it's worth doing (TUI + MCP both consume aida-core) regardless of any split.
    Q2: If rejecting the split, what happens to STORY-266 (public-API audit/freeze)?
      a) Reject it with the epic
      b) Rescope as a decoupled 'document aida-core public API' hygiene TASK
      REC: b.
  created_at: 2026-06-06T08:18:48.215728601Z
