- id: 019e0f7a-bd5d-76c3-8783-f66ac34d8eb0
  author: joe
  content: Clarification on v1's race window — it only exists in the specific case of one user, one machine, two+ concurrent sessions sharing the same .aida-store via symlink. Cross-developer setups (separate machines or separate clones) have node-id isolation via AIDA's existing distributed model — disjoint blocks, no possible collision regardless of v1/v2. So v2 (STORY-47, sub-blocks) is a refinement for the narrow same-user-same-machine concurrent case, not a fix for a broader issue.
  created_at: 2026-05-10T01:22:42.653205499Z
  modified_at: 2026-05-10T01:22:42.653205499Z
