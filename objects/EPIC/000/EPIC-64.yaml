title: 'Guest/User stakeholder persona: external read + intake roles outside the build loop'
description: |-
  A NEW axis in the role model. Today's roles (advisor, implementer, oversight, product) are all INTERNAL build-loop seats that drive work and are effectively singletons. This epic adds an EXTERNAL stakeholder/consumer persona: someone outside the build loop who wants to UNDERSTAND the project and FEED it, not drive it. Unlike the work seats there can be MANY, and their authority is least-privilege (read + at most one write verb: file a request).

  Two tiers on a spectrum:
  - guest: read-only comprehension (why / list / status / graph tree / digest / search). No writes.
  - user: guest + open a request via add, constrained to change-request / bug / user types, landing as Draft, tagged intake:user, into the advisor groom queue. Cannot approve, queue, edit status, or merge.

  Why now: PRIN-3 names exactly this persona (the interested human browsing the capability map); it is the consumer end of the memory-lane on-ramp (EPIC-63) and the mail-intake bug-report flow; and least-privilege read+intake is a clean security posture (ties to STORY-495 permission work). Does NOT collide with the one-advisor/one-product lockdown (guest/user are not build seats).

  Slice 1 (the STORY): role identifiers + least-privilege permission gate + Draft-only intake tagging.
  Deferred followups (revisit after slice 1 proves out): a curated /aida-intro read surface; per-user identity in the intake tag; a hosted 'file a request' front door.
