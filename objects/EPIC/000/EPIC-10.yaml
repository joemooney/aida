spec_id: EPIC-10
title: 'CLI ergonomics: help triage, scaffolder JSON safety, warnings cleanup'
description: |-
  Smaller polish work that didn't fit the larger themes but materially improved UX.

  ## Help triage

  aida --help previously showed all 33 top-level commands. Now shows 11 daily-use ones (add/list/show/edit/del/search/comment/status/init/upgrade/help-all). The other 22 are #[clap(hide = true)] but still fully functional via direct invocation. New `aida help-all` lists everything in 9 topical groups (Daily use, Project lifecycle, Requirements graph, Configuration, Storage, Data exchange, Integrations, AIDA development, Misc).

  About text changed from \"A simple requirements management system\" to \"AI-native requirements management — durable, agent-readable specs\" matching the README pitch.

  ## Scaffolder JSON safety

  The scaffolder unconditionally prepended <!-- AIDA Generated: ... --> headers to all output files. JSON has no comment syntax — Claude Code rightly rejected .claude/settings.json as \"Invalid or malformed JSON\". Fixed: scaffolder detects .json extension and skips the header. check_file_status compares JSON files by raw content equality.

  ## Warnings cleanup

  Workspace warnings: 26 → 0. Deleted ~280 LOC of dead code:
  - 7 proto_to_* functions in aida-server/src/convert.rs (leftovers from the gRPC client that lived in the removed aida-desktop/aida-web crates)
  - parse_uuid (aida-cli, never used)
  - prompt_select_requirement / prompt_select_project (aida-cli/prompts.rs, never used)
  - export_backend_to_json / import_json_to_backend (aida-core/db/migration.rs, never used)
  - Several can_read / is_backend_loaded methods on aida-server

  Kept with #[allow(dead_code)] and explanatory comments for fields that are intentionally forward-compat (OidcConfig.issuer_url for OIDC discovery, AddCommentRequest.parent_comment_id for threading, etc.).

  ## Storage façade learns directory dispatch

  Storage::load() / queue_* / update_atomically all gained a directory-path branch that delegates to GitBackend. Lets handlers that take a Storage façade (queue, scaffold, etc.) work transparently in distributed mode instead of erroring with \"Failed to parse YAML: Is a directory\".
