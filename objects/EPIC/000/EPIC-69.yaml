  content: |-
    Prior-art composition (design note for grooming): `aida away` already exists as the operator-PRESENCE primitive (STORY-561 / TASK-748..783 — home/away state + TTL that the autonomy ladder keys on). So the MANDATE half of this epic partly exists. Recommendation: /aida-away does NOT reinvent presence — it COMPOSES with the existing away state (proxy authorization + scope layered on top of "operator is away"), and the genuinely-new build here is the LEDGER (STORY-1173) + the proxy authorization semantics + a separate audit surface. Fork 2 ("mandate: session skill vs durable grant") reframes to "how much does the proxy grant extend the existing presence record vs stand as its own object."

    Independence rule (load-bearing, carried from the proxy-reviewer memory): a proxy never reviews-and-merges code it implemented itself; high-blast-radius + not-convinced-from-the-diff escalates to the real human. The ledger's `independent` field defaults to absent/failing, never silently true — that is what makes the audit trustworthy.
