decision_request:
  question: The flow-cockpit vision (blocked/waiting board as TUI home) overlaps the EPIC-54 redesign that became the default TUI. One effort or two?
  choices:
  - label: Fold the remaining cockpit children into EPIC-54 as scopes/verbs, close EPIC-53
    consequence: one coherent surface
    resolution: fold
  - label: Keep EPIC-53 distinct
    consequence: home-view concern orthogonal to the palette redesign
    resolution: keep separate
  recommended: 0
  rationale: Two open TUI epics competing for the same default surface risks divergent models; the blocked-board belongs as a scope inside the redesign shell.
