spec_id: EPIC-40
agreed_id: EPIC-40
title: 'Comprehensive CLI reference manual: rationale (when/why/when-not) for every command + a lifecycle narrative spine, drift-guarded'
description: |-
  ## Goal (operator, 2026-06-12)

  `aida <cmd> --help` says WHAT each command does; users need a manual that says WHEN and WHY — when to reach for each command/option, when NOT to (and what to use instead), woven into a story that educates users about the whole lifecycle and what to expect. lifecycle.md is the seed; this is far more comprehensive.

  ## Architecture (the key decision — avoid a drift liability)

  HYBRID, not a hand-typed monolith:
  - STRUCTURE mirrors `aida help-all` — the 11 thematic chapter-groups the binary already maintains, so the manual and tool never disagree on WHICH commands exist.
  - The manual owns RATIONALE; `--help` owns FACTS. We do NOT reproduce full flag lists/defaults (that guarantees drift) — only options whose rationale isn't obvious.
  - A NARRATIVE SPINE (the journey: init→capture→approve→queue→pickup→plan→build/trace→done→review→merge→complete→release→archive) links to per-command reference entries.
  - DRIFT-GUARD: a completeness gate asserts every `help-all` command has a manual entry, and flags entries whose `--help` changed since last touched. The manual may lag on prose; it cannot silently OMIT a command.

  ## Per-command entry shape (the template, set by the exemplar)

  One-line · Mental model · Reach for it when · Don't reach for it when (+ alternative) · Key options (rationale only) · Gotchas · Chains with.

  ## Delivered this turn (the exemplar + scaffold, branch cli-manual)

  - docs/cli/README.md — index + the lifecycle journey spine + how-to-read.
  - docs/cli/01-getting-started.md — Chapter 1 (init/add/list/show/done/edit) at full depth = the quality bar all chapters match.

  ## Slices (children, one per help-all chapter + spine + drift-guard)

  parent:EPIC — chapters 2-11 (one slice each), plus a drift-guard slice (the completeness gate) and a spine-polish slice. Fan-out-able: each chapter is independent once the template is fixed.

  ## Plan

  docs/plans/2026-06-12-cli-reference-manual.md (branch cli-manual).
