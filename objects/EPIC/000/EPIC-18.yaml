title: 'Dev workflow: activate, serve, release, patch + aida shell wrapper'
description: |-
  Pyenv-style developer toolkit for working ON aida itself.

  ## Surfaces

  - aida dev activate / deactivate — eval-pattern PATH manipulation; activates the in-repo target/{release|debug}/aida as the active binary
  - aida dev serve — foreground supervisor for aida-server + vite, SIGINT-aware, prefixed log streams
  - aida dev shell-init [--install] — emits the aida() shell wrapper; --install writes to ~/.aida/shell-init.sh and stubs ~/.bashrc with a 5-line source line
  - aida dev release [bump] / aida dev patch — one-command release: bumps version, tags, pushes, polls GitHub Actions for tarballs, then upgrades sibling installs via aida upgrade --yes
  - aida() shell wrapper — replaces per-command helpers (aida-on, aida-off, aida-role, aida-role-end). Auto-eval's eval-only subcommands (dev activate, role enter, etc.) when run interactively. Bypass with `command aida ...`.

  ## Acceptance

  - aida dev activate from any directory finds the dev binary via $AIDA_DEV_REPO, prefixes shell prompt with (aida-debug)/(aida-release)
  - aida dev patch ships a release end-to-end without manual intervention
  - aida() wrapper Just Works for `aida role enter <x>` and `aida dev activate` interactively
  - shell-init file under 30 lines; ~/.bashrc footprint is exactly 3 lines (source stub)
