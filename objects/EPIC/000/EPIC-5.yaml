id: 7622e213-28e8-4401-970e-a55111e7fc2f
spec_id: EPIC-5
title: 'My Queue: Personal Focus Inbox'
description: |-
  My Queue: Personal Focus Inbox

  A personal, ordered focus list that is orthogonal to sprints, priorities, and status. Sprints define what the team committed to this iteration. Priorities define global importance. My Queue defines what a specific user is working on right now, in their chosen order.

  **Core Concept:**
  - Each user has a personal queue — an ordered list of requirements they want to focus on
  - Users control the ordering (drag-to-reorder / move up/down)
  - Others (managers, leads, teammates) can push items into a user's queue
  - The queue is an inbox: others can add, only you can reorder and remove
  - Queue is lightweight and ephemeral — items flow in and out daily, not a second priority system
  - Completed items auto-filter out by default

  **Key Differentiators from Other Views:**
  - **vs. Sprint**: Sprint is team commitment for a time period; queue is personal daily focus
  - **vs. Priority**: Priority is a global attribute; queue position is personal and contextual
  - **vs. Owner**: Owning 30 items doesn't mean focusing on all 30; queue is the active subset
  - **vs. Status**: Status tracks workflow state; queue tracks attention

  **Capabilities:**
  1. Server-side storage (database, not local files) for cross-device sync
  2. REST API endpoints for programmatic access
  3. CLI commands for scripting and automation
  4. React web UI with drag-to-reorder
  5. Manager/lead can assign items to another user's queue
  6. Queue visible on Dashboard as a focus widget
  7. Notification when items are added to your queue by others
  8. Drag requirements from List/Board views directly onto My Queue in the sidebar

  ---

  ## Usage

  ### Web UI
  - **My Queue view**: Click "My Queue" in the sidebar to see your ordered focus list
  - **Add to queue**: In List View or detail panel header, click the "Add to Queue" action on any requirement (top or bottom)
  - **Drag to queue**: Drag a requirement row from List View and drop it onto "My Queue" in the sidebar to add it
  - **Reorder**: Drag-and-drop items within the My Queue view to change focus order
  - **Remove**: Click the remove button on any item in the queue
  - **Dashboard widget**: Shows your top queue items with a "View All" link to the full queue

  ### CLI
  ```
  aida queue list [--user <handle>]                     # Show queue (default: current user)
  aida queue add <SPEC-ID> [--top|--bottom] [--note ""] # Add item to queue
  aida queue remove <SPEC-ID>                           # Remove from queue
  aida queue move <SPEC-ID> --top                       # Move to top
  aida queue move <SPEC-ID> --before <SPEC-ID>          # Move before another item
  aida queue clear [--completed]                        # Clear queue or just completed items
  ```

  ### REST API
  ```
  GET    /api/v2/queue/:user_id            — List queue entries (sorted by position)
  POST   /api/v2/queue/:user_id            — Add item { requirement_id, position? }
  DELETE /api/v2/queue/:user_id/:req_id    — Remove item from queue
  PATCH  /api/v2/queue/:user_id/:req_id    — Update position
  POST   /api/v2/queue/:user_id/reorder    — Bulk reorder { items: [{ requirement_id, position }] }
  ```
