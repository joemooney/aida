id: 019df46f-23d7-7853-bd39-0d01cb5ed3ea
spec_id: EPIC-15
title: 'Scaffold upgrade workflow: template/seed/managed-merge file categories'
description: |-
  Today `aida scaffold` treats all scaffolded files identically (whole-file checksum + apply-or-skip). In practice they fall into three categories with different ownership semantics:

  - **template** (e.g. `.claude/skills/*`, `.claude/commands/*`, `.codex/skills/*/SKILL.md`) — pure embedded tooling. Drift = the on-disk copy is stale; upstream wins. `apply --force` is the right resolution.
  - **seed** (e.g. `CLAUDE.md`, `AGENTS.md`) — scaffolded once at `init`, then user-owned. Drift is *expected* and should not be flagged after first apply.
  - **managed-merge** (e.g. `.claude/settings.json`, `.mcp.json`, `.claude/hooks/*`) — slot-based. AIDA owns specific blocks (its hook entries, its MCP server entry); user owns the rest. Upgrade should patch only AIDA-owned slots and leave user content untouched.

  Without these categories, users hitting drift have only two options today: live with the warning forever, or `apply --force` and lose customizations. There is no `scaffold upgrade` subcommand at all — `apply` skips existing files and the only diff surface is the draft FR-195 HTML report.

  Children:
  - `aida scaffold diff [<file>]` — text-mode unified diff (CLI-friendly counterpart to FR-195's HTML)
  - `aida scaffold upgrade` subcommand — merge strategies (--force, --3way, --detach)
  - Spike: file categorization design — what category each file belongs to, how to declare it in the scaffold manifest, semantics per category

  Originating context: ~/ai/paradox showed 4 modified files (`CLAUDE.md`, two hook scripts, `settings.json`) — one in each category — exposing all three failure modes at once.
