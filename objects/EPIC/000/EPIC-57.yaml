decision_request:
  question: The multi-vendor bake-off (aida zen --compete, N agents same spec, judge picks winner) is a premium N-times-cost flagship; STORY-722 scopes a 2-agent version. How much do we commit now?
  choices:
  - label: Approve+queue the full N-agent EPIC now
    consequence: flagship demo, but large build and Nx run cost mid-stabilization
    resolution: full
  - label: Ship the 2-agent STORY-722 slice first
    consequence: smaller lift, learn-then-scale, yields routing data
    resolution: slice first
  - label: Defer the whole EPIC
    consequence: no new surface now
    resolution: defer
  recommended: 1
  rationale: The 2-agent slice is the smallest-valuable version that still demonstrates the cross-vendor thesis and yields dispatch-policy data; scale to N only once it pays off.
