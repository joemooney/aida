title: Multi-user / multi-clone test coverage
description: 'Enumerate, document, and test how AIDA behaves when multiple users/clones share one aida-store. Phase 1: same-host clones (catalog delivered: docs/testing/multi-user-test-cases.md). Phase 2: multi-host / multi-OS-user. Phase 3: multi-repo to one store (see SPIKE-62). The catalog grounds every case in code (file:symbol) and classifies works / works-untested / accepted-limitation / gap. Headline finding: cross-clone COORDINATION is the weak axis — leases + drain/solo locks are per-clone-local, so two clones can double-lease and double-drain the same spec with no shared safety. Children: the same-host harness, lifting untested two-clone flows into automated tests, and disposition of the coordination gaps (MU-504/505/506) + history union-merge (MU-204).'
