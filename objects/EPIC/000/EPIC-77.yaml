title: 'Regenerability: make the store sufficient to regenerate a system, and measure it (evidence from the aida-host pilot)'
description: |
  Help a project's AIDA store hold enough of a system's meaning that an agent with no code, tests, docs or git history could regenerate an equivalent system, and let projects measure how close they are.

  Origin: the aida-host pilot (EPIC-20 in /home/joe/ai/aida-host), started 2026-10-11 at Joe's direction. It ran pre-registered regeneration trials against a held-out oracle (13 conditions x 3 scoring runs, all agents claude-opus-5-5 on Claude Code 2.1.296).

  What the pilot found (docs/regeneration/results-2026-10-11.md, commit f2b8d2d):
  - From the curated store, a blind agent rebuilt the system to 93.9-95.5% of discriminating checks (3 replicates).
  - Interface contracts carry most of the meaning: without the 3 contract rows the score drops to 22.7%. The store as it was before regenerability work scored 11.4%.
  - A spec distilled from the transcript with AfterVibe's Prompt A.1 (Meta, arXiv 2607.09900) scored 97.7% at a third of the size and about a fifth of the agent cost. So capture-from-trajectory complements curation.
  - Raw pass rates mislead: 36% of the oracle passes on a do-nothing stub.
  - Every new rebuild independently fixed the same latent bug in the original (aida-host BUG-45), so trials double as design review.

  Children cover 26 of the pilot's 27 feedback items (F1-F27). F22, the filed_at harness mislabel, was already fixed as BUG-1920.
