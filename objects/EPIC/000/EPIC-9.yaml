spec_id: EPIC-9
title: 'Build banner: build time + git SHA + dirty flag in --version'
description: |-
  Every aida build stamps three values via build.rs:
  - AIDA_BUILD_UNIX_TIME — epoch seconds at compile time
  - AIDA_BUILD_GIT_SHA — short SHA at build (or \"unknown\" when not in git)
  - AIDA_BUILD_GIT_DIRTY — \"1\" if working tree was dirty at build, else \"0\"

  Formatted at runtime as: \"0.4.0 (built 2026-05-03T07:24:26Z, sha 866b050+dirty)\"

  ## Surfaced in

  - aida --version — full banner
  - aida status (AIDA dev context section) — \"Running binary: <banner>\"
  - aida upgrade — banner per detected sibling install + filesystem mtime as universal fallback

  ## Why

  Distinguishes two binaries that share a release version number but were compiled at different times — e.g. dev rebuild after a fix vs the released tarball. Without this, sibling-scan can't tell which install is freshest when versions match.

  File mtime in the upgrade listing covers binaries built before this stamping was added (they only emit the bare version string).

  ## Build script behavior

  - rerun-if-changed=../.git/HEAD and ../.git/index keeps SHA/dirty flag accurate without forcing rebuild on every source-file edit
  - Pristine cached builds stay cached
