title: 'Identity UX: auto-acquire on init, string node ids, per-user preferences'
description: |
  Three changes that together make node identity feel like a personal touch instead of CAS-loop bookkeeping. Discussed in the 2026-05-09 walkthrough strategy thread.

  ## Stories

  1. **`aida init` auto-acquires** — the fresh-init path implicitly assumes node 1 today (no nodes.toml entry). Make it explicit: init runs `node acquire` inline so nodes.toml has the entry from day one. No new prompt; uses the same defaults the post-clone path uses.

  2. **Node id is `String` not `u32`** — `FR-JM-052` reads better than `FR-2-052` for unfreshly-merge-gated work. `aida node list` becomes instantly meaningful (you know which row is *you*). Backwards-compat: numeric ids continue to work (`"1"` is a valid string). Touches `nodes.toml`, `blocks.yaml`, dispenser, merge-gate.

  3. **`~/.aida/preferences.toml` for preferred id + email defaults** — analogous to `git config --global user.email`. New user format:

         [identity]
         preferred_node_id = "JM"
         email = "joe.mooney@gmail.com"

     `aida init` and `aida node acquire` read this first, attempt the preferred id, fall back to numeric next-id if unavailable. The "your initials travel with you" UX.

  ## Acceptance

  - `aida init` always emits a `nodes.toml` entry for the current clone
  - Node ids accept `[A-Za-z][A-Za-z0-9_-]*` (alphanumeric + dash/underscore, must start with letter)
  - A user with `preferred_node_id = "JM"` in prefs gets it on init when free
  - Two clones on the same host with the same preferred id: first wins, second falls back with a clear message
  - `aida node list` shows the string ids verbatim
  - Merge-gate still produces short global ids (FR-15) — node-id strings only appear in the node-aware form

  ## Out of scope

  - Migrating existing `nodes.toml` entries to string form. Numeric stays valid.
